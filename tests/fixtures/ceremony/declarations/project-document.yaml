schemaVersion: delivery.ceremony.declarations.v1
ceremonies:
  - id: project-daily-audit
    title: Project daily audit
    tiers: [full, lite]
    triggers:
      - kind: schedule
        cadence: daily
        at: "05:30"
    inputs:
      - source: audit-ledger
      - source: queue-state
        window: true
    agenda:
      - id: collect
        steps:
          - kind: collect
            inputs: [audit-ledger, queue-state]
            outputs:
              - slot: ceremony-artifact
                schema: delivery.ceremony.audit.v1
            verify: artifact-conforms
      - id: record
        steps:
          - kind: record
            outputs:
              - slot: state-record
                schema: delivery.ceremony.audit-record.v1
            verify: artifact-conforms
    scopeKey:
      kind: repository
    catchUp:
      mode: once
      maxMissedWindows: 1
    compaction:
      atPhases: [0]
      maxBytes: 4096
      maxLines: 40
