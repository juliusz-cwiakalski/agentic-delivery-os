# Example of the handovers: tool-drafted from events, confirmed by the coder.
#
# The tool drafts the four coder fields from the events of the phase (steps
# done, files changed, gate results) and writes the fifth field itself. The
# coder keeps, by judgment, only what the next phase needs and what is not
# already in the contract. Three bullets per field are the skeleton of the
# draft, not a quota. Timings and evidence bodies do not travel in a handover:
# evidence is a reference, a summary line, and nothing more.
#
# Lines that start with # are documentation for this example. A file the tool
# emits carries no comment.
