- id: MET-FALSE-SIGNAL-INCIDENTS
  name: False-signal incidents
  status: MEASURED
  measurement_kind: curated_count
  definition: Count of distinct committed-record incidents where a delivery signal contradicted reality, curated from committed pm-notes and evidence artifacts over the spine-included changes.
  formula: 'count of curated incident rows; report total and per class. Classes: local-green-ci-red, false-success-exit-zero, skipped-read-as-green, green-gate-later-failed, lying-liveness.'
  unit: count
  window: per change within the baseline window
  sources:
  - pm-notes-corpus
  - evidence-corpus
