metrics:
- id: MET-CEREMONY-SHARE
  name: Ceremony share
  status: PARTIAL
  measurement_kind: duration_ratio_proxy
  definition: Share of recorded lifecycle phase time spent in ceremony phases (clarify_scope, specification, test_planning, delivery_planning, dor_check, dod_check, pr_creation) rather than work phases (delivery, system_spec_update, review_fix, quality_gates) over the spine-included changes in the baseline window.
  formula: sum(ceremony_duration_h) / sum(total_phase_duration_h) over the ceremony sample (metric_included = spine_included); each change duration is the sum of its included phase-pair hours, recorded once at 1 decimal; overlapping phases count in both numerator and denominator.
  unit: ratio
  window: per change within the baseline window; aggregate over the ceremony sample
  sources:
  - pm-notes-corpus
  sample:
    spine_rows: 41
    spine_included: 23
    spine_excluded: 18
    metric_included: 23
    metric_excluded: 0
    phase_pairs_included: 240
    phase_pairs_excluded: 13
    date_only_pairs_excluded: 0
    excluded_unobserved: 0
  metric_excluded_changes: []
  numerator: 204.3
  denominator: 502.4
  value: 0.406648
  aggregates:
    median_h: null
    min_h: null
    max_h: null
    p90_h: null
  limitation: 'Duration share, not wall-clock union: overlapping phases count in both numerator and denominator. pm-notes timestamps are self-reported and may carry clock skew. The corpus contains 1 unparseable_yaml change and 6 placeholder_zero_time changes, so this time metric is PARTIAL and reports the excluded counts.'
  direction: lower is better
  comparison_note: Compare with the same metric ID and definition over an equal-length window; a definition change allocates a new MET- ID and records a supersession note.
- id: MET-CYCLE-TIME
  name: Cycle time
  status: PARTIAL
  measurement_kind: duration_proxy
  definition: Elapsed time from the first lifecycle phase start (clarify_scope.started) to PR creation completion for one change, over spine-included changes with a usable non-placeholder clarify_scope.started.
  formula: 'pr_creation.completed - clarify_scope.started in hours at 1 decimal; when pr_creation.completed is absent, use the latest completed phase and set cycle_time_censored: true. Report n (= metric_included), median, min, max; p90 by nearest-rank ceil(0.9*n)-th smallest (no interpolation) only when n >= 10.'
  unit: hours
  window: per change whose clarify_scope.started falls in the baseline window
  sources:
  - pm-notes-corpus
  sample:
    spine_rows: 41
    spine_included: 23
    spine_excluded: 18
    metric_included: 20
    metric_excluded: 3
    phase_pairs_included: 210
    phase_pairs_excluded: 10
    date_only_pairs_excluded: 0
    excluded_unobserved: 0
  metric_excluded_changes:
  - ref: GH-177
    reason: missing_metric_input
  - ref: GH-185
    reason: missing_metric_input
  - ref: GH-188
    reason: missing_metric_input
  numerator: null
  denominator: null
  value: 5.3
  aggregates:
    median_h: 5.3
    min_h: 0.2
    max_h: 88.9
    p90_h: 18.4
  limitation: Self-reported timestamps; clock skew is possible; measures elapsed time, not effort. 1 right-censored sample (GH-142) uses the latest completed phase. 3 spine-included changes lack a usable clarify_scope.started and are listed in metric_excluded_changes as missing_metric_input. p90 is nearest-rank with no interpolation. The corpus contains 1 unparseable_yaml change and 6 placeholder_zero_time changes, so this time metric is PARTIAL.
  direction: lower is better
  comparison_note: Compare with the same metric ID and definition over an equal-length window; p90 uses nearest-rank; a definition change allocates a new MET- ID.
