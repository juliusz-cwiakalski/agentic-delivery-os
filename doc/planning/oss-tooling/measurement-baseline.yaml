  denominator: null
  value: 4
  aggregates:
    median_h: null
    min_h: null
    max_h: null
    p90_h: null
    local-green-ci-red: 4
    false-success-exit-zero: 0
    skipped-read-as-green: 0
    green-gate-later-failed: 0
    lying-liveness: 0
    by_class:
      local-green-ci-red: 4
      false-success-exit-zero: 0
      skipped-read-as-green: 0
      green-gate-later-failed: 0
      lying-liveness: 0
  limitation: Curated from committed prose, not a signal ledger; unrecorded incidents are invisible; the count is a floor, not a census. GH-179 corpus-vs-rule defect is excluded because it is not a delivery-signal lie. Only incidents with an artifact and an anchor are counted.
  direction: lower is better
  comparison_note: Compare with the same metric ID and definition over an equal-length window; the curated-floor caveat travels with the number.
comparison_protocol: Later milestones compare against the same metric ID and definition over a window of equal length. A definition change allocates a new MET- ID and records a supersession note rather than mutating the baseline. Committed baseline values are immutable; a new baseline is appended, not edited. Comparisons state the metric ID and definition version so a proxy is never compared to a native measurement without that caveat. Ratio metrics store a 0-1 value and derive any percent form; p90_h uses nearest-rank ceil(0.9*n)-th smallest with no interpolation; the top-level change field is the DM-2 mapping {ref, tracker, excluded_from_samples}.
