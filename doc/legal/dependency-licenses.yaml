# Dependency license registry — direct external uses and locked runtime closure.
# Each use identifies its manifest or locked parent, dependency field and exact
# resolved version. Runtime-transitive rows are enforced from the lock graph.
# The C-2 license determination is confirmed by the owner at PR review; entries
# below are the proposed approved verdicts the audit enforces from the first
# dependency onward (DEC-10 / OQ-1).
#
# Policy:
# - Unregistered dependencies and unknown licenses fail closed.
# - NOASSERTION and SEE LICENSE are never accepted.
# - Every branch of a compound SPDX expression is evaluated individually.
# - The deny list wins over the allow list; allow/deny overlap is a policy failure.
# - The allow list contains only identifiers backed by approved verdicts.
schema_version: 3
scope: direct-and-runtime-closure
c2_determination: proposed at delivery; confirmed by the owner at PR review
deny_list:
  - SSPL-1.0
  - BUSL-1.0
  - BUSL-1.1
  - Elastic-2.0
  - Commons-Clause
  - CC-BY-NC-1.0
  - CC-BY-NC-2.0
  - CC-BY-NC-2.5
  - CC-BY-NC-3.0
  - CC-BY-NC-4.0
  - CC-BY-NC-SA-1.0
  - CC-BY-NC-SA-2.0
  - CC-BY-NC-SA-2.5
  - CC-BY-NC-SA-3.0
  - CC-BY-NC-SA-4.0
  - CC-BY-NC-ND-1.0
  - CC-BY-NC-ND-2.0
  - CC-BY-NC-ND-2.5
  - CC-BY-NC-ND-3.0
  - CC-BY-NC-ND-4.0
entries:
  - package: "@arethetypeswrong/cli"
    version: "0.18.5"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "0.18.5"}]
    verdict: approved
  - package: "@biomejs/biome"
    version: "2.6.4"
    license: "MIT OR Apache-2.0"
    uses: [{owner: package.json, field: devDependencies, version: "2.6.4"}]
    verdict: approved
  - package: "@changesets/cli"
    version: "3.0.3"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "3.0.3"}]
    verdict: approved
  - package: "@commitlint/cli"
    version: "21.2.4"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "21.2.4"}]
    verdict: approved
  - package: "@commitlint/config-conventional"
    version: "21.2.4"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "21.2.4"}]
    verdict: approved
  - package: "@types/bun"
    version: "1.4.4"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "1.4.4"}]
    verdict: approved
  - package: dependency-cruiser
    version: "18.7.0"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "18.7.0"}]
    verdict: approved
  - package: husky
    version: "9.1.7"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "9.1.7"}]
    verdict: approved
  - package: publint
    version: "0.3.25"
    license: "MIT"
    uses: [{owner: package.json, field: devDependencies, version: "0.3.25"}]
    verdict: approved
  - package: typescript
    version: "6.0.3"
    license: "Apache-2.0"
    uses: [{owner: package.json, field: devDependencies, version: "6.0.3"}]
    verdict: approved
  - package: yaml
    version: "2.9.1"
    license: "ISC"
    uses:
      - {owner: package.json, field: devDependencies, version: "2.9.1"}
      - {owner: packages/adapters/package.json, field: dependencies, version: "2.9.1"}
      - {owner: "@changesets/parse@1.0.0", field: dependencies, version: "2.9.1"}
      - {owner: "@manypkg/tools@2.1.2", field: dependencies, version: "2.9.1"}
    verdict: approved
  - package: ajv
    version: "8.20.0"
    license: MIT
    uses:
      - {owner: packages/core/package.json, field: dependencies, version: "8.20.0"}
      - {owner: "@commitlint/config-validator@21.2.3", field: dependencies, version: "8.20.0"}
    verdict: approved
  - package: fast-deep-equal
    version: "3.1.3"
    license: MIT
    uses: [{owner: "ajv@8.20.0", field: dependencies, version: "3.1.3"}]
    verdict: approved
  - package: fast-uri
    version: "3.1.9"
    license: BSD-3-Clause
    uses: [{owner: "ajv@8.20.0", field: dependencies, version: "3.1.9"}]
    verdict: approved
  - package: json-schema-traverse
    version: "1.0.0"
