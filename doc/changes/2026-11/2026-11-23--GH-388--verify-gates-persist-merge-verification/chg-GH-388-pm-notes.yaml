  - text: "RESOLVED — intake identity-seam briefing corrected by code truth (spec
      Appendix A): the briefed battery-vs-merge-applicable identity mismatch
      does not exist. Both record producers resolve their gate set through the
      one shared resolver and carry the schema version plus the FULL declared
      (or shipped-default) entry-id sequence as the identity; surface
      projections (batteryEntries/mergeEntries) select evaluated entries and
      verdict payload only, never identity. Under the shipped default the
      identities are exactly equal, so option A needs zero new tolerance and
      cannot flip state-unverified into gates-stale. The REAL latent seam: the
      production verify-gates composition resolves only the shipped default set
      while merge resolves declared merge.gates — under a custom declared set
      the envelope fail-closes gates-stale with the set delta. Deferred
      fail-closed to a follow-up (spec OQ-1/RSK-2/DEC-5/NG-9); all ACs are
      declared over the shipped default. Root cause of the observed defect is
      one composition wiring point: the verify-gates handler builds the complete
      record and calls its append seam, but the shipped production composition
      never supplies the seam (default is a documented no-op); merge --dry-run
      wires the identical append, which fully explains the ledger asymmetry."
