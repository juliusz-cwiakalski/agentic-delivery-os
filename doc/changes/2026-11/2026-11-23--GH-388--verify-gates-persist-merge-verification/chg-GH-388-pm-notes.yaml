  - text: "Identity seam for the spec to declare: merge enforces 'the recorded
      gate-set identity equals the effective one' against its merge-applicable
      set (default: ci-green + tracker-freshness), while verify gates records
      the battery identity (5 built-ins). A battery-surface record under naive
      equality refusal would flip state-unverified into gates-stale with a set
      delta. Option A must reconcile the merge read (superset acceptance over
      merge-applicable entries, a projected identity, or equivalent) while
      keeping merge --dry-run's merge-applicable record semantics and the five
      built-in ids reserved. Ticket AC pins the persisted record's identity
      (changeRef + headSha) against the merge read."
