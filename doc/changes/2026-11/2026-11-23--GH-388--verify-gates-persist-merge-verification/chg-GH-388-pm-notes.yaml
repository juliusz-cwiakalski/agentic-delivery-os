decisions:
  - text: "Mechanism choice delegated by the ticket ('choose one, declare it'). PM
      indication: option (A) — verify gates persists the merge.gate-verification
      record it computed and merge consumes it. Drivers: (i) both current-truth
      specs already declare A-shaped truth ('verify gates records the battery
      entries … merge consumes the record'), so A converges runtime to spec;
      (ii) the record is verify gates' own output — a printed-but-unrecorded
      verification is not evidence (ticket's own framing); (iii) it makes the
      merge.state-unverified remediation truthful ('verify gates <ref>' then
      'merge <ref>') without a hidden --dry-run pre-step. Formal declaration of
      A and the identity-reconciliation semantics happens in the spec. Option
      (B) (merge composes when no record exists) rejected: it keeps verify gates
      non-evidencing and doubles the verification composition on the landing
      path."
    date: "2026-11-23"
