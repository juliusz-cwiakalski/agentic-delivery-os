iteration2_disposition:
  - id: N-1
    prior_severity: blocker
    disposition: CLOSED
    evidence: >-
      The instant is resolved PER KIND in one pure helper: artifactInstantOf
      reads answeredAt for a blocker.answer (BLOCKER_ANSWER_RECORD_KIND) and
      recordedAt otherwise (domain/loop-verdict.ts:158,166-178), and
      artifactAdvancedSince compares it to sinceMs, returning true only for
      records genuinely after the baseline and falling back to "advance" only
      when the record carries no usable instant (loop-verdict.ts:181-201). The
      composition delegates verbatim (cli/production.ts:3927-3934), so there is
      no second predicate to drift. The delivered case builds a REAL
      blocker.answer through the delivered appendBlockerAnswer
      (state/blockers.ts:462-486; answerPayload stores answeredAt, not
      recordedAt) and asserts the payload shape, artifactInstantOf reads
      answeredAt, a PRIOR answer yields no advance (stuck reachable), an
      after-baseline answer yields an advance (within-window control), a null
      baseline yields none, and an undatable record yields an advance
      (behaviour/loop-stuck.test.ts:126-200). I independently drove the full
      chain over a real store: appendBlockerAnswer → artifactAdvancedSince false
      → evaluateLoopVerdict "stuck"/"stuck-artifact-evidence", and the
      after-baseline control → "progressing". The prior merge path is already
      closed by the baseline-aware F-1 harness cases (loop-stuck.test.ts:86-124).
      Note: the case titled "a PRIOR blocker answer does not suppress a later
      stuck verdict" asserts at the predicate level, not a full verdict; the
      verdict leg is proven transitively by the production delegation and the
      F-1 harness, which is sufficient. Genuinely closed end to end.
  - id: N-3
    prior_severity: minor
    disposition: CLOSED
    evidence: >-
      factsOfEffect carries liveness "unknown" for the null-start-time join
      (loop-supervisor.ts:606-617,640) and the cycle observes the ESTABLISHMENT
      facts (currentFacts ?? ports.session.read(), loop-supervisor.ts:698), with
      currentFacts set at establish (911-914) and on replacement spawn (871). An
      unknown-liveness session yields liveSession false, so evaluateLoopVerdict
      returns "progressing" before any stuck/kill fold (loop-verdict.ts:83). The
      new case seeds a pid 4242 with a null start time and a live port, runs zero
      traffic past the window, and asserts 0 kills, 0 stuck, 0 restarts,
      live-facts-unknown on status, and 0 spawns (behaviour/loop-instance.test.ts:260-292).
  - id: F-7
    prior_severity: minor
    disposition: CLOSED
    evidence: >-
      The last observed progress is now DURABLE on the loop's own loop.session
      record: progressState is an additive OPTIONAL member (contracts/loop.ts
      LoopSessionRecord), carried by sessionRecordFrom/endedSessionRecord
      (app/loop-session.ts), validated on read to the closed positive|zero|unknown
