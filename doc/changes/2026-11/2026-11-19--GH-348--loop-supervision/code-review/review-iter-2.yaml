positive_observations:
  - "F-1 topology is complete: LoopSupervisorPorts.artifactAdvanced takes `sinceMs: number | null`, the supervisor passes the same instant the window is measured from (baselineAtMs = lastProgressAtMs, seeded at acquisition), and only one call site exists; merge.transaction records are compared by recordedAt and a null baseline reports no advance. Only the blocker.answer instant field is mis-read (N-1)."
  - "F-2: newestLanePerRef is a single delivered selector (not a second rule), used in production before classification; the superseded-active pair reads none; the helper is exported through both barrels and the content-inventory allowance was updated."
  - "F-3: the join result is no longer discarded (factsOfEffect), production joins the durable newest loop.session, a null start time is joined without a 0 probe and without a spawn, and the new cases do not pre-set session.read() alive."
  - "F-4: TC-BATTLE-006 drives the pre-existing GH-347 D1 composed production program; the three invocations return real delivery identities (queue.precondition.unmet, noop-lane-nothing-to-do, merge.state-unverified), the lane evidence is real, and guarded.violations is empty (zero shells)."
  - "F-5: the meta-case executes all nine proven surfaces with surface-specific observations (including kill and no-shell) and a planted off-boundary/empty row fails by name; TC-BATTLE-007 still asserts nine/six in order."
  - "F-6: both D1 re-observation branches assert a concrete binding property; the tautological toBeDefined() is removed."
  - "F-8: progressBoundMs now participates in the positive-progress cause with a kill-safe stale arm; the decision table gained both boundary rows."
  - "No delivered assertion was deleted, inverted, skipped or relaxed. The only removed assertions are (a) the 26-family pins, updated to 27 (metrics stale-pin set gains 26, reference-page-parity learns the M4 root, install comparator tail becomes install-then-loop), and (b) the two defective cases F-4/F-5 explicitly asked to be rewritten. The replaced pick-deliver-merge case drops the stub 'closeout' invocation because AC-F8-4 names only pick/deliver/merge through the real runtime; merge/closeout remain consumed-as-delivered (NG-7)."
  - "The no-shell invariant was EXTENDED, not duplicated: ten loop files joined DISPATCH_FLOW_SURFACE and the planted-reimplementation control and prompt scan remain."
  - "The proof-boundary constant is nine proven / six not-proven in the declared order and matches the published page; the ten §8.5 divergences are unchanged and unaffected by the remediation (grammar, exit projection, durable budget, backoff, resume limitation, bounded log, stop modes, retired hook, config mapping, bounded --lines)."
  - "No real timers, sleeps, network, or child processes in the new suites; the new cases are deterministic and the targeted/pinned/invariant suites are green."

