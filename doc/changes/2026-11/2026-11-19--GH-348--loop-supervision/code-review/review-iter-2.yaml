findings:
  - id: N-1
    severity: blocker
    confidence: high
    category: spec-compliance
    location: "packages/cli/src/production.ts:3926-3946 (contract packages/core/src/contracts/blockers.ts:228-234; state packages/core/src/state/blockers.ts:194-204)"
    issue: >-
      The remediation made artifactAdvanced(sinceMs) baseline-relative, but the
      production predicate reads only payload.recordedAt for both artifact kinds.
      A blocker.answer payload records its instant as answeredAt and has no
      recordedAt, so every blocker-answer record is treated as "undatable"
      and returns true (an advance) regardless of the baseline. The F-5/AC-F5-1
      stuck condition ("no artifact advance since the last observation") is
      therefore never satisfiable in any repository that has ever answered a
      blocker, exactly as it was for merges before the fix. The F-1 behaviour case
      cannot detect this because the loop harness injects advance instants instead
      of driving the production predicate over a real blocker.answer record.
    authorising_clause: "chg-GH-348-spec.md F-5 ('no artifact advance since that observation' over a merge.transaction OR a blocker answer), AC-F5-1, DM-6"
    suggestion: >-
      Read the kind-specific instant: merge.transaction.recordedAt and
      blocker.answer.answeredAt (a small normalizer in the composition). Keep the
      undatable->advance kill-safe fallback only for genuinely malformed records.
      Add a production-composition case that appends a prior blocker.answer (and a
      prior merge.transaction) before the baseline and still reaches a stuck
      verdict after the window, plus a within-window control, by driving the real
      artifactAdvanced predicate rather than the harness constant.
    remediation:
      file: "packages/cli/src/production.ts:3926-3946; add a production-composition case (tests/structure/loop-production-composition.test.ts or loop-stuck.test.ts against the real predicate)"
      change: "Compare the kind-specific timestamp (recordedAt for merge.transaction, answeredAt for blocker.answer) against sinceMs; only true-undatable records fall back to advance; add the prior-blocker-answer stuck case."
    suppressed: false
    published_url: null

  - id: N-2
    severity: minor
    confidence: high
    category: documentation
    location: "doc/changes/2026-11/2026-11-19--GH-348--loop-supervision/chg-GH-348-test-plan.md:49 (verifier tests/checks/doc-conformance.test.ts)"
