summary: |
  Re-reviewed the review-iteration-1 remediation over 2c7b6252..400461dc (and the
  whole range origin/main-tools..HEAD, base f802f71a) against chg-GH-348-spec.md
  v1.4 (41 ACs), test plan r0.6, the ten-phase plan (phase 10 = remediation) and
  the pm-notes. Six of the nine iteration-1 findings are genuinely closed:
  F-2 (newest-lane-per-ref before classification, superseded active reads none),
  F-4 (TC-BATTLE-006 now drives the real composed command runtime over the GH-347
  dispatch-parity fixture and asserts real envelopes), F-5 (nine proven surfaces,
  each with its own observation, planted off-boundary row fails by name), F-6
  (unconditional --agent ceo/--model assertions, tautology removed), F-8
  (progressBoundMs participates: fresh positive progressing, stale positive
  kill-safe unevaluable), F-9 (info, no action). F-3's join/observe and
  null-start-time no-probe/no-spawn are delivered and tested, with one residual
  (N-3). F-7's projection now carries a value but only in-process (carried open,
  minor). The head-line block, however, is NOT closed: production's
  artifactAdvanced() reads payload.recordedAt for BOTH artifact kinds, but a
  blocker.answer payload stores its instant as answeredAt (contracts/blockers.ts,
  state/blockers.ts answerPayload), so every blocker-answer record is
  "undatable" and counts as an advance; any repository that has ever answered a
  blocker still never reaches a stuck verdict (N-1, blocker). The F-1 harness case
  injects instants and therefore cannot catch this. I also confirm (open question)
  that the change test plan claims doc-conformance enforces the page/constant
  boundary equality, which it does not; AC-F8-5 scopes that comparison to a
  documentation-phase check, so the missing permanent suite is acceptable but the
  test-plan claim is false (N-2, minor). Battery, pinned/invariant suites, the doc
  guards and the branch-range commit gate are green; the no-shell invariant is
  extended (not duplicated); the boundary constant is nine/six and matches the
  published page; the ten §8.5 divergences are unchanged and honoured.

