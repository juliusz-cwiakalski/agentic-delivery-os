      compare it with LOOP_PARITY_PROOF_BOUNDARY. The equality was in fact checked
      by a one-off manual comparison recorded in the pm-notes. The claim is false
      even though the page and constant currently agree (nine/six, same order).
    authorising_clause: "chg-GH-348-test-plan.md line 49 (DoR R-03 proof-boundary discipline); chg-GH-348-spec.md AC-F8-5 (the page comparison is a documentation-phase check)"
    suggestion: >-
      AC-F8-5 scopes the page comparison to a documentation-phase check, so a
      permanent delivery suite is not required. Correct the test-plan wording to
      state that phase 7 performs the comparison once (recorded in the pm-notes)
      and that no permanent delivery case reads doc/changes/**; or, if a standing
      guard is wanted, add a documentation-phase check that reads the page's
      boundary table and compares it to LOOP_PARITY_PROOF_BOUNDARY, and say so.
    remediation:
      file: "chg-GH-348-test-plan.md:49 (owner: doc-syncer, with the phase-7 reconciliation note in chg-GH-348-pm-notes.yaml)"
      change: "Rewrite the verifier clause to name the actual phase-7 one-off reconciliation (or add the permanent documentation guard), removing the false doc-conformance claim."
    suppressed: false
    published_url: null

  - id: N-3
    severity: minor
    confidence: medium
    category: correctness
    location: "packages/core/src/app/loop-supervisor.ts:601-611,627-633"
    issue: >-
      factsOfEffect() unconditionally sets liveness: "alive" for every join or
      resume effect, including the new null-start-time active-record arm. The
      current-truth page states that a recorded active session "without a
      verifiable process identity (no pid, or a pid with no platform start time)
      is unknown-liveness (no stuck verdict)". On this arm the supervisor instead
      reports the session live, so cycle() can reach a stuck verdict (and attempt
      a terminate that, for a cross-process join with no in-memory handle,
      becomes a capability-gap kill-failed terminal). The delivered F-3 test only
      exercises the progressing path, so this residual is unobserved.
    authorising_clause: "chg-GH-348-spec.md F-6 ('joined and observed'), AC-F6-4, AC-F6-5; doc/spec/features/feature-loop-supervision.md §3 (unknown-liveness = no stuck verdict)"
    suggestion: >-
      Carry the unverifiable-identity case as an explicit unknown-liveness fact
      (do not force liveness alive when the join cannot prove identity), or make
      the page wording match the code's actual conservative-join semantics. Add a
      case that drives the null-start-time arm with sourced zero progress past the
      window and asserts it does not produce a stuck/kill.
    remediation:
      file: "packages/core/src/app/loop-supervisor.ts:601-611,627-633 and doc/spec/features/feature-loop-supervision.md §3"
      change: "Model the null-start-time join as unknown-liveness (no stuck verdict), or re-scope the page; add the zero-progress surface case."
    suppressed: false
    published_url: null

  - id: F-7
    severity: minor
    confidence: medium
    category: spec-compliance
    location: "packages/core/src/app/loop-supervisor.ts:401 (projection) and doc/changes/2026-11/2026-11-19--GH-348--loop-supervision/chg-GH-348-spec.md:303 (API-4)"
    issue: >-
      Carried from iteration 1 (partially closed). recordedProgress projects the
      in-memory lastProgressState, which is null in every fresh process; a real
      `loop status` invocation therefore still projects session.progress = null
      even when a verdict or an observation exists. The projection is not sourced
      from any durable record, and API-4 still says "the recorded ... progress
      state" while the current-truth page was reworded to "last observed".
    authorising_clause: "chg-GH-348-spec.md API-4"
    suggestion: >-
      Either source the progress from a durable fact (the newest persisted
      verdict/observation) so a separate-process status can carry it, or re-scope
      API-4 to "last observed by the running supervisor, null in a fresh process"
      and state that the human block has no progress key. Add a status case that
      runs status in a fresh supervisor after a start in another, or record why
      that is out of scope.
    remediation:
      file: "packages/core/src/app/loop-supervisor.ts:401 and chg-GH-348-spec.md:303 (or the current-truth page)"
      change: "Bind session.progress to a durable source, or reconcile API-4 to the in-process last-observed semantics with a fresh-process note."
    suppressed: false
    published_url: null

  - id: N-4
    severity: info
    confidence: high
    category: plan-compliance
    location: "packages/core/src/app/index.ts (plan phase 10 scope.files)"
