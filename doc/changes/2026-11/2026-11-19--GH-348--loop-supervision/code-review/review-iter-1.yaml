      deliver, and merge primitives through the real command runtime over
      fixtures" is not proven.
    authorising_clause: "chg-GH-348-spec.md AC-F8-4, F-8, Appendix C item (b)"
    suggestion: >-
      Drive the scenario through the real composed command runtime (runCli /
      createConfigProgram) over fixtures, with dispatch's nested PM session
