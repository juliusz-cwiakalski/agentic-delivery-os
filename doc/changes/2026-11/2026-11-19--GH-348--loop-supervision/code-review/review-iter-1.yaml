findings:
  - id: F-1
    severity: blocker
    confidence: high
    category: spec-compliance
    location: "packages/cli/src/production.ts:3922 (port packages/core/src/app/loop-supervisor.ts:212,677)"
    issue: >-
      The production artifact-advance signal is "any merge.transaction or
      blocker.answer record exists anywhere in the ledger", and the
      LoopSupervisorPorts.artifactAdvanced signature is `() => boolean` — it has
      no baseline argument, so no implementation can express the declared "no
      artifact advance since the last progress observation". Because the loop's
      verdict returns `progressing` whenever artifactAdvanced is true, a genuinely
      stuck CEO is never detected in any repository that has ever merged or
      answered a blocker, which disables the ticket's headline acceptance ("a
      stuck CEO session is detected and restarted"). The battery cannot catch this
      because the harness injects a constant `artifactAdvanced`.
    authorising_clause: "chg-GH-348-spec.md F-5 ('no artifact advance since that observation'), AC-F5-1, DM-6"
    suggestion: >-
      Thread the observation instant through the signal: change the port to
      `artifactAdvanced: (sinceMs: number | null) => boolean`, pass the
      supervisor's `lastProgressAtMs`/observation time, and in production return
      true only for merge.transaction/blocker.answer records whose recordedAt is
      after `sinceMs`. Add a scenario case that seeds a prior merge record and
      still reaches a stuck verdict after the window.
    remediation:

      file: "packages/core/src/app/loop-supervisor.ts:212,677 and packages/cli/src/production.ts:3922"
      change: "Make artifactAdvanced baseline-aware (accept the last-observation instant and compare record recordedAt), and add the prior-merge scenario case to tests/behaviour/loop-stuck.test.ts."
    suppressed: false
    published_url: null

  - id: F-2
    severity: major
    confidence: high
    category: spec-compliance
    location: "packages/cli/src/production.ts:3888"
    issue: >-
      The production corroborator builds `dispatchLanes` from
      `readDispatchLanes(store).records.map(...)`, and `readDispatchLanes` returns
      every append for every ref (dispatch-ledger.ts:182-202), not the newest per
      ref. The normative evidence-class table is defined over "the newest
      dispatch.lane record for every ref"; a superseded `active` lane whose owner
      pid is (or becomes, via pid reuse) alive contributes D4 `in-progress` and
      vetoes stuck detection indefinitely. The delivered `latestDispatchLaneFor`
      helper exists but is not used.
    authorising_clause: "chg-GH-348-spec.md F-5 evidence-class table D1–D6, DM-6, AC-F5-7"
    suggestion: >-
      Reduce the lane records to the newest per ref (group by `ref`, take the
      last, or reuse `latestDispatchLaneFor`) before classifying, and add a
      corroborator unit row where an older `active` record is superseded by a
      `terminal` record and the reading is `none` (D2), not `in-progress` (D4).
    remediation:

      file: "packages/cli/src/production.ts:3888 and tests/fixtures/loop/facts.ts"
      change: "Select the newest dispatch.lane per ref before mapping to DispatchLaneFact; add a superseded-active row to the corroborator decision table."
    suppressed: false
    published_url: null

  - id: F-3
    severity: major
    confidence: high
    category: spec-compliance
    location: "packages/core/src/app/loop-supervisor.ts:591 (also production.ts:3961,4024; tests/behaviour/loop-instance.test.ts:56,176)"
    issue: >-
      `establishSession` discards the join result and returns the pre-read
      `facts` in both join paths (loop-supervisor.ts:592-594 and 613-615), and the
      production `session.join()` returns the in-memory `recorded` object, which
      is the all-absent initial value on a fresh process and is never seeded from
      the durable `loop.session`. Consequently, after a cross-process
      takeover+join of a recorded live session, every later `cycle()` sees
      `liveness` absent, `liveSession` false, and never observes or can terminate
      the re-found session — contradicting F-6 "is joined and observed". The only
      cases that assert "takeover and join, 0 spawns" pre-set
      `harness.setSessionFacts({liveness:'alive'})` (loop-instance.test.ts:56,
      176), so the recorded-session re-find branch (probe recorded pid + start
      time) is never executed. Additionally, that branch probes with
      `recorded.processStartTimeMs ?? 0` (line 609), so a recorded pid whose start
      time is null probes with 0 and can fall through to a fresh spawn beside a
      live recorded session.
    authorising_clause: "chg-GH-348-spec.md F-6 ('joined and observed'), AC-F6-2, AC-F6-4"
    suggestion: >-
      Seed the established facts from the joined effect (and, in production, from
      the durable newest loop.session record) instead of returning the pre-read
      facts; treat a recorded active session with a pid but null start time as
      unknown-liveness (resume/join, never spawn) rather than probing with 0. Add
      a case that leaves `session.read()` absent and asserts the re-found session
      is observed as live across a cycle and is never duplicated.
    remediation:

      file: "packages/core/src/app/loop-supervisor.ts:591-617 and packages/cli/src/production.ts:3961-4035"
      change: "Return the joined/durable facts from establishSession; do not probe with 0 for a null start time; add a re-find observation case that does not pre-set session.read() alive."
    suppressed: false
    published_url: null

  - id: F-4
    severity: major
    confidence: high
    category: test-quality
    location: "tests/conformance/loop/loop-pick-deliver-merge.test.ts:19 (fixture tests/fixtures/loop/parity/e2e.ts:46)"
