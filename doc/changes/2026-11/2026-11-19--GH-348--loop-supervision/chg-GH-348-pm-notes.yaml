decisions:
  - text: "Scope is the ticket body plus the M4 blueprint (flip-plan F3 row, backlog
      M4-S10, ranking row 4, and the F3 verification bar 'loop
      start/stop/status/log/reset parity; durable stop across restarts; single
      instance; stuck session restarted'). The blueprint is the source the
      ticket cites, so its F3 bar is binding alongside the ticket ACs."
    date: "2026-11-19"
  - text: "PM-decided (autonomous): the `loop` family is added as a NEW command
      family beside the delivered `coordinator` family. `coordinator` stays the
      engine-level supervision surface (start/stop/status/tick over the instance
      lease, restart budget, stuck detection, wake); `loop` is the operator
      surface for the CEO session with the ceo-loop.sh-parity verbs (start,
      stop, status, log, reset). Reusing the coordinator engine is mandatory;
      inventing a second supervisor is out of scope. Rationale: the ticket names
      `start|stop|status|log|reset` (two verbs the coordinator does not have),
      names the engine modules it must compose, and the flip plan lists `jaiship
      loop` as the target command. The duplication risk is recorded for
      @decision-advisor rather than resolved here."
    date: "2026-11-19"
  - text: "Scope boundary: this change does NOT delete or rewrite
      scripts/ceo-loop.sh, and does not re-point agent prompts. The shell entry
      points stay the documented still-executable fallback (AGENTS.md) until F5
      (GH-351, agent prompts on Jaiship primitives) and F6 (GH-352, jaiship-only
      dogfood and thin wrappers). GH-348 delivers the loop surface and its
      evidence; retirement of the shell path is F6."
    date: "2026-11-19"
  - text: "'Spawn the CEO agent through the harness port with policy-resolved
      provider' consumes what is DELIVERED on main-tools: the harness session
      port (`spawn`/`resume`/`liveness`/`listSessions`), the per-spawn
      single-seat binding wrapper `createHarnessProfilePort` (GH-335), and the
      provider engine's chain/profile resolution. Declarative provider policy
      (GH-350, flip stage F2) is NOT a dependency: the flip plan declares F3
      depending on F1 only, and the ticket declares M4-S3a only. No GH-350
      behaviour may be assumed or pre-implemented here."
    date: "2026-11-19"
