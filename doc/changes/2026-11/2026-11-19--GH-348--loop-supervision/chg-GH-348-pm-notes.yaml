notes:
  - text: "Clarify-scope current state (read 2026-11-19 on f802f71a, clean tree):
      `jaiship coordinator start --foreground [--fresh-budget] | stop | status
      [--live] | tick` is already delivered
      (packages/cli/src/commands/coordinator.ts, coordinator-loop.ts,
      packages/cli/src/edge.ts:3866-3890, 5110-5115) and it already carries the
      supervision machinery the ticket asks to reuse: append-only instance lease
      with liveness-first stale takeover (`coordinator.already-running` for a
      second holder), lifecycle join/resume/spawn decision, artifact- evidence
      stuck detection, kill-with-grace over DaemonProcessPort start-time
      identity, a per-epoch restart budget (default 10,
      `coordinator.restart-budget`), ledger-based wake, and the six coordinator
      config keys. The gap is therefore an operator surface plus its
      spawn/log/stop semantics, not a new supervision engine."
    type: info
    date: "2026-11-19"
  - text: "Verified seams for the ticket tasks: (1) no `loop` command exists in
      packages/cli/src/commands/ or in help.ts, so the family, its grammar, its
      reference page and its help entry are all new; (2) the CEO spawn shape
      exists in two places to parity against - `opencode run --agent ceo --title
      ceo-loop-<ts>` fresh and `--session <id>` resume (ceo-loop.sh
      spawn_or_resume_ceo), and the harness port's declared spawn/resume members
      with agent identity; (3) provider resolution is the delivered
      createHarnessProfilePort per-spawn binding over the provider engine
      profile selection (production.ts:1242-1449), not a new resolver; (4)
      single-instance already has an engine home (the coordinator fence fold);
      (5) the durable stop in ceo-loop.sh is a plain file at .ai/local/ceo/stop
      with --reset clearing it, whereas the coordinator carries a
      `stop-requested` record on the lease - the spec must state which model
      makes the stop durable ACROSS RESTARTS, since a lease record is per-holder
      and a file is per-workspace; (6) `log` has no engine counterpart: ceo-loop
      tails tmp/ceo-loop/ceo.log (default 50 lines) and nothing bounds that file
      today; (7) `watchdog` already exists as its own command
      (packages/cli/src/commands/watchdog.ts) and must not be duplicated - the
      loop consumes it or the same predicate."
