  - text: "PM rulings on the four open questions the test plan raised against spec
      v1.0 (reopens `specification`; these are rulings, not new requirements):
      (R1, OQ-1) an absent value renders as the EMPTY string after `=` in the
      status block - `loop_pid=`, `ceo_pid=`, `ceo_session=`, `loop_id=`,
      `ceo_title=`, `budget_epoch=`, `last_restart_reason=`, `last_verdict=`,
      `degraded=` - and the token `none` is removed from API-7. Reason: the
      shell's `--status` prints `key=` for an absent value, and shell parity of
      the six keys is an explicit AC; a fixed key order plus an empty value is
      unambiguous. (R2, OQ-2) the three boolean keys are `loop_running`,
      `ceo_alive`, `stop_signal` (`yes` when a stop is folded); the stop MODE is
      a separate additive key `stop_mode` (`drain`/`immediate`, empty when no
      stop is folded) placed immediately after `stop_signal` in the additive
      tail. (R3, OQ-3) an unconfirmed termination is TERMINAL: one outcome
      record, lease released, `coordinator.session.kill-failed` at exit 2, and
      NO restart - F-6's at-most-one-session invariant outranks F-3's restart
      path, so a possibly-live orphan is never joined by a second session. (R4,
      OQ-4) `status` performs no configuration read inside the command handler;
      the composition supplies the resolved settings (including the budget
      bound) and a configuration acquisition failure falls back to the shipped
      defaults, so AC-F1-5's no-configuration clause is scoped to the handler.
      These four rulings are BINDING for the spec revision and the test-plan
      update."
    type: decision
    date: "2026-11-19"
