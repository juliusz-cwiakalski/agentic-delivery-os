decisions:
  - text: "Scope is the ticket body plus the M4 blueprint (flip-plan F3 row, backlog
      M4-S10, ranking row 4, and the F3 verification bar 'loop
      start/stop/status/log/reset parity; durable stop across restarts; single
      instance; stuck session restarted'). The blueprint is the source the
      ticket cites, so its F3 bar is binding alongside the ticket ACs."
    date: "2026-11-19"
  - text: "PM-decided (autonomous): the `loop` family is added as a NEW command
      family beside the delivered `coordinator` family. `coordinator` stays the
      engine-level supervision surface (start/stop/status/tick over the instance
      lease, restart budget, stuck detection, wake); `loop` is the operator
      surface for the CEO session with the ceo-loop.sh-parity verbs (start,
      stop, status, log, reset). Reusing the coordinator engine is mandatory;
      inventing a second supervisor is out of scope. Rationale: the ticket names
      `start|stop|status|log|reset` (two verbs the coordinator does not have),
      names the engine modules it must compose, and the flip plan lists `jaiship
      loop` as the target command. The duplication risk is recorded for
      @decision-advisor rather than resolved here."
    date: "2026-11-19"
  - text: "Scope boundary: this change does NOT delete or rewrite
      scripts/ceo-loop.sh, and does not re-point agent prompts. The shell entry
      points stay the documented still-executable fallback (AGENTS.md) until F5
      (GH-351, agent prompts on Jaiship primitives) and F6 (GH-352, jaiship-only
      dogfood and thin wrappers). GH-348 delivers the loop surface and its
      evidence; retirement of the shell path is F6."
    date: "2026-11-19"
  - text: "'Spawn the CEO agent through the harness port with policy-resolved
      provider' consumes what is DELIVERED on main-tools: the harness session
      port (`spawn`/`resume`/`liveness`/`listSessions`), the per-spawn
      single-seat binding wrapper `createHarnessProfilePort` (GH-335), and the
      provider engine's chain/profile resolution. Declarative provider policy
      (GH-350, flip stage F2) is NOT a dependency: the flip plan declares F3
      depending on F1 only, and the ticket declares M4-S3a only. No GH-350
      behaviour may be assumed or pre-implemented here."
    date: "2026-11-19"
open_questions: []
blockers: []
notes:
  - text: "Clarify-scope current state (read 2026-11-19 on f802f71a, clean tree):
      `jaiship coordinator start --foreground [--fresh-budget] | stop | status
      [--live] | tick` is already delivered
      (packages/cli/src/commands/coordinator.ts, coordinator-loop.ts,
      packages/cli/src/edge.ts:3866-3890, 5110-5115) and it already carries the
      supervision machinery the ticket asks to reuse: append-only instance lease
      with liveness-first stale takeover (`coordinator.already-running` for a
      second holder), lifecycle join/resume/spawn decision, artifact- evidence
      stuck detection, kill-with-grace over DaemonProcessPort start-time
      identity, a per-epoch restart budget (default 10,
      `coordinator.restart-budget`), ledger-based wake, and the six coordinator
      config keys. The gap is therefore an operator surface plus its
      spawn/log/stop semantics, not a new supervision engine."
    type: info
    date: "2026-11-19"
  - text: "Verified seams for the ticket tasks: (1) no `loop` command exists in
      packages/cli/src/commands/ or in help.ts, so the family, its grammar, its
      reference page and its help entry are all new; (2) the CEO spawn shape
      exists in two places to parity against - `opencode run --agent ceo --title
      ceo-loop-<ts>` fresh and `--session <id>` resume (ceo-loop.sh
      spawn_or_resume_ceo), and the harness port's declared spawn/resume members
      with agent identity; (3) provider resolution is the delivered
      createHarnessProfilePort per-spawn binding over the provider engine
      profile selection (production.ts:1242-1449), not a new resolver; (4)
      single-instance already has an engine home (the coordinator fence fold);
      (5) the durable stop in ceo-loop.sh is a plain file at .ai/local/ceo/stop
      with --reset clearing it, whereas the coordinator carries a
      `stop-requested` record on the lease - the spec must state which model
      makes the stop durable ACROSS RESTARTS, since a lease record is per-holder
      and a file is per-workspace; (6) `log` has no engine counterpart: ceo-loop
      tails tmp/ceo-loop/ceo.log (default 50 lines) and nothing bounds that file
      today; (7) `watchdog` already exists as its own command
      (packages/cli/src/commands/watchdog.ts) and must not be duplicated - the
      loop consumes it or the same predicate."
    type: info
    date: "2026-11-19"
  - text: "Doc-impact risks for phase 7: a new current-truth page is required
      (feature-delivery-loop.md or equivalent) because a new prompt-required
      command family is introduced; feature-coordinator-supervision.md §10
      currently states 'ceo-loop.sh stays byte-unchanged' and §1 says the
      coordinator family 'is its typed replacement', which the new surface must
      reconcile rather than contradict; feature-autonomous-delivery.md (Mode A
      outer loop), feature-resident-daemon.md and
      feature-watchdog-lane-contracts.md are the neighbouring surfaces;
      feature-harness-adapters.md for the CEO spawn identity;
      doc/overview/glossary.md and doc/00-index.md for the new vocabulary. The
      M4 reference page doc/planning/oss-tooling/milestones/m4/commands/loop.md
      does not exist yet and the help-structure check requires a page for every
      prompt-required command."
    type: risk
    date: "2026-11-19"
  - text: "Doc-conformance constraint: help.ts currently routes the coordinator
      family to the M1 reference root. A new `loop` entry must point at an
      existing page (the m4 root helper `pageIn(M4_REFERENCE_ROOT, ...)` is
      already imported for the dispatch operator pages), or `pnpm check:help`
      fails. The reference page carries ados_distribution and the doc-
      distribution guard must stay green."
    type: risk
    date: "2026-11-19"
  - text: "AC evidence risk: the ticket's final AC ('the loop drives a full
      pick-deliver-merge cycle using only jaiship primitives and no shell entry
      point') is an end-to-end claim that cannot be proven by unit tests alone.
      The spec must declare a proof boundary (a deterministic conformance
      scenario over the real composition with the harness and tracker doubled,
      plus the named not-proven live facts), in the manner GH-347 published its
      parity proof boundary. It must also not require GH-349's merge repair:
      `jaiship merge` and `jaiship closeout` are already delivered surfaces."
    type: risk
    date: "2026-11-19"
  - text: "Parity contract to carry into the spec verbatim: feature-autonomous-
      delivery.md INV-DM-3 (a stuck verdict requires NO session traffic AND no
      healthy delivery in progress), INV-DM-5 (liveness is multi-signal
      progress, never process-alive), NFR-5 (the stop/park signal survives a
      loop restart and is not wiped at startup), the single-flight rule, and
      ceo-loop.sh's own exit vocabulary (0 clean stop, 1 max restarts, 2 usage).
      The corroborator problem: ceo-loop.sh reads `deliver-ticket.sh
      --is-delivering` plus the .ai/local/delivery/delivering marker, and
      neither is a target-surface input for a jaiship-only loop. The jaiship
      equivalent must be named by the spec from a DELIVERED source (the
      dispatch.lane / daemon lane records written by GH-347), and the spec must
      say what happens when that read is unavailable - do not port a shell probe
      and do not let an unreadable corroborator alone declare a stuck CEO."
    type: risk
    date: "2026-11-19"
  - text: "Operational prerequisite carried from GH-347: node_modules/.bin carries
      only the umbrella `jaiship`; every primitive invocation is preceded by
      TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH and frequently
      `pnpm build`. Gate commands recorded in this change MUST use
      TMPDIR=$PWD/tmp/tmpdir. Lifecycle commits route through the commit
      primitive; phase state only through the phase family."
    type: info
    date: "2026-11-19"
