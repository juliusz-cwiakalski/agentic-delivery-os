#   the durable reason is the delivered closed token `stuck-artifact-evidence`,
#   the two-signal facts ride the bounded evidence corpus, and an operator must
#   read that corpus (or the loop's `event=restart` log line) to distinguish a
#   loop restart from a coordinator restart; spec v1.3 / R-15's page half);
#   `feature-coordinator-supervision.md` (§1's "its typed replacement" → the
#   delivered family split; the per-identity key-scoping guarantee; keep §10's
#   "`ceo-loop.sh` stays byte-unchanged" true; RECONCILE §3's "No pid on a spawned
#   handle" limitation that DM-3 falsifies — the handle can now carry an optional
#   process id supplied by adapters that can and absent (never fabricated) where
#   they cannot, while the coordinator's own composition still supplies none — and
#   RE-READ §3's other declared limitations (no durable session identity, no
#   total-context source, no sourced progress), confirming each still holds or
#   stating precisely why not; spec v1.3 / R-28);
#   `feature-autonomous-delivery.md` (Mode A's target is `jaiship loop`; INV-DM-3's
#   corroborator has a typed source; NFR-5's durable stop is a ledger record; the
#   shell knob → coordinator key mapping);
#   `feature-resident-daemon.md` (the loop reads `daemon.lane` read-only and
#   writes none; the daemon neither reads nor reconciles the loop's records);
#   `feature-watchdog-lane-contracts.md` (`watchdog` stays check-only and is not
#   the loop's liveness source);
#   `feature-harness-adapters.md` (the additive optional session pid on the handle
#   and the streaming seam, `--agent ceo` plus the seat model, the
#   `ceo-loop-<stamp>` title as a reap identity, the terminate reuse);
#   `feature-config-layer.md` (zero keys added; the six `coordinator.*` keys
#   consumed unchanged);
#   `feature-result-contract.md` (zero new identities/domain kinds; the two new
#   record kinds are not error identities; the reused exhaustion identity's
