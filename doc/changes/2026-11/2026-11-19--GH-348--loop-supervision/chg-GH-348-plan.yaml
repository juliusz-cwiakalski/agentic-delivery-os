# INCREMENTAL VERB SURFACE (binding on every phase; DoR iteration-2 R-22, pm-notes
#   "PM rulings for the DoR-iteration-2 remediation" ruling 1). The `loop` command
#   family is MOUNTED INCREMENTALLY by the phase that first needs it, never
#   wholesale in the phase that finishes it:
#     phase 1  no command module and no verb; contracts, records, domain only.
#     phase 2  MOUNTS the command module with `start --foreground` (the spawn path)
#              and the READ-ONLY `status` verb (the `delivery.loop.v1` projection
#              plus a bounded `key=value` renderer), together with the log sink and
#              its read projection (`delivery.loop.log.v1` and the path resolver).
#              From this boundary every later phase may assert `loop status`
#              without implementing anything new.
#     phase 3  adds no verb; it adds the refusal mapping and the degradation entry
#              the already-mounted `status` projects (`session-pid-unknown`).
#     phase 4  adds no verb; it adds the `degraded` values `status` projects
#              (`progress-unreadable`, `delivery-corroborator-unreadable`,
#              `live-facts-unknown`) and the kill-failed exit.
#     phase 5  adds the `--fresh-budget` flag to the mounted `start` and the
#              exhaustion summary; no new verb.
#     phase 6  adds the `stop` and `reset` verbs (with both stop modes) and the
#              folded-stop success path on `start`.
#     phase 7  owns the FINAL grammar and refusal coverage (including the required
#              `--foreground` and the accepted global flags), the six-shell-key
#              STATUS BLOCK with its goldens, the BOUNDED `log` read (`--lines`
#              1..100, truncation, `unreadable`), the static help entry, the M4
#              reference page, and the prompt-required inventory repin 26 -> 27.
#     phase 8  adds no verb; it proves the assembled family.
#     phase 9  adds no verb; it releases.
#   BEFORE THE REPIN the family is NOT prompt-required (the entrypoint composes
#   exactly the prompt-required set, so `loop` is not advertised and not composed
#   by the production entrypoint) and may be PARTIALLY MOUNTED (`start`, `status`,
#   the log read projection, then `stop`/`reset`). The repin lands LAST, in phase 7,
#   precisely because adding `loop` to the inventory forces the COMPLETE family in
#   the same commit (§16): the entrypoint throws for a prompt-required name the
#   program lacks, so a repin before the grammar, block and bounded read are final
#   would either ship a partial advertised surface or fail to compose.
#   NO PHASE ASSERTS a verb or projection a LATER phase implements. The per-phase
#   "Verb surface at this boundary" line inside each phase block is the auditable
#   statement of this rule; a phase whose gate needs a later verb is a plan defect,
#   not an implementation problem.
