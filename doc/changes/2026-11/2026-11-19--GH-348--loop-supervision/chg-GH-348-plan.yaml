#   `feature-state-layer.md` (spec v1.2 Appendix A / R-05: the ledger's record-kind
#   enumeration and consumer paragraph gain `loop.session` and `loop.stop` with
#   their schemas, keys, latest-wins folds, the loop supervisor as writer/reader,
