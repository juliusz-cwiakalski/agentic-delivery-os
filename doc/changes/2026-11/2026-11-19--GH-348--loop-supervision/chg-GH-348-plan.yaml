#
#   WHY THIS ORDER AND NOT ANOTHER:
#   - Phase 2 must precede phase 3 because a claim only has a session to re-find
#     once the session record exists, and the `pid` fact is the re-find identity;
#     phase 2 also mounts the read-only `status` every later phase asserts.
#   - Phase 3 must precede phase 4 because a stuck verdict requires a LIVE
#     SESSION and a single instance; a verdict path built before the lease and
#     the session resolution would be untestable and would risk the duplicate
#     spawn the verdict path guards against.
#   - Phase 4 must precede phase 5 because "only a stuck restart consumes an
#     ordinal" — the restart policy is downstream of the verdict that triggers it,
#     and STUCK-006's detection-to-next-session bound needs the first backoff
#     step to observe a next session at all. Phase 4 asserts the ADMISSION
#     decision; the record and the second session land in phase 5.
#   - Phase 5 must precede phase 6 because the stop's `immediate` mode terminates
#     the session through the phase-4 terminate path, and the stop's
#     iteration-boundary read only has a cycle to interrupt once the restart
#     policy exists. Phase 5 also carries the restart re-observation that makes
#     the at-most-one-session invariant provable before the stop exists.
#   - Phase 6 must precede phase 7 because `loop start`'s folded-stop refusal and
#     the five-verb grammar are asserted by TC-VERB-001 and TC-STOP-002 together;
#     the family cannot be declared complete — and therefore cannot be repinned —
#     while `stop`/`reset` do not fold.
#   - Phase 7 must precede phase 8 because the battery drives the real command
