  # ---------------------------------------------------------------------------
  # Phase 6 — The durable identity-scoped stop, the clearance, and both stop
  # modes (F-4; DM-2; DEC-2, TDR-0056).
  #
  # Goal: a stop survives a restart, a crash, and a fresh process; only an
  # explicit `reset` clears it; and the two stop modes behave as declared.
  #
  # Contract (API-1, API-2, API-3; AC-F1-4, AC-F4-1..5, NFR-4):
  #   - `loop stop [--mode drain|immediate]` appends EXACTLY ONE `loop.stop`
  #     record for the loop identity with action `requested` and the requested
  #     mode; a repeat appends nothing (idempotent) and still exits 0; it never
  #     signals a session, never touches the lease, and works whether or not a
  #     loop is running. `drain` is the default and the parity mode.
  #   - `loop reset` appends EXACTLY ONE record with action `cleared` when a
  #     request is folded, otherwise nothing; it exits 0 either way.
  #   - The stop names the LOOP IDENTITY, never a process instance: no pid, start
  #     time, or holder participates. A stop recorded by one process is honoured
  #     by any later process.
  #   - `start` FOLDS THE STOP BEFORE CLAIMING the lease: a folded request yields
  #     exit 0 with `state=stopped`, no lease record, no session, no session
  #     record. A torn or unreadable fold FAILS CLOSED — a `state.*` failure at
  #     exit 2 with no lease record and no session — because "unreadable" must
  #     never read as "not stopped".
  #   - A running loop re-reads the fold at every iteration boundary.
  #     `mode=drain` never terminates a session (the loop finishes it, then ends);
  #     `mode=immediate` terminates the held session within
  #     `collection-interval + kill-grace` (<= 50 000 ms) through the phase-4
  #     terminate path, and a session whose process identity cannot be verified is
  #     NEVER signalled — the loop reports `session-pid-unknown` and ends at the
  #     boundary. Both release the lease and exit 0.
  #   - The typed stop and the shell's `.ai/local/ceo/stop` marker are NOT
  #     interchangeable and neither reads the other (§8.5; AC-PARITY-010).
  #
  # Obligations:
  #   6.1 Extend `state/loop.ts` with the folded-stop reader used before the claim
  #       and the idempotent request/clearance transitions (the fold semantics are
  #       phase 1's; this phase supplies the read-before-claim ordering and the
  #       typed unreadable distinction if the phase-1 shape needs it).
  #   6.2 Wire the fold into `app/loop-supervisor.ts`: read before the claim, the
  #       fail-closed branch, the iteration-boundary re-read, and the two modes'
  #       effects (drain = no terminate; immediate = terminate within the bound,
