#   one fails by name.
#
# GATE ENVIRONMENT (binding on every phase boundary and the final battery):
#   - Every command runs from the repository root with BOTH prerequisites:
#     TMPDIR=$PWD/tmp/tmpdir (repo-local, git-ignored; never /tmp or $HOME) and
#     PATH=$PWD/node_modules/.bin:$PATH (the commit primitive probes the bare
#     `commitlint` name; without it every lifecycle commit fails as
#     commit.commitlint-failed).
#   - The typed CLI does not run from an unbuilt workspace. Any `jaiship`
#     invocation (plan validate, lint plan) is preceded by
#     `TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm build`.
#   - TARGETED GATES: the `bun test` / `bun run scripts/checks/*` lines named in
#     each phase, `pnpm typecheck` where a type surface moved, and
#     `git diff --check` before every commit.
#   - THE AGGREGATE `pnpm check` IS PHASE 9'S ALONE among the authoring phases and
#     is never substituted by a narrow pass.
#   - The branch-range commit-message gate
#     (`./scripts/lint-commit-range.sh --base origin/main-tools`) is LIFECYCLE
#     PHASE 9's gate (test plan §7.5), not a delivery-phase gate; its verdict is
#     recorded as a pm-notes `notes:` entry (DOD-3).
