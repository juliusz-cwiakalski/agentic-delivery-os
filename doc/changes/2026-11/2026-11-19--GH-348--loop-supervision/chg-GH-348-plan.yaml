  # ---------------------------------------------------------------------------
  # Phase 3 — Single instance over the delivered lease, the takeover, and the
  # session re-find (F-6; DM-1, DM-3).
  #
  # Goal: two loops cannot both run, and a start after an unclean death re-finds
  # the session it already owns before it considers spawning another.
  #
  # Contract (API-1, API-4; DEC-1, TDR-0055; AC-F6-1..3, AC-F6-5):
  #   - The loop claims the DELIVERED append-only instance lease under the
  #     distinct supervisor identity `loop-main`. A live holder is refused
  #     `coordinator.already-running` at exit 2 with no session record and no
  #     spawn; a dead holder is taken over with EXACTLY ONE record (liveness
  #     first, then the 2 x collection-interval age fallback); an undeclared alive
  #     capability is `coordinator.process.capability-gap` at exit 2 before any
  #     record.
  #   - The identity is deliberately distinct from `coordinator-main`: `loop start`
  #     and `coordinator start --foreground` do not exclude each other, and neither
  #     reads the other's records (the delivered per-identity read skips foreign
  #     keys by construction).
  #   - After a takeover the loop resolves its recorded session BEFORE it
  #     considers spawning: a recorded pid alive with a matching start time is
  #     JOINED and observed (0 spawns); a session recorded `ended` is replaced by
  #     exactly ONE fresh session; a session recorded `active` with no process
  #     identity is unknown-liveness and is RESUMED — exactly one `resume` call
  #     carrying the recorded session id and no title, returning the same session
  #     id — never killed and never duplicated, and `session-pid-unknown` appears
  #     on the degradation list (R-07, AC-F6-5).
  #   - No path spawns a second session beside a recorded live one.
  #
  # Obligations:
  #   3.1 Wire the claim/fold takeover into `app/loop-supervisor.ts` through the
  #       delivered `decideCoordinatorClaim` semantics mounted at the loop
  #       composition's claim; no new fence, no new lock, no pid-file probe.
  #   3.2 Implement the session resolution in `app/loop-session.ts`: the
  #       pid+start-time comparison, join-vs-replace-vs-resume, and the pid-less
  #       unknown-liveness branch that calls `resume` exactly once.
  #   3.3 Map the two refusals and the capability gap in
  #       `packages/cli/src/commands/loop.ts` and supply the declared alive
  #       capability from `production.ts`; keep the exit projection derived from
  #       the delivered table, never a bare digit chosen by the handler.
  #   3.4 Author `tests/behaviour/loop-instance.test.ts` for INSTANCE-001,
  #       INSTANCE-002, INSTANCE-003, INSTANCE-004, INSTANCE-006, INSTANCE-007
  #       and PARITY-001 over the real store fence with the deterministic
  #       two-start interleaving (both orderings; the GH-347 fence latch, no
