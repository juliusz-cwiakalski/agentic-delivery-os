  # Phase 4 — The two-signal stuck verdict, the delivery corroborator, and the
  # identity-verified terminate path (F-5; DM-6; DEC-3, DEC-5).
  #
  # Goal: a stuck CEO is detected by the binding two-signal rule and terminated by
  # the delivered identity-verified path, and an unreadable signal or a healthy
  # delivery can never produce a kill.
  #
  # Contract (API-1, DM-6; AC-F5-1..4, AC-F5-6..7, AC-F6-4; INV-DM-3/5):
  #   - The verdict is the loop's OWN pure rule over three injected fact sets:
  #     sourced progress (the delivered new-turn mapper over a sourced
  #     `token-delta` reading of the recorded session: positive | zero | unknown),
  #     artifact advance (no merge or blocker answer since the baseline), and the
  #     delivery corroborator (in-progress | none | unknown).
  #   - `stuck` requires ALL of: a live session; sourced progress `zero` for at
  #     least `coordinator.stuck-window` (600 000 ms) measured from the last
  #     sourced-progress observation the running supervisor holds; no artifact
  #     advance since that observation; and a READABLE corroborator reporting
  #     NONE. A just-started supervisor seeds that observation at its own session
  #     acquisition or its first reading — never earlier — so a restart can only
  #     delay a verdict.
  #   - `progressing` when sourced progress is positive within
  #     `coordinator.progress-bound` (300 000 ms) or within the window, or when
  #     the corroborator reports a delivery in progress. `unevaluable` when the
  #     progress reading is unknown OR the corroborator is unreadable: nothing is
  #     killed, exactly ONE verdict record lands per expectation, and the loop
  #     continues.
