  #     least `coordinator.stuck-window` (600 000 ms) measured from the last
  #     sourced-progress observation the running supervisor holds; no artifact
  #     advance since that observation; and a READABLE corroborator reporting
  #     NONE. A just-started supervisor seeds that observation at its own session
  #     acquisition or its first reading — never earlier — so a restart can only
  #     delay a verdict.
  #   - `progressing` when sourced progress is positive within
  #     `coordinator.progress-bound` (300 000 ms) or within the window, or when
  #     the corroborator reports a delivery in progress. `unevaluable` when the
  #     progress reading is unknown OR the corroborator is unreadable: nothing is
  #     killed, exactly ONE verdict record lands per expectation, and the loop
  #     continues.
  #   - The corroborator reads ONLY the delivered `dispatch.lane` and
