#   family, durable stop, drain/immediate, sourced progress, delivery
#   corroborator, two-signal verdict, unevaluable, backoff schedule, loop session
#   record, proof boundary);
#   `doc/00-index.md` (index the new current-truth page, the state-layer page and
#   the M4 reference page);
#   `doc/planning/oss-tooling/milestones/m4/{README,flip-plan,backlog}.md`
#   (mark M4-S10 / F3 delivered, keep F5/F6 ownership);
#   `doc/guides/delivery-modes.md` (reconcile any "Mode A is only
#   `scripts/ceo-loop.sh`" statement, keep the troubleshooting guidance valid for
#   both paths); `doc/quality/test-specs/test-spec-loop-supervision.md` (spec v1.2
#   Appendix A / R-14: new enduring coverage map, the loop counterpart of the
#   coordinator test spec).
#   The reconciled pages must cite TDR-0056 and TDR-0057, every new or changed
#   distributable page declares its `ados_distribution` class, and the
#   doc-distribution guard (`bash scripts/.tests/test-doc-distribution.sh`) must
#   stay green (phase 9 owns running it).
#   NOT declared, deliberately: `tests/checks/doc-conformance.test.ts` is
#   LIFECYCLE phase-7 work (it is edited when the page exists, after this change's
#   delivery phases); `doc/planning/oss-tooling/milestones/m4/commands/loop.md` is
#   authored in PHASE 7 as part of the help surface, not reconciled in phase 7 of
#   the lifecycle.
#
# ASSUMPTIONS AND DISCOVERIES (reported, not silently resolved):
#   (a) BOTH decision records are TRACKED. They landed in 400a96ad (with the DoR
#       verdict), the `doc/decisions/00-index.md` rows and the GH-348 binding
#       paragraph were committed earlier at 11608b55, and
#       `git status --porcelain -- doc/decisions` is EMPTY at plan time. Phase 1
#       therefore treats the two paths as VERIFICATION TARGETS, never as authored
#       scope, and declares only `doc/decisions/00-index.md` for CONDITIONAL
#       STAGING — see COMMIT-BOUNDARY REALITY, which is the authoritative
#       statement (R-27).
#   (b) MODULE PATHS ARE PLAN-TIME CONVENTIONS. The spec gives module
#       RESPONSIBILITIES (§16) but no paths, and Appendix D leaves internal shape
#       implementation-decided. The paths below (`contracts/loop.ts`,
#       `state/loop.ts`, `domain/loop-*.ts`, `app/loop-{supervisor,session,
#       corroborator}.ts`, `cli/commands/loop.ts`, `cli/output/loop-text.ts`) are
#       declared so scope is COMPUTABLE; a rename at delivery is a plan revision,
#       never a silent deviation.
#   (c) The test plan names `tests/fixtures/loop/parity/evidence.ts` as the ONLY
#       source of the proof boundary and `parity/cases.ts` as the ONE registry;
#       this plan honours both and adds no second table.
#   (d) `tests/fixtures/loop/harness.ts` must expose a HANDLER-SCOPED
#       configuration double (PM ruling R4 / AC-F1-5): handler reads counted
#       separately from the composition's resolution, and an acquisition failure
#       falls back to the shipped defaults so `status` always composes. It also
#       registers BOTH command families — `loop` AND `coordinator` — because
#       production mounts both and TC-INSTANCE-004 row B runs
#       `coordinator start --foreground` on this harness (R-08).
#   (e) The three nullable `loop.session` fields — `pid`, `processStartTimeMs`,
#       and `title` — are never fabricated (`null`, never `0`); a pid-less
#       `active` session is unknown-liveness and is RESUMED with exactly one
#       `resume` carrying the recorded session id and no title, never killed and
#       never duplicated — AC-F6-5 (R-07).
#   (f) There is no `doc/documentation-profile.md` (engineering-repo default), so
#       no `doc/business/**` area is created or touched.
#   (g) `version_impact: minor` plus publishable-package edits means exactly ONE
#       minor changeset covering the affected packages (phase 9 authors
#       `.changeset/gh-348-loop-supervision-minor.md`).
#   (h) The 120-row mutation register (§7.4, M1–M120) is a REVIEWER/FIXER
#       exercise, not a committed suite; the permanent non-vacuity proofs are the
#       planted controls inside the owning cases. Every row is allocated exactly
#       once to the phase that owns its asserting case (see MUTATION REGISTER
#       ALLOCATION below); the per-phase totals sum to 120.
#   (i) The status block's `loop_id` is the CONSTANT supervisor identity
#       `loop-main`, always present and never empty; `ceo_pid`/`ceo_session` are
#       LIVE-session only and render empty for a non-alive session (shell parity);
#       `budget_epoch` is the persisted epoch and empty when none (R-06).
#   (j) The detection bound is the FORMULA
#       `stuck-window + collection-interval + kill-grace + first backoff`, with
#       652 000 ms only as the shipped-default value; the implementation holds the
#       formula and the case asserts both (R-09).
#   (k) The stuck records carry a loop-scoped `iterationId` of the form
#       `<loopId>:<cycle ordinal>` and a `killFailureReason` only on a failed
#       kill — no third record kind (R-19). The at-bound history reference is
#       `epoch-<n>;restarts=<count>;seq=<the newest restart record's ledger
#       sequence>` (R-20).
#
# MUTATION REGISTER ALLOCATION (§7.4, 120 rows M1–M120, contiguous and allocated
#   exactly once). A row is allocated to the phase that OWNS the case it names;
#   where a row names cases in two phases it is allocated to the LATER boundary
#   (so the row can be exercised exactly as written) and the earlier phase's case
#   is named as its cross-control.
#     phase 1 (1):   M93
#     phase 2 (16):  M15–M17, M19–M24, M27, M68–M73
#     phase 3 (11):  M18, M61–M67, M85, M103, M118
#     phase 4 (25):  M45–M52, M54–M60, M96–M98, M105–M108, M110, M116, M119
#     phase 5 (13):  M28–M36, M53, M109, M112, M117
#     phase 6 (10):  M37–M44, M87, M120
#     phase 7 (26):  M1–M4, M9–M14, M74–M75, M86, M88, M89, M90, M94–M95,
#                    M99–M101, M104, M111, M113–M115
#     phase 8 (18):  M5–M8, M25–M26, M76–M84, M91–M92, M102
#     phase 9 (0)
#   CROSS-CONTROLS (not ownership): the row for a session-record `pid` that its
#   named case TC-INSTANCE-006 also checks re-fails at phase 3; the capability row
#   re-fails at phase 8's closed-surface case. Each row stays allocated once.
#   COUNT: 1+16+11+25+13+10+26+18+0 = 120, every id M1–M120 present exactly once.
#   M53 is owned SOLELY by phase 5 (its named case TC-STUCK-006 is phase 5's), and
#   phase 4's range therefore ends at M52 (N-03). M102 belongs to phase 8 because
#   TC-BATTLE-006 owns the nested `dispatch` deliver leg; M103 to phase 3 because
#   TC-INSTANCE-006 owns the single `resume`; the numbering of the remaining rows
#   follows their named cases. TWO ROWS FOLLOW A NAMED-CASE MOVE (N-05 / revision
#   0.5): the "title carried on a resume" row and the "second state read per
#   cycle" row — the first joins phase 3 because its named case is now
#   TC-INSTANCE-006, the second joins phase 7 because its named case
#   TC-CONTRACT-003 is phase 7's (the row is exercised at the boundary that lands
#   the read-economy case). The five iteration-2 controls
#   follow the phase that implements the behaviour they mutate: M116 (restart
#   admission decision) and M119 (kill-path capability gap) to phase 4, M117 (the
#   delivered `coordinator.restart` record plus the second session) to phase 5,
#   M118 (the claim gate's admitted row) to phase 3, and M120 (immediate-stop
#   session uniqueness) to phase 6. A mutation that stops producing its named
#   failure is a BLOCKING finding; it is never repaired by deleting the row or
#   relaxing the expected failure family.
#
# DELIVERED DEVIATIONS (reported; recorded at the post-delivery plan revision).
#   No phase, AC, TC, or mutation row moves because of this block; it aligns the
#   DECLARATIONS with what the delivery commits actually touched, and records the
#   deviations the delivery agent reported at the phase boundaries.
#
#   D-1 COMMIT SUBJECTS. Every phase commit was created by the bare
#       `jaiship commit GH-348` primitive. The primitive derives its subject from
#       the plan-phase context of the CURRENT LIFECYCLE phase; because the
#       lifecycle `delivery` phase was never started by the delivery agent (the
#       caller owns that boundary) and no `--phase` flag was passed, the
#       plan-phase summary in the COMMIT CONVENTION block above was unreachable,
#       so every subject fell back to the primitive's path template
#       `chore(GH-348): update <path>`. No message was hand-composed, nothing was
#       staged by hand, and `git commit` was never invoked directly. The
#       lifecycle `quality_gates` phase's branch-range gate
#       (`scripts/lint-commit-range.sh`) remains the authority on whether those
#       subjects pass, and the COMMIT CONVENTION summaries stay the intended
#       subjects for any future re-cut. Authorising clause: the commit primitive
#       owns message composition (AGENTS.md, "Lifecycle commits route through the
#       `commit` primitive ... never hand-edit").
#
#   D-2 PINNED-SURFACE SET (see phase 7's obligation 7.9 and phase 9's 9.7). The
#       header's "THREE PINNED HELP-INVENTORY SURFACES + THE M4 PAGE" block names
#       four surfaces; adding a command family AND two additive record kinds
#       forced further closed-surface pins. Each one is DECLARED in the scope of
#       the phase whose commit touched it (phase 7: the family counters and the
#       help/guide surface; phase 9: the additivity, inventory, contract,
#       registry and alias pins). Every one is a PIN UPDATE: no assertion is
#       deleted, renamed, relaxed, reordered, or skipped, every mutation control
#       stays live, and the loop-removal control still fails by name.
#       Authorising clause: spec §8.5 (a pin update, not a relaxation) and
#       DOD-8/DEC-7.
#
#   D-3 FORMATTER-ONLY TOUCHES. The phases' formatter runs (`biome check --write`)
#       normalised whitespace and line wrapping in test files that carry no loop
#       change: phase 7 touched nineteen such files under `tests/checks/`, phase 8
#       five under `tests/conformance/`. They are DECLARED in the scope of the
#       phase that touched them, because the SCOPE DECLARATION RULE follows EDITS,
#       and they are disclosed here as SEMANTICS-FREE: no assertion, fixture
#       value, count, control, or expectation changed, and `git show --stat` shows
#       whitespace-only hunks. Authorising clause: the scope rule itself (declare
#       every path whose content the phase edits).
#
#   D-4 D1 RE-OBSERVATION SURFACE (phase 7's obligation 7.7). The D1 suite proves
#       entrypoint REACHABILITY (the family is dropped by
#       `selectPromptRequiredProgram` before this phase's repin and composed after
#       it) and the DELIVERED pre-session refusal on `start`. The exact
#       `--agent ceo` / `--model` argv stays proven at the D2/adapters surface,
#       because a bare fixture checkout configures no CEO seat and this change
#       adds no provider-profile fixture. Authorising clause: the ENTRYPOINT RULE
#       and the recorded Option B deviation (R-34/R-35) — the D1 half is a
#       labelled re-observation, not a new obligation or a redefinition of D1.
#
#   D-5 STOP-FOLD HOME. The durable-stop fold lives in `domain/loop-status.ts`
#       (one definition, `foldLoopStop`/`isStopFolded`/`foldedStopMode`) rather
#       than `state/loop.ts`, because the app tier may not import the state tier
#       (DEC-2 tier matrix) and the supervisor needs the fold; `state/loop.ts`
#       keeps the record reads/appends and the session fold. Authorising clause:
#       tier/boundary constraint 11 (the DEC-2 matrix) plus the plan's own
#       shared-file rule (a file edited by more than one phase is declared by
#       EVERY phase that touches it); declared by phases 1 and 6.
#
#   D-6 FIXTURE-COMMIT SIGNING (environment, not code). This machine sets
#       `commit.gpgsign=true`, and the synthetic fixture repositories used by
#       `ci-baseline-parity`, `forbidden-literals` (docs-scope lifetime),
#       `TC-BIN-072` and `TC-BIN-084` cannot commit without a signing key for
#       their fixture identity. The final aggregate run therefore used
#       `GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=commit.gpgsign
#       GIT_CONFIG_VALUE_0=false` for those CHILD fixture commits only. No
#       repository, global, or CI configuration is changed by this change, and
#       the same suites pass unchanged wherever signing is available.
#
#   D-7 TWO GATE DEFECTS FIXED IN PHASE 9, both inside declared scope and both in
#       `packages/cli/src/production.ts` (declared by phases 2, 3, 4, 5, 7 and 9).
#       (a) The corroborator mount read a dot-chain (`daemon.latest.state`) that
#       the error-table sync scan classified as an undeclared code; the value is
#       bound to a local first, so the scan sees no code shape.
#       (b) The loop composition resolved the coordinator settings a second time,
#       changing the invalid-override configuration touch count from 2 to 3
#       (TC-BIN-012); one cache per composition now feeds the coordinator and the
#       loop profile. Neither is a behaviour change to a delivered surface: (a) is
#       a binding style, (b) restores the delivered read economy
#       (NFR-11 / AC-F1-5).
#
#   CHANGE-ARTIFACT NOTE. Every phase commit also carries this change folder's
#       pm-notes evidence entry. The folder is declared by phase 9
#       (`scope.folders`), the pm-notes ledger is a change artifact the commit
#       primitive stages by design, and no phase claims it as authored source.
#       Authorising clause: phase 9's folder declaration plus the pm-notes
#       evidence discipline stated in the header.
#
