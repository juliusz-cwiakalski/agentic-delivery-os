phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Contract, record and pure-domain foundation, plus the two
  # decision records (F-1..F-8 declarations; DM-1, DM-2, DM-5, DM-6, DM-7).
  #
  # Goal: declare every closed vocabulary, both record payload types with their
  # state folds, and the whole pure domain tier, with no behaviour wired yet, so
  # each later phase fills one seam and proves it. This phase is first because
  # (i) every later phase consumes one of these declarations, (ii) an additive
  # contract change is the only thing reviewable in isolation, and (iii) TDR-0055
  # and TDR-0056 are the governing records and must be on the branch before the
  # code they govern.
  #
  # Contract (TDR-0055, TDR-0056; spec DM-1, DM-2, DM-5, DM-6, DM-7, DM-8):
  #   - Verb/mode/event/degradation/output vocabularies: exactly five verbs
  #     (`start`, `stop`, `status`, `log`, `reset`), the flag sets per verb, the
  #     `drain` | `immediate` stop modes, the closed eleven-name log event
  #     vocabulary, the closed five-value degradation list
  #     (`session-pid-unknown`, `progress-unreadable`,
  #     `delivery-corroborator-unreadable`, `live-facts-unknown`,
