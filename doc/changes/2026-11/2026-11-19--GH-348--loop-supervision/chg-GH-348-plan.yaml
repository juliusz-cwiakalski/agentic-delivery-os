#   `doc/planning/oss-tooling/milestones/m4/{README,flip-plan,backlog}.md`
#   (mark M4-S10 / F3 delivered, keep F5/F6 ownership);
#   `doc/guides/delivery-modes.md` (reconcile any "Mode A is only
#   `scripts/ceo-loop.sh`" statement, keep the troubleshooting guidance valid for
#   both paths); `doc/quality/test-specs/test-spec-loop-supervision.md` (spec v1.2
#   Appendix A / R-14: new enduring coverage map, the loop counterpart of the
#   coordinator test spec).
#   The reconciled pages must cite TDR-0055 and TDR-0056, every new or changed
#   distributable page declares its `ados_distribution` class, and the
