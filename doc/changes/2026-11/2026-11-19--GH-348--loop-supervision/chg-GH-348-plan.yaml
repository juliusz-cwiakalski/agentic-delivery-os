#   4.  No shell invocation, no script path, no shell probe anywhere in the loop
#       flow; every spawn is a fixed argv with `shell: false` (API-6, NFR-9).
#   5.  Termination is identity-verified only: this session's process tree, or
#       the recorded pid + platform start time, or the exact session id / exact
#       `ceo-loop-<stamp>` title. No name match, no prefix, no pattern (AC-F5-6).
#   6.  An unreadable progress reading or an unreadable corroborator is
#       `unevaluable` and NEVER a kill; an unconfirmed termination is TERMINAL
#       (one outcome record, lease released, exit 2, zero restarts, zero spawns)
#       (PM ruling R3, AC-F5-4, AC-F5-6).
#   7.  No configuration key is added; the six `coordinator.*` keys are consumed
#       with their shipped defaults, and the backoff schedule is declared policy
#       data with an INJECTED delay (DM-5, DM-8, NFR-1).
#   8.  Records, log lines, summaries, and diagnostics are identifier-only: no
#       prompt, transcript, diff, credential, environment value, provider
#       payload, model name, or seat name; evidence corpus <= 512 UTF-8 bytes
#       (NFR-10).
#   9.  The log is bounded observability, not durable truth: line <= 512 B,
#       active <= 1 048 576 B, exactly one retained generation, total
#       <= 2 097 152 B; a log fault never changes a verdict, exit, or record
#       (F-7, NFR-3).
#   10. A delivered assertion is UPDATED only by citing its authorising clause
#       (§8.5, a DEC, or a PM ruling) and NEVER deleted, renamed, relaxed,
#       reordered, or skipped. The delivered coordinator, dispatch, and pinned
#       suites stay green unmodified except the three pinned help-inventory
#       surfaces phase 7 repins.
#   11. Tier/boundary: `packages/core/src/app/**` may not import branding or
#       state (it talks to the store through `#contracts` port types);
#       `domain/**` imports `#contracts` only; `state/**` imports `#contracts`
#       only; `adapters/**` imports the `./contracts` subpath and never the core
#       root; `cli/**` imports no mcp/opencode. A new subpath is not added.
#   12. Every new record kind rides the existing append-only ledger: no state
#       engine, storage-format, or boundary change; `loop.session` and
#       `loop.stop` are ordinary duck-typed records under identity-scoped keys.
