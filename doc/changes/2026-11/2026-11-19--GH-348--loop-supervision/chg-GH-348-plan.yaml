    - "The NFR-5 detection bound is hardcoded to 652 000 ms instead of the formula `stuck-window + collection-interval + kill-grace + first backoff`, or the at-bound history reference loses its `seq` component (PM ruling R-09/R-20, spec v1.2 NFR-5, TC-STUCK-006, TC-BACKOFF-004, M109/M112)"
