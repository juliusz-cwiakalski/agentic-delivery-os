# SEQUENCING (spec §19's outcome order, made concrete). Every phase is
#   independently committable and gate-green at its own boundary; the aggregate
#   `pnpm check` is phase 9's alone among the authoring phases.
#
#   Phase 1  Contract, record and pure-domain foundation: the closed
#            vocabularies, the two record payload types and their state folds,
#            the pure verdict/backoff/log/status/prompt modules, the domain-tier
#            purity proof, and the two decision records.
#   Phase 2  CEO spawn identity and session identity: the additive optional
#            harness `pid`, the deterministic `ceo-loop-<stamp>` title, the
#            delivered per-spawn binding, the `loop.session` record, the bounded
#            operational log sink, and the command/receipt skeleton.
#   Phase 3  Single instance over the delivered lease: the `loop-main` claim, the
#            liveness-first takeover, the session re-find that never duplicates,
#            the distinct-identity non-interference, and the pid-less
#            degradation.
#   Phase 4  The two-signal stuck verdict, the delivered-lane corroborator, and
#            the identity-verified terminate path — the highest-risk surface,
#            placed after the contracts, the lease, the session identity, and
#            the process id it depends on.
#   Phase 5  The bounded restart policy: the declared delay schedule, one ordinal
#            per stuck restart, zero for a clean end, the at-bound exhaustion
#            exit, `--fresh-budget`, and the detection-to-next-session bound.
#   Phase 6  The durable identity-scoped stop: request/clearance, the
#            read-before-claim refusal, the fail-closed unreadable fold, drain vs
#            immediate, and cross-process honouring.
#   Phase 7  The operator surface: the complete five-verb grammar and refusals,
#            the six-shell-key status block, the bounded `log` read, the static
#            help entry, the M4 reference page, and the 26 → 27 inventory repin
#            across the three pinned suites.
#   Phase 8  The conformance battery, the proof-boundary constant and its
#            mutation controls, the extended no-shell surface, the
#            pick-deliver-merge cycle, and the closed-surface invariance and
#            hygiene pins.
#   Phase 9  Release obligations: the single minor changeset, plan
#            validate/lint, the doc-distribution guard, the aggregate gate, and
#            the current-truth pages declared for STAGING ONLY (lifecycle phase 7
#            reconciles them; this plan reconciles none).
#
#   WHY THIS ORDER AND NOT ANOTHER:
#   - Phase 2 must precede phase 3 because a claim only has a session to re-find
#     once the session record exists, and the `pid` fact is the re-find identity.
#   - Phase 3 must precede phase 4 because a stuck verdict requires a LIVE
#     SESSION and a single instance; a verdict path built before the lease and
#     the session resolution would be untestable and would risk the duplicate
#     spawn the verdict path guards against.
#   - Phase 4 must precede phase 5 because "only a stuck restart consumes an
#     ordinal" — the restart policy is downstream of the verdict that triggers it,
#     and STUCK-006's detection-to-next-session bound needs the first backoff
#     step to observe a next session at all.
#   - Phase 5 must precede phase 6 because the stop's `immediate` mode terminates
#     the session through the phase-4 terminate path, and the stop's
#     iteration-boundary read only has a cycle to interrupt once the restart
#     policy exists.
#   - Phase 6 must precede phase 7 because `loop start`'s folded-stop refusal and
#     the five-verb grammar are asserted by TC-VERB-001 and TC-STOP-002 together;
#     the family cannot be declared complete while `stop`/`reset` do not fold.
#   - Phase 7 must precede phase 8 because the battery drives the real command
#     path with the complete grammar and the real composition mounted from the
#     prompt-required inventory; a battery over a partial family would prove a
#     surface that does not ship.
#   - Phase 8 must precede phase 9 because the aggregate gate and the doc guards
#     range over the assembled change.
