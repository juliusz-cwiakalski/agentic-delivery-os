  #   `log [--lines <n>]`, `reset` — with the full grammar/refusal coverage, the
  #   golden status block, and the bounded `log` read. This is the FIRST phase in
  #   which `loop` is prompt-required: until this commit the family is NOT in
  #   `PROMPT_REQUIRED_COMMANDS`, is not composed by the production entrypoint and
  #   may be partially mounted by an earlier phase's edge. The repin lands HERE
  #   and LAST because adding `loop` to the inventory forces the complete family
  #   in the same commit (§16: the entrypoint throws for a prompt-required name the
  #   program lacks), so a repin before the grammar, block and bounded read were
  #   final would ship a partial advertised surface or fail to compose (R-22).
  #
  # Goal: `jaiship loop` is a complete, prompt-required operator family whose five
  # verbs behave as declared, whose status block keeps the shell's six keys
  # verbatim, whose log read is bounded, and whose inventory pins move EXACTLY.
  #
  # Contract (API-1..5, API-7; §8.5 rows 2, 6, 10; PM rulings R1/R2/R4, plus the
  #   DoR rulings R-06, R-18 and R-21):
