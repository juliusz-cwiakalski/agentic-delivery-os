phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Contract, record and pure-domain foundation, with the two
  # decision records verified (F-1..F-8 declarations; DM-1, DM-2, DM-5, DM-6,
  # DM-7).
  #
  # Verb surface at this boundary: NONE. No command module is authored and no verb
  #   is mounted; this phase is contracts, records, state folds and pure domain
  #   only. `loop` is not prompt-required yet and cannot be invoked.
  #
  # Goal: declare every closed vocabulary, both record payload types with their
  # state folds, and the whole pure domain tier, with no behaviour wired yet, so
  # each later phase fills one seam and proves it. This phase is first because
  # (i) every later phase consumes one of these declarations, (ii) an additive
  # contract change is the only thing reviewable in isolation, and (iii) TDR-0056
  # and TDR-0057 are the governing records and must be on the branch before the
  # code they govern.
  #
  # Contract (TDR-0056, TDR-0057; spec DM-1, DM-2, DM-5, DM-6, DM-7, DM-8):
  #   - Verb/mode/event/degradation/output vocabularies: exactly five verbs
  #     (`start`, `stop`, `status`, `log`, `reset`), the flag sets per verb, the
  #     `drain` | `immediate` stop modes, the closed eleven-name log event
  #     vocabulary, the closed five-value degradation list
  #     (`session-pid-unknown`, `progress-unreadable`,
  #     `delivery-corroborator-unreadable`, `live-facts-unknown`,
  #     `log-unavailable`), the human/machine output bounds (32 lines; 65 536
  #     bytes), and the log retention bounds (512 B line, 1 048 576 B active, one
  #     retained generation, 2 097 152 B total, `--lines` 1..100 default 50).
  #   - `loop.session` (DM-1): schema `delivery.loop.session.v1`, key
  #     `loop.sessions:<loopId>`, append-only latest-wins; fields exactly
  #     `schemaId`, `sessionRecordId`, `loopId`, `sessionId`, `harnessKind`,
  #     `pid` (positive integer|null), `processStartTimeMs` (positive
  #     integer|null), `title` (string|null), `state` (`active`|`ended`),
  #     `acquiredAt`, `recordedAt`. One append per acquisition and one per state
  #     change, never one per cycle. No prompt, transcript, credential, provider
  #     payload, model, or seat.
  #   - `loop.stop` (DM-2): schema `delivery.loop.stop.v1`, key
  #     `loop.stops:<loopId>`, append-only latest-wins; fields exactly `schemaId`,
  #     `stopId`, `loopId`, `action` (`requested`|`cleared`), `mode`
  #     (`drain`|`immediate`|null), `recordedAt`. Identity-scoped: no pid, holder,
  #     or instance field.
  #   - The state module's append/read/fold operations for both kinds, over the
  #     EXISTING append-only ledger and its injected store port. No new state
  #     engine, no schema bump, no new key prefix outside these two.
  #   - The pure domain tier, each module a pure function set with injected
  #     facts and no ambient clock/timer/environment/I/O/network:
  #     `loop-verdict.ts` (the two-signal verdict over progress state + artifact
  #     advance + corroborator reading + window/progress bound, vocabulary
  #     `progressing`|`stuck`|`unevaluable`), `loop-backoff.ts`
  #     (`restartDelayMs(n) = min(2 000 * 2^(n-1), 300 000)`, the full 1..10
  #     table, the epoch total bound), `loop-log.ts` (the single-line
  #     ANSI-free identifier-only renderer with whole-pair dropping and the
  #     retention arithmetic), `loop-status.ts` (the `delivery.loop.v1`
  #     projection and the declared key order with three booleans and a bare
  #     `key=` for every absent value), and `loop-prompt.ts` (the declared prompt
  #     as data: the primitives it names, the stop instruction, and zero
  #     script-path literals).
  #   - NO projection is persisted; `delivery.loop.v1` and
  #     `delivery.loop.log.v1` are read-only (DM-4).
  #
  # Obligations:
  #   1.1 Declare the vocabularies, the two record payload types with their key
  #       builders, the output/retention bounds, the backoff policy data, and the
  #       projection types in `contracts/loop.ts`; re-export through
  #       `contracts/index.ts` and the core root.
  #   1.2 Author `state/loop.ts`: append and read for `loop.session` and
  #       `loop.stop`, the latest-wins fold, the folded-stop reader, and the
  #       "unreadable fold is a typed state failure" distinction. Re-export
  #       through `state/index.ts`.
  #   1.3 Author the five pure domain modules and re-export them through
  #       `domain/index.ts`. No store import, no clock, no timer, no environment,
  #       no child process, no network.
  #   1.4 Author `tests/structure/loop-imports.test.ts` and
  #       `tests/checks/loop-mutants.test.ts` with ONLY the phase-1 assertions:
  #       the domain tier's purity (no ambient clock/timer/environment/I/O/network
  #       import or call; a temp-copy planted `setTimeout` in `loop-backoff.ts`
  #       fails by name — M93). Later phases extend these two files with their own
  #       rows; this phase does not.
  #   1.5 VERIFY (do not author) the two decision records: they are already
  #       tracked on this branch (COMMIT-BOUNDARY REALITY), so this phase neither
  #       declares them as scope nor edits them. Conditionally stage the decision
  #       index. Nothing else outside the declared scope.
  #
  # Code areas (concrete):
