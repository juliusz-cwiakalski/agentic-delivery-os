#   p2 → spawn + log(renderer) rows; p3 → + single-instance; p4 → + stuck + kill;
#   p5 → + backoff-budget; p6 → + stop; p7 → + verbs + log read; p8 → + no-shell.
#   The `no-shell` rows MUST NOT call `runAllLoopParityCases()` (recursion): they
#   run the other groups under the guarded runner, call the static
#   `scan(ROOT)`, and scan the production prompt.
#
# PROOF BOUNDARY (spec §25.3/§25.7, NORMATIVE): the machine-checked source is the
#   PERMANENT fixture constant `LOOP_PARITY_PROOF_BOUNDARY` in
#   `tests/fixtures/loop/parity/evidence.ts` — proven (9, in order): `verbs`,
#   `log`, `spawn`, `stuck`, `kill`, `backoff-budget`, `stop`, `single-instance`,
#   `no-shell`; not proven (6, in order): `live-opencode`, `live-provider`,
#   `os-termination`, `real-pick-deliver-merge`, `long-run-loop`,
#   `cross-process-race`. The constant, its two mutation controls (M5/M6, M7 for
#   order, M8 for an off-boundary row) and TC-BATTLE-007 belong to PHASE 8 —
#   the phase that COMPLETES the battery — and never to the release phase. The
#   current-truth page publishes the same list in LIFECYCLE PHASE 7 and no
#   delivery phase asserts page text; a page/constant mismatch is a
#   documentation-phase defect, never a TC-BATTLE-007 failure. No suite reads
#   `doc/changes/**`.
#
# THREE PINNED HELP-INVENTORY SURFACES + THE M4 PAGE — one commit, phase 7
#   (spec v1.2 §8.5, DOD-8, DEC-7; pm-notes "BINDING for delivery_planning").
#   These are PIN UPDATES, not relaxations:
#     1. `packages/cli/src/help/prompt-required-commands.ts`: append `loop` last,
#        26 → 27.
#     2. `tests/checks/install-conformance-mutants.test.ts`: the family comparator
#        keeps its count, missing/undeclared, and tail rules with the NEW expected
#        tail — `install` immediately before `loop`; a removal control that fails
#        by name (`count 26 != 27`, `missing loop`, `tail is not loop`).
#     3. `tests/structure/metrics-mounting.test.ts` + `tests/fixtures/metrics/
#        mounting.ts`: the positional and count assertions move to 27
#        (`metrics` 23, `supervise` 24, `install` 25, `loop` 26) AND the stale-pin
#        scan set `toHaveLength(2[345])` gains 26, so a leftover 26-family pin
#        fails by name (M4).
#     4. `tests/checks/reference-page-parity.test.ts` + `scripts/checks/
#        help-guide-coverage.ts`: the duplicated per-command page mapping learns
#        the M4 root for `loop`, so `loop` resolves to
#        `doc/planning/oss-tooling/milestones/m4/commands/loop.md` and never to a
#        non-existent M1 page (M101).
#     5. `doc/planning/oss-tooling/milestones/m4/commands/loop.md`: the new M4
#        reference page (`--help`/`--version`, the five verbs, the flags, the
#        exits, the status keys, the log bounds, the durable-stop workflow, the
#        §8.5 divergences, and its `ados_distribution` marker).
#   WHY ONE COMMIT: `metrics-mounting` renders root help and counts families,
#   `reference-page-parity` iterates every help entry's see-also target, and
#   `help-guide-coverage` requires a page for every prompt-required command; any
#   split turns one of them red. A relaxation anywhere here is an ESCALATION.
#
# THE ADDITIVE HARNESS `pid` (DM-3) — introduced by phase 2 together with EVERY
#   consumer and EVERY handle-construction site the change makes compile:
#     - `packages/core/src/contracts/harness.ts`: OPTIONAL `pid` on
#       `HarnessSessionHandle` and OPTIONAL `pid` on `HarnessSpawnStream`. Absent
#       stays absent — never fabricated, never `0` — and NO capability name is
#       added.
#     - `packages/adapters/src/host/index.ts`: expose the started child's pid on
#       the stream it returns.
#     - `packages/adapters/src/harness/opencode.ts`: carry that pid onto the
#       handle it constructs (spawn and resume).
#     - `packages/core/src/app/loop-session.ts`: record `pid` and
#       `processStartTimeMs` on `loop.session`, `null` when absent.
#     - EVERY existing handle-construction site stays valid because the member is
#       optional: `tests/fixtures/coordinator/harness.ts` and the delivered
#       coordinator/daemon/dispatch doubles are DELIBERATELY UNCHANGED and are
#       re-run as read-only controls in phase 2 (a compile break there is a
#       finding, not a licence to edit them).
#     - Consumers declared by phase 2: the session record writer, the status
#       projection's `ceo_pid`, and the re-find identity. Phase 3 adds the
#       re-find comparison and the pid-less degradation; phase 4 adds the
#       terminate target selection; phase 6 adds the immediate-mode verification.
#
# THE NO-SHELL INVARIANT IS EXTENDED, NEVER DUPLICATED — phase 8 (test plan
#   §7.2(b), M82/M83/M84). `scripts/checks/no-shell-dispatch.ts` keeps its four
#   rules, its empty allowlist, and its declared-surface design; this change only
#   ADDS FILES to the existing `DISPATCH_FLOW_SURFACE` (the loop app modules, the
#   loop domain modules including `loop-prompt.ts`, the `loop` command module, and
