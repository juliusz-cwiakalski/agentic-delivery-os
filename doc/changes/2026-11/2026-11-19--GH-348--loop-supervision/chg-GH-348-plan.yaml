  #     (newest `dispatch.lane` state, owner-pid presence, owner-liveness result,
  #     newest `daemon.lane` state, daemon-pid presence, store readability) —
  #     `in-progress` when a recorded owner pid is PRESENT and ALIVE (NO start-time
  #     comparison and NO age bound: the delivered `DispatchLaneOwner.startedAt` is
  #     the composition start instant and can never match the platform process
  #     start time — PM ruling R-01), or when the newest `daemon.lane` is
  #     `delivering` with a live recorded pid; `none` ONLY when the store is
  #     readable AND every candidate lane is terminal or its owner is dead AND no
  #     daemon lane is delivering; `unknown` for ANY unreadable input, for a
  #     `delivering` daemon lane with an ABSENT pid, and for an unreadable
  #     liveness source. `unknown` is never `none`, and `none` is never returned
