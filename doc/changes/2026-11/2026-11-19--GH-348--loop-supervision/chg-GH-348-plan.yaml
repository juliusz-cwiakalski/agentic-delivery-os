#   (e) The three nullable `loop.session` fields — `pid`, `processStartTimeMs`,
#       and `title` — are never fabricated (`null`, never `0`); a pid-less
#       `active` session is unknown-liveness and is RESUMED with exactly one
#       `resume` carrying the recorded session id and no title, never killed and
#       never duplicated — AC-F6-5 (R-07).
#   (f) There is no `doc/documentation-profile.md` (engineering-repo default), so
#       no `doc/business/**` area is created or touched.
#   (g) `version_impact: minor` plus publishable-package edits means exactly ONE
#       minor changeset covering the affected packages (phase 9 authors
#       `.changeset/gh-348-loop-supervision-minor.md`).
#   (h) The 115-row mutation register (§7.4, M1–M115) is a REVIEWER/FIXER
#       exercise, not a committed suite; the permanent non-vacuity proofs are the
#       planted controls inside the owning cases. Every row is allocated exactly
#       once to the phase that owns its asserting case (see MUTATION REGISTER
#       ALLOCATION below); the per-phase totals sum to 115.
#   (i) The status block's `loop_id` is the CONSTANT supervisor identity
#       `loop-main`, always present and never empty; `ceo_pid`/`ceo_session` are
#       LIVE-session only and render empty for a non-alive session (shell parity);
#       `budget_epoch` is the persisted epoch and empty when none (R-06).
#   (j) The detection bound is the FORMULA
#       `stuck-window + collection-interval + kill-grace + first backoff`, with
#       652 000 ms only as the shipped-default value; the implementation holds the
#       formula and the case asserts both (R-09).
#   (k) The stuck records carry a loop-scoped `iterationId` of the form
#       `<loopId>:<cycle ordinal>` and a `killFailureReason` only on a failed
#       kill — no third record kind (R-19). The at-bound history reference is
#       `epoch-<n>;restarts=<count>;seq=<the newest restart record's ledger
#       sequence>` (R-20).
#
# MUTATION REGISTER ALLOCATION (§7.4, 115 rows M1–M115, contiguous and allocated
#   exactly once). A row is allocated to the phase that OWNS the case it names;
#   where a row names cases in two phases it is allocated to the LATER boundary
#   (so the row can be exercised exactly as written) and the earlier phase's case
#   is named as its cross-control.
