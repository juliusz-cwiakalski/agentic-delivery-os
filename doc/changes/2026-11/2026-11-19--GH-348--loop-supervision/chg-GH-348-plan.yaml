    - "A parity case re-expresses a scenario instead of consuming its `tests/fixtures/loop/parity/cases.ts` entry, the registry is authored in the battery phase, or a battery file reimplements a lease/budget/kill/backoff seam (AC-F8-1, TC-BATTLE-001/002, M76/M77)"
