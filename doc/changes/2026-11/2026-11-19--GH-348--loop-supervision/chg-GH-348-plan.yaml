  # Phase 7 — The operator surface: the complete five-verb grammar and refusals,
  # the six-shell-key status block, the bounded `log` read, and the help
  # inventory repin (F-1; API-4, API-5, API-7; DEC-6, DEC-7; DOD-8).
  #
  # Goal: `jaiship loop` is a complete, prompt-required operator family whose five
  # verbs behave as declared, whose status block keeps the shell's six keys
  # verbatim, whose log read is bounded, and whose inventory pins move EXACTLY.
  #
  # Contract (API-1..5, API-7; §8.5 rows 2, 6, 10; PM rulings R1/R2/R4, plus the
  #   DoR rulings R-06, R-18 and R-21):
  #   - The five verbs accept exactly their declared flag sets: `start
  #     --foreground [--fresh-budget]`, `stop [--mode drain|immediate]`, `status`,
  #     `log [--lines <n>]`, `reset`. `--foreground` is REQUIRED on `start`: its
  #     absence (with or without `--fresh-budget`) is a grammar refusal, not a
  #     default. The delivered GLOBAL flags `--json`, `--verbose` and `--pretty`
  #     are accepted on EVERY verb and are never grammar refusals (R-21). Any
  #     other subcommand, a missing subcommand, an undeclared verb-specific flag,
  #     a missing required flag, or a malformed `--lines` is refused as
  #     `fallback.invocation` at exit 1 with `result=refused; reason=grammar` and
  #     appends no record (§8.5 row 2: the shell's usage exit 2 becomes 1).
  #   - A foreground run also ends normally when the composition's cycle driver
  #     reports its declared end: that is a declared clean-end cause yielding
  #     `state=stopped` at exit 0 (R-18), never an error and never a test-only
  #     concept.
  #   - `status` human output is a `key=value` block in the DECLARED order: the
  #     six shell names first (`loop_running`, `loop_pid`, `ceo_alive`, `ceo_pid`,
  #     `ceo_session`, `stop_signal`), then `stop_mode`, then `loop_id`,
  #     `ceo_title`, `restarts`, `budget_epoch`, `last_restart_reason`,
  #     `last_verdict`, `degraded`. EXACTLY three keys are boolean
  #     (`loop_running`, `ceo_alive`, `stop_signal`) rendering `yes`/`no` with
  #     `stop_signal=yes` when a stop is folded; `stop_mode` renders `drain` or
  #     `immediate` when folded and is empty otherwise; `restarts` renders
  #     `<n>/<bound>`; and every OTHER absent value renders as the EMPTY STRING
  #     after `=` — never a `none` token (R1/R2).
  #   - STATUS-KEY SOURCES (R-06, spec v1.2's one table): `loop_running`/`loop_pid`
  #     come from the LIVE lease holder only; `ceo_alive` from live session
  #     liveness; `ceo_pid`/`ceo_session` from the LIVE session ONLY and are EMPTY
