  #     facts.
  #   - The `restarts` bound is COMPOSITION-SUPPLIED; the handler reads no
  #     configuration branch (R4), and a configuration acquisition/resolution
  #     failure falls back to the shipped defaults so `status` always composes.
  #   - `status` and `log` append zero records, create no file or directory, make
  #     no network call, apply no session effect, and evaluate no verdict.
  #   - `log [--lines n]` returns the tail (`n` an integer 1..100, default 50) with
  #     the returned line count, total byte count, a truncation flag, and an
  #     `unreadable` marker; a missing or empty log is a success with zero lines
  #     and truncation false; an unreadable file yields zero lines with
  #     `unreadable` true at exit 0 and borrows no failure identity; a read
  #     creates nothing.
  #   - Every verb is ANSI-free and bounded: <= 32 human lines for
  #     start/stop/status/reset, <= 1 + n for `log`, machine `data`
