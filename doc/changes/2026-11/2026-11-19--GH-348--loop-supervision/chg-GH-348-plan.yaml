  # ---------------------------------------------------------------------------
  # Phase 5 — The bounded restart policy, the per-epoch budget, and the
  # exhaustion exit (F-3; DM-5; DEC-4).
  #
  # Verb surface at this boundary: NO new verb. `start --foreground` gains the
  #   `--fresh-budget` flag and the exhaustion summary; `status` (phase 2) keeps
  #   projecting `restarts=<n>/<bound>` and `budget_epoch`. No gate here needs the
  #   `stop`/`reset` verbs (phase 6) or the bounded `log` read (phase 7).
  #
  # Goal: a stuck restart consumes exactly one ordinal, waits the declared delay,
  # starts exactly one new session, and ends at the bound with the delivered
  # identity and the loop's own remediation — with zero real waits in the battery.
  #
  # Contract (API-1, DM-5; AC-F3-1..6, AC-F5-1, AC-F5-5; DoR R-23):
  #   - ONLY a stuck restart consumes an ordinal; a session that ends on its own
  #     consumes none and waits the ordinary `coordinator.collection-interval`
  #     (30 000 ms).
  #   - A below-bound stuck restart appends exactly one `coordinator.restart`
  #     carrying the next contiguous ordinal, the delivered reason
  #     `stuck-artifact-evidence`, and the replaced session identity; then the loop
  #     waits `restartDelayMs(n) = min(2 000 * 2^(n-1), 300 000)` ms where n is the
  #     ordinal just consumed — 2 000, 4 000, 8 000, 16 000, 32 000, 64 000,
  #     128 000, 256 000, 300 000, 300 000 for ordinals 1..10, total
  #     <= 1 110 000 ms — and starts exactly one new session.
  #   - This phase carries the PHASE-5 RE-OBSERVATION of the stuck episode phase 4
  #     detected: TC-BACKOFF-001 row A asserts the delivered `coordinator.restart`
  #     record (ordinal 1, the delivered reason, the replaced session id), exactly
  #     one new `active` session record and exactly one spawn AFTER the outcome
  #     record, with at most one live `active` session at every step. That is the
  #     phase-5 half of the at-most-one-session invariant and the LAST observation
  #     of AC-F5-1 (DoR R-23).
  #   - The wait is CANCELLABLE: a durable stop or a signal ends it immediately
  #     without applying the session effect.
  #   - At/above the bound (`coordinator.restart-budget`, default 10) no restart
  #     record is appended and no session starts; the loop releases the lease,
  #     logs `event=budget-exhausted`, and exits 1 on the delivered
  #     `coordinator.restart-budget-exhausted` with a bounded summary naming the
  #     HISTORY REFERENCE `epoch-<n>;restarts=<count>;seq=<the newest restart
  #     record's ledger sequence>`, `restarts=<n>/<bound>`, and the LOOP's
  #     remediation (`loop start --foreground --fresh-budget`) — R-20.
  #   - `--fresh-budget` opens the next epoch: count 0, the previous epoch's
  #     records remain readable, and the epoch is durable across a subsequent
  #     status and start.
  #   - Detection-to-next-session is bounded by the FORMULA
  #     `coordinator.stuck-window + coordinator.collection-interval +
  #     coordinator.kill-grace + restartDelayMs(1)`; at the shipped defaults that
  #     is 600 000 + 30 000 + 20 000 + 2 000 = 652 000 ms of virtual time on the
  #     confirmed path. The implementation holds the FORMULA (a coarser configured
  #     interval widens the bound; 652 000 ms is the shipped-default VALUE, never a
  #     literal) — R-09. An unconfirmed termination has no next session (phase 4's
