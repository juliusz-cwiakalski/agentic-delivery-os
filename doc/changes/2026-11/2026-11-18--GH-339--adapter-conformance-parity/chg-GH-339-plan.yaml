# SCOPE DECLARATION RULE (binding on every phase, inherited from GH-338):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   regression control (the TC-FLOOR-* read-only controls, the delivered coverage
#   and surface pins, `.github/workflows/**`, `scripts/checks/ci-topology.ts`,
#   `tests/checks/{ci-checks,conformance-workflow}.test.ts`) is NOT declared:
#   declaring it would only produce an advisory `plan diff`
#   `undeclared-missing` for a file that needs no edit. Every file the test plan
#   names as an assertion site to CREATE or EXTEND — including, now, the three
#   provider trap suites the catalog append OBLIGES (see the append-only rule
#   below) — is declared by the phase that owns that half of the case.
#   ONE DECLARED EXCEPTION, stated so the rule and the declaration do not
#   contradict: `doc/decisions/00-index.md` in phase 1 is a CONDITIONAL-STAGING
#   declaration. It is clean at plan time, it may be touched (a status row or a
#   typo) while the four TDRs it indexes land, and it is declared for that
#   conditional touch only. It is never a licence to edit an unrelated row, and
#   the DoD check confirms the index state either way.
#   A PIN THAT GOVERNS AN EDITED SUITE IS DECLARED AT EVERY TOUCH POINT:
#   `tests/fixtures/pins/trap-names.json` and its digest
#   `tests/fixtures/pins/trap-names.sha256` are authored in phase 1 and declared
#   again in phase 3, because phase 3 edits the three suites the pin governs and
#   must prove the delivered names were not disturbed. The phase-3 declaration is a
#   READ-PINNED declaration (neither file is edited there); they are declared so the
#   governing relationship is explicit where the risk lives, and it can produce at
#   most an advisory `plan diff` `undeclared-missing`.
#
# TRAP-CATALOG APPEND-ONLY RULE (binding on phases 1 and 3; a DoR finding):
#   Appending a four-field catalog entry is NOT a data-only edit. The delivered
#   `runTrapCatalog` records `${trapName}: no assertion registered` for any entry
#   with no assertion, and each provider suite asserts BOTH an empty failure list
#   AND an exact ordered trap-name array. So every appended entry obliges an
#   APPEND-ONLY edit to `tests/behaviour/providers/{github,gitlab,jira}-trap.test.ts`:
#   a NEW assertion for each appended entry, and the exact ordered name array
#   EXTENDED by exactly the appended names with the delivered names a preserved
#   PREFIX. No delivered assertion may be removed, renamed, relaxed, or
#   reordered; a fixture correction in phase 3 may amend an APPROVED appended
#   entry's assertion and must never touch a delivered one. TC-FLOOR-001 asserts
#   the prefix property, so a silent reorder or drop fails by name. Neither the
#   plan nor any phase may describe these three suites as read-only or unedited.
#   THE PREFIX NEEDS A FROZEN BASELINE, AND IT IS A COMMITTED PIN PAIR:
#   `tests/fixtures/pins/trap-names.json` holds one ordered name array per
#   provider, captured from the DELIVERED suites BEFORE any append, committed in
#   the same phase that appends (phase 1), and NEVER REGENERATED in this change.
#   `tests/fixtures/pins/trap-names.sha256` is its companion ANTI-REGENERATION
#   DIGEST: the SHA-256 of the pin file's exact bytes, computed ONCE from the
#   authored baseline in the same step of phase 1 and never regenerated either.
#   The pair is a tree-invariant golden, not a base-ref comparison (which
#   `.ai/rules/testing-strategy.md` forbids). TC-FLOOR-001 asserts each post-append
#   array STARTS WITH the pinned array, that the added suffix equals exactly the
#   appended catalog names, that the pin's bytes are unchanged, and that the
#   recomputed digest equals the committed one — so editing the pin to match a
#   broken suite requires editing the digest too, which review sees, and a
#   regenerated or mismatched digest fails naming BOTH files. Phases 1 and 3
#   declare both; phase 2 may read them but authors nothing there.
#
