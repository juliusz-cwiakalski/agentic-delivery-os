  #       TAX-012 (catalog↔family wiring bidirectional OVER THE FAMILY-WIRED
  #       SUBSET with a non-empty-subset assertion, reusing the delivered
  #       `loadCatalogs`/`validateCatalogs` read-only; four-field shape, resolving
  #       fixture references, no orphan, no double-wiring).
  #   3.3 Extend `tests/conformance/tracker-taxonomy.test.ts` with TAX-003..008:
  #       the `auth-shape` stimulus (401 and, separately, 403) per declared
  #       posture; the transport stimulus with `Object.hasOwn(result,
  #       "httpStatus") === false` (absence, not `undefined`) and the paired
  #       status-bearing stimuli on GitHub; the rate-limit stimulus with a
  #       prose-independence pair and a status OUTSIDE {401, 403} (a 403-signalled
  #       throttle classifies as `tracker.auth.rejected` under the delivered
  #       status-only rule and is asserted as the recorded
  #       `failure-classification` boundary, never as a covered rate-limit
  #       classification); the undecodable 2xx plus prose-contradicted
  #       non-2xx pair; the workflow-state mismatch with the transport's recorded
  #       request count UNCHANGED across the call (zero provider requests); and the
  #       page-limited read as the bounded observation of a DECLARED BOUND plus the
  #       REPORTED PAGE COUNT with exact-boundary cases (available = bound-1, bound,
  #       bound+1), exactly one request, no retry, no new bound — with the
  #       bound-less read asserted INELIGIBLE for `covered` and tied to the
  #       recorded `pagination-model` difference.
  #       A credential-resolution stimulus stays `config.credential.missing` and is
  #       reported OUTSIDE the taxonomy in both arms.
  #   3.4 Author `tests/conformance/family-classification.test.ts`: TAX-013 —
  #       one replay per non-`gap-backed` posture through the production clients,
  #       the declared-outcome comparison, the three arm counts read from the
  #       accounting and asserted equal to 9 / 7 / 2, and the suite-level arm
  #       invariant with its three falsifying controls (covered,
  #       recorded-difference, gap-backed).
  #   3.5 Correct a phase-1 stimulus or catalog entry ONLY where the replay shows it
