# CONSTRAINTS BINDING ON EVERY PHASE (spec §24.3; do not reshape at delivery):
#   1.  No adapter is completed or changed — no operation, capability flag, gap
#       record, normalized-view field, or provider behaviour moves for GitHub,
#       GitLab, or Jira (§24.3(1)). Test-side replay only.
#   2.  No closed operation is added, removed, renamed, or retyped; the nine are
#       the universe of parity (§24.3(2)).
#   3.  No failure identity, error-table row, domain kind, projection class, or
#       exit code is added; the four tracker class ids are conformance-only
#       labels and are never emitted (§24.3(3)).
#   4.  The `delivery.conformance.v1` schema, field set, closed statuses, skip
#       kinds and bounds are unchanged; parity is NOT serialized into it
#       (§24.3(4)) — `packages/testkit/src/conformance/artifact.ts` is a
#       read-only control in every phase.
#   5.  No workflow file, job, trigger, permission, or upload changes; the live
#       tier stays read-only and outside the gate (§24.3(5)).
#   6.  Flows, step ids, step count, assertion families, carrier behaviour, and
#       the skip-kind vocabulary are unchanged; the double is additional
#       evidence, not a new flow (§24.3(6)).
#   7.  Trap-catalog entries stay exactly four fields; family wiring is separate
#       data that references entry names (§24.3(7)).
#   8.  The shipped registry stays exactly the three shipped provider contracts;
#       the control adapter is composition-injected only (§24.3(8)).
#   9.  Testkit stays runtime-neutral; fixture loading, the process-environment
#       read, native fetch, the child-process substitution, and artifact writing
#       stay under `tests/` (§24.3(9)).
#   10. No CLI command, report, rendered surface, or operator configuration is
#       introduced for parity (§24.3(10)).
#   11. The provider trap suites are neither migrated nor retired (§24.3(11)).
#   12. The initial adjudication records real delivered differences instead of
#       converging them (§24.3(12)).
#   13. The four class ids and the six families are closed; no family is added to
#       cover a fixture gap (§24.3(13)).
#   14. The runner's addressing-derived expected entity identity is the SINGLE
#       pinned engine exception (five comparisons, recorded not approved); the
#       allowlist does not grow for anything else (§24.3(14)).
#   Plus: fixture-decided details stay fixture-decided (§24.4) — stimulus payload
#   shapes, which operation a family exercises per adapter, effect operand names
#   and values, double-backed response projections, violation wording beyond its
#   named elements, and the serialized form of declared state. NOT fixture-decided:
#   whether a difference is recorded, whether a family is accounted for, and
#   whether an adapter's payload failures carry a structured status — that is
