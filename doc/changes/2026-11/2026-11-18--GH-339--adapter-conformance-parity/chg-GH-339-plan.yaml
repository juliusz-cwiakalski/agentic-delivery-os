# PROVIDER-IDENTITY SCAN — CONSTRUCT DEFINITION (forced, and declared here so the
#   scan cannot be either vacuous or widened):
#   AC-F4-4 / DM-6 name a seven-module bound set — `flows.ts`, `coverage.ts`,
#   `artifact.ts`, `harness.ts`, `parity.ts`, `tracker-error-taxonomy.ts`, and the
#   stateful double — and an enumerated permit list that includes the pinned
#   `runner.ts` derivation with exactly five provider comparisons. The delivered
#   `artifact.ts` already carries provider-SHAPED text inside its redaction
#   table: `{ detail: "github token" }`, `{ detail: "gitlab token" }` (lines
#   84-85) and `/avatars\.githubusercontent\.com|secure\.gravatar\.com/`
#   (lines 91, 114). A naive substring scan would therefore fail on delivered,
#   intentionally-unchanged code (AC-F1-8 forbids an artifact edit), and the
#   allowlist may NOT grow to cover it (NFR-10, §24.3(14)).
#   The only non-widening reading — and the one the spec's own §2.1 statement
#   ("the flow registry, coverage gates, artifact module, and harness registry
#   contain no adapter identity literal") presumes — is an IDENTITY CONSTRUCT:
#   (i) a string-literal expression whose whole value is a registered provider
#   identity (`"github"`, `"gitlab"`, `"jira"`), and (ii) a provider-discriminant
#   comparison or branch (`addressing.provider === "…"`, `switch` on the same).
#   Redaction-pattern labels and URL regexes are not identity constructs.
#   Phase 5's scan binds that definition, and TC-REG-004 keeps it non-vacuous:
#   seven planted full-value literals (one per bound module) and a sixth
#   `addressing.provider === …` in `runner.ts` each fail naming file and
#   construct; a wildcard or prefix allowance is rejected by assertion.
#
