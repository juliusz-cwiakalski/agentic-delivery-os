  # ---------------------------------------------------------------------------
  # Phase 2 — Parity matrix, declared-difference register, parity gate, the five
  # adjudications, and artifact invariance (F-1, F-5 diagnostics).
  #
  # Goal: switching trackers cannot change the lifecycle contract without a gate
  # failing. One declared matrix relates every registered adapter to the reference
  # adapter across the nine closed operations; every divergence is recorded,
  # classed, evidenced and adjudicated; the gate is a pure validation over
  # matrix + capability declarations + register + the observed mock-tier report.
  #
  # Contract (F-1, DM-1, DM-2, DM-7; TDR-0036 is authority):
  #   - Matrix: one row per closed operation, one cell per registered adapter,
  #     27 cells today. A cell is exactly `{kind: "same-as-reference"}`,
  #     `{kind: "declared-difference", differenceClass, registerId}` or
  #     `{kind: "gap", reason}` where `reason` is the adapter's OWN declared gap
  #     reason (a reference to the declaration, never a copy, character-exact).
  #     No free-text cell value exists.
  #   - Reference adapter: ONE declared value (GitHub for M3). Its column is
  #     uniformly `same-as-reference` and NO register entry may name it.
  #   - Register: keyed by exactly `(adapter, operation)`; entry fields
  #     `differenceId, adapter, operation, differenceClass, rationale, evidence,
  #     adjudicatedBy`. Six closed classes: `identity-scheme`,
  #     `pipeline-model`, `state-vocabulary`, `pagination-model`,
  #     `carrier-absent`, `failure-classification`. Bidirectional bijection with
  #     the cells: a difference without an entry fails, an entry naming no cell
  #     fails, and two entries for one pair fail.
  #   - The gate compares FOUR provider-independent dimensions and never byte
  #     equality: (1) step participation; (2) applied assertion families and both
  #     sides passing; (3) the tracker error class resolved for that operation's
  #     family, or an explicit "not applicable because the accounting declares no
  #     family" — never a silent skip; (4) declared absence and truncation
  #     semantics. Violations are ordered deterministically, clause-tagged, and
  #     each names provider, operation, clause and a resolving reference.
  #   - The gate performs no I/O, reads no ambient input, spawns nothing, and is
  #     re-runnable with the same result. Parity is NOT written into the artifact.
  #
  # ADJUDICATION (the five non-reference supported intersections): this phase
  #   owns all five — GitLab `read-delivery-request`, GitLab `read-pipeline-run`,
  #   Jira `read-work-item`, Jira `write-work-item`, Jira `transition-work-item`.
  #   Evidence homes: `.../parity/evidence/{differenceId}.json` and
  #   `.../parity/adjudication.json`. NO VERDICT IS PRE-DECIDED — see the header.
  #   The state-vocabulary class is deliberately narrow: a difference is recorded
  #   only when the adapter's DECLARED MAPPING cannot express the reference
  #   behaviour (a different mechanism for the same alias, or a state the map has
  #   no row for), never merely because two adapters spell rows differently.
  #
  # Obligations:
  #   2.1 Author `parity.ts`: the declared matrix, the declared register, the
  #       closed cell/class/kind/clause vocabularies, the reference designation,
  #       and the one pure gate. Runtime-neutral, provider-name-free (identity
  #       lives in the column KEYS and the register's operations, which are the
  #       enumerated permits) and inside DM-6's seven-module bound set.
  #   2.2 Adjudicate the five intersections from replay evidence and write the
  #       evidence documents plus `adjudication.json`: provider, operation, chosen
  #       posture, the four dimension observations, evidence/adjudication
  #       reference. Author the `failure-classification` register entries the
  #       status-less adapters need, with `httpStatus` ABSENCE as the deciding
  #       structured field (§24.4: delivered code, not a fixture choice).
  #   2.3 Author `tests/conformance/parity-gate.test.ts`: PARITY-001..008,
  #       PMUT-001..011, GATE-004, plus GATE-003's violation-object assertions
  #       over the induced violation set (its diagnostics/secret assertions live in
  #       obligation 2.4's file, so GATE-003 has two sites and one owner). Every
  #       mutation asserts its NAMED
  #       violation AND a paired clean pass; PARITY-007 derives the intersection
  #       set from the contracts and the matrix (never a hard-coded name list) and
  #       compares it as a SET against the record; PARITY-008 runs four AC-F1-5
  #       dimension mutations plus one AC-F1-6 falsified-evidence mutation on
  #       every run from an arm registry independent of the record's contents and
  #       reports the executed arm per intersection in the test name.
  #   2.4 Create `tests/checks/parity-gate-wiring.test.ts` with GATE-003's
  #       diagnostics half only (the wiring chain is phase 5's GATE-001): every
  #       violation over a violation set spanning all clauses carries non-empty
  #       provider, operation, clause from the closed clause set, a detail of at
  #       most 1024 characters, scalar-only expected/received values, and a
  #       reference that RESOLVES ON DISK; and no violation, serialized verdict or
  #       thrown error contains credential material — asserted with the delivered
  #       canary `conformance-canary-credential-value` plus a planted
  #       provider-native marker, each with a PAIRED POSITIVE proving the detection
  #       fires.
  #   2.5 Author the typed mutation builders in
  #       `tests/fixtures/providers/conformance/parity/mutations.ts` — typed
  #       literal builders over the production shapes, so a mutation that stops
  #       being a mutation is a compile error and not a passing no-op.
  #   2.6 Create `tests/types/conformance-participation.type-test.ts` with the
  #       CELL/ENTRY half only: a free-text cell value and a seventh class are not
  #       representable. Phase 5 extends the same file with the participation and
  #       refusal probes.
  #   2.7 Extend `tests/conformance/artifact.test.ts` with ART-001 (exact
  #       eleven-key set, closed status/skip sets, unchanged caps as exported
  #       constants; adding `parity` at top level fails naming the key) and
  #       ART-002 (zero class ids, zero cell kinds, zero difference ids in the
  #       serialized bytes, PAIRED with a positive that the artifact does carry
  #       the injected runId, schema id and nine step operations).
  #   2.8 Move the pinned surfaces for the new module exactly
  #       (`tests/structure/inventory.json`, `EXECUTABLE_ALLOWANCES`).
  #       `packages/testkit/src/conformance/artifact.ts` is NOT edited: AC-F1-8
  #       and §24.3(4) make it a read-only control.
  #
  # Acceptance: AC-F1-1 (PARITY-001/007), AC-F1-2 (002), AC-F1-3 (003),
  #   AC-F1-4 (004), AC-F1-5 (005/008), AC-F1-6 (006/008), AC-F1-7 (PMUT-001..011),
  #   AC-F1-8 (ART-001/002), AC-F5-2 (GATE-003), AC-F5-3 (GATE-004).
  #
  # Gate (expected signal: exit 0; the unmutated report yields `[]`, the matrix
  # cell multiset is exactly 27 with set equality both directions, the reference
  # column is nine `same-as-reference` cells with zero register entries, every
  # intersection's executed arm is printed in the test name, every mutation names
  # provider/operation/clause, the artifact key set is exactly eleven and its
  # bytes contain no parity vocabulary):
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/conformance/parity-gate.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/parity-gate-wiring.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/conformance/artifact.test.ts
