  # ---------------------------------------------------------------------------
  # Phase 2 — Parity matrix, declared-difference register, parity gate over the
  # gate-local SIX-dimension observation record, the five adjudications, and
  # artifact invariance (F-1, F-5 diagnostics).
  #
  # Goal: switching trackers cannot change the lifecycle contract without a gate
  # failing. One declared matrix relates every registered adapter to the reference
  # adapter across the nine closed operations; every divergence is recorded with the
  # FULL set of the six dimensions it spans, evidenced per class, and adjudicated;
  # the gate is a pure validation over matrix + capability declarations + register +
  # the observation record the case composes.
  #
  # Contract (F-1, DM-1, DM-2, DM-7, API-1; TDR-0036 is authority):
  #   - Matrix ROWS are exactly `ADAPTER_OPERATIONS` and COLUMNS are exactly the
  #     providers of `CONFORMANCE_ADAPTERS`, DERIVED from the registration list
  #     (mapped `registration.provider`) and never hand-authored; a control run
  #     derives them from the injected list the same way. 27 cells today.
  #   - A cell is exactly `{kind: "same-as-reference"}`,
  #     `{kind: "declared-difference", registerId}` or `{kind: "gap", reason}`,
  #     where `reason` is the adapter's OWN declared gap reason (a reference to the
  #     declaration, never a copy, character-exact). A cell carries NO difference
  #     class: a pair that differs on several dimensions stays ONE cell with ONE
  #     entry, so the cell and its adjudication cannot disagree.
  #   - Reference adapter: ONE declared value (GitHub for M3). Its column is
  #     uniformly `same-as-reference` and NO register entry may name it.
  #   - Register: one entry per declared-difference cell, keyed by exactly
  #     `(adapter, operation)`; fields `differenceId, adapter, operation,
  #     differenceClasses, rationale, evidence, adjudicatedBy`.
  #     `differenceClasses` is a NON-EMPTY SET drawn from the closed six-class
  #     vocabulary, and EACH CLASS IS EXACTLY ONE DIMENSION — the class set and the
  #     dimension set are ONE six-member closed set, 1:1, with no many-to-one
  #     mapping. The set names EXACTLY the differing dimensions: no omission (an
  #     unrecorded differing dimension fails) and no padding (a class whose
  #     dimension agrees fails). An empty set, an out-of-vocabulary class, or a
  #     class outside the closed set is a `difference-class` failure.
  #     `evidence` is PER CLASS: a resolving committed fixture for each class, and
  #     that fixture must reproduce THAT class's dimension observation under its
  #     oracle; a class whose evidence shows agreement on its dimension fails
  #     naming the class. Adjudication is per ENTRY, not per class.
  #   - Bidirectional bijection over the entry: a declared-difference cell whose
  #     registerId resolves to no entry fails, an entry naming no cell fails, and
  #     two entries for one pair fail.
  #   - THE PARITY BASIS IS SIX DIMENSIONS, ONE CLASS EACH, EACH WITH ONE OFFLINE
  #     ORACLE (TDR-0036 §5.1; the dimension id IS the class id):
  #       `identity-scheme`        the normalized entity identity FORM on the
  #                                declared tenant — provider numeric id,
  #                                project-scoped `iid`, issue `key`,
  #                                `<commitSha>:<runId>` item identity, bare provider
  #                                id. The value is diagnostic; the SCHEME is the
  #                                predicate.
  #       `pipeline-model`         one `PipelineRun` item's GRANULARITY UNIT and
  #                                per-item COMPOSITION (one check run vs one
  #                                pipeline; jobs synthesised per check run vs the
  #                                provider's own job list). Count is diagnostic,
  #                                never equality.
  #       `state-vocabulary`       the operation's state RESOLUTION MECHANISM and
  #                                outcome for a declared native value — the signal
  #                                read (native status plus exact-case label tokens
  #                                with terminal-first precedence, vs native status
  #                                alone, vs a review-state table), the refusal rule,
  #                                and the reachable aliases. Row spelling is never
  #                                compared.
  #       `pagination-model`       the read's DECLARED PAGE BOUND (or none declared)
  #                                and WHETHER A PAGE COUNT IS REPORTED. The numeric
  #                                bound and count are diagnostic, never equality.
  #       `carrier-absent`         the adapter's declared carrier arrays
  #                                (`writableCarriers`/`readableCarriers`, a subset
  #                                of the closed `CARRIER_KINDS`), plus the carrier
  #                                step's PARTICIPATION. THE DECLARATION HALF IS
  #                                OBSERVED ONCE PER ADAPTER FROM THE CAPABILITY
  #                                DECLARATION AND COMPARED PER COLUMN — the same
  #                                adapter-level value appears in each of that
  #                                adapter's pair observations. The participation
  #                                half is observed ONLY on the pair whose operation
  #                                IS the carrier step (`comment-provenance.carrier-roundtrip`
  #                                on `write-comment`): there it is `executed`, or
  #                                skipped `capability-absent` /
  #                                `no-declared-carrier`. On EVERY other pair the
  #                                participation half is `not-observable` (the step is
  #                                not that pair's carrier step) and agrees with
  #                                another `not-observable`. On an adapter whose
  #                                carrier operation is a DECLARED GAP the pair is a
  #                                `gap` cell, so it carries NO observation at all and
  #                                the absence of participation produces NO difference
  #                                — a gap is not a carrier divergence.
  #       `failure-classification` the API-2 class resolved from a trap-family
  #                                stimulus on the family's declared operation
  #                                (identity plus status presence and value), never
  #                                prose.
  #     Parity for a pair means all six observations AGREE. There is no byte
  #     equality of normalized views and no extra dimension.
  #   - THE GATE'S OBSERVED-OUTCOME INPUT IS A GATE-LOCAL OBSERVATION RECORD: ONE
  #     observation PER DIMENSION PER `(provider, operation)` PAIR, each either
  #     `{state: "observed", value}` or `{state: "not-observable", why}`; a
  #     declared-gap pair has NO observation. It is composed by the CASE from the
  #     report, the flow registry and declared evidence, and never carried by the
  #     report:
  #     (i) identity form, pipeline unit/composition and state mechanism come from
  #         the REPLAYED NORMALIZED RESULT on the pair's declared tenant;
  #     (ii) bound-and-count PRESENCE comes from the read's declared metadata and
  #          the read's own report;
  #     (iii) the carrier declaration comes from the capability declaration, and its
