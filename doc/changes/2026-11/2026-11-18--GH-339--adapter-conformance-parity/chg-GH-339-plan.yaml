phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Tracker error taxonomy and the six-family vocabulary (F-2
  # declarations), with the family stimuli, the appended four-field catalog
  # entries, the trap-suite append those entries OBLIGE, and the exact two-tree
  # `tracker.` scan IN ONE COMMIT.
  #
  # Goal: the failing side of a tracker interaction becomes a closed vocabulary
  # that maps onto DELIVERED identities — never a second error system — and the
  # six trap families become a closed set that fixture authoring consumes. This
  # phase is first because (i) §18 makes the vocabulary an input to fixture
  # authoring, (ii) phase 2's gate compares "the tracker error class resolved for
  # that operation" as its third parity dimension, so the class table and the
  # total decision function are a build dependency of the gate, and (iii) the
  # `failure-classification` register entries phase 2 authors NAME these class ids.
  #
  # Contract (F-2, DM-3, DM-4; TDR-0037 is authority):
  #   - Exactly four class ids: `tracker.capability.unsupported`,
  #     `tracker.auth.rejected`, `tracker.transport.failed`,
  #     `tracker.payload.invalid`. Each resolves to exactly one DELIVERED identity
  #     (`provider.payload.invalid` for three; the capability-gap declaration for
  #     the fourth) and each carries a declared structured discriminator: status
  #     presence and value, or absence; operation membership.
  #   - Classification is a TOTAL projection over five observable outcomes in a
  #     FIXED order — capability gap, adapter refusal (zero provider requests), no
  #     response, a READ's explicit 404, then any other status or undecodable
  #     success. No prose input, no provider branch. A read's 404 stays
  #     `provider.not-found` and is OUTSIDE the taxonomy; a WRITE's 404 stays the
  #     payload class.
  #   - The class ids are testkit-local labels: no error-table row, no domain
  #     kind, no emitted failure code, no projection class, and no
  #     normalized-view or artifact occurrence. They exist as string literals in
  #     EXACTLY ONE module of the two scanned trees —
  #     `packages/testkit/src/conformance/tracker-error-taxonomy.ts`.
  #   - Six families, closed: `auth-shape` (singular, per TDR-0037 §3 — never the
  #     plural spelling), `transport-failure`, `rate-limit`, `payload-shape`,
  #     `workflow-state-mismatch`, `pagination-truncation`. The first five prove a
  #     class; `pagination-truncation` is NOT an error class — it is a
  #     bounded-observation assertion over a DECLARED PAGE BOUND plus the page
  #     count the read reports, and a read that declares neither is ineligible for
  #     `covered` (see phase 3). The family set and each family's declared outcome
  #     are exported from the SAME module so the accounting keys and the fixture
  #     names have one source.
  #   - The taxonomy table contains ZERO provider names. Per-adapter family data
  #     lives in phase 3's accounting fixture (a permitted identity home), so the
  #     taxonomy table stays inside DM-6's bound set and construct-free.
  #
  # Family stimuli and catalog entries (GAP-TP-8): author one committed stimulus
  #   per family that no delivered provider fixture already produces, under
  #   `tests/fixtures/providers/{provider}/families/{family}.json`, and append the
  #   four-field catalog entries that reference them. Delivered trap names,
  #   `fixtureReference`s, minima, and outcomes stay FROZEN; no delivered entry is
  #   amended, migrated, or retired (NG-10, §24.3(7)(11)). Where an existing
  #   provider fixture already produces the stimulus, the entry NAMES that fixture
  #   and no new file is authored.
  #   AN APPEND IS NOT A DATA-ONLY EDIT (the TRAP-CATALOG APPEND-ONLY RULE in this
  #   file's header): `runTrapCatalog` fails any catalog entry with no registered
  #   assertion, and each provider suite asserts BOTH an empty failure list AND an
  #   exact ORDERED trap-name array. So this phase EDITS
  #   `tests/behaviour/providers/{github,gitlab,jira}-trap.test.ts`: one NEW
  #   assertion per appended entry and the exact ordered name array extended by
  #   exactly the appended names. No delivered assertion is removed, renamed,
  #   relaxed, or reordered, and the delivered names stay a PREFIX. Those three
  #   suites are therefore NOT read-only controls in this phase, and no phase may
  #   call them unedited.
  #
  # Obligations:
  #   1.1 Author `tracker-error-taxonomy.ts`: the four-class table, the six-family
  #       vocabulary with declared outcomes, the closed structured discriminator
  #       set, and the total decision function. Runtime-neutral: no `node:*`/
  #       `bun:*`, no ambient environment, clock, or randomness.
  #   1.2 Export it through `packages/testkit/src/index.ts` (no new subpath) and
  #       move BOTH pinned surfaces exactly: `tests/structure/inventory.json`
  #       gains `src/conformance/tracker-error-taxonomy.ts` and
  #       `EXECUTABLE_ALLOWANCES` in `tests/structure/content-inventory.test.ts`
  #       gains exactly that file's exported executable names, no wildcard.
  #   1.3 Author `tests/conformance/tracker-taxonomy.test.ts` with the cases this
  #       phase owns: TAX-001 (exactly four ids, one identity each, zero provider
  #       literals in the table, zero `tracker.` in the error table / domain kinds
  #       / projection map / exit map, no class id ever returned as a `code`),
  #       TAX-009 (the five-outcome order proven by an AMBIGUITY set, not by
  #       membership — a refusal that would also present as a status-less failure
  #       resolves to the refusal rule; a write 404 resolves to the payload class
  #       while a read 404 resolves outside; swapping rules (2) and (3) flips the
  #       ambiguity stimulus and fails naming it), TAX-010 (the capability class
  #       proven by the delivered structural coverage gate plus the runtime
  #       declared-gap encounter rule, with no family attached and no gapped
  #       operation counted as failed).
  #   1.4 Author `tests/checks/tracker-literal-scan.test.ts`: scope is EXACTLY
  #       `packages/testkit/src/**` and `packages/adapters/src/**`; the allowlist
  #       is EXACTLY the one taxonomy module; the live tree yields zero hits
  #       outside it; each hit reports file plus construct (string-literal
  #       expression). Assert scope and allowlist as exact collections, assert the
  #       baseline is empty BEFORE mutating, plant a literal in an in-memory copy
  #       of `packages/adapters/src/jira/client.ts` and of a testkit module (both
  #       fail naming file and construct), and keep the opposite-direction control
  #       that a copy of `packages/core/src/contracts/status.ts` carrying its eight
  #       PRE-EXISTING `tracker.*` codes does NOT fail (the core/CLI/MCP vocabulary
  #       is out of scope and unchanged).
  #   1.5 Author the family stimuli that have no delivered equivalent; append the
  #       four-field catalog entries that name them; keep the delivered entries
  #       byte-frozen. A family whose posture will be `recorded-difference` (the
  #       status-less GitLab/Jira cells phase 3 accounts) still needs its stimulus
  #       fixture here — the evidence is phase 2's, the stimulus is this phase's.
  #   1.6 CAPTURE THE FROZEN PIN PAIR FIRST, THEN APPEND (order is binding):
  #       before touching any suite, write `tests/fixtures/pins/trap-names.json`
  #       with one ordered trap-name array per provider, read from the DELIVERED
  #       suites as they stand, and compute `tests/fixtures/pins/trap-names.sha256`
  #       ONCE as the SHA-256 of that file's exact bytes. Both are a golden of the
  #       pre-append state, committed in this phase and NEVER REGENERATED in this
  #       change. Then extend the three
  #       provider trap suites APPEND-ONLY: a new assertion per appended entry and
  #       the exact ordered name array extended by exactly the appended names, with
  #       the pinned delivered names a preserved prefix. Correcting the pin — or
  #       recomputing the digest to match an edited pin — is the failure
  #       TC-FLOOR-001 names by file.
  #   1.7 Stage the four decision records and, conditionally, the decision index
  #       (see COMMIT-BOUNDARY REALITY). Nothing else outside the change surface.
  #
  # Acceptance: AC-F2-1 (TC-TAX-001, TC-TAX-002), AC-F2-8 (TC-TAX-009),
  #   AC-F2-9 (TC-TAX-010). TAX-003..008 and TAX-011..013 are NOT claimed here:
  #   their posture comes from phase 3's accounting, whose recorded-difference
  #   cells resolve to phase 2's register. TC-FLOOR-001's TRAP HALF is authored
  #   here (the frozen baseline, the append-only extension and its prefix property)
  #   while the case is OWNED by phase 6, which is the only phase that can range
  #   over the assembled change.
  #
  # Gate (expected signal: exit 0; four class ids and six family ids compared as
  # exact sets, zero `tracker.` hits outside the one module, the two planted
  # literals failing by file+construct, the out-of-scope core copy passing, the pin
  # PAIR present — the baseline with its three frozen arrays and bytes never
  # rewritten, and the digest equal to the recomputed SHA-256 of that baseline
  # BEFORE any append — EVERY
  # appended catalog entry replayed green by its provider suite through a NEW
  # assertion, each suite's exact ordered name array equal to the PINNED names
  # followed by exactly the appended names, and the inventory/allowance equality
  # holding in both directions):
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/conformance/tracker-taxonomy.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/tracker-literal-scan.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/structure                        (G2)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/providers             (G4: capability postures unchanged; the three provider trap suites green WITH the append-only extension)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/fixture-sanitization.test.ts tests/checks/fixture-privacy.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck                                 (G6)
  #   TMPDIR=$PWD/tmp/tmpdir git diff --check                               (G9)
  #   TMPDIR=$PWD/tmp/tmpdir pnpm check                                     (G10, binding)
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Tracker error taxonomy over delivered identities, the six-family vocabulary, family stimuli, appended four-field catalog entries with their append-only trap-suite assertions, and the exact two-tree tracker literal scan"
