  # ---------------------------------------------------------------------------
  # Phase 4 — The deterministic simulated stateful tracker double and its
  # scenarios (F-3).
  #
  # Goal: write-then-read becomes provable INSIDE the offline mock tier. The
  # double is a purely in-memory implementation of the EXISTING transport seam:
  # declared initial state, the delivered route table, and one declared effect per
  # route drawn from a closed five-effect vocabulary, so a later read observes what
  # an earlier write declared. Flows, step ids, assertion families, step count and
  # registrations do not move; the delivered stateless replay stays the DEFAULT.
  #
  # Contract (F-3, DM-5, API-3, API-4; TDR-0038 is authority):
  #   - Five effects, closed: `set-field`, `reset-field`, `replace-collection`,
  #     `append-entry`, `mark-resolved`. Every identity is DECLARED: resource
  #     identities from the tenant, created-entry identities from a declared
  #     sequence, ordering by declaration order. A route with no declared effect
  #     performs NO state change and returns its declared body (the delivered
  #     behavior). Absence of declared initial state means the delivered stateless
  #     replay.
  #   - Determinism is structural: no clock, randomness, or ambient counter, so the
  #     same declared input and request order produce identical canonicalized state
  #     and identical normalized reads.
  #   - Failure is closed and loud: an undeclared request (the delivered
  #     `unfixtured provider request {METHOD} {URL}` message preserved), an
  #     undeclared effect, or an effect naming a missing resource fails naming
  #     method, URL and effect; never a silent no-op and never a live call.
  #   - The tenant document gains the extension ADDITIVELY: an optional declared
  #     initial state and an optional per-route effect. Malformed or
  #     out-of-vocabulary declarations are rejected by NAME at decode time. The
  #     three committed stateless tenants are NOT edited and NOT migrated; the
  #     stateful scenarios are separate documents.
  #   - Testkit placement keeps runtime neutrality: fixture loading and both guards
  #     stay under `tests/`; the double imports no `node:*`/`bun:*` module and
  #     reads no environment, clock, or randomness.
  #
  # Obligations:
  #   4.1 Author `stateful-double.ts` (`createStatefulTenantTransport({ tenant,
  #       initialState })`): declared state, matched-route effects, declared
  #       identity and ordering, the three named fail-closed refusals. Export it
  #       through `packages/testkit/src/index.ts` (no new subpath) and move BOTH
  #       pinned surfaces exactly.
  #   4.2 Extend the tenant data model ADDITIVELY in
