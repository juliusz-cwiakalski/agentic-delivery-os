# SEQUENCING (spec §18 "by outcome, so each declaration lands with the evidence
# that proves it"), made concrete. Two facts force the exact order:
#
#   (a) The taxonomy must precede the gate, not merely precede the fixtures: the
#       parity gate's THIRD comparison dimension is "the tracker error class
#       resolved for that operation's family" (DM-1, AC-F1-5), so the parity
#       engine cannot be authored without the class table and the total
#       decision function. §18's "taxonomy and family vocabulary first — they
#       are inputs to fixture authoring" is therefore also a hard build
#       dependency of phase 2.
#   (b) The family ACCOUNTING must follow the register: DM-4 makes
#       `recorded-difference` a POSTURE that references a `registerId` resolving
#       to an entry with `differenceClass: "failure-classification"`, and DM-2
#       makes that register a phase-2 surface. An accounting cell written before
#       the register exists is a dangling reference and TC-TAX-011 fails it by
#       name. So the F-2 work spans two phases with the register between them:
#       the VOCABULARY (which is what §18 requires first, and what fixture
#       authoring consumes) lands in phase 1 together with the family stimuli
#       and the catalog entries; the ACCOUNTING and the replay classification
#       land in phase 3. Neither phase is optional and neither is a re-plan.
#
#   Phase 1  Tracker error taxonomy + six-family vocabulary + family stimuli +
#            four-field catalog entries + the exact two-tree `tracker.` scan
#            (F-2 vocabulary; AC-F2-1, AC-F2-8, AC-F2-9). TDRs land here.
#   Phase 2  Parity matrix + difference register + parity gate + adjudication of
#            the five non-reference supported intersections + artifact
#            invariance (F-1, F-5 diagnostics; AC-F1-1..8, AC-F5-2, AC-F5-3).
#   Phase 3  Per-adapter × per-family accounting + offline replay classification
#            through the production clients, both posture arms on every run
#            (F-2 evidence; AC-F2-2..7, AC-F2-10, AC-F2-11).
#   Phase 4  Deterministic simulated stateful tracker double + its scenarios +
#            the additive tenant extension (F-3; AC-F3-1..7).
#   Phase 5  Registration-only participation contract + identity-free invariant
#            + composition-injected synthetic control + the gate's CI-wiring and
#            topology control (F-4, F-5 topology; AC-F4-1..5, AC-F5-1).
#   Phase 6  Release obligations: regression floor, spec reconciliation staged
#            for lifecycle phase 7, plan validation, aggregate gate
#            (TC-FLOOR-001..006; no AC ownership).
#
# ADJUDICATION IS A DELIVERY ACT (GAP-TP-1, pm-notes binding expectation).
#   PHASE 2 OWNS ALL FIVE adjudications, because phase 2 authors the matrix
#   column and the register entry for each:
#     1. GitLab `read-delivery-request`
#     2. GitLab `read-pipeline-run`
#     3. Jira   `read-work-item`
#     4. Jira   `write-work-item`
#     5. Jira   `transition-work-item`
#   For each, phase 2 records EITHER `{kind: "same-as-reference"}` OR a
#   `{kind: "declared-difference", differenceClass, registerId}` cell whose
#   register entry carries class, non-empty rationale, resolvable evidence and an
#   `adjudicatedBy` reference. THIS PLAN DOES NOT PRE-DECIDE ANY VERDICT and
#   neither may the coder: the verdict is what the replay shows.
#   Evidence homes (fixed, so the record and the artefacts cannot drift):
#     - one evidence document per recorded difference:
#       tests/fixtures/providers/conformance/parity/evidence/{differenceId}.json
#     - the five-intersection record with provider, operation, chosen posture,
#       the four dimension observations and the reference:
#       tests/fixtures/providers/conformance/parity/adjudication.json
#     - the declared matrix and register themselves:
#       packages/testkit/src/conformance/parity.ts
#   The five ADAPTER-LOCAL, status-less classification differences
#   (`failure-classification` on GitLab `auth-shape`/`rate-limit`/`payload-shape`
#   operations and the equivalent Jira cells) are authored by the SAME phase,
#   for the same reason: a `recorded-difference` posture in phase 3 resolves to
#   these entries, and phase 3 creates none. Their deciding structured field is
#   `httpStatus` ABSENCE — delivered code, not a fixture choice (§24.4), which is
#   why no phase may assert a status-bearing class on those two adapters.
#   If an adjudication could only be `same-as-reference` by CHANGING an adapter,
#   the coder STOPS and reports: that is adapter completion (NG-1, §24.3(1)) and
#   TC-FLOOR-002 fails it by name.
#
# NO ADAPTER BEHAVIOUR CHANGE (NG-1, §24.3(1); pm-notes binding expectation):
#   No phase may edit `packages/adapters/src/{github,gitlab,jira}/**`, their
#   capability declarations, the closed operation set, the error table, the
#   domain kinds, the projection classes, the exit-code map, the artifact, the
#   flows/steps/assertion families, the skip-kind vocabulary, or any workflow
#   file. Where a case needs to prove EXISTING adapter behaviour it replays the
#   production client through an injected transport from `tests/**` — test-side
#   only. A task that would need an adapter change is a STOP-AND-REPORT, never a
#   quiet widening.
