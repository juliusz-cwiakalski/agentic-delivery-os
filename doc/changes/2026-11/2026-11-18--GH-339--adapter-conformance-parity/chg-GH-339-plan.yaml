#   - doc/spec/features/feature-adapter-reference-behavior.md — state that the
#     reference behavior is the parity bar and name the matrix and register as the
#     machine-readable record of deliberate difference; keep every delivered value.
#   - doc/spec/features/feature-adapter-ports.md — confirm no port, operation,
#     capability flag, or carrier change; parity is proven at the primitive
#     boundary the ports define.
#   - doc/spec/features/feature-result-contract.md — confirm no row, domain kind,
#     projection class, or exit change; record that the tracker class vocabulary
#     is conformance-only and never an emitted identity.
#   - doc/overview/glossary.md and doc/00-index.md — add the new terms (parity
