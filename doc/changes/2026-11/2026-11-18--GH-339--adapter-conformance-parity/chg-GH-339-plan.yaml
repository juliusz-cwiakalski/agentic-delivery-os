  # ---------------------------------------------------------------------------
  # Phase 3 — Per-adapter × per-family accounting and the offline replay
  # classification (F-2 evidence).
  #
  # Goal: the taxonomy stops being a vocabulary and becomes a proven property of
  # each adapter: every one of the six families is accounted for on every adapter
  # as exactly one of `covered`, `gap-backed`, or `recorded-difference`, and every
  # non-gap posture replays through the PRODUCTION client and satisfies its
  # declared outcome. This phase owns the posture arms the test plan added in
  # v1.1: a status-bearing adapter is held to the status-bearing class, and a
  # status-less adapter to its evidence-backed `failure-classification` recorded
  # difference — with BOTH arms executed on EVERY run.
  #
  # Why this phase follows phase 2 (and not phase 1): DM-4's
  # `recorded-difference` posture references a DM-2 `registerId`. Writing the
  # accounting before the register exists is a dangling reference and TC-TAX-011
  # fails it by name. The VOCABULARY still landed first (phase 1), as §18
  # requires; this phase adds per-adapter DATA and the replay that proves it, and
  # creates NO register entry — entries are phase 2's.
  #
  # Contract (F-2, DM-4, DM-3; TDR-0037 is authority; spec v1.1 GAP-TP-2):
  #   - Key set is exactly `providers(CONFORMANCE_ADAPTERS) × six families` = 18
  #     cells, derived from the registry and the exported vocabulary constant, not
  #     from a hard-coded name list. `auth-shape` is the first family id and the
  #     singular spelling is the only one that exists anywhere.
  #   - Exactly one posture per cell:
  #       `covered` — >=1 existing catalog entry in THAT provider's catalog plus
  #         >=1 resolvable fixture for an operation that adapter DECLARES
  #         supported;
  #       `gap-backed` — the family's operation appears in that adapter's
  #         `declaredGaps` with the IDENTICAL reason;
  #       `recorded-difference` — a `registerId` resolving to an entry with
  #         `differenceClass: "failure-classification"`, and the REQUIRED posture
  #         wherever the declared class is structurally unreachable (the
  #         status-less `auth-shape`, `rate-limit` and `payload-shape` cells on
  #         GitLab and Jira).
  #     No cell holds a fixture AND a gap; an unaccounted family fails naming
  #     adapter and family.
  #   - Replay classification: for every accounted cell, the stimulus is replayed
  #     through the production client factory with an injected transport, and the
  #     observed outcome equals the declared one — a class for the five error
  #     families, a bounded observation for `pagination-truncation`, the declared
  #     skip with the exact reason for `gap-backed`, and the RECORDED class for
  #     `recorded-difference`. The number of replays equals the number of
  #     non-`gap-backed` postures, so the case cannot pass by replaying nothing.
  #   - Suite-level arm invariant: over the four class-bearing families, at least
  #     one `covered` arm and at least one `recorded-difference` arm execute on
  #     EVERY run, asserted from an arm-mutation registry independent of the
  #     accounting's contents. A run with zero executions of either arm fails
  #     naming the missing arm. M41 (declare `covered` on a status-less adapter)
  #     and M42 (record the unreachable class) are the two falsifying mutations.
  #   - The class ids never appear in a normalized view, a failure `code`, the
  #     artifact, or a diagnostic: classification is a testkit comparison, not an
  #     emitted identity.
  #
