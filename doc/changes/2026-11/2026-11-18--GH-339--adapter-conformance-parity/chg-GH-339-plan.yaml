# ADJUDICATION IS A DELIVERY ACT (GAP-TP-1, pm-notes binding expectation).
#   PHASE 2 OWNS ALL FIVE adjudications, because phase 2 authors the matrix CELL
#   and the register entry for each (the column itself is DERIVED from the
#   registration list, never authored — DM-6 / TDR-0039 §2):
#     1. GitLab `read-delivery-request`
#     2. GitLab `read-pipeline-run`
#     3. Jira   `read-work-item`
#     4. Jira   `write-work-item`
#     5. Jira   `transition-work-item`
#   For each, phase 2 records EITHER `{kind: "same-as-reference"}` OR a
#   `{kind: "declared-difference", registerId}` cell whose register entry carries a
#   NON-EMPTY class set that names EXACTLY the differing dimensions (no omission,
#   no padding — the class set IS the dimension set), a non-empty rationale,
#   PER-CLASS resolvable evidence reproducing THAT class's dimension observation,
#   and an `adjudicatedBy` reference. The CELL CARRIES NO CLASS: a pair that
#   differs on several dimensions is ONE cell with ONE entry whose class set names
#   all of them, so the cell and its adjudication cannot disagree about which
#   dimensions differ. A class whose evidence shows reference-equal behaviour on
#   ITS OWN dimension fails naming that class; one dimension's evidence never
#   justifies another's.
#   THIS PLAN DOES NOT PRE-DECIDE ANY VERDICT and neither may the coder: the
#   verdict is what the replay shows — with ONE spec-fixed exception, stated so it
#   is not mistaken for a verdict: `(gitlab, read-pipeline-run)` MUST be a
#   `declared-difference` whose class set CONTAINS `pagination-model`, because
#   DM-4's delivered `pagination-truncation` posture for GitLab IS that recorded
#   difference (the pipeline read declares no bound and reports no page count).
#   That entry may legitimately carry further classes (TDR-0036 §3 instructs
#   recording pipeline model and failure classification together on that pair), and
#   the exact set is what the observed dimensions yield — the spec fixes ONE member,
#   never the whole set. The other four are adjudicated from evidence.
#   Evidence homes (fixed, so the record and the artefacts cannot drift):
#     - one evidence document per (differenceId, class) pair:
#       tests/fixtures/providers/conformance/parity/evidence/
#     - the gate's declared observation record — one `observed`/`not-observable`
#       observation per dimension per (adapter, operation) — never a report or
#       artifact field:
#       tests/fixtures/providers/conformance/parity/observation-record.json
#     - the five-intersection record with provider, operation, chosen posture,
#       the SIX dimension observations and a per-class reference:
#       tests/fixtures/providers/conformance/parity/adjudication.json
#     - the declared matrix and register themselves:
#       packages/testkit/src/conformance/parity.ts
#   The five ADAPTER-LOCAL, status-less classification differences
#   (`failure-classification` inside the class set of the GitLab
#   `auth-shape`/`rate-limit`/`payload-shape` operations and the equivalent Jira
#   cells) are authored by the SAME phase, for the same reason: a
#   `recorded-difference` posture in phase 3 resolves to these entries, and phase
#   3 creates none. Their deciding structured field is `httpStatus` ABSENCE —
#   delivered code, not a fixture choice (§24.4), which is why no phase may assert
#   a status-bearing class on those two adapters.
#   If an adjudication could only be `same-as-reference` by CHANGING an adapter,
#   the coder STOPS and reports: that is adapter completion (NG-1, §24.3(1)) and
#   TC-FLOOR-002 fails it by name.
#
# THE PARITY BASIS IS SIX DIMENSIONS, ONE CLASS EACH (spec v1.4 F-1/DM-1/API-1;
#   TDR-0036 §5.1–§5.4 is the authority; a DoR-iteration-2 finding and the
#   persistent defect across both iterations):
#   The dimension set IS the class set — six classes, six dimensions, 1:1, no
#   many-to-one mapping and no extra dimension. A class with no dimension, a
#   dimension with no class, or a class outside the closed set is a
#   `difference-class` failure. Each dimension has ONE offline oracle the mock tier
#   can produce, and a differing dimension is reported by naming its class id, so
#   no divergence has two candidate names:
#     identity-scheme        the normalized entity identity FORM (provider numeric
#                            id, project-scoped `iid`, issue `key`,
#                            `<commitSha>:<runId>` item identity, bare provider id);
#                            the observed value is diagnostic, the SCHEME is the
#                            predicate.
#     pipeline-model         one `PipelineRun` item's GRANULARITY UNIT and per-item
#                            COMPOSITION (one check run vs one pipeline; jobs
#                            synthesised per check run vs the provider's own job
#                            list). Item COUNT is diagnostic, never equality.
#     state-vocabulary       the operation's state RESOLUTION MECHANISM and outcome
#                            (signal read, refusal rule, reachable aliases) for a
#                            declared native value. Row spelling is never compared.
#     pagination-model       the read's DECLARED PAGE BOUND (or "none declared") and
#                            WHETHER A PAGE COUNT IS REPORTED. The numeric bound and
#                            count are diagnostic, never equality.
#     carrier-absent         the adapter's declared carrier arrays plus the carrier
#                            step's PARTICIPATION — the participation half OBSERVED
#                            ONLY on the pair whose operation is the carrier step
#                            (`write-comment`), `not-observable` on every other pair,
#                            and absent altogether on a declared-gap carrier pair
#                            (which is a `gap` cell and compares nothing).
#     failure-classification the API-2 class resolved from a trap-family stimulus on
#                            the family's declared operation (identity plus status
#                            presence and value), never prose.
#   OBSERVATIONS ARE PER DIMENSION PER PAIR AND MAY BE UNOBSERVABLE: each is
#   `{state: "observed", value}` or `{state: "not-observable", why}`; a
#   declared-gap pair has NO observation. `not-observable` is not agreement by
#   default — two `not-observable` agree only when BOTH report it, and
#   `observed` vs `not-observable` IS A DIFFERENCE that must be recorded. Cell
#   semantics follow: `same-as-reference` = all six agree; `gap` = no observation,
#   reason from the declaration; `declared-difference` = the entry's class set
#   names EXACTLY the differing dimensions.
#   ASSERTION-FAMILY OUTCOME AND NON-CARRIER STEP PARTICIPATION ARE NOT DIMENSIONS
#   (TDR-0036 §5.4): the assertion family is declared on the shared registry step,
#   so it is the same value in every column, and on the mock tier a step is skipped
#   only for a declared unsupported operation, the live-only deferral, or a missing
#   declared carrier. A divergence there is a DEFECT, not a provider-model fact: a
#   `declared-gap` skip on a supported operation already fails clause (a)
#   (`declaration-agreement`), and the runtime coverage gate fails a supported
#   operation with no executed step or an unexercised declared carrier. Giving them
#   a class would invent a legitimate-looking difference for an illegitimate one.
#   No phase may reintroduce them as dimensions; TC-PARITY-005 asserts that
#   flipping either produces NO parity violation.
#
# NO ADAPTER BEHAVIOUR CHANGE (NG-1, §24.3(1); pm-notes binding expectation):
#   No phase may edit `packages/adapters/src/{github,gitlab,jira}/**`, their
#   capability declarations, the closed operation set, the error table, the
#   domain kinds, the projection classes, the exit-code map, the artifact, the
#   flows/steps/assertion families, the skip-kind vocabulary, or any workflow
#   file. Where a case needs to prove EXISTING adapter behaviour it replays the
#   production client through an injected transport from `tests/**` — test-side
#   only. A task that would need an adapter change is a STOP-AND-REPORT, never a
#   quiet widening.
#
# GAP-TP-3 IS REAL WORK AND IS PLACED, NOT ASSUMED:
#   `scripts/checks/ci-topology.ts` `validate()` asserts that the pinned
#   BASH_JOBS/TS_JOBS ids are PRESENT and that the triggers target main-tools; it
#   does NOT fail when a job is ADDED and no suite pins the workflow FILE SET.
#   PHASE 5 authors the missing control as a NEW BASE-FREE structure suite —
#   `tests/structure/ci-topology-pin.test.ts` over
#   `tests/fixtures/pins/workflow-topology.json` — asserting exact file-set,
#   exact per-file job-id set (equality, not presence: this is the control that
#   does not exist), exact per-file trigger set, plus a pinned check-name
#   inventory of `tests/checks/ci-checks.test.ts` and
#   `tests/checks/conformance-workflow.test.ts`. Both delivered suites and
#   `scripts/checks/ci-topology.ts` stay UNEDITED and no workflow file, job,
#   trigger, permission, or upload moves. The control rides the EXISTING test
#   topology: `tests/structure` is discovered by `bun test` inside the existing
#   `ts-test` job (and also runs in `ts-exports`) — no new job, no new workflow,
#   no new script.
#   THE STRUCTURE PIN IS BASE-FREE BY CONSTRUCTION: the base-dependent half
#   (`ci-topology.validate(ROOT)` returning `[]`, which needs `origin/main-tools`
#   and fails closed without it) stays with the DELIVERED evidence —
#   `tests/checks/ci-checks.test.ts` under `ts-test`, which fetches the base, and
#   G7. The structure pin must import no base-reading helper: `ts-exports` runs
#   `tests/structure` and has no explicit base fetch, so the base may be absent
#   there, and a base-dependent assertion would either fail or force an
#   environment branch or a skip — both forbidden.
#   The residual "this change's diff touched no workflow file" half is
#   REVIEW-VERIFIED (test plan §3.4/§10), never dressed up as a base-ref diff
#   assertion, which `.ai/rules/testing-strategy.md` forbids.
#
# MUTATION CONTROLS ARE FIRST-CLASS (test plan §7.5; NFR-2): every gate rule and
#   every mutation has exactly one home, never a catch-all task.
#     - TC-PMUT-001..022 (22 parity mutations in three named groups): PHASE 2, in
#       `tests/conformance/parity-gate.test.ts`
#       with typed mutation builders in
#       `tests/fixtures/providers/conformance/parity/mutations.ts`. Each asserts
#       the NAMED violation (provider, operation, clause of the nine-id closed
#       clause set, and — for an observation mutation — exactly that dimension's
#       class id) AND a paired clean pass in the same case. The groups, in the
#       test plan's own taxonomy:
#         * 13 STRUCTURAL: PMUT-001..013 = M1..M11, M43, M44 (missing/duplicate/
#           extra cell, out-of-set value, out-of-set class, contradiction,
#           unregistered column, non-resolving `registerId`, orphan entry,
#           duplicate entry, a cell carrying a class, an empty class set);
#         * 6 DIMENSION: PMUT-014..019 = M47..M52 — ONE PER DIMENSION
#           (`identity-scheme`, `pipeline-model`, `state-vocabulary`,
#           `pagination-model`, `carrier-absent`, `failure-classification`), each
#           flipping ONLY that dimension's observation and asserting
#           `observed-contradiction` naming that class and no other, so 6/6
#           dimensions carry a control (NFR-2);
#         * 3 RECORD/SET RULES: PMUT-020 = M53 (`observed` vs `not-observable`, the
#           reverse, a dropped `why`, an observation on a gap pair), PMUT-021 = M54
#           (a differing dimension omitted from the class set), PMUT-022 = M55 (a
#           padded class whose dimension agrees).
#       Non-vacuity statement: a
#       mutation that stops producing its named violation is a BLOCKING finding —
#       it is never repaired by deleting the mutation or relaxing the expected
#       clause. The two exclusions are controls in their own right: flipping the
#       assertion family or a non-carrier step's participation must produce NO
#       parity violation (it fails the delivered coverage gates instead).
#     - M12/M13 (adjudication arms): PHASE 2, the two
#       adjudication arms of TC-PARITY-005/006 plus the dimension mutations above,
#       and TC-PARITY-008 runs the six per-dimension observation mutations, the
#       falsified-evidence mutation and the registered six-dimension set on
