  # ---------------------------------------------------------------------------
  # Phase 3 — Per-adapter × per-family accounting and the offline replay
  # classification (F-2 evidence).
  #
  # Goal: the taxonomy stops being a vocabulary and becomes a proven property of
  # each adapter: every one of the six families is accounted for on every adapter
  # as exactly one of `covered`, `gap-backed`, or `recorded-difference`, and every
  # non-gap posture replays through the PRODUCTION client and satisfies its
  # declared outcome. This phase owns the posture arms: a status-bearing adapter is
  # held to the status-bearing class, a status-less adapter to its evidence-backed
  # `failure-classification` recorded difference, and a read with no page bound to
  # its recorded `pagination-model` difference — with the covered arm, the
  # recorded-difference arm and the gap-backed encounter ALL exercised on EVERY run.
  #
  # Why this phase follows phase 2 (and not phase 1): DM-4's
  # `recorded-difference` posture references a DM-2 `registerId` resolving to the
  # `(adapter, operation)` entry whose CLASS SET explains the unobservability.
  # Writing the accounting before the register exists is a dangling reference and
  # TC-TAX-011 fails it by name. The VOCABULARY still landed first (phase 1), as
  # §18 requires; this phase adds per-adapter DATA and the replay that proves it,
  # and creates NO register entry — entries are phase 2's.
  #
  # Contract (F-2, DM-4, DM-3, API-2; TDR-0037 is authority; spec v1.4 DM-4):
  #   - Key set is exactly `providers(CONFORMANCE_ADAPTERS) × six families` = 18
  #     cells, derived from the registry and the exported vocabulary constant, not
  #     from a hard-coded name list. `auth-shape` is the first family id and the
  #     singular spelling is the only one that exists anywhere.
  #   - Every posture is stated AGAINST THE OPERATION THE FAMILY EXERCISES on that
  #     adapter, so a family can never be parked on a gap unrelated to what it
  #     observes. Exactly one posture per cell:
  #       `covered` — >=1 existing catalog entry in THAT provider's catalog plus
  #         >=1 resolvable fixture replayed for an operation that DECLARES THE
  #         STRUCTURE THE FAMILY OBSERVES. For `pagination-truncation` that means a
  #         DECLARED PAGE BOUND and a REPORTED PAGE COUNT. A `covered` cell whose
  #         operation lacks the observed structure is a VACUOUS `covered` and
  #         FAILS — it is never accepted because the square looks total.
  #       `gap-backed` — the family's operation appears in that adapter's
  #         `declaredGaps` with the IDENTICAL reason.
  #       `recorded-difference` — a `registerId` resolving to the
  #         `(adapter, operation)` entry, whose CLASS SET contains a class that
  #         EXPLAINS WHY THE FAMILY IS UNOBSERVABLE: `failure-classification` where
  #         the declared class is structurally unreachable, `pagination-model`
  #         where the read declares no bound. An entry whose class set does not
  #         explain the family fails naming adapter, family and the class set.
  #     No cell holds a fixture AND a gap; an unaccounted family fails naming
  #     adapter and family.
  #   - THE DELIVERED 18-CELL SQUARE IS EXPECTED DATA, asserted as a table so a
  #     silent posture change is a named failure rather than a re-read of the
  #     accounting: 9 `covered`, 7 `recorded-difference`, 2 `gap-backed` (= 18).
  #     Counted ROW BY ROW, whichever axis you read it on: GitHub 6 covered / 0
  #     recorded / 0 gap-backed; GitLab 1 covered + 4 recorded-difference + 1
  #     gap-backed; Jira 2 covered + 3 recorded-difference + 1 gap-backed. The
  #     seven recorded cells are the six status-less `failure-classification` cells
  #     (GitLab and Jira × auth-shape, rate-limit, payload-shape) plus GitLab's
  #     `pagination-model` cell; the nine covered cells are GitHub's six, GitLab's
  #     `transport-failure`, and Jira's `transport-failure` and
  #     `workflow-state-mismatch`. The totals are asserted BESIDE the cells, so a
  #     posture move that keeps the square total but shifts the mix fails naming
  #     adapter, family and the changed posture.
  #     The fixed rows (the rest is delivery-decided within each adapter's
  #     supported set, §24.4):
  #       pagination-truncation: GitHub `covered` (declared bound + reported page
  #         count on `read-pipeline-run`); GitLab `recorded-difference` through
  #         `pagination-model` on `(gitlab, read-pipeline-run)` (no bound, no page
  #         count); Jira `gap-backed` through its `provider-unsupported` gap on
  #         `read-pipeline-run`.
  #       workflow-state-mismatch: GitLab `gap-backed` on `transition-work-item`
  #         (`adapter-not-implemented`); GitHub and Jira `covered` with the
  #         zero-request refusal.
  #       auth-shape / rate-limit / payload-shape on GitLab and Jira:
  #         `recorded-difference` through `failure-classification`.
  #   - Replay classification: for every accounted cell, the stimulus is replayed
  #     through the production client factory with an injected transport, and the
  #     observed outcome equals the declared one — a class for the five error
  #     families, the bounded observation (declared bound + reported page count) for
  #     a `covered` pagination cell, the declared skip with the exact reason for
  #     `gap-backed`, and the RECORDED class for `recorded-difference`. The number
  #     of replays equals the number of non-`gap-backed` postures, so the case
  #     cannot pass by replaying nothing.
  #   - Suite-level arm invariant over EVERY posture kind: at least one `covered`
  #     cell, at least one `recorded-difference` cell and at least one
  #     `gap-backed` encounter execute on EVERY run, asserted from an
  #     arm-mutation registry independent of the accounting's contents; the three
  #     counts are ALSO read from the accounting and asserted equal to 9 / 7 / 2, so
  #     a drifting mix fails naming the posture and both numbers. A run with
  #     zero executions of any arm fails naming the missing arm. M41 (declare
  #     `covered` on a status-less adapter), M42 (record the unreachable class) and
  #     the vacuous-`covered` mutation are the falsifying controls.
  #   - The class ids never appear in a normalized view, a failure `code`, the
  #     artifact, or a diagnostic: classification is a testkit comparison, not an
  #     emitted identity.
  #
