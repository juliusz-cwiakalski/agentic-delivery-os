# PROVIDER-IDENTITY SCAN — THE BINDING CONSTRUCT DEFINITION (TDR-0039 §2, carried
#   by DM-6 and AC-F4-4; the plan cites it, it does not invent it):
#   AC-F4-4 / DM-6 name a seven-module bound set — `flows.ts`, `coverage.ts`,
#   `artifact.ts`, `harness.ts`, `parity.ts`, `tracker-error-taxonomy.ts`, and the
#   stateful double — and an enumerated permit list that includes the pinned
#   `runner.ts` derivation with exactly five provider comparisons.
#   An ADAPTER IDENTITY CONSTRUCT in a scanned module is EITHER
#   (i) a FULL-VALUE provider-name or provider-contract string literal, wherever
#       it appears — argument, record key, map key, template payload, or
#       comparison operand — so `detail.includes("jira")` still matches, or
#   (ii) a PROVIDER-DISCRIMINANT COMPARISON OR BRANCH against a provider name in
#       an `if`, `switch`, conditional, conjunction, or lookup that selects
#       behaviour.
#   EXPLICITLY NOT CONSTRUCTS, and therefore not hits: the artifact's redaction
#   labels (`{ detail: "github token" }`, `{ detail: "gitlab token" }` at
#   `artifact.ts:84-85`) and its provider-host URL patterns
#   (`/avatars\.githubusercontent\.com|secure\.gravatar\.com/` at
#   `artifact.ts:91,114`). They name a CONTENT FAMILY TO REDACT, not an adapter to
#   dispatch, and they compare no provider discriminant. This is why the delivered
#   artifact module is inside the bound set and still clean, why no artifact edit
#   is needed (AC-F1-8), and why the allowlist does not grow (NFR-10,
#   §24.3(14)).
#   THE MATRIX COLUMNS ARE NOT AN AUTHORED HOME: `parity.ts` derives every column
#   value from `CONFORMANCE_ADAPTERS` (mapping `registration.provider`), so the
#   module authors no provider-name key, no lookup operand and no comparison. In a
#   control run the same derivation applies to the injected adapter list. A
#   hand-authored column key is an identity construct and fails the scan.
#   Phase 5's TC-REG-004 binds that definition and keeps it non-vacuous: seven
#   planted full-value literals (one per bound module), a sixth
#   `addressing.provider === …` in `runner.ts`, and a hand-authored `github` /
#   `gitlab` / `jira` column key in `parity.ts` each fail naming file and
#   construct; a wildcard or prefix allowance is rejected by assertion; and an
#   artifact redaction label and a provider-host regex are positively asserted NOT
#   to be reported, so the definition's exclusions are tested rather than assumed.
