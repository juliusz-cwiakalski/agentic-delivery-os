  - text: "RETRO (phase primitive defect, lifecycle phase 7): committing the
      reconciled docs required `commit --phase delivery`, which short-circuits
      to a no-op once `delivery` is completed. Reopening `delivery` and
      committing worked (4079cca3), but the paired `phase complete delivery`
      then reported `no-op / already-completed` while reading the PRE-reopen
      completion, and it rewrote the pm-notes mirror with the registry's
      `started` value in the `completed` field (15:10:39.032Z instead of
      15:40:11.809Z), leaving the working tree contradicting both HEAD and the
      registry. The registry stayed correct (delivery started 15:10:39.032Z,
      completed 15:40:11.809Z), so the repair was restoring the committed bytes.
      Two defects worth a follow-up ticket: (a) `phase complete` after a reopen
      must not read the stale completion flag; (b) the phase-completion write
      path must never put a started value into a completed field. Process note:
      stage documentation under the phase that owns it BEFORE completing that
      phase, or complete `system_spec_update` first and let the doc commit ride
      it."
