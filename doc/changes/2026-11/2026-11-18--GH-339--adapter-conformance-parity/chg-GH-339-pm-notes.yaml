decisions:
  - text: "Scope is taken from the ticket body plus the committed M3 blueprint
      (doc/planning/oss-tooling/milestones/m3/README.md §M3-S5, contracts.md
      §Conformance): extend the M0-S20 adapter conformance suite to the tracker
      primitives, add a typed error taxonomy and trap catalogs per adapter, add
      a simulated tracker double for offline CI, and add a parity matrix gate in
      CI. M3-S5 is the harness the later adapters (M3-S2 Jira, M3-S3 GitLab) are
      built against; it does not implement those adapters."
    date: "2026-11-18"
  - text: "No M3 delivery question (#342) carries an answer, so the stated defaults
      apply for any phase that reaches them. Relevant here: Q-03 credential
      names (`GITHUB_TOKEN`, `GITLAB_TOKEN`, `JIRA_URL`/`JIRA_USER`/
      `JIRA_TOKEN`) and Q-07 bounded pipeline evidence (status, failed job name,
      bounded log excerpt, durations). Adapter completion itself is M3-S2/S3/S4,
      not this change."
    date: "2026-11-18"
  - text: "Cross-reference hygiene: doc/planning/oss-tooling/cli-command-registry.md
      maps `ados policy` to M3-S5 and TDR-0006 §succession names 'the policy
      engine (M3-S5)'. The M3 rework (GH-333) redefined M3-S5 as this
      conformance suite. The policy engine is out of scope; the decision whether
      to restate those stale pointers is a documentation-reconciliation question
      for phase 7, not a scope claim for this change."
    date: "2026-11-18"
open_questions: []
blockers: []
notes:
  - text: "Clarify-scope current-state facts (read 2026-11-18): the M0-S20 suite
      exists in `packages/testkit/src/conformance/` with a three-flow,
      fourteen-step registry over the nine closed adapter operations
      (`flows.ts`), capability gating and structural/runtime coverage gates
      (`coverage.ts`), a registry of exactly the three shipped contracts
      (`adapters.ts`), declarative exact-url stateless mock tenants
      (`mock-tenant.ts` + `tests/fixtures/providers/conformance/*/tenant.json`),
      the `delivery.conformance.v1` artifact (`artifact.ts`), a scheduled
      read-only live tier, and the harness conformance registry (`harness.ts`).
      Per-adapter trap catalogs live with the provider client seeds. The parity
      suite's evidence lives in `tests/conformance/*` plus
      `tests/structure/conformance-coverage.test.ts` and
      `tests/checks/conformance-workflow.test.ts`."
    type: info
    date: "2026-11-18"
  - text: "Clarify-scope gap analysis against AC ('the suite fails on undeclared
      behavior differences; new adapters plug in without lifecycle changes'):
      (a) there is no declared cross-adapter parity matrix and no gate that
      fails when an adapter's declared capability/behavior differs from the
      reference without a recorded difference; coverage.ts validates each
      adapter's own deck, not parity across adapters; (b) the mock tenant is
      stateless exact-url replay (tests/behaviour/providers/support.ts owns the
      only stateful single-issue transport), so there is no simulated tracker
      double for offline write-then-read flows; (c) tracker-error trap coverage
      (rate limits, auth shapes, pagination truncation, workflow-state
      mismatches) is scattered in provider unit suites rather than a
      conformance-level catalog; (d) extensibility is proven by structure tests
      over the three shipped contracts, not by a registration-only plug-in
      proof. These four are the presumptive change surface; the spec must pin
      each one."
    type: info
    date: "2026-11-18"
  - text: "Doc-impact risks for phase 7:
      doc/spec/features/feature-adapter-conformance.md is the primary
      current-truth surface (registry, capability gating, coverage gates, mock
      tier, live tier, artifact contract, CI topology statement);
      feature-provider-client-seeds.md carries the trap-catalog contract;
      feature-adapter-ports.md carries the operation/capability vocabulary;
      feature-adapter-reference-behavior.md carries the declared-difference
      posture; doc/spec/features/feature-quality-gates-and-pr.md and the CI
      topology statement in feature-adapter-conformance.md §Security constrain
      how a parity gate may enter CI; doc/overview/glossary.md and
      doc/00-index.md may need entries. Constraint to respect: the M0-S20 spec
      states that no workflow job is added to the pinned CI topology, so a CI
      parity gate should ride the existing TypeScript test job unless the spec
      justifies otherwise."
    type: risk
    date: "2026-11-18"
  - text: "Operational prerequisite recorded at clarify_scope: the typed CLI does
      not run from an unbuilt workspace (`pnpm exec jaiship` failed with `Cannot
      find module '@delivery-os/adapters/credentials'` because packages/*/dist
      was absent). `TMPDIR=$PWD/tmp/tmpdir pnpm build` (exit 0, 6/6 packages)
      precedes every jaiship invocation in this change, and gate commands keep
      the TMPDIR=$PWD/tmp/tmpdir convention the ticket requires."
    type: info
    date: "2026-11-18"
  - text: "RETRO (clarify_scope): the transition landed as d804f27a, but the commit
      primitive's template subject is width-truncated with a literal U+2026
      (`docs(GH-339): update
      doc/changes/2026-11/2026-11-18--GH-339--adapter-co…`, 75 bytes incl.
      newline, cut mid-word). No message was composed by hand. Expect the
      phase-9 range gate to name this; remediation belongs to @coder in the mode
      the gate reports. Also observed: the transition created no `events.jsonl`
      capsule file (the typed registry record landed; the folder holds only the
      pm-notes document). Neither finding changes the phase outcome."
    type: retro
    date: "2026-11-18"
  - text: "Specification complete (chg-GH-339-spec.md, 592 lines, 34 unique ACs).
      Surface: F-1 declared parity matrix over the nine closed operations with a
      declared reference adapter, a closed six-class difference vocabulary, a
      bidirectional difference register and a three-way gate (matrix, capability
      declaration, observed conformance outcome); F-2 conformance-level tracker
      error taxonomy mapping the milestone's four class ids onto delivered
      structured identities plus a six-family trap vocabulary with per-adapter
      accounting; F-3 a runtime-neutral simulated stateful tracker double with
      five declared effects and additive tenant state; F-4 registration-only
      extensibility proven by an identity-free core invariant plus an injected
      synthetic control registration; F-5 the gate riding the existing
      TypeScript test job. Decisions: DEC-1..DEC-4 cite TDR-0036..TDR-0039;
      DEC-5 records the gate riding pnpm test in ts-test with no workflow
      change; DEC-6 records the additive non-decisions."
    type: info
    date: "2026-11-18"
  - text: "Binding expectation for delivery (phases 6-9): no adapter behavior
      changes. The five non-reference supported intersections (GitLab
      read-delivery-request, GitLab read-pipeline-run, Jira read-work-item, Jira
      write-work-item, Jira transition-work-item) are ADJUDICATED during
      delivery — recorded as same-as-reference or as evidence-bearing declared
      differences, never converged. Invariants the plan may not widen: 0 new
      closed operations, 0 error-table rows or domain kinds, 0 artifact fields,
      0 workflow files/jobs/triggers, 0 new emitted tracker.* codes, trap
      entries stay four-field, the shipped registry stays three contracts,
      testkit stays runtime-neutral."
    type: risk
    date: "2026-11-18"
  - text: "Staging note: the four decision records TDR-0036..TDR-0039 and the
      doc/decisions/00-index.md rows live outside the change folder, and a
      non-delivery phase completion stages only the change folder. They are
      therefore untracked after the specification commit by design (the GH-338
      precedent): the implementation plan must declare them in an early delivery
      phase's scope so @coder lands them on the branch, and the DoD check must
      confirm they are committed before the PR."
    type: info
    date: "2026-11-18"
  - text: "RETRO (specification): the first draft asserted 'no tracker. literal
      appears in production source outside the taxonomy module', which is false
      — packages/core/src/contracts/status.ts, contracts/doctor.ts,
      domain/status.ts and domain/doctor.ts already carry eight pre-existing
      tracker.* vocabulary codes. Caught by PM review before the phase closed
      and restated as an exact two-tree scan (packages/testkit +
      packages/adapters) with a single-file allowlist and the core vocabulary
      declared out of scope. Process note for later stories: an absolute absence
      claim must name its scan scope and its allowlist in the first draft,
      because a repo-wide 'nowhere' claim is almost always wrong in this
      codebase."
    type: retro
    date: "2026-11-18"
