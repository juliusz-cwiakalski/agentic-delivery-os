  - text: "RETRO (DoR iterations 2-3): the pattern that cost the most was
      terminology drift between an amended decision record and the artifacts
      that cite it — each amendment fixed one layer and left 'four dimensions'
      or 'truncation signal' alive in another, which the next gate then read as
      a new blocking finding. Process fix: after amending a record, sweep every
      citing artifact for the retired terms in the same pass and quote the
      record's exact normative sentences rather than paraphrasing them. Second
      pattern: an observation dimension is worthless unless its oracle names the
      delivered field, the operation, and the comparison predicate — two of the
      three iteration-1 blockers were exactly that."
    type: retro
