  - text: "DoR gate iteration 1 = NOT_READY (readiness-review/readiness-iter-1.md).
      Ten facets: plan_coverage, test_traceability and decision_capture PASS;
      three facets FAIL on artifact/code contradictions. Five blocking, seven
      major, two nits. Reopened specification, test_planning and
      delivery_planning. Blocking: (1) pagination-truncation has no truthful
      posture on GitLab (its pipeline read has no bound, no per_page and no
      truncation signal, both supported operations are supported so gap-backed
      is unavailable, and recorded-difference is restricted to
      failure-classification while the honest class is pagination-model); (2)
      appended trap-catalog entries cannot replay green without editing the
      three provider trap suites, which no phase declares; (3) TC-PARITY-005's
      four-dimension comparison has no source — ConformanceStepResult carries no
      assertionFamily and no truncation signal, and adding one would break
      AC-F1-8; (4) TC-REG-002 still prescribes the module-fingerprint mechanism
      the plan correctly rejected; (5) TC-GATE-002 item (iv) is placed in
      tests/structure although ci-topology.validate fails closed without
      origin/main-tools and that tier also runs in ts-exports."
    type: info
    date: "2026-11-18"
  - text: "PM direction for the NOT_READY remediation (bounded, so the authors do
      not re-open settled scope): (a) findings 1 and 12 are one defect — a cell
      can differ on more than one dimension while the register admits exactly
      one class. Direction: a register entry carries a NON-EMPTY SET of classes
      from the closed vocabulary (each naming a differing dimension), the cell
      keeps a single value, and the pagination-truncation family may be
      accounted recorded-difference by reference to the entry whose class set
      names the pagination model. @decision-advisor amends TDR-0036 first; the
      spec follows. (b) Finding 2 is a scope omission, not a design change: the
      three provider trap suites join phase 1 as append-only edits (no delivered
      assertion removed, renamed or relaxed) and the 'unedited' wording becomes
      'extended append-only'. (c) Finding 3 is an input-definition defect: the
      gate's observed-outcome input is a gate-local observation record built
      from the report plus the flow registry plus committed evidence, never a
      new artifact field. (d) Findings 4-5 are test-plan text corrections to the
      mechanisms the plan already bound. (e) Findings 6-11 are binding-artifact
      wording: the identity-construct definition and column representation move
      into AC-F4-4 / DM-6 / TDR-0039; the clause ids are enumerated in API-1
      against TDR-0036; AC-F2-11 gains 'over the family-wired subset'; AC-F2-4
      constrains the rate-limit fixture away from 401/403 or records the
      throttle case; TDR-0037 C-1 adopts the exact two-tree scan; TDR-0036
      states structured violations."
    type: decision
    date: "2026-11-18"
  - text: "RETRO (DoR iteration 1): three of five blocking findings are the same
      class of defect the earlier spec review caught — an AC or gate that
      asserts a dimension the delivered report does not carry (no
      assertionFamily, no truncation signal), and an accounting vocabulary with
      no honest posture for one adapter. Both passed two author passes and a PM
      review because every claim was checked against the *spec's own* vocabulary
      rather than against the delivered types. Process fix for later stories:
      any AC that asserts an observation must name the delivered field that
      carries it, and any per-adapter matrix must be walked cell-by-cell against
      the actual adapter capabilities before the DoR gate, not after."
    type: retro
    date: "2026-11-18"
  - text: "DoR gate iteration 2 = NOT_READY (readiness-review/readiness-iter-2.md).
      Eleven of thirteen iteration-1 findings resolved; one persistent in
      narrowed form and one new. Persistent: the parity basis declares four
      dimensions but maps six difference classes many-to-one, so
      identity-scheme, pipeline-model and state-vocabulary land on
      'assertion-family outcome' — a dimension whose observable is family plus
      pass/fail, which normalization makes equal by construction. That makes
      AC-F1-6 unsatisfiable for three classes and leaves two of the four
      dimensions without a non-vacuity control. New: the 18-cell square totals
      are wrong — the enumerated table yields 9 covered / 7 recorded-difference
      / 2 gap-backed, not the 10/6/2 asserted in five places (GitHub 6 covered;
      GitLab 1 covered / 4 RD / 1 gap; Jira 2 covered / 3 RD / 1 gap)."
    type: info
    date: "2026-11-18"
  - text: "PM direction for DoR iteration 2 remediation: replace the four-dimension
      parity basis with a SIX-dimension basis in which each closed difference
      class is exactly one parity dimension with its own offline-observable
      oracle (identity form; pipeline cardinality and shape; state-resolution
      outcome; declared bound plus reported count; carrier declaration plus
      carrier-step participation; API-2 failure classification).
      same-as-reference then means all six observations agree. The class
      vocabulary, cell vocabulary, entry key, bijection rules and nine clause
      ids stay unchanged, and AC-F1-6 becomes true by construction. The 9/7/2
      totals are a mechanical correction in the test plan and the plan.
      @decision-advisor amends TDR-0036 first; spec, test plan and plan follow.
      This is the last remediation iteration before escalation."
    type: decision
    date: "2026-11-18"
