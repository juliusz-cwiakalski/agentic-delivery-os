findings:
  - id: F-1
    severity: major
    confidence: high
    category: spec-compliance
    location: "tests/fixtures/providers/conformance/parity/observation-record.json:1 + tests/fixtures/providers/conformance/parity/evidence/*.json:1 + packages/testkit/src/conformance/parity.ts:871"
    message: >
      The gate-local observation record and the nine per-class evidence documents
      are hand-authored JSON. The evidence fixtures only restate the pair
      (referenceValue/adapterValue + a decorative `reproduces: true`), and the
      gate's evidence-reproduction clause compares those values against the same
      hand-authored observation record. Only pagination-model (TC-TAX-008 replay)
      and failure-classification (TC-TAX-003..007 replay) are corroborated by a
      live replay; identity-scheme, pipeline-model, state-vocabulary and
      carrier-absent are not derived from a read and are not tied to any
      delivered-behaviour test. Spec RSK-11 ("stale evidence fails") is therefore
      weaker than stated for those four dimensions: an adapter behaviour drift on
      them would leave the gate green because the record is static. This follows
      the spec's "declared evidence reviewed like any other declared surface"
      framing, so it is not a blocker, but it narrows the "proven, not asserted"
      claim.
    suggestion: >
      Add one cross-check test that replays each supported (adapter, operation)
      pair through the production client and asserts the observation record's
      identity-scheme / state-vocabulary / pipeline-model / carrier-absent values
      equal the replayed normalized read (as TC-TAX-008 already does for
      pagination), so a stale record fails by name. Alternatively, derive the
      record in-test from the replay rather than from a static fixture.
  - id: F-2
    severity: major
    confidence: high
    category: test-coverage
    location: "packages/testkit/src/conformance/parity.ts:617-709 (register loop) + tests/conformance/parity-gate.test.ts:184"
    message: >
      The test plan's TC-PARITY-004 requires case-level mutations for an empty
      rationale, a missing/empty adjudicatedBy, and an unresolvable evidence
      pointer, each failing naming the field/differenceId/class. None is
      implemented, and the reusable gate has no rule for them: parityViolations
      never reads `entry.rationale` or `entry.adjudicatedBy`, and it only checks
      that an evidence path string is non-empty (it cannot resolve paths, being
      runtime-neutral). The committed matrix is well-formed and TC-PARITY-004
      asserts `rationale.trim().length > 0` / `adjudicatedBy.trim().length > 0`
      over it, so the delivered data satisfies AC-F1-4 — but the mandated
      non-vacuity controls are absent and a programmatic consumer of the gate
      would accept a malformed entry.
    suggestion: >
      Add two register-loop checks in parityViolations (an empty rationale and an
      empty adjudicatedBy, reported under an existing clause such as
      register-bijection or difference-class), plus the three TC-PARITY-004
      mutations. For the unresolvable-pointer case, assert the resolution in the
      suite (existsSync over the mutated path), since the gate itself is
      filesystem-free.
  - id: F-3
    severity: major
    confidence: high
    category: spec-compliance
    location: "tests/conformance/control-registration.test.ts:76-85 + tests/fixtures/providers/conformance/control/column.ts:92-99"
    message: >
      AC-F4-2 requires the synthetic control to show "full family accounting".
      The control declares six postures, all `covered`, but the proof is a
      trap-name token scan (CONTROL_FAMILY_ACCOUNTING vs trapName substrings), not
      the delivered accounting engine used for the shipped adapters. The control
      supports only read-work-item and its trap catalog entries all point at the
      same tenant route, so `pagination-truncation` and `workflow-state-mismatch`
      cannot be `covered` under DM-4's definition (a committed fixture replayed
      for an operation that declares the observed structure). The six `covered`
      postures are therefore inconsistent with the control's capability
      declaration and pass only because the real accounting rules are not applied
      to the control.
    suggestion: >
      Apply the delivered accounting validator (generalised to a passed-in
      adapter list) to the control, or declare honest postures — `gap-backed`
      for the families whose operation the control declares unsupported — so the
      control's accounting is non-vacuous. Keep one mutation that removes an
      item and fails by name (already TC-REG-006).
  - id: F-4
    severity: minor
    confidence: high
    category: spec-compliance
    location: "tests/fixtures/providers/conformance/parity/identity-scan-allowlist.json:21-33 + tests/structure/registration-participation.test.ts:107-116"
    message: >
      The allowlist pins runner.ts by construct AND count (exactly five
      provider-comparisons) but pins mock-tenant.ts only by (file, construct),
      with no count. A new provider-discriminant branch added anywhere in
      mock-tenant.ts would be absorbed silently. The doc
      (feature-adapter-conformance.md) says the scan "cannot absorb a new branch
      quietly", which overclaims for mock-tenant.
    suggestion: >
      Record a `count` for the mock-tenant permits and assert equality, as the
      runner permit already does, or narrow the mock-tenant permit to the
      addressing-decode function; then align the doc sentence.
  - id: F-5
    severity: minor
    confidence: high
    category: test-coverage
    location: "tests/behaviour/providers/github-trap.test.ts:795 (familyFixture) + gitlab-trap.test.ts:293 + jira-trap.test.ts:309"
    message: >
      The append-only trap-suite assertions for the appended catalog entries
      (GH339-*/GL339-*/JIRA339-*) only validate the fixture's provenance marker
      and that its `expected.classification` is a declared class; they do not
      replay the stimulus. The genuine replay/classification proof lives in
      tests/conformance/{tracker-taxonomy,family-classification}.test.ts. The
      test plan wording ("replayed green by its provider suite through a NEW
      assertion") overstates what the trap-suite assertion does.
    suggestion: >
      Either have familyFixture replay the stimulus and assert the class (it
      already has the fixture), or reword the plan/test-plan to say the trap
      entry's assertion is a fixture-integrity check while the classification
      replay is owned by the conformance family suite.
  - id: F-6
    severity: minor
    confidence: medium
    category: correctness
    location: "packages/testkit/src/conformance/parity.ts:269-287"
    message: >
      buildParityMatrix binds AUTHORED_COLUMNS positionally to the registration
      list (`AUTHORED_COLUMNS[index]`), so its comment "reused for the control
      run" is inaccurate (the control test builds its own matrix). Reordering the
      registration list would attach GitLab's/Jira's authored cells to the wrong
      provider. The gate's declaration-agreement clause would then catch it, so
      it is not silent, but the helper is a latent footgun and the comment
      misleads.
    suggestion: >
      Key the authored columns by a stable non-provider discriminator (e.g. the
      registration's adapterName isn't allowed either since it is a provider
      name) — or drop the "reused for the control run" comment and document that
      the authored columns are positional and must stay aligned with
      CONFORMANCE_ADAPTERS order, with a structure test pinning that order.
  - id: F-7
    severity: minor
    confidence: high
    category: correctness
    location: "packages/testkit/src/conformance/tracker-error-taxonomy.ts:106-117"
    message: >
      TrackerObservableOutcome carries an `undecodable?: boolean` on the `status`
      variant, but classifyTrackerOutcome never reads it — an undecodable 2xx
      falls through to the final `tracker.payload.invalid` return only by
      position, and an (impossible) undecodable 401 would classify as
      auth.rejected. The discriminant is effectively dead and its intent is
      unenforced.
    suggestion: >
      Either remove `undecodable` (the fall-through already yields payload.invalid
      for non-401/403) or make it explicit: if `undecodable` is true, return
      tracker.payload.invalid before the 401/403 branch, and add a case.
  - id: F-8
    severity: minor
    confidence: high
    category: plan-compliance
    location: "commit 54b80eab (plan phase 6)"
    message: >
      Phase 6's declared scope lists the doc files and the change folder only,
      but its commit also edited packages/testkit/src/conformance/parity.ts
      (constant substitution), tracker-error-taxonomy.ts (named class-id
      constants) and tests/structure/content-inventory.test.ts. These paths are
      declared in earlier phases (1/2/5) but not phase 6, and the plan records
      only trap-catalog.test.ts (discovery k) and privacy-release.test.ts
      (discovery l) as undeclared-path edits. No behaviour change (pure constant
      substitution, additive allowlist entries), but a strict per-phase scope
      audit reports drift.
    suggestion: >
      Record the parity.ts / tracker-error-taxonomy.ts / content-inventory.test.ts
      edits as a phase-6 discovery note, or move them to the phase that owns
      those files, so the phase->file binding is exact.
  - id: F-9
    severity: info
    confidence: high
    category: spec-compliance
    location: "tests/fixtures/providers/conformance/parity/adjudication.json:145-212"
    message: >
      The two Jira write cells are `same-as-reference` purely by agreement of
      `not-observable` observations (five dimensions) plus identical empty carrier
      arrays; no write behaviour is actually compared. This is the spec's declared
      scope and the adjudication record states it honestly ("no provider
      divergence is claimed"), so it is correct — recorded here so a reader does
      not mistake "same as reference" for an observed behavioural equivalence.
    suggestion: "No action; keep the honest rationale."
  - id: F-10
    severity: info
    confidence: medium
    category: correctness
    location: "packages/testkit/src/conformance/parity.ts:561-611"
    message: >
      For a `gap` cell whose operation is neither supported nor present in
      declaredGaps, the gate emits nothing (it only compares the reason when a
      declared gap exists). This relies on the structural coverage gate rejecting
      such a declaration first; it is not independently caught by the parity gate.
    suggestion: "Optional: treat a gap cell with no declared gap reason as a declaration-agreement violation, for defence in depth."
