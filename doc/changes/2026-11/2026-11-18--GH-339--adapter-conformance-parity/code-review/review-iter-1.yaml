reviewer_notes: |
  Verdict rationale: 0 blockers, 3 majors, so PASS_WITH_NOTES. Every one of the
  34 ACs is backed by real code plus a passing oracle; the majors are integrity /
  non-vacuity gaps, not functional failures of the delivered shipped-adapter
  property.

  The strongest parts: the family accounting is genuinely replayed
  (tracker-taxonomy TC-TAX-003..008 and family-classification replay all 16
  non-gap cells through the production clients and assert the recorded class);
  the double is deterministic and fail-closed with a committed golden; the
  gate's structural mutation set plus per-dimension observation mutations are
  real and each names its provider/operation/clause; and the artifact-invariance
  and CI-topology pins are concrete (not diff-based).

  The three majors, in priority order: F-1 (declared observation/evidence not
  replay-derived for 4 dimensions), F-2 (TC-PARITY-004's named mutations absent;
  gate has no rationale/adjudication rule), F-3 (control adapter's "full family
  accounting" is a token scan).

  Honest adjudications confirmed: the GitLab read-delivery-request
  failure-classification difference says "unobservable on the reference"; the two
  Jira write cells say "same as reference by agreement of not-observable
  observations"; no provider was converged to force a same-as-reference verdict.

  Non-goals confirmed by the diff: no packages/adapters, packages/core, or
  .github/workflows changes; testkit package.json/lockfile untouched (no new
  subpath or dependency); artifact.ts untouched.

  Test plan / scope deviations: the test-plan TC-PARITY-005 fixture description
  ("replayed to obtain the normalized results") is not met — the delivered test
  loads a static record (F-1); TC-PARITY-004's enumerated mutations are not
  implemented (F-2); phase 6 crossed into earlier-phase files (F-8).
