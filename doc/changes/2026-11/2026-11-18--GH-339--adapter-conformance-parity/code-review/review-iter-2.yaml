  Judge answers:
  1. Majors closed: yes; each control fails on its mutation, and the control
     accounting is now the delivered DM-4 engine over the control's own list.
  2. No guard weakened / no test deleted / no assertion made vacuous: confirmed
     by diff comparison with iteration 1.
  3. New gate rules: shipped matrix passes (clean()), malformed entries fail
     (empty rationale, missing adjudication, unresolvable evidence); the
     resolvesEvidence port keeps the gate pure and runtime-neutral.
  4. undecodable-before-401/403: consistent across code
     (tracker-error-taxonomy.ts:140), docs (feature-adapter-conformance.md), and
     the test (tracker-taxonomy.test.ts TC-TAX-009).
  5. Docs describe delivered behaviour: yes, including the resolver port, the
     clause responsibilities, the occurrence-count pinning, and the control's
     postures; no overclaim found.
  6. New defects: no dead code, no determinism loss, no hidden I/O in testkit, no
     boundary violation (tests/boundaries green); the only type-level nit is the
