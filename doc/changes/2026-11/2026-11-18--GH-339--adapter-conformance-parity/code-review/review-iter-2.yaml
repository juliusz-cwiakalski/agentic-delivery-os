findings:
  - id: NF-1
    severity: minor
    confidence: high
    category: spec-compliance
    location: "tests/conformance/control-registration.test.ts:134-153 + tests/fixtures/providers/conformance/control/column.ts:99-... + control/tenant.json:23-34"
    message: >
      The control's four `covered` postures all point at one generic tenant
      fixture whose single route returns 200 (no 401/429/transport-failure/undecodable
      stimulus), and the control's client builder is a stub that never replays the
      tenant. The DM-4 accounting validator checks `covered` structurally
      (supported operation + existing catalog entry + existing fixture), so it
      accepts them — the same structural check the shipped adapters pass — but the
      shipped adapters' `covered` is separately replay-proven in
      family-classification.test.ts, while the control is not replayed anywhere.
      So the control's "covered" is a structural claim, not a replayed one.
    suggestion: >
      Give the control one per-family stimulus fixture for each covered family (or
      reuse the committed family fixtures) and add a small replay assertion, or
      state explicitly in the doc that the control's covered postures are
      structural (its catalog + fixture exist) rather than replayed.
  - id: NF-2
    severity: minor
    confidence: high
    category: correctness
    location: "packages/testkit/src/conformance/parity.ts:795-812"
    message: >
      The new unresolvable-evidence violation sets `evidence: evidencePath` — the
      path that does not resolve — so that record's `evidence` is not a "resolving
      fixture or evidence reference" under AC-F5-2/NFR-11, unlike every other
      violation (which uses evidenceFor(entry) or a register differenceId). A
      consumer that validates every violation's evidence reference (as the wiring
      test's referenceResolves does for the induced set) would reject it.
    suggestion: >
      Use evidenceFor(entry) (the entry's first resolving class evidence) or the
      register differenceId as the `evidence` field, and keep the offending path
      in `received`/`detail`.
  - id: NF-3
    severity: info
    confidence: high
    category: spec-compliance
    location: "packages/testkit/src/conformance/parity.ts:11-13"
    message: >
      The F-6 fix makes parity.ts import and reference the three provider-contract
      constants (GITHUB/GITLAB/JIRA_ADAPTER_CONTRACT) as identifiers. The
      identity-construct scan detects only full-value provider-name/contract
      string literals and provider-discriminant comparisons, so it cannot see
      these. This is within the permitted "parity matrix's columns" home and the
      doc now says columns are "bound to its imported contract", so it is not an
      overclaim — but the "identity-free parity engine" guarantee is now
      "no provider-name literal or comparison", not "no provider identity".
    suggestion: "No action required; optionally state the contract-identifier binding explicitly in the participation section so the distinction is obvious."
  - id: NF-4
    severity: info
    confidence: high
    category: process
    location: "doc/changes/2026-11/2026-11-18--GH-339--adapter-conformance-parity/chg-GH-339-pm-notes.yaml:13"
    message: >
      The review_fix lifecycle phase is still { started: null, completed: null }
      and no pm-notes note records the remediation commits (ab1bc9d8, a11d2301).
      Expected to be recorded when @pm completes review_fix after this PASS; noted
      so it is not silently lost.
    suggestion: "Record review_fix completion with the remediation commit hashes and the re-review verdict as a pm-notes entry before advancing to quality_gates."
