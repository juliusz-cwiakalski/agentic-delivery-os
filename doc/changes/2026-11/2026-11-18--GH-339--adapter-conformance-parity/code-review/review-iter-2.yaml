  and are structural rather than replay-proven; the unresolvable-evidence
  violation's evidence field is the offending path; parity.ts now references
  three imported contract identifiers the string-literal scan cannot see). No
  blocker and no major remains; F-5 (accepted) and F-8 (acknowledged) persist by
  decision. Verdict PASS_WITH_NOTES.
