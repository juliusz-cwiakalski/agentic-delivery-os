findings:
  - id: F-1
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/state/telemetry.ts:411
    message: >
      The sibling single-family read readTelemetrySteps still tears
      state.store.torn on any foreign step key, and it is a delivered spend
      surface: packages/cli/src/edge.ts:6390 (windowEvidence) composes it, so
      `spend --window-evidence` on a multi-ref ledger hard-fails with the exact
      ticket symptom; readTelemetryStepsAtVersion (telemetry.ts:482, the
      re-read/migration rule) composes the same tearing read. Spec A-4 ("all
      three spend-side consumers compose the one families read") is factually
      incomplete, and spec §22's claim that the per-ref skip rule is "now
      stated twice in delivered code" ignores two same-module per-ref reads
      that contradict it. The ticket names readTelemetryFamilies as the seam,
      so the delivered scope is faithful to the ticket's letter — this is a
      residual of the same class, not a defect in this diff.
    suggestion: >
      Do not widen this change (DEC-3/NG-6 freeze the scope). Record the
      residual in spec §7.3 and file a follow-up defect ticket for the
      window-evidence/re-read reads so the house rule's documentation claim
      becomes true; no code action in this change.
  - id: F-2
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/state/telemetry.ts:529
    message: >
      readTelemetryBaselines still tears on foreign baseline keys, and
      appendTelemetryBaseline composes it twice — the idempotency pre-read
      (L529) and the post-append verification (L550). In any project holding
      another ref's baseline, a second ref's baseline capture fails every time,
      so the write side of the telemetry family remains single-ref-only. The
      delivery discovered and proved this (its own fixtures must bypass the
      helper via seedBaselineBatch, tests/fixtures/telemetry/index.ts:676, and
      pm-notes phase 1 documents it), but spec NG-3's premise "the capture path
      ... [is] already ref-scoped and delivered correct" is factually wrong for
      this pre-read, and neither §7.3 (deferred) nor §22 declares the residual.
    suggestion: >
      Same disposition as F-1: declare the write-path residual in spec §7.3,
      file a follow-up ticket for the baseline idempotency pre-read (a
      write-side change), and correct NG-3's premise in the phase-7 doc
      reconciliation follow-through. No code action in this change.
