decisions:
  - text: "Scope is the ticket body plus the committed M4 backlog row M4-S12 and the
      flip-plan F1 split rationale: the four per-ref operator queries (`status`,
      `log`, `is-delivering`, `last-message`), bounded per-ref log persistence,
      and one command family with `--json`. GH-347's F1a core parity (durable
      lane, resume, admission, derivation) is the data source and is out of
      scope, as is the shell entry point's retirement."
    date: "2026-11-19"
  - text: "PM-decided (non-blocking interpretation): the ticket's
      `is-delivering`/is-delivering phrasing is read as one query with two
      admissible forms inherited from the shell surface — a per-ref form and a
      repo-wide form with no ref. Both must answer; the AC's three lifecycle
      states (live, finished, absent) apply to the per-ref form. Rationale: the
      shell `--is-delivering [REF]` is the parity reference and `ceo-loop`
      consumes the ref-less form."
    date: "2026-11-19"
  - text: "PM-decided (non-blocking interpretation): `status` reports `marker` from
      the durable `dispatch.lane` record's state (active/terminal) — the typed
      path has no delivering-marker file and this change does not add one.
      Rationale: TDR-0049 makes the lane record the single resumable-state
      artifact; a second marker file would be a second truth source."
    date: "2026-11-19"
  - text: "Branch/PR conventions: branch `feat/GH-354/dispatch-operator-surface`
      from `main-tools`; PR targets `main-tools`; the PR stays open (merge
      authority is the CEO / human)."
    date: "2026-11-19"
open_questions: []
blockers: []
notes:
  - text: "Operational trap (hit 2026-11-19): the commit primitive's template
      subject carries the plan phase summary, and `validateCommitMessage`
      rejects any tracker-like token other than the resolved ref. A phase-1
      summary naming `TDR-0056` therefore aborted both `phase complete
      delivery_planning` and a standalone `commit GH-354` with
      `commit.commitlint-failed: invented tracker references are not allowed:
      TDR-0056` (the same trap recorded in GH-275 and GH-322). Remediation:
      phase summaries must not contain decision-record ids; the summary now says
      'land the governing decision record'. No contract change — this is a
      message-authoring constraint."
    type: retro
    date: "2026-11-19"
  - text: "Intake state (verified 2026-11-19): issue GH-354 open, label `change`,
      milestone `M4: Jaiship-native delivery`, zero comments; no open or closed
      PR for the branch; branch existed at the `origin/main-tools` tip
      (bd95665b) with 0 commits ahead and a clean worktree; no GH-354 change
      folder."
    type: info
    date: "2026-11-19"
  - text: "Clarify-scope current state: the durable lane record is delivered — kind
      `dispatch.lane`, schema `delivery.dispatch.lane.v1`, key prefix
      `dispatch.lanes:` (packages/core/src/contracts/dispatch.ts:572-574), with
      active/terminal states and latest-wins reads. Attempt records carry
      `sessionIds`. The dispatch command family today exposes `run`, `attempts`,
      `dual-run summary|resolve`, and `handover` only; none of the four operator
      queries exists. No raw harness stdout is persisted per ref, and the typed
      path has no transcript read, so `log` persistence and `last-message`
      sourcing are genuine design decisions for the spec, not wiring."
    type: info
    date: "2026-11-19"
  - text: "Parity reference for the authors (shell lane on main-tools):
      `scripts/deliver-ticket.sh --is-delivering [REF]` exits 0 when a delivery
      is in progress and prints nothing; `--last-message REF` prints the stored
      PM final message without running; per-ref PM stdout accumulates in
      `tmp/deliver-ticket/<ref>.pm.out` and the final message is persisted to
      `.ai/local/delivery/<ref>.last-message`; the delivering marker lives at
      `.ai/local/delivery/delivering`. The typed equivalents must not read or
      execute any shell script (ticket AC)."
    type: info
    date: "2026-11-19"
  - text: "Doc-impact risks for phase 7:
      doc/spec/features/feature-dispatch-engine.md (command table, one-shot
      flow, lane record, attempt record),
      doc/spec/features/feature-autonomous-delivery.md (shell surface that the
      typed queries replace for operators),
      doc/guides/engine-first-operations.md (operator routine), the command
      reference page required by check:help/help-guide-coverage, and
      doc/00-index.md if a new page appears. The change must not leave a stale
      'the typed path has no status/log surface' statement behind."
    type: risk
    date: "2026-11-19"
  - text: "PM-decided (AC-F5-2 scope ruling, for the readiness gate): 'an unexpected
      extra positional is `input.value.rejected`' holds inside the family's
      declared `positionals.max` (3) — which is the normal `dispatch <query>
      <ref> extra` case. A positional beyond the parser's declared maximum is
      refused by the shared parser as `fallback.invocation`, the delivered
      parser contract for every command; the plan and tests assert both
      identities and this is not a contract change."
    date: "2026-11-19"
  - text: "PM-decided (supports TDR-0056): `session-introspection` is read as the
      adapter's capability to introspect a session it owns, including reading
      its own persisted session content — not metadata only. The delivered
      declarations govern availability: opencode declares it supported; Claude
      Code declares it as a gap, so a Claude-lane `last-message` answers
      `capability-gap` and this change adds no Claude transcript read. Giving
      Claude a read would change its capability declaration and is a separate
      decision. Rationale: the vocabulary is not narrowed anywhere, the
      capability's existing consumers (session listing, telemetry) already read
      adapter-owned session state, and reusing the declaration costs no contract
      motion."
    date: "2026-11-19"
  - text: "PM-decided (supersedes the spec's first draft of the log artifact):
      per-ref session output is append-only **segment files** under
      `dispatch-logs.<workspace>/<REF>/`, one file per stream (spawn, resume,
      deliver), capped per file by segmentation and bounded in total by
      retaining the newest two segments. No locks, no trims, no rewrites, no
      shared write target. Rationale: three review rounds on a lock+trim design
      kept finding cap, crash-window, stranding-lock, and torn-tail defects;
      segmentation removes the read-modify-write class entirely and preserves
      iteration attribution for free. The ticket's per-ref scoping and bounded
      tail are unchanged."
    date: "2026-11-19"
  - text: "PM-decided (declared divergence, not a parity claim): the typed `log`
      holds the harness's own stdout (for opencode, its JSON event stream). The
      shell's `--log` tails `<REF>.log`, which holds only the opencode child's
      stderr; the wrapper's progress lines go to the wrapper's terminal. The
      typed tail therefore captures neither. The reference page and the
      operations guide must state this."
    date: "2026-11-19"
  - text: "Decision-record process: `@decision-advisor` authored TDR-0056 and
      `@decision-critic` challenged it four times (REWORK on every pass; no PASS
      claimed). Each round corrected real defects (shell parity fact,
      unsatisfiable privacy gate, tautological gates, existing
      `session-introspection` capability, sink binding point, stream coverage on
      resume, then the lock/trim protocol replaced by append-only per-stream
      segments, then transformation/tear/overflow/redaction-order precision).
      The final design is recorded in TDR-0056; remaining protocol details are
      plan-pinned with named tests. Status stays `Proposed` — the human owner
      accepts at PR review."
    type: info
    date: "2026-11-19"
  - text: "DoR gate iteration 1 returned NOT_READY with five text-level findings (no
      redesign): (F1) API-9/DM-3 bounded the message in the seam, which would
      admit a straddling-credential prefix — the bound belongs to the query
      composition after redaction; (F2) AC-F7-3 was stated per file but a split
      value ends mid-value — restated over the concatenation of a stream's
      files; (F3) two PERSIST cases asserting `dispatch log` were allocated to
      the write phase before `log` exists; (F4) per-phase gates did not run the
      suites that verify the pinned inventories and the no-shell glob equality;
      (F5) the lane view described fold-then-filter, which would let a newer
      foreign record for the same ref win — filter must precede the fold.
      Advisories A1–A9 also folded (no-log meaning, append wording, truncation
      precedence, named state code, status store-failure case, secrets
      composition fact, phase-1 already satisfied, naming inputs, decision-pass
      count)."
    type: info
    date: "2026-11-19"
  - text: "Design tension to resolve in the spec, not to paper over:
      `feature-dispatch-engine.md` states that the `dispatch.lane` record
      carries no prompt, transcript, diff, or provider payload, so neither `log`
      nor `last-message` may ride the lane record. Both need their own bounded,
      reference-scoped artifact with a declared location, a size/line bound, and
      the privacy boundary restated (what is persisted is harness stdout and the
      PM's final assistant message only). The spec must also say what `log` and
      `last-message` answer when no artifact exists yet (a pre-existing lane
      written before this change persists nothing)."
    type: risk
    date: "2026-11-19"
  - text: "Operational prerequisite carried from GH-347: the workspace is unbuilt
      (`packages/*/dist` absent) and `jaiship` imports built workspace packages,
      so every primitive invocation runs `TMPDIR=$PWD/tmp/tmpdir pnpm build`
      first. Primitive calls carry BOTH `PATH=$PWD/node_modules/.bin:$PATH` (the
      commit primitive execs the bare `commitlint` name) and
      `TMPDIR=$PWD/tmp/tmpdir`."
    type: info
    date: "2026-11-19"
