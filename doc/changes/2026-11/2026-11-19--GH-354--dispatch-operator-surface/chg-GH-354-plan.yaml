#   `kind: delivery` phases (ids 2..8). This brief calls the pre-delivery phase
#   "phase 0"; it is `id: 1` here because the schema requires a positive integer
#   id. Every later reference in this document numbers the PLAN's ids.
#   The planning phase declares no code scope: it lands the governing record
#   (TDR-0056) and its index row, which the delivery phases then implement.
#   `tier.phases` below lists the LIFECYCLE phase ids [1..11] (the ceremony tier
#   engine's vocabulary), not this plan's eight phase ids; the two are different
#   namespaces and the plan never renumbers the lifecycle.
#
