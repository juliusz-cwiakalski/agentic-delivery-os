  # Phase 4 — `dispatch log` (F-2; API-2, API-7, API-11; DM-5, DM-6, DM-7;
  # DEC-3, DEC-5; TDR-0056 DC-3 and the two-segment-tail / torn-line-reader
  # obligations).
  #
  # Goal: the bounded, reference-scoped tail over the family phase 3 writes.
  #
  # Contract:
  #   - Lists ONLY the addressed ref's own directory (the only permitted listing)
  #     and reads only files inside it; never lists, globs, or reads across refs.
  #   - Stitches the retained files in NAME order into ONE byte stream, DROPS an
  #     unterminated tail (a torn write, never returned), splits on LF only AFTER
  #     the stitch, and returns the newest `--tail <n>` lines oldest-to-newest, so
  #     a value continued across a segment boundary is reconstructed.
  #   - `--tail` is a canonical decimal in 1..500, default 50, REFUSED not
  #     clamped; an invalid value is `input.value.rejected` BEFORE any artifact
  #     read (`0`, `501`, `1.5`, `-1`, `01`, `abc`); an undeclared flag is
  #     `fallback.invocation`. THE `--tail` VALUE FLAG IS DECLARED HERE, with the
  #     form that owns it (`requiresValue` + the declared `flags` entry on the
  #     dispatch definition), because the flag cannot be honoured by a later
  #     commit than the branch that parses it. Phase 6 completes the FAMILY
  #     grammar (refusals across all four forms, discriminators, uncomposed
  #     refusal, exit projections) and does not re-declare `--tail`.
  #   - `available=false` + `reason=no-log` at exit 0 when no artifact directory
  #     exists (every one-shot lane and every pre-change lane); `available=false`
  #     + `reason=unreadable` at exit 1 with no content; an existing file with no
  #     complete line is `available=true` with an empty line list (so "no capture"
  #     and "no output" stay distinct). Nothing is fabricated from the lane or the
  #     attempt record.
  #   - Bounds: machine `data` <= 65 536 bytes; human <= 200 lines and <= 32 768
  #     bytes; EXACTLY ONE truncation fact naming its `scope` (`bytes` | `tail`),
  #     its `bound`, and `omittedLines` — including a short retained window, the
  #     single-retained-file case, and a returned continuation whose beginning
  #     retention removed. The log declares its OWN human constants; the attempts
  #     constants (40 lines / 8192 bytes) are not reused (mutation M61).
  #   - A read is a snapshot of what was durable; no lock, no flush, no deletion.
  #
  # Code areas (concrete):
  #   packages/core/src/contracts/dispatch-operator.ts (log payload, truncation
  #                                                  fact, tail range, machine and
  #                                                  human log bounds)
  #   packages/core/src/domain/dispatch-log.ts      (EXTEND: window, stitch,
  #                                                  tear, split and truncation
  #                                                  arithmetic — the reader half)
