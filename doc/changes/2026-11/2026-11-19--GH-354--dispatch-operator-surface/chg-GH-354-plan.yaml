phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — The governing record (TDR-0056) and its decision index row.
  #
  # Goal: put the binding design record on the branch before any delivery phase
  # cites it in code, tests, or documentation. This is the plan's pre-delivery
  # phase (called "phase 0" in the brief; `id: 1` because the schema requires a
  # positive integer).
  #
  # Why a planning phase exists at all: the record is UNTRACKED at plan time and
  # the commit primitive refuses to stage an untracked file outside a declared
  # scope. Declaring the exact path here is what gives the PM staging authority;
  # a delivery phase would otherwise have to carry a decision record it does not
  # govern.
  #
  # Obligations:
  #   1.1 Commit `doc/decisions/TDR-0056-dispatch-session-output-artifacts-and-
  #       transcript-read-seam.md` on this branch (it is authored and reviewed;
  #       status stays `Proposed` — the human owner accepts at PR review).
  #   1.2 Stage `doc/decisions/00-index.md` CONDITIONALLY (its TDR-0056 row and
  #       binding note are already committed; a touch made while landing the
  #       record stages with it). Never edit an unrelated row.
  #   1.3 Re-run the mechanical done criterion (see COMMIT-BOUNDARY REALITY):
  #       `git ls-files --error-unmatch <TDR path>` exits 0 and
  #       `git status --porcelain -- doc/decisions` is empty.
  #
  # Acceptance: NONE. A declaration alone evidences no AC and no TC. Phase 8's
  #   DoD check is where the record's citation becomes provable.
  #
  # Gate (expected signal: exit 0, both paths tracked, the index clean):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm build
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git ls-files --error-unmatch doc/decisions/TDR-0056-dispatch-session-output-artifacts-and-transcript-read-seam.md
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git status --porcelain -- doc/decisions
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git diff --check
  #   (No test suite is required: the commit stages documents only. The
  #   decision-record invariants — the index row, the header shape, the
  #   `Proposed` status — are checked by `pnpm check` at the phase-8 aggregate.)
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Land TDR-0056 and its decision index row (the plan's pre-delivery phase)"
    kind: planning
    summary: "chore(GH-354): land TDR-0056 and its decision index row"
    scope:
      files:
        # Untracked at plan time (COMMIT-BOUNDARY REALITY). Exact path.
        - doc/decisions/TDR-0056-dispatch-session-output-artifacts-and-transcript-read-seam.md
        # CONDITIONAL STAGING ONLY: the TDR-0056 row is already committed; the
        # file is clean at plan time. Declared so a status/typo touch made while
        # the record lands stages with it. Never a licence to edit an unrelated
        # row.
        - doc/decisions/00-index.md

  # ---------------------------------------------------------------------------
  # Phase 2 — Lane view, advisory owner probe, `dispatch status`, and
  # `dispatch is-delivering` (F-1, F-3; API-1, API-3, API-6, API-10, API-11;
  # DM-1, DM-4, DM-5, DM-7; DEC-1, DEC-2, DEC-5, DEC-7).
  #
  # Goal: the two queries the flip plan gates F6 on. Both are pure folds over the
  # DELIVERED `dispatch.lane` read joined with an injected advisory probe — no new
  # record, no new field, no marker file, no repair, and no daemon-lane read.
  #
  # Contract:
  #   - `marker` is the newest lane record's `state` (`active` | `terminal`) plus
  #     `absent` for "no record". `delivering` = active and probe != dead;
  #     `stale` = active and probe = dead. `unknown` never asserts staleness
  #     (DEC-2, DM-1, DM-4).
  #   - One bounded retained-window read of kind `dispatch.lane` over
  #     `(resolved repository, ref)`; the DAEMON lane family contributes nothing;
  #     identity resolves with persistence DISABLED so no checkout marker is
  #     created, repaired, or re-persisted (API-6).
  #   - `status` answers `marker=absent`, `delivering=false`, `stale=false`,
  #     `probe=not-applicable`, null `pid`/`sessionId`, and a null lane, at exit 0,
  #     in both output modes, with no fabricated lane.
  #   - `is-delivering` keeps BOTH forms (PM interpretation): per-ref (exit 0 when
  #     in progress, 1 otherwise, no `refs`) and ref-less (up to 20 refs with one
  #     truncation fact; exit 0 when any, 1 when none, `ref=null`). The JSON answer
  #     carries the boolean with NO `error` object (DEC-5).
  #   - A failed lane-store read keeps the store's typed `state.*` identity and is
  #     never a fabricated `delivering=false` (DM-7).
  #
  # Code areas (concrete):
  #   packages/core/src/contracts/dispatch-operator.ts   (NEW: query payload
  #                                                       types, probe verdicts,
  #                                                       closed reasons, bounds,
  #                                                       the `query`
  #                                                       discriminator union)
  #   packages/core/src/domain/dispatch-operator-view.ts (NEW: pure marker /
  #                                                       delivering / stale
  #                                                       mapping; refs ordering
  #                                                       + 20 bound + truncation)
  #   packages/core/src/app/dispatch-lane-view.ts        (NEW: the repository-
  #                                                       filtered newest-per-ref
  #                                                       fold over the delivered
  #                                                       lane read, with the
