  # ---------------------------------------------------------------------------
  # Phase 5 — `dispatch last-message` (F-4; API-4, API-9; DM-3, DM-5, DM-6;
  # DEC-4; TDR-0056 DC-4, DC-5; PM ruling (b)).
  #
  # Goal: the PM's FINAL ASSISTANT MESSAGE, read from the harness's own persisted
  # session store through one injected, adapter-owned, read-only seam.
  #
  # Contract:
  #   - Resolve the newest lane for `(repository, ref)`, take its `sessionId` and
  #     `harnessKind`, and call ONE injected read seam. Capability-gated by the
  #     EXISTING `session-introspection` declaration: opencode declares it
  #     supported and implements the read; Claude Code declares it a gap
  #     (`headless-mode-limitation`) and answers `capability-gap` — NO Claude read
  #     is added and no declaration moves (PM ruling (b)).
  #   - The seam takes no handle, starts nothing, resumes nothing, collects
  #     nothing, terminates nothing, lists nothing, and administers nothing; it
  #     adds no operation, capability-union member, or gap reason (it is a READ,
  #     not a session operation).
  #   - NEVER a synthesized sentence: the query reads no attempt record, no
  #     derivation payload, and no envelope field (the delivered `lastMessage` is
  #     the classifier's bounded summary and must not appear).
  #   - Composition order is FIXED: redact -> flatten -> bound -> mark. Registered
  #     credential values are replaced FIRST (through the delivered chokepoint, so
  #     a credential straddling the 512-character cut cannot survive as a prefix),
  #     then flattened to one line, then bounded to 512 characters, then
