# SCOPE DECLARATION RULE (binding on every phase, inherited from GH-338/GH-339/
#   GH-347):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   regression control is NOT declared: declaring it would only produce an
#   advisory `plan diff` `undeclared-missing` for a file that needs no edit.
#   ONE DECLARED EXCEPTION: `doc/decisions/00-index.md` in phase 1 is a
#   CONDITIONAL-STAGING declaration (clean at plan time; never a licence to edit
#   an unrelated row).
#   TWO FURTHER DECLARED KINDS, stated so the rule and the declaration cannot
#   contradict:
#     (i)  A PINNED-SURFACE declaration. `tests/structure/inventory.json` (the
#          per-package file set), the `EXECUTABLE_ALLOWANCES` constant inside
#          `tests/structure/content-inventory.test.ts` (per-file exports, no
#          wildcard), and `tests/fixtures/ports/v1-contract-inventory.json` (the
#          contract export list) are the repository's file-set / export / contract
#          pins. Every phase that creates a module or adds an exported name moves
#          them in the SAME commit, exactly and non-vacuously (no wildcard, no
#          allowance naming a symbol the file does not export).
#          `scripts/checks/no-shell-dispatch.ts` and its suite are a FOURTH pinned
#          surface with a mechanical rule: `tests/checks/no-shell-dispatch.test.ts`
#          asserts `DISPATCH_FLOW_SURFACE` equals the glob of
#          `packages/core/src/{app,domain}/dispatch-*.ts` PLUS the suite's own
#          `FIXED_SURFACE` list. Therefore EVERY phase that adds a
#          `dispatch-*.ts` core module or a new fixed adapter/CLI entry moves both
#          lists in the SAME commit, or the check is red at that boundary.
#          New core modules are therefore ALWAYS named `dispatch-*.ts`; a
#          differently named core module in the surface would break the glob
#          equality, and a differently named module outside it would be silently
#          unscanned.
#     (ii) A CONDITIONAL DELIVERED-EXPECTATION declaration, used only where a
#          DELIVERED assertion encodes pre-change behaviour that this change
#          deliberately moves (§8.5, §25.1). Such a file is declared by the phase
#          that owns the change, and the rule is absolute: an assertion is
#          UPDATED by citing the authorising clause (§8.5, DEC-x, or a PM ruling),
#          NEVER deleted, renamed, relaxed, reordered, or skipped to make a run
#          green. The per-file authorising clause is named in the phase comment.
#   A file edited by more than one phase is declared by every phase that touches
#   it. No phase claims exclusive ownership of a shared file; ownership is of
#   CASES and ACs, not of paths (see SHARED-FILE NOTE).
#
# SEAM PREREQUISITE (BINDING; test plan §7.1/§7.2, TC-FIXTURE-001): every case
#   drives the SAME composed function production drives; a test-local
#   reimplementation is rejected by name. Six read/write seams plus two
#   identifiers, each with its owning phase:
#     S-laneview  the lane-view fold over the delivered `readDispatchLanes` /
#                 `latestDispatchLaneFor`, repository-filtered, joined with the
#                 probe verdict. Home: NEW
#                 `packages/core/src/app/dispatch-lane-view.ts`; mounted as the
#                 `status` surface at the CLI edge. PHASE 2.
#     S-probe     the injected advisory owner-liveness probe
#                 ({processId, startedAt} -> live|dead|unknown, 5 000 ms
#                 tolerance). Composition fact; PHASE 2 (the OS read is injected,
#                 never performed by a case).
#     S-fold      the delivering fold over the lane view, both forms.
#                 PHASE 2.
#     S-sink      the per-stream raw-stdout observer bound beside
#                 `telemetrySinkFor` in `packages/adapters/src/harness/opencode.ts`,
#                 writing `dispatch-logs.<workspace>/<REF>/` through
#                 `packages/adapters/src/file/dispatch-logs.ts`. PHASE 3.
#     S-tail      the artifact reader (addressed-directory listing, name-order
#                 stitch, torn-tail drop, split, tail selection, byte/line
#                 budget, truncation fact). Home: NEW
#                 `packages/core/src/app/dispatch-log-tail.ts`. PHASE 4.
#     S-transcript the injected adapter-owned transcript read; opencode's real
#                 reader under its declared `session-introspection` support.
#                 PHASE 5.
#     S-cmd       the `dispatch` command definition, grammar, payloads and
#                 `exitProjection` (`packages/cli/src/commands/dispatch.ts`).
#                 PHASES 2..6 (each adds its form); the family contract is
#                 completed in PHASE 6.
#     S-exec      the guarded injected process runner (zero shell, zero real
#                 start). PHASE 7.
#   The four operator composition facts (owner-liveness probe, transcript read,
#   artifact-family root plus its filesystem edge, and the clock) are ADDITIVE
#   and non-operator, mounted at the same CLI edge that mounts
#   `claimLease`/`existingLane`/`attempts` today. No configuration key (NFR-5).
#
# SEQUENCING (spec §19 "by outcome, so each fact is proven with the evidence that
#   depends on it"), made concrete. Each phase is independently committable and
#   gate-green at its own boundary:
#     Phase 1  The governing record lands on the branch before the code it
#              governs (and before any phase cites it in code comments).
#     Phase 2  The lane view, the advisory probe, `status`, and `is-delivering`:
#              the flip plan's ordering-safe half (F6 gates on these two), reading
#              only state that already exists. Nothing here needs an artifact or a
#              transcript read.
#     Phase 3  The write path: a streaming adapter's per-stream stdout family.
#              Must precede phase 4 because `log` reads what this phase writes.
#     Phase 4  `dispatch log` over the family phase 3 writes.
#     Phase 5  The transcript read seam and `last-message`; independent of 3/4
#              (it reads the harness's own store, not the artifact) but placed
#              after them so the payload/grammar layer is stable.
#     Phase 6  The family contract: four forms, `--json` discriminators, the
#              refusal grammar, the exit projections, the four help entries, the
#              reference page, and the help-count assertion 5 -> 9. Must follow
#              2..5 because AC-F5-1/AC-F5-3/AC-F5-4 range over all four forms.
#     Phase 7  The cross-cutting posture and battery: read-only proof, no-shell
#              invariant with its planted control, closed-contract invariance, the
#              12-row answer matrix (both modes, two consecutive runs), latency,
#              privacy, the proof boundary, and seam identity. Needs all four
#              queries and all four composition facts present.
#     Phase 8  Release obligations (the changeset, the plan validation, the
#              aggregate gate) and the current-truth pages declared for STAGING
#              ONLY. LAST, because the aggregate ranges over the assembled change.
#   WHY THIS ORDER AND NOT ANOTHER: the write path precedes its reader; the five
#   earlier phases each land their own tests so no phase depends on a suite
#   committed later; the family/grammar phase is the earliest boundary at which
#   the four-form ACs are observable; the posture phase is the earliest boundary
#   at which the read-only claims range over the whole surface.
#   EVERY PHASE LANDS ITS OWN TESTS. A phase boundary that is not gate-green is a
#   BLOCKING finding, not a note.
#
# PM RULINGS THAT CONSTRAIN THIS PLAN (from ./chg-GH-354-pm-notes.yaml; none
#   reopens a decision):
#   (a) AC-F5-2 "unexpected extra positional": the `input.value.rejected` reading
#       holds WITHIN the family's declared `positionals.max` (3 today in
#       `packages/cli/src/commands/dispatch.ts`), which is the normal
#       `dispatch <query> <ref> extra` case. A positional BEYOND the parser's
#       declared maximum is refused by the shared parser as `fallback.invocation`
#       — the delivered parser contract for every command, accepted as
#       pre-existing behaviour, not a contract change. Phase 6 asserts BOTH
#       identities with their real shapes (TC-GRAMMAR-002/003) and does not move
#       `positionals.max`.
#   (b) `session-introspection` is the declaration for `last-message`: the
#       capability means the adapter can introspect a session it owns, including
#       reading its own persisted session content. opencode declares it supported
#       and implements the read; Claude Code declares it a gap
#       (`headless-mode-limitation`), so a Claude lane answers `capability-gap`
#       and this change adds NO Claude read and moves no declaration. Phase 5
#       implements exactly that and phase 7 pins the unchanged declaration set.
#   (c) The log artifact is PER-STREAM SEGMENTS, not a single trimmed file. No
#       lock, no trim, no rewrite, no shared write target; retention is the newest
#       two files per reference. This supersedes the spec's first draft and is
#       recorded in TDR-0056 (DR-4). Phases 3 and 4 implement the segmented
#       writer and the stitched reader; no phase reintroduces a trim.
