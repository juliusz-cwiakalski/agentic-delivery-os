  # Phase 6 — One family: grammar, `--json` discriminators, exit projections,
  # help entries, and the reference page (F-5; API-5, API-11, API-12's help half;
  # DM-5, DM-7; DEC-1, DEC-5, DEC-7; spec §25.1; PM ruling (a)).
  #
  # Goal: the four queries behave and are DOCUMENTED as one family. This is the
  # earliest boundary at which the four-form ACs are observable and the boundary
  # at which every `pnpm check` doc obligation caused by the grammar lands.
  #
  # Contract:
  #   - Each answer carries exactly ONE `query` discriminator (`status` | `log` |
  #     `is-delivering` | `last-message`) and its declared key set, in the standard
  #     machine envelope; the human form emits its declared key set (or, for `log`,
  #     the raw tail plus at most one `truncation=` line).
  #   - Refusals, decided BEFORE any runtime call: non-canonical ref (`[A-Z]+-\d+`
  #     only), missing ref, an unexpected extra positional WITHIN
  #     `positionals.max` -> `input.value.rejected`; an undeclared flag ->
  #     `fallback.invocation`; a positional BEYOND the parser's declared maximum is
  #     the shared parser's `fallback.invocation` and is accepted as pre-existing
  #     behaviour (PM ruling (a)) — `positionals.max` is NOT moved.
  #   - An UNCOMPOSED query surface refuses `input.value.rejected`; it never
  #     crashes and never answers an empty success (DEC-7).
  #   - Exit projections through the delivered DATA projection only:
  #     `status` -> success always; `is-delivering` -> success when delivering,
  #     user-validation when not; `log` -> success for a produced tail or `no-log`,
  #     user-validation for `unreadable`; `last-message` -> success when produced,
  #     user-validation for every closed reason. NO numeric literal at the call
  #     site (`scripts/checks/exit-code-literals.ts`), no error-table row, no
  #     delivery token.
  #   - No query emits a delivery `result` token, appends an attempt, appends a
  #     lane, and each leaves the next dispatch's and attempt read's answers
  #     unchanged.
