  # ---------------------------------------------------------------------------
  # Phase 3 — The per-stream stdout artifact write path (F-7; API-8; DM-2, DM-6;
  # DEC-3; TDR-0056 DR-4, DC-1, DC-2; PM ruling (c)).
  #
  # Goal: a streaming adapter's per-stream stdout becomes a bounded, per-ref,
  # segmented file family on disk — write path ONLY, no query. Nothing here
  # reads the family.
  #
  # Contract (one writer rule, one tear rule, structural cap):
  #   - `dispatch-logs.<workspace>/<REF>/` beside the ledger, OUTSIDE the store's
  #     record set, derived-document set, salvage path, and repair path. One
  #     directory per reference, one file per stream (spawn, resume, deliver).
  #   - The sink is bound when a stream STARTS and BEFORE its first yielded value
  #     (the executable form is the fixture's first-pull probe): the acquisition-
  #     settling line and the values the decoder skips ARE captured. The binding
  #     point is the stream construction beside `telemetrySinkFor`, not the
  #     decoded-frame seam (the delivered telemetry sink receives only decoded
  #     frames, so copying it would lose undecodable lines).
  #   - Every yielded value is written followed by EXACTLY one LF, including the
  #     stream's final remnant; nothing verbatim. File mode 0600, `O_APPEND`
  #     single writes, existing bytes never modified, no lock or coordination
  #     file.
  #   - Per-file cap 1 048 576 bytes enforced by STARTING the stream's next
  #     segment: a value that fits starts the next file whole; a value longer than
  #     the cap is filled to exactly the cap and its remainder continued at the
  #     start of the next file, repeating as needed — no value is dropped for
  #     being large.
  #   - Retention: the newest two files by NAME per reference (family bound
  #     2 x 1 048 576 = 2 097 152 bytes); a third file's arrival removes the oldest
  #     best-effort AFTER the new file exists; a failed removal leaves the extra
  #     until the next append.
  #   - File names derive from data the writer already holds (recorded time,
  #     attempt identity, iteration ordinal, segment ordinal, zero-padded) so a
  #     lexical sort equals creation order across a restart and across two
  #     concurrent streams, with attempt identity breaking ties — no shared
  #     counter, never mtime.
  #   - ONE-SHOT SCOPE (PM ruling (b)/spec §8.5): a Claude Code lane opens no
  #     stream, so no directory and no sink. An absent sink keeps the delivered
  #     behaviour exactly.
  #   - NON-GATING, not non-blocking: a sink fault never changes the token, exit,
  #     outcome, attempt count, lane records, or evidence, and adds no evidence
  #     identifier.
