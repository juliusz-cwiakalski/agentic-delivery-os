decisions:
  - text: "Lane execution seam: the daemon spawns and observes lanes through the delivered HarnessSessionPort (M1-S11) and records lane execution state through the state layer. The full typed dispatch loop with dual-run evidence and per-repo handover, and the `dispatch` command itself, remain M1-S9 (GH-239). This follows backlog rank 38 before rank 39 and the ticket's dependency list, which excludes M1-S9. The daemon is proven against an injected lane-executor port in tests."
    date: "2026-11-07"
  - text: "Automatic preemption is in scope here (GH-237 deferred its execution to M1-S18). The daemon applies a computed preemption only at a safe boundary: it never kills a live session. When the preempted lane has an active session it records the pending preemption and parks/releases at the next phase boundary or on session completion; when no session is active it releases the lease and records the park immediately, with the preemption incident naming the close item."
    date: "2026-11-07"
  - text: "Supervisor install: M1 ships the systemd user unit with linger as the concrete adapter (Linux), scoped to the state dir. launchd and Windows equivalents are declared platform adapters with an explicit classified unsupported outcome on those platforms, never a silent no-op. Installation is optional and changes nothing for one-shot operation."
    date: "2026-11-07"
  - text: "External-effect protocol: CommandReceipt and OutboxEffect are delivered as additive state record kinds plus a domain protocol primitive with query-based check-before-reapply and first-class `unknown` consequence, over injected external-effect ports. No tracker/VCS write path is introduced by this change (the delivered scheduler is read-only against trackers); commits are protected by the delivered atomic commit primitive plus the TDR-0014 message-independent outbox identity and owner-side recovery."
    date: "2026-11-07"
  - text: "Live watch: `queue --watch` and `lanes --watch` are accepted when the daemon is reachable and stream bounded subscribe frames; when the daemon is absent they degrade to bounded state polling in a declared degraded mode at exit 0, never a silent empty stream and never a failure. This supersedes GH-237's temporary `--watch` refusal while preserving its truthfulness requirement."
    date: "2026-11-07"
  - text: "Test posture: no live network, real credentials, or unbounded sleeps. Protocol conformance runs over stdio in-process; daemon lifecycle, reconciliation, supervisor, and preemption are exercised with injected clock, transport, process-supervisor, and lane-executor seams. A bounded real-child-process smoke test may exist for start/stop if it is hermetic and timeout-guarded."
    date: "2026-11-07"
  - text: "DoR iteration 1 PM decision on R-01: choose narrowing (b). Control protocol v1 carries no mutating wire class; at-most-once mutation is a state-path property. Restate F-6/AC-F6-2 so CLI intent records carry the idempotency key and serialize through the single-writer fence, while control frames are at-most-once by `id` plus the lock token. Do not invent an `intent` frame class in M1."
    date: "2026-11-07"
  - text: "DoR iteration 1 PM decision on R-02: choose mechanism (a), not a narrowing. The commit effect wrapper writes an `outbox.effect` intent before invoking the delivered commit primitive, carrying the baseline HEAD and the deterministic expected commit identity (ref + phase + subject/body evidence). On restart, reconciliation queries `git log <baselineHead>..HEAD` for that identity, records the landed SHA as `applied`, and never creates a second commit. This uses the existing git adapter with an additive log-since query and does not change M1-S14's commit format or atomic record+commit primitive. (Superseded by the iteration-2 N-01 decision below: the message is model-authored, so the identity is the path set, not the message.)"
    date: "2026-11-07"
  - text: "DoR iteration 1 PM decision on R-06: narrow with explicit acknowledgement. A blocker answer written while the daemon is down is durable and lossless; reconciliation makes it visible and records the resume/application intent. Actual lane application happens at the next safe phase boundary when a lane exists; full session resume remains M1-S9. The spec, test plan, and plan must state this consistently and TC-STATE-003 must assert the specified behavior rather than an invented 'application' step."
    date: "2026-11-07"
  - text: "DoR iteration 2 PM decision on N-01: choose message-independent identity (b). The pre-commit outbox intent records baselineHead, changeRef, phase, and the sorted normalized staged path set. Recovery queries bounded `logSince(baselineHead)` and matches exactly one new commit whose changed path set equals the recorded set. No dependence on the model-authored commit message; no template-only change to the commit primitive; zero new commits or multiple/ambiguous matches resolve to `unknown` and require human/owner action, never a silent re-apply."
    date: "2026-11-08"
  - text: "DoR iteration 2 PM decision on N-02: the effect owner is the lane/one-shot process, not the daemon. The daemon detects and records a durable redrive request with the discovered SHA (or `unknown`), but never writes a commit or runs a phase. The owning process restores the phase-transition binding by re-running phase completion with the discovered SHA evidence. `packages/cli/src/commands/phase.ts` and the evidence contract are declared in the plan scope. F-9/AC-F9-1 remain intact."
    date: "2026-11-08"
  - text: "DoR iteration 2 PM decision on N-03: pin a brand-derived `<PREFIX>_STATE_DIR` environment variable as the state-directory scope contract, read by the resolver and set explicitly by the supervisor unit (`Environment=`), with the unit command keeping `daemon start --foreground`. Do not add a `--state-dir` CLI flag. Tests assert two state dirs route to their own locks/sockets and a wrong-scope negative."
    date: "2026-11-08"
  - text: "DoR iteration 2 PM decision on N-05: remove `instance.fence` (the daemon lock token) from `daemon start` and `daemon status` command envelopes. The lock token remains durable-only and in the three control-frame payloads. Goldens and AC-F1-1/AC-F4-4/NFR-12/§21/Appendix C are aligned; no golden placeholder is needed."
    date: "2026-11-08"
  - text: "DoR iteration 2 PM decision on N-08: control-frame at-most-once is keyed on (connection identity, `id`, lock token). Same-connection replay is deduped; a cross-connection collision is a distinct new request and is never silently answered as already applied. TC-CONC-005 splits the two cases."
    date: "2026-11-08"
  - text: "Ticket-pin supersession acknowledgement (DoR N-07): the GH-238 ticket's binding pin 'commits are additionally protected structurally by M1-S14 atomicity and SHA idempotency' is superseded as a MECHANISM by TDR-0014 (message-independent path-set identity + bounded logSince + owner-side restoration), because the delivered commit primitive resolves its message through a model call and cannot yield a pre-commit message identity. The pin's INTENT is preserved: no duplicate commit, no lost phase binding, first-class unknown on ambiguity. The human owner retains the final ratification at the open-PR review gate; TDR-0014 is Proposed pending that acceptance."
    date: "2026-11-08"
