accepted_residuals:
  - "TDR-0013 remains `Proposed` (decision_date null). Owner ratification is a hard PR-merge gate, not a code defect; do not merge until the record is accepted and its status flips."
  - "TC-STATE-004/TC-STATE-005 remain named gaps in the test plan (no dedicated wake-durability suite); the wake port is delivered, injected, and structurally re-read on the next wake."
  - "Cross-process status reports `resident` for a foreground daemon because foreground is an attachment property and is not persisted; the spec pins no durable mode."
  - "The wrapper's staging pre-read and the act's own tree read are two reads; working-tree drift between them can only produce a false `unknown`/`failed` effect (no second commit, no guessed SHA), which is fail-safe and covered by TDR-0013's negative outcomes."
  - "An outbox effect identity accumulates `accepted` -> `in-flight` -> terminal records under one `recordKey` (append log, latest wins); the reconciliation duplicate counter only flags identical-payload repeats, so these state transitions are not reported as duplicates."
  - "If another writer holds the state fence, the pre-commit intent append returns `state.lock.busy` and the wrapper aborts the commit with `commit.atomic-abort`. This is fail-closed per TDR-0013 INV-1 (the primitive is not invoked without a durable intent) and retryable; it is not a second commit."
  - "The daemon composition ports (`effects` list/logSince/record and `environmentName`) are supplied by the external host composition root; in-repo proof is at the delivered factories/composition functions and the production-path tests, consistent with the test plan's accepted residual that no live binary composition root is exercised (F-13)."
  - "The four commit-envelope goldens changed only `timing.totalMs` 2000 -> 1000 after the harness clock split its iso/ms counters; the elapsed-time measurement is now independent of the number of record timestamps, which is more correct, and no assertion was removed or relaxed."
  - "Algorithmic (not OS-level) concurrency, environment-sensitive latency, real cross-user/systemd/launchd exercises, and the injected-tracker-effect tier remain the DoR-3 accepted boundaries."
  - "The merged GH-240 capsule/closeout feature is untouched by the GH-238 delta; the full battery including capsule suites is green."
  - "No business-truth or merge path was added: no `doc/business/**`, no cloud names, no merge invocation; forbidden-literals 5/5 and the daemon import/boundary checks are green."

