summary: >-
  Second substantive review after the Phase 14 review-iteration-1 remediation (dea1b623,
  97ca3cb3, c2cf4141, 85916605, ccb0b521). Both blocking findings are genuinely fixed in
  production code rather than only in fixtures. F-1: `createPhaseCommitExtension` and
  `createCommitCommandRuntime` now compose `createCommitActRunner`, which reads HEAD once,
  computes the sorted normalized staged path set with the same `computeStagingPlan` the act uses,
  appends the `outbox.effect` intent plus its `in-flight` transition before `runCommitAct`, closes
  it with a per-attempt receipt and terminal state, and `createProductionCommitRuntimeOptions`
  supplies `createRedriveEvidenceReader`; the new production-path test drives the harness's
  `runPhase` (which builds the real extension) and proves the intent is durable before the commit
  lands and that a post-crash run resolves the landed SHA with no second commit and an atomic
  transition. F-2: `resolveStateDirectoryScope` strips the brand prefix's single trailing `_` and
  reads exactly `<PREFIX>_STATE_DIR`; the tests now use the production prefix shape ("ADOS_"), the
  unit's rendered `Environment=` name round-trips through the resolver, two scopes select two
  paths, and the double-separator spelling is ignored, with no `--state-dir` flag. F-3 detection
  reuses `resolveCommitEffect` (path-set match; zero/mismatch -> not-found, multiple -> unreadable,
  no SHA) and has negative controls; F-4 dedupe runs under one fence acquisition with a
  deterministic interleaving test; F-5 the resident tick publishes deduplicated bounded content
  snapshots (queue/lanes) that are path/secret-free and shared with the initial subscribe snapshot,
  proven through `createDaemonCommandRuntime` plus the real control server; F-6/F-7/F-8 map the
  verdicts, document the buffer-as-cap, and compute reconciliation duplicates from the verified
  ledger. Regressions are clean: 36/36 ACs mapped, 14/14 plan phases (103 tasks, phase 14
  tasks 14.1-14.9 committed with evidence), 102/102 local TCs (100 PASS, TC-STATE-004/005 named
  gaps, plus one inherited GH-237 reference), full `bun test` 6003 pass / 4 skip / 0 fail across
  678 files, typecheck, lint, format, boundaries, error-table (114/114), doc-distribution (81
  docs), privacy (0), and forbidden-literals (5/5) all green. No assertion was removed; the only
  modified expectation is the four commit-envelope goldens' `timing.totalMs` 2000 -> 1000, a
  correct consequence of splitting the harness clock's iso/ms counters, not a weakened check.
  Five new non-blocking notes remain (0 critical/high/medium; 3 low, 2 info): the watch snapshot is
  byte-bounded before envelope overhead is added and the frame-max-bytes truncation branch is
  untested; phase 14 scope omits the four changed golden fixtures; a plan traceability reference
  cites a non-existent TC-CONFIG-002; the effects module header still claims the module is never
  imported by the daemon; and the `<PREFIX>_STATE_DIR` name remains host-injected rather than
  derived from the brand. Verdict PASS; TDR-0013 owner ratification is still a hard PR-merge gate,
  not a code defect.
