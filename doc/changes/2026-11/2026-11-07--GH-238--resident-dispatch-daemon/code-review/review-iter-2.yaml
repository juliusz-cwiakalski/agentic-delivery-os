previous_findings_resolution:
  - id: F-1
    severity: high
    status: resolved
    evidence: >-
      `packages/cli/src/edge.ts:654` `createCommitActRunner` is now the `runAct` of both
      `createPhaseCommitExtension` (edge.ts:868) and `createCommitCommandRuntime` (edge.ts:943); it
      returns early on dryRun, reads HEAD once, computes `stagedPaths` with `computeStagingPlan`
      over `request.scope`, calls `beginCommitEffect` then `appendOutboxEffect` with state
      `in-flight` before `runCommitAct({...request, baselineHead: head})`, and closes the effect with
      `appendCommandReceipt` (attempt 1) plus the terminal outbox state. `createProductionCommitRuntimeOptions`
      (edge.ts:916) supplies `readRedriveEvidence: createRedriveEvidenceReader(options.store)`
      (edge.ts:749), which yields a SHA only from an `attempt: 0`, `found`, `unknown` receipt whose
      effect/changeRef/phase/baseline match and whose evidence names `redrive`/`DM-18`. The new
      production-path test `tests/behaviour/commit-act.test.ts:102` runs the real
      `createPhaseCommitExtension` through the harness `runPhase`, observes an `in-flight` intent
      after the commit object lands and before the kill, detects the effect with
      `detectDaemonEffects`/`recordRedriveRequest`, then re-runs completion and asserts
      `data.commitSha === orphan`, `reconciliation.completed === "transition"`, an unchanged commit
      count, and an atomic transition carrying the orphan SHA. Not fixture-only: the harness composes
      the real factories, and the reader is the production one.
  - id: F-2
    severity: high
    status: resolved
    evidence: >-
      `packages/core/src/config/catalog.ts:775` derives
      `prefix = environmentPrefix.toUpperCase().replace(/_+$/u, "")` and
      `name = prefix + "_STATE_DIR"`,
      so the production brand prefix "ADOS_" reads `ADOS_STATE_DIR` (one separator) and ignores
      `ADOS__STATE_DIR`. `tests/behaviour/config-resolver.test.ts:215` uses the production prefix
      shape, a double-separator negative, and a `renderSystemdUnit` `Environment=` name round-trip
      (line 252) plus a two-scope positive (line 273). No `--state-dir` flag or state-directory config
      key exists (spec + catalog). The formerly uncaught shape (`environmentPrefix: "ados"`) is gone.
  - id: F-3
    severity: medium
    status: resolved
    evidence: >-
      `packages/core/src/app/effects.ts:327` `detectDaemonEffects` now calls `resolveCommitEffect`
      with the recorded `baselineHead`/`stagedPaths`; `packages/core/src/domain/effect-protocol.ts:62`
      returns `not-found` for a zero-commit read or a path-set mismatch and `unreadable` for multiple
      commits or a missing recorded set, always `status: unknown` with no SHA; a SHA is passed only
      when the outcome is `already-applied`. `tests/behaviour/daemon-effects.test.ts:229` is the
      negative control: a single mismatched commit records `not-found` with no `discoveredSha`, zero
      commits records `not-found`, multiple commits records `unreadable`.
  - id: F-4
    severity: medium
    status: resolved
    evidence: >-
      `packages/core/src/app/effects.ts:135` `appendOutboxEffect` now acquires the fence first, then
      performs the dedupe read, then appends, then releases; a caller that loses the fence re-reads
      once and returns the identical prior intent if present, otherwise the busy failure stands. The
      store's fence is an exclusive file lock (`state/index.ts` semantics), so two writers cannot both
      observe "no prior". `tests/behaviour/daemon-effects.test.ts:299` deterministically re-enters the
      second append from the first caller's dedupe read and asserts exactly one intent remains (the
      second caller gets the busy failure, never a second record). AC-F6-2 holds.
  - id: F-5
    severity: medium
    status: resolved
    evidence: >-
      `packages/core/src/app/control-server.ts:317` adds `publishState`, driven by an injected
      `stateChanges` source, emitting one deduplicated event per changed topic with a monotonic
      cursor. `packages/core/src/app/daemon-runtime.ts:239` calls it on every resident tick.
      `packages/cli/src/daemon-compose.ts:249` composes one bounded projection shared by the initial
      `subscribe` snapshot and the live source: queue rows are `{ref, repository, priority}` and lanes
      are `{ref, state, harnessKind, sessionId, classification}`, so `repositoryRoot`, caller
      principal, and the raw state directory are excluded; `boundedProjection` (daemon-compose.ts:186)
      caps by count (`QUEUE_MAX_ENTRIES`, `DAEMON_MAX_STATUS_LANES`) and serialized bytes with
      `truncated`/`truncationReason`; content equality uses recursively sorted keys so a reordering is
      not a change. `tests/behaviour/daemon-watch-state-changes.test.ts` drives the production
      `createDaemonCommandRuntime` plus the real control server across queue-priority, lane-state,
      no-change, and 200-row truncation cases, and `tests/behaviour/watch-stream.test.ts:142` proves a
      second bounded line through the real server.
  - id: F-6
    severity: low
    status: resolved
    evidence: >-
      The recommended option was implemented and pinned: `effect-protocol.ts:62` maps a path-set
