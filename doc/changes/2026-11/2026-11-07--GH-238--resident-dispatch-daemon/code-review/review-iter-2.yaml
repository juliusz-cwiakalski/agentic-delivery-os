findings:
  - id: F-9
    severity: low
    confidence: medium
    category: correctness
    location: packages/cli/src/daemon-compose.ts:186
    message: >-
      `boundedProjection` bounds the snapshot's serialized bytes to `DAEMON_MAX_FRAME_BYTES`, but the
      control frame that carries it adds the event envelope (v/kind/type/topic/cursor) and
      `callerPrincipal`. A count-capped snapshot between roughly 65,400 and 65,536 bytes therefore
      encodes to a frame just over `daemon.frame-max-bytes`; `decodeControlLine` rejects it and
      `watch.ts` silently drops it (`if (decoded.ok) queue.push(...)`), and the reachable path does not
      poll, so that change is never printed. The byte-bound (halving) branch is not exercised: the new
      tests only reach the 200-row count cap.
    suggestion: >-
      Reserve the envelope overhead in the projection bound (e.g. cap at `DAEMON_MAX_FRAME_BYTES`
      minus a fixed overhead budget) or bound the encoded frame, and add a test that forces the
      `frame-max-bytes` branch and asserts the whole encoded event line is at or under the bound.
    suppressed: false
    published_url: null
    published_at: null
