  - id: F-7
    severity: info
    status: resolved
    evidence: >-
      `daemon.subscription-buffer` is now documented as the single capacity bound for both the
      per-subscription frame buffer and the per-connection subscription count in
      `doc/spec/features/feature-config-layer.md`, `feature-resident-daemon.md`, and
      `doc/spec/nonfunctional.md`, matching `control-session.ts:187`. No new configuration key was
      added.
  - id: F-8
    severity: info
    status: resolved
    evidence: >-
      `packages/core/src/app/daemon-reconcile.ts:92` `countDuplicateIdentities` counts a second record
      of the same kind and key whose payload is identical to the first, across queue entry/dependency/
