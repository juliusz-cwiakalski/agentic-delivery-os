findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/edge.ts:721
    message: >-
      The TDR-0013 commit-effect wrapper is not wired into the production commit path. `runAct`
      invokes `runCommitAct` directly (edge.ts:721 and edge.ts:792) and `createProductionCommitRuntimeOptions`
      (edge.ts:745-766) composes neither a pre-commit `beginCommitEffect` call nor a
      `readRedriveEvidence` provider. `beginCommitEffect`/`recoverCommitEffect` and `readRedriveEvidence`
      are referenced only from tests (tests/behaviour/commit-act.test.ts:25,71;
      tests/behaviour/daemon-effects.test.ts:46,233; tests/fixtures/commit/harness.ts:374), so the
      crash window (commit lands, transition record and telemetry do not) still classifies
      `record-only` in production and no `outbox.effect` commit intent is ever written, leaving the
      daemon's detection duty with nothing to detect. AC-F10-2 and TDR-0013 INV-1/INV-2/INV-8 hold
      only against fixtures that call the functions manually, not against the delivered production
      path the AC's "Given" presupposes.
    suggestion: >-
      Compose the wrapper where the commit primitive is actually invoked: read HEAD once for
      `baselineHead` and the reset baseline, compute the sorted normalized staged path set with the
      delivered pure staging computation over the same scope, append `beginCommitEffect` before
      `runCommitAct`, and supply `readRedriveEvidence` from the durable DM-18 receipt (verify the
      receipt baseline belongs to the effect; `unknown`/absent never fabricates a SHA). Alternatively,
      if the owner is genuinely deferred to M1-S9, remove the AC-F10-2 "on the production message
      path" claim and the pm-notes "owner-side redrive evidence restoration" claim and record the
      deferral explicitly — but that contradicts the spec, so wiring is the correct fix.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
    confidence: high
    category: correctness
    location: packages/core/src/config/catalog.ts:774
    message: >-
      The state-directory scope selector is spelled two different ways. `resolveStateDirectoryScope`
      builds `${environmentPrefix.toUpperCase()}_STATE_DIR` (catalog.ts:774), but
      `brand.environmentPrefix` already ends in one `_` (branding/index.ts:126 -> "ADOS_"), so the
      resolver reads `ADOS__STATE_DIR` (double underscore). The spec (F-1, F-15, Appendix E, AC-F15-1),
      the systemd unit golden, and DAEMON_SUPERVISOR tests pin `Environment=ADOS_STATE_DIR=...`
      (tests/behaviour/daemon-supervisor-install.test.ts:80; daemon-lifecycle.test.ts:214). Runtime
      repro: with `ADOS_STATE_DIR=/srv/one` set the resolver returns the default
      `/home/u/.ados-state`; only `ADOS__STATE_DIR` is honored. A unit-installed daemon therefore
      ignores its own `Environment=` binding and runs against the default store — the silent
      wrong-scope sharing AC-F15-1 explicitly forbids. The only resolver test uses
      `environmentPrefix: "ados"` (no trailing `_`, config-resolver.test.ts:216), a shape production
      never produces, so it never catches the mismatch.
    suggestion: >-
      Derive the variable as `brand.environmentPrefix + "STATE_DIR"` (strip or do not add the extra
      separator) so the resolver and the unit agree on `ADOS_STATE_DIR`; add a resolver test that uses
      the real `brand.environmentPrefix` ("ADOS_") and asserts the unit-rendered `Environment=` name
      reads back through `resolveStateDirectoryScope`, plus the AC-F15-1 two-scope positive and
      wrong-scope negative (NF-5/NF-6).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/app/effects.ts:294
    message: >-
      The daemon's effect detection records `queryVerdict: "found"` with a `discoveredSha` for any
      single commit after the baseline without comparing that commit's changed-path set to the
      recorded `stagedPaths` (effects.ts:294-309). Plan task 7.3 requires "one bounded
      logSince(baselineHead) read plus path-set match for a commit", and TDR-0013 INV-5/INV-6 require
      a path-set mismatch to stay `unknown` with no guessed SHA. A mismatch or one unrelated commit is
      reported as `found` with a SHA; an owner that trusts the DM-18 receipt's SHA could bind the
      phase to a commit that is not the effect's. Mitigated only because the wired owner path
      (`recoverCommitEffect`) re-reads and checks path sets — but the detection evidence itself
      violates the match rule it is supposed to carry.
    suggestion: >-
      Reuse `resolveCommitEffect` (or the same `pathSetsEqual` comparison) in `detectDaemonEffects` so
      a single commit whose path set differs resolves `not-found`/`unknown` without a SHA, and add a
      negative control asserting a mismatched single commit never records a `found`+SHA redrive request
      (TC-RECON-007, TC-EFFECT-005).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: medium
    confidence: medium
    category: concurrency
    location: packages/core/src/app/effects.ts:133
    message: >-
      `appendOutboxEffect` dedupes an identical replay by reading prior records before acquiring the
      fence and then appending (effects.ts:133-145), and the state store's `appendRecord` does not
      reject a duplicate `recordKey` (it appends a new sequence, state/index.ts:426-451). Two
      concurrent same-`effectId` replays can both observe "no prior" and both append a second intent,
      violating AC-F6-2 "the same-key replay appends no second intent record". The covering test
      (daemon-effects.test.ts:228-253) runs the two appends sequentially, so the concurrency clause is
      fixture-granted.
    suggestion: >-
      Perform the read-and-append while holding one fence acquisition (or have the store reject a
      duplicate `recordKey`), and add a deterministic interleaving test where both callers read before
      either appends and assert exactly one intent record remains.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-5
    severity: medium
    confidence: medium
    category: correctness
    location: packages/core/src/app/control-server.ts:216
    message: >-
      A reachable-daemon watch never streams live updates. `createControlServer` publishes only in the
      `subscribe` handler (control-server.ts:216-222); the runtime tick calls `server.expire()` but
      never publishes on state change (daemon-runtime.ts:245-263), and no other `session.publish` call
      exists in the tree. So `queue/lanes --watch` against a reachable daemon prints the initial
      snapshot (at most one `event` frame) and then blocks until interrupted, while the degraded
      polling path does print changed snapshots — the reachable path is strictly less live than the
      fallback, contrary to F-13's "one bounded event frame per line until interrupted". The reachable
      path is only proven with a fake transport that pushes its own events (watch-stream.test.ts:81-138)
      and the edge tests only cover the degraded path.
    suggestion: >-
      Publish topic events from the resident loop when queue/lanes state changes (or have the watch
      poll state on a bounded cadence inside the subscription path as well), and add an integration
      test driving the real control server + a real subscriber across two state changes.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-6
    severity: low
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/effect-protocol.ts:66
    message: >-
      Residual NF-3: `resolveCommitEffect` maps "more than one commit" and a path-set mismatch to
      `verdict: "unreadable"` (effect-protocol.ts:66,73) rather than `not-found` ("mismatch is not
      ours"), and the daemon detection inherits the same collapse. Behavior is correct (every outcome
      stays `unknown`, no re-apply, no guessed SHA), so only the verdict vocabulary differs from the
      NF-3 recommendation.
    suggestion: >-
      Either pin the mapping in Appendix D/DM-18 (mismatch -> `not-found`; multiple -> `unreadable`)
      and assert it, or record the current mapping as the contract so the artifacts agree.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-7
    severity: info
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/control-session.ts:187
    message: >-
      Residual NF-1 resolved by reuse: `daemon.subscriber-degraded` is reachable — `subscribe` refuses
      when `subscriptions.size >= daemon.subscription-buffer` (control-session.ts:187), so the row is
      not dead vocabulary. No new configuration key was added, and TC-WIRE-004 (100 subscriptions)
      passes because the default buffer (256) exceeds 100. The only wrinkle is that the buffer-size key
      doubles as a subscription-count cap without being documented in Appendix J.
    suggestion: >-
      Document in Appendix J that `daemon.subscription-buffer` also bounds the per-connection
      subscription count, and assert the over-cap refusal without a new TC id.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-8
    severity: info
    confidence: high
    category: test-efficacy
    location: packages/core/src/app/daemon-reconcile.ts:256
    message: >-
      The reconciliation report hardcodes `duplicates: 0` (daemon-reconcile.ts:256). The spec phrases
      the field as the "duplicate count (which must be zero)", so a constant is defensible, but it is
      a tautological evidence value that can never surface a non-zero duplicate count if one occurred.
    suggestion: >-
      Either compute it from the duplicate-detection pass or annotate the field as a guaranteed-zero
      invariant in the record comment so it is not read as measured evidence.
    suppressed: false
    published_url: null
    published_at: null

