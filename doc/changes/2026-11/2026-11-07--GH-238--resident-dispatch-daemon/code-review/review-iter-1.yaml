summary: >-
  First substantive review after delivery + Phase 13 doc-sync remediation (base origin/main-tools,
  merge-base GH-240, so the delta is GH-238 plus the merge resolution only). The mechanical contracts
  hold: all 13 plan phases are present and committed, 36/36 ACs are traced and 102/102 TCs are
  recorded (100 PASS, 2 named gaps TC-STATE-004/005), and the aggregate battery is green (full
  `bun test` 5994 pass / 4 skip / 0 fail; typecheck, boundaries, error-table-sync 114/114,
  doc-distribution 81 docs, privacy/forbidden-literals all PASS). The daemon runtime/cadence, status
  projection, reconciliation park counts, failed-start recovery, supervisor truthfulness, lock/
  heartbeat evidence, preemption, control transport, and the GH-240 capsule feature are correctly
  delivered and unbroken. Two blocking defects remain, both proven against the delivered
  production composition rather than the fixtures: (1) the TDR-0013 commit-effect wrapper is
  delivered as unwired library functions — no production path appends the pre-commit `outbox.effect`
  intent or supplies the `readRedriveEvidence` provider, so AC-F10-2/INV-1/INV-8 hold only inside
  tests that call `beginCommitEffect`/`recoverCommitEffect` directly; (2) the `<PREFIX>_STATE_DIR`
  resolver builds `ADOS__STATE_DIR` (the brand prefix already ends in `_`) while the spec, unit
  golden, and `resolveStateDirectoryScope` test use `ADOS_STATE_DIR`, so a unit-installed daemon
  ignores its `Environment=` scope and silently falls back to the default store — the exact
  wrong-scope sharing AC-F15-1 forbids. Three medium findings (daemon effect-detection ignores the
  path-set match; outbox intent dedupe is a read-then-append race; a reachable-daemon watch never
  receives live updates) and three low/info notes follow. Verdict FAIL: fix F-1 and F-2 (and ideally
  F-3) before merge; TDR-0013 owner ratification remains a PR gate, not a code defect.
