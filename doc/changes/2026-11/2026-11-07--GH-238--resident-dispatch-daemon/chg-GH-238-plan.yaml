        TDR-0014 INV-8; DM-18; AC-F8-4, AC-F10-2; TC-RECON-007, TC-EFFECT-005]
      - >-
        7.6 Effect, convergence, and phase-evidence suites — tests/behaviour/daemon-effects.test.ts covers
        the legal transitions, unknown + query found/not-found/unreadable, the commit re-drive through one
        bounded `logSince(baselineHead)` path-set match (model-path fixture whose message no template would
