      - >-
        4.3 Resume decisions and restart accounting — interrupted and crashed lanes resume from the ledger
        position (phase 7 completed → resume at phase 8), completed phases are skipped idempotently, and
        exactly one restart is consumed through the delivered restart gate and `appendEconomicsRestartEvent`
