      - >-
        5.2 packages/core/src/domain/poll-policy.ts + app/polling.ts — the per-platform policy as data: base
        interval, maximum interval, and minimum request spacing from the resolved poll branch; exponential
        backoff from base to max on failure, reset to base on success, no interval below the minimum spacing
        and no request above the configured rate; the injected clock drives every boundary; a one-shot read
        bypasses resident backoff state. Polling goes only through an injected read seam, never performs a
        write, and has no unbounded loop. [F-14; DEC-11; DM-15; NFR-10, NFR-16; AC-F14-1;
        TC-POLL-001/002/003/004]
      - >-
        5.3 packages/core/src/app/daemon-runtime.ts — the resident lifecycle over injected ports: acquire the
        daemon lock (refuse live with holder evidence; take over stale with evidence), rebuild and reconcile
        (Phase 4), append the instance acquisition, open the configured transport (a failed open is a
        declared daemon-socket-unreachable degradation, state-mediated operation continues), begin the
        heartbeat, and serve. Wake order is poke, then event-log tail, then bounded poll; losing any wake
        changes nothing durable. `drain` refuses new spawn decisions, lets lane bookkeeping reach a boundary,
        records live lanes detached, appends operation `released`, removes the lock artifact, and exits;
        `immediate` stops the loop, appends operation `immediate-stop`, removes the lock artifact, and
        signals no lane. A clean stop never writes a false release for another actor; an unclean exit appends
        nothing and leaves a stale lock for the next start to take over. Every interval, timeout, and
        backoff advances only through the injected DaemonClockPort (no ambient setTimeout/setInterval in
        core); the loop is cancellable and has no unbounded wait. Readiness is signalled only after
        instance + reconciliation + heartbeat + transport open. [F-1, F-2, F-3, F-7, F-12; EVT-1, EVT-2;
