        commit, phase, or transition path is reachable from the daemon composition;
        tests/checks/daemon-hermetic.test.ts asserts only injected adapters are exercised. [F-9, F-10;
        NFR-4, NFR-15; AC-F8-4, AC-F9-1, AC-F10-1..AC-F10-3;
        TC-EFFECT-001..006, TC-RECON-007/008, TC-LANE-002]
      - >-
        7.7 Create tests/behaviour/commit-act.test.ts — the delivered commit primitive's contract at the
        crash window: one durable pre-commit `outbox.effect` intent (baselineHead, changeRef, phase, sorted
        normalized staged path set; no message, subject, body, or fingerprint) is written before the
