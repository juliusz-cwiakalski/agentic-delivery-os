      trackerTransition: "phase 7 committed on feat/GH-238/resident-dispatch-daemon; GH-238 remains In Progress"
    summary: "feat(GH-238): external-effect protocol with receipts, unknown, check-before-reapply, and message-independent commit protection"
    tasks:
      - >-
        7.1 packages/core/src/domain/effect-protocol.ts — the pure Appendix I state machine: accepted →
        in-flight → applied|failed|unknown; unknown is first-class; before any re-apply exactly one bounded
        query by stable identity is required. For a tracker transition or comment the query is the
        comment/transition identity: found → applied/already-applied with no second effect; not-found → one
        re-apply with a new receipt; unreadable → stays unknown with no blind retry. For a commit the query
        is exactly one bounded `logSince(baselineHead)` read and the verdict is applied/already-applied only
        when the read yields exactly one new commit AND that commit's normalized changed-path set equals
        the recorded set; the receipt records the discovered SHA and no second commit is created. Zero
        commits, more than one commit, a path-set mismatch, an unreadable or over-cap read, or a baseline
        that cannot be placed in HEAD's ancestry leaves the effect unknown with NO automatic re-apply and
        NO guessed SHA. The identity is message-independent — (baselineHead, changeRef, phase, sorted
        normalized staged path set); no recorded identity, match input, or match rule reads the commit
        message or any model output; the idempotency key is derived deterministically from (changeRef,
        phase, baselineHead) and every re-drive reuses it verbatim. An illegal transition is a classified
        state.* failure, never a fabricated value. Three negative controls must each fail the convergence
        test: break the recorded path-set derivation, remove the log query, and accept a path-set mismatch
        as a match. [F-9, F-10; DEC-4, DEC-15, DEC-19; TDR-0014 INV-1..INV-8; DM-9, DM-10, DM-11, DM-18;
        NFR-4, NFR-15; AC-F8-4, AC-F10-1, AC-F10-2; TC-EFFECT-001/002/003/004/005, TC-RECON-007]
