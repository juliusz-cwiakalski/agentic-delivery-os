      - >-
        1.3 packages/core/src/contracts/control.ts — NEW data-only module: CONTROL_PROTOCOL_CURRENT = 1,
        CONTROL_PROTOCOL_FLOOR = 0, the offered set [1, 0]; frame kinds {request, response, event, error};
        interaction classes {poke, query, subscribe, control}; wire types exactly {poke, status, lane,
        subscribe, drain, stop, takeover, frame, degraded} per Appendix B; closed topics {queue, lanes};
        the frame envelope {v, id?, kind, type, callerPrincipal, payload?|data?|error?} with exactly one
        body field; the request/response/event/error payload shapes; the degraded event reasons; the
