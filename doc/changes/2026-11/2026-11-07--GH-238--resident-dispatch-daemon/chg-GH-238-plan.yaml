        14.4 F-4 (medium) — make `appendOutboxEffect` idempotent under concurrency by performing the
        dedupe read and the append under one fence acquisition; a racing caller that loses the fence
        re-reads once for an identical prior intent. Add a deterministic interleaving test where the
        second caller runs between the first caller's read and append and exactly one intent remains.
