        StateStorePort: append exactly one `outbox.effect` intent BEFORE the delivered commit primitive is
        invoked (effectId, originating intentId, ref, closed kind, bounded target, payload digest,
        idempotency key, optional additive `callerPrincipal`, state, attempts, check strategy
        (query-by-id for a tracker effect, query-by-log-since for a commit), time; a commit intent also
        carries changeRef, phase, the single baselineHead
        read used both for the intent and the primitive's reset baseline, and the sorted normalized staged
        path set computed pre-commit with the delivered pure staging computation over one tree read and the
        same scope request the primitive receives; repo-relative paths, `/` separators, no leading `./`,
        deduplicated, sorted; only paths, never content). It carries no message, subject, body, or
        fingerprint. If HEAD cannot be read, no effect starts and the primitive is not invoked. Append
        terminal/attempt receipts with bounded evidence; latest outbox record per effect id wins; the first
        terminal receipt per effect and attempt is authoritative; bounded content is resolved from the
        durable originating intent at apply time through EffectIntentPort. This composition is the
        lane/one-shot owner path and is never imported by the daemon composition. [F-9, F-10; EVT-6, EVT-7;
        DM-9, DM-10, DM-18; TDR-0014 INV-1..INV-3; NFR-12, NFR-15; AC-F10-1, AC-F10-2;
        TC-EFFECT-001/002/005, TC-LANE-002, TC-VOCAB-001 receipt/outbox]
      - >-
        7.3 Reconciliation detection — extend packages/core/src/app/daemon-reconcile.ts to scan effects in
        in-flight or unknown state and perform exactly one bounded query per effect: one bounded
        `logSince(baselineHead)` read plus path-set match for a commit, one query by stable identity for a
        tracker effect. For each unresolved effect it appends the durable DM-18 redrive request, carried by
        the existing `command.receipt` kind (no new record kind): effect identity, `attempt: 0`, the
        baseline it queried, the observed verdict (`found`, `not-found`, `unreadable`), the discovered SHA
        when one was proven, and the time. The redrive request is evidence only: it does not advance the
        effect state machine, does not count as an attempt, creates no commit, runs no phase, appends no
        transition, and never re-applies or guesses a SHA. The daemon only detects and records; the
        lane/one-shot owner applies and restores the binding (DEC-19). Include the effect outcomes in the
        reconciliation report evidence. The pass must converge tracker transitions/comments through receipts
        with zero duplicated tickets, comments, or commits after a kill and restart. Controls: removing the
        log query must fail the convergence assertion, and a daemon-boundary control must leave the
        recording commit/phase/transition ports at zero. [F-8, F-9, F-10; DEC-19; TDR-0014 INV-6/INV-7;
