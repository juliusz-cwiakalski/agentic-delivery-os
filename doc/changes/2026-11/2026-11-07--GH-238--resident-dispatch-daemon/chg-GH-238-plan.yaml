  - id: 7
    title: "External-effect protocol — outbox intent and command receipt records, the legal state machine, first-class unknown, one query-based check before re-apply, and commit crash safety through a pre-commit outbox intent with a message-independent path-set identity matched by a bounded logSince(baselineHead) read"
    kind: delivery
    objective: "Make externally visible effects crash-safe with intent, receipt, unknown, check-before-reapply, and commit crash protection through a durable pre-commit intent whose (baselineHead, changeRef, phase, sorted normalized staged path set) identity is matched by one bounded logSince(baselineHead) read; the lane/one-shot owner applies and restores the binding, while the daemon only records a DM-18 redrive request."
    scope:
