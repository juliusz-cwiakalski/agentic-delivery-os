  - id: 2
    title: "Fence-style daemon lock with evidenced stale takeover, the durable instance ledger, and the heartbeat record with its three-state liveness fold"
    kind: delivery
    objective: "Make single-instance ownership and liveness durable and testable before anything runs: the fence-style lock, the instance ledger, and the heartbeat."
    scope:
      files:
        - "packages/core/src/domain/daemon-lock.ts"
        - "packages/core/src/domain/daemon-heartbeat.ts"
        - "packages/core/src/app/daemon.ts"
        - "packages/core/src/app/index.ts"
        - "packages/core/src/state/daemon-lock.ts"
        - "packages/core/src/state/index.ts"
        - "packages/core/src/index.ts"
        - "packages/core/src/contracts/daemon.ts"
        - "tests/behaviour/daemon-lock.test.ts"
        - "tests/behaviour/daemon-lock-concurrency.test.ts"
        - "tests/behaviour/daemon-heartbeat.test.ts"
        - "tests/structure/daemon-contract.test.ts"
        - "tests/structure/content-inventory.test.ts"
        - "tests/structure/inventory.json"
        - "tests/types/daemon-protocol.type-test.ts"
      folders:
        - "tests/fixtures/daemon/lock"
        - "tests/fixtures/daemon/heartbeat"
    interactions:
      - kind: contract-file
        target: "packages/core/src/contracts/daemon.ts"
        role: consumer
    weightClass: standard
    doneArtifacts:
      pipelineId: "phase 2 lock/instance/heartbeat gate green locally; GH-238 PR CI matrix green"
      trackerTransition: "phase 2 committed on feat/GH-238/resident-dispatch-daemon; GH-238 remains In Progress"
    summary: "feat(GH-238): fence-style daemon lock, durable instance ledger, and heartbeat liveness"
    tasks:
      - >-
        2.1 packages/core/src/domain/daemon-lock.ts — pure lock policy: a lock record carries a unique lock
        token, instance id, pid, the state-directory scope digest (the first 16 lowercase hex characters of
        SHA-256 over the canonical absolute state-directory path; no raw path is stored and the mapping is
        recoverable by recomputation), acquiredAt, and heartbeatAt; staleness is `heartbeat age >=
        daemon.lock-staleness` with the at-bound value stale and `bound - 1` live; a live holder refuses with
        daemon.already-running and zero appends; a stale holder is takeover-eligible and produces
        operation `taken-over` evidence (previousInstanceId, previousLockToken, lastHeartbeatAt,
        heartbeatAgeMs, takenOverAt). The lock token and staleness window are explicitly distinct types
        from the delivered state fence handle and fence staleness; no wall clock is read (nowMs is
        injected). [F-2; DM-1; NFR-3; AC-F2-1, AC-F2-2; TC-LOCK-001/002/003/006]
      - >-
        2.2 packages/core/src/state/daemon-lock.ts — the daemon-owned lock artifact `daemon.lock` in the
        state directory over the injected StateRuntimeEdge: exclusive create (wx) with 0600, a 0700
        directory verified before use, a verified read that classifies torn/unreadable/permission failures
        through the delivered state.* identities, and removal only by the token holder. The state tier
        imports contracts only; runtime APIs stay in the driver edge. The lock is acquired for the daemon
        lifetime while the state writer fence is acquired only for each append and never for a heartbeat
        or idle period. [F-2, F-3; TDR-0004; NFR-3, NFR-13; AC-F2-2; TC-LOCK-006]
      - >-
        2.3 packages/core/src/app/daemon.ts — the instance ledger over the injected StateStorePort:
        appendDaemonInstance/readDaemonInstance for operations acquired, taken-over, released, and
        immediate-stop under a short fenced append with a verified post-append read; latest record wins;
        an identical replay appends nothing; a second live acquisition for one scope is a classified
        state.* failure and never a fabricated owner; takeover evidence is carried only on `taken-over`.
        The instance record stores the same non-path scope digest as the lock (DM-1 derivation), never the
        absolute state-directory path. [F-2, F-7; EVT-1; DM-1; NFR-2, NFR-9; AC-F2-1, AC-F2-2;
        TC-LOCK-001/002, TC-VOCAB-001 instance round-trip]
      - >-
        2.4 packages/core/src/domain/daemon-heartbeat.ts + app/daemon.ts — the heartbeat record builder
        (instanceId, monotone ordinal, beatAt, uptimeMs, queueDepth, laneCounts {delivering, idle, parked,
        failed}, optional currentSpawn {ref, sessionId}, consumed cursor, recordedAt) and the three-state
        liveness fold: running below daemon.lock-staleness, stale at or beyond it, stopped when the latest
        instance record is `released` or `immediate-stop`. A gap is stale evidence and is never filled by a
        fabricated beat; a reader never synthesizes one. [F-7; EVT-2; DM-2; NFR-1, NFR-2; AC-F7-1;
        TC-HEART-001/002]
      - >-
        2.5 Lock and heartbeat behaviour suites — tests/behaviour/daemon-lock.test.ts covers live refusal
        with the holder's identity/pid/acquisition/heartbeat age, stale takeover with full evidence, live
        takeover refusal at exit-class 1 with zero appends, two independent state directories, and the
        lock-vs-fence separation (short append-only fence windows, distinct tokens, distinct error
        identities). tests/behaviour/daemon-lock-concurrency.test.ts releases 100 scheduled contenders at
        a staleness read barrier and asserts exactly one acquisition and 99 evidenced refusals, plus a
        same-holder control. tests/behaviour/daemon-heartbeat.test.ts covers ordinal monotonicity, interval
        boundaries at bound-1/bound/bound+1, no fabrication, and queue depth/lane counts/cursor content.
        [F-2, F-7; NFR-3; AC-F2-1..AC-F2-3, AC-F7-1; TC-LOCK-001..006, TC-HEART-001/002]
      - >-
        2.6 Register packages/core/src/{domain/daemon-lock,domain/daemon-heartbeat,app/daemon,state/daemon-lock}.ts
        in tests/structure/inventory.json with executable allowances; extend the contract test with the
        record round-trips; keep tests/types/daemon-protocol.type-test.ts literal-typed for the lock and
        instance operation unions. [NFR-14; TC-VOCAB-001 instance/heartbeat round-trip, TC-LANE-006 structure]
    coverage:
      - "TC-LOCK-001 (engine half: live refusal with holder evidence and zero appends; CLI envelope and golden complete in Phase 5)"
      - "TC-LOCK-002 (engine half: stale takeover with complete previous-instance evidence; CLI envelope and golden complete in Phase 5)"
      - "TC-LOCK-003 (full: a live-lock takeover is refused with zero appends)"
      - "TC-LOCK-004 (partial: lock/instance/heartbeat isolation across two state directories, each record carrying the first-16-hex SHA-256 scope digest and never the absolute path; frame isolation completes in Phase 3)"
      - "TC-LOCK-005 (full: 100 scheduled starts yield exactly one live daemon)"
      - "TC-LOCK-006 (full: the daemon lock is not the state write fence)"
      - "TC-HEART-001 (full: ordinal, depth, lane counts, current spawn, and cursor are recorded)"
      - "TC-HEART-002 (state half: no reader fabricates a beat; the stop release record completes in Phase 5)"
      - "TC-VOCAB-001 (instance and heartbeat round-trip rows)"
    acCoverage:
      - "AC-F2-1"
      - "AC-F2-2"
      - "AC-F2-3"
      - "AC-F7-1"
    testGate:
      - "pnpm typecheck"
      - "bun test tests/behaviour/daemon-lock.test.ts tests/behaviour/daemon-lock-concurrency.test.ts tests/behaviour/daemon-heartbeat.test.ts"
      - "bun test tests/structure/daemon-contract.test.ts tests/structure/content-inventory.test.ts"
      - "pnpm check:boundaries"

  - id: 3
    title: "Control protocol v1 — transport-free codec, session layer with correlation/subscriptions/overflow/timeouts, multi-connection dispatcher, and stdio plus unix transports with the conformance proof"
    kind: delivery
    objective: "Deliver the transport-free protocol and its two local transports with a conformance proof, so the control plane is stable before the daemon serves it."
    scope:
      files:
        - "packages/core/src/domain/control-codec.ts"
        - "packages/core/src/domain/control-session.ts"
        - "packages/core/src/app/control-server.ts"
        - "packages/core/src/app/index.ts"
        - "packages/core/src/index.ts"
        - "packages/core/src/contracts/control.ts"
        - "packages/adapters/src/daemon/index.ts"
        - "packages/adapters/src/daemon/transport.ts"
        - "packages/adapters/src/daemon/stdio.ts"
        - "packages/adapters/src/daemon/unix.ts"
        - "packages/adapters/src/daemon/errors.ts"
        - "packages/adapters/package.json"
        - "packages/cli/package.json"
        - "packages/mcp/package.json"
        - "packages/opencode/package.json"
        - "packages/testkit/package.json"
        - "scripts/checks/workspace-entrypoints.ts"
        - "tests/behaviour/control-codec.test.ts"
        - "tests/behaviour/control-session.test.ts"
        - "tests/behaviour/control-connection.test.ts"
        - "tests/behaviour/control-conformance.test.ts"
        - "tests/behaviour/control-transport.test.ts"
        - "tests/checks/daemon-hermetic.test.ts"
        - "tests/checks/daemon-bounds.test.ts"
        - "tests/structure/daemon-contract.test.ts"
        - "tests/structure/daemon-imports.test.ts"
        - "tests/structure/content-inventory.test.ts"
        - "tests/structure/inventory.json"
      folders:
        - "tests/fixtures/daemon/wire"
        - "tests/fixtures/daemon/transport"
        - "tests/fixtures/daemon/hermetic"
        - "tests/fixtures/daemon/privacy"
        - "tests/fixtures/daemon/bounds"
    interactions:
      - kind: contract-file
        target: "packages/core/src/contracts/control.ts"
        role: consumer
    weightClass: standard
    doneArtifacts:
      pipelineId: "phase 3 protocol and transport gate green locally; GH-238 PR CI matrix green"
      trackerTransition: "phase 3 committed on feat/GH-238/resident-dispatch-daemon; GH-238 remains In Progress"
    summary: "feat(GH-238): control protocol v1 codec, session layer, dispatcher, and stdio/unix transports"
    tasks:
      - >-
        3.1 packages/core/src/domain/control-codec.ts — a total NDJSON codec that knows nothing about
        sockets, files, or processes: encode to exactly one JSON object plus one trailing newline; decode
        and validate v/id/kind/type/callerPrincipal and exactly one of payload|data|error; refuse an unknown
        kind, type, topic, version, or a frame over daemon.frame-max-bytes BEFORE parsing into an action;
        map every refusal to the delivered error table. Round-trip is byte-identical for canonical input.
        [F-4, F-5; EVT-8; DM-6; NFR-9, NFR-14; TC-WIRE-001, TC-WIRE-005]
      - >-
        3.2 packages/core/src/domain/control-session.ts — the session layer over frames, not bytes: one
        connection owns its correlation ids (never cross-connection), version negotiation serves 1 and floor
        0 and refuses anything else with daemon.protocol.unsupported plus the offered set [1, 0] before any
        action, every subscription owns a bounded buffer and the last delivered cursor, a full buffer emits
        exactly one degraded event carrying subscriber-overflow and drops only that subscription, and every
        request has a bounded response timeout driven by the injected DaemonClockPort (no ambient timer). Control frames (drain, stop, takeover) delegate a
        token-guarded at-most-once action. No codec or session branch reads a transport identity.
        [F-4, F-6; EVT-8, EVT-9; DM-7; NFR-5, NFR-6, NFR-15; AC-F4-1, AC-F4-3, AC-F4-4, AC-F6-1,
        AC-F6-2; TC-WIRE-002/003/004/005/008, TC-CONC-001/004/005]
      - >-
        3.3 packages/core/src/app/control-server.ts — the multi-connection, single-event-loop dispatcher:
        accepts frames from every connection, mutates shared in-memory state only on the loop, routes each
        response only to the asking connection, serializes control actions through an injected at-most-once
        control store keyed on (connection identity, frame `id`, lock token): a replay on the SAME
        connection with the same `id` returns the prior acknowledgement and performs no second action,
        while an `id` reused on a DIFFERENT connection is a distinct new request that is executed and
        answered on its own merits, never answered as already applied; a same-connection replay with a
        different type or payload and any wrong/absent lock token are refused. The dispatcher invokes
        injected callbacks for poke/query/subscribe/drain/stop/takeover. It never invents a mutating wire
        request or an idempotency key on the envelope; state-path intent application under DM-17 is
        Phase 4. No state write happens in the dispatcher; it calls the injected application ports.
        [F-4, F-6; DM-6, DM-7, DM-9, DM-10, DM-17; NFR-6, NFR-15; AC-F4-3, AC-F6-1, AC-F6-2;
        TC-WIRE-003/004/008, TC-CONC-001/004/005]
      - >-
        3.4 packages/adapters/src/daemon/{transport,stdio,unix,errors}.ts — the production ordered
        byte-stream bindings behind ControlTransport: the transport binding itself, a stdio adapter, and
        a unix adapter that binds `<state-dir>/daemon.sock` only after verifying the 0700
        directory, applies 0600 to the socket, refuses a path or mode that escapes the contract, removes a
        stale socket file only after the daemon lock is owned, and classifies an unopenable transport as a
        declared degradation rather than a fallback. Same-user enforcement is the permission contract (the
        0700 directory is the kernel denial); no in-process credential inspection and no shell. The
        in-memory transport pair used by tests lives in tests/fixtures/daemon/transport/ (declared in this
        phase), is imported by the conformance and connection suites, and is never exported from the
        published `@delivery-os/adapters/daemon` subpath. [F-5; DM-6, DM-14; NFR-12; AC-F5-1;
        TC-TRANSPORT-001/002/003/004/005]
      - >-
        3.5 Conformance and transport-independence proof — tests/behaviour/control-conformance.test.ts drives
        the identical request, response, event, error, poke, query, subscribe, and control frames over the
        production stdio and unix bindings plus the in-memory pair imported from
        tests/fixtures/daemon/transport/ and asserts identical behaviour; tests/structure/daemon-imports.test.ts
        asserts the codec imports no transport, the session imports no socket/file/process module, and no
        test double is exported from the production subpath. [F-4, F-5; AC-F4-2; NFR-5; TC-TRANSPORT-001]
      - >-
        3.6 Connection and concurrency suites — tests/behaviour/control-connection.test.ts asserts two
        simultaneous `status --live` invocations each receive their own id-correlated response with zero
        frame leakage; a duplicated control frame replayed on the same connection with the same `id` and a
        valid lock token performs exactly one drain/stop/takeover action (with a response per request id and
        no second transition); the same `id` sent on a second connection is a distinct new request that is
        executed and answered independently, never answered as already applied; a same-connection replay
        with the same `id` but a different type or payload, and any wrong or absent token, are refused; a
        timeout degrades instead of blocking. The session suite asserts 100 slow subscribers keep
        dispatcher latency bounded and each overflowing subscription receives exactly one degraded event.
        The state-path same-key/different-key intent application, and therefore TC-CONC-002/003, lands in
        Phase 4. [F-4, F-6; DM-6, DM-7, DM-9, DM-10, DM-17; NFR-5, NFR-6, NFR-15; AC-F4-3, AC-F6-1,
        AC-F6-2; TC-WIRE-003/004, TC-CONC-001/004/005]
      - >-
        3.7 Hermetic, bounds, and privacy guards — tests/checks/daemon-hermetic.test.ts arms a throwing
        globalThis.fetch guard and asserts zero real sockets, network calls, credential reads, or unbounded
        sleeps in the protocol suites; tests/checks/daemon-bounds.test.ts asserts the frame-size refusal
        happens before parsing and the per-subscription buffer never exceeds its bound; canaries assert no
        credential value, credential token, secret material, prompt, body, transcript, diff, or provider
        payload can appear in a frame or golden. The daemon lock token is explicitly outside the canary
        set as a same-user ownership capability and must carry no credential-shaped value; the canary
        fails if any other credential value transits. [NFR-7, NFR-9, NFR-12; TC-WIRE-006, TC-BOUNDS-001
        frame half, TC-PRIVACY-001 wire half, TC-HERMETIC-001 wire half]
