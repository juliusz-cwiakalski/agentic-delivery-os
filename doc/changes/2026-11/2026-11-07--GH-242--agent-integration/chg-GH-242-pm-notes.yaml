decisions:
  - text: "D1 — Scope includes the minimum executable and self-description surface the prompts need: a neutral CLI entrypoint plus --help/--version. The prompts cannot consume a primitive with no invocation path or help."
    date: "2026-11-07"
  - text: "D2 — Lifecycle phase state is written only through the phase family. The PM stops hand-editing started/completed fields; completion is the only transition needed, and the tool creates the entry. PR URL is recorded as a note, not as hand-written phase state."
    date: "2026-11-07"
  - text: "D3 — Reverses GH-227 DEC-6 for agent adoption: commit and phase complete must run inside lifecycle sessions, because that is where PM and coder operate. The delivery-session refusal is removed; the harness one-shot still runs in a sanitized empty project context."
    date: "2026-11-07"
  - text: "D4 — Lifecycle completion staging scope is the mapped plan-phase scope UNION the change folder, so artifact phases (spec, test plan, plan, review notes, pm-notes) commit atomically with their transition."
    date: "2026-11-07"
  - text: "D5 — @committer stops hand-crafting raw-git commits: its instruction becomes a thin executor of the typed commit primitive. Every lifecycle prompt calls the primitive directly or delegates to the primitive-backed committer."
    date: "2026-11-07"
  - text: "D6 — Typed blockers are the only blocker channel for lifecycle agents: publish via blockers publish, consume via blockers list/answer. The pm-notes blockers collection stays schema-allowed but is no longer an agent write target."
    date: "2026-11-07"
  - text: "D7 — Coordinator J1 iteration is expressed with status, blockers, merge, closeout, and queue plan. Per-ticket delivery still calls the bash dispatch until M1-S9 lands; that entry point is not retired, so it is not demoted from a primary path."
    date: "2026-11-07"
open_questions: []
blockers:
  - text: "DoR iteration 1 NOT_READY: RR-1 missing DoD; RR-2 reverse failure window in completion ordering; RR-3/4/5 hidden phase dependencies; RR-6 state/mcp misclassification; RR-7 four current-truth specs omitted; RR-8 fixture inventory gaps/name mismatches; RR-9 entrypoint/no-config identity undefined; RR-10 non-deterministic thresholds and unowned composition AC; RR-11 one-PR risk acceptance missing."
    date: "2026-11-07"
    resolved_date: "2026-11-07"
notes:
  - text: "Clarify-scope cross-check found no requirement contradiction with doc/spec: the typed primitives exist (phase, commit, plan, blockers, status, merge, closeout, queue), but their agent adoption is explicitly deferred by GH-227 NG-1 and is this ticket's job."
    type: info
    date: "2026-11-07"
  - text: "Doc impact: doc/spec feature pages for commit, pm-notes/phase, result contract, status/blockers, and the guides change-lifecycle, AGENTS.md, and autonomous-batch-delivery must be reconciled. New guide required for agent-facing primitive calls."
    type: risk
    date: "2026-11-07"
  - text: "Retro: state detection took an extra pass because the GitHub default branch (main) is stale while delivery truth is main-tools; git/gh local checks were required."
    type: retro
    date: "2026-11-07"
  - text: "OQ resolution: no split; TDR-0013 authored for the session-guard reversal; help + reconciled reference pages satisfy the guide obligation; prompt-required composition subset."
    type: decision
    date: "2026-11-07"
  - text: "PM decision after DoR iter-1: keep one ticket/PR (delivery brief requires exactly one work item), accept the review-risk explicitly, and repair hidden dependencies by reordering phase tests and moving prompt/doc scans after their inputs. Reopen specification, test_planning, and delivery_planning."
    type: decision
    date: "2026-11-07"
  - text: "PM decision after DoR iter-2: close the residual forward dependencies in one pass — move pilot-fixture privacy/safety scanning into phase 9/final, add edge.ts and the commit/phase feature specs to their owning phases, use the existing platform-classified fallback.internal identity instead of inventing a config composition row, scope system-spec scans after reconciliation, and split the help coverage test from reference-page reconciliation."
    type: decision
    date: "2026-11-07"
  - text: "Retro: DoR caught a real atomicity hole (document written, commit failed) and several forward dependencies; the plan was too eager to put conformance scans before the artifacts they scan. Reopening is cheaper than discovering this in review."
    type: retro
    date: "2026-11-07"
  - text: "Retro: DoR iteration 2 found that moving scans to later phases created new ownership gaps (pilot data in phase 8, system specs in phase 8, reference-page inventory in phase 1). The plan needs a single explicit 'who owns which artifact' matrix before re-entry, not piecemeal moves."
    type: retro
    date: "2026-11-07"
  - text: "DoR iteration 3: READY. Non-blocking RR-28..RR-31 fixed in spec v1.3 as an ownership/phrase consistency pass; no behavior or AC change."
    type: info
