decisions:
  - text: "D1 — Scope includes the minimum executable and self-description surface the prompts need: a neutral CLI entrypoint plus --help/--version. The prompts cannot consume a primitive with no invocation path or help."
    date: "2026-11-07"
  - text: "D2 — Lifecycle phase state is written only through the phase family. The PM stops hand-editing started/completed fields; completion is the only transition needed, and the tool creates the entry. PR URL is recorded as a note, not as hand-written phase state."
    date: "2026-11-07"
  - text: "D3 — Reverses GH-227 DEC-6 for agent adoption: commit and phase complete must run inside lifecycle sessions, because that is where PM and coder operate. The delivery-session refusal is removed; the harness one-shot still runs in a sanitized empty project context."
    date: "2026-11-07"
  - text: "D4 — Lifecycle completion staging scope is the mapped plan-phase scope UNION the change folder, so artifact phases (spec, test plan, plan, review notes, pm-notes) commit atomically with their transition."
    date: "2026-11-07"
  - text: "D5 — @committer stops hand-crafting raw-git commits: its instruction becomes a thin executor of the typed commit primitive. Every lifecycle prompt calls the primitive directly or delegates to the primitive-backed committer."
    date: "2026-11-07"
  - text: "D6 — Typed blockers are the only blocker channel for lifecycle agents: publish via blockers publish, consume via blockers list/answer. The pm-notes blockers collection stays schema-allowed but is no longer an agent write target."
    date: "2026-11-07"
  - text: "D7 — Coordinator J1 iteration is expressed with status, blockers, merge, closeout, and queue plan. Per-ticket delivery still calls the bash dispatch until M1-S9 lands; that entry point is not retired, so it is not demoted from a primary path."
    date: "2026-11-07"
