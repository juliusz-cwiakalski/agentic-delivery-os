    type: info
    date: "2026-11-07"
  - text: "Doc impact: doc/spec feature pages for commit, pm-notes/phase, result contract, status/blockers, and the guides change-lifecycle, AGENTS.md, and autonomous-batch-delivery must be reconciled. New guide required for agent-facing primitive calls."
    type: risk
    date: "2026-11-07"
  - text: "Retro: state detection took an extra pass because the GitHub default branch (main) is stale while delivery truth is main-tools; git/gh local checks were required."
    type: retro
    date: "2026-11-07"
  - text: "OQ resolution: no split; TDR-0013 authored for the session-guard reversal; help + reconciled reference pages satisfy the guide obligation; prompt-required composition subset."
    type: decision
