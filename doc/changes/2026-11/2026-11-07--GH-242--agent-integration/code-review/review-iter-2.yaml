      Sentence-local negation is not positional: a negation word after the offending token
      in the same sentence (e.g. "Run git add, then never commit.") still exempts the
      earlier forbidden token. This is the accepted "sentence-local" resolution F-5 permitted
      and is strictly better than the prior whole-line skip; not a regression.
    suggestion: >-
      Optional future refinement — require the negation to precede the prohibited token
      within the sentence.
