    interactions:
      - kind: contract-file
        target: packages/cli/src/help.ts
        role: producer
      - kind: contract-file
        target: packages/cli/package.json
        role: producer
    doneArtifacts:
      trackerTransition: "GH-242 in progress; phase 1 evidence recorded in pm-notes notes (entrypoint, help/version, fallback.internal composition honesty, static help coverage inventory)"
    leases:
      - lease:cli-runtime
    weightClass: standard
    summary: "Deliver the executable as a non-installed Bun bin (`packages/cli/bin/delivery-os.ts`, Bun shebang, mapped in the package `bin` manifest next to the `main`/composition entry) plus the composition it invokes. The working name resolves configuration → non-empty DELIVERY_OS_WORKING_NAME override → neutral `delivery-os` default, the neutral default applies to --help/--version identity only when neither source yields a name, and it is not the seed literal. Root help, per-command help, and --version are asserted with zero state/network/git/configuration reads and zero writes inside the suite's fixed timeout; wall-clock timing is informational and never a gate. Composition honesty (TC-ENTRY-009) is a must-pass here: exactly the §8.1 prompt-required set, `state`/`mcp`/`dispatch`/daemon asserted absent (state-scope invariant re-run), and an uncomposed invocation fails closed through the existing `fallback.internal` containment identity (platform category, `retryable: false`, `consequence: unknown`, platform-provider projection → exit 2) with a summary naming the missing composition. It introduces no new error-table row and changes neither the machine nor the documented table; the only table change in this change is the `commit.session.context-refused` retirement in phase 2, and `fallback.internal` is already documented in `feature-result-contract.md`, so no documented-table count changes. `scripts/install.sh` and the installer tests are not modified; the bin is absent from the install set. This phase also creates the static help coverage inventory (`tests/fixtures/help-guide/coverage.json`): TC-ENTRY-004 asserts that each see-also target maps to an inventory row only; reconciled reference-page existence and parity stay in phase 7/8 (`TC-HELP-001`/`TC-HELP-003`)."
    tests:
      - "bun test tests/behaviour/entrypoint-version.test.ts"
      - "bun test tests/behaviour/entrypoint-help.test.ts"
      - "bun test tests/behaviour/entrypoint-help-coverage.test.ts"
