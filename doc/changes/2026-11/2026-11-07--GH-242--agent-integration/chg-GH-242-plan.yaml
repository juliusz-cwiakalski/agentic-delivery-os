    weightClass: heavy
    summary: "Widen lifecycle completion staging to the mapped plan scope union the change folder, add plan-absent change-folder staging for standalone commit, and write the pm-notes transition before the commit act. The reverse window is specified and tested (AC-F2-4, DEC-16): the completion snapshots the pre-write pm-notes bytes; safety STOP, staging refusal, commitlint failure, or atomic abort after the document write restores those exact bytes, leaves no ledger transition and no commit, and returns the classified failure without claiming success; a failed restoration exits 2 with a classified platform fault carrying the affected pm-notes path and the snapshot source as its reconciliation instruction; a retry lands exactly one transition and exactly one commit, and a further run is a stable no-op. The legacy window (commit landed, document write later failed) still converges from the stored transition without a second commit. Unrelated strays, forbidden paths, and oversized binaries stay excluded and disclosed. Phase-session adoption staging assertions moved here from phase 2. This phase reconciles the two behavior-spec rows of §16.1.1 that it owns — `feature-commit-primitive.md` (completion ordering, staging scope, in-session execution, five-row domain) and `feature-pm-notes-lint-and-phase-transitions.md` (atomic ordering, restore semantics, five-row domain; the session-refusal/five-row text is co-owned with phase 2) — and runs the `scope: behavior-spec` doc-conformance case (TC-DOCREC-004), so phase 3 is green before the phase-10 full run."
