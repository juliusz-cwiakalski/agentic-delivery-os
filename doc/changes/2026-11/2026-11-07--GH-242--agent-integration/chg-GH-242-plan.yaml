    weightClass: heavy
    summary: "Remove the delivery-session refusal from commit and phase complete and retire commit.session.context-refused across the machine table, documented table, corpora, fixtures, and goldens, shrinking the commit domain from six rows to five. This phase proves only the guard-removal half: in-session standalone commit and in-session phase complete no longer refuse, the harness one-shot stays sanitized in a temporary empty project context, and the error row is retired and in sync. It deliberately does not assert artifact/pm-notes staging, completion ordering, or --no-commit convergence; those are phase-3 assertions owned by TC-STAGE-001/003/006/009. The production composition no longer injects session keys into commit/phase: the sessionFacts wiring is removed from `packages/cli/src/edge.ts`, and the guard is removed from the commit and phase-complete handlers, not merely left unwired. The `CommitSessionFacts` contract and the `packages/adapters/src/session/delivery-session-facts.ts` export stay in place unchanged for compatibility. This phase co-owns the session-refusal/five-row text in `feature-pm-notes-lint-and-phase-transitions.md`; phase 3 owns the completion-ordering/staging text. TDR-0013 remains owner-controlled and acceptance-pending at PR review: the tier trigger is `tdr-acceptance-required-at-pr`, not an owner-approval gate."
