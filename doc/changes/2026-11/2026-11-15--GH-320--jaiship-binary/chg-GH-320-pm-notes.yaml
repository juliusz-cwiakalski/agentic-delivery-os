  - text: "Clarify-scope cross-check vs current truth (doc/spec/features):
      feature-cli-entrypoint.md declares one non-installed bin
      (packages/cli/bin/delivery-os.ts) and an explicit install posture that
      excludes the bin; feature-branding-seam.md defines the 12-value derivation
      (working name `jaiship` yields binaryName `jaiship`, configDirectoryName
      `.jaiship`, stateDirectoryName `.jaiship-state`, installPath
      `~/.jaiship/bin/jaiship`); feature-config-layer.md and feature-projects.md
      define `<repo>/<configDirectoryName>/config.yaml` and the host root
      `<PREFIX>_STATE_DIR` else `<home>/<stateDirectoryName>`. The existing
      legacy adapter covers ADOS_/.ados with a one-time warning and does not
      read a legacy config file, so a delivery-os -> jaiship read fallback is a
      new capability rather than an extension of the existing adapter."
    type: info
    date: "2026-11-15"
  - text: "Ticket dependency note: GH-310 (M2-S19 cross-repository changes) is still
      OPEN with no PR. The ticket's out-of-scope line forbids merging before
      GH-310 lands because the change shares entrypoint hot files. This delivery
      therefore stops at an open PR; it does not merge."
    type: risk
    date: "2026-11-15"
  - text: "Known design tension to resolve in the spec, not to invent around:
      packages/mcp/src/serve.ts has its own `delivery-os` default and its own
      DELIVERY_OS_WORKING_NAME read. If the CLI defaults to the jaiship identity
      while MCP keeps the delivery-os identity, host state and project config
      can diverge between the two surfaces. MCP identity is out of this ticket's
      scope; the spec must record the divergence as a documented transitional
      limitation with the explicit override seam, not as an unstated behaviour."
    type: risk
    date: "2026-11-15"
  - text: "Documentation impact map for phase 7: feature-cli-entrypoint.md (install
      posture, bin list, identity resolution), feature-branding-seam.md
      (neutral-default wording, installPath consumption, prior-identity read
      fallback), feature-config-layer.md (config directory fallback and state
      root fallback), feature-projects.md (host root fallback), README/install
      docs for the local install path, and the doc-distribution marker for any
      changed guide."
    type: info
    date: "2026-11-15"
