decisions:
  - text: "Legacy identity fallback is the chosen mechanism (not a migration
      command): AC4 requires `jaiship status --json` to read the existing
      `.delivery-os/config.yaml` and `~/.delivery-os-state` when the `.jaiship`
      equivalents are absent, with a classified one-time warning. The ticket
      offers fallback OR documented migration command; AC4 selects fallback."
    date: "2026-11-15"
  - text: "Scope boundary kept deliberately narrow: this slice adds the `jaiship`
      executable and its identity paths plus the legacy read fallback. Package
      scope (@delivery-os/*), repositoryUrl, docsBaseUrl, README and public docs
      stay unchanged per the ticket. The branding resolver keeps its neutral
      `@delivery-os` scope org, so a `jaiship` working name still derives
      `https://github.com/delivery-os/jaiship`; that is accepted and must be
      stated as out of scope in the spec, not silently 'fixed'."
    date: "2026-11-15"
  - text: "AC6 (`a local install from the change branch yields
      ~/.jaiship/bin/jaiship`) supersedes the current spec sentence that the bin
      is not part of the install surface. The spec must state the new install
      posture explicitly: a user-level local install registers a `jaiship`
      launcher at `~/.jaiship/bin/jaiship`, while the `delivery-os` bin mapping
      and the existing installer arrays for scripts/tools stay unchanged."
    date: "2026-11-15"
  - text: "`DELIVERY_OS_WORKING_NAME` remains the working-name override for both
      bins (ticket requirement). The `delivery-os` bin keeps its current
      configured default so its behaviour, including `.delivery-os` paths, is
      unchanged; only the new `jaiship` bin defaults to the `jaiship` identity."
    date: "2026-11-15"
  - text: "D5 (WITHDRAWN - superseded by verified evidence; DoR finding 1 was based
      on `statusComposition`'s empty provider chain, which is a different fact
      from project-configuration acquisition). Fixture proof: in a git worktree
      whose `.delivery-os/config.yaml` exists, `status --json` opens and reads
      that file four times (`O_RDONLY`, bytes verified via strace), as do
      `daemon status`, `coordinator status`, and `dispatch attempts`. In this
      checkout the file does not exist, so only the existence probe runs and no
      `openat` appears. The ticket's literal surface (`jaiship status --json`)
      therefore proves the configuration half and no deviation is needed;
      `config --json` is unreachable (`fallback.internal`, not in the composed
      prompt-required set) and must not be used. Recorded as DEC-14 in the
      spec."
    date: "2026-11-15"
  - text: "D6 (DoR finding 2, PM-decided): the compatibility alias keeps its
      delivered invalid-override projection. Verified:
      `DELIVERY_OS_WORKING_NAME='bad/name' ... status --json` exits 2 with
      `fallback.internal`, i.e. the resolver error is wrapped by the
      entrypoint's containment identity, for both bins. The spec's claim of a
      CLI-visible 'classified resolver error' is corrected to the delivered
      containment identity, AC-F2-7 is reworded accordingly, and the alias keeps
      0 observable behaviour change."
    date: "2026-11-15"
  - text: "D7 (DoR finding 5, PM-decided): the bounded literal inventory is five
      declared sites, not four: the three CLI selector sites, the unchanged MCP
      default, and `SCOPE_ORG = 'delivery-os'` in the branding resolver. The
      resolver's scope-org constant is declared as a derivation input (a scope
      literal, not a selector), and the guard asserts the declared rule and
      inventory rather than a bare count."
    date: "2026-11-15"
  - text: "D8 (DoR finding 7, PM-decided): no new decision record for DEC-5/DEC-9.
      DEC-5 corrects delivered truth rather than introducing a rule - declared
      `delivery-os` literals already exist in both bins, the MCP default, and
      the resolver, so the seam's real invariant is bounded, non-exported,
      single-derivation, and the feature spec sentence is inaccurate. DEC-9
      extends TDR-0022 without contradicting it: still exactly one effective
      host root per invocation, one home-plus-brand composition, and one
      `_PREFIX_STATE_DIR_` read; the fallback only changes which root is
      selected. The reasoning is recorded in the spec and the phase-7
      feature-spec update."
    date: "2026-11-15"
  - text: "D9 (DoR finding 4, PM-decided): the installer integration cases live in a
      Bun test at `tests/checks/install-launcher-installer.test.ts` that shells
      out to `scripts/install.sh` in a scratch HOME and scratch project root.
      This keeps them in the Bun-bearing test job and avoids adding a
      `scripts/.tests` shell suite that the CI bash job (jq only, no Bun) would
      auto-discover and fail. No `.github/workflows/ci.yml` change is required.
      The structural launcher case stays in
      `tests/structure/install-launcher.test.ts`."
    date: "2026-11-15"
  - text: "D10 (DoR finding 9, PM-decided): the only quality-gate command is the
      executable same-device invocation `TMPDIR=$(mktemp -d
      \"$HOME/.cache/ados-check-XXXXXX\") pnpm check`. The repo-local
      `TMPDIR=$PWD/tmp/tmpdir` invocation is recorded as evidence with the
      GH-313 mechanism, never as a gate."
    date: "2026-11-15"
  - text: "D11 (DoR finding 10, PM-decided): TC-BIN-084 uses a static import/surface
      scan plus a spawned `bun --preload <arm-counters> test <named suites>`
      subprocess whose exit code and captured violations are asserted.
      In-process counter arming around other suites is not implementable and is
      dropped."
    date: "2026-11-15"
  - text: "D12 (PM-decided): the DoR iteration cap is extended by one (iteration 4)
      for GH-320. Rationale: the trend is convergent (iteration 1: 5 blocking;
      iteration 2: 1 blocking; iteration 3: 1 blocking), and iteration 3's
      blocking finding is an assertion-form defect introduced by the iteration-2
      remediation, not a disagreement about product scope or design. No
      product/scope question is open. This extension and its reason are
      disclosed at the PR gate."
    date: "2026-11-15"
  - text: "D13 (PM-decided, DoR iter-3 finding 2): `behaviourally unchanged` for the
      alias includes the delivered pre-composition work an invalid override
      still performs before containment (the configuration probe/read and any
      state-root touch). This change neither adds nor removes it, and no
      artifact may assert or require zero reads / zero state access on that
      path. The positional-free command yields exit 2 `fallback.internal`; a
      subcommand-bearing command fails earlier at argument parsing with exit 1
      `fallback.invocation` — both delivered, both recorded, neither changed."
    date: "2026-11-15"
