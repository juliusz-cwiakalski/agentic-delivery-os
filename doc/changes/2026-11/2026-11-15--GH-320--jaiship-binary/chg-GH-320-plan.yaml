# Revision 1.6 is the PR-CI CLOSE-OUT. The first PR pipeline exposed two
# failures the local gate could not see, and both are now declared rather than
# patched silently:
#   - CI-ROOT-CAUSE (a): the local `pnpm check` does NOT run
#     `scripts/checks/privacy-literals.ts`. That scan is a CI invariant
#     (`privacy-ci-wiring`), so a pm-notes entry that quoted a branch-introduced
#     ABSOLUTE USER PATH passed every local gate and failed the PR privacy scan.
#     Phase 6 gains the obligation that the change-record entry carries no
#     absolute user-path literal.
#   - CI-ROOT-CAUSE (b): the CI `doc-distribution-guard` and `bash-tests` jobs
#     run `scripts/.tests/test-doc-distribution.sh`, whose install-set oracle
#     executes `install.sh --local`; the new launcher step requires Bun at
#     install time and neither job installed Bun (the Bun setup is per-job in the
#     `ts-*` jobs). Phase 6 therefore declares `.github/workflows/ci.yml` and
#     installs Bun in exactly those two jobs, with no other workflow behaviour
#     change.
#   Both root causes are recorded here because they are gate-coverage facts, not
#   coder slips: a local green cannot stand in for the CI-only invariants.
#
# Revision 1.7 completes that close-out with PR CI round 2. Installing Bun in the
#   two install-set-oracle jobs was necessary but not sufficient: with Bun
#   present, the launcher executes `packages/cli/bin/jaiship.ts`, whose
#   `@delivery-os/*` imports require an installed workspace, so a dependency-free
#   checkout fails with `Cannot find module '@delivery-os/adapters/credentials'`
#   and the oracle still cannot derive the set. Obligation 6.19 now also sets up
#   pnpm (the repository's pinned action, which reads `packageManager`) and runs
#   `pnpm install --frozen-lockfile` in those same two jobs, immediately after
#   the Bun setup. No other workflow behaviour changes; no scope path, TC, or
#   product behaviour changes. The notice-bound correction from the same PR round
#   is spec v1.10 (now v1.11) / test plan v1.8 (path-independent <= 400 bound) and
#   needs no
#   plan scope — reaffirmed inside 6.19.
#
# Revision 1.8 completes it with PR CI round 3. The dependency-free reproduction
#   proved that the install step alone was still insufficient: the workspace
#   package exports resolve to `dist`, which is git-ignored, so a fresh checkout
#   has neither the dependency links nor the built output the launcher's
#   `@delivery-os/*` imports need. Obligation 6.19 is now four ordered steps —
#   Bun setup, pnpm setup, `pnpm install --frozen-lockfile`, `pnpm build` — in
#   exactly the two jobs that run the install-set oracle; with (a)-(d) the oracle
#   is green. No other workflow behaviour changes, and no scope path, TC, or
#   product behaviour changes. The notice-bound correction stays spec v1.11 /
#   test plan v1.8 and still needs no plan scope.
