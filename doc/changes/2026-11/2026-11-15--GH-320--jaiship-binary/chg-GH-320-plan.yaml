phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Two executable identity selectors over one shared launcher.
  #
  # Goal: make `jaiship` a real process edge without forking the executable
  # surface. The manifest declares exactly two bins mapping to two distinct
  # existing entry files; packages/cli/src/bin-launcher.ts holds the ONE
  # launcher composition (read environment/cwd/home once, compose the production
  # program, return an exit code; behaviour exported as a function, never a
  # literal; never the command runtime); both bins are thin selectors declaring
  # non-exported local facts and delegating to it. entrypoint.ts takes the
  # REQUIRED `declaredWorkingName` as the identity floor (see the header design
  # pin), keeps `configuredWorkingName` as the optional override slot, passes the
  # optional prior identity through, adds the state-free `--print-install-path`
  # self-description member (one line, exit 0, answered before composition, no
  # family row, no global flag), and removes the neutral default constant AND
  # `neutralWorkingName` while retaining `workingNameEnvironmentVariable`.
  # Lenient self-description falls back to the invoking bin's declared default;
  # a configuration-bearing command keeps the DELIVERED `fallback.internal`
  # containment at exit 2; a missing declared default is that same containment,
  # never a substituted name.
  #
  # BYTE-TP-1 FIRST ACT: before any bin edit, capture
  #   bun packages/cli/bin/delivery-os.ts --version
  #   bun packages/cli/bin/delivery-os.ts --help
  #   DELIVERY_OS_WORKING_NAME='bad/name' bun packages/cli/bin/delivery-os.ts status --json
  # with the injected version/build the alias cases use, into
  # tests/fixtures/entrypoint/alias-baseline.json with a `capturedFrom` field
  # naming the pre-phase commit. It records version, help, and the
  # invalid-override `fallback.internal` projection with its summary; regenerate
  # only deliberately.
  #
  # B-2: run `pnpm install --frozen-lockfile` after the manifest change so
  # `node_modules/.bin/jaiship` exists; the semantic cell targets the entry file
  # and the linked cell fails with a named setup instruction, never skips.
  #
  # Obligations:
  #  1.1 packages/cli/package.json: two bins, `delivery-os` -> ./bin/delivery-os.ts
  #      (unchanged) and `jaiship` -> ./bin/jaiship.ts (new); no other manifest
  #      field changes (private, files, exports, workspaceImports untouched).
  #  1.2 bin-launcher.ts: the single shared composition, with
  #      `declaredWorkingName` required in its parameter object; no duplicate
  #      body in either bin; no direct command-runtime call.
  #  1.3 bin/jaiship.ts: Bun shebang; non-exported default `jaiship` and prior
  #      `delivery-os` locals; reads the override once; delegates. Exports
  #      `completion`, matching bin/delivery-os.ts, so the two bins' ONLY
  #      differences are the declared selector facts (TC-BIN-063's pinned allowed
  #      difference set) and both files carry the same inventory allowance.
  #  1.4 bin/delivery-os.ts: declares default `delivery-os`, no prior identity;
  #      observable behaviour unchanged; keeps its `completion` export.
  #  1.5 entrypoint.ts exactly as the header design pin states, including the
  #      install-path self-description member.
  #  1.6 Structure truth: entrypoint-bin.test.ts (two bins, two distinct existing
  #      files, the shared composition, the FIVE-site declared literal inventory
  #      under the `packages/**` string-literal scan rule with both-direction
  #      assertions and the sixth-site / missing-site / re-declared-accessor /
  #      field-literal controls, no residual neutral default, the no-declared-
  #      default containment call, family and error-table parity with a failing
  #      extra-family mutant, and the branding-seam corpus probe through the
  #      EXPORTED validateSeam over bin/** and src/entrypoint.ts);
  #      content-inventory.test.ts + inventory.json (exact file-set equality gains
  #      bin/jaiship.ts and src/bin-launcher.ts; per-file executable allowances
  #      for both bins including `completion`; the entrypoint allowance loses
  #      exactly `neutralWorkingName` and keeps `workingNameEnvironmentVariable`).
  #  1.7 The three delivered suites the neutral removal touches, updated to
  #      inject an explicit declared default (R-F):
  #      entrypoint-version.test.ts (its `versionRun({})` and `undefined`
  #      iterations), entrypoint-help-isolation.test.ts (its neutral cell), and
  #      tests/conformance/pilot/pilot-isolation.test.ts (its
  #      help/version cell). No cell is deleted; the conformance cell is updated,
  #      not removed (TC-BIN-082 step 1).
  #  1.8 daemon-start-detached.test.ts gains the identity matrix proving the
  #      delivered child-environment allowlist admits the working-name override
  #      and the brand-derived state-directory name for BOTH identities; no
  #      allowlist change (§8.5).
  #
  # Gate:
  #   pnpm install --frozen-lockfile
  #   pnpm typecheck
  #   bun test tests/behaviour/entrypoint-two-bins.test.ts
  #   bun test tests/behaviour/entrypoint-version.test.ts tests/behaviour/entrypoint-help-isolation.test.ts
  #   bun test tests/conformance/pilot/pilot-isolation.test.ts
  #   bun test tests/structure/entrypoint-bin.test.ts tests/structure/content-inventory.test.ts
  #   bun test tests/structure/branding-seam.test.ts tests/structure/branding-contract.test.ts
  #   bun test tests/behaviour/entrypoint-help.test.ts tests/behaviour/entrypoint-help-coverage.test.ts \
  #     tests/behaviour/entrypoint-composition.test.ts
  #   bun test tests/behaviour/daemon-start-detached.test.ts
  #   bun run scripts/checks/exports-parity.ts
  # (Each gate runs its whole suite file. Per-case selection uses
  # `bun test <file> -t "<pattern>"` — Bun 1.4.4's `--test-name-pattern`;
  # no legacy runner-level name filter is used.)
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Two executable identity selectors over one shared launcher composition, with the required declared-default input and the install-path self-description"
    kind: delivery
    summary: "feat(cli): add the jaiship bin over one shared launcher composition"
    scope:
      files:
        - packages/cli/package.json
        - packages/cli/bin/jaiship.ts
