# DECLARED DEFAULT SELECTOR INPUT — DESIGN PINNED HERE (readiness finding 3;
#   the spec leaves the mechanism to the plan, §5.1 F-2 and TC-BIN-062 step 4
#   require a required input and forbid an internal fallback):
#   The entrypoint's identity floor is a REQUIRED PROPERTY, not an optional
#   parameter with an internal default: `EntrypointOptions.declaredWorkingName:
#   string` (the invoking bin's own identity) is required, and
#   `resolveEntrypointBrand` / `resolveWorkingName` take the same required input.
#   `configuredWorkingName?: string` stays the OPTIONAL override slot, so the
#   consult order is: non-empty valid configured name -> valid
#   `DELIVERY_OS_WORKING_NAME` override -> the required declared default. The
#   entrypoint module keeps no default value of any kind; absence of the
#   required input where it is actually needed is the delivered containment
#   identity `fallback.internal` at exit `2`, never a substituted name.
#   Affected call sites, all accounted for:
#     * production, both bins: `packages/cli/bin/delivery-os.ts` and the new
#       `packages/cli/bin/jaiship.ts` supply it; `packages/cli/src/bin-launcher.ts`
#       requires it in its parameter object. These are the only call sites the
#       repository typecheck covers (`packages/cli/tsconfig.json` includes
#       `src/**`), so the compiler enforces the property there.
#     * delivered suites that relied on the removed neutral floor and therefore
#       MUST be updated in phase 1 (they call `runEntrypoint` with no name
#       source): `tests/behaviour/entrypoint-help-isolation.test.ts` (its
#       "render the neutral default" cell),
#       `tests/behaviour/entrypoint-version.test.ts` (its `versionRun({})` cell
#       and the `undefined` iteration), and
#       `tests/conformance/pilot/pilot-isolation.test.ts` (its
#       help/version cell). Each injects an explicit declared default.
#     * delivered suites that supply a configured name and therefore need NO
#       identity change at their call sites. Verified census of this tree: 21
#       `runEntrypoint(` call sites in 17 delivered test files. FOUR of those 17
#       are edited in phase 1, but for two different reasons and the distinction
#       matters:
#         (i) 3 files are edited because their call site relied on the removed
#             neutral floor — `entrypoint-help-isolation.test.ts`,
#             `entrypoint-version.test.ts`, `pilot-isolation.test.ts` (they gain
#             an explicit declared default);
#         (ii) 1 further file is edited for an unrelated phase-1 obligation —
#             `tests/structure/entrypoint-bin.test.ts` gains the two-bin
#             structure/literal assertions while its `runEntrypoint` call site
#             keeps `configuredWorkingName: "delivery-os"` and needs no identity
#             change.
#       The remaining 13 files are neither edited nor changed at their call
#       sites (`entrypoint-help.test.ts`, `entrypoint-help-coverage.test.ts`,
#       `entrypoint-composition.test.ts`, `daemon-mount-help`,
#       `dispatch-help-version`, `events-mount-help`, `projects-help`,
#       `queue-help-lifecycle`, `repos-help`, and the structure/behaviour
#       composition suites). `tests/structure/cli-edge-seam.test.ts:302`
#       is the reference case: it calls `resolveEntrypointBrand` with
#       `configuredWorkingName: "synthetic"`, so it survives unchanged and is
#       named here as proof of the consult order, not edited.
#   No test file is inside a typecheck today (root `pnpm typecheck` covers the
#   six package tsconfigs plus `tests/types/tsconfig.json`, which includes only
#   `*type-test.ts`), so the required property binds production call sites at
#   compile time and test call sites by behaviour. This is stated rather than
#   assumed.
