# GH-320 delivery plan — machine-readable document (delivery.plan.v1), revision 1.0
# (2026-11-15). Authored in lifecycle phase 4 (`delivery_planning`) against the
# remediated spec v1.1 and test plan v1.1 on branch
# feat/GH-320/jaiship-binary.
#
# One ticket, one pull request against main-tools, five delivery phases. Every
# phase is an independently committable slice that is green at its own boundary
# and is ONE commit through the commit primitive (conventional subject carried
# in `summary`, every body/footer line <= 100 characters). The final phase runs
# the aggregate gate, the branch-range commit-message gate, and
# `plan validate GH-320`.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec: ./chg-GH-320-spec.md (v1.1) — F-1..F-8, DM-1..DM-6, NFR-1..NFR-9,
#     DEC-1..DEC-13, OQ-1..OQ-2, AC-F1-1, AC-F1-2, AC-F2-3, AC-F3-4, AC-F4-5,
#     AC-F5-6, AC-F2-7, AC-F6-8, AC-F7-9, AC-F7-10, AC-F8-11, §5.1 capability
#     details, §6 flows 1-5, §7 scope boundaries, §8.1 interface table, §8.3
#     data model, §8.5 backward compatibility, §12 assumptions, §16 affected
#     components + file impact map, §19 no migration, §22 maintenance.
#   - Test plan: ./chg-GH-320-test-plan.md (v1.1) — 54 cases
#     TC-BIN-001..TC-BIN-084 in nine blocks; 11/11 ACs covered, 0 orphans;
#     §3.5 substitute assertions BYTE-TP-1, LIVE-TP-1, SURF-TP-1, LIT-TP-1,
#     PAR-TP-1, DOC-TP-1; §6 environments; §7 per-case suite homes and
#     commands; §8.3 findings B-1 (resolved), B-2, and OQ-TP-1..OQ-TP-6.
#     Phase ownership of every id is declared in the TC -> PHASE MAP below.
#   - PM record: ./chg-GH-320-pm-notes.yaml — delivery_mode autonomous,
#     decisions D1..D4, documentation impact map, the GH-310 sequencing
#     constraint (the delivery stops at an open PR and never merges).
#   - Schema: doc/spec/features/feature-plan-schema.md.
#   - Precedent: ../2026-11-13--GH-294--provider-peak-pausing/chg-GH-294-plan.yaml
#     and ../2026-11-14--GH-313--milestone-first-planning/chg-GH-313-plan.yaml.
#
# TEST-PLAN RECONCILIATIONS (delivery-bound names resolved here, never invented
#   around; each is reported to the PM because the test plan names a slightly
#   different home):
#   R-A  TC-BIN-070's precondition says the "§16.1.1 stale/required phrase
#        table" lives in doc/documentation-handbook.md. It does not: the table
#        lives in the historical change spec
#        doc/changes/2026-11/2026-11-07--GH-242--agent-integration/chg-GH-242-spec.md,
#        and tests/checks/doc-conformance.test.ts pins that table's page set to
#        an exact array (`expect(pages).toEqual(FULL_PHRASE_PAGES)`), so adding
#        rows there would edit a historical artifact AND a pinned fixture.
#        Resolution: Phase 4 extends tests/checks/doc-conformance.test.ts with a
#        SELF-CONTAINED four-page requirement table (stale + required phrases,
#        both directions, exact page set, negative control). The GH-242 spec and
#        doc/documentation-handbook.md are not modified.
#   R-B  Spec §16 names one new behaviour file
#        tests/behaviour/prior-identity-fallback.test.ts. Test plan §7 splits it
#        into three homes: prior-identity-config-fallback.test.ts,
#        prior-identity-state-fallback.test.ts, prior-identity-notice.test.ts.
#        Resolution: the plan declares the test plan's three files (the test
#        plan is the verification map) and no combined file.
#   R-C  Spec §16 says "scripts/.tests/test-install.sh (or a sibling installer
#        test) CHANGED". Test plan §7 chooses the sibling
#        scripts/.tests/test-install-jaiship-launcher.sh (new). Resolution: the
#        plan declares the sibling only; the delivered test-install.sh is re-run
#        unchanged as a control at the Phase 3 boundary.
#   R-D  TC-BIN-072 step 5 asks the guide to be discoverable from "the
#        documentation landing page or the affected spec pages", while spec §16
#        marks doc/00-index.md UNCHANGED. Resolution: discoverability is
#        satisfied by links from the four affected spec pages (Phase 4); the
#        landing page is not touched.
#   R-E  TC-BIN-073's Status is "Existing - No Change": its registry controls
#        are extended by the new guide's registration, not by editing
#        tests/checks/forbidden-literals.test.ts. Resolution: only
#        scripts/checks/forbidden-literals.registry.json is declared; the test
#        file is re-run as a control.
#   R-F  TC-BIN-005 ("extends entrypoint-help-isolation.test.ts") and
#        TC-BIN-010/012 ("extends entrypoint-version.test.ts") would put two
#        test files in two phases. Resolution: TC-BIN-005's isolation half is
