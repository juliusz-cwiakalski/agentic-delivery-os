phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Two executable identity selectors over one shared launcher.
  #
  # Goal: make `jaiship` a real process edge without forking the executable
  # surface. The manifest declares exactly two bins mapping to two distinct
  # existing entry files; `packages/cli/src/bin-launcher.ts` holds the ONE
  # launcher composition (read environment/cwd/home once, compose the production
  # program, return an exit code; behaviour exported as a function, never a
  # literal; never the command runtime); both bins are thin selectors declaring
  # non-exported local facts and delegating to it. entrypoint.ts takes the
  # invoking bin's declared default as the identity floor (the neutral default
  # constant AND `neutralWorkingName` are removed, `workingNameEnvironmentVariable`
  # stays), passes the optional prior identity through, adds the state-free
  # `--print-install-path` self-description member (one line, exit 0, answered
  # before composition, no family row, no global flag), and keeps the lenient
  # self-description / strict configuration split: an invalid override or name
  # falls back to the invoking bin's default, a missing declared default is the
  # delivered containment identity, never a substituted name.
  #
  # BYTE-TP-1 FIRST ACT: before any bin edit, capture
  #   bun packages/cli/bin/delivery-os.ts --version
  #   bun packages/cli/bin/delivery-os.ts --help
  # with the injected version/build the alias case uses, into
  # tests/fixtures/entrypoint/alias-baseline.json with a `capturedFrom` field
  # naming the pre-phase commit; regenerate only deliberately.
  #
  # B-2: run `pnpm install --frozen-lockfile` after the manifest change so
  # `node_modules/.bin/jaiship` exists; the semantic cell targets the entry file
  # and the linked cell fails with a named setup instruction, never skips.
  #
  # Obligations:
  #  1.1 packages/cli/package.json: two bins, `delivery-os` -> ./bin/delivery-os.ts
  #      (unchanged) and `jaiship` -> ./bin/jaiship.ts (new); no other manifest
  #      field changes (private, files, exports, workspaceImports untouched).
  #  1.2 bin-launcher.ts: the single shared composition; no duplicate body in
  #      either bin; no direct command-runtime call.
  #  1.3 bin/jaiship.ts: Bun shebang; declares default `jaiship` and prior
  #      `delivery-os` as non-exported locals; reads the override once; delegates.
  #  1.4 bin/delivery-os.ts: declares default `delivery-os`, no prior identity;
  #      observable behaviour unchanged; keeps its `completion` export.
  #  1.5 entrypoint.ts as described in the goal.
  #  1.6 Structure truth: entrypoint-bin.test.ts (two bins, two distinct existing
  #      files, shared composition via AST/diff, the declared four-site literal
  #      inventory per LIT-TP-1 with no residual neutral default, family and
  #      error-table parity with a failing extra-family mutant, and a
  #      branding-seam corpus probe through the EXPORTED validateSeam over
  #      bin/** and src/entrypoint.ts); content-inventory.test.ts + inventory.json
  #      (exact file-set equality gains bin/jaiship.ts and src/bin-launcher.ts;
  #      per-file executable allowances; the entrypoint allowance loses exactly
  #      `neutralWorkingName` and keeps `workingNameEnvironmentVariable`).
  #  1.7 daemon-start-detached.test.ts gains the identity matrix proving the
  #      delivered child-environment allowlist already admits the working-name
  #      override and the brand-derived state-directory name for BOTH identities;
  #      no allowlist change (§8.5).
  #
  # Gate:
  #   pnpm install --frozen-lockfile
  #   pnpm typecheck
  #   bun test tests/behaviour/entrypoint-two-bins.test.ts
  #   bun test tests/structure/entrypoint-bin.test.ts tests/structure/content-inventory.test.ts
  #   bun test tests/structure/branding-seam.test.ts tests/structure/branding-contract.test.ts
  #   bun test tests/behaviour/entrypoint-version.test.ts tests/behaviour/entrypoint-help.test.ts \
  #     tests/behaviour/entrypoint-help-coverage.test.ts \
  #     tests/behaviour/entrypoint-help-isolation.test.ts \
