  # `--print-install-path` (Phase 1) and only the leading home marker is
  # expanded against the invoking home (DEC-12). The launcher execs one absolute
  # target with arguments passed through, streams inherited, environment
  # unmodified; content-idempotent on re-run; repoints from another source; a
  # missing target is one bounded stderr line naming the target and the remedy
  # with a non-zero exit (pinned shell-level guard, exit 1, OQ-TP-4), never a
  # PATH search, version probe, or network call. Delivery arrays, the
  # delivery-os bin mapping, the template set, the hook examples, and the plugin
  # projection are unchanged; no `delivery-os` launcher and no uninstall path
