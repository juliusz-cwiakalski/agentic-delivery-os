  # ---------------------------------------------------------------------------
  # Phase 3 — User-level local install launcher at the brand install path.
  #
  # Goal: a local-mode install registers ONE executable launcher at
  # `~/.jaiship/bin/jaiship` whose single target is the installed source tree's
  # absolute CLI entry, so the product runs from outside a checkout. The path is
  # NOT composed in bash: the installer invokes the CLI entry's state-free
  # `--print-install-path` with `DELIVERY_OS_WORKING_NAME` REMOVED from that
  # child's environment (the declared identity, DEC-15), expands only the leading
  # home marker, and installs that path. The launcher execs one absolute target
  # with arguments passed through, streams inherited, environment unmodified, no
  # PATH search, no version probe, no network; content-idempotent on re-run;
  # repoints from another source; a missing target is one bounded stderr line
  # naming the target and the remedy with a non-zero exit (shell-level guard,
  # exit 1).
  #
  # Declared preconditions and failure modes (F-6, DEC-15, AC-F6-8): no Bun at
  # install time is a CLASSIFIED FAILURE naming the runtime, non-zero, and writes
  # no launcher; a resolved source tree without the CLI entry is a classified
  # failure naming the expected absolute entry, non-zero, and writes no launcher;
  # `DRY_RUN` reports the planned registration and writes nothing; the step is
  # independent of `--tool` (default and deprecated selections alike). Nothing
  # is ever a silent skip (NFR-5). Delivery arrays, the `delivery-os` bin
  # mapping, the template set, hook examples, and the plugin projection are
  # unchanged; no `delivery-os` launcher and no uninstall path (NG-7, §7.2).
  #
  # SUITE HOME (D9, readiness finding 4): the integration cases are a Bun test,
  # tests/checks/install-launcher-installer.test.ts, which spawns
  # `scripts/install.sh --local --no-fetch` with `mkdtemp` scratch HOME + scratch
  # project root and a PATH shim. There is NO scripts/.tests shell suite and NO
  # .github/workflows/ci.yml change: the CI `bash-tests` job installs only `jq`
  # and has no Bun, while the Bun-bearing jobs run `pnpm check` / `bun test`, so
  # the Bun test is the only home where `--print-install-path` and the installed
  # launcher can actually execute. The delivered scripts/.tests/test-install.sh
  # is re-run unchanged as a control (it calls `install_local_files` directly and
  # never enters the launcher step).
  #
  # No stdin proof obligation exists: no composed command reads stdin, so a pipe
  # check would prove nothing about the launcher (readiness finding 22;
  # TC-BIN-053 has no stdin cell).
  #
  # Obligations:
  #  3.1 scripts/install.sh: one declared launcher registration step (own
  #      function called from do_local_install, header/usage documented), the
  #      declared-identity path query, the three failure modes, `DRY_RUN`, and
  #      `--tool` independence. It stays strict-mode/quoting clean under the CI
  #      shellcheck threshold (`severity: error`).
  #  3.2 tests/checks/install-launcher-installer.test.ts (new): registration at
  #      the brand path under an ambient override, single absolute target,
  #      content idempotence, repointing, missing target, argument/stream/
  #      environment/exit passthrough, preconditions (no Bun, no-CLI source,
  #      DRY_RUN, --tool), write confinement, zero network, and the real-home
  #      existence/size/mtime snapshot (never an absence claim).
  #  3.3 tests/structure/install-launcher.test.ts (new) and
  #      entrypoint-installer-absence.test.ts (extended): the launcher step is a
  #      named separate step, reads the path from the self-description, adds one
  #      declared layout reference to the CLI entry, composes no name-derived
  #      path, and neither array names a binary/entrypoint/composer (with
  #      temp-copy negative controls).
  #
  # Gate:
  #   shellcheck --severity=error scripts/install.sh
  #   bun test tests/checks/install-launcher-installer.test.ts
  #   bun test tests/structure/install-launcher.test.ts tests/structure/entrypoint-installer-absence.test.ts
  #   bash scripts/.tests/test-install.sh
  #   bun test tests/behaviour/entrypoint-two-bins.test.ts --filter install-path
  # ---------------------------------------------------------------------------
