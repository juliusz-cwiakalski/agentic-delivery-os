# GH-320 delivery plan — machine-readable document (delivery.plan.v1), revision 1.1
# (2026-11-15; DoR iteration-1 remediation). Revision 1.0 was authored in
# lifecycle phase 4 (`delivery_planning`) against spec v1.1 / test plan v1.1.
# Revision 1.1 remediates readiness findings 3, 4, 6, 9, 19, 20, 21, 22, 23
# against spec v1.2, test plan v1.2, and PR decisions D5..D11:
#   - F3  phase 1 is now green at its own boundary: the two delivered suites
#         that relied on the removed neutral identity are phase-1 scope, and the
#         selector input design is pinned with every affected call site named.
#   - F4  the installer integration cases are a Bun test
#         (`tests/checks/install-launcher-installer.test.ts`) that spawns
#         `scripts/install.sh`; the `scripts/.tests` shell suite is dropped and
#         no CI workflow change is declared (D9); the hermeticity guard gains its
#         `--preload` support module (D11); `doc-conformance.test.ts` and the
#         distribution-marker page join the documentation phase.
#   - F6  the declared file set matches spec v1.2 §16 (one support module extra,
#         recorded below as R-H).
#   - F9  the only quality gate is the executable same-device invocation; the
#         known-red repo-local run is recorded evidence, never a gate (D10).
#   - F19 the test-only composition helper stays out of the fallback path and is
#         not edited.
#   - F20 the acquisition under test is the production composition's own; its
#         sites are enumerated in phase 2.
#   - F21 discoverability is through the four spec pages; `doc/00-index.md` is
#         untouched.
#   - F22 no stdin proof obligation is declared.
#   - F23 shellcheck (`severity: error`) is attached to the edited installer.
#
# REVISION LOG: 1.0 initial plan (spec v1.1 / test plan v1.1);
#   1.1 DoR iteration-1 remediation (spec v1.2 / test plan v1.2 / D5..D11) as
#   itemised above. Delivery phases, their ordering, and the TC ownership rule
#   are unchanged; three phase scopes changed (the phases below record which).
#
# One ticket, one pull request against main-tools, five delivery phases. Every
# phase is an independently committable slice that is green at its own boundary
# and is ONE commit through the commit primitive (conventional subject carried
# in `summary`, every body/footer line <= 100 characters). The final phase runs
# the single executable gate, the branch-range commit-message gate, and
# `plan validate GH-320`.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec: ./chg-GH-320-spec.md (v1.2) — F-1..F-8, DM-1..DM-6, NFR-1..NFR-9,
#     DEC-1..DEC-15 (DEC-14 the composition-time acquisition on `status --json`,
#     DEC-15 the installer's declared-identity query and classified
#     preconditions), §15.1 (DEC-5/DEC-9 precedent status, no new decision
#     record), OQ-1..OQ-2, §2.1 (delivered acquisition and containment facts),
#     AC-F1-1, AC-F1-2, AC-F2-3, AC-F3-4, AC-F4-5, AC-F5-6, AC-F2-7, AC-F6-8,
#     AC-F7-9, AC-F7-10, AC-F8-11, §5.1, §6 flows 1-5, §7 scope, §8.3/§8.5,
#     §16 file impact map, §17, §19, §22, Appendix A (five literal sites).
#   - Test plan: ./chg-GH-320-test-plan.md (v1.2) — 55 cases
#     TC-BIN-001..TC-BIN-084 in nine blocks; 11/11 ACs, 0 orphans; §3.5
#     substitute assertions BYTE-TP-1 (now including the invalid-override
#     projection), LIVE-TP-1, SURF-TP-1, LIT-TP-1 (five sites), PAR-TP-1,
#     DOC-TP-1; §6 environments and the single gate; §7 per-case suite homes.
#     Phase ownership of every id is declared in the TC -> PHASE MAP below.
#   - PM record: ./chg-GH-320-pm-notes.yaml — delivery_mode autonomous,
#     decisions D1..D11 (D5/DEC-14, D6/DEC-11, D7, D8, D9, D10, D11),
#     documentation impact map, the GH-310 sequencing constraint.
#   - Readiness: ./readiness-review/readiness-iter-1.md (verdict NOT_READY;
#     the plan-routed findings 3, 4, 9, 19, 20, 21, 23 and the test-plan-routed
#     22 are the ones remediated here).
#   - Schema: doc/spec/features/feature-plan-schema.md.
#   - Precedent: ../2026-11-13--GH-294--provider-peak-pausing/chg-GH-294-plan.yaml
#     and ../2026-11-14--GH-313--milestone-first-planning/chg-GH-313-plan.yaml.
#
# DECLARED DEFAULT SELECTOR INPUT — DESIGN PINNED HERE (readiness finding 3;
#   the spec leaves the mechanism to the plan, §5.1 F-2 and TC-BIN-062 step 4
#   require a required input and forbid an internal fallback):
#   The entrypoint's identity floor is a REQUIRED PROPERTY, not an optional
#   parameter with an internal default: `EntrypointOptions.declaredWorkingName:
#   string` (the invoking bin's own identity) is required, and
#   `resolveEntrypointBrand` / `resolveWorkingName` take the same required input.
#   `configuredWorkingName?: string` stays the OPTIONAL override slot, so the
#   consult order is: non-empty valid configured name -> valid
#   `DELIVERY_OS_WORKING_NAME` override -> the required declared default. The
#   entrypoint module keeps no default value of any kind; absence of the
#   required input where it is actually needed is the delivered containment
#   identity `fallback.internal` at exit `2`, never a substituted name.
#   Affected call sites, all accounted for:
#     * production, both bins: `packages/cli/bin/delivery-os.ts` and the new
#       `packages/cli/bin/jaiship.ts` supply it; `packages/cli/src/bin-launcher.ts`
#       requires it in its parameter object. These are the only call sites the
#       repository typecheck covers (`packages/cli/tsconfig.json` includes
#       `src/**`), so the compiler enforces the property there.
#     * delivered suites that relied on the removed neutral floor and therefore
#       MUST be updated in phase 1 (they call `runEntrypoint` with no name
#       source): `tests/behaviour/entrypoint-help-isolation.test.ts` (its
#       "render the neutral default" cell),
#       `tests/behaviour/entrypoint-version.test.ts` (its `versionRun({})` cell
#       and the `undefined` iteration), and
#       `tests/conformance/pilot/pilot-isolation.test.ts` (its
#       help/version cell). Each injects an explicit declared default.
#     * delivered suites that supply a configured name and are therefore
#       UNAFFECTED and NOT edited (the required default is never consulted):
#       the remaining 29 files that call `runEntrypoint`
#       (`entrypoint-help.test.ts`, `entrypoint-help-coverage.test.ts`,
#       `entrypoint-composition.test.ts`, `daemon-*`, `dispatch-*`, `queue-*`,
#       `events-*`, `owner-hold-*`, `repos-help`, `projects-help`, the
#       production fixtures, and the rest). `tests/structure/cli-edge-seam.test.ts:302`
#       is the reference case: it calls `resolveEntrypointBrand` with
#       `configuredWorkingName: "synthetic"`, so it survives unchanged and is
#       named here as proof of the consult order, not edited.
#   No test file is inside a typecheck today (root `pnpm typecheck` covers the
#   six package tsconfigs plus `tests/types/tsconfig.json`, which includes only
#   `*type-test.ts`), so the required property binds production call sites at
#   compile time and test call sites by behaviour. This is stated rather than
#   assumed.
#
# TEST-PLAN RECONCILIATIONS (delivery-bound names resolved here, never invented
#   around; each is reported to the PM):
#   R-A  The "§16.1.1 phrase table" lives in the historical change spec
#        doc/changes/2026-11/2026-11-07--GH-242--agent-integration/chg-GH-242-spec.md,
#        not in doc/documentation-handbook.md, and the delivered check pins that
#        table's page set exactly. Phase 4 therefore adds a SELF-CONTAINED
#        requirement table inside tests/checks/doc-conformance.test.ts (stale +
#        required phrases, the five-page exact set including the
#        distribution-marker page, both directions, negative controls). Neither
#        the GH-242 spec nor the handbook is modified.
#   R-B  The test plan's three prior-identity suite homes are declared; no
#        combined `prior-identity-fallback.test.ts` exists.
#   R-C  The installer integration cases live in
#        `tests/checks/install-launcher-installer.test.ts` (Bun, spawns
#        `scripts/install.sh`) per D9; the `scripts/.tests` shell suite is
#        dropped and no `.github/workflows/ci.yml` change is declared: the CI
#        `bash-tests` job installs only `jq` and has no Bun, while the Bun jobs
#        run `pnpm check` / `bun test`, so a Bun test is the only home where the
#        install-time runtime and the installed launcher can execute. The
#        delivered `scripts/.tests/test-install.sh` is re-run UNCHANGED as a
#        control (it calls `install_local_files` directly and never enters the
#        launcher step).
#   R-D  The guide is discoverable through links from the four affected spec
#        pages; spec §16 keeps `doc/00-index.md` UNCHANGED, so the landing page
#        is not touched and that is deliberate (readiness finding 21).
#   R-E  TC-BIN-073 is "Existing - No Change": only the forbidden-literal
#        registry changes; tests/checks/forbidden-literals.test.ts is a control.
#   R-F  One file, one phase. `tests/behaviour/entrypoint-version.test.ts` and
#        `tests/behaviour/entrypoint-help-isolation.test.ts` are PHASE 1 (their
#        neutral-floor cells break at that boundary); TC-BIN-010/012's per-bin
#        and invalid-override matrices live in `identity-override.test.ts`
#        (phase 2), while the "extends" half in those two suites is the
#        declared-default injection landed in phase 1.
#   R-G  Test plan §6 requires shape-only committed fixtures: a nested `.git`
#        cannot be committed, so each case materialises a scratch checkout
#        (`git init`, one commit, the identity marker) from
#        tests/fixtures/entrypoint/prior-identity/. No case asserts the absence
#        of a real-home path; the only real-home contact is the
#        existence/size/mtime snapshot in TC-BIN-055.
#   R-H  `tests/checks/support/arm-counters.preload.ts` is declared as the
#        TC-BIN-084 half-(b) support module (D11). It is the ONE declared path
#        that spec §16 does not list; §16's `prior-identity-hermetic.test.ts` row
#        covers the guard but not its spawned preload module. It is declared
#        because the case cannot run without it, and the deviation is recorded
#        for the spec owner rather than silently absorbed.
#
# PHASE ORDERING AND TESTABILITY (each phase is one commit, green at its
#   boundary):
#   Phase 1 lands the structural foundation: the second bin, the ONE shared
#     launcher composition, the manifest's two identities, per-bin identity
#     selection at the process edge (required declared-default input), the
#     state-free install-path read, and the retired neutral default. Every later
#     phase composes through this edge. The alias baseline (version, help, and
#     the invalid-override `fallback.internal` projection) is captured from
#     HEAD's pre-phase code as the FIRST act (BYTE-TP-1). Phase 1 owns the three
#     delivered suites the neutral removal touches, so it is green by its own
#     gate.
#   Phase 2 lands the prior-identity read fallback as ONE phase, deliberately:
#     the optional acquisition input (contracts + adapters), the pure host-root
#     policy (core), the edge config program, and the production composition all
#     meet in packages/cli/src/production.ts and packages/cli/src/edge.ts, and
#     production.ts owns the composition-scoped once-state. Splitting config,
#     state, and notice would edit those files twice and leave the composed
#     `jaiship status --json` cells unprovable at a boundary; the suggested
#     separate notice phase folds here for the same reason.
#   Phase 3 lands the install posture (installer step + Bun integration cases +
#     structural launcher guard), with shellcheck attached.
#   Phase 4 lands documentation truth (four spec pages + the distribution-marker
#     page, the guide, the registry, the planning markers, and three guards).
#   Phase 5 lands the hermeticity guard (both halves), the changeset, the single
#     executable gate, the range gate, the change-folder residue, and the
#     release/reconciliation obligations.
#
# TC -> PHASE MAP (55 ids = TC-BIN-001..TC-BIN-084; every id is owned by exactly
#   one phase — the phase that first makes its COMPLETE suite set green):
#   Phase 1 process edge (13): TC-BIN-001, TC-BIN-002, TC-BIN-003, TC-BIN-004,
#            TC-BIN-005, TC-BIN-006, TC-BIN-060, TC-BIN-061, TC-BIN-062,
#            TC-BIN-063, TC-BIN-064, TC-BIN-067, TC-BIN-083
#   Phase 2 prior-identity fallback (26): TC-BIN-010, TC-BIN-011, TC-BIN-012,
#            TC-BIN-013, TC-BIN-014, TC-BIN-020, TC-BIN-021, TC-BIN-022,
#            TC-BIN-023, TC-BIN-024, TC-BIN-025, TC-BIN-026, TC-BIN-030,
#            TC-BIN-031, TC-BIN-032, TC-BIN-033, TC-BIN-034, TC-BIN-035,
#            TC-BIN-036, TC-BIN-040, TC-BIN-041, TC-BIN-042, TC-BIN-043,
#            TC-BIN-044, TC-BIN-045, TC-BIN-065
#   Phase 3 local install (8): TC-BIN-050, TC-BIN-051, TC-BIN-052, TC-BIN-053,
#            TC-BIN-054, TC-BIN-055, TC-BIN-056, TC-BIN-066
#   Phase 4 documentation truth (4): TC-BIN-070, TC-BIN-071, TC-BIN-072,
#            TC-BIN-073
#   Phase 5 gate and release (4): TC-BIN-080, TC-BIN-081, TC-BIN-082,
#            TC-BIN-084
#   Total 13 + 26 + 8 + 4 + 4 = 55. No id is unassigned and none is assigned
#   twice.
#
# AC -> PHASE MATRIX (11 ACs):
#   AC-F1-1  -> Phase 1 (001, 005)
#   AC-F1-2  -> Phase 1 (003, 004, 067)
#   AC-F2-3  -> Phase 1 (002), Phase 2 (013)
#   AC-F2-7  -> Phase 2 (010, 011, 012, 014)
#   AC-F3-4  -> Phase 2 (020..026)
#   AC-F4-5  -> Phase 2 (030..036)
#   AC-F5-6  -> Phase 2 (040..045)
#   AC-F6-8  -> Phase 1 (006), Phase 3 (050..056)
#   AC-F7-9  -> Phase 5 (080, 081, 082; delivered controls run at every boundary
#              and the complete battery at Phase 5)
#   AC-F7-10 -> Phase 1 (060, 061, 062, 063, 064, 067), Phase 2 (065),
#              Phase 3 (054, 066), Phase 4 (073)
#   AC-F8-11 -> Phase 4 (070, 071, 072, 073)
#
# BINDING SPEC-v1.2 CONTRACTS THE PHASES MUST NOT CONTRADICT:
#   * Identity literals: exactly FIVE declared sites under the declared
#     `packages/**` string-literal scan rule — `bin/delivery-os.ts` default,
#     `bin/jaiship.ts` default, `bin/jaiship.ts` prior, the unchanged MCP default
#     in `packages/mcp/src/serve.ts`, and `SCOPE_ORG` in
#     `packages/core/src/branding/index.ts` declared as a scope-org DERIVATION
#     INPUT. Every declared site must be found and every found literal declared;
#     a sixth site fails by name. The resolver is code-UNCHANGED and is NOT in
#     any phase scope (DM-6, D7).
#   * Invalid working-name override: the DELIVERED containment identity
#     `fallback.internal` at exit `2` for BOTH bins, with the resolver-level
#     input error wrapped inside and the alias's summary byte-identical to its
#     baseline. No classified resolver error becomes CLI-visible (DEC-11, D6).
#   * AC4 configuration surface: `jaiship status --json` through the DELIVERED
#     composition-time acquisition. `config --json` is unreachable
#     (`fallback.internal`), no command gains an acquisition, and the change adds
#     zero acquisitions (DEC-14, D5).
#   * Notice frequency: once per source kind per COMPOSED PROGRAM, with the
#     once-state owned by the composition instance (the delivered legacy
#     adapter's pattern), never a process global; once per process in production
#     because there is one composed program (DM-4, DEC-10).
#   * No new decision record: no `doc/decisions/**` file is declared (D8,
#     spec §15.1). DEC-5 corrects delivered truth; DEC-9 extends TDR-0022.
#   * Declared divergences are FOUR: the MCP default/override read, the
#     delivery-script shell fallback host root, the scope-derived repository/docs
#     URLs, and the installer's own `~/.ados` / `ADOS_*` surface (plus the
#     package-scope non-goals NG-1/NG-2).
#   * Installer: the declared-identity query scrubs `DELIVERY_OS_WORKING_NAME`
#     from the child environment; the install-time Bun requirement, a source
#     tree without the CLI entry, `DRY_RUN`, and `--tool` are all declared, and a
#     missing runtime or missing entry is a CLASSIFIED FAILURE, never a silent
#     skip (F-6, DEC-15).
#   * The test-only composition helper (`createProductionDependencies`,
#     `packages/cli/src/edge.ts`) is OUT of the fallback path and is not edited;
#     joining it without the existence facts would break the one-root guarantee
#     (§7.2).
#
# SCOPE CONVENTION: concrete files are exact repository-relative paths; folders
#   are declared by the phase that writes new files inside them. Every file is
#   declared in EXACTLY ONE phase. Declared: 44 file paths + 1 folder. Spec
#   v1.2 §16 lists 43 file paths + that folder; the only delta is R-H's
#   `tests/checks/support/arm-counters.preload.ts`. An untouched declared file
#   is a `plan diff` observation, never a gate failure.
#
# DECLARED CONTROLS, NOT EDITS: re-run in phase gates, never edited, so not in
#   any phase scope: tests/structure/branding-seam.test.ts,
#   branding-contract.test.ts, error-table.test.ts,
#   tests/behaviour/entrypoint-help.test.ts, entrypoint-help-coverage.test.ts,
#   entrypoint-composition.test.ts, config-sources.test.ts, projects-config.test.ts,
#   daemon-state-scope.test.ts, legacy-adapter.test.ts,
#   tests/checks/forbidden-literals.test.ts, prompt-conformance.test.ts,
#   help-guide-coverage.test.ts, tests/structure/cli-edge-seam.test.ts, and
#   scripts/.tests/test-install.sh. scripts/checks/manifest-privacy.ts,
#   publish-guard.ts, scripts/lib/dispatch-authority.sh, packages/mcp/src/serve.ts,
#   and packages/core/src/branding/index.ts are UNCHANGED (spec §16) and are
#   asserted unchanged, not edited.
#
# DOC BOUNDARY: the four affected current-truth pages plus the
#   install-set/distribution-marker page are part of this change's file impact
#   map (spec §16) and are reconciled in Phase 4. Lifecycle phase 7
#   (`system_spec_update`, @doc-syncer) verifies and reconciles any delivery
#   drift; it does not re-author them in a later plan phase.
#   doc/guides/local-install.md is redistributable: it declares
#   `ados_distribution`, receives its licence header only via
#   `scripts/add-header-location.sh doc/guides/local-install.md` (single path,
#   never the directory, never hand-written), and is registered in
#   scripts/checks/forbidden-literals.registry.json in the same phase (spec §22).
#   README.md, doc/00-index.md, and doc/documentation-handbook.md are unchanged.
#
# RELEASE: one lockstep minor changeset over the five publishables matching the
#   GH-294 precedent (version_impact minor). No dependency addition, no data
#   migration, no state-schema change (spec §19). The pull request targets
#   main-tools and STOPS OPEN: no merge before GH-310 lands (spec §7.2, §18,
#   RSK-9).
#
# COMMIT DISCIPLINE: conventional subjects <= 72 chars (carried in each phase
#   `summary`); body and footer lines <= 100 chars; commits through the commit
#   primitive against this plan's phase scope; `plan validate GH-320` before the
#   final phase-mode commit.
