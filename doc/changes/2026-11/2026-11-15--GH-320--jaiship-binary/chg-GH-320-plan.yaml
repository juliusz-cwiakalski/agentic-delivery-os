#
# TEST-PLAN OQ PINS (§8.3; a pin that cannot hold fails its named TC, never
#   skips):
#   OQ-TP-1 (which surface reports the effective host root) — pinned in PHASE 2.
#        No new payload field is invented: the effective root is asserted at the
#        composition seam (the resolved host root handed to the store/scope
#        composition) and by where follow-on store operations land; status
#        --json keeps its delivered shape. TC-BIN-030/033/035 fail naming the
#        missing seam (SURF-TP-1).
#   OQ-TP-2 (exact projection of the resolver's BrandingInputError) — the
#        ownership question the test plan refers to @plan-writer is PINNED TO
#        PHASE 2: the configuration-bearing path surfaces the classified
#        resolver input error (field `override`, closed resolver code) for BOTH
#        bins instead of the generic `fallback.internal` containment, while
#        self-description keeps the invoking bin's declared default. TC-BIN-012
#        asserts the classified projection and rejects `fallback.internal`.
#   OQ-TP-3 (exact notice wording) — PHASE 2. The sentence is delivery-bound;
#        TC-BIN-043 asserts the semantic components (token, reason, both
#        locations, the no-move/no-copy/no-delete statement, <= 400 chars, no
#        value), never one exact string.
#   OQ-TP-4 (launcher missing-target mechanism) — PHASE 3. Pin: a shell-level
#        target guard in the launcher (existence check on the recorded absolute
#        entry, no PATH search, no version probe, no runtime invocation to
#        test), one bounded stderr line naming the target and the remedy, exit
#        1 (the shared user-error projection). TC-BIN-052 asserts non-zero,
#        one line, the named target, the remedy, and no PATH fallback.
#   OQ-TP-5 (is the install-path read public?) — PHASE 4. Pin: it is documented
#        as a root-level read in the guide (`<binary> --print-install-path`),
#        and it adds no family row and no global flag. TC-BIN-006 and
#        TC-BIN-071 assert the invocation and the guide's mention.
#   OQ-TP-6 (may a delivered configuration warning surface from a prior file?) —
#        PHASE 2. Pin: yes. The prior file is read AS ITS LAYER, so a delivered
#        `deprecated`/`shadowed` warning may legitimately appear; the fallback
#        ITSELF is only the notice and never travels the warning channel, and no
#        new warning kind exists. TC-BIN-026 records which delivered warning
#        appeared and asserts no new kind.
#
# PHASE ORDERING AND TESTABILITY (each phase is one commit, green at its
#   boundary):
#   Phase 1 lands the structural foundation: the second bin, the ONE shared
#     launcher composition, the manifest's two identities, and per-bin identity
#     selection at the process edge including the state-free install-path read
#     and the retired neutral default. Every later phase composes the program
#     through this edge. The alias baseline fixture is captured from HEAD's
#     pre-phase code as the FIRST act of the phase (BYTE-TP-1).
#   Phase 2 lands the prior-identity read fallback as ONE phase, deliberately:
#     the optional acquisition input (contracts + adapters), the pure host-root
#     policy (core), the edge config program, and the production composition all
#     meet in packages/cli/src/production.ts and packages/cli/src/edge.ts, and
#     production.ts is also the once-per-source notice owner. Splitting config,
#     state, and notice into separate phases would edit those same files twice
#     and leave one half unproven at a boundary; the test plan's own TC-BIN-030/
#     040 cells run the COMPOSED `jaiship status --json`, which requires the
#     whole threading in one place. The suggested notice phase (spec F-5) folds
#     here for the same reason. Phase 2 is therefore the only large phase and is
#     internally ordered: contracts -> acquisition -> policy -> edge ->
#     production -> behaviour suites.
#   Phase 3 lands the install posture: the launcher registration step in local
#     mode, the structural launcher guard, and the hermetic installer test.
#   Phase 4 lands documentation truth: the four affected spec pages, the new
#     distributable guide with its marker and registry entry, the planning
#     backlog markers, and the three documentation guards.
#   Phase 5 lands the hermeticity guard, the changeset, the aggregate and range
#     gates, the change-folder residue, and the release/reconciliation
#     obligations.
#
# TC -> PHASE MAP (54 ids = TC-BIN-001..TC-BIN-084; every id is owned by exactly
#   one phase — the phase that first makes its COMPLETE suite set green):
#   Phase 1 process edge (13): TC-BIN-001, 002, 003, 004, 005, 006, 060, 061,
