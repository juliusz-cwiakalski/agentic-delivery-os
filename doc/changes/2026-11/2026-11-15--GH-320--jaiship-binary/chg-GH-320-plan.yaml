# PHASE ORDERING AND TESTABILITY (each phase is one commit, green at its
#   boundary):
#   Phase 1 lands the structural foundation: the second bin, the ONE shared
#     launcher composition, the manifest's two identities, per-bin identity
#     selection at the process edge (required declared-default input), the
#     state-free install-path read, and the retired neutral default. Every later
#     phase composes through this edge. The alias baseline (version, help, and
#     the invalid-override `fallback.internal` projection) is captured from
#     HEAD's pre-phase code as the FIRST act (BYTE-TP-1). Phase 1 owns the three
#     delivered suites the neutral removal touches, so it is green by its own
#     gate.
#   Phase 2 lands the prior-identity read fallback as ONE phase, deliberately:
#     the optional acquisition input (contracts + adapters), the pure host-root
#     policy (core), the edge config program, and the production composition all
#     meet in packages/cli/src/production.ts and packages/cli/src/edge.ts, and
#     production.ts owns the composition-scoped once-state. Splitting config,
#     state, and notice would edit those files twice and leave the composed
#     `jaiship status --json` cells unprovable at a boundary; the suggested
#     separate notice phase folds here for the same reason.
#   Phase 3 lands the install posture (installer step + Bun integration cases +
#     structural launcher guard), with shellcheck attached.
#   Phase 4 lands documentation truth (four spec pages + the distribution-marker
#     page, the guide, the registry, the planning markers, and three guards).
#   Phase 5 lands the hermeticity guard (both halves), the changeset, the single
#     executable gate, the range gate, the change-folder residue, and the
#     release/reconciliation obligations.
