  # ---------------------------------------------------------------------------
  # Phase 2 — Prior-identity read fallback (configuration, host state, notice).
  #
  # Goal: a `jaiship` invocation that finds no current-identity artifact reads
  # the prior identity's project configuration per eligible layer and selects the
  # prior host root, reporting itself once per source kind per composed program
  # and never moving, copying, or deleting anything. Ordering is pinned by spec
  # §8.3:
  #   config (project-committed, project-local only): current file -> prior file
  #     -> delivered `missing` skip; current always wins; prior reported
  #     `config-skipped`; a selected file occupies the project-committed slot and
  #     disables every layer's fallback; machine-global layers never fall back.
  #   state: absolute current `<PREFIX>_STATE_DIR` (wins, disables fallback) ->
  #     current default root if present -> prior default root if present ->
  #     current default root (first use); no current default root is created
  #     while the fallback holds; no prior-prefix override is read; ONE root
  #     serves reads and the ordinary store operations that follow.
  #   notice: token `prior-identity-fallback`, reasons config-read,
  #     config-skipped, state-read, state-skipped; <= 1 per source kind per
  #     COMPOSED PROGRAM, with the once-state owned by the composition instance
  #     (the delivered legacy adapter's pattern, never a process global), on
  #     stderr in EVERY mode including --json; never in a payload; never an
  #     exit-code change; self-description emits none; distinct from the
  #     pre-GH-288 store warning, the ADOS_/.ados legacy notice, and every
  #     configuration warning kind.
  #
  # WHY ONE PHASE: the optional acquisition input (contracts + adapters), the
  # pure host-root policy (core), the edge config program, and the production
  # composition meet in packages/cli/src/production.ts and
  # packages/cli/src/edge.ts; production.ts also owns the composition-scoped
  # once-state. Splitting config/state/notice would edit the same files twice and
  # leave the composed `jaiship status --json` cells unprovable at a boundary.
  #
  # THE ACQUISITION UNDER TEST IS THE PRODUCTION COMPOSITION'S OWN (readiness
  # finding 20): the delivered acquisition sites, at this revision's tree, are
  # `packages/cli/src/production.ts:848` (the composition-time daemon/lane
  # settings read that every composed invocation performs, which is why
  # `status --json` exercises the fallback), `:1811`, `:1981`, `:2081`, `:2701`,
  # plus `createConfigProgram` in `packages/cli/src/edge.ts`. The suites wrap
  # THOSE sites with counting filesystem facts; nothing is re-implemented, no
  # acquisition is added, and `status`'s acquisition count must equal the control
  # invocation's (TC-BIN-020 step 7, DEC-14). `config --json` is proven
  # unreachable.
  #
  # Obligations:
  #  2.1 contracts/config.ts + contracts/index.ts: additive prior-identity
  #      acquisition input/outcome (per-layer `read`/`not used` with layer and
  #      prior absolute path) and the notice classification vocabulary; no new
  #      skip reason, error code, or warning kind.
  #  2.2 adapters/file/config-source.ts: optional prior configuration-directory
  #      name; per-layer candidate ordering for the two repository-owned layers
  #      only; current-wins; the prior file is recorded as the loaded file and as
  #      the origin of every value it supplies (no laundered current-identity
  #      path); strictly read-only.
  #  2.3 core/app/state-scope.ts: pure prior-root selection over injected
  #      existence facts; one home-plus-directory helper and one `_STATE_DIR`
  #      read preserved; no filesystem access and no prior-prefix env read.
  #  2.4 cli/edge.ts: the config program receives the prior directory and
  #      resolves through the fallback-aware acquisition. The test-only
  #      composition helper that resolves its own directory is UNTOUCHED and
  #      stays outside the fallback path (§7.2, readiness finding 19).
  #  2.5 cli/production.ts: threads the prior identity into every enumerated
  #      acquisition site (production.ts:848, 1811, 1981, 2081, 2701 and
  #      createConfigProgram in edge.ts) and the host-root input; probes both
  #      default roots (the composition tier's filesystem facts) and passes them;
  #      owns the composition-scoped once-state; emits on the delivered notice
  #      channel; never creates the current default root while the fallback
  #      holds; still consumes `workingNameEnvironmentVariable` for the daemon
  #      re-entry environment.
  #  2.6 Tests: identity-override (010-014, including the delivered
  #      `fallback.internal` containment projection for both bins);
  #      prior-identity-config-fallback (020-026, on `status --json` through the
  #      production acquisition, with the zero-added-acquisition equality and the
  #      `config --json` unreachability probe); prior-identity-state-fallback
  #      (030-036); prior-identity-notice (040-045, with two composed programs
  #      over one fixture for the per-composed-program half); state-scope.test.ts
  #      (the prior-root cell and the single `_STATE_DIR` read with both
  #      identities); projects-state-scope-policy.test.ts (the composition
  #      predicate around the one helper, negative controls preserved).
  #  2.7 Fixtures under tests/fixtures/entrypoint/prior-identity/: config-only,
  #      both-layers, mixed-layers, local-only, selected-config, global-layers,
  #      no-config, host-root, current-root. Shape only (R-G); each case
  #      materialises a scratch checkout (`git init`, one commit, the identity
  #      marker) and a scratch HOME. The real ~/.delivery-os-state is never
  #      mutated.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/prior-identity-config-fallback.test.ts
  #   bun test tests/behaviour/prior-identity-state-fallback.test.ts
  #   bun test tests/behaviour/prior-identity-notice.test.ts
