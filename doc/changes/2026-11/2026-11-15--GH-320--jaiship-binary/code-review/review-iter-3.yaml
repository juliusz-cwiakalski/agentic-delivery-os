    message: >-
      [L | owner: plan Phase 5 / D11, iter2-F-2 residual] The preload docstring
      (lines 5–9) says it counts "every write outside the allowed scratch roots
      (`Bun.write` and the `node:fs` write entry points)", and the implementation
      comment at line 119–120 says "every `node:fs` write entry point a fixture
      harness actually uses". Neither is true for the ESM import form the guarded
      suites use: the patch mutates the object returned by `require("node:fs")`,
      and a `import { writeFileSync } from "node:fs"` write outside the roots is not
      recorded. Reproduced under the delivered preload: an ESM named-import write
      to `/tmp/.../OUTSIDE-esm.txt` yields exit 0 with an empty `write` tally, while
      `require("node:fs").writeFileSync` to the same area yields exit 1 with the
      write recorded. The binding artefacts are already honest (test plan v1.7
      TC-BIN-084 states the ESM gap and relies on scratch `HOME`/`TMPDIR`
      isolation; spec §16's row limits the claim to the armed classes), so this is a
      single cosmetic overstatement in test-support code, not a coverage claim any
      reader is told to rely on.
    suggestion: >-
      Narrow the docstring (lines 5–9) and the comment at 119–120 to
      "`Bun.write`, `Bun.spawn`, and the **`require`-obtained** `node:fs` write entry
      points; a static-ESM `node:fs` import is not recorded and is covered only by
      scratch `HOME`/`TMPDIR` isolation", matching test plan v1.7 TC-BIN-084 and
      spec §16. Non-blocking.
