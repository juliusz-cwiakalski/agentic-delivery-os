summary: >-
  Iteration-3 (final) re-review of the iteration-2 remediation against spec v1.8,
  test plan v1.7, plan r1.5 and the iteration-1/iteration-2 findings. The single
  iteration-2 blocker is genuinely fixed and independently re-verified, not merely
  asserted. `do_local_install` now absolutizes the resolved source with a logical
  `cd -- "${source_dir}" && pwd` before the launcher step (scripts/install.sh:1069),
  so a relative `ADOS_SOURCE_DIR` still records an absolute `readonly TARGET=`
  word. The new delivered case (`TC-BIN-050` relative-source) is non-vacuous: a
  controlled experiment shows a relative entry renders the bare word
  `readonly TARGET=../rel-source/packages/cli/bin/jaiship.ts`, which expands
  relative and fails the case's `startsWith("/")`/`toBe(expectedTarget)` assertions
  and its `--version` from `/`, while an absolute entry renders absolute; the
  delivered suite is green (9/9). The quote/space case still passes (`printf %q`
  unchanged), and bash logical `pwd` keeps a symlinked source's logical path (no
  `pwd -P`), so the symlinked-source declaration is unchanged. New-edge checks
  found no defect: leading/trailing slash is normalised, a path with spaces is
  quoted, `ADOS_SOURCE_DIR` unset resolves to the repo root and is unchanged, and
  `--tool` runs the same launcher step (dry-run test covers both). The
  previously-blocking ACs are re-judged: AC-F5-6 and AC-F7-10 remain PASS (their
  production code is byte-identical to the iteration-2-verified tree — the only
  code change since c370f8b4 is the 4-line installer absolutize plus the test),
  and AC-F6-8 is now fully PASS including the relative-source scenario (test plan
  v1.7 TC-BIN-050 step 10 and AC-F6-8 both state and exercise it). Scope truth
  holds: 53 declared files + 2 folders, 63 changed paths, 0 undeclared, the 2
  declared-but-unchanged being the documented revert paths; `plan validate`
  valid/full. Remaining items are non-blocking and honestly recorded: the preload
  docstring/implementation comment still overstates `node:fs` write coverage for
  the ESM import form the guarded suites use (test plan and spec §16 are already
  bounded, so this is a single cosmetic overstatement in test-support code — a
  recorded nit, not a blocker); the phase-6 granular pm-notes evidence entry is
  still absent (its gate evidence lives in test plan §10 and this record — a
  @pm DoD housekeeping item); the `delivery_planning` completion timestamp still
  precedes `specification`/`test_planning`; the spec still cites "test plan v1.6"
  while the operative plan is v1.7; one unused `dirname` import and one carried
  entrypoint wording nit. None affects behaviour, acceptance, or scope.
