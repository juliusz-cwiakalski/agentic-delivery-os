summary: >-
  GH-320 is a careful, well-documented delivery: the two-bin process edge over one
  shared launcher, the required `declaredWorkingName` floor with the delivered
  lenient/strict split, the read-only prior-identity configuration and host-root
  fallback with one composition-scoped notice, the state-free
  `--print-install-path` self-description, the installer launcher step, the
  five-site literal guard, the documentation truth pass, and the two-half
  hermeticity guard all exist and the delivered acceptance scenarios behave as
  specified — independently re-verified live for AC-F1-1, AC-F2-3, AC-F2-7,
  AC-F3-4, AC-F4-5 and AC-F5-6's normal path, and by the targeted suites for
  AC-F1-2, AC-F6-8 and AC-F7-10. Three items still block a clean PASS. (1) On the
  invalid-override containment path a prior-identity configuration read really
  happens (strace: two `openat` calls on `.delivery-os/config.yaml`) but the
  queued `prior-identity-fallback` notice is discarded when composition throws, so
  AC-F5-6's "given a fallback read ... exactly one notice ... is written to
  stderr" is not met on that path, and TC-BIN-012 step 5's rationale ("the run
  never reaches the prior-identity fallback in this state") is factually wrong.
  (2) The generated launcher embeds the absolute target in single quotes without
  escaping; a source path containing `'` produces a launcher that fails `bash -n`
  (reproduced) and is an injection-shaped construction in executable content.
  (3) Several delivered "injected fixture" negative controls are tautologies that
  never run a guard (the installer-array rule in both suites, the daemon
  allowlist self-read, the unregistered-guide cell), so AC-F7-10's "when any one
  of these is violated by an injected fixture, then the corresponding guard fails
  by name" is only true for some rules. Five medium findings follow: the DRY_RUN
  precondition inconsistency (NFR-5/AC-F6-8 versus the delivered control), the
  `doc/00-index.md` edit that spec §16 and the plan declare UNCHANGED (plus six
  further out-of-map current-truth pages), a dead prior-directory branch in
  `projects-config.ts`, the narrowed identity-literal scan, and the test-plan
  assertions that the delivered suite does not make. The four recorded deviations
  the review was asked to judge are each honest and acceptable as records — the
  `warnings` channel, the bins' `process.env` reads, the behaviour-only notice
  token, and the phase-7 doc corrections — except where they leave the acceptance
  or plan wording contradicting the tree, which is called out below. No delivered
  test was relaxed or skipped, the alias baseline is a genuine pre-change capture,
  and nothing in the change mutates the operator's real home or state root.
