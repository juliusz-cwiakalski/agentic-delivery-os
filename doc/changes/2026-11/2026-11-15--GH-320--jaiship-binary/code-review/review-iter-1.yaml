    location: packages/cli/src/production.ts:3136
    message: >-
      [B | owner: plan Phase 2 — notice surface on a failed composition] A
      prior-identity configuration read that happens during composition is never
      reported when composition then fails. `createProductionComposer` collects
      notices in `compositionNotices` and only hands them to the caller through
      `withScopeWarnings` on the success return (production.ts:3136-3140); the
      composition-time acquisition (`readDaemonConfiguration` ->
      `acquireProjectConfiguration` -> `emitConfigNotice`, production.ts:713-737,
      945-967) runs before `createConfigProgram`, and for an invalid override
      `createConfigProgram` fails and the composer throws
      (`brand resolution failed`), which `runEntrypoint`'s catch
      (packages/cli/src/entrypoint.ts:373-383) turns into
      `{ commands: {} }` and then the `fallback.internal` containment. Every
      queued notice is dropped. Reproduced against the delivered bin in a fixture
      checkout (scratch HOME under /tmp, real home untouched):
      `HOME=<scratch> DELIVERY_OS_WORKING_NAME='bad/name' jaiship status --json`
      exits 2 with stderr `jaiship: fallback.internal` /
      `summary: command "status" is not part of the composed prompt-required set`
      and no `prior-identity-fallback` line, while
      `strace -f -e trace=openat` shows two
      `openat(..., "<repo>/.delivery-os/config.yaml", O_RDONLY...)` calls during
      that same run. AC-F5-6 reads "Given a fallback read, when any command runs
      in any mode including `--json`, then exactly one notice per source kind per
      composed program is written to stderr", with no containment carve-out, and
      test plan v1.5 TC-BIN-012 step 5 asserts only "no fallback identity is
      substituted and no `prior-identity-fallback` notice is emitted (the run
      never reaches the prior-identity fallback in this state)" — the delivered
      suite scopes that assertion to the alias, but the test-plan rationale still
      states the false reason for both bins. DoR-4 residual (a) is therefore only
      half applied (assertion scoped; rationale not replaced).
    suggestion: >-
      Make the composition-scoped notices survive a failed composition: e.g. pass
      an injected notice sink (or a `readNotices()` accessor on the composer
      result) into `createEntrypoint`/`runEntrypoint` and flush the collected
      lines through the delivered `writeOutput` warnings channel on the
      containment path, or return a containment program that carries the collected
      warnings instead of throwing. Add one TC-BIN-012 cell that runs
      `jaiship status --json` with `DELIVERY_OS_WORKING_NAME='bad/name'` and a
      fixture `.delivery-os/config.yaml` and asserts the `config-read` notice on
      stderr beside the exit `2` containment. If suppressing the notice on a
      containment failure is the intended contract, say so in spec §8.5/F-5/AC-F5-6
      explicitly and record it in the test plan; do not leave the AC unconditional.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
    confidence: high
    category: correctness
    location: scripts/install.sh:1020
    message: >-
      [B | owner: plan Phase 3 — launcher content] The generated launcher embeds
      the absolute target in a single-quoted assignment
      (`readonly TARGET='${entry}'`, scripts/install.sh:1024) with no escaping of
      the recorded path. Bash single quotes cannot contain a `'`, so a checkout
      path containing one yields a syntactically broken launcher: reproduced with
      `entry=/tmp/o'brien/repo/packages/cli/bin/jaiship.ts` and the exact heredoc
      body, `bash -n` reports `unexpected EOF while looking for matching ''`
      (exit 2). Because the same interpolation is the only quoting authority for
      executable content, a crafted directory name is also an injection vector at
      launcher run time, which contradicts spec §21's claim that the launcher
      "removes the usual PATH-hijack and injection surface for an installed shim"
      and F-6's "no argument interpolation". No delivered case exercises a path
      with a quote or a backslash (every scratch path comes from `mkdtemp`), so
      the defect is invisible to the green suite.
    suggestion: >-
      Quote the recorded target safely when rendering the launcher — e.g. build
      the assignment with `printf '%q'` on the path, or replace every `'` in
      `${entry}` with `'\''` before interpolation — and add an
      `install-launcher-installer` case whose source directory name contains a
      single quote and a space, asserting `bash -n` passes and the launcher runs
      (`--version`). Keep the "one absolute target" and content-idempotence
      assertions unchanged.
    suppressed: false
    published_url: null
    published_at: null
