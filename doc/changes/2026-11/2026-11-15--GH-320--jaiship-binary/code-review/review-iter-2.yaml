summary: >-
  Iteration-2 re-review of the phase-6 remediation (9464de36, 217b5b38, 9059598e,
  719f6e53, c370f8b4) against spec v1.7, test plan v1.6, plan r1.5 and the
  iteration-1 findings. All three iteration-1 blockers are genuinely fixed and
  independently re-verified, not just asserted: (F-1) an invalid override on a
  `jaiship` run with a fixture `.delivery-os/config.yaml` now exits 2 with the
  unchanged containment on stderr, exactly one `prior-identity-fallback:
  config-read` line beside it (and one `state-read` when the prior host root is
  also in play), a clean payload with no `warnings` member, and a byte-identical
  silent alias — reproduced through the delivered bin in a scratch checkout;
  (F-2) the launcher's target is now rendered with `printf %q`, so quote,
  backslash, space and newline all yield a `bash -n`-clean word that expands to
  the exact target, and the delivered installer case installs from a
  `source o'brien` directory and runs `--version`; (F-3) every previously
  vacuous "injected fixture" cell now drives a real guard —
  `installerArrayViolations` is a production rule exercised from both suites, the
  daemon cell drives the exported `daemonReentryEnvironment` derivation, and the
  registration/splice controls run the delivered `scan()` over a scratch
  repository — with no self-read, no in-memory filter assertion and no
  splice-contains-itself assertion left. The five medium and six low findings are
  addressed or honestly re-classified (F-6 revert, F-8 widened node-level scan
  with an expression-position control, F-9 accessor reuse, F-10/F-11 installer
  header/usage and exit taxonomy, F-14 read-count capture and digest-around-run).
  Two defects remain, one blocking: a documented input —
  `ADOS_SOURCE_DIR=<relative path>` — makes the installer record a **relative**
  launcher target and report success, so the installed launcher is broken from any
  other directory, contradicting spec F-6's "recorded as an absolute path at
  install time", DEC-13, the guide's "exactly one absolute target", §21's "never a
  silent success" and test plan TC-BIN-050's declared property (reproduced end to
  end; no case covers it). Non-blocking: the new `node:fs` write arming in the
  hermeticity preload does not trip for the ESM import form every guarded suite
  uses, so the §10 "Phase 6 remediation" canary row does not generalise (F-12 is
  only half closed), plus three low artifact-integrity drifts (phase-6 pm-notes
  evidence missing, an impossible `delivery_planning` completion timestamp, and
  one-revision-stale spec/plan citations). The tree itself is clean: 62 changed
  paths, 0 undeclared against plan r1.5's 53 files + 2 folders (the two declared
  revert paths are net-absent and explained), `plan validate` valid/full, every
  targeted suite green, packages and test types typecheck, the branch-range
  commit gate PASS at HEAD, and no probe touched the operator's real home.
