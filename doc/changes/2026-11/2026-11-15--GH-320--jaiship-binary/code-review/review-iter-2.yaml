findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: scripts/install.sh:1026
    message: >-
      [B | owner: plan Phase 6 obligation 6.2 / spec F-6, DEC-13] The launcher
      records whatever `source_dir` string it is given, so the documented
      `ADOS_SOURCE_DIR` override accepts a relative path and the rendered
      `readonly TARGET=` word is then relative. Reproduced end to end: from a
      scratch project root with `src -> <repo>`, `ADOS_SOURCE_DIR=src HOME=<scratch>
      bash scripts/install.sh --local --no-fetch` exits 0 and prints `Launcher
      registered: <home>/.jaiship/bin/jaiship -> src/packages/cli/bin/jaiship.ts`;
      the launcher content is `readonly TARGET=src/packages/cli/bin/jaiship.ts`,
      and running it from any other directory (e.g. `/tmp`) fails with `the
      installed target src/packages/cli/bin/jaiship.ts no longer exists`. Spec F-6
      states the target is "recorded as an absolute path at install time", DEC-13
      says "one absolute target", the guide says "records exactly one absolute
      target", §21 promises the launcher's failure mode is "never a silent
      success", and `TC-BIN-050` step 1/2 assert "one absolute target" — so the
      installer reports success for a shim the specification says cannot exist in
      that shape. `resolve_source_dir` returns `${ADOS_SOURCE_DIR}` verbatim
      (line 610), the entry is composed by string concatenation (line 999) and the
      word is rendered unnormalised (line 1026). No case exercises a relative
      source (every delivered scratch source is absolute), so the suite cannot see
      it; the F-2 remediation touched exactly this rendering step.
    suggestion: >-
      Absolutize the source root once before the launcher step (e.g.
      `source_dir="$(cd -- "${source_dir}" && pwd)"` in `do_local_install` —
      logical `pwd`, not `pwd -P`, so the declared symlinked-source case keeps its
      recorded path — or reject a non-absolute `${entry}` in
      `install_local_launcher` with `log_fatal`), and add one installer case:
      `ADOS_SOURCE_DIR=<relative>` records an absolute `readonly TARGET=` word,
      `bash -n` passes and `--version` works from outside the checkout. Keep the
      quote/space case unchanged.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    confidence: high
    category: testing
    location: tests/checks/support/arm-counters.preload.ts:130
    message: >-
      [M | owner: plan Phase 5 obligation / D11, F-12 residual] The new `node:fs`
      write arming patches the module object returned by `require("node:fs")`, and
      that patch is not seen by ESM importers — which is how every guarded suite
      and fixture harness acquires `writeFileSync`/`mkdirSync` (e.g.
      `prior-identity/harness.ts:11`). Reproduced under the delivered preload: a
      canary writing outside the allowed roots with a static named import
      (`import { writeFileSync, mkdirSync } from "node:fs"`), with a namespace
      import (`import * as fs from "node:fs"`) and with `await import("node:fs")`
      is **not** recorded and the run exits 0; only `require("node:fs").…` inside
      the same module is recorded. The preload docstring ("every write outside the
      allowed scratch roots (`Bun.write` and the `node:fs` write entry points)"),
      test plan v1.6 `TC-BIN-084` (precondition and step 3) and the §10 "Phase 6
      remediation" row ("a one-off `bun --preload … -e …` performing a `node:fs`
      `writeFileSync`, an `fs.mkdirSync` … recorded … so the newly armed entry
      points trip") therefore claim a coverage the guard does not have for the
      suites it guards. Spec §16's `arm-counters` row still describes the narrower
      claim and stays accurate. Related (pre-existing, smaller): only `Bun.spawn`/
      `Bun.spawnSync` are armed, while the guarded installer and docs suites spawn
      through `node:child_process.spawnSync`, so a network `git clone` through that
      path would be invisible too.
    suggestion: >-
      Either narrow the claim back and delete the §10 probe row / the docstring's
      `node:fs` sentence (spec §16 already states the limited claim), or make the
      arming real for module imports (a counted write helper the harnesses must
      use, a static scan for `node:fs` write imports in the guarded suites, or a
      `node:child_process` arm alongside the Bun ones) and prove it with a canary
      written in the same static-import form as the suites. Do not record an
      `-e`-only probe as evidence for a preload the suites load as modules.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: low
    confidence: high
    category: plan-compliance
    location: doc/changes/2026-11/2026-11-15--GH-320--jaiship-binary/chg-GH-320-pm-notes.yaml:275
