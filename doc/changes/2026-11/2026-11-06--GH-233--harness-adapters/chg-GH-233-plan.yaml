    tasks:
      - "1.1 packages/core/src/contracts/harness.ts — data-only contract module (no call expressions, no runtime APIs, no process/filesystem/clock; imports only ./ contract modules): the closed `as const` harness-kind vocabulary (opencode, claude-code — no third value, no wildcard), the closed operation and lifecycle-capability vocabularies (headless spawn, resume/steer injection, session introspection, telemetry extraction), the closed liveness signal-kind vocabulary (exactly session-traffic, worktree-activity, process) with the closed absence-reason set, the HarnessInstance shape (kind, observed version, capability declaration — no field can carry a derived parity claim), the HarnessSession lifecycle port shape (spawn carrying work item + prompt + execution-environment descriptor, deliver, resume/steer, collect, classify bound to the shared classifier, liveness), the adapter-normalized neutral evidence type, and the execution-environment descriptor (DM-2: execution kind host-only vocabulary, deny-by-default allowlist of declared variable names plus declared credential references — names and references only, never values). Capability declarations reuse the delivered AdapterCapabilityDeclaration/CapabilityGap model from adapter-capabilities.ts; supported and gap sets are disjoint by construction. [F-1, F-2, F-5; DM-2, DM-4; AC-F1-1; NFR-8; TC: TC-HARN-001 steps 1-6, TC-HARN-015 step 1 vocabulary half]"
      - "1.2 packages/core/src/domain/harness-classify.ts — the ONE shared harness-neutral classifier: a pure function over the neutral evidence type only (completed, premature end, harness failure, refusal, timeout semantics), importing the delivery-result taxonomy from core contracts (never re-declaring it) and emitting tokens of the `dispatch-session` derivation class; the three-way distinction (completed / premature end / failed) is structural; no harness-kind comparison, no result-token string literal outside the taxonomy import, no I/O. [F-2; DEC-10; AC-F2-1 classifier half; NFR-1, NFR-8; TC: TC-HARN-005 steps 2, 4, 5 core half]"
      - "1.3 packages/core/src/domain/harness-spawn-env.ts — build-from-declaration spawn-environment construction (DEC-2, the security core): a pure function receiving the descriptor, an injected parent-environment record, and the injected CredentialPort; the child environment is EXACTLY the declared set (every undeclared parent variable absent — fail-closed invariant); declared credential references resolve through resolve() at spawn (use) time only — never at construction — and their values enter only the returned environment; an unresolvable reference returns the classified failure naming the reference (credential port `config.credential.missing` wrapped per the OQ-T1 decision, zero partial environment); a missing declared non-credential variable returns the classified failure naming the variable; deterministic and byte-stable under serialization. No ambient environment access anywhere in the module. [F-5; DM-2; DEC-2; AC-F5-2 builder half; NFR-5, NFR-9; TC: TC-HARN-012 rules 1-7 at builder level, TC-HARN-013 rules 1-7 at builder level]"
      - "1.4 packages/core/src/domain/harness-liveness.ts — the harness-agnostic liveness discipline as pure data assembly: the neutral read shape (one entry per closed kind, identical key set and order for a declared subset), sourced entries carrying value + injected observation timestamp, explicit absent entries carrying kind + closed reason (never 0, false, empty string, or an invented timestamp), the declared-subset projection rule, and the consumer-side mapping into the watchdog signal shape yielding absent keys (the watchdog module itself is NOT imported — DEC-9/NG-4 boundary). [F-2; DEC-9; AC-F2-2 shape half; NFR-6; TC: TC-HARN-006 shape assertions, TC-HARN-007 rules 1-3 shape half]"
      - "1.5 packages/core/src/contracts/harness-telemetry.ts — the harness-neutral statistics contract (EVT-1/DM-1 vocabulary): per-session records carrying the versioned telemetry payload schema id, work-item ref, session id, harness kind + observed version, model, agent, tree root + parent chain, the five token classes (input, output, reasoning, cacheRead, cacheWrite — numeric or null-when-absent-and-warned), call counts, bounded pre-aggregated per-tool counts (DEC-7), cost (number or explicit null + warning), injected captured-at timestamp, degradation warnings from a closed reason set; the additive state record-kind name + payload-schema string + store-scoped key prefix (mirror the commit-telemetry pattern in contracts/commit.ts); the numeric caps (sessions per delivery, tools per agent, agent list, model list) with explicit truncation marks, and the machine 65 536 / human 4 096-byte / 24-line bounds reuse. Exact schema-id/kind/key spellings implementation-bound (GAP-T7/OQ-T4). [F-7, F-8; EVT-1; DM-1; DEC-3, DEC-7; AC-F8-1 vocabulary, AC-F8-2 vocabulary; NFR-4; TC: TC-HARN-021 shape fixture basis, TC-HARN-026 caps basis]"
