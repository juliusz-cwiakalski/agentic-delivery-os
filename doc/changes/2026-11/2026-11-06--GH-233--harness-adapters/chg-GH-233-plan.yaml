# GH-233 implementation plan — M1-S11: Harness adapters and dispatch portability
#
# Sources (single source of truth):
#   - Spec:  ./chg-GH-233-spec.md (v1.1; F-1..F-8; 12 ACs AC-F1-1..AC-F8-3;
#     NFR-1..9; EVT-1; DM-1..DM-4; DEC-1..DEC-10; RSK-1..RSK-8; §14 open
#     questions with pinned resolution mechanisms; §18 delivery order)
#   - Test plan: ./chg-GH-233-test-plan.md (v1.2; 33 TCs TC-HARN-001..033;
#     binding oracles §4.1–§4.9; named gaps GAP-T1..T7; OQ-T1..T8)
#   - ADR-0008 (harness adapter contract, DC-1..DC-5, C-1..C-5) and
#     TDR-0005 (delivery-result taxonomy; the dispatch-session derivation
#     class the shared classifier emits into)
#
# TC-mapping obligation (spec §18): all 33 TCs are mapped onto Phases 1–9
# below (Phase 9, appended after local review iteration 1, extends existing
# TC rows only and adds no new TC id) without reshaping any pinned behaviour,
# vocabulary, record, invariant, oracle, or AC/NFR/DEC mapping. TCs whose
# structure half and behaviour half
# land in different phases are marked in `coverage` with their completing
# phase (GH-225 GAP-1 discipline). Spec and test plan were cross-checked:
# zero inconsistencies found (see the return note for the one artifact-level
# format observation — this YAML is the canonical plan; a legacy .md plan is
# not authored).
#
# Delivery decisions recorded by this plan (items the spec/test plan leave
# delivery-bound; each is a placement or spelling choice, never a behaviour
# change — a real deviation would reopen the test plan, not ship):
#   - OQ-T1 (error identities): invalid/unknown harness configuration reuses
#     `config.value.invalid` (pinned by TC-HARN-003 step 4 and TC-HARN-017);
#     an unresolvable declared credential reference surfaces the credential
#     port's `config.credential.missing` wrapped in the classified spawn
#     failure that names the reference (pinned by TC-HARN-013); every other
#     harness-path classified failure (malformed machine-readable spawn
#     output, non-zero exit / spawn refusal, unknown session on resume,
#     unattributable or malformed-identity extraction) uses a NEW additive
#     `harness.*` error-table family. Exact `harness.*` spellings are
#     implementation-bound (GAP-T7); each row lands with
#     scripts/checks/error-table-sync.ts green — the documented table row in
#     doc/spec/features/feature-result-contract.md (the S2 surface) is added
#     in the same commit (TC-HARN-027 step 4).
#   - OQ-T6 (subpath layout): one `./harness` adapter subpath
#     (packages/adapters/src/harness/**) carrying both delivery adapters, the
#     per-harness telemetry extractors, and the SQLite loader; the host
#     execution-environment implementation lands in the already-scaffolded
#     `./host` subpath (packages/adapters/src/host/index.ts replaces the
#     placeholder and is the single `node:child_process` spawn site).
#     packages/adapters/package.json gains the `./harness` export in Phase 3.
#   - OQ-T5 (seam mapping, test-plan §4.1 rule 9): neutral evidence type and
#     the closed vocabularies live in packages/core/src/contracts/harness.ts;
#     the one shared classifier is packages/core/src/domain/harness-classify.ts
#     (imports the delivery-result taxonomy from core contracts — never
#     re-declares it — and emits tokens of the `dispatch-session` derivation
#     class); the telemetry payload/record-kind contract is
#     packages/core/src/contracts/harness-telemetry.ts; build-from-declaration
#     spawn-env construction is packages/core/src/domain/harness-spawn-env.ts;
#     liveness neutral-shape discipline is
#     packages/core/src/domain/harness-liveness.ts; the configured-kind
#     registry is packages/core/src/domain/harness-registry.ts; the additive
#     state records land in packages/core/src/state/harness-telemetry.ts; the
#     capture point extends packages/core/src/domain/closeout.ts and
#     packages/core/src/state/closeout.ts. Field-name spellings inside these
#     modules stay implementation-bound; the closed key sets and semantics
#     are pinned by the test plan.
#   - No composition edge ships: no CLI command, MCP tool, or host wiring is
#     added (spec §7.2 [OUT] new CLI command surfaces). TC-HARN-016 step 2/3
#     (`the composition built the Claude adapter and not the opencode
#     adapter`) is satisfied by the test-side composition over
#     domain/harness-registry.ts factories driven by resolved configuration;
#     the M1-S9 dispatch pilot is the first production composer.
#   - Boundary reconciliation: `.dependency-cruiser.cjs` runtime-API
#     confinement gains the harness adapter I/O subpath (exact path with
#     reason, ADR-0005 pattern) in Phase 5 when the extractors first use
#     node:fs/node:sqlite; `packages/adapters/src/host/` is already inside
#     the DEC-6 adapter I/O allowance; the secret-read allowlist gains NO
#     entry in any phase (NFR-9; TC-HARN-014 step 1).
#   - GAP-T2 stance: the bash-era stack (scripts/opencode-session.sh,
#     scripts/pm-liveness.sh, scripts/deliver-ticket.sh) is untouched;
#     ported semantics are pinned by fixtures in tests/fixtures/harness/**
#     and the bash suites run green in Phase 7 (TC-HARN-010 step 6,
#     TC-HARN-031 step 7).
#
# Review-iteration-1 remediation (Phase 9, appended post-delivery):
#   - Provenance: local review iteration 1 returned FAIL (record at
#     ./code-review/review-iter-1.yaml). The PM-approved remediation set is
#     F-1 (high), F-3, F-4, F-5 (medium), F-6 (low), F-10 (info, folded
#     in), plus the F-12 plan audit note (task 9.7). Deferred with recorded
#     reasons: F-8, F-9, F-11. Phase 9 extends existing TC rows only — no
#     new TC id, no oracle reshaping beyond the remediation rows its tasks
#     name.
#   - Out of Phase 9 by design: F-2's taxonomy-token oracle alignment is a
#     separate PM reopen of the test plan (the header's test-plan reference
#     above is refreshed by that reopen, not here); TDR-0005 ratification
#     and the ADR-0008 register flip are routed to @decision-advisor; the
#     doc/spec/features/feature-harness-adapters.md touches (the Claude gap
#     list per F-1, the F-2 disambiguation semantics, the F-7
#     production-wiring deferral note) ride the lifecycle-phase-7 doc-sync
#     re-run — Phase 9 only notes them (task 9.1).
#   - F-12 audit note (scope reconciliation): Phase 6's declared scope
#     entry packages/core/src/state/closeout.ts was never touched by the
#     branch — only contracts/closeout.ts changed in the closeout pair; the
#     capture runtime landed in the new packages/core/src/state/
#     harness-telemetry.ts with fixture-side injection
#     (tests/fixtures/closeout/harness-telemetry.ts). Recorded here
#     alongside the existing delivery scope-additions record (pm-notes
#     2026-11-06 deviation 4: core config/harness.ts, domain
#     harness-capability/canonical/telemetry, adapters harness/
#     sqlite-loader.ts, closeout extensions) so the declared-versus-actual
#     reconciliation is symmetric in both directions.
#
# Tier rationale: `full` — 8 capabilities, 12 ACs, 33 automated TCs,
# cross-package delivery (core contracts + domain + config + state, adapters
# host/harness subpaths, testkit conformance), security_impact high (spec
# front matter). All phases are delivery kind; plan-level
# defaultLeases/defaultWeightClass apply. Per-phase completion artifacts: one
# Conventional Commit per phase (the `summary` key, landed via @committer)
# plus the `testGate` commands passing; typed doneArtifacts slots are declared
# on the final phase where the evidence exists.
#
# Invariants carried by every phase (spec §21, NFR-1..9): one shared
# harness-neutral classifier, adapters normalize only (DEC-10, NFR-8); the
# spawn environment is exactly the declared allowlist, fail-closed both ways
# (DEC-2, NFR-5, NFR-9); extraction is read-only, bounded, indexed
# (DEC-5, NFR-2, NFR-3); figures degrade with warnings, never fabricate
# (NFR-6); telemetry appends are fenced, verified, idempotent, non-gating
# (DEC-6, NFR-7); no harness name, store path, or host literal outside
# adapters and declared configuration (DEC-8, NFR-8); the watchdog stays
# zero-source (DEC-9, NG-4); no dispatch engine or new command ships
# (DEC-1, NG-1); machine output ≤ 65 536 UTF-8 bytes, human ≤ 4 096 bytes /
# 24 lines, capped lists with explicit +N marks (NFR-4); determinism under
# identical injected facts (NFR-1).

