  (10a200bc), the doc re-reconciliation (3ae43274), and the decision records
  (82a4311f). All six remediated code findings are verified closed at their
  original sites by independent probing, not by trusting the remediation diff:
  the Claude declaration is truthful about deliver (supportedOperations excludes
  it, the gap record and deliver()'s machine-readable gap both name "deliver",
  with structure rows, a zero-invocation behaviour case, and the feature-doc gap
  list); the opencode extractor emits one record per (session, agent, model)
  group with an explicit group-cap truncation warning and per-group tool
  attribution, and the state append identity is additively widened to (run,
  session, agent, model) — backward-compatible because payloads always carried
  agent/model; the three formerly vacuous mutant families now route through the
  shared callable checkers in tests/fixtures/harness/neutrality-scans.ts and can
  genuinely fail; the node:child_process allowlist is an exact observed==declared
  equality over the whole packages tree (independently re-derived by grep: 10
  sites, exact match) with a new boundaries negative-fixture case; the duplicated
  optional-field-absent warnings are gone with a no-input-column drift fixture
  pinning exactly-one; the demo fixture is derived from the shipped declaration.
  F-2 is closed via the PM-decided vehicle (test plan v1.2 §4.2 binding oracle,
  TDR-0010 Proposed — correct pending-acceptance posture, feature-doc
  disambiguation semantics), F-7's deferral note and F-12's plan audit note are
  in place, and F-8/F-9/F-11 remain correctly scoped as deferred with no
  regression masking (their files are untouched by the remediation and the
  merge). The GH-232 merge union is clean: no GH-233 harness file was altered by
  the merge, the error table carries both the harness.* and retro.* families
  (error-table-sync 83/83 green, re-run during this review), and the
  ubiquitous-language row keeps the delivered-truth harness wording. Independent
  re-execution during this review: structure+mutants 39 pass, behaviour incl.
  closeout 46 pass, boundaries 140 pass, error-table-sync OK (0 fail). Three new
  low findings are cosmetic artifact-consistency residue (a stale plan-header
  version label, the change-spec F-2 sentence left unamended, duplicate YAML
  keys in one pm-notes note) plus one informational test-isolation note; none
  block. No remediation phase required — fold the three one-line doc fixes into
  the PR or the next artifact touch.
