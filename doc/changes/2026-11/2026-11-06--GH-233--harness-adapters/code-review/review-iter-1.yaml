    category: performance
    location: packages/adapters/src/harness/telemetry-claude.ts:57
    message: >-
      The production file reader reads the entire file (readFileSync) before the byte cap slices it,
      so the declared per-file bound caps what is parsed, not what is read - a pathologically large
      transcript is fully loaded into memory first. The cap also compares JS string length (UTF-16
      code units) against a byte-named budget. Local trusted files keep the impact low.
    suggestion: >-
      If ever hardened: open with a read budget (fs.read with a size limit) or stat-check the size
      against the cap before reading, and treat a would-exceed file as truncated-with-warning without
      the full read.
    suppressed: false
