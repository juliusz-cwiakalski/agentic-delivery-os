summary: >-
  The harness seam is delivered with a strong security and contract core, all re-verified green during
  this review: the deny-by-default spawn-env builder is fail-closed both ways with use-time
  credential-port resolution (TC-HARN-012/013 green, mutants real); the one shared classifier with the
  identical-classification proof holds structurally (same bound reference, adapters normalize only);
  extraction is read-only (query_only pragma before first SELECT, read-only open, no write/lock
  statements), bounded, and index-filtered; closeout capture is fenced, verified, idempotent by
  (work item, run, session), and non-gating; the config branch rejects literal allowlist values with
  the secret-forbidden identity; error-table sync, secret-read boundary (212 files, 5 entries
  unchanged), neutrality scans, changeset singularity, bash non-regression (zero .sh changes), and the
  doc-distribution guard all pass. One high finding blocks: the Claude adapter's shipped capability
  declaration lists `deliver` as supported while the port method returns a capability gap naming
  `steer` - an untruthful declaration that violates AC-F1-1/DoD-1 (degradation visible before spawn)
  and is uncovered by any test. The medium findings: the recorded taxonomy-token deviation (verify-class
  tokens, premature-end/tool-failure collapse to `partial`, refused->noop-lane-permission) was never
  propagated to test-plan section 4.2, whose oracle still pins dispatch-session-class tokens; the
  opencode per-session aggregate `GROUP BY agent, model ... LIMIT 1` silently drops all but the top
  (agent, model) group with no warning or truncation mark; 3 of the 14 named non-vacuity mutant
  families are themselves vacuous self-text-checks (DoD-12 claims every named mutant fails by name);
  and the child_process confinement test does not pin the allowed site list the pm-notes deviation
  says it names. Remaining findings are low or informational.
