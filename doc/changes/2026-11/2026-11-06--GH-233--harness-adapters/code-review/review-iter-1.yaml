    category: spec-compliance
    location: packages/adapters/src/harness/claude.ts:30
    message: >-
      CLAUDE_CAPABILITIES.supportedOperations lists "deliver" as supported, but the port's
      implementation returns a capability gap (`deliver: async () => gap("claude-code", "steer")` at
      claude.ts:196) - and the gap names "steer", not "deliver". This is exactly the false-parity
      defect AC-F1-1/DoD-1 exist to prevent: a consumer inspecting the declaration before spawn
      (RSK-1's mitigation) believes deliver works, then discovers mid-delivery that it is a gap.
      The harnessCapabilityViolations check passes because supported-union-gaps is still exhaustive
      and disjoint; no test calls deliver on the Claude port (tests/behaviour/harness-claude-session.test.ts
      and the conformance scenarios exercise spawn/collect/classify/resume only), and
      doc/spec/features/feature-harness-adapters.md mirrors the untruthful declaration. The first
      production consumer (M1-S9) drives the declared lifecycle spawn -> deliver -> collect and would
      hit the gap at runtime.
    suggestion: >-
      Remove "deliver" from CLAUDE_CAPABILITIES.supportedOperations and add an explicit gap record
      { capability: "deliver", reason: "headless-mode-limitation" } (consistent with DEC-4's headless
      posture), or implement deliver as the headless re-run if that lifecycle reading is chosen - one
      of declaration or behavior must move. Update the feature doc's Claude gap list, add the matching
      gap row to the TC-HARN-002 structure test, and add a behaviour case pinning deliver -> gap with
      zero runner invocations (mirror of the resume-gap case).
    suppressed: false
