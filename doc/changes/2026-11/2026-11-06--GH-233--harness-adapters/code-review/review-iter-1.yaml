    location: packages/adapters/src/host/index.ts:48
    message: >-
      Three minor runner semantics: (a) `timedOut = timedOut || signal === "SIGTERM"` conflates the
      runner's own timeout kill with any external SIGTERM, so an externally-killed harness is
      classified as timed-out (projecting to max-restarts); (b) stderr truncation drops chunks with no
      "[output truncated]" marker while stdout gets one; (c) the output bound counts UTF-16 code
      units, not bytes, against the 16 MiB budget. All are inside the injected-runner tier with no
      production composer yet.
    suggestion: >-
      When the runner is next touched: track timeout via the timer flag only, mark stderr truncation
      symmetrically, and size the bound in bytes (Buffer.byteLength) for accuracy.
    suppressed: false
