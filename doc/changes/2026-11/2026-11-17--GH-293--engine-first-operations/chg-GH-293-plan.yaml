#
# PHASE ORDERING AND TESTABILITY:
#   Each phase is one commit whose declared narrow gate is green at its boundary.
#   Phase 1 lands the amended decision record (D1..D11; D2's five-outcome table,
#   D7's exit projection) and the one shared condition-status shape (and nothing
