  closureRule: >-
    A remediation entry is an obligation, never a substitute for evidence: closing
    REM-1..REM-8 does not mark AC-F7-11, AC-F6-10, or any other acceptance criterion
    met by itself, and the review gate stays FAIL until review iteration 3
    re-verifies AC-F7-11 and AC-F6-10 against spec v1.6's amended text and
    re-verifies F-19 against REM-8's committed cell. No phase of
    this plan may close with in-scope work unlanded or with an AC whose in-scope
    portion is unmet, and the CHANGE may not close with any acceptance criterion or
    spec §17.1 DoD item outstanding. An entry left undone leaves its finding open; it
    is never converted into a residual and never closed as documentation.
