phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Contracts and the shared condition-status shape; land TDR-0031.
  #
  # Objective: declare the one condition vocabulary the three surfaces read and
  # land the binding decision record its index row already references. The shape
  # is `DispatchConditionStatus = {condition, status}` with `condition` from the
  # delivered `DISPATCH_HANDOVER_CONDITIONS` order (`truth, coverage, floor,
  # corroboration`) and `status` in the closed pair `met | open`, no `detail`;
  # the status set is declared once as data. The domain gains the single producer
  # helper that maps a folded window plus its evaluation onto the four ordered
  # entries — one derivation consumed by the summary (Phase 2), the handover
  # (Phase 3), and the fleet row (Phase 4). Nothing else moves here: no payload
  # type gains a field until its producer lands, so the phase is green on its own.
  #
  # AC/TC coverage: DM-3 (the shared shape and declared order), the declaration
  # half of DEC-2; AC-F8-12's TDR landing half (proven by TC-ENGINE-064 in
  # Phase 6); AC-NFR1-14 (no new vocabulary). Owns no TC id.
  #
  # Gate:
  #   pnpm typecheck
  #   bun run scripts/checks/exports-parity.ts
  #   bun run scripts/checks/error-table-sync.ts
  #   bun test tests/checks/decision-record.test.ts
  #   bun test tests/structure/error-table.test.ts
  #   bun test tests/structure/content-inventory.test.ts
  #   PATH="$PWD/node_modules/.bin:$PATH" delivery-os lint GH-293
  #
  # Left green: exports-parity (the new declaration is re-exported from the
  #   public surfaces it belongs to), error-table-sync and error-table (row count
  #   and per-kind pins unchanged — this phase adds no row), decision-record
  #   (TDR-0031's front matter and index agreement), content-inventory.
  #
  # No scope drift: only the four declared source files, the decision record, and
  # the change folder (which stages this plan) are touched; no payload type, no
  # command surface, and no test assertion changes here.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Shared condition-status shape and the landed TDR-0031 decision record"
    kind: delivery
    summary: "feat(dispatch): declare the shared four-condition shape and land TDR-0031"
    scope:
      files:
        - doc/decisions/TDR-0031-engine-first-evaluation-surfaces.md
        - packages/core/src/contracts/dispatch.ts
        - packages/core/src/contracts/index.ts
        - packages/core/src/domain/dispatch-gate.ts
        - packages/core/src/domain/index.ts
        - packages/core/src/index.ts
      folders:
        - doc/changes/2026-11/2026-11-17--GH-293--engine-first-operations
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/dispatch.ts
        role: producer

  # ---------------------------------------------------------------------------
  # Phase 2 — Summary accrual and the condition projection (F-1, DM-1, DM-3).
  #
  # Objective: make the summary report what the gate already computes.
  # `dispatch dual-run summary` appends, after `floor`,
  # `cleanDispatches` (declared identical to `corroboration.satisfied` — one
  # derivation, no second counting rule), `consecutiveCleanDispatches` (the
  # trailing run of clean counted attempts ending at the window's last counted
  # attempt in ledger append order; `0` when that attempt is not clean or the
  # window is empty), and `conditions` (the four ordered entries from Phase 1's
  # producer). The optional `truncation` object stays last and every delivered
  # key keeps its position. The text form gains `clean_dispatches=`,
  # `consecutive_clean_dispatches=`, and
  # `conditions=truth:<status>,coverage:<status>,floor:<status>,corroboration:<status>`
  # after `unmet_conditions=` and before the optional truncation line. No numeric
  # coverage counter is added: it would be a derived duplicate of
  # `coverage.present.length`.
  #
  # AC/TC coverage: AC-F1-1, AC-F1-2 complete (TC-ENGINE-001..006); AC-F8-13's
  # SC-M2-S16-02 restatement half; NFR-1, NFR-4, NFR-10; DEC-2, DEC-3.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/dispatch-clean-accrual.test.ts
  #   bun test tests/behaviour/dispatch-conditions-projection.test.ts
  #   bun test tests/behaviour/dispatch-additive-stability.test.ts
  #   bun test tests/behaviour/dispatch-dual-run-summary.test.ts
  #   bun test tests/behaviour/dispatch-gate-window.test.ts
  #   bun test tests/behaviour/dispatch-false-success.test.ts
  #   bun test tests/behaviour/dispatch-truth-derivation.test.ts
  #   bun test tests/behaviour/dispatch-unevaluable.test.ts
  #   bun test tests/golden/dispatch-summary.test.ts
  #   bun test tests/golden/dispatch-text.test.ts
  #   bun test tests/structure/content-inventory.test.ts
  #
  # Left green: dispatch-clean-accrual (identity with corroboration.satisfied on
  #   five ledgers, trailing-run semantics, empty window 0/0, the dispatch-count
  #   interpretation fails, the accrual walk with first-appearance coverage),
  #   dispatch-conditions-projection (four-entry shape, declared order, no
  #   `detail`, open set equals `unmetConditions` on six fixture families
  #   including truncation), dispatch-additive-stability (summary case extended by
  #   appending; the delivered sixteen-key literal kept as a prefix),
  #   dispatch-dual-run-summary + dispatch-gate-window + dispatch-false-success
  #   (delivered controls), golden dispatch-summary (deliberate single
  #   regeneration showing only the three additive lines) and dispatch-text
  #   (unchanged), content-inventory.
  #
  # No scope drift: the summary data gains exactly the three declared keys in the
  # declared position; no coverage counter, no `detail`, no third status, no
  # handover or fleet-row key appears here; `truncation` stays last.
  # Conditional rows: `tests/fixtures/dispatch/evidence-windows.ts` and
  # `tests/fixtures/dispatch/golden/harness.ts` are extended only if the new
  # cases need a ledger family or scenario helper that does not exist; the
  # delivered helpers are reused before any new one is written.
  # ---------------------------------------------------------------------------
  - id: 2
    title: "Summary clean accrual, trailing streak, and the four-condition projection"
    kind: delivery
    summary: "feat(dispatch): report clean accrual and the four ordered conditions on the summary"
    scope:
      files:
        - packages/core/src/contracts/dispatch.ts
        - packages/core/src/domain/dispatch-gate.ts
        - packages/cli/src/output/dispatch-text.ts
        - tests/behaviour/dispatch-clean-accrual.test.ts
        - tests/behaviour/dispatch-conditions-projection.test.ts
        - tests/behaviour/dispatch-additive-stability.test.ts
        - tests/golden/dispatch-summary.test.ts
        - tests/fixtures/dispatch/golden/summary.txt
        - tests/fixtures/dispatch/evidence-windows.ts
        - tests/fixtures/dispatch/golden/harness.ts
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/dispatch.ts
        role: producer
      - kind: generated-code
        target: packages/cli/src/output/dispatch-text.ts
        role: consumer

  # ---------------------------------------------------------------------------
  # Phase 3 — Handover conditions, the declared exemption, and reversibility
  # (F-2, DM-2, DM-3; DEC-2, DEC-4, DEC-12).
  #
  # Objective: give the decision surface the same four conditions and the
  # authority fact, without changing any record or read order. `dispatch
  # handover` data carries the four ordered `conditions` and `reversible` on
  # every outcome that performs the gate evidence read — recorded flip,
  # idempotent flip noop, clean refusal, recorded revert — appended after
  # `unmetConditions` (which stays refusal-only and unchanged). The recorded
  # revert additionally carries `verdict`, populating an already-declared key so
  # `truncation` present exactly when `verdict == "unverifiable"` is expressible
  # there. The single declared exemption is the idempotent revert noop: the
  # delivered code already answers it after the handover-ledger fold and before
  # `readDispatchGate`; this phase preserves that order, adds `reversible: false`,
  # and keeps `conditions`, `verdict`, and `truncation` absent, so the noop still
  # answers at exit 0 under an unreadable or torn attempts/divergences ledger
  # while the recorded revert refuses `dispatch.state-unverified` at exit 2 with
  # no record appended and the prior flip intact. The handover-ledger read is NOT
