        literal `return "<code>"` sites in the `mergeReadCodeOf` block so a
        forwarded `code` value read out of a refusal branch must also be a member,
        and the branch gains cases for an invalid or unreadable configuration
        document and for an invalid `merge.gates` / `gate-freshness` value, each
