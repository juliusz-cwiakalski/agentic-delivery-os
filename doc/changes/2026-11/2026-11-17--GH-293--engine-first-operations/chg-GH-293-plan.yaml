workItemRef: GH-293
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7]
  escalationTriggers:
    - "A new command, verb, flag, daemon tick, scheduler, cache, sampling rule, or configuration key appears for gate evaluation, the owner principal, or the row identity (NG-2, NG-11, DEC-1, DEC-13)"
    - "An error-table row, DOMAIN_KINDS member, exit class, or error identity is added, or a condition status other than met|open appears (NG-7, NFR-5)"
    - "projects.v1 rows or the projects list --flat bytes change, or either new row field appears on the flat alias (NG-6, BYTE-ENG-1)"
    - "The shell delivery summary gains a key or line, changes an exit, or gains a machine mode, or any script under scripts/ is edited (NFR-6, NG-5)"
    - "A second derivation of the condition statuses, the accrual counters, or reversibility appears beside the shared producer, or open conditions stop equalling unmetConditions in order (DEC-2, DEC-3, DEC-4, NFR-10)"
    - "A second handover outcome omits conditions, or an evidence-reading outcome omits them, or the idempotent revert noop performs a gate evidence read (NFR-11, DEC-12)"
    - "A fleet row is evaluated under an unresolved or foreign repository identity, resolution writes or repairs a binding, opens an additional store, or counts another repository's records (NFR-13, DEC-15)"
    - "An unreadable or torn ledger fabricates a row, a zero, or a defaulted status, or a truncated read loses its verdict-plus-truncation pair (NFR-4)"
    - "An emitted (kind, code) pair contradicts the declared error-table row, a refusal branch falls outside MERGE_COMPOSITION_EMITTABLE_CODES, or a legitimate production failure reaches fallback.internal (NFR-5, NFR-12, DEC-7, DEC-14)"
    - "The verify deploy stub is presented as delivered capability, or this change attempts its production fix (NG-8, RSK-8)"
    - "Any repository is flipped, or a dispatch.handover authoritative record is appended by this change (NG-1, NFR-7)"
    - "doc/quality/test-specs/ gains a new entry, or the two broader specs are reconciled outside lifecycle phase 7 (@doc-syncer) (DEC-11, DEC-16)"
    - "A delivering suite needs live network, a live credential read, a live model call, real sleeps, or the live tree/$HOME as state (NFR-9)"
