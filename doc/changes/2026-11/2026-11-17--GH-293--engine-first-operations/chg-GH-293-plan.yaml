  # ---------------------------------------------------------------------------
  # Phase 4 — Fleet read-time evaluation and the row's own repository binding
  # (F-3, DM-4, DM-7; DEC-1, DEC-15).
  #
  # Objective: host the gate where the fleet read already opens every store.
  # `repos list` (and only `repos list`) appends, after `handoverState`,
  # `reversible` then `handoverGate = {verdict, conditions, countedDeliveries,
  # cleanDispatches, truncation?}`, computed in the same per-row pass over one
  # bounded attempts read plus one divergences read, with a pure fold and no
  # write, network call, model call, cache, or scheduler. The row's evaluation is
  # bound to the normalized `host/owner/name` identity of that row's OWN checkout,
  # resolved through the delivered identity policy read-only and non-persisting
  # (persisted marker first, then the normalized configured remote; no scheduler
  # key on this path), at no additional store open and with no binding write;
  # records of another repository in the same store are excluded from
  # `countedDeliveries`, `conditions`, and `cleanDispatches`. A `first-use` row
  # reports the empty-window evaluation (`ineligible`; truth met; corroboration
  # met vacuously; coverage and floor open; `countedDeliveries: 0`;
  # `cleanDispatches: 0`; `reversible: false`) without opening a store. Failure
  # behaviour is declared: an unreadable/torn ledger or an unresolvable identity
  # fails the whole read as `repos.state-unavailable` at exit 2 with no row; a
  # truncated attempts read reports `verdict: "unverifiable"` plus `truncation`
  # over the visible window at exit 0. The text table stays five columns and the
  # flat alias stays byte-identical because the evaluation rides a repos-only
  # projection input, never the `projects.v1` rows.
  #
  # AC/TC coverage: AC-F3-5, AC-F3-6 complete (TC-ENGINE-020..024, 093, 094);
  # SC-M2-S16-01; NFR-1, NFR-2, NFR-3, NFR-4, NFR-10, NFR-13; DEC-1, DEC-15;
  # AMB-ENG-1, AMB-ENG-2, BYTE-ENG-1, TRUNC-ENG-1; OQ-TP-4 and OQ-TP-8 pinned
  # here, OQ-TP-5 measured here.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/repos-handover-gate.test.ts
  #   bun test tests/behaviour/repos-list-contract.test.ts
  #   bun test tests/behaviour/projects-flat-alias.test.ts
  #   bun test tests/behaviour/projects-list-contract.test.ts
  #   bun test tests/behaviour/projects-handover.test.ts
  #   bun test tests/behaviour/projects-read-only-audit.test.ts
  #   bun test tests/behaviour/dispatch-identity.test.ts
  #   bun test tests/structure/content-inventory.test.ts
  #
  # Left green: repos-handover-gate (row/summary agreement, foreign-record scope,
  #   both identity resolution cells, unreadable/torn/unresolvable failures with
  #   no fabricated row, truncation at the delivered bound, determinism,
  #   re-evaluation without cache), repos-list-contract (seven ordered fields,
  #   binding-file and tree snapshots, five-column text table),
  #   projects-flat-alias (committed golden unchanged, deep absence scan),
