    - id: REM-5
      reviewFindings: [F-12, F-14]
      summary: "Bind the reversible fold to the row identity and derive the empty gate once"
      change: >-
        `readProjectHandover`'s fold filters to the row's resolved repository
        identity before `reversible` and `handoverState` are read, so a store that
        accumulates two identities cannot report another repository's authority; if
