  # Phase 3 — Handover conditions, the declared exemption, and reversibility
  # (F-2, DM-2, DM-3; DEC-2, DEC-4, DEC-12).
  #
  # Objective: give the decision surface the same four conditions and the
  # authority fact, without changing any record or read order. The delivered
  # behaviour is exactly amended TDR-0031 D2's five-outcome table: `dispatch
  # handover` data carries the four ordered `conditions` and `reversible` on
  # every outcome that performs the gate evidence read — recorded flip,
  # idempotent flip noop, clean refusal, recorded revert — appended after
  # `unmetConditions` (which stays refusal-only and unchanged). The recorded
  # revert additionally carries `verdict`, populating an already-declared key so
  # `truncation` present exactly when `verdict == "unverifiable"` is expressible
  # there (D2's invariant and D7's projection rule: `unverifiable` is a verdict,
  # never a condition status, and no exit class moves). The single declared
  # exemption is the fifth row of that table — the idempotent revert noop: the
  # delivered code already answers it after the handover-ledger fold and before
  # `readDispatchGate`; this phase preserves that order, adds `reversible: false`,
  # and keeps `conditions`, `verdict`, and `truncation` absent, so the noop still
  # answers at exit 0 under an unreadable or torn attempts/divergences ledger
  # while the recorded revert refuses `dispatch.state-unverified` at exit 2 with
  # no record appended and the prior flip intact. The handover-ledger read is NOT
  # exempted and must not be removed: an unreadable handover ledger still refuses
  # `dispatch.state-unverified`, because the exemption covers the gate's evidence
  # read (attempts and divergences), never the authority fold that decides whether
  # the operation is a noop. `reversible` is `true` iff the
  # latest folded authority after the operation is `authoritative` — the same rule
  # the authority document applies to `reversalAvailable`, never a second one.
  # Handover and reversal record shapes are unchanged; replay remains idempotent.
  #
  # AC/TC coverage: AC-F2-3, AC-F2-4 complete (TC-ENGINE-010..017 — the whole
  # handover block, eight cases; TC-ENGINE-017 is the exempt noop refused over an
  # unreadable or torn handover ledger, so all five of AC-F2-3's cases are green
  # here); AC-F8-13's SC-M2-S16-03 engine-surface half; NFR-4, NFR-7, NFR-11;
  # DEC-2, DEC-4, DEC-12;
  # TDR-0031 D2 (the five-outcome table this phase implements cell for cell) and
  # D4 (the reversibility rule and its declared residual).
