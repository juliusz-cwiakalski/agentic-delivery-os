  # ---------------------------------------------------------------------------
  # Phase 1 — Contracts and the shared condition-status shape; land TDR-0031.
  #
  # Objective: declare the one condition vocabulary the three surfaces read and
  # land the binding decision record its index row already references. The record
  # lands AS AMENDED (2026-11-18, TDR-0031 v2): eleven clauses D1..D11 — D2's
  # five-outcome table (four evidence-reading outcomes carry `conditions`; the one
  # exempt outcome, the idempotent revert noop, carries none, no `verdict`, no
  # `truncation`), D7's declared exit projection (the credential-read move 2 -> 1
  # with no class, row, or exit added), and the seam declarations D8..D11 (owner
  # principal, emittable-code constant, row repository binding, row evidence-class
  # scope). This phase writes no clause; it lands the amended file, and TC-ENGINE-064
  # (Phase 6) proves the landing and the clause set.
  # The shape is `DispatchConditionStatus = {condition, status}` with `condition` from the
  # delivered `DISPATCH_HANDOVER_CONDITIONS` order (`truth, coverage, floor,
  # corroboration`) and `status` in the closed pair `met | open`, no `detail`;
  # the status set is declared once as data. The domain gains the single producer
  # helper that maps a folded window plus its evaluation onto the four ordered
  # entries — one derivation consumed by the summary (Phase 2), the handover
  # (Phase 3), and the fleet row (Phase 4). Nothing else moves here: no payload
  # type gains a field until its producer lands, so the phase is green on its own.
  #
  # AC/TC coverage: DM-3 (the shared shape and declared order), the declaration
  # half of DEC-2 as amended TDR-0031 D2 states it (the five-outcome table the
  # shape must be able to express, including the one exempt outcome); TDR-0031 D7
  # is cited because the declared exit projection is what this phase leaves
  # untouched — the shape adds no exit class and moves no exit; AC-F8-12's TDR
  # landing half (proven by TC-ENGINE-064 in Phase 6); AC-NFR1-14 (no new
  # vocabulary). Owns no TC id.
  #
  # Gate:
  #   pnpm typecheck
  #   bun run scripts/checks/exports-parity.ts
  #   bun run scripts/checks/error-table-sync.ts
  #   bun test tests/checks/decision-record.test.ts
  #   bun test tests/structure/error-table.test.ts
  #   bun test tests/structure/content-inventory.test.ts
  #   PATH="$PWD/node_modules/.bin:$PATH" delivery-os lint GH-293
  #
  # Left green: exports-parity (the new declaration is re-exported from the
  #   public surfaces it belongs to), error-table-sync and error-table (row count
  #   and per-kind pins unchanged — this phase adds no row), decision-record
