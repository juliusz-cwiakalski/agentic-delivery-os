    - id: REM-8
      reviewFindings: [F-19]
      summary: "Pin the row-identity-bound handover fold with a permanent foreign-identity cell"
      change: >-
        No production code change. The identity-bound fold delivered under REM-5
        (the handover fold filtered to the row's own resolved repository identity
        before `reversible` and `handoverState` are read) is given its permanent
        case in `tests/behaviour/repos-handover-gate.test.ts` as ONE new cell: seed
