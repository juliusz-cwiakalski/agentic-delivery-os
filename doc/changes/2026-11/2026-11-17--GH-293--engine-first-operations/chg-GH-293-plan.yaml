  #   bun test tests/behaviour/dispatch-exit-projection.test.ts
  #   bun test tests/golden/dispatch-text.test.ts
  #
  # Left green: dispatch-handover-conditions (five outcomes with their declared
  #   key sets and exits, the noop's three absences, the noop under a torn
  #   attempts/divergences ledger, the noop refused `dispatch.state-unverified` at
