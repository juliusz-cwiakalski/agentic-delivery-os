# DECLARED RESIDUALS (stated, not papered over):
#   RSK-8/NG-8 — the production `verify deploy` target-resolution stub stays
#     stubbed; the pages and the guide state it as a residual, never as delivered
#     capability (TC-ENGINE-055).
#   TDR-0031 D4 — a recorded revert under a torn attempts/divergences ledger
#     refuses `dispatch.state-unverified` at exit 2 while the prior flip stands;
#     only the idempotent revert noop is evidence-read-free (DEC-12).
#   OQ-TP-5 — the 5,005-record fixture's cost is measured at delivery.
#   These three are the plan's ONLY residuals, and none of them is an acceptance
#   criterion: each is either a declared product gap the documentation names
#   (RSK-8), a declared decision residual the record carries (D4), or a placement
#   note whose case asserts the contract either way (OQ-TP-5). CLOSURE RULE (stated
#   once in DOC BOUNDARY and quoted verbatim here): no phase of this plan may close
#   with in-scope work unlanded or with an AC whose in-scope portion is unmet; the
