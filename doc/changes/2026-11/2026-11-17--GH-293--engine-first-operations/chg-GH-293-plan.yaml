#   statement. Phase 7 is the closing battery: cross-surface coherence, shell
#   non-change controls, no-flip discipline, hermeticity, additivity, the
#   changeset, the full gate, and the RECORDED lifecycle-phase-7 reconciliation
#   handoff. The seams land with the surface they constrain (spec §18): the
#   handover exemption with F-2 (Phase 3), the row binding and the scope fold with
#   the fleet host (Phase 4), and the owner principal plus the emittable-code
