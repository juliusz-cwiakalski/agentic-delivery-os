#           `category`, not merely be nameable by the code;
#       (c) it must be refused at that row's declared projection and therefore its
#           declared exit (`projectExitCode`), never at a hand-picked exit;
#       (d) it must be a member of `MERGE_COMPOSITION_EMITTABLE_CODES` and agree
#           with the `domainKind` the composition emits for it (TC-ENGINE-054);
#       (e) if no existing row's declared meaning covers "the ref's request could
#           not be resolved", the coder MUST STOP and reopen specification rather
#           than invent an identity, stretch a row, or return an unclassified
#           failure.
#     The declared candidate remains the delivered `merge.transaction-aborted`
#     (kind `merge`, category `user`, retryable, consequence `not_landed`,
#     projection `user-validation` -> exit 1, summary "The transaction aborted
#     cleanly before any landing mutation"). Its row meaning DOES cover the abort
#     case: the composition cannot resolve the ref's request, so it aborts before
#     any landing mutation, nothing landed and a re-run with a valid ref
#     converges — the row's declared consequence, remediation, and summary all
#     hold without re-meaning the code. TC-ENGINE-053's non-resolving-ref cell
#     asserts the chosen code's declared row shape (declared row, membership in
#     `MERGE_COMPOSITION_EMITTABLE_CODES`, exit derived from the row's
#     `projectionClass`) and fails an undeclared, re-meaned, or off-exit pair;
#     TC-ENGINE-054 proves the constant is total over the refusal branches.
#
#   OQ-TP-7 (second placement of the restated SC-M2-S16-03) — OPEN and PLACED in
#     PHASE 6: `@doc-syncer` reconciles; TC-ENGINE-062 selects by scenario id, so
#     either corpus placement passes and a missing restatement fails.
#
#   OQ-TP-8 (how a row learns its repository identity) — CLOSED by DEC-15/DM-7
#     and PINNED in PHASE 4: the delivered identity policy applied to that row's
#     own checkout, read-only and non-persisting (persisted marker first, then
#     the normalized configured remote; no scheduler key on this path), at no
