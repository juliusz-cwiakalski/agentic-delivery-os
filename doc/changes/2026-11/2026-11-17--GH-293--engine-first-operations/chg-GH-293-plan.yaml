# GH-293 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly.
#
# SOURCES (single source of truth):
#   - Spec:      ./chg-GH-293-spec.md (v1.1, 14 ACs — AC-F1-1, AC-F1-2, AC-F2-3,
#                AC-F2-4, AC-F3-5, AC-F3-6, AC-F4-7, AC-F4-8, AC-F5-9, AC-F6-10,
#                AC-F7-11, AC-F8-12, AC-F8-13, AC-NFR1-14; F-1..F-8; NFR-1..NFR-13;
#                DM-1..DM-7; DEC-1..DEC-16; §5.1 capability details; §6 flows 1-5;
#                §7 scope; §8.5 compatibility; §16 affected components; Appendix A
#                exact additive shapes, Appendix B scenario restatements, Appendix C
#                window/hold effect mapping, Appendix D source anchors, and
#                Appendix E declared outcome and failure behaviour).
#   - Tests:     ./chg-GH-293-test-plan.md (v1.1, 44 cases TC-ENGINE-001..095 in
#                eight blocks; 14/14 AC coverage; DEC-1..DEC-16 coverage;
#                §3.5 substitute assertions AMB-ENG-1..5, BYTE-ENG-1,
#                TRUNC-ENG-1; §4 layers; §7 automation map with the planned suite
#                paths this plan declares; §8.3 OQ-TP-1..8). No case id, oracle,
#                identity, exit, bound, or AC/NFR mapping is reshaped by this
#                plan; phase ownership of every id is declared in the TC -> PHASE
#                MAP below.
#   - Decisions: doc/decisions/TDR-0031-engine-first-evaluation-surfaces.md
#                (status Proposed, UNTRACKED working-tree file; binding clauses
#                D1..D7 and constraints C-1..C-8 consumed as pinned).
#   - PM record: ./chg-GH-293-pm-notes.yaml (owner-authored scope comment of
#                2026-11-15 placing the production merge-composition defect in
#                this ticket; milestone M2; delivery conventions — this plan
#                declares phases and scope only, the commit primitive, PR base,
#                and corpus markers come from that record and the ticket).
#   - Schema:    doc/spec/features/feature-plan-schema.md (scope keys
#                files/packages/folders, doneArtifacts slots, leases,
#                weightClass, interactions, tier; no tasks key, no progress log).
#   - Precedent: ./../2026-11-13--GH-294--provider-peak-pausing/chg-GH-294-plan.yaml
#                (declaration-first ordering, decision-record staging contract,
#                conditional scope rows, declared controls, per-phase gate
#                blocks) and ./../2026-11-16--GH-299--metrics-spend/chg-GH-299-plan.yaml
#                (delivery-phase documentation scopes that include doc/spec pages).
#
# DECISION-RECORD STAGING CONTRACT (why TDR-0031 is Phase 1's scope):
#   `doc/decisions/TDR-0031-engine-first-evaluation-surfaces.md` is UNTRACKED at
#   plan time, while its `doc/decisions/00-index.md` row is already committed
#   (b0573fd8, line 61: `| TDR-0031 | ... | Proposed | 2026-11-17 |`). The commit
#   primitive stages tracked-pending work plus untracked files only inside the
#   declared phase scope, so the record MUST be declared in the FIRST plan
#   phase or the index row dangles at PR time. It lands as authored (status
#   Proposed; owner acceptance is the GH-293 PR review, per the record's
#   governance block). The index row is already correct and is not edited, so
#   `doc/decisions/00-index.md` is not declared. TC-ENGINE-064 (Phase 6) proves
#   the landing: file, index row, resolvable bidirectional reference, and status
#   agreement.
#
# OQ-TP PLACEMENTS (test plan §8.3; each is placed in a named phase and asserted
# by the named case — a placement that cannot hold fails its case, never skips):
#
#   OQ-TP-1 (where the emittable-code set is declared) — CLOSED by spec v1.1
#     DEC-14/DM-6 and PINNED in PHASE 5: the declaration lives in the module that
#     owns the production merge composition and therefore the refusal branches
#     (`packages/cli/src/production.ts`), exported as
#     `MERGE_COMPOSITION_EMITTABLE_CODES`. A contracts-side declaration would
#     drift from the branches it must enumerate; the composition is the
#     exhaustive-by-construction home. TC-ENGINE-054 imports it from the
#     composition (never a fixture copy) and fails naming the missing export.
#
#   OQ-TP-2 (which source resolves the owner principal) — CLOSED by DEC-13 and
#     PINNED in PHASE 5: the owner component of the checkout's normalized
#     `host/owner/name` identity, resolved through the delivered policy
#     (`resolveDispatchIdentity` with the persisted marker first), supplied to
#     `MergeTransactionConfig.ownerPrincipal`. No configuration key, branch
#     member, or identity source is added; the `merge` branch keeps exactly
#     `gate-freshness`, `gates`, `deploy-expectations`. TC-ENGINE-050 asserts the
#     waiver effect (authorized for that principal, `merge.waiver-unauthorized`
#     exit 1 for any other) plus the three-key branch.
#
#   OQ-TP-3 (does the revert noop read the gate) — CLOSED by DEC-12/Appendix E.1
#     and PINNED in PHASE 3: no. The delivered code already answers the noop
#     before `readDispatchGate`; PHASE 3 preserves that read order and adds only
#     the declared absence fields (`reversible: false`, no `conditions`, no
#     `verdict`, no `truncation`), while the recorded revert gains `verdict` and
#     keeps its read and its `dispatch.state-unverified` exit 2 under a torn
#     attempts/divergences ledger. TC-ENGINE-010/011/012/014/016 assert both
#     directions.
#
#   OQ-TP-4 (`reversible` on a first-use row) — CLOSED by AC-F3-6 and PINNED in
#     PHASE 4: `false`, stated field by field alongside `countedDeliveries: 0`.
#
#   OQ-TP-5 (acceptability of the 5,005-record truncation fixture) — OPEN and
#     PLACED in PHASE 4: delivery measures; the case prints the record count and
#     elapsed milliseconds and asserts `countedDeliveries <= 5000` with
#     `truncation: { bound: 5000, omittedRecords: 5 }` (TRUNC-ENG-1). If the cost
#     is unacceptable the bound is declared and logged as a delivery note — never
#     silently reduced and never replaced by an invented test seam.
#
#   OQ-TP-6 (which code a non-resolving request emits) — NARROWED and PLACED in
#     PHASE 5 as a constraint, not an identifier: the refusal MUST be a code the
#     error table already declares and a member of
#     `MERGE_COMPOSITION_EMITTABLE_CODES` (the change invents no identity). The
#     exact member is delivery-bound; TC-ENGINE-053 asserts the chosen code is
#     declared and a constant member and fails an undeclared pair. The declared
#     candidate class is the delivered `merge.transaction-aborted` (user,
#     `not_landed`, "aborted cleanly before any landing mutation"), which the
#     composition may reuse — never re-mean.
#
#   OQ-TP-7 (second placement of the restated SC-M2-S16-03) — OPEN and PLACED in
#     PHASE 6: `@doc-syncer` reconciles; TC-ENGINE-062 selects by scenario id, so
#     either corpus placement passes and a missing restatement fails.
#
#   OQ-TP-8 (how a row learns its repository identity) — CLOSED by DEC-15/DM-7
#     and PINNED in PHASE 4: the delivered identity policy applied to that row's
#     own checkout, read-only and non-persisting (persisted marker first, then
#     the normalized configured remote; no scheduler key on this path), at no
#     additional store open and with no binding write. Foreign-repository records
#     are excluded; an unresolvable identity fails the read as
#     `repos.state-unavailable` at exit 2 with no row.
#
# SUBSTITUTE ASSERTIONS (§3.5) — honored, never smoothed over:
#   AMB-ENG-1 (no store-open counter: host-root tree snapshot before/after plus
#     an absent first-use project state directory) -> Phase 4 (TC-ENGINE-020);
#   AMB-ENG-2 (per-row read cardinality via agreement + truncation bound +
#     zero write/network/model/sleep counters + printed fleet floor) -> Phase 4
#     (TC-ENGINE-024, TC-ENGINE-094);
#   AMB-ENG-3 ("no authoritative record attributable to the change" is an audit
#     over untracked operator state: permanent half proves the writers and the
#     zero-append reads) -> Phase 7 (TC-ENGINE-035) with the review audit
#     recorded in test-plan §10;
#   AMB-ENG-4 (the emittable set is a declaration; a future branch that forgets
#     to extend it escapes) -> Phase 5 (TC-ENGINE-054: non-empty, duplicate-free,
#     four-family spanning, per-member row/kind agreement, live mismatch
#     control, refusal-site scan);
#   AMB-ENG-5 (the owner principal is observed through the waiver effect) ->
#     Phase 5 (TC-ENGINE-050); BYTE-ENG-1 (flat-alias byte identity is a golden
#     plus absence scans plus a repos read that does carry both fields) ->
#     Phase 4 (TC-ENGINE-022); TRUNC-ENG-1 (the 5,005-record fixture prints its
#     context) -> Phase 4 (TC-ENGINE-024).
#
# ADDITIVE CONTRACT DISCIPLINE (binding on every phase; DEC-9, NFR-1, NG-7):
#   no new command, verb, flag, error-table row, `DOMAIN_KINDS` member, exit
#   class, or configuration key; appended keys only, in the declared order;
#   `projects.v1` rows and the `projects list --flat` bytes unchanged (the fleet
#   row gains fields only on `repos.v1`); the shell five-key delivery-summary
#   tail, exits, and pointer behaviour unchanged; every pinned suite extended by
#   appending, never weakened or removed. The one type widening this change
#   needs is `MergeFailure.domainKind` admitting the already-declared `config`
#   kind (Phase 5) — a widening over an existing `DOMAIN_KINDS` member, never a
#   new member.
#
# NO-FLIP SCOPE (NG-1, NFR-7, DEC-6): this change flips no repository and
#   inserts no handover/reversal record. The flips and reversals the cases
#   exercise run over a controlled composition in a temp state root; the
#   repository stays `dual-run`; the flip remains a later owner act executed by
#   `dispatch handover <repo>` once the gate reads eligible.
#
# DECLARED RESIDUALS (stated, not papered over):
#   RSK-8/NG-8 — the production `verify deploy` target-resolution stub stays
#     stubbed; the pages and the guide state it as a residual, never as delivered
#     capability (TC-ENGINE-055).
#   TDR-0031 D4 — a recorded revert under a torn attempts/divergences ledger
#     refuses `dispatch.state-unverified` at exit 2 while the prior flip stands;
#     only the idempotent revert noop is evidence-read-free (DEC-12).
#   OQ-TP-5 — the 5,005-record fixture's cost is measured at delivery.
#
# PHASE ORDERING AND TESTABILITY:
#   Each phase is one commit whose declared narrow gate is green at its boundary.
#   Phase 1 lands the decision record and the one shared condition-status shape
#   (and nothing that breaks typecheck: no payload type gains a field until its
#   producer lands). Phase 2 lands the summary accrual and the condition
#   projection. Phase 3 lands the handover surfaces, the declared exemption, and
#   `reversible`. Phase 4 lands the fleet host with the row binding. Phase 5
#   lands the merge composition restoration and the classification conformance
#   (the only phase that touches provider read composition). Phase 6 lands the
#   documentation, the operating guide, the planning corpus, and the phase-7
#   test-spec handoff. Phase 7 is the closing battery: cross-surface coherence,
#   shell non-change controls, no-flip discipline, hermeticity, additivity, the
#   changeset, and the full gate. The seams land with the surface they constrain
#   (spec §18): the handover exemption with F-2 (Phase 3), the row binding with
#   the fleet host (Phase 4), the owner principal and the emittable-code constant
#   with the merge composition (Phase 5).
#
# TC -> PHASE MAP (44 ids; every id is owned by exactly one phase — the phase
#   which first makes its complete suite set green):
#   Phase 1 contracts and TDR landing (0): none — proven by the exports, error
#           table, decision-record, and content-inventory guards; the TDR landing
#           itself is proven by TC-ENGINE-064 in Phase 6.
#   Phase 2 summary accrual and conditions (6): TC-ENGINE-001, 002, 003, 004,
#           005, 006.
#   Phase 3 handover conditions, exemption, reversibility (7): TC-ENGINE-010,
#           011, 012, 013, 014, 015, 016.
#   Phase 4 fleet read-time evaluation (7): TC-ENGINE-020, 021, 022, 023, 024,
#           093, 094.
#   Phase 5 merge restoration and classification (6): TC-ENGINE-050, 051, 052,
#           053, 054, 055.
#   Phase 6 documentation, guide, corpus, test-spec handoff (8): TC-ENGINE-040,
#           041, 042, 060, 061, 062, 063, 064.
#   Phase 7 cross-surface, shell, no-flip, additivity (10): TC-ENGINE-030, 031,
#           032, 033, 034, 035, 090, 091, 092, 095.
#   Totals: 6 + 7 + 7 + 6 + 8 + 10 = 44.
#
# SCOPE CONVENTION: concrete files are exact paths; folders are declared by every
#   phase that writes a new file inside them (the commit primitive stages only the
#   declared phase scope). A file edited or extended in two phases is declared in
#   both. Conditional rows (a composition type that may not move, an inventory
#   list that only changes if a module appears) are declared so the likely edit
#   is always staged; an untouched declared file is a `plan diff` observation,
#   never a gate failure.
#
# DECLARED CONTROLS, NOT EDITS: the delivered suites below are re-run in phase
#   gates as controls and are NOT edited, so none is declared in a phase scope —
#   `dispatch-dual-run-summary`, `dispatch-handover`, `dispatch-authority-view`,
#   `dispatch-state-unverified`, `dispatch-exit-projection`, `dispatch-identity`,
#   `dispatch-gate-evidence`, `dispatch-gate-window`, `dispatch-truth-derivation`,
#   `dispatch-false-success`, `dispatch-unevaluable`,
#   `projects-list-contract`, `projects-handover`, `projects-read-only-audit`,
#   `projects-performance`, `merge-dry-run` (TC-MERGE-028), `merge-classification`,
#   `merge-waivers`, `merge-verification-record`, `error-table`,
#   `dispatch-error-identity`, `dispatch-help-inventory`,
#   `help-guide-coverage`, `prompt-conformance`, `exit-code-literals`,
#   `tests/golden/verify-deploy`, `tests/golden/dispatch-text`,
#   `tests/golden/lanes-list`, and the delivered shell suites
#   `test-dispatch-bash-fallback.sh` and `test-deliver-ticket.sh` (the shell
#   non-change control; a diff to `scripts/` is a plan violation, not a mechanism
#   choice). Golden regenerations are deliberate and once: only
#   `tests/fixtures/dispatch/golden/summary.txt` (Phase 2, three additive lines).
#
# DOC BOUNDARY: this change delivers documentation, so the current-truth pages
#   are Phase 6 scope (spec §7.1, §18, AC-F8-12), not deferred to lifecycle phase
#   7. The one exception is DEC-16: `doc/quality/test-specs/test-spec-dispatch-
#   engine.md` and `test-spec-merge-verify-deploy.md` are reconciled in lifecycle
#   phase 7 by `@doc-syncer`; Phase 6 authors only the handoff statement (in the
#   feature pages and the guide) and Phase 7 re-declares the two files so a
#   phase-7-authored reconciliation can be committed without reopening the plan.
#   If lifecycle phase 7 has not run when Phase 7 executes, the two rows are
#   untouched and the obligation stays recorded as a residual of this plan.
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`), matching the
#   GH-286..GH-299 precedent (`.changeset/gh-293-engine-first-operations-minor.md`).
#   No new package dependency; no data migration; `STATE_SCHEMA_VERSION` does not
#   change (all payload changes are additive fields, DM-1..DM-7; §19).

