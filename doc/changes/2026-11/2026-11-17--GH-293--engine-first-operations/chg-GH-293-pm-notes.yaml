    type: "info"
    date: "2026-11-18"
  - text: "REM-6 complete (F-13). Commit ecdc483e. stateFailure derives its exit
      from the same resolved error-table row it already reads the kind from
      (projectExitCode over the row's projectionClass, as readFailure does), so
      the claim that every emitted failure's exit is its row's declared
      projection holds by construction instead of coinciding with a hard-coded
      2. One helper (exitOfRow) serves both call sites; the absent-row case keeps
      the containment default, exit 2. No emitted exit value moved today
      (merge.state-unverified is platform-provider). Verification: pnpm
      typecheck green; merge-production-composition 8/8,
      merge-classification-conformance 7/7, error-table 126/126."
    type: "info"
    date: "2026-11-18"
  - text: "REM-5 complete (F-12, F-14). Commit bf93d606. readProjectHandover
      filters the folded handover truth to the row's resolved repository
      identity before reversible and handoverState are read, using the same
      resolution the gate block uses (one resolveRowRepository call per ready
      row, reused by both, and none on the projects list path, so projects.v1
      stays byte-identical); an unresolved identity keeps the delivered
      cross-identity fold, which the gate path then refuses anyway.
      emptyHandoverGate is now derived from the one pure empty-window fold
      (conditionStatuses(evaluateHandoverGate(foldEvidenceWindow(empty)))) and
      serializes byte-identically to the literal it replaces (verdict,
      conditions, countedDeliveries, cleanDispatches in that order).
      Verification: pnpm typecheck green; repos-handover-gate 9/9,
      repos-list-contract 7/7, projects-list-contract 11/11,
      projects-flat-alias 6/6, engine-first-cross-surface 2/2; a scratch proof
      (not committed) seeded foreign authoritative handover records before and
      after the row's own and confirmed the row stays reversible false /
      shell, while the row's own authoritative record flips it true."
    type: "info"
    date: "2026-11-18"
  - text: "REM-4 complete (F-9, F-10, F-11). Commit 5ab62f80. One declared
      work-item-ref grammar (the delivered QUEUE_REF_PATTERN) is shared by the
      merge command's validation and the composition's resolution, so a
      digit-bearing prefix (ABC2-12) validates and resolves instead of being
      refused merge.transaction-aborted; the branch-name convergence lookup
      reads the first path segment that is a ref. The two as-casts are gone:
      merge-transaction.ts narrows the row's domain kind through one guard and
      the bulk-ledger fixture proves its payload is a StateJsonValue instead of
      asserting it. reposListDataOf's gate projection is optional with the
      delivered empty-gate default, so the library change stays additive and no
      changeset body change is needed; the payload contract is untouched.
      Verification: pnpm typecheck green; merge-production-composition 8/8
      (including the digit-prefix cell), merge-classification-conformance 7/7,
      changesets-group OK (one fixed group of five). Disclosure: the biome
      reflow of the REM-2 conformance case landed in this commit."
    type: "info"
    date: "2026-11-18"
  - text: "REM-3 complete (F-4). Commit c4ff6d05. The truncated family is no
