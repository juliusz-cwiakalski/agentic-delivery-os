    type: "info"
    date: "2026-11-18"
  - text: "Plan phase 5 complete (production merge composition on real reads and
      declared sources, with error-table-derived classification). Commit
      d89b2912. The composition performs real tracker, check-run, and
      request-detail reads through the delivered adapters and credential seam;
      configuration comes from the resolved document's `merge` branch (the
      document's own classified failure is forwarded, absent keeps the delivered
      defaults), branch from the checkout's git facts, the base reference from
      the declared integration base, and the owner principal from the owner
      component of the checkout's normalized identity (resolved through the
      delivered policy, no new key). `MERGE_COMPOSITION_EMITTABLE_CODES` is
      exported and total over the refusal branches; `MergeFailure.domainKind`
      admits the already-declared `config` kind and both `readFailure` and
      `stateFailure` derive kind and exit from the resolved row, so a missing
      credential is `config.credential.missing` at exit 1 and no legitimate
      failure reaches `fallback.internal`. Verification: `pnpm typecheck` green;
      merge-production-composition 6/6, merge-classification-conformance 6/6,
      the four delivered merge controls green, error-table + content-inventory
      green — 186/186 across the declared gate set. Deviations: (a) the
      composition's provider read faults are mapped onto declared identities
      (401/403 -> `provider.auth.rejected`, other payload/transport faults ->
      `provider.outage`, 404/absent request -> `merge.transaction-aborted`), as
      OQ-TP-6 requires, so the adapter's undeclared `provider.payload.invalid` /
      `provider.not-found` never becomes an emitted pair; (b) the emittable set
      spans the declared kinds it can emit (config, provider, merge) because the
      state-read branch is the declared `merge.state-unverified` row, and a
      `state.*` member would name a code the composition never emits; (c)
      `packages/cli/src/edge.ts` widened
      `MergeCommandComposition.ownerPrincipal` to admit `undefined` so the
      lazily resolved principal typechecks."
    type: "info"
    date: "2026-11-18"
  - text: "Plan phase 4 complete (repos list read-time gate evaluation bound to each
      row's own repository identity). Commit 16531a5d. The flat row carries the
      five delivered fields plus `reversible` then `handoverGate`; the
      evaluation rides a repos-only row pass over the store the row pass already
      opened (one bounded attempts + one divergences read), folds the declared
      `production` evidence scope, excludes foreign-repository records, resolves
      the row's identity read-only and non-persisting (persisted binding, else
      the checkout's normalized remote), fails the whole read as
      `repos.state-unavailable` at exit 2 with no row for an unreadable ledger
      or an unresolvable identity, and reports `unverifiable` + `truncation` on
      a truncated read. `projects.v1` and `projects list --flat` are unchanged.
      Verification: `pnpm typecheck` green; repos-handover-gate 9/9 (incl. the
      5,005-record truncation contract, 25-row floor, determinism, freshness),
      repos-list-contract 7/7, projects-flat-alias 6/6, the delivered projects
      controls green, content-inventory green — 64/64 across the declared gate
      set. Deviation: OQ-TP-5 measured the delivered append path at ~106 ms per
      record, so seeding 5,005 records took ~9 minutes; the truncation fixture
      now frames its records with the delivered `buildRecord`/`serializeRecord`
      and writes the ledger once (~1 s), while the reader still verifies
      framing, sequence continuity, and every checksum."
    type: "info"
    date: "2026-11-18"
  - text: "Plan phase 3 complete (handover conditions, the declared
      evidence-read-free revert noop, and per-repository reversibility). Commit
      f551ac06. All four evidence-reading outcomes (recorded flip, idempotent
      flip noop, clean refusal, recorded revert) carry the four ordered
      `conditions` and `reversible`; the recorded revert now carries `verdict`
      so `verdict == unverifiable ⟺ truncation` is expressible there; the
      idempotent revert noop answers before any gate evidence read with
      `reversible: false` and no `conditions`/`verdict`/`truncation`, while a
      corrupt handover ledger still refuses `dispatch.state-unverified` at exit
      2 with no data. Reversibility is one derivation (`reversibilityOf`) shared
      with the authority document's `reversalAvailable`. Verification: `pnpm
      typecheck` green; dispatch-handover-conditions 13/13,
      dispatch-additive-stability 15/15, the four delivered handover controls
      green, golden dispatch-text green, content-inventory green — 62/62 across
      the declared gate set. Deviations: `packages/cli/src/edge.ts` now forwards
      the composition's declared `gate.max` into the handover/revert use cases
      (a wiring omission, no new flag or key) so the declared truncated-handover
      cell is reachable; the content-inventory executable allowance gained
      `reversibilityOf`."
    type: "info"
    date: "2026-11-18"
