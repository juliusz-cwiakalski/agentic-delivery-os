  - text: "Ticket comment (owner-authored, 2026-11-15) scopes an engine merge
      primitive defect on this ticket: production merge composition stubs
      readWorkItem/readCheckRuns/readRequestDetail to credentialRefusal, and
      classifyThrown collapses config.credential.missing into fallback.internal,
      so merge <ref> --dry-run is unusable for every ref. Interpreted as
      in-scope requirement for M2-S16 (regular delivery through the engine
      cannot operate without the lifecycle merge path); recorded as a PM
      decision and surfaced for owner confirmation at PR review."
