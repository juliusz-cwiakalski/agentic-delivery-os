notes:
  - text: "Review iteration 1: FAIL (code-review/review-iter-1.yaml; 2 high, 3
      medium, 7 low, 4 info). High F-1: AC-F7-11/NFR-12/TDR D9 require a state.*
      member in MERGE_COMPOSITION_EMITTABLE_CODES but the composition emits no
      state.* code (the state-read branch is merge.state-unverified). High F-2:
      the constant is not exhaustive over the refusal branches - the new
      merge.readConfig wrapper can emit config.value.invalid and
      config.file.malformed, absent from the constant and untested. Medium F-3:
      AC-F6-10 says the base reference comes from git facts but the composition
      uses the CLOSEOUT_INTEGRATION_BASE constant. Medium F-4: TC-ENGINE-095's
      truncated family is a no-op spread, so the cross-surface truncation cell
      is never exercised. Medium F-5/F-6: 11 files outside declared plan scope
      plus edge.ts landing in phase 3. Low/info F-7..F-16: test-plan section 10
      attestations unfilled and stale pins, merge ref regex narrower than the
      command grammar, type casts, reposListDataOf breaking signature,
      reversible fold not row-bound, emptyHandoverGate second derivation, fleet
      read cost, template commit subjects. PM decisions: amend AC-F7-11 to the
      three emitted domains (config, provider, merge) with non-vacuity plus the
      declared merge.state-unverified state branch, and amend AC-F6-10 to the
      declared integration base closeout uses. Remediation delegated to coder
      with a doc-syncer re-run after code changes."
    type: "retro"
    date: "2026-11-18"
  - text: "Plan phase 7 complete (cross-surface coherence, shell non-change, no-flip
      discipline, hermeticity, the recorded lifecycle-phase-7 reconciliation
      handoff, and the release). Commit a7aa5d9b (deliverables) and a6d50ca8
      (the delivery-boundary phase completion, which also carries the two JSON
      formatter fixes). Added the cross-surface matrix (six families, three
      surfaces, identical statuses/verdicts/counters), the no-flip writer scan
      and append audit, the hermeticity scan with a live no-network control, the
      new stdout-identity shell parity suite across the four entry points and
      two authority states, and the lockstep five-package minor changeset. The
      two `doc/quality/test-specs/` pages are untouched and staged for lifecycle
      phase 7: the HANDOFF is RECORDED here (owner
      `system_spec_update`/`@doc-syncer`, the two paths, satisfaction at DoD-7)
      and is not an exit condition of this phase. Deviations: the registry row
      for the new guide (`scripts/checks/forbidden-literals.registry.json`), the
      port inventory fixture rows, and the memoized per-checkout
      repository-facts reader (keeping the delivered one-call structural pin)
