      `test-deliver-ticket.sh` fails one pre-existing, environment-dependent
      case (TC-DT-SF-02, a readonly `EXIT_FAILURE` collision) on `main-tools` as
      well, with the suite byte-unmodified. Verification at the boundary:
      engine-first-cross-surface 2/2, engine-first-no-flip 3/3,
      engine-first-hermetic 3/3, dispatch-imports + dispatch-merge-boundary +
      content-inventory green (27/27 in that batch); shell suites:
      dispatch-bash-fallback 9/9, deliver-ticket 135/136 (the one pre-existing
      environment failure above), engine-first-shell-parity 2/2;
      doc-distribution no drift (96 docs); changesets-group OK (one fixed group
      of five); `./scripts/lint-commit-range.sh --base main-tools` VERDICT PASS
      (20 commits, 0 offending); `TMPDIR=$PWD/tmp/tmpdir pnpm check` EXIT 0 with
      10368 pass / 4 pre-existing skip / 0 fail across 1314 files; `plan
      validate GH-293` verdict=valid; `lint GH-293` conforms; `git diff --check`
