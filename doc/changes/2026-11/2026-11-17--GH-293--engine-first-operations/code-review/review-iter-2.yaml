    message: >-
      The substance of F-12 — the fold now filtered to the row's own repository identity
      (`foldDispatchHandover(ledger.records).filter(entry => repository === undefined ||
      entry.repository === repository)`, resolved once per ready row and reused by the gate block) —
      has no permanent case. `projects-handover.test.ts` exercises the alias, which deliberately keeps
