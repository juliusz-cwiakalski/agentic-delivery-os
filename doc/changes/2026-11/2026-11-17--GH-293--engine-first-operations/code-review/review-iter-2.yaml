    category: spec-compliance
    location: packages/core/src/domain/merge-transaction.ts:923
    message: >-
      AC-F6-10 in spec v1.5 still says that when `merge <ref> --dry-run --json` runs "the composition
      performs real tracker work-item, check-run, and request-detail reads" and that the base the dry
      run used is "reported as the base it used through the resolved `merge` configuration the dry run
      consumes and the base-containment evaluation it reads". The delivered dry run performs exactly
      the head read, one work-item read and one check-run page (`runDryRun`, lines 934-940);
      `readRequestDetail` (line 443) and `readBaseContainment` (lines 383, 401, 451) are never called
      on that path, and the behaviour case states it plainly ("the request-detail read belongs to the
      landing path", `tests/behaviour/merge-production-composition.test.ts:136`). No case asserts the
      declared base either, while test-plan v1.4 — authored by this remediation — says TC-ENGINE-050
      gains that assertion "through the base-containment query the dry run issues"
      (`chg-GH-293-test-plan.md:1651`, `:1731`), and DEC-19's decision column repeats the same clause.
      The substantive rule (declared base, one source of truth, no second git-fact derivation,
      branch from git facts) does hold; the criterion's dry-run observables do not.
    suggestion: >-
      Amend the AC-F6-10 / DEC-19 dry-run clause to the delivered shape — the composition supplies
      the real request-detail and base-containment reads to the landing path, and the dry run's base
      is the declared integration base carried in the resolved `merge` configuration it consumes (the
      payload carries no base field) — and then correct or delete the TC-ENGINE-050 base-assertion
      claim in the test plan. Alternatively make the dry run issue the request-detail read and one
      containment evaluation against the declared base and assert both; the amendment alone needs no
      code change.
