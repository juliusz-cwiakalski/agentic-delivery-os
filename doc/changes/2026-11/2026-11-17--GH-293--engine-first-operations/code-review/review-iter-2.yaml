  - id: F-20
    severity: info
    confidence: high
    category: design
    location: packages/cli/src/production.ts:294
    message: >-
      `MERGE_COMPOSITION_CONFIGURATION_CODES` is `as const satisfies readonly ConfigErrorCode[]`, so
      it pins "no code outside the taxonomy" but not "every reachable code is listed": a new
      `ConfigErrorCode` made reachable from the acquisition or resolver would compile and leave the
      tuple silently short, and the conformance case only checks tuple→declaration, never
      declaration→reachable. `configFailure` (`packages/cli/src/commands/merge.ts:68`) also hard-codes
      `kind: "config"` for the forwarded codes instead of deriving the row kind the way the F-7
      constructors do (safe today, because every `config.*` row is `config`).
    suggestion: >-
      No change required for this change. If the configuration taxonomy is expected to grow, type the
      tuple as `Exclude<ConfigErrorCode, "config.environment.unmapped" | "config.warning.strict">` so
      an addition becomes a compile error here, and derive the kind from the resolved row in
      `configFailure`.
    suppressed: false
