summary: >-
  The delivered surfaces are well built and well tested: the summary accrual and four-condition
  projection, the handover outcome table with the single revert-noop exemption, the read-time
  per-row gate bound to the row's own identity at the declared `production` scope, and the restored
  merge composition all behave as specified, `projects.v1` / `projects list --flat` stay
  byte-identical, and the delivered pinned suites are extended by appending only. Two acceptance
  criteria are nevertheless claimed complete without their stated evidence: `AC-F7-11`/`NFR-12`
  require `MERGE_COMPOSITION_EMITTABLE_CODES` to carry at least one `state.*` member (it carries
  none, and the conformance test asserts the opposite while the reconciled test spec claims the
  missing member), and the same criterion requires the enumeration to be exhaustive over the
  composition's refusal branches while the composition's own configuration-read branch can emit
  `config.value.invalid` / `config.file.malformed`, neither of which is a member. `AC-F6-10` says the
  base reference comes from the checkout's git facts; the composition uses the `CLOSEOUT_INTEGRATION_BASE`
  constant, and the reconciled feature page silently documents the softer rule. Three test/plan
  evidence gaps and one plan scope deviation round out the review. Independently re-run: the change
  suites (`dispatch-clean-accrual`, `dispatch-conditions-projection`, `dispatch-handover-conditions`,
  `dispatch-additive-stability`, `repos-handover-gate`, `repos-list-contract`, `projects-flat-alias`,
  `engine-first-cross-surface`, `engine-first-no-flip`, `engine-first-hermetic`,
  `engine-first-doc-reconciliation`, `merge-production-composition`,
  `merge-classification-conformance`, the structure/boundary controls, the doc-distribution guard and
  the shell parity suite) all pass; `TMPDIR=$PWD/tmp/tmpdir pnpm check` exits 0 (10368 pass / 4 skip /
  0 fail across 1314 files); `scripts/lint-commit-range.sh --base main-tools` reports
  `VERDICT: PASS` (24 commits, 0 offending); `plan validate GH-293` is `valid`; and
  `verify change GH-293` reports the expected `verify.ledger.incomplete` for the phases still ahead.
  A first `pnpm check` attempt failed in `privacy-authoring` because a concurrently running suite
  transiently packed `packages/opencode/*.tgz`; the clean sequential run is green and no source file
  was modified by the review.
