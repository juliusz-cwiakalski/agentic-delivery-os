  - id: F-12
    severity: low
    confidence: medium
    category: correctness
    location: packages/cli/src/production.ts:2825
    message: >-
      `readProjectHandover` folds every handover record in the project store and then takes the
      latest by `recordedAt` across repositories, so the row's `reversible` (and the delivered
      `handoverState`) is not bound to the row's repository identity the way the new `handoverGate`
      is. A store that accumulates two identities (a rename or remote change does not re-key history)
      could report another repository's authority. This is a pre-existing pattern for `handoverState`
      that `reversible` now inherits, and stores are normally one-repository, hence medium confidence.
    suggestion: >-
      Filter the fold to the row's resolved identity before reading `reversible`/`handoverState`, or
      document why a project store can only ever hold one repository identity.
    suppressed: false
