findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:286
    message: >-
      AC-F7-11 / NFR-12 / DM-6 / TDR-0031 D9 require the emittable-code enumeration to carry at
      least one `config.*`, `provider.*`, `state.*`, and `merge.*` member "so it cannot pass
      vacuously". `MERGE_COMPOSITION_EMITTABLE_CODES` has no `state.*` member (the state-read branch
      emits `merge.state-unverified`, a `merge.*` code), the conformance test asserts exactly
      `["config","merge","provider"]` and loops over only those three prefixes, and the reconciled
      `doc/quality/test-specs/test-spec-merge-verify-deploy.md:34` tells readers the constant spans a
      `state.*` member. The acceptance criterion is therefore unmet as written, and documentation,
      test oracle, and specification now disagree.
    suggestion: >-
      Resolve the internal contradiction before the PR — the AC's four-family clause conflicts with
      its own totality clause because no `state.*` code is emitted. Preferred: amend AC-F7-11,
      NFR-12, TDR-0031 D9, and the reconciled test-spec row to the three domains the composition
      actually emits (`config`, `provider`, `merge`), with the owner recording the narrowing; only
      then keep the conformance assertion as delivered. Do not add a `state.*` member unless the
      state-read branch is deliberately re-pointed at a declared `state.*` row, which would move an
      error identity and violate the same AC.
    suppressed: false
  - id: F-2
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:1658
    message: >-
      AC-F7-11 requires `MERGE_COMPOSITION_EMITTABLE_CODES` to be "exhaustive by construction over
      the composition's refusal branches: every branch that can refuse contributes its code". The new
      `merge.readConfig` wrapper forwards the composition's own configuration failures (at least
      `config.value.invalid` from `resolveMergeGateSet`/freshness in `packages/cli/src/edge.ts:1422`
      and `edge.ts:1438`, and the config-document codes from `acquireProjectConfiguration` /
      `resolveConfig`), and the base `mergeRuntimeBase.readConfig` can also refuse with
      `config.value.invalid`. None of those codes is a member of the constant. The conformance test's
      "every refusal site" case scans only the `mergeReadCodeOf … mergeRuntimeBase` block, whose
      literal returns cannot see forwarded codes, so the completeness claim is asserted but never
      checked; the new branch is also untested.
    suggestion: >-
      Either extend `MERGE_COMPOSITION_EMITTABLE_CODES` with every code the config-read branch can
      forward and add a conformance case that exercises that branch (unreadable/invalid config
      document and an invalid `merge.gates` / `gate-freshness`), or narrow AC-F7-11's exhaustiveness
      claim to the read-fault branches the constant covers and state the config-read branch's codes
      separately. Widen the "every refusal site" scan so a forwarded `code` value from a refusal
      branch must also be a member.
    suppressed: false
