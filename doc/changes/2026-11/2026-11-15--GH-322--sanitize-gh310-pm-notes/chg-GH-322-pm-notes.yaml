  - text: "RETRO: the ticket's mandated commit subject was impossible to satisfy and
      nobody checked it against the commit primitive until the delivery phase,
      costing an extra artifact cycle. The DoR gate had even read the subject as
      'matches the ticket byte-for-byte' without checking whether the primitive
      could produce it. Improvement: when a ticket pins a commit subject,
      validate it against the primitive with `commit --dry-run` during
      delivery_planning, and forbid foreign tracker references in pinned
      subjects."
    type: retro
    date: "2026-11-15"
  - text: "DoR iteration-2 remediation, second pass (delivery attempt 1): the plan
