decisions:
  - text: "Substitute the absolute gate temp root with the repository-relative
      convention `TMPDIR=$PWD/tmp/tmpdir` in the recorded GH-310 quality-gate
      evidence line, leaving every recorded verdict, count, and hash untouched.
      Rationale: the privacy-literals invariant is the binding authority and the
      value being recorded is a command line, not a measurement; the
      substitution is literal-only and changes no outcome."
    date: "2026-11-15"
  - text: "Accept the commit subject the `commit` primitive generates instead of the
      ticket's literal `fix(GH-322): sanitize absolute user path in GH-310
      pm-notes`. MEASURED constraint: the primitive validates every message
      against its change ref and rejects any other tracker reference
      (`packages/core/src/domain/commit-message.ts`, invented-tracker rule), and
      it offers no message override (`commit [<ref>] [--phase] [--dry-run]`
      only). A standalone template subject is `update <first staged path>`,
      which embeds the GH-310 path and is refused; the phase-scoped template
      subject is `feat(GH-322): <plan phase summary>`, refused only because the
      summary began with a capital (commitlint subject-case). The achievable
      form keeps the ticket's intent — one conventional commit, scope GH-322 —
      while DoD-4 states the subject the primitive actually produces.
      Reversible; no rule, config, or prompt change."
    date: "2026-11-15"
