      sanitize the recorded absolute gate temp root` (59 chars) validates and
      that staging includes the GH-310 pm-notes."
    type: info
    date: "2026-11-15"
  - text: "RETRO: the commit primitive stages EVERY tracked pending file, so the
      uncommitted GH-310 product edit hijacked the template subject of the next
      phase commit (`update <first staged path>` picks the GH-310 path, which
      the invented-tracker rule refuses). Measured during the artifact
      re-completion cycle. Handling: the product edit is reverted before the
      artifact phases re-complete and re-applied inside the delivery phase, so
      the sanitization lands exactly once, in the delivery commit, with the
      derived subject. Improvement candidate for tooling: a phase commit whose
      staging set is dominated by an out-of-scope tracked file should either
      fall back to the declared plan summary or refuse with a scope-drift error
      instead of deriving a subject from a foreign change folder."
    type: retro
    date: "2026-11-15"
  - text: "RETRO: the spec writer's non-goals were written before the in-scope edit
      was pinned, so a blanket 'no other change artifact' clause contradicted
      the single intended change, and the DoD section was dropped while
      compressing a feature template to a one-line fix. Cost: one extra gate
      iteration (~10 min). Improvement: when compressing a spec template, never
      drop the DoD section, and scope-limit every 'out of scope' clause against
      the named in-scope edit rather than against the change class."
    type: retro
    date: "2026-11-15"
