      summary began with a capital (commitlint subject-case). The achievable
      form keeps the ticket's intent — one conventional commit, scope GH-322 —
      while DoD-4 states the subject the primitive actually produces.
      Reversible; no rule, config, or prompt change."
    date: "2026-11-15"
