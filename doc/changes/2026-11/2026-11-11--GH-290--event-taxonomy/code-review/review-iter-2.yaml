summary: >-
  Re-review after remediation iteration 1. The blocking B-1 defect is fixed at the
  correct layer — the began candidate reserves two budget slots and the paired
  completed charges zero inside that reservation, so a pair consumes two slots for
  two frames and an unfittable pair is skipped whole before any commit; reproduced
  independently at cap 2, at 64 with 62 pre-consumed, at 64 with 63 pre-consumed
  (watermark held, both emitted next tick), and over a 40-pair burst (64 then 16,
  never a dropped completed). M-1..M-5, L-1..L-6 and I-1 are all closed against the
  shipped code with real, non-tautological proofs (live surface + live projector
  drift suite, bidirectional frame comparator, exact per-kind payload-key suite over
  the real projector, AST kind-group scan, live connect/listen/probe counters,
  same-connection overflow cell, 256-char evidenceRef proof, reorder revert). Spec
  v1.6's reworded "single source / cannot drift" claims are accurate and neither
  AC-F1-3 nor AC-NFR-3 is weakened. Three new non-blocking findings remain: N-1
  (medium — the new module-local 256-char evidenceRefs cap is undeclared and the
  spec still says every payload is bounded by delivered-contract caps and "no
  payload is cut"), N-2 (low — the test plan is still v1.3 while the plan and
  pm-notes claim test plan v1.4 registers TC-EVT-085..092), and N-3 (info — minor
  "all thirteen declared kinds" wording overclaim). All gates green: 173 GH-290
  tests, 40 gate suites, 30 delivered control/watch suites, tsc exit 0, plan
  validate exit 0.
