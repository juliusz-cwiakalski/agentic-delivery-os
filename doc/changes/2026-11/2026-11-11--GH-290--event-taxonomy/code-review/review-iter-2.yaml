findings:
  - id: F-13
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/event-projection.ts:46,390-392
    message: >-
      The L-6 fix adds a module-local EVIDENCE_REF_MAX_CHARS = 256 and truncates
      each dispatch.attempt evidenceRefs entry with bounded() (value.slice). That
      cap is the only thing making the frame bound provable for evidenceRefs, yet
      DispatchEvidenceReference is a bare string with no declared maximum, so spec
      §5.1 F-3 ("bounded … by caps the delivered contracts already enforce … no
      payload is cut"), DEC-O and AC-NFR-4 no longer match the code: an evidence
      reference over 256 characters is silently shortened, and the
      events-frame-bound test now proves that cut. Practical impact is low — every
      shipped producer emits short refs (attempt:<id>, daemon:lane, window:<ts>,
      handover:<ts>, harness:spawn-failed) — but the bound proof is currently
      false for that field.
    suggestion: >-
      Declare the cap where the bound proof lives: add to §5.1 F-3/DEC-O that the
      projection bounds each evidenceRefs entry to 256 characters as a defensive,
      non-contract cap, and reword AC-NFR-4's "no payload is cut" accordingly; or
      promote the bound into the DispatchEvidenceReference contract as a declared
      maximum so the proof is true as written.
    suppressed: false
    published_url: null
    published_at: null
