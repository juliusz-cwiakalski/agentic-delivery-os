summary: >-
  First local review of GH-290 (event taxonomy v1) against spec v1.4, test plan
  v1.3, the 8-phase plan and TDR-0025. The declaration, generated reference
  surface, control-plane widening, unknown-topic refusal, additive degraded-frame
  stamps, mount, error rows, changeset and additivity are implemented and well
  tested; 158 event tests and 228 changed-gate tests pass and every delivered
  control/watch/heartbeat suite is green. The change fails on one reproduced
  correctness defect: the projection's per-topic per-tick budget treats the
  `began`/`completed` pair as three units, so at used=62 the `began` commits the
  watermark and the `completed` is permanently dropped (violates AC-NFR-3/NFR-3
  and AC-F3-5). The load-bearing "one authored source / a second copy cannot
  drift" claim is also false for the emission projection, which imports only the
  version constant and hand-codes every kind/payload; the single-source scan
  cannot see it, the drift tests feed fixture-built frames, and a shipped Current
  page states "cannot drift apart". A new system spec page and a doc/00-index.md
  row were added although spec §16 and the plan say no new page exists and the
  index needs no change, and they are undeclared/undisclosed. Narrower defects:
  same-tick dependency deltas computed against tick-start, AC-F2-4's stale
  envelope shape, the `token` wording contradiction, and several weak tests.
