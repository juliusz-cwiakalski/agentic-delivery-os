findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/core/src/domain/event-projection.ts:594-610
    message: >-
      The began/completed pair is not atomic. The began candidate has groupSize 2
      (line 449) but the paired completed candidate is processed with the default
      groupSize 1, so one first-completion consumes 3 budget slots for 2 frames.
      With used=62 and maxPerTopic=64 the began fits and commits the watermark
      (advancing past the transition index), then completed fails 64+1>64 and is
      skipped without commit, so it is never reconsidered and is lost. This
      violates AC-NFR-3/NFR-3 ("no event is dropped") and AC-F3-5 ("began then
      completed"). Reproduced with createEventProjector({maxPerTopicPerTick:2})
      over one change with two first-completions: each tick emits began only and
      every completed is dropped.
    suggestion: >-
      Treat the pair as one unit: give the completed candidate groupSize 0 (or
      compute began+completed together and advance the budget by 2), and skip the
      whole pair without commit when it cannot fit. Add boundary tests at
      maxPerTopicPerTick 2 and at 64 with 62 pre-consumed, asserting both frames
      or neither and that the watermark never advances past an unemitted
      transition.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/event-projection.ts:12-22
    message: >-
      The emission projection imports only TAXONOMY_VERSION and hand-codes every
      kind name, lane/ref rule and payload, so the declaration is not the single
      source for the frames. The guards do not close the gap:
      event-taxonomy-single-source.test.ts:97-126 flags only flat arrays of >=3
      kind names (event-projection.ts carries 11 kind names in object literals and
      is not flagged), drift-mutants.ts builds frames from the declaration so
      compareFrames(TAXONOMY, scriptedFrames(TAXONOMY)) is a tautology and only
      rejects undeclared keys, and events-envelope-conformance.test.ts:129-130
      checks the emitted payload is a subset of declared fields, so a dropped
      declared field is undetected. DM-1/spec §1 promise one source for the
      frames and per-topic comparison of emitted frames against the declaration.
    suggestion: >-
      Either drive the projection's kind/payload mapping from the declaration, or
      add an exact emitted-payload-key test per kind against CONTRACT_PAYLOAD_FIELDS
      for all 13 kinds (not a subset), strengthen the single-source scan to catch
      object/array copies, and make the drift suite feed the real surface and
      projection rather than scripted fixtures.
    suppressed: false
    published_url: null
    published_at: null
