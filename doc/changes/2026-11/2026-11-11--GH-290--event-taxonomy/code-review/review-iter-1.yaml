  - id: F-6
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/event-projection.ts:229-260
    message: >-
      Same-tick dependency deltas are computed against the previous tick's edge
      set, not the previous record in the view: candidates are built before any
      commit(), and commit() updates lastEdges only during emission. Two
      queue.dependency records for one ref in one view therefore produce a second
      event whose added/removed are relative to tick-start; reproduced with
      ["GH-1"] then ["GH-2"], the second removed is [] where the delta is
      ["GH-1"]. A same-tick idempotent rewrite can also emit a duplicate.
    suggestion: >-
      Compute the delta sequentially as candidates are built (updating and, on
      suppression/pending, restoring lastEdges), or defer payload construction to
      emission. Add a two-records-one-view test.
    suppressed: false
    published_url: null
    published_at: null
