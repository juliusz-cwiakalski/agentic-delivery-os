  # `blockers.state`), the derived `began`, the `emitted: false` remove, the
  # per-(topic, lane) process-scoped sequence allocator, the per-topic per-tick
  # cap with the DM-9 watermark (per `(topic, lane, source family)`) that keeps
  # the remainder pending, and the bounded payloads that need no truncation
  # marker (DEC-O). This phase is pure: it consumes one store view as an
  # argument and returns projected events plus counters; it does not read and it
  # does not yet publish.
