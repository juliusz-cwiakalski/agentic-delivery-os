  # Phase 9 — Code-review iteration-1 remediation (review-iter-1: FAIL).
  #
  # Goal: close every code/test finding of `code-review/review-iter-1.{md,yaml}`
  # without widening the contract. No wire type, frame kind, protocol version,
  # record kind, schema version, dependency, port method, error identity, or
  # command membership changes; the three `events` error rows stay three (127
  # documented rows), and the publish tick still performs one `readRecords()` per
  # publish tick. The doc/spec/decision/changeset findings stay in Phase 8.
  #
  # B-1 (high, blocking; event-projection.ts). The `began` candidate reserves
  # two slots (`groupSize: 2`) but the paired `completed` is emitted as its own
  # unit, so one first-completion charges 3 slots for 2 frames: at `used = 62`
  # the `began` commits the watermark and the `completed` fails `64 + 1 > 64`,
  # is skipped without commit, and is never re-considered — a permanent drop.
  # The pair becomes ONE budget unit: the `completed` candidate carries
  # `groupSize: 0` inside the `began` reservation, and a pair that cannot fit is
  # skipped whole before any `commit()` runs, so no watermark advance covers an
  # unemitted transition. Two boundary cells prove it: `maxPerTopicPerTick: 2`
  # over two first-completions (both frames or neither, never `began` alone) and
  # the default 64 with 62 pre-consumed (the pair fits exactly, and the next
  # pair is deferred with the watermark held at its last emitted position).
  #
  # M-2 (medium; event-projection.ts). `lastEdges` is read while candidates are
  # built and written only at emission, so two `queue.dependency` records for one
  # lane in one view both diff against tick-start; the second `removed` is `[]`
  # where it must name the edge the first record removed. The delta is computed
  # against the previous record in the same view: a working copy of `lastEdges`
  # is advanced inside the entering-order loop as each dependency candidate is
  # built and restored when the candidate is suppressed or left pending, so the
  # committed set always matches the last emitted or pending record. The
  # two-records-in-one-view cell (`["GH-1"]` then `["GH-2"]`) asserts the second
  # delta is `added: ["GH-2"]`, `removed: ["GH-1"]`, one `dependency-edge` per
  # observed change, and no duplicate on an idempotent re-write.
  #
  # M-1 (medium; code/test half). `event-projection.ts` imports only
  # `TAXONOMY_VERSION` and hand-codes 11 kind names and every payload, and the
  # guards cannot see it: the single-source scan flags only flat arrays of three
  # or more declared names, `compareFrames`/`scriptedFrames` compare the
  # declaration with itself and reject only undeclared payload keys, and the
  # envelope suite asserts the emitted payload is a SUBSET of the declared
  # fields. Driving the projection from the declaration is NOT feasible inside
  # this phase: the declaration carries names, ordering, overflow, and payload
  # field lists, but no source-field map (which record family feeds which kind
  # and payload), so a data-driven projector needs a new declarative source map —
  # a contract/data-model change the tier's escalation triggers reserve. The
  # proof therefore is the exact-key test: every emitted payload's key set is
  # asserted EXACTLY (both directions) against `CONTRACT_PAYLOAD_FIELDS` for all
  # 13 kinds through the real projector, the comparator rejects a MISSING
  # declared field as well as an undeclared one, and the single-source scan walks
  # object literals and nested arrays in `packages/*/src` for the declared kind
  # tokens. The accurate relationship (surface generated; projection
  # hand-authored and contract-tested) is stated in Phase 8's page fix (M-3).
  #
  # L-2 (low; test half). The spec owner aligns NFR-10/AC-NFR-5 in spec v1.4 to
  # permit the delivered attempt correlation `token` while still excluding
  # credentials and secrets; this phase tests the delivered rule: the
  # `dispatch.attempt` `refused`/`completed` payloads carry `token`, no
  # credential- or secret-named field or credential-shaped value appears on any
  # frame, and the privacy canary set does not trip on the attempt token.
  #
  # L-3 (low). `events describe` with no topic currently reports
  # `"describe" is not an events verb`, and `events list status` silently ignores
  # the extra positional. Both refusals use the existing `events.verb-unknown`
  # identity with a message naming what is missing (`describe` requires a topic;
  # `list` takes no topic), so no error row is added and the exit projection
  # stays `{0,1,2}`.
  #
  # L-4/L-5/L-6 (low). The tick-cost harness counts client connects, server
  # listens, and executor probe calls, and the counted publish pass asserts zero
  # on all three (AC-NFR-2's "no socket, no process probe"); the overflow parity
  # suite adds a same-connection cell with two subscriptions of one topic, where
  # only the overflowing subscription is stamped and dropped and the sibling on
  # that connection keeps receiving; and the projection bounds each
  # `evidenceRefs` entry with a non-exported per-ref cap (no contract widening),
  # which the frame-size proof asserts over a worst-case ref.
  #
  # Weak tests. `event-taxonomy-additive.test.ts:26-34` stops inspecting
  # `scriptedFrames(TAXONOMY)` and asserts the real projector's emitted keys;
  # the drift suite feeds the live surface and the live projector (the mutants
  # stay as oracle controls); the conformance guard pins the M2 page's per-kind
  # table (kind names per topic), not just the `0/0/4/3/3/3` counts string.
  #
  # I-1 (info). The five unrelated alphabetical reorderings revert to their base
  # order with only this change's rows kept: `domain/index.ts`,
