# GH-290 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly.
#
# SOURCES (single source of truth):
#   - Spec:     ./chg-GH-290-spec.md (v1.2, 38 ACs — AC-F1-1..5, AC-F2-1..5,
#               AC-F3-1..7, AC-F4-1..3, AC-F5-1..3, AC-F6-1..2, AC-F7-1..4,
#               AC-F8-1..4, AC-NFR-1..5; F-1..F-8; DM-1..DM-9 (nine data-model
#               elements); EVT-1..EVT-5; NFR-1..NFR-10; DEC-A..DEC-O (fifteen
#               decisions); §5.1 topic/kind/payload tables; §6 flows 1-7;
#               §7.1 in-scope list (which names the one-shared-read
#               restructure); §8.5 compatibility, guard list, and the
#               count-assertion edit set; §9 NFR-2 and its counting seam; §16
#               documentation impact; §18 rollout ordering; Appendix D exit
#               matrix; Appendix E kind-to-record source map; Appendix F frame
#               matrix). Spec v1.1 fixed `lane` as a non-empty string on every
#               event topic, `ref` nullable only on `blockers.state`, snapshot
#               topics with `kinds: []`, one shared whole-store read per publish
#               tick (DEC-N), `occurredAt` from the source record, a
#               process-scoped `sequence` (DEC-I), no truncation marker (DEC-O),
#               the acceptance-to-refusal unknown-topic change (DEC-L), DM-9 as
#               the emission watermark, and the amended-decision-record
#               obligation.
#               Spec v1.2 (DoR iteration 2) counts NFR-2 per PUBLISH tick — one
#               `publishState`/`stateChanges()` invocation, with the loop's
#               heartbeat fold excluded from the count and a negative control
#               proving the exclusion — states DM-9 as one watermark entry per
#               `(topic, lane, source family)` position, including the
#               cumulative `phase.state` artifact's transition ordinal, and pins
#               the M2 page's scan boundary at the `EXTENSION PATH (S17 — not
#               v1)` heading. None of the three changes the phase set.
#   - Tests:    ./chg-GH-290-test-plan.md (v1.2, 45 TCs TC-EVT-001..084;
#               38/38 AC coverage; §5.2 scenarios; §6 determinism rules; §7
#               file/command inventory with one role per mount-touched suite;
#               §6.3 deliberate non-goals). TC ids are unchanged from v1.0
#               through v1.2 (45); several cases were rewritten (022, 026, 051,
#               002, 027, 081, 082, 083, 075), and v1.2 reclassifies
#               `tests/behaviour/entrypoint-help-coverage.test.ts`'s inline
#               prompt-required name list as a mount edit (18 -> 19) and scopes
#               the page token scan to the v1 sections.
#               §7 assigns the M2 reference page to Phase 5 and
#               the TC-EVT-016 single-source half to the contract phase; this
#               plan keeps the mount at Phase 5 and owns that half in Phase 6.
#   - Decision: doc/decisions/TDR-0025-public-event-taxonomy-v1-subscribe-surface.md
#               (Proposed; untracked at plan time; AMENDED 2026-11-11 at DoR
#               iteration 1 — DC-1..DC-5 carry the amended text and the record
#               carries an Amendments table: DC-2's non-null `lane` and
#               per-topic `ref`, the source-record `occurredAt`, the
#               process-scoped `sequence`, the acceptance-to-refusal wording,
#               the additivity restatement, the reference-record key set, and
#               the mount-phase page reconciliation). The record is edited in
#               place by its owner through `@decision-advisor`, status stays
#               `Proposed` pending owner acceptance at the GH-290 pull-request
#               review, and Phase 8 stages the AMENDED file. Neither this plan
#               nor the spec describes the record as "consumed unchanged".
#   - Schema:   doc/spec/features/feature-plan-schema.md (scope keys
#               files/packages/folders, doneArtifacts slots
#               mergeRequestUrl/pipelineId/deployedEnvironment/trackerTransition,
#               leases, weightClass, interactions, tier; no tasks key, no
#               progress log).
#   - Precedent: ./2026-11-11--GH-286--daemon-command-mounting/chg-GH-286-plan.yaml
#               (phase ceremony, inventory/guard scope, changeset shape).
#
# DECISION-RECORD STAGING CONTRACT (why TDR-0025 is declared in Phase 8):
#   `doc/decisions/TDR-0025-public-event-taxonomy-v1-subscribe-surface.md` is
#   UNTRACKED at plan time (`?? doc/decisions/TDR-0025-...`). The commit
#   primitive stages tracked-pending work plus untracked files only inside the
#   declared phase scope, so the record is declared in Phase 8's `scope.files`
#   and lands in the final phase-mode commit together with the doc
#   reconciliation and the changeset. The file staged is the amended record
#   (DC-1..DC-5 plus the Amendments table), not the pre-amendment draft. Its
#   `doc/decisions/00-index.md` row is already committed, matches the record's
#   Proposed status, and is not edited, so the index is not declared.
#
# SHARED-READ PHASE (DEC-N, spec §7.1, §9, §18; plan Phase 7):
#   Spec §9 states the bound over the delivered port: exactly one whole-store
#   `readRecords()` per publish tick — one `publishState`/`stateChanges()`
#   invocation, with the loop's heartbeat fold explicitly outside the count —
#   serves all six topics and all subscribers;
#   `stateChanges()` today calls `readQueueEntries` and `readDaemonLanes`, each
#   of which reads the whole store on its own, and `readChangeTransitions` is
#   keyed by `changeRef`, so a per-change loop would be one whole-store read per
#   change. The plan therefore declares the restructure as its own phase: the
#   tick takes one `readRecords()` view, folds it once for the snapshot
#   projection (`queue`, `lanes`) and once for the event projection (the four
#   event topics), no fold performs its own read, and the tick-cost proof counts
#   the calls through an injected `StateStorePort`. The phase is placed after
#   the subscribe carriage because `TC-EVT-081` steps 2-3 vary the subscriber
#   count and the number of subscribed event topics, which only exists once
#   Phase 4 accepts event-topic subscriptions; it is placed before the
#   documentation phase so the resident-daemon page states the delivered cost
#   model rather than a planned one.
#
# INVOCATION-SHAPE RULE (binding on every phase gate):
#   `PROMPT_REQUIRED_COMMANDS` holds the delivered 18 commands until Phase 5's
#   membership commit. `selectPromptRequiredProgram` returns exactly that set
#   and drops extras, and `runEntrypoint` calls it on every invocation, so no
#   `events` invocation routed through `runEntrypoint` can be selected before
#   Phase 5. The phases are partitioned by invocation shape:
#     - Phases 1-4 prove DECLARATION, SURFACE, PROJECTION, and SUBSCRIBE
#       behaviour only: the composed program's `events` handler is invoked
#       directly, `runCli` is called with that same composed program, or the
#       delivered `createControlServer` + `createControlSession` are composed
#       over a real store. No Phase 1-4 gate asserts selection,
#       `PROMPT_REQUIRED_COMMANDS` membership, or `fallback.internal`.
#     - Phase 5 proves SELECTION and CONTAINMENT through the prompt-required
#       membership and the help/coverage/parity guards.
#     - Phases 6 and 7 drive the real server/session directly and do not depend
#       on entrypoint selection.
#   "Registered" (the runtime is composed and the command is on the program)
#   is true from Phase 2; "selectable"/"selected" is true only from Phase 5.
#
# PHASE ORDERING AND TESTABILITY:
#   Each phase is one commit on `feat/GH-290/event-taxonomy` whose declared
#   narrow gate is green at the boundary. Phase 1 lands the one authored
#   declaration and the additive contract surface every later phase consumes.
#   Phase 2 generates the reference surface from that declaration. Phase 3 adds
#   the pure event projection and its ordering, cap, watermark, and bound rules,
#   with the structural bound suite; the projection's emission behaviour is
#   proven end to end in Phase 4, because every case that observes a frame
#   drives the real server/session. Phase 4 wires projection and envelope into
#   the delivered session/server and the daemon composition without touching the
#   two snapshot topics' frame bytes, and feeds the four event topics from the
#   existing ledgers (the tick may still read once per fold in this phase;
#   nothing asserts the read count here). Phase 5 mounts the family as one unit,
#   with the reference page and every guard row, and lands the reconciled page
#   before any page-token scan reads it. Phase 6 pins the taxonomy per topic on
#   both the surface and the emitted frames and proves the single source by
#   mutation. Phase 7 restructures the publish tick to the one-shared-read cost
#   model and proves it by counting. Phase 8 reconciles the pages, stages the
#   amended binding decision record, and adds the lockstep minor changeset.
#
# EARLY DOC EDIT (Phase 1): `doc/spec/features/feature-result-contract.md`
#   carries the machine-readable error table that `scripts/checks/error-table-sync.ts`
#   compares bidirectionally against the code. Adding the three `events` rows in
#   Phase 1 without the documented rows would leave Phase 1's gate red, so the
#   three rows (and `tests/structure/error-table.test.ts`'s 124/123 counts,
#   which become 127/126) land with the code. Phase 8 owns the remaining prose,
#   summary, and link reconciliation of that page and of every other page spec
#   §16 names.
#
# SCOPE CONVENTION: concrete files are exact paths; folders are declared by
#   every phase that writes a new file inside them (the commit primitive stages
#   only the declared phase scope); packages globs are not used because every
#   path in this change is known. A file edited in two phases is declared in
#   both phases; `plan diff` reports the first covering phase.
#
# MOUNT EDIT SET (spec §8.5; RF-1, RF-12): the mount turns the prompt-required
#   set from 18 to 19, so every literal count of that set is in the edit set, not
#   only the command-name lists:
#     - tests/structure/daemon-production-composition.test.ts asserts the
#       prompt-required length three times — `:71` (full set) 18 -> 19,
#       `:138` (composition with every optional input absent) 18 -> 19, and
#       `:121` (the daemon-omission mutant) 17 -> 18. The suite is declared in
#       Phase 5 and its post-mount values are named in the Phase-5 gate.
#     - tests/behaviour/entrypoint-help-coverage.test.ts hard-codes the delivered
#       18 prompt-required names in an inline array (`:150-171`) and compares it
#       to the coverage fixture's `commands`, so the same commit adds `events`
#       (18 -> 19) and its `syntheticPromptProgram` key equality (`:174-176`)
#       follows. This is a mount row, not a semantic assertion change: the
#       assertion (the fixture equals the prompt-required set) is unchanged and
#       only the literal membership list follows the mount.
#     - tests/behaviour/entrypoint-composition.test.ts gains `events` in its
#       `EXPECTED` hand list (Phase 5).
#     - tests/checks/reference-page-parity.test.ts resolves each coverage
#       command to a page with its own page-root map, so it gains the `events`
#       row (the M2 page) in the same commit as
#       `scripts/checks/help-guide-coverage.ts`; without it the Phase-5 parity
#       gate looks for `doc/planning/oss-tooling/milestones/m1/commands/events.md`
#       and fails.
#     - tests/fixtures/help-guide/coverage.json gains the `commands` and
#       `referencePages` rows; tests/structure/error-table.test.ts keeps its
#       row counts; tests/structure/inventory.json and
#       tests/fixtures/ports/v1-contract-inventory.json gain the new modules and
#       exports.
#
# DECLARED CONTROLS, NOT EDITS (A-16): three delivered suites run in Phase 5's
#   gate and are NOT edited, so none of them is declared in a phase scope and no
#   diff is staged for them; the test plan's §7 role table says "No edit" for
#   each:
#     - tests/behaviour/entrypoint-help.test.ts — its family loop (`:29-47`)
#       asserts containment of 15 names (it omits `dispatch`, `coordinator`, and
#       `projects` by the same precedent) and asserts no count, so the mount
#       leaves every assertion true.
#     - tests/checks/help-guide-coverage-mutants.test.ts — its three mutants
#       rewrite M1 pages and its temp root copies both `m1/commands` and
#       `m2/commands` (`:19-25`), so the new M2 page and the fixture row change
#       none of its outcomes; the `events` mount mutants live in the new
#       `tests/checks/event-mount-guards.test.ts`.
#     - tests/checks/doc-conformance.test.ts — its page hand list already omits
#       `dispatch`, `coordinator`, and `projects`, and `events`' `--help`/
#       `--version` coverage is carried by the help-coverage guard.
#   Scope and gate therefore agree: a control that needs no edit is run, not
#   declared, exactly as `tests/checks/help-guide-coverage.test.ts` (delivered,
#   no edit) is already run without being declared.
#
# TC -> PHASE MAP (53 ids = the 45 test-plan-v1.3 ids plus TC-EVT-085..092,
#   which test plan v1.4 registers; every id is owned by exactly one phase — the
#   phase which first makes its complete suite set green. A suite proven in an
#   earlier phase is named in that phase's gate and its `Suites left green`
#   line, without a second TC row. Phase 9 moves the five TCs whose OWN
#   assertions the remediation rewrites (002 page half, 003, 005, 006, 014) and
#   owns the eight new ids; every earlier phase keeps the cases it historically
#   proved, and the total is 45 + 8 = 53):
#   Phase 1 declaration (6): TC-EVT-001, TC-EVT-070, TC-EVT-071, TC-EVT-072,
#            TC-EVT-073, TC-EVT-074
#   Phase 2 surface (8): TC-EVT-004, TC-EVT-010, TC-EVT-011, TC-EVT-012,
#            TC-EVT-013, TC-EVT-015, TC-EVT-051, TC-EVT-080
#   Phase 3 projection (0): none (the projection module and its structural bound
#            suite land here; every behaviour case that exercises the projection
#            drives the real server/session and is owned by Phase 4 or 6)
#   Phase 4 subscribe (9): TC-EVT-023, TC-EVT-030, TC-EVT-040, TC-EVT-041,
#            TC-EVT-042, TC-EVT-050, TC-EVT-075, TC-EVT-082, TC-EVT-083
#   Phase 5 mount (5): TC-EVT-060, TC-EVT-061, TC-EVT-062, TC-EVT-063,
#            TC-EVT-064
#   Phase 6 contract (11): TC-EVT-016, TC-EVT-020, TC-EVT-021, TC-EVT-022,
#            TC-EVT-024, TC-EVT-025, TC-EVT-026, TC-EVT-027, TC-EVT-031,
#            TC-EVT-032, TC-EVT-084
#   Phase 7 shared read (1): TC-EVT-081
#   Phase 8 docs/release (0): none (docs, amended decision, changeset; proven by
#            the doc, coverage, parity, distribution, and changeset guards)
#   Phase 9 review remediation (13): TC-EVT-002 (page kind table), TC-EVT-003
#            (drift suite over the live surface/projection), TC-EVT-005
#            (additive suite over the real projection), TC-EVT-006
#            (object-literal kind scan), TC-EVT-014 (describe/list usage
#            refusals), TC-EVT-085 (pair atomic at cap 2), TC-EVT-086 (pair at
#            64/62 with the watermark held), TC-EVT-087 (same-tick dependency
#            delta), TC-EVT-088 (exact per-kind payload keys, 13 kinds),
#            TC-EVT-089 (attempt token vs credential tokens), TC-EVT-090
#            (same-connection overflow isolation), TC-EVT-091 (connect/probe
#            counters), TC-EVT-092 (per-evidenceRef length bound)
#   Suite halves proven before their owner: TC-EVT-002's declaration suite and
#   TC-EVT-003's/005's/006's earlier cells run in Phase 1 (and Phase 2 for 016),
#   TC-EVT-004's declaration-integrity half runs in the Phase-1 gate
#   (`event-taxonomy-integrity`) while its surface half is owned by Phase 2,
#   TC-EVT-016's surface suite in Phase 2, TC-EVT-014's error rows in Phase 2,
#   and TC-EVT-031's/032's behaviour suites in Phase 4; each TC is owned once,
#   in the phase that makes its whole set green after remediation.
#
# REVIEW REMEDIATION (Phase 9; review-iter-1 status FAIL):
#   The code review reproduced one correctness/data-loss defect plus contract-
#   honesty and weak-test gaps. Phase 9 is the single remediation phase and is
#   last. Its findings split by artifact:
#     - CODE/TEST half (Phase 9, this plan): B-1 (atomic `began`/`completed`
#       pair), M-2 (same-tick dependency delta), M-1's code/test half (exact
#       per-kind payload keys, a bidirectional comparator, and an object-literal
#       kind scan), L-2's test half (the delivered attempt token permitted,
#       credential/secret tokens excluded), L-3 (`events describe` without a
#       topic; `events list <extra>`), L-4 (connect/probe counters), L-5
#       (same-connection multi-subscription overflow), L-6 (per-evidenceRef
#       length bound), the weak-test replacements (002 page half, 003, 005, 006),
#       and I-1 (revert the unrelated reorderings).
#     - DOC/SPEC half (Phase 8, unchanged ownership): M-3
#       (`feature-event-taxonomy.md` "cannot drift apart" sentence), M-4
#       (`doc/planning/oss-tooling/milestones/m2/contracts.md` kind/envelope/
#       client-version statements), M-5 (the new page and its `doc/00-index.md`
#       row are declared through Phase 8's `doc/spec/features` folder and the
#       added `doc/00-index.md` file row), L-1 (AC-F2-4's envelope shape), and
#       L-2's spec wording. No doc, decision-record, or changeset path is moved
#       into Phase 9.
#   Phase 9 changes no wire type, frame kind, protocol version, record kind,
#   schema version, dependency, or error identity: the three events error rows
#   stay three, and the tick still performs one `readRecords()` per publish tick.
#
# DECLARATION-ONLY PHASE-1 SCANS: the Phase-1 suites scan the declaration and
#   the code's closed vocabularies only. They must NOT token-scan
#   `doc/planning/oss-tooling/milestones/m2/commands/events.md`, because that
#   page still carries the pre-contract example counts and S17 prose until
#   Phase 5 reconciles it. The page token scan is part of the Phase-6
#   conformance and ordering suites, which run after Phase 5.
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`), matching the
#   GH-286/GH-289 precedent. No new package dependency, no migration, no
#   schema version change.

schemaVersion: delivery.plan.v1
workItemRef: GH-290
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  escalationTriggers:
    - "The contract needs a new wire type, frame kind, protocol version, codec rule, subscription-buffer semantic, or a field outside `data` to satisfy an AC"
    - "A new state record kind, payload schema, key prefix, migration, backfill, seed, or STATE_SCHEMA_VERSION change would be required (including a recorded phase begin), or the DM-9 watermark would have to persist in the store"
    - "A second authored copy of the topic or kind sets is needed beside `packages/core/src/contracts/taxonomy.ts` (surface rendering or projection consuming a hand-written list)"
    - "An S17 shape (`stop`, `parked`, `resumed`, `park-edge`) or any kind outside the contract section's 4/3/3/3 enumeration is added to v1"
    - "Any `queue` or `lanes` frame byte changes, or an envelope field is added to a snapshot topic"
    - "A prompt-required, help, coverage, parity, inventory, or export guard can only be made green by relaxing an expectation instead of adding the declared `events` row (including any literal count of the prompt-required set)"
    - "A delivered suite needs a semantic assertion change outside the mount rows this plan declares — the inline prompt-required name list in `tests/behaviour/entrypoint-help-coverage.test.ts` (`:150-171`), `tests/behaviour/entrypoint-composition.test.ts`'s `EXPECTED` list, and `tests/checks/reference-page-parity.test.ts`'s page-root map — the three prompt-required count assertions in `tests/structure/daemon-production-composition.test.ts`, and the inventory registrations; a membership literal or page-root row that only follows the mount is a mount row and does not fire this trigger"
    - "The publish tick would need more than one whole-store `readRecords()` per publish tick, a per-topic or per-subscriber read, an unbounded in-memory event queue, a socket connect, a process probe, or a sleep on the publish path"
    - "A durable sequence, ledger seeding, or per-client version negotiation is required to satisfy an AC"
    - "The amended TDR-0025 cannot be staged by the final phase, or its amended text (DC-2 `lane`/`ref`/`occurredAt`/`sequence`, DC-4 acceptance-to-refusal) contradicts the spec's DEC-B/DEC-D/DEC-I/DEC-L"
    - "The evidence, spec, or test plan contradicts a pinned contract in this header and the contradiction cannot be resolved inside the phase scope"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — The one authored declaration and the additive contract surface.
  #
  # Goal: make the taxonomy a compiled, runtime-neutral declaration and widen the
  # delivered contracts additively: six `CONTROL_TOPICS`, the eight-field
  # event-envelope member in `ControlEventData`, and the new `events` error kind
  # with exactly three rows. No behaviour changes in this phase: no frame
  # carries the envelope yet, no topic outside `queue`/`lanes` is served, and no
  # command exists.
  #
  # Dependency reasoning: every later phase consumes the declaration, the widened
  # union, or the error identities, so they land first. The declaration-level
  # suites (topic/kind/payload/ordering/overflow pins, integrity matrix, drift
  # mutants, additivity baselines) are provable here because they import the
  # declaration and pure comparators only. The result-contract page's
  # machine-readable table and `tests/structure/error-table.test.ts`'s row
  # counts (124/123 -> 127/126) are edited here because the sync guard is
  # bidirectional.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/structure/event-{taxonomy-declaration,taxonomy-integrity,taxonomy-drift,taxonomy-additive,control-vocabulary,state-additivity,additivity-inventory}.test.ts
  #   bun test tests/behaviour/events-decode-additive.test.ts
  #   bun test tests/structure/{error-table,content-inventory,port-contract-inventory}.test.ts
  #   bun run scripts/checks/error-table-sync.ts
  #   bun run scripts/checks/exports-parity.ts
  #   bun run scripts/checks/ambient-globals.ts
  #
  # Suites left green: event-taxonomy-declaration, event-taxonomy-integrity,
  #   event-taxonomy-drift, event-taxonomy-additive, event-control-vocabulary,
  #   event-state-additivity, event-additivity-inventory,
  #   events-decode-additive, error-table, content-inventory,
  #   port-contract-inventory, error-table-sync.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Event taxonomy v1 declaration, control vocabulary, error rows, and inventory registration"
    kind: delivery
    summary: "feat(contracts): declare event taxonomy v1, widen the control topic union, and add the events error rows"
    scope:
      files:
        - doc/spec/features/feature-result-contract.md
        - packages/core/src/contracts/control.ts
        - packages/core/src/contracts/error-table.ts
        - packages/core/src/contracts/index.ts
        - packages/core/src/contracts/taxonomy.ts
        - tests/behaviour/events-decode-additive.test.ts
        - tests/fixtures/ports/v1-contract-inventory.json
        - tests/structure/content-inventory.test.ts
        - tests/structure/error-table.test.ts
        - tests/structure/event-additivity-inventory.test.ts
        - tests/structure/event-control-vocabulary.test.ts
        - tests/structure/event-state-additivity.test.ts
        - tests/structure/event-taxonomy-additive.test.ts
        - tests/structure/event-taxonomy-declaration.test.ts
        - tests/structure/event-taxonomy-drift.test.ts
        - tests/structure/event-taxonomy-integrity.test.ts
        - tests/structure/inventory.json
      folders:
        - tests/fixtures/events
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/taxonomy.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/contracts/control.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/contracts/error-table.ts
        role: producer

  # ---------------------------------------------------------------------------
  # Phase 2 — The reference surface generated from the declaration.
  #
  # Goal: mount `events list [--json]` and `events describe <topic> [--json]` as
  # pure data rendering over the declaration: the machine envelope, the
  # six-topic table, the eight-field `envelope[]`, the per-topic record with
  # `shape`/`parent?`/`frame`/`lane`/`kinds[]` (records with `name`, `emitted`,
  # `payloadFields`) / `payloadFields[]` / `ordering` / `overflow`, the three
  # error identities, and the `{0,1,2}` projection. The command is registered by
  # the edge when the runtime is supplied and by the production composer
  # unconditionally, but `events` is not prompt-required yet, so no Phase-2 gate
  # asserts selection.
  #
  # Dependency reasoning: the surface is a pure function of the declaration and
  # the envelope/error contracts from Phase 1, so it can land before the publish
  # path exists. Its golden and purity cases need no store, no daemon, and no
  # transport, so they are green at this boundary. The new command/output modules
  # are registered in the same commit or the inventory and export-allowance
  # guards fail in the opposite direction.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/events-{list,describe,errors,purity}.test.ts tests/checks/events-hermetic.test.ts
  #   bun test tests/golden/events-reference-page.test.ts
  #   bun test tests/structure/{cli-edge-seam,content-inventory}.test.ts
  #   bun run scripts/checks/exports-parity.ts
  #   bun run scripts/checks/workspace-entrypoints.ts
  #   bun run scripts/checks/ambient-globals.ts
  #
  # Suites left green: events-list, events-describe, events-errors,
  #   events-purity, events-hermetic, events-reference-page, cli-edge-seam,
  #   content-inventory, exports-parity, workspace-entrypoints,
  #   ambient-globals.
  # ---------------------------------------------------------------------------
  - id: 2
