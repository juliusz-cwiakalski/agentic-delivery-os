  # ---------------------------------------------------------------------------
  # Phase 7 — The shared tick read (spec DEC-N, §7.1, §9, §18).
  #
  # Goal: restructure the delivered publish tick from one whole-store read per
  # fold to exactly one whole-store `readRecords()` per tick. The composition
  # takes the view once and hands the same view to the snapshot projection
  # (`queue`, `lanes`) and to the event projection (the four event topics); the
  # folds that today read on their own (`readQueueEntries`, `readDaemonLanes`,
  # and the `changeRef`-keyed phase-transition read) accept the shared view
  # instead of performing their own read; the snapshot dedupe and the event
  # watermark stay per topic; and the tick exposes the counting seam the test
  # asserts — an injected `StateStorePort` whose `readRecords()` is wrapped by a
  # counter, so one tick counts exactly one call whatever the subscriber count or
  # the number of subscribed event topics. No port shape, wire type, record
  # kind, schema version, or dependency changes: the port keeps its single
  # whole-store read and the restructure moves the read, it does not widen it.
  #
  # Dependency reasoning: the projection (Phase 3) already consumes a view as an
  # argument, and the subscribe carriage (Phase 4) is what makes TC-EVT-081's
  # 1-vs-N subscriber and 2-vs-4 subscribed-topic matrices observable, so this
  # phase follows both. It precedes the documentation phase so the
  # resident-daemon page records the delivered read model and its cost bound. The
  # tick is the highest-traffic seam in the change, so this phase's gate re-runs
  # the snapshot-preservation, overflow-parity, sequence, burst, and end-to-end
  # subscribe suites that the tick serves, not only the cost suite.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/events-tick-cost.test.ts
  #   bun test tests/behaviour/events-{snapshot-preserved,overflow-parity,sequence-per-lane,burst}.test.ts
  #   bun test tests/behaviour/events-subscribe-queue-graph.test.ts
  #   bun test tests/behaviour/control-{session,connection,conformance}.test.ts tests/behaviour/daemon-watch-state-changes.test.ts
  #   bun run scripts/checks/ambient-globals.ts
  #   bun run scripts/checks/workspace-entrypoints.ts
  #
  # Suites left green: events-tick-cost (one `readRecords()` per tick),
  #   events-snapshot-preserved, events-overflow-parity,
  #   events-sequence-per-lane, events-burst,
  #   events-subscribe-queue-graph, control-session, control-connection,
  #   control-conformance, daemon-watch-state-changes, ambient-globals,
  #   workspace-entrypoints.
  # ---------------------------------------------------------------------------
  - id: 7
    title: "Shared tick read: one whole-store read per tick folded for the snapshot and event projections, with the tick-cost proof"
    kind: delivery
    summary: "refactor(daemon): take one store read per publish tick and share it across both projections"
    scope:
