  # ---------------------------------------------------------------------------
  # Phase 6 — Per-topic contract suites and end-to-end subscribe cases.
  #
  # Goal: pin the published taxonomy as a comparison a test runs, on both sides.
  # The four per-topic subscribe suites observe `entry`/`dependency-edge`,
  # `started`/`refused`/`completed`, `began`/`completed`/`reopened`, and
  # `published`/`updated`/`cleared` through the real server and session over a
  # real store, with the bounded real-unix-socket case. The conformance suite
  # compares the reference surface, the daemon-emitted frames, and the M2 page
  # against the one declaration; the single-source suite mutates the declaration
  # once and asserts both consumers move, and owns the union half of
  # TC-EVT-016; the privacy suites scan emitted frames, pages, and payloads for
  # content that must never leave the process. The envelope suite asserts
  # `lane` is a non-empty string on every event-topic frame, `ref` is nullable
  # only on `blockers.state` (a CLI-published question records `null`), and no
  # frame carries `cursor` or a truncation marker.
  #
  # Dependency reasoning: every case here spans the declaration (Phase 1), the
  # surface (Phase 2), the projection (Phase 3), the subscribe path (Phase 4),
  # and the mounted page (Phase 5), so it is provable only after all five. This
  # phase adds tests and fixtures only and changes no production behaviour.
  #
  # Gate:
