  # ---------------------------------------------------------------------------
  # Phase 7 — The shared tick read (spec DEC-N, §7.1, §9, §18).
  #
  # Goal: restructure the delivered publish tick from one whole-store read per
  # fold to exactly one whole-store `readRecords()` per publish tick — one
  # `publishState`/`stateChanges()` invocation, the interval NFR-2 counts
  # (spec v1.2); the loop's heartbeat fold is outside that interval and is
  # neither moved nor bounded here. The composition takes the view once and hands
  # the same view to the snapshot projection (`queue`, `lanes`) and to the event
  # projection (the four event topics); the
  # folds that today read on their own (`readQueueEntries`, `readDaemonLanes`,
  # and the `changeRef`-keyed phase-transition read) accept the shared view
  # instead of performing their own read; the snapshot dedupe and the event
  # watermark stay per topic; and the publish path exposes the counting seam the
  # test asserts — an injected `StateStorePort` whose `readRecords()` is wrapped
  # by a counter, so one publish tick counts exactly one call whatever the
  # subscriber count or the number of subscribed event topics. No port shape,
  # wire type, record kind, schema version, or dependency changes: the port keeps
  # its single whole-store read and the restructure moves the read, it does not
  # widen it.
  #
  # Phase-transition read — two legal shapes, both in scope (A-22): the
  # view-taking read can be expressed inside `state/registry.ts` (the fold takes
  # the view and derives the phase transitions from it, deleting the
  # `store.read({ requiredKeys: [] })` probe at `:292`), or as a view-taking read
  # on the boundary in `state/artifact-boundary.ts` (`:108-112`, whose `read()`
  # currently calls `store.readRecords()` at `:111`). Both files are declared in
  # this phase's `scope.files` so either implementation is staged; the cheaper
  # shape edits only `registry.ts`. The bound is identical either way and is what
  # the phase must preserve: one whole-store `readRecords()` per publish tick, no
  # per-change probe, no per-topic or per-subscriber read, and no new port
  # method.
  #
  # Dependency reasoning: the projection (Phase 3) already consumes a view as an
  # argument, and the subscribe carriage (Phase 4) is what makes TC-EVT-081's
  # 1-vs-N subscriber and 2-vs-4 subscribed-topic matrices observable, so this
  # phase follows both. The projection already reached the CLI through the
  # package root in Phase 4 (`packages/core/src/index.ts`), so this phase adds no
  # export row and no entrypoint allowance; its gate re-runs
  # `workspace-entrypoints` to prove the CLI still imports only the declared
  # subpaths. It precedes the documentation phase so the
  # resident-daemon page records the delivered read model and its cost bound. The
  # publish path is the highest-traffic seam in the change, so this phase's gate
  # re-runs the snapshot-preservation, overflow-parity, sequence, burst, and
  # end-to-end subscribe suites that the publish path serves, not only the cost
  # suite.
