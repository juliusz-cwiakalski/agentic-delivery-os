      Gate: `pnpm typecheck` green; the eleven-suite Phase-1 batch reports 162
      pass / 0 fail; `error-table-sync` entries=127 documented=127 OK;
      exports-parity 5/5 publishables OK; ambient-globals 178 files clean.
      Deviations, all disclosed by the primitive as scope drift or resolved
