      registers `events` when its runtime is supplied and the production
      composer supplies it unconditionally (`events: {}`), so the family is
      composed but not yet prompt-required (that is Phase 5). Goldens for the
      table and both representative pages are committed under
      tests/fixtures/events/goldens with a generation header; TC-EVT-010..016 and
      TC-EVT-080 are implemented. Gate: `pnpm typecheck` green; the seven-suite
      Phase-2 batch reports 64 pass / 0 fail (p95 for all four forms 0.02-0.09
      ms); content-inventory green; exports-parity, workspace-entrypoints, and
      ambient-globals all OK. Deviations: the delivered `cli-edge-seam` suite's
      optional-human-text declarer list gains `events.ts` (a membership row that
      follows the new renderer, no assertion relaxed) and, as recorded for
      Phase 1, commit subjects come from the primitive's deterministic template
      over the union scope, so they name the top staged path (the same F-9
      template-subject limitation GH-286 recorded); staging is otherwise exactly
      this phase's declared scope.
    type: "info"
    date: "2026-11-12"
  - text: >-
      Plan phase 3 complete (commit deb3155f): the pure event projection
      `packages/core/src/domain/event-projection.ts` derives the four event
      topics from one `StateRecord` view it is handed — per-kind source mapping,
      the eight-field envelope with `occurredAt` from the source record, the
      non-empty `lane` and per-topic `ref` rules, the delta-only
      `dependency-edge`, the derived `began` emitted together with the first
      `completed` (two frames, ascending sequence), the per-`(topic, lane)`
      process-scoped sequence allocator, the 64-per-topic per-tick cap with the
      remainder pending, and the per-`(topic, lane, source family)` DM-9
      watermark whose `phase.state` entry is a position inside the change's
      cumulative artifact. No read, write, clock, or I/O: `project(view)` is the
      only input. The module is registered in the file-set inventory and the
      executable allowance, and re-exported from `domain/index.ts`.
      `tests/structure/event-projection-bounds.test.ts` (TC-EVT-082's structural
      half) proves the cap, the pending remainder, the contiguous 1..100
      sequence series, the one-entry-per-pair watermark, and the cumulative
      artifact's single position. Gate: `pnpm typecheck` green; the bounds suite
      reports 7 pass / 0 fail; content-inventory green. Deviations: none in the
      declared scope; TC ids owned by this phase remain zero, as the plan's map
      states, and the behaviour cases stay with Phase 4/6.
    type: "info"
    date: "2026-11-12"
  - text: >-
      Plan phase 4 complete (commit 471000f3): subscribe integration. The
      session gains `publishEvent` (an event-topic frame with no cursor), and
      every degraded frame — the delivered overflow path for all six topics —
      now carries `overflow: "repoll"` from `TAXONOMY_OVERFLOW` and
      `taxonomyVersion` from `TAXONOMY_VERSION`. The server's publish projection
      is shape-aware: snapshot topics keep per-topic cursor dedupe and event
      topics publish observed deltas from one tick's batch before any flush, and
      the subscribe accept tolerates a topic with no snapshot so an event
      subscription gets no synthetic baseline. The daemon composition widens the
      subscribe handler to the six topics, refuses an unknown topic with
      `events.topic-unknown` from the declaration before any store read (the
      delivered acceptance becomes a refusal), and feeds the four event topics
      from the Phase-3 projection over the existing ledgers. TC-EVT-023, 030,
      040, 041, 042, 050, 075, 082 and 083 are implemented, and the TC-EVT-032
      restart suite is authored here for its Phase-6 ownership. Gate: the
      fifteen-suite event batch reports 111 pass / 0 fail; the eight delivered
      control/daemon/queue-watch/lanes-watch suites and the seven
      composition/help/parity suites pass unmodified (68 pass); `pnpm
      typecheck`, ambient-globals (179 files), and workspace-entrypoints are
      green; content-inventory green. Deviations: (1) the delivered server
      flushes a subscription after every tick, so a subscriber that keeps
      reading can never accumulate a buffer; overflow parity is therefore proven
      row-by-row at the delivered session seam (the bound's home, the same seam
      the delivered control-session suite uses) for all six topics, plus one
      end-to-end `queue.graph` burst on the wire — the "second subscriber
      spared" clause holds for the reading subscriber within the same tick and
      for every bystander topic, and with a buffer smaller than a single-tick
      burst every subscriber of that topic overflows, which is the delivered
      semantics. (2) TC-EVT-050's pre-change byte-golden is replaced by exact
      key-order/shape assertions plus the five delivered control suites, because
      no pre-change frame golden was captured before this branch started; no
      assertion is weaker (three exact keys, cursor 0, dedupe, no envelope
      field, the stamped degraded row).
    type: "info"
    date: "2026-11-12"
  - text: >-
