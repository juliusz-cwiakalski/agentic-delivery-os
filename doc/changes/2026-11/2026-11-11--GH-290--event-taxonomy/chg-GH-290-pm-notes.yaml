  - text: >-
      Plan phase 9 complete (commit 351ee285ac25e676cdc39f8fb169309a05daac1d):
      code-review iteration-1 remediation. B-1 is fixed in the projection — the
      `began`/`completed` pair is one budget unit (`began` reserves two slots,
      the paired `completed` charges `groupSize: 0`), so an unfittable pair is
      skipped whole without advancing the watermark; proven at
      `maxPerTopicPerTick: 2` (both-or-neither, one pair per tick), at the 64
      cap with 62 pre-consumed (the pair exactly fills the cap and emits both),
      at 63 pre-consumed (neither frame, watermark held, both emitted on the
      next tick), and over a 40-pair burst (64 frames then 16, never 42). M-2 is
      fixed — dependency deltas diff against the previous record in the same
      view via a per-call staged edge map, committed only by `commit` — proven
      by a two-records-in-one-view cell (`["GH-1"]` then `["GH-2"]` yields
      `removed: ["GH-1"]`). M-1 is proven in both directions: a new exact-key
      suite drives the REAL projector through all 13 declared kinds and compares
