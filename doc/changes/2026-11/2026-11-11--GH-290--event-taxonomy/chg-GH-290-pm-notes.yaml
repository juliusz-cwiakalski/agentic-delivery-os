    type: "info"
    date: "2026-11-12"
  - text: >-
      Plan phase 2 complete (commit 2d0399bb): the generated reference surface.
      `packages/cli/src/commands/events.ts` renders `events list` / `events
      describe <topic>` from the declaration alone (machine record keys exactly
      name/version/shape/frame/lane/kinds/payloadFields/ordering/overflow plus
      the single `parent` on queue.graph; derived first-seen payload union;
      `{0,1,2}` exit projection with `events.verb-unknown` and
      `events.topic-unknown` refusals and the injected-invalid-declaration
