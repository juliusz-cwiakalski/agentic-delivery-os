decisions:
  - text: >-
      Event-taxonomy kind-set authority: the M2 contract section
      `doc/planning/oss-tooling/milestones/m2/contracts.md` §Event taxonomy v1
      enumerates the kinds owned by S13 (queue.graph entry/dependency-edge/
      release/remove; dispatch.attempt started/refused/completed; phase.state
      began/completed/reopened; blockers.state published/updated/cleared). The
      `m2/commands/events.md` example kind counts (6/4) and its mention of
      stop/parked/resumed kinds are illustrative planning text that predates the
      contracts section; the stop/park/resume shapes belong to M2-S17
      (contracts.md §S17 mapping). The change spec pins the contract-section
      kinds and records the S17 shapes as the declared extension path; the
      planning page is reconciled in phase 7.
    date: "2026-11-11"
  - text: >-
      The taxonomy is published as a versioned document (`taxonomyVersion: v1`)
      with a machine-readable reference surface (`events list` / `events
      describe <topic>`), so "the taxonomy document version is pinned by tests"
      is satisfied by per-topic contract tests over that surface and over the
      daemon-emitted events, not by prose alone.
    date: "2026-11-11"
