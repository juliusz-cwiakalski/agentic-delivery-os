decisions:
  - text: "D1 (PM-decided, non-interactive intake; SUPERSEDED by D12 for the
      marker path): the owner hold has two equivalent sources. (a) A marker file
      in the state directory the typed engine resolves; (b) an environment
      variable derived from the brand prefix (`<PREFIX>_OWNER_HOLD`, which is
      `DELIVERY_OS_OWNER_HOLD` for the current default working name). A non-empty
      value is an operator reason. Removing both sources clears the hold with no
      state loss. D12 replaces the marker-path clause and removes the
      marker-path override; the env source remains."
    date: 2026-11-10
  - text: "D2 (PM-decided, non-interactive intake): the typed engine models the hold
      as a global read-only gate over an injected fact, not as a queue park
      cause and not as a state record. This preserves the closed park
      cause/condition pairing, the closed five state record kinds, and the
      closed six queue-ready conditions. Removing the marker resumes every ref
      from preserved queue, lease, and park state."
    date: 2026-11-10
  - text: "D3 (PM-decided, non-interactive intake; amended after spec review):
      include the read-only status/doctor surface from the ticket. Status
      carries an additive optional owner-hold sibling on the existing providers
      section (credential-prerequisite precedent; no tenth section, no new
      status reason). Doctor carries the hold only when the provider check would
      otherwise be ok: it keeps the ok verdict and adds one closed evidence
      reason (owner-hold) and a bounded detail. No fourth verdict, no summary
      count, no condition-catalog entry, and no exit change, because a
      deliberate pause is not a wiring defect and the delivered verdict set
      stays closed at ok/fail/unreachable."
    date: 2026-11-10
  - text: "D3a (PM-decided, spec revision): the first spec draft added a non-failing
      warn verdict plus a warn summary count to doctor. That was rejected as
      disproportionate: it would change the closed verdict vocabulary, the
      failure summary grammar, exit semantics, and exhaustive consumers for an
      optional surface. The spec was revised to the additive ok-plus-reason
      design before test planning."
    date: 2026-11-10
  - text: "D4 (PM-decided, non-interactive intake): ship a dedicated new example
      hook at scripts/hooks/pre-opencode-iteration-owner-hold.sh with
      howLongToSleepDueToOwnerHold() under the DM-1 contract. It is registered
      in install.sh ADOS_HOOK_EXAMPLES, removed by uninstall.sh, and covered by
      its own deterministic shell test. The delivery-modes guide documents
      merging it with peak/quota conditions, since conditions compose by MAX and
      a hold therefore outranks every time-bounded wait."
    date: 2026-11-10
  - text: "D5 (PM-decided): no wrapper behavior changes. deliver-ticket.sh and
      ceo-loop.sh already invoke the configured hook before every spawn/resume;
      ceo-loop.sh is SHA-pinned by provider-surface tests. The hold is delivered
      entirely through the example hook, the typed engine gate, and docs."
    date: 2026-11-10
  - text: "D6 (PM-decided): while the hold is active, claim and dispatch are refused
      and the park auto-recovery mutation is skipped, so a park that reached its
      provider window stays parked. Read-only surfaces may still evaluate and
      display the park, but no recovery record is appended and no lane is
      claimed."
    date: 2026-11-10
  - text: "D7 (PM-decided, test-plan OQ-1): the claim refusal's reason token is
      exactly `owner-hold`; the separate bounded detail names the source and the
      sanitized reason. DM-6's `owner-hold` / `owner-hold: reason` shorthand
      describes the blocking-reason token form, not the claim detail grammar."
    date: 2026-11-10
  - text: "D8 (PM-decided, test-plan OQ-2): the dedicated owner-hold example applies
      to every agent and model. It has no provider/model activation gate, unlike
      the zai example's zai-coding-plan/* gate, because an operator hold is
      model-agnostic."
    date: 2026-11-10
  - text: "D9 (PM-decided, test-plan OQ-3): the hook's bounded reason line names the
      source: `owner-hold (<source>)` followed by `: <reason>` only when a
      reason is present, then `; sleeping <N>s`. The spec sample is corrected to
      match AC-F2-1."
    date: 2026-11-10
  - text: "D10 (PM-decided, test-plan OQ-4): an unset or empty/whitespace
      poll setting (`<PREFIX>_OWNER_HOLD_POLL_SECONDS`, currently
      `DELIVERY_OS_OWNER_HOLD_POLL_SECONDS`) uses the 300-second default
      silently; any
      non-empty invalid value (non-integer, zero, negative, out of range) uses
      300 with exactly one bounded warning."
    date: 2026-11-10
  - text: "D11 (PM-decided, test-plan OQ-5): when the provider check would otherwise
      be ok and the hold is active, the hold segment is appended to the existing
      bounded provider detail (`<existing detail>; owner hold active
      (<source>)[: <reason>]`) rather than replacing the healthy text. The
      existing detail bound remains the outer limit."
    date: 2026-11-10
  - text: "D12 (PM-decided, DoR-1 finding 1): the hold marker lives in the directory
      the production store identity actually uses,
      `<home>/<brand.stateDirectoryName>/owner-hold`. The design does NOT claim
      or use `<PREFIX>_STATE_DIR`, and the shell example does NOT offer a
      marker-path override setting, because neither is honoured by the production
      queue/dispatch/status/doctor store today. Relocating state is out of scope
      for GH-280. The shell example's default is the current product's
      `$HOME/.delivery-os-state/owner-hold`; adopters whose working name differs
      edit the example's two setting names and that default. Correct every
      spec/test-plan/plan claim that says otherwise."
    date: 2026-11-10
  - text: "D13 (PM-decided, DoR-1 finding 2): `queue claim` with no ref must also
      refuse with `queue.precondition.unmet` and reason token `owner-hold`. The
      claim composition gates on the hold before ref selection, so a held claim
      never falls through to `no-eligible-action`. Add a no-ref test case and
      use `queue claim` in the E2E procedure."
    date: 2026-11-10
  - text: "D14 (PM-decided, DoR-1 findings 3-4): the daemon half of the acceptance
      is a conditional guarantee, not an enforced production path. Production
      daemon supervision is already a delivered residual and is not a claim
      source. The spec/test plan/change record must say: any composed
      supervision cycle that derives its next action from the held scheduling
      pass receives no action; the production daemon entry remains the
      resident-daemon spec's existing residual. The daemon test must derive its
      seam from the held schedule (not assert a tautological undefined) and the
      residual is recorded. `daemon-compose.ts` is not added to scope."
    date: 2026-11-10
  - text: "D15 (PM-decided, DoR-1 finding 5): the status member is evidence-level
      `providers.evidence.ownerHold` (the `credentialPrerequisite` precedent),
      not a sibling of `chain`/`entries`/`parks`. Align spec F-5.1/DM-7, the
      test plan's assertions/A-T1, and the plan pins/verification to that one
      location."
    date: 2026-11-10
  - text: "D16 (PM-decided, DoR-1 finding 6): the closed-set guarantee must be
      asserted, not inferred from a fixture edit. Extend
      `queue-scheduling-contract.test.ts` with exact two-way equality for
      `QUEUE_LANE_IDLE_REASONS` and `QUEUE_BLOCKING_REASONS` against
      `closed-sets.json`, update the test plan's mutation row, and name the
      assertion in plan phase 2 verification."
    date: 2026-11-10
  - text: "D17 (PM-decided, DoR-1 finding 7): `queue ready` is unchanged and does
      not report the hold. Narrow NG-12/NFR-14 to the surfaces that do report it
      (queue list/plan/lanes, status, doctor) and state the omission
      explicitly."
    date: 2026-11-10
  - text: "D18 (PM-decided, DoR-1 finding 10): the doctor hold segment must survive
      the detail clamp. When appending would exceed DOCTOR_MAX_DETAIL_CHARS,
      truncate the existing detail to fit and keep the whole hold segment; never
      truncate the hold segment mid-word or drop it. Add a near-bound test
      case."
    date: 2026-11-10
  - text: "D19 (PM-decided, DoR-1 finding 16): a held dispatch/claim is realized as
      a classified user-validation refusal (`queue.precondition.unmet`, exit 1),
      not an internal wait. The guide and AC state that callers wanting deferral
      semantics must treat the `owner-hold` token as wait/do-not-abort."
    date: 2026-11-10
  - text: "D20 (PM-decided, review-1 F-1): doctor hold support is a
      command-runtime/test-harness capability in GH-280, not a production
      composition. `createProductionComposer` does not supply a
      `DoctorComposition`, and the production binary rejects `doctor` as outside
      the composed prompt-required set; wiring doctor is a pre-existing residual
      tracked by the doctor feature, not this change. Correct every GH-280 claim
      (spec F-4.1/F-5/§16, AC-F6 scope, plan phase 4/5, change record E2E,
      changeset, delivery-modes guide, doctor command page) and remove the
      `doctor --json` E2E step. In production, `status` carries the hold in its
      digest and `queue list`, `queue plan`, `lanes`, and `queue watch` report it
      on their own surfaces; doctor reports it whenever a DoctorComposition is
      supplied (test harness and any future production wiring) and is not a
      production composition."
    date: 2026-11-10
  - text: "D21 (PM-decided, review-1 F-2): the commit primitive owns commit
      subjects. Template-fallback subjects are accepted and history is not
      rewritten, per GH-279 D9 and the rule that commits go only through the
      primitive. The plan's phase-summary-as-subject requirement is corrected to
      state that the phase `summary` is a plan description and the primitive
      composes the actual message; the acceptance is recorded in the change
      record."
    date: 2026-11-10
  - text: "D22 (PM-decided, review-1 F-3): strengthen the production-composition
      test rather than accept the source-text/grep claim. Materialize a marker in
      a temp HOME/state directory and drive the production reader closure through
      queue, status, and dispatch behavior; keep doctor at the command-runtime
      layer per D20. Add a mutation control (removing the marker or the wiring
      flips the behavior)."
    date: 2026-11-10
  - text: "D23 (PM-decided, review-1 F-4/F-5): the plan and change record must
      declare the seven doc-sync files and the non-formatting phase-8 changes
      (the lint-driven `owner-hold.ts` regex construction and the
      `error-table.test.ts` expectation). Describe phase 8 as verification plus
      those record/formatting changes, not 'formatting-only'."
    date: 2026-11-10
  - text: "D24 (PM-decided, review-1 F-9/F-10/F-11): fix the shell marker-read
      comment to state the character bound versus the engine's byte bound; make
      the adapter existence check error-aware (ENOENT absent, other errors
