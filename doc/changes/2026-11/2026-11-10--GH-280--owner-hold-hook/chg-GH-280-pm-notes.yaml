    date: 2026-11-10
  - text: "D26 (PM-decided, review-2 F-1): align the shipped example and every
      example artifact to the current default brand. The entrypoint default
      working name is `delivery-os`, so the engine reads
      `DELIVERY_OS_OWNER_HOLD` and
      `<home>/.delivery-os-state/owner-hold`. The shell example uses
      `DELIVERY_OS_OWNER_HOLD`, `DELIVERY_OS_OWNER_HOLD_POLL_SECONDS`, and the
      fixed default `$HOME/.delivery-os-state/owner-hold`. Normative text keeps
