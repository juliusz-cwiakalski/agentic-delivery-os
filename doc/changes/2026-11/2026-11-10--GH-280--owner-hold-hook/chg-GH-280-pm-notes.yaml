      state-directory names for the owner hold are removed from the GH-280
      artifacts."
    date: 2026-11-10
  - text: "D27 (PM-decided, review-2 F-1): the manual E2E must be executable.
      Create the disposable state directory with mode 0700
      (`mkdir -m 700 \"$HOME/.delivery-os-state\"`) because the store rejects a
      non-private directory. Use `status` plus the queue read surfaces and
      `queue claim` with no ref as the production evidence. Dispatch is covered
      by the automated composition test and is omitted from the manual procedure
      (it needs a GitHub credential); if included, it is a conditional step with
      the credential prerequisite named. No `doctor` step."
    date: 2026-11-10
  - text: "D28 (PM-decided, review-2 F-2): remove every remaining
      status-exclusive surface claim. `status` carries the hold in its digest;
      `queue list`/`queue plan`/`lanes`/`queue watch` report it on their own
