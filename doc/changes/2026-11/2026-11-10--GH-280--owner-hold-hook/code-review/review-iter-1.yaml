verdict_basis: >-
  The product behaviour is largely correct and well tested: the owner-hold fact
  resolves with the declared precedence and fail-closed marker semantics, the
  queue/dispatch gate refuses claims and dispatches before selection or the
  fence, recovery is skipped with zero records, status/doctor project the hold
  additively with unchanged inactive goldens, the closed sets move by exactly
  the two declared tokens, and the shell example is a deterministic MAX driver
  with no cap. The review is still FAIL for two independent reasons. First, the
  doctor surface is not composed in production: `delivery-os doctor` is rejected
  by the prompt-required-set guard, so the operator-visible doctor half of G-5/
  AC-F6 is only test-harness-level and the manual E2E's doctor step cannot be
  run; the spec, plan, change record, changeset, and guide all overstate the
  production wiring. Second, plan compliance fails on commit hygiene (all phase
  commits carry template-fallback "update <path>" subjects instead of the
  declared phase summaries) and on the phase-8/doc-sync scope declarations, and
  the production composition test is weaker than claimed (source-text greps,
  pre-resolved reader, no temp-HOME marker, no dispatch/status/doctor behavior).
  The remaining findings are precision/accuracy nits and one narrow fail-closed
  edge; none is a security or data-loss issue. Remediation should wire or
  honestly scope the doctor surface, reword the phase commits, strengthen the
  composition test, and correct the phase-8/doc-sync/artifact wording; then
  re-review iteration 2.
next_step: "CALL_CODER - address F-1 (wire production doctor or correct the spec/plan/record/guide/E2E claims), F-2 (reword every phase commit to its plan summary before the first push), and F-3 (temp-HOME marker + dispatch/status/doctor composition behavior test); apply or explicitly accept F-4..F-11; then re-review (iteration 2) before quality gates."
