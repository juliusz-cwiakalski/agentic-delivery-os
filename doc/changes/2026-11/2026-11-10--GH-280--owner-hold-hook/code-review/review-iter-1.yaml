    severity: high
    confidence: high
    category: spec-compliance
    blocking: true
    location: "packages/cli/src/production.ts:1508-1593 (no DoctorComposition), packages/cli/src/edge.ts:3539-3542"
    message: >-
      `createProductionComposer` never supplies a `DoctorComposition`, and
      `createConfigProgram` registers the `doctor` command only when
      `options.doctor` is defined. The production binary reports
      `command "doctor" is not part of the composed prompt-required set`
      (fallback.internal, exit 2) and the root `--help` omits doctor. The spec
      F-4.1/F-5/§16, plan phase 5 verification, change-record manual-evidence
      step 3, the changeset, and `doc/guides/delivery-modes.md` all say the doctor
      composition resolves the hold and that an operator runs `doctor`. The code
      correctly adds the optional `readOwnerHold` to `DoctorComposition` and
      `createDoctorCommandRuntime`, but no production path supplies it. The doctor
      surface is therefore proven only at the command-runtime/test-harness layer;
      the operator cannot see the hold in doctor, and TC-HOLDE2E-001 step 3 cannot
      be executed as written. This is the blocking finding.
    suggestion: >-
      Either (a) compose `doctor` in `createProductionComposer` (store,
      credentials, transport, repository, clock, github, environmentPrefix,
      readWorkTree, and `readOwnerHold`) and add a production behavior test, or
      (b) correct the spec/plan/change-record/guide to state doctor is a planned
      command exercised at the command-runtime layer, remove the production
      claim, and change the E2E to the harness (or drop its doctor step). If
      doctor remains planned, state that `status` is the only production surface
      that reports the hold.
    suppressed: false
