summary: >-
  The delivered owner-hold fact, queue/dispatch gate, status/doctor projections,
  and shell example are functionally sound: environment/marker precedence, the
  empty/whitespace/absent arms, the fail-closed unreadable/non-regular marker
  matrix, the 160-character sanitizer, the 4096-byte reader bound, no caching,
  no ambient FS/env in core, the no-ref and fenced claim refusals, dispatch and
  park-recovery side-effect freedom, bookkeeping/resume, the lane masking versus
  the full queue-list blocking array, the exact one-token closed-set pins, the
  single non-failing doctor reason and its clamp, the inactive byte-identical
  goldens, and the hook's MAX driver/no cap/poll fallback/reason line are all
  implemented and covered by meaningful tests. The FAIL is driven by the doctor
  half of the claimed production composition: `createProductionComposer` supplies
  no `DoctorComposition`, the production binary rejects `doctor` as "not part of
  the composed prompt-required set", and the change record's manual E2E step 3
  (`doctor --json`) therefore cannot be run as written; the spec/plan/guide and
  change-record claims that doctor resolves the hold in production are inaccurate.
  Plan compliance also fails on commit hygiene (template-fallback subjects
  instead of the plan's phase summaries) and on the phase-8 and doc-sync scope
  declarations, and the production-composition test overclaims coverage (source
  text greps and a pre-resolved reader rather than a temp-HOME marker plus
  dispatch/status/doctor behavior). Verified at review time: `pnpm check` exit 0
  (7127 pass / 4 skip / 0 fail, 879 files), `pnpm typecheck` green, boundaries
  and ambient-globals green, shellcheck 0, doc-distribution 82 in-scope docs
  with no drift, install/uninstall 55/55 and 30/30, and all targeted queue,
  status, doctor, fact/reader, composition, closed-set, golden, and hook suites
  pass.
