    category: documentation
    blocking: false
    location: "scripts/hooks/pre-opencode-iteration-owner-hold.sh:46-55"
    message: >-
      The marker reader comment says "up to the first 4 096 bytes" but
      `read -r -N 4096` bounds by characters; a multibyte marker can be read
      beyond 4 096 bytes (still bounded by 4 096 characters, and the reason is
      truncated to 160). The engine reader is byte-bounded. Harmless, but the
      comment overstates the byte bound.
    suggestion: >-
      Say "up to 4 096 characters (the engine's byte bound is 4 096 bytes)" or
      use a byte-aware read; no behavior change is required.
    suppressed: false
  - id: F-10
    severity: low
    confidence: medium
    category: correctness
    blocking: false
    location: "packages/adapters/src/file/owner-hold-marker.ts:46-55"
    message: >-
      Production `exists: existsSync` returns false both when the path is absent
      and when the parent directory cannot be stat'd (EACCES), so a marker under
      an unreadable store directory resolves `absent` (inactive) rather than
      fail-closed. The ordinary marker-permission case (chmod 000 file) is
      fail-closed because `existsSync` succeeds, `isFile` succeeds, and
      `readText` throws. NFR-10 says 100% of unreadable/stat-failing marker
      outcomes are active; the parent-dir case is a narrow exception.
    suggestion: >-
      Use an error-aware existence check (`lstatSync` with ENOENT -> absent,
      other errors -> unreadable) or document the parent-dir exception; the
      current behavior is fail-open only when the store directory itself is
      unreadable (which usually fails the store reads too).
