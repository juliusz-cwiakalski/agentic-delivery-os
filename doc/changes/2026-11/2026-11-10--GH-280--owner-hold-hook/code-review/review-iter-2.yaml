summary: >-
  The iteration-1 code and test remediation is genuine. The adapter existence
  check is error-aware and fail-closed (ENOENT absent; any other lstat failure
  unreadable) with injected and root-skipped real tests; the new
  production-composition suite builds the real `createProductionComposer` over a
  temp-HOME marker and drives queue list/plan, supplied-ref and no-ref claim,
  dispatch, and status, and it fails when the production marker path is mutated
  in a scratch copy (verified). The closed sets stay exact at 28/34 with only
  `owner-hold` added; every inactive golden is byte-identical; the wrapper SHA
  pin and hook suite are green; doc-conformance is green; `plan validate` is
  valid with 9 phases, 44 ACs, and 59 TCs; and `pnpm check` is exit 0 with 7133
  pass / 4 skip / 0 fail across 880 files. FAIL remains for two artifact
  defects. First, the manual E2E is still not executable as written: the test
  plan and plan hardcode `$HOME/.ados-state` while the production CLI's default
  working name is `delivery-os` (`.delivery-os-state`), and a disposable-HOME
  state directory created with `mkdir -p` is 0775, which the state store rejects
  with `state.permission.denied` before the hold gate; both were reproduced with
  the production binary, and the queue legs work only with the working-name
  override or `.delivery-os-state` plus a 0700 directory. Second, several
  artifacts still claim `status` is the only production operator surface even
  though `queue list`, `queue plan`, `lanes`, and `queue watch` also report the
  hold, and the structure-test header still lists the doctor seam in the
  production composition. The remaining findings are scope and record precision.
