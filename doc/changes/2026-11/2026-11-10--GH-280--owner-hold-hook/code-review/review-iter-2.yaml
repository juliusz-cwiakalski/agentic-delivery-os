verdict_basis: >-
  The iteration-1 fixes that changed code and tests are real: the adapter
  existence check is error-aware and fail-closed with tests, the production
  composition suite drives the real composer over a temp-HOME marker and fails
  under a production-reader mutation, and the closed sets, goldens, wrapper pin,
  hook suite, doc checks, plan validity, and the full gate are green. The change
  still cannot PASS because its manual evidence is not executable as written:
  the test plan/plan name `$HOME/.ados-state` while the production CLI reads
  `.delivery-os-state`, and a disposable-HOME store directory created with
  `mkdir -p` is rejected with `state.permission.denied` before the hold gate
  (both reproduced with the real binary). The claim correction is also
  incomplete: `status` is still described as the only production operator
  surface even though the queue read surfaces report the hold, and the structure
  test header still claims a production doctor seam. Remediation is a bounded
  wording/procedure fix, not a design change; the code does not need to move.
