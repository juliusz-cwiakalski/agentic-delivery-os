# GH-280 delivery plan — owner hold that outranks provider windows: pause lanes,
# not just defer.
#
# SOURCES (single source of truth, read before delivery):
#   - Spec: ./chg-GH-280-spec.md (F-1..F-6, 44 acceptance criteria
#     AC-F1-1..AC-F1-9, AC-F2-1..AC-F2-8, AC-F3-1..AC-F3-4,
#     AC-F4-1..AC-F4-11, AC-F5-1..AC-F5-4, AC-F6-1..AC-F6-4,
#     AC-DOC-1..AC-DOC-4; DM-1..DM-9; NFR-1..NFR-14; DEC-1..DEC-10;
#     RSK-1..RSK-12; §5.1 capability details; §6 flows 1-5; §7 scope;
#     §8.3 data model; §16 affected components; §16.1 documentation impact;
#     §18 ordering and rollback; §22 maintenance and operations impact)
#   - Test plan: ./chg-GH-280-test-plan.md (58 cases: 57 automated plus the
#     operator-run TC-HOLDE2E-001; the HOLDFACT, HOLDHOOK, HOLDREG, HOLDQUEUE,
#     HOLDSTATUS, HOLDDOCTOR, HOLDDOCS, HOLDEDGE, HOLDNEG families; §6
#     environments and fixtures; §7.1 test files and execution; §7.2 new and
#     modified files; §7.3 fixture/golden update plan; §7.4 mutation evidence;
#     §1.2 GAP-T1..GAP-T6)
#   - PM record: ./chg-GH-280-pm-notes.yaml (binding D1-D11, including the
#     token/detail split D7, the no-model-gate rule D8, the reason-line grammar
#     D9, the silent-versus-warning poll fallback D10, and the appended doctor
#     detail D11)
#   - No decision record is owed: the ten binding decisions live in the spec's
#     §15 decision log (DEC-1..DEC-10).
#
# ORDERING (dependency-driven; the tree is green at every commit and no
# intermediate commit lets the shell defer while the engine claims):
#   1 fact contract + bounded reader and its inventories
#   2 global queue gate, claim/fenced-claim refusal, park-recovery skip,
#     payload presence, and the closed lane/blocking vocabulary
#   3 additive status providers sibling and human suffix
#   4 additive doctor provider detail and the one new evidence reason
#   5 production composition at the CLI/MCP edge, queue CLI surfaces, dispatch
#     claim-seam refusal, queue goldens, and the cross-surface composition pin
#   6 the DM-1 example hook, install/uninstall registration, and its
#     deterministic shell suite
#   7 guides, feature specs, reference pages, and the release changeset
#   8 final verification, goldens/inventory confirmation, and the delivery
#     record (no source change)
#   - Phase 1 lands first because every later surface and the shell example
#     share one fact shape, one source vocabulary, and one reason bound.
#   - Phase 2 lands the pure/app gate before any composition, so the queue,
#     lease, park, and lane proofs never depend on a CLI wiring that could
#     silently omit the fact.
#   - Phases 3 and 4 are independent surfaces over injected facts; they follow
#     the gate because the payload and reason vocabularies they project are
#     declared in phase 2, and precede phase 5 because `edge.ts` can compose
#     their readers only once their contracts exist.
#   - Phase 5 is the single owner of `packages/cli/src/edge.ts` and
#     `packages/cli/src/production.ts`: every production reader (queue, claim,
#     watch, dispatch, status, doctor) lands together, so no file is changed in
#     two phases and the composition pin is satisfied in the phase that can
#     satisfy it in full.
#   - Phase 6 ships the example only after the engine gate exists. That is the
#     spec §18 ordering: a wrapper-side deferral may never exist in a commit
#     where the typed engine would still claim. The example is installed
#     inactive and is not referenced by operator documentation until phase 7.
#   - Phase 7 is the only phase that tells an operator to select the example; it
#     also lands the one binding doc-sync edit the error-table check forces
#     (phase 2's remediation-hint change must update the documented row in
#     `doc/spec/features/feature-result-contract.md` in the same commit).
#   - Phase 8 is verification only: no source, fixture, or golden edit. It
#     records the test-plan execution log and the change record with the
#     aggregate gate, the shell battery, the doc-distribution guard, and the
#     manual TC-HOLDE2E-001 procedure.
#
# DELIVERY PINS (placements and spellings the spec/test plan leave
# delivery-bound; none changes a requirement):
#   - The fact is `OwnerHoldFact` = `{ active: false }` or
#     `{ active: true; source: "env" | "marker"; reason?: string }`, declared in
#     `packages/core/src/contracts/owner-hold.ts` (types and `OWNER_HOLD_*`
#     constants only, because the contract tier must stay type-and-const). The
#     pure resolver lives in `packages/core/src/domain/owner-hold.ts` and takes
#     the environment record, the state directory, and the marker outcome as
#     injected inputs. Core reads no ambient environment and no filesystem.
#   - The bounded marker read lives in
#     `packages/adapters/src/file/owner-hold-marker.ts` over injected facts
#     (existence, regular-file check, one bounded read of at most 4 096 bytes),
#     is fail-closed for an unreadable, non-regular, or stat-failing path, and is
#     supplied by the CLI edge and the MCP status runtime. The engine's marker
#     path is always `<stateDirectory>/owner-hold` from the store identity; no
#     caller-supplied path reaches the engine.
#   - Precedence: environment present with length > 0 wins over the marker; an
#     empty environment is inactive; a whitespace-only environment is active
#     without a reason; a zero-byte marker is active without a reason; only a
#     non-existent path is an inactive marker. The reason is stripped of C0/C1
#     and ANSI escapes, collapsed to one line, trimmed, and truncated to 160
#     characters before any payload, line, or log.
#   - Claim refusal keeps the blocking-reason token exactly `owner-hold` and
#     names the source and reason in the separate bounded detail
#     (`owner hold active (<source>)[: <reason>]`). `parked:<cause>` stays a park
#     reason and is never conflated with the token (PM D7).
#   - A resumable park under a hold renders `held` with `owner-hold`, an active
#     park keeps `parked:<cause>`, a stuck park keeps `park-condition-stuck`, and
#     `owner-hold` is always the first blocking reason; later reasons are
#     preserved, never replaced.
#   - The mutating recovery pass is skipped at the app layer, so every caller
#     (claim, release, bookkeeping, watch) inherits the skip without a separate
#     gate. Reads may still evaluate and display park state.
#   - The dispatch claim seam stays `{ ok: true, leaseId } | { ok: false, code }`
#     plus one additive optional `summary`; the engine carries it into the
#     existing `queue`-kind `error.summary`. No new error identity, domain kind,
#     or exit.
#   - The status sibling is one optional `ownerHold?: { source; reason? }` on
#     the section evidence (a sibling of `sources[]`, the
#     `credentialPrerequisite` precedent), attached after derivation and only
#     when active. Human mode appends `| owner-hold[: <reason>]` to the existing
#     providers line inside the delivered clamp.
#   - The doctor reason is exactly one value, `owner-hold`, inserted immediately
#     after `park-credential-cause`; the provider check keeps `ok`, adds no hint
#     and no condition-catalog entry, and appends
#     `<existing detail>; owner hold active (<source>)[: <reason>]` clamped to
#     `DOCTOR_MAX_DETAIL_CHARS`. A real provider defect keeps its own verdict and
#     reason and does not gain `owner-hold` (PM D11).
#   - `scripts/deliver-ticket.sh`, `scripts/ceo-loop.sh`,
#     `scripts/batch-deliver.sh`, `scripts/.tests/test-hook-regression.sh`, and
#     every pinned wrapper byte are unchanged.
#   - Goldens: the inactive queue, status, doctor, lanes, and MCP goldens stay
#     byte-identical and are asserted unchanged, never regenerated; only the
#     declared held fixtures are added. No assertion is deleted or loosened; no
#     `toEqual`/byte equality is downgraded to a substring check.
#   - Inventories move exactly once, in phase 1: three new source modules in
#     `tests/structure/inventory.json`, their executable exports in
#     `tests/structure/content-inventory.test.ts`, and the new contract exports
#     in `tests/fixtures/ports/v1-contract-inventory.json`. No later phase
#     re-opens them.
#   - The example hook is `scripts/hooks/pre-opencode-iteration-owner-hold.sh`
#     with `howLongToSleepDueToOwnerHold()` as its only default registration, no
#     provider/model gate, no fixed iteration cap while held, a MAX driver, and
#     exactly one bounded reason line per sleep. Poll default 300 s, accepted
#     range 1-3 600 s, silent default for unset/empty/whitespace, one bounded
#     warning for any other invalid value.
#   - The manual evidence is TC-HOLDE2E-001 only: create a marker in a
#     disposable root, show status and doctor reporting it, show a queue claim
#     and a dispatch refusing with `owner-hold`, show an expired park staying
#     parked, remove the marker, and show the next pass resuming from unchanged
#     records with one session. It runs at PR time against a disposable state
#     root; no automated gate depends on observed facts.
#   - Documentation brand discipline: the two guides are baseline-grandfathered
#     by the forbidden-literal scan and may name the repository's ADOS_* example
#     variables; the three registered feature specs and the three registered
#     command pages ARE scanned, so they describe the variable as the
#     brand-derived placeholder `<PREFIX>_OWNER_HOLD` and contain no `ados`,
#     `ADOS_`, or `.ados-state` literal. The registry is not edited.
#   - Rollback: reverting the change restores the delivered scheduling, claim,
#     surface, and hook behaviour with no migration; clearing a hold is always
#     `rm <stateDirectory>/owner-hold` plus unsetting the variable, with no code
#     change and no state repair. A hold writes nothing, so no record written
#     before this change depends on it.
#
# DECLARATION-ONLY KEYS: `objective`, `dependsOn`, `acCoverage`, `tcCoverage`,
# and `verification` are evidence declarations read by the delivery loop;
# `plan validate` ignores them (the same pattern the delivered GH-279 plan uses
# for its coverage and verification declarations). They record no progress and
# no task list: progress lives in pm-notes `notes:`.
#
# COVERAGE INVARIANT: all 44 acceptance criteria appear exactly once in
# `acCoverage`, each in the phase that satisfies it in full. All 58 test cases
# have a declared home; the only cases split across phases are
# TC-HOLDQUEUE-004 (engine carriage here, production seam in phase 5),
# TC-HOLDQUEUE-009 (projector here, CLI goldens in phase 5),
# TC-HOLDEDGE-002 (parity case in phase 3, composition pin in phase 5),
# TC-HOLDNEG-002 (closed-set, surface, and composition halves declared
# explicitly), and TC-HOLDNEG-003 (ambient-core half in phase 1, composition
# half in phase 5). No identifier is dangling or invented: every AC and TC
# resolves to a row in the spec's acceptance-criteria table or in the test
# plan's case index.
#
# COMMIT HYGIENE: one commit per phase through the `commit` primitive, subject =
# the phase `summary`, body/footer lines <= 100 characters, no manual staging.

schemaVersion: delivery.plan.v1
workItemRef: GH-280

tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8]
  escalationTriggers:
    - "a hold-refused claim, dispatch, daemon claim, or watch path appends an entry, dependency, lease, park, incident, daemon-lane, heartbeat, handoff, attempt, divergence, or authority record"
    - "a park whose window expired during a hold regains clear-observed, recovered, or a park-auto-recovery incident, or its record bytes change"
    - "the claim blocking-reason token is anything other than owner-hold, or the source and reason are folded into the token"
    - "a new park cause, park condition type, recovery state, state record kind, queue-ready condition, status section, status evidence reason, doctor verdict, doctor summary count, doctor condition, doctor area, doctor evidence source, error identity, or domain kind appears"
    - "an inactive hold changes a queue payload, lanes payload, status digest, doctor report, or hook decision byte"
    - "an unreadable, non-regular, or stat-failing marker resolves inactive, or the reason is not stripped of control characters and truncated to 160 characters"
    - "core reads the ambient environment or filesystem, or a product/binary/brand literal is hardcoded in tooling code"
    - "the example hook applies a fixed iteration cap while held, performs a real sleep or network call in its suite, or writes ADOS_HOOK_ENV_V1 output"
    - "scripts/ceo-loop.sh, scripts/.tests/test-hook-regression.sh, or any wrapper byte changes"
    - "a production surface omits the owner-hold reader, so the shell defers while the engine still claims"
    - "an existing golden is regenerated, or an assertion is deleted or loosened to make the additive change fit"
    - "the doctor provider check stops being ok while held, adds a fix hint, or changes the exit model"
    - "a new command, flag, configuration key, or --park cause appears"
    - "status or doctor exits non-zero, drops a section, or turns an operator pause into a defect"

defaultWeightClass: "standard"

