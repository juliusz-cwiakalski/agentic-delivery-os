verdict_basis: >-
  NOT_READY. Ticket acceptance coverage, the 29-AC and 29-TC matrices, and most
  source anchors hold up under probe, and the TDR/changeset ordering constraint and
  TC-RELEASE-001 obligation are correctly encoded. The artifacts are not jointly
  executable as written: the verbose human diagnostic requires widening a published
  `@delivery-os/cli` type that no DM declares; the delivered spawn-failure golden
  envelope breaks and is owned by no phase; the detail-attachment rule conflicts with
  a TC step that asserts an unreachable failure shape; the end-to-end proof shares the
  live delivery's state root and can release its lease; and there is no Definition of
  Done.

