findings:
  - id: F1
    severity: major
    facet: spec_completeness
    artifact: >-
      chg-GH-277-spec.md §8.3 DM table (235-243), §8.5 (260-270), §16 (364-368);
      packages/cli/src/index.ts:51 and :351-353; packages/cli/src/commands/dispatch.ts:133-149;
      chg-GH-277-test-plan.md TC-HDA-029 step 5 (983), TC-HDA-032 note (1102);
      chg-GH-277-plan.yaml phase 2 scope (185-196)
    gap: >-
      The verbose human diagnostic requires changing CommandDefinition.humanText, a type
      exported from the published @delivery-os/cli "." entry. runCli passes only
      (data, brand) and --verbose is stripped from argv before the handler, so threading
      the fact requires widening a published type. The spec declares only DM-1/DM-2/DM-3
      and states nothing else on the public surface changes, while TC-HDA-029 step 5
      asserts the dispatch error is "the only widened surface" and TC-HDA-032's note
      admits the coder must thread verbose into that seam. No DM, no compatibility
      statement, no governance note.
    remediation_target: specification
    fix: >-
      Add DM-4 declaring the additive backward-compatible humanText context argument,
      name index.ts as its owner in §16, add the §8.5 compatibility line, and reword
      TC-HDA-029 step 5 to "the only widened dispatch-envelope surface, plus the declared
      additive humanText context argument".

  - id: F2
    severity: major
    facet: plan_code_area_coverage
    artifact: >-
      chg-GH-277-plan.yaml phase 2 (185-196), phase 3 (225-231); chg-GH-277-test-plan.md
      §7.1 (1487-1516), §7.2 (1537-1567); chg-GH-277-spec.md §7.1 (198);
      tests/golden/dispatch-errors.test.ts:49-57;
      tests/fixtures/dispatch/golden/errors/spawn-failed.json
    gap: >-
      The delivered TC-ERR-004 asserts byte equality of the spawn-failure envelope with a
      golden that carries exactly six data.error fields. The scenario's failure is
      { kind: "harness", code: "harness.spawn.refused" } with no field
      (tests/fixtures/dispatch/harness.ts:158-162), so under spec F-5/Appendix C the
      envelope gains data.error.detail and the golden byte-equality test fails. Neither
      the golden nor its test is in any phase scope or file table, although spec §7.1
      declares golden envelopes in scope and §2.2 says the delivered fixtures pin the
      collapsed envelope.
    remediation_target: delivery_planning
    fix: >-
      Add the golden file and tests/golden/dispatch-errors.test.ts to a phase scope with a
      deliberate-update note, list both in test-plan §7.1/§7.2, and add the byte-equality
      assertion to TC-HDA-030/TC-HDA-033.

  - id: F3
    severity: major
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md TC-HDA-030 step 8 (1023); chg-GH-277-spec.md F-5 (145),
      Appendix C (494-505), AC-F5-1 (391); packages/core/src/contracts/harness.ts:306-310;
      tests/fixtures/dispatch/harness.ts:158-162
    gap: >-
      TC-HDA-030 step 8 asserts a spawn failure "that carries neither code nor field" and
      expects no detail. No such HarnessFailure exists: kind and code are required and
      harness.spawn.refused carries a code with no field. The step asserts an unreachable
      state and conflicts with F-5/Appendix C, which imply a detail with kind and code and
      no field. This unresolved rule decides whether F2's golden changes.
    remediation_target: test_planning
    fix: >-
      State the rule in F-5/Appendix C (recommended: detail whenever an underlying failure
      exists, field only when present) and rewrite step 8 to assert detail
      { kind: "harness", code: "harness.spawn.refused" } with field omitted. If the other
      rule is chosen, say so and keep the golden unchanged.

  - id: F4
    severity: major
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md §6.3 (1312-1432), TC-HDA-101 (1244-1277), §6.2 (1306);
      chg-GH-277-plan.yaml phase 4 (246-293); packages/cli/src/production.ts:925-938;
      packages/core/src/app/queue.ts:1298-1301
    gap: >-
      The end-to-end procedure is bounded for the worktree but not for the delivery's own
      state. It unsets DELIVERY_OS_WORKING_NAME (1319) so it shares the live
      $HOME/.delivery-os-state; line 1381 force-releases GH-277 --holder dispatch, which is
      the live engine dispatch's lease holder, and releaseQueueLease honours a matching
      holder; line 1382 mutates the real queue; lines 1410-1418 append a real
      dispatch.attempt record for GH-277 to the live ledger. That contradicts TC-HDA-101's
      claim that only the clone is touched and can corrupt the lease/attempt evidence
      dod_check reads.
    remediation_target: test_planning
    fix: >-
      Run the probe under an isolated state/config root (probe-only working name or explicit
      state directory), add a STOP rule when an active GH-277 lease exists for holder
      dispatch, and record the probe's attempt record inside the probe root.

  - id: F5
    severity: major
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md TC-HDA-101 step 4 (1265) and Expected Outcome (1272),
      §6.3 step 0 (1323)
    gap: >-
      The outcome claims the worktree is "byte-identical", but step 0 runs pnpm build in
      $REPO, rewriting packages/*/dist and *.tsbuildinfo, and the clone symlinks
      $REPO/node_modules (1337). The only evidence collected is git status/HEAD, which
      excludes ignored paths, so the claim cannot be demonstrated and would be recorded as
      a false pass.
    remediation_target: test_planning
    fix: >-
      Reword to the asserted property: worktree stays git-clean and HEAD unchanged, ignored
      build artifacts are intentionally rewritten, and no tracked or untracked-not-ignored
      path changes.

  - id: F6
    severity: major
    facet: dod_defined
    artifact: >-
      chg-GH-277-spec.md §17 (373-415); precedent chg-GH-239-spec.md §17.1 and the same
      section in GH-233/238/240/242/266 specs
    gap: >-
      No Definition of Done section. Completion conditions live only in the test plan or
      plan: 29 ACs verified, 29 TCs Pass in the §10 log, M-1..M-20 mutation evidence,
      pnpm check green, exactly one changeset, the real-dispatch evidence, and the phase-7
      doc handoff. dod_check cannot distinguish "ACs met" from "evidence collected".
    remediation_target: specification
    fix: >-
      Add ### 17.1 Definition of Done with checkbox conditions covering each of those
      completion facts, in the GH-239 placement.

  - id: F7
    severity: minor
    facet: test_traceability
    artifact: >-
      chg-GH-277-test-plan.md TC-HDA-010 preconditions (495-499), TC-HDA-035 step 1 (1193);
      packages/core/src/app/dispatch.ts:333-336; packages/cli/src/production.ts:925-938
    gap: >-
      Both scenarios dispatch through the production composition, which claims a queue
      lease first; a missing queue entry returns a queue error with no attempt record. No
      precondition declares the queue entry or an injected claim port, so "exactly one
      attempt record" cannot be reached.
    remediation_target: test_planning
    fix: >-
      Add a queue-entry (or injected claim port) precondition to both scenarios and note the
      queue.entry.unobserved pre-spawn failure mode.

  - id: F8
    severity: minor
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md TC-HDA-010 precondition (498), TC-HDA-012 step 5 (576),
      §6.1 (1292)
    gap: >-
      TC-HDA-010 fixes the parent environment as exactly { PATH, HOME }, but TC-HDA-012
      step 5 needs a canary in the real child and §6.1 says the parent also carries named
      canaries. The two scenarios contradict each other as written.
    remediation_target: test_planning
    fix: >-
      State the parent as "PATH and HOME plus the §6.1 canaries; TMPDIR and both model
      variables absent" and keep the exact child key-set assertion.

  - id: F9
    severity: minor
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md TC-HDA-011 steps 1 and 3 (538, 540);
      packages/core/src/contracts/harness.ts:411-412; packages/cli/src/production.ts:458-465
    gap: >-
      The step says spawn is called with the bare command string, but HarnessSessionPort.spawn
      has no command parameter; the command and args are fixed at adapter composition. The
      described call cannot be written as stated, and the args assertion must read the
      runner's (file, args) record.
    remediation_target: test_planning
    fix: >-
      Reword to "compose the adapter with command opencode and spawnArgs run/--format/json,
      then call spawn({workItemRef, prompt, descriptor}); assert the recorded file is the
      bare name and args equal [run, --format, json]".

  - id: F10
    severity: minor
    facet: plan_code_area_coverage
    artifact: >-
      chg-GH-277-plan.yaml phase 1 (134-153); tests/fixtures/queue/production/harness.ts:194-199;
      tests/behaviour/queue-production-binding.test.ts:504-508;
      tests/structure/dispatch-composition.test.ts:211-216,445,715,257-261
    gap: >-
      The queue production harness composes the stack with { HOME, HARNESS_MODEL,
      HARNESS_SMALL_MODEL } and no PATH, so after the repair TC-BIND-007 silently stops
      attempting a spawn (it now fails on harness.spawn.variable-missing: PATH) while its
      assertions still pass. That fixture/test is in no scope, and phase 1's summary
      promises only the key-set fix although three dispatch-composition environment fact
      sets plus the starterInvocations assertions also change.
    remediation_target: delivery_planning
    fix: >-
      Add PATH to the queue production harness (or declare the narrowed meaning of
      TC-BIND-007) and scope the file; expand phase 1's summary to name all three
      dispatch-composition environment facts and dependent assertions.

  - id: F11
    severity: minor
    facet: plan_code_area_coverage
    artifact: >-
      chg-GH-277-plan.yaml phase 1 (119-168); tests/checks/harness-mutants.test.ts:76-84,102-111
    gap: >-
      The delivered non-vacuity meta-check mutates harness-spawn-env.ts by exact string
      replacement. The optional-entry branch rewrites that loop; a changed anchor turns the
      mutant into a no-op and the suite fails with "mutant passed". The suite is in no phase
      gate list or regression list.
    remediation_target: delivery_planning
    fix: >-
      Add tests/checks/harness-mutants.test.ts to phase 1's run-unchanged regressions and
      note that its harness-spawn-env.ts string anchors must survive the optional branch.

  - id: F12
    severity: minor
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-pm-notes.yaml OQ-1 (19-29) and decisions (17); chg-GH-277-spec.md OQ-1 (340),
      DEC-1..DEC-6 (347-352)
    gap: >-
      The spec records OQ-1 as resolved by TDR-0017 while pm-notes still carries it as
      "Decision needed" with an open recommendation and decisions is empty. The stale entry
      reads as an unresolved blocking question at dod_check.
    remediation_target: specification
    fix: >-
      Set pm-notes OQ-1 to resolved by TDR-0017 with the spec cross-reference and add a
      decisions entry naming TDR-0017.

