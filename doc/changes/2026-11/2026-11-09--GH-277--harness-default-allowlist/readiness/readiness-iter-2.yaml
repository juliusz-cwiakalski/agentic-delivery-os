findings:
  - id: N1
    severity: major
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md §6.3 step 0 (1352), step 8 (1504), TC-HDA-101 steps 1/4
      (1285, 1288), §10 evidence line (1867); chg-GH-277-plan.yaml P4 scope (301-305)
      and P4 doneArtifacts (315-325); chg-GH-277-pm-notes.yaml (66-73)
    gap: >-
      The isolation assertion is absolute git-status emptiness before and after the probe,
      but this change's own artifacts are untracked/modified while P4 runs: TDR-0017 is
      untracked until P4 lands it (pm-notes 66-73), P4 also adds the changeset and edits
      the test plan (305), and a plan phase commits only at its boundary. Probed now:
      `git status --porcelain` prints `?? doc/decisions/TDR-0017-additive-optional-harness-environment-marker.md`.
      Step 0 therefore fails its own comment with no declared action (it is neither the
      FAIL condition nor a STOP), and step 8 fails deterministically, invalidating the
      AC-F8-2 evidence DoD-6 reads.
    remediation_target: test_planning
    fix: >-
      Record STATUS_BEFORE at step 0 and assert STATUS_AFTER == STATUS_BEFORE at step 8
      (and in TC-HDA-101 steps 1/4 and the §10 line), naming the expected baseline entries
      (untracked TDR-0017, untracked changeset, pending test-plan edit). If instead the
      TDR/changeset commit is meant to precede the probe, restate the P4 single-commit
      ordering in the plan too.

  - id: N2
    severity: major
    facet: dod_defined
    artifact: >-
      chg-GH-277-spec.md §17.1 DoD-6 (430) vs chg-GH-277-test-plan.md §6.3 step 0 (1355)
      and step 8 (1501-1503)
    gap: >-
      DoD-6 requires the proof to "mutate no file in this change's worktree", while the
      procedure's step 0 runs pnpm build in $REPO, rewriting gitignored packages/*/dist and
      *.tsbuildinfo inside that worktree. The test plan now explicitly disclaims byte
      identity for this reason, so the DoD condition and the procedure assert incompatible
      properties; dod_check cannot close AC-F8-2 through the literal wording.
    remediation_target: specification
    fix: >-
      Reword DoD-6 to "no nested-lifecycle mutation: git status --porcelain equals the
      recorded pre-run baseline and HEAD is unchanged, with only gitignored build outputs
      rewritten by the deliberate build step". Keep AC-F8-2 unchanged.

  - id: N3
    severity: major
    facet: plan_code_area_coverage
    artifact: >-
      chg-GH-277-plan.yaml P2 scope (217-230) and P2 gates (213-216); chg-GH-277-test-plan.md
      §7.1 (1569-1602), §7.2 (1620-1654), §6.4 (1539-1550); delivered
      tests/structure/port-contract-inventory.test.ts:84-109,134-136;
      tests/fixtures/ports/v1-contract-inventory.json (modules["dispatch.ts"] 70 names,
      modules["index.ts"] 1896 names); tests/structure/content-inventory.test.ts:466, 2166-2184
    gap: >-
      TC-PORT-001 compares the live contracts export surface to the committed fixture in
      both directions, so adding DispatchEnvelopeError to contracts/dispatch.ts and
      re-exporting it from contracts/index.ts (DM-3 239; TC-029 step 8) fails with
      "dispatch.ts/index.ts: unexpected export DispatchEnvelopeError". content-inventory
      restricts exported variables in contracts/dispatch.ts to a fixed allowance list, so
      the named 256-character bound TC-034 step 3 must read (NFR-6 283, AC-F5-5 397) must
      be added there too. Neither fixture nor suite appears in any phase scope, in
      §7.1/§7.2, or in §6.4, and P2 does not run pnpm test, so both surface only at the P4
      aggregate gate.
    remediation_target: delivery_planning
    fix: >-
      Add tests/fixtures/ports/v1-contract-inventory.json (and the content-inventory
      allowance if the bound is exported) to P2 scope with a deliberate-update note, list
      them in §7.1/§7.2, add both suites as run-unchanged regressions in §6.4, add
      `bun test tests/structure/port-contract-inventory.test.ts tests/structure/content-inventory.test.ts`
      to P2's gates, and state in DM-3 whether the bound constant is exported (if not,
      TC-034 step 3 must assert the literal 256 and say so).

  - id: N4
    severity: minor
    facet: plan_code_area_coverage
    persistent_from: 1-F10
    artifact: >-
      chg-GH-277-plan.yaml P1 summary (134-152); delivered
      tests/structure/dispatch-composition.test.ts:211-216, 255-261, 445-450, 716-720,
      908-911; tests/fixtures/queue/production/harness.ts:194-199
    gap: >-
      P1's summary still promises only "correct the composition key-set assertion", but
      three composed parent environments carry { HOME, HARNESS_MODEL, HARNESS_SMALL_MODEL }
      and no PATH, so after the repair starterInvocations (255) and the resume case's
      spawns (908) go red, and the expected child key set becomes
      ["DELIVERY_WORK_PATH","HOME","PATH"].
    remediation_target: delivery_planning
    fix: >-
      Expand P1's summary to name all three parent-environment fact sets, the PATH
      addition each needs, the two spawn-count assertions, and the new expected key set.

  - id: N5
    severity: minor
    facet: test_traceability
    artifact: >-
      chg-GH-277-test-plan.md §3.5 (229-230), §5.2 notes (438, 458, 631, 937, 1082, 1177,
      1195, 1231, 1265, 1301, 1324), §7.2 (1630, 1635, 1644, 1649, 1651, 1653, 1654)
    gap: >-
      §3.5 claims the spec line references are v1.2 but most were not re-based after v1.2
      inserted the DM-4 row and the §8.5 bullet. Probed: NFR-6 is 283 (cited 281), NFR-7
      284 (282), AC-F5-2 394 (392), AC-F5-5 397 (395), AC-F6-3 400 (398), AC-F7-2 402 (400),
      AC-F8-1 406 (404), AC-F8-2 407 (405), Appendix A 488-500 (466-476), Appendix B
      502-514 (480-490), Appendix C 516-540 (494-505 in two rows), §18 439-446 (417-424).
      Ids all resolve, so execution is not blocked; the anchors are simply wrong.
    remediation_target: test_planning
    fix: >-
      Re-base the listed spec line citations to v1.2, or cite section/id only as §7.2
      already does for most source anchors.

  - id: N6
    severity: minor
    facet: cross_artifact_consistency
    persistent_from: 1-F12
    artifact: chg-GH-277-pm-notes.yaml (17 decisions, 39-54 blockers); chg-GH-277-spec.md (21, 351)
    gap: >-
      OQ-1's status is now correct, but decisions is still empty although DEC-3 is governed
      by TDR-0017 (spec links.decisions and §15), and the blocker entry still presents the
      six iteration-1 findings as the live gate state without noting they were verified
      remediated. At dod_check that reads as "no governing record, old gate still failing".
    remediation_target: specification
    fix: >-
      Add a decisions entry naming TDR-0017 for DEC-3, and replace the blocker entry with
      the iteration-2 verdict state once these findings are addressed (the iteration-1
      record remains the audit trail).

