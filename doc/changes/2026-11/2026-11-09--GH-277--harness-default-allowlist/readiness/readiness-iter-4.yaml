grading_rule: >-
  A facet is marked FAIL only when a critical or major finding maps to it; minor findings
  and nit advisories are recorded without failing their facet. This is the rule applied by
  iterations 1-3 (for example iteration 3 marked dod_defined PASS while carrying a minor).

counts:
  critical: 0
  major: 0
  minor: 2
  nit: 3

