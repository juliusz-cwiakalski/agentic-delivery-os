findings:
  - id: N1
    severity: minor
    blocking: false
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-spec.md DM-3 (243), §8.3 detail note (248), §16 dispatch-contract row (370),
      Appendix C (532); chg-GH-277-test-plan.md:98, 1189, 1337;
      chg-GH-277-plan.yaml:63-79, 222-235, 286-300
    gap: >-
      The plan declares this change's second contract-surface addition, the exported
      DISPATCH_MAX_ERROR_DETAIL_CHARS constant (re-exported from contracts/index.ts and therefore
      pinned in the v1 contract fixture), and TC-HDA-034 step 3 requires the 256 bound to be read
      from the delivered export. The specification never names that export: DM-3 defines only the
      type, the §8.3/Appendix C prose says "at most 256 characters", and §16 enumerates only
      DispatchEnvelopeError. test-plan:98 additionally attributes the constant to the spec ("Spec
      v1.3 DM-3 adds DispatchEnvelopeError ... with the exported bounded constant
      DISPATCH_MAX_ERROR_DETAIL_CHARS"), which DM-3 does not state. Non-blocking: the spec's DoD-2
      binds all 29 TCs and TC-HDA-034 mandates the exported bound, so the change's Definition of
      Done already sanctions the export; the defect is an incomplete contract-surface description
      in the authoritative artifact plus one overstated citation.
    remediation_target: specification
    fix: >-
      Add one clause to DM-3 ("the 256-character bound is exported as
      DISPATCH_MAX_ERROR_DETAIL_CHARS, sibling to DISPATCH_MAX_LAST_MESSAGE_CHARS, re-exported from
      contracts/index.ts and pinned in tests/fixtures/ports/v1-contract-inventory.json"), mirror it
      in the §16 dispatch-contract row and Appendix C, cite it in AC-F5-5's evidence, and change
      test-plan:98 to "spec DM-3 plus this plan's inventory obligation" rather than attributing the
      constant to DM-3.

  - id: N2
    severity: minor
    blocking: false
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md:1021, 1207, 1277, 1314, 1677, 1686 (and the other post-§7.3 anchors);
      declarations at 196 and 1664; version strings at 15, 53, 54, 57, 87, 91, 98, 108, 187, 188,
      997, 1060, 1134, 1307, 1807, 1808, 1818, 1819, 1822;
      chg-GH-277-plan.yaml:5, 10
    gap: >-
      The §7.3 table added four lines in spec v1.4, so every cited spec line number after that
      point is four lines low while the test plan still declares its basis as v1.3. Probed
      examples: "DM-3 239" (now 243), "NFR-6 283" (287), "AC-F8-1 406, §18 439-446" (410,
      443-450), "AC-F8-2 407, §17.1 DoD-6 430, RSK-6 307" (411, 434, 311), "AC-F6-3 400" (404),
      and the Appendix A-C ranges (488-500 / 502-514 / 516-540). Pre-§7.3 anchors (F-1 141, F-3 143,
      F-5 145, F-8 148) remain correct. test-plan:196 and :1664 still say the references are "for
      spec v1.3"; test-plan:15 says the plan "is aligned with change spec v1.3"; plan:5 and :10 cite
      "v1.3" for the spec and test plan. Non-blocking: each citation carries its stable id, so a
      delivery agent can resolve the anchor from the id, and no DoD binds spec line numbers.
    remediation_target: test_planning
    fix: >-
      Rebase post-§7.3 spec anchors by +4, replace "spec v1.3"/"for spec v1.3" with "spec v1.4" at
      the listed locations, and update plan:5,10 to "spec v1.4" / "test plan v1.4". Mechanical; no
      scenario, id, or coverage row changes.

