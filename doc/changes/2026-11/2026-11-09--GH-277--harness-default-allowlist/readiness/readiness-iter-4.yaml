verdict_basis: >-
  READY. Iteration 3's single major is fixed: the test plan and plan now state the v1
  contract fixture as gaining exactly this change's two declared additions,
  DispatchEnvelopeError and DISPATCH_MAX_ERROR_DETAIL_CHARS, under both
  modules["dispatch.ts"] and modules["index.ts"], with the content-inventory allowance
  registering the exported bound, and no blanket "no other export" prohibition remains.
  Iteration 3's minor is fixed: spec 7.3 and 14 carry Owner/Home columns and DoD-10 points
  at them. The re-attack found no contradiction that makes the artifacts unexecutable or
  lets delivery produce a spec-violating result; both P2 inventory gates are green on the
  delivered tree (11/0 and 6/0), the fixture collector and the allowance enforcement were
  re-probed against the artifacts' claims, plan validate returns valid/full/ready, and id
  sets and ownership are unchanged (29 ACs, 29 TCs, 29/29 coverage, 45 distinct scope
  paths). Two minor documentation gaps remain and are recorded as non-blocking debt: the
  spec never names the exported 256-character bound that the plan and test plan treat as
  the second declared contract-surface addition (and test plan 98 attributes it to DM-3,
  which does not say it), and the test plan's post-7.3 spec line anchors plus version
  strings lag spec v1.4.

