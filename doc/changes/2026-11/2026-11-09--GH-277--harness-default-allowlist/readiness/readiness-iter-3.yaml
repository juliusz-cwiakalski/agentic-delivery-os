findings:
  - id: N1
    severity: major
    blocking: true
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-277-test-plan.md TC-HDA-029 step 9 (1011), §1.1 (41), §1.4 row 15 (83), §3.5 (237),
      §6.1 (1338), §7.1 (1635-1636), §8.1 R-T15 (1795), revision log (1838);
      chg-GH-277-plan.yaml header (63-75), P2 summary (240-244), P2 doneArtifacts (280-283);
      tests/fixtures/ports/v1-contract-inventory.json:637,1540;
      tests/structure/port-contract-inventory.test.ts:82-109,134-136;
      tests/structure/content-inventory.test.ts:468-509,2166-2184
    gap: >-
      Every artifact says the v1 contract fixture gains exactly DispatchEnvelopeError, and TC-HDA-029
      step 9 adds "Assert the fixture diff changes no other export name." P2 also lands a second new
      export in the same module, DISPATCH_MAX_ERROR_DETAIL_CHARS (plan 223-226; test plan 1189, 1195),
      which must be exported so TC-HDA-034 can read the bound instead of duplicating a literal.
      collectInventory collects exported variable statements and compareInventory is bidirectional —
      which is why the fixture already lists the sibling DISPATCH_MAX_LAST_MESSAGE_CHARS under
      modules["dispatch.ts"] (637) and modules["index.ts"] (1540). The correct P2 edit must add
      DISPATCH_MAX_ERROR_DETAIL_CHARS under dispatch.ts (and under index.ts when re-exported from
      contracts/index.ts), or `bun test tests/structure/port-contract-inventory.test.ts` fails with
      "dispatch.ts: unexpected export DISPATCH_MAX_ERROR_DETAIL_CHARS". The artifacts never direct that
      edit and one binding test-plan step forbids it, so a delivery agent following step 9 literally
      records a false failure or "fixes" it by not exporting the bound, which breaks TC-HDA-034 and
      AC-F5-5. The new P2 gate contains the blast radius to P2, but TC-HDA-029 step 9 and TC-HDA-034
      step 3 cannot both hold as written.
    remediation_target: test_planning
    fix: >-
      In TC-HDA-029 step 9, §7.1's fixture row, §1.1, §1.4 row 15, §3.5, §6.1, R-T15, and the plan's
      P2 summary/doneArtifacts, state the fixture diff as "add DispatchEnvelopeError and
      DISPATCH_MAX_ERROR_DETAIL_CHARS under modules[\"dispatch.ts\"] (and under modules[\"index.ts\"] for
      whatever is re-exported from contracts/index.ts)"; replace "changes no other export name" with
      "changes no export name other than this change's declared additions"; keep
      tests/structure/port-contract-inventory.test.ts unmodified.

  - id: N2
    severity: minor
    blocking: false
    facet: dod_defined
    artifact: >-
      chg-GH-277-spec.md §17.1 DoD-10 (434) vs §14 (340-343) and §7.3 (215-221);
      chg-GH-277-test-plan.md:1816,1820
    gap: >-
      DoD-10 requires remaining follow-ups (OQ-2 discovered boot variables, Windows parity) to be
      "named with an owner and a home", but spec §14 has no owner column and OQ-2's status names no
      owner, and §7.3 names no owner. The test plan assigns owners (OQ-T1 "@coder / owner", OQ-T5
      "@pm"), yet DoD-10 binds §12/§14/§7.3, so dod_check cannot close it from the spec as written.
      Non-blocking: OQ-2 is evidence-gated by the P4 real dispatch and explicitly non-blocking for
      specification.
    remediation_target: specification
    fix: >-
      Name an owner for OQ-2 and the Windows-parity deferral in §14/§7.3, or reword DoD-10 to "named
      with a home and a resolution path" and cite the test plan's owners.

