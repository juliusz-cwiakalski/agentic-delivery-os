      rendering in machine json, verbose human text, and the exactly-four-key
      non-verbose text with identifiers-only bounded content, and the additive
      optional human-text context with a two-parameter definition still compiling
      and behaving identically under the workspace typecheck. Gates: the three new
      behaviour suites; the human-text context type test through pnpm typecheck;
      pnpm check:boundaries; biome check on the touched files.
    scope:
      files:
        - tests/fixtures/harness/default-spawn.ts
        - tests/fixtures/dispatch/harness.ts
        - tests/behaviour/dispatch-harness-default-spawn.test.ts
        - tests/behaviour/harness-default-path.test.ts
        - tests/behaviour/dispatch-harness-default-detail.test.ts
        - tests/types/dispatch-human-text-context.type-test.ts
    interactions:
