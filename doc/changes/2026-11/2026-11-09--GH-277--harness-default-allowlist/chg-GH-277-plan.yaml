# GH-277 delivery plan — make the default harness spawn allowlist able to
# start opencode without user configuration.
#
# Sources (single source of truth):
#   - Spec:      ./chg-GH-277-spec.md (v1.2; F-1..F-8; AC-F1-1..AC-F8-2 = 29 ACs;
#                NFR-1..NFR-9; DEC-1..DEC-6; DM-1..DM-4; RSK-1..RSK-8; OQ-1
#                resolved by TDR-0017, OQ-2 open and non-blocking; §6 flows 1–6;
#                §8.3/§8.5; §13 dependencies; §16 affected components; §17.1
#                Definition of Done; Appendix B/C/D)
#   - Test plan: ./chg-GH-277-test-plan.md (v1.2; 29 scenarios TC-HDA-001..101 in
#                §5.1/§5.2; §6.1 fixtures; §6.2 isolation; §6.3 operator-run E2E;
#                §6.5 aggregate gate + privacy literals; §7.1 required files; §7.2
#                TC → file map; §7.3 mutations M-1..M-20; §10 execution log)
#   - Decision:  doc/decisions/TDR-0017-additive-optional-harness-environment-marker.md
#                (enforces C-1..C-8 for the marker; spec DEC-3, OQ-1)
#   - Ticket:    GH-277.
#
# Ceremony: one ticket, one PR targeting main-tools, four delivery phases.
#   P1 contract, catalog, defaults, configuration validation, deny-by-default
#      builder and production composition (+ the delivered suites, fixtures and
#      meta-checks the repair invalidates, including the production queue fixture
#      and the harness-mutants string anchors).
#   P2 dispatch detail on the dispatch-specific error, the verbose/non-verbose
#      human rendering seam with the additive optional human-text context, and the
#      byte-pinned spawn-failure golden (+ the contract-shape and identity suites).
#   P3 the new regression suites: synthetic harness executable on a controlled
#      PATH, bare-command PATH resolution, real-child ambient canary, paired
#      optional cases, record precedence through the child, detail rendering, and
#      the human-text context type test.
#   P4 bounded real-CLI proof, release changeset, decision-record capture,
#      aggregate gate, phase-7 spec handoff.
# Each phase is green on its own slice and independently committable through the
# `commit` primitive: every delivered suite whose construction site or assertion a
# phase invalidates is migrated in that same commit, and no delivered assertion is
# deleted to make a new case pass (test plan §7.2 sequencing note 6).
#
# AC ownership — 29/29, exactly one owning phase each; cross-phase confirmations
# are additive and never transfer ownership:
#   P1  AC-F1-3, AC-F2-1, AC-F2-3, AC-F3-1, AC-F3-2, AC-F3-3, AC-F3-4,
#       AC-F3-5, AC-F4-1, AC-F4-2, AC-F6-1, AC-F6-2, AC-F6-3, AC-F7-5   (14)
#   P2  AC-F5-1, AC-F5-4                                              (2)
#   P3  AC-F1-1, AC-F1-2, AC-F1-4, AC-F2-2, AC-F5-2, AC-F5-3, AC-F5-5,
#       AC-F7-1, AC-F7-2, AC-F7-3, AC-F7-4                            (11)
#   P4  AC-F8-1, AC-F8-2                                              (2)
#   14 + 2 + 11 + 2 = 29; no AC unmapped, no AC id invented.
#
# TC ownership — 29/29, exactly one owning phase each:
#   P1  TC-HDA-001, 002, 003, 004, 005, 013, 014, 015, 016, 017, 018, 019,
#       020, 021, 022, 023                                             (16)
#   P2  TC-HDA-029, 033                                              (2)
#   P3  TC-HDA-010, 011, 012, 030, 031, 032, 034, 035                (8)
#   P4  TC-HDA-006, 100, 101                                         (3)
#   16 + 2 + 8 + 3 = 29; no TC unmapped, no TC id invented.
#
# Golden pin: tests/fixtures/dispatch/golden/errors/spawn-failed.json and its
# byte-equality consumer tests/golden/dispatch-errors.test.ts are owned by P2,
# where the dispatch detail lands. The golden's scenario failure is
# { kind: "harness", code: "harness.spawn.refused" } with no field, so the
# repaired envelope is the six delivered error fields plus an always-present
# detail carrying that kind and code and no field.
#
# Cross-phase confirmations that do not transfer ownership: P1 proves the builder
# canary in the constructed environment while P3 proves the absence in the real
# child; P2 delivers the detail, the additive human-text context and the verbose
# renderer plus the repaired golden while P3 owns the machine/verbose/four-key
# acceptance and the two-parameter compatibility type test (a red P3 assertion
# reopens P2 rather than being edited away); P1 proves the paired optional-entry
# cases at the builder and P3 re-observes the optional key through the child's
# environment dump; P3's child-level absent-required case confirms P1's builder
# failure identity.
#
# Generated-artifact note: `config.schema.json`, `defaults-positions.json` and
# `schema-sources.json` are generated into `packages/core/dist/config/`, which
# `.gitignore:14` excludes. Regeneration is a gate step (build, then
# `--generate-config-artifacts`), never a declared scope path.
#
# Privacy-literal rule (test plan §6.5): no absolute workstation path, machine user
# name, private repository name, or cloud literal in this plan, the tests, or the
# fixtures. Use placeholders and `mkdtemp` roots; the binding guard is
# `pnpm check:privacy-literals`.
#
# Release obligation (TC-RELEASE-001, `tests/checks/privacy-release.test.ts:42-49,
# 70-86, 133-175`; spec DEC-5, §18): exactly one added changeset declaring
# `@delivery-os/core`, `@delivery-os/adapters`, `@delivery-os/cli`,
# `@delivery-os/mcp` and `@delivery-os/opencode` at `minor` with a non-empty body;
# `@delivery-os/testkit` excluded; no pre-existing changeset modified or deleted.
#
# Decision-record ordering constraint (P4, one commit): the authored record
# `doc/decisions/TDR-0017-additive-optional-harness-environment-marker.md` is
# UNTRACKED while its row in `doc/decisions/00-index.md` (line 43) is already
# committed, so that row is not edited and the index is not in any phase scope.
# The `commit` primitive stages untracked files only inside a declared plan scope
# and derives `topPath` from `staging.include[0].path`
# (`packages/core/src/domain/commit-act.ts:289`); `TRACKER_REF`
# (`packages/core/src/domain/commit-message.ts:21`) rejects every ref-shaped token
# other than the resolved ref, so a standalone commit whose subject falls back to
# `update <record path>` is rejected as an invented tracker reference. The
# changeset is therefore declared first in P4's scope and sorts first in the
# include list (`.changeset/…` < `doc/…`), and P4's summary carries no ref-shaped
# token, which keeps the deterministic template subject valid.
#
# Environment facts: `bun test` is the runner; `pnpm build` is required before the
# CLI is runnable (the CLI resolves `@delivery-os/core/branding` from `dist`), so
# P4 builds before any `bun packages/cli/bin/delivery-os.ts` call; the aggregate
# gate is `TMPDIR=$PWD/tmp/tmpdir pnpm check` (test plan §6.5). Core stays
# runtime-neutral (no `node:*`), `packages/adapters/src/host/index.ts` stays the
# only harness child-process site (the 12-entry allowlist in
# `tests/structure/harness-imports.test.ts:26-40` is unchanged), new files carry no
# license headers, and change artifacts need no `ados_distribution` marker.
#
# Rollback: reverting P1 and P2 restores the previous (broken) behaviour. No
# persisted state, schema version, configuration key, error code, result token, or
# CLI grammar changes, so no data rollback and no feature flag apply.
schemaVersion: delivery.plan.v1
workItemRef: GH-277
tier:
  name: full
  phases: [1, 2, 3, 4]
  escalationTriggers:
    - new-harness-failure-code-or-delivery-result-token
    - dispatch-envelope-shared-error-type-widened
    - ambient-environment-read-added
    - non-verbose-dispatch-text-keys-changed
    - second-harness-child-process-site
    - required-default-entry-changed-beyond-the-declared-set
    - additional-changeset-added
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  - id: 1
    title: "Optional marker and viable default allowlist across contract, catalog, configuration, builder, and composition"
    kind: delivery
    summary: >-
      Add the variable-only optional marker and ship the repaired default
      allowlist across the contract, catalog, configuration validation, the
      deny-by-default builder and the production composition, migrating every
      delivered suite and fixture the repair invalidates in the same commit:
      pin the repaired resolved default, give the credential branch an explicit
      marker rejection (it currently returns before the unknown-key check),
      replace the fixture whose undeclared canary is the newly declared home
      variable, and correct the composition key-set assertion. It also repairs
      the delivered regressions the repair invalidates: add a synthetic path to
      the production queue fixture so the queue-binding case still reaches a
      spawn instead of failing on the now-declared required path entry, and
      preserve the exact-string mutation anchors the harness mutant meta-check
      rewrites in the builder. The packed config artifacts are generated, never
      asserted into place. Gates: build, then regenerate the config artifacts,
      then the artifact parity check; the six named behaviour/structure suites
      plus the marker type test through pnpm typecheck; the queue-production
      binding suite; the harness-mutants meta-check; pnpm check:boundaries;
      biome check on the touched files.
    scope:
      files:
        - packages/core/src/contracts/harness.ts
        - packages/core/src/config/catalog.ts
        - packages/core/src/config/harness.ts
        - packages/core/src/config/defaults.ts
        - packages/core/src/domain/harness-spawn-env.ts
        - packages/cli/src/production.ts
        - tests/fixtures/harness/config/default.resolved.json
        - tests/fixtures/harness/config/invalid-optional-credential.yaml
        - tests/fixtures/harness/config/invalid-optional-non-boolean.yaml
        - tests/fixtures/harness/config/optional-entry.yaml
        - tests/fixtures/harness/spawn-env.ts
        - tests/structure/harness-environment-marker.test.ts
        - tests/types/harness-environment-marker.type-test.ts
        - tests/behaviour/harness-config.test.ts
        - tests/behaviour/harness-spawn-env.test.ts
        - tests/behaviour/harness-spawn-credential.test.ts
        - tests/behaviour/config-cli.test.ts
        - tests/structure/dispatch-composition.test.ts
        - tests/fixtures/queue/production/harness.ts
        - tests/behaviour/queue-production-binding.test.ts
        - tests/checks/harness-mutants.test.ts
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/harness.ts
        role: producer
    doneArtifacts:
      trackerTransition: >-
        GH-277 in progress; phase 1 owns AC-F1-3, AC-F2-1, AC-F2-3, AC-F3-1,
        AC-F3-2, AC-F3-3, AC-F3-4, AC-F3-5, AC-F4-1, AC-F4-2, AC-F6-1, AC-F6-2,
        AC-F6-3, AC-F7-5 and TC-HDA-001, TC-HDA-002, TC-HDA-003, TC-HDA-004,
        TC-HDA-005, TC-HDA-013, TC-HDA-014, TC-HDA-015, TC-HDA-016, TC-HDA-017,
        TC-HDA-018, TC-HDA-019, TC-HDA-020, TC-HDA-021, TC-HDA-022, TC-HDA-023.
        It owns mutation evidence M-2, M-3, M-4, M-5, M-6 (builder half),
        M-7, M-14, M-15, M-16, M-17, M-18, M-19 and the TC-HDA-005 half of M-1;
        the child-level halves of M-1 and M-6 belong to phase 3. It also owns the
        delivered queue-production binding regression and the harness-mutants
        exact-string anchor regression.
    weightClass: heavy
  - id: 2
    title: "Underlying harness failure identity on the dispatch error and the bounded verbose diagnostic"
    kind: delivery
    summary: >-
      Keep the delivered spawn-failure identity, token, outcome, exit, category,
      retryability, consequence, remediation hint and last message unchanged
      while carrying the underlying harness failure kind, code and field as an
      additive bounded detail on the dispatch-specific error type. Widen the
      published command-definition human-text seam with the additive optional
      HumanTextContext third parameter, pass the parsed verbose fact at the single
      call site, and thread it into the dispatch human-text selection so verbose
      output names the underlying identity while non-verbose text stays exactly
      four keys in the delivered order; every existing two-parameter definition
      and direct two-argument call stays valid and produces identical non-verbose
      text. Update the byte-pinned spawn-failure golden to the repaired envelope:
      the six delivered error fields plus an always-present detail carrying the
      harness kind and the refused code for its no-field scenario, with field
      omitted, and keep its byte-equality consumer as the pin. The shared
      result-error type and every other envelope keep their delivered shape, and
      the single redacted writer and the non-verbose-gated stderr diagnostic stay
      the only channels. Gates: the envelope-detail structure suite, its type test
      through pnpm typecheck, the dispatch error-envelope suite, and the golden
      dispatch-errors byte-equality suite; pnpm check:boundaries; biome check on
      the touched files.
    scope:
      files:
        - packages/core/src/contracts/dispatch.ts
        - packages/core/src/contracts/index.ts
        - packages/core/src/app/dispatch.ts
        - packages/cli/src/index.ts
        - packages/cli/src/commands/dispatch.ts
        - packages/cli/src/output/dispatch-text.ts
        - packages/cli/src/output/serialize.ts
        - tests/structure/dispatch-envelope-detail.test.ts
        - tests/types/dispatch-envelope-detail.type-test.ts
        - tests/behaviour/dispatch-error-envelope.test.ts
        - tests/fixtures/dispatch/golden/errors/spawn-failed.json
        - tests/golden/dispatch-errors.test.ts
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/dispatch.ts
        role: producer
    doneArtifacts:
      trackerTransition: >-
        GH-277 in progress; phase 2 owns AC-F5-1 and AC-F5-4 and TC-HDA-029,
        TC-HDA-033; it also owns the M-9 and M-12 mutation records, the additive
        optional human-text context delivery, and the updated byte-pinned
        spawn-failure golden with its unchanged byte-equality consumer. The
        machine-json, verbose, four-key and two-parameter compatibility
        acceptance stays with phase 3, so a red phase-3 assertion reopens this
        phase.
    weightClass: standard
  - id: 3
    title: "Regression suites for the repaired default spawn, PATH resolution, ambient confinement, and detail rendering"
    kind: delivery
    summary: >-
      Add the regression suites that pin the repair through a synthetic harness
      executable on a controlled PATH and through the dispatch fixtures: a
      zero-configuration default spawn that writes an attempt record and reaches a
      token other than the spawn-failed identity, bare-command resolution with an
