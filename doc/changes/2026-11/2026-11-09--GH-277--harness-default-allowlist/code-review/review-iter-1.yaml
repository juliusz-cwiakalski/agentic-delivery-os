summary: >-
  The functional repair is correct and well covered: the shipped default now
  declares PATH/HOME required, TMPDIR optional and DELIVERY_WORK_PATH injected;
  the deny-by-default builder omits an absent optional entry and still fails
  closed naming a required one; no OC_ADOS_* is forwarded; the pre-session spawn
  failure keeps its identity and carries a bounded harness kind/code/field
  detail in machine JSON and verbose human output while non-verbose text stays
  four keys. All targeted behaviour/structure suites and the workspace
  typecheck pass. However, the later system_spec_update docs edits introduced
  two forbidden brand literals (`OC_ADOS_*` matches the forbidden seed `ADOS_`)
  into registered user-facing docs, so the delivered HEAD fails
  `tests/checks/forbidden-literals.test.ts` (2 tests) and the CI
  `ts-forbidden-literals` scan. That red gate violates NFR-9/DoD-12 and blocks
  merge, so the change is not PASS.
