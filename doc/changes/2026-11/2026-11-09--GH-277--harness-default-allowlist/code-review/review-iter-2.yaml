findings:
  - id: N-1
    severity: high
    confidence: high
    category: reliability
    location: tests/behaviour/dispatch-harness-default-detail.test.ts:311
    message: >-
      BLOCKING. The new TC-HDA-035 test "supplying HOME makes the same failure
      disappear" is nondeterministic: it fails roughly half the time (16/30 and
      8/16 on a clean tree; 3/6 when run together with the sibling spawn suites)
      with `error: EPIPE: broken pipe, write` surfacing as an uncaught exception.
      The synthetic opencode script (tests/fixtures/harness/default-spawn.ts:57-69)
      writes its JSONL and calls process.exit(0) without ever reading stdin, while
      the host adapter writes the prompt with `child.stdin?.end(options.stdin,
      "utf8")` (packages/adapters/src/host/index.ts:251-252 session starter, :65-66
      runner) and registers no `child.stdin.on("error", ...)` handler. When the
      child exits before that write flushes the pipe is closed and the error is
      unhandled, so bun marks the running test failed. The uncaught error also
      bypasses the `finally` dispose blocks, leaking one tmp/tmpdir/gh277-* root
      per failing run (8 leaked dirs observed after 8/16 failures). Because pnpm
      check runs pnpm test, this makes the mandatory aggregate gate (NFR-9,
      DoD-12) nondeterministic at the delivered HEAD and the recorded P4 green
      aggregate not reliably reproducible. It is not a remediation regression
      (the pre-remediation fixture flaked 5/12 vs 4/12 interleaved), but it does
      ship with this change's new suite.
    suggestion: >-
      Durable fix (recommended, in the spirit of the change's harness-spawn
      reliability goal): add a no-op/classified `child.stdin?.on("error", ...)`
      handler in packages/adapters/src/host/index.ts at both write sites so an
      early-exiting harness child yields a classified spawn failure instead of an
      uncaught crash; this also protects the production path when a real
      `opencode` child exits before reading its prompt. Minimal test-only fix if
      the adapter is out of scope: make the synthetic script drain stdin before
      exiting (for example `process.stdin.resume()` and exit on `end`, mirroring a
      real harness child) so no write races a closed pipe. After either change,
      run the suite at least ~20 times (TMPDIR=$PWD/tmp/tmpdir bun test
      tests/behaviour/dispatch-harness-default-detail.test.ts) and confirm 0
      failures and no leaked tmp/tmpdir/gh277-* directories.
    suppressed: false
