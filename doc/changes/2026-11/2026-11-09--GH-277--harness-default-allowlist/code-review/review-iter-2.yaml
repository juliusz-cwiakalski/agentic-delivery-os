  guard) intermittently raises on the closed pipe, and the uncaught exception
  also skips `dispose()` in `finally`, leaking a tmp/tmpdir root per failure. This
  makes the required aggregate gate (pnpm test inside pnpm check, NFR-9/DoD-12)
  nondeterministic and the recorded P4 "green aggregate" not reproducible. The
  flake predates the remediation commit (pre-remediation fixture flaked 5/12 vs
  HEAD 4/12 interleaved), so it is not a remediation regression, but it is
  introduced by this change's new fixture/suite and blocks a reliable green gate.
