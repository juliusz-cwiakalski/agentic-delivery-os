    location: packages/core/src/domain/commit-message.ts:21
    message: >-
      The remediation commit body (9a23c8c2) reads "Cover the host child-stdin
      early-close guard (TC-)" with the test-case id missing. Root cause is the
      commit primitive's `stripInventedRefs`, whose TRACKER_REF
      (`\b[A-Z][A-Z0-9]*-\d+\b`) strips `HDA-036` out of `TC-HDA-036`; a
      read-only probe reproduces "Cover the guard (TC-HDA-036)" → "Cover the
      guard (TC-)". Any `TC-*-NNN` id is therefore erased from a commit body.
      The primitive predates GH-277 and is not changed here, but this change's
      commit traceability is degraded.
    suggestion: >-
      Cite TC-HDA-036 in the PR description and pm-notes (no sanitizer runs
      there), and open a follow-up ticket to preserve `TC-*` test-case ids in
      `stripInventedRefs` (skip a match preceded by "TC-", or exclude a known
      TC-prefix list) with a regression test. Do not block GH-277 on this.
    suppressed: false
