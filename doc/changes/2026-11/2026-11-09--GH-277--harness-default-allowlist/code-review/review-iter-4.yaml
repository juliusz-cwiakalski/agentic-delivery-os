  - id: F-4
    severity: low
    confidence: medium
    category: reliability
    location: packages/adapters/src/host/index.ts:271
    message: >-
      The streaming starter's non-`EPIPE` stdin handler ends the channel and
      completes `{ status: 127 }` but does not stop the child, whereas the
      one-shot runner's handler (lines 79-83) calls `child.kill()` before
      resolving. For a non-`EPIPE` stdin error after handle acquisition (child
      already running), `complete()` clears the handle/session timers and the
      caller's `collect` returns status 127 while the child can keep running
      until it exits on its own; the isolated EIO leg asserts only the completed
      result, not an absent child. `EPIPE` (the realistic early-close case) is
      unaffected because the close path ends the process, so this is an
      asymmetry, not a regression of the accepted fix.
    suggestion: >-
      Mirror the runner by calling `kill()` (or `child.kill()`) before `complete`
      in the starter's non-`EPIPE` branch — `complete` is idempotent, so a later
      close cannot overwrite 127 — or document the deliberate difference and add
      an orphan/`killed` assertion to the isolated EIO leg.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
