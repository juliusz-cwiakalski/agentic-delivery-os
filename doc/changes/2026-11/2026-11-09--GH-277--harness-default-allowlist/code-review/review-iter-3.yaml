summary: >-
  Iteration-3 verification confirms the N-1 remediation is real and durable. The
  host adapter now observes child.stdin at both write sites before the prompt is
  written (packages/adapters/src/host/index.ts:79, :271), the synthetic child
  drains stdin (tests/fixtures/harness/default-spawn.ts:78-81), and the probe
  evidence reproduces: the TC-HDA-035 suite ran 20/20 with 12 pass and 0 fail per
  run and no leaked tmp/tmpdir/gh277-default-spawn-* root; a control probe that
  keeps the pre-fix shape (no stdin error handler) raised EPIPE on every one of 8
  attempts, while the delivered seams returned status 0 on every one of 5
  attempts with no uncaught error. N-2 is closed (test plan v1.5, front-matter
  last_updated, and a §Revision History 1.5 row) and N-3 is recorded (pm-notes
  phase-8 entry naming the authored-draft transport, the lost messageSource
  fidelity, and the reset-soft re-invocation of the unpushed local commit). No
  regression: plan validate valid/readyForDevelopment, pnpm typecheck exit 0,
  pnpm check:boundaries exit 0 (356 modules), and TMPDIR=$PWD/tmp/tmpdir pnpm
  check exit 0 with 6614 pass / 4 skip / 0 fail across 782 files. The change is
  nonetheless not PASS: the durable fix modifies both host seams, which change
  spec v1.4 explicitly lists as out of scope (§7.2: "Changes to the harness
  session port, the streaming starter, the one-shot runner, or the classifier")
  and describes as unchanged (AC-F4-1, §21), and neither the spec, the test-plan
  file inventory, nor the plan phase scopes were amended for the review-mandated
  extension; additionally the new stdin-error branches have no test because the
  corrected fixture drains stdin. Both are artifact/coverage gaps, not code
  defects: do not revert the adapter guard, amend the spec/test plan and add a
  guard test.
