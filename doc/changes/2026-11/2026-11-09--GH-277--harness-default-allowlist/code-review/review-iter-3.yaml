    message: >-
      The two new stdin-error branches have no test. The runner handler at :79
      (ignore EPIPE; otherwise kill and resolve status 127) and the starter
      handler at :271 (ignore EPIPE; otherwise end the channel and complete with
      status 127) are now unreachable from the suite because the synthetic child
      in tests/fixtures/harness/default-spawn.ts:78-81 drains stdin, and no other
      harness suite writes a prompt to a child that closes stdin early
      (tests/behaviour/harness-host-stream.test.ts passes no stdin at all). Test
      plan v1.5 records the guard only in prose in its revision row and states
      "no ... coverage row ... changed", so a future edit can delete or weaken
      the guard with every gate still green.
    suggestion: >-
      Add a regression case in tests/behaviour/harness-host-stream.test.ts (the
      suite already allowed to use process.execPath) and an equivalent runner
      case: spawn a child that exits without reading stdin, write a prompt larger
      than the pipe buffer (for example 1 MiB), and assert no uncaught error and
      the classified status (close status for the EPIPE case). Record it in the
      test-plan §6.4 regression runs and the §Revision History 1.5 row. My
      read-only probe shows the shape is feasible and deterministic: the pre-fix
      control raised EPIPE 8/8 and the guarded seams returned status 0 5/5.
