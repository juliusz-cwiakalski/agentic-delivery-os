      the binding change artifacts were not reconciled, so the spec now
      contradicts the delivered tree. That fails AC-F4-1 as written (DoD-1 binds
      all 29 ACs) and leaves a stale claim the DoD-9 current-truth check can
      reopen; the system spec (doc/spec/features/feature-harness-adapters.md §6)
      also still describes the seams without the stdin early-exit observation.
    suggestion: >-
