decisions:
  - text: "DEC-1: default allowlist becomes PATH and HOME required, TMPDIR optional,
      DELIVERY_WORK_PATH required and injected by composition."
    date: "2026-11-09"
  - text: "DEC-2: drop HARNESS_MODEL/HARNESS_SMALL_MODEL from the default required
      set; no OC_ADOS_* mapping because no production code consumes the
      HARNESS_* names and opencode resolves models from its own configuration."
    date: "2026-11-09"
  - text: "DEC-3: additive optional marker on a variable allowlist entry only;
      credentials stay required. Governed by TDR-0017."
    date: "2026-11-09"
  - text: "DEC-4: keep dispatch.session.spawn-failed identity and the four-key text
      contract; add an additive DispatchEnvelopeError.detail carrying the
      underlying harness kind/code/field."
    date: "2026-11-09"
  - text: "DEC-5: version_impact minor; exactly one added changeset declaring the
      five fixed-group packages at minor."
    date: "2026-11-09"
open_questions:
  - id: OQ-1
    text: "Does the additive optional marker on the harness environment contract
      require a standalone decision record under the delivered additive
      adapter-contract rule (TDR-0008, TDR-0016), or is the change decision log
      sufficient? The marker is type-only, additive, and reversible, but
      TDR-0016 states that adding types to
      packages/core/src/contracts/harness.ts is the class the record-governed
      rule covers."
    status: "Resolved 2026-11-09: a standalone record is required; TDR-0017 authored
      (status Proposed, owner acceptance at the GH-277 PR review). Spec DEC-3
      and §13 cite it."
    date: "2026-11-09"
  - id: OQ-2
    text: "Does opencode require any environment variable beyond PATH, HOME, and
      optionally TMPDIR to boot on the supported POSIX profile? The bounded real
      dispatch proof is the evidence source; any discovered required variable
      must join the default set before delivery closes."
    status: "Open, evidence needed from the real dispatch proof; non-blocking for
      specification."
    date: "2026-11-09"
