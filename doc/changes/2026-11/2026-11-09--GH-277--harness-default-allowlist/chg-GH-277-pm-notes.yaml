  - id: OQ-2
    text: "Does opencode require any environment variable beyond PATH, HOME, and
      optionally TMPDIR to boot on the supported POSIX profile? The bounded real
      dispatch proof is the evidence source; any discovered required variable
      must join the default set before delivery closes."
    status: "Open, evidence needed from the real dispatch proof; non-blocking for
