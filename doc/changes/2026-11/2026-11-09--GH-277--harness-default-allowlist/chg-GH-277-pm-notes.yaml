    date: "2026-11-09"
blockers: []
notes:
  - text: "Clarify scope: the ticket is prescriptive and consistent with the
      delivered behaviour. Confirmed in source: (a) PRODUCTION_DEFAULTS
      harness.environment declares HARNESS_MODEL, HARNESS_SMALL_MODEL and
      DELIVERY_WORK_PATH only (packages/core/src/config/defaults.ts:58-62), so
      PATH and HOME are never in the child environment; (b) no code in the repo
      consumes HARNESS_MODEL/HARNESS_SMALL_MODEL, and production composition
      supplies DELIVERY_WORK_PATH through the validated record
      (packages/cli/src/production.ts:441-447); (c) buildHarnessSpawnEnvironment
      fails closed on the first absent declared variable with
      harness.spawn.variable-missing and the field name
      (packages/core/src/domain/harness-spawn-env.ts:46-57); (d) dispatch
      collapses every session-failure to dispatch.session.spawn-failed with the
      fixed message 'spawn failed before a session existed' and no underlying
      code/field (packages/core/src/app/dispatch.ts:466-485); (e) text mode
      renders only result/pr_url/exit_code/last_message
      (packages/cli/src/output/dispatch-text.ts:28-34). No blocking question:
      required behaviour, error identity and acceptance are stated."
    type: info
    date: "2026-11-09"
  - text: "Design latitude recorded for the spec: the ticket permits either mapping
      HARNESS_MODEL/HARNESS_SMALL_MODEL from the real OC_ADOS_* names or
      dropping them from the required set. No repository code consumes the
      HARNESS_* names and opencode resolves models from its own configuration,
      so the default allowlist fix must not fabricate an unused mapping; the
      spec should choose one direction with the rationale recorded. Required vs
      optional entry support is also in scope only if a declared entry may
      legitimately be absent (TMPDIR on Linux is the likely case)."
    type: decision
    date: "2026-11-09"
  - text: "Doc impact to reconcile in phase 7:
      doc/spec/features/feature-config-layer.md harness.environment default
      table (~line 259), feature-harness-adapters.md §1/§4 (deny-by-default
      descriptor and configuration), feature-dispatch-engine.md (spawn-failure
      error detail), and any contract/golden fixture that pins the default
      allowlist or the spawn-failed envelope."
    type: info
    date: "2026-11-09"
