open_questions:
  - id: OQ-1
    text: "Does the additive optional marker on the harness environment contract
      require a standalone decision record under the delivered additive
      adapter-contract rule (TDR-0008, TDR-0016), or is the change decision log
      sufficient? The marker is type-only, additive, and reversible, but
