  # ---------------------------------------------------------------------------
  # Phase 3 — Derived aging and explicit two-plane closure (F-3, F-4; DEC-3,
  # DEC-4, DEC-9, DEC-11; SC-M2-S10-02).
  #
  # Goal: make drift visible and closure explicit. The aging projection is a
  # pure function of the recorded filing timestamp (the ONE declared basis —
  # time open since filing, DEC-9), the due-date lapse counter (due dates feed
  # ONLY the miss counter), the injected clock, and the contract constants:
  # `current` at day 0 and 13, `nudged` at 14/15/29, `escalated` at 30/31 or
  # on the second lapse event at any age — exact at both boundaries, evaluated
  # at read/render time, never stored, zero ambient clock reads (matrix
  # A-01..A-11). Closure is explicit-only with three routes (done + artifact,
  # deprioritized + reason, superseded + successor): every attempt without the
  # decision or the route's justification is refused under
  # `retro.closure-incomplete` naming what is missing and transitions nothing
  # (C-01..C-06). The pinned SC-M2-S10-02 holds: done closes the artifact
  # plane only — `artifactClosure == "closed"`, `outcomeClosure == "open"`
  # with the non-null verification window — and outcome closure happens ONLY
  # through an explicit decision citing in-window verifier evidence, never
  # from elapsed time or artifact closure (C-07, C-10, C-11). The
  # deprioritized and superseded routes close BOTH planes in the one decision
  # — the reason or the superseding action reference (recorded on the closure
  # record) is each plane's justification, the window mooted by the decision
  # and not by time (C-08, C-09, TC-ACTION-038). A closure decision targeting
  # an already-closed plane is refused as a state conflict under the same
  # identity naming the plane and its existing closure, with no second
