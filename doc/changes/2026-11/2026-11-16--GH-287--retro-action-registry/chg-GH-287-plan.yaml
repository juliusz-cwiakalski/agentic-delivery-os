  # error rows (F-1/F-2/F-3/F-4/F-5 vocabulary half; DEC-5, DEC-8, NFR-8).
  #
  # Goal: land the single contract home every later phase asserts through —
  # packages/core/src/contracts/action.ts — declaring: the closed
  # verifiable-verb vocabulary (add/remove/change/test/deploy; "review" and
  # "improve" refused), the owner kinds (agent role or human; team-owned
  # refused), the five-field contract plus verification artifact, outcome
  # verifier (non-null delayed metric window) and rollback condition members,
  # the record kinds `retro.action`/`retro.action-closure` under the
  # `retro.actions:`/`retro.action-closures:` prefixes, the payload schema ids
  # `delivery.retro.action.v1`/`delivery.retro.action-closure.v1`, the aging
  # constants (14-day nudge, 30-day escalation, the ONE aging-basis constant —
  # time open since the recorded filing timestamp — and the two-lapse
  # second-miss rule, DEC-9), the aging-state vocabulary
  # (current/nudged/escalated), the WIP-limit constant 3 (DEC-6), the closure
  # routes (done/deprioritized/superseded), the closure planes and their
  # open/closed states plus the open/elapsed/mooted window vocabulary
  # (DEC-11), the three refusal identities, the free-text bounds, and the
  # board actions-row member set (DM-4). No behaviour changes: no boundary
  # exists, no verb is mounted, no board key moves.
  #
  # The error table grows 4 -> 7 additive exact two-segment rows under the
  # delivered `retro` domain kind (DEC-5) with the declared metadata (category
  # `user`, retryable `false`, consequence `not_landed`, projection
  # `user-validation`), and — the GH-291 early-doc-edit discipline — the
  # machine rows, the documented rows in feature-result-contract.md, the
  # structure counts, the corpora, and the two-way sync check all move in this
  # ONE commit or the gate is red.
  #
  # AC/TC coverage: AC-N8-1 (TC-ACTION-026); declares the vocabulary for
  # F-1..F-7; proves the constants half of TC-ACTION-036 (owned by Phase 9).
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/structure/action-contract.test.ts tests/structure/action-imports.test.ts
  #   bun test tests/structure/{error-table,retro-contract,content-inventory}.test.ts
  #   bun test tests/checks/error-table-sync.test.ts
  #   bun run scripts/checks/error-table-sync.ts
  #
  # Suites left green: action-contract (constants half), action-imports
  #   (static half), error-table (7 rows, delivered four byte-unchanged),
  #   retro-contract (delivered control), content-inventory, error-table-sync
