  # stored actions, injected clock, and injected run id; zero model calls;
  # refusal envelopes deterministic; shuffled-append permutation invariance;
  # zero ambient clock/random reads (TC-ACTION-027). Bounds: measured UTF-8
  # bytes <= 65,536 with marked truncation and counted omissions; over-long
  # free text refused naming the bound, in-bounds text stored unnormalized
  # (TC-ACTION-028). Write discipline: exactly one fenced append per file,
  # close, and supersede invocation with the injected fence token; zero
  # appends on list/board/report; no update-in-place, no delete; a torn
  # append classifies `state.*` and leaves the store consistent
  # (TC-ACTION-029). Read cost: one bounded registry read per board
  # invocation, pure projection, no per-row re-reads, the bounded-work oracle
  # as the CI gate and the wall-clock median recorded in the test plan §10 log
  # as a reference measurement only (TC-ACTION-030, GAP-3). Privacy: canary
  # secrets placed in adjacent fields appear nowhere in records, envelopes, or
  # rendered rows; the redaction chokepoint composes on every new path; the
  # clean control renders unchanged (TC-ACTION-031). Hermeticity: the new
  # suites contain no skip, socket, spawn, `$HOME` read, live store, or
  # credential access, and a planted violation fails the scan (TC-ACTION-032,
  # D-26). Disclosure and audit: every refusal names the specific member (or
  # the plane and its existing closure for the state conflict), aging state
  # and window count/limit render in-band on every surface, one command-audit
  # record per invocation, and an audit-write failure never changes the
  # outcome (TC-ACTION-035). The mutant meta-suite disables every honesty
  # rule — the 23 declared mutants (a)..(w) including the aging-basis mix, the
  # done-route outcome side effect, the elapsed-window closure, the WIP warn,
  # the owner inference, the verdict-from-owner-claim, the artifact-plane-only
  # both-plane routes, and the repeat-closure acceptance — and each must fail
  # while the real modules pass (TC-ACTION-033). The delivered retro,
  # ceremony, board, and error-table suites re-run green with only the
  # declared D-row moves: the change is strictly additive (TC-ACTION-037).
