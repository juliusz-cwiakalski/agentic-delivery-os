# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly.
#
# SOURCES (single source of truth):
#   - Spec:     ./chg-GH-287-spec.md (v1.2, 15 ACs — AC-F1-1, AC-F1-2, AC-F2-1,
#               AC-F3-1, AC-F4-1..5, AC-F5-1, AC-F6-1..2, AC-F7-1..2, AC-N8-1;
#               F-1..F-7; DM-1..DM-5; NFR-1..NFR-8; DEC-1..DEC-11 (all
#               resolved); RSK-1..RSK-7; §7.1 in-scope incl. planning-page
#               maintenance; §8.5 additive compatibility; §16 affected
#               components; §17 AC table; Appendix B pinned scenarios
#               SC-M2-S10-01/02; Appendix C concept constraints). Key
#               adjudications this plan consumes as pinned: DEC-3 derived
#               aging, no scheduler; DEC-4 outcome closure explicit only;
#               DEC-5 exactly three additive error rows under the `retro`
#               domain kind; DEC-6 WIP limit = 3, fixed contract data, filing
#               at the limit refused; DEC-7 own validated boundary with
#               `retro.action`/`retro.action-closure` kinds under
#               `retro.actions:`/`retro.action-closures:` prefixes, filing
#               surface = additive `action` verb group inside the `retro`
#               family, doctor action-registry store verdict; DEC-8
#               action-incomplete covers missing OR non-conforming fields;
#               DEC-9 aging basis = time open since the recorded filing
#               timestamp, second miss = second missed due date; DEC-10 no new
#               top-level retro report key, registry feeds the delivered
#               followThrough[] fold; DEC-11 deprioritize/supersede close both
#               planes, repeat closure refused, supersede records the
#               superseding reference.
#   - Tests:    ./chg-GH-287-test-plan.md (v1.1, 39 TCs TC-ACTION-001..039;
#               15/15 AC coverage; filing refusal matrix R-01..R-12; aging
#               boundary matrix A-01..A-11; closure matrix C-01..C-14; exit
#               and identity oracle §4.3; binding fixture contract §4.1;
#               non-vacuity contract §4.2; §4 layer table; §7 automation map;
#               §4.4 declared delivered-suite drift register D-1..D-28; gaps
#               GAP-1..GAP-6; open questions OQ-T1..T8 all resolved). GAP-1
#               (this plan's TC mapping) is satisfied below WITHOUT reshaping
#               any TC's behavior, oracle, identity, exit, bound, or AC/NFR
#               mapping; no TC id changes.
#   - PM record: ./chg-GH-287-pm-notes.yaml (DEC-5/6/7 adjudications with the
#               plan-writer ripples resolved in the PLAN-LEVEL REFINEMENTS
#               block below; DEC-1/DEC-2 scope exclusions stated in the PR
#               description; delivery conventions — `TMPDIR=$PWD/tmp/tmpdir
#               pnpm check`, PR targets `main-tools`, conventional subjects,
#               body/footer lines <= 100 chars).
#   - Schema:   doc/spec/features/feature-plan-schema.md (scope keys
#               files/packages/folders, doneArtifacts slots, leases,
#               weightClass, interactions, tier; no tasks key, no progress
#               log).
#   - Precedent: ./2026-11-12--GH-291--telemetry-v2/chg-GH-291-plan.yaml (the
#               canonical sibling: phase ceremony, early error-table doc edit,
#               drift declaration, honesty battery, phase-8 release pattern)
#               and ./2026-11-15--GH-297--board/chg-GH-297-plan.yaml (board
#               shared-source patterns this change extends).
#
# PLAN-LEVEL REFINEMENTS (GAP-4 and GAP-6 / OQ-T2 and OQ-T4, owner
# @plan-writer — recorded here as this plan's design decisions; the spec pins
# only `data.artifactClosure`, `data.outcomeClosure`, the three `error.code`
# literals, and `actions[]` emptiness, and TC-ACTION-036 pins everything below
# through the declared contract constants, never ad-hoc literals):
#   1. VERB GRAMMAR (DEC-7): the filing surface is the additive `action` verb
#      group inside the delivered `retro` command family, pinned as exactly
#      three verbs: `retro action file`, `retro action close`, `retro action
#      list`. `retro collect` and `retro report` keep their grammar and
#      semantics byte-for-byte; no new command family joins the
#      prompt-required set. Flag-level argument shapes (owner, owner-kind,
#      verb, measurable outcome, tracker entry, due date, verification
#      artifact, outcome-verifier window, rollback condition, level, window,
#      closure route, decision reference, justification) are single-home
#      contract constants in packages/core/src/contracts/action.ts, asserted
#      once by TC-ACTION-036's structural scan — never re-derived per suite.
#   2. LIST-SURFACE DATA KEY (GAP-4): `retro action list` exposes the recorded
#      actions under `data.actions` — the `actions[]` the pinned scenario
#      SC-M2-S10-01 asserts empty after a refused filing. Each entry carries
#      identity, owner, verb, level, improvement window, age, aging state, the
#      two closure planes, and the window count/limit disclosure (DM-5).
#   3. PAYLOAD SCHEMA IDS (pinned naming, brand-neutral per §21): the action
#      record carries `delivery.retro.action.v1`; the closure record carries
#      `delivery.retro.action-closure.v1`. Record kinds `retro.action` and
#      `retro.action-closure` live under the store-scoped key prefixes
#      `retro.actions:` and `retro.action-closures:` in the change's own
#      validated boundary (DEC-7); the delivered retro-registry boundary and
#      its "exactly three" declaration are unchanged.
#   4. CLOSURE-PLANE TOKENS: the two planes are `artifactClosure` and
#      `outcomeClosure` with the state vocabulary `open` | `closed` (the two
#      pinned literals of SC-M2-S10-02); the verification-window state
#      vocabulary is `open` | `elapsed` | `mooted`, where `mooted` is the
#      recorded consequence of the one both-plane decision on the
#      deprioritized/superseded routes (DEC-11, TC-ACTION-038).
#   5. ERROR-ROW METADATA for the three additive exact rows (DEC-5, TC-ACTION-
#      026 asserts the complete set): all three carry domainKind `retro`,
#      category `user`, retryable `false`, consequence `not_landed`,
#      projectionClass `user-validation` — refusal semantics, exit 1, nothing
#      landed — each with a remediation hint naming the missing/offending
#      member (or, for the already-closed-plane conflict detail, the plane and
#      its existing closure decision) and a one-line summary; the delivered
#      four `retro` rows keep their codes, category, consequence, and
#      projection byte-unchanged.
#   6. DOCTOR VERDICT NAME (DEC-7): the doctor state check gains one additive
#      per-store fact `{ name: "action-registry", verdict }` in its evidence,
#      composed at the CLI edge exactly like the delivered `retro-registry`
#      store fact; the closed area list is unchanged (D-15/D-16 declare only
#      the store-count/detail and evidence-source-id moves).
#   7. BOARD SURFACE SHAPE (GAP-6/OQ-T4): the actions surface is a fifth
#      declared section labeled `ACTIONS`, rendered immediately after `ASKS`
#      and before `PARKED`, additive under the kept `delivery.board.v1`
#      payload identity; the four delivered labels keep their order and
#      semantics. Rows carry identity, repository, action reference, owner,
#      level, age (milliseconds, the delivered ask-age pattern), and aging
#      state, under a per-repository cap with counted omissions and a declared
#      byte-guard drop-order step; the surface reads the registry through one
#      named source composed at the edge.
#   8. HELP-GUIDE COVERAGE + M2 REFERENCE PAGE (pm-notes ripple):
#      tests/fixtures/help-guide/coverage.json gains the row
#      `doc/planning/oss-tooling/milestones/m2/commands/retro.md` (new page)
#      beside the byte-unchanged M1 snapshot row; the page documents the
#      extended retro family (`collect`, `report`, `action file|close|list`)
#      and lands in the same commit as the grammar so the coverage and parity
#      guards stay green.
#
# PHASE ORDERING AND TESTABILITY:
#   Each phase is one commit on `feat/GH-287/retro-action-registry` whose
#   declared narrow gate is green at the boundary. Phase 1 lands the authored
#   contract declaration every later phase asserts through, plus the three
#   error rows with the machine/documented/classifier sync in ONE commit (the
#   GH-291 early-doc-edit discipline: error-table code rows + the documented
#   table in feature-result-contract.md + the structure counts move together
#   or the sync gate is red). Phase 2 lands the validated boundary with the
#   filing gate and the WIP limit — TC-ACTION-001..005/014..016 observe stored
#   records through the composed runtime, so validation, records, and the
#   window projection land together. Phase 3 lands the derived aging ladder
#   and the explicit two-plane closure. Phase 4 lands boundary-damage
#   classification and the doctor store verdict. Phase 5 mounts the CLI verb
#   group with the help surface and the M2 reference page (grammar and page
#   land together so help-guide coverage stays green). Phase 6 renders the
#   board actions surface with every declared board drift row. Phase 7 makes
#   the registry the follow-through producer for the ceremony retro-evidence
#   pass and the retro report fold. Phase 8 is the cross-cutting honesty
#   battery — the mutant meta-suite, the hermetic scan, and the disclosure
#   suite need every production module and all render paths to exist, and
#   TC-ACTION-037's additive proof needs every consumer landed. Phase 9
#   reconciles docs and the planning corpus, stages the changeset, and
#   declares the release obligations; the final gate runs `plan validate
#   GH-287` and the full battery.
#
# DELIVERED-SUITE DRIFT (test plan §4.4 D-1..D-28, declared not discovered):
#   Every D-row's file is declared in a phase scope so the commit primitive's
#   plan-union scope accepts the deliberate move; goldens regenerate by
#   explicit command, never blanket rewrite; D-row commits name the rows in
#   the body. Mapping: D-1..D-4 Phase 1; D-21..D-23 Phase 2 (D-21 continues
#   in every phase adding files); D-13(closure-half) Phase 3; D-14..D-16
#   Phase 4; D-17..D-20 Phase 5; D-5..D-10, D-27, D-28 Phase 6; D-11(stands
#   unchanged)/D-12/D-13(fold-half) Phase 7; D-24(literal halves), D-26
#   Phase 8; D-24(doc-conformance phrase table), D-25 Phase 9. D-11 is a
#   declared NO-MOVE: the exact-four-keys assertion on `retro report` data
#   stands (DEC-10); a registry-derived top-level key would be a spec
#   violation, not a drift row.
#
# DECLARED CONTROLS, NOT EDITS: the delivered regression suites below are
#   re-run in phase gates as controls and are NOT edited, so none is declared
#   in a phase scope: tests/behaviour/{retro-levels,retro-registry,retro-
#   privacy,retro-hermetic,retro-performance,retro-report-determinism,retro-
#   telemetry-evidence}.test.ts, tests/behaviour/ceremony-flow-retro.test.ts,
#   the delivered board suites not named in §4.4, tests/checks/fixture-
#   privacy.test.ts, and tests/checks/retro-{key-containment,render-purity,
#   truth-check-mutants}.test.ts. A semantic assertion change in any delivered
#   suite outside the D-rows above is the escalation trigger the tier
#   reserves. An untouched declared file is only a `plan diff` observation,
#   never a gate failure (GH-291 scope convention).
#
# TC -> PHASE MAP (39 ids = TC-ACTION-001..039; every id is owned by exactly
#   one phase — the phase which first makes its complete suite set green.
#   Suite halves proven earlier are named in that phase's gate and `Suites
#   left green` line without a second TC row):
#   Phase 1 contracts/error rows (1): TC-ACTION-026
#   Phase 2 boundary/filing/WIP (8): TC-ACTION-001, 002, 003, 004, 005,
#            014, 015, 016
#   Phase 3 aging/closure (10): TC-ACTION-006, 007, 008, 009, 010, 011,
#            012, 013, 038, 039
#   Phase 4 boundary damage/doctor (1): TC-ACTION-034
#   Phase 5 CLI verb group (0): none (the grammar/help/reference-page halves
#            of TC-ACTION-036 are proven green here; TC-ACTION-036 is owned
#            by Phase 9 once its doc-conformance and planning-pages halves
#            complete; TC-ACTION-010's golden echo lands here because the
#            action argv becomes executable — the pinned assertions are owned
#            green by Phase 3's closure suite)
#   Phase 6 board actions surface (5): TC-ACTION-017, 018, 019, 020, 021
#   Phase 7 follow-through producers (4): TC-ACTION-022, 023, 024, 025
#   Phase 8 honesty battery (9): TC-ACTION-027, 028, 029, 030, 031, 032,
#            033, 035, 037
#   Phase 9 docs/release (1): TC-ACTION-036
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`), matching the
#   GH-291/GH-296/GH-297 precedent. No new package dependency, no data
#   migration (the registry starts empty; no backfill — NG-9), no
#   schema-version bump (DEC-7), no scheduler or background process (DEC-3).
#
# COMMIT DISCIPLINE (pm-notes delivery conventions): conventional subjects
#   <= 72 chars; body and footer lines <= 100 chars; commits through the
#   commit primitive against this plan's phase scope; PR targets `main-tools`
#   and states the two scope exclusions (DEC-1, DEC-2) in the description.

schemaVersion: delivery.plan.v1
workItemRef: GH-287
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  escalationTriggers:
    - "A fourth `retro` error identity, a family/pattern widening, or a new domain kind would be required; the delivered four `retro` rows would change code, category, consequence, or projection (DEC-5, DEC-8)"
    - "The WIP limit would become per-window declared data or a recorded warning instead of the fixed contract-data value 3 enforced as a classified refusal (DEC-6)"
    - "The delivered retro-registry boundary's exactly-three record kinds, the `delivery.retro.report.v1` identity, or the report's four top-level data keys would change (DEC-7, DEC-10)"
    - "The aging basis would fork from time open since the recorded filing timestamp, a second basis constant would appear, or due dates would feed the day thresholds (DEC-9, NFR-3)"
    - "Outcome closure would result from elapsed time on any route, a closure route's plane effects would diverge from DEC-11, or a repeat closure on a closed plane would append a second record"
    - "Aging, nudging, or escalation would need a scheduler, daemon, timer, or any background write (DEC-3, NG-6)"
    - "The board payload identity would change, a delivered section/cap/label would move beyond the declared D-5..D-10 drift, or the actions surface would need a second state vocabulary (F-6, RSK-4)"
    - "Ceremony declarations, agendas, the note schema, or the asserted follow-through-first position would need changes instead of additive reader composition (NG-4)"
    - "The `action` surface would require a new command family instead of the additive verb group inside the delivered `retro` family (DEC-7)"
    - "A delivered suite would need a semantic assertion change outside the §4.4 D-rows this plan declares, or a golden would need regeneration outside the explicit commands"
    - "Backfill, import, or migration of historical retro actions would be required (NG-9)"
    - "Tracker corroboration would need live network access on any test or render path instead of the injected read seam (NFR-4, §8.4)"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
