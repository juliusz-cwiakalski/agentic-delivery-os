  # Phase 2 — The validated boundary, the filing gate, and the WIP limit
  # (F-1, F-2, F-5; DEC-6, DEC-7, DEC-8; SC-M2-S10-01).
  #
  # Goal: make an action record exist only through validated filing. The new
  # boundary packages/core/src/state/action-registry.ts composes the reusable
  # artifact-boundary factory over the public state port with exactly the two
  # record kinds under the two declared prefixes — the delivered
