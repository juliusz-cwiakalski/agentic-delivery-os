  # ---------------------------------------------------------------------------
  # Phase 8 — The cross-cutting honesty battery (NFR-1..NFR-8; TC-ACTION-033
  # mutants; TC-ACTION-037 additive proof).
  #
  # Goal: pin the rules that span paths and modules. Determinism and purity:
