decisions:
  - text: "Spec OQ-1..OQ-3 adjudicated change-scoped via @decision-advisor, baked
      into spec as DEC-5..DEC-7 (GH-291 precedent; none system-wide — no
      doc/decisions records). DEC-5: exactly three additive two-segment rows
      under the delivered retro domain kind (retro.action-incomplete
      blueprint-pinned, retro.closure-incomplete, retro.wip-limit-exceeded); no
      new domain kind; 4->7 rows with two-way sync in-change. DEC-6: improvement
      WIP limit = 3 as one fixed contract-data constant; filing into a window at
      its limit refused (exit 1, retro.wip-limit-exceeded naming
      window/count/limit), never a warning outcome; deprioritize/supersede free
      slots. DEC-7: own validated state-store boundary — new record kinds
      retro.action + retro.action-closure under
      retro.actions:/retro.action-closures: prefixes, delivered retro-registry
      boundary's 'exactly three' unchanged; filing surface = additive `action`
      verb group inside the delivered retro family (no new command family);
      doctor gains an action-registry store verdict. Plan-writer ripples: exact
      verb grammar, payload schema ids, error-row metadata, doctor verdict name,
      help-guide coverage + m2 reference page updates."
    date: "2026-11-16"
  - text: "Specification reopened once (reopen-on-gap): test-plan-writer traced five
      spec ambiguities (OQ-T3 contract-rule refusal identity vs DEC-5
      exactly-three rule; OQ-T6 aging basis unpinned; OQ-T5 stray NFR-8 links;
      OQ-T7 retro-report data-key question; OQ-T8 closure edge cases).
      Re-delegated to @decision-advisor; pinned as DEC-8..DEC-11: DEC-8 =
      retro.action-incomplete covers missing OR contract-non-conforming fields
      (no fourth identity); DEC-9 = aging basis is time-open-since-filing,
      second miss = second missed due date; DEC-10 = registry feeds delivered
      followThrough[] fold, no new top-level retro report key; DEC-11 =
      deprioritize/supersede close both planes by one explicit decision, repeat
      closure on a closed plane refused under retro.closure-incomplete naming
      plane+existing closure, supersede records superseding reference. AC set
      now 15 (AC-F4-4/F4-5 added). Exactly- three identity rule intact."
    date: "2026-11-16"
  - text: "Retro: the reopen-on-gap loop worked as designed but cost one phase
      round-trip; the contract-rule-refusal ambiguity (OQ-T3) was latent in
      DEC-5 from the first adjudication — decision prompts should ask the
      adjudicator to sweep ALL refusal-triggering spec wording (not just the
      named scenarios) against the declared identity set to catch classification
      gaps in one pass."
    type: retro
    date: "2026-11-16"
