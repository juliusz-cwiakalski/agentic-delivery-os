  - text: "Concept constraints from concepts/retrospectives.md: five-field contract
      = named owner (agent role or human) + verifiable verb
      (add/remove/change/test/ deploy — never 'review'/'improve') + measurable
      outcome + real tracker entry + due date, plus verification artifact;
      team-owned actions invalid. Aging: nudge at 14 days, escalate at 30 or on
      second miss. Closure only explicit: done with artifact, deprioritized with
      reason, superseded. WIP limit: at most 1-3 actions per window. Outcome
      verifier = delayed metric window; rollback condition required; artifact
      closure distinguished from outcome closure. Actions surface on the board
      next to owner asks."
    type: info
    date: "2026-11-16"
  - text: "Delivery conventions from ticket: full 11-phase lifecycle; plan phases
