      probe); quality gate runs with TMPDIR=$PWD/tmp/tmpdir."
    type: info
    date: "2026-11-16"
  - text: "Retro: fresh-checkout worktree had no built dist/ — the first lifecycle
      invocation failed (Cannot find module '@delivery-os/adapters/credentials';
      subpath exports point at ./dist). Fixed by one `pnpm -r build` before the
      phase primitive; also learned ~/.local/bin/jaiship can dangle to another
      worktree, so use `bun packages/cli/bin/jaiship.ts` directly. Cost: one
      extra runner round-trip. Lesson: new-session lifecycle setup = PATH prefix
      + `pnpm -r build` first."
    type: retro
