    location: packages/core/src/domain/action-filing.ts:259
    message: >-
      The WIP-limit check is read-then-append rather than one fenced transaction:
      `fileRetroAction` reads the registry before acquiring the append fence, so
      two concurrent CLI invocations into the same window can both pass the check
      and both append, exceeding the limit. Consistent with the delivered
      single-writer convention (NFR-5 requires fenced appends, not
      transactional check-and-append) and unreachable in one-shot single-user use.
    suggestion: >-
      Note as a known concurrency bound of the delivered pattern; a future change
      could re-check inside the fence if multi-writer filing ever becomes a
      supported mode.
