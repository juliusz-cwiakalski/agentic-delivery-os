findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/cli/src/edge.ts:5153
    message: >-
      The production composition never wires the action identity seams. The edge
      falls back to a per-process counter (`action-${actionSeq}` at edge.ts:5153,
      `closure-${closureSeq}` at :5171), and packages/cli/src/production.ts:3155-3165
      composes the retro runtime without `newActionId`/`newClosureId` while it does
      pass `newRunId`/`newTraceId` as UUIDs. Every one-shot CLI process therefore
      files its first (and only) action as `action-1`: from the second `retro action
      file` invocation onward the registry holds duplicate identities. Empirically
      reproduced against a real store — both appends land (the state ledger has no
      duplicate-record-key refusal) and `list` renders two `action-1` rows. Duplicate
      identities break the board's documented "0 duplicate identities per section"
      invariant, make `close --action` ambiguous (`find` closes the first record
      while closures match all records sharing the id), and are unrepairable under
      the append-only discipline. All delivered tests inject ids (fixtures always
      pass `newActionId`), so no suite catches the gap.
    suggestion: >-
      In production.ts pass `newActionId: () => globalThis.crypto.randomUUID()` and
      `newClosureId: () => globalThis.crypto.randomUUID()` (mirroring newRunId) in
      the retro composition; alternatively make the edge fallback collision-safe
      (run-id-derived). Add a regression test that files through two fresh runtimes
      (or the unaugmented production composition) against one store and asserts
      distinct identities and no duplicate list rows.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-2
    severity: low
    confidence: high
    category: documentation
    location: packages/cli/src/help.ts:551
    message: >-
      The retro help entries (retro, retro/action, retro/collect, retro/report at
      help.ts:549-606) pass `"retro"` to `page()`, so the user-facing `--help`
      "See also:" section renders the frozen M1 snapshot page
      (doc/planning/oss-tooling/milestones/m1/commands/retro.md), which documents
      only collect/report and none of the action verbs. Both gates map the retro
      family to the M2 page (scripts/checks/help-guide-coverage.ts:41 and
      tests/checks/reference-page-parity.test.ts:30, per GH-288 DEC-13: a family
      documents itself in its own milestone's page root). This is the doc-syncer's
      non-blocking observation, confirmed as a real minor defect — stale guidance,
      not an accepted M1-snapshot convention: the M1 page is a byte-unchanged
      snapshot, and parity only checks existence+registration, so no gate catches it.
    suggestion: >-
      Point the four retro entries at `pageIn(M2_REFERENCE_ROOT, "retro")`, and
      optionally extend reference-page-parity to assert each family entry's
      seeAlso equals pageFor(command) so the three encodings cannot diverge again.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
