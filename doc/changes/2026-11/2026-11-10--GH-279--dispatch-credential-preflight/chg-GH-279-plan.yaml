        - "packages/core/src/index.ts"
        - "packages/cli/src/production.ts"
        - "packages/cli/src/edge.ts"
        - "packages/cli/src/index.ts"
        - "packages/cli/src/commands/dispatch.ts"
        - "tests/behaviour/dispatch-admission-preflight.test.ts"
        - "tests/behaviour/dispatch-admission-read-mapping.test.ts"
        - "tests/behaviour/dispatch-admission-diagnostics.test.ts"
        - "tests/structure/dispatch-composition.test.ts"
        - "tests/behaviour/error-classification.test.ts"
        - "tests/fixtures/dispatch/admission.ts"
        - "tests/fixtures/dispatch/harness.ts"
        - "tests/fixtures/dispatch/truth.ts"
        - "tests/fixtures/dispatch/golden/harness.ts"
        - "tests/structure/inventory.json"
