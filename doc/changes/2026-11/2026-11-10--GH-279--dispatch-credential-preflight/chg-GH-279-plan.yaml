      - "TC-READMAP-001..009"
      - "TC-CREDNAME-001..005"
      - "TC-CREDNAME-007 (trusted-refusal marker: the bounded credential-refusal summary reaches machine and human output only with the marker, and an unmarked config-shaped failure still suppresses summary and hint)"
      - "TC-REG-001 (determinism half: identical injected clock and id factory produce byte-identical refusal envelopes)"
    verification:
      - "bun test tests/behaviour/dispatch-admission-preflight.test.ts || a refusing credential port yields config.credential.missing/kind config/exit 1 with zero spawns, resumes, leases, and attempts; a resume is refused identically; the missing-credential path issues zero transport requests and completes well under 2 000 ms; a direct caller without the port keeps the delivered order; one resolution and one bounded read per admission"
      - "bun test tests/behaviour/dispatch-admission-read-mapping.test.ts || 401/403 -> provider.auth.rejected (provider, user-validation, exit 1); 5xx and 429/other non-2xx -> provider.outage (provider, platform-provider, exit 2); status-absent throw -> provider.outage; malformed 2xx -> provider.payload.invalid (provider, platform-provider, exit 2); 404 -> input.value.rejected (input, user-validation, exit 1) naming the ref without calling it wrong; every pair asserted with kind AND projection AND exit; zero spawns/attempts; the five refusal goldens pin shape only"
