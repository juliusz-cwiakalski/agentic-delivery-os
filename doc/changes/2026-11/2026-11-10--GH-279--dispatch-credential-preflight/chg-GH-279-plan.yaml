      - "bun test tests/structure/dispatch-composition.test.ts || the two replaced suites are INVERTED to zero spawns and a typed pre-session refusal (assertions retained, not deleted); the positive control reaches a verdict other than state-unverified with exactly one attempt; the no-preflight control preserves the old order; the production composition supplies the port and orders it after input validation and before claimLease"
