# GH-279 implementation plan — dispatch admission credential preflight,
# typed divergence resolution, and delivered-evidence divergence recording.
#
# SOURCES (single source of truth, read before delivery):
#   - Spec: ./chg-GH-279-spec.md (v1.4 or later; F-1..F-6, the 30 acceptance
#     criteria AC-F1-1..AC-F1-7 and AC-F2-1..AC-F6-3, DM-1..DM-6,
#     NFR-1..NFR-14, RSK-1..RSK-18, DEC-1..DEC-12, §16.1 documentation impact
#     including the change record, §18 ordering/rollout, Appendix A admission
#     table, Appendix B divergence shape, Appendix C refusal diagnostics)
#   - Test plan: ./chg-GH-279-test-plan.md (v1.3 or later; the 61 test cases of
#     the ADMIT, READMAP, CREDNAME, RESOLVE, DIVREC, STATCRED, DOCTCRED, DOCS,
#     and REG families, including the adapter-level stamping TC, the
#     trusted-refusal-marker TC, and the attempt-append-failure TC
#     TC-DIVREC-011; §6 fixtures; §7 file mapping and plan-phase mapping;
#     MV-1..MV-3 manual evidence)
#   - PM record: ./chg-GH-279-pm-notes.yaml (D1..D7)
#   - Decisions: doc/decisions/TDR-0019-dispatch-admission-credential-preflight.md,
#     doc/decisions/TDR-0020-dispatch-divergence-recording-and-resolution.md,
#     doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md
#     (four additive amendment notes, TDR-0020 as their durable home)
#   - System spec (reconciled in Phase 8):
#     doc/spec/features/feature-dispatch-engine.md,
#     feature-adapter-ports.md, feature-status-digest.md,
#     feature-result-contract.md, feature-doctor.md
#
# ORDERING (dependency-driven; every phase is separately verifiable and the
# tree stays green at every commit):
#   1 verified decision basis -> 2 additive admission contract -> 3 adapter read
#   discriminator -> 4 engine preflight + production composition + classification
#   + named diagnostics -> 5 resolve typing -> 6 delivered-evidence divergence
#   -> 7 status prerequisite + doctor parity + redaction -> 8 docs, change
#   record, conformance, spec reconciliation, release.
#   - Phase 2 lands first because the engine and the later production
#     composition must agree on the declared port/kind shape before behaviour;
#     the declaration stays field-level, so the name-level contract inventory
#     does not move.
#   - Phase 3 (received-2xx status stamped onto a decode failure) lands before
#     Phase 4 because the malformed-payload-versus-transport-throw distinction is
#     a prerequisite of the read-outcome matrix, and it is independently
#     verifiable at the adapter surface.
#   - Phase 4 is the capability core: it is the only phase where the admission
#     ordering, the status-keyed identity mapping, and the named diagnostics can
#     all be proven together (a half-classified preflight would emit a wrong
#     identity and is not shippable).
#   - Phase 5 (resolve) is independent of Phase 4 (admission) and could be
#     reordered; it follows because both are diagnostic surfaces and Phase 4
#     establishes the `kind` discipline the resolve typing reuses.
#   - Phase 6 consumes the unreadable-read identity that Phase 4 proves is
#     reachable, and the divergence record shape that Phase 5 makes resolvable,
#     so it lands after both.
#   - Phase 8 carries the aggregate gate, the spec reconciliation obligation, the
#     change-record obligation, and the release/changeset obligation as scope,
#     not as prose.
#   - Phase 1 is a planning recording step whose material already landed before
#     delivery: it re-verifies the committed decision basis and stages nothing.
#
# DELIVERY PINS (placements and spellings the spec/test plan leave delivery-bound;
# none changes a requirement):
#   - The admission seam is the OPTIONAL `preflight` port on `DispatchPorts`,
#     distinct from `ports.admission`: invoked inside `runDispatch` after
#     harness/input validation and BEFORE `claimLease` and before any spawn or
#     resume; it appends no attempt, divergence, handover, or authority record.
#     Production always supplies it; a direct caller may omit it and keep the
#     delivered run order (TC-ADMIT-008).
#   - The preflight result carries its own typed failure `{kind, code, summary?}`;
#     the engine's local `DispatchRunResult` error-kind union is widened
#     additively to admit the existing `provider` and `config` kinds (both rows
#     already exist; `DOMAIN_KINDS` and the error-table row count do not change).
#     Emitting a correct code under a mismatched kind classifies as
#     `fallback.internal`, so identity, kind, projection, and exit are always
#     asserted together.
#   - Read-outcome classification happens in the PRODUCTION preflight at the
#     composition boundary, never in the adapter and never by forwarding the
#     adapter identity: 401/403 -> `provider.auth.rejected` (kind provider,
#     user-validation, exit 1); 5xx and any other status-bearing non-2xx ->
#     `provider.outage` (kind provider, platform-provider, exit 2); a
#     status-absent transport throw -> `provider.outage`; a received-but-
#     malformed 2xx -> the adapter-local `provider.payload.invalid` (kind
#     provider, platform-provider, exit 2); 404 -> `input.value.rejected`
#     (kind input, user-validation, exit 1) with the provider-reported-absence
#     wording that never asserts the reference is wrong.
#   - Malformed-2xx discrimination uses the received status: the bounded read
#     stamps the 2xx it received onto the normalizer's payload failure, so a
#     malformed payload carries a status and a transport throw carries none
#     (TDR-0019 decision point 4). No new field, code, row, or identity.
#   - An unresolvable repository target stays a composition-level refusal that
#     runs before the dispatch runtime exists (`input.value.rejected`, summary
#     `repository identity is unresolvable`; spec §2.1 records it as unchanged
#     current-state behaviour). The dispatch ports receive an already-resolved
#     required target, so no preflight branch can observe an unresolved one, no
#     criterion covers it, and no ports-driven double can produce it.
#   - The named-refusal summary reaches the machine envelope AND the human
#     diagnostic. The delivered classification layer deliberately drops an
#     explicit summary/remediation hint on a config-shaped failure to protect
#     untrusted config text (`packages/cli/src/index.ts`), so the engine refusal
#     carries a narrow, explicit trusted-refusal marker that the classifier
#     honours only for `config.credential.missing`. The existing untrusted-config
#     pin in `tests/behaviour/error-classification.test.ts` stays green (inverted
#     to assert both the marker-gated forwarding and the unmarked suppression,
#     never deleted), and a new case proves the marker is required. Summaries
#     remain identifier-only, bounded, and single-line.
#   - The delivered-evidence predicate is the shared classifier outcome
#     `completed` evaluated at record time (never the persisted attempt outcome)
#     plus a readable phase ledger with progress or a complete total. The
#     divergence record is built with `comparisonClass: "not-applicable"`,
#     `engineToken: "state-unverified"`, `comparisonToken: null` — it does NOT
#     copy the attempt's comparison class (`dispatch-derived-failure`), whose
#     derivation stays unchanged.
#   - Delivered-evidence dedupe key is (repository, work-item ref) at most one
#     OPEN record; a resume reuses and references it.
#   - The append ORDER stays the delivered one and is pinned: the divergence
#     append precedes the attempt append.
#   - Failed-divergence-append semantics are D6/OQ-1: one attempt append, no
#     `divergenceRef`, bounded `divergence:append-failed` evidence ref, the
#     underlying state identity on `data.error` and `lastMessage`, derived token
#     and exit unchanged.
#   - Orphan-direction semantics (the divergence lands and the attempt append
#     then fails) are accepted and documented, never compensated: the open
#     divergence stays on the ledger, keeps counting in `unresolvedDivergences`,
#     stays resolvable through `dispatch dual-run resolve`, and a later attempt
#     for the same pair may reference it instead of opening a second one. The
#     command returns the underlying state identity, appends no fabricated
#     attempt, and writes no `divergenceRef` for an attempt record that did not
#     land (TC-DIVREC-011).
#   - The not-found resolve sentinel is an app-layer constant, not a contracts
#     export, so it never moves the v1 contract inventory.
#   - The status prerequisite is one additive OPTIONAL section-level
#     `credentialPrerequisite: {referenceName, sourceKey}` sibling of the bounded
#     `sources[]` list; the six-entry source-entry shape and bound are unchanged,
#     no section/state/finding code is added, and the digest golden corpus stays
#     byte-identical. The change is field-level and additive: it introduces no
#     new exported type name, so `tests/fixtures/ports/v1-contract-inventory.json`
#     does not move and no name-level inventory assertion is owed by Phase 7.
#   - The truth-read key is registered for redaction at the runtime edge from the
#     injected environment facts and the declared reference (literal name, or
#     brand prefix + suffix), adding no ambient read and no new allowlist entry.
#   - Documentation is exactly `doc/guides/tracker-credential-provisioning.md`
#     (ados_distribution: redistributable, plain text without typographic quote
#     marks) and the existing dispatch reference page; the prompt-required help
#     inventory stays at four `dispatch` entries and no command or flag is added.
#   - The change record is `chg-GH-279-change-record.md` in this change folder
#     (the change folder is the durable record), carried by Phase 8 together with
#     the release note (`.changeset/gh-279-dispatch-credential-preflight-minor.md`):
#     it records the GH-241 live evidence and the resolve failure, the one real
#     credentialed dispatch used as manual evidence (MV-1) with its artifact,
#     tracker, and CI corroboration facts, the operator communication (export
#     `GITHUB_TOKEN` before upgrading), and the doctor-unshipped statement. The
#     pull-request description repeats the MV-1 summary; no token value appears in
#     either.
#   - Phase 1 is a lease-free planning record and the commit path unions only
#     `kind: delivery` phases, so Phase 1 asserts tracked state and stages
#     nothing: TDR-0019, TDR-0020, the 00-index rows, and the four TDR-0015
#     amendment notes already landed at ca4aa1a8 and stay `Proposed`.
#   - Every new `packages/**` source module must be registered in
#     `tests/structure/inventory.json` in the same phase commit (the content
#     inventory check is fail-closed).
#
# DECLARATION-ONLY KEYS: `acCoverage`, `tcCoverage`, and `verification` are
# evidence declarations read by the delivery loop; `plan validate` ignores them
# (the same pattern the delivered GH-238 plan uses for its coverage/testGate
# declarations). They record no progress and no task list: progress lives in
# pm-notes `notes:`.
#
# COVERAGE INVARIANT: all 30 acceptance criteria of the spec appear exactly once
# in `acCoverage`, each in the phase that can satisfy it in full. The one
# exception is AC-F5-4, whose two spec-mandated halves (§16) are declared by
# Phase 7 (runtime-edge redaction) and Phase 8 (guide content). All 61 test cases
# of the test plan have a declared home, and the only case assigned to two
# phases is TC-REG-002, whose structure half runs in Phase 2 and documents half
# in Phase 8, matching test plan §7. No identifier is dangling or invented:
# every AC and TC below resolves to a row in the spec's acceptance-criteria table
# or in the test plan's case list.
#
# COMMIT HYGIENE: one commit per phase through the `commit` primitive, subject =
# the phase `summary`, body/footer lines <= 100 characters, no manual staging.

schemaVersion: delivery.plan.v1
workItemRef: GH-279

tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  escalationTriggers:
    - "a pre-session refusal claims a lease, opens a session, branch, worktree, attempt, divergence, handover, or authority change"
    - "a refusing credential port still spawns or resumes, or a refusal returns state-unverified instead of its typed identity"
    - "a refusal returns a correct code under a mismatched kind and classifies as fallback.internal"
    - "the admission read outcome is decided by forwarding the adapter identity instead of the failure's httpStatus"
    - "a malformed 2xx payload stops carrying its received status, or the malformed-payload/transport-throw pair stops being distinguishable"
    - "any credential value, value substring, or value-derived digest appears in an envelope, diagnostic, summary, evidence reference, or record"
    - "dispatch dual-run resolve consults a credential or the network, or reports dispatch.state-unverified for a readable store"
    - "more than one open delivered-evidence divergence exists for one (repository, work-item ref), or a divergenceRef points at a record that was not written"
    - "the divergence append stops preceding the attempt append, or an orphaned open divergence stops counting as unresolved or stops being resolvable"
    - "the classifier forwards a config-shaped summary or remediation hint without the engine's trusted-refusal marker"
    - "status exits non-zero, drops a section, extends the bounded sources[] entry shape, or adds a section/state/finding code"
    - "the error-table identity count, DOMAIN_KINDS membership, delivery-result tokens, configuration keys, commands, flags, or exits outside {0, 1, 2} change"
    - "a new process.env/Bun.env/Deno.env read appears outside the credential adapter, or the secret-read boundary check fails"
    - "the prompt-required help inventory grows past four dispatch entries, or doctor is shipped"
    - "a pinned assertion protecting the replaced behaviour is deleted instead of inverted"

defaultWeightClass: "standard"

phases:
  # ---------------------------------------------------------------------------
  # PHASE 1 — decision and change record (planning, lease-free, VERIFY-ONLY)
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Verified decision basis: TDR-0019, TDR-0020, and the four TDR-0015 amendment notes"
    kind: planning
    summary: "verify decision records and amendment notes"
    scope:
      files:
        - "doc/changes/2026-11/2026-11-10--GH-279--dispatch-credential-preflight/chg-GH-279-spec.md"
        - "doc/changes/2026-11/2026-11-10--GH-279--dispatch-credential-preflight/chg-GH-279-test-plan.md"
        - "doc/changes/2026-11/2026-11-10--GH-279--dispatch-credential-preflight/chg-GH-279-plan.yaml"
        - "doc/changes/2026-11/2026-11-10--GH-279--dispatch-credential-preflight/chg-GH-279-pm-notes.yaml"
        - "doc/decisions/TDR-0019-dispatch-admission-credential-preflight.md"
        - "doc/decisions/TDR-0020-dispatch-divergence-recording-and-resolution.md"
        - "doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md"
        - "doc/decisions/00-index.md"
      folders:
        - "doc/changes/2026-11/2026-11-10--GH-279--dispatch-credential-preflight"
    interactions:
      - kind: contract-file
        target: "doc/decisions/TDR-0019-dispatch-admission-credential-preflight.md"
        role: producer
      - kind: contract-file
        target: "doc/decisions/TDR-0020-dispatch-divergence-recording-and-resolution.md"
        role: producer
    acCoverage: []
    tcCoverage:
      - "TC-DOCS-004 (manual half: the change record carries the four-assertion TDR-0015 amendment and names TDR-0020 as its durable home)"
    verification:
      - "delivery-os plan validate GH-279 || verdict=valid, readyForDevelopment=true, nine phases echoed"
      - "bun test tests/checks/decision-record.test.ts || TDR-0019 and TDR-0020 pass the decision-record contract; no duplicate or reused id; the 00-index rows match the register"
      - "git ls-files --error-unmatch doc/decisions/TDR-0019-dispatch-admission-credential-preflight.md doc/decisions/TDR-0020-dispatch-divergence-recording-and-resolution.md doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md doc/decisions/00-index.md || all four decision paths are tracked on the branch (landed at ca4aa1a8); this planning record verifies them and stages nothing, because the delivery commit path unions only kind: delivery phases"
      - "grep -c '^  > \\*\\*Amendment (GH-279' doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md || exactly four additive notes (§1 Truth(W), §1 Coverage(W), §1 record-level degradation, §5); the §1 preamble bullet is excluded by the anchor"
      - "grep -n '^status: Proposed$' doc/decisions/TDR-0019-dispatch-admission-credential-preflight.md doc/decisions/TDR-0020-dispatch-divergence-recording-and-resolution.md || both records stay Proposed until the human PR gate, and TDR-0020 is named as the durable home of the four TDR-0015 notes"

  # ---------------------------------------------------------------------------
  # PHASE 2 — additive admission contract declarations
  # ---------------------------------------------------------------------------
  - id: 2
    title: "Optional preflight port and additive refusal kinds, with the name-level contract inventory unchanged"
    kind: delivery
    summary: "declare dispatch preflight port and refusals"
    leases:
      - "repo:main-tools"
    weightClass: standard
    scope:
      files:
        - "packages/core/src/contracts/dispatch.ts"
        - "packages/core/src/contracts/index.ts"
        - "packages/core/src/app/dispatch.ts"
        - "packages/core/src/index.ts"
        - "tests/structure/dispatch-preflight-contract.test.ts"
        - "tests/structure/inventory.json"
    interactions:
      - kind: contract-file
        target: "packages/core/src/contracts/dispatch.ts"
        role: producer
    # No criterion completes here: this phase lands declarations only, and the
    # criteria it enables (AC-F2-5 in particular) are satisfied in full by the
    # behavioural phase that asserts kind, projection, and exit together.
    acCoverage: []
    tcCoverage:
      - "TC-REG-004 (structure half: the preflight port is declared optional and distinct from admission; the addition is field-level, so the name-level v1 contract inventory is asserted unchanged)"
      - "TC-REG-002 (structure half: no new token, DOMAIN_KINDS member, error identity, configuration key, command, or flag)"
    verification:
      - "pnpm typecheck || the additive declarations compile and no existing caller breaks"
      - "bun test tests/structure/dispatch-preflight-contract.test.ts || the preflight port is optional, distinct from admission, and absent from a direct-caller composition"
      - "bun test tests/structure/port-contract-inventory.test.ts || the name-level v1 contract inventory is UNCHANGED: the optional preflight port and the widened error-kind union add no exported type name, so no entry is added, removed, or renamed and the fixture is not regenerated"
      - "bun test tests/checks/error-table-sync.test.ts tests/structure/delivery-result-contract.test.ts tests/structure/dispatch-token-home.test.ts || machine and documented tables stay in sync at their current count; eleven tokens; provider/config rows unchanged"
      - "bun test tests/structure/content-inventory.test.ts || every registered core module resolves; no unregistered source file"

  # ---------------------------------------------------------------------------
  # PHASE 3 — adapter read discriminator (received 2xx status on decode failure)
  # ---------------------------------------------------------------------------
  - id: 3
    title: "Stamp the received 2xx status onto a GitHub read decode failure so a malformed payload stays distinguishable"
    kind: delivery
    summary: "stamp 2xx status on GitHub decode failures"
    leases:
      - "repo:main-tools"
    weightClass: standard
    scope:
      files:
