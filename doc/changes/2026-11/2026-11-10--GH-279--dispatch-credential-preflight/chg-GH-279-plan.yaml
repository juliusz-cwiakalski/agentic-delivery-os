        - "packages/adapters/src/github/normalize.ts"
        - "packages/adapters/src/io/provider-transport.ts"
        - "packages/adapters/src/github/index.ts"
        - "tests/behaviour/providers/github-inputs.test.ts"
        - "tests/behaviour/providers/github-trap.test.ts"
        - "tests/structure/inventory.json"
      folders:
        - "tests/fixtures/providers/github"
    interactions:
      - kind: contract-file
        target: "packages/adapters/src/io/provider-transport.ts"
        role: producer
    # No criterion completes here: this phase proves the received-2xx stamp that
    # AC-F1-7 and AC-F2-6 depend on, and both are satisfied in full by Phase 4,
    # where the engine classifies the read outcome.
    acCoverage: []
    tcCoverage:
      - "TC-READMAP-010 (adapter half, sole home: the real GitHub client and normalizer stamp the received 2xx onto the decode failure, a thrown transport stays status-absent, 404 stays provider.not-found, and other non-2xx keep their status; asserted without a pre-stamped read double, while the engine-side read halves it pins are declared by Phase 4)"
    verification:
      - "bun test tests/behaviour/providers/github-inputs.test.ts || driven through the real client and normalizer with an injected transport: a 200 response with a malformed body yields provider.payload.invalid WITH httpStatus 200; a thrown transport yields it WITHOUT httpStatus; 404 stays provider.not-found; other non-2xx keep their status"
      - "bun test tests/behaviour/providers/github-trap.test.ts || the transport-throw path stays status-absent and never reaches the network"
      - "bun test tests/behaviour/providers/github-closeout.test.ts || the delivered observation read contract is unchanged"
      - "pnpm typecheck || the additive optional httpStatus stays optional; no new failure code or field"

  # ---------------------------------------------------------------------------
  # PHASE 4 — engine preflight, production composition, classification, diagnostics
  # ---------------------------------------------------------------------------
  - id: 4
    title: "Pre-session credential and truth-read preflight with status-keyed refusal identities and named diagnostics"
    kind: delivery
    summary: "preflight tracker credential before spawn"
    leases:
