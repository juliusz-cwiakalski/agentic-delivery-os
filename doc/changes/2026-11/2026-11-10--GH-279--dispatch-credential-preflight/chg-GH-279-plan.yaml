# GH-279 implementation plan — dispatch admission credential preflight,
# typed divergence resolution, and delivered-evidence divergence recording.
#
# SOURCES (single source of truth, read before delivery):
#   - Spec: ./chg-GH-279-spec.md (v1.2; F-1..F-6, AC-F1-1..AC-F6-3, DM-1..DM-6,
#     NFR-1..NFR-14, RSK-1..RSK-17, DEC-1..DEC-11, §16.1 documentation impact,
#     §18 ordering/rollout, Appendix A admission table, Appendix B divergence
#     shape, Appendix C refusal diagnostics)
#   - Test plan: ./chg-GH-279-test-plan.md (v1.1; 58 TCs: TC-ADMIT-001..010,
#     TC-READMAP-001..009, TC-CREDNAME-001..006, TC-RESOLVE-001..008,
#     TC-DIVREC-001..010, TC-STATCRED-001..004, TC-DOCTCRED-001..002,
#     TC-DOCS-001..004, TC-REG-001..005; §6 fixtures; §7 file mapping;
#     MV-1..MV-3 manual evidence)
#   - PM record: ./chg-GH-279-pm-notes.yaml (D1..D7)
#   - Decisions: doc/decisions/TDR-0019-dispatch-admission-credential-preflight.md,
#     doc/decisions/TDR-0020-dispatch-divergence-recording-and-resolution.md,
#     doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md
#     (four additive amendment notes, TDR-0020 as their durable home)
#   - System spec (reconciled in Phase 8):
#     doc/spec/features/feature-dispatch-engine.md,
#     feature-adapter-ports.md, feature-status-digest.md,
#     feature-result-contract.md, feature-doctor.md
#
# ORDERING (dependency-driven; every phase is separately verifiable and the
# tree stays green at every commit):
#   1 decision/change record -> 2 additive admission contract -> 3 adapter read
#   discriminator -> 4 engine preflight + production composition + classification
#   + named diagnostics -> 5 resolve typing -> 6 delivered-evidence divergence
#   -> 7 status prerequisite + doctor parity + redaction -> 8 docs, conformance,
#   spec reconciliation, release.
#   - Phase 2 lands first because the engine, the contract inventory, and the
#     later production composition must agree on the declared port/kind shape
#     before behaviour.
#   - Phase 3 (received-2xx status stamped onto a decode failure) lands before
#     Phase 4 because the malformed-payload-versus-transport-throw distinction is
#     a prerequisite of the read-outcome matrix, and it is independently
#     verifiable at the adapter surface.
#   - Phase 4 is the capability core: it is the only phase where the admission
#     ordering, the status-keyed identity mapping, and the named diagnostics can
#     all be proven together (a half-classified preflight would emit a wrong
#     identity and is not shippable).
#   - Phase 5 (resolve) is independent of Phase 4 (admission) and could be
#     reordered; it follows because both are diagnostic surfaces and Phase 4
#     establishes the `kind` discipline the resolve typing reuses.
#   - Phase 6 consumes the unreadable-read identity that Phase 4 proves is
#     reachable, and the divergence record shape that Phase 5 makes resolvable,
#     so it lands after both.
#   - Phase 8 carries the aggregate gate, the spec reconciliation obligation, and
#     the release/changeset obligation as scope, not as prose.
#
# DELIVERY PINS (placements and spellings the spec/test plan leave delivery-bound;
# none changes a requirement):
#   - The admission seam is the OPTIONAL `preflight` port on `DispatchPorts`,
#     distinct from `ports.admission`: invoked inside `runDispatch` after
#     harness/input validation and BEFORE `claimLease` and before any spawn or
#     resume; it appends no attempt, divergence, handover, or authority record.
#     Production always supplies it; a direct caller may omit it and keep the
#     delivered run order (TC-ADMIT-008).
#   - The preflight result carries its own typed failure `{kind, code, summary?}`;
#     the engine's local `DispatchRunResult` error-kind union is widened
#     additively to admit the existing `provider` and `config` kinds (both rows
#     already exist; `DOMAIN_KINDS` and the error-table row count do not change).
#     Emitting a correct code under a mismatched kind classifies as
#     `fallback.internal`, so identity, kind, projection, and exit are always
#     asserted together.
#   - Read-outcome classification happens in the PRODUCTION preflight at the
#     composition boundary, never in the adapter and never by forwarding the
#     adapter identity: 401/403 -> `provider.auth.rejected` (kind provider,
#     user-validation, exit 1); 5xx and any other status-bearing non-2xx ->
#     `provider.outage` (kind provider, platform-provider, exit 2); a
#     status-absent transport throw -> `provider.outage`; a received-but-
#     malformed 2xx -> the adapter-local `provider.payload.invalid` (kind
#     provider, platform-provider, exit 2); 404 -> `input.value.rejected`
#     (kind input, user-validation, exit 1) with the provider-reported-absence
#     wording that never asserts the reference is wrong.
#   - Malformed-2xx discrimination uses the received status: the bounded read
#     stamps the 2xx it received onto the normalizer's payload failure, so a
#     malformed payload carries a status and a transport throw carries none
#     (TDR-0019 decision point 4). No new field, code, row, or identity.
#   - An unaddressable admission read (no resolvable repository target for the
#     declared instance) refuses as `input.value.rejected` (kind input) before
#     any request is issued; the composition already refuses an unresolvable
#     repository identity this way, so no identity is invented.
#   - The named-refusal summary reaches the machine envelope AND the human
#     diagnostic. The delivered classification layer deliberately drops an
#     explicit summary/remediation hint on a config-shaped failure to protect
#     untrusted config text (`packages/cli/src/index.ts`), so the engine refusal
#     carries a narrow, explicit trusted-refusal marker that the classifier
#     honours only for `config.credential.missing`; the existing untrusted-config
#     pin in `tests/behaviour/error-classification.test.ts` stays green and a
#     new case proves the marker is required. Summaries remain identifier-only,
#     bounded, and single-line.
#   - The delivered-evidence predicate is the shared classifier outcome
#     `completed` evaluated at record time (never the persisted attempt outcome)
#     plus a readable phase ledger with progress or a complete total. The
#     divergence record is built with `comparisonClass: "not-applicable"`,
#     `engineToken: "state-unverified"`, `comparisonToken: null` — it does NOT
#     copy the attempt's comparison class (`dispatch-derived-failure`), whose
#     derivation stays unchanged.
#   - Delivered-evidence dedupe key is (repository, work-item ref) at most one
#     OPEN record; a resume reuses and references it. Append-failure semantics
#     are D6/OQ-1: one attempt append, no `divergenceRef`, bounded
#     `divergence:append-failed` evidence ref, the underlying state identity on
#     `data.error` and `lastMessage`, derived token and exit unchanged.
#   - The not-found resolve sentinel is an app-layer constant, not a contracts
#     export, so it never moves the v1 contract inventory.
#   - The status prerequisite is one additive OPTIONAL section-level
#     `credentialPrerequisite: {referenceName, sourceKey}` sibling of the bounded
#     `sources[]` list; the six-entry source-entry shape and bound are unchanged,
#     no section/state/finding code is added, and the digest golden corpus stays
#     byte-identical.
#   - The truth-read key is registered for redaction at the runtime edge from the
#     injected environment facts and the declared reference (literal name, or
#     brand prefix + suffix), adding no ambient read and no new allowlist entry.
#   - Documentation is exactly `doc/guides/tracker-credential-provisioning.md`
#     (ados_distribution: redistributable, plain text without typographic quote
#     marks) and the existing dispatch reference page; the prompt-required help
#     inventory stays at four `dispatch` entries and no command or flag is added.
#   - Every new `packages/**` source module must be registered in
#     `tests/structure/inventory.json` in the same phase commit (the content
#     inventory check is fail-closed).
#
# DECLARATION-ONLY KEYS: `acCoverage`, `tcCoverage`, and `verification` are
# evidence declarations read by the delivery loop; `plan validate` ignores them
# (the same pattern the delivered GH-238 plan uses for its coverage/testGate
# declarations). They record no progress and no task list: progress lives in
# pm-notes `notes:`.
#
# COMMIT HYGIENE: one commit per phase through the `commit` primitive, subject =
# the phase `summary`, body/footer lines <= 100 characters, no manual staging.

schemaVersion: delivery.plan.v1
workItemRef: GH-279

tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8]
  escalationTriggers:
    - "a pre-session refusal claims a lease, opens a session, branch, worktree, attempt, divergence, handover, or authority change"
    - "a refusing credential port still spawns or resumes, or a refusal returns state-unverified instead of its typed identity"
    - "a refusal returns a correct code under a mismatched kind and classifies as fallback.internal"
    - "the admission read outcome is decided by forwarding the adapter identity instead of the failure's httpStatus"
    - "a malformed 2xx payload and a status-absent transport throw are no longer distinguishable"
    - "any credential value, value substring, or value-derived digest appears in an envelope, diagnostic, summary, evidence reference, or record"
    - "dispatch dual-run resolve consults a credential or the network, or reports dispatch.state-unverified for a readable store"
    - "more than one open delivered-evidence divergence exists for one (repository, work-item ref), or a divergenceRef points at a record that was not written"
    - "status exits non-zero, drops a section, extends the bounded sources[] entry shape, or adds a section/state/finding code"
    - "the error-table identity count, DOMAIN_KINDS membership, delivery-result tokens, configuration keys, commands, flags, or exits outside {0, 1, 2} change"
    - "a new process.env/Bun.env/Deno.env read appears outside the credential adapter, or the secret-read boundary check fails"
    - "the prompt-required help inventory grows past four dispatch entries, or doctor is shipped"
    - "a pinned assertion protecting the replaced behaviour is deleted instead of inverted"

defaultWeightClass: "standard"

