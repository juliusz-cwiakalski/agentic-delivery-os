decisions:
  - text: "D1 (PM-decided): the credential preflight is a pre-session refusal. It
      runs before the queue-lease claim and before spawn/resume; it appends no
      attempt record and opens no session, branch, or divergence. Identity
      config.credential.missing (user, not_landed, exit 1) with a summary naming
      the resolved source key and the reference; today's post-spawn exit 2 is
      the defect being replaced."
    date: 2026-11-10
  - text: "D2 (PM-decided): dispatch dual-run resolve must work from local evidence
      only. It consults no credential port and no network. The observed
      'dispatch.state-unverified' is a diagnostic-collapse defect: every
      non-state.keys.missing store failure is relabelled as the truth token.
      Resolve must preserve the underlying typed state code (for example
      state.lock.busy, state.store.torn, state.write.failed) and remediation. A
      separate defect fix, not a credential fix."
    date: 2026-11-10
  - text: "D3 (PM-decided): a dispatch whose session completed but whose truth reads
      are unreadable appends exactly one open divergence so it is resolvable
      through dispatch dual-run resolve and counts as unresolved until resolved.
      Applies to the production truth-read credential path from issue GH-279."
    date: 2026-11-10
  - text: "D4 (PM-decided): gh-keyring bridge is a documented provisioning path,
      never implicit ambient inheritance. Document the exact key GITHUB_TOKEN
      and the explicit export bridge from an authenticated gh session;
      deny-by-default stays intact."
    date: 2026-11-10
  - text: "D5 (PM-decided): doctor stays out of the shipped prompt-required command
      set in this change (its inventory is pinned). The operator-facing
      prerequisite surface is the dispatch preflight plus status section
      evidence naming the resolved key; doctor's existing
      tracker.credential-unavailable check keeps parity through tests. Shipping
      doctor is deferred to a separate decision."
    date: 2026-11-10
  - text: "D6 (PM-decided, test-plan OQ-1): when the delivered-evidence divergence
      append fails, never fabricate a divergenceRef and never dangle one. The
      attempt is still appended exactly once with a bounded
      divergence:append-failed evidence ref; the returned envelope carries the
      underlying state identity in data.error and names it in lastMessage; exit
      stays 2. No silent success."
    date: 2026-11-10
  - text: "D7 (PM-decided, test-plan OQ-2..4): the provisioning guide path is
      doc/guides/tracker-credential-provisioning.md; diagnostics assertions are
      behavior-level (key/reference substrings present, canary value absent),
      not prose goldens; the status credentialPrerequisite field is asserted on
      sections whose credential-dependent source failed and absent on observing
      sections, discovered from the digest rather than hardcoded."
    date: 2026-11-10
  - text: "D9 (PM-decided, review F-1 accepted): the delivery commit subjects are
      primitive-generated template fallbacks because a numeric plan phase cannot
      be passed to the commit primitive; they are conventional, specific to the
      staged area, and within the 72-char cap. History rewriting is out of
      policy (commits go only through the commit primitive). Accept the template
      subjects and do not reword the branch history; the plan phase-9 escape
      clause records this."
    date: 2026-11-10
  - text: "D10 (PM-decided, review F-8/F-9 acceptance boundary): F-8 (entrypoint
      importing the pure credential key resolver) is accepted as a low-risk
      layering advisory because the import is pure and the boundary scan is
      green; F-9 is fixed by rendering the status credentialPrerequisite in the
      human report when it is cheap, otherwise accepted as machine-only and
      recorded."
    date: 2026-11-10
