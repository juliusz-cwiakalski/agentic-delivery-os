    location: "packages/core/src/app/dispatch.ts:287-292"
    message: >-
      `unreadableTruthReason` returns "state" when only the `ci` read failed, but a ci-only
      failure can never reach it: `isDeliveredEvidence` already requires `reads.ledger.ok`, and
      `deriveDispatchResult` only yields `state-unverified` from an unreadable ledger/tracker/
      artifact (packages/core/src/domain/dispatch-result.ts:222-232), so the returns "ledger"
      and "state" are unreachable and the ci → "state" mapping would mislabel the failing read
      if a future path reached it (the spec forbids a `ci` reason and requires the reason to
      name the failing read family).
    suggestion: >-
      Return `undefined` for the ci branch (or delete the loop's fallback) and narrow the
      return type to the reachable reason set, with a comment naming why ledger/state cannot
      occur; alternatively keep the union but assert the mapping in a test.
    suppressed: false
