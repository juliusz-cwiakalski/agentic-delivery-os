findings:
  - id: F-5
    severity: low
    confidence: high
    category: code-quality
    location: tests/structure/vocabulary-conformance.test.ts:77
    message: >
      The helper originalLineAt (lines 77-81) is dead code — defined but never
      called; the R3 sense exemption was implemented with
      originalLines[lineNumber - 1] indexing instead. Biome flags it as an unused
      variable, the only new warning in the repository (gate logs: 133 warnings
      at the iter-1-era 182704 log, 134 at the phase-9 191658 log — the delta is
      exactly this). It is also a latent trap: it slices the ORIGINAL text with
      an offset, which is the wrong operation once offsets live in normalized
      space (the very mismatch the lineAt map exists to avoid); wiring it back in
      would reintroduce the misalignment. Non-fatal: warnings are non-gating in
      this repository, so the pm-notes green-gate claim (exit 0) is truthful.
    suggestion: >
      Delete lines 77-81 in a follow-up commit (may ride the next change on this
      branch or GH-408). No behavior change; the suite stays 17/0 and repo lint
      warnings return to 133.
    suppressed: false
  - id: F-6
    severity: info
    confidence: high
    category: testing
    location: tests/structure/vocabulary-conformance.test.ts:104
    message: >
      Whitespace normalization subtly changes the config-key sense-exemption
      window: the fixed slice(offset, offset + match.length + 2) is evaluated on
      normalized text, so forms with two or more spaces — or a wrap — between
      "project key" and the naming backtick (e.g. "project key  `foo`") were
      flagged pre-change (window held raw spaces, no backtick) and are exempt
      post-change (collapsed to one space, backtick inside the window). This
      moves toward R3's stated intent (the pattern itself already allows \s*
      before the backtick) and the real tree is unaffected (sweep clean,
      clean-tree pass green), so no exception among the four named strings is
      widened — recorded so the delta is known and pinned if the exemption is
      ever revisited.
    suggestion: >
      No action required. At the next touch of this suite, optionally add one
      synthetic arm pinning the multi-space config-key form as exempt (or as a
      finding, if the PM prefers the strict pre-change semantics), so the window
      semantics are asserted rather than incidental.
    suppressed: false
