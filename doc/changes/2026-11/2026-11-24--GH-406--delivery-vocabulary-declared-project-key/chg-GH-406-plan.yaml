  escalationTriggers:
    - "a `--flat` alias byte delta (payload or text) observed at any phase boundary is a change DEFECT: the pinned pre-change literals in tests/behaviour/projects-flat-alias.test.ts are never regenerated in this change — stop, fix the wording change that drifted the alias, re-run; a golden update is never the remedy (NFR-3, TC-DPKUI-003)"
    - "a pre-existing suite that cannot be greened wording-only (a payload assertion, persisted-field name, or expectation value would have to change to pass) is evidence of a forbidden rename of a base-delivered identifier (NG-1, NFR-5, DEC-2): stop and report to PM via a pm-notes entry; never weaken or delete the assertion to go green; the amendment-directed renames of THIS change's own new-code exports (DECLARED_PRODUCT_KEY_PATTERN, isDeclaredProductKey) are NOT this trigger — they ride their owning phases with their inventory-row updates (owner comment 7138707234, spec v1.1 DEC-6)"
    - "a clean-tree conformance failure whose correction cannot be stated in the vocabulary table's nouns inside the Appendix B scope, or whose fix appears to need a new exception: the four named exceptions are frozen until GH-408 — stop and report; never relax, extend, or re-shape the exception set to force the pass (F-6, NFR-4)"
    - "the naming check's committed base constant (22b15d31) unreachable at run time means the check fails closed: stop and report — the constant is re-pointed only deliberately through review, never silently, and never widened to make the tree pass (F-7, TC-DPKNAM-001)"
    - "a new file that cannot carry its bare-token baseline reason is a naming-rule defect: the entry is mandatory reason-bearing (NFR-6) — stop and report rather than land an unexplained entry or an unspecified token use"
# ---------------------------------------------------------------------------
# Plan-level decision record (spec §15 DEC-1..DEC-6): the owner's sources are
# authoritative in the order ticket body < delivery brief (comment
# 7122871259) < VOCABULARY AMENDMENT (comment 7138707234); the brief
# supersedes comment 7117829140 and the body's AC list (DEC-1), and the
# amendment supersedes the brief where they differ (DEC-6). NOTHING at the
# base is renamed in this change — the repos family, repoKey and projectKey
# keep their identifiers and denote the clone identity as named exceptions
# until GH-408's mechanical rename (DEC-2, NG-1); the clone identity is named
# *clone identity*, never *checkout identity* (DEC-3); the local groups.v1
# layer keeps "group keys carry no public pattern" and nothing migrates
# (DEC-4, NG-4); ODR-0006 lands in this change as status Proposed with
# decision_date null — never Accepted; the owner accepts or rejects the
# vocabulary at the pull request, and no earlier decision record is edited
# (DEC-5, NG-5). DEC-6 (the amendment, applied end to end in rev 3): the
# top-level noun is PRODUCT; the vocabulary term is PRODUCT KEY; the code
# names keep the *declared* qualifier (DECLARED_PRODUCT_KEY_PATTERN,
# isDeclaredProductKey, declaredProductKey) while the legacy
# PROJECT_KEY_PATTERN/projectKey exist, because PRODUCT and PROJECT are two
# letters apart (GH-408 may drop the qualifier with the legacy names);
# CLONE_KEY_PATTERN and cloneKey are UNCHANGED; `projects list` keeps its
# locked command name (ODR-0003 DC-4) and prints PRODUCT / REPOSITORY;
# "project" is RETIRED from the model's own vocabulary ("Jira project" for
# the tracker's word); slugs, folder, branch, suite file names, the changeset
# file name and the change title field stay as the change's own records —
# identifiers are not vocabulary (amendment §G). ODR-0006 is the next free
# decision id, reserved by the brief (pm-notes; ODR-0001..0005 exist at base
# 22b15d31).
#
# Constants fixed by this plan (spec v1.1 F-2/F-3/F-5, DM-1/DM-2,
# NFR-1/NFR-2; observed at base 22b15d31; amendment comment 7138707234):
#   - base commit:            22b15d31 (pm-notes state detection) — encoded
#                             as a committed constant in the naming check;
#                             the check asserts tree-vs-pinned-base, a legal
#                             permanent invariant, never a moving-base diff
#   - product-key grammar:    DECLARED_PRODUCT_KEY_PATTERN (renamed from the
#                             delivered DECLARED_PROJECT_KEY_PATTERN by the
#                             amendment; same change, same value) is
#                             ^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$ — exactly
#                             2..64 characters, lowercase alphanumerics and
#                             hyphens, no leading/trailing hyphen
#                             (path-safe by construction); the PREDICATE,
#                             isDeclaredProductKey (renamed from the
#                             delivered declaredProjectKeyVerdict), not the
#                             bare regex, additionally refuses the reserved
#                             state segments `unbound` and `projects`,
#                             exact-match on the whole key — substring-
#                             containing keys (projects-x, my-unbound) are
#                             accepted (spec §21, TC-DPKKEY-002); the
#                             reserved segment `projects` keeps its name — a
#                             state-layout segment, not model vocabulary
#   - clone-key pattern:      CLONE_KEY_PATTERN is the NAME of the DELIVERED
#                             clone-identity pattern value
#                             /^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?-[0-9a-f]{8}$/u
#                             (packages/core/src/contracts/projects.ts at
#                             base) — never a new grammar; the legacy
#                             PROJECT_KEY_PATTERN stays exported as the
#                             same-value alias (String-equal, 0 difference,
#                             NFR-2 — the alias pair is
#                             PROJECT_KEY_PATTERN ≡ CLONE_KEY_PATTERN;
#                             DECLARED_PRODUCT_KEY_PATTERN is pinned to its
#                             OWN grammar value and no cross-value equality
#                             to the clone-key pattern is asserted: disjoint
#                             contracts, DM-1 vs DM-2); cloneKey (accessor)
#                             is unchanged by the amendment
#   - header literals:        `projects list` group table GROUP→PRODUCT (the
#                             product's own key) and MEMBER→REPOSITORY (the
#                             member declaration's selector or locator)
#                             (packages/cli/src/output/projects-text.ts
#                             GROUP_HEADER); PROJECT and PROJECT REPOSITORY
#                             are ASSERTED-ABSENT headers — PROJECT
#                             REPOSITORY is prose-only contrast, never a
#                             header; `repos list` KEY→CLONE
#                             (packages/cli/src/output/repos-text.ts, as
#                             delivered); the flat-alias HEADER in the SAME
#                             file (projects-text.ts) is untouched byte for
#                             byte — it IS the `--flat` text surface
#   - suite file names:       the five new suites, the check, and its
#                             mutation suite are pinned VERBATIM from test
#                             plan §7 (constraint (a) satisfied by adoption —
#                             no deviation, no reconciliation notes owed);
#                             file names are IDENTIFIERS and are NOT renamed
#                             by the amendment (§G) — the delivered names
#                             stay even where they contain "project":
#                             tests/structure/declared-project-key.test.ts,
#                             tests/structure/delivery-vocabulary.test.ts,
#                             tests/structure/vocabulary-conformance.test.ts,
#                             tests/behaviour/projects-clone-key.test.ts,
#                             tests/behaviour/clone-identity-fixtures.test.ts,
#                             scripts/checks/new-code-naming.ts,
#                             tests/checks/new-code-naming.test.ts
#   - naming baseline:        scripts/checks/new-code-naming.baseline.json —
#                             committed, reason per entry (follows the
#                             forbidden-literals.registry.json precedent); the
#                             guarded token stays the bare legacy `projectKey`
#                             (amendment item C: unchanged)
#   - changeset:              .changeset/gh-406-delivery-vocabulary-declared-project-key-minor.md
#                             (file name kept — an identifier) declaring the
#                             five fixed-group packages (@delivery-os/core,
#                             adapters, cli, mcp, opencode) at minor (spec
#                             front matter version_impact: minor; lockstep
#                             config); the delivered BODY carries the
#                             pre-amendment nouns and export name and is
#                             re-worded in phase 8's amendment commit
#
# Plan-wide delivery fences (binding), in force on every phase below:
#   - Amendment fence (owner comment 7138707234, spec v1.1, rev 3): the
#     amendment is authoritative (body < brief < amendment) and is applied
#     end to end in the phases below; the vocabulary nouns are product /
#     repository / product key, with "project" retired from the model's own
#     vocabulary and "Jira project" written where the tracker's own word is
#     meant; "product repository" is a prose-only contrast form, never a
#     header; the "the tool" prose rule (where the docs say "the product"
#     meaning the tool itself, they say "the tool") is applied to the pages
#     this change already touches — the migration guide, the local-install
#     guide, the m4 install page, the m2 attempts page, the three m2
#     repos/projects/board pages, and any page the phase-6 walk covers —
#     while the ~45-line remainder sweep is routed to GH-408; public examples
#     in the amended docs are neutral only (acme, example.com — no real
#     company, nothing private); the change's own identifiers (slug, folder,
#     branch, suite file names, the baseline file, the changeset file name)
#     stay as delivered.
#   - Zero-rename fence (NG-1, NFR-5, AC-F10-1): no BASE-delivered command
#     name, subcommand, payload field, envelope key, or persisted field
#     (identity-marker field, host-index field, `--flat` alias payload field)
#     is renamed, removed, or re-keyed anywhere in this change. The four
#     named exceptions survive untouched: the `projects.*` error-code family,
#     the `<host root>/projects/` container, `--project-root`, and the
#     `--flat` alias. `board --project` keeps its flag name and its never-
#     group-scoped behaviour (NG-6); only its HELP wording changes (it says
#     clone identity). The legacy PROJECT_KEY_PATTERN/projectKey and
#     CLONE_KEY_PATTERN/cloneKey keep their delivered identifiers. The ONE
#     directed exception is the amendment's rename of THIS change's own
#     new-code exports (DECLARED_PROJECT_KEY_PATTERN →
#     DECLARED_PRODUCT_KEY_PATTERN; the delivered predicate
#     declaredProjectKeyVerdict → isDeclaredProductKey, with its supporting
#     new-code names following) — these were introduced by this change, are
#     not payload or persisted surfaces, and rename exactly as the owner
#     directs, with their inventory rows. The header/help text renderings
#     remain the ONLY operator-visible change.
#   - --flat byte-identity fence (NFR-3, constraint (d)): the alias payload AND
#     text stay byte-identical to the pre-change output; verification lives in
#     phase 3 — the one phase that touches the header code (the flat HEADER
#     constant sits in the same file as the changed group header); the pinned
#     pre-change literals in tests/behaviour/projects-flat-alias.test.ts are
#     never regenerated; a delta is a defect, never a golden update. The
#     amendment does not touch the alias surface.
#   - Additive-contracts fence (F-2..F-4, NG-4, DEC-4, §8.5): the contracts are
#     purely additive; the local groups.v1 layer enforces NO pattern (its
#     no-public-pattern contract stands unamended); nothing migrates and no
#     schema changes; the declared-product-key ENFORCEMENT POINTS are not
#     created here — credential audiences/bindings/store scope/workspace base
#     (GH-396/397/399) and manifest write/import (GH-401, the manifest names
#     the key `product.key`) consume the contract this change delivers; the
#     declared product key and the clone identity stay in disjoint namespaces
#     and are never compared (spec §21).
#   - Wording-only pin-update fence (constraint (b), F-10, TC-DPKPIN-001):
#     every pre-existing suite update is wording-only — header-string literals,
#     exported-name inventory entries, describe titles, wording comments —
#     never a payload assertion, field name, or expectation value; pin updates
#     land in the SAME phase as the wording they pin, so the tree is green at
#     every phase boundary (spec §18); existing TC IDs from other changes
#     (TC-GRPBOUND-002, TC-GRPSREAD-003, and all others) keep their IDs and
#     intent — only their pinned wording refreshes; a pin that turns out to be
#     unnameable in the new wording is the STOP trigger above, never a silent
#     weakening. Export-name inventory rows (content-inventory,
#     v1-contract-inventory) FOLLOW the amendment's renamed exports — updating
#     the name a row pins is the rename's own consequence, not a payload
#     change; no row is dropped.
#   - Conditional-sweep rule (TC-DPKPIN-001 step 4): if a suite NOT declared in
#     any scope below trips on the renamed exports or the noun corrections,
#     its wording-only re-pin lands in the SAME phase as the change that
#     tripped it, with the trip and the wording-only verdict recorded as a
#     pm-notes notes: entry — never as plan progress, never deferred to a
#     later phase (that would strand a red boundary). Two trips observed in
#     the delivered run are now DECLARED surfaces: the port-contract
#     inventory rows (phase 2) and the projects-groups-list header pins
#     (phase 3).
#   - Naming-rule fence (F-7, NFR-6, constraint (c)): the check, its committed
#     reason-bearing baseline, its gate-chain wiring, and its mutation tests
#     landed as ONE commit (phase 1, delivered at 0b49e404) and stay green at
#     every later boundary; the rule is file-existence-at-the-pinned-base
#     based — a file absent at 22b15d31 may not contain the bare token
#     `projectKey` without a baseline entry, pre-base files are exempt with no
#     per-file counts consulted; every baseline entry carries a non-empty
#     reason and is review-visible. The baseline's entries cover the check's
#     own forbidden-token literal, the mutation suite's injected token, and
#     the delivered field-name-pinning suites; later phases extend it only
#     when a re-authored file must spell a delivered persisted field name,
#     each extension in the same commit as the file it covers. The amendment
#     changes NO part of this surface: the guarded token is the bare legacy
#     `projectKey` and stays (amendment item C).
#   - Conformance fence (F-6, NFR-4, Appendix B): scope is exactly CLI help
#     summaries; the text headers of `projects list` and `repos list`; the
#     guides tree; the tools documentation tree; the overview tree; every
#     command reference page under
#     `doc/planning/oss-tooling/milestones/*/commands/**` (42 pages at base:
#     m1 28, m2 12, m4 2) — the three m2 pages (repos, projects, board) are
#     pin surfaces (§F), a subset of the sweep, never its definition. The four
#     named exceptions (projects.* error codes, <host root>/projects/ container,
#     --project-root, --flat) are frozen until GH-408 and proven individually
#     exempt; near-miss strings outside the list still flag. The scanner's
#     detection core is a PURE FUNCTION callable over injected input
#     text/files, matching whitespace-normalized text with an original-line
#     map (delivered phase-9 hardening — wrapped arms stay); the negative
#     proof lives entirely in synthetic in-memory inputs and test-created temp
#     trees under the session temp root; NO violation is ever planted in the
#     committed tree (git status unchanged by any test). The scanner's sense
#     rules speak the amendment's vocabulary: a clone identity presented as
#     the product or as a product key flags; the declared-term sense is
#     product key; the tracker sense reads "Jira project"; the reserved
#     segment `projects` and the exceptions stay state-layout/command-surface
#     identifiers, not model vocabulary. The scanner lands AFTER the overview
#     (phase 4) and CLI/reference (phase 3) corrections and TOGETHER WITH the
#     guides/tools sweep, so its clean-tree pass is truthful and meaningful at
#     the phase boundary.
#   - Decision-record fence (F-9, NG-5, AC-F9-1): under doc/decisions/ only
#     ODR-0006 and its 00-index.md row are touched; no earlier record is
#     edited; doc/decisions/00-register.md is NOT touched — no AC, spec
#     component row, or pm-notes obligation names a register binding, and the
#     owner's acceptance at the PR is the act that settles the vocabulary's
#     standing (TC-DPKODR-001's unedited-earlier-records half is the review-time
#     diff inspection). ODR-0006 carries no ados_distribution header (project-
#     specific decision record, per the distribution marker rules and pm-notes).
#     The re-worded record states the vocabulary with the amendment's product
#     nouns AND the retirement clause ("project" is retired from the model's
#     own vocabulary; "Jira project" for the tracker's word), still status
#     Proposed with decision_date null; the index-row mechanism is unchanged.
#   - Review-time evidence fence: TC-DPKODR-001 step 6 (earlier-records diff),
#     TC-DPKPIN-001 step 3 (wording-only diff discipline), and TC-DPKPIN-002
#     (zero-rename diff inspection vs base 22b15d31) execute at the
#     review/quality-gate boundary, NOT inside any plan phase; their verdicts
#     are logged in the test plan §10 and pm-notes. The re-opened lifecycle
#     re-runs review and the full quality gates over the amended delivery, and
#     the verdicts are re-recorded there.
#   - Fixture fence (F-8, NFR-7, Appendix C): fixtures G-1..G-3 build on the
#     tests/fixtures/projects/ helpers (temp repositories, identity markers,
#     host fixtures, host-index readers, groups configuration), run entirely
#     under the session-scoped temporary root (gate convention
#     TMPDIR=$PWD/tmp/tmpdir), use no network, no wall clock, no hostname, and
#     write nothing outside the temp root; G-3's legacy configuration case uses
#     a committed case definition plus its grammar-valid twin; the committed
#     tree stays clean. G-2's wording is the amendment's: two clones of one
#     repository resolve the SAME PRODUCT KEY with different clone identities
#     and state roots; the mechanism is unchanged.
#   - Phase-gate fence: each phase below is ONE commit through the commit
#     primitive on branch feat/GH-406/delivery-vocabulary-declared-project-key,
#     and each phase boundary is green under TMPDIR=$PWD/tmp/tmpdir pnpm check
#     (narrow suites during iteration; the full gate at the boundary); the PR
#     targeting main-tools, merge authority, tracker transitions, and the
#     lifecycle review/quality-gates phases belong to the lifecycle, not this
#     plan; no doc edit outside a declared phase scope may leak into any
#     commit.
#   - Amendment re-execution accounting (rev 3, owner-directed reopen of the
#     delivery phases): the delivered run's commits (1 0b49e404, 2 0a780df4,
#     3 b9354594, 4 bc6f64cc, 5 4ab411fd, 6 bb7aa6ce, 7 732a16ea, 8 24dfdd07,
#     9 5e57e3af) remain recorded evidence in pm-notes for the surfaces they
#     delivered. The amendment's NEW work lands as NEW commits in the phases
#     that own each touched surface (phases 2, 3, 4, 5, 6, 7, 8 below) — one
#     amendment commit per phase, each with its own gate evidence, and the
#     per-phase completion accounting is recorded ONLY as pm-notes notes:
#     entries (phase id, new commit hash, gate result), never in this plan.
#     Phases 1 and 9 are amendment-INDEPENDENT (verified: the naming check's
#     guarded token is the bare legacy `projectKey`, unchanged; phase 9's
#     wrapped-phrase and normalization mechanics carry no model-vocabulary
#     noun) and carry their delivered commits and evidence without
#     re-execution — if the coder finds an amendment-driven touch is needed
#     in either, that is a finding to report, not planned work. The PR title
#     and body are updated and the branch pushed (including the unpushed
#     evidence commit e6490b82) in the lifecycle, not here.
#   - Documentation-split fence: the overview/glossary/feature-spec/reference/
#     guides doc edits that ACs AC-F1-1, AC-F5-1, AC-F6-1 assert through
#     automated suites ARE delivery work and land in their declared phases
#     below; phase 8's doc/spec/features entries are DECLARATION ONLY — the
#     residual contract-truth reconciliation (the amendment's product/
#     repository/product-key nouns, the mapping row product = a group with
#     named exceptions, the renamed contract-name mentions, the grammar,
#     alias, accessor wording beyond the AC-edits of phase 4) is executed by
#     doc-syncer in the lifecycle system_spec_update phase; no coder task
#     edits them in phase 8's commit (the amended changeset file is that
#     commit's release artifact).
