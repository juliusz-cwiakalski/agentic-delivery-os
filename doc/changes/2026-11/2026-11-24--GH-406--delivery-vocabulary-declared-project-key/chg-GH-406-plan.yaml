    # TC ownership: TC-DPKNAM-001, TC-DPKNAM-002 (F-7, AC-F7-1, NFR-6, RSK-4).
    # Constraint (c): the baseline (reason per entry) landed with the check in
    # this ONE commit. Constraint F-7 sequencing: the check existed BEFORE any
    # later phase created files, so every subsequent new file is governed from
    # birth; later baseline extensions are reason-bearing and land in the same
