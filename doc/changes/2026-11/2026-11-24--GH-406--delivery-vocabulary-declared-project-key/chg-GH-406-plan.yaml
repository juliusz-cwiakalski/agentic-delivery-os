  - id: 2
    title: Additive core contracts — DECLARED_PRODUCT_KEY_PATTERN with predicate isDeclaredProductKey (renamed to the amendment's names), CLONE_KEY_PATTERN name, same-value legacy alias, served cloneKey accessor
