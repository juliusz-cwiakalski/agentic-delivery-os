reviewer_notes: |
  Verdict rationale: 2 blockers, so FAIL (not PASS_WITH_NOTES). Both blockers are
  spec-compliance/correctness failures against normative text, not stylistic
  concerns, and both are untested by the delivered battery (a test that cannot
  fail is why they survived).

  What is strong and should not be reworked: the admission claim is genuinely
  atomic and the two-invocation interleave is deterministic and strong (the latch
  is the injected delay and the release is wired to the winner's lease append;
  both parked orderings are tested, and the assertions on leaseAcquisitions,
  attempt count, spawn count, holder, and no-fallback.internal are concrete). The
  lane resolver, lane-record guard, tracker ladder, arm-aware corroboration
  (exactly the two changed arms with a token-level window gate preserved), the
  daemon-path regression (TC-PARITY-006), the spawn-identity tests, and the
  closed-contract pin are real and non-vacuous. The disclosed deviations are
  legitimate except the terminate one: cold-resume registration and resume argv
  adjacency are required for AC-F3-1/AC-F7-1; the provider-profile `pm` model, the
  state-additivity lane pin, and the named check:no-shell script (not in the
  aggregate chain, discovered by bun test) are consistent with the code and the CI
  topology invariant.

  Top three to fix first: B1 (artifact ladder gated on the classifier's finished
  token), B2 (an incapable adapter restarts a below-bound stall), M1 (production
  terminate is not the declared process-tree + grace + exact-identity reap).

  Fairness notes: the `completedSession` gate is explicitly described in the PM
  notes as "gated on the classifier's finished token", so it was a deliberate
  implementation choice; it is still contrary to Appendix F(C) arm ordering, the
  shell reference, and AC-F4-3, so it is recorded as a blocker rather than an
  accepted deviation. Appendix C(3) bounds what the battery can prove about kernel
  signal delivery; it does not authorise the production adapter to omit the tree
  reap and the declared grace, hence M1 is a production gap, not merely a proof
  boundary. The ledger-unreadability removal (i3) is deliberate and cited; it is
  recorded as info, not a finding.

  Diff reviewed: 23 commits, 114 files, +17474 / -861 (9149 doc insertions, 8325
  non-doc). Record path:
  doc/changes/2026-11/2026-11-18--GH-347--dispatch-core-parity/code-review/review-iter-1.yaml.
