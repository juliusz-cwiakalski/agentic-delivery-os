      alias (`const s = spawn`), `await import(...)`, or a substituted template
      path. The 22-file surface is a static list with no glob/reachability guard
      (a new `dispatch-*.ts` is silently unscanned). The module's CLI `main()`
      exit path is never executed by any gate (the script is not in `pnpm check`
      or CI; only the bun-test-discovered suite runs the library functions).
    suggestion: >
      Extend the rules to `require`/default import/alias/dynamic import and a
      non-literal script path; derive the surface from the declared
      `dispatch-*.ts` patterns or add a test asserting the list equals the glob
      and is reachable from the dispatch entry; either wire `check:no-shell` into
      the aggregate check/CI or assert the suite is the sole gate.
  - id: m4
    severity: minor
    confidence: medium
    category: correctness
    location: packages/core/src/app/dispatch.ts:807-810,1397-1403
    message: >
      `lane:append-failed` and `tracker:exhausted` are appended to the END of
      the evidence-ref array before `.slice(0, 16)`. When the prior refs already
      fill the 16-bound the disclosure is truncated away, so resumability or
      tracker exhaustion could be silently undisclosed — contrary to AC-F1-3
      ("resumability is never silently claimed") and the exhaustion-naming
      requirement. In practice the refs are few, so this is a latent risk.
    suggestion: >
      Prepend (or reserve slots for) the disclosure refs, or drop a lower-value
      ref, so the bounded-evidence channel always carries
      `lane:append-failed`/`tracker:exhausted`.
  - id: m5
    severity: minor
    confidence: high
    category: test-coverage
    location: tests/behaviour/dispatch-truth-derivation.test.ts:378-392,454-463
    message: >
      TC-DERIVE-006 step 2 requires per-input disjointness ("exactly one arm
      matches each input"), instrumented by a declared arm identifier; the
      delivered test only asserts the token per row and never asserts which arm
      matched. The row C10 is labelled `arm: "classifier"` but its input
      (completed harness, commits=2, pm-notes incomplete) actually matches arm 7
      (commits-incomplete), so the classifier arm (arm 9) is never exercised.
      This both violates the test plan's step 2 and hides B1.
    suggestion: >
      Return a declared arm id from the derivation (or instrument it in-test) and
      assert exactly one match per input; rebuild C10 to actually exercise the
      classifier arm (a non-completed outcome with no decisive artifact).
  - id: m6
    severity: minor
    confidence: high
    category: correctness
    location: tests/checks/no-shell-dispatch.test.ts:82-100
    message: >
      The planted-control test calls `mkdtempSync(join(ROOT, "tmp", "tmpdir",
      ...))` without a recursive parent guard; `tmp/` is git-ignored and has no
      tracked files, so on a clean clone running that file alone the test throws
      ENOENT. It passes here only because earlier suites create `tmp/tmpdir`.
    suggestion: >
      `mkdirSync(join(ROOT, "tmp", "tmpdir"), { recursive: true })` before
      `mkdtempSync`, or use `os.tmpdir()`.
  - id: i1
    severity: info
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch.ts:789,1008
    message: >
      Both the active and terminal lane appends are conditional on
      `ports.laneOwner !== undefined`. A composition that omits the owner facts
      writes no lane at all, silently losing resumability. Production supplies an
      owner when `ownProcessId > 0`; the parity lane cases seed an owner. DM-1
      requires an owner object, so this is a defensible design, but the
      silent-no-lane failure mode is worth an explicit guard/warning.
    suggestion: "No change required for this change; consider a diagnostic when the owner is absent on a session-bearing dispatch."
  - id: i2
    severity: info
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch.ts:1244-1273
    message: >
      `appendRestart === undefined` is treated as "recorded" (`restartRecorded =
      ports.appendRestart === undefined || ports.appendRestart(...)`), so a
      composition without the restart append restarts without an
      `economics.restart` record, diverging from NFR-4's one-record-per-ordinal.
      Production composes it; the engine silently permits the gap.
    suggestion: "No change required for this change; a composition that omits the append could be rejected at wiring time."
  - id: i3
    severity: info
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/dispatch-result.ts:243-356
    message: >
      The derivation no longer reads `input.ledger` at all; an unreadable ledger
      no longer yields state-unverified. This is deliberate (the ledger's role
      narrowed to resume position/progressed; §8.5 "Phase-ledger no-work arm
      retired") and is asserted positively (unreadable ledger -> pr-open in
      dispatch-state-unverified.test.ts:38-45). Recorded so it is not mistaken
      for drift; the human-readable AC-F4-3 citation is a little loose for the
      *ledger* half, but §8.5 supplies it.
    suggestion: "No action; keep the §8.5 citation."
  - id: i4
    severity: info
    confidence: high
    category: correctness
    location: tests/fixtures/dispatch/parity/terminate.ts:160,247 vs packages/adapters/src/harness/opencode.ts:549-553
    message: >
      The terminate double reads `handle.treeRoot` as a numeric pid; the
      production handle stores the session id in `treeRoot`. Production
      `terminate` never reads `treeRoot`, so this is cosmetic for now, but the
      double's process-tree model does not mirror the production handle shape.
    suggestion: "No action for this change; keep the double's pid model documented as a fixture-only shape."
