findings:
  - id: B1
    severity: blocker
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/dispatch-result.ts:266-277
    message: >
      The artifact ladder (open PR, already-merged PR, commits+pm-notes,
      nothing-to-do) is reachable only when `harness.token === "finished"`
      (`const completedSession = harness.token === fin; if (!completedSession)
      return base({ token: harness.token ... })`). A session whose harness
      outcome is `completed` with a tool failure classifies to token `partial`,
      a `premature-end` session classifies to `partial`, and a non-zero exit
      classifies to `failed`; for all of those the derivation returns the
      classifier token BEFORE consulting artifacts. Appendix F(C) is a
      first-match ladder in which arms 4-8 (artifact) precede arm 9 (the
      classifier token), and arm 9 explicitly exists to catch "a reported
      failure or non-zero exit -> failed; a tool failure or premature end ->
      partial", which proves the ladder is evaluated for non-clean sessions.
      §8.5 says "After a completed session, derivation is artifact-first", and
      the shell's decide_after_iteration refines a `failed`/`state-unverified`
      classification with the artifact verdict on a finished monitor. So a
      failed session that opened a PR, or committed with complete pm-notes,
      resolves `failed`/`partial` here instead of `pr-open`/`finished`. This is
      a parity regression relative to the delivered pre-change derivation (which
      applied the artifact arms unconditionally) and to AC-F4-3. It is untested:
      every C-row in TC-DERIVE-006 uses a `finished`-token harness, and the
      "classifier" row C10 actually matches arm 7 (commits-incomplete).
    suggestion: >
      Gate the artifact ladder on the session having ENDED (this function is
      only reached after collection and only for non-stall sessions), not on the
      classifier token being `finished`. Evaluate arms 2-8 for every ended
      session, then fall to the classifier token (arm 9) and only then to
      state-unverified (arm 10). Add rows to TC-DERIVE-006 for failed+open-PR,
      failed+commits-complete, premature-end+open-PR, and
      completed-with-tool-failure+commits-complete, asserting the artifact
      token; and implement the per-input disjointness/arm assertion the test
      plan requires (so C10 cannot be mislabelled).
  - id: B2
    severity: blocker
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch.ts:1129-1276
    message: >
      In the stall branch, when the adapter exposes no `terminate` member
      (`ports.harness.terminate === undefined`), the engine skips termination and
      then falls through to `admitDispatchRestart`; below the bound it consumes
      an ordinal, appends an economics.restart, sets `handle = session.value`,
      and `continue`s to a second iteration that resumes the still-live session.
      F-5 states "On an adapter that declares no terminate capability, the engine
      starts no second session and applies the same short-circuit rule", and
      AC-F5-4 states "the engine starts no second session; it returns a terminal
      verdict if one exists, otherwise state-unverified at exit 2". The restart
      decision is not capability-gated. The only incapable-adapter test
      (`terminateIncapable`) uses a tracker-done truth that short-circuits to
      `merged`, so the restart path is never exercised.
    suggestion: >
      Thread a `terminateCapable` fact into the stall decision. When the adapter
      is not terminate-capable: return the terminal pre-restart verdict if one
      exists, otherwise record terminal `state-unverified` at exit 2 with the
      stall evidence; never consume an ordinal or start a second iteration. Add
      a TC-TERM-005 row: incapable adapter, below-bound stall, decisive artifact
      OUTSIDE the terminal set (e.g. commits+complete pm-notes) -> one iteration,
      zero economics.restart, terminal state-unverified, no second session.
  - id: M1
    severity: major
    confidence: high
    category: security
    location: packages/adapters/src/harness/opencode.ts:670-688 + packages/adapters/src/host/index.ts:23,155-207
    message: >
      The production `terminate` does `record.kill()` (the host starter's kill),
      then awaits `terminateWait(graceMs)`, and returns literal
      `{terminated:true, escalated:true, reaped:false}`. The starter's kill
      escalates to SIGKILL after a fixed `KILL_GRACE_MS = 100` (not the declared
      20 000 ms grace) and signals only the direct child (the child is not spawned
      `detached`, so no process group is signalled); there is no escaped-runtime
      reap anywhere in production. TDR-0051 explicitly forbids reusing the 100 ms
      probe escalation for terminate and requires the reported booleans to match
      the observed acts. API-5/AC-F5-5/NFR-6 require TERM to the process tree,
      KILL only after the declared grace, and an exact-identity reap. Appendix
      C(3) bounds what the battery can PROVE about kernel delivery; it does not
      license omitting the implementation. The disclosure in pm-notes is honest
      but does not satisfy the AC.
    suggestion: >
      Implement the declared contract in the opener terminate: escalate on the
      configured `graceMs` (not the 100 ms probe constant), signal the process
      tree (spawn detached / negative-pid group signal or equivalent), perform
      the exact-identity reap (session id or `ticket-<REF>` title, never a broad
      pattern), and report `terminated`/`escalated`/`reaped` from the observed
      acts. If a weaker capability is intended, declare it as a gap (then the
      engine must not start a second session per AC-F5-4) and narrow AC-F5-5 in
      a spec revision rather than shipping a stronger claim than the code.
  - id: M2
    severity: major
    confidence: high
    category: correctness
    location: packages/adapters/src/harness/opencode.ts:645-652,678-680
    message: >
      On resume, the session record copies the previous record's `terminated`
      flag (`...(record?.terminated === undefined ? {} : { terminated:
      record.terminated })`). The stall loop restarts by resuming the SAME
      session id, so iteration 2's terminate sees `record.terminated === true`
      and early-returns success without signalling, while the resumed process is
      live. The injected stall double mirrors this (the `terminated` Set is keyed
      by session id and never cleared on resume), so no test can catch it. This
      defeats "no second session until the first is confirmed terminated" across
      restarts on the shipped adapter.
    suggestion: >
      Clear `terminated` when a new resume stream is registered (a resumed
      session is a new live process tree), or key idempotence by a per-acquisition
      token rather than by session id. Add a two-stall test against the production
      adapter (or a faithful double) asserting the second stall is signalled.
  - id: M3
    severity: major
    confidence: medium
    category: spec-compliance
    location: packages/core/src/domain/dispatch-liveness.ts:179-183
    message: >
      `dispatchStallUndecidable` returns `!tracker.ok && !artifacts.ok` — it
      requires BOTH reads to fail. Appendix F(C)(10)/F(D) define undecidable as
      "any required read unreadable and no decisive artifact". At a stall with a
      readable, non-done, non-blocked tracker and an UNREADABLE artifact read,
      the pr-open short-circuit cannot be evaluated, so the truth is undecidable
      and the result must be terminal `state-unverified` with no slot; the
      delivered code treats it as decidable and restarts (burning the budget and
      starting a second session on a capable adapter). The only unverified-stall
      fixture fails both reads, so this branch is untested.
    suggestion: >
      Treat the artifact read as required for the stall decision: if
      `!artifacts.ok` (and no tracker-terminal short-circuit), return terminal
      `state-unverified` with the stall evidence and consume no ordinal. Add a
      TC-TERM/LOOP row with tracker readable non-terminal + artifact unreadable.
  - id: M4
    severity: major
    confidence: high
    category: test-coverage
    location: tests/conformance/dispatch/dispatch-parity-battery.test.ts:154-172
    message: >
      TC-PARITY-003 builds `summary` as `{id, token, exit}` and deep-equals the
      two runs on that projection only. AC-F9-3 requires "envelopes, attempt
      counts, and class coverage are identical"; envelopes and attempt counts are
      not compared. The same test asserts `run.observation.spawns` is
      `>= 0`, which is unconditionally true. Separately, only 8 of the 29
      registry rows actually produce an invocation through the guarded process
      runner, so the per-invocation argv sweep in TC-SHELL-001 is empty for 21
      rows.
    suggestion: >
      Canonicalize and compare full envelopes and attempt counts across the two
      runs; drop the `>= 0` assertion (assert the concrete expected count or
      remove it). Either drive the class/loop/terminate rows through the guarded
      runner or state explicitly which rows invoke a process and assert that set.
  - id: M5
    severity: major
    confidence: high
    category: test-coverage
    location: tests/fixtures/dispatch/parity/process-runner.ts:178 + tests/fixtures/dispatch/parity/terminate.ts:71-92,119-142,267-268 + tests/conformance/dispatch/dispatch-parity-no-shell.test.ts:45-48
    message: >
      Three non-vacuity controls cannot fail. (a) `realChildStarts` is the
      literal `0`, and the test creates a fresh unused guarded runner and asserts
      it is 0 — it proves nothing about the battery. (b) The terminate double
      declares a `violations` array and returns it, but nothing ever pushes to it
      (the "stays empty by construction" comment), and the model's `signalTree`
      can only signal a pid's recorded descendants, so the "no unrelated process
      signalled" assertions (stall-loop test on pids 9103/9104/9105; battery row
      on 9103) are guaranteed regardless of a buggy adapter. (c)
      `NO_SHELL_ALLOWLIST` is exported but never consulted by `scan`; asserting
      it is empty is true by construction. The terminate seam also has no entry
      in the import-identity `SEAM_MANIFEST` while `terminate` is in the PROVEN
      list.
    suggestion: >
      Delete or implement `realChildStarts` (record actual child starts). Make
      the terminate double record a call in `violations` when an incapable port is
      asked (or assert `terminateCalls` length directly for the incapable row).
      Add a broad-pattern control (a process matched by a substring/name) that a
      correct exact-identity matcher does NOT reap, so the negative assertion can
      fail. Wire the allowlist or remove it. Add a `terminate` entry to the seam
      manifest proving the production module/entry it imports.
