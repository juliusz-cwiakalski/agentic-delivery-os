  - id: m1
    severity: minor
    confidence: high
    category: spec-compliance
    location: packages/core/src/app/dispatch.ts:1152-1182,1240-1275
    message: >
      For a restarted iteration, the stall verdict and the termination result are
      not recorded as attempt evidence: the restarted iteration appends no
      attempt, and the terminal attempt's evidence is rebuilt from the LAST
      iteration's `livenessRefs`, so the stalled iteration's `liveness:stalled`
      and `terminate:*` refs are lost (only the economics.restart reason
      survives). F-5/AC-F5-1 and §10 require the stall verdict and termination
      result as bounded attempt/lane evidence. The delivered dispatch-watch test
      removed its `liveness:stalled` assertion and comments that the stall is
      recorded on the restart, not the attempt.
    suggestion: >
      Carry the stalled iteration's stall/termination refs forward onto the
      terminal attempt (or onto the next active lane record / economics.restart
      evidence) so the termination result is durable. Restore the removed
      assertion in the appropriate form.
  - id: m2
    severity: minor
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:3058-3060
    message: >
      The lifecycle prompt is parameterized by the hardcoded constant
      `CLOSEOUT_INTEGRATION_BASE` ("main-tools"), not "the resolved base branch".
      AC-F7-3/F-7 require the resolved base branch; in a repository whose base is
      not `main-tools` the prompt would instruct the agent to sync against the
      wrong branch. The spawn test asserts the literal "main-tools", proving the
      constant rather than a resolution.
    suggestion: >
      Resolve the base branch (the existing closeout/base-ref resolver or the
      configured integration base) and pass it to `buildLifecyclePrompt`; add a
      case with a non-default base asserting the prompt carries it.
  - id: m3
    severity: minor
    confidence: high
    category: test-coverage
    location: scripts/checks/no-shell-dispatch.ts:97-162 + tests/checks/no-shell-dispatch.test.ts:54-100
    message: >
