summary: >
  Iteration 1, first review. The change delivers the ten declared parity gaps:
  a durable dispatch-owned `dispatch.lane` record, atomic in-claim admission
  with declared verdicts and a bounded fence wait, recorded-attempt resume
  (including `pr-open`), a five-attempt tracker ladder with artifact honesty,
  a capability-gated `terminate` contract, an in-process bounded restart loop,
  the `pm`/`--title ticket-<REF>`/lifecycle-prompt spawn identity, the total
  derivation order with tracker-done `merged` and artifact `partial`, and an
  offline parity battery with a static no-shell invariant. The closed
  vocabulary, projections, exits, error-table rows, domain kinds, attempt
  schema version, and configuration defaults are unchanged (verified by test
  and by the contract-invariance pin). The lane resolver, admission interleave
  (both orderings), resume, spawn identity, and daemon-shared derivation are
  exercised through real composed seams and are genuinely non-vacuous. Two
  blockers prevent acceptance: (B1) the derivation gates the artifact ladder on
  the classifier token being `finished`, so a `failed`/`premature-end`/
  completed-with-tool-failure session with a decisive artifact returns the
  classifier token instead of the artifact verdict required by Appendix F(C)
  (arms 4-8 precede arm 9), violating AC-F4-3 and diverging from the shell;
  (B2) the loop restarts a below-bound stall on an adapter that declares no
  terminate capability, starting a second session, violating AC-F5-4. Six
  majors follow: the production `terminate` is materially narrower than the
  published contract (fixed 100 ms KILL escalation, direct child only, no
  exact-identity reap, literal `reaped:false`/`escalated:true`, and a
  `terminated` flag inherited across resume so later iterations are never
  signalled); the stall-undecidable predicate is too narrow; the AC-F9-3
  determinism oracle compares only token+exit, not envelopes/attempt counts;
  three non-vacuity controls are vacuous; and three delivered assertions were
  deleted/relaxed without an authorising clause for the deletion. Verdict FAIL.
