findings:
  - id: F-1
    severity: info
    confidence: high
    category: documentation
    location: doc/spec/features/feature-session-lifecycle-economics.md:9,68; doc/spec/features/feature-dispatch-engine.md:682; doc/overview/glossary.md:480-481
    message: >-
      Two current-truth pages and the glossary still use "exact-identity reap" wording
      (the economics page bullet and frontmatter summary, and the dispatch page's
      TDR-0046 link annotation), and the glossary Terminate/Exact-identity reap entries do
      not state the match-not-OS-reap meaning or the port-carried declaration. The
      harness-adapter page and the code already state that `reaped` reports the match.
    suggestion: >-
      Optional tightening: align the "reap" wording to "exact-identity match" on those
      lines and add the match semantics to the glossary Terminate entry. Asserts nothing
      false today (the adapter signals only exact-identity-matched runtimes and reports a
      match), so this is cosmetic, not a blocker.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: info
    confidence: high
    category: test-coverage
    location: tests/behaviour/dispatch-truth-derivation.test.ts:577-600
    message: >-
      The 16-id closed-arm mirror is a local copy of the module-internal
      DISPATCH_RESULT_ARM_IDS; the test asserts the mirror's size is 16 and that each
      row's declaredArm is a member, but does not assert identity-equality with the module
      constant. A future 17th arm added without a corresponding row would not be caught by
      the count assertion alone.
    suggestion: >-
      Optional: export the closed set from dispatch-result.ts and import it in the test, or
      add a source-scan assertion that the mirror's member list equals the module's. No
      behavioural impact; the current 16 ids match exactly.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: info
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch.ts:661-664
    message: >-
      declaresTerminate keeps a fail-open default: an absent `capabilities` member is
      treated as terminate-capable. This is documented and now reachable only by an
      explicitly undeclared double, but a future production adapter that forgets to declare
      would silently be classified capable rather than refused.
    suggestion: >-
      Optional hardening: add a composition-time assertion (or a structure test over the
      production adapter set) that every production session port carries a declaration,
      so the fail-open default can never be reached from production. Accepted as a
      declared limitation for this change.
    suppressed: false
    published_url: null
    published_at: null
