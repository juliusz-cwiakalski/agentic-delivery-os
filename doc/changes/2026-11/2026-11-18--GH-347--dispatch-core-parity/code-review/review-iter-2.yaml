findings:
  - id: N1
    severity: blocker
    confidence: high
    category: spec-compliance
    location: packages/core/src/app/dispatch.ts:658-666 (with packages/cli/src/production.ts:3117-3126 and packages/adapters/src/harness/{claude,opencode}.ts)
    message: >
      The terminate-capability gate is inert in production. `declaresTerminate`
      casts the session port and reads `port.capabilities.supportedOperations`,
      returning TRUE when the declaration is absent. Neither production adapter's
      session port exposes `capabilities`: `createClaudeSession` returns
      {spawn,deliver,resume,collect,classify,liveness,listSessions} (claude.ts:157-233)
      and `createOpencodeSession` returns the same, with `capabilities` only a local
      variable (opencode.ts:429); `createHarnessProfilePort` merely spreads the port;
      and the dispatch `harnesses` map mounts them raw (production.ts:3117-3126).
      Verified statically: both ports have no own `capabilities`. Consequence: for
      `dispatch --harness claude-code` (a documented `--harness` value; HARNESS_KINDS
      includes it) the adapter that DECLARES the terminate gap (claude.ts:39-41,
      CLAUDE_CAPABILITIES) is classified capable. A below-bound stall then:
      terminationConfirmed = !(terminate !== undefined && true) = true (no terminate
      member), so the `!terminateCapable || !terminationConfirmed` gate
      (dispatch.ts:1247) does not fire; the loop consumes an ordinal, appends
      `economics.restart`, and runs a second iteration whose `resume` is a declared
      gap; the failed resume returns terminal `failed` / `spawn failed before a
      session existed` at exit 1 with `evidenceRefs: ["harness:spawn-failed"]`
      (dispatch.ts:1010-1028), dropping the stall and termination evidence. AC-F5-4
      requires NO second session, NO ordinal, and terminal `state-unverified` at
      exit 2 with the stall evidence; F-5 and DM-5 require the engine to honour the
      declared gap; the docs (feature-dispatch-engine.md:83,93;
      feature-session-lifecycle-economics.md:68,94) state "an adapter that declares
      no terminate capability ... never causes a second session", which is false on
      this path. The fixture proves the gate only because tests/fixtures/.../
      terminate.ts:189-233 attaches a `capabilities` declaration the production
      ports never carry.
    suggestion: >
      Attach each mounted adapter's capability declaration to the dispatch session
      port at the composition edge: `opencode: { ...createHarnessProfilePort({...}),
      capabilities: OPENCODE_CAPABILITIES }` and `"claude-code": { ...harnessFor(
      "claude-code"), capabilities: CLAUDE_CAPABILITIES }` in production.ts:3117-3126.
      Optionally promote `capabilities` onto the dispatch port type (or add a
      composition-time assertion) so a port cannot reach the engine undeclared.
      Then add a regression that drives a claude-shaped port (no terminate member,
      declared gap) through a below-bound stall with an outside-set decisive
      artifact and asserts one iteration, zero `economics.restart`, terminal
      `state-unverified` exit 2 with `liveness:stalled` evidence. If the fail-open
      default is kept on purpose for legacy doubles, state it as a declared
      limitation and make the production ports always declare.
  - id: N2
    severity: major
    confidence: high
    category: test-coverage
    location: tests/conformance/dispatch/dispatch-parity-stall-loop.test.ts:359-420 (+ tests/fixtures/dispatch/parity/terminate.ts:310-340)
    message: >
      The normative "an unconfirmed termination also stops the restart" branch
      (F-5/F(D); dispatch.ts:1169-1189,1247 — `terminated.value.terminated === false`
      or a rejected terminate leaves `terminationConfirmed === false`) is implemented
      but never exercised. The incapable pair (TC-TERM-005/007) proves the
      `!terminateCapable` half; the second-stall case proves re-signalling. No fixture
      returns `{terminated:false}` or rejects, so the `!terminationConfirmed` half is
      untested. The PM note's claim "an UNCONFIRMED termination stops the restart too,
      with the incapable below-bound pair" is therefore overstated (verification
      integrity, as in iteration-1 M6), even though the code is present and simple.
    suggestion: >
      Add a fixture option (e.g. `terminateConfirms: false` returning
      `{terminated:false,escalated:false,reaped:false}`, or a rejecting terminate) and
      a case asserting one iteration, zero `economics.restart`, terminal
      `state-unverified` at exit 2, and `terminate:failed` in the attempt evidence.
      Correct the PM note to name that case as the proof.
  - id: N3
    severity: info
    confidence: high
    category: test-coverage
    location: doc/changes/2026-11/2026-11-18--GH-347--dispatch-core-parity/chg-GH-347-test-plan.md:1329
    message: >
      The test plan and the disjointness test call the closed arm set "14 ids",
      but the canonical set in dispatch-result.ts:117-137 has 16 entries
      (`restart-budget` and `undecidable` are returned by real arms and are not
      among the 25 rows). The test's local membership set is a 14-id subset, not the
      true closed set. No behavioural impact; a doc/test-vs-code mismatch.
    suggestion: >
      Align the wording to 16 ids and either add rows/armId assertions for
      `restart-budget` and `undecidable` or state explicitly that they are loop/
      read-failure arms proven elsewhere. Export the closed set from the module if a
      test-side mirror is desirable.
  - id: N4
    severity: info
    confidence: high
    category: code-quality
    location: packages/cli/src/production.ts:548 (+ packages/adapters/src/harness/opencode.ts:126, tests/fixtures/dispatch/parity/process-runner.ts:8-9)
    message: >
      `signalProcess` is implemented in the production terminate seam and declared
      in the adapter's seam type, but the adapter terminate never calls it (it uses
      `signalTree`, which already falls back from `kill(-pid)` to `kill(pid)` in
      production). Also `reaped` is reported as `targets.length > 0` (exact-identity
      MATCHED), not an act performed, and the process-runner header still says
      "`realChildStarts` counts zero by construction" although the counter is now a
      live permitted-start counter. Comments/doc only; no behavioural defect.
    suggestion: >
      Drop `signalProcess` or use it for the escaped non-leader case; reword
      `reaped`/its doc as "matched" or perform and report a real reap; update the
      runner header to the new live-counter semantics.
dimensions:
  spec_plan_compliance:
    verdict: FAIL
    notes: >
      41 of 42 ACs are satisfied and evidence-backed. AC-F5-4 fails in production:
      the capability gate is fed only by test doubles; the production ports carry no
      declaration, so the claude-code adapter (declared terminate gap) is treated as
      capable and a below-bound stall consumes an ordinal and appends
      `economics.restart` before a resume that is a declared gap, ending `failed`/
      exit 1 rather than terminal `state-unverified`/exit 2. Appendix F(C)/DM-4 are
      now correctly reflected in the code (arms 4-7 ended-session, arm 8
      clean-only, arm 9 non-clean classifier, arm 10 unreadable-with-no-decisive-
      artifact), and C11-C14 prove it. F(D) is implemented but only the
      incapable half is proven (N2). The plan's nine phases are all present; phase 9
      scope matches its six code files plus the declared test/document scope. The
      plan overstates the capability fix ("the terminate capability is read from the
      adapter's own declaration") — true for doubles, not for production.
  code_quality:
    verdict: PASS_WITH_NOTES
    notes: >
      The derivation is now a clean total order with a compiler-closed arm id; the
      production terminate is a genuine TERM->grace->KILL->exact-identity match with
      observed booleans and a resume-cleared idempotence fact; the undecidable
      predicate is total; the evidence-ref reservation is correct; detached:true
      makes group signalling real (within the declared OS proof boundary). The
      capability gate's fail-open default is the defect (N1) because it is
      indistinguishable from an undeclared production port. The `signalProcess` seam
      is unused and `reaped` means "matched" (N4). No concurrency, security, or
      performance regression observed: `/proc` matching is exact-argv, no shell, no
      broad pattern; the restart loop is budget-bounded.
  closed_contract_surface:
    verdict: PASS
    notes: >
      The remediation commit touched no contracts file; dispatch-contract-invariance
      pins the 11 tokens/order, exits (state-unverified 2, partial 1, max-restarts 1,
      blocked 0), the dispatch/queue error rows and projections, the attempt schema
      version, the nine config branches, and the four unchanged defaults; the suite
      re-ran green (24 pass). `DispatchDerivation.armId` is an additive optional
      internal instrumentation field, not exported through the domain index and not
      in the contract inventory; no token/projection/exit/error row/domain kind/
      config key/attempt schema changed.
  documentation:
    verdict: PASS_WITH_NOTES
    notes: >
      Spec v1.7 and test plan v0.5 match the code: Appendix F(C) and DM-4 scope arms
      4-7 to every ended, non-stall session, arm 8 clean-only, arm 9 the non-clean
      classifier token, arm 10 unreadable-with-no-decisive-artifact; F(D) carries
      the termination-capability gate; DM-5 records the delivered two-case terminate
      booleans and notes TDR-0046 DC-4 owner reconciliation. The four re-verified
      current-truth pages match the terminate implementation and the ended-session
      order. The one over-claim is the capability sentence ("an adapter that declares
      no terminate capability ... never causes a second session"): true of the
      engine but false of production wiring (N1), because the declaration never
      reaches the port. Test plan "14 ids" vs code 16 (N3).
  no_shell_invariant:
    verdict: PASS
    notes: >
      The static invariant now detects default import, require/require-
      destructuring, dynamic import, aliases and substituted template paths, and the
