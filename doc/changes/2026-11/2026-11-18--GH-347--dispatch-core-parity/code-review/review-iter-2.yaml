summary: >
  Iteration 2, re-review after the review-iteration-1 remediation (plan
  phase 9, commit 9742e6a). Ten of the twelve remediation tasks landed
  materially: B1 is fixed (arms 4-7 now apply to every ended, non-stall
  session, the derivation returns a closed `armId`, C11-C14 exercise arms 4-7
  against non-clean classifier tokens that previously returned `failed`/
  `partial`, and per-row disjointness is asserted); M1/M2 are fixed (the
  production terminate signals the exact-identity tree with TERM, waits the
  CONFIGURED grace through the injected delay, KILLs only a still-listed
  survivor, reports observed booleans, and a resume clears the termination
  fact so a later iteration is re-signalled); M3 is fixed (the stall-undecidable
  predicate is total over an unreadable required read with no decisive
  artifact); M4 is fixed (the determinism oracle compares full canonical
  envelopes, attempt counts/tokens, lane counts, spawns/resumes/waits/
  violations and class coverage, and the eight process-invoking rows are
  declared and asserted); M5 is fixed (realChildStarts is a live counter with a
  permitted-start control, the terminate double records unrelated-signal
  violations with a planted broad-pattern control, the terminate seam joins
  SEAM_MANIFEST, and NO_SHELL_ALLOWLIST is CONSULTED and empty by measurement);
  M6 is fixed (all three delivered assertions restored with clauses). m1-m6 are
  fixed with one low residual (the static invariant's CLI `main()` is still not
  in the aggregate chain). M4's evidence-ref reservation and the m6 tmp guard
  landed. One blocker remains and it is the headline of the remediation: the
  terminate-capability gate the engine uses (`declaresTerminate`, reading the
  session port's `capabilities`) is never fed a declaration by the production
  composition. Neither production adapter's session port exposes
  `capabilities` (verified empirically), so `declaresTerminate` defaults to
  "capable" for every production dispatch: the claude-code adapter, which
  declares the terminate gap, is classified capable and a below-bound stall
  consumes an ordinal, appends `economics.restart`, and runs a second iteration
  whose `resume` is a declared gap, ending `failed`/exit 1 "spawn failed" with
  no stall evidence instead of terminal `state-unverified`/exit 2. The gate is
  real only for test doubles that attach `capabilities`. A second gap is that
  the "unconfirmed termination stops the restart" branch is implemented but
  never exercised (no fixture returns `terminated:false` or throws), so the PM
  note's claim that the incapable pair proves it is overstated. Verdict:
  FAIL on AC-F5-4/F-5/DM-5 (B2 narrowed, not closed, in production).
