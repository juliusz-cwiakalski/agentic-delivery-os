reviewer_notes: |
  Severity uses the change's own blocker/major/minor/info register (the iteration-1
  vocabulary) for continuity; see `severity_breakdown`.

  Verdict rationale: FAIL, because one normative acceptance criterion (AC-F5-4) is
  still not met in production and the remediation's headline claim ("the
  capability-gated no-second-session stall") is true only for test doubles. This is
  the same class of defect as iteration-1's B2, narrowed but not closed: the gate
  exists and the fixture proves it, but the production composition never gives the
  engine a capability declaration to read, so the declared-incapable claude-code
  adapter is classified capable. The failure is a wrong terminal result on a
  documented `--harness` value (failed/exit 1 with no stall evidence instead of
  state-unverified/exit 2) plus a spurious ordinal and economics.restart. The fix is
  small (attach two declarations at the composition edge), which is why this is a
  wiring blocker, not a redesign.

  What is strong and should not be reworked: the artifact-first ladder is now the
  correct total order and is proven exactly (C11-C14 with non-clean classifier
  tokens; armId disjointness); the production terminate is a real TERM/grace/KILL/
  exact-identity implementation over an injected tree seam with observed booleans
  and a resume-cleared fact, and its test includes a genuine broad-pattern negative
  control (a broad matcher demonstrably reaches pids 702/703); the determinism
  oracle now compares envelopes, attempt counts, lane counts and class coverage; the
  static no-shell invariant is materially stronger and its surface cannot rot; the
  three M6 restorations are present with clauses.

  Top three to fix first: N1 (production capability declaration -> the gate is
  inert), N2 (unconfirmed-termination branch unproven; PM claim overstated), N3
  (14-vs-16 arm-set doc/test mismatch).

  Diff reviewed: 29 commits, 117 files, +20339 / -870 (three-dot). The remediation
  commit 9742e6a alone is 28 files, +2902/-159; only 7 doc files changed after it, so
  the reviewed code state is 9742e6a. Aggregate pnpm check was not re-run; the
  targeted suites that exercise the remediation re-ran green (see `verification`).

