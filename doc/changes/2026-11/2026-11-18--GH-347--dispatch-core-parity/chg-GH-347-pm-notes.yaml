  - text: "RETRO (DoR iteration 1): the author chain passed every claim because each
      artifact was checked against its own vocabulary rather than against the
      delivered code. Three of the four critical findings are the same class of
      defect: an assertion or obligation that cites a value the delivered
      implementation does not produce (a projected exit, a token-keyed map used
      as if it were arm-keyed, a derivation arm in a file no phase declares).
      The cheap process fix is to make every artifact state, for each numeric or
      contractual claim it repeats, the delivered symbol it was read from - the
      test plan's exit literals were the only place the two critical exit errors
      could have been caught before the gate. Second lesson: a shared helper
      named in a plan obligation must be declared with ALL of its consumers; the
      restart gate has three and the plan named one."
    type: retro
    date: "2026-11-19"
  - text: "RETRO (checkpoint commit): committing the readiness record with `jaiship
