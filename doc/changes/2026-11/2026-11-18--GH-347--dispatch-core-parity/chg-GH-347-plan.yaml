  # Phase 6 — Spawn identity, title, and lifecycle prompt (F-7; DEC-8;
  # TDR-0054).
  #
  # Goal: a production dispatch spawns the delivery lifecycle the way the shell
  # lane does — the `pm` agent, a deterministic title, and the real lifecycle
  # prompt — with no new flag and no operator override.
  #
  # Contract (API-6, DM-6; TDR-0054):
  #   - A production dispatch supplies the caller agent identity `pm` through the
  #     existing optional agent member; the delivered pure resolver produces the
  #     single-seat binding; the adapter renders exactly one `--agent pm` and
  #     exactly one `--model <seat model>` from the binding.
  #   - A FRESH spawn carries exactly one `--title ticket-<REF>` for the
  #     canonical reference; a RESUME carries none. The title is a composition
  #     fact, validated against the work-item grammar and bounded; it is not a
  #     CLI flag and the operator cannot override the agent or the title.
  #   - The fresh prompt is the delivery-lifecycle prompt parameterized by ref and
  #     the resolved base branch (state detection, resume sync, actions by state,
  #     the eleven-phase lifecycle, merge authority), not a fixed sentence. A
  #     resume uses the operator text when supplied, otherwise the lifecycle
  #     prompt.
  #   - A role-less composition stays role-less and records no binding; the
  #     production dispatch is not role-less. The argv is fixed and never
  #     shell-interpreted.
  #
  # Obligations:
  #   6.1 Supply `pm`, the resolved binding, the title, and the lifecycle prompt
  #       through the production composition in `production.ts` and the
  #       composition typing in `edge.ts`. `PRODUCTION_OPENCODE_ARGS` may gain no
  #       per-run value: the title/agent/model are per-spawn facts, not constants.
  #   6.2 Author `domain/dispatch-prompt.ts`: the lifecycle prompt builder
  #       parameterized by ref and base branch, exported through
