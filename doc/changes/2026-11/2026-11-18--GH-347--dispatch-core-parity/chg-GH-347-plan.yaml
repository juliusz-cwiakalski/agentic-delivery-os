  #     shell invocations and zero script-path invocations across the whole sweep,
  #     and the static invariant scans a DECLARED surface for `.sh`/`scripts/`/
  #     `tools/`/`deliver-ticket` literals, `shell: true`, child-process
  #     `exec`/`execSync`/`execFile`/`execFileSync`/`spawnSync`, and a
  #     child-process `spawn(` without a literal `shell: false`. R3 and R4 MUST
  #     target the child-process receiver/import, not any `.exec(`/`.spawn(`:
  #     `packages/cli/src/edge.ts` legitimately calls `RegExp.prototype.exec`, and
  #     the surface legitimately calls port methods named `spawn`
  #     (`ports.harness.spawn`, `resolvedHarness.port.spawn`,
  #     `options.session.spawn`). The rule therefore matches a `child_process`
  #     import or a call on a `child_process` binding, and a `RegExp.exec` call
  #     plus a port-object `.spawn(` call are asserted FALSE-POSITIVE controls. A
  #     rule that flagged either would force the allowlist to be widened, which is
  #     forbidden. The surface is
  #     `packages/core/src/app/dispatch.ts`,
  #     `packages/core/src/app/dispatch-*.ts`,
  #     `packages/core/src/domain/dispatch-*.ts`,
