# COMMIT-BOUNDARY REALITY (binding on phase 1):
#   The six decision records are UNTRACKED in the worktree at plan time because
#   the specification-phase completion commit (0aaf9c39) stages only the change
#   folder:
#     doc/decisions/TDR-0044-dispatch-owned-durable-lane-record.md
#     doc/decisions/TDR-0045-dispatch-atomic-admission-verdicts.md
#     doc/decisions/TDR-0046-harness-terminate-operation.md
#     doc/decisions/TDR-0047-in-process-bounded-restart-loop.md
#     doc/decisions/TDR-0048-total-derivation-ladder-and-corroboration.md
#     doc/decisions/TDR-0049-dispatch-spawn-identity-title-and-prompt.md
#   Phase 1 declares those six EXACT paths so @coder lands them on the branch.
#   VERIFIED AT PLAN TIME: the six `doc/decisions/00-index.md` ROWS ARE ALREADY
#   COMMITTED on this branch (they landed in 0aaf9c39 together with the change
#   folder, while the records themselves did not), and `git status --porcelain`
#   shows no entry for the index. The index is therefore declared in phase 1 for
#   CONDITIONAL STAGING ONLY — see the declared exception in the SCOPE
#   DECLARATION RULE — so that a status row or a typo touch made while landing
#   the six records stages with them and Appendix A's decision-record citation
#   stays provable at DoD. Until phase 1 commits, the branch carries index rows
#   pointing at uncommitted records; that is exactly the gap this phase closes.
#   PHASE-1 DONE CRITERION (mechanical, re-run at DoD): after the phase-1
#   commit, `git ls-files --error-unmatch` on each of the six paths exits 0 and
#   `git status --porcelain -- doc/decisions` is empty, so no index row points at
#   an untracked record. If the phase does not touch the index, `plan diff`
#   reports at most an advisory `undeclared-missing` for it, never a validation
#   failure.
#
# SCOPE DECLARATION RULE (binding on every phase, inherited from GH-338/GH-339):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   regression control is NOT declared: declaring it would only produce an
#   advisory `plan diff` `undeclared-missing` for a file that needs no edit.
#   ONE DECLARED EXCEPTION: `doc/decisions/00-index.md` in phase 1 is a
#   CONDITIONAL-STAGING declaration (clean at plan time, may be touched while the
#   six records land; never a licence to edit an unrelated row).
#   TWO FURTHER DECLARED KINDS, stated so the rule and the declaration cannot
#   contradict:
#     (i)  A PINNED-SURFACE declaration. `tests/structure/inventory.json` and the
#          `EXECUTABLE_ALLOWANCES` constant inside
#          `tests/structure/content-inventory.test.ts`, plus
#          `tests/fixtures/ports/v1-contract-inventory.json`, are the repository's
#          file-set / executable-surface / contract-export pins. Every phase that
#          creates a module or adds an exported name moves them in the SAME
#          commit, exactly and non-vacuously (no wildcard, no allowance naming a
#          symbol the file does not export). Where a phase adds no file and no
#          export it does not declare them.
#     (ii) A CONDITIONAL DELIVERED-EXPECTATION declaration, used only where a
#          DELIVERED assertion encodes the pre-change behaviour that §8.5 names
#          as a deliberate change. Such a file is declared by the phase that owns
#          the change, and the rule is absolute: an assertion is UPDATED by
#          citing the authorising clause (`§8.5`, `DEC-x`, or a ruling), NEVER
#          deleted, renamed, relaxed, or reordered to make a run green. The
#          per-file authorising clause is named in the phase's comment.
#   A file edited by more than one phase (notably `packages/core/src/app/dispatch.ts`
#   and `packages/cli/src/production.ts`) is declared by every phase that touches
#   it. No phase claims exclusive ownership of a shared file; ownership is of
#   CASES and ACs, not of paths.
#
# SEAM PREREQUISITE (BINDING; test plan §8.2 assumption 1 and §8.3; pm-notes
#   "BINDING for delivery_planning"). AC-F9-2 requires every parity case to drive
#   the SAME composed function production drives; a test-local reimplementation
#   is rejected by TC-PARITY-002. The implementation therefore MUST export and
#   composition-mount exactly these, and the plan names the owning phase:
#     1. `claimDispatchLease` — the atomic live-lease verdict plus the bounded
#        fence wait. Export home: `packages/core/src/app/queue.ts`, re-exported
#        through `packages/core/src/app/index.ts` and the core root. Mounted at
#        `DispatchComposition.claimLease` in `packages/cli/src/production.ts`.
#        OWNED AND DECLARED BY PHASE 2.
#     2. `resolveDispatchLane` — the newest recorded lane carrying a session
#        identity (dispatch-owned newest-with-session plus the daemon resumable
#        states, newest wins). Export home: NEW
#        `packages/core/src/app/dispatch-lane.ts`. Mounted at
#        `DispatchComposition.existingLane` in `packages/cli/src/production.ts`,
#        replacing the delivered `laneFactsFor` closure. OWNED AND DECLARED BY
#        PHASE 3.
#     3. ONE injected `delay(ms, reason)` composition fact, with the closed
#        reasons `claim-fence`, `tracker-ladder`, `terminate-grace`. Production
#        binds a real timer; the battery injects a recorder that advances a
#        virtual clock. It is used by (a) the admission fence wait (phase 2),
#        (b) the tracker ladder (phase 4), and (c) the terminate grace
#        (phase 5). The type/fact is declared in phase 1 (port + composition
#        fact + production binding) and each consuming phase declares the same
#        files at its touch point so the fact is never introduced twice.
#   NO CONFIGURATION KEY is added for any of these (NFR-11). A key, a resolvable
#   ambient timer, or a per-phase reimplementation is an escalation, not a
#   delivery improvisation. If a phase believes one of the three is unnecessary,
#   it STOPS and reports: dropping it makes AC-F9-2 unachievable and reopens the
#   readiness gate rather than accepting a test-local seam.
#
# SEQUENCING (spec §19 "by outcome, so each contract is proven with the evidence
#   that depends on it"), made concrete. Every phase is independently committable
#   and gate-green at its own boundary; the aggregate `pnpm check` is phase 8's
#   alone.
#
#   Phase 1  Layer and contract scaffolding: the `dispatch.lane` record kind,
#            schema, key prefix, record type and read/append helpers; the
#            OPTIONAL harness `terminate` port member and result type; the
#            optional spawn `title` fact and its grammar helper; the `pmNotes`
#            completeness vocabulary; the `delay(ms, reason)` fact and its
#            production binding; the two seam export homes are prepared (phase 2
#            and 3 fill them); the six TDRs land.
#   Phase 2  Atomic admission: the verdict decided inside the claim, the declared
#            refusal set, the bounded fence wait, no dispatch renewal, kind
#            preservation, and the `claimDispatchLease` export/mount.
#   Phase 3  Durable lane writes and recorded-attempt resume: active/terminal
#            appends, `lane:append-failed` disclosure, the
#            `resolveDispatchLane` export/mount, the newest-with-session rule,
#            resume over `pr-open`, explicit fresh spawn, unknown-session
#            failure.
#   Phase 4  Tracker retry ladder, the `pmNotes` artifact fact, and the total
#            derivation order including tracker-done `merged`, artifact
#            `partial`, the retired ledger no-work arm, arm-aware corroboration
#            across the one-shot path, the daemon path and the evidence-window
#            gate, and the shared-derivation consequence.
#   Phase 5  Stall termination and the in-process restart loop: `terminate` joins
#            the closed operation set, capability declarations move, the engine
#            decides TERM→KILL within the borrowed grace, the bounded loop
#            restarts only stalls, the restart-admission split keeps the loop's
#            refusal and admits the operator resume, and attempt/lane/restart
#            cardinality holds.
#   Phase 6  Spawn identity, title, and lifecycle prompt: the production
#            composition supplies `pm` and the binding, the adapter renders one
#            `--agent`/`--model` and one fresh `--title`, and the prompt is the
#            lifecycle prompt parameterized by ref and base branch.
#   Phase 7  The parity battery, the no-shell invariant, the daemon-path
#            regression, and the closed-contract invariance pin.
#   Phase 8  Release obligations: the single five-package minor changeset,
#            plan validation, the aggregate gate, and the current-truth pages
#            declared for STAGING ONLY (lifecycle phase 7 reconciles them).
#
#   WHY THIS ORDER AND NOT ANOTHER: phase 2 must precede phase 3 because a lane
#   write only exists for an ADMITTED dispatch, so the admission verdict is the
#   input to every lane case. Phase 3 must precede phase 4 because the artifact
#   fact and the derivation ladder are read through the truth read a resumed or
#   completed dispatch exposes. Phase 5 must precede phase 7 because the parity
#   battery's stall arm needs the terminate decision and the loop. Phase 6 is
#   independent of 4 and 5 but precedes 7 because the battery asserts `--agent`,
#   `--title`, and the prompt on a fresh spawn. Phase 8 is last because the
#   aggregate gate and the doc reconciliation range over the assembled change.
#
#   FIVE INVARIANTS WOULD CROSS A PHASE BOUNDARY; EACH IS PLACED WHOLE AND THE
#   REASON IS STATED (test plan §8.3's warning, honoured rather than papered
#   over):
#     (a) TC-LANE-003 and its AC-F1-2 are OWNED BY PHASE 5, not phase 3. The
#         case's scenario is a restarted iteration (`S-lane` + `S-loop`: active
#         ordinal 1, active ordinal 2 with `restartsConsumed: 1`, then exactly one
#         terminal) and only phase 5 has a loop to observe. Phase 3 STILL
#         implements the terminal append, because AC-F3-1's `pr-open` lane must
#         be terminally shaped before a resume can resolve it (TC-RESUME-101
#         seeds it and phase 3's own AC-F1-3/TC-LANE-004 prove the append-failure
#         disclosure). Keeping the case whole is preferred to splitting it; no
#         AC is evidenced across the boundary.
#     (b) THE NO-LANE / NO-ATTEMPT / ZERO-RECORD CLAUSES OF THE PHASE-2
#         ADMISSION ACs ARE VACUOUS IN PHASE 2. No lane writer and no
#         refusal-adjacent append path is wired until phase 3, so the clauses
#         "appends no lane" (AC-F2-1), "no attempt and no lane" (AC-F2-2) and
#         "zero records" (AC-F2-4) are all trivially true at the phase-2
#         boundary: nothing in the tree can append at all. The non-vacuous
#         control for all three is TC-LANE-002 in PHASE 3 ("every pre-session
#         refusal appends no lane and no attempt"), run over the SAME admission
#         refusal table with the lane writer and the attempt writer present, plus
#         the delivered `readDispatchAttempts` empty-history read asserted over a
#         refused ref. Phase 2 therefore proves the load-bearing clauses
#         (declared verdict, holder, exit, no `fallback.internal`, no second
#         claim, the empty-history read) and explicitly disclaims the three
#         vacuous ones; phase 3 closes the vacuity. This is the unavoidable
#         consequence of the required admission-before-lane order and is stated
#         rather than hidden. No AC and no case changes owner: AC-F2-2 stays with
#         phase 2 and AC-F2-4 with phase 2; the phase-3 control is a
#         non-vacuity re-observation, not a second owner.
#     (c) The `terminate` CONTRACT and its IMPLEMENTATION are split at the
#         property level, each half proven by its own gate: phase 1 adds the
#         OPTIONAL port member and result type (a port double without it stays
#         valid, asserted by the type probe), while phase 5 adds `terminate` to
#         the CLOSED `HARNESS_OPERATIONS` set, moves both adapter capability
#         declarations, implements the process-tree termination and the
#         exact-identity reap, and proves capability gating. Adding the operation
#         id in phase 1 would make the opencode declaration claim support for a
#         member that does not exist yet and would force the Claude gap in the
#         same commit, which is the terminate phase's work.
#     (d) The `pmNotes` FACT is split the same way: phase 1 declares the closed
#         completeness vocabulary (`complete` | `incomplete` | `absent`); phase 4
#         adds the REQUIRED `pmNotes` member to the artifact facts and derives it
#         from the delivered pm-notes classification (DM-3). Adding a required
#         fact in phase 1 would break every artifact-facts constructor before the
#         derivation can consume it; the vocabulary alone is inert and provable.
#     (e) TC-RESUME-102 AND AC-F3-2 ARE OWNED BY PHASE 5, not phase 3. AC-F3-2's
#         load-bearing clause is "the restart budget does not refuse an operator
#         resume", and the refusal is decided in the operator-resume admission
#         path in `packages/cli/src/edge.ts` (the `admitDispatchRestart` call at
#         the lane branch), not in the resume resolution phase 3 builds. That
#         path also carries the DELIVERED expectation
#         `tests/behaviour/dispatch-restart-budget.test.ts` (TC-RESUME-002), which
#         must be rewritten in the SAME commit that stops the refusal, and the
#         rewrite's subject is the loop/restart-budget contract that phase 5
#         owns. Phase 3 therefore implements the resume rules (recorded-lane
#         resolution, no ordinal consumed, mode and fresh-spawn facts) and this
#         plan drops AC-F3-2 from phase 3's acceptance list rather than claiming
#         a clause it cannot make gate-green; the case stays WHOLE in phase 5
#         (`tests/conformance/dispatch/dispatch-parity-lane-resume.test.ts`,
#         authored in phase 3 and extended by phase 5) instead of being split
#         across the boundary. Every AC and every TC still has exactly one owner
#         and the 42/50 totals are unchanged (see AC OWNERSHIP and the TC map).
