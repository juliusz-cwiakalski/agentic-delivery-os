#   (d) Test plan §7.2 names `packages/adapters/src/host/spawn*.ts`; no such file
#       exists. The real single child-process site is
#       `packages/adapters/src/host/index.ts`. Phase 7 declares the real path.
#       It also states R3 as "no exec/execSync/execFile/execFileSync/spawnSync
#       import or call" and R4 as "every spawn( call site ... shell: false". The
#       surface contains many legitimate `RegExp.prototype.exec` calls in
#       `packages/cli/src/edge.ts` and three legitimate PORT-method `.spawn(` calls
#       (`ports.harness.spawn`, `resolvedHarness.port.spawn`,
#       `options.session.spawn`). Phase 7 binds R3/R4 to the child-process
#       receiver/import and asserts both as false-positive controls, because a
#       literal reading would force the allowlist open.
#   (e) TC-LANE-003 is a loop scenario though §7.3 files it with lane/resume;
#       placement is phase 5 (with AC-F1-2) for observability. See the
#       sequencing block (a).
#   (f) The pm-notes doc-risk text names `feature-harness-session-port.md`; no such
#       page exists. The real current-truth page is
#       `feature-harness-adapters.md` (also Appendix A's name), and this plan uses
#       the real path.
#   (g) `tests/structure/harness-stream-contract.test.ts` asserts the port has
#       exactly seven required members and no `kill`/`abort` alias. An OPTIONAL
#       `terminate` member does not violate it (the assertion is over a literal's
#       keys), and phase 5 EXTENDS the suite with the capability assertion rather
#       than weakening it.
#   (h) `version_impact: minor` and any publishable-package edit mean exactly one
#       five-package minor changeset (`tests/checks/privacy-release.test.ts`
#       enforces it). Phase 8 authors
#       `.changeset/gh-347-dispatch-core-parity-minor.md`.
#   (i) No committed mutation harness: §7.4 makes the 82-row register a
#       reviewer/fixer exercise, and the permanent non-vacuity proofs are the
#       planted controls inside the owning cases. Allocation is stated above.
#   (j) `tests/checks/dispatch-doc-conformance.test.ts` pins REQUIRED phrases on
#       the dispatch reference page. The phase-7 reconciliation adds text and must
#       preserve them; no test is edited to accommodate a rewrite.
#   (k) There is no `doc/documentation-profile.md` (engineering-repo default), so
#       no `doc/business/**` area is created or touched.
#   (l) THE RESTART BUDGET HAS THREE CALLERS, NOT ONE. `admitDispatchRestart`
#       (`packages/core/src/domain/dispatch-resume.ts:74-119`) is called by the
#       LOOP's stall decision (`packages/core/src/app/dispatch.ts:1006`), by the
#       operator-resume admission path (`packages/cli/src/edge.ts`, the lane
#       branch that runs on `--resume-prompt`), and by peak-pause recovery
#       (`packages/core/src/domain/daemon-peak-pause.ts:336`,
#       `recoverInterruptedLane`). A single global change would silently remove
#       the loop's `max-restarts` AND peak-pause recovery's bound refusal, so the
#       change is CALLER-SCOPED: the flag lives in `dispatch-resume.ts` with a
#       DEFAULT of the budget-consulting scope, so an omitted scope keeps today's
#       refusing behaviour (no caller can silently begin admitting); exactly the
#       operator-resume path passes the admitting scope. `recoverInterruptedLane`
#       keeps today's refusal and states its scope EXPLICITLY (a code edit, not an
#       omission), and its delivered suites are re-run as read-only controls.
#       Deliveries: phase 5.
#   (m) THE DERIVATION'S PERSISTED-COUNT RESTART ARM HAS ITS OWN DELIVERED
#       ASSERTION. `packages/core/src/domain/dispatch-result.ts:190-202` re-keys a
#       non-completed session at `count >= bound` to `max-restarts`, and
#       `tests/behaviour/dispatch-token-closure.test.ts` pins it for both a
#       harness-reported timeout and a premature end. Narrowing the arm therefore
#       edits that delivered row (declared expectation 10), not only the source.
#       The arm is NARROWED, not removed: removal would drop the
#       `dispatch.restart-budget-exceeded` identity and message from the
#       timeout-at-bound path, which the loop's exhaustion evidence and AC-F6-2
#       rely on. After narrowing, a premature end at the bound keeps `partial`
#       (Appendix F(C)(9)) and the loop remains the producer of `max-restarts` for
#       the stall path.
#   (n) ARM-AWARE CORROBORATION HAS TWO EVALUATION SITES AND ONE PERSISTED
#       CONSUMER. `buildCorroborationRecord`/`classifyFalseSuccess` are called by
#       the one-shot path (`packages/core/src/app/dispatch.ts`) and by the daemon
#       path (`packages/core/src/app/daemon-dispatch-result.ts:150-165`), and the
#       sufficiency rule is the token-keyed map
#       `DISPATCH_CORROBORATION_SUFFICIENCY` in
#       `packages/core/src/contracts/dispatch.ts:145-157`. The persisted consumer
#       is the evidence-window gate (`packages/core/src/domain/dispatch-gate.ts`,
#       `requiredCorroboration` at :235/:245), which reads an ATTEMPT RECORD and
#       therefore has no arm to consult: an arm discriminator on the record would
#       be an attempt-schema change and is forbidden (NFR-3). The gate therefore
#       STAYS TOKEN-LEVEL by decision, and that decision is declared in the code
#       and in phase 4's obligations.
#   (o) THE WHOLE-BATTERY REGISTRY HAD NO OWNER. `tests/fixtures/dispatch/parity/
#       evidence.ts` is the 11-class table only, while TC-PARITY-003 and
