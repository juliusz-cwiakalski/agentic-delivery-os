  #   - Ladder: at most 5 attempts, waits `min(2 s * 2^(n-1), 30 s)` =
  #     2/4/8/16 s, total added latency <= 30 000 ms, the delay INJECTED with
  #     reason `tracker-ladder`; a successful attempt within the ladder is used;
  #     exhaustion is named (`tracker:exhausted`) and never yields a
  #     success-shaped fact. No config key.
  #   - Artifact fact: `pmNotes` is a required tri-state (`complete` |
  #     `incomplete` | `absent`) derived from the delivered pm-notes
  #     read/classification; malformed or absent reads incomplete; the fallible
  #     direction is never "finished".
  #   - Total order (Appendix F(A)–(E)): pre-session refusal (no token) →
  #     attempt-stage failure → spawn refusal `noop-lane-permission` →
  #     tracker-done `merged` → blocking `blocked` → open PR (`pr-open` /
  #     `pr-open-unverified`) → already-merged PR `merged` → commits + complete
  #     pm-notes `finished` → commits + incomplete/absent pm-notes `partial` →
  #     no commits + readable non-done non-blocked tracker
  #     `noop-lane-nothing-to-do` → classifier token → `state-unverified` when
  #     truth is undecidable. A done work item that also carries a blocking label
