#         seeds it and phase 3's own AC-F1-3/TC-LANE-004 prove the append-failure
#         disclosure). Keeping the case whole is preferred to splitting it; no
#         AC is evidenced across the boundary.
#     (b) THE NO-LANE / NO-ATTEMPT / ZERO-RECORD CLAUSES OF THE PHASE-2
#         ADMISSION ACs ARE VACUOUS IN PHASE 2. No lane writer and no
#         refusal-adjacent append path is wired until phase 3, so the clauses
#         "appends no lane" (AC-F2-1), "no attempt and no lane" (AC-F2-2) and
#         "zero records" (AC-F2-4) are all trivially true at the phase-2
#         boundary: nothing in the tree can append at all. The non-vacuous
