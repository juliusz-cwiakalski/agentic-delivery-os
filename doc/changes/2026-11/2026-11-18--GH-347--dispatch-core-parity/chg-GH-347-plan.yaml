# SCOPE DECLARATION RULE (binding on every phase, inherited from GH-338/GH-339):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   regression control is NOT declared: declaring it would only produce an
#   advisory `plan diff` `undeclared-missing` for a file that needs no edit.
#   ONE DECLARED EXCEPTION: `doc/decisions/00-index.md` in phase 1 is a
#   CONDITIONAL-STAGING declaration (clean at plan time, may be touched while the
#   six records land; never a licence to edit an unrelated row).
#   TWO FURTHER DECLARED KINDS, stated so the rule and the declaration cannot
#   contradict:
#     (i)  A PINNED-SURFACE declaration. `tests/structure/inventory.json` and the
#          `EXECUTABLE_ALLOWANCES` constant inside
#          `tests/structure/content-inventory.test.ts`, plus
#          `tests/fixtures/ports/v1-contract-inventory.json`, are the repository's
#          file-set / executable-surface / contract-export pins. Every phase that
#          creates a module or adds an exported name moves them in the SAME
#          commit, exactly and non-vacuously (no wildcard, no allowance naming a
#          symbol the file does not export). Where a phase adds no file and no
#          export it does not declare them.
#     (ii) A CONDITIONAL DELIVERED-EXPECTATION declaration, used only where a
#          DELIVERED assertion encodes the pre-change behaviour that §8.5 names
#          as a deliberate change. Such a file is declared by the phase that owns
#          the change, and the rule is absolute: an assertion is UPDATED by
#          citing the authorising clause (`§8.5`, `DEC-x`, or a ruling), NEVER
#          deleted, renamed, relaxed, or reordered to make a run green. The
#          per-file authorising clause is named in the phase's comment.
#   A file edited by more than one phase (notably `packages/core/src/app/dispatch.ts`
#   and `packages/cli/src/production.ts`) is declared by every phase that touches
#   it. No phase claims exclusive ownership of a shared file; ownership is of
#   CASES and ACs, not of paths.
#
# SEAM PREREQUISITE (BINDING; test plan §8.2 assumption 1 and §8.3; pm-notes
#   "BINDING for delivery_planning"). AC-F9-2 requires every parity case to drive
#   the SAME composed function production drives; a test-local reimplementation
#   is rejected by TC-PARITY-002. The implementation therefore MUST export and
#   composition-mount exactly these, and the plan names the owning phase:
#     1. `claimDispatchLease` — the atomic live-lease verdict plus the bounded
#        fence wait. Export home: `packages/core/src/app/queue.ts`, re-exported
#        through `packages/core/src/app/index.ts` and the core root. Mounted at
#        `DispatchComposition.claimLease` in `packages/cli/src/production.ts`.
#        OWNED AND DECLARED BY PHASE 2.
#     2. `resolveDispatchLane` — the newest recorded lane carrying a session
#        identity (dispatch-owned newest-with-session plus the daemon resumable
#        states, newest wins). Export home: NEW
#        `packages/core/src/app/dispatch-lane.ts`. Mounted at
#        `DispatchComposition.existingLane` in `packages/cli/src/production.ts`,
#        replacing the delivered `laneFactsFor` closure. OWNED AND DECLARED BY
#        PHASE 3.
#     3. ONE injected `delay(ms, reason)` composition fact, with the closed
#        reasons `claim-fence`, `tracker-ladder`, `terminate-grace`. Production
#        binds a real timer; the battery injects a recorder that advances a
#        virtual clock. It is used by (a) the admission fence wait (phase 2),
#        (b) the tracker ladder (phase 4), and (c) the terminate grace
#        (phase 5). The type/fact is declared in phase 1 (port + composition
#        fact + production binding) and each consuming phase declares the same
#        files at its touch point so the fact is never introduced twice.
#   NO CONFIGURATION KEY is added for any of these (NFR-11). A key, a resolvable
#   ambient timer, or a per-phase reimplementation is an escalation, not a
#   delivery improvisation. If a phase believes one of the three is unnecessary,
#   it STOPS and reports: dropping it makes AC-F9-2 unachievable and reopens the
#   readiness gate rather than accepting a test-local seam.
#
# SEQUENCING (spec §19 "by outcome, so each contract is proven with the evidence
#   that depends on it"), made concrete. Every phase is independently committable
#   and gate-green at its own boundary; the aggregate `pnpm check` is phase 8's
#   alone among the phases that author the change, and phases 9 and 10 re-run it
#   because each remediation invalidates the HEAD the previous boundary measured.
