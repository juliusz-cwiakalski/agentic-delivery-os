#   WHY THIS ORDER AND NOT ANOTHER: phase 2 must precede phase 3 because a lane
#   write only exists for an ADMITTED dispatch, so the admission verdict is the
#   input to every lane case. Phase 3 must precede phase 4 because the artifact
#   fact and the derivation ladder are read through the truth read a resumed or
#   completed dispatch exposes. Phase 5 must precede phase 7 because the parity
#   battery's stall arm needs the terminate decision and the loop. Phase 6 is
#   independent of 4 and 5 but precedes 7 because the battery asserts `--agent`,
#   `--title`, and the prompt on a fresh spawn. Phase 8 closes the authoring
#   sequence because the aggregate gate and the doc reconciliation range over the
#   assembled change. Phase 9 is appended LAST because a review finding is only
#   closed by a commit that post-dates the review that raised it, and because its
#   evidence must be re-measured over the remediated tree rather than inherited
#   from the HEAD the review rejected. Phase 10 follows for the same reason:
#   review iteration 2 rejected the HEAD phase 9 produced, so its evidence must
#   post-date that review. Phase 10 follows for the same reason: review
#   iteration 2 rejected the HEAD phase 9 produced, so its evidence must post-date
#   that review.
