  # ---------------------------------------------------------------------------
  # Phase 5 — Stall termination and the in-process restart loop (F-1 terminal
  # half, F-5, F-6; DEC-4, DEC-5; TDR-0046, TDR-0047).
  #
  # Goal: a corroborated terminal stall is terminated within a bounded grace and
  # never leaks a silent second session, and one dispatch invocation reproduces
  # the shell's bounded iterate-until-terminal table without burning a slot twice.
  #
  # Contract (API-5, DM-1 terminal half, DM-4(D), DM-5; TDR-0046, TDR-0047):
  #   - `terminate` JOINS the closed harness operation set. The port member is
  #     optional; a terminate-capable adapter declares and implements it; an
  #     adapter without it declares a gap (`harness.capability.gap`) and is never
  #     asked. The grace is the declared `coordinator.kill-grace` (20 000 ms
  #     default), reused rather than duplicated, and waited through the injected
  #     delay with reason `terminate-grace`.
  #   - Terminate is idempotent: TERM to the session's process tree first, KILL
  #     only after the grace, then an escaped-runtime reap matched ONLY by this
  #     lane's session identity or its `ticket-<REF>` title. It reports
  #     `terminated`/`escalated`/`reaped`; terminating an already-exited or
  #     unknown session is success, not an error; zero unrelated processes are
  #     signalled.
  #   - Loop: a clean session exit is ALWAYS terminal (no restart, any harness
  #     outcome, any bound). Only a corroborated liveness stall or a
  #     harness-reported timeout is restart-eligible. At a stall, only the
  #     terminal pre-restart verdict set {`merged` from tracker-done, `blocked`
  #     from a blocking tracker state, `pr-open` from an open PR artifact}
  #     short-circuits; a decisive artifact OUTSIDE it does NOT stop the stall.
  #     Undecidable truth → `state-unverified` with NO slot. Below the bound one
  #     ordinal is consumed with exactly one `economics.restart` reason
  #     `watchdog.liveness-stalled`, the recorded session is resumed (a fresh
  #     spawn only if no session was ever recorded), and the next iteration runs.
  #     At/above the bound → `max-restarts` with the delivered exhaustion record.
  #   - Cardinality: exactly one attempt record at the terminal classification
  #     regardless of iteration count; a restarted iteration appends none; a
  #     pre-session refusal appends none. A persisted count at/above the bound
  #     NEVER refuses an admitted dispatch: one iteration runs; a session exit
  #     keeps its own classification and only a stall in that iteration yields
  #     `max-restarts`. The envelope's `restarts` is the PERSISTED TOTAL after this
  #     dispatch (the recorded count plus the ordinals this dispatch consumed),
  #     never the invocation's consumed count alone (AC-F6-5).
  #   - Restart admission is CALLER-SCOPED (finding 2; AC-F3-2, AC-F6-6, DEC-5):
  #     `admitDispatchRestart` keeps ONE implementation and gains a caller-scoped
  #     flag whose home is `domain/dispatch-resume.ts`. The DEFAULT is the
  #     budget-consulting scope, so an omitted flag keeps today's refusal and no
  #     caller can silently start admitting. The three callers are stated, not
  #     inferred: (i) the LOOP's stall decision in `app/dispatch.ts` (the call that
  #     produces `max-restarts` at the bound) keeps the budget-consulting scope;
  #     (ii) the OPERATOR-RESUME admission path in `packages/cli/src/edge.ts` (the
  #     call that today refuses a `--resume-prompt` at the persisted bound, the
  #     behaviour `tests/behaviour/dispatch-restart-budget.test.ts` TC-RESUME-002
  #     pins) stops consulting the budget; (iii) `recoverInterruptedLane` in
  #     `domain/daemon-peak-pause.ts` KEEPS today's refusing behaviour and states
  #     its scope EXPLICITLY. The authorising clause for (iii) is that peak-pause
  #     recovery is a coordinator-family re-entry that consumes an ordinal, not an
  #     operator resume: AC-F3-2 admits only the operator resume, AC-F6-6 governs
  #     an admitted dispatch iteration, and TDR-0047's bound is the dispatch lane's
  #     loop bound. A global change to the shared function would silently remove
  #     peak-pause recovery's refusal and the loop's `max-restarts`; neither is
  #     acceptable.
  #   - The derivation's OWN persisted-count arm is NARROWED (finding 4; AC-F6-4,
  #     AC-F6-6, §8.5 "Persisted-bound re-key narrowed", Appendix F(D)):
  #     `domain/dispatch-result.ts` re-keys a session to `max-restarts` when
  #     `count >= bound && !harnessCompleted`. That guard exempts a completed
  #     harness but still re-keys a premature end, a tool failure, or a non-zero
  #     exit at the bound, which AC-F6-4 makes terminal under their own
  #     classification. After this phase the arm fires ONLY for the restart-eligible
  #     harness-reported timeout (a terminal stall, not a clean exit), so every
  #     clean session exit at or above the bound keeps its own classification and
  #     the LOOP remains the producer of `max-restarts` for the stall path (it
  #     records directly and never re-derives). The arm is NARROWED, not removed,
  #     because removal would also drop the `dispatch.restart-budget-exceeded`
  #     identity and message from the timeout-at-bound path that the loop's
  #     exhaustion evidence and AC-F6-2 name. The delivered assertion in
  #     `tests/behaviour/dispatch-token-closure.test.ts` is updated with it
  #     (delivered expectation 10).
  #   - The lane's terminal half (AC-F1-2/TC-LANE-003) lands here: records in
  #     order are active(1), active(2, restartsConsumed 1), then exactly one
  #     terminal; no terminal record exists between the active records; "the
