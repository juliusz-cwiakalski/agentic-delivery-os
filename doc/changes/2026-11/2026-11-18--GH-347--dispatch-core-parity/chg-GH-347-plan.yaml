  #     reimplementation by three independent mechanisms: import identity
  #     (`seams.ts`), a forbidden-signature scan (a pre-read+claim pair, a local
  #     timer retry, a local kill sequence, a local token ladder), and a planted
  #     temp-copy control. No case may satisfy itself with a fixture-written
  #     record (`controlled-repo.ts`'s provenance guard and no-ledger-writer
  #     surface stay intact; the parity harness exposes no writer).
  #   - Two consecutive runs are identical after temp-root normalization; zero
  #     live network requests and zero real child starts; the injected delay
  #     recorder and virtual clock are the only time source (no wall-clock
  #     assertion anywhere).
