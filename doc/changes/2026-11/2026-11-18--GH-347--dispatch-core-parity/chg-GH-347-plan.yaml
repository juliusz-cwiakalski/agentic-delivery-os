phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Layer and contract scaffolding (F-1/F-4/F-5/F-7/F-8 declarations,
  # the two seam homes, the delay fact, and the six decision records).
  #
  # Goal: declare every additive contract surface the ten parity gaps need, with
  # no behaviour wired yet, so each later phase fills one seam and proves it.
  # This phase is first because (i) every later phase consumes one of these
  # declarations, (ii) an additive contract change is the only thing that can be
  # reviewed in isolation, and (iii) the six TDRs are the governing records and
  # must be on the branch before the code they govern.
  #
  # Contract (TDR-0044, TDR-0046, TDR-0048, TDR-0049; spec DM-1, DM-3, DM-5,
  #   DM-6, DM-8):
  #   - `dispatch.lane`: kind `dispatch.lane`, payload schema
  #     `delivery.dispatch.lane.v1`, key `dispatch.lanes:<ref>`, identity `ref`,
  #     append-only, latest record per ref is the lane. Record fields exactly as
  #     DM-1/TDR-0044: `schema`, `ref`, `repository`, `attemptId`, `sessionId`,
  #     `harnessKind`, `owner: {processId, startedAt}`, `iterationOrdinal >= 1`,
  #     `restartsConsumed >= 0`, `state: "active" | "terminal"`, optional
  #     `lastToken`/`lastOutcome` present ONLY on a terminal record, `recordedAt`.
  #     No prompt, transcript, diff, credential, or provider payload (NFR-7).
  #   - The lane's append and read helpers live beside the delivered dispatch
  #     record family (`app/dispatch-ledger.ts`), reading/writing through the
  #     injected store port exactly as `daemon.ts` reads `daemon.lane`. They are
  #     the ONLY writers of the kind; phase 3 calls them and the daemon family
  #     never does.
  #   - The OPTIONAL harness `terminate` port member and its result type
  #     (`terminated`/`escalated`/`reaped` booleans, session handle, grace). It is
  #     NOT yet a member of the closed `HARNESS_OPERATIONS` set: adding the id now
  #     would make the opencode declaration claim a member that does not exist and
  #     force the Claude gap early. A port double without the member stays valid.
  #     Phase 5 adds the id, moves both declarations, implements it, and proves
  #     capability gating.
  #   - The optional fresh-spawn `title` member on `HarnessSpawnInput`, the
  #     `ticket-` prefix constant, the title grammar pattern, and the pure
  #     `spawnTitleFor(ref)` helper (validated against the work-item reference
  #     grammar, bounded to a short single token). A resume carries none. Phase 6
  #     renders it; phase 1 declares and validates it.
  #   - The `pmNotes` completeness vocabulary: exactly `complete` | `incomplete`
  #     | `absent`, where complete means a present document whose delivery phase
  #     carries a non-null completion, absent means no document, and incomplete
  #     means present but incomplete/unparseable/not complete — the fallible
  #     direction is NEVER "finished". Phase 4 makes it a required artifact fact.
  #   - The injected `delay(ms, reason)` fact with the closed reasons
  #     `claim-fence`, `tracker-ladder`, `terminate-grace`, declared on the
  #     dispatch ports and on the composition, with production binding a real
  #     timer. No configuration key (NFR-11).
  #
  # Obligations:
  #   1.1 Declare the lane kind/schema/prefix/record type and the
  #       `dispatchLaneRecordKey` builder in `contracts/dispatch.ts`; re-export
  #       through `contracts/index.ts`. Add `appendDispatchLane` and
  #       `readDispatchLanes` to `app/dispatch-ledger.ts` (fenced append, verified
  #       post-append read, latest-per-key fold), re-export through `app/index.ts`
  #       and the core root. No engine call site yet.
  #   1.2 Declare the optional `terminate` member + result type in
  #       `contracts/harness.ts`; re-export through `contracts/index.ts`. Do NOT
  #       add the operation id to `HARNESS_OPERATIONS` and do NOT edit either
  #       adapter in this phase.
  #   1.3 Declare the title fact + grammar/helper in `contracts/dispatch.ts` and
  #       `domain/dispatch-identity.ts`; re-export. Keep the delivered
  #       `HarnessSpawnInput` members additive-only.
  #   1.4 Declare the `pmNotes` completeness vocabulary in `contracts/pm-notes.ts`;
  #       re-export. Do NOT add the field to `DispatchArtifactFacts` yet.
  #   1.5 Declare the delay fact (type + closed reasons) on the dispatch ports and
  #       the composition, and bind the production timer in `production.ts`. No
  #       consumer yet; phases 2, 4, and 5 consume it.
  #   1.6 Move the three pinned surfaces exactly, in this commit: the file set is
  #       unchanged (no new core module), but the executable allowances for
  #       `contracts/dispatch.ts`, `contracts/harness.ts`, `contracts/pm-notes.ts`,
  #       `app/dispatch-ledger.ts`, and `domain/dispatch-identity.ts` gain exactly
  #       the new names (no wildcard), and
  #       `tests/fixtures/ports/v1-contract-inventory.json` gains exactly the new
  #       contract exports.
  #   1.7 Author the structure/type halves this phase can prove: the lane record
  #       declaration in `tests/structure/dispatch-contract.test.ts` (structure
  #       half of TC-LANE-001, whose owner is phase 3) and the optional-member
  #       type probes in `tests/types/harness.type-test.ts` (a port without
  #       `terminate` and a spawn without `title` still type-check; a title is
  #       validated to `ticket-<REF>`). No AC and no TC is claimed by phase 1.
  #   1.8 Stage the six decision records and, conditionally, the decision index
  #       (see COMMIT-BOUNDARY REALITY). Nothing else outside the change surface.
  #
  # Code areas (concrete):
  #   packages/core/src/contracts/dispatch.ts      (lane kind/schema/key/type,
  #                                                  title prefix/pattern, delay
  #                                                  reasons)
  #   packages/core/src/contracts/harness.ts       (optional terminate member and
  #                                                  result type, optional title)
  #   packages/core/src/contracts/pm-notes.ts      (completeness vocabulary)
  #   packages/core/src/contracts/index.ts         (re-exports)
  #   packages/core/src/domain/dispatch-identity.ts (spawnTitleFor + validation)
  #   packages/core/src/domain/index.ts            (re-export)
  #   packages/core/src/app/dispatch-ledger.ts     (lane append/read helpers)
  #   packages/core/src/app/dispatch.ts            (delay port fact type)
  #   packages/core/src/app/index.ts               (re-export)
  #   packages/core/src/index.ts                   (re-export)
  #   packages/cli/src/edge.ts                     (composition delay fact)
  #   packages/cli/src/production.ts               (real-timer delay binding)
  #   tests/structure/dispatch-contract.test.ts
  #   tests/structure/content-inventory.test.ts
  #   tests/fixtures/ports/v1-contract-inventory.json
  #   tests/types/harness.type-test.ts
  #   doc/decisions/TDR-0044..TDR-0049 (six exact paths)
  #   doc/decisions/00-index.md (conditional staging only)
  #   packages/core/src/state/** is NOT touched: record kinds ride the existing
  #   append-only ledger; no state-engine or boundary change is needed.
  #
  # Acceptance: no AC and no TC. Phase 1 is scaffolding; claiming an AC from a
  #   declaration alone would be a false claim. Its exit criterion is the pin
  #   equality, the type probes, and the six records committed.
  #
  # Gate (expected signal: exit 0; the lane kind/schema/key/record shape declared
  # once and exported; a port double without `terminate` still valid; a spawn
  # without `title` still valid; `ticket-<REF>` validated and a malformed title
  # rejected by name; the allowance and contract-inventory equality holding in
  # both directions; the six TDR paths tracked and `doc/decisions` clean):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/dispatch-contract.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/harness-contract.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/harness-stream-contract.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/port-contract-inventory.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/content-inventory.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/subpaths.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/checks/decision-record.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm typecheck
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git diff --check
  # ---------------------------------------------------------------------------
