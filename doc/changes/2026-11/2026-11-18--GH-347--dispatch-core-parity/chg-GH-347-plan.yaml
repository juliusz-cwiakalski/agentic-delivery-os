  # ---------------------------------------------------------------------------
  # Phase 2 — Atomic admission (F-2; DEC-1; TDR-0045).
  #
  # Goal: a dispatch's admission verdict is decided atomically with the claim, so
  # a race can never admit two invocations, mislabel store contention as
  # `fallback.internal`, or renew another invocation's live same-ref lease.
  #
  # Contract (API-2, DM-7; TDR-0045 DC-1..DC-5):
  #   - The claim observes the live lease under the fence and returns exactly one
  #     of: claimed (with a lease identity), `queue.single-flight` (a live lease
  #     recording the requested ref under ANY holder, exit 1, holder named in
  #     `detail.holder`), `queue.lease-conflict` (a live lease on another ref in
  #     the same repository, exit 1), `queue.precondition.unmet` reason
  #     `owner-hold` before the fence, or a typed `state.*` failure at its row's
  #     exit 2. The dispatch claim NEVER renews; the sibling `queue claim` renewal
  #     is unchanged.
  #   - Fence contention is WAITED on for a bounded period no greater than
  #     `queue.lease-ttl` (90 000 ms) using the injected delay with reason
  #     `claim-fence`, then re-decided from the observed lease. A fence that never
  #     frees returns the `state.*` row, never a queue relabelling.
  #   - The dispatch wrapper PRESERVES the claim's kind; it no longer hardcodes
  #     `queue`, so `state.*` stays `state` and the queue identities stay
  #     `queue`. No admission outcome is contained as `fallback.internal`.
  #   - A refusal appends no lease, attempt, lane, or event, starts no session,
  #     exits its mapped row's code, and the attempts read returns the
  #     empty-history success.
  #
  # Seam (BINDING): `claimDispatchLease` is exported from
  #   `packages/core/src/app/queue.ts`, re-exported through `app/index.ts` and the
  #   core root, and MOUNTED at `DispatchComposition.claimLease` in
  #   `production.ts`. The pre-claim predicate `dispatchAdmissionRefusal` keeps no
  #   authority over the dispatch verdict; it is NOT deleted (the queue command and
  #   its delivered controls still use it) but the dispatch mount no longer
  #   consults it. No configuration key is added.
  #   `resolveDispatchLane` is the other half of this prerequisite and is OWED BY
  #   PHASE 3; no admission case consumes it, and phase 2 neither creates nor
  #   edits it. The injected `delay(ms, reason)` fact this phase consumes was
  #   declared in phase 1 and is used here with reason `claim-fence`.
  #
  # Obligations:
  #   2.1 Add the path flag ("this caller may not renew") and the bounded fence
  #       wait to the delivered claim in `app/queue.ts`, keeping the fence body's
  #       lease fold, stale takeover, and `queue.lease-conflict` construction
  #       (TDR-0045's implementation plan steps 1–2). Export `claimDispatchLease`
  #       as the dispatch caller's entry point.
  #   2.2 If the wait helper lands in `state/index.ts` (the decision record names
  #       it), it receives the delay as injected data and imports no new module.
  #   2.3 In `app/dispatch.ts`, preserve the claim's kind and code pair; map the
  #       five declared admission outcomes; keep the owner-hold precondition before
  #       the fence; keep the refusal path free of appends, spawn, and resume.
  #   2.4 In `production.ts`, mount `claimDispatchLease` at `claimLease`, pass the
  #       injected delay, and remove the dispatch verdict's dependence on the
  #       pre-claim predicate.
  #   2.5 Author `tests/conformance/dispatch/dispatch-parity-admission.test.ts`
  #       for ADMIT-001..005 over the real store and the deterministic
  #       two-invocation interleaving, and extend
  #       `tests/behaviour/dispatch-single-flight.test.ts` for ADMIT-006 (sibling
  #       renewal unchanged; dispatch never renews). Rewire the
