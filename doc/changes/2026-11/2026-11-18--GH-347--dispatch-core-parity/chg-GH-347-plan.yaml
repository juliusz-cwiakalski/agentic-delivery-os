  #     stall only the terminal pre-restart verdict set does (phase 5 applies it).
  #   - Arm-aware corroboration (TDR-0053; AC-F8-1, AC-F8-4): the corroboration
  #     REQUIREMENT is arm-aware for exactly TWO arms — the tracker-done `merged`
  #     arm (Appendix F(C)(2)) and the nothing-to-do arm (Appendix F(C)(8)) — and
  #     every other token keeps today's requirement. Tracker-done `merged` and
  #     nothing-to-do are corroborated by the tracker fact ALONE, so absent
  #     pm-notes or CI does not make the claim uncorroborated and cannot raise a
  #     false-success incident. The already-merged-PR `merged` arm (F(C)(5)) keeps
  #     the delivered `["pm-notes","tracker","ci"]` requirement, and `blocked`,
  #     `pr-open`, `pr-open-unverified`, `finished` keep theirs. The corroboration
