  # ---------------------------------------------------------------------------
  # Phase 3 — Durable lane writes and recorded-attempt resume (F-1, F-3; DEC-2,
  # DEC-3; TDR-0049).
  #
  # Goal: a dispatch that acquires a session becomes resumable BEFORE its outcome
  # is known, and a later `--resume-prompt` resolves the recorded lane instead of
  # spawning fresh — including a finished `pr-open` attempt.
  #
  # Contract (DM-1, DM-2, API-3; TDR-0049):
  #   - On every session acquisition (spawn or resume) exactly one `active` lane
  #     record is appended for the ref with session identity, normalized
  #     repository, attempt id, harness kind, owner `{processId, startedAt}`, a
  #     1-based `iterationOrdinal`, `restartsConsumed`, and `recordedAt`. A
  #     pre-session refusal appends none. The append happens as the handle is
  #     acquired, before any outcome is known.
  #   - On the dispatch's final classification exactly one `terminal` record is
  #     appended carrying `lastToken` and `lastOutcome`. Records are append-only;
  #     "the lane" is the latest record for the ref; no record is rewritten. A
  #     restarted stalled iteration appends NO terminal record — its AC/TC
  #     evidence is phase 5 (see the sequencing block (a)), and the writer already
  #     makes the rule structural by appending the terminal record only from the
  #     final-classification path.
  #   - A failed lane append never changes the verdict and never silently claims
  #     resumability: the attempt still lands with a bounded `lane:append-failed`
  #     evidence reference.
  #   - Resume resolution returns the newest recorded lane carrying a session
  #     identity — the dispatch-owned newest-with-session record OR a daemon lane
  #     in `delivering`/`detached`/`preempted`, newest wins — plus the resume mode
  #     derived from adapter capability and the completed-phase position. A
  #     resolved lane is resumed, never replaced by a fresh spawn; an operator
  #     resume consumes no restart ordinal; an unknown session is a classified
  #     failure (never a silent spawn); no lane means an explicit fresh spawn with
  #     the fresh-spawn fact recorded.
  #   - Pre-change state with no `dispatch.lane` records resolves "no lane" and
  #     nothing is fabricated; pre-change attempt records and daemon lanes read
  #     unchanged; the daemon family never reads or writes the dispatch lane.
  #
  # Seam (BINDING): `resolveDispatchLane` is exported from the NEW
  #   `packages/core/src/app/dispatch-lane.ts` (dispatch-owned newest-with-session
  #   + the daemon resumable states), re-exported through `app/index.ts` and the
  #   core root, and MOUNTED at `DispatchComposition.existingLane` in
  #   `production.ts`, replacing the `laneFactsFor` closure. `DispatchLaneFacts`
  #   moves to `packages/core/src/contracts/dispatch.ts` with a CLI re-export (core
  #   cannot import CLI). No configuration key.
  #   `claimDispatchLease` is the other half and is PHASE 2's; this phase consumes
  #   it through the composition unchanged. The injected `delay(ms, reason)` fact
  #   was declared in phase 1; this phase adds no new reason.
  #
  # Obligations:
  #   3.1 Wire the acquisition append and the terminal append into
  #       `app/dispatch.ts` through the phase-1 helpers; carry the owner facts
  #       (process id and declared start time) from the composition; append nothing
  #       on a pre-session refusal.
  #   3.2 Disclose a failed lane append as `lane:append-failed` on the attempt
  #       without changing the token, and without exceeding the 16-ref bound.
  #   3.3 Author the resolver in `app/dispatch-lane.ts` and mount it; delete the
  #       `laneFactsFor` closure and its daemon-only filter. Relocate
  #       `DispatchLaneFacts` and re-export it from `edge.ts`.
  #   3.4 Implement the resume rules: recorded-lane resume over `pr-open`
  #       (attach-continue where supported), an operator resume consuming NO
  #       restart ordinal and appending no `economics.restart`, explicit fresh
  #       spawn with a recorded fresh-spawn fact when no lane exists, and a
  #       classified failure with exactly one attempt when the adapter reports the
