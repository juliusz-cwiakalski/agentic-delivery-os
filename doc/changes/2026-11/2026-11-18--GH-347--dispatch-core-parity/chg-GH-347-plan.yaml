# PLAN SHAPE: eight phases, all `kind: delivery` (each edits the repository and
#   takes the default `repo:main-tools` lease), zero `planning` phases. A planning
#   phase would declare no scope to compute and this change has no design work
#   left: the spec is complete at v1.4, the test plan is complete, and the six
#   governing records are authored. `tier.phases` below lists the LIFECYCLE phase
#   ids [1..11] (the ceremony tier engine's vocabulary), not this plan's eight
#   phase ids; the two are different namespaces and the plan never renumbers the
#   lifecycle.
