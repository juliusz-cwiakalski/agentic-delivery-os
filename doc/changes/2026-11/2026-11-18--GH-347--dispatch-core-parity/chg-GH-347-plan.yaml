  # ---------------------------------------------------------------------------
  # Phase 4 — Tracker retry ladder, the pmNotes artifact fact, and the total
  # derivation order (F-4, F-8; DEC-6, DEC-7, DEC-11; TDR-0048).
  #
  # Goal: a tracker outage is bounded, retried, and honest, and the derivation
  # becomes ONE total order that yields all eleven classes — including
  # tracker-done `merged` and artifact `partial` — shared unchanged by the
  # one-shot and daemon paths.
  #
  # Contract (API-4, DM-3, DM-4, DM-8; Appendix F is NORMATIVE):
  #   - Ladder: at most 5 attempts, waits `min(2 s * 2^(n-1), 30 s)` =
  #     2/4/8/16 s, total added latency <= 30 000 ms, the delay INJECTED with
  #     reason `tracker-ladder`; a successful attempt within the ladder is used;
  #     exhaustion is named (`tracker:exhausted`) and never yields a
  #     success-shaped fact. No config key.
  #   - Artifact fact: `pmNotes` is a required tri-state (`complete` |
  #     `incomplete` | `absent`) derived from the delivered pm-notes
  #     read/classification; malformed or absent reads incomplete; the fallible
  #     direction is never "finished".
  #   - Total order (Appendix F(A)–(E)): pre-session refusal (no token) →
  #     attempt-stage failure → spawn refusal `noop-lane-permission` →
  #     tracker-done `merged` → blocking `blocked` → open PR (`pr-open` /
  #     `pr-open-unverified`) → already-merged PR `merged` → commits + complete
  #     pm-notes `finished` → commits + incomplete/absent pm-notes `partial` →
  #     no commits + readable non-done non-blocked tracker
  #     `noop-lane-nothing-to-do` → classifier token → `state-unverified` when
  #     truth is undecidable. A done work item that also carries a blocking label
  #     resolves `merged`. The phase-ledger no-work arm is RETIRED (a complete
  #     ledger no longer produces nothing-to-do; `ledger.workRemaining` stays
  #     carried but gates nothing). The typed-only exit-0-no-artifact `failed` arm
  #     is SUBSUMED. A decisive artifact resolves on a COMPLETED session; at a
  #     stall only the terminal pre-restart verdict set does (phase 5 applies it).
  #   - Arm-aware corroboration (TDR-0048; AC-F8-1, AC-F8-4): the corroboration
  #     REQUIREMENT is arm-aware for exactly TWO arms — the tracker-done `merged`
  #     arm (Appendix F(C)(2)) and the nothing-to-do arm (Appendix F(C)(8)) — and
  #     every other token keeps today's requirement. Tracker-done `merged` and
  #     nothing-to-do are corroborated by the tracker fact ALONE, so absent
  #     pm-notes or CI does not make the claim uncorroborated and cannot raise a
  #     false-success incident. The already-merged-PR `merged` arm (F(C)(5)) keeps
  #     the delivered `["pm-notes","tracker","ci"]` requirement, and `blocked`,
  #     `pr-open`, `pr-open-unverified`, `finished` keep theirs. The corroboration
  #     record's tri-state shape is unchanged (three keys, `satisfied` |
  #     `unsatisfied` | `not-applicable`) and the two unrequired sources are
  #     recorded `not-applicable` on an arm-aware claim. The `"pm-notes"` source
  #     stays the phase ledger and is NOT re-pointed (DEC-11): a divergent ledger
  #     still yields `finished`, recorded as a delivered-evidence divergence, with
  #     `falseSuccess` never suppressed and no new incident kind.
  #   - The arm is decided ONCE, inside the one derivation (a closed arm
  #     discriminator on the derivation result), and consumed by BOTH evaluation
  #     sites: the one-shot path (`app/dispatch.ts`) and the daemon path
  #     (`app/daemon-dispatch-result.ts`). Neither call site re-derives the arm
  #     from its own inputs (that would be a second classification, and
  #     TC-PARITY-002 rejects reimplementations).
  #   - THE EVIDENCE-WINDOW GATE STAYS TOKEN-LEVEL (decision, recorded in the code
  #     and asserted): `domain/dispatch-gate.ts` evaluates `attempt.corroboration`
  #     from a PERSISTED attempt record, which carries no arm; adding one would be
  #     an attempt-record schema change and is forbidden (NFR-3). Behaviour
  #     consequence and why it is acceptable: a tracker-done `merged` attempt is
  #     still counted as a success claim (the token's requirement is non-empty)
  #     and reads SATISFIED, because its persisted record carries
  #     `tracker: satisfied` and `not-applicable` for the two unrequired sources,
  #     and `corroborationSatisfied` treats `not-applicable` as satisfied — so the
  #     window's incident, streak, floor, and coverage arithmetic is unchanged and
  #     no false-success incident resets the window. The only thing the gate
  #     cannot do is distinguish "corroborated by the tracker alone" from
  #     "corroborated by all three"; no gate decision depends on that distinction.
  #     The gate's two `requiredCorroboration` reads are pinned to the TOKEN-LEVEL
  #     requirement through one named accessor so the arm-aware rule cannot leak
  #     into the window by accident.
  #   - One implementation, shared: `deriveDispatchResult` is called by the daemon
  #     path too, so the daemon inherits the new arms (phase 7's TC-PARITY-006 is
  #     the mandated regression observation).
