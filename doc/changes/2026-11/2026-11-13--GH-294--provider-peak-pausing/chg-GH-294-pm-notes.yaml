decisions:
  - text: "OQ-1 resolved by TDR-0028 (Proposed): no-nomination at admission is a
      classified pre-session refusal reusing
      provider.profile.absent/invalid/capability-denied/unavailable identities;
      no dispatch-default fallback (default fallback would nominate an in-window
      profile and bypass peak pausing)"
    date: "2026-11-13"
  - text: "OQ-2 resolved by TDR-0029 (Proposed): peak-pause kinds join as declared
      taxonomy v2, all six topics move together, v1 kinds byte-identical, v1
      retired not concurrent; v1 consumers ignore-and-continue on new kinds,
      foreign stamp is version-drift signal not error"
    date: "2026-11-13"
  - text: "OQ-3 resolved by TDR-0030 (Proposed): park never refused for preservation
      failure; closed-value classification preserved|session-state-not-preserved
      on park record + parked event + status/brief; not-resumable lanes route to
      delivered interrupted-lane recovery, budget-governed, never auto
      re-dispatch"
    date: "2026-11-13"
  - text: "Decision records authored outside change folder
      (doc/decisions/TDR-0028..0030); direct commit via commit primitive refused
      (commit.staging-blocked-untracked, scope not yet declared); the delivery
