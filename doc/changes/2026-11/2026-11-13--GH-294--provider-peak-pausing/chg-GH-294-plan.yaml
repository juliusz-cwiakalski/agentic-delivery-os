        - packages/core/src/provider/engine.ts
        - packages/core/src/contracts/dispatch.ts
        - packages/core/src/contracts/daemon.ts
        - packages/cli/src/commands/dispatch.ts
        - packages/cli/src/commands/lanes.ts
        - tests/behaviour/provider-nomination-admission.test.ts
        - tests/structure/content-inventory.test.ts
        - tests/structure/inventory.json
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/dispatch.ts
        role: producer

