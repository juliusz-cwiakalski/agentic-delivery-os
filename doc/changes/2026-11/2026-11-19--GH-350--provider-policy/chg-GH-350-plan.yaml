    - "A boundary rule promised by TC-CONFORM-008 has no home in the production `.dependency-cruiser.cjs` the harness materialises, or a rule is re-homed into a suite the boundary meta-check cannot exercise (DoR D2-5, TC-CONFORM-008)"
    - "A declared adapters subpath is missing from an enumeration that compares the live manifest against a list (`tests/structure/subpaths.test.ts`, `scripts/checks/workspace-entrypoints.ts`), or a subpath claim is attributed to a suite that does not police it (DoR D2-12)"
    - "A phase changes a contracts export — adds, renames or retires one — without moving `tests/fixtures/ports/v1-contract-inventory.json` in the SAME commit, so the two-way contracts inventory is falsified and `pnpm check` is red with the fix outside declared scope (N-1 as corrected at delivery: the fixture is the edit, the suite is the guard)"
    - "A delivered ordinal moves — `supervise` renumbered from 25, `install` from 26, `steer` from 23 or `metrics` from 24 — or a page is over-corrected so its ordinal becomes the count (AC-F8-3, TDR-0063 C-4, TC-MOUNT-009)"
    - "The family is mounted at fewer than seven members, a help entry is added before the family is mounted (its `seeAlso` target would be unregistered and reference-page parity would fail), or the mount splits across phases (TDR-0063 C-3, AC-F8-5)"
    - "A delivered assertion is deleted, loosened to a floor, renamed, or made conditional instead of moved — specifically TC-PAUSE-011's non-UTC refusal arm, TC-PAUSE-090's UTC-basis instants, TC-PROV-001's `exactly eight and eleven fields` evidence assertion, the `BASELINE_ROWS.length + 130` arithmetic base, or a delivered profile/watch assertion that states the closed watch condition set (test plan §7.2, §4.4)"
    - "A page and the doc-conformance phrase that pins it move in different commits, a phrase row is added for prose a later phase contradicts, a page outside the closed page set states a claim this change falsifies, or `feature-supervise.md` is edited at all (the one-edit-set rule; spec §16's closed page set and family-count class)"
    - "`Intl`, `TZ`, an ambient clock, an environment read, a filesystem read or a network read appears anywhere in packages/core/src/provider or in the provider tier the ambient-globals check scans, `scripts/checks/ambient-globals.ts` still bans neither `Intl` nor a `TZ` access after phase 2, or a second workspace module reads zone data for provider policy (AC-F1-3, NFR-1, TC-ZONE-010)"
    - "The engine's `expiresAtMs` and the daemon watcher's window end stop deriving from the one named `peakWindowEndInstantMs(nowMs, zoneFacts, rule)`, or a second expiry computation reappears (AC-F1-2, NFR-4, TC-ZONE-008, DoR B7)"
    - "A zone derivation spends a FOURTH probe of either port method (`offsetSecondsAt` or `nextTransitionAtOrAfter`), or returns a gap-adjacent instant instead of the transition instant itself — the segment-3 guard returns before a fourth offset probe, the per-method budget is ≤3 + ≤3 with a ceiling of 6, and a spring-forward cell must equal the transition instant to the millisecond (spec v1.8, ADR-0013 `## Revision`, AC-F1-2, TC-ZONE-005/-007/-008)"
    - "A budget evaluation writes state, performs more than one spend-totals read per evaluation at any budget count, opens a second measurement path, or lets a paid entry become selectable while a subscription entry is budget-PARKED (AC-F2-2, AC-F2-4, AC-F2-5, NFR-6, NFR-7, NFR-9, TC-BUD-007/010/016)"
    - "A budget-evaluating invocation measures zero, skips as clear, or downgrades to a window-only evaluation when no work-item ref resolves; the ref seam gains a flag, an environment variable or a state-store read; a read-only member (`quota`, `parks list`, `profile resolve`, `watch status`) resolves a ref; or `simulate` reads the local context (AC-F2-5, TDR-0064, TC-REF-001..005)"
    - "A budget park carries a non-future, absent or guessed expiry, a ticket-scope crossing is presented as a park, or the class-T paid-entry behaviour is implemented as class P (AC-F2-3, NFR-6, DEC-7, TC-BUD-010/017)"
    - "A record-child configuration value (for example `provider.profiles.watch.<name>.maxAgeSeconds`) is asserted to carry a `layer=defaults` origin, or `config/resolver.ts`/`config/defaults.ts` is changed to materialise record-value field defaults — the resolver does not do this today and changing it would move every record child's semantics (non-blocking DoR finding 1)"
    - "A `provider simulate` run writes state, resolves a credential, performs a network call, spawns a child, echoes fixture content in a refusal, or carries a fixture value/secret/token/key field; the payload's delivered resolve keys are renamed, removed, re-ordered or re-typed; or a `workItemRef` key appears in the resolve payload or as a sixth evidence field (AC-F5-1, AC-F5-2, AC-F5-3, NFR-10, TC-REF-004)"
    - "A migration path executes, sources, word-splits, glob-expands, evaluates, emulates or shells out, reads an environment variable, or emits a partial proposal; or a canary credential value reaches any stdout, stderr, envelope, diagnostic, intermediate structure or written file (AC-F6-2, AC-F6-3, NFR-11, NFR-12, TC-MIG-004/005)"
    - "`provider migrate legacy` is presented as the M4-S2 namespace migration or as the install lifecycle's `--migrate` flag, or any phase moves a name, path, state root or artifact (spec §9, §19; TC-MIG-015)"
    - "The watch path gains a cache, snapshot retention, timer, background refresher, scheduler, daemon tick, command or quota freshness key; a stale reading is reported `clear` or `provider-outage`; or a watch-derived park expires after `observedAt + maxAgeSeconds * 1000` (AC-F7-2, AC-F7-3, NFR-13, TC-WFRESH-006/008)"
    - "`watch-stale` enters a park cause, condition kind, skip reason or announcement code, or a condition kind, park cause, skip reason, announcement code or evidence field is added, removed or renamed beyond DM-8's declared six/eight/nine/thirteen and fourteen/seventeen (AC-F8-2, NG-13)"
    - "A per-project surface appears — a `provider.projects.*` key, state kind, command or error identity, a project registry, a host-store policy or cross-checkout inheritance — or the project identity is anything other than the repository checkout (AC-F3-2, AC-F3-3, NG-6, NG-16, PDR-0006)"
    - "The change adds a surface the spec forbids: a command family, a state record kind, a store write path, an environment variable, a provider flag outside the declared members, a CI job, an alarm kind, an event topic, a notification channel, a vendored zone table, a tz-database dependency, or a new secret-read allowlist entry (NG-3, NG-7, NG-10, NG-11, NG-12, NFR-16)"
    - "A source or fixture still states or implies `PROVIDER_PEAK_TIMEZONES = [\"UTC\"]`-only validation, a non-UTC window refused for being non-UTC, or a UTC basis for a declared local window, at a phase boundary after phase 2 (AC-F1-1, AC-F8-3, TC-ZONE-011)"
    - "A guard ships without its failing negative control (including the mount's two-arm proof and the coverage twin mutant), a case is skipped, environment-gated or made green by weakening an oracle, or a new boundary rule has no failing fixture (test plan §4.3, MOUNT-TP-1, TC-CONFORM-008)"
    - "A phase widens or retires a closed set (`PARK_CAUSES`, `PROVIDER_CONDITION_KINDS`, `PROVIDER_SKIP_REASONS`, `ANNOUNCEMENT_CODES`, `PARK_EVIDENCE_FIELDS`, `ANNOUNCEMENT_EVIDENCE_FIELDS`, `PROVIDER_CONDITION_TIE_ORDER`) WITHOUT declaring, in the same commit, every module that maps over it exhaustively — a `switch`/`satisfies`/mapped-type consumer is a BUILD break (TS2366), not a test failure, and discovering it at a phase boundary means the phase cannot be green inside its declared scope (Fix 1, Fix 2)"
    - "A widened count or vocabulary size leaves an ASSERTING SUITE or a page sentence undeclared at that phase — every `toHaveLength`, `toBe`, exact-snapshot comparison, title and prose restatement of a moved value is found by a SWEEP over `tests/**`, `scripts/**` and `doc/spec/**` (the phase-1 inventory above is the result of one), never by memory and never one delivery finding at a time; a suite asserting the old value that no phase declares is the guard hole this trigger closes"
    - "A new adapters subpath, export key or publishable edit leaves a SET assertion or a release-metadata obligation undeclared — an exact export-map list, a `readdirSync(packages/adapters/src)` listing, a `workspaceImports` map in ANY importer, a dependency-cruiser rule-name list, or the one added changeset — because those assertions fail on a set the change widens and on a release gate the change trips; each is found by the adapters-set sweep above and declared in the phase that edits it, never discovered at a boundary"
    - "A new module must hold pre-freeze or vendor tokens (`ADOS_*`, an agent-model name, a prior-working-name literal) and is placed anywhere other than the allowlisted legacy home (`packages/adapters/src/legacy/`), or the closed `forbidden-literals` / `privacy-literals` registry is widened, or a token is assembled by string concatenation to dodge the scan — the closed registry is NEVER widened to accommodate a module, and the vendor table is INJECTED into a vendor-neutral provider tier (TC-PROV-006, phase-6 owner-authorised addition 1)"
    - "A typed target's PRODUCER does not carry every field the reader consumes — a closed `exactKeys` list that omits a declared key so the configuration refuses, or a workaround that STRIPS and RE-ATTACHES the field in the composition edge instead of producing it — is a defect, not a composition concern: the producer must carry the field (admitting the key, no default, no value semantics), while the consumer owns the value rules and the refusing identity (phase-7 owner-authorised `parseWatchTarget`/`maxAgeSeconds` addition)"
    - "`TMPDIR=$PWD/tmp/tmpdir pnpm check` is not green at a phase boundary, a gate is recorded as PASS with an unresolved ERROR, or a phase commits a case it cannot make green (test plan §6.3)"
    - "A phase declares a path it does not edit, or edits a path it does not declare, so the commit primitive loses staging authority for authored content (the SCOPE DECLARATION RULE)"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Declared provider vocabulary, the conformance register with its
  # moved counts, the eight decision records and the DoR records (F-1, F-2, F-7
  # contracts; F-8 register; DM-1, DM-2, DM-3, DM-8, DM-9; AC-F8-1, AC-F8-2;
  # DEC-8, DEC-14; NFR-5, NFR-15; TC-CONFORM-001, -002, -010).
  #
  # Goal: every closed set, evidence allowlist, declared bound and error identity
  # this change moves is declared ONCE, in the vocabulary everything else
  # compiles and classifies against — the pages that RESTATE those numbers move
  # with it — and the change ships with its eight binding decision records and both
  # DoR verdicts staged rather than at the mercy of the staging boundary.

  #
  # Contract: `packages/core/src/contracts/provider.ts` gains, additively and with
  # no member renamed or re-meant: the budget declaration and evaluation types
  # (`enabled`, `scope` = ticket|window, `basis` = cost|tokens, `ceiling`,
  # `windowSeconds`, `entries`) and the budget outcome facts; the read-only
  # `ProviderSpendTotalsPort` (per-scope `{ cost, tokens, newestAtMs }`, both
  # bases returned for every scope so budgets on different bases share one read);
  # the declaration-only `resolveWorkItemRef` seam on the provider runtime
  # (TDR-0064: resolved once at the composition, never a flag and never a read in
  # the pure tier); `budget-exhausted` as condition kind (six), park cause
  # (eight) and skip reason (nine); `provider.budget.parked` and
  # `provider.budget.crossed` as announcement codes (thirteen); the tie order with
  # `budget-exhausted` inserted after `quota-exhausted`;
  # `PROVIDER_WATCH_CONDITIONS` as one closed six-value set including watch-only
  # `watch-stale`; the five budget evidence fields (`budgetName`, `budgetScope`,
  # `budgetBasis`, `budgetMeasured`, `budgetCeiling`) AND the `timezone` evidence
  # field, so the closed allowlists move 8 -> 14 and 11 -> 17 in ONE edit-set
  # (spec §16's contract-surface table). ALL SIX NEW EVIDENCE MEMBERS ARE DECLARED
  # **OPTIONAL** in the evidence types, which is what keeps this phase a pure
  # vocabulary change: `projectParkEvidence`/`projectAnnouncementEvidence` iterate
  # the allowlist and project only PRESENT fields, and the three constructors
  # (`quota.ts`, `conditions.ts`'s merge, `engine.ts`'s evidence parameter) keep
  # compiling until the writer that makes a field meaningful lands — `timezone` in
  # phase 2, the five budget fields in phase 3. A required member here would turn
  # the closed-set widening into a build break across the pure tier (Fix 2's
  # class); and the five declared bound constants
  # `PROVIDER_ZONE_NAME_MAX_LENGTH = 64`,
  # `PROVIDER_SIMULATE_FIXTURE_MAX_BYTES = 65536`,
  # `PROVIDER_MIGRATE_SOURCE_MAX_BYTES = 65536`,
  # `PROVIDER_MIGRATE_SOURCE_MAX_LINES = 2000`, `PROVIDER_MIGRATE_MAX_SOURCES = 64`.
  # `PROVIDER_PEAK_TIMEZONES` is NOT touched here: the zone domain, the default
  # zone, `ProviderZonePort`, the `timezone` declaration field and the retirement
  # of the UTC-only set are phase 2's, because a contract that declared a widened
  # domain while the validators still refused non-UTC would be two contradictory
  # statements about one domain. The `timezone` EVIDENCE field is declared here
  # because a closed allowlist is one set: `projectParkEvidence` projects only
  # fields that are present, so declaring the field changes no emitted evidence
  # until the peak writer supplies it in phase 2 (DoR B5: an admitted field with
  # no writer is not a false claim, and the maximal EMITTED case is phase 3's).
  # THE BARREL AND THE INVENTORY MOVE WITH THE EXPORTS (DoR B3):
  # `packages/core/src/contracts/index.ts` re-exports the contract names (and,
  # in phase 2, stops re-exporting `PROVIDER_PEAK_TIMEZONES`), and
  # `tests/structure/content-inventory.test.ts` + `tests/structure/inventory.json`
  # carry the exact per-file export allowlist for `core/src/contracts/provider.ts`
  # — both move HERE, in the commit that first changes that file's exports, and
  # again in phase 2 for the retirement.
  # The three error rows are declared with category `user`, `retryable: false`,
  # consequence `not_landed`, projection `user-validation`, and a remediation,
  # in `packages/core/src/contracts/error-table.ts`.
  #
  # Register edit-set (see the header): source rows, documented rows and the
  # prose facts spec §16 binds to feature-result-contract.md, one true-positive
  # corpus row per new code, the three other count-bearing pages, the TEN
  # delivered count/membership suites — named: `error-table-sync`,
  # `error-table`, `cross-repository-contract`, `supervision-error-family`,
  # `supervision-error-socialization`, `ceremony-contract`,
  # `dispatch-attempts-taxonomy`, `verify-gates-suite-map-contract`,
  # `ceremony-nonregression` and `merge-classification-conformance` (the last one
  # found by the sweep below, not by memory) — with the `BASELINE_ROWS` arithmetic
  # in
  # `tests/checks/error-table-sync.test.ts` and the structural mirror's
  # `APPENDIX_D_FILES` / no-leftover pattern among them), and
  # the count phrases of the delivered doc-conformance block.
  # `feature-install-lifecycle.md` IS A TWO-NUMBER PAGE AND MOVES HERE FOR ONE OF
  # THEM (Fix 3): THIS phase moves its TABLE TOTAL only, 164 -> 170 — the page
  # states it as "the declared table total at 164 machine identities" and carries
  # **NO delivered-rows metric**, so 163/169 belongs to `feature-metrics.md` and to
  # the sync suite, never to this page. Its FAMILY COUNT (26 -> 27) is phase 8's
  # and its three "`install` is the twenty-sixth" ORDINALS stay untouched in both.
  # `feature-metrics.md` IS A THREE-NUMBER PAGE AND MOVES HERE FOR ONE FAMILY
  # (Fix 2): THIS phase moves its ERROR-TABLE numbers at **lines 260, 348 and the
  # counts half of 390** — "the table holds 164 entries, 163 delivered rows … at
  # `BASELINE_ROWS.length + 130`" (260), "at 164 entries / 163 delivered / 66
  # allowlist / +130" (348) and "(164 / 163 / 66 / +130)" (390) — to
  # 170/169/+136, and the allowlist to 68 (GH-349's two codes; this change moves
  # none of them). Line 390 also carries the MOUNTED FAMILY COUNT, and that half is
  # PHASE 8's (26 -> 27); the same line is therefore edited twice, once per number
  # family, and neither phase may touch the other's half. Its gate-versus-alarm
  # paragraph is phase 9's.
  # THE NO-LEFTOVER SCAN'S NEW FORMS ARE WORDING-BOUND (Fix 1/Fix 4b):
  # `tests/structure/error-table.test.ts` gains the outgoing `164`/`163` forms ONLY
  # as CURRENT-VALUE RESTATEMENTS — never as a bare token — in this declared form
  # set, plus `feature-install-lifecycle.md` and (per Fix 2) nothing else in
  # `APPENDIX_D_FILES`:
  #   `entries` · `identities` · `machine identities` · `documented` ·
  #   `entries).toHaveLength(` · `delivered` · `delivered rows` ·
  #   `163 delivered` · `164 entries / 163 delivered` · `(164 / 163` ·
  #   `toBe(164)` · `toBe(163)` · `toHaveLength(163)` · `toHaveLength(164)` ·
  #   `entries: 164, documented: 164` · `documented: 164` ·
  #   the `BASELINE_ROWS.length + 130` arithmetic form.
  # Every entry is a WORDING, not a number: `… entries`, `… identities`, `…
  # machine identities`, `… documented`, `… delivered`, `… delivered rows`,
  # `entries).toHaveLength(…`, `toBe(…)`, `toHaveLength(…)`, the `entries: 164,
  # documented: 164` pair, and the arithmetic form. THE DELTA CARVE-OUT IS
  # EXPLICIT: `164 -> 170`, `163 -> 169`, `8 -> 14`, `11 -> 17`, `66 -> 68`,
  # `26 -> 27` and
  # every bare-arrow form (`164 → 170` with the unicode arrow, `x -> y`) do NOT
  # trip the scan, because the arrow form is history and the wording form is a
  # live claim. That is what makes the scan discriminate: a page or suite that
  # still states the number as CURRENT fails by name, while a declared delta line
  # survives.
  # THE SUPERVISION FAMILY SUITE STOPS BEING A POSITIONAL PREFIX (Fix 4a):
  # `tests/structure/supervision-error-family.test.ts` compares the live table to
  # a **150-row baseline** with a raw `entries.slice(0, 150)`, and this change
  # inserts THREE `provider` rows INSIDE the provider block (13 -> 16), so every
  # later index shifts and a bare prefix comparison is falsified. The comparison is
  # re-expressed as **"the baseline plus the three declared new `provider` codes"**
  # (filter those three codes out of the live set, then compare row for row), and
  # the tail-kind assertion stops being a slice offset for the same reason. Tail
  # POSITIONS of the other kinds are unchanged; the POSITIONAL EXPRESSION is not,
  # and the comment says so rather than claiming "tail positions unchanged".
  #
  # EXHAUSTIVE-CONSUMER SWEEP — A CLOSED SET IS NOT FREE (delivery finding at the
  # phase-1 boundary; Fix 1 and Fix 2). Widening a closed set breaks every module
  # that maps over it EXHAUSTIVELY, and strict TS with `noImplicitReturns` reports
  # that as a BUILD failure, not a test failure. `packages/core/src/provider/
  # announcements.ts` is the one such consumer in the tree:
  # `announcementCodeForCondition(cause: ParkCause)` switches over the park causes
  # and returns `AnnouncementCode`, so adding `budget-exhausted` fails with
  # `TS2366: Function lacks ending return statement`. IT IS DECLARED IN THIS PHASE,
  # and this phase owns the PURE vocabulary mapping only:
  #   - the `case "budget-exhausted": return "provider.budget.parked"` arm, and
  #   - `provider.budget.parked` in `INFO_CODES` (the severity classification —
  #     `provider.budget.parked` is the declared `info` code, `provider.budget.
  #     crossed` is `warning` and is produced by the evaluator, not by this
  #     mapping).
  # Phase 3 keeps its own `announcements.ts` entry for the EVALUATOR-DRIVEN arm
  # (the `provider.budget.crossed` announcement and the cost-sparsity annotation of
  # DEC-10) — the file is a declared multi-phase file, not a phase-3-only one.
  # THE REST OF THE SWEEP NEEDS NO EDIT, and the reason is recorded rather than
  # assumed: `provider/conditions.ts` and `provider/chain.ts` index or `.includes()`
  # `PROVIDER_CONDITION_TIE_ORDER` / `PROVIDER_CONDITION_KINDS` (no exhaustive
  # match; the tie insertion is phase 3's behaviour); `provider/parks.ts`,
  # `provider/quota.ts` and `conditions.ts` ITERATE `PARK_EVIDENCE_FIELDS` /
  # `ANNOUNCEMENT_EVIDENCE_FIELDS` or construct the evidence object, and the new
  # fields are declared as OPTIONAL additive members here, so every constructor
  # still compiles until its writer lands (phase 2 `timezone`, phase 3 the five
  # budget fields); `provider/engine.ts`, `provider/validate.ts`, `provider/
  # index.ts` and `packages/cli/src/commands/provider.ts` carry the types and
  # renderings without an exhaustive map over a widened set; `packages/core/src/
  # contracts/doctor.ts`'s `DOCTOR_WIRING_NEUTRAL_CONDITIONS` is a plain readonly
  # list (not typed over `ParkCause`, so no exhaustiveness break) and
  # `budget-exhausted` is deliberately NOT wiring-neutral — it is a spend
  # condition, not a wiring defect; and the adapters' only `switch` is over the
  # watch `mapping`, a different union. Any consumer this sweep missed joins the
  # phase that widens the set, in the same commit — never a later phase.

  # THE CONTRACTS-EXPORT INVENTORY FIXTURE MOVES WITH THE EXPORTS (N-1; the SUITE
  # is a guard this change never edits, so it is not declared — N-8):
  # `tests/structure/port-contract-inventory.test.ts` compares the ENTIRE
  # contracts surface two-way against
  # `tests/fixtures/ports/v1-contract-inventory.json` (60 `provider.ts` exports
  # and ~2903 `index.ts` exports committed), so the names and barrel rows this
  # phase adds falsify the fixture in BOTH directions — an added export is
  # "undocumented in the inventory" and a stale inventory row is "missing from the
  # source". The fixture therefore moves in THIS commit, as one edit-set with
  # `contracts/provider.ts` and `contracts/index.ts`; a phase that moves one
  # without the other leaves `pnpm check` red with the fix outside declared scope.
  # The same pairing recurs in phases 2 (retirement), 3 (budget/ref types), 5
  # (simulate types) and 7 (the watch default bound).

  # THE TWO EVIDENCE-ALLOWLIST FIXTURES (DoR B3): the evidence-bounds suite
  # asserts `PARK_EVIDENCE_FIELDS`/`ANNOUNCEMENT_EVIDENCE_FIELDS` are EQUAL to
  # `tests/fixtures/provider/evidence/park-allowlist.json` and
  # `announcement-allowlist.json` and `toHaveLength(8)/(11)`; both move here to
  # fourteen and seventeen or the suite fails at this boundary.
  # THE ENGINE PAGE'S WHOLE VOCABULARY EDIT-SET MOVES HERE (DoR D2-4, N-3): spec
  # §16 names the five count sentences, and this phase also moves the ENUMERATED
  # LISTS those sentences count, because a page whose prose says "nine skip
  # reasons" over a table of eight is self-contradictory — and no gate would read
  # the contradiction until phase 9. ONE EDIT-SET, one commit:
  #   - the summary's "eight skip reasons" -> nine;
  #   - the chain-resolution sentence "the closed eight-value set" -> the closed
  #     nine-value set, AND the reason table beneath it gains the
  #     `budget-exhausted` row in its declared precedence position;
  #   - the parks sentence "the eight-field park allowlist" -> fourteen fields
  #     (`timezone` plus the five budget fields), AND the evidence-field list it
  #     introduces names the six added fields;
  #   - the announcements sentence "the closed eleven-field allowlist" ->
  #     seventeen fields, AND the enumerated announcement-code list gains
  #     `provider.budget.parked` and `provider.budget.crossed` (eleven -> thirteen);
  #   - **the ANNOUNCEMENT-EVIDENCE inline enumeration (the "Announcement safety"
  #     sentence, "projected at runtime through the closed eleven-field allowlist:")
  #     becomes SEVENTEEN and gains the six added names in place** —
  #     `timezone`, `budgetName`, `budgetScope`, `budgetBasis`, `budgetMeasured`,
  #     `budgetCeiling` — so the sentence never reads "seventeen-field allowlist"
  #     above eleven names at any boundary through phase 9;
  #   - **the Quality Assurance "Bounded evidence" row moves to
  #     "14 park fields; 14 base plus 3 announcement fields" and
  #     "the 17-field allowlist"**. The arithmetic is the point: the announcement
  #     allowlist SPREADS the park allowlist and adds three, so "8 base plus 3"
  #     was right while the park list held eight and "14 base plus 3" is right at
  #     fourteen — writing 17-plus-3, or leaving 8-plus-3 beside a fourteen-field
  #     park list, is the self-contradiction this edit-set exists to prevent;
  #   - the closed park-cause enumeration gains `budget-exhausted` (seven -> eight);
  #   - the MAX sentence's fixed tie order becomes
  #     `peak-window`, `quota-exhausted`, `budget-exhausted`, `provider-outage`,
  #     `credential-missing`, `credential-rejected` (five -> six);
  #   - the error-taxonomy sentence "The provider kind carries five provider-engine
  #     error identities" -> the kind carries sixteen rows WHILE THE ENGINE
  #     FAMILY'S OWN COUNT STAYS FIVE (five engine + four profile-selection + four
  #     env-record + three added by this change). The page's OTHER "five
  #     provider-engine rows/identities" statements (the contract-path, the
  #     error-table-synchronization, the depends-on and the consumed-by lines)
  #     stay accurate and are NOT rewritten — the engine family is still five.
  #   Every one of those moves is pinned by this phase's doc-conformance row, so
  #   the pair (page + phrase) lands together and the page is never internally
  #   inconsistent at a boundary. PHASE 9 DOES NOT RE-MOVE ANY OF THEM — not the
  #   counts, not the enumerated reason/cause/code lists, not the tie order, and
  #   not the two allowlist enumerations above; phase 9 writes the budget/ref/
  #   announcement-meaning/CLI prose around text this phase already made true.
  #   The page's zone half is phase 2's and its budget/ref/announcement-meaning/CLI
