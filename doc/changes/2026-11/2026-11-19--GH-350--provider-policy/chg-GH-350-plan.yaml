  # ---------------------------------------------------------------------------
  # Phase 3 — Budget evaluator, one-read spend-totals projection, budget
  # conditions and the no-paid-escalation rule (F-2 pure side; DM-3, DM-4,
  # DM-8; AC-F2-2, AC-F2-3, AC-F2-4, AC-F2-5; DEC-2, DEC-7, DEC-10; NFR-6,
  # NFR-7, NFR-8, NFR-9; TC-BUD-002..016, TC-CONFORM-003, TC-CONFORM-004).
  #
  # Goal: a declared ceiling stops a spawn BEFORE it overspends, measured from
  # the same figures the spend report measures, with no counter, no second truth
  # and no fabricated expiry.
  #
  # Contract: one pure `evaluateBudgets` in packages/core/src/provider/budgets.ts
  # compares each enabled budget governing the entry under evaluation against the
  # injected clock and the injected totals facts: clear below the ceiling;
  # PARKED for a `window` scope at or above it, with cause and condition kind
  # `budget-exhausted` and an expiry of exactly
  # `newestAtMs + windowSeconds * 1000` (strictly future because `newestAtMs <=
  # now` and the window is positive, and honest because at that instant every
  # counted observation has left the window and nothing accrues while parked);
  # FAILED for a `ticket` scope at or above it, with no expiry, announced
  # `provider.budget.crossed` at `warning`, skipped with reason
  # `budget-exhausted`, and answered by the terminal `provider.budget.exceeded`
  # ONLY when no later entry is eligible and no honest contributing park supplies
  # an expiry. Verified-empty measures zero for every scope; a failed read refuses
  # with the delivered `state.*` identity and is never reported clear. The five
  # evidence fields are exactly `budgetName`, `budgetScope`, `budgetBasis`,
  # `budgetMeasured`, `budgetCeiling`; DEC-10's cost-sparsity annotation rides the
  # message and adds no sixth field. `conditions.ts` inserts `budget-exhausted`
  # in exactly its declared tie position; `chain.ts` adds the skip reason, keeps
  # the `chain-exhausted` union with the earliest contributing expiry, and refuses
  # any paid substitution for a budget-parked subscription entry.
  # One read, at the composition edge: packages/cli/src/edge.ts performs ONE
  # verified ref-scoped spend read over the delivered `readSpendLedger` and
  # projects, per declared budget, `{ cost, tokens, newestAtMs }` for its scope
  # (ticket bounded by the ref's beginning; window by `now - windowSeconds`),
  # both bases for every scope so budgets on different bases share one read, and
  # performs NO read at all when nothing is declared or nothing is enabled. No
  # adapters I/O subpath and no state read is added to core.
  # Split with phase 4 (declared): the fail-closed semantic rules —
  # `parseProviderBudgets` in packages/core/src/provider/validate.ts — land here
  # with the evaluator, so TC-BUD-002..016 are this phase's; the catalog branch
  # that makes the declaration reachable from configuration lands in phase 4
  # exactly as §18 orders, so TC-BUD-001 (a resolved configuration refuses an
  # invalid child, naming the field, with no partial evaluation) is phase 4's.
  #
  # Acceptance: AC-F2-2 (TC-BUD-003, -004, -007, -008, -013, -014, -015),
  # AC-F2-3 (TC-BUD-005, -006, -010), AC-F2-4 (TC-BUD-010, -011, -012),
  # AC-F2-5 (TC-BUD-009, -013, -016). NFR-6's unreachable third clause is
  # asserted structurally (VAC-TP-1), never as a behavioural pass.
  #
  # Gate (expected signal: exit 0 at every line; the one-read counter reports 0
  # reads with no budget and exactly 1 at 1, 3 and 8 budgets; the state snapshot
  # is byte-identical):
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
