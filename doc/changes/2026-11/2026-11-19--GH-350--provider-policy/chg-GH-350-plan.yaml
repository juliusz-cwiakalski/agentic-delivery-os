#   - OQ-TP-6 / VAC-TP-1: NFR-6's "no park when `newestAtMs` is null and the
#     measured figure is at or above the ceiling" is structurally unreachable
#     (verified-empty measures 0 and `ceiling` is validated positive); phase 3
#     asserts it as the structural implication, never as a behavioural pass.
#   - OQ-TP-8: there is no `config validate` verb, so TC-MIG-009's "accepted by
#     `config`" is asserted by the delivered validator in-process plus a composed
#     `config` read over a scratch checkout carrying the proposal (phase 6).
#   - OQ-TP-10 / MOUNT-TP-1: `selectPromptRequiredProgram` closes over the module
#     constant, so TC-MOUNT-003's removal arm needs an injected declarative set
#     (preferred) or a temp-copy module imported in isolation; the arm is
#     case-local and is NEVER committed as a production change. Phase 8 declares
#     the seam's shape; a case that cannot induce the mutation fails naming the
#     missing seam instead of passing.
#
# RESOLVED OPEN QUESTIONS (test plan §8.3 — recorded as decisions, not as
#   tasks): OQ-TP-3, OQ-TP-4, OQ-TP-5, OQ-TP-7 and OQ-TP-9 are RESOLVED by spec
#   v1.1/v1.2 and change no phase, scope or case (the five declaring layers and
#   the two empty projections; the NFR-2/NFR-8 bindings and the one-spawn-increment
#   pre-spawn bound; the five declared numeric caps; the 81 -> 84 corpus movement
#   stated as declared values; `PROVIDER_ZONE_NAME_MAX_LENGTH = 64` and the
#   63/64/65 boundary triple).

