# GH-350 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the ONLY plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly. Extra phase data (goal, contract, AC/TC acceptance, authored scope,
# gate commands, commit subject) rides in YAML comments so the parsed document
# stays schema-strict: the plan declares phases and scope only — no `tasks` key,
# no progress log. Plan-phase progress is a pm-notes `notes:` entry naming the
# plan phase id, the commit hash, and the test result.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:      ./chg-GH-350-spec.md (v1.1: F-1..F-8; 30 ACs
#                AC-F1-1..AC-F8-4; DM-1..DM-10; NFR-1..NFR-16; RSK-1..RSK-19;
#                DEC-1..DEC-15; no open question reaches delivery; §5.1
#                capability details; §6 flows 1-8; §7.1 in-scope; §8.5 backward
#                compatibility; §9's "three different things called migration";
#                §12 assumptions; §16 the affected components, the exact path
#                map, the THIRTEEN-row documentation obligation table and the
#                count-bearing-page class rule; §17 the 30 ACs with their
#                ticket-AC and ticket-task traceability and the per-AC
#                verification intent; §18 the dependency-ordered rollout and
#                the "inert by default" adoption statement; §19's declaration
#                that this change migrates NO state; Appendix A (precedence
#                matrix), B (zone grammar, local evaluation, DST rule),
#                C (budget evaluation), D (`delivery.provider.simulate.v1`),
#                E (migration subset, mapping table, refusals), F (watch
#                freshness), G (the three declared provider rows).
#   - Test plan: ./chg-GH-350-test-plan.md (v1.1: 93 cases — TC-ZONE-001..011
#                (11), TC-BUD-001..016 (16), TC-CFG-001..011 (11),
#                TC-INDEP-001..004 (4), TC-SIM-001..011 (11),
#                TC-MIG-001..015 (15), TC-WFRESH-001..010 (10),
#                TC-CONFORM-001..010 (10), TC-DOC-001..005 (5); 30/30 AC
#                coverage in both directions; §3.5 declared assertion bases and
#                seams (BYTE/GIT/SPAWN/READ/ATOMIC/ORDER/FAULT/SEAM/CI/DOC and
#                the change's own VAC-TP-1, EMPTY-TP-1, SPEND-TP-1, NOEXEC-TP-1,
#                DOC-TP-1); §4.3 negative controls; §4.1 hermeticity; §5.1 the
#                scenario index; §5.2 the scenario details; §6.2 fixtures to
#                author; §6.3 the numbered gate battery G1..G6 and the evidence
#                shape; §7.1 the nineteen new files; §7.2 the existing suites
#                the change forces to move, with the named assertion that
#                moves in each; §7.3 the case-to-suite map (93 rows, one owner
#                per case); §8.3's reported findings, of which four are
#                non-blocking and none is open in a way that stops delivery).
#   - PM record: ./chg-GH-350-pm-notes.yaml (milestone "M4: Jaiship-native
#                delivery", story M4-S4; the six binding decisions
#                ADR-0012/PDR-0006/TDR-0049/TDR-0050/TDR-0051/TDR-0052, all
#                `Proposed` with owner acceptance at pull-request review; the
#                clarify-scope and specification record).
#   - Decisions: doc/decisions/ADR-0012 (zone domain, one `ProviderZonePort`,
#                DST rule, three-pass cap, `provider.peak.zone-unknown`,
#                `timezone` evidence), PDR-0006 (per-project = the delivered
#                repository layers; no project key), TDR-0049 (one pure
#                `evaluateBudgets` over one injected read-only
#                `ProviderSpendTotalsPort`; window park vs ticket refusal; no
#                counter; no paid escalation), TDR-0050 (`provider simulate`,
#                strict `delivery.provider.simulate.v1`, `persist: false`,
#                delivered payload plus one `simulation` block, parity not a
#                second evaluator), TDR-0051 (assignment-only data reader,
#                whole-run refusal, name-first credential firewall, validated
#                proposal, create-only `--write`, declared hook posture),
#                TDR-0052 (`maxAgeSeconds`, watch-only `watch-stale`, the `>=`
#                predicate, the park clamp, no park from a stale reading).
#   - Schema:    doc/spec/features/feature-plan-schema.md (scope keys
#                files/folders/packages, per-phase one-line summary, typed
#                done artifacts, leases, weightClass, interactions, tier; no
#                tasks key, no progress log; a page and its phrase row are
#                data, never execution).
#   - Template:  doc/templates/implementation-plan-template.md.
#   - Precedent: ./../2026-11-18--GH-346--installable-versioned-binary/chg-GH-346-plan.yaml
#                (comment-carried phase data, one commit per plan phase, the
#                untracked-decision-record staging pattern, the SCOPE
#                DECLARATION RULE, the count-bearing-page class rule, the
#                declared documentation window, the final-phase release and
#                battery obligations) and ./../2026-11-16--GH-299--metrics-spend/chg-GH-299-plan.yaml.
#   - Rules:     .ai/rules/typescript.md (strict typing, injected
#                environment/clock/randomness, pure domain, adapters own I/O,
#                injected fakes over `mock.module`), .ai/rules/testing-strategy.md
#                (`bun:test` under `tests/**/*.test.ts`, layers
#                structure/behaviour/checks/boundaries/golden, permanent suites
#                assert the current tree and never a diff against a moving base
#                branch, `pnpm check` is the aggregate gate),
#                .ai/rules/bash.md (the two shell suites the boundary rules
#                touch, if the coder reaches them), AGENTS.md (branch model:
#                branch from and target `main-tools`; the supplementary
#                commit-range gate; the doc-distribution obligation — this
#                change ships no redistributable doc under doc/guides/, it
#                corrects existing pages, and `bash
#                scripts/.tests/test-doc-distribution.sh` runs in phase 8's
#                battery as a control).
#
# COMMIT-BOUNDARY REALITY (binding on phase 1 — the untracked decision records):
#   SIX decision records are UNTRACKED in the worktree at plan time:
#     doc/decisions/ADR-0012-zone-aware-peak-windows-iana-zone-resolution.md
#     doc/decisions/PDR-0006-per-project-provider-policy-repository-config-layers.md
#     doc/decisions/TDR-0049-budget-ceilings-park-before-spend-injected-spend-totals.md
#     doc/decisions/TDR-0050-provider-simulate-fixture-and-zero-write-simulation.md
#     doc/decisions/TDR-0051-legacy-provider-profile-and-hook-migration.md
#     doc/decisions/TDR-0052-watch-observation-freshness-and-stale-condition.md
#   The commit primitive stages only plan-declared scope plus the change folder,
#   so a phase that declares nothing for them would leave them untracked and the
#   change would ship without its binding design. Phase 1 therefore declares the
#   six exact paths plus doc/decisions/00-index.md and the doc/decisions/
#   folder, and they land on the PHASE-1 DELIVERY COMMIT — the `commit`
#   invocation carrying the phase-1 message, run at the phase-1 boundary, whose
#   declared scope covers them (spec §16's `doc/decisions/` row and §18's
#   "the decision records and their index rows ride a plan phase's authored
#   scope, not a hand-commit").
#   They do NOT land on `phase complete delivery_planning`: that lifecycle
#   boundary stages the change folder only, because
#   `LIFECYCLE_PLAN_KINDS.delivery_planning = ["planning"]` matches no plan
#   phase (every phase below is `kind: delivery`). The staging authority is
#   phase 1's own declared scope.
#   Their index rows and the `Proposed` status are already committed in
#   doc/decisions/00-index.md, so the index is declared for staging authority (a
#   status/typo touch stages with them); if it needs no edit this phase produces
#   one advisory `plan diff` `undeclared-missing` finding, which is
#   observational and not a failure. TC-CONFORM-010 asserts the six records, the
#   `Proposed` status and one index row each.
#
# SCOPE DECLARATION RULE (binding on every phase):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   delivered regression control is NOT declared. Controls this change re-runs
#   and never edits: tests/structure/metrics-mounting.test.ts,
#   tests/behaviour/entrypoint-two-bins.test.ts,
#   tests/behaviour/entrypoint-composition.test.ts, tests/checks/ci-checks.test.ts,
#   the delivered spend-*/metrics-* behaviour suites behind TC-BUD-016's
#   non-regression arm, the delivered `secret-read-boundary` check behind
#   TC-INDEP-004, the boundary battery's own drivers
#   (tests/boundaries/boundaries.test.ts and its fixture-coverage meta-check,
#   which run whole while only the registry and the fixtures it lists are
#   declared), and `scripts/hooks/pre-opencode-iteration-zai.sh`, which spec §16
#   marks "Reference only — never executed, sourced, imported, or modified".
#   DECLARED EXCEPTIONS (no phase declares them, and each is a decision rather
#   than an omission): `scripts/checks/help-guide-coverage.ts`,
#   `tests/checks/help-guide-coverage.test.ts`,
#   `tests/fixtures/help-guide/coverage.json`,
#   `tests/checks/reference-page-parity.test.ts` and
#   `packages/cli/src/help/prompt-required-commands.ts` are RE-RUN and never
#   edited — this change adds no command family and no reference page, and the
#   provider page is already registered under the M1 root, so the coverage
#   inventory gains no row and the page-root mapping is unchanged (AC-F8-4). They
#   appear in the phase-5, phase-6 and phase-8 gate commands as controls, never in
#   a phase scope. Test plan §7.2 lists them among the suites that move; the only
#   member-tuple move they carry is
#   `tests/behaviour/entrypoint-help-coverage.test.ts`, which IS declared in
#   phases 5 and 6, and the reference page's member sections, which are phase 8's.
#   `tests/checks/ci-checks.test.ts` is the other declared control: no CI job is
#   added and `error-table-sync` stays out of `pnpm check` (NFR-15).
#   A path edited by TWO OR MORE phases keeps ONE owner per assertion and names
#   both halves at both ends. That applies here to
#   packages/core/src/contracts/provider.ts (P1 vocabulary / P2 zone domain),
#   packages/core/src/provider/{validate,engine,index}.ts,
#   packages/cli/src/edge.ts, packages/cli/src/commands/provider.ts,
#   packages/cli/src/help.ts,
#   packages/core/src/config/catalog.ts (P2 stale-comment correction / P4
#   `provider.budgets` / P7 watch `maxAgeSeconds`),
#   tests/structure/provider-contract.test.ts,
#   tests/structure/provider-surface.test.ts,
#   tests/checks/provider-evidence-bounds.test.ts,
#   tests/checks/provider-hermetic.test.ts,
#   tests/structure/content-inventory.test.ts + tests/structure/inventory.json,
#   tests/boundaries/fixture-registry.json, tests/behaviour/provider-budgets.test.ts,
#   tests/behaviour/entrypoint-help-coverage.test.ts,
#   tests/checks/doc-conformance.test.ts and the specification pages that carry
#   claims from more than one phase (feature-provider-engine.md,
#   feature-provider-profiles.md, feature-metrics.md). Each such phase's comment
#   names the half it owns; a later phase never re-states or re-moves an earlier
#   phase's assertion.
#
# THE REGISTER MOVES ONCE, IN PHASE 1, AND NO LATER PHASE TOUCHES A COUNT:
#   `provider.peak.zone-unknown`, `provider.budget.exceeded` and
#   `provider.migrate.refused` are three additive rows of one register
#   (spec F-8, DM-9, Appendix G; DEC-14 declares the arithmetic). The register is
#   a closed two-way table the aggregate gate compares against the documented
#   table and the fixtures, so a row cannot be added where its emitter is written
#   without moving every count site and every count-bearing page in the SAME
#   commit — and three emitters in three phases would stage the movement three
#   times (164->165->166->167, corpus 81->82->83->84, `+130`->`+131`->`+132`->`+133`)
#   across nine suites and five pages, which is exactly the staggered count move
#   test plan TR-10 declares a gap. The rows are therefore declared ONCE, with
#   the vocabulary they belong to, in phase 1 (spec §18's "contracts and the
#   vocabulary first — nothing else can compile against an undeclared set"; the
#   classifier resolves an identity only through the table, so the emitter phases
#   read it, they do not move it).
#   Phase 1 moves, as ONE edit-set: the three source rows
#   (packages/core/src/contracts/error-table.ts), the three documented rows and
#   the prose facts spec §16 binds to doc/spec/features/feature-result-contract.md
#   (the `provider` kind at sixteen rows; the table at 167 in BOTH the machine and
#   the documented table, because the sync check compares them two-way; the
#   delivered-row count at 166, which is the page's own number and one below the
#   table's; the arithmetic at `BASELINE_ROWS.length + 133`; the allowlist stated
#   as explicitly unchanged at 66; and the corpus statement at 84 rows), one
#   true-positive result-code corpus row per
#   new code (tests/fixtures/result/code-corpora/true-positives.json, 81 -> 84),
#   the three other COUNT-BEARING pages (feature-ceremony-runner.md,
#   feature-metrics.md, feature-install-lifecycle.md — and feature-supervise.md
#   is deliberately NOT in this set: its only restatement is the 66-member
#   allowlist, which does not move, so editing it would make a false claim and
#   TC-DOC-001 asserts its `66` stays `66`), the nine delivered count/membership
#   suites, the arithmetic base in scripts/checks/error-table-sync.ts, the
#   repo-wide no-leftover scan in tests/structure/error-table.test.ts (its
#   `APPENDIX_D_FILES` list gains feature-install-lifecycle.md and its token
#   pattern gains this change's outgoing forms `164`, `163` and
#   `BASELINE_ROWS.length + 130`, so a page or suite left behind fails by name
#   while the declared delta shapes `164 -> 167` must not trip it), and the
#   count phrases of the delivered doc-conformance block.
#   DECLARED IDENTITY WINDOW, stated rather than implied: two of the three rows
#   are documented from phase 1 while their emitters land in phases 2 and 3 (the
#   zone refusal) and phase 6 (the migration refusal). No delivered gate reads an
#   emitter, so every phase boundary is green; the branch is unreleased for the
#   whole window, so no operator meets a documented refusal the tool cannot
#   produce; and the alternative — registering each row in its emitter's phase —
#   is the staggered count move the class rule exists to forbid. The row's
#   category, retryability, consequence, projection and remediation are complete
#   at phase 1 because they are declaration data, not behaviour evidence; the
#   behaviour evidence for each row is its own phase's case (TC-ZONE-003 in phase
#   2, TC-CONFORM-001 in phase 1, TC-MIG-003/TC-MIG-013 in phase 6).
#
# PHASE ORDER, THE COUPLINGS, AND WHY THE BOUNDARIES ARE GREEN:
#   Order follows spec §18 (contracts and the vocabulary, then the zone port and
#   the pure arithmetic, then the budget evaluator and its totals projection,
#   then the configuration branch and the per-repository evidence, then
#   simulation, then migration, then watch freshness, then the conformance and
#   documentation sweep). Five transfers are declared rather than discovered:
#   (1) THE BUDGET DECLARATION VALIDATION SPLITS ACROSS PHASES 3 AND 4 — the
#       fail-closed semantic rules are pure (`parseProviderBudgets` in
#       packages/core/src/provider/validate.ts) and land with the evaluator, so
#       TC-BUD-002..016 are phase 3's; the branch that makes them reachable from
#       configuration is `provider.budgets` in the catalog and lands in phase 4
#       exactly as §18 orders, so the declaration matrix through a resolved
#       configuration (TC-BUD-001) is phase 4's. Splitting the other way (branch
#       first) would let configuration accept an invalid budget for one phase,
#       which is the fail-open state AC-F2-1 refuses.
#   (2) THE PROVIDER MEMBER COUNT MOVES TWICE (5 -> 6 in phase 5, 6 -> 7 in
#       phase 6). This is NOT the error-table class: the provider FAMILY count is
#       unchanged at 26 (AC-F8-4), no page states a member count, and both moves
#       are delivered assertions inside the same help-coverage and surface
#       suites, each true at its commit. The family entrypoint list
#       (packages/cli/src/help/prompt-required-commands.ts) is not edited by any
#       phase: two members of an existing family change no family.
#   (3) EVERY PHASE BOUNDARY IS GREEN. The gate command convention is
#       `TMPDIR=$PWD/tmp/tmpdir pnpm check` (the ticket and test plan §6.1 require
#       the TMPDIR prefix in every recorded gate command), run from the
#       repository root at the phase boundary, with the phase's narrow tier run
#       first for iteration. Tests are written INSIDE the phase that implements
#       the behaviour they assert, in the same commit; no phase boundary carries
#       a failing delivered suite, and no phase ships a case it cannot make
#       green. A boundary that needs a later phase's code to be green is a plan
#       defect, not a delivery allowance.
#   (4) THE DOCUMENTATION RULE IS TRUTH-FIRST, NOT SWEEP-FIRST. A page moves in
#       the phase whose delivery FALSIFIES its current text, or whose delivery
#       completes the subject it documents: the count-bearing pages move with the
#       register in phase 1; the three pages that currently state the UTC-only
#       basis and "non-UTC out of scope" move in phase 2 (the phase that falsifies
#       them); the config-layer page moves in phase 4 (the catalogue branch is its
#       whole subject and completes it); and the hook guide moves in phase 6, with
#       the migration that replaces it. Everything purely ADDITIVE — where no
#       sentence on the page is contradicted, only absent — moves in the single
#       phase-8 sweep, because an omission is not a falsehood and spreading
#       additive prose across six phases buys no truth (the budget prose on the
#       engine page, the watch members on the profiles page, the spend statement,
#       the gate-versus-alarm paragraph, the nonfunctional row, the conditions
#       guide, the model guide, the reference page, the two indices, the registry
#       and the M4 pack). The split is load-bearing: leaving the UTC-only
#       sentences to the sweep would keep three specification pages asserting a
#       basis the change reverses from phase 2 to phase 8, and no gate reads those
#       sentences before phase 8 — nothing would fail loudly enough to be noticed.
#       Peak-pausing is COMPLETE at phase 2; the engine and profiles pages are
#       corrected at phase 2 and completed at phase 8, with each half named at
#       both ends.
#   (5) A PAGE AND ITS PHRASE ROW MOVE IN THE SAME COMMIT. The doc-conformance
#       phrase table (tests/checks/doc-conformance.test.ts) is extended per phase
#       for the pages that move in that phase — counts in phase 1, the three
#       zone-basis pages in phase 2, the config-layer page in phase 4, the hook
#       guide in phase 6, the rest in phase 8 — and is never retrofitted: a row
#       added later would assert prose that a later page edit contradicts. It is
#       one artifact edited five times, each time with the pages it pins, which is
#       the same one-edit-set discipline applied per truth event instead of per
#       artifact.
#   Two further orderings are stated: the daemon watcher's boundary consumers
#   (packages/core/src/domain/daemon-peak-pause.ts and
#   packages/core/src/app/daemon-supervision.ts) move WITH the boundary
#   functions in phase 2, because AC-F1-2's "0 differences" is a property of the
#   three surfaces sharing one function and the watcher's own second
#   UTC-seconds computation would otherwise be the second boundary truth the
#   change forbids; and the two adapters subpaths land with their first consumer
#   (time-zone in phase 2, the fixture read in phase 5) so no subpath exists
#   without an export-parity entry and an inventory row.
#
# NO NEW SURFACES (spec NG-11, §7.2, and the out-of-scope list; binding):
#   This change adds NO command family (the provider family keeps its membership
#   and gains two members), NO state record kind, NO store write path, NO
#   environment variable, NO CLI flag outside the declared provider members, NO
#   CI job, NO alarm kind, NO event topic, NO notification channel, NO state
#   migration, NO vendored zone table, NO tz-database dependency, NO watch cache,
#   timer, refresher or scheduler, and NO new secret-read allowlist entry. The
#   provider catalog node declares no `env` or `flag` source (AC-F3-4,
#   EMPTY-TP-1), so provider policy keeps five declaring layers and two empty
#   projections. A phase that finds itself needing any of the above stops and
#   escalates; it does not widen.
#
# AC OWNERSHIP (30/30; exactly one owning phase each; an earlier phase may
#   produce partial evidence, which is additive and never transfers ownership):
#   Phase 1 (2): AC-F8-1, AC-F8-2
#   Phase 2 (3): AC-F1-1, AC-F1-2, AC-F1-3
#   Phase 3 (4): AC-F2-2, AC-F2-3, AC-F2-4, AC-F2-5
#   Phase 4 (7): AC-F2-1, AC-F3-1, AC-F3-2, AC-F3-3, AC-F3-4, AC-F4-1, AC-F4-2
#   Phase 5 (3): AC-F5-1, AC-F5-2, AC-F5-3
#   Phase 6 (5): AC-F6-1, AC-F6-2, AC-F6-3, AC-F6-4, AC-F6-5
#   Phase 7 (4): AC-F7-1, AC-F7-2, AC-F7-3, AC-F7-4
#   Phase 8 (2): AC-F8-3, AC-F8-4
#   Count: 2 + 3 + 4 + 7 + 3 + 5 + 4 + 2 = 30. No AC is unowned and none is
#   claimed twice. AC-F8-1 and AC-F8-2 are phase 1's because the rows, the
#   totals, the corpus and every closed set move there; AC-F8-3 and AC-F8-4 are
#   phase 8's because they are the documentation-truth and the aggregate-gate
#   verdicts over the whole change.
#   GATE-EVIDENCE CASES (a case that supplies evidence for an AC owned by another
#   phase never moves that ownership): TC-CONFORM-010 (six decisions + index
#   rows) evidences AC-F8-3 from phase 1; TC-CONFORM-003/004 evidence AC-F8-2
#   from phase 3; TC-CONFORM-005/006/008/009 evidence AC-F8-2/AC-F8-4 from phase
#   6; TC-CONFORM-007 and the whole G1..G6 battery evidence AC-F8-4 from phase 8.
#
# TC -> PHASE MAP (93 ids; every id owned by exactly one phase — the phase whose
#   commit lands the case together with the capability that makes it green):
#   Phase 1 (3): TC-CONFORM-001, TC-CONFORM-002, TC-CONFORM-010
#   Phase 2 (11): TC-ZONE-001..TC-ZONE-011
#   Phase 3 (17): TC-BUD-002..TC-BUD-016 (15), TC-CONFORM-003, TC-CONFORM-004
#   Phase 4 (16): TC-CFG-001..TC-CFG-011 (11), TC-INDEP-001..TC-INDEP-004 (4),
#                 TC-BUD-001
#   Phase 5 (11): TC-SIM-001..TC-SIM-011
#   Phase 6 (19): TC-MIG-001..TC-MIG-015 (15), TC-CONFORM-005, TC-CONFORM-006,
#                 TC-CONFORM-008, TC-CONFORM-009
#   Phase 7 (10): TC-WFRESH-001..TC-WFRESH-010
#   Phase 8 (6): TC-CONFORM-007, TC-DOC-001..TC-DOC-005
#   Count: 3 + 11 + 17 + 16 + 11 + 19 + 10 + 6 = 93.
#   Ownership follows the phase that COMPLETES the case, which is why
#   TC-BUD-001 (a resolved configuration refuses an invalid child) is phase 4's
#   while TC-BUD-002..016 are phase 3's, and why TC-CONFORM-005 (the whole new
#   surface is hermetic), TC-CONFORM-008 (every new boundary rule ships a failing
#   fixture) and TC-CONFORM-009 (the declared inventory) are phase 6's — the
#   migration module is the last surface each of them covers. Each of those three
#   is asserted incrementally in the phases that precede it, and the incremental
#   arms are named in those phases; the case id is not reused.
#
# CARRIED TEST-PLAN FINDINGS (recorded, not decided here; none blocks delivery
#   and none authorises a widened surface):
#   - OQ-TP-1 / SEAM-TP-1: the zone port, the totals port and the observation
#     instant must be injectable in-process for the behaviour tier. This plan
#     assumes they are, because every one of them is a construction input of the
#     delivered engine or the composition (the same seam shape
#     tests/fixtures/install/artifact.ts used for GH-346); a case that cannot
#     resolve its seam fails by name rather than skipping.
#   - OQ-TP-2 / SPEND-TP-1: if the delivered spend payload exposes no
#     per-observation instants, TC-BUD-013's window arm narrows to the fold-level
#     oracle and the narrowing is recorded in the test plan's §10 rather than
#     papered over. No count, row or AC moves with the narrowing.
#   - OQ-TP-6 / VAC-TP-1: NFR-6's "no park when `newestAtMs` is null and the
#     measured figure is at or above the ceiling" is structurally unreachable
#     (verified-empty measures 0 and `ceiling` is validated positive); phase 3
#     asserts it as the structural implication, not as a behavioural pass, and
#     the spec wording is not softened by the code.
#   - OQ-TP-8: there is no `config validate` verb, so TC-MIG-009's "accepted by
#     `config`" is asserted by the delivered validator in-process plus a composed
#     `config` read over a scratch checkout carrying the proposal. Phase 6 states
#     the same reading in its acceptance paragraph.
#
# RESOLVED OPEN QUESTIONS (test plan §8.3 — recorded as decisions, not as
#   tasks): OQ-TP-3, OQ-TP-4, OQ-TP-5, OQ-TP-7 and OQ-TP-9 are RESOLVED by spec
#   v1.1 and change no phase, scope or case (the five declaring layers and the
#   two empty projections; the NFR-2/NFR-8 bindings and the one-spawn-increment
#   pre-spawn bound; the five declared numeric caps; the 81 -> 84 corpus movement
#   stated as declared values; `PROVIDER_ZONE_NAME_MAX_LENGTH = 64` and the
#   63/64/65 boundary triple).

