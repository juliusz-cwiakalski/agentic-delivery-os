  # ---------------------------------------------------------------------------
  # Phase 7 — Watch freshness: per-target `maxAgeSeconds`, the watch-only
  # `watch-stale` condition and the evidence-bounded park clamp (F-7; DM-8;
  # AC-F7-1..4; DEC-6, DEC-12; NFR-13; TC-WFRESH-001..010).
  #
  # Goal: an aged observation becomes a third, named state that is never a false
  # clear and never a false outage, and no pause outlives the reading it came
  # from.
  #
  # Contract: each watch target's `maxAgeSeconds` is declared in the catalog HERE
  # — a positive integer with default 900 — and a non-positive, non-integer or
  # coerced value refuses `config.value.invalid` naming the key (the declaration
  # and the refusal land together, so no configuration can state a bound nothing
  # enforces). The watch view's
  # `condition` narrows to the declared six-value domain
  # `PROVIDER_WATCH_CONDITIONS` (phase 1's set) — the delivered values keep their
  # delivered meanings and `watch-stale` is WATCH-ONLY: it joins no park cause,
  # condition kind, skip reason or announcement code, and never enters chain
  # resolution or profile eligibility. The predicate is one pure function of the
  # injected clock and the supplied observation instant:
  # `ageSeconds = floor((nowMs - observedAtMs) / 1000)`, stale exactly when
  # `ageSeconds >= maxAgeSeconds` (a negative age is treated as 0 and fresh). A
  # stale view reports `watch-stale` with `observedAt`, `ageSeconds` and
  # `maxAgeSeconds` beside the delivered `name`, `source` and `checkedAt` —
  # `checkedAt` keeps its meaning ("when the command read"), `source` stays the
  # delivered string and states the observed instant and the bound without
  # claiming a transport or credential failure. A park derived from a watch
  # observation expires no later than `observedAt + maxAgeSeconds * 1000`
  # (`min(naturalExpiry, bound)`); when that instant is not strictly in the
  # future, NO park is created and the observation is reported `watch-stale` (the
  # delivered `reset_missing` failed-condition shape). The delivered live
  # composition supplies the read instant as the observation instant, so its age
  # is 0 and it is never stale; staleness is exercised by composition-supplied
  # observations and by the clamp. No park cause, skip reason, announcement code,
  # error identity, command, cache, timer, refresher, scheduler or quota
  # freshness key is added, and the watch path still performs zero state writes.
  # `packages/core/src/contracts/provider-profile.ts` narrows the view's
  # `condition` and adds the three additive fields HERE, with the producer, so the
  # declared shape is never ahead of its writer. No `production.ts` change is
  # needed: the observation instant is the read instant the composition already
  # supplies, so the injection lands in `packages/cli/src/edge.ts` alone.
  #
  # Acceptance: AC-F7-1 (TC-WFRESH-001, -002), AC-F7-2 (TC-WFRESH-003, -004,
  # -010), AC-F7-3 (TC-WFRESH-005, -006, -008), AC-F7-4 (TC-WFRESH-007, -009).
