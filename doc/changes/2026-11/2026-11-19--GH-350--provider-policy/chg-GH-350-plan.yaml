# AMENDED ZONE CONTRACT — PHASE 2 SUMMARY (spec v1.8; ADR-0013's `## Revision` is
# authoritative; this block is the plan-level digest of what phase 2 must now
# build):
#   ONE THREE-MEMBER PORT. `ProviderZonePort` = `isKnownZone(zone)`,
#   `offsetSecondsAt(zone, atMs)` and a REQUIRED `nextTransitionAtOrAfter(zone,
#   atMs): number | undefined` (smallest `T ≥ atMs` with
#   `offsetSecondsAt(zone, T) ≠ offsetSecondsAt(zone, T − 1000)`, or `undefined`
#   when the runtime knows of no transition at or after `atMs`). The third member
#   is required: a composition that can resolve offsets but cannot produce
#   transition instants does not implement the port and must not supply one.
#   `undefined` means **"no transition in the horizon"** — never a capability
#   signal, never a refusal, never an implicit UTC.
#   ONE ZONE-BOUND FACTS VALUE. `ProviderZoneFacts = { offsetSecondsAt(atMs),
#   nextTransitionAtOrAfter(atMs) }`, owned by `packages/core/src/contracts/
#   provider.ts`, bound by `bindZoneFacts(zone, port)` in `packages/core/src/
#   provider/peak.ts`; `UTC_ZONE_FACTS` (offset 0, no transition) is a core
#   constant, which is why a `UTC` declaration still needs no port.
#   ONE EXPIRY DERIVATION, SAME NAME, SECOND PARAMETER'S TYPE ONLY.
#   `peakWindowEndInstantMs(nowMs, zoneFacts, rule)` with `PeakWindowEndRule =
#   { endSecondsOfDay, bufferAfterSeconds }` (the shape `peakWindowEndSeconds`
#   already accepts). Only the second parameter changes type — scalar offset →
#   zone facts — so TC-ZONE-008's structural binding (the engine's `expiresAtMs`,
#   the profile gate's lane decision and the watcher's window end all derive from
#   this one function) still holds unchanged.
#   THE EXACT DERIVATION is a bounded TRANSITION-SEGMENT WALK, not a fixed-point
#   loop over offsets: `LE(t) = t/1000 + offsetSecondsAt(t)` is linear inside a
#   segment and jumps at a transition, and a fixed-point loop cannot locate the
#   instant itself (it oscillates across a gap and lands an hour early or late).
#   Per segment: `T ← nextTransitionAtOrAfter(segStart + 1000)`;
#   `t* ← (target − off) × 1000`; return `t*` when `T` is `undefined` or
#   `t* < T` (STRICT); at segment 3 return `t*` as the deterministic last
#   candidate (the guard, so no fourth offset probe); otherwise
#   `offNext ← offsetSecondsAt(T)` and return `T` when the POST-transition
#   boundary satisfies `T/1000 + offNext ≥ target`; else advance. `target` is
#   invariant across a repeated hour, which is why the first-occurrence rule falls
#   out of the walk rather than needing a special case.
#   PER-CELL RESULTS (the oracle): gap → the transition instant **exactly** (never
#   a rounded neighbour); repeat → the FIRST occurrence at or after the evaluation
#   instant; no transition → plain arithmetic in the current offset.
#   PROBE BUDGET, COUNTED PER METHOD: ≤3 `offsetSecondsAt` probes AND ≤3
#   `nextTransitionAtOrAfter` lookups per derivation, with the segment-3 guard
#   returning before a fourth offset probe — total port-call ceiling 6, and the
#   counting oracle counts each method separately. `waitSeconds` is
#   `floor((expiresAtMs − nowMs) / 1000)` derived from the resolved expiry, never
#   `end − localNow` (across a gap the two differ by the size of the skip).
