  # ---------------------------------------------------------------------------
  # Phase 3 — Budget evaluator, one-read spend-totals projection, the work-item
  # ref seam, budget conditions and the no-paid-escalation rule (F-2 pure side;
  # DM-3, DM-4, DM-8; AC-F2-2, AC-F2-3, AC-F2-4, AC-F2-5; DEC-2, DEC-7, DEC-10,
  # DEC-17; NFR-6, NFR-7, NFR-8, NFR-9, NFR-14; TC-BUD-002..017, TC-REF-001,
  # -002, -003, -005, TC-CONFORM-003, TC-CONFORM-004).
  #
  # Goal: a declared ceiling stops a spawn BEFORE it overspends, measured from
  # the same figures the spend report measures and against the same delivery the
  # operator is running, with no counter, no second truth, no fabricated expiry
  # and no silent clear when the subject cannot be named.
  #
  # Contract: one pure `evaluateBudgets` in packages/core/src/provider/budgets.ts
  # compares each enabled budget governing the entry under evaluation against the
  # injected clock and the injected totals facts: clear below the ceiling;
  # PARKED for a `window` scope at or above it, with cause and condition kind
  # `budget-exhausted` and an expiry of exactly
  # `newestAtMs + windowSeconds * 1000` (strictly future because `newestAtMs <=
  # now` and the window is positive, and honest because at that instant every
  # counted observation has left the window and nothing accrues while parked);
  # FAILED for a `ticket` scope at or above it, with no expiry, announced
  # `provider.budget.crossed` at `warning`, skipped with reason
  # `budget-exhausted`, and answered by the terminal `provider.budget.exceeded`
  # ONLY when no later entry is eligible and no honest contributing park supplies
  # an expiry. Verified-empty measures zero for every scope; a failed read refuses
  # with the delivered `state.*` identity and is never reported clear. The five
  # evidence fields are exactly `budgetName`, `budgetScope`, `budgetBasis`,
  # `budgetMeasured`, `budgetCeiling`; DEC-10's cost-sparsity annotation rides the
  # message and adds no sixth field. `conditions.ts` inserts `budget-exhausted`
  # in exactly its declared tie position; `chain.ts` adds the skip reason, keeps
  # the `chain-exhausted` union with the earliest contributing expiry, and refuses
  # any paid substitution ONLY for a budget-PARKED subscription entry — a
  # ticket-scope crossing is a FAILED entry and leaves a later eligible paid entry
  # selectable exactly under the delivered eligibility rule (AC-F2-3's class P
  # versus class T; TC-BUD-010 versus TC-BUD-017).
  # One read, at the composition edge: packages/cli/src/edge.ts performs ONE
  # verified ref-scoped spend read over the delivered `readSpendLedger` and
  # projects, per declared budget, `{ cost, tokens, newestAtMs }` for its scope
  # (ticket bounded by the ref's beginning; window by `now - windowSeconds`),
  # both bases for every scope so budgets on different bases share one read, and
  # performs NO read at all when nothing is declared or nothing is enabled. No
  # adapters I/O subpath and no state read is added to core.
  # THE WORK-ITEM REF SEAM (DoR B2, TDR-0054): the ref is a FACT, not policy, and
  # it is resolved by ONE seam with three-tier precedence — an explicitly
  # supplied ref-bearing fact wins, otherwise the local delivery context, otherwise
  # the evaluation REFUSES. The pure precedence and the pattern test live in
  # `packages/core/src/domain/pm-context.ts` (new pure module: the three-tier
  # resolution, validation against the delivered `SPEND_WORK_ITEM_REF_PATTERN`,
  # and the refusal shape — no I/O, no ambient read). The DELIVERED reader is
  # `packages/adapters/src/file/pm-context.ts`'s `readLocalPmContext`, consumed
  # unchanged at the delivered path `<cwd>/.ai/local/pm-context.yaml`
  # (`packages/core/src/contracts/spend.ts` and
  # `packages/cli/src/commands/spend.ts` are the delivered reference behaviour and
  # are NOT edited). `packages/cli/src/production.ts` supplies the seam from
  # `readLocalPmContext`; `packages/cli/src/edge.ts` wires it into the provider
  # composition; the `provider resolve` handler passes it through. The ref is
  # required exactly when an enabled budget is evaluated (either scope); the four
  # read-only members never resolve it; an unresolvable ref is ONE
  # `input.value.rejected` at exit 1, before any resolution, probe, credential
  # read, transport call or write, naming the enabled budget(s), the context path
  # and the remedy — never a zero measurement, never a clear skip, never a
  # window-only downgrade.
  # Split with phase 4 (declared): the fail-closed semantic rules —
  # `parseProviderBudgets` in packages/core/src/provider/validate.ts — land here
  # with the evaluator, so TC-BUD-002..017 are this phase's; the catalog branch
  # that makes the declaration reachable from configuration lands in phase 4
  # exactly as §18 orders, so TC-BUD-001 (a resolved configuration refuses an
  # invalid child, naming the field, with no partial evaluation) is phase 4's.
  # THE MAXIMAL-EVIDENCE CASE CONSTRUCTS ITS OBJECT (DoR D2-7): a real budget park
  # carries THIRTEEN fields, because `timezone` is a peak writer's field, so
  # TC-CONFORM-004's fourteen-field oracle is satisfied by constructing the
  # maximal object directly (or by a chain park whose contributing kinds union
  # `budget-exhausted` with `peak-window`) — never by asserting fourteen fields on
  # a budget-only park. TC-BUD-015 stays the five-budget-field oracle; the declared
  # allowlist size was phase 1's.
  # TC-BUD-016's one-measurement-path scan arm is STRUCTURALLY HOMED in
  # `tests/structure/provider-budgets-contract.test.ts` (declared above with
  # TC-CONFORM-003), because that is the phase's own budget suite and the honest
  # place for a scan of the new budget surface. `tests/structure/
  # provider-surface.test.ts` is NOT declared and NOT edited: it enumerates the
  # jira/gitlab/github TRACKER clients, it asserts nothing about the new adapters
  # subpath or the measurement path, and test plan v1.4 (§3.2, §7.2, §7.3) calls it
  # an unedited control — its existing enumeration is exactly what proves the new
  # time-zone subpath was not smuggled into a tracker client's surface, and a
  # control that is edited stops proving anything (DoR D2-12, review caveat).
  # `tests/checks/
  # exports-parity.test.ts` is declared by no phase — it packs each publishable
  # package's declarations generically.
  #
