phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Declared provider vocabulary, the conformance register with its
  # moved counts, and the six decision records (F-1, F-2, F-7 contracts; F-8
  # register; DM-1, DM-2, DM-3, DM-8, DM-9; AC-F8-1, AC-F8-2; DEC-8, DEC-14;
  # NFR-5, NFR-15; TC-CONFORM-001, -002, -010).
  #
  # Goal: every closed set, evidence allowlist, declared bound and error identity
  # this change moves is declared ONCE, in the vocabulary everything else
  # compiles and classifies against — and the change ships with its six binding
  # decision records instead of six untracked files.
  #
  # Contract: packages/core/src/contracts/provider.ts gains, additively and with
  # no member renamed or re-meant: the budget declaration and evaluation types
  # (`enabled`, `scope` = ticket|window, `basis` = cost|tokens, `ceiling`,
  # `windowSeconds`, `entries`) and the budget outcome facts; the read-only
  # `ProviderSpendTotalsPort` (per-scope `{ cost, tokens, newestAtMs }`, both
  # bases returned for every scope so budgets on different bases share one read);
  # `budget-exhausted` as condition kind (six), park cause (eight) and skip
  # reason (nine); `provider.budget.parked` and `provider.budget.crossed` as
  # announcement codes (thirteen); the tie order with `budget-exhausted` inserted
  # after `quota-exhausted`; `PROVIDER_WATCH_CONDITIONS` as one closed six-value
  # set including watch-only `watch-stale`; the five budget evidence fields
  # (`budgetName`, `budgetScope`, `budgetBasis`, `budgetMeasured`,
  # `budgetCeiling`) AND the `timezone` evidence field, so the closed allowlists
  # move 8 -> 14 and 11 -> 17 in ONE edit-set (spec §16's contract-surface table);
  # and the five declared bound constants `PROVIDER_ZONE_NAME_MAX_LENGTH = 64`,
  # `PROVIDER_SIMULATE_FIXTURE_MAX_BYTES = 65536`,
  # `PROVIDER_MIGRATE_SOURCE_MAX_BYTES = 65536`,
  # `PROVIDER_MIGRATE_SOURCE_MAX_LINES = 2000`, `PROVIDER_MIGRATE_MAX_SOURCES = 64`.
  # `PROVIDER_PEAK_TIMEZONES` is NOT touched here: the zone domain, the default
  # zone, `ProviderZonePort`, the `timezone` declaration field and the
  # retirement of the UTC-only set are phase 2's, because a contract that
  # declared a widened domain while the validators still refused non-UTC would be
  # two contradictory statements about one domain. The `timezone` EVIDENCE field
  # is declared here because a closed allowlist is one set: `projectParkEvidence`
  # projects only fields that are present, so declaring the field changes no
  # emitted evidence until the peak writer supplies it in phase 2 — an admitted
  # field with no writer is not a false claim, and splitting the allowlist would
  # stagger the 14/17 movement the class rule forbids.
  # The three error rows are declared with category `user`, `retryable: false`,
  # consequence `not_landed`, projection `user-validation`, and a remediation,
  # in packages/core/src/contracts/error-table.ts.
  #
  # Register edit-set (see the header): source rows, documented rows and the
  # prose facts spec §16 binds to feature-result-contract.md, one true-positive
  # corpus row per new code, the three other count-bearing pages, the nine
  # delivered count/membership suites (the sync script's arithmetic base and the
  # structural mirror's `APPENDIX_D_FILES` / no-leftover pattern among them), and
  # the count phrases of the delivered doc-conformance block.
  # `feature-supervise.md` is NOT declared: its only restatement is the 66-member
  # allowlist, which does not move, and TC-DOC-001 asserts that `66` stays `66`.
  #
  # Decision records: the six untracked records, doc/decisions/00-index.md and
  # the doc/decisions/ folder are declared here and land on THIS PHASE'S DELIVERY
  # COMMIT (COMMIT-BOUNDARY REALITY in the header).
  #
  # Acceptance: AC-F8-1 (TC-CONFORM-001, TC-CONFORM-002), AC-F8-2
  # (TC-CONFORM-003 and -004 complete in phase 3; this phase moves the delivered
  # closed-set assertion, TC-PROV-001's `exactly eight and eleven fields` evidence
  # assertion, which becomes fourteen and seventeen, and the delivered export and
  # bound-constant inventory), AC-F8-3's decision half (TC-CONFORM-010).
  #
  # Gate (expected signal: exit 0 at every line; the sync script reports
  # entries=167 documented=167 in two-way agreement, the page's delivered-row
  # count at 166, 66 two-segment identities, arithmetic +133, corpus 84):
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
  #   TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/error-table-sync.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/provider-contract.test.ts tests/checks/provider-evidence-bounds.test.ts tests/structure/error-table.test.ts tests/checks/error-table-sync.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/doc-conformance.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir pnpm check
  #
  # Commit: feat(GH-350): provider vocabulary, error register and decision records
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Declared provider vocabulary, the conformance register with its moved counts, and the six decision records"
    kind: delivery
    summary: "feat(GH-350): provider vocabulary, error register and decision records"
    scope:
      files:
        - packages/core/src/contracts/provider.ts
        - packages/core/src/contracts/error-table.ts
        # The delivered structural mirrors of the closed sets, the evidence
        # allowlists and the export inventory. THIS phase owns the moved sizes
        # (6/8/9/13, 14/17, the five bound constants, the tie order); PHASE 2
        # adds TC-ZONE-010's zero-ambient-read arm to the same suite.
        - tests/structure/provider-contract.test.ts
        - tests/fixtures/provider/contract-inventory.json
        # The declared allowlist lengths and their equality with the inventory
        # fixture move here; PHASE 3 adds the emitted budget-field bounds arms.
        - tests/checks/provider-evidence-bounds.test.ts
        - tests/fixtures/result/code-corpora/true-positives.json
        # The count and arithmetic surface: the sync script's own arithmetic base
        # and leftover scan gain the outgoing forms (164 identities, 163
        # delivered, `BASELINE_ROWS.length + 130`) so a page or suite left behind
        # fails by name, and the declared delta shapes must not trip the scan.
        - scripts/checks/error-table-sync.ts
        - tests/checks/error-table-sync.test.ts
        - tests/structure/error-table.test.ts
        - tests/structure/cross-repository-contract.test.ts
        - tests/structure/supervision-error-family.test.ts
        - tests/checks/supervision-error-socialization.test.ts
        - tests/structure/ceremony-contract.test.ts
        - tests/structure/dispatch-attempts-taxonomy.test.ts
        - tests/structure/verify-gates-suite-map-contract.test.ts
        - tests/behaviour/ceremony-nonregression.test.ts
        # The delivered GH-346 block's count phrases move with the counts; PHASE
        # 2, 4, 6 and 8 extend the same file for the pages they move.
        - tests/checks/doc-conformance.test.ts
        # Count-bearing pages: they move in the phase that moves the numbers,
        # never in the phase-8 sweep.
        - doc/spec/features/feature-result-contract.md
        - doc/spec/features/feature-ceremony-runner.md
        - doc/spec/features/feature-metrics.md
        - doc/spec/features/feature-install-lifecycle.md
        # The six untracked decision records land on this phase's delivery
        # commit. The index already carries their rows and the `Proposed` status;
        # it is declared so a status/typo touch stages with them.
        - doc/decisions/ADR-0012-zone-aware-peak-windows-iana-zone-resolution.md
        - doc/decisions/PDR-0006-per-project-provider-policy-repository-config-layers.md
        - doc/decisions/TDR-0049-budget-ceilings-park-before-spend-injected-spend-totals.md
        - doc/decisions/TDR-0050-provider-simulate-fixture-and-zero-write-simulation.md
        - doc/decisions/TDR-0051-legacy-provider-profile-and-hook-migration.md
        - doc/decisions/TDR-0052-watch-observation-freshness-and-stale-condition.md
        - doc/decisions/00-index.md
      folders:
        - doc/decisions
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/provider.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/contracts/error-table.ts
        role: producer

  # ---------------------------------------------------------------------------
  # Phase 2 — Zone port, local-seconds peak arithmetic and one shared DST
  # boundary across the engine gate, the profile gate and the daemon watcher
  # (F-1; DM-1, DM-8; AC-F1-1, AC-F1-2, AC-F1-3; DEC-1, DEC-8, DEC-9; NFR-1,
  # NFR-2, NFR-3, NFR-4, NFR-5; TC-ZONE-001..011).
  #
  # Goal: a peak window can be declared in the provider's own zone, the decision
  # stays a pure function of injected facts, and every surface computes ONE
  # boundary instant — or refuses by name instead of reinterpreting the zone.
  #
  # Contract: `provider.entries.<name>.peak.timezone` and
  # `provider.profiles.profiles.<name>.peakWindows.windows[].timezone` admit the
  # literal `UTC` (default, and the alias of `Etc/UTC`) or an IANA name matching
  # the declared grammar bounded by `PROVIDER_ZONE_NAME_MAX_LENGTH` (63 and 64
  # validate, 65 refuses). `PROVIDER_PEAK_TIMEZONES` retires; the validator
  # decides grammar only and never asserts existence. `ProviderZonePort`
  # (`isKnownZone`, `offsetSecondsAt`) lives in core contracts and is implemented
  # once, at `packages/adapters/src/time-zone/`, which is the only workspace
  # module that reads zone data for provider policy (no I/O, no network, no extra
  # environment read beyond what `Intl` itself uses). `packages/adapters/
  # package.json` publishes the subpath. Every composition injects the port;
  # a composition that cannot supply it REFUSES a non-UTC declaration with
  # `provider.peak.zone-unknown` at exit 1 (no UTC fallback, no bundled table),
  # while a `UTC` declaration needs no port. The pure evaluator computes local
  # seconds-of-day from the injected instant and the resolved offset, keeps the
  # delivered non-negative buffer clamp and no-crossing rule read as local
  # seconds, and resolves the expiry by bounded fixed-point iteration (at most
  # three passes, last candidate used) under the declared rule: the earliest
  # instant at or after the declared local end, a skipped local second resolving
  # to the transition instant and a repeated local second to its first
  # occurrence. `peakWindowOpenSeconds` and `peakWindowEndSeconds` keep their
  # names and stay the single boundary truth; every window park and announcement
  # carries `timezone` with the effective declared zone, including the `UTC`
  # default, and cause, condition kind, skip reason and announcement code are
  # unchanged.
  # WATCHER HALF, DECLARED: packages/core/src/domain/daemon-peak-pause.ts
  # currently derives the open/closed verdict from `utcSecondsOfDay` and builds
  # the window end from UTC seconds — that is a second boundary computation and
  # it becomes wrong the moment the basis widens. It therefore moves HERE, with
  # the boundary functions, and packages/core/src/app/daemon-supervision.ts
  # threads the zone facts through its declared peak ports. AC-F1-2's "0
  # differences" (TC-ZONE-008) is not assertable otherwise.
  # `packages/core/src/config/catalog.ts` is touched here for one reason only: its
  # declared comment states the "UTC-only designation" as the rule, which this
  # phase falsifies. The `provider.budgets` branch and the watch `maxAgeSeconds`
  # key are phase 4's.
  #
  # Delivered assertions that MOVE (named, never deleted or loosened):
  #   - tests/structure/provider-peak-rules-schema.test.ts — TC-PAUSE-011's
  #     "a declared non-UTC zone literal is refused at validation" arm RETIRES:
  #     the grammar now accepts an IANA name and existence is decided at the edge.
  #     Its replacement refuses a malformed literal and a runtime-unknown zone.
  #   - tests/behaviour/peak-window-utc-clock.test.ts — TC-PAUSE-090's docblock
  #     and the arm asserting that "a declared non-UTC zone literal keeps the
  #     evaluation instants on the UTC basis (the literal itself is refused at
  #     validation)" become false: the UTC matrix stays byte-identical and the
  #     non-UTC arm moves to the zone suite.
  #   - tests/behaviour/provider-peak-window.test.ts — TC-PROV-011/012/013 extend
  #     to the zone basis with the delivered UTC expectations preserved as the
  #     compatibility arm.
  #
  # Documentation half: feature-provider-engine.md (zone domain and default, the
  # port and the edge, the local-seconds rule and the DST rule, the `timezone`
  # evidence field, the removed UTC-only claim), feature-provider-profiles.md
  # (the zone domain replacing every "UTC only" statement), and
  # feature-peak-pausing.md (COMPLETE here: the shared basis, the DST rule, the
  # removed UTC-only declaration). Their phrase rows land in the same commit.
  #
  # Acceptance: AC-F1-1 (TC-ZONE-001, -002), AC-F1-2 (TC-ZONE-005, -006, -007,
  # -008), AC-F1-3 (TC-ZONE-003, -004, -009, -010, -011).
  #
  # Gate (expected signal: exit 0 at every line; the DST matrix and the
  # three-surface table report 0 differences; the ambient-globals guard exits 0):
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/provider-peak-zone.test.ts tests/checks/provider-zone-refusal.test.ts tests/structure/provider-peak-rules-schema.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/provider-peak-window.test.ts tests/behaviour/peak-window-utc-clock.test.ts tests/behaviour/daemon-peak-window-isolation.test.ts tests/behaviour/provider-parks.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/boundaries
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/doc-conformance.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir pnpm check
  #
  # Commit: feat(GH-350): zone-aware peak windows and the shared DST boundary
  # ---------------------------------------------------------------------------
  - id: 2
    title: "Zone port, local-seconds peak arithmetic and one shared DST boundary across the engine gate, the profile gate and the daemon watcher"
    kind: delivery
    summary: "feat(GH-350): zone-aware peak windows and the shared DST boundary"
