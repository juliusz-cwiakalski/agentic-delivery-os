  # NFR-2, NFR-3, NFR-4, NFR-5; TC-ZONE-001..011).
  #
  # Goal: a peak window can be declared in the provider's own zone, the decision
  # stays a pure function of injected facts, and every surface computes ONE
  # boundary instant through ONE named function — or refuses by name instead of
  # reinterpreting the zone.
  #
  # Contract: `provider.entries.<name>.peak.timezone` and
  # `provider.profiles.profiles.<name>.peakWindows.windows[].timezone` admit the
  # literal `UTC` (default, and the alias of `Etc/UTC`) or an IANA name matching
  # the declared grammar bounded by `PROVIDER_ZONE_NAME_MAX_LENGTH` (63 and 64
  # validate, 65 refuses). `PROVIDER_PEAK_TIMEZONES` retires — in the contract AND
  # in the `#contracts` barrel AND in the content inventory, in this commit; the
  # validator decides grammar only and never asserts existence.
  # `ProviderZonePort` (`isKnownZone`, `offsetSecondsAt`) lives in core contracts
  # and is implemented once, at `packages/adapters/src/time-zone/`, which is the
  # only workspace module that reads zone data for provider policy (no I/O, no
  # network, no extra environment read beyond what `Intl` itself uses).
  # `packages/adapters/package.json` publishes the subpath. Every composition
  # injects the port; a composition that cannot supply it REFUSES a non-UTC
  # declaration with `provider.peak.zone-unknown` at exit 1 (no UTC fallback, no
  # bundled table), while a `UTC` declaration needs no port.
  # THE ONE NAMED EXPIRY DERIVATION (DoR B7): `peakWindowEndInstantMs(nowMs,
  # offsetSeconds, rule)` is declared in `packages/core/src/provider/peak.ts`
  # beside the delivered seconds-of-day helpers, which KEEP their names and stay
  # SECONDS-OF-DAY PRODUCERS ONLY. It resolves the earliest instant at or after
  # the declared local end by bounded fixed-point iteration (at most three
  # passes, last candidate used), a skipped local second resolving to the
  # transition instant and a repeated local second to its first occurrence. BOTH
  # the engine's `expiresAtMs` and the daemon watcher's window end call it, so
  # the assertion is exact: `evaluatePeakWindow`'s `expiresAtMs` and
  # `daemon-peak-pause.ts`'s window end derive from that function, and
  # `peakWindowOpenSeconds`/`peakWindowEndSeconds` produce no absolute instant.
