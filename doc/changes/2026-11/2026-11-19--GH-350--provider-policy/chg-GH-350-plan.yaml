  #     non-UTC arm moves to the zone suite.
  #   - tests/behaviour/provider-peak-window.test.ts — NOT EDITED (corrected at
  #     delivery): the delivered UTC expectations stay byte-unchanged as the
  #     compatibility arm, and the zone-basis arms (TC-PROV-011/012/013's zone
  #     halves) live in `provider-peak-zone.test.ts` instead. The suite is a control,
  #     declared by no phase.
  #   - tests/golden/provider-parks-list.test.ts and the
  #     `tests/fixtures/provider/golden/` data — every park now carries
  #     `timezone`, so the parks-list and resolve goldens are regenerated as a
  #     declared delta here (phase 3 regenerates them again for a budget park).
  #
  # THE NEW SUBPATH, THE CONTRACT INVENTORY AND THE RULE PATH (DoR D2-5, D2-12,
  # N-1, N-8): a declared adapters subpath must join the TWO enumerations that
