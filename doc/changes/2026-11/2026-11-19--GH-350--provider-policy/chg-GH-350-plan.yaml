  # ---------------------------------------------------------------------------
  # Phase 7 — Watch freshness: per-target `maxAgeSeconds`, the watch-only
  # `watch-stale` condition and the evidence-bounded park clamp (F-7; DM-8;
  # AC-F7-1..4; DEC-6, DEC-12; NFR-13; TC-WFRESH-001..010).
  #
  # Goal: an aged observation becomes a third, named state that is never a false
  # clear and never a false outage, and no pause outlives the reading it came
  # from.
  #
  # Contract: each watch target's `maxAgeSeconds` is a positive integer with a
  # declared default of 900; the catalog declares the key HERE, with the
  # predicate that consumes it, so no configuration can state a bound nothing
  # honours. A non-positive, non-integer or coerced value refuses
  # `config.value.invalid` naming the key.
  # THE ORIGIN READING IS DECLARED (non-blocking DoR finding 1, verified): the
  # effective value is `target.maxAgeSeconds ?? PROVIDER_WATCH_DEFAULT_MAX_AGE_SECONDS`
  # applied by the pure policy, and a DECLARED value's origin is its declaring
  # layer's origin. There is NO `layer=defaults` origin for a record child: the
  # resolver builds the defaults layer from catalog paths carrying a `default`
  # field plus `PRODUCTION_DEFAULTS` descendants, so a record value's child object
  # is not materialised with its field default and carries no default origin; the
  # catalog's `default: 900` is declaration metadata. Neither
  # `config/resolver.ts` nor `config/defaults.ts` is edited — materialising
  # record-value field defaults would move every record child's semantics.
  # The watch view's `condition` narrows to the declared six-value domain
  # `PROVIDER_WATCH_CONDITIONS` (phase 1's set) — the delivered values keep their
  # delivered meanings and `watch-stale` is WATCH-ONLY: it joins no park cause,
  # condition kind, skip reason or announcement code, and never enters chain
  # resolution or profile eligibility. The predicate is one pure function of the
  # injected clock and the supplied observation instant:
  # `ageSeconds = floor((nowMs - observedAtMs) / 1000)`, stale exactly when
  # `ageSeconds >= maxAgeSeconds` (a negative age is treated as 0 and fresh). A
  # stale view reports `watch-stale` with `observedAt`, `ageSeconds` and
  # `maxAgeSeconds` beside the delivered `name`, `source` and `checkedAt` —
  # `checkedAt` keeps its meaning ("when the command read"), `source` stays the
  # delivered string and states the observed instant and the bound without
