  # Phase 6 — `provider migrate legacy`: the assignment-only data reader, the
  # credential firewall and the validated proposal (F-6; DM-7; AC-F6-1..5;
  # DEC-5, DEC-13; NFR-11, NFR-12, NFR-16; TC-MIG-001..015, TC-CONFORM-005,
  # -008, -009).
  #
  # Goal: the bridge off the legacy shell policy is safe by construction — the
  # files are parsed as DATA, every construct outside one declared subset refuses
  # the whole run, and a credential value cannot reach any surface.
  #
  # Contract: `provider migrate legacy [--profiles-dir <dir>] [--hook <path>]
  # [--write] [--json]` lives in the existing family as a two-level member.
  # Default sources derive from the invoking identity's prior working name
  # (`<home>/.<priorWorkingName>/config/profiles/` and
  # `<home>/.<priorWorkingName>/hooks/pre-opencode-iteration`); the flags override
  # them; an absent source is reported `absent`; neither present refuses
  # `no-source`. The reader is bounded by the three declared caps, reads each
  # source ONCE, and accepts exactly one grammar: blank lines, `#` comments, and
  # `NAME=value` or `export NAME=value` with a single bare or quoted single-token
  # value containing no whitespace, expansion character, operator or backslash.
  # Nothing else is accepted: a function definition, compound command,
  # `source`/`.`, `eval`, `set`/`unset`/`readonly`, heredoc, redirection,
  # pipeline, command substitution, arithmetic expansion, array, multi-command
  # line or expansion-bearing value refuses the WHOLE run with
  # `provider.migrate.refused` at exit 1 and one closed reason — `no-source`,
  # `unreadable-source`, `oversized-source`, `shell-construct`, `dynamic-value`,
  # `target-exists`, `proposal-invalid` — naming the source path and line and
  # never the content. Nothing is executed, sourced, word-split, glob-expanded,
  # evaluated or shelled out; no environment is read; no network is used. The
  # credential firewall is NAME-FIRST: a credential-shaped name is recognised
  # before its value is examined, the rest of the line is discarded at the parse
  # boundary without parsing or validating it, and the only representable
  # credential artifact is a reference. Mapping is literal-to-literal under
  # Appendix E's closed table; a recognised name whose value cannot be mapped, and
  # every unrecognised name, is disclosed by name as `unmapped` and omitted. The
  # proposal is validated by the delivered provider validator and configuration
  # schema BEFORE output; `--write` creates at most one new project-committed
  # document and refuses `target-exists` rather than reading for merge. The
  # shipped hook (316 lines, `scripts/hooks/pre-opencode-iteration-zai.sh`)
  # refuses as `shell-construct` with the documented remedy — declare the window,
  # the quota endpoint and the credential reference in configuration and retire
  # the hook from the path; it is never executed, sourced, imported or modified
  # (spec §16 marks it "Reference only"), so no phase declares it.
  # OQ-TP-8: "accepted by `config`" is asserted by the delivered validator
  # in-process plus a composed `config` read over a scratch checkout carrying the
  # proposal — there is no `config validate` verb and this phase does not invent
  # one.
  # Bounded source reads use the delivered `packages/adapters/src/file` subpath (a
  # new module inside the declared folder; its name is a delivery decision). The
  # report names sources, byte counts, mapped names, unmapped names, absent
  # sources and the written path — names and counts only, never a value.
  # NO HELP ENTRY HERE (declared, same reason as phase 5): the `provider migrate`
