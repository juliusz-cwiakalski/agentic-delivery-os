    - "A phase boundary leaves the error-table counts, the result-code corpus or the two-segment allowlist between the old and the new value (provider rows 13 -> 16; the machine AND documented table 164 -> 167; the delivered-row count 163 -> 166; the sync arithmetic `BASELINE_ROWS.length + 130` -> `+133`; the corpus 81 -> 84 at 59 true-positive / 25 false-positive; the allowlist unchanged at 66), or a count moves in more than one phase (AC-F8-1, DEC-14, NFR-15, test plan TR-10)"
    - "A count-bearing page (feature-result-contract.md, feature-ceremony-runner.md, feature-metrics.md, feature-install-lifecycle.md, or feature-supervise.md if it ever names a total) states an outgoing total, delivered-row count, allowlist size or `BASELINE_ROWS` arithmetic as current at any phase boundary, or a page's sentence moves without its number (spec §16's count-bearing class rule; AC-F8-3; TC-DOC-001)"
    - "A delivered assertion is deleted, loosened to a floor, renamed, or made conditional instead of moved — specifically TC-PAUSE-011's non-UTC refusal arm, TC-PAUSE-090's UTC-basis instants, TC-PROV-001's `exactly eight and eleven fields` evidence assertion, the `BASELINE_ROWS.length + 130` arithmetic base, or a delivered profile/watch assertion that states the closed watch condition set (test plan §7.2, §4.4)"
    - "A page and the doc-conformance phrase that pins it move in different commits, or a phrase row is added for prose a later phase contradicts (the one-edit-set rule, applied per truth event)"
    - "`Intl`, `TZ`, an ambient clock, an environment read, a filesystem read or a network read appears anywhere in packages/core/src/provider or in the provider tier the ambient-globals check scans, or a second workspace module reads zone data for provider policy (AC-F1-3, NFR-1, TC-ZONE-010)"
    - "A budget evaluation writes state, performs more than one spend-totals read per evaluation at any budget count, opens a second measurement path, or lets a paid entry become selectable because a subscription entry is budget-parked (AC-F2-2, AC-F2-4, AC-F2-5, NFR-6, NFR-7, NFR-9, TC-BUD-007/010/016)"
    - "A budget park carries a non-future, absent or guessed expiry, or a ticket-scope crossing is presented as a park (the fail-loud park invariant; AC-F2-3, NFR-6, DEC-7)"
    - "A `provider simulate` run writes state, resolves a credential, performs a network call, spawns a child, echoes fixture content in a refusal, or carries a fixture value/secret/token/key field; or the payload's delivered resolve keys are renamed, removed, re-ordered or re-typed (AC-F5-1, AC-F5-2, AC-F5-3, NFR-10)"
    - "A migration path executes, sources, word-splits, glob-expands, evaluates, emulates or shells out, reads an environment variable, or emits a partial proposal; or a canary credential value reaches any stdout, stderr, envelope, diagnostic, intermediate structure or written file (AC-F6-2, AC-F6-3, NFR-11, NFR-12, TC-MIG-004/005)"
    - "`provider migrate legacy` is presented as the M4-S2 namespace migration or as the install lifecycle's `--migrate` flag, or any phase moves a name, path, state root or artifact (spec §9, §19; TC-MIG-015)"
    - "The watch path gains a cache, snapshot retention, timer, background refresher, scheduler, daemon tick, command or quota freshness key; or a stale reading is reported `clear` or `provider-outage`; or a watch-derived park expires after `observedAt + maxAgeSeconds * 1000` (AC-F7-2, AC-F7-3, NFR-13, TC-WFRESH-006/008)"
    - "`watch-stale` enters a park cause, condition kind, skip reason or announcement code, or a condition kind, park cause, skip reason, announcement code or evidence field is added, removed or renamed beyond DM-8's declared six/eight/nine/thirteen and fourteen/seventeen (AC-F8-2, NG-13)"
    - "A per-project surface appears — a `provider.projects.*` key, state kind, command or error identity, a project registry, a host-store policy or cross-checkout inheritance — or the project identity is anything other than the repository checkout (AC-F3-2, AC-F3-3, NG-6, NG-16, PDR-0006)"
    - "The change adds a surface the spec forbids: a command family, a state record kind, a store write path, an environment variable, a flag outside the declared provider members, a CI job, an alarm kind, an event topic, a notification channel, a vendored zone table, a tz-database dependency, or a new secret-read allowlist entry (NG-3, NG-7, NG-10, NG-11, NG-12, NFR-16)"
    - "A source or fixture still states or implies `PROVIDER_PEAK_TIMEZONES = [\"UTC\"]`-only validation, a non-UTC window refused for being non-UTC, or a UTC basis for a declared local window, at a phase boundary after phase 2 (AC-F1-1, AC-F8-3, TC-ZONE-011)"
    - "A guard ships without its failing negative control, a case is skipped, environment-gated or made green by weakening an oracle, or a new boundary rule has no failing fixture (test plan §4.3, TC-CONFORM-008)"
    - "`TMPDIR=$PWD/tmp/tmpdir pnpm check` is not green at a phase boundary, a gate is recorded as PASS with an unresolved ERROR, or a phase commits a case it cannot make green (test plan §6.3)"
    - "A phase declares a path it does not edit, or edits a path it does not declare, so the commit primitive loses staging authority for authored content (the SCOPE DECLARATION RULE)"
