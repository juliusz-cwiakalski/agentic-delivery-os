  # ---------------------------------------------------------------------------
  # Phase 2 — Zone port, local-seconds peak arithmetic and one named expiry
  # derivation shared by the engine gate, the profile gate and the daemon watcher
  # (F-1; DM-1, DM-8; AC-F1-1, AC-F1-2, AC-F1-3; DEC-1, DEC-8, DEC-9; NFR-1,
  # NFR-2, NFR-3, NFR-4, NFR-5; TC-ZONE-001..011).
  #
  # Goal: a peak window can be declared in the provider's own zone, the decision
  # stays a pure function of injected facts, and every surface computes ONE
  # boundary instant through ONE named function — or refuses by name instead of
  # reinterpreting the zone.
  #
  # Contract (SPEC v1.8 — the AMENDED ZONE CONTRACT; ADR-0013's `## Revision` is
  # authoritative, see the header digest):
  # `provider.entries.<name>.peak.timezone` and
  # `provider.profiles.profiles.<name>.peakWindows.windows[].timezone` admit the
  # literal `UTC` (default, and the alias of `Etc/UTC`) or an IANA name matching
  # the declared grammar bounded by `PROVIDER_ZONE_NAME_MAX_LENGTH` (63 and 64
  # validate, 65 refuses). `PROVIDER_PEAK_TIMEZONES` retires — in the contract AND
  # in the `#contracts` barrel AND in the provider contract inventory, in this
  # commit; the validator decides grammar only and never asserts existence.
  # THE PORT HAS THREE MEMBERS, THE THIRD REQUIRED. `ProviderZonePort` =
  # `isKnownZone(zone)`, `offsetSecondsAt(zone, atMs)` and
  # `nextTransitionAtOrAfter(zone, atMs): number | undefined` — the smallest
  # instant `T ≥ atMs` at which the zone's offset changes
  # (`offsetSecondsAt(zone, T) ≠ offsetSecondsAt(zone, T − 1000)`). It is a
  # REQUIRED member, not an optional one: a composition that can resolve offsets
  # but cannot produce transition instants does not implement the port and per
  # C-2 must not supply one. `packages/adapters/src/time-zone/index.ts` implements
  # all three over the runtime's own `Intl` data AND verifies transitions
  # (`offsetSecondsAt(T) ≠ offsetSecondsAt(T − 1000)`) before reporting them; it is
  # the only workspace module that reads zone data for provider policy (no I/O, no
  # network, no extra environment read beyond what `Intl` itself uses).
  # `packages/adapters/package.json` publishes the subpath.
  # THE PURE INPUT IS A ZONE-BOUND FACTS VALUE. `ProviderZoneFacts =
  # { offsetSecondsAt(atMs), nextTransitionAtOrAfter(atMs) }` is owned by
  # `packages/core/src/contracts/provider.ts` (type only, ambient-neutral tier) and
  # bound by `bindZoneFacts(zone, port)` in `packages/core/src/provider/peak.ts`;
  # `UTC_ZONE_FACTS = { offsetSecondsAt: () => 0, nextTransitionAtOrAfter: () =>
  # undefined }` is a core constant, which is why a `UTC` (or `Etc/UTC`)
  # declaration still needs NO port. Every composition injects the port; a
  # composition that cannot supply it REFUSES a non-UTC declaration with
  # `provider.peak.zone-unknown` at exit 1 (no UTC fallback, no bundled table).
  # `undefined` FROM THE TRANSITION LOOKUP MEANS "NO TRANSITION IN THE HORIZON" —
  # never a capability signal, never a refusal, never an implicit UTC. The core
  # treats it as "no transition intervenes", which is exact for a zone with no
  # further transition: a declared window never crosses local midnight and
  # `endSecondsOfDay ≤ 86400`, so any expiry lies at most 24 h ahead, and a zone
  # that transitions in that day has a transition to report. Refusing on
  # `undefined` would fail a zone that lawfully abolished DST.
  # THE ONE NAMED EXPIRY DERIVATION (DoR B7; spec v1.8):
  # `peakWindowEndInstantMs(nowMs, zoneFacts, rule)` with `PeakWindowEndRule =
  # { endSecondsOfDay, bufferAfterSeconds }` (the same end-rule shape
  # `peakWindowEndSeconds` already accepts) is declared in
  # `packages/core/src/provider/peak.ts` beside the delivered seconds-of-day
  # helpers, which KEEP their names and stay SECONDS-OF-DAY PRODUCERS ONLY. ONLY
  # THE SECOND PARAMETER'S TYPE CHANGES — scalar offset → `ProviderZoneFacts` — so
  # TC-ZONE-008's structural binding still holds unchanged: the engine's
  # `expiresAtMs`, the profile gate's lane decision and the watcher's window end
  # all derive from this one function and none recomputes an instant from
  # `utcSecondsOfDay`. Callers obtain facts through an injected
  # `zoneFactsFor(zone)` seam (engine dependencies; watch input) built by
  # `bindZoneFacts`, so the three surfaces consume one derivation and one binder.
  # A descriptor window passes `bufferAfterSeconds: 0`; a profile window passes its
  # own two values.
  # THE DERIVATION IS A BOUNDED TRANSITION-SEGMENT WALK (not a fixed-point loop
  # over offsets — offsets alone cannot locate a gap: the loop oscillates across
  # the discontinuity and lands an hour early or late). Work at whole seconds
  # (`nowS = floor(nowMs/1000) × 1000`); `LE(t) = t/1000 + offsetSecondsAt(t)` is
  # linear inside an offset segment and jumps at each transition; `localNow =
  # mod(nowS/1000 + off₀, 86400)` anchors the local day once and
  # `target = (nowS/1000 + off₀) − localNow + E` is invariant across a repeated
  # hour (which is why the FIRST-occurrence rule falls out instead of needing a
  # case). Then, per segment: `off ← zoneFacts.offsetSecondsAt(segStart)` (probe 1
  # at `nowS`); `T ← zoneFacts.nextTransitionAtOrAfter(segStart + 1000)` — probed
  # at `segStart + 1000` so a transition exactly at `nowS` is not re-reported,
  # because `offsetSecondsAt(nowS)` already carries the post-transition offset;
  # `t* ← (target − off) × 1000`; return `t*` when `T = undefined` or `t* < T`
  # (STRICT); at segment 3 return `t*` as the deterministic last candidate (the
  # BUDGET GUARD — never a fourth offset probe); else `offNext ←
  # zoneFacts.offsetSecondsAt(T)` and return `T` when the POST-transition boundary
  # satisfies `T/1000 + offNext ≥ target`; else `off ← offNext`, `segStart ← T` and
  # repeat.
  # PER-CELL RESULTS (the oracle TC-ZONE-005/006 assert): a skipped local second
  # (spring-forward gap) resolves to the TRANSITION INSTANT EXACTLY — the boundary
  # test uses the POST-transition offset at `T`, never a rounded neighbour an hour
  # away; a repeated local second (fall-back) resolves to its FIRST occurrence at
  # or after the evaluation instant, because `t* < T` is strict and `target` is
  # invariant; a window with no transition in between resolves by plain arithmetic
  # in the current offset (`T` undefined).
  # PROBE BUDGET, COUNTED PER METHOD: at most **3 `offsetSecondsAt` probes** and at
  # most **3 `nextTransitionAtOrAfter` lookups** per derivation, the segment-3
  # guard returning before it spends a fourth offset probe — TOTAL port-call
  # ceiling 6, and the counting fake port counts each method separately. Typical
  # cost is 1 + 1 (UTC, a non-DST zone, or a DST zone whose window is not open
  # across its transition) and 2 + 2 when one transition intervenes.
  # `waitSeconds` on a peak condition and on its park is
  # `floor((expiresAtMs − nowMs) / 1000)` — derived from the resolved expiry, NEVER
  # from `end − localNow`, because across a gap the two differ by the size of the
  # skip and the seconds-of-day form would publish a wait that contradicts the
  # park's own `expiresAtMs`.
  # WATCHER HALF, DECLARED: `packages/core/src/domain/daemon-peak-pause.ts`
  # currently derives the verdict from `utcSecondsOfDay` and builds the window end
  # from UTC seconds — a second boundary computation that becomes wrong the moment
  # the basis widens. It therefore moves HERE: `peakWindowOpenAt(rules, nowMs,
  # zoneFactsFor)` binds each declared window's zone through the injected seam and
  # calls `peakWindowEndInstantMs`, so its own instant computation is REMOVED; its
  # domain barrel row (`packages/core/src/domain/index.ts`) follows the new input
  # fact, and `packages/core/src/app/daemon-supervision.ts` threads the zone facts
  # through its declared peak ports. AC-F1-2's "0 differences" (TC-ZONE-008) is
  # not assertable otherwise.

  # THE AMBIENT GUARD GAINS THE ZONE RULE (DoR B3): `scripts/checks/
  # ambient-globals.ts` bans neither `Intl` nor a `TZ` access today, so
  # TC-ZONE-010's negative fixture had no rule to fail. `Intl` joins
  # `BANNED_GLOBALS` here (the `TZ` read is already unreachable because `process`
  # is banned in the neutral tier), which is also what gives boundary rule 1 a
  # real failure mode.
  # `packages/core/src/config/catalog.ts` is touched here for one reason only: its
  # declared comment states the "UTC-only designation" as the rule, which this
  # phase falsifies. The `provider.budgets` branch is phase 4's and the watch
  # `maxAgeSeconds` key is phase 7's.
  #
  # Delivered assertions that MOVE (named, never deleted or loosened):
  #   - tests/structure/provider-peak-rules-schema.test.ts — TC-PAUSE-011's
  #     "a declared non-UTC zone literal is refused at validation" arm RETIRES:
  #     the grammar now accepts an IANA name and existence is decided at the edge.
  #     Its replacement refuses a malformed literal and a runtime-unknown zone.
  #   - tests/behaviour/peak-window-utc-clock.test.ts — TC-PAUSE-090's docblock
