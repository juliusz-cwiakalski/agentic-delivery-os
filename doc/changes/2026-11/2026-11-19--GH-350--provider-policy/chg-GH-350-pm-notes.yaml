  - text: "DoR iteration 1: NOT_READY with seven blocking findings — B1 the provider
      family is not mounted in the composed program (so
      resolve/quota/parks/profile/watch and the two new members are unreachable
      from the installed binary and every AC that claims an operator surface is
      false while tests stay green); B2 the budget gate's work-item ref source
      is unspecified; B3 phases 1-2 omit files they must edit
      (evidence-allowlist fixtures, contracts barrel, ambient-globals check,
      provider-parks golden, content inventory); B4 `documentedRows` after the
      change is 167, not 166 (the 163-to-166 figure is the page's delivered-rows
      metric); B5 evidence-count oracles are miscounted and AC-F2-3's paid-entry
      clause contradicts F-2; B6 three false current-state claims (one shared
      boundary function, provider already in the coverage inventory,
      cli-command-registry in the closed page set); B7 TC-ZONE-008's structural
      oracle is unsatisfiable because the boundary functions return
      seconds-of-day, not instants. Reopened: specification, test_planning,
      delivery_planning."
    type: blocker
    date: "2026-11-19"
