  - text: "GH-350 plan phase 7 (delivery) complete: each watch target's
      provider.profiles.watch.<name>.maxAgeSeconds is a positive integer with
      the effective default 900 applied policy-side (the catalog declares the
      key with no default field, so an omitted bound gives a record child no
      defaults-layer origin), and the freshness predicate is one pure function
      of the injected clock and the supplied observation instant — ageSeconds
      = max(0, floor((nowMs - observedAtMs) / 1000)), stale exactly at
      ageSeconds >= maxAgeSeconds. The watch view's condition is the closed
      six-value PROVIDER_WATCH_CONDITIONS domain and gains the three additive
      fields observedAt, ageSeconds and maxAgeSeconds beside the delivered
      name, source and checkedAt; watch-stale is watch-only (membership of no
      park cause, condition kind, skip reason, announcement code or record
      kind) and a stale reading is never probed, never coerced to clear and
      never reported as provider-outage. A park derived from a reading expires
      no later than min(naturalExpiry, observedAt + maxAgeSeconds * 1000) and
      no park exists when that instant is not strictly future
      (clampWatchParkExpiry returns undefined). The live composition supplies
      the read instant as the observation instant (observedAt === checkedAt,
      age 0, never stale); staleness is exercised by a composition-supplied
      observation through the new watchObservedAtMs seam and by the clamp. The
      watch path adds no cache, timer, refresher, scheduler, command, state
      record kind or state write; the config-layer page gains its
      maxAgeSeconds row and doc-conformance pins it. Commit eebb04d4.
