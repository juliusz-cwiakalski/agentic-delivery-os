decisions:
  - text: "ADR-0012 — Peak windows admit `UTC` (default, alias of Etc/UTC) plus IANA
      zone names resolved only at a composition edge through one injected
      `ProviderZonePort`; the pure core receives offset facts and never reads
      Intl/TZ. Windows stay non-crossing local seconds-of-day; DST resolves to
      the earliest instant at or after the declared local end, with expiry
      fixed-point iteration capped at 3 passes. New error
      `provider.peak.zone-unknown` (user, exit 1); new evidence field
      `timezone`; `PROVIDER_PEAK_TIMEZONES` retired;
      `packages/adapters/src/time-zone/` hosts `createIntlZonePort`. Causes,
      codes and skip reasons unchanged."
    date: "2026-11-19"
  - text: "TDR-0049 — Budgets gate before spend through a pure `evaluateBudgets`
      over one injected read-only `ProviderSpendTotalsPort` implemented at the
      edge from the delivered spend fold; no persisted counter and no new state
      kind. `window` scope parks with an honest expiry (`newestAtMs +
      windowSeconds*1000`); `ticket` scope is a terminal classified refusal
      because no honest future expiry exists. Config branch
      `provider.budgets.<name>.{enabled,scope,basis,ceiling,windowSeconds,entri\
      es}`. New condition kind, park cause and skip reason `budget-exhausted`;
      announcements `provider.budget.parked` (info) and
      `provider.budget.crossed` (warning); error `provider.budget.exceeded`
      (user, exit 1). No new alarm kind: metrics burn-rate stays the post-hoc
      alarm."
    date: "2026-11-19"
  - text: "PDR-0006 — 'Per-project overrides' is satisfied by the delivered
      project-committed and project-local configuration layers; the project
      identity for M4-S4 is the repository checkout. No `provider.projects.*`
      branch, key, state kind or error identity. The spec must state the
      precedence matrix for a descriptor, chain, profile, watch target and
      budget, project-local-beats-committed, origin strings, invalid repo-layer
      refusal, and the CI=true case. Multi-checkout shared policy remains
      M4-S5."
    date: "2026-11-19"
  - text: "TDR-0050 — `provider simulate --fixture <path> [--json]` composes the
      delivered `createProviderEngine` with fixture seams and calls `resolve`
      with `persist: false`. Fixture schema `delivery.provider.simulate.v1`
      (now, chain?, profile?, credentials resolved|missing, quota
      httpStatus/body or transport outage, spend telemetryState+points, zones
      step table); unknown keys refuse. `data` is the delivered resolve payload
      plus one additive `simulation` block with `stateWrites: 0`. No
      `--chain`/`--profile` flags and no `provider.simulate.*` error row;
      fixture defects reuse `input.value.rejected`. Parity with `resolve` is a
      test."
    date: "2026-11-19"
  - text: "TDR-0051 — Legacy migration is `provider migrate legacy [--profiles-dir
      <dir>] [--hook <path>] [--write] [--json]`. Legacy
      `~/.<priorWorkingName>/config/profiles/*.sh` and the hook are parsed as
      data under an assignment-only subset and never executed, sourced,
      word-split or shelled out. Default output is a validated proposal on
      stdout; `--write` creates the project-committed document only when absent.
      Typed whole-run refusal `provider.migrate.refused` with closed reasons
      `no-source`, `unreadable-source`, `oversized-source`, `shell-construct`,
      `dynamic-value`, `target-exists`, `proposal-invalid`. Credential-shaped
      names classify name-first and the value is discarded at the parse
      boundary; unmapped recognised names are disclosed by name and omitted."
    date: "2026-11-19"
  - text: "TDR-0052 — Watch freshness is per-target
      `provider.profiles.watch.<name>.maxAgeSeconds` (positive integer, default
      900) with predicate `ageSeconds >= maxAgeSeconds` and a closed watch-only
      condition `watch-stale`, distinct from `provider-outage`. Watch-derived
      parks clamp to `observedAt + maxAgeSeconds`; an already-stale observation
      creates no park. Additive view fields `observedAt`, `ageSeconds`,
      `maxAgeSeconds`; no new park cause, skip reason, announcement, error,
      command, cache or quota freshness key."
    date: "2026-11-19"
  - text: "Advisor-scoped deliverables for this change: zone-aware peaks, budget
      gate + alarms, per-project override clause, `provider simulate`, `provider
      migrate legacy`, watch staleness, and the no-shell-hook delivery evidence.
      Already delivered and not re-built: chain resolution, peak/quota
      conditions and parks, profiles/pacing/env record, spend attribution with
      amplification, metrics burn-rate alarm."
    date: "2026-11-19"
