findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/mcp/src/commands/verify-artifact.ts:64
    message: >-
      A thrown error from a runtime read (readPmNotes/readRegistry at verify-artifact.ts:64,74 and
      gate-report.ts:195-198) is not contained: runVerifyArtifactTool and runGateReportTool have no
      try/catch, so callTool rejects instead of returning a classified failure. Verified empirically
      (probe: readPmNotes throwing rejects with the raw error). In the serve process the rejection
      propagates through runProtocol to the exported serve promise and crashes the server via
      unhandled rejection with exit 1 - colliding with the configuration-error lifecycle meaning and
      violating G-5/AC-F5-3 ("a failed tool call never terminates the server"). This is asymmetric
      within the surface (runStatusTool contains at status.ts:95-99 via failureFromValue) and against
      the CLI, whose runCli contains every thrown value (packages/cli/src/index.ts:339-351,
      failureOutcome(classifyThrown(thrown))). The exported createToolset seam is a public contract
      whose callTool is declared Promise<McpToolResult>.
    suggestion: >-
      Wrap the toolset dispatch (toolset.ts dispatch, single site) or each of the two handlers in
      try/catch returning failureFromValue(thrown), mirroring runStatusTool. Add throwing-runtime
      parity cases for verify-artifact and gate-report (mirror of the status-containment case)
      asserting deep equality with the CLI fallback.internal error, and a lifecycle row proving the
      server keeps serving after a thrown read. Adapters are largely total today, so reachability is
      low, but the containment layer is the runCli analogue the surface is missing.
    suppressed: false
  - id: F-2
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/mcp/src/serve.ts:109
    message: >-
      The serve composition hardwires readProviderParks to {ok:false, reason:"state-unreadable",
      failureCode:"state.store.unknown"} even though it composes a working state store (serve.ts:234)
      that verify-artifact and gate-report read successfully in the same session. The CLI composes
      real parks from the store (packages/cli/src/edge.ts:1370-1376 via readProviderParkViews). The
      digest therefore reports a falsely degraded parks section - contradicting the spec's truthful
      section principle (F-2: "a degraded or unavailable section is truthful digest content") and
      spec 8.4 ("same bounded-read ... rules as the CLI"), deviating from plan task 3.4 ("same read
      paths ... exactly as the cli edge composes them"). Parks is local state, not a
      credential-backed provider read, so the GAP-T1 hermetic-smoke justification does not cover it.
      The drift is also unrecorded (UQ-7 requires a recorded reason), and the feature doc's
      composition inventory omits parks from both the wired and the unavailable lists. Root cause:
      readProviderParkViews is exported from @delivery-os/core/provider, which mcp's declared
      workspaceImports ([., ./contracts, ./state, ./branding]) exclude.
    suggestion: >-
      Preferred: add "./provider" to packages/mcp/package.json workspaceImports (with any pin-test
      registration) and compose readProviderParks from the already-built store exactly as the CLI
      edge does. Alternative if boundary churn is rejected: keep local-only composition but return a
      truthful not-configured reason instead of state.store.unknown, and record the UQ-7 drift reason
      in the feature spec page and the execution log. Either way the feature doc's composition
      inventory must list parks (and provider config) explicitly.
    suppressed: false
  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: packages/mcp/src/output/protocol.ts:117
    message: >-
      A valid JSON frame that is not a JSON-RPC 2.0 object - including a JSON-RPC batch array - is
      classified as a transport fault and exits the process with code 2 (verified empirically: batch
      frame after handshake -> exit 2, "malformed JSON-RPC frame" on stderr). GAP-T3 pins only
      malformed JSON as the fault trigger; extending the fault class to valid-JSON frame-shape
      violations makes a recoverable client mistake fatal while an unknown method keeps serving,
      which is asymmetric, and a host SDK that emits one batch frame kills the session with a
      misleading diagnosis.
    suggestion: >-
      For frames that parse as JSON but are not jsonrpc-2.0 objects, answer -32600 Invalid Request
      (id null) and keep serving; reserve the transport-fault exit 2 for unparseable bytes. Add a
      protocol-suite row pinning the chosen behavior so it is deliberate.
    suppressed: false
