  - id: F-3
    severity: high
    severity_label: major
    confidence: high
    category: contracts
    location: doc/planning/oss-tooling/milestones/m2/commands/queue.md:12
    message: >-
      The page introduces `queue release <ref> --reason <...>` and `queue dep
      add|remove`, but the delivered M1 grammar is `queue release <ref>
      [--holder <id>] [--park <cause>] [--until <iso>]` (a lease release; the
      entry stays, optionally parked) and `queue dep <ref> <on-ref>` (add only).
      Semantics also disagree inside the pack: queue.md:25 says release "returns
      an entry to the queue's hold set", contracts.md:105 says "A queue entry
      leaves with a reason: landed, abandoned, superseded, or reconciled", and
      SC-M2-S15-01 requires that after closeout "the ref's queue entry is gone
      without manual action" with the `landed` reason. A delivery agent cannot
      implement S15 from that without choosing one reading, and `dep add|remove`
      makes the delivered two-positional `queue dep` form ambiguous.
    suggestion: >-
      State that M2 keeps `queue release` as the delivered lease-release verb
      and adds `--reason`, introduce a distinct verb (or a named removal mode)
      for taking an entry out of the queue, and define `queue dep add|remove` as
      an explicit grammar extension of `queue dep <ref> <on-ref>`; then align
      contracts.md's release/removal paragraph and SC-M2-S15-01 with the chosen
      split.
    suppressed: false
