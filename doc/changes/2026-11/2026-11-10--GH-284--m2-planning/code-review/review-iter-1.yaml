      `owner-hold`, but the delivered code already carries three vocabularies:
      the closed queue park-cause set `provider-window | provider-quota |
      preempted-for-close-item` projected as `parked:<cause>`
      (packages/core/src/contracts/queue.ts:113-119), `peak-window` as a
      provider condition kind and provider park cause
      (packages/core/src/contracts/provider.ts:15-50), and `owner-hold` as a
      queue lane idle reason plus the owner-hold marker (queue.ts:252,
      contracts/owner-hold.ts). S17 AC2 (owner-hard) requires the lane to be
      "marked parked with reason `peak-window`", so the pack has to reconcile
      the three; as written an implementer will either add a duplicate cause or
      silently rename `provider-window`, and `lanes` projects reasons from the
      closed cause set.
    suggestion: >-
      Add one mapping paragraph that names the delivered enums and states which
      set gains which value (for example: `peak-window` becomes a queue park
      cause whose condition type is the existing `provider-window`; `owner-hold`
      becomes a park cause alongside today's idle reason), and record the
      consequence for `lanes`' `parked:<cause>` projection.
    suppressed: false
