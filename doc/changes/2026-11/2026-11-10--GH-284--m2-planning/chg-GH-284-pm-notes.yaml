      pages (NFR-3), byte-identical status.md history (NFR-7), and 0 product
      files changed outside doc/planning (NFR-1)."
    type: "info"
    date: "2026-11-10"
  - text: "Spec-side fact corrections against my clarify-scope brief (recorded
      because they change the delivery surface): the M1 command pack holds 28
      pages, not 25, and the status-contradiction set is 15 pages — 9 say `M1
      planned` for a delivered story, 2 say `M1 milestone planned` (plan.md,
      commit.md), 2 attribute a delivered extension as proposed
      (verify-gates.md, closeout.md), plus daemon.md and entrypoint.md. Fourteen
      pages get a status-header-only edit and entrypoint.md one sentence, which
      is why the containment AC splits (AC-F5-4)."
    type: "info"
    date: "2026-11-10"
  - text: "Spec-side scope call I accept: the entrypoint.md composition drift (it
      claims `dispatch` is not registered while root help lists it, and
      `coordinator` is not mentioned at all) is corrected in this change rather
      than deferred, on the reasoning that it is the same delivered-reality
      class as the status headers. Risk accepted: it turns a header-only
      containment story into a 14+1 shape; the mitigation is a one-sentence
      bound with byte identity everywhere else (NFR-3)."
    type: "decision"
    date: "2026-11-10"
  - text: "RETRO (specification): I briefed the spec-writer that 'a mermaid
      validation gate exists from GH-110'. That was wrong — it came from a
      leftover local branch name (feat/GH-110/doc-mermaid-validation-ci-gate),
      not from repository truth. A branch name is not evidence of a delivered
      gate. The spec turned it into NFR-6 plus AC-NFR6-1, which no command in
      this repo can execute. Caught by checking .github/workflows and
      scripts/checks before test planning, and fixed by reopening specification
      (DEC-15 in spec v1.1): mermaid validity is now a self-contained grep/awk
      structural check. Improvement: never assert the existence of a gate,
      script, or workflow from a branch name or a memory of a ticket — grep the
      workflows and checks directories first, and mark the claim as unverified
      if not checked."
    type: "retro"
    date: "2026-11-10"
  - text: "Specification re-completed at v1.1 (reopen_count 1): DEC-15 replaces the
      non-existent mermaid validator with a five-condition structural diagram
      check (fence count >= 10, diagram-keyword opening line, balanced fences
      per file, C4 L1/L2/L3 plus named flow headings, 3+6+1 inventory) and adds
      Appendix E with an executable bash/awk procedure. AC count stays 37; no
      other requirement changed."
    type: "info"
    date: "2026-11-10"
  - text: "Test planning complete: chg-GH-284-test-plan.md v1.0 — 37 TCs
      (TC-M2PLAN-001..037) covering 37/37 ACs exactly once, with 38 executable
      procedures (P00 setup + P01-P37 in AC order). Every procedure was executed
      against the pre-change tree and the observed verdicts are recorded: 21
      fail by detecting the absent change, 4 fail through their non-vacuity
      guards, 4 pair a failing half with a passing control, 6 are pure
      preservation controls that pass, 2 are mixed. Mutation self-tests prove
      the classifiers bite (a goal edit, a heading mutation, and a one-sentence
      entrypoint edit are each detected)."
    type: "info"
    date: "2026-11-10"
  - text: "QUALITY-GATE FACT for phase 9: `pnpm check` fails in this environment by
      default — ci-baseline-parity.test.ts uses `git clone --local`, whose
      hardlink path crosses into tmpfs /tmp, giving 7132 pass / 1 fail. With
      TMPDIR pointed at the repository filesystem it exits 0 (7133 pass). The
      failure is environmental, not a change regression; phase 9 must run the
      gate with a repo-local TMPDIR and record both runs. `bash
      scripts/.tests/test-doc-distribution.sh` exits 0 on the base (82 in-scope
      docs, planning_markers=0)."
    type: "info"
    date: "2026-11-10"
  - text: "Cross-artifact defect found by the plan-writer and fixed upstream rather
      than absorbed: spec v1.1 required 'exactly one sentence' to differ in
      entrypoint.md, but the page's drift spans two adjacent sentences (the
      enumeration omits dispatch/coordinator; the not-registered sentence
      wrongly lists dispatch) — and spec v1.1 simultaneously demanded
      byte-identical dated status.md sections while requiring pointer text
      appended inside three of them. Both were unsatisfiable. Reopened
      specification (v1.2, DEC-16): the entrypoint bound is one contiguous hunk
      over at most two adjacent sentences with the two statements kept separate,
      and status.md acceptance is a line-retention oracle (zero
      removed/reordered/modified lines plus an addition whitelist) with
      whole-section cmp explicitly forbidden."
    type: "decision"
    date: "2026-11-10"
  - text: "RETRO (delivery planning): the plan-writer caught four defects the two
      upstream authors and I all missed — an empty insertion window (P03), an
      unusable ERE alternation with a literal pipe (P16), and the two mechanism
      contradictions above. Pattern: each artifact was internally coherent, and
      the defects only surfaced when a consumer had to execute the prose as a
      procedure against the real tree. Improvement: for docs changes whose ACs
      are diff predicates, have the test-plan author derive every window and
      offset from an executed command on the base tree (P03's window was
      arithmetic, not observation), and have the plan-writer cross-check the
      previous artifacts' oracles by running them before writing gates — which
      is exactly what worked here."
    type: "retro"
    date: "2026-11-10"
  - text: "Test plan re-completed at v1.1 (reopen_count 1): P03 derives the
      insertion window from the base snapshot's M2-S9 end to the head's Epic M3
      line minus one; P16 uses a real alternation and forbids a literal pipe;
      P15/P30 implement the two-sentence entrypoint bound with 16-family
      enumeration and separation assertions; P18/P34 implement the retention
      oracle with a four-window addition whitelist. Coverage unchanged at 37 TCs
      / 37 procedures / 37/37 ACs; TC-014 and TC-017 reworded to match v1.2 and
      gaps G-6/G-8 adjusted."
    type: "info"
    date: "2026-11-10"
  - text: "Round 3 cross-check (plan-writer, verified against the artifacts) found
      three more procedure defects and one specification gap. Fixed as spec v1.3
      (DEC-17) plus test plan v1.2: (a) the backlog insertion position was
      ambiguous — the Epic M2 block closes with a `---` separator, so inserting
      'before the Epic M3 heading' would strand the separator between M2-S9 and
      M2-S11; the spec now pins insertion inside the block before the separator
      and the test plan asserts the separator sequence is identical and fails a
      below-separator insertion; (b) P18's pointer windows were head-anchored,
      so an appended pointer became the anchor and moved its own window past
      itself (2/4 reachable, bad_runs=2) — now base-anchored and verified
      against a reference-shaped head fixture at 4/4/0; (c) P34 computed `sed`
      line address 0 for the title group, which GNU sed rejects, capping the
      count at 3/4 — now clamped and stderr-checked."
    type: "info"
    date: "2026-11-10"
  - text: "RETRO (second occurrence of the same class): three rounds of artifact
      churn, all from executing predicates that were written as prose first. The
      spec is now v1.3, the test plan v1.2, and the plan v1.1 — each round cost
      a reopen plus a re-delegation. The single highest-leverage change would
      have been to have the test-plan author *derive every offset and window
      from an executed command on the base tree in round 1* (the P03 window was
      arithmetic; the P18 anchor was assumed rather than built and run).
      Recorded so the readiness review sees the process cost, not just the fixed
      defects."
    type: "retro"
    date: "2026-11-10"
