  - text: "RETRO (delivery planning): the plan-writer caught four defects the two
      upstream authors and I all missed — an empty insertion window (P03), an
      unusable ERE alternation with a literal pipe (P16), and the two mechanism
      contradictions above. Pattern: each artifact was internally coherent, and
      the defects only surfaced when a consumer had to execute the prose as a
      procedure against the real tree. Improvement: for docs changes whose ACs
      are diff predicates, have the test-plan author derive every window and
      offset from an executed command on the base tree (P03's window was
      arithmetic, not observation), and have the plan-writer cross-check the
      previous artifacts' oracles by running them before writing gates — which
      is exactly what worked here."
    type: "retro"
