  - text: "Specification complete: chg-GH-284-spec.md v1.0 (status Proposed, type
      docs, risk medium) — 11 functional capabilities, 10 NFRs, 4 data-model
      elements, 14 decisions, 10 risks, 37 ACs (27 functional, 10 NFR), 0 open
