  - text: "RETRO (specification): I briefed the spec-writer that 'a mermaid
      validation gate exists from GH-110'. That was wrong — it came from a
      leftover local branch name (feat/GH-110/doc-mermaid-validation-ci-gate),
      not from repository truth. A branch name is not evidence of a delivered
      gate. The spec turned it into NFR-6 plus AC-NFR6-1, which no command in
      this repo can execute. Caught by checking .github/workflows and
      scripts/checks before test planning, and fixed by reopening specification
      (DEC-15 in spec v1.1): mermaid validity is now a self-contained grep/awk
      structural check. Improvement: never assert the existence of a gate,
      script, or workflow from a branch name or a memory of a ticket — grep the
      workflows and checks directories first, and mark the claim as unverified
      if not checked."
    type: "retro"
    date: "2026-11-10"
