  - text: "PM decision (M2-S17 in backlog): the Acceptance section names
      'M2-S11..S16', but the ticket also carries a normative 'M2-S17
      Provider-aware peak pausing (owner-hard requirement)' section with story
      text, ACs, dependencies, and blueprint additions. The explicit story
      section governs; backlog.md gains M2-S11 through M2-S17, and the
      Acceptance line is read as shorthand for the add-stories set, not as an
      exclusion."
    date: "2026-11-10"
  - text: "PM decision (daemon command wiring): verification shows
      `createDaemonCommandDefinition` is composed into the CLI edge
      (packages/cli/src/edge.ts:3574-3576) only when `options.daemon` is
      supplied, and the production entrypoint does not supply it — root `--help`
      omits `daemon`, `daemon --help` fails with `unknown flag \"--help\"`,
      `daemon status` fails with `unexpected argument \"status\"`. The ticket's
      claim is accurate. Chosen resolution: correct the page (docs-only change);
      wiring the command is product work outside this ticket's scope and gets
      attributed to the M2 man-page/entrypoint delta note rather than to an
      invented story."
    date: "2026-11-10"
  - text: "PM decision (header reconciliation breadth): the ticket names four stale
      pages (doctor M1-S3, board M1-S5, mcp M1-S7, state M1-S2). A read of all
      25 m1 command pages shows the same 'M1 planned' drift on merge.md (M1-S4),
      verify-deploy.md (M1-S4), watchdog.md (M1-S1), blockers.md (M1-S16), and
      retro.md (M1-S8). Acceptance says 'Contract doc headers reconciled with
      delivered reality', so reconciliation covers every page whose Status
      contradicts a delivered M1 story, not only the four examples. Pages that
      stay planned are re-pointed at their M2/M3 story."
    date: "2026-11-10"
  - text: "PM decision (status.md history handling): follow the GH-266 precedent —
      the existing dated sections are historical records and are not rewritten;
      a new dated section records M1 delivery (23/23) and the M2 planning state,
      and the superseded forward-looking statements get explicit pointers."
    date: "2026-11-10"
  - text: "PM decision (doc distribution marker): doc/planning/** is outside the
      closed scan set of scripts/.tests/test-doc-distribution.sh and no existing
      M1 pack document carries an `ados_distribution` marker, so the new M2 pack
      documents follow the pack convention and add no marker. The AGENTS.md
