    - "A command page lacks Status: Proposed (M2) on line 3, the <binary> prefix, or a required man-page section (P24, P25)"
    - "A commercial, hosted, or proprietary provider name appears in the pack (NFR-9, XF-5)"
    - "The doc-distribution guard, the forbidden-literal guard, the structural diagram check, or the authoritative pnpm check is non-zero (P31, P32, P33, P36)"
    - "The spec or test plan moves past v1.3 / v1.2 while this plan still points at them: re-read the reopened procedures, re-run P03/P18/P34 against the new derivation, and revise this plan rather than mixing revisions"
