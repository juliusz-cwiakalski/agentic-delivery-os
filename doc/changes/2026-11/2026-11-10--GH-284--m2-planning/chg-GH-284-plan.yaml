#       `bad_runs=1` with `section_lines=0` (verified).
#   D-9 P16 prose constraint (XF-2): state M1 delivery as "23 of 23" and never
#       write the literal phrase "23 of 23|23/23", which P16 now checks with
#       `literal_pipe=ABSENT`.
#   D-10 Pack conventions: exactly twelve files (no extras), line 1 `# <name>(1)`
#       in commands/, line 3 exactly `Status: Proposed (M2)`, `<binary>`
#       invocation prefix, bare command names, no `ados_distribution` marker,
#       no line matching `^- AC:` and no `**Given**` in pack prose (P37), no
#       commercial provider names (XF-5), and every relative link resolved from
#       that file's own directory depth.
#   D-11 Gate order: P28 -> P31 -> P32 -> P36 first (cheap containment and
#       guards), then the content procedures, per test plan §7.1. A phase
#       commits only when its own gate list is green at that phase's HEAD.
#   D-12 Environment: `pnpm check` fails by DEFAULT in this checkout because
#       tests/checks/ci-baseline-parity.test.ts uses `git clone --local` and
#       /tmp is tmpfs, giving 7132 pass / 1 fail. The authoritative run points
#       TMPDIR at the repository filesystem and gives 7133 pass, exit 0. Both
#       runs are recorded; the default failure is environmental, is not a
#       regression, and must NOT be "fixed" (scripts/** and tests/** are out
#       of scope).
#   D-13 Retention gate (XF-7, NFR-7, DEC-16). P18 is the single
#       retention-and-whitelist oracle: whole-file line retention plus the
#       addition whitelist (the new dated section and the four pointer
#       insertions), with its reference-head fixture as the built-in
#       positive control. P34 re-runs the same oracle and adds the four-group
#       pointer count. The plan adds no compensating check of its own; a
#       `pointer_runs<4`, `bad_runs>0`, `removed_lines>0`, or
