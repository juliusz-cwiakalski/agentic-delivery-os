schemaVersion: delivery.plan.v1
workItemRef: GH-284
tier:
  name: lite
  phases: [1, 2, 3, 4, 5, 6]
  escalationTriggers:
    - "A product path outside doc/planning/oss-tooling/ appears in the diff with doc/changes/** excluded (P28)"
