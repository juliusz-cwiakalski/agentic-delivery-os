#
# Delivery-planning decisions (placement, wording, sequencing; no behavioural
# deviation):
#   D-1 Ceremony: tier `lite`, six delivery phases, standard weight,
#       repo:main-tools lease. Docs-only work needs no planning phase; the six
#       phases are the review unit and each is independently committable.
#   D-2 No test code. Every verification is one of the test plan's
#       uncommitted procedures, materialised by copy under
#       /tmp/gh284/procedures/, never retyped and never committed: NFR-1
#       forbids tests/** and scripts/**, and a branch-diff check belongs to
#       review gates, not the permanent suite.
#   D-3 TC/AC ownership as tabulated above; each phase gate list proves only
