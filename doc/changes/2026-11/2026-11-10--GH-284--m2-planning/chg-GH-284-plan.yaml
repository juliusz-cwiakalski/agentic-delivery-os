#       the Epic M2 block, immediately after M2-S9's last content line
#       (`- Depends on: M2-S8.`, base 1166) and before the block-closing blank
#       line (base 1167) and the `---` separator (base 1168), so the first
#       inserted line carries base line 1167 and P03's window admits it. The
#       `---` line, the blank line after it, and the `## Epic M3` heading stay
#       byte-identical and follow the inserted block. Never insert below the
#       separator: AC-F1-3 and AC-F4-1 make that non-conforming and P03 reports
#       `separator_sequence=CHANGED` or an OUTSIDE hunk. One blank line between
#       entries; the file's two-space continuation indent; no `- Ticket:` line;
#       no reflow of a neighbouring entry.
#   D-5 M2-S6 wording. The story's existing task text already contains the
#       seed token inside "`ados spend`"; those bytes are frozen. The new task
#       clause must describe consuming M2-S14 telemetry for per-agent and
#       per-model facts WITHOUT adding a seed literal, because P36 scans added
