        file itself as `README.md` in that table so the manifest lists twelve
        entries, state the planned-until-exit status semantics and the
        `Status: Proposed (M2)` convention, and carry a story-to-artifact map
        covering M2-S2 through M2-S17 that points each story at its
        architecture flow, contract surface, and scenario ids. Link
        `../README.md` and `../../backlog.md`. Reference story codes; never
        restate an acceptance block. [F-8, DM-3, DEC-7; AC-F8-1;
        TC-M2PLAN-019]
      - |-
        4.2 architecture.md: the M2 end state. Exactly three C4 headings
        (`## C4 Level 1`, `## C4 Level 2`, `## C4 Level 3`), each followed by a
        mermaid `flowchart`; six named flow sections, one each for
        multi-repository overview, attempt-history inspection and divergence
        resolution, telemetry attribution, queue auto-release after merge and
        closeout, single-flight refusal across dispatch paths, and
        handover-gate evaluation; one park/resume section for S17; one
        persistence-and-concurrency-deltas section; and a closing
        boundary-invariants section at M2 exit. Ten mermaid fences in this file
        (3 C4 + 6 flows + 1 park/resume), each with the diagram keyword
        (`flowchart`, `graph`, `sequenceDiagram`, `classDiagram`, or
        `stateDiagram-v2`) as its first body line, every fence closed. Use the
        exact flow vocabulary P20/P33 match (case-insensitive): `Multi-repository`,
        `divergence`, `Telemetry attribution`, `auto-release`, `single-flight`,
        `handover-gate`, `park`. No other heading may repeat a flow token or the
        word `park`, because P20/P33 count exactly 3 C4, 6 flows, and 1 park
        heading across the whole pack. [F-8, NFR-6; AC-F8-2, AC-NFR6-1;
        TC-M2PLAN-020, TC-M2PLAN-033]
      - |-
        4.3 contracts.md: shared contract continuity plus `projects.v1`,
        `attempts.v1`, event taxonomy v1 (topics `queue.graph`,
        `dispatch.attempt`, `phase.state`, `blockers.state`; event kinds;
        payload shapes; ordering guarantees; the slow-consumer
        overflow-to-repoll rule), `telemetry.v1` (ticket, repository, lane,
        agent role, model, phase timing; reconciliation tolerance), queue
        lifecycle mutations (release and remove reasons, dependency edges,
        single-flight per ref), and `spend` v2 breakdown fields. Add the S17
        surfaces: the provider profile field on admission, lane, and attempt
        records; the peak-window rule schema per profile (windows,
        multipliers, buffers); the park-reason vocabulary containing
        `peak-window` and `owner-hold` with until timestamps; and the resume
        event shapes. [F-8, DEC-10; AC-F8-3; TC-M2PLAN-021]
      - |-
        4.4 test-scenarios.md: at least 32 scenarios, at least two per story for
        every story M2-S2 through M2-S17, as `### SC-M2-S11-01 <title>`-shaped
        headings where the second segment is the owning story code and the
        third is a two-digit ordinal (the story code in the heading so each
        scenario is attributable without reading the body), each with a
        Given/When/Then body that names invocations and observable results. Cover the seven
        mandatory scenarios (same-ref two-repo collision safety, divergence
        resolution in local-evidence mode, subscribe topic contract compliance,
        telemetry reconciliation within tolerance, auto-release after closeout,
        single-flight refusal naming the holder, handover evaluation reporting
        per condition) and the five S17 scenarios (park at peak start per
        profile, other-provider isolation, resume at window end without state
        loss, zero-spend assertion, daemon-absent degradation). Use those
        phrasings, not synonyms. Do not use `**Given**` markers and do not open
        a line with `- AC:`; reference story codes instead of restating them.
        [F-8, DEC-10, NFR-10; AC-F8-4; TC-M2PLAN-022]
      - |-
        4.5 journeys.md: five `##` journeys with headings that name
        multi-repo morning overview, inspecting evidence before a handover
        decision, a retro grounded in telemetry, steering a running delivery,
        and the S17 cost-control journey. The cost-control journey shows a peak
        window parking one profile's lane while another provider's lane keeps
        running, both visible, with automatic resume, and mentions `resume` and
        `other provider`. Use neutral profile labels (D-10, XF-5): no
        commercial, hosted, or proprietary provider name appears. [F-8, NFR-9;
        AC-F8-5; TC-M2PLAN-023]
      - |-
        4.6 entrypoint-delta.md: the root-entry delta, not a restated man page.
        Record the observed composition (the sixteen families including
        `dispatch` and `coordinator`; `state`, `mcp`, and `daemon` absent), the
        three observed invocations with their outputs and `exit 1`
        (`unknown flag "--help"`, `unexpected argument "status"`), the
        M2-planned additions (`projects`, `attempts` under `dispatch`, `events`
        under the subscribe surface, `spend` v2, queue lifecycle verbs, the full
        `board`), the daemon registration gap with the statement that wiring is
        product work outside this change, and a pointer sentence to
        `../m1/commands/entrypoint.md`. [F-10, DEC-2, DEC-12; AC-F10-1;
        TC-M2PLAN-026]
      - |-
        4.7 commands/{projects,attempts,events,spend,queue,board}.md: one
        man-page-style contract each. Line 1 is `# <name>(1)`, line 3 is
        exactly `Status: Proposed (M2)`, and the page uses `<binary>` as the
        invocation prefix with a bare command name and no working name. Each
        page carries SYNOPSIS, OPTIONS, OUTPUT (text digest plus the machine
        `envelope`), EXIT STATUS, EXAMPLES, ERRORS (an error table), and SEE
        ALSO sections, plus at least one invocation example. `attempts` is
        presented as a `dispatch` subfamily and `events` as the subscribe
        taxonomy reference. Resolve every relative link from
        `milestones/m2/commands/` (three levels up to `oss-tooling/`).
        [F-9, DEC-14, NFR-10; AC-F9-1, AC-F9-2; TC-M2PLAN-024, 025]
      - |-
        4.8 Pack invariants. Exactly twelve files under `milestones/m2/` and no
        extra file. No `ados_distribution` marker in any pack document. No line
        matching `^- AC:` and no `**Given**` token anywhere in the pack. No
        seed literal (`ados`, `ADOS_`, `~/.ados`) and no private, fleet,
        repository, or product name. Every relative link resolves; every
        `](target)` has no parenthesis in the target. [NFR-9, NFR-10, NFR-6;
        AC-NFR6-1, AC-F8-1; TC-M2PLAN-019, 033]
    coverage:
