# GH-284 implementation plan — plan M2: engine-first operations, multi-repo
# workstations, evidence inspection, and telemetry
#
# Plan revision: v1.0 (2026-11-10). Aligned to spec v1.1 and test plan v1.0.
#
# Sources (single source of truth):
#   - Spec: ./chg-GH-284-spec.md v1.1 — F-1..F-11, NFR-1..NFR-10, DM-1..DM-4,
#     DEC-1..DEC-15, RSK-1..RSK-10, 37 ACs (§17.1 + §17.2), §17.3 DoD,
#     Appendix B (14 reconciled pages + entrypoint), Appendix C (observed
#     entrypoint), Appendix D (12-document pack manifest), Appendix E
#     (structural diagram procedure).
#   - Test plan: ./chg-GH-284-test-plan.md v1.0 — 37 TCs TC-M2PLAN-001..037,
#     procedures P00..P37 in §7.1, §7.2 TC->procedure map, §7.3 failure
#     triage, §1.2 declared gaps G-1..G-9, §6 base revision and environment.
#   - PM notes: ./chg-GH-284-pm-notes.yaml — binding decisions, the
#     specification reopen that produced v1.1 (DEC-15), and the phase-9
#     quality-gate environment fact.
#   - Ticket: juliusz-cwiakalski/agentic-delivery-os#284 — normative story
#     text for S11..S17, the two amendments, and the pack brief.
#   - Base revision: fab46636cc0b5abfbd22257711f594adc0af4660
#     (= origin/main-tools). Every preservation check compares against it.
#
# Change shape: docs-only, no runtime surface, no schema, no changeset.
# Product files are limited to doc/planning/oss-tooling/**. Any diff outside
# doc/planning/oss-tooling/** (excluding doc/changes/**) FAILS the change:
# zero files under packages/, tests/, scripts/, .opencode/, .ai/, or
# doc/spec/, and no root build/config file. doc/changes/** artifacts and
# review records are change evidence, not product change.
#
# Six delivery phases, one Conventional Commit each, in spec §18 order:
#   P1 backlog.md (7 stories + 2 amendments)      P4 milestones/m2/ (12 docs)
#   P2 m1 command headers (14) + entrypoint (1)   P5 milestones/README.md row
#   P3 status.md (1 section + 4 pointer groups)   P6 verification evidence
#
# This plan declares phases, scope, authoring instructions, gates, and
# invariants only; it records no progress. Phase state and completion markers
# live in chg-GH-284-pm-notes.yaml, never here.
#
# TC mapping (all 37, each exactly once):
#   P1: TC-M2PLAN-001..010, 029                     (11)
#   P2: TC-M2PLAN-011, 012, 013, 014, 015, 030      (6)
#   P3: TC-M2PLAN-016, 017, 018, 034                (4)
#   P4: TC-M2PLAN-019..026, 033                     (9)
#   P5: TC-M2PLAN-027                               (1)
#   P6: TC-M2PLAN-028, 031, 032, 035, 036, 037      (6)
# (11+6+4+9+1+6 = 37; set difference against 001..037 is empty.)
#
# AC coverage (37/37, each exactly once — TC<->AC is 1:1 in test plan §3.1):
#   P1 (11): AC-F1-1, AC-F1-2, AC-F1-3, AC-F2-1, AC-F2-2, AC-F2-3,
#            AC-F3-1, AC-F3-2, AC-F4-1, AC-F4-2, AC-NFR2-1
#   P2 (6):  AC-F5-1, AC-F5-2, AC-F5-3, AC-F5-4, AC-F6-1, AC-NFR3-1
#   P3 (4):  AC-F7-1, AC-F7-2, AC-F7-3, AC-NFR7-1
#   P4 (9):  AC-F8-1, AC-F8-2, AC-F8-3, AC-F8-4, AC-F8-5, AC-F9-1,
#            AC-F9-2, AC-F10-1, AC-NFR6-1
#   P5 (1):  AC-F11-1
#   P6 (6):  AC-NFR1-1, AC-NFR4-1, AC-NFR5-1, AC-NFR8-1, AC-NFR9-1,
#            AC-NFR10-1
# (11+6+4+9+1+6 = 37; set difference against the 27 functional plus 10
# non-functional ACs of spec §17.1/§17.2 is empty.) This block is the
# authoritative mapping; AC ids also appear in the findings and decisions
# below, where they are cross-references rather than phase mappings.
#
# Spec/test-plan cross-check (findings recorded, none silently smoothed):
#   F-1 [CONFLICT, resolved by the retention reading]. P18/P34 compare every
#       base `##` section with `cmp`, while P17 requires a 2026-11-10 pointer
#       (a) within four lines of the title, (b) within eight lines of the
#       "M1 delivery starts now and runs beside" statement, (c) inside the
#       2026-11-07 scheduling-engine section, and (d) within twelve lines of
#       each of items 1-3 of "Proposed next steps". Three of those groups live
#       inside base sections, so cmp-equality and those pointers cannot both
#       hold. Spec F-7 states both halves in one sentence ("keeps its bytes";
#       "pointers are appended adjacent to the statement"), and AC-F7-2 says
#       the groups "retain their original bytes" while carrying pointers. The
#       coherent reading is retention (no original line removed, reordered, or
#       modified), not absence of additions. Resolution D-8: every base section
#       keeps every original line, in order, byte for byte; pointer text is
#       additive only. Gate: P18/P34 run unmodified and are expected to report
#       cmp-identical for the four pointer-free sections (sections_identical=
#       4/7), and the P3 retention oracle reports removed_lines=0 for all seven.
#       A removal, reflow, or reorder anywhere fails P3. Escalation: if the PM
#       or the DoR gate rules for literal cmp-equality, AC-F7-2 becomes
#       undeliverable for three of four groups and the spec must be reopened;
#       stop rather than dropping pointers silently.
#   F-2 [TEST-PLAN DEFECT, plan-pinned correction]. P16's marker
#       `grep -Eiq '23 of 23\|23/23'` is not an alternation: in ERE `\|` is a
#       literal pipe, so the pattern matches only a literal
#       "23 of 23|23/23" and can never match prose. Resolution D-9: the new
#       section states M1 delivery as "23 of 23"; the intended alternation is
#       proven separately with `grep -Eiq '23 of 23|23/23'`. The other ten
#       P16 markers run unmodified. Writing the literal pipe into status.md is
#       forbidden. A test-plan v1.1 correction is recommended.
#   F-3 [WORDING PRECISION]. AC-F5-4 says "exactly one sentence in its
#       description differs"; the observed drift spans two ADJACENT sentences
#       (the composed list omits `dispatch` and `coordinator`; the absent list
#       wrongly includes `dispatch`), and both must change. Merging them into
#       one sentence would break P15: `comp` captures everything up to the
#       first period, so the absent families would fold into the composed set
#       and P15 would print `dispatch=claimed-not-registered (FAIL)`.
#       Resolution D-6: the composition statement is the two adjacent
#       sentences, edited as one contiguous hunk, and no other sentence or
#       byte of the page changes. Oracles: P14 entrypoint_hunks=1, P15
#       families/absent checks, P30 body_identical=14/14.
#   F-4 [SEQUENCING]. P2 lands the entrypoint/daemon pointer to
#       ../../m2/entrypoint-delta.md, which P4 creates. P37 (broken links) is
#       therefore a P6 gate, not a P2 gate; no broken link exists at the
#       change head. P2 must not add any other link.
#   F-5 [HYGIENE]. The ticket's S17 journey example names two commercial
#       providers. NFR-9 forbids hosted/proprietary names, so the pack uses
#       neutral profile labels (`profile-a`, `profile-b`) and no commercial
#       provider name appears anywhere in the pack.
#   F-6 [TEST-PLAN DEFECT, plan-pinned window]. P03 derives the insertion
#       window as `${s9end+1}:${m3-1}`, where `s9end` is the line before the
#       next `###`/`##` heading after M2-S9. The next heading IS `## Epic M3`
#       on the base tree and the first new `### M2-S11` heading on the head
#       tree, so the window collapses or inverts (base: `1170:1169`) and every
#       inserted line is reported OUTSIDE. Corrected executable derivation,
#       with r4/r6 unchanged and the start taken from the BASE snapshot:
#         s9last=$(awk 'index($0,"### M2-S9 ")==1{s=1;next}
#           s&&/^#{2,3} /{exit} s&&NF&&$0!="---"{last=NR}
#           END{print last}' /tmp/gh284/base-backlog.md)
#         newwin="$((s9last+1)):$((m3-1))"
#       Verified on the base tree: M2-S9 starts at 1154, its last content line
#       (`- Depends on: M2-S8.`) is 1165, Epic M3 is at 1170, so the window
#       starts at 1166 and ends one line before the head's Epic M3. An
#       insertion hunk there classifies INSIDE. A raw P03 run reports
#       `outside>=1`; record both outputs and treat the raw failure as the
#       declared defect, never as a backlog defect.
#
# Delivery-planning decisions (placement, wording, sequencing; no behavioural
# deviation):
#   D-1 Ceremony: tier `lite`, six delivery phases, standard weight,
#       repo:main-tools lease. Docs-only work needs no planning phase; the six
#       phases are the review unit and each is independently committable.
#   D-2 No test code. Every verification is one of the test plan's
#       uncommitted procedures, materialised by copy under
#       /tmp/gh284/procedures/, never retyped and never committed: NFR-1
#       forbids tests/** and scripts/**, and a branch-diff check belongs to
#       review gates, not the permanent suite.
#   D-3 TC/AC ownership as tabulated above; each phase gate list proves only
#       its own phases' TCs, and P6 re-runs the content procedures as
#       regression proof without re-claiming their TCs.
#   D-4 Backlog insertion point: after M2-S9's `- Depends on: M2-S8.` line and
#       before the blank line that precedes `---` and `## Epic M3`; one blank
#       line between entries; the file's two-space continuation indent; no
#       `- Ticket:` line; no reflow of a neighbouring entry.
#   D-5 M2-S6 wording. The story's existing task text already contains the
#       seed token inside "`ados spend`"; those bytes are frozen. The new task
#       clause must describe consuming M2-S14 telemetry for per-agent and
#       per-model facts WITHOUT adding a seed literal, because P36 scans added
#       lines.
#   D-6 Entrypoint composition statement: two adjacent sentences, one
#       contiguous edit (F-3).
#   D-7 Command-page edits: status header only (lines 1..first `## `); title
#       line byte-identical; no page may contain `M1 planned` or
#       `M1 milestone planned` anywhere; no header may contain `Current`.
#   D-8 Status pointers and retention (F-1): four groups, placements pinned in
#       P3, original lines never removed or edited.
#   D-9 Corrected P16 marker (F-2).
#   D-10 Pack conventions: exactly twelve files (no extras), line 1 `# <name>(1)`
#       in commands/, line 3 exactly `Status: Proposed (M2)`, `<binary>`
#       invocation prefix, bare command names, no `ados_distribution` marker,
#       no line matching `^- AC:` and no `**Given**` in pack prose (P37), no
#       commercial provider names (F-5), and every relative link resolved from
#       that file's own directory depth.
#   D-11 Gate order: P28 -> P31 -> P32 -> P36 first (cheap containment and
#       guards), then the content procedures, per test plan §7.1. A phase
#       commits only when its own gate list is green at that phase's HEAD.
#   D-12 Environment: `pnpm check` fails by DEFAULT in this checkout because
#       tests/checks/ci-baseline-parity.test.ts uses `git clone --local` and
#       /tmp is tmpfs, giving 7132 pass / 1 fail. The authoritative run points
#       TMPDIR at the repository filesystem and gives 7133 pass, exit 0. Both
#       runs are recorded; the default failure is environmental, is not a
#       regression, and must NOT be "fixed" (scripts/** and tests/** are out
#       of scope).
#
# Verification conventions (binding for every phase):
#   - Run from the repository root on branch docs/GH-284/m2-planning.
#   - Materialise P00..P37 ONCE, verbatim by copy from
#     chg-GH-284-test-plan.md §7.1, as /tmp/gh284/procedures/pNN.sh and source
#     them in one shell: P00 defines BASE, the file variables, `entry()`,
#     `section()` and `desc()`, and writes the base snapshots to
#     /tmp/gh284/base-*.md. Do not retype the literals: they are the oracle.
#   - Gates run at the phase HEAD, after the phase commit. A failing gate
#     blocks the next phase: fix inside the same phase's scope, re-commit,
#     re-run.
#   - P6 declares the change artifacts in its scope on purpose: the branch
#     diff against fab46636 includes them, so declaring them keeps
#     `plan diff` "within". P28 excludes doc/changes/** from the product-file
#     set, so they never count as product change.
#   - Record the observed line for every gate in the P6 evidence file and in
#     the PR body (test plan §6; spec §17.3 DoD).
#   - `pnpm exec delivery-os --help` needs the built workspace; packages/*/dist
#     is present in this checkout and P15 reads the live listing.
#
# Validation record (2026-11-10, plan revision v1.0):
#   verdict=valid, readyForDevelopment=true, totalErrors=0,
#   artifact=chg-GH-284-plan.yaml (kind=yaml),
#   schemaVersion=delivery.plan.v1, tier=lite, phases=1..6.
#   Method: `pnpm exec delivery-os plan validate GH-284`.
#   37/37 TCs mapped exactly once (P1=11, P2=6, P3=4, P4=9, P5=1, P6=6);
#   37/37 ACs covered exactly once.
