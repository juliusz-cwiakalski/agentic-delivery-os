    - "M2-S4 changes anything but its - Depends on: line, or M2-S6 loses a base task line or changes its heading, goal, or acceptance criterion (P07, P08)"
    - "An M1 command page changes outside its status header, or entrypoint.md changes beyond one contiguous hunk over at most two adjacent DESCRIPTION sentences (P14, P15, P30)"
    - "A base status.md line is removed, reordered, or modified, an added line falls outside the new dated section and the four pointer insertions, or a pointer group is missing (P17, P18, P34)"
