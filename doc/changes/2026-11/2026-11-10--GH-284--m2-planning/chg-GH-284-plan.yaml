#       `**Given**` in pack prose (P37), no commercial provider names (XF-5), and
#       every relative link resolved from that file's own directory depth. The
#       pack README states the deliberate contents deviation: no `man-page.md`,
#       no `interactions.md`, and `entrypoint-delta.md` instead, while the
#       `milestones/README.md` pack-contents table stays byte-identical. C4
#       headings use the committed form `## C4 Level <n>: <subject>` (e.g.
#       `## C4 Level 1: system context`) so P33's `([^0-9]|$)` predicate matches;
#       the six key flows and the S17 park/resume are `###` headings under
#       `## Key flows`, seven in total; every mermaid block sits directly under
#       its own heading with nothing between, and each heading owns exactly one
#       diagram. README pack references are pack-relative `(./)?<artifact>`
#       links, and the README's self entry is a table row beginning
#       `| `README.md` |` (a `../README.md` parent link does not satisfy it). The
#       M2 index row links twelve targets on one physical line: `m2/README.md`,
#       the five other pack-level documents, and the six command pages.
#   D-11 Gate order: P28 -> P31 -> P32 -> P36 first (cheap containment and
#       guards), then the content procedures, per test plan §7.1. A phase
#       commits only when its own gate list is green at that phase's HEAD.
#   D-12 Aggregate gate (DR-3, NFR-5, AC-NFR5-1, DEC-19): the normative
#       invocation is TWO runs -- plain `pnpm check`, then
#       `mkdir -p <repo>/tmp/tmpdir && TMPDIR=<repo>/tmp/tmpdir pnpm check` --
#       and both results are recorded. The repo-local-`TMPDIR` run must exit 0;
#       a default-run failure is environmental only when
#       `tests/checks/ci-baseline-parity.test.ts` is its only failing test
#       (`git clone --local` hardlinks crossing into tmpfs; one failing test,
#       roughly 7132 passing). Any other default-run failure, or any repo-local
#       failure, is a delivery failure. Do not "fix" the environment condition:
#       `tests/**` and `scripts/**` are out of scope. P32 is the executable
#       form; this plan does not restate the command.
#   D-13 Retention gate (XF-7, NFR-7, DEC-16). P18 is the single
#       retention-and-whitelist oracle: whole-file line retention plus the
#       addition whitelist (the new dated section and the four pointer
#       insertions), with its reference-head fixture as the built-in
#       positive control. P34 re-runs the same oracle and adds the four-group
#       pointer count. The plan adds no compensating check of its own; a
#       `pointer_runs<4`, `bad_runs>0`, `removed_lines>0`, or
#       `reference_head_fixture=FAILED` line fails the phase.
#
# Verification conventions (binding for every phase):
#   - Run from the repository root on branch docs/GH-284/m2-planning.
#   - Materialise P00..P37 ONCE, verbatim by copy from
#     chg-GH-284-test-plan.md §7.1, as /tmp/gh284/procedures/pNN.sh and source
#     them in one shell: P00 defines BASE, the file variables, `entry()`,
#     `section()` and `desc()`, and writes the base snapshots to
#     /tmp/gh284/base-*.md. Do not retype the literals: they are the oracle.
#   - Gates run at the phase HEAD, after the phase commit. A failing gate
#     blocks the next phase: fix inside the same phase's scope, re-commit,
#     re-run.
#   - P6 declares the change artifacts in its scope on purpose: the branch
#     diff against fab46636 includes them, so declaring them keeps
#     `plan diff` "within". P28 excludes doc/changes/** from the product-file
#     set, so they never count as product change.
#   - Record the observed line for every gate in the P6 evidence file and in
#     the PR body (test plan §6; spec §17.3 DoD).
#   - `pnpm exec delivery-os --help` needs the built workspace; packages/*/dist
#     is present in this checkout and P15 reads the live listing.
#   - P18 defines `retention_oracle` and `head_line_for_base` for P34: run P18
#     first in the same shell. P34 defines `ptr()` locally (DR-8), so it does
#     not need P16/P17 to have run.
#   - Retention evidence (XF-7, XF-9): every P3/P6 run records P18's
#     `windows(base-anchored)`, `retention`, `whitelist`, `retention_oracle`,
#     `reference_head_fixture` and verdict lines, and P34's `pointer_groups` and
#     `sed_line_address_0_errors` lines. No compensating check is added.
#   - Aggregate-gate evidence (DR-3): record both P32 runs verbatim -- the
#     default `default_exit` / `default_failed_tests` /
#     `default_failure_class` lines and the `repo_tmpdir_exit` /
#     `gate_verdict` lines. P32 creates the repo-local tmpdir itself.
#   - Table identity (DR-6): P19 compares the "Pack contents" table against the
#     base snapshot, so the table must not be touched even though the pack
#     deviates from it.
#
# Validation record (2026-11-10, plan revision v1.3):
#   verdict=valid, readyForDevelopment=true, totalErrors=0,
#   artifact=chg-GH-284-plan.yaml (kind=yaml),
#   schemaVersion=delivery.plan.v1, tier=lite, phases=1..6.
#   Method: `pnpm exec delivery-os plan validate GH-284`.
#   37/37 TCs mapped exactly once (P1=11, P2=6, P3=4, P4=9, P5=1, P6=6);
#   37/37 ACs covered exactly once.
