  # ---------------------------------------------------------------------------
  # Phase 7 — Recorded-outcome disclosure and non-interference: the additive
  # attempt facts and the proof the gate work left the stream untouched
  # (AC-F1-1, AC-F1-3, AC-F2-1, AC-F2-3, AC-F3-4 disclosure half, NFR-8,
  # §10 observability; TC-HARNESS-037, TC-HARNESS-040, TDR-0041 decision 4,
  # TDR-0040 decision 4).
  #
  # Goal: a later reader can always tell which harness line and which mode
  # produced, or refused, a delivery — without changing how a session streams and
  # without a second disclosure home.
  #  7.1 `packages/core/src/contracts/dispatch.ts`: additive OPTIONAL attempt
  #      facts — the normalized observed harness version, the version verdict, the
  #      resolved mode and its origin — beside the delivered fields (and beside
  #      the Phase-5 attribution facts, which this phase does not re-declare),
  #      plus the additive optional resolution facts on the runtime-failure shape.
  #      No delivered field is renamed, no payload schema version is bumped, no
  #      member is added to the delivered success-shaped
  #      `DispatchEnvelopeError.detail`, and a pre-change record stays readable
  #      with the facts classified absent.
  #  7.2 `packages/core/src/app/dispatch.ts` and
  #      `packages/core/src/app/daemon-dispatch-result.ts`: carry the resolution
  #      facts into the attempt record on both the one-shot and the daemon path.
  #      Each path records only the facts it actually holds — the daemon producer
  #      records the verdict and mode it resolved and the held identity it
  #      receives, and never fabricates a binding or a version it did not observe.
  #      THE DAEMON LANE CLAIMS NO SEAT (adjudication (k)): it records a binding
  #      only when the daemon path resolved one, and an absent binding stays the
  #      honest unbound state — null seat plus `unresolved-seat` — never a
  #      resolution performed on the supervisory path.
  #      A pre-session refusal still appends NO attempt record (the delivered
  #      contract is unchanged); its facts ride `detail.harness` from Phase 4.
  #  7.3 `packages/core/src/app/dispatch-ledger.ts`: the structural attempt-record
  #      guard validates the additive disclosure facts when present (beside the
  #      Phase-5 attribution facts it already validates) and keeps every
  #      pre-change record readable — no required member added, no stored key
  #      rewritten.
  #  7.4 `tests/types/dispatch-contract.type-test.ts`: pin the additive optional
  #      facts beside the delivered field pins (no exact-key pin is relaxed).
  #  7.5 `tests/behaviour/dispatch-harness-verdict-mode.test.ts` — CREATED IN THIS
  #      PHASE, whole (TC-HARNESS-040; TDR-0041's file table already places the
  #      behaviour proof here, so no earlier phase scopes or gates it): a success
  #      records the normalized observed version, the inside verdict, the default
  #      mode and its `defaults` origin; the four refusals carry `detail.harness`
  #      with exactly the mapped member set per M-01/M-02/M-03/M-05 and `mode`
  #      absent (not null) on the two version refusals, with ZERO attempt records
  #      asserted per refusal (the pre-session path records nothing); the M-11
  #      unassigned refusal carries its facts in the bounded `error.summary` and
  #      no member; the control failure and `harness.session.unknown` carry no
  #      member while the delivered `holder` member still projects; a
  #      scripted-mode refusal line is exactly `{error, runId}` and an
  #      interactive/`--verbose` envelope carries the member; the two recorded
  #      facts differ in version and verdict; and the Phase-5 attribution facts on
  #      the success record report one seat per spawn with the group-scoped
  #      disclosure. THE DAEMON PRODUCER'S ASSERTIONS live in this same suite:
  #      a daemon attempt records the held session identity it already receives and
  #      the binding only when one was resolved, an absent binding yields a null
