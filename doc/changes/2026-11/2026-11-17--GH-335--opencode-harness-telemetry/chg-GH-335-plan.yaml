#     version gate before any session, mode selection with no runtime fallback,
#     exactly one `--agent`/`--model` pair per spawn mapped from the binding,
#     resume/attach under the same contract, and the four refusal paths with
#     their `detail.harness` facts plus the unassigned refusal in the bounded
#     `error.summary` — all produced before the lease claim and the attempt
#     append, over injected doubles.
#   Phase 5 lands attribution and telemetry from the observed store contract:
#     the run's recorded facts (held session identities and binding), the moved
#     capture seam, attribution by the held identities, the session record's own
#     version, seat and both models with group scoping and both divergence axes,
