  #      TDR-0032 rows already exist) and a `00-register.md` row under the
  #      existing "Harness adapter contract" topic when that binding needs the
  #      new records.
  #  1.6 `chg-GH-335-spike-evidence.md` in the change folder: the mode surfaces
  #      re-observed, the chosen-mode rationale, the store path and generation
  #      facts the telemetry path consumes, the exact commands run, and a
  #      "Decision records" section naming all four records (mode, adapters
  #      contract, TDR-0031, TDR-0032) with their paths — the change-side link
  #      half of AC-F2-2.
  #  1.7 `chg-GH-335-pm-notes.yaml` gains one `decisions` entry per record (mode,
  #      adapters contract, TDR-0031, TDR-0032), each naming the record id, its
  #      path, and its status, so the change's decision trail is not empty. The
