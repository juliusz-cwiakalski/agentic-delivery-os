  # ---------------------------------------------------------------------------
  # Phase 3 — Pure evaluation: the window verdict, the probe grammar and
  # normalization, the declared mode with its origin, and the per-seat binding
  # record (F-1, F-2 domain half, F-3 domain half; AC-F1-4, AC-F1-5, AC-F2-4,
  # AC-F3-2, AC-F3-3, AC-F1-1 parse half; DEC-1, DEC-8, DEC-11, OQ-4, OQ-10,
  # OQ-11).
  #
  # Goal: make every decision a pure function over injected data — no process,
  # no store, no ambient environment read.
  #  3.1 `packages/core/src/domain/harness-version-window.ts` (new): parse the
  #      probe stdout against the declared grammar (an off-grammar or multi-line
  #      string is `indeterminate`, never a match and never a substring or
  #      partial match), normalize to the bare semantic version, compare against
  #      the pinned window, return the verdict plus the classified requirement
  #      the caller acts on. The window is pinned data with no key that widens or
  #      narrows it; a near-miss that merely contains a supported prefix
  #      (`2.20.0`, `12.2.5`) parses and is out of window (AC-F1-4, AC-F1-5).
  #  3.2 `packages/core/src/domain/harness-mode.ts` (new): resolve the declared
  #      mode value with its origin (`defaults` when omitted, `configured` when
  #      present) and classify an unknown or unavailable mode; no ambient
  #      inference and no fallback (DEC-2).
  #  3.3 `packages/core/src/domain/harness-profile-propagation.ts` (new): per
  #      seat, the seat identity, the resolved model in canonical
  #      `provider/model#variant` form, the optional declared variable name, and
  #      the surface mapping — for a per-invocation surface the argument pairs
  #      (`--agent`, `--model`), for a variable-consuming surface the declared
  #      record entries — plus the representability check (surface-expressible
  #      and present in the injected recognised-model catalogue) returning
  #      `harness.profile.model-unrepresentable` BEFORE any descriptor or
  #      binding reaches a seam. The delivered
  #      `packages/core/src/domain/harness-spawn-env.ts` is UNCHANGED: it already
  #      binds a record value for a declared name and ignores every undeclared
  #      one (AC-F3-2, AC-F3-3).
  #  3.4 `packages/core/src/domain/harness-registry.ts`: the probe seam becomes
  #      the pinned deadline seam — one invocation per resolution, carrying
  #      `deadlineMs === HARNESS_VERSION_PROBE_TIMEOUT_MS` and the injected clock
  #      by reference, with `timed-out` and a rejection both yielding
  #      `indeterminate`; the window is evaluated once and the verdict plus the
  #      resolved mode are carried on the instance, so every consumer reads one
  #      verdict. A failed probe keeps `observedVersion === null` and the
  #      delivered `version-probe-failed` warning. No retry.
  #  3.5 `packages/core/src/config/catalog.ts`, `defaults.ts`, and `harness.ts`:
  #      the typed `harness.mode` key, its shipped default carrying the
  #      `defaults` origin, and its projection into `HarnessSettings`; an unknown
  #      value is classified `config.value.invalid` naming the path and is never
  #      silently defaulted. NO window key is added, and an invented one cannot
  #      change acceptance (AC-F1-4). The store path stays as delivered here; its
  #      reconciliation is Phase 5.
  #  3.6 `packages/core/src/domain/index.ts`: export the new pure modules.
  #  3.7 Fixture modules under `tests/fixtures/harness/`, created here because
  #      this phase's suites iterate them (Phase 4 extends them, never replaces
  #      them):
  #      - `version.ts`: the V-01..V-19 table (raw probe stdout or outcome,
  #        expected normalized version, verdict, identity, exit) plus the
  #        accepted-grammar constant, so parse acceptance and rejection cannot
  #        drift apart.
  #      - `mode.ts`: the mode config fixtures (absent / explicit default /
  #        unknown / wrong-typed / empty) and the ambient-canary case.
  #      - `profile.ts`: declared binding records with N >= 2 seats (one explicit
  #        `envName`), the conflicting ambient parent values, the undeclared
  #        record names with unique canaries, one unrepresentable seat per
  #        variant, and the injected recognised-model catalogue.
  #      All three are synthetic and pass the fixture-privacy scan; no live
  #      store, credential, or user state directory is read.
  #  3.8 `tests/behaviour/harness-version-probe-seam.test.ts` is created here with
  #      TC-HARNESS-042's parse/normalization cases and extended in Phase 4 with
  #      TC-HARNESS-006's single-invocation/deadline assertions; the file is
  #      declared in both phases.
  #
  # AC/TC coverage: AC-F1-5 and the grammar/normalization half of AC-F1-1
  #   (TC-HARNESS-042), AC-F1-1/AC-F1-2 verdict table (TC-HARNESS-004), AC-F1-4
  #   (TC-HARNESS-005), AC-F2-4 (TC-HARNESS-009), AC-F3-2 (TC-HARNESS-012),
  #   AC-F3-3 (TC-HARNESS-013).
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/harness-version-window.test.ts
  #   bun test tests/behaviour/harness-version-probe-seam.test.ts
  #   bun test tests/behaviour/harness-mode-config.test.ts
