    - "`delivery.harness.telemetry.v1` changes identity, a delivered row field is renamed or removed, a new major version is introduced, or an additive field is dropped before the state append because the payload allowlist was not extended (DEC-4, AC-F5-2, readiness finding 3)"
    - "Any of the nine delivered harness failure codes is renamed or re-semanted, a new refusal identity ships without an error-table row, a documented row, and a registered scenario, or `harness.telemetry.absent` is introduced anywhere in the closed vocabulary, the error table, or a test (RSK-5, DEC-10, AC-F7-2)"
    - "The `detail.harness` member grows a fifth member, becomes an open key-value map, is written as `null` where mode resolution has not run, or is declared without its edge projection, pins, validator, fixture, and documented member sentence in the same phase (TDR-0031)"
    - "The deny-by-default spawn environment widens, an `OC_*` per-seat variable family is emitted on a harness that does not consume it, a record name reaches the child environment without a declaration, an ambient parent variable is forwarded, or the static allowlist is mutated by profile data (AC-F3-3, NG-10, RSK-6, DEC-8)"
    - "A version, mode, or profile refusal occurs after a session-bearing process starts, or leaves a live child, an orphan, a telemetry row, or a store write (AC-N1-1, NFR-1)"
    - "The version probe becomes a retry loop, a shell invocation, more than one invocation per dispatch, unbounded in time, or the resolver calls it without the declared deadline and the injected clock (NFR-2, §4.4a)"
    - "An additive surface is taken as an argument value rather than an environment variable on opencode, or the dispatch path falls back between integration modes at runtime or infers the mode from ambient state instead of the declared configuration value (DEC-2, DEC-8, AC-F2-1)"
    - "The configured opencode store location is left pointing at a path no observed install has, or an absent resolved path is treated as a clean empty capture instead of a classified outcome (spec §7.1, RSK-9)"
    - "A store read assumes a work-item column, a separate harness-version column, a per-message token/agent/model/cost column, or a `part.tool` column, performs a store-wide scan, or attributes a session by title, directory, or a store-wide search (DM-8, DM-10, NG-11, AC-F5-5)"
    - "A zero-row capture for a session the dispatch ran and the store can read is reported as a pass, as absence, or as an empty success; absence is reused for damage or damage for absence (AC-F5-1, AC-F6-2, DEC-9)"
    - "A missing duration, cost, token class, seat, or version is fabricated as zero, an estimate, or derived from the capture timestamp instead of being explicitly absent with a warning, or a store-reported zero is converted into absence (NFR-6, AC-F5-4)"
    - "The telemetry read path performs a write, a non-indexed or message/part full scan, or widens any of the 64/16/16/24 caps (NFR-3, TC-HARNESS-025)"
    - "The delivered six classification scenarios are renamed, reordered, or removed, the extension constant widens the floor constant, or the extension is registered or executed through a second conformance path beside the delivered registry and its additive executor (AC-F7-1, TC-HARNESS-031/033)"
    - "Seat attribution becomes a second totals basis, so per-step rows and the session baseline are summed into one figure (RSK-7, TC-HARNESS-026)"
    - "A test needs a live harness process, a real store, a network call, a credential, the real user state directory, or a process-global child-process mock, or the human-gated live observation is read as an oracle by a test or a gate (NFR-10, AC-F5-6)"
    - "The decision record's chosen mode diverges from the delivered default-mode constant, a record is authored outside the doc/decisions per-type identifier convention, or a record ships without the R2 body its review requires (AC-F2-2, DEC-7, GAP-4)"
    - "A semantic assertion change is needed in a delivered suite this plan does not declare in a phase scope, or an additive attempt-record fact would force a rename of a delivered dispatch record field or a dispatch payload schema bump (TC-HARNESS-040, TDR-0031)"
