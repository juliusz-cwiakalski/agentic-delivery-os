    - "The `detail.harness` member grows a fifth member, becomes an open key-value map, is written as `null` where mode resolution has not run, is populated on any identity outside the four new pre-session harness refusals (including the unassigned named agent, whose facts ride the bounded `error.summary`), or is declared without its edge projection, pins, validator, fixture, and documented member sentence in the same phase (TDR-0031, TDR-0032 A-2)"
    - "A binding carries more than one seat, a seat map, or a repeated `--agent`/`--model`, a seat name is sent as `--agent` where it differs from the agent identity, a binding is carried through process-global state, a profile's N seats are collapsed into one spawn, or a role-less spawn binds a seat in any profile shape (DEC-13, TDR-0032 A-1, TC-HARNESS-011/015)"
    - "A named agent that the resolved profile assigns no seat is not refused before the lease claim and the attempt append, or its refusal carries a `detail.harness` member, a new error-table row, or an attempt record (AC-F3-4, NFR-1, M-11, TDR-0032 A-2)"
    - "A recognised-agent or recognised-model catalogue is read, injected, or declared anywhere in the delivery, a second pre-session child process is introduced for a catalogue or a configuration read, or an unknown agent or model is turned into a pre-session refusal (DEC-14, TDR-0032 C-2, AC-N1-1)"
    - "The deny-by-default spawn environment widens, an `OC_*` per-seat variable family is emitted on a harness that does not consume it, a record name reaches the child environment without a declaration, an ambient parent variable is forwarded, or the static allowlist is mutated by profile data (AC-F3-3, NG-10, RSK-6, DEC-8)"
    - "A version, mode, or profile refusal occurs after a session-bearing process starts or after a lease is claimed, or leaves a live child, an orphan, a telemetry row, a store write, or an attempt record (AC-N1-1, NFR-1)"
    - "The version probe becomes a retry loop, a shell invocation, more than one invocation per dispatch, unbounded in time, resolves from a second production construction site, or the resolver calls it without the declared deadline and the injected clock (NFR-2, DEC-11, §4.4a, TC-HARNESS-046)"
    - "An additive surface is taken as an argument value rather than an environment variable on opencode, or the dispatch path falls back between integration modes at runtime or infers the mode from ambient state instead of the declared configuration value (DEC-2, DEC-8, AC-F2-1)"
    - "The configured opencode store location is left pointing at a path no observed install has, the `harness.stores.opencode.databasePath` default and the `OPENCODE_DB` override are not both honoured through the injected configuration environment layer, or an absent resolved path is treated as a clean empty capture instead of a classified outcome (spec §7.1, AC-F5-5, RSK-9)"
    - "A store read assumes a work-item column, a separate harness-version column, a per-message token/agent/model/cost column, or a `part.tool` column, performs a store-wide scan, or attributes a session by title, directory, or a store-wide search (DM-8, DM-10, NG-11, AC-F5-5)"
    - "A capture attributes rows by a work-item query instead of the session identities the run holds, or the seat is re-derived at capture time from the current profile instead of cited from the run's recorded binding (DM-8, AC-F5-5, TDR-0032 revisit trigger)"
    - "A zero-row capture for a session the dispatch ran and the store can read is reported as a pass, as absence, or as an empty success; absence is reused for damage or damage for absence (AC-F5-1, AC-F6-2, DEC-9)"
    - "A seat is claimed for a group whose observed agent differs from the binding's agent, or an unbound run's row carries anything but a null seat with `unresolved-seat` (AC-F5-1, AC-F5-3, TDR-0032 decision 4)"
