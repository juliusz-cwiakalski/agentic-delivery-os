  #   bun test tests/behaviour/harness-spawn-env.test.ts
  #   bun test tests/behaviour/harness-config.test.ts
  #   bun run scripts/checks/ambient-globals.ts
  #
  # Suites left green: harness-version-window (V-01..V-15, V-18, V-19 behaviour
  #   half), harness-version-probe-seam (042 half), harness-mode-config
  #   (absent/explicit/unknown/ambient-canary; zero spawn calls),
