phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Mode spike confirmation, the two governing decision records, the
  # staged TDR-0041 and TDR-0040, and the independent decision review
  # (DEC-2, DEC-7, DEC-8, DEC-13, DEC-16, OQ-1, RSK-1, RSK-3, AC-F2-2, G-8,
  # DoD clauses 5 and 10).
  #
  # Goal: retire the one remaining question, record the decisions that gate every
  # later phase before any governed code exists, and have those records
  # independently challenged in the same commit.
  #  1.1 The mode spike is NARROW. The mode surfaces, the store family, and the
  #      absence of an `OC_*_AGENT_*_MODEL` family are already observed and
  #      recorded (spec Appendix C, DM-10, DEC-8, DEC-11), so the spike only
  #      confirms which of the three declared modes the delivery runs (the
  #      observed `--standalone` wrapper today) and records the read-only
  #      direct-store rationale for the telemetry path. It runs read-only: the
  #      harness's version/help surface, a read-only store open with the
  #      query-only pragma, and no store write, configuration mutation,
  #      credential read, network call, or session start.
  #  1.2 The integration-mode record under `doc/decisions/` (next free per-type
  #      identifier), stating the chosen mode among exactly the three declared
  #      modes with its observed surface, the read-only direct-store rationale,
  #      `Proposed` status, alternatives, assumptions, consequences, and
  #      verification criteria (the R2 body). Its chosen mode names the value the
  #      Phase-2 `DEFAULT_HARNESS_MODE` constant carries; the two are asserted
  #      equal by TC-HARNESS-010 in Phase 2 and by TC-HARNESS-041 in Phase 8.
  #  1.3 The adapters-contract record (DEC-7) governing: the supported window and
  #      the two version refusals with the probe grammar and normalization
  #      (DEC-11) — the record states the RULE (current minor line at delivery
  #      time plus one previous minor) and its value at delivery (`2.3.x` plus
  #      `2.2.x`), never a frozen pair presented as the rule — the mode
  #      declaration and its origin, the surface-mapped propagation contract
  #      (DEC-8) BY REFERENCE ONLY (see the constraint below), the
  #      expressibility-only refusal (DEC-6 narrowed by DEC-14 — explicitly NO
  #      recognised-model catalogue and no second child process), the recorded
  #      binding, the seat/resolved/observed/duration telemetry fields with the
  #      observed store contract (DEC-9), and the absence taxonomy (DEC-10)
  #      including the observed-axis absence marker and its
  #      `invalid-session-identity` supersession (AC-F5-7). It does not supersede
  #      ADR-0008 and follows the TDR-0016/TDR-0021 additive precedent.
  #      THE SEAT AND CARRIER CONTRACT IS REFERENCE-ONLY IN THAT RECORD
  #      (readiness iteration 6, finding 4). `TDR-0040`, as amended by A-4, is
  #      the SINGLE HOME of the seat cardinality, the resolution chain, the
  #      two-member carrier, the exactly-one-`--agent`/one-`--model` surface
  #      mapping, the seat identity with no argv carrier, the unassigned refusal
  #      through the delivered `provider.profile.invalid`, and the role-less
  #      `unresolved-seat` disclosure; `TDR-0041` is the SINGLE HOME of the
  #      failure-envelope `detail.harness` member. The adapters-contract record
  #      CITES and LINKS both records and may SUMMARISE them in prose that
  #      carries no obligation of its own; it MUST NOT restate, redefine,
  #      paraphrase as its own contract, or contradict the two-member carrier,
  #      the seat cardinality, the resolution chain, or the refusal identities,
  #      because a fourth authored home for those rules is a drift-capable copy
  #      of the change's headline criterion. A reviewer treats any restatement,
  #      redefinition, or contradiction of them in that record as a DEFECT of
  #      this phase rather than as record content, and the phase does not commit
  #      until the record reads reference-only.
  #  1.4 TDR-0041 and TDR-0040 are staged in this change: both record files are
  #      committed with their index rows and their `Proposed` status preserved
  #      (TDR-0041's member is delivered in Phase 2 and its behaviour proof in
  #      Phase 7; TDR-0040's contract in Phase 2, its resolution in Phase 3, its
  #      carrier in Phase 4, and its row identity in Phase 5).
  #  1.5 `doc/decisions/00-index.md` rows for both new records (the TDR-0041 and
  #      TDR-0040 rows already exist) and a `00-register.md` row under the
  #      existing "Harness adapter contract" topic when that binding needs the
  #      new records.
  #  1.6 `chg-GH-335-spike-evidence.md` in the change folder: the mode surfaces
  #      re-observed, the chosen-mode rationale, the store path and generation
  #      facts the telemetry path consumes, the exact commands run, the harness
  #      version line observed on this pass — `opencode v2.3.2`, normalizing to
  #      `2.3.2` — recorded beside the intake pass's `opencode v2.2.5` line, so
  #      the DoD's "one real harness version output is recorded" clause (clause 5)
  #      has a real recorded output and two in-window lines, and a
  #      "Decision records" section naming all four records (mode, adapters
  #      contract, TDR-0041, TDR-0040) with their paths — the change-side link
  #      half of AC-F2-2.
  #  1.7 `chg-GH-335-pm-notes.yaml` gains ONE `decisions` entry per record (the
  #      integration-mode record, the adapters-contract record, TDR-0041 and
  #      TDR-0040), each entry machine-readable with exactly three facts: the
  #      record's `id`, its `path`, and its `status`, so the change's decision
  #      trail is not empty and a tool that reads `decisions` sees the same four
  #      records a reader does. Record ids are the authored records' own ids (the
  #      two per-type identifiers the phase allocates, plus TDR-0041 and
  #      TDR-0040), never ids pinned by this plan.
  #      THE PM ADJUDICATIONS ARE NOT RECORD DECISIONS: the 2026-11-18
  #      adjudications in `notes[]` are orchestrator decisions about the delivery
  #      artifacts and stay in `notes[]`; they are never restated as `decisions`
  #      entries and never attributed to a record. One recorded meaning is
  #      restated where it belongs, in Phase 5.6/7.2: adjudication (k) says the
  #      daemon lane CLAIMS NO SEAT — the attempt record carries only the identity
  #      the daemon already holds and a binding when one exists (null +
  #      `unresolved-seat` otherwise) — and daemon-level seat attribution stays
  #      out of scope. The entries are recorded by @pm; this phase's commit stages
  #      the file.
  #  1.8 `tests/checks/decision-record.test.ts` gains the existence inventory for
  #      all four records: file present, `id`/`status` per the convention, the
  #      chosen mode inside the three declared modes, the read-only direct-store
  #      rationale present, an R2 body (problem framing, alternatives,
  #      consequences, verification criteria) present and non-empty, the
  #      index row present, and the adapters-contract record citing DEC-13 and
  #      TDR-0040 for the seat rule. The constant-equality assertion lands in
  #      Phase 2, which is why TC-HARNESS-010 is owned there; the feature-spec
  #      link and the change-artifact link assertions are TC-HARNESS-041 in
  #      Phase 8.
  #  1.9 `chg-GH-335-decision-review.md` — the INDEPENDENT decision review DoD
  #      clause 10 requires, so the clause is closed by an artifact rather than
  #      by an authoring claim. It carries one tri-state verdict per record
  #      (`PASS` / `PASS_WITH_RISKS` / `REWORK`), the reviewer role that produced
  #      it (`@decision-critic`, requested through `@pm`, which owns the
  #      decision-review delegation), the record ids reviewed, and the challenge
  #      points raised. A `REWORK` verdict reopens the affected record inside
  #      this phase before the commit, so the committed set is the reviewed set;
  #      a `PASS_WITH_RISKS` verdict is recorded and carried into the PR
  #      description. The coder stages this artifact and does not author or edit
  #      it; `tests/checks/decision-record.test.ts` asserts its presence, the
  #      tri-state verdict, and that it names every record committed here.
  #  1.10 CAPSULE STAGING: the phase declares the change folder's
  #      `readiness-review` folder, so the readiness and DoD verdict artifacts
  #      (including this iteration's verdict) are inside the plan's declared scope
  #      and a standalone `jaiship commit` can stage them instead of failing
  #      `commit.staging-blocked-untracked`. The phase stages those artifacts and
  #      never authors or edits them.
  #
  # No phase-owned TC completes here: this phase produces records and their
  # review, not a behaviour.
  #
  # Gate:
  #   bun test tests/checks/decision-record.test.ts
  #   bun test tests/checks/doc-conformance.test.ts
  #   bun test tests/checks/fixture-privacy.test.ts
  #
  # Suites left green: decision-record (four records inventoried with their R2
  #   bodies and the review artifact's verdicts), doc-conformance, fixture-privacy.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Integration-mode spike confirmation, the integration-mode and adapters-contract records, the staged TDR-0041 and TDR-0040, and the independent decision review"
