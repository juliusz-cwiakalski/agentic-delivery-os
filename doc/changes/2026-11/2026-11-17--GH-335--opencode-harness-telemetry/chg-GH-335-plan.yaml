#   result.ts`): Phase 3 consumes them, and Phase 4 reads the agent identity off
#   the member and supplies the resolved binding on the sibling member. That rule
#   does NOT reach every `packages/core/src/contracts/*.ts` type: Phases 5 and 7
#   own the additive per-attempt facts on `contracts/dispatch.ts` (the held
#   identities and the recorded binding in 5.6, the verdict/mode/origin facts in
