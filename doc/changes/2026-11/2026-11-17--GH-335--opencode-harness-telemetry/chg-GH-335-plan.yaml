phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Mode spike confirmation, the two governing decision records, and
  # the staged TDR-0031 (DEC-2, DEC-7, DEC-8, OQ-1, RSK-1, RSK-3, AC-F2-2, G-8).
  #
  # Goal: retire the one remaining question and record the decisions that gate
  # every later phase, before any governed code exists.
  #  1.1 The mode spike is now NARROW. The mode surfaces, the store family, and
  #      the absence of an `OC_*_AGENT_*_MODEL` family are already observed and
  #      recorded (spec Appendix C, DM-10, DEC-8, DEC-11), so the spike only
  #      confirms which of the three declared modes the delivery runs (the
  #      observed `--standalone` wrapper today) and records the read-only
  #      direct-store rationale for the telemetry path. It runs read-only: the
  #      harness's version/help surface, a read-only store open with the
  #      query-only pragma, and no store write, configuration mutation,
  #      credential read, network call, or session start.
  #  1.2 The integration-mode record under `doc/decisions/` (next free per-type
  #      identifier), stating the chosen mode among exactly the three declared
  #      modes with its observed surface, the read-only direct-store rationale,
  #      `Proposed` status, alternatives, assumptions, consequences, and
  #      verification criteria (the R2 body). Its chosen mode names the value the
  #      Phase-2 `DEFAULT_HARNESS_MODE` constant carries; the two are asserted
  #      equal by TC-HARNESS-010 in Phase 2 and by TC-HARNESS-041 in Phase 8.
  #  1.3 The adapters-contract record (DEC-7) governing: the supported window and
  #      the two version refusals with the probe grammar and normalization
  #      (DEC-11), the mode declaration and its origin, the surface-mapped
  #      propagation contract (DEC-8, and explicitly NOT a variable family), the
  #      seat/resolved/observed/duration telemetry fields with the observed
  #      store contract (DEC-9), and the absence taxonomy (DEC-10). It references
  #      TDR-0031 for the failure-envelope member and does not restate or
  #      re-decide it, does not supersede ADR-0008, and follows the
  #      TDR-0016/TDR-0021 additive precedent.
  #  1.4 TDR-0031 is staged in this change: the record file is committed with its
  #      index row, and its `Proposed` status is preserved (its member is
  #      delivered in Phase 2, its behaviour proof in Phase 4/7).
  #  1.5 `doc/decisions/00-index.md` rows for both new records (the TDR-0031 row
  #      already exists) and a `00-register.md` row under the existing "Harness
  #      adapter contract" topic when that binding needs the new records.
  #  1.6 `chg-GH-335-spike-evidence.md` in the change folder: the mode surfaces
  #      re-observed, the chosen-mode rationale, the store path and generation
  #      facts the telemetry path consumes, the exact commands run, and a
  #      "Decision records" section naming both record ids plus TDR-0031 with
  #      their paths — the change-side link half of AC-F2-2.
  #  1.7 `chg-GH-335-pm-notes.yaml` gains one `decisions` entry per record (mode,
  #      adapters contract, TDR-0031), each naming the record id, its path, and
  #      its status, so the change's decision trail is not empty. The entries are
  #      recorded by @pm; this phase's commit stages the file.
  #  1.8 `tests/checks/decision-record.test.ts` gains the existence inventory for
  #      all three records: file present, `id`/`status` per the convention, the
  #      chosen mode inside the three declared modes, the read-only direct-store
  #      rationale present, an R2 body (problem framing, alternatives,
  #      consequences, verification criteria) present and non-empty, and the
  #      index row present. The constant-equality assertion lands in Phase 2,
  #      which is why TC-HARNESS-010 is owned there; the feature-spec link and
  #      the change-artifact link assertions are TC-HARNESS-041 in Phase 8.
  #
  # No phase-owned TC completes here: this phase produces the records, not a
  # behaviour.
  #
  # Gate:
  #   bun test tests/checks/decision-record.test.ts
  #   bun test tests/checks/doc-conformance.test.ts
  #   bun test tests/checks/fixture-privacy.test.ts
  #
  # Suites left green: decision-record (three records inventoried with their R2
  #   bodies), doc-conformance, fixture-privacy.
  # ---------------------------------------------------------------------------
