#         `OC_<PREFIX>_AGENT_<SEAT>_MODEL`) and the delivery supplies its declared
#         value through the per-spawn record map; an undeclared record name
#         changes nothing. The agent the resolution is called with is the value the
#         caller supplied on the spawn/resume input's own agent-identity member,
#         and the resolution's result travels on the sibling binding member
