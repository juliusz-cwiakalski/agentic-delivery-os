  #      absence of an `OC_*_AGENT_*_MODEL` family are already observed and
  #      recorded (spec Appendix C, DM-10, DEC-8, DEC-11), so the spike only
  #      confirms which of the three declared modes the delivery runs (the
  #      observed `--standalone` wrapper today) and records the read-only
  #      direct-store rationale for the telemetry path. It runs read-only: the
  #      harness's version/help surface, a read-only store open with the
  #      query-only pragma, and no store write, configuration mutation,
  #      credential read, network call, or session start.
  #  1.2 The integration-mode record under `doc/decisions/` (next free per-type
  #      identifier), stating the chosen mode among exactly the three declared
  #      modes with its observed surface, the read-only direct-store rationale,
  #      `Proposed` status, alternatives, assumptions, consequences, and
  #      verification criteria (the R2 body). Its chosen mode names the value the
  #      Phase-2 `DEFAULT_HARNESS_MODE` constant carries; the two are asserted
  #      equal by TC-HARNESS-010 in Phase 2 and by TC-HARNESS-041 in Phase 8.
  #  1.3 The adapters-contract record (DEC-7) governing: the supported window and
  #      the two version refusals with the probe grammar and normalization
  #      (DEC-11), the mode declaration and its origin, the surface-mapped
  #      propagation contract (DEC-8) with TDR-0032's cardinality, resolution and
  #      carrier rules restated as the record's contract (one seat per spawn,
  #      agent->seat resolution, one `--agent`/one `--model`, seat identity with
  #      no argv carrier, the unassigned refusal via `provider.profile.invalid`,
  #      the role-less `unresolved-seat` disclosure), the expressibility-only
  #      refusal (DEC-6 narrowed by DEC-14 — explicitly NO recognised-model
  #      catalogue and no second child process), the recorded binding, the
