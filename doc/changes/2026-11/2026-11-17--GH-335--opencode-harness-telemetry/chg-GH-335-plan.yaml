# GH-335 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:      ./chg-GH-335-spec.md (v1.0) — F-1..F-7, DM-1..DM-7,
#                NFR-1..NFR-10, DEC-1..DEC-7, RSK-1..RSK-8, OQ-1..OQ-3, §5.1
#                capability details, §6 flows 1..5, §7 scope, §8.2/§8.4/§8.5
#                interface and compatibility contracts, §10 observability,
#                §16 affected components, §17 AC table (23 ACs
#                AC-F1-1..AC-F7-3 plus AC-N1-1), §18 rollout, §19 migration,
#                Appendix B pinned blueprints TC-M3-HARNESS-001/002.
#   - Tests:     ./chg-GH-335-test-plan.md (v1.0) — 41 cases
#                TC-HARNESS-001..041; 23/23 AC coverage; refusal/oracle matrix
#                M-01..M-10 with precedence P-01..P-03; version verdict matrix
#                V-01..V-12; telemetry field matrix T-01..T-14; conformance
#                scenario matrix C-01..C-08; binding fixture contract §4.1;
#                non-vacuity contract §4.2; §4 layer table; §7 automation map;
#                gaps GAP-1..GAP-6; open questions OQ-4..OQ-9.
#   - PM record: ./chg-GH-335-pm-notes.yaml — delivery_mode autonomous, the
#                delivered-seam cross-check, gaps G1..G5, observed harness
#                v2.2.5, the GH-342 Q-06 default, the gate-command convention
#                (TMPDIR=$PWD/tmp/tmpdir), and the merge authority (CEO).
#   - Schema:    doc/spec/features/feature-plan-schema.md — scope keys
#                files/packages/folders, per-phase summary, doneArtifacts
#                slots, leases, weightClass, interactions, ceremony tier; no
#                `tasks` key and no progress log.
#   - Precedent: ../2026-11-12--GH-291--telemetry-v2/chg-GH-291-plan.yaml
#                (phase ceremony, inventory/guard scope, changeset shape,
#                declared controls) and
#                ../2026-11-15--GH-320--jaiship-binary/chg-GH-320-plan.yaml
#                (TC -> PHASE MAP, AC -> PHASE MATRIX, scope convention,
#                escalation triggers).
#
# GAP-1 RESOLUTION (test plan §1.2 GAP-1: map TC-HARNESS-001..041 onto phases
#   without reshaping any oracle, identity, exit, bound, or AC/NFR mapping).
#   No TC id changes, no oracle is edited, and no AC/NFR mapping moves. Each TC
#   is owned by exactly one phase — the phase that first makes its COMPLETE
#   suite set green (see TC -> PHASE MAP).
#   TC -> PHASE MAP (41 ids, no id unassigned, none assigned twice):
#   Phase 1 spike + decision records (0 complete; the existence half of
#            TC-HARNESS-010 lands here and the equality half completes in
#            Phase 2, so TC-HARNESS-010 is owned by Phase 2)
#   Phase 2 contract layer (2): TC-HARNESS-010, TC-HARNESS-035
#   Phase 3 pure evaluation (5): TC-HARNESS-004, TC-HARNESS-005,
#            TC-HARNESS-009, TC-HARNESS-012, TC-HARNESS-013
#   Phase 4 dispatch path (11): TC-HARNESS-001, TC-HARNESS-002,
#            TC-HARNESS-003, TC-HARNESS-006, TC-HARNESS-007, TC-HARNESS-008,
#            TC-HARNESS-014, TC-HARNESS-015, TC-HARNESS-016, TC-HARNESS-017,
#            TC-HARNESS-018
#   Phase 5 telemetry (11): TC-HARNESS-011, TC-HARNESS-019, TC-HARNESS-020,
#            TC-HARNESS-021, TC-HARNESS-022, TC-HARNESS-023, TC-HARNESS-024,
#            TC-HARNESS-025, TC-HARNESS-026, TC-HARNESS-027, TC-HARNESS-028
#   Phase 6 conformance and cross-cutting battery (9): TC-HARNESS-029,
#            TC-HARNESS-030, TC-HARNESS-031, TC-HARNESS-032, TC-HARNESS-033,
#            TC-HARNESS-034, TC-HARNESS-036, TC-HARNESS-038, TC-HARNESS-039
#   Phase 7 dispatch disclosure and non-interference (2): TC-HARNESS-037,
#            TC-HARNESS-040
#   Phase 8 documentation and release (1): TC-HARNESS-041
#   Total 0 + 2 + 5 + 11 + 11 + 9 + 2 + 1 = 41.
#   TC-HARNESS-011 is owned by Phase 5 (not Phase 4) because its complete
#   oracle includes landed seat-attributed rows with tokens and cost; its
#   propagation half is proven by the Phase-4 suite and re-run in Phase 5's
#   gate without a second home. TC-HARNESS-036 is owned by Phase 6 because its
#   fixture observes the telemetry-append seam as well as the spawn seam.
#
# AC -> PHASE MATRIX (all 23 ACs; the phase map above is the complete trace):
#   AC-F1-1 -> Phase 4 (001, 006), Phase 3 (004), Phase 7 (040)
#   AC-F1-2 -> Phase 4 (002, 006), Phase 3 (004), Phase 6 (036)
#   AC-F1-3 -> Phase 4 (003, 006)
#   AC-F1-4 -> Phase 3 (005)
#   AC-F2-1 -> Phase 4 (007), Phase 7 (040)
#   AC-F2-2 -> Phase 2 (010), Phase 8 (041)
#   AC-F2-3 -> Phase 4 (008), Phase 6 (036)
#   AC-F2-4 -> Phase 3 (009)
#   AC-F3-1 -> Phase 4 (015, 016), Phase 5 (011)
#   AC-F3-2 -> Phase 3 (012), Phase 4 (015)
#   AC-F3-3 -> Phase 3 (013)
#   AC-F3-4 -> Phase 4 (014), Phase 6 (036)
#   AC-F4-1 -> Phase 4 (016, 017, 018)
#   AC-F5-1 -> Phase 5 (011, 019, 026, 028)
#   AC-F5-2 -> Phase 5 (020)
#   AC-F5-3 -> Phase 5 (021)
#   AC-F5-4 -> Phase 5 (022, 028)
#   AC-F6-1 -> Phase 5 (023)
#   AC-F6-2 -> Phase 5 (024)
#   AC-F7-1 -> Phase 6 (031)
#   AC-F7-2 -> Phase 6 (032, 033)
#   AC-F7-3 -> Phase 6 (033, 034)
#   AC-N1-1 -> Phase 2 (035), Phase 6 (036, 038)
#
# TEST-PLAN HANDOFF RESOLUTIONS (OQ-4..OQ-9; each states its default verbatim
#   and names the phase where it becomes code, so the coder never re-decides):
#   OQ-4  Per-seat model variables are DECLARED, and the delivery declares them.
#         Every spawn, deliver, and resume derives each resolved seat's declared
#         name (`envRecordNameForSeat` — `OC_<PREFIX>_AGENT_<SEAT>_MODEL` or the
#         seat's explicit `envName`) into the spawn descriptor's variable
#         entries, so the delivered deny-by-default builder binds the record
#         value for an already-declared name and nothing else. The typed
#         `harness.environment` configuration branch stays the operator's static
#         surface (PATH/HOME/TMPDIR/DELIVERY_WORK_PATH today) and is NOT widened
#         by profile data; a record name with no descriptor entry is inert
#         (AC-F3-3). Pure derivation and descriptor projection land in Phase 3;
#         the composed wiring lands in Phase 4. A required seat whose value or
#         name cannot be expressed refuses before any descriptor is handed to a
#         seam (AC-F3-4).
#   OQ-5  Refusal projection is DECIDED HERE: an unknown `harness.mode` value is
#         the delivered `config.value.invalid` (projection `user-validation`,
#         exit 1) resolved in the typed configuration branch — never a silent
#         default; `harness.mode.unavailable` and
#         `harness.profile.model-unrepresentable` are `user-validation`, exit 1,
#         exactly like `harness.version.unsupported` and
#         `harness.version.unknown`. `harness.telemetry.absent` is
#         `user-validation`, exit 1; `harness.telemetry.extraction-failed` keeps
#         the delivered `platform-provider`, exit 2. Five new rows join the
#         error table (matrix M-01..M-06); M-04 keeps the delivered
#         `config.value.invalid` row and adds none. Exit stays a pure projection
#         of `projectionClass`; no exit literal is introduced.
#   OQ-6  AC-N1-1's "no child process has been started" is applied as NO
#         SESSION-BEARING CHILD PROCESS: zero session starts through the
#         streaming and one-shot seams, zero live children after the call, zero
#         telemetry appends, zero store writes. The version probe is the single
#         permitted bounded invocation the spec itself mandates (F-1, §8.2,
#         NFR-2): at most one probe per dispatch, it completes, and it is
#         reaped. Phase 6's TC-HARNESS-036 asserts exactly this reading and
#         records the probe count as `<= 1`, never as `0`.
#   OQ-7  Attach is the bounded `listSessions` lookup followed by `resume`; NO
#         new `HarnessSessionPort` member is added. Attach lists once with the
#         declared cap, resolves the identity, spawns nothing, and keeps the
#         delivered `harness.session.unknown` semantics with an idempotent kill
#         for an absent or different identity. Phase 4 owns it.
#   OQ-8  The 2.1.x degrade-versus-failed split is pinned by a declared
#         MANDATORY FIELD SET: session identity plus at least one token class
#         plus work-item attribution. When the mandatory set is present, every
#         missing optional field (duration, cost, seat column, resolved model)
#         degrades with a closed-vocabulary warning and an explicit absence;
#         when the mandatory set is absent, that session becomes one failed
#         session entry with a closed reason. Fixtures derive the 2.1.x shape
#         from the observed 2.2.5 shape with named removals (GAP-6); the
#         assertions target the rule, never invented column names. Phase 5 owns
#         it.
#   OQ-9  Version and mode facts reach conformance through the INJECTED
#         REGISTRATION/DEPS SURFACE: the additive optional members on
#         `HarnessConformanceDeps` (probe result, requested mode) and the
#         additive scenario ids on `HarnessConformanceRegistration.scenarios`.
#         One registry path — `HARNESS_CONFORMANCE_REGISTRY`,
#         `HARNESS_CONFORMANCE_SCENARIOS`, and `harnessConformanceViolations` —
#         serves the floor and the extension; no forked module and no live
#         resolution call is made from a scenario. Phase 6 owns it.
#   GAP-5 (field and reason-constant names) is resolved by declaring them once
#         in the Phase-2 contract modules; no suite asserts an inline literal.
#
# PHASE ORDER AND TESTABILITY (each phase is one independently verifiable
#   commit, green at its own boundary, committed through the commit primitive
#   against the declared scope):
#   Phase 1 runs the integration-mode spike FIRST because DEC-2/OQ-1/OQ-2 gate
#     everything downstream: RSK-1 (profile propagation may be nominally correct
#     but inert if the harness selects models through its own configuration
#     surface) can only be retired by observing the harness. The spike records
#     its evidence in the change folder and authors the two decision records
#     (DEC-7) before any governed code exists, matching spec §18 ("the record
#     precedes the code it governs") and AC-F2-2.
#   Phase 2 lands every contract identity and vocabulary next, so no consumer
#     can pin a behaviour against a not-yet-declared identity: the five new
#     error rows, the version-window data and verdict vocabulary, the closed
#     mode vocabulary and the delivered default, the propagation record shape,
#     the additive seat/resolved-model/observed-model/duration row fields, and
#     the new closed warning reasons.
#   Phase 3 lands the pure evaluation: window parsing and comparison, the mode
#     resolution with its `defaults`/`configured` origin, the per-seat
#     propagation record and its refusal rules, and the registry carrying one
#     verdict plus the resolved mode on the instance. No adapter, no process,
#     no store.
#   Phase 4 lands the dispatch path: the version gate before any session, the
#     mode selection with no runtime fallback, per-spawn propagation into the
#     composed descriptor, resume/attach under the same contract, and the three
#     refusal paths, all over injected doubles. The one composition edit here
#     (`packages/cli/src/production.ts`) is the PROPAGATION SEAM, not the
#     configuration or CLI-surface wiring: the propagation contract is only
#     verifiable through the composed spawn, and it is declared at this boundary
#     for that reason. Configuration schema and projection land earlier (Phase
#     3); the dispatch-record and refusal-disclosure wiring lands later (Phase
#     7).
#   Phase 5 lands telemetry: additive seat attribution, the resolved model
#     beside the never-overwritten reported model, explicit durations, the
#     degrade-versus-failed split, and the absence/failure taxonomy.
#   Phase 6 lands conformance and the cross-cutting battery: the five new
#     scenarios on the same registry, the delivered six-scenario floor
#     unchanged, refusal side-effect freedom, mutants, determinism, bounds,
#     privacy, and offline hermeticity.
#   Phase 7 lands the consumer disclosure: the additive optional attempt facts
#     (harness version, version verdict, mode and its origin) and the proof that
#     the new gate work leaves the delivered stream, handle acquisition, and
#     output bounds undisturbed.
#   Phase 8 reconciles the system spec and the planning corpus, stages the
#     changeset, and declares the release obligations. Lifecycle phase 7
#     (@doc-syncer) VERIFIES that reconciled set; it does not author pages in a
#     later plan phase.
#
# SCOPE CONVENTION: concrete files are exact repository-relative paths; folders
#   are declared by every phase that writes a new file inside them (the commit
#   primitive stages only the declared phase scope). A file edited in two phases
#   is declared in both; `plan diff` reports the first covering phase, and an
#   untouched declared file is only a `plan diff` observation, never a gate
#   failure. `doc/decisions` is declared as a folder because the two new record
#   filenames carry the next free per-type identifiers (TDR sequence) and must
#   not be pinned by this plan.
#
# DECLARED CONTROLS, NOT EDITS: the delivered suites below are re-run in phase
#   gates as controls and are NOT edited, so none is declared in a phase scope:
#   tests/behaviour/harness-spawn-env.test.ts, harness-spawn-credential.test.ts,
#   harness-default-path.test.ts, harness-opencode-session.test.ts,
#   harness-opencode-stream.test.ts, harness-opencode-resume-stream.test.ts,
#   harness-host-stream.test.ts, harness-stream-hygiene.test.ts,
#   harness-config.test.ts, harness-oneshot-context.test.ts,
#   harness-telemetry-opencode.test.ts, harness-telemetry-claude.test.ts,
#   harness-telemetry-claude-budget.test.ts, harness-telemetry-drift.test.ts,
#   harness-telemetry-opencode-orphan-scope.test.ts,
#   harness-closeout-{capture,idempotency,nongating}.test.ts,
#   harness-output-bounds.test.ts (Phase-8 gate only),
#   dispatch-harness-{acquisition,default-spawn,default-detail,lease}.test.ts,
#   tests/conformance/harness-classification.test.ts,
#   tests/conformance/harness-liveness.test.ts,
#   tests/checks/harness-ci-parity.test.ts,
#   tests/checks/exit-code-literals.test.ts,
#   tests/checks/fixture-privacy.test.ts,
#   tests/structure/harness-imports.test.ts,
#   tests/structure/harness-environment-marker.test.ts,
#   tests/structure/harness-stream-contract.test.ts,
#   tests/structure/harness-review-deferrals.test.ts, and
#   tests/checks/doc-conformance.test.ts (Phase 8 re-runs it as a control).
#   A semantic assertion change in a delivered suite is an escalation trigger.
#
# PRESERVED DELIVERED BEHAVIOUR (binding on every phase): `HARNESS_FAILURE_CODES`
#   stays closed and grows additively (nine delivered codes keep their meaning);
#   `delivery.harness.telemetry.v1` keeps its identity with additive fields only
#   (DEC-4); the six-scenario classification floor and both registrations are
#   unchanged; the deny-by-default spawn environment never widens (RSK-6); the
#   delivered `harness.session.unknown`, `harness.spawn.*`,
#   `harness.capability.gap`, `harness.listing.invalid-output`, and telemetry
#   identities are never renamed or repurposed; the runtime-neutral core reads no
#   ambient environment outside the injected seams; and `spend.telemetry-absent`
#   keeps its delivered meaning.
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`), matching the
#   GH-291/GH-320 precedent (version_impact minor). No dependency addition, no
#   data migration, no state-schema change (spec §19), no backfill.
#
# GATES: every phase gate runs `pnpm typecheck` plus the named suites; the
#   aggregate quality gate is `TMPDIR=$PWD/tmp/tmpdir pnpm check`, and the
#   branch-range commit-message gate is `./scripts/lint-commit-range.sh --base
#   main-tools`. Commits carry conventional subjects (in each phase `summary`)
#   with body and footer lines <= 100 characters. Append `node_modules/.bin` to
#   PATH (never prepend) when a repo-local binary is needed.
#
# COMMIT DISCIPLINE: one commit per phase; `plan validate GH-335` and
#   `lint plan GH-335` before the final phase-mode commit and before the pull
#   request. The pull request targets `main-tools` and stays open (merge
#   authority: CEO).

schemaVersion: delivery.plan.v1
workItemRef: GH-335
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8]
  escalationTriggers:
    - "A second authored copy of the version-window, version-verdict, mode, propagation-record, seat-field, duration-field, or warning-reason vocabulary would exist beside the Phase-2 contract modules (GAP-5)"
    - "`delivery.harness.telemetry.v1` changes identity, a delivered row field is renamed or removed, or a telemetry schema major version is introduced (DEC-4, AC-F5-2)"
    - "Any of the nine delivered harness failure codes is renamed or re-semanted, or a new refusal identity ships without an error-table row, a documented row, and a conformance scenario (RSK-5, AC-F7-2)"
    - "The deny-by-default spawn environment widens: a record name reaches the child environment without a descriptor entry, an ambient or undeclared parent variable is forwarded, or the static configuration allowlist is mutated by profile data (AC-F3-3, RSK-6, OQ-4)"
    - "A version, mode, or profile refusal occurs after a session-bearing process starts, or leaves a live child, an orphan, a telemetry row, or a store write (AC-N1-1, OQ-6)"
    - "The dispatch path falls back between integration modes at runtime, or infers the mode from ambient state instead of the declared configuration value (DEC-2, AC-F2-1)"
    - "The version probe becomes a retry loop, a shell invocation, more than one invocation per dispatch, or unbounded in time (NFR-2, RSK-8)"
    - "A missing duration, cost, token class, seat, or version is fabricated as zero, an estimate, or derived from the capture timestamp instead of being explicitly absent with a warning (NFR-6, AC-F5-4)"
    - "The telemetry read path performs a write, a non-indexed or message/part scan, or widens any of the 64/16/16/24 caps (NFR-3, TC-HARNESS-025)"
    - "The delivered six classification scenarios are renamed, reordered, or removed, or a new scenario is registered on a forked conformance path beside HARNESS_CONFORMANCE_REGISTRY (AC-F7-1, OQ-9)"
    - "Seat attribution becomes a second totals basis, so per-step rows and the session baseline are summed into one figure (RSK-7, TC-HARNESS-026)"
    - "A test needs a live harness process, a real store, a network call, a credential, or the real user state directory, or installs a process-global child-process mock (NFR-10)"
    - "The decision record's chosen mode diverges from the delivered default-mode constant, or a record is authored outside the doc/decisions per-type identifier convention (AC-F2-2, DEC-7, GAP-4)"
    - "An additive attempt-record fact would force a rename of a delivered dispatch record field or a dispatch payload schema bump (TC-HARNESS-040)"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Integration-mode spike, recorded evidence, and the two governing
  # decision records (DEC-2, DEC-7, OQ-1, OQ-2, RSK-1, AC-F2-2, G-8).
  #
  # Goal: retire the two questions that gate every later phase before any
  # governed code exists.
  #   (a) Which integration mode is the delivered default for
  #       `delivery-os`/`jaiship` dispatch — standalone per-spawn CLI
  #       invocation, background service, or direct API — including the
  #       read-only direct-store access the telemetry path needs (OQ-1).
  #   (b) Whether opencode v2.x honours the per-seat model variable family
  #       (`OC_<PREFIX>_AGENT_<SEAT>_MODEL` or an explicit seat `envName`), or
  #       selects models through its own configuration surface (OQ-2, RSK-1).
  #
  # Spike discipline: the observation is read-only. It may run the installed
  # harness's version/help surface, may open the session store read-only with the
  # query-only pragma, and may run at most one bounded per-spawn probe through
  # `tests/conformance/live/harness-probe.ts` — a documented entrypoint modelled
  # on `tests/conformance/live/run-live.ts`, NOT named `*.test.ts`, never
  # discovered by `bun test`, never invoked by `pnpm check` or CI (test plan
  # §4.1 rule 8). No store write, no harness configuration mutation, no
  # credential read, no network call is permitted. Its output is recorded as
  # spike evidence in the change folder and is NEVER an oracle for any TC.
  #
  # Deliverables:
  #  1.1 The mode decision record under `doc/decisions` (next free per-type
  #      identifier), stating the chosen mode among exactly the three declared
  #      modes, the read-only direct-store rationale, `Proposed` status, and the
  #      delivered-default consequence. Its chosen mode names the value the
  #      Phase-2 `DEFAULT_HARNESS_MODE` constant will carry; the record and the
  #      constant are asserted equal by TC-HARNESS-010 in Phase 2.
  #  1.2 The adapters-contract decision record (DEC-7) governing: the supported
  #      window and the two version identities, the mode declaration and its
  #      identity, the propagation contract and its identity, the seat/duration
  #      telemetry fields, and the absence identity. It follows the
  #      TDR-0016/TDR-0021 additive precedent and does not supersede ADR-0008.
  #  1.3 `doc/decisions/00-index.md` rows for both records, and a
  #      `doc/decisions/00-register.md` row under the existing "Harness adapter
  #      contract" topic (ADR-0008) when that binding needs the new records.
  #  1.4 `chg-GH-335-spike-evidence.md` in the change folder: observed harness
  #      version, the per-seat surface verdict (honoured by variables / by its
  #      own configuration / inconclusive with the fallback declared), the
  #      store facts the telemetry path needs, the bounded probe invocation
  #      count, and the exact commands run. If the per-seat surface is NOT the
  #      variable family, the evidence records that finding and the propagation
  #      contract's declared fallback (an explicit seat `envName`) becomes the
  #      pinned route; the plan's Phase 3/4 obligations already cover both
  #      outcomes, so no replan is required.
  #  1.5 `tests/checks/decision-record.test.ts` gains the existence inventory
  #      for both records: file present, `id`/`status` per the convention,
  #      chosen mode inside the three declared modes, read-only direct-store
  #      rationale present, index row present, and the harness feature spec link
  #      recorded (the link itself is reconciled in Phase 8). The
  #      constant-equality assertion lands in Phase 2, which is why
  #      TC-HARNESS-010 is owned there.
  #
  # Gate:
  #   bun test tests/checks/decision-record.test.ts
  #   bun test tests/checks/doc-conformance.test.ts
  #   bun test tests/checks/fixture-privacy.test.ts
  #
  # Suites left green: decision-record (both new records inventoried),
  #   doc-conformance, fixture-privacy.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Integration-mode spike with recorded evidence and the integration-mode and adapters-contract decision records"
    kind: delivery
    summary: "docs(decisions): record the opencode integration mode and contract"
    scope:
      files:
        - doc/decisions/00-index.md
        - doc/decisions/00-register.md
        - tests/checks/decision-record.test.ts
        - tests/conformance/live/harness-probe.ts
      folders:
        - doc/decisions
        - doc/changes/2026-11/2026-11-17--GH-335--opencode-harness-telemetry

  # ---------------------------------------------------------------------------
  # Phase 2 — Contract layer: the five refusal identities, the closed
  # vocabularies, and the additive telemetry fields (F-1..F-7 vocabulary;
  # AC-F2-2, AC-N1-1; OQ-5, GAP-5, RSK-5).
  #
  # Goal: declare every name later phases assert through, in one commit, so no
  # consumer can pin behaviour against a not-yet-declared identity.
  #  2.1 `packages/core/src/contracts/harness.ts`:
  #      - the supported-window data (`2.2` + `2.1` at intake, DEC-1) with its
  #        revisit note, and the accepted version grammar constant;
  #      - the closed version-verdict vocabulary (inside / outside /
  #        indeterminate) and the verdict carrier on `HarnessInstance`
  #        (additive optional members beside the delivered `observedVersion`
  #        and `versionWarning`, which keep their meaning);
  #      - the closed requested-mode vocabulary (standalone service, background
  #        service, direct API), `DEFAULT_HARNESS_MODE` matching the Phase-1
  #        record, and the mode-origin vocabulary (`defaults` / `configured`);
  #      - the per-seat propagation record type (seat identity, declared name,
  #        resolved value) and the mandatory-identity/token field set for the
  #        2.1.x degrade-versus-failed split (OQ-8);
  #      - `HARNESS_FAILURE_CODES` growing by exactly
  #        `harness.version.unsupported`, `harness.version.unknown`,
  #        `harness.mode.unavailable`,
  #        `harness.profile.model-unrepresentable`, and
  #        `harness.telemetry.absent`, with all nine delivered codes untouched.
  #  2.2 `packages/core/src/contracts/harness-telemetry.ts`: additive optional
  #      `seat`, `resolvedModel`, `observedModel`, and `durations`
  #      (start/end/elapsed or explicit absence) on `HarnessTelemetryRecord`,
  #      plus the additive closed warning reasons (model divergence, duration
  #      absence, unresolved seat). `HARNESS_TELEMETRY_SCHEMA_ID` is untouched
