#     obligations. Lifecycle phase 7 (@doc-syncer) VERIFIES that reconciled set;
#     it does not author pages in a later plan phase.
#
# SCOPE CONVENTION: concrete files are exact repository-relative paths; folders
#   are declared by every phase that writes a new file inside them (the commit
#   primitive stages only the declared phase scope, and a standalone commit
#   stages the union of every phase's declared scope). A file edited in two
#   phases is declared in both and each phase states its half; `plan diff`
#   reports the first covering phase, and an untouched declared file is only a
#   `plan diff` observation, never a gate failure. `doc/decisions` is declared as
#   a folder because the two new record filenames carry the next free per-type
#   identifiers (TDR sequence) and must not be pinned by this plan.
#   `tests/structure/content-inventory.test.ts` and `tests/structure/
#   inventory.json` are declared in every phase that adds a package file or an
#   exported value, because the committed inventory pins both the file set and
#   the executable-export allowance per file.
#   CHANGE CAPSULE STAGING: Phase 1 additionally declares the change folder's
#   `doc/changes/2026-11/2026-11-17--GH-335--opencode-harness-telemetry/
#   readiness-review` folder, because the readiness/DoD verdict artifacts live
#   there and a standalone `jaiship commit` stages only the plan scope union (the
#   change folder is not added when a plan exists). Without that declaration a
#   verdict artifact is a stray and the commit fails
#   `commit.staging-blocked-untracked`.
