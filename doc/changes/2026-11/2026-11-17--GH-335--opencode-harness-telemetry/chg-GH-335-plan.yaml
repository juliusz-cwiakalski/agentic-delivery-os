    - "`delivery.harness.telemetry.v1` changes identity, a delivered row field is renamed or removed, a new major version is introduced, or an additive field is dropped before the state append because the payload allowlist was not extended (DEC-4, AC-F5-2, readiness finding 3)"
    - "Any of the nine delivered harness failure codes is renamed or re-semanted, a new refusal identity ships without an error-table row, a documented row, and a registered scenario, the unassigned named agent adds a code of its own instead of reusing `provider.profile.invalid`, or `harness.telemetry.absent` is introduced anywhere in the closed vocabulary, the error table, or a test (RSK-5, DEC-10, AC-F7-2, TDR-0040 C-6)"
    - "The `detail.harness` member grows a fifth member, becomes an open key-value map, is written as `null` where mode resolution has not run, is populated on any identity outside the four new pre-session harness refusals (including the unassigned named agent, whose facts ride the bounded `error.summary`), or is declared without its edge projection, pins, validator, fixture, and documented member sentence in the same phase (TDR-0041, TDR-0040 A-2)"
    - "A binding carries more than one seat, a seat map, or a repeated `--agent`/`--model`, a seat name is sent as `--agent` where it differs from the agent identity, a binding is carried through process-global state, a profile's N seats are collapsed into one spawn, or a role-less spawn binds a seat in any profile shape (DEC-13, TDR-0040 A-1, TC-HARNESS-011/015)"
    - "The caller's agent identity reaches the resolution function from anywhere but the spawn/resume input's declared agent-identity member — an environment variable, a process-global value, ambient state, an argv convention, an empty string read as `no-agent`, or a member added outside Phase 2 — or the binding is resolved before the spawn by a site other than the composition, so the resolution rule has no production call site and only a test-built fixture proves it (DEC-16, AC-F3-1, TC-HARNESS-011/015)"
    - "A named agent that the resolved profile assigns no seat is not refused before the lease claim and the attempt append, or its refusal carries a `detail.harness` member, a new error-table row, or an attempt record (AC-F3-4, NFR-1, M-11, TDR-0040 A-2)"
    - "A recognised-agent or recognised-model catalogue is read, injected, or declared anywhere in the delivery, a second pre-session child process is introduced for a catalogue or a configuration read, or an unknown agent or model is turned into a pre-session refusal (DEC-14, TDR-0040 C-2, AC-N1-1)"
    - "The deny-by-default spawn environment widens, an `OC_*` per-seat variable family is emitted on a harness that does not consume it, a record name reaches the child environment without a declaration, an ambient parent variable is forwarded, or the static allowlist is mutated by profile data (AC-F3-3, NG-10, RSK-6, DEC-8)"
    - "A version, mode, or profile refusal occurs after a session-bearing process starts or after a lease is claimed, or leaves a live child, an orphan, a telemetry row, a store write, or an attempt record (AC-N1-1, NFR-1)"
    - "The version probe becomes a retry loop, a shell invocation, more than one invocation per dispatch, unbounded in time, resolves from a second production construction site, or the resolver calls it without the declared deadline and the injected clock (NFR-2, DEC-11, §4.4a, TC-HARNESS-046)"
    - "An additive surface is taken as an argument value rather than an environment variable on opencode, or the dispatch path falls back between integration modes at runtime or infers the mode from ambient state instead of the declared configuration value (DEC-2, DEC-8, AC-F2-1)"
    - "The configured opencode store location is left pointing at a path no observed install has, the `harness.stores.opencode.databasePath` default and the `OPENCODE_DB` override are not both honoured through the injected configuration environment layer, or an absent resolved path is treated as a clean empty capture instead of a classified outcome (spec §7.1, AC-F5-5, RSK-9)"
    - "A store read assumes a work-item column, a separate harness-version column, a per-message token/agent/model/cost column, or a `part.tool` column, performs a store-wide scan, or attributes a session by title, directory, or a store-wide search (DM-8, DM-10, NG-11, AC-F5-5)"
    - "A capture attributes rows by a work-item query instead of the union of the session identities and recorded bindings across every dispatch attempt recorded for the work item, an attempt that recorded no identity is dropped silently instead of being disclosed as a counted unattributed attempt, an empty union is reported as an empty success instead of the delivered `skipped-gap`/`session-attribution-unavailable` outcome, a binding crosses to another attempt's identities, or the seat is re-derived at capture time from the current profile instead of cited from the recording attempt's binding (DM-8, AC-F5-5, TDR-0040 revisit trigger)"
    - "A `packages/core/src/contracts/*.ts` export is added or renamed without appending the name to `tests/fixtures/ports/v1-contract-inventory.json` in the same phase and running `tests/structure/port-contract-inventory.test.ts` in that phase's gate, so a phase can be declared green while the bidirectional inventory is red (readiness finding 4)"
    - "A zero-row capture for a session the dispatch ran and the store can read is reported as a pass, as absence, or as an empty success; absence is reused for damage or damage for absence (AC-F5-1, AC-F6-2, DEC-9)"
    - "A seat is claimed for a group whose observed agent differs from the binding's agent, or an unbound run's row carries anything but a null seat with `unresolved-seat` (AC-F5-1, AC-F5-3, TDR-0040 decision 4)"
    - "A missing duration, cost, token class, seat, version, observed agent, or observed model is fabricated as zero, an estimate, an empty identity read as a real one, a neighbour group's identity, or derived from the capture timestamp instead of being explicitly absent with a warning, a store-reported zero is converted into absence, or an absent observed axis drops a usage-bearing row instead of landing it with the declared absence marker (NFR-6, AC-F5-4, AC-F5-1)"
    - "An absent observed agent or model is handled by widening the delivered non-null `agent`/`model` to nullable, by a fabricated or neighbouring identity, by `invalid-session-identity`, by a marker naming an axis other than the absent one, by a warning naming a different axis than the marker, or by a seat claimed for a group whose observed agent is unstated instead of the null seat with `unresolved-seat` (AC-F5-7, AC-F5-1, DEC-4)"
    - "The telemetry read path performs a write, a non-indexed or message/part full scan, or widens any of the 64/16/16/24 caps (NFR-3, TC-HARNESS-025)"
    - "The delivered six classification scenarios are renamed, reordered, or removed, the extension constant widens the floor constant, the propagation scenario does not assert one pair per invocation, or the extension is registered or executed through a second conformance path beside the delivered registry and its additive executor (AC-F7-1, TC-HARNESS-031/032/033)"
    - "Seat attribution becomes a second totals basis, so per-step rows and the session baseline are summed into one figure, or the seat becomes a spend breakdown dimension beside the delivered `role` (RSK-7, TC-HARNESS-026)"
    - "A test needs a live harness process, a real store, a network call, a credential, the real user state directory, or a process-global child-process mock, or the human-gated live observation is read as an oracle by a test or a gate (NFR-10, AC-F5-6)"
    - "The decision record's chosen mode diverges from the delivered default-mode constant, a record is authored outside the doc/decisions per-type identifier convention, a record ships without the R2 body its review requires, or a record is authored and claimed reviewed with no independent review artifact in the change folder (AC-F2-2, DEC-7, GAP-4, DoD clause 10)"
    - "A semantic assertion change is needed in a delivered suite this plan does not declare in a phase scope, or an additive attempt-record fact would force a rename of a delivered dispatch record field or a dispatch payload schema bump (TC-HARNESS-040, TDR-0041, TDR-0040 C-4/C-5)"
