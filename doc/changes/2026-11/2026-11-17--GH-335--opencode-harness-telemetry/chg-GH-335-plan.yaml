  # ---------------------------------------------------------------------------
  # Phase 2 — Contract layer: four refusal identities, the closed vocabularies,
  # the single-seat binding type, BOTH additive optional input members (the
  # caller's agent identity and the binding), the additive telemetry fields, and
  # the declared failure-envelope evidence member (F-1..F-7 vocabulary; AC-F2-2
  # content half, AC-N1-1 identity half, AC-F5-7 no-widening half; OQ-5, OQ-8,
  # OQ-10, GAP-5, RSK-5, DEC-13, DEC-16, TDR-0041 C-1..C-6, TDR-0040
  # C-1..C-6).
  #
  # Goal: declare every name later phases assert through, in one commit, so no
  # consumer pins behaviour against a not-yet-declared identity and the closed
  # evidence slot cannot silently drop the new member.
  #  2.1 `packages/core/src/contracts/harness.ts`:
  #      - the pinned supported-window data with the rule it applies (DEC-1):
  #        the current minor line at delivery time plus one previous minor, whose
  #        value at delivery is `2.3.x` + `2.2.x` (the installed
  #        `opencode v2.3.2`; the intake pass applied the same rule as `2.2.x` +
  #        `2.1.x` from `v2.2.5`). `2.2.5` stays an IN-WINDOW input so a real
  #        observed line still proves the accepting direction beside a real
  #        out-of-window one (`2.1.x`), and the constant carries its revisit note;
  #      - the accepted probe-output grammar constant (product token, optional
  #        `v`, three-part semver, newline-terminated) and the normalization
  #        rule as the SINGLE home of the pattern (DEC-11, AC-F1-5);
  #      - the pinned probe seam types (OQ-10, §4.4a):
  #        `HARNESS_VERSION_PROBE_TIMEOUT_MS = 5000`,
  #        `HarnessVersionProbeOutcome` (`answered` with stdout, or `timed-out`);
  #      - the closed version-verdict vocabulary (inside/outside/indeterminate)
  #        and the additive optional verdict/origin carriers on `HarnessInstance`
  #        beside the delivered `observedVersion` and `versionWarning`, which keep
  #        their meaning;
  #      - the closed requested-mode vocabulary with its observed surface per
  #        member, `DEFAULT_HARNESS_MODE` matching the Phase-1 record, and the
  #        mode-origin vocabulary (`defaults` / `configured`);
  #      - TDR-0040's binding type: EXACTLY ONE seat — the agent identity the
  #        binding was resolved for, the seat name, and that seat's resolved
  #        model in `provider/model#variant` form — never a seat map, plus the
  #        optional declared variable name for a harness that consumes
  #        variables;
  #      - BOTH ADDITIVE OPTIONAL INPUT MEMBERS, declared HERE together (DEC-16,
  #        TDR-0040 A-4, DM-4, F-3's "Carrier"): (a) the caller's AGENT IDENTITY,
  #        its own member distinct from the binding member — the value the pure
  #        resolution function is called with and the value expressed as
  #        `--agent` only through the resolved binding — whose ABSENCE is the
  #        `no-agent` state (never an empty string, never an inferred value, never
  #        an environment variable, a process-global value or ambient state); and
  #        (b) the BINDING its resolution produces (`binding`), supplied as
  #        per-spawn data. Both sit on `HarnessSpawnInput` and
  #        `HarnessResumeInput` and both are optional, so every delivered call
  #        site keeps compiling and the shipped generic `dispatch` sets neither
  #        (DEC-15);
  #      - PHASE RULE — THE HARNESS CONTRACT SURFACE IS DECLARED ONCE, HERE
  #        (DEC-16, TDR-0040 A-4): both members are declared in this one commit,
  #        and no later phase (3, 4, 5, 6, 7, 8) adds a member to the HARNESS
  #        CONTRACT SURFACE this phase declares
  #        — `packages/core/src/contracts/harness.ts`,
  #        `packages/core/src/contracts/harness-telemetry.ts`, and
  #        `packages/core/src/contracts/result.ts`, including the two harness
  #        port inputs `HarnessSpawnInput`/`HarnessResumeInput`. Phase 3 consumes
  #        the members in its pure signature and Phase 4 reads the agent identity
  #        off the input and supplies the resolved binding on its sibling member.
  #        THE RULE IS SCOPED TO THAT SURFACE, NOT TO EVERY
  #        `packages/core/src/contracts/*.ts` TYPE: the DISPATCH ATTEMPT RECORD
  #        (`packages/core/src/contracts/dispatch.ts`) owns its own additive
  #        members under its own declared scope — Phase 5 lands the attribution
  #        facts (5.6) and Phase 7 lands the verdict/mode/origin facts (7.1) — and
  #        those are permitted, are attempt-record facts rather than port-input
  #        members, and never reopen this phase. A later phase needing another
  #        HARNESS PORT-INPUT member, or any other member on the three harness
  #        surface modules, reopens this phase; declaring it under a scope this
  #        phase does not own would ship an undeclared contract change (the commit
  #        primitive stages declared scope only) and would leave the resolution rule
  #        provable again only from a fixture the test itself built — the vacuity
  #        class this declaration closes;
  #      - the closed resolution-outcome vocabulary `binding` / `no-agent` /
  #        `unassigned` (TDR-0040 decision 2, A-1, A-2) and the expressibility
  #        predicate's shape (a non-empty provider and model segment, one variant
  #        separator at most, no whitespace or control characters, within the
  #        adapter's declared bound) — DEC-6 narrowed by DEC-14: NO catalogue,
  #        no supplier, no child process;
  #      - the additive optional per-spawn environment context on
  #        `HarnessEnvironmentBuilder`, so a variable-consuming harness receives
  #        the declared record map for that spawn and the delivered descriptor
  #        path is unchanged;
  #      - the mandatory-field-set constants for the OQ-8 degrade-versus-failed
  #        split and the closed absence/degradation/failure reason constants;
  #      - `HARNESS_FAILURE_CODES` growing by exactly four codes —
  #        `harness.version.unsupported`, `harness.version.unknown`,
  #        `harness.mode.unavailable`,
  #        `harness.profile.model-unrepresentable` — with all nine delivered
  #        codes untouched, NO telemetry-absence code, and NO code for the
  #        unassigned agent (it reuses `provider.profile.invalid`).
  #  2.2 `packages/core/src/contracts/harness-telemetry.ts`: additive optional
  #      `seat`, `resolvedModel`, and `durations` (start/end/elapsed or explicit
  #      absence) on `HarnessTelemetryRecord`, the additive closed warning reasons
  #      (model divergence, agent divergence, version drift, duration absence,
  #      unresolved seat, no tool source, cost missing, non-numeric value), and the
  #      absence/failed-session reason constants. `HARNESS_TELEMETRY_SCHEMA_ID` is
  #      untouched (DEC-4) and the five-token-class set is unchanged. The
  #      unresolved-seat reason is the one a null seat cites; TDR-0040 A-3 leaves
  #      the literal names to this module.
  #      NO DUPLICATE OF A PRESENT FACT: no `observedModel` member is added and
  #      nothing is renamed. The delivered `agent` and `model` members ARE what
  #      TDR-0040 A-3 calls `agentRole` and `observedModel` — the harness-reported
  #      agent and the observed model — and `sameSessionGroup` already keys on
  #      them; Phase 5.1 reads them and Phase 5.5 persists them, and no second
  #      field carries either identity under the unchanged schema identity.
  #      OBSERVED-IDENTITY ABSENCE is stated once, in this declared order:
  #      (i) the per-message group value is the source (the group key is that
  #      observed `agent`/`model` pair); (ii) a group that states no value for an
  #      axis falls back to the session row's baseline value for that axis;
  #      (iii) only when neither states it, the row still lands (the mandatory set
  #      is the session identity plus one observable usage fact, not the identity
  #      axis — OQ-8) and the absence is carried by exactly ONE additive optional
  #      member, `absentObservedAxes` over the closed `agent` | `model` vocabulary
  #      (omitted when both axes are observed, never empty, never duplicated; the
  #      contract module owns the literal name and this plan states the shape and
  #      its one-member rule),
  #      with the delivered `optional-field-absent` warning naming the same axis
  #      (`field: "agent"` / `field: "model"`). Because the delivered `agent`/
  #      `model` are non-null and DEC-4 forbids a delivered-field change, an
  #      absent axis holds the declared empty-string placeholder — a placeholder
  #      that names no identity, never a fabricated or neighbouring model — while
  #      `absentObservedAxes` is the machine-readable absence signal, so the store
  #      rows that state neither identity — the observation is in the tens of
  #      null agents and ~500 null models and grows with every intake pass (484 at
  #      intake, 502 at delivery; the figures are observations, not fixture
  #      constants) — are representable and
