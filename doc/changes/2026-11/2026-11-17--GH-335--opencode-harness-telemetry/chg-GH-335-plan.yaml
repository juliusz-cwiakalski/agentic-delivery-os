  #      contract (DEC-9), and the absence taxonomy (DEC-10). It references
  #      TDR-0031 and TDR-0032 rather than restating or re-deciding them, does not
  #      supersede ADR-0008, and follows the TDR-0016/TDR-0021 additive
  #      precedent.
  #  1.4 TDR-0031 and TDR-0032 are staged in this change: both record files are
  #      committed with their index rows and their `Proposed` status preserved
  #      (TDR-0031's member is delivered in Phase 2 and its behaviour proof in
