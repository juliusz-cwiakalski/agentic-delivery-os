#
# TEST-PLAN HANDOFF RESOLUTIONS (OQ-4..OQ-12 and the GAPs; each states its
#   default verbatim and names the phase where it becomes code, so the coder
#   never re-decides):
#   OQ-4  The binding record is the contract and the harness surface is the
#         mapping (DEC-8). On opencode the binding travels as invocation data
#         (`--agent`, `--model provider/model#variant`); NO `OC_*` variable is
#         invented and the child environment key set stays exactly the declared
#         allowlist (AC-F3-3, NG-10). For a harness that consumes variables, the
#         allowlist must declare the name (an explicit seat `envName` or the
#         derived `OC_<PREFIX>_AGENT_<SEAT>_MODEL`) and the delivery supplies its
#         declared value through the per-spawn record map; an undeclared record
#         name changes nothing. Pure derivation and the surface mapping land in
#         Phase 3; the composed wiring lands in Phase 4.
#   OQ-5  Refusal projection is DECIDED: `harness.version.unsupported`,
#         `harness.version.unknown`, `harness.mode.unavailable`, and
#         `harness.profile.model-unrepresentable` are `user-validation`, exit 1;
#         an unknown `harness.mode` value is the delivered
#         `config.value.invalid` (user-validation, exit 1) with NO
#         `detail.harness` member; `harness.telemetry.extraction-failed` keeps
#         the delivered `platform-provider`. Exactly FOUR rows join the error
#         table (M-01, M-02, M-03, M-05); M-04 (`config.value.invalid`) reuses
#         its delivered row and adds none; there is no telemetry-absence
#         identity and no new exit literal (DEC-10). Phase 2 declares the rows;
#         Phase 4 produces the refusals.
#   OQ-6  Closed by the spec: "no session-bearing child process; the single
#         bounded version probe is the declared exception — at most one per
#         dispatch, completed and reaped before the verdict". TC-HARNESS-036
#         asserts exactly that reading (probe calls <= 1), never zero children.
#   OQ-7  Attach is the bounded read-only `listSessions` lookup followed by
#         `resume`; no `HarnessSessionPort` member is added. Phase 4 owns it.
#   OQ-8  The mandatory set is the session identity the dispatch holds plus at
#         least one observable usage fact (a token class or a cost) for that
#         session. Present → every missing optional field degrades with a
#         closed-vocabulary warning and an explicit absence; absent for a
#         session the store holds → exactly one failed-session entry with a
#         closed reason; a session the store does not hold → absence. The
#         constants are declared in Phase 2 and asserted in Phase 5
#         (TC-HARNESS-044).
#   OQ-9  Version, mode, and propagation facts reach conformance through the
#         additive executor's injected `io`/`deps` surface
#         (`runHarnessConformanceScenario`-shaped), beside the unchanged
#         registry `build`. Extension ids are exactly four and are declared on
#         the extension constant; the floor constant keeps exactly the six
#         delivered ids. One registry path, no fork, no live resolution from a
#         scenario. Phase 6 owns it.
#   OQ-10 The delivered `HarnessVersionProbe = () => Promise<string>` is
#         REPLACED (single production seam, §4.4a):
#         `HarnessVersionProbe = (input: {deadlineMs: number; now: () => number})
#         => Promise<HarnessVersionProbeOutcome>` with
#         `HARNESS_VERSION_PROBE_TIMEOUT_MS = 5000` as the only home of the
#         bound. The resolver passes the deadline and the injected clock exactly
#         once; the production probe hands that bound to the runner's
#         `timeout:` option; `timed-out` and a rejected answer are
#         `indeterminate`. Declared in Phase 2 (contract), applied in Phase 3
#         (registry), wired in Phase 4 (production). Wall-clock duration stays a
#         reference measurement, never a CI threshold (GAP-3).
#   OQ-11 The recognised-model catalogue is INJECTED read-only data read from the
#         harness's own declared agent/model configuration at resolution; no
#         network, no store write, no ambient read. It is a parameter of the
#         representability check (Phase 3) and of the unrepresentable-seat
#         fixtures (Phase 4).
#   OQ-12 Four extension scenario ids with `version-window` asserting both
#         directions (inside proceeds AND outside refuses) and failing if either
#         is wrong; the identity->scenario map is total over the four new
#         identities (Phase 6).
#   GAP-5 Field names, warning-reason constants, mode/verdict vocabularies, the
#         grammar constant, and the mandatory-field-set constants are declared
#         ONCE in the Phase-2 contract modules; no suite asserts an inline
#         literal beyond the identities the spec pins verbatim.
#   GAP-1 (test plan §1.2) is closed by the TC -> PHASE MAP above: no oracle,
#         identity, exit, bound, or AC/NFR mapping is reshaped by this plan.
#   GAP-3 (wall-clock probe bound) stays a reference measurement recorded in the
#         test plan's execution log; the CI assertion is the seam's deadline
#         argument (Phase 4).
#   GAP-4 (human-gated record) is the Phase-8 live-observation record; the
#         records themselves stay `Proposed` until the PR review decides them.
#   GAP-6 (the 2.1.x store generation is unobserved) is handled by the two
#         observed generations plus a classified outcome for an unrecognised
#         one (Phase 5, TC-HARNESS-028/024).
#   GAP-7 (the probe grammar is observed on one harness line) is handled by the
#         explicit unknown-version refusal, never a silent pass (Phase 3/4).
#
# PHASE ORDER AND INDEPENDENT VERIFIABILITY (each phase is one commit, green at
#   its own boundary, committed through the commit primitive against the declared
#   scope; every phase names the TCs it satisfies and the command that proves it):
#   Phase 1 lands the two governing decision records (mode + adapter contract),
#     stages TDR-0031, and records the change-side links before any governed code
#     exists, matching spec §18 ("the record precedes the code it governs") and
#     AC-F2-2. Its spike is narrow: the mode surfaces and the store/probe facts
#     are already observed (Appendix C), so only the mode choice and the contract
#     recording remain.
#   Phase 2 declares every identity and vocabulary the later phases assert
#     through, lands the four error rows with their documented counterparts, and
#     lands the whole `detail.harness` evidence channel (contract, edge
#     projection, pins, validator, fixture, documented member sentence) so no
#     consumer can pin behaviour against a not-yet-declared name and the closed
#     slot cannot silently drop the new member.
#   Phase 3 lands the pure evaluation: window parsing/normalization/comparison,
#     the pinned-window policy with no configuration key, mode resolution with
#     its origin, the per-seat binding record with its representability refusal,
#     and the registry carrying one verdict plus the resolved mode. No adapter,
#     no process, no store, no ambient read.
#   Phase 4 lands the dispatch path: the single production probe point, the
#     version gate before any session, mode selection with no runtime fallback,
#     per-spawn binding carried as data and mapped onto the invocation surface,
#     resume/attach under the same contract, and the four refusal paths with
#     their `detail.harness` facts — all over injected doubles.
#   Phase 5 lands telemetry from the observed store contract: attribution by the
#     held session identity, the session record's own version, seat and both
#     models, store-sourced durations, the four-way absence taxonomy, the
#     bounded read discipline, the corrected state-layer payload allowlist, and
#     the store-location reconciliation.
#   Phase 6 lands conformance and the cross-cutting battery: the floor/extension
#     split with the additive executor, refusal side-effect freedom, mutants,
#     determinism, bounds, privacy, and offline hermeticity.
#   Phase 7 lands the success-side recorded disclosure (attempt facts) and proves
#     the new gate work leaves the delivered stream, handle acquisition, output
#     bounds, and audit behaviour undisturbed.
#   Phase 8 reconciles the current-truth documentation, records the human-gated
#     live observation, stages the changeset, and declares the release
#     obligations. Lifecycle phase 7 (@doc-syncer) VERIFIES that reconciled set;
#     it does not author pages in a later plan phase.
#
# SCOPE CONVENTION: concrete files are exact repository-relative paths; folders
#   are declared by every phase that writes a new file inside them (the commit
#   primitive stages only the declared phase scope). A file edited in two phases
#   is declared in both; `plan diff` reports the first covering phase, and an
#   untouched declared file is only a `plan diff` observation, never a gate
#   failure. `doc/decisions` is declared as a folder because the two new record
#   filenames carry the next free per-type identifiers (TDR sequence) and must
#   not be pinned by this plan. `tests/structure/content-inventory.test.ts` and
#   `tests/structure/inventory.json` are declared in every phase that adds a
#   package file or an exported value, because the committed inventory pins both
#   the file set and the executable-export allowance per file.
#   NO PHASE EDITS `chg-GH-335-spec.md`, `chg-GH-335-test-plan.md`, or
#   `readiness-review/**`: a correction there is a spec/test-plan revision, not a
#   delivery edit.
#
# OWNED UPDATES THAT REPLACE A DELIVERED STORE SHAPE (explicit, so the reviewer
#   can see why they are not escalation triggers): DM-10, DEC-9, and §17.2
#   clause 2 require every extraction fixture to derive from the observed store
#   contract, so the delivered fixtures and the four suites that assert the
#   synthetic shape MUST change: `tests/fixtures/harness/opencode-store/build.ts`
#   (rebuilt as the shared seeding layer over the two observed generations),
#   `tests/behaviour/harness-telemetry-shape.test.ts`,
#   `tests/behaviour/harness-telemetry-opencode.test.ts`,
#   `tests/behaviour/harness-telemetry-opencode-orphan-scope.test.ts`, and
#   `tests/behaviour/harness-telemetry-drift.test.ts`. Their no-warning and
#   orphan-scope assertions cannot survive a store with no work-item column, no
#   harness-version column, and no populated tool source. Phase 5 owns all of
#   them; no other delivered suite is edited in Phase 5, and the builder keeps
#   its exported names and option shape so the six remaining importer suites and
#   the golden regenerator compile unchanged.
#
# DECLARED CONTROLS, NOT EDITS: the delivered suites below are re-run in phase
#   gates as controls and are NOT edited, so none is declared in a phase scope:
#   tests/behaviour/harness-spawn-env.test.ts,
#   harness-spawn-credential.test.ts, harness-default-path.test.ts,
#   harness-opencode-session.test.ts, harness-opencode-stream.test.ts,
#   harness-opencode-resume-stream.test.ts, harness-host-stream.test.ts,
#   harness-stream-hygiene.test.ts, harness-config.test.ts,
#   harness-oneshot-context.test.ts, harness-telemetry-claude.test.ts,
#   harness-telemetry-claude-budget.test.ts,
#   harness-closeout-capture.test.ts, harness-closeout-idempotency.test.ts,
#   harness-closeout-nongating.test.ts,
#   dispatch-harness-acquisition.test.ts, dispatch-harness-default-spawn.test.ts,
#   dispatch-harness-default-detail.test.ts, dispatch-harness-lease.test.ts,
#   tests/conformance/harness-classification.test.ts,
#   tests/conformance/harness-liveness.test.ts,
#   tests/checks/harness-ci-parity.test.ts,
#   tests/checks/exit-code-literals.test.ts (must STAY green),
#   tests/checks/fixture-privacy.test.ts,
#   tests/structure/harness-imports.test.ts,
#   tests/structure/harness-environment-marker.test.ts,
#   tests/structure/harness-stream-contract.test.ts,
#   tests/structure/harness-review-deferrals.test.ts, and
#   tests/checks/doc-conformance.test.ts (Phase 8 re-runs it as a control).
#   `tests/behaviour/harness-output-bounds.test.ts` is NOT in this list: Phase 6
#   OWNS its update (NFR-4 measurement on the new refusal renders) and Phase 8
#   re-runs it. A semantic assertion change in a delivered suite that this plan
#   does not declare in a phase scope is an escalation trigger.
#
# PRESERVED DELIVERED BEHAVIOUR (binding on every phase): `HARNESS_FAILURE_CODES`
#   stays closed and grows by exactly four codes (the nine delivered codes keep
#   their meaning); `delivery.harness.telemetry.v1` keeps its identity with
#   additive fields only (DEC-4); the six-scenario classification floor and both
#   registrations are unchanged; the deny-by-default spawn environment never
#   widens and no `OC_*` family is invented (RSK-6, NG-10); the delivered
#   `harness.session.unknown`, `harness.spawn.*`, `harness.capability.gap`,
#   `harness.listing.invalid-output`, and the delivered
#   telemetry identities are never renamed or repurposed; `spend.telemetry-absent`
#   keeps its delivered meaning and no command, verb, or exit projection is added
#   for telemetry (DEC-10, NG-9); the runtime-neutral core reads no ambient
#   environment outside the injected seams; a pre-session refusal still appends
#   no attempt record.
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`), matching the
#   GH-291/GH-320 precedent (version_impact minor). No dependency addition, no
#   data migration, no state-schema change (spec §19), no backfill.
#
# GATES: every phase gate runs `pnpm typecheck` plus the named suites; the
#   aggregate quality gate is `TMPDIR=$PWD/tmp/tmpdir pnpm check`, and the
#   branch-range commit-message gate is `./scripts/lint-commit-range.sh --base
#   main-tools`. Commits carry conventional subjects (in each phase `summary`)
#   with body and footer lines <= 100 characters. Append `node_modules/.bin` to
#   PATH (never prepend) when a repo-local binary is needed.
#
# COMMIT DISCIPLINE: one commit per phase; `plan validate GH-335` and
#   `lint plan GH-335` before the final phase-mode commit and before the pull
#   request. The pull request targets `main-tools` and stays open (merge
#   authority: CEO).

