# TEST-PLAN HANDOFF RESOLUTIONS (OQ-4..OQ-12 and the GAPs; each states its
#   default verbatim and names the phase where it becomes code, so the coder
#   never re-decides):
#   OQ-4  The binding record is the contract and the harness surface is the
#         mapping (DEC-8, TDR-0032). On opencode the binding travels as
#         invocation data (`--agent <agent>`, `--model provider/model#variant`,
#         exactly one of each); NO `OC_*` variable is invented and the child
#         environment key set stays exactly the declared allowlist (AC-F3-3,
#         NG-10). For a harness that consumes variables, the allowlist must
#         declare the name (an explicit seat `envName` or the derived
#         `OC_<PREFIX>_AGENT_<SEAT>_MODEL`) and the delivery supplies its declared
#         value through the per-spawn record map; an undeclared record name
#         changes nothing. Pure resolution and the surface mapping land in
#         Phase 3; the composed wiring lands in Phase 4.
#   OQ-5  Refusal projection is DECIDED: `harness.version.unsupported`,
#         `harness.version.unknown`, `harness.mode.unavailable`, and
#         `harness.profile.model-unrepresentable` are `user-validation`, exit 1;
#         an unknown `harness.mode` value is the delivered
#         `config.value.invalid` (user-validation, exit 1) with NO
#         `detail.harness` member; `harness.telemetry.extraction-failed` keeps
#         the delivered `platform-provider`; the unassigned named agent reuses
#         the delivered `provider.profile.invalid` (M-11) and adds no row.
#         Exactly FOUR rows join the error table (M-01, M-02, M-03, M-05); M-04
#         and M-11 reuse delivered rows; there is no telemetry-absence identity
#         and no new exit literal (DEC-10). Phase 2 declares the rows; Phase 4
#         produces the refusals.
#   OQ-6  Closed by the spec: "no session-bearing child process; the single
#         bounded version probe is the declared exception — at most one per
#         dispatch, completed and reaped before the verdict". TC-HARNESS-036
#         asserts exactly that reading (probe calls <= 1), never zero children.
#   OQ-7  Attach is the bounded read-only `listSessions` lookup followed by
#         `resume`; no `HarnessSessionPort` member is added. Phase 4 owns it.
#   OQ-8  The mandatory set is the session identity the dispatch holds plus at
#         least one observable usage fact (a token class or a cost) for that
#         session. Present → every missing optional field degrades with a
#         closed-vocabulary warning and an explicit absence; absent for a
#         session the store holds → exactly one failed-session entry with a
#         closed reason; a session the store does not hold → absence. The
#         constants are declared in Phase 2 and asserted in Phase 5
#         (TC-HARNESS-044).
#   OQ-9  Version, mode, and propagation facts reach conformance through the
#         additive executor's injected `io`/`deps` surface
#         (`runHarnessConformanceScenario`-shaped), beside the unchanged registry
#         `build`. Extension ids are exactly four and are declared on the
#         extension constant; the floor constant keeps exactly the six delivered
#         ids. The propagation scenario asserts one `--agent`/`--model` pair per
#         invocation and one seat per spawn (an invocation carrying two of either
#         fails). One registry path, no fork, no live resolution from a scenario,
#         and no catalogue input: the injected facts are the probe outcome, the
#         requested mode, the resolved binding and a store row set. Phase 6 owns
#         it.
#   OQ-10 The delivered `HarnessVersionProbe = () => Promise<string>` is
#         REPLACED (single production seam, §4.4a):
#         `HarnessVersionProbe = (input: {deadlineMs: number; now: () => number})
#         => Promise<HarnessVersionProbeOutcome>` with
#         `HARNESS_VERSION_PROBE_TIMEOUT_MS = 5000` as the only home of the
#         bound. The resolver passes the deadline and the injected clock exactly
#         once; the production probe hands that bound to the runner's `timeout:`
#         option; `timed-out` and a rejected answer are `indeterminate`. Declared
#         in Phase 2 (contract), applied in Phase 3 (registry), wired in Phase 4
#         (production). Wall-clock duration stays a reference measurement, never
#         a CI threshold (GAP-3). Phase 6 pins the single construction site
#         (TC-HARNESS-046).
#   OQ-11 CLOSED by DEC-14 and TDR-0032: there is NO recognised-agent or
