#       builder `workItemRef` option retires; the fixture seeds the run record
#       instead), and `tests/checks/harness-mutants.test.ts` (its four extractor
#       call sites supply the held identity; Phase 6 extends its mutant list).
#       Phase 5 owns them and gates them.
#   (c) TDR-0032 requires the run's recorded binding and the held session
#       identities on the delivered attempt record, so
#       `packages/core/src/contracts/dispatch.ts`,
#       `packages/core/src/app/dispatch.ts`,
