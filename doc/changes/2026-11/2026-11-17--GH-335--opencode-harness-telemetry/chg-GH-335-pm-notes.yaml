  - text: "Decision recorded: TDR-0032 (R2, Proposed — human decides at PR review).
      One spawn binds exactly one seat; N seats are N spawns, N sessions, N row
      sets; the seat resolves from the spawn's agent identity; exactly one
      --agent (the agent identity, never the seat name) and one --model per
      invocation; the run's recorded binding supplies seat and resolved model
      beside the store's observed agent and model. Amended (A-1/A-2/A-3) so a
      role-less spawn binds nothing at any seat count, the unassigned-agent
      refusal discloses through the bounded error summary and remediation hint
      with no envelope member and no new identity, and the field literals are
      contract obligations rather than copied names."
    type: decision
    date: "2026-11-18"
