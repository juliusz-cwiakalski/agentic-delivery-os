notes:
  - text: "Scope source: ticket body GH-335 (M3-S1) + blueprint
      doc/planning/oss-tooling/milestones/m3/ (README.md, architecture.md,
      contracts.md, test-scenarios.md TC-M3-HARNESS-001/002) + backlog.md
      M3-S1."
    type: info
    date: "2026-11-17"
  - text: "Ticket AC: dispatch through the installed harness port runs with the
      resolved profile; telemetry rows land with schema version and per-seat
      models; unsupported versions refuse with a typed error; integration-mode
      decision recorded. Depends on M1-S11 and M2-S14 (both delivered)."
    type: info
    date: "2026-11-17"
  - text: "Cross-check vs system spec: doc/spec/features/feature-harness-adapters.md
      is current truth for the harness seam — HarnessInstance (kind,
      observedVersion, capability declaration), HarnessSessionPort
      (spawn/deliver/resume/collect/classify/liveness/listSessions), opencode
      streaming JSONL adapter, deny-by-default spawn environment with optional
      profile record map, read-only bounded telemetry extraction into
      delivery.harness.telemetry.v1, conformance registry with exactly two
      harnesses and a six-scenario classification floor. Change must extend
      these additively."
    type: info
    date: "2026-11-17"
  - text: "Gap G1 (version window): observedVersion is injected and probe failure
      yields version-probe-failed, but there is no supported-window evaluation
      and no typed refusal. m3/contracts.md declares
      harness.version.unsupported; HARNESS_FAILURE_CODES has no such identity.
      AC and EC-1 require the typed refusal."
    type: info
    date: "2026-11-17"
  - text: "Gap G2 (per-spawn model propagation):
      packages/core/src/provider/profile-env-record.ts derives per-seat model
      env record names (OC_<PREFIX>_AGENT_<SEAT>_MODEL). Plan must confirm the
      record map reaches the spawn descriptor for opencode v2.x and that the
      resolved profile is authoritative per spawn, or declare a typed refusal
      where it cannot be."
    type: info
    date: "2026-11-17"
  - text: "Gap G3 (integration mode): opencode v2.2.5 on PATH exposes
      run/session/service/serve/api/--standalone and a local store
      (~/.local/share/opencode/opencode.db). No integration-mode decision record
      exists in doc/decisions. The spike and its record are in-change work; an
      adapter-contract change also owes a decision record per the repo rule."
    type: info
    date: "2026-11-17"
  - text: "Gap G4 (telemetry under v2.x): extraction exists over the opencode store
      with schema delivery.harness.telemetry.v1 and per-record model identity;
      v2.x store shape, per-seat model attribution, and version stamping must be
      verified and pinned, without a schema break (OQ-M3-07: additive only)."
    type: info
    date: "2026-11-17"
  - text: "Gap G5 (conformance): the conformance registry covers the six-scenario
      classification floor for two harnesses but has no version-window refusal
      scenario and no opencode v2.x profile-propagation case; AC requires
      conformance against the harness port."
    type: info
    date: "2026-11-17"
  - text: "Open question Q-06 (opencode version window) in GH-342 is unanswered; its
      stated default therefore applies: current minor line at delivery time plus
      one previous minor, unsupported versions refuse with a typed error.
      Observed harness version at intake: opencode v2.2.5."
    type: info
    date: "2026-11-17"
  - text: "No contradiction requiring human input found: M3 keeps opencode as the
      only delivery harness while the delivered claude-code adapter stays
      registered as a generated-artifact/harness surface and is simply not
      extended in this change. Blueprint wording 'degrade with a typed refusal'
      (README) and 'refuse with a typed error' (ticket AC) resolve to a typed
      refusal."
    type: info
    date: "2026-11-17"
  - text: "Anticipated doc impacts for phase 7:
      doc/spec/features/feature-harness-adapters.md (version window, typed
      refusal, profile propagation, v2.x integration mode), possibly a new
      feature spec section for integration mode, doc/decisions/<TDR>-* for the
      integration-mode and adapter-contract decisions, and
      doc/planning/oss-tooling milestone status markers."
    type: info
    date: "2026-11-17"
  - text: "Delivery conventions from ticket: full 11-phase lifecycle; plan phases
      declared in plan.yaml; commits through the commit primitive with
      conventional subjects and body/footer lines <= 100 chars; gate commands
      recorded in pm-notes MUST use TMPDIR=$PWD/tmp/tmpdir; PR targets
      main-tools and stays open (merge authority: CEO)."
    type: info
    date: "2026-11-17"
  - text: "dor_check iteration 1: NOT_READY (19 findings: 3 critical, 8 major, 6
      minor, 2 nit). Verdict artifact: readiness-review/readiness-iter-1.md.
      Remediation reopened specification, test_planning, and delivery_planning."
    type: info
    date: "2026-11-17"
  - text: "DoR critical findings: (1) real opencode v2.2.5 store schema lacks
      work_item_ref/harness_version columns and the config default store path is
      absent, so fixtures modelled a synthetic shape and AC-F5-1 could pass
      while production lands zero rows; (2) AC-F6-1/AC-F6-2 assert a
      telemetry-refusal surface that does not exist and NG-9 forbids adding one;
      (3) per-seat telemetry fields are dropped by the state-layer payload
      allowlist in packages/core/src/state/harness-telemetry.ts, which is in no
      plan phase."
    type: info
    date: "2026-11-17"
  - text: "DoR major findings: RSK-1 confirmed worse than assumed (v2.2.5 exposes no
      OC_*_AGENT_*_MODEL; models resolve through opencode's own config surface);
      the per-spawn record seam is missing from the environment builder;
      detail.harness is blocked by the closed envelope detail type; the version
      probe contract is unpinned ('opencode v2.2.5' vs fixtures '2.2.5');
      TC-006's 5s probe bound is unprovable; AC-N1-1 self-contradicts; no
      Definition of Done; TC-010 phase conflict."
    type: info
    date: "2026-11-17"
  - text: "First-pass analysis trusted the delivered extractor's SQL rather than the
      installed harness store, so three artifacts encoded a store shape the real
      v2.2.5 database does not have. Adversarial readiness review against the
      live store caught it before delivery. Standing lesson: for a harness
      integration change, inspect the installed harness's real store and real
      CLI output first, then write requirements."
    type: retro
    date: "2026-11-17"
  - text: "Commit primitive requires repo-local binaries on PATH: commitlint is
      resolved by bare name, so `jaiship phase complete` fails
      commit.commitlint-failed unless node_modules/.bin is on PATH. Appending
      (never prepending) node_modules/.bin keeps the installed jaiship
      resolution intact."
    type: retro
    date: "2026-11-17"
  - text: "New untracked decision records cannot be committed standalone: the
      deterministic commit-message validator matches any XXX-NNN token, so a
      TDR/ADR id in the composed template subject (derived from the top staged
      path) is rejected as an invented tracker reference. Precedent GH-275
      (TDR-0016) and GH-322. TDR-0031 therefore stays untracked until delivery
      Phase 1, where a lower-sorting path takes the template subject."
    type: blocker
    date: "2026-11-17"
  - text: "Decision recorded: TDR-0031
      (doc/decisions/TDR-0031-harness-dispatch-outcome-envelope-detail.md, R2,
      Proposed — human decides at PR review). The failure-envelope detail slot
      gains one harness member (kind, observedVersion|null, versionVerdict
      inside|outside|indeterminate, mode omitted when unresolved), present only
      on the four new pre-session harness refusals, additive within
      delivery.result.v1."
    type: decision
    date: "2026-11-17"
  - text: "Adjudication of plan conflicts after 1: NOT_READY remediation: (a)
      TDR-0031's declaration, projection, pins, validator, fixture and doc
      sentence land in Phase 2 while the behaviour file spans Phases 4 and 7 —
      accepted, because the record itself already names that file as push-later
      scope and the behaviour cannot exist before the refusals do; (b)
      feature-dispatch-engine.md lands with the declaration in Phase 2 rather
      than with the emitter in Phase 4 — accepted, the declaration is the
      contract and phase 7 reconciles the page; (c) the test plan's 'unchanged
      suites' list is superseded by the plan's owned Phase-5 updates for the
      opencode telemetry suites, corrected by a test-plan erratum; (d) AC-F2-2's
      change-side link rests on the Phase-1 spike evidence and these pm-notes
      decisions, not on a spec edit; (e) pm-notes decisions/notes are
      PM-authored — the coder only needs the file in staging scope; (f) the
      store-override layer stays a Phase-5 obligation resolved through the
      configuration environment source, not a new ambient read; (g) TC-011 and
      TC-042 ownership follows 'the phase that first makes the suite green',
      which is a rule-based deviation from the test plan's suggestion with no
      oracle change."
    type: decision
    date: "2026-11-18"
  - text: "dor_check iteration 1 remediation complete: spec revised (23 to 26 ACs,
      four refusal identities, observed-store requirements, DoD section), test
      plan revised (41 to 45 TCs, fixtures rebuilt from the observed store,
      deadline seam pinned), plan revised (8 phases, 45/45 TCs, 26/26 ACs,
      validate + lint plan both valid). Re-running the gate as iteration 2."
    type: info
    date: "2026-11-18"
  - text: "dor_check iteration 2: NOT_READY (13 findings: 3 critical, 3 major, 5
      minor, 1 nit, 1 partial carry-over). Verdict artifact:
      readiness-review/readiness-iter-2.md. Iteration-1 findings 1-16, 18 and 19
      are resolved; 17 is partially resolved. Remediation reopens specification,
      test_planning, and delivery_planning."
    type: info
    date: "2026-11-18"
  - text: "DoR iteration 2 critical findings: (C1) seat to spawn mapping is
      undefined and 'per-seat models' is unsatisfiable on the chosen carrier —
      opencode run takes single-valued --agent/--model and the store holds one
      agent/model per session, so a spawn binds exactly one seat and nothing in
      F-3 says which; (C2) TC-011 asserts three agent/model pairs on one spawn,
      which only a recording double can satisfy, so the suite would be green
      while the production argv is invalid; (C3) attribution reaches undeclared
      files (contracts/closeout.ts, domain/closeout.ts, cli/src/edge.ts,
      golden/regenerate.ts, golden/telemetry.json, capsule-latency.test.ts,
      closeout-composition-facts.test.ts), so Phase 5 cannot commit green under
      declared-scope staging."
    type: info
    date: "2026-11-18"
  - text: "DoR iteration 2 also flagged: Phase 7.5 claims a Phase-4-created
      behaviour file that Phase 4 does not scope (M1, challenging adjudication
      (a)); a Phase-7 gate runs a non-existent dispatch-contract.test.ts (M2);
      AC-F3-4's 'harness does not recognise' has no production catalogue source
      and the only observed read is a second child process colliding with the
      single-probe exception (M3); plus minors on DoD verifiability, review of
      decision records, self-deferrable ACs, section 21 ownership claims, the
      section 10 disclosure wording, and a nit on Appendix C accuracy."
    type: info
    date: "2026-11-18"
  - text: "Adjudication of iteration-2 PM challenges: adjudication (a) is withdrawn
      — the plan must scope the behaviour file in the phase that creates it;
      adjudication (g) stands for TC-042 but not for TC-011, whose oracle is the
      defect, not its ownership. Adjudications (b), (c), (d), (e) and (f) are
      upheld; (f) must additionally name the override variable and the config
      path."
    type: decision
    date: "2026-11-18"
  - text: "Decision recorded: TDR-0032 (R2, Proposed — human decides at PR review).
      One spawn binds exactly one seat; N seats are N spawns, N sessions, N row
      sets; the seat resolves from the spawn's agent identity; exactly one
      --agent (the agent identity, never the seat name) and one --model per
      invocation; the run's recorded binding supplies seat and resolved model
      beside the store's observed agent and model. Amended (A-1/A-2/A-3) so a
      role-less spawn binds nothing at any seat count, the unassigned-agent
      refusal discloses through the bounded error summary and remediation hint
      with no envelope member and no new identity, and the field literals are
      contract obligations rather than copied names."
    type: decision
    date: "2026-11-18"
  - text: "Adjudication of the plan's remaining conflicts after iteration 2: (h)
      TC-015 stays in Phase 5 because its oracle reads the recorded binding and
      the null-seat rows; (i) the closeout session-facts source moving from a
      work-item query to the run's attempt record is accepted, and a delivery
      that records no held identities yields the delivered skipped-gap outcome
      rather than a session list; (j) harness-mutants.test.ts spanning Phases 5
      and 6 is scheduling only, with each phase stating its half; (k) daemon
      lane seat attribution is explicitly out of scope for this change and stays
      behind the undeclared-semantic-edit escalation trigger."
    type: decision
    date: "2026-11-18"
  - text: "dor_check iteration 2 remediation complete: spec (26 ACs, DEC-13/14,
      TDR-0032 applied, DoD narrowed, sections 21 and 10 corrected, Appendix C
      corrected), test plan (46 TCs, TC-011 re-cut to one pair per spawn, TC-046
      added for the probe construction site), plan (8 phases, 46/46 TCs, 26/26
      ACs, validate + lint both valid, capsule and telemetry route files
      declared). TDR-0032 amended by its author. Re-running the gate as
      iteration 3."
    type: info
    date: "2026-11-18"
