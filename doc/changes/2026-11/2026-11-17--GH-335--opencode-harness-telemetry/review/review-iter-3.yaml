    category: maintainability
    location: packages/cli/src/production.ts:2818-2830
    message: >
      The memoisation comment says the context "cannot drift from the one admission
      read". It cannot guarantee that: nominationPredicate performs its own
      acquireProjectConfiguration + resolveConfig + parse + selectProfile and
      resolveProfileContextFrom performs a second independent one, so config edits or
      a probe-clock difference between admission and the first port call still
      diverge. Memoisation also freezes a failure (profileContextResolved is set before
      the outcome), so a transient unreadable-config result refuses every spawn of that
      dispatch. Both are safe under the documented one-dispatch-per-composition
      invariant and fail closed, but the stated reason is stronger than the code.
    suggestion: >
      @coder/@pm: state what memoisation actually buys (one parse per dispatch; first
      result, success or failure, is authoritative) and either resolve the context from
      the nominated decision or record that the residual profileName/providerProfile
      divergence is accepted under the one-dispatch invariant.
    suppressed: false
  - id: F-4
    severity: low
    confidence: high
    category: test-quality
    location: tests/behaviour/harness-telemetry-shape.test.ts:223
    message: >
      The "single home of the stored-stamp grammar" guard asserts the adapter source
      does not contain "/^v?(\\\\d+)". That needle's runtime value carries two
      backslashes, while a reintroduced regex literal reads with one, so the assertion
      is false for exactly the form it was written to forbid (verified by evaluating
      both strings). It only catches a new RegExp-style double-escaped reintroduction.
      The behavioural bound tests carry the real weight, so this is a guard that does
      not guard rather than a behavioural hole.
    suggestion: >
      @coder: use a needle that matches the source form (e.g. "v?([0-9]+)"), or assert
      the adapter import and the absence of any "/^v?" literal, or drop the source-text
      guard in favour of the behavioural tests plus content-inventory.
    suppressed: false
