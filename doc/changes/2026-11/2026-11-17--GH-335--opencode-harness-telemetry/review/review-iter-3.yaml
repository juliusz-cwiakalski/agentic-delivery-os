summary: >
  Iteration 3 verdict: PASS. All 27 ACs hold; the three iteration-1 blockers and
  every iteration-2 blocker/medium finding are genuinely closed on inspection of
  the code, not just asserted. DEC-18 is declared in every place the change spec
  needs it and the delivered refusal is exactly the declared shape (config.value.invalid,
  kind config, field agent, a fixed 56-character summary with no caller value,
  no envelope member), with DEC-17 precedence real in code and locked by a test.
  The stored-version grammar now has one authored home in the contracts tier,
  bounded by HARNESS_VERSION_MAX_CHARS, and I verified by direct execution that
  over-bound, unparseable and empty inputs take the declared absence path while a
  32-character stamp is accepted and nothing is clipped. The false "mounts no
  profile wrapper" statements are gone from every shipped page and the corrected
  text matches the code (mount, byte-identical role-less passthrough, closeout
  shapes, edge durable facts, pinned-version drift, row-based LIMIT). The declared
  gate invocation (TMPDIR=$PWD/tmp/tmpdir pnpm check) is green except one
  load-induced 5 s timeout in an unrelated in-process suite that passes 26/26 in
  1.96 s in isolation; every non-test stage exits 0 when run separately, the
  41-commit range gate passes, and the reported clean totals reconcile
  arithmetically with Phase 10's six added tests. Residuals are documentary and
  non-blocking: Phase 10's declared scope.files omits nine changed files (three
  mechanically required barrel/inventory consequences), task 10.2's
  accepted-deviation sentence was never recorded, the memoisation comment claims
  a guarantee the code does not provide, the F-5 single-home test's source guard
  is escaped twice and cannot catch the form it forbids, and the spec revision log
  says "no DEC count change" while adding DEC-18.
