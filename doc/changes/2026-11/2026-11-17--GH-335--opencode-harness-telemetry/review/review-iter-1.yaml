      mid-session switch, the code falls back to the stale session baseline (or reports
      absence) rather than the switched value, which can mis-scope a group's seat claim. The
      practical impact is narrow (per-message agent/model are present on the observed
      assistant rows), and TDR-0035's prose omits the switch-event source, so this is also a
      spec/TDR inconsistency.
    suggestion: >
      Either implement the transition (read `agent-switched`/`model-switched` rows in `seq`
      order and update the running baseline before grouping; add a switch fixture and oracle),
      or reconcile §8.3 and plan 5.1 to the delivered single-source derivation with an owner-
      accepted erratum. Do not leave the spec asserting a source the code never reads.
    suppressed: false
