      classifying that one pair as `duration-absent`. This is the same defect GH-291 F-4 fixed
      in `telemetry-ingest.ts`.
    suggestion: >
      Range-guard the timestamp pair (finite and within the Date bounds) and return the
      explicit `duration-absent` absence for an out-of-range pair; add a decode test with an
      absurd timestamp asserting absence, no throw, and rows still landing.
