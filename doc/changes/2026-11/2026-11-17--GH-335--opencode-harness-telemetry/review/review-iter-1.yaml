summary: >
  The change is broad, mostly well-built, and its offline suites are green (spot-run
  241 tests / 0 fail across 24 suites; plan+capsule validators green). Three blocking
  defects remain. (1) The recorded live observation — the sole evidence for AC-F5-6 and
  AC-F3-1's live half — is a raw `opencode run --agent coder --model …` invocation
  (an argv convention the plan explicitly forbids for this record) that never ran a
  harness-port spawn and never ran the delivered capture; the capture scope is the
  recorded dispatch-attempt union, and a raw CLI run records no attempt, so the
  delivered capture would return `skipped-gap`, not the narrated row. The record yet
  claims both criteria "met" with "no deferral", breaching DoD clause 1. (2) The
  production composition mounts neither `createHarnessProfilePort` nor
  `resolveHarnessAdmissionBinding`; the only mounting caller is a test fixture, so the
  delivered production port refuses a caller-supplied `agent` without a binding
  instead of resolving it, and the plan's own escalation trigger ("the resolution rule
  has no production call site and only a test-built fixture proves it") has fired.
  (3) The two resolution helpers swap the two refusal identities: a present empty
  `agent` resolves to `provider.profile.invalid` through the admission helper
  (DEC-17 requires `config.value.invalid`), while an `unassigned` named agent resolves
  to `config.value.invalid` through the port wrapper (AC-F3-4 requires
  `provider.profile.invalid` naming agent/profile/seats). Both are demonstrated
  empirically. Seven minor and four informational findings follow; none of the
  declared gaps in pm-notes breaches the spec, though two gap descriptions are
  inaccurate.
