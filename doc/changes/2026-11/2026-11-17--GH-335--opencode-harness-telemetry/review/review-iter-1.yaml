    location: doc/changes/2026-11/2026-11-17--GH-335--opencode-harness-telemetry/chg-GH-335-live-observation.md:18-102
    message: >
      AC-F5-6 and the live half of AC-F3-1 are claimed "met" on evidence that does not
      satisfy either. The record's own section 2 states the observation is "not a
      dispatch run" and shows `opencode run --agent coder --model deepseek/deepseek-flash`
      — a direct harness-CLI invocation, i.e. the argv convention plan 8.12 and DoD
      clause 4 forbid ("supplied on the input contract's agent-identity member, not
      through an environment variable or an argv convention"). No harness-port spawn
      (HarnessSessionPort.spawn) ran, no resolved binding was produced, and no capture
      was executed: section 4's row table is a narrated projection ("the capture
      produces one row with:"), not observed capture output. Because the delivered
      capture scope is the union of session identities held by the work item's recorded
      dispatch attempts (DM-8), a raw CLI run leaves no attempt record and the delivered
      capture would return skipped-gap/session-attribution-unavailable, not the row
      described. The seat value `coder-seat` is asserted nowhere the store or an
      executed capture produced it. The record states "No deferral is claimed", so DoD
      clause 1's accepted-deferral escape is not available.
    suggestion: >
      Either (a) run the observation through the delivered path — a harness-port spawn
      with `agent: "coder"` (and the binding the composition resolves), record the attempt,
      run the closeout/extractor capture, and paste the actual landed-row output (including
      seat, resolvedModel, harnessVersion, tokens) and the state read — or (b) record an
      owner/PM-accepted deferral in the change's evidence with the exact boundary, and
      stop claiming AC-F5-6 / AC-F3-1's live half as met (spec §17.2 clause 1 and 4).
      The narrated row table must not stand as evidence.
