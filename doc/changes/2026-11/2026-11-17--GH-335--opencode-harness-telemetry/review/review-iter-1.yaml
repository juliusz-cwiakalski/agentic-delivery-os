  - id: F-2
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:1151,2832-2835
    message: >
      `createProductionComposer`'s `dispatchComposition` hands out plain `harnessFor(...)`
      ports (`harnesses: { opencode: harnessFor("opencode", dispatchVersionGate), … }`)
      and supplies neither `harnessAgent` nor `harnessBinding`; `createHarnessProfilePort`
      (production.ts:1151) and `resolveHarnessAdmissionBinding` (production.ts:1087) are
      referenced only by `tests/fixtures/harness/propagation-harness.ts` and by each other.
      Consequently a caller that supplies `agent` on the delivered production port receives
      a `config.value.invalid` refusal from the adapter ("reached the adapter without a
      resolved single-seat binding") instead of the resolver's single-seat binding, so
      AC-F3-1's offline "the composition passes the supplied agent identity to the
      resolver" is proven only by a test-built fixture. This is exactly the state the plan
      declares an escalation trigger against ("so the resolution rule has no production
      call site and only a test-built fixture proves it", plan tier.escalationTriggers) and
      contradicts DM-4/§8.2/DEC-16 ("the composition passes it to the pure resolution
      function"). DEC-15 is not breached — the shipped dispatch supplies no agent and binds
      nothing — but DEC-15 does not license an unmounted resolution call site.
    suggestion: >
      Mount the resolution call site in the production composition: wrap the opencode
      session port with `createHarnessProfilePort({ port, profile, selection, resolve:
      resolveBinding })` using the nominated profile/selection, so a caller-supplied `agent`
      is resolved and a role-less call is an unchanged passthrough (preserving DEC-15). Add
      a composition-level test that drives the production-composed port with an agent and
      asserts one resolved `--agent`/`--model` pair (and no pair when no agent is supplied).
    suppressed: false
  - id: F-3
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:1087-1205
    message: >
      The two profile-resolution helpers swap the refusal identities. Verified by execution:
      `resolveHarnessAdmissionBinding({ agent: "", profile, selection, profileName: "p" })`
      returns `provider.profile.invalid` ("agent  has no seat …"), whereas DEC-17 / AC-F3-1
      require `config.value.invalid` naming the agent-identity field for a present empty or
      whitespace-only identity; and `createHarnessProfilePort(...).spawn({ …, agent:
      "writer" })` on a multi-seat profile with no assigned seat returns
      `config.value.invalid` ("agent writer resolved no seat before the port call"), whereas
      AC-F3-4 requires `provider.profile.invalid` naming the agent, the profile, and the
      declared seats. The wrappers partially mask this (the port wrapper runs
      `harnessAgentIdentityViolation` before resolution, so the empty-string case is right at
      the wrapper), but the admission helper has no such check, and the port wrapper's
      unassigned branch is wrong. Because the helpers are currently unmounted (F-2), the
      contradiction is latent in production but present in exported, documented-as-the-call-
      site code.
    suggestion: >
      In `resolveHarnessAdmissionBinding`, check `harnessAgentIdentityViolation(agent)` first
      and return `config.value.invalid` naming the `agent`-identity field; keep `unassigned`
      → `provider.profile.invalid` with agent/profile/declared-seats in the bounded summary.
      In `createHarnessProfilePort`'s `bind`, delegate an `unassigned` resolution to the same
      `provider.profile.invalid` mapping (agent, profile, seats) instead of
      `config.value.invalid`; keep `config.value.invalid` only for the invalid identity and
      the (contract-violation) unresolvable case. Add oracles for both paths driven through
      the mounted composition.
    suppressed: false
  - id: F-4
    severity: medium
    confidence: high
    category: observability
    location: packages/core/src/contracts/closeout.ts:562-568; packages/core/src/contracts/harness-telemetry.ts:228-238; packages/cli/src/edge.ts:2490-2500
    message: >
      The capture computes `absences`, `unattributedAttempts`, and `attemptTruncation`
      (harness-telemetry.ts:214-218, adapter populates them) but neither
      `CloseoutTelemetryDisclosure` (captured/degraded/failed/warnings/sessionTruncation)
      nor the durable `HarnessCaptureOutcomeRecord` projects them; `captureTelemetry`
      (domain/closeout.ts:1627) and the edge's `buildTelemetry` outcome drop them, and the
      compaction checkpoint (domain/closeout.ts:2448-2470) carries only the identity-cap
      `sessionTruncation`. So after closeout no reader can see that an attempt was
      unattributed, that the attempt ledger was truncated, or that held sessions were
      absent — an all-absent capture renders as `{captured: 0, degraded: 0, failed: 0,
      warnings: []}`. This is the capture-envelope's declared data (AC-F5-5/AC-F6-2 are
      satisfied at the `HarnessTelemetryCapture` return, which the docs cite), so it is not
      an AC breach, but it repeats the GH-291 F-2 "accounting never surfaces durably"
      class.
    suggestion: >
      Add bounded `absences` (count + closed reasons), `unattributedAttempts`, and
      `attemptTruncation` to `CloseoutTelemetryDisclosure` and to
      `HarnessCaptureOutcomeRecord` (and the state parse/append), projecting them in
      `captureTelemetry` and the edge outcome; add a closeout test that asserts an absent
      and an unattributed attempt survive into the applied payload and the durable record.
    suppressed: false
