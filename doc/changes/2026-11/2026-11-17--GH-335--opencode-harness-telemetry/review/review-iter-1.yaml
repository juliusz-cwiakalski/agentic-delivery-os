    location: packages/adapters/src/harness/telemetry-opencode.ts:237-258
    message: >
      `durationsOf` calls `new Date(start).toISOString()` / `new Date(end).toISOString()`
      with no range guard. A stored timestamp outside ±8.64e15 ms (or otherwise unrepresentable)
      throws RangeError, which the extractor's outer `catch` converts into a whole-capture
