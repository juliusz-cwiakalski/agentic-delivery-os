    location: packages/adapters/src/harness/telemetry-opencode.ts:220-230,389-440
    message: >
      Spec §8.3 states the observed agent/model comes from per-message values "with
      `session_v2.agent` as the baseline and `agent-switched` / `model-switched` events as
      transitions", and plan 5.1 repeats it, but `messageSql` reads only `type = 'assistant'`
