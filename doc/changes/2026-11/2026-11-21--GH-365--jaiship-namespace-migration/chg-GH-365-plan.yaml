#   output of these commands, not a judgement):
#     git grep -Iln -E '\.delivery-os|DELIVERY_OS_' -- packages .opencode scripts tools .gitignore package.json pnpm-lock.yaml
#     git grep -Iln -E '(^|[^@[:alnum:]_-])delivery-os([^[:alnum:]_-]|$)' -- packages .opencode scripts tools package.json pnpm-lock.yaml | grep -v agentic-delivery-os
#     git grep -Iln -E '\.delivery-os|DELIVERY_OS_' -- doc | grep -v '^doc/changes/' | grep -v '^doc/decisions/'
