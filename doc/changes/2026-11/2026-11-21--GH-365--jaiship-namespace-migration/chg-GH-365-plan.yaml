  # ---------------------------------------------------------------------------
  # PHASE 2 — The declared one-release shim registry, the release changeset its
  # window values derive from, and the pre-freeze fixture its sites require (F-4;
  # DM-3).
  #
  # Goal: make "declared" checkable. One machine-readable document becomes the
  # single authority for every prior-namespace compatibility input: one entry per
  # shim with its kind, literal, direction, lineage, notice, window, owner, and
  # enumerated sites. This phase is second because the content arm in P3 consumes
  # this registry as its SITE AUTHORITY — without it the arm could pass on an empty
  # allowlist (spec §19's second ordering constraint).
  # This phase also authors the two things its OWN gate needs and cannot get from a
  # later phase: the release changeset the delivery-os window values derive from
  # (C2) and the eight-variable pre-freeze fixture that `Appendix F` declares as a
  # `prior-environment-prefix` site and whose absence would fail the
  # "every declared site is present" validator (C3).
  #
  # Obligations:
  #   2.0 Author the single minor changeset
  #       `.changeset/gh-365-jaiship-namespace-migration-minor.md` for the lockstep
  #       group, FIRST, so the window values below derive from a document that
  #       exists: the release that ships this change is the `declaredIn` value and
  #       the next minor is the `removalRelease` value. P10 verifies the changeset
  #       and the window equality (`changesets-group.ts`) and never re-authors it.
  #   2.1 Author `scripts/checks/namespace-shims.registry.json` as
  #       `namespace.shims.v1`: `schemaId`, `window { declaredIn, removalRelease }`
  #       defaults, `shims[]` with `id`, `kind` (`executable` | `path` |
  #       `environment` | `environment-prefix`), `literal`, `direction`
  #       (`invocation` | `read-only` | `mapping`), `lineage` (`delivery-os` |
  #       `pre-freeze`), `noticeId`, `notice`, per-shim `window`, `owner`, and
  #       `sites[]` `{file, role, maxOccurrences?}`.
  #   2.2 Declare the seven normative families of Appendix F: `executable-alias`,
  #       `prior-config-directory`, `prior-state-root`,
  #       `prior-working-name-override`, `prior-environment-prefix`,
  #       `pre-freeze-environment-prefix`, `pre-freeze-config-directory`. The
  #       delivery-os lineage carries this change's one-release window
  #       (`removalRelease` strictly greater than `declaredIn` under semver, taken
  #       from the changeset authored in 2.0); the pre-freeze lineage carries
  #       `removalRelease: null` plus its owner note.
  #   2.3 Enumerate the sites truthfully and file-level with a role sentence. The
  #       enumeration is re-derived by the header's three `git grep` commands before
  #       this phase's gate, and it must cover the SEVEN shim families with their
  #       OWN sites — the two lineages never swapped (DM-3, S21, C13):
  #       (a) the delivery-os implementation and detection surfaces in `packages/**`
  #           — the install-migration declaration, the edge/entrypoint override
  #           constants, the MCP serve default, the alias bin's name and package bin
  #           entry, the primary bin's prior identity, and the one adapter comment
  #           that documents the prior directory as the migration source (a DECLARED
  #           SITE, never an edit);
  #       (b) the PRE-FREEZE sites (their own lineage): the legacy compatibility
  #           adapter `packages/adapters/src/legacy/index.ts` — the
  #           `LEGACY_ENV_PREFIX` constant and the provider migration table — as the
  #           site of BOTH `pre-freeze-environment-prefix` (`ADOS_`) and
  #           `pre-freeze-config-directory` (`.ados`), with a budget; and the
  #           eight-variable fixture authored in 2.6, which holds `ADOS_` literals
  #           and is therefore a `pre-freeze-environment-prefix` site
  #           (declaration-only; NOT a `DELIVERY_OS_` site);
  #       (c) both registry documents themselves (self-declaration with a budget —
  #           never a wildcard);
  #       (d) the `DELIVERY_OS_` shell surfaces DEC-13 keeps —
