phases:
  # ---------------------------------------------------------------------------
  # PHASE 1 — The committed project layer, the brand-free ignore rules, the
  # fresh-clone drill, and the staged decision record (F-1; DM-1, DM-2).
  #
  # Goal: make committed truth the Jaiship layer. `.delivery-os/config.yaml` moves
  # to `.jaiship/config.yaml` BYTE-IDENTICALLY (the document is live policy — this
  # repository's `verify.suite-map` and its whole `provider` branch — not a
  # sample), the prior path leaves the tracked set, and the repository's own ignore
  # rules keep a fresh clone clean through the declared runtime write set without
  # any `.git/info/exclude`. This phase is first because a fresh clone can only see
  # committed truth, and every later phase reads the moved layer.
  #
  # This phase is also the COMMIT BOUNDARY for the staged decision record: the
  # plan-absent commit scope could not stage the untracked TDR-0074 record, so this
  # plan declares it (and its index row) here. See THE STAGED DECISION RECORD.
  #
  # Obligations:
  #   1.0 LOCAL-EXCLUDE PRECONDITION (C10; header block). BEFORE anything is staged
  #       in this or any later phase: remove the workstation-local
  #       `.git/info/exclude` entries for `.delivery-os/` and `.jaiship/`, and write
  #       the `.*/projects.yaml` ignore pattern into the TRACKED `.gitignore`. The
  #       commit primitive builds its candidate set from `git status` and stages with
  #       `git add -A -- <paths>` (`packages/adapters/src/git/commit.ts`,
  #       `packages/core/src/domain/commit-staging.ts`), so an untracked
  #       `.jaiship/config.yaml` hidden by a local exclude is invisible to it and an
  #       explicit add of an ignored path is refused; without this step d1/d2/d3
  #       cannot be green. This is a local operator action: the change commits NO
  #       exclude file. A fresh lane (new worktree, new machine, re-dispatched
  #       session) performs it before its first staging attempt.
  #   1.1 Move the tracked document byte-identically to `.jaiship/config.yaml` and
  #       remove the prior path from the index. Do not reformat, reorder, or
  #       rewrite a key: the parsed `verify.suite-map` and `provider` branches must
  #       be structurally equal to the pre-move document, and the blob digest must
  #       equal the pre-move digest.
  #   1.2 Add the brand-free, root-anchored `.*/projects.yaml` beside the delivered
  #       `.*/config.local.yaml`; it must not match the tracked `config.yaml` and
  #       must not match a nested `packages/x/projects.yaml`. (Written before staging
  #       per 1.0.)
  #   1.3 Extend `scripts/checks/ignore-rules.ts` with the runtime-written-project-
  #       file coverage class, the two rule-world probes (both runtime files
  #       ignored) and the positive control (the tracked layer NOT ignored); keep
  #       the four delivered classes, the brand-free glob, the rename simulation and
  #       the delivered probes load-bearing. Restate the "four coverage classes"
  #       text in the module and in `tests/checks/ignore-rules.test.ts` to the
  #       delivered five (PIN UPDATE, authorising clause DM-2/AC-F1-3).
  #   1.4 Author the four suites this phase owns: `namespace-layer.test.ts` (the
  #       tracked set, the committed digest literal, the structural equality, zero
  #       prior-root paths), `ignore-rules-namespace.test.ts` (the fifth class, the
  #       glob-not-literal assertion, the rename simulation, the nested non-match,
  #       the rule-world probes), `namespace-fresh-clone.test.ts` (driver D5: a real
  #       clone at the phase head with NO `.git/info/exclude`, the seeded write set,
  #       an empty `git status --porcelain`), and `namespace-loaded-path.test.ts`
  #       (the composed read loads the current path, the moved suite map, zero
  #       prior-root opens).
  #   1.5 Extend `tests/fixtures/entrypoint/prior-identity/harness.ts` with the
  #       per-opened-path recorder and the write recorder the loaded-path and notice
  #       cases assert from; keep its existing surface unchanged.
  #   1.6 Create `tests/fixtures/namespace/evidence.ts` with the permanent
  #       `NAMESPACE_PROOF_BOUNDARY` constant (eight proven / eight not-proven, in
  #       the declared order) and the first rows for this phase's cases (with
  #       `boundaryViolations()`); later phases only append rows.
  #   1.7 Stage the decision record pair: `doc/decisions/TDR-0074-…md` becomes
  #       tracked and `doc/decisions/00-index.md` carries its row and binding
  #       paragraph. Do not edit a record's content to match code.
  #   1.8 Register what this phase introduces where a registration is required and
  #       keep `tests/structure/content-inventory.test.ts` green.
  #
  # Verb surface at this boundary: none. No command module, no verb, and no check
  #   job changes; the only observable product change is which configuration path a
  #   checkout resolves.
  #
  # Code areas (concrete):
  #   .jaiship/config.yaml                             (the moved document)
  #   .delivery-os/config.yaml                          (deleted)
  #   .gitignore                                        (the additive brand-free pattern)
  #   scripts/checks/ignore-rules.ts                    (fifth class + probes)
  #   tests/checks/ignore-rules.test.ts                 (PIN UPDATE: five classes)
  #   tests/structure/namespace-layer.test.ts           (new)
  #   tests/checks/ignore-rules-namespace.test.ts       (new)
  #   tests/checks/namespace-fresh-clone.test.ts        (new)
  #   tests/behaviour/namespace-loaded-path.test.ts     (new)
  #   tests/fixtures/entrypoint/prior-identity/harness.ts (recorders)
  #   tests/fixtures/namespace/evidence.ts              (new: constant + first rows)
  #   tests/structure/inventory.json                    (register/verify)
  #   doc/decisions/TDR-0074-project-groups-document-operator-local-overlay.md
  #   doc/decisions/00-index.md
  #
  # Acceptance: AC-F1-1 (TC-LAYER-001), AC-F1-3 (TC-LAYER-002/003), AC-F1-4
  #   (TC-LAYER-004). 3 ACs, 4 TCs. `AC-F1-2` is deliberately NOT claimed here: its
  #   proof is the tree arm's real-tree run plus the two synthetic-tree controls,
  #   which land in P4.
  #
  # Gate (expected signal: exit 0; exactly one tracked path under `.jaiship/` with
  #   the recorded digest; zero tracked paths under a prior root; five coverage
  #   classes with both globs brand-free and root-anchored; a scratch clone with no
  #   local exclude reporting zero status lines; the composed read naming the
  #   current path and opening no prior path; the record and its index row tracked
  #   with `doc/decisions` clean):
  #   EXECUTION ORDER (GATE ORDERING VERSUS THE PHASE COMMIT, header): commit this
  #   phase FIRST, then run the battery below on the COMMITTED head. `TC-LAYER-001`
  #   and `TC-LAYER-003` read HEAD, so a pre-commit dry read of the fresh-clone drill
  #   has neither `.jaiship/config.yaml` nor the added ignore pattern and is NOT gate
  #   evidence; it is never reported as green (C9).
  #   PRE-GATE PRECONDITION (C10): `git check-ignore .jaiship/config.yaml` MUST exit
  #   1 (not ignored) before the battery runs; exit 0 means a local
  #   `.git/info/exclude` entry is still hiding the layer and the phase is not done.
  #   mkdir -p tmp/tmpdir
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git check-ignore .jaiship/config.yaml; test $? -eq 1
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/namespace-layer.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/checks/namespace-fresh-clone.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/behaviour/namespace-loaded-path.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/checks/ignore-rules-namespace.test.ts tests/checks/ignore-rules.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun run scripts/checks/ignore-rules.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/checks/decision-record.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun test tests/structure/content-inventory.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm typecheck
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git diff --check
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git ls-files --error-unmatch doc/decisions/TDR-0074-project-groups-document-operator-local-overlay.md
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git status --porcelain -- doc/decisions
  #
  # Done criteria (all observed, not asserted):
  #   d0 `git check-ignore .jaiship/config.yaml` exits 1 and no `.git/info/exclude`
  #      entry names `.delivery-os/` or `.jaiship/`; no exclude file is committed
  #      (C10).
  #   d1 `git ls-files .jaiship/config.yaml` is exactly that path; `git ls-files
  #      .delivery-os` is empty.
  #   d2 the tracked blob's digest equals the recorded pre-move digest and the
  #      parsed document is structurally unchanged.
  #   d3 the fresh-clone drill reports zero status lines with no local exclude,
  #      measured on the COMMITTED phase head (a pre-commit read is not evidence).
  #   d4 the TDR-0074 path is tracked (`--error-unmatch` exits 0) and
  #      `git status --porcelain -- doc/decisions` is empty.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "The committed .jaiship project layer (byte-identical), the brand-free runtime ignore rules, the fresh-clone drill, the loaded-path proof, and the staged TDR-0074 pair"
    kind: delivery
    summary: "feat(GH-365): committed jaiship project layer and brand-free ignore rules"
