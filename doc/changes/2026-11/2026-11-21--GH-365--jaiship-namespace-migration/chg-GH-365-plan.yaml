# PLAN SHAPE: ten phases, all `kind: delivery` (each edits the repository and
#   takes the default `repo:main-tools` lease), zero `planning` phases. The spec is
#   complete at v1.4 and the test plan at revision 0.3, so no design work remains
#   and a planning phase would declare no scope to compute. The ten delivery-phase
#   ids are 1..10 and match the test plan's `P1..P10` map exactly; `tier.phases`
#   lists this plan's phase ids [1..10], and the delivery-phase vs lifecycle-phase
#   numbering is never conflated.
#   `P10` is the sole phase with NO delivery case: it authors the enduring quality
#   page, indexes it, registers it in the forbidden-literal registry, keeps
#   `doc-conformance` truthful, and VERIFIES the release (the single minor changeset
#   is P2's, because the shim registry's window values derive from it). The
#   page/constant comparison and the DOD-9 stale-statement
#   grep are LIFECYCLE phase-7 (`system_spec_update`) checks performed once by
#   @doc-syncer and recorded in pm-notes; no permanent delivery case reads the new
#   page and no suite reads `doc/changes/**`.
#
# SCOPE DECLARATION RULE (binding on every phase): a phase declares every path
#   whose content it AUTHORS or EDITS — that is what gives the commit primitive
#   staging authority. A file that is only RE-RUN as a regression control is NOT
#   declared; declaring it would surface only as an advisory `plan diff`
#   `undeclared-missing` for a file that needs no edit. A file edited by more than
#   one phase (notably `packages/core/src/contracts/install.ts`,
#   `packages/cli/src/commands/install.ts`, `packages/cli/src/help.ts`,
#   `packages/cli/src/production.ts`, `tests/checks/fixture-repo.ts`,
#   `tests/checks/doc-conformance.test.ts`, `tests/checks/install-lifecycle-*`,
#   `tests/fixtures/namespace/evidence.ts`, and the five Appendix A pages whose
#   identifiers P3 restates before P9 reconciles them) is declared by EVERY phase
#   that touches it. No phase claims exclusive ownership of a shared path:
#   ownership is of CASES and ACS, not of paths.
#   THREE DECLARED KINDS, stated so the rule and the declaration cannot
#   contradict:
#     (i)   A DELETION declaration: `.delivery-os/config.yaml` in P1. The path is
#           declared because the phase's content change IS its removal; `plan diff`
#           reports it as an expected missing path, never a scope escape.
#     (ii)  A PIN-UPDATE declaration: `tests/checks/ignore-rules.test.ts` and
#           `scripts/checks/ignore-rules.ts` (P1, four → five coverage classes),
#           `tests/checks/identity-docs.test.ts` (P3, five → seven scope classes
#           in the class-order assertion), `tests/checks/ci-checks.test.ts` (P4,
#           the `TS_JOBS` pin and the aggregate `check` chain),
#           `tests/structure/install-conformance.test.ts` (P5/P6, the flag and
#           entry-count pins), `tests/checks/doc-conformance.test.ts` (P6/P9/P10),
#           and `tests/structure/branding-contract.test.ts` (P8). Every one is a
#           PIN UPDATE: no assertion is deleted, renamed, relaxed, or skipped, and
#           every mutation control stays live.
#     (iii) A VERIFY-AND-REGISTER declaration: `tests/structure/inventory.json` in
#           every phase the test plan's §7.3 makes responsible for registering a
#           new module (P1..P8). It is declared for registration and for the
#           delivered inventory gate; a phase that adds no package module
#           registers none and simply keeps the gate green.
#     (iv)  A VERIFY-ONLY declaration: P10 declares
#           `.changeset/gh-365-jaiship-namespace-migration-minor.md` because it
#           RE-ASSERTS the changeset and the registry's window/changeset equality,
#           while P2 authors the file (C2). A verify-only declaration carries no
#           staging authority for a content edit; a change to it is an escalation,
#           not a P10 edit.
#
# SCAN-FIRST IDENTIFIER ALIGNMENT (binding on P3; the one place where this plan
#   makes the landing order explicit). The content arm is a GATE (`API-7`,
#   `NFR-5`/`NFR-6`): from the phase that adds the prior-namespace seed class, the
#   real tree must carry 0 UNDECLARED occurrences, so every surface the arm scans
#   has to name the current identity — or be a declared site, a declared corpus, or
#   a neutral site — BEFORE the arm can be green.
