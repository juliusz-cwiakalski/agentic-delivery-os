#   (j) The 55-row mutation register (test plan §7.4, M1–M55) is a REVIEWER/FIXER
#       exercise, not a committed suite; the permanent non-vacuity proofs are the
#       planted controls inside the owning cases. Every row is allocated to the
#       phase that owns the case it names, exactly once:
#       P1 5 (M1–M5); P2 3 (M32–M34); P3 5 (M31, M36–M39);
#       P4 5 (M40–M43, M55); P5 21 (M10–M30); P6 3 (M52–M54);
#       P7 4 (M6–M9); P8 8 (M35, M44–M50); P9 1 (M51).
#       5 + 3 + 5 + 5 + 21 + 3 + 4 + 8 + 1 = 55, every id M1–M55 present once.
#       M35 follows `TC-SHIM-003` (P8), not the notice machinery's own phase;
#       M51 follows `TC-IDENTITY-004` (P9); M55 follows `TC-SCAN-003` (P4) and fails
#       the `AC-F1-2`-NAMED declared-prefix assertion while that case's `AC-F5-3`
#       assertions stay green — attribution is PER ASSERTION, never "the only row
#       whose failure is AC-F1-2 alone" (r0.4 B13 / S24). A row that stops producing
#       its named failure is a BLOCKING finding; it is never repaired by deleting
#       the row or relaxing the expected failure family.
#   (k) `scripts/lib/dispatch-authority.sh` and the example owner-hold hook keep
#       their prior-root literals; their batteries keep asserting them. The
#       declaration and the budgets are what change, never the scripts
#       (DEC-13, `TC-SHIM-002` row D, `TC-IDENTITY-006`'s not-proven list).
#   (l) THE PRE-FREEZE FIXTURE IS AUTHORED IN P2, not P8, and it is a
#       `pre-freeze-environment-prefix` site — NOT a `prior-environment-prefix`
#       site. It holds `ADOS_` literals; the `DELIVERY_OS_` sites are the owner-hold
#       hook, its battery, the three owner-hold documents and the entrypoint
#       prior-identity harness (DM-3, S21, C13). P2 creates
#       `tests/fixtures/namespace/pre-freeze-env.ts` with the eight owner-named
#       variable names and the inert `ADOS_FOO=bar` marker as pure data and declares
#       it declaration-only; P8 extends it with the inertness probe and the
#       assertions `TC-IDENTITY-003` drives. Both phases declare the file.
#   (m) THE CATALOG KEY-SET AUTHORITY IS `packages/core/src/config/catalog.ts`
#       (`PRODUCTION_CATALOG`), declared by P8. The adapter imports no workspace
#       package, so the derivation's blast radius must be explicit: P8 either reads
#       the key set through a contracts-level selector that P8 also declares
#       (`packages/core/src/contracts/config.ts`) or through an injected key set;
#       the module that owns the set is `catalog.ts`, and a change to it is inside
#       this phase's declared scope, never an undeclared edit.
#   (n) THE MIGRATION WRITES ZERO RECORDS OF ANY KIND (spec v1.5 DM-7, S18/R10).
#       The delivered `audit.reservation` + `audit.invocation` pair is SUPPRESSED
#       for `install migrate` in every mode — dry run, refusal, applying run — as
#       the one declared exception, because the command moves the state store that
#       would receive the record. P5 declares the suppression seam
#       (`packages/cli/src/index.ts` plus the composition site `packages/cli/src/
#       edge.ts`), and the suppression is PROVEN by composing the audit dependency
#       and recording it: the recorder observes zero writes, which is what
#       distinguishes suppression from an absent seam. No migration record kind
#       exists, no install-record field is written, and none of the earlier
#       "audit pair at the destination before the move" statements survive (C24).
#   (o) `tests/behaviour/projects-config.test.ts`,
#       `tests/behaviour/ceremony-mirror-composition.test.ts`,
#       `tests/behaviour/projects-groups-list.test.ts`, and
#       `tests/structure/rename-drill-doc.test.ts` are NOT edited by any phase: DEC-12
#       changes no reader, validator, envelope, or composition, and the rename drill's
#       glob-survival property must stay green unchanged. They are VERIFY-ONLY
#       regression controls, re-run in the owning phase's gate and NEVER declared in
#       phase scope (C23; the scope rule forbids a verify-only declaration). The
#       group-document behaviour is asserted where it is already delivered
#       (`tests/behaviour/config-cli.test.ts`, declared by P7).
#   (p) DERIVED ENTRIES ARE OUTSIDE THE MOVE SET (spec v1.5 DM-6/DEC-4, S19). A
#       declared derived entry is never moved, copied to the backup, counted in the
#       plan's move or byte totals, or conflicted: a destination copy is
#       `already-migrated` when present and `absent` when not; a source copy is a
#       reported DERIVED RESIDUAL that is safe to delete, stays in place while its
#       root is not retired, is removed with a retired root, and never suppresses the
#       non-derived retirement line. P5 owns the rule; `TC-MIGRATE-006/007` assert it.
#   (q) A DECLARED SITE IS PRESENCE-VALIDATED ALWAYS AND MATCH-VALIDATED ONLY
#       INSIDE A SCANNED CORPUS (spec v1.5 DM-3/DM-4, S20). The three owner-hold
#       pages, the glossary, and the two `tests/**` fixtures are declaration-only:
#       present, zero matches permitted, never reported as matched. P2/P3 implement
#       and assert both halves (`TC-SHIM-001/002`, `AC-F4-2`).
#
# CHANGE-ARTIFACT NOTE. Every phase commit also carries this change folder's
