# GATE ORDERING VERSUS THE PHASE COMMIT (binding on P1; the rule generalises):
#   A gate is evidence about the COMMITTED phase head. The phase is committed
#   first (one commit through the commit primitive), and the gate battery is then
#   executed — or, where a read is destructive of the committed state, re-executed
#   — against that committed head. A pre-commit read is a dry run, never gate
#   evidence. This is load-bearing for P1: `TC-LAYER-003` (the fresh-clone drill)
#   and `TC-LAYER-001` (the tracked set) both read HEAD, so before the commit the
#   clone has neither `.jaiship/config.yaml` nor the added ignore pattern and the
#   drill's "0 status lines" assertion fails for a reason unrelated to the change.
#   The drill's own precondition ("the workspace tree is clean") is the post-commit
#   reading. P1 therefore commits, then runs the battery on the committed head, and
#   records the result; a pre-commit dry read of the drill is NOT gate evidence and
#   is never reported as green. Any later phase whose gate includes a HEAD-reading
#   or real-tree-reading case follows the same ordering: commit, then gate the
#   committed head.
