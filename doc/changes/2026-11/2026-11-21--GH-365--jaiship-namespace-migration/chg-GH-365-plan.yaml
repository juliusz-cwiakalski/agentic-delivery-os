  # before it moves, never deletes or overwrites a difference, is idempotent, and can
  # be re-run after an interrupted run without duplicating a moved entry. Spec §19's
  # items (5) and (6) are ONE boundary: every `AC-F3-*` criterion is phrased over the
  # command, so splitting the domain from the verb would force ten cross-phase
  # segments with no gain in isolation and would leave the old flag form coexisting
  # with a working verb across two boundaries.
