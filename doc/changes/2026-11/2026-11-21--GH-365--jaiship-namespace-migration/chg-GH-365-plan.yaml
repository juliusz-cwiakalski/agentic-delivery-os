  #       project class `unscoped` with no source, no destination, no entries, and
  #       no verdict — a scope, never a disposition), the DERIVED RULE evaluated
  #       before the entry table (a declared derived entry is outside the move set:
  #       never moved, never copied to the backup, never counted in the move or byte
  #       totals, never a conflict; a destination copy is `already-migrated` when
  #       present and `absent` when not; a source copy is a reported DERIVED RESIDUAL
  #       that is safe to delete, stays in place while its root is not retired, is
  #       removed with a retired root, and never suppresses the non-derived retirement
