# Canonical plan artifact: this YAML document is the only plan file for the
# change (there is no chg-GH-365-plan.md). `plan validate`, `plan diff`,
# `plan overlap`, and `lint plan` read it directly. Extra phase data (goal,
# obligations, AC/TC ownership, code areas, gate commands, done criteria) rides
# in YAML comments so the parsed document stays schema-strict; the plan declares
# phases and scope only — no `tasks` key and no progress log. Progress is a
# pm-notes `notes:` entry naming the plan phase id, the commit hash, and the gate
# result.
