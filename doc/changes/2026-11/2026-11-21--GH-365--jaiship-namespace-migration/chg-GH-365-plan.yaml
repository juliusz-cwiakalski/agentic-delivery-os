# LOCAL-EXCLUDE PRECONDITION (binding on P1; C10 — the reason P1's first step is an
#   operator action, not a code edit):
#   The commit primitive builds its candidate set from `git status`
#   (`packages/adapters/src/git/commit.ts`) and stages with `git add -A --
#   <paths>` over `packages/core/src/domain/commit-staging.ts`. An untracked path
#   hidden by a LOCAL `.git/info/exclude` entry is therefore invisible to that
#   candidate set, and an explicit add of an ignored path is refused. On a
#   workstation whose `.git/info/exclude` hides `.delivery-os/` and `.jaiship/`
#   (this one did), P1 cannot stage the moved layer at all: `git ls-files
#   .jaiship/config.yaml` stays empty and d1/d2/d3 cannot be green.
#   P1 therefore starts with a local, UNCOMMITTED operator action:
#     1. remove the `.git/info/exclude` entries for `.delivery-os/` and `.jaiship/`;
#     2. write the `.*/projects.yaml` ignore pattern into `.gitignore` (tracked);
#     3. only then stage and commit.
#   The change still commits NO exclude file — `.git/info/exclude` is workstation
#   state, never a change artifact — and the fresh-clone drill already asserts a
#   clone has none. A fresh lane (a new worktree, a new machine, a re-dispatched
#   session) must perform steps 1–2 before its first P1 staging attempt; the PM
#   performed them in the authoring worktree, and the plan records them here for any
#   other lane. Done criterion: `git check-ignore .jaiship/config.yaml` exits 1
#   (not ignored) before the P1 gate.
