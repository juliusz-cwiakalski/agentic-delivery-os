  - text: "PM RULINGS for DoR iteration 2 (binding; iteration 3 is the last):
      (R10/S18) SUPPRESS the delivered command-audit pair for `install migrate`
      in every run (dry-run and applying). The migration is the one declared
      exception because it moves the state store that would receive the record;
      no record is written before, during, or after. API-1/DM-7/AC-F3-1/2/3/4
      and §8.5/§10 say 'zero records of any kind' and name the exception; the
      test plan reverts B2 to zero records and the plan P5 drops the audit-seam
      dependency and index.ts scope. (R11/S19) derived entries are OUT of the
      move set: never moved, counted, or conflicted; a source copy is retained
      and reported as a derived residual (safe to delete), a destination copy is
      `already-migrated` if present and `absent` if not; derived entries do not
      prevent the non-derived retirement line. Update F-3 step 7, DM-6,
      glossary, TC-MIGRATE-005/007, P5. (R12/S20) a declared site is validated
      for PRESENCE always, and for a MATCH only when it lies in a scanned
      corpus; AC-F4-2 scopes 'matched' to scanned sites. (R13/S21) the
      pre-freeze shim's sites are the legacy adapter
      (`packages/adapters/src/legacy/index.ts`) and the eight-variable fixture
      (which holds `ADOS_`); the `DELIVERY_OS_` shim's sites are the owner-hold
      hook, its battery, the three docs, and the entrypoint prior-identity
      harness. Separate the two fixtures. (R14/S22) AC-F6-1 is scoped to the
      primary identity and the MCP composition; the alias is a declared shim
      (its default is prior by design) and is excluded from the clean-home
      prior-path claim. (R15/S23) the `ADOS_WORKING_NAME` exception is
      implemented at the entrypoint/edge raw-environment read (map the legacy
      name to the current override channel there), never in the adapter mapping.
      Update DEC-9/API-5 and plan P8. (R16/S24) reword AC-F1-2: the mutation
      fails the AC-F1-2-named assertion and the real-tree checks stay green;
      drop 'only this criterion' (a shared owning case is acceptable). (R17/C10)
      P1 adds an operational prerequisite: remove the local `.git/info/exclude`
      entries for `.delivery-os/` and `.jaiship/` and add the `.*/projects.yaml`
      ignore pattern before staging. PM performed this in the worktree on
      2026-11-21; the plan must state it for a fresh lane."
    type: decision
    date: "2026-11-21"
