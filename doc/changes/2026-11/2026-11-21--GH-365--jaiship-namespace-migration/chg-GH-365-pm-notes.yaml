  - text: "PM RULINGS for the DoR-iteration-1 remediation (binding on the three
      authors; each is a correctness ruling, not new scope): (R1/S2) the
      migration appends NO migration-specific state record. The delivered audit
      ledger's invocation record is written at the CURRENT host state root
      (destination side) before the move and is not a source entry; it does not
      count as a migration state write. API-1/AC-F3-4 distinguish 'no migration
      record' from 'the delivered audit invocation record'. (R2/S3) the derived
      entry takes the disposition `already-migrated` when a destination copy
      exists and `absent` when it does not; it is never in the source-move set
      and never conflicts. Run verdict = max severity over dispositions with
      order `migrated` < `duplicate-identical` < `conflict` < `blocked`;
      `absent` is neutral. (R3/S4) two schema ids: `install.migration.plan.v1`
      (CLI payload) and `install.migration.manifest.v1` (backup manifest). No
      new error identity. (R4/S5) any symlink entry, on the source or
      destination side, is never followed and never moved: a source symlink is
      `blocked`, a destination symlink is `conflict`; both are retained,
      reported with the path and remedy, and the run exits 1. The owner's
      `.jaiship -> .delivery-os` link is the motivating case. (R5/S6) the
      migration does NOT edit the operator's profile. It detects a delivered
      managed PATH block whose path is under a prior root and reports it as a
      residual with the remedy: re-run the installed artifact's `install` (the
      family that owns the block). The migration report carries the line.
      (R6/S7) the project root class reports scope `unscoped` when the
      invocation is outside a work tree; the two host classes still migrate.
      `unscoped` is a scope value, not a disposition. (R7/S9) DEC-3 and DEC-6
      remain change-local; no additional decision record is authored for them.
      TDR-0074 remains the only new record. (R8/S1) add the `SCOPE_ORG` literal,
      `doc/guides/opencode-model-configuration.md` and the two glossary lines as
      declared neutral sites/sites for the prior-executable seed; state
      explicitly that the frozen DEC-8 path allowlist does NOT suppress the
      prior-namespace class (the two allowlists are independent, and the shim
      registry is the site authority). (R9) no AC is added, removed, or
      renumbered (still 31); the S5-S7 clauses extend existing criteria
      (AC-F3-1, AC-F3-3, AC-F3-5, AC-F3-6) and the affected cases are extended,
      not added."
    type: decision
    date: "2026-11-21"
