summary: >-
  First review iteration. The namespace/identity deliverables are largely sound:
  the committed layer is byte-identical (`git ls-files .jaiship/config.yaml` is the
  single tracked path, digest fa1d82b5… equals the base blob, `.delivery-os` is
  empty), the ignore rules are brand-free and root-anchored, the fresh-clone and
  loaded-path drills pass, both conformance arms are green and non-vacuous
  (content arm 7/7 with 0 violations, tree arm reads its prefix set from the
  registry and reports it), the shim registry is per-shim and both-directions
  reconciled, the override/MCP/bounded-mapping work is correct (override-read for
  prior and pre-freeze, ADOS_FOO inert, MCP default `jaiship`), the proof-boundary
  constant matches the new quality page, and every plan phase has a pm-notes note
  naming its phase id, commit, and gate result with no out-of-scope files. But the
  migration's safety core has two blocking defects and one test weakening: a
  root-level destination symlink is followed (the owner's exact `.jaiship ->
  .delivery-os` shape silently reports `migrated`, and a link pointing elsewhere is
  moved through), container directories are not descended (DM-6/F-3 step 2), the
  audit exception is bypassed when a flag precedes the subcommand, and the
  delivered TC-MIGRATE-009 drops the AC-F3-7 `install status` before/after proof.
  Severity mapping for this report: blocker = critical, major = high, minor =
  medium/low, info = info.
severity_breakdown:
  critical: 1
  high: 3
  medium: 1
  low: 2
  info: 1
