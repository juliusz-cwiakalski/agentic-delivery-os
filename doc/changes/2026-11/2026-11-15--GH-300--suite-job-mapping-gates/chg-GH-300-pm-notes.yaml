decisions:
  - text: "Scope is the M2-S7 contract in the milestone pack, not a general CI
      matrix engine: `verify gates` must cite the suite breadth it evaluated and
      the CI job that breadth mirrors (`data.suiteBreadth`, `data.mirrorsJob`),
      and a narrowed local suite must refuse full green (exit 1, `error.code ==
      verify.narrowed-scope`, narrowed breadth named). Matrix expansion,
      reusable-workflow mapping, job-level `if` awareness, and merge execution
      stay out of scope. Source: backlog M2-S7 and
      doc/planning/oss-tooling/milestones/m2/test-scenarios.md SC-M2-S7-01/02."
    date: "2026-11-15"
  - text: "The mechanism that supplies local breadth (config-declared suite-to-job
      map, a recorded local run, or workflow-derived job mapping) is a technical
      design decision owned by the spec, recorded as a DEC entry with its
      rejected options. The observable contract (fields, error code, exit, and
      the read-only posture) is fixed by the milestone scenarios and the
      delivered verify-gates spec."
    date: "2026-11-15"
