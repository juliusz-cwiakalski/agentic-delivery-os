    type: info
    date: "2026-11-15"
  - text: "DELIVERY HAZARD (P-3, carried into phase 6): this worktree's
      `.git/info/exclude` lists `.delivery-os/`, so the reference declaration at
      `<repo>/.delivery-os/config.yaml` would be silently omitted by a plain
      `git add` while tests pass on the working tree. Phase 5 must force-add the
      file and gate on `git ls-files --error-unmatch .delivery-os/config.yaml`
      before claiming DoD-8."
    type: risk
    date: "2026-11-15"
  - text: "DoR gate ITERATION 1 verdict: NOT_READY (12 blocking findings; seven
      facets FAIL: spec_completeness, plan_coverage, test_traceability,
      cross_artifact_consistency, decision_capture, system_spec_consistency,
      plan_doc_update_coverage). Critical: (F1) the plan's fail-open
      whole-document fallback contradicts AC-F1-2/TC-SMAP-002 because the config
      catalog is strict, turning a malformed map into a silent 'undeclared'.
      Major: (F2) the unreadable-document posture is unpinned and the plan's
      fail-open contradicts spec §21 fail-closed; (F3) the cross-repository
      member path resolves no breadth and still appends the record, so a narrow
      member-mode run can leave fresh full-green evidence; (F4) the plan's
      `readGateSet` wiring would activate config-declared `merge.gates` in
      production for the first time; (F5) the map's configuration-layer posture
      is unpinned and a user-global/local file could replace project-committed
      policy; (F6) no fixture has set-equal but differently ordered local/mirror
      lists, so copying `suiteBreadth` from `local` would pass every TC; (F7)
      Appendix D omits `feature-merge-verify-deploy.md` and
      `doc/quality/test-specs/test-spec-merge-verify-deploy.md`, both stating
      the append rule. Minor: (F8) plan cites test-plan v1.1; (F9) phase 6
      scopes the read-only corpus file; (F10) SC-M2-S7-02's invocation-scoped
      Given is re-read as declaration-scoped without recording it; (F11) the MCP
      `gate-report` shipped-composition posture is unpinned. Record:
      readiness-review/readiness-iter-1.md."
    type: risk
    date: "2026-11-15"
  - text: "RETRO: the DoR gate caught three false premises that three artifact
      authors had accepted — that a strict config catalog can fail open into
      'undeclared', that the cross-repository path shares the single-path
      refusal, and that the delivered composition already supplies the declared
      gate set from config. Improvement: any artifact statement of the form 'the
      same values that supply X' must cite the delivered call site, and any
      refusal/no-append rule must be stated once for BOTH report paths."
    type: retro
    date: "2026-11-15"
