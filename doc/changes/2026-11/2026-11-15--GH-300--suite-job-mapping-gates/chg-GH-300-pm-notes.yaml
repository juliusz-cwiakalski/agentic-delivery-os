    type: info
    date: "2026-11-15"
  - text: "RETRO: both reopens were caught by the sequential-authoring rule before
      the DoR gate — the spec pinned the narrow refusal but left the header
      grammar and its breadth ownership implicit, and the test plan then re-used
      one field for two different values. Cost: two artifact revision cycles
      (~20 min), no rework in code. Improvement: when a spec introduces a new
      human-rendered line, pin its byte grammar and the owner of every value it
      prints in the same pass; when a refusal reuses an existing envelope field,
      state which value wins."
    type: retro
    date: "2026-11-15"
  - text: "Plan authored: 7 delivery phases, all `delivery` tier full — (1)
      pre-change parity baseline capture, (2) contract layer, (3) pure
      evaluation, (4) runtime wiring (the only runtime-behaviour phase), (5)
