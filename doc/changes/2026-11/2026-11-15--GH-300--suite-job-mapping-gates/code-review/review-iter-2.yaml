  - id: F-11
    severity: low
    confidence: high
    category: testing
    location: tests/structure/verify-gates-suite-map-reference.test.ts:338
    message: >-
      The narrowed and equality composer cases assert `transportCalls`/`credentialCalls`
      are empty, but their checkouts pass no `origin` option, so the repository
      binding is unresolved and provider reads are `notAttempted` regardless of the
      breadth decision — the zero-read assertion is vacuous. A probe on a resolved
      (origin) checkout shows the same narrowed declaration performs two credential
      resolves before the narrowed refusal, so the test's implied claim ("narrowed
      reads no provider facts") is not true and only passes because the fixture
      suppresses provider reads. The equality case (line 376) is likewise
      non-discriminating: an unwired map yields the same `verify.gates.failed`
      outcome.
    suggestion: >-
      Either drive the narrowed case on a resolved checkout and assert the actual
      ordering (breadth resolved from the local workflow read with no member read),
      or drop the "zero provider reads" claim and keep only the refusal/detail
      assertions. Give the equality case an observable discriminator (or state the
      P-9 residual there) so a mis-wired seam cannot pass it.
    suppressed: false
    published_url: null
    published_at: null
