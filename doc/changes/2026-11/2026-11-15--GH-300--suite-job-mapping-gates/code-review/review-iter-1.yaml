summary: >-
  The M2-S7 implementation is functionally strong: the pure suite-map resolver,
  four-outcome breadth rule, narrowed-scope refusal, committed-slot document
  posture, report/detail projection, MCP mirror, no-append rule, parity, read
  budget and reference declaration all pass their targeted suites (424 tests
  green) and the delivered surfaces are preserved. The change cannot pass the
  repository quality gate yet: `pnpm lint` fails because
  `tests/behaviour/verify-gates-suite-map.test.ts` redeclares `clone`, so
  `pnpm check` and DoD-10 are red. Three medium issues additionally need
  remediation: the job-name class accepts Unicode line/paragraph separators
  (AC-F1-2), three new suites depend on a pre-existing `tmp/tmpdir` and fail in
  isolation on a clean checkout, and the plan under-declares eight changed files
  while the delivery note records no per-phase test results. The reference
  declaration is tracked and resolves to equality, but its "end-to-end" proof
  bypasses the shipped CLI composition (text-grep only).
