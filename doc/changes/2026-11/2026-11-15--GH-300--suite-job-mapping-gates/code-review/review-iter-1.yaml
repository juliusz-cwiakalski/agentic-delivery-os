  - id: F-2
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/verify-gates-suite-map.ts:33
    message: >-
      `hasControlCharacter` rejects only C0 (0x00-0x1f) and C1 (0x7f-0x9f)
      characters. A job name containing U+2028 LINE SEPARATOR or U+2029
      PARAGRAPH SEPARATOR (and Unicode Cf bidi/format controls) is accepted,
      although AC-F1-2 requires a `job` carrying a control character or a line
      break to be refused and Appendix A row 26 requires a single-line
      printable class. A parsed `job: "TS\u2028aggregate check"` resolves, and
      the rendered `cause: mirror=` line then contains U+2028, violating the
      pinned one-physical-line grammar. The same predicate is duplicated in
      `packages/cli/src/index.ts:196`.
    suggestion: >-
      Reject Unicode line/paragraph separators and format controls in the
      shared job-name class (for example `\p{Zl}`, `\p{Zp}`, and `\p{Cf}`, or a
      strict printable single-line allowlist), use one shared predicate instead
      of two copies, and add U+2028/U+2029 fixtures to `DEFECTS` and the
      adapter/handler expectations.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    confidence: high
    category: testing
    location: tests/behaviour/verify-gates-config-document-adapter.test.ts:52
    message: >-
      Three new suites call `mkdtempSync` under the repo-relative
      `tmp/tmpdir` without ensuring the directory exists. On a fresh checkout
      the parent is absent, so running the suite in isolation throws ENOENT;
      I reproduced 27/28 failures in
      `tests/behaviour/verify-gates-config-document-adapter.test.ts` after
      moving `tmp/tmpdir` aside. The same pattern is at
      `tests/behaviour/verify-gates-config-layer-posture.test.ts:58` and
      `tests/structure/mcp-gate-map-composition.test.ts:53`. Full-suite runs
      pass only because another loaded module creates the directory as a
      top-level side effect, which makes the suites order-dependent.
    suggestion: >-
      Call `mkdirSync(TMP, { recursive: true })` before each `mkdtempSync`
      (as existing suites do) or use `os.tmpdir()` via `makeTempRoot`; then
      verify each suite runs alone in a clean tree.
    suppressed: false
    published_url: null
    published_at: null
