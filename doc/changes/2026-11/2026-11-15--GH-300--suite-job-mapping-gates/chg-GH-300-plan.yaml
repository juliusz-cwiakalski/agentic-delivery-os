  #       - `diagnosticFor` writes exactly `<binary>: <code>` then
  #         `cause: <payload>` for those two refusals and nothing else; the
  #         config-shaped summary/hint suppression is untouched, so the envelope
  #         keeps the table's own prose and no `detail` (DEC-14, DEC-16);
