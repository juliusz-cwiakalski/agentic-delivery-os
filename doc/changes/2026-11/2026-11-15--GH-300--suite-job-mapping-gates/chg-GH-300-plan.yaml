#               doc/spec/features/feature-plan-schema.md (scope keys
#               files/packages/folders, doneArtifacts slots, leases, weightClass,
#               interactions, tier; no tasks key, no progress log).
#   - Delivered code seams inspected for this plan:
#               packages/core/src/contracts/{verify-gates,result,error-table,
#               config,index,plan}.ts; packages/core/src/config/catalog.ts;
#               packages/core/src/domain/{verify-gates,verify-gates-members,
#               merge-gate-set,plan-validate}.ts; packages/adapters/src/file/
#               {config-source,yaml-parser,index}.ts; packages/cli/src/commands/
#               verify-gates.ts; packages/cli/src/{edge,production,index}.ts;
