  # ---------------------------------------------------------------------------
  # Phase 4 — Runtime wiring: the seam, the fail-closed document classification,
  # the handler on both report paths, the CLI projection, and the MCP command
  # mirror — the whole breadth behaviour in ONE commit.
  #
  # Goal: turn the pure rule into the observable contract. Equality reports, a
  # narrowing refuses, an unattributable declaration refuses, an unusable
  # document refuses before any source read, an invalid workflow keeps the
  # delivered path. This phase is deliberately the ONLY phase that changes
  # runtime behaviour: a narrowed declaration must never be able to produce a
  # full-green report in any committed state (no false pass, AC-F3-1..AC-F3-6,
  # NFR-6).
  #
  # Obligations:
  #   4.1 Seam (pinned shape, see OQ-T4 RESOLUTION): optional `readSuiteMap`
  #       beside the untouched `readGateSet` on VerifyGatesCommandRuntime,
  #       optional on VerifyGatesRuntimeOptions, edge default
  #       `{ ok: true, declared: false }`, and the same optional seam on
  #       GateReportToolRuntime. The seam performs no I/O: the read it exposes is
  #       the composition's single bounded document read. The gate-set seam is
  #       NOT wired to configuration values and the delivered default
  #       (shipped five) is unchanged (NG-7, DEC-11).
  #   4.2 Handler order (packages/cli/src/commands/verify-gates.ts):
  #       grammar -> readSuiteMap classification -> [absent or no-node:
  #       undeclared, continue; unreadable / unparseable / defective node:
  #       `config.value.invalid`, exit 1, no `data`, BEFORE any ledger,
  #       repository, workflow, or provider read] -> readGateSet (delivered
  #       shipped five) -> repository/lifecycle/workflow/provider reads in the
  #       delivered order -> breadth resolution -> (unmirrored/uncorroborated:
  #       `config.value.invalid` + the one cause line, NO append, NO capsule) ->
  #       battery evaluation -> (narrower: `verify.narrowed-scope`,
  #       `detail.suiteBreadth`, narrowed summary, NO append, NO capsule) ->
  #       equality -> delivered append + capsule -> report with the two fields.
  #       The refusal is evaluated BEFORE the verdict projection and BEFORE the
  #       delivered append (DEC-6, DEC-7). On a member-declaring change the
  #       breadth resolution and the narrowed refusal happen BEFORE
  #       `crossRepositoryEvaluation`: before any member read and before the
  #       `runtime.appendVerification(record)` call, so the data-bearing
  #       `overall: "fail"` report, every member verdict, and every
  #       `definitionOfDone.status` are unreachable (AC-F3-6, C-17).
  #   4.3 Document-state matrix (TC-SMAP-006): the injected read classifies
  #       every state exactly once — absent (no repository root or no file) and
  #       parsed-without-node are undeclared parity; present-but-unreadable,
  #       unparseable-as-a-whole, and a defective map node are
  #       `config.value.invalid` with one identity whichever layer (catalog
  #       schema or map resolver) catches it; a defect elsewhere in the document
  #       is not interpreted and an otherwise valid declaration still reports.
  #       A structural map defect writes NO `cause:` line; the delivered
  #       config-shaped summary/hint suppression is untouched; no document state
  #       yields a report, breadth fact, record, capsule event, or pass except a
  #       resolved equality. The classification is asserted before any source
  #       read by a recording runtime (DM-9, DEC-18, NFR-10, AC-F1-4).
  #   4.4 Narrowed refusal envelope: exit 1, no `data`, `error.kind: verify`,
  #       `error.code: verify.narrowed-scope`, category user, retryable false,
  #       consequence not_landed, summary = the narrowed six-line block
  #       (member-less path) or the one-line block (member-declaring path),
  #       `detail.suiteBreadth` = the COMPLETE local declaration in declared
  #       order, never truncated (<= 32 x <= 64) (DM-5, DM-6, AC-F3-1,
  #       AC-F3-5, AC-F3-6).
  #   4.5 CLI projection (packages/cli/src/index.ts):
  #       - `explicitDetail` honours `suiteBreadth` beside the unchanged
  #         `holder`: array of <= 32 identifiers, each 1..64 chars matching the
  #         suite-id grammar, no control characters; a malformed, over-bound, or
  #         non-array value is NEVER projected and NEVER clipped. The member is
  #         validated by its own declared bound (DM-6), never by the delivered
  #         `holder` bound, and its presence never displaces `holder` for a
  #         holder-carrying refusal (TC-SCTR-002);
  #       - an `explicitCause` reader honours `cause` ONLY when the resolved code
  #         is `config.value.invalid` and the payload matches the two pinned
  #         grammars within the derived bounds (134 / 545); no other failure may
