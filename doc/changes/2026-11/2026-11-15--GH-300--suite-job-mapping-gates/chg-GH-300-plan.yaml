  # Obligations:
  #   5.1 Author `<repo>/.delivery-os/config.yaml` with the pinned literal
  #       document (Appendix A row 21): `verify.suite-map` with
  #       `schemaVersion: "delivery.verify.suite-map.v1"`, ONE `jobs[]` entry
  #       `{ job: "TS aggregate check", suites: [tests, lint, format, typecheck,
  #       boundaries, prompt-conformance, help-guide-coverage, exports-parity] }`,
  #       and `local` = the same eight identifiers in the same order. The path is
  #       the delivered project-committed layer `<repo>/<configDirectoryName>/
  #       config.yaml` with `configDirectoryName` derived from the working name
  #       `delivery-os` — never a hardcoded product name.
  #   5.2 TRACKING HAZARD (must be closed, not assumed): this worktree's
  #       repository-level `.git/info/exclude` lists `.delivery-os/`, so a plain
  #       `git add` silently drops the document and TC-SMAP-004 would pass on a
  #       local file the PR never carries. The phase forces the add
  #       (`git add -f .delivery-os/config.yaml`, or records that the commit
  #       primitive's staging resolves the path) and the boundary gate asserts
  #       `git ls-files --error-unmatch .delivery-os/config.yaml` succeeds and
  #       that the file is present in the phase commit (RSK-4, DoD-8).
  #   5.3 Composition (packages/cli/src/production.ts): perform ONE configuration
  #       acquisition for the gates runtime — `acquireFileConfig` with
  #       `enableProjectLocalConfig: true` and
  #       `configurationDirectoryName: brand.configDirectoryName`, then
  #       `resolveConfig` (the delivered daemon-family posture) — memoize it, and
  #       serve BOTH seams from that one snapshot: `readGateSet` =
  #       `resolveMergeGateSetFromConfig(values)` and `readSuiteMap` =
  #       `resolveVerifySuiteMapFromConfig(values)`, each mapped onto its seam
  #       shape by one pure helper in packages/cli/src/edge.ts (single source for
  #       the projection). No per-invocation I/O, no extra transport call, and
  #       identical behaviour with and without a declared map (NFR-4,
  #       AC-F5-4).
  #   5.4 Failure posture (pin, consistent with DEC-11/DEC-12): an acquisition or
  #       whole-document resolution failure falls back to the empty snapshot and
  #       therefore to "undeclared + shipped gate set" — the delivered behaviour
  #       stands; ONLY a readable document carrying an invalid `verify.suite-map`
  #       node refuses `config.value.invalid`. This keeps parity for a repository
  #       whose configuration is absent or unresolvable and refuses exactly the
  #       declaration defect this change owns.
  #   5.5 End-to-end proof (tests/structure/verify-gates-suite-map-reference
  #       .test.ts, TC-SMAP-004): assert the document path via the branding seam;
  #       read the committed document through the delivered configuration adapter;
  #       assert the closed shape and every pinned literal (schema, one job, the
  #       eight identifiers in order, equal `local` in the same order); read the
