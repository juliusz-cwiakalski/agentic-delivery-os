# OQ-T4 RESOLUTION — how the suite map reaches the gates runtime
# (test-plan §8.3 OQ-T4 is the one plan-owned seam question; spec DEC-11 names
# `readSuiteMap` and pins "defaulting to undeclared"):
#   CHOSEN: a SECOND injected read function `readSuiteMap` beside the delivered
#     `readGateSet`, OPTIONAL, absent meaning "undeclared". It returns a closed
#     union and performs no I/O:
#       export type VerifySuiteMapRead =
#         | { readonly ok: true; readonly declared: false }            // absent / no node
#         | { readonly ok: true; readonly declared: true;
#             readonly value: VerifySuiteMap }                          // parsed map
#         | { readonly ok: false; readonly code: "config.value.invalid";
#             readonly detail?: string };                               // unreadable / unparseable / defective
#       // VerifyGatesCommandRuntime          (packages/cli/src/commands/verify-gates.ts)
#       readonly readSuiteMap?: () => VerifySuiteMapRead;
#       // VerifyGatesRuntimeOptions          (packages/cli/src/edge.ts)
#       readonly readSuiteMap?: VerifyGatesCommandRuntime["readSuiteMap"];
#       // GateReportToolRuntime              (packages/mcp/src/commands/gate-report.ts)
#       readonly readSuiteMap?: () => VerifySuiteMapRead;
#     The edge default is `() => ({ ok: true, declared: false })`, so a
#     composition that supplies nothing yields the delivered behaviour exactly.
#     The read is the ONE bounded configuration-document RESOLUTION ATTEMPT on
#     the project-committed layer slot (or the explicitly selected file in that
#     slot): at most one stat-class existence probe plus at most one bounded
#     content read, and zero content reads when neither a selected nor a
#     committed path exists; the map node is validated by the map's own
#     resolver, and the whole-document catalog-resolution outcome is never
#     consumed for the map.
#   DOCUMENT CLASSIFICATION (DM-9, DEC-18, NFR-10, AC-F1-4):
#       absent: NO SELECTION IN PLAY (the
#         `${environmentPrefix}CONFIG` selector unset)
#         AND no committed document — no root, or no
#         such file                               -> { ok: true, declared: false }
#         (an existence probe only; zero content reads)
#       selection names a MISSING or UNREADABLE path -> { ok: false, config.value.invalid }
#         (the delivered unusable-selector refusal,
#          never the absent/parity path; it is a
#          selection failure, not a document-content
#          defect, so the tolerance does not reach it)
#       parsed, no `verify.suite-map` node             -> { ok: true, declared: false }
#       parsed, valid node                             -> { ok: true, declared: true, value }
#       parsed, defective node                         -> { ok: false, config.value.invalid }
#       present but unreadable                         -> { ok: false, config.value.invalid }
#       unparseable as a whole, i.e. a parser-level
#         failure anywhere (duplicate key, unsupported
#         YAML tag, non-JSON scalar, non-mapping root,
#         over-cap document)                           -> { ok: false, config.value.invalid }
#       schema/semantic defect elsewhere in the
#         document (another branch, unknown key,
#         forbidden value)                             -> not interpreted; a valid map
#                                                         declaration stands
#     The node is validated by the map's own resolver, which is the ONLY validator
#     for it: the catalog branch can express only type/required/additionalProperty
#     facts, cannot express the identifier grammar, the length and cap bounds, or
#     list uniqueness, and its whole-document outcome is never consumed here.
#     The refusal is evaluated before any ledger, repository, workflow, or
#     provider read. No document and no selection state yields a report, breadth
#     fact, record, or pass except a declaration that resolves to equality.
#   LAYER POSTURE (DEC-19, AC-F1-5): the map read consults exactly one source —
#     the repository document at `<repo>/<configDirectoryName>/config.yaml`, or
#     the explicitly selected file occupying that slot. System, user-global,
#     project-local, environment, and CLI sources are never read for the map;
#     the merged layer tree is never consulted. An overlay declaration has no
#     effect and is not a refusal. This posture is SCOPED to the suite-map read:
#     it is not a general committed-slot-only rule for all policy data, and
#     nothing in this plan cites it as that precedent.
#   GATE-SET POSTURE (NG-7, DEC-11, F-4): the delivered `readGateSet` seam is
#     byte-identical. The production composition still supplies no declared gate
#     set, so `verify gates` evaluates the shipped five; `resolveMergeGateSetFromConfig`
#     is not called from `packages/cli` or `packages/mcp` by this change. The map
#     read is independent and must not alter the battery for any adopter.
#   REJECTED: (a) one combined resolved-config call returning gate set plus map —
#     it would activate a config-declared `merge.gates` in production (NG-7) and
#     change the delivered construction-site shape (harness, MCP parity fixture,
#     exports asserted by tests/structure/verify-gates-exports.test.ts), weakening
#     the AC-F5-1 parity guarantee; (b) reusing `acquireFileConfig`'s merged tree
#     and filtering by origin — the delivered acquisition reads ambient overlays
#     and fails fast across layers, so it cannot satisfy DEC-19's
#     committed-slot-only isolation.
#   COMPOSITION: one new adapter read (`readCommittedConfigDocument`) resolves the
#     committed-slot path from the branding seam and the delivered selection rule
#     and performs the single bounded resolution attempt; one pure projection
#     extracts `verify["suite-map"]` and hands it to
#     `resolveVerifySuiteMapFromConfig`; the CLI and MCP compositions memoize the
#     result and serve the `readSuiteMap` seam. The seam gains one pure call.
#     Read accounting is NOT a parity claim: the seven enumerable gates sources
#     are read exactly as delivered in both states, and the change adds exactly
#     ONE bounded configuration-document resolution attempt per invocation — at
#     most one stat-class existence probe and at most one bounded content read,
#     with zero content reads when neither a selected nor a committed path exists
#     — performed with or without a declaration and counted by the
#     instrumented-read assertions (NFR-4, NFR-10, AC-F5-4, TC-SPAR-004). The
#     zero-I/O edge default above is the absent-composition path only (an
#     embedding that supplies no read at all); both shipped compositions do
#     supply the real read, so on every shipped surface the budget counts exactly
#     one resolution attempt whether or not the document declares a map.
#
# PRE-CHANGE PARITY PROVENANCE (NFR-8, AC-F5-1, AC-NFR8-1, TR-1):
#   Phase 1 captures `tests/fixtures/verify-gates/suite-map/parity-baseline.json`
#   from branch base 8a1f77ad BEFORE any production edit (all 48 delivered
#   corpus cases in JSON and human modes, no map: caseId, stdout, stderr,
#   exitCode, plus appended record bytes where the case appends). Provenance is
#   recorded inside the fixture (base sha, corpus case count, modes, capture
#   command, capture timestamp) and in pm-notes by the PM lane. The delivered
#   goldens `success-data.json`, `human-success.txt`, and `failure-summary.txt`
#   are read UNCHANGED for the whole change; regeneration after the change is
#   allowed only with a review-visible diff and a recorded reason, otherwise the
#   parity proof becomes a tautology (TR-1). PARITY IS SCOPED:
#   only the two undeclared states (absent document with no selection in play;
#   document parsed without a map node) carry a parity claim. A selection naming
#   a missing or unreadable path, and unreadable, unparseable, and defective-node
#   documents, are the AC-F1-4 refusal and are excluded from the baseline; the
#   scope manifest `tests/fixtures/verify-gates/suite-map/parity-scope.json`
#   classifies every state exactly once (`parity` / `refusal` /
#   `resolved-equality`), so no state is claimed as both (NFR-8, NFR-10,
#   AC-NFR8-1, TC-SPAR-006).
#
# CONSTRAINTS CARRIED FROM THE SPEC (Appendix C, binding on every phase):
#   C-1 no execution — no suite, workflow step, child process, or provider write
#       is ever run; breadth is declared and read (NG-2, DEC-1).
#   C-2 two declared sides, one comparison — a single-sided declaration cannot
#       produce a check (DEC-1, DEC-2).
#   C-3 a report exists only on equality; every other outcome is a refusal or
#       the delivered failure (DEC-5, NFR-6).
#   C-4 `suiteBreadth` is the mirrored CI breadth, never the local declaration
#       and never a union (DEC-4).
#   C-5 a narrowed refusal appends nothing — no record, no capsule event (DEC-7).
#   C-6 exactly one new error row and one new `detail` member; no new domain
#       kind, no reworded row (NFR-7, DEC-8).
#   C-7 exactly one bounded configuration-document resolution attempt per
#       invocation and no other added read — at most one stat-class existence
#       probe and at most one bounded content read (zero content reads when
#       neither a selected nor a committed path exists), performed with or
#       without a declaration; corroboration reuses the workflow read — 0
#       provider, network, transport, or state reads added, and the seven
#       enumerable gates source counts unchanged (NFR-4, NFR-10, DEC-11,
#       DEC-19).
#   C-8 the record, the CI gate, the five gates, the grammar, and the human
#       output do not move (DEC-9, DEC-10, DEC-12).
#   C-9 default tests are configuration- and workflow-fixture driven, zero live
#       calls (NFR-3).
#   C-10 current-truth specifications flip in phase 7 only, per D-1..D-28
#       (NG-5, DoD-9). One sanctioned in-change exception: the two-way
#       error-table sync edit — the documented `verify.narrowed-scope` row in
#       doc/spec/features/feature-result-contract.md (D-7) lands in the same
#       commit as the `ERROR_TABLE` row because the delivered sync gate binds
#       them together; every other current-truth reconciliation stays in phase 7
#       (Appendix A row 28).
#   C-11 gates and commit hygiene: `pnpm check` with the pm-notes environment
#       before the PR, subjects scoped GH-300, body/footer lines <= 100
#       characters, PR to main-tools staying open (DEC-13, NFR-9).
#   C-12 the narrowed header names the mirrored CI breadth, never the local set;
#       the local set is `detail.suiteBreadth` and nothing else (DEC-15).
#   C-13 the map-side cause reaches only the bounded error-stream `cause:` line;
#       the envelope stays the table's own and gains no line and no member
#       (DEC-16).
#   C-14 this repository's reference declaration is pinned literal data and must
#       resolve to equality end-to-end, not by fixture reasoning (DEC-17, DM-8).
#   C-15 the declaration is enforced exactly when declared — only an absent
#       document (no selection in play and no committed document) or one without
#       the node is "undeclared"; a `${environmentPrefix}CONFIG` selection naming
#       a missing or unreadable path is the delivered unusable-selector refusal,
#       a selection failure rather than a document-content defect; a schema or
#       semantic defect outside that node has no opinion on the gate run or on
#       the declaration, and a parser-level failure anywhere in the document
#       refuses the whole document (DEC-18, NFR-10, Appendix A rows 22 and 27).
#   C-16 the map comes from the project-committed layer slot only; an overlay
#       never supplies, completes, or replaces it, and an overlay declaration is
#       not a refusal either (DEC-19).
#   C-17 both report paths share one breadth resolution and one refusal; a
#       member-declaring narrowing refuses before any member read and appends
#       nothing (DEC-6, AC-F3-6).
#
# SCOPE CONVENTION: `files` are exact repository-relative paths; `folders` are
#   boundary-aware prefixes declared by every phase that writes a NEW file inside
#   them; a file edited in two phases is declared in both phases. A declared file
#   that ends up untouched is a `plan diff` observation, never a gate failure
#   (the conditional/control rows below are declared for exactly that reason).
#   `tests/fixtures/verify-gates/corpus/cases.json` is a READ-ONLY control: the
#   new declaration matrix lives in tests/fixtures/verify-gates/suite-map/cases.ts
#   and the corpus stays at 48 cases, so the baseline's "48" stays true. It is
#   deliberately NOT a `scope.files` entry in any phase (DoR iteration-1 F9).
#
# TC -> PHASE MAP (38 ids; every id owned by exactly ONE phase — the phase that
#   first makes its complete suite set green):
#   Phase 1 baseline            (0): owns no TC; supplies the pre-change
#        baseline that Phase 6's TC-SPAR-001/TC-SPAR-006 consume.
#   Phase 2 contract layer      (1): TC-SCTR-003.
#   Phase 3 evaluation core     (0): proves the pure halves of SMAP-001/003/005,
#        SCITE-001/003/006, SNARR-001/005, SRES-002/003/004/005, SCTR-001/002.
#   Phase 4 runtime wiring     (24): TC-SMAP-001, TC-SMAP-002, TC-SMAP-003,
#        TC-SMAP-005, TC-SMAP-006, TC-SCITE-001, TC-SCITE-003, TC-SCITE-004,
#        TC-SCITE-006, TC-SNARR-001, TC-SNARR-002, TC-SNARR-003, TC-SNARR-004,
#        TC-SNARR-005, TC-SNARR-006, TC-SRES-001, TC-SRES-002, TC-SRES-003,
#        TC-SRES-004, TC-SRES-005, TC-SCTR-001, TC-SCTR-002, TC-SPAR-002,
#        TC-SWRITE-001.
#   Phase 5 reference decl.     (4): TC-SMAP-004, TC-SMAP-007, TC-SMAP-008,
#        TC-SCITE-005. TC-SMAP-008 is the REAL-ADAPTER witness of the document
#        classification (DoR iteration-2 finding 3); TC-SMAP-006 stays in
#        Phase 4 as the injected handler-seam witness, so the two are never
#        duplicates and each is owned once (P-8).
#   Phase 6 cross-cutting       (9): TC-SPAR-001, TC-SPAR-003, TC-SPAR-004,
#        TC-SPAR-005, TC-SPAR-006, TC-SCITE-002, TC-SDET-001, TC-SDET-002,
#        TC-SHERM-001.
#   Phase 7 docs/release        (0): DoD-9, DoD-10, D-1..D-28.
#   Phase 8 review remediation  (0 new ids): owns no TC id; re-proves TC-SMAP-003
#        (job character class and rendered grammar), TC-SMAP-004 (composition
#        end-to-end), TC-SMAP-006 (injected document seam), TC-SMAP-008 (real
#        adapter, including the valid selected path), TC-SNARR-001 (rendered
#        header), TC-SPAR-001 (parity non-vacuity), TC-SCITE-005 (MCP
#        composition supplement), and TC-SCTR-002 (restored `holder` predicate)
#        through regression cases owned by no new id.
#   Totals: 38/38 TCs owned; 30/30 ACs named (§17 AC -> phase table below).
#
# AC -> PHASE (every §17 criterion named at least once; a criterion proven by
#   two TCs is listed in both phases where those TCs live):
#   P2: AC-NFR7-1, AC-NFR1-1 (static `detail` key set). P3 (pure halves):
#   AC-F1-1, AC-F1-2, AC-F1-3, AC-F2-1, AC-F2-3, AC-F3-1, AC-F3-5, AC-F3-6,
#   AC-F4-1, AC-F4-2, AC-F4-3, AC-F4-4, AC-NFR2-1.
#   P4: AC-F1-1, AC-F1-2, AC-F1-3, AC-F1-4, AC-F2-1, AC-F2-3, AC-F3-1,
#   AC-F3-2, AC-F3-3, AC-F3-4, AC-F3-5, AC-F3-6, AC-F4-1, AC-F4-2, AC-F4-3,
#   AC-F4-4, AC-F5-2, AC-NFR1-1, AC-NFR2-1, AC-NFR5-1, AC-NFR8-1.
#   P5: AC-F1-1, AC-F1-2, AC-F1-4, AC-F1-5, AC-F2-1, AC-F5-6, AC-NFR8-1
#   (TC-SMAP-008 adds AC-F1-2 and AC-NFR8-1 to this phase).
#   P6: AC-F5-1, AC-F5-3, AC-F5-4, AC-F5-5, AC-F2-2, AC-F1-4, AC-NFR2-1,
#   AC-NFR3-1, AC-NFR5-1, AC-NFR8-1.
#   P8 (re-proves, adds no criterion): AC-F1-1, AC-F1-2, AC-F1-4, AC-F1-5,
#   AC-F2-1, AC-F3-1, AC-F4-2, AC-F4-3, AC-F5-1, AC-NFR1-1, AC-NFR3-1,
#   AC-NFR8-1 — each already named by the phase that owns its TC.
#   Unique criteria named across phases: 30/30 (§17). No criterion is orphaned;
#   each listing is either the phase that owns the criterion's TC, the phase that
#   proves its pure half, or a re-run of an owning suite.
#
# SUITE-HOME COVERAGE: 67/67 writable suite and fixture homes named by test-plan
#   v1.5 §7 and §6.2-§6.4 (37 test/type homes including
#   tests/structure/inventory.json, and 30 fixture/contract-data homes; the five
#   `suite-map/layers/*.yaml` overlays count as one home and the per-case
#   `suite-map/config/adapter/<case>/` roots count as one home) are inside a
#   declared phase scope. Test plan v1.5 adds no TC and no home, so the total is
#   unchanged. The two additions over revision 1.2 are
#   `tests/behaviour/verify-gates-config-document-adapter.test.ts` (phase 5
#   scope.files) and the per-case adapter fixture roots under
#   `tests/fixtures/verify-gates/suite-map/config/adapter/` (phase 5
#   scope.folders `tests/fixtures/verify-gates/suite-map`), which carry the
#   selected-but-missing and selected-but-unreadable roots as well as the
#   document-content states. Three inputs are
#   READ-ONLY and deliberately outside every scope, exactly as before: the
#   delivered corpus control `tests/fixtures/verify-gates/corpus/cases.json`
#   (read by Phase 1 and Phase 6, DoR F9), the delivered cross-repository golden
#   `tests/fixtures/cross-repository/goldens/gates-members-green.json` and the
#   other delivered goldens read unchanged, and the existing type-test config
#   `tests/types/tsconfig.json` that Phase 2/4/6 invoke.
#
# PLAN-OWNED PINS AND RESIDUAL GAPS (nothing below invents a requirement; each
#   item is either a plan decision inside a spec-declared freedom or a recorded
#   inconsistency for its owner):
#   P-1 (spec-pinned; no plan discretion) CONFIGURATION-DOCUMENT POSTURE. The
#       document occupying the project-committed layer slot is classified
#       fail-closed: absent (no selection in play and no committed document) and
#       parsed-without-node are undeclared parity; a selection naming a missing
#       or unreadable path is the delivered unusable-selector refusal, never
#       parity; present-but-unreadable, unparseable-as-a-whole, and a defective
#       map node are `config.value.invalid` at exit 1 with no `data`, before any
#       gates source read; a schema or semantic defect elsewhere in the document
#       is not interpreted, so it neither refuses the run nor removes a valid
#       declaration, while a document-level parser failure anywhere (duplicate
#       key, unsupported YAML tag, non-JSON scalar, non-mapping root, over-cap
#       document) is the unparseable-as-a-whole refusal. The node is decided by
#       the map's own resolver, the only validator for it; the catalog branch's
#       whole-document outcome is never consumed here. One bounded resolution
#       attempt (at most one existence probe, at most one content read); no
#       overlay and no merged-tree read; no document or selection state yields a
#       report, breadth fact, record, or pass except a resolved equality (DM-9,
#       DEC-18, DEC-19, NFR-10, AC-F1-4, AC-F1-5, Appendix A rows 22 and 27).
#       The former fail-open plan pin is withdrawn (DoR F1).
#   P-2 (plan decision, sequencing; sanctioned exception) THE DOCUMENTED ERROR
#       ROW LANDS IN PHASE 2, in the same commit as the code row, because the
#       delivered two-way sync gate runs inside `pnpm test` and would otherwise
#       fail a phase boundary. This is the one in-change current-truth edit C-10
#       sanctions (Appendix A row 28, D-7): test plan v1.5's TC-SCTR-003
#       precondition and §6.6 now state the same thing — the documented row, the
#       135 -> 136 count assertion, and the true-positive corpus entry land in
#       phase 2 before any boundary that runs the sync gate (DoR iteration-3
#       finding 4) — and Phase 7 then reconciles only D-7's surrounding
#       prose. The 135 -> 136 count, the live/mirrored assertion pair, and the
#       true-positive corpus entry move together; every other current-truth
#       reconciliation stays in Phase 7.
#   P-3 (delivery hazard, not a spec gap) `.delivery-os/` IS LISTED IN THIS
#       WORKTREE'S REPOSITORY-LEVEL `.git/info/exclude`, so a plain `git add`
#       would silently leave the DM-8/DEC-17 reference declaration out of the
#       commit while TC-SMAP-004 still passed against the working tree (a fake
#       DoD-8). Phase 5 therefore declares the forced add and the
#       `git ls-files --error-unmatch .delivery-os/config.yaml` gate assertion.
#   P-4 (CLOSED — test plan v1.2 §9) The former TC-SNARR-001 `error.summary`
#       contradiction is resolved: the narrowed envelope `error.summary` is the
#       rendered failure-summary block (the delivered header plus one line per
#       gate on the member-less path, and exactly one header line on the
#       member-declaring path), the DM-5 one-sentence summary remains the row
#       default asserted only on the table and its documented mirror, and
#       `error.remediationHint` is the row's hint. This plan binds the spec v1.4
#       reading (unchanged since v1.2); no obligation changes and no TC moved.
#   P-5 (verification, not a gap) The suite-map node adds no byte bound of its
#       own (DM-3): it is a node of the already-bounded configuration-document
#       resolution attempt and every collection in it is capped, so no new
#       document bound is declared and none is needed.
#   P-6 (spec-pinned) GATE-SET POSTURE. The delivered `readGateSet` seam is
#       untouched and production still supplies no declared gate set; the map
#       read is independent and must not alter the battery for adopters. No
#       config-declared `merge.gates` becomes live (NG-7, DEC-11, F-4).
#   P-7 (spec-pinned) PARITY SCOPE. The undeclared-map parity claim covers only
#       an absent document (no selection in play and no committed document) or
#       one without the node; a selection naming a missing or unreadable path and
#       every unusable document state are the AC-F1-4 refusal with no parity
#       claim, and the outside-node tolerance is bounded to schema or semantic
#       defects in exactly the other branches, keys, and values — never to a
#       selection failure and never to document content the parser rejects
#       (NFR-8, NFR-10, AC-NFR8-1, Appendix A rows 22 and 27).
#   P-8 (plan decision, verification layering) THE DOCUMENT-CLASSIFICATION
#       POSTURE HAS TWO WITNESSES AND EACH TC IS OWNED ONCE. Phase 4 owns
#       TC-SMAP-006 — the handler branch over the injected configuration seam,
#       which is the only shape that exists at that boundary — and Phase 5 owns
#       TC-SMAP-008 — the real `readCommittedConfigDocument` composed as
#       production composes it, with each case's `<root>` supplied through
#       `FileAcquisitionInput.explicitProjectRoot`/`gitRoot` (or a path through
#       its `selectedConfig`), so the only substituted seam is `FileSystemFacts`.
#       Neither suite restates the other's assertions; the adapter suite fails an
#       implementation that maps a read or parse failure to
#       `{ok: true, declared: false}`, which is the shape the seam suite cannot
#       distinguish (DoR iteration-2 finding 3; root input pinned in revision
#       1.4 for DoR iteration-3 finding 3).
#   P-9 (residual, declared not closed — added by revision 1.5) THE COMPOSITION
#       PROOF'S CEILING. The production composer is injectable at its facts
#       boundary (environment, cwd, homeDirectory, workingName) but not at its
#       provider-read boundary, so the behavioural proof of the CLI map seam
#       (8.6) pins the strongest observation the composed surface exposes: the
#       classification and refusal paths that complete BEFORE any provider read
#       (defective/unreadable/unparseable document, valid selection honoured or
#       refused, narrowed member-declaring declaration). A composition that wired
#       the map seam to a valid-equality declaration and then mis-read a provider
#       fact cannot be distinguished from a correct one without provider
#       injection, which is a change to the delivered composition surface this
#       change does not make. If the 8.6 probe cannot reach even the
#       pre-provider observation point, the residual widens accordingly and is
#       recorded in pm-notes; the source-text assertions stay only as a labelled
#       supplement and are never the proof. This residual is declared, not
#       closed, and it is what keeps AC-F1-4/AC-F1-5's composition claim honest.
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`) matching the
#   GH-291/GH-310 precedent (version_impact: minor, spec §18). No new dependency,
#   no data migration, no backfill, no record-shape change (DEC-9); rollback is a
#   declaration change plus a changeset revert (spec §18, DEC-12).
#
# COMMIT DISCIPLINE: one commit per phase through the commit primitive; every
#   `summary` below IS the commit subject (conventional `type(GH-300): ...`,
#   <= 72 characters); body/footer lines <= 100 characters; phase-9 range gate
#   `./scripts/lint-commit-range.sh --base main-tools` lints the whole branch.
#
# GATE ENVIRONMENT (measured, pm-notes, binding at every phase boundary):
#   PATH=$PWD/node_modules/.bin:$PATH TMPDIR=$PWD/tmp/tmpdir \
#   GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=commit.gpgsign \
#   GIT_CONFIG_VALUE_0=false pnpm check
#   Temporary fixture roots resolve under the git-ignored tmp/ tree; no suite
#   reads a credential environment variable, provider socket, or network.

