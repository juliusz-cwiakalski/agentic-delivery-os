  # ---------------------------------------------------------------------------
  # Phase 3 — The pure evaluation core: the four-outcome breadth rule and the
  # two pinned renderers.
  #
  # Goal: make breadth decidable, total, and renderable as pure domain code with
  # no runtime wiring. Nothing in this phase can emit output: no handler, no
  # edge, no MCP call site changes.
  #
  # Obligations:
  #   3.1 `resolveVerifySuiteBreadth({ map, workflow })` in
  #       packages/core/src/domain/verify-gates-suite-map.ts returns exactly one
  #       closed outcome (DM-4, DEC-3, DEC-5):
  #         { kind: "not-evaluated" }                     workflow not validly read
  #         { kind: "equal"; mirrorsJob; suiteBreadth }    reportable
  #         { kind: "narrower"; mirrorsJob; mirrorBreadth } refuse
  #         { kind: "unmirrored" }                         config.value.invalid
  #         { kind: "uncorroborated"; mirrorsJob }         config.value.invalid
  #       `not-evaluated` is the workflow precondition, NOT a fifth breadth
  #       outcome: when the workflow is absent, unreadable, empty, duplicate, or
  #       over-cap, no breadth outcome exists and the delivered
  #       `verify.gates.failed` path stays in force (AC-F4-1).
  #   3.2 Resolution order is declared order and set semantics: exact set match
  #       first (order-insensitive), mirror = FIRST such job; otherwise the first
  #       job whose set is a STRICT superset; otherwise unmirrored. The citation
  #       uses the mirror's declared `suites` order. No sort, digest, union,
  #       partial match, check-run-derived attribution, or invented tie-break.
  #   3.3 Corroboration is exact string equality against the read job-name set:
  #       no case folding, trimming, or punctuation normalization; a near-match
  #       is `uncorroborated` (AC-F1-3, DEC-5).
  #   3.4 One header source. Extract the delivered header formula
  #       `result=<fail or unknown>; gates=<p>/<t> passed, <f> failed,
  #       <u> unknown` from renderVerifyGatesFailureSummary into a shared private
  #       helper and add `renderVerifyGatesNarrowedFailureSummary(evaluation,
  #       mirrorsJob, mirrorBreadth)`. The delivered renderer's bytes must stay
  #       identical (proven by the unchanged `failure-summary.txt` golden and the
  #       parity suite); the narrowed renderer appends exactly
  #       `; scope=narrowed mirror=<job> breadth=<id[,id]*>[ omitted=<n>]`
  #       (DEC-15, Appendix A rows 9 and 19):
  #         - one `; ` between segments, one ASCII space between tokens;
  #         - `<job>` verbatim (spaces preserved, never quoted, escaped,
  #           case-folded, trimmed, or truncated), terminated by the final
  #           literal ` breadth=`;
  #         - identifiers are the MIRROR's declared breadth in declared order,
  #           `,`-delimited with no spaces, never the local set (C-12);
  #         - 0 identifiers unreachable, 1..8 printed with no marker, 9..32 =
  #           first eight + ` omitted=<n>` counting only unprinted identifiers;
  #         - `result=` reuses the delivered formula verbatim (fail when the
  #           battery overall is fail, else unknown), so an all-pass narrow
  #           battery renders `result=unknown`;
  #         - the header is NEVER truncated; the delivered name-budget shrink
  #           applies to the gate lines only; six lines and 4096 bytes hold.
  #   3.5 `renderSuiteMapCauseLine(outcome)` renders the one bounded
  #       identifier-only payload `mirror=<job>` (uncorroborated) or
  #       `breadth=<id[,id]*>[ omitted=<n>]` (unmirrored) reusing 3.4's
  #       identifier grammar; one physical line, never multi-line, never
  #       truncated inside an identifier; bounds are DERIVED, never new
  #       constants: <= 14 + 120 = 134 characters (mirror form) and
  #       <= 15 + 8x64 + 7 + 9 + 2 = 545 characters (breadth form) (DEC-16,
  #       Appendix A row 20).
  #   3.6 Report-field projection: the pure evaluators accept an optional
  #       breadth fact and append `suiteBreadth` then `mirrorsJob` after the
  #       delivered keys of each report type (delivered prefix byte-identical,
  #       DM-2). On the cross-repository report the values describe the invoking
  #       repository's declaration and are member-independent — never inside a
  #       member record and never inside a citation (NG-6, DEC-4).
  #   3.7 Purity: no I/O, clock, randomness, or environment; ambient-globals and
  #       the dependency-cruiser boundaries stay green (core takes no adapter
  #       dependency, NFR-3).
  #
  # AC/TC: proves the pure halves of AC-F1-1, AC-F1-2, AC-F1-3, AC-F2-1,
  #   AC-F2-3, AC-F3-1, AC-F3-5, AC-F4-1..AC-F4-4, AC-NFR2-1;
  #   owns no complete TC (the CLI-level halves belong to Phase 4, the parity and
  #   determinism halves to Phase 6). The four-outcome totality matrix
