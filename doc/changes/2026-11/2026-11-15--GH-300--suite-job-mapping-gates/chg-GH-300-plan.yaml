  # ---------------------------------------------------------------------------
  # Phase 4 — Runtime wiring: the seam, the fail-closed document classification,
  # the handler on both report paths, the CLI projection, and the MCP command
  # mirror — the whole breadth behaviour in ONE commit.
  #
  # Goal: turn the pure rule into the observable contract. Equality reports, a
  # narrowing refuses, an unattributable declaration refuses, an unusable
  # document refuses before any source read, an invalid workflow keeps the
  # delivered path. This phase is deliberately the ONLY phase that changes
  # runtime behaviour: a narrowed declaration must never be able to produce a
  # full-green report in any committed state (no false pass, AC-F3-1..AC-F3-6,
  # NFR-6).
  #
  # Obligations:
  #   4.1 Seam (pinned shape, see OQ-T4 RESOLUTION): optional `readSuiteMap`
  #       beside the untouched `readGateSet` on VerifyGatesCommandRuntime,
  #       optional on VerifyGatesRuntimeOptions, edge default
  #       `{ ok: true, declared: false }`, and the same optional seam on
  #       GateReportToolRuntime. The seam performs no I/O: the read it exposes is
  #       the composition's single bounded configuration-document resolution
  #       attempt. The gate-set seam is
  #       NOT wired to configuration values and the delivered default
  #       (shipped five) is unchanged (NG-7, DEC-11).
  #   4.2 Handler order (packages/cli/src/commands/verify-gates.ts). The
  #       delivered prologue is grammar -> `readGateSet()` -> `readMembers(ref)`;
  #       this phase keeps it and places the map classification immediately after
  #       grammar, before every gates source read:
  #         grammar
  #         -> readSuiteMap classification (the ONE bounded configuration-document
  #            resolution attempt of this invocation): [absent (no selection in
  #            play and no committed document) / no node: undeclared, continue |
  #            selection names a missing or unreadable path: the delivered
  #            unusable-selector `config.value.invalid` refusal |
  #            unreadable / unparseable / defective node: `config.value.invalid`,
  #            exit 1, no `data`, NO `cause:` line, before any ledger,
  #            repository, workflow, or provider read]. "Absent" is the
  #            no-selection, no-committed-document state; a SELECTED path that is
  #            missing or unreadable is the delivered unusable-selector refusal
  #            (TDR-0003, see SELECTED-FILE RESIDUAL below), never undeclared.
  #         -> readGateSet() (delivered, untouched, ZERO I/O, shipped five)
  #         -> members.readMembers(ref) (the plan-declaration read, delivered)
  #         -> the ONE workflow read, hoisted (see THE HOIST below)
  #         -> breadth resolution: [unmirrored / uncorroborated:
  #            `config.value.invalid` + the one cause line, NO append, NO
  #            capsule | not-evaluated (invalid workflow): delivered
  #            `verify.gates.failed` path, no breadth | equal / narrower:
  #            continue]
  #         -> member-declaring path: a narrower declaration refuses HERE, then
  #            crossRepositoryEvaluation(repository/lifecycle/work-item reads and
  #            the per-member bundle) -> report -> append -> capsule
  #         -> member-less path: battery evaluation over the delivered reads
  #            (repository, lifecycle, detail, check-run, open-PR, work-item —
  #            the workflow read is the one already performed) -> (narrower:
  #            refusal with the six-line summary) -> equality -> append +
  #            capsule -> report with the two fields
  #       `readGateSet` IS listed because the delivered handler invokes it; it is
  #       a zero-I/O injected seam that returns the shipped five, it is NOT a
  #       gates source read and NOT configuration input, and this change neither
  #       sources it from configuration values nor moves it (NG-7, DEC-11). It
  #       must never be confused with the one configuration-document resolution
  #       attempt this change adds.
  #       THE HOIST (member-declaring path only): `runtime.readRepository()` and
  #       `runtime.readWorkflow()` currently live inside `crossRepositoryEvaluation`,
  #       and the workflow job-name set is exactly what breadth corroboration
  #       needs. Of those two, only the WORKFLOW read is hoisted, to before the
  #       breadth decision on that path; the already-read facts are passed in, so
  #       `crossRepositoryEvaluation` performs only its remaining reads
  #       (repository, lifecycle/ledger, work item) and the per-member bundle.
  #       The repository read therefore stays AFTER the refusal on that path,
  #       which is why a narrowed member-declaring run performs no repository
  #       read. The workflow read stays ONE bounded read — no path reads it twice
  #       and nothing doubles the budget (NFR-4, AC-F5-4, C-7).
  #       MEMBER-READ POSTURE (AC-F3-6): on a narrower declaration the
  #       per-member read bundle (`members.readMemberReads`, one bounded call per
  #       member) is never invoked, so a throwing member recorder observes zero
  #       calls; `runtime.appendVerification(record)` is never reached, so no
  #       ledger append and no capsule event occur, and the data-bearing
  #       `overall: "fail"` report, every member verdict, and every
  #       `definitionOfDone.status` are unreachable. The refusal is decided
  #       BEFORE the bundle, not after it (DEC-6, DEC-7, C-17).
  #       SELECTED-FILE RESIDUAL (DEC-19, RSK-11): the delivered channel that
  #       can occupy the committed slot is the `${environmentPrefix}CONFIG`
  #       environment selector (TDR-0003; brand-derived, i.e.
  #       `DELIVERY_OS_CONFIG` for this repository's working name). It is the
  #       ONLY reachable selection input for this grammar: `verify` declares
  #       `flags: []`, so `--config` is `fallback.invocation` and never reaches
  #       the handler. When the selector names an existing readable file, that
  #       file is the document read and classified; when it names a MISSING or
  #       unreadable path, delivered selection semantics apply and the run is the
  #       unusable-selector `config.value.invalid` refusal — never the
  #       absent/undeclared parity path; when it is unset, the read resolves
  #       `<root>/<configDirectoryName>/config.yaml`. This plan adds no selection
  #       arm, reinterprets no selection semantics, and claims no closure of the
  #       residual.
  #       ROOT INPUT (DoR iteration-3 finding 3): `<root>` is not a test-only
