defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Pre-change parity baseline capture (no production edit).
  #
  # Goal: make the undeclared-map parity claim (AC-F5-1, AC-NFR8-1, NFR-8)
  # provable by capturing the delivered behaviour BEFORE any suite-map code
  # exists.
  #
  # Obligations:
  #   1.1 Capture at branch base 8a1f77ad with the production tree untouched:
  #       `git diff --quiet 8a1f77ad -- packages scripts` must succeed at the
  #       capture point. No file under packages/ may be edited in this phase.
  #   1.2 Capture ALL 48 delivered corpus cases (tests/.../corpus/cases.json)
  #       in JSON mode and in human mode with NO map, recording
  #       {caseId, mode, stdout, stderr, exitCode} and, where a case appends,
  #       the appended `merge.gate-verification` record bytes. This is the
  #       absent-document state; it is also the reference for the
  #       parsed-without-node state (both are undeclared and byte-identical).
  #   1.3 Record provenance inside the fixture: base sha "8a1f77ad", corpus
  #       case count 48, the two modes, the exact capture command, and the
  #       capture timestamp (a fixed literal, never a moving clock read at
  #       assertion time).
  #   1.4 Read the delivered goldens unchanged: success-data.json,
  #       human-success.txt, failure-summary.txt. No regeneration anywhere in
  #       this change except with a review-visible diff and a recorded reason.
  #   1.5 Sanitization and privacy: no absolute home path, no secret, no
  #       machine-specific path in the captured bytes; the existing guards must
  #       stay green with the new fixture present.
  #   1.6 Parity scoping: the baseline carries no entry for an unusable document
  #       state (unreadable, unparseable, defective node); those states are the
  #       AC-F1-4 refusal (TC-SMAP-006 at the seam, TC-SMAP-008 through the real
  #       adapter) and Phase 6's scope manifest classifies them explicitly, so a
  #       later regeneration cannot reclassify one as parity (NFR-8, AC-NFR8-1).
  #   1.7 The capture command and the baseline provenance go into pm-notes by
  #       the PM lane (this phase writes no pm-notes file).
  #
  # AC/TC: enables AC-F5-1 / TC-SPAR-001 and AC-NFR8-1 / TC-SPAR-006 (both
  #   owned by Phase 6); owns no complete TC.
  #
  # Gate:
  #   bun test tests/checks/fixture-sanitization.test.ts
  #   bun test tests/checks/verify-gates-no-live-calls.test.ts
  #   bun test tests/golden/verify-gates.test.ts
  #   bun test tests/behaviour/verify-gates-corpus.test.ts
