#   - Tests:    ./chg-GH-300-test-plan.md (v1.3) — 37 TCs in nine families
#               (SMAP 7, SCITE 6, SNARR 6, SRES 5, SPAR 6, SCTR 3, SDET 2,
#               SHERM 1, SWRITE 1), 30/30 ACs covered, DM 9/9, seeds
