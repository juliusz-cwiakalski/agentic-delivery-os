# GH-300 delivery plan — machine-readable document (delivery.plan.v1).
# M2-S7: Suite-to-job mapping in gates.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:     ./chg-GH-300-spec.md (v1.1) — F-1..F-5, GAP-1..GAP-6, DM-1..DM-8,
#               NFR-1..NFR-9, RSK-1..RSK-9, OQ-1..OQ-3, DEC-1..DEC-17,
#               AC-F1-1..AC-NFR7-1 (25 ACs, §17), DoD-1..DoD-10 (§17.1),
#               Flow 1..5 (§6), §8.3 enumerated literal deltas (eight items),
#               Appendix A pinned literals rows 1..21, Appendix C constraints
#               C-1..C-14, Appendix D documentation deltas D-1..D-13.
#   - Tests:    ./chg-GH-300-test-plan.md (v1.1) — 31 TCs in nine families
#               (SMAP 5, SCITE 4, SNARR 5, SRES 5, SPAR 5, SCTR 3, SDET 2,
#               SHERM 1, SWRITE 1), 25/25 ACs covered, DM 8/8, seeds
#               SC-M2-S7-01/02 inherited by name, §4 layers, §6.1 binding gate
#               environment, §6.2/§6.3 fixture homes, §6.4 golden provenance,
#               §7 suite homes and execution commands, §8.3 OQ-T4.
#   - PM notes: ./chg-GH-300-pm-notes.yaml — scope decision, documentation
#               impacts for phase 7, measured gate environment, delivery
#               conventions (full 11-phase lifecycle, one commit per plan phase,
#               subjects scoped GH-300, PR to main-tools staying open), branch
#               feat/GH-300/suite-job-mapping-gates from main-tools tip 8a1f77ad.
#   - Schema:   doc/templates/implementation-plan-template.md +
#               doc/spec/features/feature-plan-schema.md (scope keys
#               files/packages/folders, doneArtifacts slots, leases, weightClass,
#               interactions, tier; no tasks key, no progress log).
#   - Delivered code seams inspected for this plan:
#               packages/core/src/contracts/{verify-gates,result,error-table,
#               index,plan}.ts; packages/core/src/config/catalog.ts;
#               packages/core/src/domain/{verify-gates,verify-gates-members,
#               merge-gate-set,plan-validate}.ts; packages/cli/src/commands/
#               verify-gates.ts; packages/cli/src/{edge,production,index}.ts;
#               packages/mcp/src/commands/gate-report.ts; packages/mcp/src/serve.ts;
#               tests/fixtures/verify-gates/{cases/harness,corpus/cases.json,
#               golden/*}; tests/golden/verify-gates.test.ts;
#               scripts/checks/{error-table-sync,exports-parity,ambient-globals}.ts;
#               .github/workflows/ci.yml (job ts-aggregate, name
#               "TS aggregate check").
#
# OQ-T4 RESOLUTION — how the suite map reaches the gates runtime
# (test-plan §8.3 OQ-T4 is the one plan-owned seam question; the spec already
# declares an injected `readSuiteMap` on the same configuration seam that
# supplies the declared gate set, DEC-11):
#   CHOSEN: a SECOND injected read function `readSuiteMap` beside the delivered
#     `readGateSet`, OPTIONAL, absent meaning "undeclared". It returns a closed
#     three-arm union and performs no I/O:
#       export type VerifySuiteMapRead =
#         | { readonly ok: true; readonly declared: false }
#         | { readonly ok: true; readonly declared: true;
#             readonly value: VerifySuiteMap }
#         | { readonly ok: false; readonly code: string;
#             readonly detail?: string };
#       // VerifyGatesCommandRuntime          (packages/cli/src/commands/verify-gates.ts)
#       readonly readSuiteMap?: () => VerifySuiteMapRead;
#       // VerifyGatesRuntimeOptions          (packages/cli/src/edge.ts)
#       readonly readSuiteMap?: VerifyGatesCommandRuntime["readSuiteMap"];
#       // GateReportToolRuntime              (packages/mcp/src/commands/gate-report.ts)
#       readonly readSuiteMap?: () => VerifySuiteMapRead;
#     The edge default is `() => ({ ok: true, declared: false })`, so a
#     composition that supplies nothing yields the delivered behaviour exactly.
#     The resolved value carries exactly the DM-1 map (`schemaVersion`, `jobs[]`
#     with `job`/`suites`, `local`); the failure arm's only identity is
#     `config.value.invalid` (typed `string` to match the delivered
#     `readGateSet` seam shape rather than forking a second shape).
#   REJECTED: one combined resolved-config call returning gate set plus map,
#     because (a) DEC-11 names `readSuiteMap` and pins "defaulting to
#     undeclared" as that seam's own behaviour; (b) a combined call would change
#     the shape of every delivered construction site (the shared harness
#     tests/fixtures/verify-gates/cases/harness.ts, the MCP parity fixture, the
#     delivered export surface asserted by tests/structure/verify-gates-exports
#     .test.ts), which weakens the F-5/AC-F5-1 parity guarantee the change is
#     built on; (c) an optional per-seam function makes "composition forgot the
#     map" structurally identical to "undeclared", so no path can fabricate
#     breadth; and (d) the two declarations refuse independently — an invalid
#     map must not silently change the declared gate set, and vice versa.
#   COMPOSITION: one pure projection helper in packages/cli/src/edge.ts maps a
#     single resolved configuration snapshot onto BOTH seam shapes
#     (`resolveMergeGateSetFromConfig` for the gate set,
#     `resolveVerifySuiteMapFromConfig` for the map). The production composition
#     (packages/cli/src/production.ts) performs the ONE configuration
#     acquisition — `acquireFileConfig` with `enableProjectLocalConfig: true`
#     and `configurationDirectoryName: brand.configDirectoryName`, then
#     `resolveConfig`, the delivered daemon-family posture — memoizes it, and
#     serves both seams from it. The seam gains one pure call; the I/O budget
#     gains nothing (NFR-4, AC-F5-4, TC-SPAR-004): the configuration acquisition
#     is a configuration call, not a counted source read, and it happens
#     identically with and without a declared map.
#
# PRE-CHANGE PARITY PROVENANCE (NFR-8, AC-F5-1, TR-1):
#   Phase 1 captures `tests/fixtures/verify-gates/suite-map/parity-baseline.json`
#   from branch base 8a1f77ad BEFORE any production edit (all 48 delivered
#   corpus cases in JSON and human modes, no map: caseId, stdout, stderr,
#   exitCode, plus appended record bytes where the case appends). Provenance is
#   recorded inside the fixture (base sha, corpus case count, modes, capture
#   command, capture timestamp) and in pm-notes by the PM lane. The delivered
#   goldens `success-data.json`, `human-success.txt`, and `failure-summary.txt`
#   are read UNCHANGED for the whole change; regeneration after the change is
#   allowed only with a review-visible diff and a recorded reason, otherwise the
#   parity proof becomes a tautology (TR-1).
#
# CONSTRAINTS CARRIED FROM THE SPEC (Appendix C, binding on every phase):
#   C-1 no execution — no suite, workflow step, child process, or provider write
#       is ever run; breadth is declared and read (NG-2, DEC-1).
#   C-2 two declared sides, one comparison — a single-sided declaration cannot
#       produce a check (DEC-1, DEC-2).
#   C-3 a report exists only on equality; every other outcome is a refusal or
#       the delivered failure (DEC-5).
#   C-4 `suiteBreadth` is the mirrored CI breadth, never the local declaration
#       and never a union (DEC-4).
#   C-5 a narrowed refusal appends nothing — no record, no capsule event (DEC-7).
#   C-6 exactly one new error row and one new `detail` member; no new domain
#       kind, no reworded row (NFR-7, DEC-8).
#   C-7 zero additional reads; the map is a node of the configuration read and
#       corroboration reuses the single workflow read (NFR-4, DEC-10).
#   C-8 the record, the CI gate, the five gates, the grammar, and the human
#       output do not move (DEC-9, DEC-10, DEC-12).
#   C-9 default tests are configuration- and workflow-fixture driven, zero live
#       calls (NFR-3).
#   C-10 current-truth specifications flip in phase 7 only, per D-1..D-13
#       (NG-5, DoD-9).
#   C-11 gates and commit hygiene: `pnpm check` with the pm-notes environment
#       before the PR, subjects scoped GH-300, body/footer lines <= 100
#       characters, PR to main-tools staying open (DEC-13, NFR-9).
#   C-12 the narrowed header names the mirrored CI breadth, never the local set;
#       the local set is `detail.suiteBreadth` and nothing else (DEC-15).
#   C-13 the map-side cause reaches only the bounded error-stream `cause:` line;
#       the envelope stays the table's own and gains no line and no member
#       (DEC-16).
#   C-14 this repository's reference declaration is pinned literal data and must
#       resolve to equality end-to-end, not by fixture reasoning (DEC-17, DM-8).
#
# SCOPE CONVENTION: `files` are exact repository-relative paths; `folders` are
#   boundary-aware prefixes declared by every phase that writes a NEW file inside
#   them; a file edited in two phases is declared in both phases. A declared file
#   that ends up untouched is a `plan diff` observation, never a gate failure
#   (the conditional/control rows below are declared for exactly that reason).
#   `tests/fixtures/verify-gates/corpus/cases.json` is a READ-ONLY control: the
#   new declaration matrix lives in tests/fixtures/verify-gates/suite-map/cases.ts
#   and the corpus stays at 48 cases, so the baseline's "48" stays true.
#
# TC -> PHASE MAP (31 ids; every id owned by exactly ONE phase — the phase that
#   first makes its complete suite set green):
#   Phase 1 baseline            (0): owns no TC; supplies the pre-change
#        baseline that Phase 6's TC-SPAR-001 (AC-F5-1, NFR-8) consumes.
#   Phase 2 contract layer      (1): TC-SCTR-003.
#   Phase 3 evaluation core     (0): proves the pure halves of SMAP-001/003/005,
#        SCITE-001/003, SNARR-001/005, SRES-002/003/004/005, SCTR-001/002.
#   Phase 4 runtime wiring     (21): TC-SMAP-001, TC-SMAP-002, TC-SMAP-003,
#        TC-SMAP-005, TC-SCITE-001, TC-SCITE-003, TC-SCITE-004, TC-SNARR-001,
#        TC-SNARR-002, TC-SNARR-003, TC-SNARR-004, TC-SNARR-005, TC-SRES-001,
#        TC-SRES-002, TC-SRES-003, TC-SRES-004, TC-SRES-005, TC-SCTR-001,
#        TC-SCTR-002, TC-SPAR-002, TC-SWRITE-001.
#   Phase 5 reference decl.     (1): TC-SMAP-004.
#   Phase 6 cross-cutting       (8): TC-SPAR-001, TC-SPAR-003, TC-SPAR-004,
#        TC-SPAR-005, TC-SCITE-002, TC-SDET-001, TC-SDET-002, TC-SHERM-001.
#   Phase 7 docs/release        (0): DoD-9, DoD-10, D-1..D-13.
#   Totals: 31/31 TCs owned; 25/25 ACs named (§17 AC -> phase table below).
#
# AC -> PHASE (every §17 criterion named at least once; a criterion proven by
#   two TCs is listed in both phases where those TCs live):
#   P2: AC-NFR7-1, AC-NFR1-1 (static `detail` key set). P3 (pure halves):
#   AC-F1-1, AC-F1-2, AC-F1-3, AC-F2-1, AC-F2-3, AC-F3-1, AC-F3-5, AC-F4-1,
#   AC-F4-2, AC-F4-3, AC-F4-4, AC-NFR2-1.
#   P4: AC-F1-1, AC-F1-2, AC-F1-3, AC-F2-1, AC-F2-3, AC-F3-1, AC-F3-2,
#   AC-F3-3, AC-F3-4, AC-F3-5, AC-F4-1, AC-F4-2, AC-F4-3, AC-F4-4,
#   AC-F5-2, AC-NFR1-1, AC-NFR2-1, AC-NFR5-1.
#   P5: AC-F1-1, AC-F2-1. P6: AC-F5-1, AC-F5-3, AC-F5-4, AC-F5-5, AC-F2-2,
#   AC-NFR2-1, AC-NFR3-1, AC-NFR5-1 (write-posture re-run).
#   Unique criteria named across phases: 25/25 (§17). No criterion is orphaned;
#   each listing is either the phase that owns the criterion's TC, the phase that
#   proves its pure half, or a re-run of an owning suite.
#
# SUITE-HOME COVERAGE: 53/53 homes named by test-plan §7 (34 test/type homes
#   including tests/structure/inventory.json, 18 fixture/contract-data homes,
#   and the read-only corpus control) are inside a declared phase scope.
#
# PLAN-OWNED PINS AND RESIDUAL GAPS (nothing below invents a requirement; each
#   item is either a plan decision inside a spec-declared freedom or a recorded
#   inconsistency for its owner):
#   P-1 (plan decision) CONFIG-ACQUISITION FAILURE POSTURE. The spec pins
#       "undeclared means the delivered behaviour stands" (DEC-11, DEC-12) but
#       does not state what an unreadable or unresolvable configuration DOCUMENT
#       does. Pinned: the acquisition/whole-document resolution failure falls
#       back to the empty snapshot, therefore to undeclared + shipped gate set,
#       so parity holds for a repository whose configuration is absent or
#       unresolvable; only a READABLE document carrying an invalid
#       `verify.suite-map` node refuses `config.value.invalid`. This is the
#       only point where the plan adds a decision the spec leaves open, and it
#       can only ever preserve the delivered path.
#   P-2 (plan decision, sequencing) THE DOCUMENTED ERROR ROW LANDS IN PHASE 2,
#       in the same commit as the code row, because the delivered two-way sync
#       gate runs inside `pnpm test` and would otherwise fail a phase boundary.
#       TC-SCTR-003's own note allows "no later than phase 7"; Phase 7 then
#       completes D-7's capability prose. The 135 -> 136 count, the live/mirrored
#       assertion pair, and the true-positive corpus entry move together.
#   P-3 (delivery hazard, not a spec gap) `.delivery-os/` IS LISTED IN THIS
#       WORKTREE'S REPOSITORY-LEVEL `.git/info/exclude`, so a plain `git add`
#       would silently leave the DM-8/DEC-17 reference declaration out of the
#       commit while TC-SMAP-004 still passed against the working tree (a fake
#       DoD-8). Phase 5 therefore declares the forced add and the
#       `git ls-files --error-unmatch .delivery-os/config.yaml` gate assertion.
#   P-4 (recorded inconsistency for the TEST-PLAN owner, not fixed here) In
#       TC-SNARR-001 step 2, "error.summary ... equal the DM-5 row text verbatim"
#       contradicts that TC's own steps 3 and 6 and contradicts AC-F3-1, F-3,
#       DM-5, and DEC-15 together: the ENVELOPE `summary` for a narrowed run is
#       the narrowed six-line block (delivered header plus one line per gate,
#       with the pinned `; scope=narrowed ...` segment), while the DM-5 sentence
#       is the ERROR_TABLE row's own default summary and `error.remediationHint`
#       is the row's hint. This plan pins the SPEC reading (the spec is
#       authoritative and AC-F3-1/DEC-15 are explicit); `error.category`,
#       `retryable`, `consequence`, and `remediationHint` come from the DM-5 row
#       verbatim. The test plan must be revised in this same change under its own
#       §8.3 reconciliation rule (a pin change is a plan revision, never a silent
#       test tweak) before or at the DoR gate; no TC id, AC id, or family count
#       changes.
#   P-5 (verification, not a gap) The suite-map node adds no byte bound of its
#       own (DM-3): it is a node of the already-bounded configuration read and
#       every collection in it is capped, so no new document bound is declared
#       and none is needed.
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`) matching the
#   GH-291/GH-310 precedent (version_impact: minor, spec §18). No new dependency,
#   no data migration, no backfill, no record-shape change (DEC-9); rollback is a
#   declaration change plus a changeset revert (spec §18, DEC-12).
#
# COMMIT DISCIPLINE: one commit per phase through the commit primitive; every
#   `summary` below IS the commit subject (conventional `type(GH-300): ...`,
#   <= 72 characters); body/footer lines <= 100 characters; phase-9 range gate
#   `./scripts/lint-commit-range.sh --base main-tools` lints the whole branch.
#
# GATE ENVIRONMENT (measured, pm-notes, binding at every phase boundary):
#   PATH=$PWD/node_modules/.bin:$PATH TMPDIR=$PWD/tmp/tmpdir \
#   GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=commit.gpgsign \
#   GIT_CONFIG_VALUE_0=false pnpm check
#   Temporary fixture roots resolve under the git-ignored tmp/ tree; no suite
#   reads a credential environment variable, provider socket, or network.

schemaVersion: delivery.plan.v1
workItemRef: GH-300
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7]
  escalationTriggers:
    - "A second mapping source would be added (workflow step parsing, a durable local-run record, or a matrix expansion); the declaration must stay the only record of CI breadth (NG-1, NG-2, DEC-1, OQ-1, OQ-2)"
    - "The suite map would need an invocation flag, a third positional, or any grammar change; the delivered `verify gates <ref>` surface must not move (NG-3, AC-F5-5, DEC-1)"
    - "A breadth fact would enter `merge.gate-verification` or the capsule `gate.outcome` payload, or a second append path would exist beside the delivered one (DM-7, DEC-7, DEC-9, NFR-5)"
    - "A second error-table row, a new domain kind, or a reworded delivered row would be needed; the change carries exactly one row and one `detail` member (NFR-7, DEC-8, DM-5, DM-6)"
    - "`suiteBreadth` would be derived from the local declaration, a union of jobs, or observed check-run names instead of the mirror job's declared `suites` in declared order (C-4, DEC-3, DEC-4)"
    - "The narrowed header would name the local set, print more than eight identifiers without ` omitted=<n>`, change a delivered header token, or be truncated instead of the gate lines (DEC-15, C-12)"
    - "A map-side refusal would put its cause in the envelope, reuse a command-supplied config summary, or write more than one error-stream `cause:` line (DEC-14, DEC-16, C-13)"
    - "The map would add a source read, a transport call, a retry, or pagination; corroboration must reuse the single delivered workflow read (NFR-4, DEC-10, C-7)"
    - "An undeclared map would change any delivered byte, exit, summary, record, or human line (NFR-8, AC-F5-1, DEC-12)"
    - "The reference declaration would resolve to a refusal, be committed only as a fixture, or silently stay untracked because `.delivery-os/` is locally excluded in this worktree (DM-8, DEC-17, DoD-8, RSK-4)"
    - "A delivered verify-gates, config, result, MCP, cross-repository, or error-table suite would need a semantic assertion change outside the update rows this plan declares"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Pre-change parity baseline capture (no production edit).
  #
  # Goal: make the undeclared-map parity claim (AC-F5-1, NFR-8) provable by
  # capturing the delivered behaviour BEFORE any suite-map code exists.
  #
  # Obligations:
  #   1.1 Capture at branch base 8a1f77ad with the production tree untouched:
  #       `git diff --quiet 8a1f77ad -- packages scripts` must succeed at the
  #       capture point. No file under packages/ may be edited in this phase.
  #   1.2 Capture ALL 48 delivered corpus cases (tests/.../corpus/cases.json)
  #       in JSON mode and in human mode with NO map, recording
  #       {caseId, mode, stdout, stderr, exitCode} and, where a case appends,
  #       the appended `merge.gate-verification` record bytes.
  #   1.3 Record provenance inside the fixture: base sha "8a1f77ad", corpus
  #       case count 48, the two modes, the exact capture command, and the
  #       capture timestamp (a fixed literal, never a moving clock read at
  #       assertion time).
  #   1.4 Read the delivered goldens unchanged: success-data.json,
  #       human-success.txt, failure-summary.txt. No regeneration anywhere in
  #       this change except with a review-visible diff and a recorded reason.
  #   1.5 Sanitization and privacy: no absolute home path, no secret, no
  #       machine-specific path in the captured bytes; the existing guards must
  #       stay green with the new fixture present.
  #   1.6 The capture command and the baseline provenance go into pm-notes by
  #       the PM lane (this phase writes no pm-notes file).
  #
  # AC/TC: enables AC-F5-1 / TC-SPAR-001 (owned by Phase 6); owns no complete TC.
  #
  # Gate:
  #   bun test tests/checks/fixture-sanitization.test.ts
  #   bun test tests/checks/verify-gates-no-live-calls.test.ts
  #   bun test tests/golden/verify-gates.test.ts
  #   bun test tests/behaviour/verify-gates-corpus.test.ts
  #   git diff --quiet 8a1f77ad -- packages scripts
  #
  # Suites left green: fixture-sanitization (new capture scanned),
  #   verify-gates-no-live-calls (delivered control), verify-gates golden
  #   (delivered control, unchanged), verify-gates-corpus (48 cases,
  #   unchanged), plus the production tree proven unedited against the base.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Pre-change parity baseline capture with provenance, before any production edit"
    kind: delivery
    summary: "test(GH-300): capture the undeclared-map parity baseline"
    scope:
      folders:
        - tests/fixtures/verify-gates/suite-map

  # ---------------------------------------------------------------------------
  # Phase 2 — The contract layer: constants, types, error row, config branch,
  # and the pure declaration resolver.
  #
  # Goal: land every pinned contract literal and the closed declaration
  # resolution, with NO runtime behaviour change. The handler still runs exactly
  # as delivered at this boundary: nothing reads a map yet, so no intermediate
  # commit can produce a breadth claim or a narrowed refusal.
  #
  # Obligations:
  #   2.1 Six constants, each declared exactly once, in
  #       packages/core/src/contracts/verify-gates.ts beside the delivered
  #       VERIFY_GATES_* bounds, exported through contracts/index.ts and the core
  #       index (DM-3):
  #         VERIFY_SUITE_MAP_SCHEMA_VERSION   = "delivery.verify.suite-map.v1"
  #         VERIFY_SUITE_MAP_CONFIG_KEY       = "verify.suite-map"
  #         VERIFY_SUITE_MAP_MAX_JOBS         = 64
  #         VERIFY_SUITE_MAP_MAX_SUITES_PER_JOB = 32
  #         VERIFY_SUITE_MAX_BREADTH          = 32
  #         VERIFY_SUITE_MAX_ID_CHARS         = 64
  #       plus the single suite-id pattern literal `^[a-z][a-z0-9-]*$`. The job
  #       name bound REUSES VERIFY_GATES_MAX_EXPECTED_JOB_NAME_CHARS (120) and
  #       is never redeclared; the narrowed header REUSES
  #       VERIFY_GATES_MAX_CITATION_NAMES (8), VERIFY_GATES_MAX_SUMMARY_LINES (6),
  #       and VERIFY_GATES_MAX_SUMMARY_BYTES (4096). No node-byte bound is added.
  #   2.2 The DM-1 declaration types (`VerifySuiteMap`, `VerifySuiteMapJob`) and
  #       the closed resolution union, with the four-outcome vocabulary of DM-4
  #       declared as a closed list (the breadth resolver itself lands in
  #       Phase 3, its vocabulary is fixed here so Phase 3 adds no literal).
  #   2.3 `resolveVerifySuiteMap(raw)` and `resolveVerifySuiteMapFromConfig
  #       (values)` in packages/core/src/domain/verify-gates-suite-map.ts:
  #       pure, no I/O, no clock, no environment; the config form reads
  #       `values.verify["suite-map"]`; ABSENT is `declared: false` and no
  #       default map is ever invented (DM-1, DEC-2, DEC-11).
  #   2.4 Every DM-1 defect refuses as the delivered `config.value.invalid`:
  #       missing/unsupported schemaVersion, missing or undeclared top-level key,
  #       non-list or empty `jobs`/`local`, over-cap lists (64/32/32), missing or
  #       undeclared entry key, non-string/empty/121-character `job`, duplicate
  #       `job`, empty `suites`, identifier grammar/length failure, duplicate
  #       identifier in one `suites` list or in `local`. Absent is never a defect.
  #   2.5 Two additive optional report-root fields on BOTH report types
  #       (`suiteBreadth?: readonly string[]`, `mirrorsJob?: string`) — types
  #       only in this phase, appended after every delivered key so the delivered
  #       prefix stays byte-identical (DM-2, DEC-4).
  #   2.6 `CommandResultDetail` gains `suiteBreadth?: readonly string[]` beside
  #       the unchanged `holder`; the closed set becomes exactly
  #       {holder, suiteBreadth}; never an open key-value map (DM-6, DEC-8). The
  #       new member's bound is its OWN declaration — VERIFY_SUITE_MAX_BREADTH
  #       (32) entries of at most VERIFY_SUITE_MAX_ID_CHARS (64) characters —
  #       and it does NOT reuse COMMAND_FAILURE_DETAIL_MAX_CHARS (128), which
  #       stays the `holder` bound and is never widened or reinterpreted.
  #   2.7 One ERROR_TABLE row under the existing `verify` kind with the DM-5
  #       fields verbatim: code `verify.narrowed-scope`, category `user`,
  #       retryable false, consequence `not_landed`, projectionClass
  #       `user-validation`, summary "The local gate breadth is narrower than
  #       the CI job it mirrors.", and the pinned remediation hint. The `verify`
  #       kind moves 6 -> 7 identities and `verify gates` 2 -> 3 rows; no domain
  #       kind is added and no delivered row is reworded (NFR-7, DM-5).
  #   2.8 The documented mirror row lands in the SAME commit as the code row,
  #       because the two-way sync gate binds them: add the
  #       `verify.narrowed-scope` row to doc/spec/features/feature-result-contract
  #       .md, move the documented count sentence 135 -> 136, update the live
  #       assertions (tests/structure/error-table.test.ts,
  #       tests/checks/error-table-sync.test.ts) to 136/136, and add one
  #       true-positive corpus entry in
  #       tests/fixtures/result/code-corpora/true-positives.json. The delivered
