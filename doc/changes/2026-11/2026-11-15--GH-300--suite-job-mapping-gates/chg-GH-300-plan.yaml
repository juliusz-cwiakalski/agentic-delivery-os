# GH-300 delivery plan — machine-readable document (delivery.plan.v1).
# M2-S7: Suite-to-job mapping in gates.
#
# REVISION NOTES
#   1.0 (initial) — authored against spec v1.1 and test plan v1.1: 7 phases,
#       31 TCs owned exactly once, 25 ACs named at least once.
#   1.1 (not issued as a separate artifact) — the test-plan v1.2 correction of
#       the TC-SNARR-001 `error.summary` wording was tracked as P-4 and closed
#       without changing this plan; revision 1.2 records that closure and adopts
#       the spec v1.2 / test plan v1.3 additions.
#   1.2 (2026-11-15) — DoR iteration-1 remediation owned by delivery planning;
#       reconciled with chg-GH-300-spec.md v1.2 and chg-GH-300-test-plan.md
#       v1.3. No phase id, title intent, or earlier valid obligation removed.
#       (F1) WITHDRAWN the fail-open whole-document fallback. The configuration
#            document is now classified fail-closed by the spec's own posture:
#            absent, and parsed-without-the-node, are undeclared parity;
#            present-but-unreadable, unparseable-as-a-whole, and a defective map
#            node are `config.value.invalid` at exit 1 before any gates source
#            read; a defect elsewhere in the document is not interpreted, so it
#            neither refuses nor removes a valid declaration. One bounded read
#            of the committed-slot document; no overlay and no merged-tree read
#            (DM-9, DEC-18, DEC-19, NFR-10, AC-F1-4, AC-F1-5).
#       (F4) The delivered gate-set seam is unchanged. This change wires only
#            the suite-map read; no config-declared `merge.gates` is activated
#            and the shipped five-gate battery stays byte-identical for every
#            adopter (NG-7, DEC-11, AC-F5-1, AC-F5-3). `readGateSet` is never
#            sourced from configuration values by this plan.
#       (F8) Citations refreshed: spec v1.2 (F-1..F-5, DM-1..DM-9,
#            DEC-1..DEC-20, 30 ACs, DoD-1..DoD-12, Appendix A rows 1..24,
#            C-1..C-17, D-1..D-16) and test plan v1.3 (37 TCs in nine families,
#            30/30 ACs). The TC-SNARR-001 `error.summary` conflict is recorded
#            CLOSED (test plan v1.2 §9) rather than pending.
#       (F9) Phase 6 no longer declares the read-only control
#            `tests/fixtures/verify-gates/corpus/cases.json` as a writable
#            scope path; it is read by Phase 1 and Phase 6, never edited.
#       ADOPTION: 6 new TCs (TC-SMAP-006, TC-SMAP-007, TC-SNARR-006,
#            TC-SCITE-005, TC-SCITE-006, TC-SPAR-006) are each owned by exactly
#            one phase; 5 new ACs (AC-F1-4, AC-F1-5, AC-F3-6, AC-F5-6,
#            AC-NFR8-1) are named at least once. Totals: 37/37 TCs, 30/30 ACs.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:     ./chg-GH-300-spec.md (v1.2) — F-1..F-5, GAP-1..GAP-6,
#               DM-1..DM-9, NFR-1..NFR-10, RSK-1..RSK-11, OQ-1..OQ-3,
#               DEC-1..DEC-20, AC-F1-1..AC-NFR8-1 (30 ACs, §17),
#               DoD-1..DoD-12 (§17.1), Flow 1..5 (§6), §8.3 enumerated literal
