  # Phase 4 — Runtime wiring: the seam, the handler, the CLI projection, and the
  # MCP mirror — the whole breadth behaviour in ONE commit.
  #
  # Goal: turn the pure rule into the observable contract. Equality reports, a
  # narrowing refuses, an unattributable declaration refuses, an invalid
  # workflow keeps the delivered path. This phase is deliberately the ONLY
  # phase that changes runtime behaviour: a narrowed declaration must never be
  # able to produce a full-green report in any committed state (no false pass,
  # AC-F3-1..AC-F3-4, NFR-6).
  #
  # Obligations:
  #   4.1 Seam (pinned shape, see OQ-T4 RESOLUTION): optional `readSuiteMap`
  #       beside `readGateSet` on VerifyGatesCommandRuntime, optional on
  #       VerifyGatesRuntimeOptions, edge default `{ ok: true, declared: false }`,
  #       and the same optional seam on GateReportToolRuntime. No I/O, no read,
  #       no new transport call at the seam (NFR-4).
  #   4.2 Handler order (packages/cli/src/commands/verify-gates.ts):
  #       grammar -> readGateSet -> readSuiteMap -> (structural map refusal:
  #       `config.value.invalid`, no source read) -> repository/lifecycle/
  #       workflow/provider reads in the delivered order -> breadth resolution ->
  #       (unmirrored/uncorroborated: `config.value.invalid` + the one cause
  #       line, NO append, NO capsule) -> battery evaluation -> (narrower:
  #       `verify.narrowed-scope`, `detail.suiteBreadth`, narrowed summary, NO
  #       append, NO capsule) -> equality -> delivered append + capsule -> report
  #       with the two fields. The refusal is evaluated BEFORE the verdict
  #       projection and BEFORE the delivered append (DEC-6, DEC-7).
  #   4.3 Narrowed refusal envelope: exit 1, no `data`, `error.kind: verify`,
  #       `error.code: verify.narrowed-scope`, category user, retryable false,
  #       consequence not_landed, summary = the narrowed six-line block,
  #       `detail.suiteBreadth` = the COMPLETE local declaration in declared
  #       order, never truncated (<= 32 x <= 64) (DM-5, DM-6, AC-F3-1, AC-F3-5).
  #   4.4 CLI projection (packages/cli/src/index.ts):
  #       - `explicitDetail` honours `suiteBreadth` beside the unchanged
  #         `holder`: array of <= 32 identifiers, each 1..64 chars matching the
  #         suite-id grammar, no control characters; a malformed, over-bound, or
  #         non-array value is NEVER projected and NEVER clipped. The member is
  #         validated by its own declared bound (DM-6), never by the delivered
  #         `holder` bound, and its presence never displaces `holder` for a
  #         holder-carrying refusal (TC-SCTR-002);
  #       - an `explicitCause` reader honours `cause` ONLY when the resolved code
  #         is `config.value.invalid` and the payload matches the two pinned
