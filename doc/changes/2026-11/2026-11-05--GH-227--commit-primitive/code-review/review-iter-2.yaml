summary: >-
  Re-review after remediation phase 9 and the main-tools integration merge
  (base 47270b37): both iteration-1 criticals are empirically fixed.
  F-1 — readEvidence (edge.ts:383-417) now identifies the phase's landed
  commit from the durable telemetry event bound to the transition identity
  (phaseId + transitionId === record.timestamp, with landedAt > reopenedAt
  when the latest transition is a reopen); this review re-ran the real-harness
  suites green (phase-atomic 14 + commit-convergence 13 = 27 pass) including
  TC-CONVERGE-009's reproducer — earlier-phase re-run after a later phase's
  commit AND after a manual commit both yield row-2 no-ops with zero new
  commits/records/telemetry/transport calls, and the orphan-at-HEAD case
  still converges via the transition; the reopen orderings ([complete,
  reopen] and [complete, reopen, complete]) are each handled correctly by the
  transitionId binding plus the reopenedAt guard. F-2 — planPhaseForLifecycle
  (commit.ts:119-145) maps lifecycle ids by plan kind (delivery → delivery
  union, delivery_planning → planning) with the disclosed plan-absent
  degradation for unmapped phases instead of the silent phases[0] fallback;
  `kind` is required per delivery.plan.v1 so the mapping is total over valid
  plans, the multi-phase fixture proves phase-2 declared untracked files
  stage in phase-centric mode, and the degradation is spec-recorded (spec
  v1.2 F-5 per DEC-14) and envelope-disclosed (degradedScope). All of F-3
  through F-13 are verified resolved (fixed in code, or recorded refinements
  per DEC-14 exactly as each finding's alternative allowed; F-7 partial and
  disclosed). The integration merge fcd19811 is a clean additive union
  (edge.ts: zero deletions, all commit surfaces intact; error-table 59/59
  machine=documented=fixtures, sync re-run green by this review; the only
  deletions elsewhere are the frozen-baseline invariant updates 58→59).
  Docs spot-verified (pack-page envelope keys match the goldens;
  feature-result-contract says 59; the 8000-byte probe and batched diff are
  documented as shipped). Aggregate pnpm check re-run by this review: 3216
  pass / 4 skip / 0 fail, boundaries and exports-parity green. Three new
  non-blocking findings (1 medium, 1 low, 1 info), led by a residual
  fail-open in convergence classification when the telemetry event is
  missing — a narrow door (non-gating emission failure or torn telemetry
  read) that can still manufacture a duplicate commit on re-run; remediation
  phase 10 appended.
