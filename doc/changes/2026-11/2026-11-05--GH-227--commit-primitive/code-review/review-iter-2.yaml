findings:
  - id: F-14
    severity: medium
    confidence: high
    category: correctness
    location: packages/cli/src/edge.ts:399
    message: >-
      Convergence classification is fail-open when the telemetry event is
      absent: readEvidence collapses both a failed/torn telemetry read
      (edge.ts:395-408 `telemetry.ok ? ... : undefined`; readCommitTelemetry
      returns !ok on store read failure or a torn record,
      commit-telemetry.ts:150-163) and a landing whose telemetry append
      failed (commit-act.ts:342-348 — non-gating per spec F-8, disclosed as
      `telemetry.emitted: false`) to `commitPresent: false`. A phase whose
      commit DID land then classifies as record-atomic-without-commit, and a
      re-run lands a DUPLICATE commit with `reconciliation: commit` whenever
      in-scope tracked work is pending — the F-2 `delivery` union mapping
      widens that in-scope set to every delivery-kind phase's scope — or
      discloses the false envelope basis
      `interrupted-atomic-no-pending-work` when nothing is pending. The
      feature doc names the record the authoritative intent carrier, yet
      nothing durable carries the commit sha in this state: the act knows
      `committed.sha` BEFORE appendTransition runs (commit-act.ts:312-326),
      so the sha is available at record-append time and is simply not
      persisted. Precondition is an infrastructure failure (narrow window,
      disclosed at landing time), hence medium rather than critical — but it
      is the same harm iter-1 F-1 classified as critical, behind a rarer
      door.
    suggestion: >-
      Persist the landed commitSha on the atomic transition record (extend
      the appendTransition callback in phase.ts:568-581 to pass it; registry
      fields stay additive per DEC-7) and let readEvidence fall back to the
      record-bound sha plus a git ancestry check (a `merge-base
      --is-ancestor` port) when no telemetry event exists; classify a
      failed/torn readCommitTelemetry read as a platform fault rather than
      commit-absent. Add a corpus case: emission failure at landing, then
      re-run must not manufacture a commit.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-15
    severity: low
    confidence: high
    category: testing
    location: packages/cli/src/commands/phase.ts:513
    message: >-
      Corpus gaps around the remediation's own additions: (1) the
      envelope-only basis `interrupted-atomic-no-pending-work`
      (phase.ts:506-518) ships with no direct behaviour test — no suite
      constructs record-atomic-without-commit with no pending work, the
      string appears in no test file, and TR-9's register row still
      enumerates only the durable trio plus `no-op`; (2) the
      delivery_planning → planning-kind half of the lifecycle mapping has no
      fixture (every mapping test uses delivery-kind phases); (3) the
      plan-present-but-no-correspondence `degradedScope: "plan-absent"`
      disclosure (commit.ts:282, 327-328) is only asserted for the
      no-plan-artifact case (commit-command.test.ts:197-213), while
      TC-ATOMIC-013 exercises the unmapped-phase behavior only through
      `phase complete`, whose DM-3 envelope does not carry degradedScope
      (spec-consistent, but the commit-surface disclosure is untested for
      this variant).
    suggestion: >-
      Add corpus cases: (1) record-atomic + absent event + clean tree →
      `commitSkipped: interrupted-atomic-no-pending-work`, zero new
      commits/records; (2) a planning-kind plan phase exercised through
      `delivery_planning` (declared untracked file stages); (3) `commit
      <ref> --phase <unmapped-lifecycle-phase>` with a plan present asserts
      `degradedScope: "plan-absent"`. Extend TR-9's row and the DM-3
      vocabulary assertions to the fifth basis string (envelope-only
      assertion, mirroring the `no-op` treatment).
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-16
    severity: info
    confidence: medium
    category: code-quality
    location: packages/cli/src/commands/commit.ts:124
    message: >-
      planPhaseForLifecycle still returns phases[0] when lifecyclePhaseId is
      undefined — unlike the removed silent fallback this one cannot
      mis-scope staging (standalone scope is the union at commit.ts:320-323),
      but it silently picks plan phase 1's title/summary as the standalone
      skeleton's message context when the ledger has no current phase.
      Cosmetic artifact staleness: the plan's tier.phases still lists [1..8]
      after the appended phase 9 (inert declaration data per the plan schema,
      so validation-clean, but the artifact reads stale; this review refreshes
      it alongside the phase-10 append).
    suggestion: >-
      Leave a one-line comment pinning the undefined-id contract to the
      standalone skeleton donor (or return undefined and let standalone
      skeletons fall back to ref-only subjects); keep tier.phases aligned
      with the declared phases going forward.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
