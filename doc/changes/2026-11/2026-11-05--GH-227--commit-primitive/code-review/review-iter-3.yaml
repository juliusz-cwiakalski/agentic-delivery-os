summary: >-
  Focused re-review after remediation phase 10 (commits 70f1cd52, 190bd342,
  607166e7; base af6f3921): all three iteration-2 findings are verified closed
  and no merge-blocking regression was introduced. F-14 — the atomic completion
  record now persists the landed SHA at append time with correct ordering
  (commit-act.ts: the commit object is created at ~line 316 and
  appendTransition({commitSha}) at 326; an append failure resets to
  baselineHead, so both-or-neither atomicity is unchanged); readEvidence
  (edge.ts:385-437) treats the record-bound SHA plus git commitExists as the
  primary commit-presence evidence, demotes the non-gating telemetry event to
  corroboration, and classifies an unreadable telemetry read with no
  record-bound SHA as a platform fault (stateFailure state.store.torn, exit 2)
  that also propagates through the commit --phase surface via
  runPhaseCompleteForCommit; the registry field is additive optional with
  boundary declaration, read validation (non-empty string, atomic-only
  coupling at state/registry.ts:226-231), and a pre-write coupling guard
  (state/registry.ts:413-418); the projection fold never reads commitSha and
  payload conditional spreads keep legacy record bytes unchanged. TC-CONVERGE-010
  proves all three controls through the real harness (emission-fault landing +
  pending in-scope work on re-run is a row-2 no-op with zero new
  commits/records/telemetry and the record carrying commitSha at append time;
  a torn telemetry record cannot degrade a record-bound SHA; a legacy sha-less
  atomic record plus torn telemetry exits 2 with nothing landed), the
  commit-without-record reconciliation append persists the known SHA
  (phase.ts:483), and the iter-1 F-1 scenarios (TC-CONVERGE-009a/b/c) re-ran
  green. F-15 — TC-ATOMIC-014 asserts the envelope-only
  interrupted-atomic-no-pending-work basis with zero new
  commits/records/telemetry and zero transport calls; TC-ATOMIC-015 exercises
  the delivery_planning -> planning-kind mapping through a production-shaped
  planning plan (declared untracked file stages, record carries commitSha);
  TC-ATOMIC-016 asserts the plan-present degradedScope plan-absent disclosure
  on the commit surface; TR-9's row, the DM-3 contract type, and the phase
  pack page now pin the fifth basis string. F-16 — resolved as the pinned
  contract (commit.ts:124-125 comment; tier.phases refreshed to 1-10). Docs
  tell one story across spec v1.3, feature-commit-primitive.md,
  feature-state-layer.md, the glossary, and both m1 pack pages
  (primary-evidence / corroboration / platform-fault wording plus the five
  basis strings). Gates re-run by this review: targeted phase-atomic +
  commit-convergence 33 pass, commit-command + golden + phase-idempotency 24
  pass, structure + boundaries 605 pass, pnpm typecheck green, and the full
  aggregate pnpm check green twice (3222 pass / 4 skip / 0 fail across 305
  files; depcruise 187 modules clean; ambient-globals, workspace-entrypoints,
  secret-read-boundary, exports-parity OK). Four new findings, all
  informational (accepted residual, validation-depth and error-code nits, one
  assertion gap, one doc enumeration nit) — none block merge; no remediation
  phase appended.
