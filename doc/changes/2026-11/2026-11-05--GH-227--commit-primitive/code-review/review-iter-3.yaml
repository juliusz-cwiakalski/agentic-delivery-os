findings:
  - id: F-17
    severity: info
    confidence: high
    category: correctness
    location: packages/cli/src/edge.ts:416
    message: >-
      Residual (accepted): a sha-less atomic completion record whose telemetry
      emission failed while the telemetry store itself reads fine still
      classifies commit-absent (the guard at edge.ts:416 fires only when the
      telemetry READ fails), so a re-run with pending in-scope work would land
      a duplicate commit. Under the shipped code this is unreachable — every
      atomic append passes the SHA (normal path and reconciliation), so a
      sha-less atomic record exists only as pre-change or synthetic state, and
      the primitive ships in this very change, so no pre-change production
      records can exist. Strictly narrower than F-14's door; recorded so the
      residual is a documented decision rather than an unknown.
    suggestion: >-
      Optionally note the residual in feature-commit-primitive.md's convergence
      section (sha-less atomic records are not produced by this version) or
      leave as-is; no code change required.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-18
    severity: info
    confidence: high
    category: code-quality
    location: packages/core/src/state/registry.ts:226
    message: >-
      Validation depth and error-code nits on the new field: commitSha is
      validated only as a non-empty string (state/registry.ts:226-231) with no
      hex/length format check, unlike the git seam's SAFE_SHA guard
      (adapters/git/commit.ts:48,275) — commitExists safely rejects malformed
      values, so there is no injection or crash surface, only a consistency
      gap for hand-crafted ledger data; and the pre-write coupling guard
      (state/registry.ts:413-418) reports state.store.unknown, whose
      documented meaning is an undeclared record kind or payload schema,
      slightly stretched for a request coupling violation (unreachable in
      practice; defense in depth).
    suggestion: >-
      If touched again, validate commitSha with the same SAFE_SHA shape as the
      git seam and consider a more precise failure classification for the
      write-side guard; no action required for merge.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-19
    severity: info
    confidence: high
    category: testing
    location: tests/behaviour/commit-convergence.test.ts:79
    message: >-
      TC-CONVERGE-002 (commit-without-record reconciliation) asserts the
      reconciled record carries commitIntent atomic but not
      commitSha === <orphan sha>, so the new every-atomic-record-carries-its-SHA
      invariant is unverified on the reconciliation path (it is asserted for
      the normal path by TC-CONVERGE-010 and TC-ATOMIC-015). The code does
      persist it (phase.ts:483); a third run would still converge via the
      telemetry event if it did not, so the gap masks no user-visible failure.
    suggestion: >-
      Add one line to TC-CONVERGE-002:
      expect(transitionPayloads(harness)[0]).toMatchObject({ commitSha: sha });
      opportunistic, not blocking.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-20
    severity: info
    confidence: medium
    category: documentation
    location: doc/planning/oss-tooling/milestones/m1/commands/commit.md:91
    message: >-
      The pack page's EXIT STATUS parenthetical for exit 2 enumerates only
