  - id: F-11
    severity: info
    confidence: medium
    category: correctness
    location: packages/core/src/domain/commit-staging.ts:38
    message: >-
      Path ordering uses default-locale `localeCompare` (staging, bundle, git
      seam), which is ambient-locale sensitive (case ordering differs between
      ICU and C collation), while the feature doc claims "No path, ordering, or
      byte depends on a clock, the environment, or the locale" (NFR-4
      determinism). Matches the pre-existing sibling convention
      (closeout.ts, watchdog.ts), so cosmetic in practice; CI and the testkit
      pin LC_ALL=C.
    suggestion: >-
      For the documented claim, either pass an explicit collation
      (`localeCompare(right, "en")`) or compare codepoints; or soften the doc
      claim. No behavior change expected under pinned locales.
