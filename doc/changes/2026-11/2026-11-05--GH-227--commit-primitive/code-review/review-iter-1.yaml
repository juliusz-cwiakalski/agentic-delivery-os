      per DEC-14 ("delivery-time refinements … recorded"), so spec DM-3 and
      the delivered vocabulary now disagree. Note the string also fires
      falsely in the F-1 head-moved scenario.
    suggestion: >-
      Record the DM-3 refinement against the spec (one-line amendment per
      DEC-14: the fifth envelope-only basis and when it fires), or fold the
      case into `no-op` with reconciliation detail. Keep TR-9's equality
