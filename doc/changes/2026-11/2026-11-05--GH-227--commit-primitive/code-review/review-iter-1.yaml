  - id: F-7
    severity: low
    confidence: medium
    category: performance
    location: packages/adapters/src/git/commit.ts:107
    message: >-
      `readTree` spawns one `git diff` child per pending file (N+1 fan-out,
      each with a 30 s timeout budget) and `isBinaryContent` reads the ENTIRE
      file via readFileSync just to probe the first 8 000 bytes — a large text
      file (or many pending files) is fully loaded into memory and costs one
      spawn each. Diff budgets are enforced later in the bundle
      (commit-bundle.ts) but nothing bounds the tree-read stage, threatening
      NFR-3's dry-run ≤ 2 s p95 on big trees (the performance suite measures
      a small fixture tree only).
    suggestion: >-
      Bound the read stage: batch the diff (one `git diff -U3 -- <paths>` call
      or numstat-first selection with per-file diff only for the top-N
      candidates), and make the binary probe a bounded read (open + read 8 KB
      instead of readFileSync of the whole file).
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
