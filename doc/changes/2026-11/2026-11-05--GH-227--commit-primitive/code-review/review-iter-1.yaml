findings:
  - id: F-1
    severity: critical
    confidence: high
    category: correctness
    location: packages/cli/src/edge.ts:384
    message: >-
      `readEvidence` classifies the commit as present only when a telemetry
      event satisfies `entry.commitSha === head` (edge.ts:384-394). Once ANY
      later commit lands — the next phase's atomic completion, the normal
      11-phase sequence, or any manual commit — every earlier phase's durable
      commit no longer equals head, so its evidence degrades to
      "commit absent". A re-run of that earlier phase's `phase complete` then
      classifies `both` as `record-atomic-without-commit` (phase.ts:520) and
      runs the act: with tracked pending work present (always staged per
      DEC-15) it LANDS A NEW COMMIT for the already-completed phase with false
      `reconciliation: completed: "commit"` evidence and a SECOND telemetry
      event reusing the same transitionId; with no pending work it discloses
      the false basis `commitSkipped: interrupted-atomic-no-pending-work`.
      Empirically reproduced by this review (tmp/code-review/GH-227/
      probe-convergence2.ts): after delivery+specification complete atomically,
      re-running `phase complete GH-310 delivery` produced commit 377f0773
      "feat(GH-310): deliver the fixture change" — a duplicate of the phase's
      already-landed commit — plus a duplicate telemetry event, exit 0,
      reported as a successful reconciliation. Violates AC-F7-3 (matrix row 2:
      no-op, no record, no commit), NFR-6 (convergence total, 0 violations),
      DEC-7 ("both → no-op citing the existing completion, no commit"), and
      Appendix B row 3. No duplicate ledger record occurs (that half holds).
    suggestion: >-
      Detect commit presence from the durable event alone: phaseId match +
      transitionId === record.timestamp + (landedAt > reopenedAt when
      reopened) — drop the `commitSha === head` equality, or keep head only to
      disambiguate the commit-without-record state (where the just-landed
      commit IS head) and verify ancestry (e.g. a `containsCommit(sha)` git
      port via `merge-base --is-ancestor`) instead of equality when a record
      exists. Add corpus cases per F-3. The delivered feature doc (line 111)
      documents the head-matching as shipped behavior and must be re-synced
      with the fix.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-2
    severity: critical
    confidence: high
    category: correctness
    location: packages/cli/src/edge.ts:367
    message: >-
      The phase↔plan-phase scope lookup can never match in production.
      `readPlanPhase` (edge.ts:363-369) and `phaseContextOf`
      (packages/cli/src/commands/commit.ts:101-107) search
      `planContext.phases.find(entry => entry.phaseId === phaseId)` where
      phaseId is a canonical LIFECYCLE name from the CLI grammar
      (delivery, specification, …; the only ids `phase complete` and
      `commit --phase` accept), but valid delivery.plan.v1 plan phase ids are
      POSITIVE INTEGERS (feature-plan-schema.md: "id … Positive integer"), and
      planPhasesOf (edge.ts:305) accepts only numeric ids. The lookup
      therefore always falls back to `?? planContext.phases[0]` — plan phase
      1's declared scope and summary for EVERY phase-centric invocation —
      silently (scopeSource still reports "plan-phase"). Empirically
      reproduced (tmp/code-review/GH-227/probe-plan-scope.ts): with a
      two-phase plan declaring src/two.ts in phase 2, `commit GH-310 --phase
      delivery --dry-run` refuses with `commit.staging-blocked-untracked`
      (exit 1) treating the DECLARED file as a stray, while standalone
      `commit GH-310 --dry-run` (union scope) correctly stages it;
      `phase complete GH-310 delivery` lands record-only with the durable
      basis `skipped-no-pending-work` despite declared pending work — false
      durable evidence. In production multi-phase plans (like this change's
      own 8-phase plan) phase-centric mode can never stage declared new files
      outside phase 1's scope, defeating DEC-15's declared-new-file guarantee
      and the F-1/F-2 scope contract. The behaviour tests pass only because
      the fixture plan (tests/fixtures/commit/harness.ts:54-68) has exactly one
      phase, where phases[0] is accidentally correct — the GH-170
      fixture-vs-production anti-pattern named in this repo's own review
      checklist. The pack page (m1/commands/commit.md:49: "using the phase's
      declared plan scope") also no longer matches delivered behavior.
    suggestion: >-
      Define the lifecycle→plan-phase correspondence explicitly instead of the
      silent first-phase fallback: either (a) map lifecycle phases to the
      union/selection of delivery-kind plan phases (e.g. `delivery` → all
      delivery-kind phases; `system_spec_update` → none, disclosed), (b) extend
      the plan schema with an explicit lifecycle mapping, or (c) when no plan
      phase matches, disclose a degraded scope source instead of impersonating
      phase 1. Add a behaviour test with a ≥2-phase production-shaped plan
      asserting declared untracked files of a non-first phase are staged in
      phase-centric mode. Re-sync the pack page and feature doc once fixed.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-3
    severity: high
    confidence: high
    category: testing
    location: tests/behaviour/phase-atomic.test.ts:195
    message: >-
      The convergence and matrix corpus never exercises a re-run after HEAD
      has moved: the row-2 test (phase-atomic.test.ts:195-216) re-runs
      immediately after row 1, while the phase's commit is still HEAD, and
      commit-convergence.test.ts constructs durable states directly with the
      commit at head. That is exactly the blind spot that hides F-1 — the
      state every real delivery enters as soon as the NEXT phase completes.
      The spec's own test-plan TR-5 mitigation ("construct single-side durable
      states directly") is in force, but no case constructs the both-landed
      state with a newer commit on top, which is a durable-evidence state, not
      an interruption window.
    suggestion: >-
      Add corpus cases: (1) earlier-phase re-run after a later phase's atomic
      commit moved HEAD (expect no-op, no new commit, no new telemetry event);
      (2) earlier-phase re-run after a MANUAL commit moved HEAD with dirty
      tracked work (expect no manufactured commit); (3) commit-without-record
      detection still works when the orphan commit is at head. Drive them
      through the real harness (real git repo, real telemetry ledger), not by
      fabricating evidence objects.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
