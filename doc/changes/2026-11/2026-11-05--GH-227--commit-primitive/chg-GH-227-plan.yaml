      - "2.2 commit-bundle.ts: deterministic generated-noise stripping (lockfiles, minified, vendored), per-file diff cap with name-status fallback, top-N fully diffed, total input within the shipped budget, sorted normalized paths; bundle is built only from safety-scanned content (DEC-12, spec 20 ordering). [AC: AC-F3-1 economy half; TC: TC-MSG-002, NFR-1]"
      - "2.3 commit-staging.ts: DEC-15 precision rules — tracked pending work always staged with drift disclosure, untracked staged only inside the declared scope (union of declared phases in standalone mode, target phase scope in phase-centric mode), untracked outside scope disclosed as strays never staged, forbidden paths and oversized binaries excluded and disclosed, empty remaining set classified commit.staging-blocked-untracked. [AC: AC-F5-1, AC-F5-3; TC: TC-SAFETY-001, TC-SAFETY-002, TC-SAFETY-003, TC-SAFETY-006, TC-SAFETY-007, TC-SAFETY-008]"
      - "2.4 commit-safety.ts: scan-result classification — secret suspicion on content or filename STOPs as user identity naming the finding class without material, scanner unavailability fails closed as platform identity, completed pass recorded as evidence; classification runs before transport selection and before anything is staged (DEC-5, NFR-7). [AC: AC-F5-2, AC-F5-4; TC: TC-SAFETY-004, TC-SAFETY-005, TC-SAFETY-009, TC-SAFETY-010, TC-TRANSPORT-006 domain half]"
      - "2.5 commit-message.ts: validation pipeline — commitlint outcome (repo rules win, absent degrades to deterministic checks) plus ref-match, type allowlist, invented-ref stripping; exactly one retry with the lint error fed back; deterministic template fallback type(ref): plan-phase summary or top-path summary; a template that still violates repo commitlint aborts as commit.commitlint-failed (DEC-4, RSK-8); body-optional rule with the pinned deterministic criterion — body required when pending work spans more than one declared scope area or top-level area (OQ-T4 delivery decision recorded against F-3). [AC: AC-F3-1, AC-F3-2, AC-F3-3; TC: TC-MSG-003, TC-MSG-004, TC-MSG-005, TC-MSG-006, TC-MSG-007, TC-MSG-008, TC-MSG-009, TC-MSG-010; NFR-2]"
      - "2.6 commit-transport.ts: ordered selection core-inference then harness-one-shot then template over injected availability facts (provider route, quota park falls through without waiting, credentials) plus configuration; classified failover vocabulary recorded for the event; zero model calls when the set is empty or fully excluded or template is selected (DEC-3, F-4). [AC: AC-F4-1, AC-F4-2; TC: TC-TRANSPORT-001, TC-TRANSPORT-002, TC-TRANSPORT-003, TC-TRANSPORT-004, TC-TRANSPORT-005 domain halves; NFR-1]"
      - "2.7 commit-converge.ts: total four-state delta classification over durable evidence only — transition record with stored commitIntent plus telemetry event presence; record+atomic+no-commit lands the missing commit, record+record-only is an intentional no-op citing the stored basis, commit-only appends the record, both is a row-2 no-op, neither is the normal atomic path; the stale projection is never consulted and the mode of the current invocation never drives the outcome (DEC-7, NFR-6). [AC: AC-F7-1, AC-F7-2, AC-F7-3, AC-F7-4; TC: TC-CONVERGE-001, TC-CONVERGE-002, TC-CONVERGE-003, TC-CONVERGE-004, TC-CONVERGE-005, TC-CONVERGE-006, TC-CONVERGE-007, TC-CONVERGE-008 classification halves]"
      - "2.8 commit-act.ts: the single shared atomic act over injected ports (git, scanner, commitlint, transport, registry write, telemetry append) — staging then safety then one constrained call then validation then precise staging and commit-object plus ledger transition landing together or neither; clean abort restores both sides and classifies commit.atomic-abort; no-pending-work lands the transition alone with basis skipped-no-pending-work; exactly one record and one commit per landing; telemetry emission non-gating with disclosure (F-5/F-6 ordering, DEC-8, DEC-9). [AC: AC-F6-1, AC-F6-2, AC-F6-3, AC-F6-5; TC: TC-ATOMIC-001, TC-ATOMIC-002, TC-ATOMIC-003, TC-ATOMIC-005, TC-ATOMIC-010, TC-ATOMIC-012 orchestration halves; NFR-6]"
