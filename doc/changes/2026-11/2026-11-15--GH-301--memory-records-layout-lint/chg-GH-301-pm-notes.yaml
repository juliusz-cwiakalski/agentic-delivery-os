      + doc-conformance suite; (7) release — backlog markers, final alignment,
      full gate battery. AC ownership 30/30, TC ownership 40/40."
    type: info
    date: "2026-11-15"
  - text: "Plan-time defect discovery (feeds delivery): the delivered promotion
      writer and reader interpolate the tacit area as `tacits/`, outside the
      declared `tacit/` area, so a promoted tacit record would land uncovered
      and the new index-coverage lint would flag it. Phase 5 owns the two-sided
      fix; it widens phase 5 to reader code as well as the writer."
    type: risk
    date: "2026-11-15"
  - text: "DOR CHECK iteration 1 = NOT_READY (record:
      readiness-review/readiness-iter-1.md, commit ed463ad8). 5 facets PASS
      (plan_coverage, test_traceability, decision_capture,
      plan_doc_update_coverage, dod_defined) / 5 FAIL (spec_completeness,
      ac_quality, cross_artifact_consistency, system_spec_consistency,
      plan_code_area_coverage). 20 findings: 2 critical, 12 major, 5 minor, 1
      nit. Critical: (1) phase 2 creates packages/core/src/domain/memory-lint.ts
      which the GH-302 filename guard catches, so phase 2 lands red while the
      guard replacement is scheduled for phase 4; (2) AC-F13-1 demands zero
      merge conflicts from two branches each appending an index row to one
      shared table (empirically conflicting) while F-13 simultaneously claims
      creators never touch one file. Major themes: absent-created classification
      contradicts Appendix A and the plan's OQ-TP-2 resolution; the 'memory tree
      is outside every secret scan' premise is FALSE (privacy-literals scans all
      tracked files, all ten .ai/memory files included); determinism-vs-clock
      contradiction; F-14 overstates what the guard replacement preserves;
      archive index coverage has no expressible identity vs DM-3; the concept's
      richer keys do not survive as optional
      (valid_from/source/evidence/rationale/trust); the statement bound is
      unpublished; EXECUTABLE_ALLOWANCES row is required for the consts-only
      contract module; phase 4's commit set omits the TC-MEMDOCT-001 pinned
      manual-status string; mutant pin list misses MUT-CAP-39..41;
      core->adapters ban leaves the privacy-vocabulary type undeclared. Nit: the
      canonical record schema is a system-level contract and should be captured
      in doc/decisions/, not only change-local DEC entries."
    type: risk
    date: "2026-11-15"
  - text: "DOR REMEDIATION (iteration 1 -> 2): reopening specification (findings
