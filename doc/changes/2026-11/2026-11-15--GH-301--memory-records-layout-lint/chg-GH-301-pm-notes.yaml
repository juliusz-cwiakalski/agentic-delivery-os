    type: info
    date: "2026-11-15"
  - text: "Test plan authored by @test-plan-writer (chg-GH-301-test-plan.md,
      Proposed v1.0, 1756 lines): 40 TCs across 14 families (layout, schema,
      write-path, gate, dating, provenance, references, index, budget,
