    type: info
    date: "2026-11-15"
  - text: "Spec authored by @spec-writer (chg-GH-301-spec.md, status Proposed, type
      feat, risk medium, version impact minor): 30 ACs across layout completion,
      one record schema, write-path alignment, enforcement surface,
      schema/dating/provenance/references/index-coverage/budget/derivable/secret
