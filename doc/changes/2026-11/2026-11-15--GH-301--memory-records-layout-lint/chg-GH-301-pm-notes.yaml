notes:
  - text: "Intake: GH-301 open, labels [change], milestone attached (M2: Ceremonies,
      measurement, and memory). Branch feat/GH-301/memory-records-layout-lint
      exists at origin/main-tools tip with zero own commits, worktree clean, no
      PR in any state, no change capsule — treated as a fresh delivery, so no
      resume-sync merge and no review-comment fetch were required."
    type: info
    date: "2026-11-15"
  - text: "Clarify scope cross-check against system spec. Existing behaviour:
      `.ai/memory/` exists with index README (172 lines), four per-agent entry
      points, three promoted lessons, an empty tacit/; GH-302 delivered nine
      bootstrap templates and explicitly deferred typed records, preferences,
      retro areas, and all tooling to GH-301. `readMemoryFacts`
      (packages/adapters/src/file/memory-promotion.ts) parses frontmatter with
      regex, skips malformed records silently, and only reads lessons/ + tacit/;
      it validates no schema. No lint, index-coverage, dangling-reference,
      budget, or derivable-content check exists anywhere. Contradictions between
      ticket and system spec: none blocking."
    type: info
    date: "2026-11-15"
  - text: "RISK (must be handled in-change): GH-302 shipped a deliberate negative
      guard at tests/structure/memory-bootstrap-templates.test.ts:258-287
      asserting that no executable memory-doctor/memory-lint component exists
      and that doctor.ts is memory-free. GH-301 owns the sanctioned replacement
      of that guard; the plan must declare it, or the change contradicts a
      living test."
    type: risk
    date: "2026-11-15"
  - text: "RISK: record-schema drift. The concept model
      (doc/planning/concepts/memory-architecture.md:85-118) carries id, kind,
      scope, source, trust, confidence, valid_from, supersedes, status,
      applies_when, evidence, evaluation, revalidate_after, while the delivered
      .ai/memory/README.md record format carries a narrower set and
      packages/core/src/contracts/capsule.ts carries its own subset. GH-301 must
      publish ONE record schema (backlog fields: id, kind, scope, provenance,
      trust, validity, status) and align README + promotion writer + capsule
      contract instead of adding a fourth variation."
    type: risk
    date: "2026-11-15"
  - text: "Known doc impacts for phase 7 (system_spec_update):
      doc/spec/features/feature-capsule.md (candidate/record schema + promotion
      boundary + component map); feature-closeout.md (out-of-scope line lists
      typed records/lint as future); feature-bootstrapper.md and
      feature-document-templates.md (manual-doctor-until-tooling wording);
      feature-pm-notes-lint-and-phase-transitions.md (only if lint identities
      change); doc/templates/memory-doctor-checklist-template.md (GH-301
