      stay optional; fleet scope is candidate-only (no home); five statuses
      while writers emit candidate/superseded; 7 areas error and derivable +
      expired revalidation advisory; index row second column = read-when hint;
      kernel budget warn >200 / error >220; retro archive = episodes +
      append-maintained INDEX (generation deferred); per-agent memory stays
      free-text; negative guard replaced by positive presence + preserved
      absences; schema backfill is not semantic rewrite; manual checklist
