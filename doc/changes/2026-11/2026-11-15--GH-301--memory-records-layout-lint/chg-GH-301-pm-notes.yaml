      union resolution is honestly labelled manual+scripted. Gate battery
      commands pinned verbatim."
    type: info
    date: "2026-11-15"
  - text: "Delivery plan authored by @plan-writer (chg-GH-301-plan.yaml, tier full,
      plan validate = valid + readyForDevelopment=true, lint plan valid): 7
      phases. (1) canonical layout + published schema + budgets in
      .ai/memory/README.md + machine contract + backfill of the 3 lessons; (2)
      pure evaluator — schema/dating/provenance/references; (3) evaluator
