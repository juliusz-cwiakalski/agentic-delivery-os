  - text: "DEC-2 layout: complete the memory tree that GH-302 deliberately deferred
      — preferences/, guilds/<guild>/, and the retro archive area join the
      delivered index + per-agent entry points + lessons + tacit. GH-302's spec
      named preferences and retro as M2-S8 scope; the M2-S8 backlog task line
      names them plus guild trees. One typed record per file and append-only
      index rows stay the merge-conflict rule. `external/` (fleet import
      quarantine) is NOT added: it is absent from the M2-S8 task line and
      belongs to the fleet layer."
