decisions:
  - text: "DEC-1 scope: deliver M2-S8 exactly as the backlog task list states
      (committed typed-record memory tree + memory lint in the quality gates).
      Explicit non-goals: the `ados memory` command family (M3-S8), the memory
      compiler / role-filtered projections (M3-S9), visibility enforcement at
      the loader, and a sixth `doctor` area (feature-doctor.md requires a spec
      amendment for that). Drivers: backlog story dependency graph; concept doc
      memory-architecture.md increment plan puts lint-in-gates at step 2 and the
      command family at step 4."
    date: "2026-11-15"
  - text: "DEC-2 layout: complete the memory tree that GH-302 deliberately deferred
      — preferences/, guilds/<guild>/, and the retro archive area join the
      delivered index + per-agent entry points + lessons + tacit. GH-302's spec
      named preferences and retro as M2-S8 scope; the M2-S8 backlog task line
      names them plus guild trees. One typed record per file and append-only
      index rows stay the merge-conflict rule. `external/` (fleet import
      quarantine) is NOT added: it is absent from the M2-S8 task line and
      belongs to the fleet layer."
    date: "2026-11-15"
  - text: "DEC-3 enforcement surface: memory lint is a repository invariant check
      (`scripts/checks/memory-lint.ts` + pure domain logic in
      `packages/core/src/domain/`) wired into `pnpm check` and the CI
      `ts-invariants` job, mirroring the delivered checks convention. The CLI
      `lint`/`verify`/`doctor` grammars stay unchanged. Driver: the backlog says
      'memory lint in the quality gates'; adding a CLI target would encroach on
      M3-S8."
    date: "2026-11-15"
  - text: "DEC-4 secret evidence: memory lint reuses the existing privacy-rule
      vocabulary (`packages/adapters/src/io/privacy-rules.ts`) instead of
      introducing a second credential-pattern table, so the memory gate and the
      whole-tree privacy gate cannot drift apart."
    date: "2026-11-15"
