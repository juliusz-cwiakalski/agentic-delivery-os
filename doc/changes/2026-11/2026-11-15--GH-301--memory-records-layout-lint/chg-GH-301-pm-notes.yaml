    type: info
    date: "2026-11-15"
  - text: "RETRO: the gate paid for itself twice. (a) The critical phase-2 defect
      was an interaction between a predecessor's negative guard and a module
      filename — invisible to each artifact's own author and only visible when
      the plan was read against the guard source. (b) The spec asserted a false
      capability premise ('the memory tree is outside every secret scan') that
      would have shipped a duplicated secret-pattern table under a false
      justification; the reviewer's empirical file-set check caught it. Lesson
      for upstream authoring: current-state claims must cite a command or
      file:line probe, not an inference from which guard 'owns' which scope
      class."
    type: retro
    date: "2026-11-15"
  - text: "DOR REMEDIATION APPLIED (iteration 1 -> 2): spec v1.1 (commit 72d357d4)
      closed findings 2,4,6,8,9,10,11,12,17,20 — AC-F13-1 scoped to record files
