# COMMIT CONVENTION (one commit per plan phase; subjects declared here so the
# commit path and review agree; the commit primitive composes the message from
# the plan-phase summary when `--phase delivery` is used):
#   phase 1  feat(GH-301): complete the memory tree and publish the record schema
#   phase 2  feat(GH-301): evaluate memory schema, dating, provenance, references
#   phase 3  feat(GH-301): enforce memory coverage, budgets, derivables, secrets
#   phase 4  feat(GH-301): add the memory lint gate and replace the negative guard
#   phase 5  feat(GH-301): render the full record schema on promotion
#   phase 6  docs(GH-301): align the kernel, curator rules, and record concepts
#            with the lint
#   phase 7  docs(GH-301): mark M2-S8 delivered with the full gate battery green
