# PINNED IMPLEMENTATION CONTRACTS (do not reshape at delivery):
#   - Phase order follows the spec's §18 ordering with one declared deviation:
#     layout + migration + schema publication first, then the evaluator's areas,
#     then the invariant and its wiring. The write path follows in phase 5 and
#     the documentation/boundary reconciliation in phase 6. Phases 1-3 make the
#     delivered tree conformant and the evaluator complete, phase 4 turns the
#     gate on. No phase lands a red tree (spec §17.1 framing rule 1, RSK-3).
#   - GH-302 NEGATIVE-GUARD REPLACEMENT IS SPLIT ACROSS TWO PHASES, and the split
#     is the pinned choice (readiness iteration-1 finding 1). The delivered guard
#     (`tests/structure/memory-bootstrap-templates.test.ts`, TC-MEMDOCT-002) walks
#     `scripts/`, `tools` and `packages/` and fails on any FILE NAME matching
#     `/memory[-_](doctor|lint)|memoryDoctor|memoryLint/i`; it also asserts that
#     no `package.json` script value matches that pattern. Phase 2 lands
#     `packages/core/src/domain/memory-lint.ts`, which therefore collides.
#     Because AC-F14-1 sanctions exactly the module names that match — the
#     invariant's check, the pure evaluator, the schema contract module — the
#     evaluator keeps its name and phase 2 NARROWS the guard into a sanctioned-set
#     scan that permits only `packages/core/src/domain/memory-lint.ts` while the
#     `package.json` script-value assertion stays a blanket absence (no script
#     names a memory check yet). Phase 4 then completes the replacement in the
#     SAME commit as the check edge and the `check:memory` script. The delivered
#     shape is the THREE-PART SET AC-F14-1/DoD-15 and TC-MEMGUARD-001 declare:
#     (i) presence plus both-gate citation of the invariant; (ii) ONE narrowed
#     file-name sanction scan over the same three trees whose permitted-match set
#     EQUALS the sanctioned module set — `scripts/checks/memory-lint.ts`,
#     `packages/core/src/domain/memory-lint.ts`, and
#     `packages/core/src/contracts/memory-record.ts` (the schema contract module,
#     named by path in the set although its file name does not match the
#     pattern) — proven non-vacuous and proven to fail on a planted unsanctioned
#     module; and (iii) the preserved boundary absences (no memory subcommand,
#     `DOCTOR_AREAS` unchanged at five with no memory member, error-table row set
#     and domain-kind membership unchanged) plus the sanctioned script-value
#     assertion (the aggregate chain cites the check path and no other script
#     names a memory-lint component). The intermediate phase-2 form is never the
#     delivered shape; AC-F14-1's shape is reached at phase 4, and no phase
#     boundary is red.
#   - READ / PARSE / DATE / PRINT BOUNDARY (test plan v1.3 TC-MEMGATE-003, §4).
#     The boundary is stated once, and the suites assert exactly this: the
#     SCANNER ADAPTER (`packages/adapters/src/file/memory-scan.ts`) owns every
#     file read and the YAML frontmatter parse; the CHECK EDGE
#     (`scripts/checks/memory-lint.ts`) owns the single ambient date read and the
#     printing, and performs no fs read and no YAML parse of its own;
#     contracts/domain perform no I/O at all. "The edge reads the tree" is not a
#     valid formulation of this boundary.
#   - The check edge is `scripts/checks/memory-lint.ts`; the pure evaluation is
#     `packages/core/src/domain/memory-lint.ts` (no I/O, no clock, no fs); the
#     scanner is `packages/adapters/src/file/memory-scan.ts`; the schema
#     authority is `packages/core/src/contracts/memory-record.ts` (data and
#     types only). The capsule contract keeps its candidate model; only the
#     `source` channel set is tightened, and it is validated in
#     `packages/core/src/domain/capsule-candidates.ts` so the existing
#     `closeout.capsule-invalid` identity carries it (DEC-8). The candidate
#     `scope: fleet` value stays in `CAPSULE_CANDIDATE_SCOPES`: the refusal is a
#     PROJECTION rule in `validateCandidate`, never a widened or narrowed
#     contract.
#   - PRESENCE PARTITIONS BY KEY AND THE PARTITION IS EXHAUSTIVE AND DISJOINT
#     (spec v1.3 F-5/F-7, AC-F2-2/AC-F7-1, Appendix A; test plan TC-MEMPROV-001).
#     `source` is SCHEMA-owned: an absent `source` is `memory.schema.keys-missing`
#     and an out-of-channel `source` is `memory.schema.value-unknown`. `evidence`
#     and `created_by` are PROVENANCE-owned: `memory.provenance.evidence-missing`,
#     `…evidence-shape-unknown`, `…created-by-missing`. Every other required key
#     is schema-owned. No key is classified by both areas, so one defect yields
#     one finding and the register gains no id.
#   - PRIVACY-VOCABULARY TYPE PLACEMENT (readiness iteration-1 finding 18). The
#     pure evaluation receives the vocabulary, it does not import it: the
#     STRUCTURAL TYPE (recognizer classes plus suppression markers, and the
#     shape of one rule) is declared in
#     `packages/core/src/contracts/memory-record.ts` under the domain tier, and
#     the edge injects the adapter's data from
#     `packages/adapters/src/io/privacy-rules.ts`. `.dependency-cruiser.cjs`
#     rule `matrix-core-importer` forbids `packages/core/**` importing
#     `packages/adapters/**`, so no core file may name an adapter type or path;
#     the injected classes are asserted EQUAL to the adapter's recognizer classes
#     AT THE EDGE (test plan §8.2), which is what keeps one vocabulary rather
#     than a second table.
#   - BOUNDS AND BUDGETS ARE SINGLE-SOURCED (DM-5, ADR-0011 D6). The statement
#     bound (280) and the hint bound (120) are `STATEMENT_MAX_CHARS` /
#     `HINT_MAX_CHARS` in the contracts module, as are the budget caps (index 200
#     lines / 25 KB, entry point 150, archive index 200, kernel 200 warn / 220
#     error). No test, fixture or implementation source restates a number: suites
#     and fixtures IMPORT these constants and generate their boundary rows from
#     them (`bound-1`/`bound`/`bound+1`), so a deliberate bound change moves the
#     fixtures with it. This plan and the human rendering in
#     `.ai/memory/README.md` quote the current published values for the reader;
#     neither is their source.
#   - ADR-0011 IS THE SCHEMA AUTHORITY AND MUST BE TRACKED. At this revision the
#     record is ALREADY COMMITTED: `git ls-files --error-unmatch
