#   - One schema authority, two renderings, no fifth variation (C-1, C-11): the
#     backlog's seven conceptual fields are the required spine; every concept key
#     has a recorded disposition (accepted-optional, renamed, or rejected by
#     design with its home named) and the closed optional set is exactly the ten
