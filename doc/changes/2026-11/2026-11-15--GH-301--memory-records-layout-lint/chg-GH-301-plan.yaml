#     `human_correction`. One table enforces them so a hand-authored record
#     cannot be stricter or looser than a promoted one.
#   - The record `kind` vocabulary is `lesson | tacit_fragment | preference`.
#     The capsule class token `tacit` renders as `kind: "tacit_fragment"`; the
#     capsule class token `lesson` renders as `kind: "lesson"`. `preference` and
#     `fleet` candidates keep their delivered rejections (NG-6).
#   - The index row's second column is the read-when hint: derived from the
#     record's `applies_when`, falling back to `statement`, whitespace-collapsed,
#     non-empty, at or under the published hint bound (DEC-7).
#   - Severity (DEC-6): schema, dating, provenance, reference, index, budget and
#     secret findings are `error`; `memory.derivable.*` and
#     `memory.dating.revalidate-expired` are `warn`. Advisories never change the
#     exit. Kernel lines >200 and <=220 is one `memory.budget.kernel-lines`
#     advisory; >220 is the same identity as an error (DEC-9).
#   - DETERMINISM IS DEFINED AGAINST A FIXED INJECTED DATE (NFR-1,
#     AC-NFR1-1/NFR-1 as amended by spec v1.1). The thin edge performs EXACTLY ONE
#     date read per run and injects it; the pure evaluation reads no clock of its
#     own. For one tree and one injected date the output — order, truncation and
#     detail included — is byte-identical across runs, and repeated runs read no
#     clock, so the tree's own mtime or the wall clock cannot change a verdict.
