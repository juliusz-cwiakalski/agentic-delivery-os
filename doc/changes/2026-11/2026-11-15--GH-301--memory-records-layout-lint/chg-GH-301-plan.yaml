# RESOLVED TEST-PLAN OPEN QUESTIONS (pinned here; the test suites assert these
# choices and nothing broader):
#   OQ-TP-1  The aggregate script is `check:memory` and it invokes
#            `bun run scripts/checks/memory-lint.ts`; package.json and the CI
#            `ts-invariants` step cite that same path (phase 4).
#   OQ-TP-2  A record without `created` is classified ONCE, as
#            `memory.schema.keys-missing` (the required-key pass runs first; the
#            dating pass only validates a present value). A present but
#            malformed or future `created` is `memory.dating.created-malformed` /
#            `memory.dating.created-future`. Never both for one record.
#   OQ-TP-3  The promotion writer keeps EXACT-ROW equality for index dedup
#            (`readText(...).includes(write.indexRow)`, unchanged); a re-run
#            recomputes the same hint from the same candidate and therefore the
#            same row. A duplicate row is still `memory.index.row-duplicate`
#            when one is injected.
#   OQ-TP-4  Same-role parallel-worktree union resolution stays a documented
#            manual+scripted procedure; no test claims it away (F-13).
#   OQ-TP-5  The kernel memory section is measured in `AGENTS.md` from the line
#            matching `^## Agent memory$` up to (exclusive) the next line
#            matching `^## `; the heading line is counted. A missing anchor is a
#            test failure, never a silent zero.
