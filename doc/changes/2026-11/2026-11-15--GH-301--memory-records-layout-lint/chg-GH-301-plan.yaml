  # Content obligations:
  #  3.1 Index area — TWO EVALUATIONS OVER TWO UNIVERSES (C-10, DM-3, AC-F9-2).
  #      U-1 (memory index): `record-uncovered` for a covered path with no row and
  #      `row-unbacked` for a row naming no covered path, reported independently —
  #      one of each yields exactly two findings. U-2 (archive index): the same two
  #      rule ids evaluated over the retro notes and the archive index's own rows,
  #      so a note with no archive row is `record-uncovered` and an archive row
  #      backed by no note is `row-unbacked`. EVERY index finding carries its
  #      universe (`memory-index` / `archive-index`) in the detail; no rule
  #      identity outside the register is emitted, and the memory index is not a
  #      covering surface for retro notes. Row shape: `hint-missing` for an empty
  #      second column, `row-malformed` for a hint longer than `HINT_MAX_CHARS`,
  #      `row-duplicate` for a second row for one covered path. Explicitly not
  #      covered in U-1: topic files, retro notes, `.gitkeep`, the index itself,
  #      and area directories (so a directory row is `row-unbacked`, not a new
  #      wrong-target identity).
  #  3.2 Budget area: index lines (200) and bytes (25 KB, `Buffer.byteLength`
  #      at the edge / injected byte counts in the pure pass), agent and guild
  #      entry points (150), archive index (200), kernel section (warn >200 and
  #      <=220, error >220) under the pinned anchor (OQ-TP-5). Every cap is
  #      IMPORTED from the phase-1 contract constants — no literal is restated in
  #      the evaluator, the suites or the fixtures: the boundary matrix is
  #      generated as `cap-1` / `cap` / `cap+1` from the constant, so raising a cap
  #      moves the fixtures with it. Exactly at cap passes; the detail names file,
  #      measured value and cap.
  #  3.3 Derivable area: two closed deterministic heuristics over record bodies
  #      — a fenced block that is a repository file listing, and a fenced block
  #      that restates a declared workspace command. Both `warn` only.
  #  3.4 Secret area: match every scanned file with the delivered privacy rules
  #      and their suppression classes; emit one `memory.secret.<class>` per
  #      recognizer class, path and line, never the value. Rule-id derivation
  #      comes from the injected vocabulary, not a local list.
  #  3.5 Output model: deterministic order (area, path, line, rule id), one line
  #      per finding, the summary line carrying record/area/error/advisory
  #      counts, the <= 100 / <= 100 print ceiling with one truncation line
  #      carrying true totals, and the exit projection (non-zero iff at least one
  #      error). Byte-identical repeated runs AT ONE FIXED INJECTED DATE: the
  #      suite passes the date in explicitly and asserts the same bytes twice, so
  #      determinism is proven without a clock in the evaluation.
