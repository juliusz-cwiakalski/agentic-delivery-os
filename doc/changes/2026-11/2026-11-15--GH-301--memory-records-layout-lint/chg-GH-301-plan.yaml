#     stays candidate-only — kept in `CAPSULE_CANDIDATE_SCOPES` and refused on a
#     promotable (`lesson`/`tacit`) candidate at candidate-schema time, phase 5;
#     status keeps five lifecycle values while writers emit only
#     `candidate`/`superseded`.
#   - CONDITIONAL REQUIREMENTS ARE DECLARED, NOT ASSUMED (DM-1, ADR-0011 D5).
#     `basis` is REQUIRED on every promotion-written record — promotion already
#     refuses an empty basis — and OPTIONAL on a hand-authored record, omitted
#     when absent; the writer therefore always renders it, and its absence on a
