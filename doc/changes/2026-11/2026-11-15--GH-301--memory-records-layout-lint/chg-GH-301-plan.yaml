  # Test obligations: `tests/structure/memory-layout.test.ts` (TC-MEMLAY-001,
  # -002, -003 with the temp-copy negative mutant), `tests/structure/
  # memory-record-schema.test.ts` (TC-MEMSCHEMA-001 PARITY ONLY — the
  # human/machine required and optional sets, every closed vocabulary, the
  # capsule overlap asserted over exactly the vocabulary the capsule exposes
