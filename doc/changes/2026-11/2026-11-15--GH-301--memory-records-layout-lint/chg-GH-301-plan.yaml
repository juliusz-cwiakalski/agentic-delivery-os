  # ---------------------------------------------------------------------------
  # Phase 1 — Canonical memory tree, published record schema, record backfill
  # Commit: feat(GH-301): complete the memory tree and publish the record schema
  #
  # Goal: one layout and one schema authority exist before any evaluation or
  # writer consumes them (F-1, F-2, DM-1, DM-2, DM-3; DoD-1, DoD-2, DoD-8
  # migration half).
  #
  # Content obligations:
  #  1.1 Layout completion (DM-2, §19). Create `preferences/` and `guilds/` with
  #      a `.gitkeep` placeholder each, and `retro/INDEX.md` as a header-only
  #      archive index. NO guild folder, NO preference record and NO retro note
  #      is fabricated; `.gitkeep` is never a record, an index target or a
  #      finding. `external/` stays absent by decision (NG-5, DEC-2).
  #  1.2 Index rewrite (DM-1, DM-2, DM-3, DM-5). `.ai/memory/README.md` publishes
  #      the record schema (required spine, closed optional set with the
  #      concept-key dispositions ADR-0011 D3 owns, closed vocabularies with the
  #      compact T0-T5 trust table, id and file-name grammar, validity start), the
  #      conditional requirements (`basis` required on a promotion-written record
  #      and optional on a hand-authored one, `revalidate_after` for an
  #      authoritative behaviour-changing lesson, `guild` exactly under a guild
  #      folder, `superseded_by` on a superseded record, a preference record's
  #      `human_correction` source), the canonical layout, the published bounds
  #      and budgets (statement 280, read-when hint 120, index 200 lines / 25 KB,
  #      entry points 150, archive index 200, kernel 200 warn / 220 error) and the
  #      lint contract (the invariant, the eight areas, the advisory class, the
  #      schema/provenance presence partition — `source` schema-owned, `evidence`
  #      and `created_by` provenance-owned, one defect one finding — one read-when
  #      row per covered path, the two coverage universes). Every number
  #      published here is the constant the machine contract declares — the doc
  #      restates no arithmetic. Duplicated kernel prose is COMPRESSED to pointers
  #      so the file stays <= 200 lines and <= 25 KB with the added content
  #      (measured, DoD-2/DoD-11). The lint contract is stated as the invariant
  #      this change delivers; phase 4 enables it, and nothing asserts the claim
  #      before the check exists.
  #  1.3 Index rows (DM-3). Exactly one row per covered path: the four agent
  #      entry points, the three lesson records, and `retro/INDEX.md`. Each
  #      second column is a read-when hint at or under the published hint bound.
  #      No directory rows for `lessons/`, `tacit/`, `preferences/`, `guilds/`,
  #      `retro/`.
  #  1.4 Record backfill (DEC-12, AC-F7-2). The three lesson records gain the
  #      required `trust` level (from their recorded `merged_pr` channel under
  #      the published trust table) and a shaped `merged-pr:` evidence link
  #      carrying the same evidence. IDs, statements, statuses and bodies are
  #      unchanged; a schema backfill is not a semantic rewrite.
  #  1.5 Entry points: measured against the 150-line cap and the capture-line
  #      date shape (`YYYY-MM-DD`). Content is edited ONLY where a cap or a date
  #      shape forces it (declared here so the edit stays in scope).
  #  1.6 Machine contract `packages/core/src/contracts/memory-record.ts`: data
  #      and types only — required/optional key sets, kind/scope/status/trust/
  #      source/basis/evidence vocabularies, id and file-name grammar sources,
  #      the budget constants, `STATEMENT_MAX_CHARS` (280), `HINT_MAX_CHARS`
  #      (120), the privacy-vocabulary STRUCTURAL TYPE (recognizer classes plus
  #      suppression markers, injected by the edge — never an adapter import; see
  #      the pinned privacy-vocabulary-placement contract above), and the closed
  #      finding register with area order and severity. Re-exported from
  #      `packages/core/src/contracts/index.ts`. `as const` data plus `type`
  #      aliases only: no function body, no `node:` import, no I/O.
  #  1.7 Inventory allowance for the contract (readiness iteration-1 finding 13).
  #      `tests/structure/content-inventory.test.ts` counts any statement outside
  #      its types-only set as executable and rejects a bare `export const` with
  #      "executable statement VariableStatement is not permitted at scaffold", so
  #      the new module REQUIRES an `EXECUTABLE_ALLOWANCES` row
  #      (`"core/src/contracts/memory-record.ts": [...]`), exactly as every
  #      existing contracts module has one. The row MUST list EVERY exported const
  #      name, because an exported name missing from the row fails as "undeclared
  #      executable export"; the row therefore PINS the contract's export surface,
  #      so adding, renaming or removing an exported constant is a declared design
  #      edit to this row in the same commit and never a silent inventory drift.
  #      `tests/structure/inventory.json` gains the module path in the core list.
  #  1.8 ADR-0011 tracking (decision capture; the schema authority). The record
  #      MUST be tracked with its content unchanged — status `Proposed`,
  #      `decision_date: null`, owner ratification or veto at the GH-301 open-PR
  #      gate (R2; no AI acceptance). At this revision it is ALREADY COMMITTED, so
  #      this obligation is a VERIFICATION and edits nothing: the done condition is
  #      that the record is tracked and its row resolves, never that a particular
  #      commit performed the add. `doc/decisions/00-index.md` is already committed
  #      and already carries the ADR-0011 row; it is declared in scope so the row
  #      and the file are visible together and a broken row cannot land silently.
  #      The verification sits in phase 1 because phase 1 is the EARLIEST phase
  #      whose content obligations touch the schema authority:
  #      it delivers the machine contract and the human rendering that ADR-0011
  #      D1-D6 owns (C-11), and every later phase cites that record as the
  #      authority it consumes.
