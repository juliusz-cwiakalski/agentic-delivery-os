# One ticket, one PR against main-tools, seven delivery phases. Every phase is an
# independently committable slice that is green at its own boundary, and every
# phase is ONE commit through the commit primitive (conventional subject, scope
# GH-301 per repo convention `feat(GH-301): ...`, every body/footer line
# <= 100 characters). The parsed document carries only schemaVersion,
# workItemRef, tier, defaultLeases, defaultWeightClass and phases (id, title,
# kind, summary, scope, interactions, weightClass). Content obligations,
# test obligations, done-when criteria, commit subjects and the exact gate
# commands are carried in YAML comments: the plan declares phases and scope
# only, never a `tasks` key, and progress is a pm-notes `notes:` entry.
