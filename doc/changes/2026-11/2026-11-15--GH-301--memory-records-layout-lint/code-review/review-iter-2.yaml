  f10_execution_evidence:
    verdict: CLOSED
    evidence: >-
      Test plan v1.5 section 10 is populated with per-TC verdicts and evidence;
      the new cells (supersession round trip, derived hint, over-bound refusal,
      newline-terminated at-cap, out-of-tree citation, key-half suppression,
