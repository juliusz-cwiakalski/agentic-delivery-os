summary: >-
  Second review iteration after remediation of review-iteration-1. The branch now
  closes every in-scope finding: F-1 (supersession writes superseded_by so a
  writer -> scan -> evaluate round trip is lint-clean), F-2 (hint is never a
  truncated statement), F-3 (candidate statement bounded and refused through
  closeout.capsule-invalid), F-4 (suppression scoped to the guard's own
  value-segment seam), F-5 (out-of-tree links are citations), F-6 (trailing
  newline no longer counts as a line), F-7 (capture-line date heuristic restricted
  to date-like tokens), F-8 (empty/non-string statement is one keys-missing), F-9
  (one globally area-ordered printed stream with two separate ceilings), and F-10
  (populated execution log plus the missing cells). I re-ran the memory-scope
  battery (18 files / 194 pass / 0 fail), the secret/budget/output/reference/
  dating/schema suites (94 pass), the promotion + supersession suites (20 pass),
  the guard/replacement suite, content-inventory, privacy-literals (39 pass),
  capsule-mutants (2 pass / 44 mutants), the live check (records=3 areas=8
  errors=0 advisories=0), and core+adapters typecheck and biome check (clean).
  I independently re-broke each key fix and confirmed the new tests fail without
  it (F-1, F-2, F-3, F-4, F-5, F-6, F-9), so the coverage is non-vacuous. The
  only remaining items are the two owner-accepted info residuals F-11 (perf cell
  uses an empty privacy vocabulary; NFR-8 TMPDIR precondition demonstrated with a
  sibling dir) and F-12 (kind-to-home-area mapping not gated by the lint), plus
  the environment-bound AC-NFR8-1 partial, all disclosed in pm-notes. Plan
  revision 1.5 validates and all eight declared plan phases carry per-phase
  commit+test evidence. Verdict: PASS; proceed to quality gates.
