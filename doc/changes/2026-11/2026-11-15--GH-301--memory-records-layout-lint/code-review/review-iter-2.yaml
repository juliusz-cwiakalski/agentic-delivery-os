  f1_supersession_link:
    verdict: CLOSED
    evidence: >-
      supersedeRecord now takes replacementId and, after rewriting status
      candidate -> superseded, inserts superseded_by: "<new-id>" when absent and
      is idempotent. repository#memory-promotion.ts:128-155,
      applyPromotionWrite passes write.recordId. Round trip green in
      memory-promotion-schema.test.ts and closeout-capsule-supersession.test.ts
      (zero findings over the resulting tree). Non-vacuity: I removed the
      insertion and both round-trip assertions failed (target.superseded_by
      undefined; 3 failures).
  f2_hint_not_truncated:
    verdict: CLOSED
    evidence: >-
      deriveHint no longer slices a statement. It returns collapsed applies_when
      when it fits, the collapsed statement when there is no applicability and it
      fits, else a deterministic "read when a <scope>-scoped <kind> applies"
      phrase (<=120, deterministic). capsule-candidates.ts:239-257. Non-vacuity: I
      reverted dist deriveHint to the old slice and both TC-MEMWRITE-002 cells
      failed (hint equal to a statement/applicability prefix).
  f3_candidate_statement_bound:
    verdict: CLOSED
    evidence: >-
      validateCandidate refuses statement.length > STATEMENT_MAX_CHARS with
      detail "statement exceeds the published bound" through the existing
      closeout.capsule-invalid identity; a 280-char candidate promotes and lints
      clean. capsule-candidates.ts:119-121. Non-vacuity: I removed the bound from
      the built dist and the 281-char refusal test failed (exit 0 instead of 1).
  f4_value_segment_suppression:
    verdict: CLOSED
    evidence: >-
      The memory secret scan evaluates suppression markers only against
      rule.suppressionValueFor(matched), injected per rule by the check edge from
      the delivered guard's own suppressionValueFor(rule.id, matched). A
      key-half marker (fake_token: <value>) now fires in both the guard and the
      lint; a value-segment marker still suppresses. privacy-rules.ts only gains
      an `export` (no logic change), so the whole-tree guard is not weakened;
      privacy-literals (39 pass) and the guard suite stay green. Non-vacuity: I
      reverted to whole-match suppression and the key-half-marker test failed
      (finding dropped to []).
  f5_link_scope:
    verdict: CLOSED
    evidence: >-
      resolveLink reports an escaped flag when `..` would pop past the memory
      root; absolute repository paths are skipped. An out-of-tree link
      (../../../AGENTS.md, /doc/...) is silent while an in-tree missing link
      still fires memory.reference.link-dangling. memory-lint.ts:383-475.
      Non-vacuity: I removed the escaped skip and the out-of-tree control failed
      (link-dangling emitted for ../../../AGENTS.md).
  f6_line_measure:
    verdict: CLOSED
    evidence: >-
      measureLines subtracts the trailing-newline terminator; budget fixtures are
      newline-terminated (lineFiller appends \n). A newline-terminated surface at
      exactly the cap is silent; cap+1 reports the true measured value. Non-
      vacuity: I reverted measureLines to raw split().length and the at-cap test
      (and the boundary matrix) failed with index-lines 201.
  f7_entry_line_date:
    verdict: CLOSED
    evidence: >-
      entry-line-date now fires only on a calendar-shaped leading token
      (YYYY-MM-DD / YYYY/MM/DD / date-time); a non-date bullet such as
      "- GH-301: ..." or "- T0-T5: ..." is silent. Negative controls added in
      mutants.ts; dating suite green (18 pass).
  f8_statement_presence:
    verdict: CLOSED
    evidence: >-
      An absent-as-empty (empty/whitespace) or non-string statement yields exactly
      one memory.schema.keys-missing; absent statement remains the required-key
      keys-missing. Schema mutants for empty, whitespace-only and non-string
      statement added; schema suite green (22 pass).
  f9_printed_order:
    verdict: CLOSED
    evidence: >-
      The report prints one stream selected from the area-ordered `sorted` array
      with separate 100/100 error/advisory print budgets, and the truncation line
