decisions:
  - id: D-1
    subject: F-1 supersession writes the replacement link, tested end to end
    verdict: COMPLIANT
    rationale: >-
      The write path now produces a symmetric pair and a lint-clean tree; the
      behaviour test is the round trip the review asked for, and it fails without
      the fix.
  - id: D-2
    subject: F-2 derivation chosen from the iter-1 options
    verdict: COMPLIANT
    rationale: >-
      iter-1 permitted "synthesise a 'when ...' hint from structured candidate
      fields"; the class/scope phrase is that option, deterministic and bounded,
      and the capsule + memory-lint system specs were reconciled to it.
  - id: D-3
    subject: F-4 seam placed per rule on MemoryPrivacyRule
    verdict: COMPLIANT
    rationale: >-
      Binding the guard's suppressionValueFor per rule (follow-up 04c6d4da)
      removes the vocabulary-level duplicate and keeps one suppression
      implementation; the guard is unchanged apart from an export.
  - id: D-4
    subject: Commit subjects use the primitive template (a docs(GH-301) prefix)
    verdict: COMPLIANT
    rationale: >-
      The remediation commits (73048dce, 04c6d4da, 47918467) carry the commit
      primitive's template subject, including a docs-prefixed commit that edits
      source. Consistent with iter-1 D-4 (no inference transport configured); the
      branch-range commit-message gate remains the authority. Traceability is
      weaker than ideal but not a code defect.
  - id: D-5
    subject: AC-NFR8-1 repository-local TMPDIR demonstrated with a sibling dir
    verdict: ACCEPTED_WITH_CAVEAT
    rationale: >-
      The nested-git workspace prevents a repository-local TMPDIR for fifteen
      pre-existing suites; the battery is green with a sibling directory on the
      same filesystem and the deviation is disclosed. Literal precondition not
      demonstrated (F-11).
  - id: D-6
    subject: AC-F3-1 wording vs the derived-phrase edge path
    verdict: COMPLIANT_WITH_NOTE
    rationale: >-
      AC-F3-1 still reads "derived from applicability with statement as fallback";
      the delivered third path (class/scope phrase when both exceed the bound) is
      documented in feature-capsule.md and feature-memory-lint.md and satisfies
      the AC's explicit requirements (non-empty, <=120, read-when, zero
      findings) plus ADR-0011 D6. The change spec AC text was not reworded; a
      future spec touch-up could name the phrase path, but this is not a blocking
      gap.
  - id: D-7
    subject: Doc re-sync touches feature-capsule.md and feature-closeout.md
    verdict: COMPLIANT
    rationale: >-
      The two spec docs changed in 47918467 are the doc-syncer reconciliation of
      the delivered supersession/hint behaviour; this is the standing
