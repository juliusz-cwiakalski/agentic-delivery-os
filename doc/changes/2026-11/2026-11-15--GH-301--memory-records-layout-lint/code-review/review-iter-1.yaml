summary: >-
  First review iteration of the GH-301 range (origin/main-tools...HEAD, 76 files,
  +11103/-327). The eight lint areas, the closed finding register, the two
  coverage universes, the budget/bound surface, the deterministic bounded output,
  the sanctioned three-part replacement of the GH-302 guard, the gate/CI parity,
  the layout completion, the record migration, and the documentation
  reconciliation are all delivered and independently green: the live check exits
  0 (records=3 areas=8 errors=0 advisories=0) and the memory, wiring, guard,
  schema-parity, layout, docs and behaviour suites pass (I re-ran 191 memory-scope
  test cases plus prompt-conformance, forbidden-literals, privacy-literals, and
  the doc-distribution guard). However the change cannot PASS yet. The delivered
  promotion supersession path marks a target record `status: superseded` without
  writing `superseded_by`, so a normal closeout supersession leaves the tree
  failing the new gate with two errors (memory.schema.superseded-by-missing and
  memory.reference.supersede-asymmetry) - a supported write path now produces a
  red build, and no test exercises the invariant after a supersession. Three
  further contract drifts are real and reachable: the promotion hint truncates the
  statement (ADR-0011 D6 / DEC-7 say a hint is never a truncated statement), the
  candidate contract does not bound `statement` at 280 so a schema-valid
  candidate can render an over-bound record, and the memory secret suppression is
  evaluated over the whole match span rather than the delivered
  suppression-value seam, so a marker in the key (e.g. `fake_token: <secret>`)
  suppresses a hit the whole-tree privacy guard reports. Two latent false-positive
  sources (out-of-memory-tree links, digit-bearing entry bullets), an off-by-one
  at the published line caps for newline-terminated files, and an unpopulated
  test-plan execution log round out the findings.
