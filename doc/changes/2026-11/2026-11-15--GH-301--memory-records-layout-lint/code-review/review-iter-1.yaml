findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/adapters/src/file/memory-promotion.ts:132
    message: >-
      `supersedeRecord` rewrites a target record's `status: candidate` line to
      `superseded` but never writes `superseded_by`. A normal closeout
      supersession (a promoted record carrying `supersedes: [<id>]`) therefore
      leaves the target superseded with no replacement link, and the new
      invariant immediately fails the tree with
      `memory.schema.superseded-by-missing` and
      `memory.reference.supersede-asymmetry` (reproduced against a
      schema-valid candidate target). A supported write path now produces a red
      build on the next gate run, contradicting AC-F3-1/DoD-4 and DM-1's
      conditional `superseded_by` requirement. The pm-notes reviewer note names
      only the `authoritative`-target case; the `candidate` case is the more
      common and is also broken, and no test runs the invariant after a
      supersession promotion.
    suggestion: >-
      Pass the new record id into `supersedeRecord` and write
      `superseded_by: "<new-id>"` (or update the target's status and replacement
      link together) as an additive change, then add a behaviour test that
      promotes a supersession over an existing conformant record and asserts the
      invariant reports zero findings over the resulting tree.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-2
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/capsule-candidates.ts:236
    message: >-
      `deriveHint` returns `source.slice(0, HINT_MAX_CHARS).trimEnd()` whenever
      the applicability string or the fallback statement exceeds 120 characters.
      ADR-0011 D6 and DEC-7 bind the hint as "a read-when hint, not a truncated
      statement", and the ADR's own context rejects a writer that derives the
      hint by truncating a statement. With no `applies_when` and a statement in
      the 121-280 range, the row's second column is exactly a truncated
      statement (verified: a 300-char statement yields a 120-char statement
      prefix). The readiness residual (<120-char statement fallback) was
      disclosed, but it is a live contract violation, not a wording nuance.
    suggestion: >-
      Do not truncate the statement into the hint. Either require/derive a
      read-when phrasing (e.g. reject or advise on a promotion without
      `applies_when` when the statement exceeds the bound, or synthesise a
      "when ..." hint from structured candidate fields), or formally amend D6 to
      permit a bounded statement fallback - the spec must not claim both.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/capsule-candidates.ts:114
    message: >-
      `validateCandidate` checks `statement` is non-empty but never against
      `STATEMENT_MAX_CHARS`, so a candidate with a 300-char statement passes
      candidate-schema validation and the promotion writer renders a record the
      invariant rejects with `memory.schema.statement-too-long` (reproduced).
      This breaks AC-F3-1's zero-findings promise for a candidate that passed
      the capture bar, evidence rules, and candidate schema, and it is the same
      class of projection gap the readiness gate forced the plan to close for
      `source` (DEC-8) and `scope: fleet` (DEC-5).
    suggestion: >-
      Import `STATEMENT_MAX_CHARS` into `validateCandidate` and refuse an
      over-bound statement through the existing `closeout.capsule-invalid`
      identity (no new register id), with a behaviour test that a 281-char
      candidate is refused with zero writes and a 280-char one promotes clean.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-4
    severity: medium
    confidence: high
    category: security
    location: packages/core/src/domain/memory-lint.ts:661
    message: >-
      The memory secret scan tests suppression markers against the entire
      matched span (`lowered = matched.toLowerCase()`), while the delivered
      whole-tree guard scopes markers to the protected value via
      `suppressionValueFor` (privacy-rules.ts). A marker appearing in the key
      half therefore suppresses a real value: `fake_token: <real-secret>` yields
      no memory finding while `matchGenericRules` reports an unsuppressed
      `secret.credential-assignment` (verified). This is a false negative in the
      security area and a drift from the "same suppression behaviour, no drift"
      guarantee (F-12, GAP-9, spec section 20, DEC-4).
    suggestion: >-
      Replicate the delivered value-segment scoping for the rules that need it
      (credential-assignment, bearer, connection-string, absolute-user-path) in
      the injected vocabulary contract or in the domain matcher, and add a
      marker-in-key case that must still fire, alongside the existing
      marker-elsewhere-on-line control.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-5
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/memory-lint.ts:437
    message: >-
      Markdown links are resolved relative to the memory root and then required
      to exist under `.ai/memory/`, so a link that leaves the tree is rewritten
      under it and reported as `memory.reference.link-dangling`. A record
      linking to the repository's real `AGENTS.md` (`../../../AGENTS.md`) or to
      `/doc/spec/...` produces a false dangling finding (reproduced) even though
      the target exists, contradicting the doc claim that only an in-tree
      relative link is checked and the spec's F-8 scope. Any agent writing a
      record that cites a repo doc will trip the gate.
    suggestion: >-
      Resolve the link against the repository root (the scan already knows both
      `.ai/memory/**` and `AGENTS.md` paths) or skip links whose resolution
      escapes `MEMORY_ROOT`, and add a positive control asserting an out-of-tree
      link is silent (and an in-tree missing link still fires).
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-6
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/memory-lint.ts:534
    message: >-
      `measureLines` counts `text.split("\n").length`, which adds a phantom
      final element for a newline-terminated file. A file with exactly the
      published cap (200 index lines, 150 entry-point lines) measures cap+1 and
      errors (verified: a 200-line newline-terminated file yields
      `memory.budget.index-lines 201 ... cap 200`), contradicting AC-F10-1 and
      the doc statement that "a surface exactly at its cap produces no finding".
      The boundary fixtures use `lineFiller()` joined without a trailing newline,
      so they hide the off-by-one.
    suggestion: >-
      Count lines as `text.endsWith("\n") ? split.length - 1 : split.length`, and
      make the budget boundary fixtures newline-terminated so the at-cap case is
      exercised against a real file shape.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-7
    severity: low
    confidence: high
    category: correctness
    location: packages/core/src/domain/memory-lint.ts:349
    message: >-
      `entry-line-date` fires on any entry-point bullet whose leading token has
      a digit but is not `YYYY-MM-DD` (`^\s*-\s+(\S+)\s*:`), not only on dated
      capture lines. A legitimate bullet such as `- GH-301: delivered memory
      lint` or `- T0-T5: ...` would be reported as a dating error. The
      documented contract is that a capture line carries a YYYY-MM-DD date; no
      current entry point triggers it, so the gap is latent.
    suggestion: >-
      Restrict the heuristic to the documented capture-line shape (a date-like
      token, e.g. `\d{4}[-/]\d{1,2}[-/]\d{1,2}` or a leading capture marker) so
      an ordinary bullet with a numeric token is not a finding, and add a
      negative control for a `GH-NNN:` bullet.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-8
    severity: low
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/memory-lint.ts:264
    message: >-
      DM-1 and the human rendering state `statement` is non-empty, but the
      schema pass only inspects `statement.length` when it is a string; an empty
      string or a non-string statement yields no finding (verified). The
      contract declares a non-empty requirement the lint does not enforce.
    suggestion: >-
      Emit a schema finding (e.g. `memory.schema.value-unknown` or
      `keys-missing`, no new id) when `statement` is absent-as-empty or
      non-string, or narrow the published wording if non-emptiness is not
      intended to be enforced.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-9
    severity: low
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/memory-lint.ts:692
    message: >-
      The printed report concatenates all error lines then all advisory lines,
      so on a mixed tree the printed order is not the declared area order (a
      derivable advisory in area 7 prints after a secret error in area 8). The
      in-memory `findings` array is area-ordered and determinism is preserved,
      but DM-4's "ordering is area order, then path, then line, then rule id"
      describes the emitted lines, and the suites only assert the array and the
      per-severity counts.
    suggestion: >-
      Either emit one globally area-ordered stream (severity shown by the
      FAIL/WARN prefix) and keep the two ceilings as separate print budgets, or
      amend DM-4 to state that errors print before advisories as two ordered
      streams; add a mixed-tree ordering assertion either way.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-10
    severity: medium
    confidence: high
    category: testing
    location: doc/changes/2026-11/2026-11-15--GH-301--memory-records-layout-lint/chg-GH-301-test-plan.md:1812
