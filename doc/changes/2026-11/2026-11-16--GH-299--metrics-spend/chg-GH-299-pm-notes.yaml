decisions:
  - text: "Quota snapshots are OUT of scope for GH-299. Authority: the canonical
      backlog story row (backlog.md M2-S6 task list and the ticket body) names
      ceremony share, per-dispatch tokens/cost/restarts, cycle time, CI failure
      rate, escaped defects, and burn-rate alarms; quota snapshots appear only
      in summary rows (cli-command-registry.md line 178, M1 contracts/spend
      deferral notes), not in the canonical task list, the ticket, or the `ados
      metrics` registry row. Exclusion recorded here and to be restated as a
      scope-exclusion decision in the spec decision log."
    date: "2026-11-16"
  - text: "The operational definition of 'escaped defects' is not pinned by the
      ticket or the milestone pack (no MET- id exists for it in
      measurement-baseline.yaml). In scope per the ticket task list; the
      concrete definition must be authored by @spec-writer from committed
      evidence sources (retro findings, review verdicts, CI observations) and
      critiqued at the DoR gate. This is spec-level definition work grounded in
      the ticket's own task list, not requirement invention."
    date: "2026-11-16"
