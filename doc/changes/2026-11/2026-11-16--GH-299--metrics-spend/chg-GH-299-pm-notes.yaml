notes:
  - text: "clarify_scope cross-check complete. Ticket requirements are complete and
      consistent with the system spec; no blocking questions. Dependencies
      verified landed on main-tools: M1-S19 (GH-236 spend read side), M2-S3
      (GH-296 ceremony runner, PR #328), M2-S14 (GH-291 telemetry v2, PR #315)."
    type: info
    date: "2026-11-16"
  - text: "Planned surface per planning truth: new `ados metrics` command family
      (cli-command-registry.md row: ceremony share, cycle time, CI failure rate,
      escaped defects; coordinator/operator audiences). It consumes the
      delivered `delivery.spend.v1` fold (feature-spend.md explicitly feeds
      alarm/burn-rate M2-S6) and telemetry v2 for per-agent/per-model facts.
      Burn-rate alarms land under `metrics.data.alarms` per scenario seed
      SC-M2-S6-02 (exactly one alarm per crossing, ref + threshold echoed)."
    type: info
    date: "2026-11-16"
  - text: "Measurement-baseline interplay: the log (schema_version 2, comparisons[]
      additive) is canonical data for MET-CEREMONY-SHARE, MET-CYCLE-TIME,
      MET-CI-FAILURE-RATE, MET-FALSE-SIGNAL-INCIDENTS. Comparison protocol: same
      metric ID and definition over an equal-length window; a proxy is never
      compared to a native measurement without the caveat; sample minimum 5 for
      trend verdicts (insufficient-sample below it). The metrics layer consumes
      the log by metric ID; GH-296's committed ceremony comparison
      (insufficient-sample at n=0) must remain unchanged."
    type: info
    date: "2026-11-16"
  - text: "Doc impacts for phase 7 (@doc-syncer): new feature spec for the metrics
      surface (first-spec-only, always-resolve); additive updates to
      feature-spend.md (Feeds/consumer), feature-telemetry-v2.md (consumer),
      feature-result-contract.md (Appendix D error-table count pins for new
      metrics rows), feature-cli-entrypoint.md and
      feature-agents-and-commands.md (new prompt-required family mount, 23rd ->
      24th count move), feature-measurement-baseline.md (consumer note if
      needed), help-guide coverage, cli-command-registry.md and backlog status
      markers per ticket delivery conventions."
    type: risk
    date: "2026-11-16"
  - text: "Mounting cost precedent: steer (GH-298) moved prompt-required families 22
      -> 23 atomically; board (GH-297) widened the error-table allowlist with
      exact count-pin moves. The metrics family must follow the same one-commit
      count-move discipline; error-table two-way sync check
      (error-table-sync.ts) is a known gate."
    type: info
    date: "2026-11-16"
  - text: "Delivery conventions from ticket: full 11-phase lifecycle; plan phases
