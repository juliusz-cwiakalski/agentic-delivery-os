summary: >-
  Remediation iteration 1 is substantively delivered and independently
  re-verified. F-1 is closed: the adapter now parses the committed log's
  per-change `{ref, reason}` rows (counted per closed reason, zero counts
  filtered, legacy `{reason, count}` tolerated) and an independent probe over
  the real tree returns `state: present` with sourceCommit 75b4e760 and the
  conserved exclusions (cycle 3 × missing_metric_input, CI 19 ×
  no_ci_observation). F-2 is closed: `preferStreamBySession` is the single
  exported per-session plane selection, `selectedRecords` delegates to it,
  `measureSpend` now composes steps+records and windows after selection, and
  the mixed-plane alarm fixture proves equality with the delivered fold
  (closeout-only 600 + stream 400 = measured 1 000, against 400 pre-fix). F-3,
  F-4, F-5, F-6, F-7, F-9, and F-10 all verify in code and tests, including a
  fold-only 1k/10k latency reference that is printed and not asserted, thirteen
  mutant families with anchor-hardened replacement, and a marker that names the
  sections actually dropped. One new medium defect keeps this iteration at
  FAIL: the post-remediation current-truth spec (and the adapter's own doc
  comment) now claims the entry carries the committed log's per-reason
  exclusion totals, but the report never reads the parsed counters — on the
  real log the CI entry renders with no exclusions although the log lists 19.
  Plan compliance holds (phase 10 evidence is recorded with hash and counts;
  `plan validate` verdict=valid), with only an observational plan-scope drift.
  Remediation phase 11 (tasks 11.1-11.4) is appended to the plan. Re-run in
  this review: 200/200 metrics behaviour, 174/174 metrics structure
  (error-table, content-inventory, imports, contract, mounting), 43/43 metrics
  checks (mutants, bounds, read-cost, escaped-defects), 39/39 golden + hermetic
  + doc-conformance, 190/190 spend behaviour, 305/305 goldens, the
  sync/help/prompt/exports script checks (entries=147 documented=147), and the
  full aggregate gate `TMPDIR=$PWD/tmp/tmpdir pnpm check` at exit 0 with
  10 088 pass / 4 pre-existing skip / 0 fail across 1 262 files. The known
  `state.store.torn` teardown on this workstation is
  a pre-existing GH-291-era multi-ref reader defect, reproduced here against
  the untouched `packages/core/src/state/telemetry.ts` and equally fatal to the
  untouched `spend` command; GH-299's code is not implicated.
