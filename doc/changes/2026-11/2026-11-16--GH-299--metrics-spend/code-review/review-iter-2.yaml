    category: spec-compliance
    location: doc/spec/features/feature-metrics.md:140
    message: >-
      The current-truth spec bullet (and the matching adapter comment at
      packages/adapters/src/file/metrics-baseline.ts:44-51, "so the report
      carries the conserved totals") claims the baseline entry aggregates the
      committed log's per-change rows and conserves the log's listed
      exclusions. The delivered fold never reads `MetricsBaselineRow.excluded`:
      buildEntries surfaces only the exclusions of the fresh measurement
      (packages/core/src/domain/metrics.ts:480-582), so the parsed counters are
      consumed by tests alone. Probed in this review over the real committed
      log with an empty corpus: MET-CI-FAILURE-RATE renders with no `excluded`
      at all although the log lists 19 `no_ci_observation` rows, and
      MET-CYCLE-TIME renders 1 `missing_metric_input` against the log's 3. The
      guard test is insensitive for the same reason: the "per-change exclusions
      are counted per reason" cell (tests/behaviour/metrics-baseline.test.ts:72)
      compares entries to the fixture *inputs*, never to the parsed document,
      and passes only because the fixture rows happen to mirror what the
      measures emit. Design-wise, surfacing log-scope counts on every per-ref
      invocation mixes scopes (the log aggregates 41 changes; the entry
      evaluates one ref and window), so the sentence — not the code — is the
      defect.
    suggestion: >-
      Correct the spec sentence and the adapter comment to the delivered
      semantics: the committed listing is parsed, validated, and left
      byte-identical in the log, while the entry reports the exclusions of its
      own evaluated basis (per-ref, per-window) over the log's closed reason
      vocabulary. If the owner instead wants the log's totals rendered, wire
      them into the entry behind an explicit scope label and assert them in a
      test reading the parsed document. Split the conservation cell so one case
      asserts the parsed document's counts (as the real-tree test does) and the
      other asserts the entry's basis exclusions. Owning artifacts: the
      doc-syncer correction to doc/spec/features/feature-metrics.md, the phase
      10 task 10.1 comment, tests phase 4 exclusion cells.
