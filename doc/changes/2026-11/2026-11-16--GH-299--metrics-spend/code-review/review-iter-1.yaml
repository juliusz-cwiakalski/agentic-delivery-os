  - id: F-2
    severity: high
    confidence: high
    category: correctness
    location: packages/core/src/domain/metrics.ts:741
    message: >-
      The burn-rate `measureSpend` sums step records only when any step exists
      (falling back to closeout records only when steps are empty), while the
      delivered spend fold it must mirror (`selectedRecords`,
      packages/core/src/domain/spend.ts:240-254) unions steps and records and
      applies per-session plane preference ("one session, one plane's
      figures"). On a store with a closeout-only session alongside any stream
      step (the delivered "combined" reading basis), the closeout session is
      dropped from `measured`, undercounting spend and potentially suppressing
      a crossing alarm. Spec F-6 requires the evaluation to read "the same
      telemetry records the spend fold reads — applying the delivered ingest
      rules unchanged"; no alarm fixture seeds a mixed-plane store.
    suggestion: >-
      Compose the alarm measurement over the same per-session plane-preference
      selection the delivered fold uses (reuse `selectedRecords` semantics
      over the union of steps and records, windowed by capturedAt), or reuse
      the fold's figures windowed after selection. Add a mixed-plane alarm
      fixture asserting measured equals the fold's total for the same window.
      Owning plan phase: 5.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
