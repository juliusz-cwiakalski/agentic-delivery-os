    message: >-
      `isCommittedRelative` blocks absolute paths and leading `../`, but
      accepts interior traversal (`doc/../../etc/passwd` passes the prefix
      checks), so a committed corpus/evidence row can probe readable files
      outside the project root for anchor inclusion. Impact is bounded —
      read-only, output emits only paths and anchors already committed in the
      same repo, no file content is disclosed — but the committed-path rule
      the spec states ("no tmp/**, .ai/local/**, uncommitted, or external
      source") is not enforced against traversal.
    suggestion: >-
      Reject path segments equal to `..` (split on "/" and check) in both
      copies of the predicate (metrics-corpus.ts and domain/metrics.ts:324).
      Owning plan phase: 3.
