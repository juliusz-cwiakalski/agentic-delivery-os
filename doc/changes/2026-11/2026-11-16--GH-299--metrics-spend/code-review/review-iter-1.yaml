summary: >-
  The change is structurally excellent — clean layering (contracts/pure
  domain/state/adapters/command), exact error-table registration with verified
  four-way agreement (147/146/63/+113), complete 24th-family mounting, solid
  absence-honesty and bounds/truncation discipline, and 380+ metrics tests
  re-run green in this review. However, the delivered baseline-log adapter
  rejects the repository's own committed measurement-baseline.yaml (its
  `metric_excluded_changes` entries are `{ref, reason}`, the validator demands
  `{reason, count}` — empirically confirmed: state `invalid`, so every
  `metrics` invocation on this tree refuses `metrics.baseline-unreadable` at
  exit 2 and renders nothing), and the burn-rate measurement reimplements the
  spend ingest with a global plane preference that drops closeout-only
  sessions whenever any stream step exists, undercounting measured spend
  against the delivered fold. Both defects are invisible to the suite because
  every fixture synthesizes its own world (the GH-170 lesson). Corpus metrics
  (CI proxy, escaped defects) additionally read a new opt-in `metrics_corpus`
  block that no committed document authors, so those entries are honestly
  UNAVAILABLE on the real tree.
