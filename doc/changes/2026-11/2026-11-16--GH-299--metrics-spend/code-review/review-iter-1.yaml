    location: packages/adapters/src/file/metrics-baseline.ts:44
    message: >-
      The baseline-log validator rejects the repository's own committed
      measurement-baseline.yaml. `exclusionsOf` requires every
      `metric_excluded_changes` entry to carry `{reason, count}`, but the real
      log's entries are per-change `{ref, reason}` rows
      (doc/planning/oss-tooling/measurement-baseline.yaml:752-798). Verified
      empirically in this review: `readMetricsBaselineLog` over the real
      project root returns `{ok: false, state: "invalid", detail:
      "document.metric-row"}`, so every `metrics` invocation on this checkout
      is refused `metrics.baseline-unreadable` at exit 2 with no report. The
      fixture (tests/fixtures/metrics/baseline.ts:58-64) generates the
      `{reason, count}` shape, so all 58 TCs stay green while production is
      dead — AC-F2-1/AC-F1-1 and the ticket AC ("exit criteria measurable
      with committed numbers") do not hold on the delivering repository.
    suggestion: >-
      Parse the real entry shape (`{ref, reason}`) — count entries per reason
      into the closed exclusion counters — and keep the `{reason, count}`
      shape tolerated or reject it deliberately. Pin a fixture (or golden)
      copied from the real document, and add a real-tree smoke case that
      reads doc/planning/oss-tooling/measurement-baseline.yaml and asserts
      `state: "present"`. Owning plan phase: 3 (adapter) with the behaviour
      cells of phase 4.
    suppressed: false
