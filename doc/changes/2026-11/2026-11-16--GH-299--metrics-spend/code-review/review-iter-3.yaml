    category: correctness
    location: packages/core/src/domain/metrics.ts:909
    message: >-
      The 65 536-byte machine `data` cap is not enforced when the never-droppable
      content alone exceeds it. `boundMetricsReport` drops `comparisons[]`, then
      incident rows, then `perAgent[]`, and breaks when nothing droppable
      remains, so an over-long log-derived string on a metric entry returns an
      over-cap payload. Probed in this review with a conforming in-memory log row
      whose `limitation` is 80 000 characters: `metrics --json` exits 0 with
      `data` at 83 613 UTF-8 bytes (cap 65 536 bytes) while reporting
      `truncated: true, omitted: 6`. The committed log's limitations are short, so
      the delivered tree is well inside the cap and the bounds suite passes; the
      gap only appears on pathological but contract-conforming committed data.
    suggestion: >-
      Either bound the row string fields at the adapter (a declared maximum
      length per `limitation`/`unit`/`direction`, with an over-length row
      classified damage like every other contract violation) or declare the
      last-resort posture in the spec (a refusal identity, or an explicit
      statement that never-dropped content may exceed the cap) and pin it with a
      cell feeding an over-long limitation. Owning artifacts: the adapter row
      validation, `boundMetricsReport`, and the spec's output-contract bounds
      paragraph. Non-blocking.
    suppressed: false
    published_url: null
    published_at: null
