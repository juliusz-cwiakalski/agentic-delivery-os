# GH-299 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly. Extra phase data (goal, obligations/tasks, AC/TC acceptance, gate
# commands) rides in YAML comments so the parsed document stays schema-strict;
# the plan declares phases and scope only — no `tasks` key, no progress log
# (progress is a pm-notes `notes:` entry naming the phase id, commit hash, and
# test result).
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:     ./chg-GH-299-spec.md (v1.1, 22 ACs — AC-F1-1, AC-F2-1..2,
#               AC-F3-1..4, AC-F4-1, AC-F5-1, AC-F6-1..5, AC-F7-1..2, AC-F8-1,
#               AC-F9-1, AC-F10-1, AC-F11-1..2, AC-NFR9-1; F-1..F-11;
#               DM-1..DM-8; NFR-1..NFR-10; NG-1..NG-9; DEC-1..DEC-14;
#               RSK-1..RSK-9; §6 flows 1–7; §8.3 grammar / contract shape /
#               ordering invariants / exit projection; §16.1 doc impact;
#               §17.1 DoD-1..DoD-17; Appendix B ticket-AC decomposition;
#               Appendix C seed mapping (SC-M2-S6-01/02); Appendix D — the
#               binding locator list D-1..D-13 with same-commit movement, the
#               no-leftover scan for 146/145/62/+112, and four-way agreement).
#               Key adjudications consumed as pinned: DEC-2 escaped-defects as
#               the non-MET curated floor; DEC-3 read-only over the log and
#               the live comparison view; DEC-4 the metrics.burn-rate node;
#               DEC-5 alarm derivation with crossedAt = read instant = window
#               end; DEC-6 one identity delivery.metrics.v1 with closed
#               vocabularies as contract data; DEC-7 pinned measurement kinds
#               with the cross-kind caveat; DEC-8 the one metrics row with
#               62 -> 63 / 146 -> 147 / 145 -> 146 / 146 -> 147 / +112 -> +113;
#               DEC-9 the 24th prompt-required family; DEC-10 bounds and the
#               tail-ordered truncation; DEC-11 classified absence posture;
#               DEC-12 no subcommands; DEC-13 basis-scoped values; DEC-14
#               attributable-scoped perAgent equality.
#   - Tests:    ./chg-GH-299-test-plan.md (v1.1, 58 TCs TC-METRICS-001..112;
#               22/22 AC coverage; §1.1 scope; §3 coverage overview; §4 layer
#               table + §4.1 fixture contract + §4.2 non-vacuity contract +
#               §4.3 oracles + §4.4 delivered-suite drift register DR-1..DR-12;
#               §5 scenarios; §6 fixtures/goldens + runner command list; §7
#               automation map — 28 new suite files + 20 updated; §8.3 all
#               OQ-TP entries resolved). AMB-TP-1 (seam shapes delivery-bound;
#               an unresolvable seam fails naming the missing contract) and
#               AMB-TP-2..5 bind delivery throughout.
#   - PM record: ./chg-GH-299-pm-notes.yaml (clarify_scope decisions — quota
#               exclusion DEC-1, escaped-defects definition DEC-2; reopen
#               iteration folding DEC-13/DEC-14; delivery conventions — gate
#               command, PR target main-tools, conventional subjects, body and
#               footer lines <= 100 chars, merge authority stays with the
#               owner/CEO).
#   - Schema:   doc/spec/features/feature-plan-schema.md (scope keys
#               files/folders/packages, per-phase one-line summary, done
#               artifacts, leases, weightClass, interactions, tier; no tasks
#               key, no progress log).
#   - Precedent: ./2026-11-16--GH-298--steer/chg-GH-298-plan.yaml (phase
#               ceremony, early error-table registration with the one-commit
#               count move, split-suite ownership notes, honesty battery,
#               release pattern) and ./2026-11-16--GH-287--retro-action-
#               registry/chg-GH-287-plan.yaml (comment-carried phase data).
#   - Repo truth verified at plan time: ERROR_TABLE pins at 146 entries (7
#               sites in tests/structure/error-table.test.ts), 145 delivered
#               rows, RESERVED_TWO_SEGMENT_CODES at 62 members in both
#               scripts/checks/error-table-sync.ts and the structural mirror,
