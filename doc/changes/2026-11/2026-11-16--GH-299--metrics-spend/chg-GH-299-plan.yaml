  # Phase 8 — The cross-cutting honesty battery (F-11; NFR-2..NFR-7;
  # AC-F11-1, AC-F11-2; DoD-14; TC-METRICS-112 mutants; TC-METRICS-111
  # hermeticity).
  #
  # Goal: pin the rules that span paths and modules, by bytes and
  # counters. Determinism: byte-identical repeats over the six declared
  # forms (bare, explicit window, crossing alarm, undeclared threshold,
  # telemetry-absent, insufficient-sample) with the committed goldens and
  # their regenerate.ts (created in this change; regeneration diff shows
  # only the declared delta); permutation independence over four source
  # orders; every array in its declared order (TC-METRICS-101). Bounds:
  # the 65 536-byte data cap and the 200-line/16 384-byte human cap
  # measured at/under/over fixtures; the row caps (incidents 8, perAgent
  # 20, comparisons 20) counted without double counting; the tail-ordered
  # drop sequence comparisons[] -> incidents[] -> perAgent[] with the
  # never-dropped set proven intact under a binding cap beside an alarm
  # (TC-METRICS-102, 103, 104). Purity: no LLM/network/tracker/provider/
  # credential/timer/socket/session anywhere, the brand seam as the only
  # binary-name source, zero writes on every invocation form (TC-METRICS-
  # 100). Clock: window, censoring anchor, and crossedAt as pure functions
  # of the injected clock with the crossedAt = read instant = window.end
  # equality (TC-METRICS-105). Read cost: the counted read budget with the
  # latency reference printed, never asserted (TC-METRICS-106). Mutants:
  # the twelve mutant families — baseline restatement, caveat dropped/
  # over-applied, trend below minimum, duplicate alarm, invented
  # threshold, unobserved-green, zero-fill x3, uncited incident,
  # truncation order/alarm drop, registration pins, mounting — each
  # failing its case on temp-tree copies with an unmutated control
  # (TC-METRICS-112). Hermeticity: no skip, no live probe, temp-root
  # discipline, no moving-base reads, planted violations detected
  # (TC-METRICS-111). This phase adds tests and fixtures only.
