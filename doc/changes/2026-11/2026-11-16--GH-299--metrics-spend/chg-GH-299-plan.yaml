#
# PLAN-LEVEL REFINEMENTS (owner @plan-writer — recorded here as this plan's
# design decisions; the spec pins the contracts, the test plan pins the
# behaviours, and none of the below reshapes a TC's oracle, identity, exit,
# bound, or AC/NFR mapping; no TC id changes):
#   1. MODULE HOMES (AMB-TP-1 makes seam shapes delivery-bound; the homes
#      below follow the delivered spend/steer layering): contracts in
#      packages/core/src/contracts/metrics.ts (identity, vocabularies, the
#      delivery.metrics.burn-rate.v1 node schema constants, bounds, the ten
#      data key names, ordering data); the pure report fold and the bounded
#      human renderer in packages/core/src/domain/metrics.ts and
#      metrics-text.ts; the verified read composition in packages/core/src/
#      state/metrics-reads.ts; the committed baseline-log document read in
#      the packages/adapters/src/file/ tier (the ceremony-declarations
#      precedent); the command grammar-only module packages/cli/src/commands/
#      metrics.ts with the edge composing the runtime.
#   2. ENTRY SKELETON VERSUS CURATION: metrics[] is vocabulary-driven from
#      the first report render — all four ids always present with per-entry
#      classified absence (row-absent / UNAVAILABLE) — while the
#      escaped-defects curation capability lands with phase 6. No fixture
#      asserted by an earlier phase seeds counted escaped-defect evidence,
#      so no earlier TC observes a misclassified entry; the curation cells
#      are TC-METRICS-060..063, owned by phase 6.
#   3. TC-013 OWNERSHIP SPLIT: TC-METRICS-013's step 3 asserts that
#      escaped-defects, dispatch, and alarmEvaluation are unaffected by a
#      missing log, so its verdict completes only once those sections
#      render; tests/behaviour/metrics-baseline-damage.test.ts therefore
#      starts in phase 4 with the damage cells (TC-METRICS-014) and gains
#      the row-absent cells in phase 6 (TC-METRICS-013).
#   4. GOLDEN LANDING: the golden fixtures pinned by their owning TCs land
#      with those phases (bare / crossing / telemetry-absent /
#      below-threshold with phase 5; the insufficient-sample and
#      explicit-window forms with phase 8); tests/golden/metrics.test.ts,
#      the remaining forms, and regenerate.ts land in phase 8, which owns
#      TC-METRICS-101. No delivered golden regenerates (DR-12).
#   5. PRODUCTION COMPOSITION BEFORE THE MOUNT: the unconditional
#      production composition lands with phase 4 (the GH-298 precedent);
#      until phase 7 mounts the prompt-set entry, the entrypoint drops the
#      un-advertised family exactly as it drops every non-prompt command,
#      so root help and every other surface stay byte-identical.
#   6. perAgent MEMBER NAMING (OQ-TP-5): the spec's DM-3 names the roll-up
#      `perAgent` with role/model members while the delivered fold's member
#      spelling stays delivery-bound; parity is asserted by value equality
#      against `spend --ref` for the same selection, never by key spelling.
#
# PHASE ORDER AND TESTABILITY (spec §18 ordering, made concrete):
#   Each phase is ONE commit on feat/GH-299/metrics-spend whose declared
#   narrow gate is green at the boundary and whose cases are authored
#   failing-first inside the phase (red missing module, missing data key, or
#   declared count mismatch before the implementation that makes it green).
#   Phase 1 lands the contract home every later phase asserts through, plus
#   the one error row with EVERY Appendix D count pin and the in-boundary
#   carrier moving in ONE commit (the GH-291/GH-298 early-doc-edit
#   discipline — the sync gate is red otherwise); registering before the
#   first refusing path exists is green and keeps the count move atomic, and
#   the first path that emits metrics.baseline-unreadable arrives with the
#   report command inside the same change boundary (spec §18). Phase 2 lands
#   the pure fold skeleton over injected inputs (entries, kinds,
#   comparisons, absence classification, truncation, renderer) with no I/O.
#   Phase 3 lands the verified read composition and the burn-rate
#   declaration node with its pre-read validation (GH-300 precedent).
#   Phase 4 mounts the command runtime and lands the content blocks that
#   need only entries and comparisons (surface grammar, envelope, baseline,
#   kinds, caveat, comparisons, write discipline). Phase 5 lands the
#   dispatch composition and the alarm evaluation with their suites and the
#   full-report capstone cells (the bare report needs dispatch, alarms, and
#   the entry skeleton together). Phase 6 lands escaped-defects curation and
#   the cross-section absence/damage matrix (which asserts dispatch,
#   alarms, and escaped-defects side by side). Phase 7 mounts the 24th
#   prompt-required family with the atomic 23 -> 24 count move — mounting
#   completes before the gates phase so the coverage check gates the final
#   state (spec §18). Phase 8 is the cross-cutting honesty battery
#   (determinism, bounds, purity, read cost, goldens, mutants, hermeticity)
#   which needs every production module and render path to exist. Phase 9
#   reconciles the planning corpus, stages the changeset and the lifecycle-
#   phase-7 spec, declares the release obligations, and runs the aggregate
#   gate battery and `plan validate` at the delivered HEAD.
#
# TC -> PHASE MAP (58 ids = TC-METRICS-001..112; every id owned by exactly
#   one phase — the phase whose commit lands the case together with the
#   capability that makes it green; suite halves proven earlier or echoing
#   later are named in split-suite notes without a second owner row):
#   Phase 1 contracts/error registration (3): TC-METRICS-090, 091, 092
#   Phase 2 pure domain (0): none (static halves of TC-METRICS-100/105 land
#            red-first here; no TC completes before the runtime exists)
#   Phase 3 reads/config node (0): none (the structure node-row half of
#            TC-METRICS-054 lands here; the behaviour half is phase 5)
#   Phase 4 runtime/entries/comparisons (20): TC-METRICS-003, 004, 005,
#            010, 011, 012, 014, 015, 016, 020, 021, 022, 023, 024, 025,
#            026, 030, 031, 032, 033
#   Phase 5 dispatch/alarms/capstone (13): TC-METRICS-001, 002, 006, 040,
#            041, 042, 050, 051, 052, 053, 054, 055, 056
#   Phase 6 escaped defects/absence/damage (8): TC-METRICS-013, 060, 061,
#            062, 063, 070, 071, 072
#   Phase 7 mounting (4): TC-METRICS-080, 081, 082, 083
#   Phase 8 honesty battery (9): TC-METRICS-100, 101, 102, 103, 104, 105,
#            106, 111, 112
#   Phase 9 gate/release (1): TC-METRICS-110 (execution record)
#   Count: 3 + 0 + 0 + 20 + 13 + 8 + 4 + 9 + 1 = 58.
#   SPLIT-SUITE NOTES (a suite extended by two phases stays green at both
#   boundaries; ownership follows the phase that completes the case):
#   tests/structure/metrics-contract.test.ts starts phase 1 (constants,
#   vocabularies, identity) and gains the key-set/grammar-predicate halves in
#   phase 4 and the bounds-constant half in phase 8; tests/structure/
#   metrics-imports.test.ts starts phase 2 and gains the ambient-clock and
#   import-set arms in phase 8; tests/behaviour/metrics-baseline-damage.
#   test.ts starts phase 4 (TC-METRICS-014) and gains the row-absent cells in
#   phase 6 (TC-METRICS-013); tests/behaviour/metrics-write-discipline.
#   test.ts starts phase 4 (TC-METRICS-012) and gains the alarm-derivation
#   cells in phase 5 (TC-METRICS-056); tests/behaviour/metrics-bounds.test.ts
#   starts phase 6 (the incidents display-cap cells of TC-METRICS-063) and
#   gains the byte/row-cap and truncation-order cells in phase 8
#   (TC-METRICS-102/103/104); packages/core/src/domain/metrics.ts and
#   metrics-text.ts start phase 2 and are extended in phases 4, 5, and 6;
#   packages/cli/src/commands/metrics.ts and edge.ts start phase 4 and are
#   extended in phases 5 and 6.
#
# AC OWNERSHIP (22/22; exactly one owning phase each; an earlier phase may
#   produce a partial verdict, which is additive and never transfers
#   ownership):
#   phase 1  AC-F10-1
#   phase 4  AC-F2-1, AC-F2-2, AC-F3-1, AC-F3-2, AC-F3-3, AC-F3-4, AC-F4-1
#   phase 5  AC-F1-1, AC-F5-1, AC-F6-1, AC-F6-2, AC-F6-3, AC-F6-4, AC-F6-5
#   phase 6  AC-F7-1, AC-F7-2, AC-F8-1
#   phase 7  AC-F9-1
#   phase 8  AC-F11-1, AC-F11-2
#   phase 9  AC-NFR9-1
#   Count: 1 + 7 + 7 + 3 + 1 + 2 + 1 = 22.
#   PARTIAL-VERDICT NOTES: phase 1 declares every vocabulary and bound the
#   later ACs assert through; phase 4 produces the grammar/window/envelope
#   refusal halves of AC-F1-1 (TC-METRICS-003/004/005) which phase 5
#   completes with the bare-report cell once dispatch and alarms render;
