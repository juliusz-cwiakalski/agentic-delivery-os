#   power in phase 8 without re-owning any AC.
#
# DoD MAPPING (spec §17.1 "Proven in plan" -> this plan's phases):
#   DoD-1 -> 5 (refusal halves in 4); DoD-2 -> 4 (declaration in 1);
#   DoD-3 -> 4 (TC-METRICS-013 completes in 6); DoD-4 -> 4; DoD-5 -> 4;
#   DoD-6 -> 4; DoD-7 -> 5; DoD-8 -> 5; DoD-9 -> 5; DoD-10 -> 6;
#   DoD-11 -> 6 (every phase's gate); DoD-12 -> 7; DoD-13 -> 1;
#   DoD-14 -> 8 (every phase's gate); DoD-15 -> every phase, roll-up in 9;
#   DoD-16 -> 9; DoD-17 -> lifecycle phase 11 (pr_creation), not a plan
#   phase.
#
# DEFINITION OF DONE (change-level, binding): every §17 AC met with passing
#   evidence per the ownership map above (22/22); every declared plan phase
#   complete with per-phase pm-notes `notes:` evidence (commit hash + gate
#   result); TMPDIR=$PWD/tmp/tmpdir pnpm check green at the delivered HEAD;
#   the error row and EVERY Appendix D count pin moved in the same commit
#   (phase 1) with the no-leftover scan clean and four-way agreement; the
#   family-count pins moved in one commit with the mount (phase 7); scenario
#   seeds SC-M2-S6-01/02 green (TC-METRICS-040/042 and TC-METRICS-050/055);
#   the byte-identical-store proof green (TC-METRICS-012/100); a PR against
#   main-tools left open for human review (lifecycle phase 11).
#
# COMMIT CONVENTION (one commit per plan phase through the commit primitive;
# subjects declared here so the commit path and review agree; conventional
# subjects <= 72 chars, every body/footer line <= 100 chars):
#   phase 1  feat(GH-299): metrics contracts and the baseline-unreadable error row
#   phase 2  feat(GH-299): pure metrics report domain with bounds and renderers
#   phase 3  feat(GH-299): verified metrics reads and the burn-rate config node
#   phase 4  feat(GH-299): metrics report command with baseline entries and kinds
#   phase 5  feat(GH-299): dispatch parity, burn-rate alarms and the full report
#   phase 6  feat(GH-299): escaped-defects curation and the absence damage matrix
#   phase 7  feat(GH-299): mount metrics as the 24th prompt-required family
#   phase 8  test(GH-299): honesty battery, goldens, mutants and hermeticity
#   phase 9  docs(GH-299): reconcile planning corpus and declare the release
#
# CONSTRAINTS BINDING ON EVERY PHASE (spec §5, §8, §9; do not reshape at
#   delivery):
#   - Envelope continuity (NFR-1): every new key lives under `data`; the
#     five-field delivery.result.v1 envelope is untouched; zero
#     `ok`/`command` fields; one payload identity delivery.metrics.v1 as a
#     declared contract constant, never a data key (DEC-6).
#   - Read-only discipline (NFR-3, DEC-3, G-5): zero writes, zero fences,
#     zero log edits on every invocation path — the committed baseline log,
#     the config document, ceremony records, evidence artifacts, and every
#     state scope stay byte-identical (byte-snapshot proof, TC-METRICS-012/
#     100); the comparison view never writes and never restates a committed
#     comparisons[] record as its own output; no baseline authoring (NG-1).
#   - Purity and brand neutrality (NFR-5, AC-F11-1, NG-4): no LLM, network,
#     tracker/provider, credential, timer, daemon, listener, control
#     socket, or session operation anywhere; the binary name comes from the
#     brand seam only (zero product/binary literals); tests never open live
#     stores (per-test mkdtemp roots through tests/fixtures/state/harness.ts).
#   - Clock discipline (NFR-6): window bounds, the trailing-window read
#     instant, censoring anchors, and crossedAt are pure functions of the
#     injected clock; crossedAt = read instant = the trailing window's end
#     (DM-4, DEC-5, AMB-TP-3); zero ambient wall-clock reads in the pure
#     domain (ambient-globals guard).
#   - Layering (ADR-0003, .ai/rules/typescript.md): contracts and pure
#     domain in packages/core with no I/O; verified reads in the state tier
#     composing the delivered read seams; document reads in the adapters
#     file tier; command grammar in packages/cli with the edge composing the
#     runtime from injected seams; strict TypeScript throughout.
#   - No delivered-surface change (NG-7, §8.5): no spend, telemetry,
#     ceremony, board, or status payload key changes; the ceremony
#     comparison builder is consumed as data and never imported by the
#     metrics domain to author (TC-METRICS-033 structural assertion); no
#     MET- allocation, no MET-FALSE-SIGNAL-INCIDENTS surfacing, no quota
#     field, no subcommands, no dashboards (NG-2, NG-5, NG-6, NG-9, DEC-12).
#   - Absence honesty (DEC-11): no zero for absent evidence on any section;
#     damage keeps the delivered state.* identities and is never
#     re-projected as absence; the all-absent report still exits 0.
#   - Current-truth boundary (NG-8): doc/spec/** flips only in lifecycle
#     phase 7 (@doc-syncer); the ONE same-commit exception is the
#     error-table carrier doc/spec/features/feature-result-contract.md in
#     phase 1 (F-10, D-13).
#
# GATE ENVIRONMENT (binding on every phase boundary and the final battery):
#   - Per-phase minimum gates: (a) workspace typecheck (`pnpm check` runs
#     it; while iterating use the solution typecheck), (b) the phase's
#     targeted `bun test` suites as listed in the phase block, (c) the
#     sync/coverage suites the phase touches, (d) `git diff --check` before
#     the phase commit.
#   - Aggregate gate at EVERY phase boundary: TMPDIR=$PWD/tmp/tmpdir pnpm
#     check (tmp/tmpdir present, git-ignored, repo-local — never /tmp or
#     $HOME as a fixture base). A phase is not complete until the aggregate
#     is green at its commit.
#   - Lifecycle commands (phase complete, commit) run with
#     PATH="$PWD/node_modules/.bin:$PATH" so the commitlint probe resolves.
#     The phase-9 range gate ./scripts/lint-commit-range.sh --base main-tools
#     is run by @pm and recorded in pm-notes; it is not re-implemented here.
#   - Narrow iteration: bun test tests/structure/metrics-*.test.ts
#     tests/behaviour/metrics-*.test.ts tests/checks/metrics-*.test.ts
#     tests/golden/metrics.test.ts.
#
# DECLARED CONTROLS, NOT EDITS: the delivered regression suites re-run in
#   phase gates as controls and are NOT edited unless a §4.4 DR-row names
#   them, so none is declared in a phase scope outside its DR rows:
#   tests/behaviour/spend-* suites (dispatch-parity anchors),
#   tests/structure/cli-edge-seam.test.ts (DR-10, file-set driven),
#   tests/checks/{exports-parity,prompt-conformance}.test.ts (DR-11,
#   additive coverage without a pin change), tests/golden/** delivered
#   goldens (DR-12, no regeneration), and tests/checks/fixture-privacy.test.
#   ts over every new fixture. An untouched declared file is only a
#   `plan diff` observation, never a gate failure (GH-291 scope convention).
#
# LIFECYCLE PHASE 7 HANDOFF OBLIGATIONS (system_spec_update, @doc-syncer;
#   declared here so nothing is dropped after DoD — NOT plan scope beyond
#   staging, and no delivery phase edits doc/spec/** beyond the phase-1
#   carrier): the new current-truth feature spec (feature-metrics.md —
#   payload identity, vocabularies, entries and disclosure, dispatch parity,
#   alarm evaluation and declaration node, comparison view, bounds, exit
#   projection, read-only posture); feature-result-contract.md surrounding
#   prose verified against the phase-1 numbers; additive consumer notes in
#   feature-spend.md (Feeds row resolves), feature-telemetry-v2.md,
#   feature-measurement-baseline.md (first command-surface consumer; the
#   immutability rule unchanged), feature-ceremony-runner.md (no-recompute
#   rule unchanged); feature-config-layer.md node table gains the
#   metrics.burn-rate row; feature-cli-entrypoint.md and
#   feature-agents-and-commands.md register the 24th family. The new spec
#   page is listed in phase 9 scope ONLY so the commit primitive can stage
#   it (an untracked file outside every declared scope is a stray and is
#   never staged).
#
# INCONSISTENCIES: none blocking between spec v1.1 and test plan v1.1 — the
#   test plan's v1.1 revision reconciled to the spec's DEC-13/DEC-14
#   amendments, the crossedAt pin, the comparison window posture, and the
#   22-AC count, and the Appendix D pre-change values (146/145/62/+112)
#   match the delivered tree as verified at plan time. The plan-level
#   adjudications above (entry skeleton vs curation, TC-013 split, golden
#   landing, production composition before mount) are recorded as PLAN-LEVEL
#   REFINEMENTS, not artifact inconsistencies.

schemaVersion: delivery.plan.v1
workItemRef: GH-299
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  escalationTriggers:
    - "A second `metrics.*` error identity, a family/pattern widening, or a new domain kind would be required (DEC-8, DM-7)"
    - "An Appendix D count pin is left stale, the no-leftover scan finds a leftover, or four-way classifier/sync/mirror/carrier agreement breaks (AC-F10-1, RSK-4)"
    - "Any write to measurement-baseline.yaml, the config document, ceremony records, evidence artifacts, or any state scope on any invocation path (NFR-3, DEC-3, NG-1)"
    - "An alarm would be persisted as state, a second alarm per crossing would be possible, or a default threshold would be invented when the node is absent (DEC-4, DEC-5, RSK-5, RSK-8)"
    - "A baseline entry would restate the log's committed value as a fresh measurement or present a native figure as the committed definition's value (DEC-13, AC-F2-1)"
    - "perAgent sum equality would be asserted beyond the DEC-14 attributable-selection scope or a row would be invented to force equality (DEC-14)"
    - "The family count would move in only some pinning suites, the prompt-set entry would land before the command answers, or a partial mount would be tolerated (DEC-9, RSK-7)"
    - "A delivered spend, telemetry, ceremony, board, or status payload key would change, or the ceremony comparison builder would be invoked to author (NG-7, DEC-3)"
    - "A new top-level envelope key, an ok/command field, or a second payload identity would appear (NFR-1, DEC-6)"
    - "An LLM call, network request, tracker/provider read or write, timer, daemon, control socket, session operation, or hardcoded product/binary name would enter the family (NFR-5, AC-F11-1)"
    - "A zero would be rendered for absent evidence, or store damage would be re-projected as absence (DEC-11, AC-F8-1)"
    - "Current-truth docs would be edited beyond the phase-1 error-table carrier inside a delivery phase (NG-8, F-10)"
    - "A delivered suite would need a semantic assertion change outside the §4.4 DR-rows this plan declares, or a delivered golden would need regeneration (DR-12)"
    - "pnpm check would not be green at a phase boundary (NFR-9)"
