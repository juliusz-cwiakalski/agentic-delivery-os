#       schema-identity assertion, consumer-tolerance proof, and consolidated
#       twelve-step golden complete in P10. This is the sequencing that makes
#       TC-CAP-052 a golden-delta staging note (human-thread delta P5, final
#       twelve-step delta P10), not a behaviour change.
#   D-11 Cross-check source. The capsule-event cross-check reads the delivered
#       `phase.transition`, `commit.telemetry`, and `merge.gate-verification`
#       state records through their existing verified read helpers; it adds no
#       state record kind, no schema-version bump, and no migration.
#   D-12 Release. One lockstep minor changeset
