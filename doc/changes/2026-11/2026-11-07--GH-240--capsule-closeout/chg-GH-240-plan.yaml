#   D-10 Step wiring and golden staging. New step ids are added to
#       `CLOSEOUT_STEP_IDS`/`closeoutStepDefinitions` in the phase that wires the
#       step into `buildCloseoutPlan`; the affected closeout envelope/human
#       goldens are updated in that same phase so every commit is green. The
#       explicit reviewed golden writer is
#       `tests/fixtures/closeout/golden/regenerate.ts` (the closeout goldens live
#       under `tests/fixtures/closeout/golden`, not the test plan §4.1 illustrative
