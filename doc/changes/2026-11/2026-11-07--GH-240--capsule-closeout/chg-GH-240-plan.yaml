#       is required (`./file`, `./git`, and `./harness` are already the declared
#       runtime-API edges). The secret-read allowlist gains NO entry.
#   D-2 Caps. Exact contract-data values from spec §9/NFRs: 2,000 events; 2 MiB
#       per capsule; 4 KiB per event payload; 100 candidates at 8 KiB each; 200
#       memory-index lines; 1 MiB diff text; 500 changed files; 200 diff hits;
#       50 residue items; 100 unresolved threads per merged request; 65,536
#       machine bytes; 16,384 human bytes / 200 human lines; 64 sessions per
#       capture/attribution read. Values live once in contract data; tests read
#       them, never hardcode a second copy.
#   D-3 Candidate/index/digest spellings. Candidate file `<id>.yaml` with
#       id `^[a-z0-9][a-z0-9-]{2,63}$` (no separators or `..`); required keys
#       include status from `{candidate, authoritative, superseded}`, evidence
#       exactly one of five shapes (`review-verdict:<ref>`, `ci-verdict:<ref>`,
#       `human-correction:<ref>`, `merged-pr:<ref>`, `test:<ref>`), and optional
#       `contradicts`; missing/empty basis is `capture-bar-unmet`, missing/empty
#       evidence is `evidence-missing`, structural violations are
#       `closeout.capsule-invalid`. Home records follow the declared
#       `lesson-YYYY-NNN-<slug>.md`/`tacit-YYYY-NNN-<slug>.md` naming with
#       monotonic cross-family id allocation (unique across lessons/tacit, never
#       reused), plus one bounded Markdown index row keyed by record id. A
#       pre-existing target resolves only as byte-identical `satisfied` no-op,
#       same-identity `duplicate:<existing-id>`, or declared-contradiction
#       `contradiction-requires-supersession`; never an overwrite. Capsule digest
#       is lowercase SHA-256 hex over the canonical JSON of the pre-close event
#       payloads (bounded to 64 hex chars). Test-plan §4.4/§4.9 assert
#       semantics, not a frozen digest spelling.
#   D-4 Marker data. `CLOSEOUT_DIFF_MARKERS` is declared contract data with the
#       four pinned kinds (`todo-marker`, `when-merges-note`, `feature-flag`,
#       `class-string`), the four pinned action tokens (`remove-guard`,
#       `retire-flag`, `rename-class`, `close-todo`), the fixed kind→action
#       mapping (`todo-marker`→`close-todo`, `when-merges-note`→`remove-guard`,
#       `feature-flag`→`retire-flag`, `class-string`→`rename-class`), the
#       attribution rule, and delivery-bound patterns. A hit resolves only when
#       it names this work item and its declared action matches its kind's
#       mapping; an out-of-vocabulary or kind-mismatched action is
#       `ambiguous-flip-hit`. Patterns are reviewed data (TC-CAP-028), never a
#       test-only widening; adding/changing one is a contract-data change.
#   D-5 Error identities. Exact spellings: `closeout.capsule-invalid` (user,
#       non-retryable, not_landed, user-validation/exit 1) and the family row
#       `closeout.step.<id>.failed` (user, non-retryable, not_landed,
#       user-validation/exit 1) whose slot is validated against
#       `CLOSEOUT_STEP_IDS`. Lock contention reuses the delivered
#       `state.lock.busy` row (transient, retryable, platform-provider/exit 2)
#       and is never `closeout.capsule-invalid`. Promotion path confinement adds
#       NO new error row: id/record-name outside the slug shape is
#       `closeout.capsule-invalid` before any write; a resolved home outside the
#       injected memory root after realpath is `closeout.step.capsule.failed`
#       with zero writes and plan-mode `would-refuse`. The family recognizer is
#       added to scripts/checks/error-table-sync.ts and its mutation suite; no
#       generic `closeout.*` widening. Staging: `closeout.capsule-invalid` lands
#       in P3 with the behavior that emits it; P4 declares the
#       `closeout.step.<id>.failed` family row (so TC-CAP-021's path escape can
#       classify `closeout.step.capsule.failed` at P4) and adds no path-specific
#       row; P10 completes the twelve-slot validation/family-row proof and the
#       consolidated error-table/documentation/golden proof.
#   D-6 Session-compaction outcome. When sessions exist and the checkpoint is
#       written, the step outcome is `skipped-gap` with
#       `harness-compaction-unavailable` evidence: the checkpoint half landed,
#       the harness invocation half is a declared capability gap (test-plan
#       OQ-T4 allows `skipped-gap` or `satisfied`; this plan chooses the honest
#       gap). No sessions is `skipped-noop`/`no-sessions`; attribution unavailable
#       is `skipped-gap`/`session-attribution-unavailable` plus residue.
#   D-7 Residue. Closed eight-kind vocabulary and declared order; item shape
#       exactly `{item, kind, location}`; per-field caps are contract data; 50
#       items maximum with an explicit omitted count and `+N`; no bodies,
#       titles, transcripts, credentials, or free-form prose; failure-envelope
#       rule F-11 applies (no structured `residue[]` beside an `error`).
#   D-8 Attention. Add the additive `attention` projection class mapping to
#       exit 1 for a data-bearing residue outcome; scripted success line shape
#       is unchanged; no exit literal outside packages/cli/src/projection.ts.
#   D-9 Test layout. Test files follow test-plan §7 exactly; fixtures are
#       extended, never forked (`tests/fixtures/closeout/harness.ts`,
#       `tests/fixtures/closeout/temp-git.ts`, `tests/fixtures/harness/**`,
