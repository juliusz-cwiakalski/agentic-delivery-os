#       merge and owner acceptance remain external.
#   D-13 TC completion mapping. Where a TC's binding oracle requires a later
#       spec §18 phase than the test plan's §5.1 phase column, the TC completes
#       in the later phase and its earlier subset is marked in that earlier
#       phase's coverage. The SEVEN split TCs are TC-CAP-004 (P1 runtime lock ->
