notes:
  - text: "Intake state: issue GH-240 open with labels change+review; no PR exists (open, merged, or closed) for feat/GH-240/capsule-closeout. The branch exists locally and is clean but carries zero commits ahead of origin/main-tools (c4f6cd63) — this is a fresh start, not a resume. The 'review' label is premature per the state mapping (review = PR created); following the standard label progression instead of treating it as evidence."
    type: "info"
    date: "2026-11-07"
  - text: "Dependency check: M0-S5 state layer (GH-174 closed), M0-S14 closeout v1 (GH-183 closed), M1-S8 retro pipeline (GH-232 merged as 33b65393), M1-S11 harness adapters (GH-233 merged as a69b555e) are all delivered. The ticket body's '(ticket pending in this batch)' is stale. No dependency blocker."
    type: "resolved"
    date: "2026-11-07"
  - text: "Scope interpretation from the design baseline (not invented): the delivered closeout transaction is dry-run-by-default with seven steps (ticket-to-done, lifecycle-label-sweep, unassign, owed-flip-sweep over tracker dependent items, comment-resolution, checkout-restore, branch-cleanup) and a non-gating injected harness-telemetry capture point that no production composer injects yet. M1-S12 adds (a) capsule completion inside every change folder (append-only events.jsonl plus a candidates/ directory), (b) the memory consolidation step inside closeout (validate capsule, identify candidates, dedup, link evidence, promote to exactly one canonical home, close the capsule) and (c) the closeout expansion: merged-diff owed-flip sweep, human-thread residue, worktree cleanup, retro-coverage registry move, session compaction checkpoint, and a bounded judgment-residue list — plus wiring the delivered harness telemetry capture into the production closeout composer."
    type: "decision"
    date: "2026-11-07"
  - text: "PM scope decision (capsule event ownership): the capsule events.jsonl is written by the lifecycle commands that own each event, per the M1 architecture writer-ownership table ('lifecycle agents | ledger: phase transitions, capsule events (through phase and commit)'): `phase` appends phase-transition events, `commit` appends commit events, `verify` appends gate-outcome events, and closeout ingests review verdicts (code-review/review-iter-N.yaml) plus appends its own closeout events during capsule validation. No free-text agent-authored writes. Capsules stay self-contained through phases 1-10 (no cross-change writes)."
    type: "decision"
    date: "2026-11-07"
  - text: "PM scope decision (two event streams): pinned by the ticket and restated here — harness telemetry from M1-S11 continues to land in the state-layer event log (the store `spend` reads) and the capsule events.jsonl carries phase, gate, review, and closeout events. Two streams, two owners, no duplication; the closeout rewrite must not move or duplicate telemetry records."
    type: "decision"
    date: "2026-11-07"
  - text: "PM scope decision (promotion write authority): per memory-lifecycle.md §2 step 6, closeout is the consolidation ceremony for the change capsule. It records one promotion decision per candidate (promoted or rejected with reason) in the capsule, and applies accepted items to exactly one canonical home in the local checkout. Closeout still performs no push, no remote write, and no history rewrite; memory changes therefore travel into history through the next normal delivery PR, which satisfies the kernel rule that memory changes ride normal delivery PRs and same-branch review. The typed memory-record store, preferences tree, guild trees, and memory lint are M2-S8 scope (it depends on M1-S12) and are not re-implemented here."
    type: "decision"
    date: "2026-11-07"
  - text: "PM scope decision (session compaction semantics): 'session compaction through the db integration' is interpreted as the memory-lifecycle.md §7 compaction contract executed at closeout for the closed delivery's sessions: identify the delivery's sessions through the delivered session-store/db read surface by work-item attribution, then record the pre-compaction checkpoint (working state and event log flushed, unresolved questions and last verified commit recorded) as a capsule event and a bounded step disclosure. The harness context-compaction call itself stays a declared capability gap because no adapter surface exists in the delivered stack; the story does not invent a harness API. If the readiness gate rejects this reading, reopen specification rather than expand silently."
    type: "decision"
    date: "2026-11-07"
  - text: "PM scope decision (step vocabulary): the delivered `owed-flip-sweep` step is tracker-relation-based (open direct dependents of the closed item). The ticket's 'owed-flip sweep of the merged diff' is a distinct mechanic (feature-flag/class strings, TODO markers, when-X-merges notes in the merged diff). The delivered seven-step order and closed vocabularies are a published contract; the spec must decide between an additive step id and an extended step, and must declare the payload/schema versioning consequence explicitly (additive is acceptable only if every consumer tolerates unknown step ids)."
    type: "decision"
    date: "2026-11-07"
  - text: "Documentation risk list for phase 7 (doc-syncer): feature-closeout.md (primary; step list, output shape, residue, capsule step, telemetry now wired), feature-state-layer.md (capsule event kind? capsule is file-based, not state), feature-harness-adapters.md (production composer now exists — the recorded 'no production composer until GH-240' deferrals F-8/F-9 become reachable and must be re-assessed), feature-retro-pipeline.md (retro-coverage move consumer), feature-session-database-admin.md (compaction consumer), feature-result-contract.md (new error identities if any), doc/overview/architecture + glossary + ubiquitous language + 00-index as needed, doc/decisions (any new decision record), and doc/spec/features indexes."
    type: "risk"
    date: "2026-11-07"
  - text: "Specification phase complete: chg-GH-240-spec.md v1.0 authored (718 lines; 12 F, 26 ACs, 11 NFRs, 16 DECs, 11 RSKs, 10 NGs, 5 OQs, §17.1 DoD-1..20; security_impact medium, risk_level high, one lockstep minor changeset). Key decisions: additive step ids (worktree-cleanup before branch-cleanup, merged-diff-sweep, retro-coverage-move, session-compaction, capsule) rather than overloading the tracker-relation owed-flip-sweep; comment-resolution extended in place (human threads become residue, never resolved; unknown authorship treated as human); delivery.closeout.v1 held with additive fields only; an additive data-bearing `attention` projection class so apply can return data and exit 1 on residue; two additive error rows (closeout.capsule-invalid, closeout.step.<id>.failed); capsule is file-based in the change folder (no new state record kind, no schema bump); retro registry consumed read-only with coverage recorded as a capsule event; worktree cleanup as a new git-seam capability reusing closeout.branch.unsafe; db unchanged."
    type: "decision"
    date: "2026-11-07"
  - text: "Spec Appendix A records eight design-baseline refinements (not inventions): man-page residue example carried a comment subject that the privacy contract forbids (identity-only pinned); `db list` carries no work-item field so session attribution uses the harness-store seam and db is unchanged; a synthetic closeout retro.run would corrupt collection selection/truth so coverage is read-only; promotion writes lessons/tacit to their home while fact/decision/norm/workflow are sanctioned handoffs per the kernel ownership rule; the man page showed data+exit 1 which no delivered projection class supports, hence the additive `attention` class; `verify` joins phase/commit as a capsule writer (architecture table refinement); branch+worktree cleanup split into two additive steps because worktree removal has its own predicate and ordering; the man-page error names closeout.step.<id>.failed and closeout.capsule-invalid did not exist and become additive rows."
    type: "info"
    date: "2026-11-07"
  - text: "Routed decisions (candidate records, PM to decide before PR): (1) TDR/ADR for capsule event stream vs state-layer event log ownership — two durable streams; (2) TDR/PDR for the human-authored review-thread policy (automation never resolves a human thread, fail-closed authorship); (3) TDR for the data-bearing `attention` projection class since it affects every result-contract consumer. Deferring decision-record authoring until after the DoR gate so the spec's DEC-n set is stable; if the runtime semantics change in delivery, the record captures the accepted outcome instead of a draft."
    type: "question"
    date: "2026-11-07"
  - text: "Test planning phase complete: chg-GH-240-test-plan.md v1.1 authored (3,278 lines; 61 TCs TC-CAP-001..061; 44 named guard mutants MUT-CAP-01..44; 16 gap rows; 11 OQs, of which 4 are resolved by spec v1.1). Coverage verified: 26/26 ACs and 11/11 NFRs Covered, no orphan TC, TC ids set-equal across index/details/automation/execution log."
