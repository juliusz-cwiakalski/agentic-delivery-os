  - text: "Specification reopened once (v1.0 -> v1.1) after the test-plan author found three internal inconsistencies: S-1 `scope-invalid` had no producer (removed; rejection set is eight, and an out-of-set scope is a candidate schema failure -> closeout.capsule-invalid); S-2 DEC-4 promised PM-notes residue that no closed residue kind could carry (aligned: v1 performs no PM-notes completeness check, the delivered lint owns it); S-3 ACs demanded a structured residue item inside a command-level failure envelope, which the one-of-data-or-error result contract cannot represent (pinned: failure returns the error envelope with no structured residue; the failed step's bounded evidence plus the human diagnostic name the refused/preserved item, and the same residue is assertable in plan mode). Fixes were consistency-only: no pinned vocabulary, AC intent, DEC intent, or NFR threshold moved."
    type: "decision"
    date: "2026-11-07"
  - text: "RETRO: the v1.0 spec shipped three internal inconsistencies that only surfaced under test-plan authoring (a vocabulary member with no producer, a decision clause promising an unrepresentable outcome, and an AC demanding a payload shape the result contract forbids). Root cause: the DEC/AC/Appendix layers were written from different mental models of the result envelope and were not cross-checked against each other at authoring time. Improvement for the next spec: add an explicit self-check that every closed vocabulary member has a producer and every consumer, and that every AC's required output shape is representable by the delivered envelope contract."
