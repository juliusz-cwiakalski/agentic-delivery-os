findings:
  - id: F-23
    severity: low
    confidence: high
    category: spec-compliance
    location: "packages/core/src/domain/closeout-diff-sweep.ts:30"
    message: >-
      `EXPLICIT_ACTION = /@action:\s*([a-z]+(?:-[a-z]+)+)\b/` only recognizes a
      hyphenated token. A single-word explicit action such as `@action:deploy`
      is therefore not recognized at all and the marker resolves via its
      declared action, while the delivered doc says "an explicit
      `@action:<token>` names an unknown token (`out-of-vocabulary-action`)".
      Probe: `// TODO @action:foo GH-183` -> resolved close-todo. All four real
      action tokens are hyphenated, so this affects only a malformed explicit
      action; the F-16 requirement (hyphenated unknown token -> ambiguous) is
      met.
    suggestion: >-
      Either widen the explicit-action regex to `@action:\s*([a-z][a-z-]*)\b`
      so any explicit token is judged against the vocabulary, or narrow the doc
      wording to "an explicit hyphenated `@action:<token>`". Cosmetic/robustness,
      non-blocking.
    suppressed: false
  - id: F-24
    severity: info
    confidence: low
    category: correctness
    location: "packages/cli/src/commands/phase.ts:512"
    message: >-
      Out-of-scope observation (pre-existing, not introduced by this fold): the
      `record-atomic-without-commit` recovery path returns `landed` with a new
      `data.commitSha`, so the producer keys the phase event by that SHA, while
      the pre-existing state record has no commitSha and the expected-event
      derivation keys by its `transitionId` (timestamp). Reasoning suggests a
      possible false `capsule-event-gap` on that recovery path. Iteration 2 had
      the same commitSha-vs-empty divergence, and the F-13 end-to-end test covers
      the atomic-with-commit path, not this recovery. Not exercised here.
    suggestion: >-
      If the path is reachable in practice, cover it in F-13 or align the
      producer/expected key for an atomic record without a commit. Not blocking
      and not part of the folded findings.
    suppressed: false
