summary: >-
  Restricted confirmation review of the pre-PR folds (c4834966, doc-sync
  5089e628), verifying the iteration-2 PASS still holds. All five folded
  findings are independently verified at their original sites. F-16: the diff
  sweep now reads an action only from the four pinned tokens inside the marker
  segment or an explicit `@action:<token>`; probe confirms ordinary hyphenated
  prose (`retry-policy`, `read-only`) resolves via the declared action, an
  explicit unknown `@action:do-something` is `out-of-vocabulary-action`, and an
  explicit wrong-but-valid `@action:remove-guard` on a todo-marker is
  `kind-mismatch`. F-17: GitHub `Mannequin` now normalizes to `unknown` (human,
  fail-closed) while `Bot`/`App` stay `non-human`, verified by a provider test.
  F-18: `capsulePhaseEventKey` adds a persisted `transitionId` discriminator for
  no-commit transitions; the producer and the expected-event derivation share
  it, two no-commit transitions of one phase get distinct keys, and a re-run
  stays a no-op. F-19: a new `capsule-producer-port.test.ts` drives the exported
  `createCapsuleProducerPort` directly (append, duplicate no-op, configured run
  id, absent-capsule classified failure). F-21: `git diff --check
  origin/main-tools...HEAD` is now clean. The doc-sync commit aligns the
  current-truth docs and test plan to the same semantics (Mannequin→unknown,
  declared-token/`@action` classification, `transitionId` phase key), and the
  test plan revision log v1.5 records it with no TC id, oracle count, phase,
  mutant, or coverage-count change. No pinned vocabulary, AC, DEC, NFR, TC
  oracle or bound was changed beyond the findings; 61 TC ids and 44 mutants are
  intact. Independent re-execution is green: full `bun test` 5606 tests / 5602
  pass / 4 skip / 0 fail, the 44/44 mutant harness, typecheck, lint, format,
  boundaries, error-table-sync (100/100), forbidden/privacy literals,
  doc-distribution (81 docs), exit-code-literals, and a clean branch-range diff
  check. Deferred items F-20 (plan over-listing, wording only) and F-22
  (pre-existing non-atomic promotion crash window) are recorded with reasons in
  the PM triage. One low residual (a single-word explicit `@action:` token is
  not recognized) and one informational pre-existing recovery-path observation
  are recorded; neither is blocking. The change is ready for quality gates and
  DoD.
