summary: >-
  Re-review after P12 remediation (610c3227 code, 72583650/906a67f9 records,
  2262daf3 doc-sync). Every iteration-1 blocker is independently verified
  CLOSED at the original site, not by trusting the PM notes: F-1 thread
  authorship now flows GitHub GraphQL root-comment author -> normalize
  human/non-human/unknown -> DeliveryThread author fields -> production
  planFacts threadAuthorFacts -> engine fail-closed (absent/unknown is human,
  no resolve-all), with a composition-level test that leaves a human thread
  unresolved and resolves a bot; F-2 runs the full capsule pre-flight
  (damage, caps, <id>.yaml, schema, one-decision-per-candidate, promotion
  confinement) before the step loop in apply, and an independent probe of an
  invalid candidate shows zero provider writes, zero git mutations, zero state
  appends and `closeout.capsule-invalid`; F-3 production planFacts reads the
  delivered retro registry (collected/pending, gap only on unreadable) with the
  ledger hash asserted unchanged; F-4 plan v1.3 records the P5/P8
  declared-vs-actual reconciliation and the previously missing provider/ports
  files are now in the diff. The nine folded findings (F-5..F-13) are also
  closed: residue dedupe by (kind,location,item) (probe: retro gap appears
  exactly once), SHA-256 content-hash diff identity with the declared
  contract-data action authoritative, plan-mode ambiguous-hit locations,
  git-engine worktree operation identity, contract-derived caps/version with the
  positional stepId remap removed, a last-moment worktree head+cleanliness
  re-check before the destructive argv, a clock-free deterministic phase key,
  and an end-to-end expected-event/zero-gap composition test. F-14 is documented
  (the +N sentinel is outside the 50-item cap) and F-15 (environmental temp-repo
  concurrency flake) was not reproduced: the full aggregate `bun test` is green.
  Independent constituent-gate re-execution passes: typecheck, lint (0 errors),
  format, boundaries, error-table-sync (100/100), forbidden/privacy literals,
  doc-distribution (81 docs), exit-code-literals, exports-parity, 241 closeout
  behaviour tests, 792 structure tests, and the 44/44 mutant harness. No
  critical or high defect remains, so the change is APPROVED for quality gates
  and DoD. Two non-blocking residuals are recorded for a pre-PR or follow-up
  touch: the diff sweep's new "first hyphenated token" action heuristic
  over-flags ordinary hyphenated prose as ambiguous (fail-safe, but narrows
  auto-resolution), and GitHub `Mannequin` (deleted/placeholder user) maps to
  non-human, a small fail-closed gap for a deleted human author. Three low/info
  hygiene items are also recorded.
