findings:
  - id: F-16
    severity: medium
    confidence: high
    category: spec-compliance
    location: "packages/core/src/domain/closeout-diff-sweep.ts:29"
    message: >-
      The F-6 fix replaced the old "known action token only" scan with "the
      first hyphenated lowercase token anywhere in the line is the declared
      action" (`ACTION_LIKE = /\b([a-z]+(?:-[a-z]+)+)\b/`, lines 29-59). Any
      attributed marker whose prose contains an ordinary hyphenated word is now
      classified `out-of-vocabulary-action` and becomes `ambiguous-flip-hit`
      instead of resolving via the marker's declared contract-data action.
      Independent probe (evaluateDiffSweep, workItemRef GH-183):
      `// TODO GH-183: fix the retry-policy bug` -> ambiguous
      (action "retry-policy"); `// when GH-183 merges, remove the read-only
      guard` -> ambiguous (action "read-only"); the control
      `// TODO close-todo GH-183 remove this guard` resolves. AC-F5-1 says a
      marker naming this work item whose declared action matches its kind is
      resolved owed-flip evidence; `retry-policy` / `read-only` are not declared
      actions, so these attributed markers should resolve. The behavior is
      fail-safe (extra residue, never a false resolve, no source mutation), but
      it narrows auto-resolution on common comment prose and the test plan
      (TC-CAP-025 / §4.5) was amended to bless it rather than narrow the code.
    suggestion: >-
      Treat only the four action tokens as candidate declared actions (scan for
      known tokens as before) so a hyphenated prose word cannot suppress
      resolution; keep out-of-vocabulary detection as a property of the marker
      contract data (already closed) or require an explicit action position
      (e.g. an `@action:`-style marker) before honoring a line token. Add a
      positive test that `// TODO GH-183: fix the retry-policy bug` resolves
      close-todo. Non-blocking for this review; fold before PR if cheap.
    suppressed: false
  - id: F-17
    severity: medium
    confidence: medium
    category: security
    location: "packages/adapters/src/github/normalize.ts:65"
    message: >-
      `authorKindFrom` maps `__typename` `Bot`, `App`, and `Mannequin` to
      `non-human`. `App`/`Bot` are automation, but GitHub `Mannequin` is a
      placeholder for a deleted or unavailable user, not a bot. Mapping it to
      non-human means an unresolved review thread started by a since-deleted
      human author is auto-resolved, which is a narrow fail-open against the
      spec's fail-closed posture (F-6/AC-F6-1/DEC-9: unknown authorship is
      human). The delivered doc now repeats this mapping, so it is a deliberate
      choice rather than a bug, but it is the one place the "human-review
      protection" control can still resolve a non-automation author.
    suggestion: >-
      Map `Mannequin` to `unknown` (fail-closed human) and keep `Bot`/`App`
      non-human; assert a Mannequin-authored unresolved thread stays unresolved
      with residue in the provider fixture matrix. Non-blocking edge; small,
      reviewer-visible behavior change.
    suppressed: false
  - id: F-18
    severity: low
    confidence: high
    category: correctness
    location: "packages/core/src/domain/capsule.ts:254"
    message: >-
      The F-12 fix made `capsulePhaseEventKey` deterministic identity
      (changeRef+phaseId+operation+commitSha) with no timestamp discriminator.
      This correctly removes the clock fallback and is idempotent for a re-run
      (a repeat command is a no-op and does not append), but it cannot
      distinguish two DISTINCT no-commit transitions of the same phase: e.g.
      complete (record-only) -> reopen -> complete (record-only) again collides
      on the `complete` key, and complete -> reopen -> complete(commit) ->
      reopen again collides on the `reopen` key. The second event is silently
      suppressed as a duplicate, so the capsule can under-record a real
      transition (F-2: one event per landed completion or reopen). The plan
      (task 12.10) explicitly allowed "use the phase record identity" for this
      case; the implementation dropped the discriminator instead.
    suggestion: >-
      Include the persisted transition timestamp/identity (stable once written,
      and equal to the phase command's `data.timestamp`) in the key when no
      commitSha is present, or document/assert that only the first no-SHA
      transition per operation is recorded. Low impact (multi-cycle no-commit
      phases are rare).
    suppressed: false
  - id: F-19
    severity: low
    confidence: high
    category: test-efficacy
    location: "packages/cli/src/edge.ts:395"
    message: >-
      The exported production capsule producer `createCapsuleProducerPort` is
      never exercised by any test; the producer suites use
      `tests/fixtures/capsule/producer.ts`'s `makeFileProducer`, which
      re-implements the same runtime wiring. A regression in the production
      function (wrong rules object, changes directory, or runId fallback) is
      therefore invisible to the suite. There is also no in-repo caller that
      wires `createCapsuleProducerPort` into the phase/commit/verify runtimes
      (host-supplied composition, per the architecture), so the producers are
      inert for this repository's own delivery (the change folder has no
      events.jsonl).
    suggestion: >-
      Add one test that drives `createCapsuleProducerPort` over a temp change
      tree and asserts a phase/commit append lands, or replace the fixture with
      the production builder. If host wiring is intentionally out of scope,
      record it as a declared integration gap rather than leaving an untested
      production function.
    suppressed: false
  - id: F-20
    severity: low
    confidence: high
    category: plan-compliance
    location: "doc/changes/2026-11/2026-11-07--GH-240--capsule-closeout/chg-GH-240-plan.yaml:1543"
    message: >-
      The P12 scope lists files that were not changed in the remediation
      (`packages/adapters/src/github/index.ts`, `tests/fixtures/closeout/threads.ts`,
      `tests/fixtures/state/harness.ts`, `tests/fixtures/retro/harness.ts`,
      `tests/fixtures/closeout/harness-telemetry.ts`), and the F-4 header
      reconciliation says P5's `tests/fixtures/closeout/threads.ts` is
      "extended" for thread root-author facts though it is byte-unchanged
      (it is a pre-existing GH-183 fixture consumed by other suites). The
      reconciliation is otherwise symmetric and honest; this is over-listing,
      not a hidden deviation.
    suggestion: >-
      Trim the P12 scope to the files actually touched, or change "extends" to
      "reuses" for threads.ts. Cosmetic artifact-consistency fix.
    suppressed: false
  - id: F-21
    severity: info
    confidence: high
    category: artifact-integrity
    location: "doc/changes/2026-11/2026-11-07--GH-240--capsule-closeout/chg-GH-240-pm-notes.yaml:143"
    message: >-
      `git diff --check origin/main-tools...HEAD` is not clean: pm-notes.yaml:143
      has trailing whitespace and chg-GH-240-test-plan.md:3317 has a new blank
      line at EOF. Both are change-artifact hygiene nits; the 610c3227 commit
      message recorded "git diff --check clean", so the check was evidently
      scoped to that commit or the code subset.
    suggestion: >-
      Strip the trailing whitespace and the extra EOF blank line in a single
      artifact-touch commit before the PR.
    suppressed: false
  - id: F-22
    severity: info
    confidence: low
    category: correctness
    location: "packages/core/src/domain/closeout.ts:1612"
    message: >-
      Pre-existing convergence nuance (unchanged by P12): promotion writes and
      their `capsule.promotion` events are not atomic. A crash after a home
      write but before the decision append leaves a record file with no event;
      on retry `evaluateCandidates` sees the existing statement and rejects the
      candidate as `duplicate:<id>`, and the pre-flight accepts that rejection,
      so the run closes with a "rejected duplicate" decision while the record
      file exists. No data loss and no duplicate write; listed for completeness
      because the new pre-flight now re-runs the same evaluation earlier.
    suggestion: >-
      Optional: make each promotion decision an idempotent write-then-append
      pair keyed by candidate id (or record the decision before the home write)
      so a mid-write crash converges to the same decision. Not required for this
      change.
    suppressed: false
