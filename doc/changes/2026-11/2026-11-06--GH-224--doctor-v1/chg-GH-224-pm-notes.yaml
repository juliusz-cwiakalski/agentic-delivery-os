  - text: "Ticket cites doc/planning/oss-tooling/milestones/m1/README.md for pack conventions; actual conventions live at doc/planning/oss-tooling/milestones/README.md (one level up). Minor doc drift, non-blocking (content exists and was used)."
    type: "risk"
    date: "2026-11-06"
  - text: "Pack internal drift: man-page.md shows 'doctor [--fix-hints]' while commands/doctor.md shows '[--json]'. Fix hints are unconditional per the pinned decision, so a --fix-hints flag is redundant; --json follows the standard machine-output convention. Spec-writer reconciles."
    type: "risk"
    date: "2026-11-06"
  - text: "Doctor must never crash: per-check isolation required — a check whose sources are unreadable becomes an unreachable/failing verdict with a hint (pack: doctor.check.<area>.unreachable, fail with hint), never aborts the run; fallback.internal containment applies only outside per-check execution."
    type: "info"
    date: "2026-11-06"
  - text: "Doctor is a read-only diagnostic: diagnoses and prescribes, never repairs (command registry: 'diagnose and prescribe'); no --fix surface, no mutation, no state writes. Provider checks must not burn quota: doctor reads wiring evidence (config chain, parks, announcements) and directs the operator to provider quota via the fix hint rather than executing live quota evaluation."
    type: "info"
    date: "2026-11-06"
  - text: "Evidence vocabulary should follow the closed-evidence-state discipline of status digest/queue ready: an unobserved, failed, or unattempted read is never an 'ok' verdict (never a false all-clear). Pack's binary ok/fail verdict proposal is refined at story delivery per pack conventions."
    type: "info"
    date: "2026-11-06"
