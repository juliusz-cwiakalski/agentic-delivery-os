decisions:
  - text: "Doctor outcome modeling follows the verify-change precedent: any failing check yields a classified error envelope (exit 1) whose deterministic summary names EACH failing check with its fix hint; all-checks-ok yields a success data envelope (exit 0) with structured checks; platform-classified store failures project exit 2. Result-contract evolution (data-bearing failure envelope, as sketched in the pack example) is ruled out: the result contract's NFR forbids failure envelopes carrying data and forbids exit overrides outside the projection module. The pack convention explicitly defers such proposals to story delivery."
    date: "2026-11-06"
  - text: "Spec DEC-6 provider park semantics: capacity/time parks (peak, quota-exhausted, outage, chain-exhausted) are wiring-neutral detail with a provider-quota directive; only credential-caused parks fail the check. Rationale: exit stability — routine peak parks must not train operators to ignore exit 1."
    date: "2026-11-06"
open_questions:
  - text: "OQ-T3 (from test-plan iteration 1, driving specification reopen): delivered read results may not distinguish an authentication rejection (spec: fail/credential-rejected) from a transport/server failure (spec: unreachable/read-failed); ProviderReadResult reportedly folds non-2xx incl. 401/403 into one adapter-local failure. Spec-writer must resolve against code truth in spec v1.1 — either pin the classified observable the change relies on (additive, in-change) or narrow the AC."
    date: "2026-11-06"
  - text: "OQ-T10: CI check authentication rejection missing from spec Appendix A ci row and AC-F7-1 while F-2/tracker treat it as fail — clarify in spec v1.1."
    date: "2026-11-06"
  - text: "OQ-T11: park cause reevaluation-cap absent from DEC-6 wiring-neutral list — clarify its disposition in spec v1.1."
    date: "2026-11-06"
  - text: "OQ-T2: define 'provider configuration branch unreadable at check scope' vs 'no chain declared' vs command-level malformed config in spec v1.1."
    date: "2026-11-06"
