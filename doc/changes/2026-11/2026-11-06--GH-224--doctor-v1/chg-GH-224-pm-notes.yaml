  - text: "Retro: unpushed-branch history hygiene is cheaper before merge than after — the commitlint body-length violation was introduced by the pre-restart coder commit and only surfaced at gate time; range commitlint belongs in the coder's per-phase verification so violations are caught at commit creation, not at gates. The rewrite cost was contained because (a) the branch was unpushed and (b) tree-identity verification (same content hash) proved the rewrite metadata-only."
