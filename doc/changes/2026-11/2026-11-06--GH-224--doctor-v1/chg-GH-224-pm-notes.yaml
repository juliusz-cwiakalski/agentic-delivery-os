  - text: "Retro: phase-boundary commits are the recovery anchors — because phases 1-4 were committed per phase before the crash, recovery cost was limited to re-verifying one phase's on-disk work instead of re-implementing it. The phase-3 httpStatus work was folded into the phase-1 commit (subject documents it) — acceptable deviation, but it means the original per-phase commit map no longer matches 1:1; coders should preserve the plan's commit boundaries even when adjacent phases touch the same files, for exactly this recovery scenario."
    type: "retro"
    date: "2026-11-06"
  - text: "Plan-phase ledger (phase id -> commit -> result; hashes are post-REPLAY truth after the 5e3f49a1 refresh, see refresh note): [1] contracts -> 647a35b1 -> error-table-sync 60/60 (union: 2 fallback, 5 provider, 1 input, 10 config, 9 state, 6 lint, 3 verify, 4 db, 4 closeout, 5 plan, 3 watchdog, 6 commit, 1 status, 1 doctor); [2] domain -> 2ac55b74 -> aggregation suites green; [3] adapters httpStatus -> folded into 647a35b1 -> trap+http-status suites green; [4] CLI -> 43306c88 -> command/edge suites green, ten-declarer seam verified; [5] verification battery -> c3266389 -> doctor suite 154 pass/0 fail; [6] closeout -> 872aae26 -> man-page reconciled, changeset verified; [7] docs -> 88c6a7fb -> doc-distribution exit 0. Final cumulative pnpm check at 9e4d9985: exit 0, 3582 pass / 4 skip / 0 fail, 357 files. Coverage: 21/21 ACs, 31/31 TCs."
