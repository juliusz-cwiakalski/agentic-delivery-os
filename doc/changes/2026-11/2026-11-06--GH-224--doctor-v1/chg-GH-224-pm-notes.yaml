  - text: "SPECIFICATION REOPENED (iteration 2) by test-plan author's GAP-4/OQ-T3 plus OQ-T10/T11/T2: AC-F4-1 requires distinguishing auth rejection from transport failure but the delivered read contract may fold them; CI auth rejection missing from Appendix A; reevaluation-cap park disposition unstated; provider-config-unreadable-at-check-scope undefined. Retro: the spec pinned the check outcomes but did not verify each pinned distinction against the delivered read-result types during initial authorship; future specs should verify every observable distinction in the ACs against delivered code truth at authoring time."
