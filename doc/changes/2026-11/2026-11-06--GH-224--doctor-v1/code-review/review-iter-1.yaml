    category: quality
    location: packages/cli/src/commands/doctor.ts:138
    message: >-
      [QUAL-1] collectProvider orders enabled provider entries with
      localeCompare, a locale/ICU-sensitive comparison. The first credential
      defect in that order decides the reported detail, hint, and failure-summary
      entry, so identical configuration can render different output on hosts
      with different ICU data (the domain's compareParkOrder correctly uses
      codepoint comparison for the same reason).
    suggestion: >-
      Replace `left.name.localeCompare(right.name)` with the codepoint
      comparison used by compareParkOrder (left < right ? -1 : left > right ? 1
      : 0) so defect selection is environment-independent, matching NFR-6's
      determinism intent.
    suppressed: false
