    category: quality
    location: packages/core/src/domain/doctor.ts:240
    message: >-
      [QUAL-2] isCredentialRejection hardcodes `httpStatus === 401 ||
      httpStatus === 403` while the contract constant
      DOCTOR_CREDENTIAL_REJECTION_STATUSES ([401, 403]) exists solely for this
      classification. D2's single-vocabulary-home discipline requires the domain
      to consume the declared constant; a future edit to the contract value
      would silently not change the domain behaviour.
    suggestion: >-
      Import DOCTOR_CREDENTIAL_REJECTION_STATUSES in domain/doctor.ts and derive
      the check from it (read.httpStatus !== undefined &&
      (DOCTOR_CREDENTIAL_REJECTION_STATUSES as readonly number[]).includes(read.httpStatus)).
