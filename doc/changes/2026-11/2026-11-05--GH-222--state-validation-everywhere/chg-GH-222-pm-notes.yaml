decisions:
  - text: "OQ-1 RESOLVED (PM): GH-222 ships a library-only state-tier surface — no user-facing CLI command. Backlog (canonical for scope per milestones/README) names no command; current feature-state-layer spec ships no command surface; all 5 ticket ACs are testable at the library boundary. The m1 contracts pack 'state' command entry stays a proposed milestone-end artifact for the later operate-family CLI line; spec DEC-4 confirmed."
    date: "2026-11-05"
  - text: "OQ-2 RESOLVED (PM): salvage is terminal-tail-only. Pinned ticket decision + AC3 cover torn tails; mid-record (non-terminal) corruption keeps the M0-S5 refuse-and-classify model with zero byte mutation; the salvage operation invoked on a mid-record tear fails classified without changing any bytes. Extending salvage to mid-record would be scope invention and erode the changes-nothing safety invariant."
    date: "2026-11-05"
  - text: "Tracker write auth unavailable for GitHub MCP (update_issue fails 'Requires authentication'; reads OK). Label sync per workflow-state mapping deferred to PR phase via gh CLI. Delivery not blocked."
    date: "2026-11-05"
  - text: "Retro/ceremony coverage is mechanism-first: M1-S2 ships reusable boundary validation (schema checks + classification) and artifact contracts so the retro registry (M1-S8) and ceremony artifacts (M2-S3) are born validated; it does not implement those pipelines. Rationale: backlog ranking rank 22 places M1-S2 before M1-S8 (rank 32) and M2-S3; AC2 is satisfied by validated boundaries exercised on artifact kinds, and the backlog goal line states 'validation mechanism lands early so every later registry is born validated'. PM-decided to unblock; spec-writer pins the exact artifact contract; DoR gate verifies."
    date: "2026-11-05"
  - text: "Salvage trigger is an explicit, guided operation: reads classify torn state with repair guidance (per m1/contracts.md state entry 'torn or unknown reads classified with repair guidance, never silent zeros'); the salvage operation truncates to the last valid frame, writes a classified salvage record, and quarantines post-tear data. This preserves the M0-S5 'no automatic repair' invariant while adding salvage. Pinned ticket decision fixes the mechanism (truncate + classified salvage record + quarantine), not the trigger; spec-writer finalizes. PM-decided to unblock."
    date: "2026-11-05"
