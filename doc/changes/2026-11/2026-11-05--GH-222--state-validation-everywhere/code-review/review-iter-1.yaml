findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/core/src/state/ledger.ts:221
    message: >-
      analyzeTear's truncated-tail shortcut returns topology "terminal" without
      scanning the complete lines before the final newline. On a ledger that has BOTH
      a mid-record integrity break (e.g. framing-broken record 2 with a parseable
      record after it) AND a truncated final tail (no trailing LF), verifyLedger
      reports variant truncated-tail (its coarse pre-existing shape) and salvage
      therefore proceeds as terminal: it truncates at the last newline (keeping the
      broken line), appends the state.salvage record, writes the quarantine artifact,
      and only then fails in post-commit verification with state.store.torn at the
      mid-record position while claiming not_landed. Reproduced empirically on HEAD:
      digest changed, quarantine created, salvage record appended, broken line
      retained, store still torn. This violates AC-F3-3 / DEC-2 (a mid-record tear
      must refuse salvage with ZERO byte mutation) and makes the not_landed
      consequence false; doc/spec/features/feature-state-layer.md's "Guided salvage"
      bullet asserts exactly the invariant the code breaks on this shape. The failed
      path also leaves the quarantine artifact behind with no cleanup
      (packages/core/src/state/index.ts:665 returns the raw torn failure after the
      commit).
    suggestion: >-
      In analyzeTear's truncated-tail branch (ledger.ts:221-233), scan the
      complete-lines prefix (text up to the last LF) for an earlier break — e.g. run
      verifyLedger on that prefix and, when it is not verified/empty, return topology
      "mid-record" with that prefix's first-break position — so salvage refuses before
      any write. Add a TC-GH222-011 regression test in
      tests/behaviour/state-salvage-invariants.test.ts for the combined shape
      (mid-record break + truncated tail) asserting: salvage fails state.store.torn
      naming the mid-record position, whole-ledger byte identity, no quarantine
      directory, no salvage record, and the subsequent read reports the same tear.
      Note: the M0-S5 repairTornTail operation (index.ts:554-570) shares the same
      coarse-variant root and would mutate-then-fail on the same shape; guard it the
      same way or record a follow-up ticket (pre-existing behavior, out of this
      change's ACs).
    suppressed: false
