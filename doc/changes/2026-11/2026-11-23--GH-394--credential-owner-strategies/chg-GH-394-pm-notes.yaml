decisions:
  - text: "Authority chain fixed at intake: the ticket BODY is superseded by the
      owner's six comments. Read order per owner comment 4 (2026-11-23T21:50Z):
      (1) settled design D1-D11 (19:25Z), (2) two corrections — symlink RESOLVED
      and accepted (regular executable target required, unresolvable chain is
      program-unavailable), remedy table keyed by (reason, style); (3) READ
      ORDER note — C-10 binding-supplied slot exception stated but INERT in this
      change (no binding, no credentials catalog branch; #396 owns it), tripwire
      enumerates declared integrations.<kind>.host coordinates from
      configuration itself and must not fail on their absence; plus
      remedy-wording comments (22:05Z, 22:15Z). Comment 1 (18:40Z) is superseded
      by comment 2 where they differ."
    date: "2026-11-23"
  - text: "ADR-0014 rev-8 local draft
      (.ai/local/ceo/decisions/ADR-draft-credential-strategies.md — never
      committed) is the canonical design artifact for all artifact phases. It
      lands in this change as
      doc/decisions/ADR-0014-credential-strategies-store-ownership.md with
      status: Proposed and decision_date: null — Draft Handling section and
      revision log removed, 00-index.md + 00-register.md rows added. Owner
      accepts or rejects at PR review; no agent marks it Accepted."
    date: "2026-11-23"
  - text: "Vocabulary keeps the shipped style names literal and environment-prefixed
      (owner correction 5): renaming touches
      defaults/catalog/validate/migrate/fixtures for zero behaviour. New styles
      are additive: command (closed allowlist: gh -> auth token [--hostname
      <host>]; opencode -> auth export [--standalone] <integrationID>) and
      harness-store. No harness-oauth style ever (rule OAuth-1: export hands
      over refresh; an active entry can report no expiry — a second refresher
      invalidates the owner's session)."
    date: "2026-11-23"
  - text: "Scope boundary (owner READ ORDER note): ships the ONE-SHOT CLI
      composition (dispatch, merge, status, commit, verify, queue). The shipped
      resident daemon is supervise-only with no credential consumer — no daemon
      benefit may be claimed or built here; the resident composition is
      specified forward for #395 only. Out of scope: store style, jaiship auth,
      profiles, binding, layers (#396/#397/#399), doctor requirement derivation
      (#398), glab/Jira strategies."
    date: "2026-11-23"
  - text: "Failure model: ONE new identity-free mechanism —
      config.credential.missing stays the only code; the failure variant gains
      additive optional source/reason/remedy. reason from the closed ten-member
      set (program-unavailable, timeout, non-zero-exit, empty-output,
      shape-drift, ambiguous-account, oauth-excluded, source-not-supported,
      variable-absent, resolution-pending — the last reserved, unobservable by
      shipped callers). remedy strings come from a table keyed by (reason,
      style) and selected per allowlist entry: host-aware text only for entries
      with a binding-supplied or declared host slot; neutral text otherwise;
      both texts fixture-pinned."
    date: "2026-11-23"
