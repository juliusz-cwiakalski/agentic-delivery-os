      #credentials/... specifiers that fail node16 resolution inside the packed
      artifact (attw InternalResolutionError, exit 1). Every other adapters
      subpath imports siblings relatively (e.g. packages/adapters/src/git/index.ts:448),
      which is why only this subpath regressed. The coder's subpath attribution
      (git/gitlab/jira/github) is also wrong: those table rows carry only
      profile-ignored problems; the failing entrypoint is ./credentials. The
      reproduction at c1854932 proved presence mid-branch, not pre-existence at
      base, so the "owner-visible pre-existing-defect record" disposition route
      is unavailable. Implicates DoD ("pnpm check green") and the quality_gates
      disposition.
    suggestion: >
      Replace the three #credentials/* sibling imports in
      packages/adapters/src/credentials/index.ts with relative ./allowlist.js /
