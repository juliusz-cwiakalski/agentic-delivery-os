      strategies. A declaration such as {style: literal, name: K, program:
      "/usr/bin/gh"} or a command key carrying harness/integrationId loads
      cleanly and the stray field silently disappears. Out-of-table programs
      are refused fail-closed and classified (composition edge for the tracker
      reference; classified resolve-time refusal for provider credentials —
      the disclosed two-layer semantic), so there is no execution hazard; the
      gap is the silent-drop of wrong-style known fields the spec requires to
      refuse by name.
    suggestion: >
