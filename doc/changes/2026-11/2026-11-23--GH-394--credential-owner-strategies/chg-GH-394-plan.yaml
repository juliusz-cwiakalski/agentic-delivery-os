phases:
  - id: 1
    title: Port contracts, doctor presence variant, conformance double, pre-change goldens
    kind: delivery
    summary: "widen the credential port contract additively in packages/core/src/contracts/credentials.ts — the closed four-style source vocabulary (literal, environment-prefixed, command, harness-store) with per-style explicit source keys, the failure variant gaining exactly three optional projection fields (source, reason, remedy) over the unchanged single code, the closed ten-member reason union with resolution-pending reserved, resolution context entering as construction inputs never as new members, operation and union shape unchanged — and packages/core/src/contracts/doctor.ts where the delivered presence variant carries the same three optional fields; update the testkit conformance double packages/testkit/src/conformance/mock-tenant.ts to the four-style union so tests/structure/conformance-coverage stays green; extend tests/behaviour/credential-port.test.ts for the additive fields and the declared reserved member while the error-table row-binding drift test stays green; then capture the pre-change validation-and-resolution goldens at the branch point through the explicit capture entry (a fixture module, never a blanket rewrite) so TC-COMPAT-001's byte-identity oracle is the delivered behaviour"
    # TC ownership: no TC lands here; this phase builds the contracts the later TCs consume and the TC-COMPAT-001 oracle (port-level goldens, read-only from here on).
    # Site map: the contracts files are the map's two phase-1 definition sites — the fields exist from this commit on.
    # Ordering: contracts first (owner constraint) — every later phase consumes this union; the golden capture MUST precede phases 2-4 (test plan TA-6).
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/credential-port.test.ts tests/structure/conformance-coverage.test.ts; git status confirms only the six declared paths changed.
    scope:
      files:
        - packages/core/src/contracts/credentials.ts
        - packages/core/src/contracts/doctor.ts
        - packages/testkit/src/conformance/mock-tenant.ts
        - tests/behaviour/credential-port.test.ts
        - tests/fixtures/credentials/golden-capture.ts
        - tests/golden/credential-resolution-goldens.json
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/credentials.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/contracts/doctor.ts
        role: producer
  - id: 2
    title: Credential strategies — allowlist table, command and harness-store strategies, memoized resolver
    kind: delivery
    summary: "implement the strategies inside the single credential-material directory packages/adapters/src/credentials/: the new closed allowlist module (the two shipped entries — the tracker CLI token read and the harness CLI export with its optional standalone flag and integration-id positional; pinned subcommand prefixes; permitted parameters; grammar-closed slots bounded by the plan's named constants; per-entry remedy selection keyed by reason and style with the host-aware/neutral split; the binding-supplied slot exception stated inertly), the new command strategy (symlink resolution to a regular executable target with program-unavailable otherwise, argv constructed with the -- terminator before the positional in every shape, no shell or interpolation, closed stdin, stdout captured to the fixed bound, stderr size and exit status only, the reduced child environment with exactly the declared session-bus facts, the per-execution cap, the one-line stdout material rule with interior-newline and empty refusals), the new harness-store strategy (target-selector export of the declared integration only, in-process single-entry selection as defense in depth, raw export never retained, exactly one active entry or ambiguous-account, no-stored-entry is empty-output with zero fall-through, key entries only, shape-drift classification naming harness and field, oauth-excluded, declared-harness match or source-not-supported, read-only posture), and the resolver rework over the governing record's four construction-input seams (active harness identity, child runner, environment record, store facts) with the per-process memo of exactly one execution per reference and register-before-parse-and-throw materialization"
    # TC ownership: none here — TC-ALLOW-001..006, TC-HARNESS-001..007, TC-MEMO-001, TC-EXEC-001/002, TC-REASON-001/002, TC-REMEDY-001/002, TC-REDACT-002/003 prove this code in phase 5 (owner ordering: tests land with the tripwire).
    # Site map: adapters/src/credentials/index.ts is the map's phase-2 creation site — every failure this phase constructs carries its source/reason/remedy from birth.
    # Boundaries: NFR-7 — everything credential-material-shaped stays in this directory; the existing createProcessCredentialPort ambient wrapper keeps its single allowlist entry; no new ambient read.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/credential-port.test.ts (existing suites stay green — additive change); pnpm typecheck.
    scope:
      files:
        - packages/adapters/src/credentials/index.ts
        - packages/adapters/src/credentials/allowlist.ts
        - packages/adapters/src/credentials/command-strategy.ts
        - packages/adapters/src/credentials/harness-store-strategy.ts
      folders:
        - packages/adapters/src/credentials
    interactions:
      - kind: contract-file
        target: packages/adapters/src/credentials/index.ts
        role: consumer
  - id: 3
    title: Configuration — declarable sources, tracker reference, load-time slot grammar validation
    kind: delivery
    summary: "make credential sources and the tracker credential reference declarable configuration: packages/core/src/config/catalog.ts admits the four closed styles with their per-style explicit keys and the declarable tracker credential reference, refusing an unknown style, an unknown field on a known style, and an out-of-table pair by name; packages/core/src/provider/validate.ts runs the shared source-key validator and the slot grammars (charset, no leading dash, the named-constant length bounds) at configuration load, failing closed; packages/core/src/config/defaults.ts declares the tracker reference default byte-identical to today's value (style literal, variable name GITHUB_TOKEN); every existing declaration, shipped provider-config fixture, and default validates unchanged (F-8)"
    # TC ownership: none here — TC-ALLOW-003/004 (refusals at load) and TC-COMPAT-001 (defaults unchanged) prove this code in phase 5.
    # Boundaries: additive only — no new configuration layer, no binding, no credentials catalog branch (NG-3, NG-8); the declarable-reference key set is exactly DM-1's.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/config-output.test.ts tests/checks/config-default-positions.test.ts (existing config suites stay green); pnpm typecheck.
    scope:
      files:
        - packages/core/src/config/catalog.ts
        - packages/core/src/provider/validate.ts
        - packages/core/src/config/defaults.ts
  - id: 4
    title: CLI composition wiring, live redaction registry, failure-field forwarding (engine, announcements, merge chain), doctor display
    kind: delivery
    summary: "wire the one-shot CLI composition (dispatch, merge, status, commit, verify, queue) to the strategies — packages/cli/src/production.ts supplies the resolver construction inputs and replaces the hard-coded tracker reference with the declared value, default unchanged — turn the entrypoint's construction-time frozen secrets snapshot into the live register/values redaction registry consulted at render time (packages/cli/src/entrypoint.ts keeps static registration for the two environment styles and never resolves; packages/cli/src/index.ts makes the seam mutable, the renderer consults the registry with the config-summary suppression exemption for credential refusals only; the three registerEdgeSecrets sites in packages/cli/src/edge.ts join the same registry), and forward source/reason/remedy at EVERY reconstruction site in the committed forwarding-site map — the CLI consumer files (packages/cli/src/edge.ts, packages/core/src/domain/harness-spawn-env.ts, packages/adapters/src/inference/index.ts with request behaviour otherwise unchanged, packages/mcp/src/serve.ts whose serve state placeholders gain the reason so the renderer never guesses, packages/cli/src/commands/doctor.ts showing the source identity for all four styles and the variable name only for the two environment styles with NO requirement derivation), the provider-engine forwarding scope per spec rev 1.1 DEC-14 (packages/core/src/provider/engine.ts carries the three fields as projection data at the park-evidence builds and the failure reconstruction — never a shape collapse without them alongside — with the pending-park semantics in the park construction untouched and reserved for #395 and no park-record field; packages/core/src/provider/announcements.ts derives announcement lines from the code plus the reason token, the announcement code set unchanged), and the merge-chain refusal reconstruction (packages/cli/src/commands/merge.ts failure envelope beside its trustedRefusal marker, packages/core/src/domain/merge-transaction.ts failure/evidence construction and landing-fault mapping with the delivered name-only-evidence site preserved and the fields forwarded as name-shaped data, packages/cli/src/output/merge-text.ts renderer passing the pinned strings through unmodified, the trusted-refusal marker shapes in packages/cli/src/commands/dispatch.ts and packages/core/src/app/dispatch.ts with its bounded-credential prose gate, and packages/core/src/provider/simulate.ts) — while the daemon composition, error-table row set, park-record shape, announcement codes, result tokens, and exit taxonomy stay untouched"
    # TC ownership: none here — TC-COMP-001..003, TC-REDACT-001/004, TC-REMEDY-001 (renderer pass-through step 4), TC-REMEDY-003 (restated arm: forwarding at the provider-engine reconstruction sites is in scope per DEC-14; the park/log line is reached THROUGH those edits), TC-MEMO-002, TC-REASON-003 prove the wiring in phase 5.
