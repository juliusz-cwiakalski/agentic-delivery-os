deviation_assessment:
  d_tc021_mutant_catalog: >-
    Judged NOT accepted as delivered. The guarantee that survives: the clean production payload is
    re-scanned by roughly five genuinely invariant detectors (surface count 9, placeholder count 3
    and state not-delivered, no-spend), so a production regression that inflates the surface set or
    flips a placeholder state WOULD fail brief-mutants.test.ts; and the underlying behavioural
    suites are real and largely discriminative (strict-equality oracles over fixed fixtures, live
    fence/hostile-handler controls, seeded import-scan probes, golden mutation/restore controls).
    The guarantee that does not survive: the bound non-vacuity meta-proof — mutated production
    modules failing the intended suites — is entirely absent, 8/20 entries are tautologies, and the
    two highest-value guards (review-signal predicate, age unknown-guard) sit in a fixture world
    where disabling them changes nothing the detectors can see. The alias-resolution justification
    is empirically false (closeout-mutants precedent + probe). See F-1.
