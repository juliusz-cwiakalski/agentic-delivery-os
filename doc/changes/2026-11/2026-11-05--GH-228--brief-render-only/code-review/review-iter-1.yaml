findings:
  - id: F-1
    severity: high
    classification: blocker
    confidence: high
    category: test-quality
    location: tests/fixtures/brief/mutants/catalog.ts:35
    message: >-
      TC-BRIEF-021 is not delivered as bound. The test plan binds the mechanism three times
      (§4.10 item 3: "imports temp copies of the projection/render modules through a file URL with
      one named guard disabled"; §5.2 TC-BRIEF-021 step 2: "Assert each mutant fails the intended
      suite"; §6.2 fixture table: "imported via file:// in temp") and plan task 5.3 repeats it.
      The delivered committed catalog (accepted deviation D-TC021, pm-notes 2026-11-06) instead
      applies payload transforms to a clean payload and pairs each with a bespoke detector; the
      meta-check (tests/checks/brief-mutants.test.ts:34-40) proves only detect(clean)=false and
      detect(apply(clean))=true. No mutated production code is executed and no suite runs against
      a mutant, so the bound guarantee — "every guard is proven load-bearing; a silently disabled
      guard fails the change" — is absent. Concretely: capSizedFacts() contains no approved pull
      request and no absent/unparseable hand-back timestamp, so disabling the review-signal
      predicate (packages/core/src/domain/brief.ts:112) or defaulting unknown ages to 0 leaves
      every detector false and brief-mutants.test.ts green. Eight of twenty entries are pure
      string tautologies (tokenMutant, catalog.ts:35-41 and 232-265: apply() returns a string
      containing the token, detect() checks the string contains the token), so the AC-coverage
      meta-assertion (brief-mutants.test.ts:27-32) passes vacuously for them. The deviation's
      justification — out-of-tree copies cannot resolve workspace `#contracts`/`#domain/*`
      aliases — is refuted by in-repo precedent: tests/checks/closeout-mutants.test.ts:26-45
      (GH-183, on main-tools before this branch) rewrites `from "#contracts"` and relative
      specifiers to file:// URLs of the real modules, writes the mutated source under tmp/tmpdir,
      and imports it with a cache-busting query. My reviewer probe (see verification_evidence)
      ported exactly that loader to packages/core/src/domain/brief.ts (`#contracts` ->
      contracts/index.ts file URL; `./status.js` -> domain/status.ts file URL, whose own
      `#contracts` import resolves natively at its real location): the clean rewritten module
      loads and renders 9 surfaces, and the single-guard mutation `item.reviewState ===
      "observed"` -> `true` produces a ready-to-merge action from an unknown review signal
      (0 -> 1). The specified mechanism was implementable as written; GH-183's review precedent
      (iteration-1 F-11, remediated in iteration 2 as "real source-mutation non-vacuity, not
      hand-built tautologies") is the settled repo standard this change regresses from. The §10
      evidence row for TC-BRIEF-021 ("20 mutants cover all 10 ACs; ... each mutant produces its
      prohibited observable") is true only of the substituted weaker design.
    suggestion: >-
      Activate Phase 7 and port the closeout-mutants loader into brief-mutants.test.ts: rewrite
      `#contracts` and `./status.js` specifiers to file:// URLs, write mutated sources under
      tmp/tmpdir (never the live tree), import with a cache-busting query, and add source
      mutations for the load-bearing guards — review-signal predicate (AC-F2-1), age
      unknown/future guards (AC-F2-2), placeholder state and catalog guards (AC-F3-1),
      surface-state mapping (AC-F4-1), exit-0-on-unavailability projection (AC-F5-1), renderer
      bound/drop guard (AC-F1-2), redaction chokepoint (AC-F6-3) — each asserted clean-resists /
      mutant-fires naming its case. Replace the eight tautological tokenMutant entries with
      source mutations or with explicit cross-references to the already-seeded controls
      (brief-imports.test.ts:181-187 seeded node:http/openai/fetch probes;
      brief-readonly.test.ts:250-270 writeOutput chokepoint canary; error-table-sync.test.ts
      temp-copy additions) so the AC-coverage meta-count includes only load-bearing mutants. If
      the payload-resists scan is kept as an extra layer, keep it, but it cannot be the whole of
      TC-BRIEF-021. Per test-plan A-T8, reopen the test plan if TC-BRIEF-021's oracle is
      permanently re-worded.
    suppressed: false
