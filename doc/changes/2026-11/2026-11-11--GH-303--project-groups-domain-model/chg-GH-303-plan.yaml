gateCommands:
  planSchema:
    command: "./node_modules/.bin/delivery-os plan validate GH-303"
    expectation: "verdict=valid, readyForDevelopment=true, totalErrors=0"
  planConformance:
    command: "./node_modules/.bin/delivery-os lint GH-303"
    expectation: "exit 0 (pm-notes and plan conformance)"
  containment:
    command: "none — P34 is the containment oracle"
    expectation: >-
      `plan diff` is not usable in this checkout: the composed runtime returns
      an unreadable diff port (`input.value.rejected`, "repository diff for
      GH-303 could not be read"), so the command is declared unavailable rather
      than declared green. P34's branch-diff manifest is the authoritative
      containment check and the reviewer re-reads the diff at phase 8.
  docDistribution:
    command: "env -u TMPDIR bash scripts/.tests/test-doc-distribution.sh"
    tmpdir: "default (unset / environment TMPDIR)"
    expectation: "exit 0; 0 planning markers (P38)"
  forbiddenLiterals:
    command: "bun run scripts/checks/forbidden-literals.ts"
    expectation: "exit 0; 140 registered entries; 0 unregistered-doc findings; 0 violations (P42)"
  aggregateGateAuthoritative:
    command: "mkdir -p \"$REPO_ROOT/tmp/tmpdir\" && TMPDIR=\"$REPO_ROOT/tmp/tmpdir\" pnpm check"
    tmpdir: "repository-local (repo/tmp/tmpdir), required because tests/checks/ci-baseline-parity.test.ts runs `git clone --local` and a tmpfs TMPDIR fails with a cross-device hardlink"
    expectation: "exit 0 (P39, AC-NFR6-1)"
  aggregateGateRecorded:
    command: "env -u TMPDIR pnpm check"
    tmpdir: "default (environment TMPDIR)"
    expectation: >-
      recorded with its failing test names; only a lone
      tests/checks/ci-baseline-parity.test.ts failure is environmental. Any
      other default-run failure is a delivery failure, except that a lone
      TC-WIRE-002 (tests/checks/privacy-ci-wiring.test.ts) failure is recorded,
      re-run in isolation on a quiet machine, and escalated per UG-1 — never
      reclassified.
  tmpdirRule: >-
    The two doc guards have opposite TMPDIR requirements in this environment and
    are invoked per guard as above; the environment is never changed to make a
    guard pass, and both aggregate runs are recorded in the delivery evidence
    (DEC-16, NFR-5, NFR-6).
orderingConstraints:
  - "P1 -> P2 -> P3 -> P4 -> P5. P3 and P4 are adjacent by construction: the forbidden-literals guard is red between the new page (P3) and its registration (P4)."
  - "P2 precedes P3 because both command pages, the seeds, and the journey point at `repos.v1`, the group envelope, and the configuration schema that P2 lands; a forward reference would make P43 fail at the P3 boundary."
  - "P2 precedes P1 only in reader order, not in commit order: P1 lands the story codes that P2's map rows and contracts cite, and P4 is independent of P5 except for the entry count."
  - "P5 runs last because P34 requires all thirteen product files to be present and the worktree clean (`worktree_product_changes=0`), and P26/P27/P32/P33/P45/TM-034 need every artifact in place."
  - "P6, when opened, runs after the review verdict and before the PR; it adds no product path and no phase except itself."
  - "`plan diff` is unavailable in this checkout (the composed runtime returns an unreadable diff port), so P34's branch-diff manifest is the sole containment oracle; the reviewer additionally re-reads the change diff at phase 8."
crossArtifactResolutions:
  note: >-
    The test plan flags five places where two artifacts pull in different
    directions (TP-1..TP-5, test plan §8.4). Each is resolved here by naming the
    governing AC/TC and the phase that owns the gate; none is silently absorbed
    and none requires a spec change.
  TP-1:
    tension: "AC-F12-2 and AC-NFR11-1 both govern status.md line retention, so a naive mapping yields two test cases over one predicate."
    governing: "AC-F12-2 (TC-M2DOM-029) and AC-NFR11-1 (TC-M2DOM-044)."
    resolution: >-
      Kept as two TCs by predicate, not collapsed: TC-029 owns presence, order,
      and addition confinement; TC-044 owns byte identity plus the oracle's
      soundness (delete, modify, swap, outside-insertion mutants) and the
      explicit "no whole-section cmp" clause. Both execute at P5 because
      status.md lands there; the plan gates them as a pair and never asserts a
      whole-section comparison anywhere.
  TP-2:
    tension: "AC-F3-3 and AC-F6-4 both describe the cross-repository change plan shape in contracts.md."
    governing: "AC-F3-3 (TC-M2DOM-007) and AC-F6-4 (TC-M2DOM-017)."
    resolution: >-
      Split by direction inside P2: TC-007 traces the six S19 task clauses
      forward (clause -> contract) and TC-017 asserts the shape's seven declared
      elements backward (contract -> fields). AC-F3-3 cannot pass before
      contracts.md exists, so its TC is owned by P2 even though the S19 entry
      lands in P1; the overlap is declared, not double-counted.
  TP-3:
    tension: "AC-F7-3 forbids the flat enumeration on the projects page while AC-F14-2 requires every both-name location to state the boundary, so a literal word ban on `repos` would make the two criteria mutually unsatisfiable."
    governing: "AC-F7-3 (TC-M2DOM-021) and AC-F14-2 (TC-M2DOM-033)."
    resolution: >-
      The projects page MUST name `repos` in its boundary sentence; the ban is
      on attaching the enumeration to `projects`. P21 therefore tests contract
      pointers and envelope keys (`repos.v1`, `repos[]`, `projects.v1`,
      `projects[]`) rather than the bare word, and P33 positively requires the
      boundary sentence at the eight both-name locations. Both gates run at the
      phases that own them (P3 for P21, P5 for P33).
  TP-4:
    tension: "NFR-7 states `## Key flows` holds exactly eight `###` headings while the base tree has seven."
    governing: "AC-NFR7-1 (TC-M2DOM-040), with AC-F5-3 (TC-M2DOM-013)."
    resolution: >-
      Seven to eight is treated as the derived consequence of the new
      cross-repository flow, not as an unexplained constant. P13 proves the flow
      exists and P40 records both the base seven and the head eight; a missing
      flow therefore fails as a count mismatch. P40 is claimed at P2, where the
      only diagram-bearing file is touched, and re-run at P5 over the full
      touched set without re-claiming TC-040.
  TP-5:
    tension: "F-12/AC-F12-1 fix neither the new status section's title nor its exact date text."
    governing: "AC-F12-1 (TC-M2DOM-028) and AC-F12-2 (TC-M2DOM-029)."
    resolution: >-
      The plan pins only the leading date token `2026-11-11` in the new section
      heading, for auditability. The rest of the heading is the author's choice:
      P28 derives the section positionally as the first `##` heading present in
      the head and absent from the base, and requires uniqueness, so a second
      new section fails and no fixed title string is asserted.
upstreamGaps:
  - id: UG-1
    severity: high
    summary: >-
      NFR-6 / AC-NFR6-1 exempt only a lone tests/checks/ci-baseline-parity.test.ts
      failure from a default-TMPDIR aggregate run, but the observed base tree
      also fails TC-WIRE-002 (tests/checks/privacy-ci-wiring.test.ts) standalone
      in both TMPDIR modes (5041.80 ms default, 5538.72 ms repository-local) and
      passes inside both full suites (test plan §1.2 G-6, TR-11, §10).
    disposition: >-
      Not reclassified as environmental and not absorbed by widening the spec's
      exemption. The authoritative repository-local run must be green; a
      TC-WIRE-002 failure in that run FAILS the phase and is escalated to the
      ticket owner as a gate defect. A default-run failure of TC-WIRE-002 is
      recorded verbatim, re-run in isolation on a quiet machine, and reported
      with both observations.
    owner: "@runner (phase 9 quality_gates); escalation target: ticket owner"
  - id: UG-2
    severity: low
    summary: >-
      F-8 and AC-F8-1 require the S18/S19 seed set to cover ten topics but do
      not say which seed carries which topic; P22 squashes the seed set before
      matching.
    disposition: >-
      The plan treats the ten coverage anchors as a property of the seed set
      (at least two S18 and two S19 seeds, each with exactly one `Assert:`
      line), never of an individual seed. No seed is required to carry all
      topics, and no anchor may be carried by prose outside the seeded blocks.
    owner: "@coder at P3; @reviewer reads the seeds against the spec (test plan G-9)"
  - id: UG-3
    severity: low
    summary: >-
      The spec's NFR-3 barrier is broader than its mechanical oracle: P36 greps
      for a fixed vocabulary of delivery claims, so prose that attributes
      delivery to the planned surfaces in unanticipated words would pass the
      scan.
    disposition: >-
      Declared residual, matching test plan G-4/G-5/G-9. The plan states the
      authoring prohibition as a constraint in P3, P5, and P6 and hands the
      semantic read to `@reviewer`; P36 remains the mechanical floor and its
      green result is never presented as proof of wording quality.
    owner: "@reviewer (phase 8 review_fix)"
