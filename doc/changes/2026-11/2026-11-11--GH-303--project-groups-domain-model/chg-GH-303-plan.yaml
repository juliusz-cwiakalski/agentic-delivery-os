  - id: 6
    title: "P6 — Conditional review remediation"
    kind: delivery
    weightClass: standard
    summary: "docs(GH-303): apply review remediation"
    goal: >-
      Give the review loop a single, bounded remediation phase: it opens with the
      review-board verdict, re-reads the findings the board and the local reviewer
      named, and applies only the corrections those findings require — never a
      new surface, never a widened guard, never a re-planned scope. [DEC-30]
    scope:
      folders:
        - doc/changes/2026-11/2026-11-11--GH-303--project-groups-domain-model/
    dependsOn:
      - phase: 5
        reason: "Remediation runs after the full battery has produced a verdict; the phase exists only to close findings that verdict names."
    constraints:
      - "Opens with the board verdict: the first act is to re-read the recorded six-critic review-board findings on PR #306 (blocking 1-6, should-fix 7-16, cheap notes 17-18, decisions A-D) together with the local review verdict, and to list the defects it names. A remediation not traceable to a named finding is out of scope."
      - "The phase declares no product path of its own: its folder scope is the change capsule it writes (plan revision and delivery evidence). A remediated product file is re-opened under the P1..P5 declaration that owns it, so the fifteen-file product scope stays disjoint and sums to exactly fifteen; no phase-6 change may add a sixteenth product path, and a remediation that needs one is an escalation, not a phase."
      - "A remediated file re-runs its owning procedures from P1..P5; a remediated artifact's TC moves to P6 only if the remediation re-delivers it, and this plan's coverage matrix is revised in the same commit so the total stays 69/69 claimed exactly once."
      - "No guard may be weakened to make a finding go away: the scanned set, the registered count, the marker guard, and the aggregate gate are invariants, and `pnpm check` remains green only in its authoritative repository-local form (UG-1)."
      - "The naming boundary is not negotiable in remediation: decisions A-D (DEC-19..DEC-22) fix the three contract names, the group identity, the flat record identity, and the single rename rule with its alias."
      - "If remediation changes a claim this plan asserts (a file's ownership, a counter, a gate token), the plan is revised with it; a remediation commit that leaves the plan stale is a defect."
    gates:
      - >-
        No gate is claimed in advance. The phase re-runs the procedures of every
        file it touches and reports them with the phase's own evidence; the
        closure condition is that the re-run set is green and the full P5
        battery is green again on the remediated head.
      - "`./node_modules/.bin/delivery-os plan validate GH-303` -> verdict=valid"
      - "`./node_modules/.bin/delivery-os lint plan GH-303` -> verdict=valid"
    definitionOfDone:
      - "Every finding named by the board verdict and the local review verdict is either fixed or explicitly rejected with a recorded reason, and no unfixed finding remains silent."
      - "The re-run procedure set for every touched file is green, the full P5 battery is green on the remediated head, and no new product path and no guard weakening were introduced."
      - "The coverage matrix still totals 69 ACs and 69 TCs claimed exactly once, and `plan validate` / `lint plan` are valid."
    coverage:
      acceptanceCriteria: []
      testCases: []
