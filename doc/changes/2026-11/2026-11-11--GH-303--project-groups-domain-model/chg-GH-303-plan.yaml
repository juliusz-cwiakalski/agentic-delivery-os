  containment:
    command: "none — P34 is the containment oracle"
    expectation: >-
      `plan diff` is not usable in this checkout: the composed runtime returns
      an unreadable diff port (`input.value.rejected`, "repository diff for
      GH-303 could not be read"), so the command is declared unavailable rather
      than declared green. P34's base..worktree manifest (base revision versus
      the working tree, filtered to product paths) is the authoritative
      containment check and is decidable at the P5 boundary; the committed range
      is reported separately as `post_commit_check` after the P5 commit. The
      reviewer re-reads the diff at phase 8.
  docDistribution:
    command: "env -u TMPDIR bash scripts/.tests/test-doc-distribution.sh"
    tmpdir: "default (unset / environment TMPDIR)"
    expectation: "exit 0; 0 planning markers (P38)"
  forbiddenLiterals:
    command: "bun run scripts/checks/forbidden-literals.ts"
    expectation: >-
      exit 0; 140 registered entries (base 139 + the one new row); 0
      unregistered-doc findings; `failures=0`; `violations=0`; `seed_hits=0`;
      and the literal scan covering exactly the ten planning documents
      AC-NFR9-1 names (`planning_scanned=10/10` once `commands/repos.md`
      exists, `9/10` before it does). Scanned command names carry the
      `<binary>` prefix; none of the ten contains `ados`, `ADOS_`, or `~/.ados`.
      `backlog.md` and `cli-command-registry.md` are not registered and are not
      literal-scanned (P42, AC-NFR9-1, NFR-9)
  aggregateGateAuthoritative:
    command: "mkdir -p \"$REPO_ROOT/tmp/tmpdir\" && TMPDIR=\"$REPO_ROOT/tmp/tmpdir\" pnpm check"
    tmpdir: "repository-local (repo/tmp/tmpdir), required because tests/checks/ci-baseline-parity.test.ts runs `git clone --local` and a tmpfs TMPDIR fails with a cross-device hardlink"
    expectation: >-
      exit 0, and this run is the authoritative gate. Any failure here —
      including a repeated TC-WIRE-002 timeout that the default run also showed
      — is a delivery failure; there is no environmental exemption for the
      repository-local run (P39, AC-NFR6-1(a))
    baseObserved: "repo_local_exit=0 (7133 pass, 4 skip, 0 fail, 7137 tests, 880 files, 480.99s)"
  aggregateGateRecorded:
    command: "env -u TMPDIR pnpm check"
    tmpdir: "default (environment TMPDIR)"
    expectation: >-
      recorded with its exit code, pass/skip/fail summary, and every failing
      test name, on the same head as the authoritative run. Only two
      default-run-only failures are excusable:
      tests/checks/ci-baseline-parity.test.ts and the TC-WIRE-002 5000 ms
      timeout in tests/checks/privacy-ci-wiring.test.ts. Each must be recorded
      AND re-run, and is excused only while `repo_local_exit=0` on the same
      head; any other default-run failure is a delivery failure to investigate
      (AC-NFR6-1(b)(c)(d), UG-1)
    baseObserved: "default_exit=1, default_failed_tests=2 (CI baseline parity (hermetic partial clone), TC-WIRE-002 timed out after 5000ms), default_failure_class=excused"
  aggregateGateRerunRecord:
    artifact: "/tmp/gh303/p39-rerun.txt (P39 `$SH/p39-rerun.txt`)"
    required: "whenever `default_failure_class=excused`, i.e. whenever a default-run failure is being excused"
    expectation: >-
      present and non-empty, naming each excused test with its isolation re-run
      result; P39 reports `rerun_recorded=yes (...)` and downgrades to
