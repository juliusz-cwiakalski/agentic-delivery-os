workItemRef: GH-303
tier:
  name: lite
  phases: [1, 2, 3, 4, 5, 6]
  escalationTriggers:
    - >-
      The product-file diff is not exactly the thirteen paths of Appendix C
      (twelve planning documents plus the forbidden-literals registry), or any
      path appears under doc/spec/, doc/overview/, doc/guides/, doc/templates/,
      packages/, tests/, .opencode/, .ai/, or scripts/ other than that one
      registry file (P34, NFR-1, AC-NFR1-1)
    - >-
      A backlog hunk falls outside the M2-S11 entry, the one added Epic M2
      context paragraph, or the two inserted entries; the block-closing blank
      line, the `---` separator, or the `## Epic M3` heading changes; or a
      third heading is added (P08, P10, P35, AC-F4-1, AC-F4-3, AC-NFR2-1)
    - >-
      The 26-clause clause table loses a row or any clause is missing, added, or
      softened; or M2-S11's retained state-scoping, host-index, migration, test,
      or collision clause is weakened, merged, or moved (P01, P02, P41,
      AC-F1-1, AC-F1-2, AC-NFR8-1)
    - >-
      The mixed-tracker clause is softened, or `not-yet-supported` is absent
      from either the S18 entry or contracts.md, or the validation-time /
      "rather than rejected" wording is missing (P04, AC-F2-2, RSK-4)
    - >-
      `projects list` survives anywhere as the flat enumeration, `repos` or
      `repos list` is used for a group, any of the seventeen matrix regions is
      empty or still carries a forbidden statement, or one of the six both-name
      prose locations does not state the boundary (P32, P33, P45, AC-F14-1,
      AC-F14-2, AC-NFR12-1, TP-6)
    - >-
      Either command page loses the exact header `Status: Proposed (M2)`, a page
      claims registration at the root listing, the flat surface appears on the
      projects page's contract pointers or envelope keys, or a page is
      relabelled as a snapshot (P20, P21, P36, AC-F7-2, AC-F7-3, AC-NFR3-1)
    - >-
      The flat contract is not named `repos.v1`, the group envelope carries a
      group-named key denoting a repository, or the configuration schema loses
      the optional workspace root or the mixed-kind rule (P14, P15, P16,
      AC-F6-1, AC-F6-2, AC-F6-3, RSK-3)
    - >-
      `registered` is not exactly 140 entries, the new row is not
      `doc/planning/oss-tooling/milestones/m2/commands/repos.md`, it is not
      between the `queue.md` and `spend.md` entries, a duplicate exists, or the
      guard reports an unregistered doc or a violation (P37, P42, AC-NFR4-1,
      AC-NFR9-1)
    - >-
      The guard's literal scan does not cover exactly the ten planning documents
      AC-NFR9-1 names, or a scanned document contains `ados`, `ADOS_`, or
      `~/.ados`, or a command name in a scanned document is not written with the
      `<binary>` prefix (P42, AC-NFR9-1, NFR-9)
    - >-
      A base status.md line is removed, reordered, or modified; an added line
      falls before the single blank separator line that precedes the one new
      section; more than one new `##` heading appears or any `##` heading follows
      it; the heading is not of the form `## <title> (2026-11-11)`; or the
      section claims delivery (P28, P29, P44, AC-F12-1, AC-F12-2, AC-NFR11-1)
    - >-
      The M2 pack contents table is not thirteen rows, the story-to-artifact map
      lacks an M2-S18 or M2-S19 row, the M2-S11 row does not point at `repos.v1`,
      the milestone M2 index row reaches fewer than thirteen targets, or the M0
      or M1 rows change (P26, P27, AC-F11-1, AC-F11-2)
    - >-
      The command registry keeps the old "distinct surfaces" boundary note, has
      no M2 `ados repos` row, attributes the group surface to the old
      workstation-overview meaning, leaves the M3-S6 row unattributed as later
      `repos` subcommands, or changes any row outside the four permitted regions
      (P30, P31, AC-F13-1, AC-F13-2)
    - >-
      A scenario seed lacks exactly one `Assert:` line or carries two, fewer
      than two S18 or two S19 seeds exist, an S11 seed still asserts a flat
      `projects list`, or an S18/S19 coverage anchor is missing (P22, P23,
      AC-F8-1, AC-F8-2)
    - >-
      The structural diagram read fails on any touched file: an odd fence count,
      an untagged diagram, a first body line outside the allowed keyword set,
      a duplicated C4 heading, or other than eight `###` headings under
      `## Key flows` each owning one block (P40, AC-NFR7-1, RSK-9)
    - >-
      The repository-local-TMPDIR full-suite `pnpm check` is non-zero — any
      failure there, including a repeated TC-WIRE-002 timeout, is a delivery
      failure; either aggregate run is left unrecorded; the re-run record for an
      excused default-run failure is missing; a default-run failure other than
      tests/checks/ci-baseline-parity.test.ts or the TC-WIRE-002 5000 ms timeout
      is present; or an excused pair is claimed without the repository-local run
      green on the same head (P39, AC-NFR6-1, UG-1)
    - >-
      `bash scripts/.tests/test-doc-distribution.sh` is non-zero under the
      default TMPDIR, or any planning document gains an `ados_distribution`
      marker (P38, AC-NFR5-1)
    - >-
      The spec or test plan is revised past the versions this plan cites, or the
      base advances past 5372dbac: re-read the reopened procedures, re-run P00
      and every affected gate, refresh the pins in this plan, and revise the
      plan rather than mixing revisions (TR-9)
