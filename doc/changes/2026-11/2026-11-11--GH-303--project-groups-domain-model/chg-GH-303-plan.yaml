  - id: 2
    title: "P2 — State the three-level model and define the group, flat, and change contracts"
    kind: delivery
    weightClass: standard
    summary: "docs(GH-303): state the three-level model and the three contract envelopes"
    goal: >-
      Make the model legible before any contract is read and give every command
      page and every new story one contract each: the architecture presents
      repository, project group, and optional workspace with declared membership,
      a group-scoped overview flow, a cross-repository change flow carrying one
      queue entry per member, and six boundary invariants, and it separates the
      discovery workspace root from the state layer's fixed `default`
      identifier; the contracts define `repos.v1` (flat record set, `data.repos[]`,
      `repoKey`), the retained delivered `projects.v1` as the alias payload, the
      group contract `project-groups.v1` (`data.groups[]`, `groupKey`), the single
      rename rule, the repository-vocabulary mapping clause, the project
      configuration document, the project-scoped aggregation clause, the
      queue/lane representation with its release rule, and the cross-repository
      change plan shape with its `verify gates` and `closeout.data.members[]`
      envelopes. [F-5, F-6, DM-2..DM-11, DEC-19..DEC-27, DEC-31, DEC-32]
    scope:
      files:
        - doc/planning/oss-tooling/milestones/m2/architecture.md
        - doc/planning/oss-tooling/milestones/m2/contracts.md
    interactions:
      - kind: contract-file
        target: doc/planning/oss-tooling/milestones/m2/contracts.md
        role: producer
    dependsOn:
      - phase: 1
        reason: "The contracts and the architecture cite M2-S11, M2-S18, and M2-S19 by story code, and the S18 entry is where the mixed-tracker clause lives that P05 checks."
    constraints:
      - "Architecture: keep the three committed C4 headings `## C4 Level 1: system context`, `## C4 Level 2: containers`, `## C4 Level 3: components`, exactly once each, each immediately followed by one mermaid block whose first body line starts with an allowed diagram keyword; the C4 Level 1 context draws repository (delivery unit), project group (configured group of repositories), and workspace (optional discovery root) with the optionality visible in the diagram and the prose (AC-F5-1)."
      - "Architecture prose: a group's membership is declared in configuration, a directory scan only locates declared members and never admits an undeclared clone, a workspace is never required, and a group whose members live in unrelated directories behaves identically to one whose members share a root (AC-F5-2)."
      - "Architecture flows: the overview flow is group-scoped; `### Cross-repository change` names one queue entry per member with per-member dependency edges; `## Key flows` carries exactly eight `###` headings, each owning exactly one mermaid block (AC-F5-3, AC-NFR7-1)."
      - "Architecture invariants: `## Boundary invariants at M2 exit` states the naming boundary by reference to the rename rule, configuration-only membership, one queue entry per member, the release rule, workspace optionality, and one lifecycle per cross-repository change (six invariants)."
      - "Architecture workspace sentence: one sentence distinguishes the discovery workspace root (an optional directory) from the state layer's fixed `default` workspace identifier (the workspace key inside every per-checkout state root), and no sentence collapses the two (AC-F5-4)."
      - "Contracts `repos.v1`: the flat record set as `data.repos[]` with `repoKey`, `root`, `stateLocation`, `daemonReachable` (closed reason set plus the `unbound` scope), `handoverState`, and `hostIndexRevision`; records the rename from the delivered surface; attributes the surface to M2-S18; carries the mapping clause; makes no group claim (AC-F6-1, DEC-20)."
      - "Contracts `projects.v1`: the delivered flat record set (`data.projects[]`, `projectKey`, `hostIndexRevision`), named as the payload the `projects list --flat` alias returns; no sentence describes it as the group contract and no field of it denotes a group (AC-F6-3, DEC-19)."
      - "Contracts `project-groups.v1`: `data.groups[]` with `groupKey` as the group identity, `name`, the optional `workspaceRoot`, and `members[]` each carrying `repoKey`, `root`, `trackerKind`, `state`, `health`, and `daemonReachable`; a member field never denotes the group and no group-named field denotes a repository; `projectKey` may appear only to deny it (AC-F6-2, DEC-19, DEC-22, TP-7)."
      - "Contracts rename rule: the sentence appears exactly once, verbatim in substance — from M2-S18, `projects list` enumerates groups and `repos list` enumerates the flat record set; the deprecation alias is the different token `projects list --flat`, owned by M2-S18, returning the delivered `projects.v1` payload (`data.projects[]`) and retiring at the M3 boundary. Every other location references it (AC-F6-4, DEC-21)."
      - "Contracts mapping clause: one clause states that `project-identity.json`, `<host root>/projects/<key>`, the host index's `projects[]`/`projectKey` fields, and `--project-root` each denote a repository checkout and keep that meaning permanently unless a code change renames them; the clause is carried in the `repos.v1` section (and later on both command pages) (AC-F6-5, DM-11)."
      - "Contracts configuration document: path `<configDirectoryName>/projects.yaml`, schema `delivery.projects.groups.v1`, `groups[]` with `groupKey`, `name`, optional `workspaceRoot`, and `members[]` with a repository selector (`root` or `repoKey`) plus `trackerKind`; membership is configuration-only; a scan inside `workspaceRoot` locates declared members only and never admits an undeclared clone; mixed tracker kinds are valid at validation time (AC-F6-6, DEC-23)."
      - "Contracts aggregation: members from configuration in declared order; the per-member outcomes `observed`, `not-yet-supported`, `state-unavailable`, `unregistered`; one `state-unavailable` member yields a classified partial result at exit 0 with `partial` true and the degraded member named; exit 2 only when the configuration document or the invoking scope cannot be read; a `not-yet-supported` member contributes no records and never fails the read (AC-F6-7, DEC-24)."
      - "Contracts queue/lane: one queue entry per member keyed by that member's ref; per-member dependency edges; release drops each member lease while entries stay; removal is per member with the change's reason; one member's landing removes only its entry; one lane per member entry and never a cross-repository lane (AC-F6-8, DEC-27)."
      - "Contracts change plan shape: `plan.data.members[]` (repoKey, slice, branch, pullRequest, dependsOn[], gates), per-member gates, the executable one-review-flow definition, the shared verdict at `verify gates` (`data.definitionOfDone`, `data.blockingMembers[]`), `closeout.data.members[]` (repoKey, branch, cleanup, pullRequest, issueClosure, landed), per-member CI corroboration, dependency ordering, and evidence enumerating every member pull request in landing order (AC-F3-4, AC-F6-9, DEC-31, DEC-32)."
      - "Planned-until-exit posture: both files describe required shapes for undelivered stories and claim no delivered group or cross-repository surface. The flat contract keeps the delivered GH-288 facts it already records (the closed daemon reason vocabulary, the `unbound` scope, the exit projection, the host-root state layout) and never presents the group surface as shipped."
      - "Mermaid edits must keep every fence balanced; there is no validator, so the structural read is the bar (AC-NFR7-1). No conflict marker may remain in either file."
