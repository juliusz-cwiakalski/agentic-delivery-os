revision:
  version: "1.4"
  revisedAt: "2026-11-11"
  supersedes: "1.3"
  driver: >-
    Spec v1.4 and test plan v1.4 after the review-board remediation: the corpus
    is re-keyed to a three-level model on one naming surface (group contract
    `project-groups.v1` / `data.groups[]` / `groupKey`; delivered flat payload
    `projects.v1` / `data.projects[]` / `projectKey`; planned flat surface
    `repos list` / `repos.v1` / `data.repos[]` / `repoKey`), one rename rule with
    the `projects list --flat` alias owned by M2-S18 and retired at the M3
    boundary, one repository-vocabulary mapping clause, configuration-only
    membership with an undeclared-clone seed, a classified partial aggregation,
    one queue entry per member with the release rule, a repository-key board
    boundary, verifiable M2-S19 obligations, and a registry split under the
    ODR-0003 lock.
  scope: >-
    Re-planned rather than patched: the AC set grew from 45 to 69 (56 functional
    + 13 non-functional) and the product-file budget from 13 to 15 (fourteen
    planning documents — thirteen modified plus the new
    `milestones/m2/commands/repos.md` — plus the one
    `forbidden-literals.registry.json` row). The phase model is unchanged in
    shape and re-balanced in scope: P1 backlog (1), P2 architecture + contracts
    (2), P3 the four command pages + seeds + journeys + entrypoint delta (7),
    P4 the registry row (1), P5 the two indices + status + command registry (4)
    and the full battery, P6 conditional remediation. Every AC and every TC is
    claimed exactly once; the coverage matrix totals 69/69. No gate pins a
    measurement: the P15/P16 gate contract is honoured verbatim, and every
    re-baselined value below is taken from test plan v1.4 §6/§10, never from
    memory or from a previous plan revision.
  boardProvenance:
    source: >-
      Six-critic external review board on PR #306, recorded in spec §25,
      Appendix A.2, and test plan §2 as the normative source for the derived
      clauses.
    critics:
      - "CTO"
      - "API Integration Engineer"
      - "Domain Expert"
      - "QA Engineer"
      - "SRE"
      - "Technical Writer"
    verdict:
      blockingFindings: 6
      shouldFixFindings: 10
      cheapNotes: 2
      derivedClauses: 32
      clauseOracle: "spec Appendix A.2 (BRD-1..BRD-32)"
    decisions:
      A:
        id: DEC-19
        text: >-
          The group contract is `project-groups.v1` with top-level
          `data.groups[]` and the group identity field `groupKey`; `projects.v1`
          keeps its delivered flat record set (`data.projects[]`,
          `projectKey`) and is never reused for groups.
      B:
        id: DEC-20
        text: >-
          The flat surface is `repos list --json` returning `repos.v1` with
          `data.repos[]` and the record field `repoKey`.
      C:
        id: DEC-21
        text: >-
          One rename rule stated once: from M2-S18 `projects list` enumerates
          groups and `repos list` enumerates the flat record set; the
          deprecation alias is the different token `projects list --flat`,
          returning the delivered `projects.v1` payload, owned by M2-S18 and
          retired at the M3 boundary, carrying an S18 acceptance criterion, a
          shape-asserting seed, and the migration-guide task.
      D:
        id: DEC-22
        text: >-
          A group's identity field is `groupKey`; `projectKey` is never a group
          identity.
    p6Opening: >-
      P6 opens with the board verdict: its first act is to re-read the recorded
      review-board findings (PR #306, blocking 1-6, should-fix 7-16, cheap notes
      17-18, decisions A-D) together with the local review verdict, and to
      remediate only the defects those verdicts name. A remediation that is not
      traceable to a named finding is out of scope for P6.
