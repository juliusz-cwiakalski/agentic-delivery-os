  - id: 6
    title: "P6 — Conditional review remediation"
    kind: delivery
    weightClass: standard
    summary: "docs(GH-303): apply review remediation"
    goal: >-
      Close the file-level findings of a `@reviewer` FAIL verdict (or an
      accepted `@readiness-reviewer` blocker that names a product file) inside
      the change's existing product budget, without adding a product path and
      without weakening any gate. This phase stays CLOSED unless a review
      verdict names a defect in one of the thirteen product files; it is
      declared so remediation is a planned phase rather than an undeclared
      commit.
    scope:
      files:
        - doc/planning/oss-tooling/backlog.md
        - doc/planning/oss-tooling/milestones/m2/architecture.md
        - doc/planning/oss-tooling/milestones/m2/contracts.md
