# GH-303 implementation plan — amend the M2 plan to a three-level domain model
# (repository, project group, optional workspace) with project groups and
# cross-repository changes, on one naming surface where each spelling has exactly
# one meaning.
#
# Plan revision: v1.4 (2026-11-11). Rebuilt against spec v1.4 (69 ACs: 56
# functional + 13 non-functional, DM-1..DM-13, DEC-1..DEC-32, Appendix A.1
# 26 ticket clauses, Appendix A.2 32 board-derived clauses, Appendix B 21-row
# naming and identity matrix, Appendix C 15-file manifest, Appendix D gate
# record) and test plan v1.4 (69 TCs TC-M2DOM-001..069, procedures P00..P69 in
# §7.1, §7.2 TC -> procedure map, §1.2 declared gaps G-1..G-10, §6 base-observed
# versus fixture-observed expectations plus the binding "Plan-gate contract for
# P15/P16" row, §8.4 interpretation decisions TP-1..TP-10, §10 sweep log).
# Revision provenance, the board decisions, and the fixed defects are declared
# under `revision:`.
#
# Merged truth at this base: the change base `723454e4` is `main-tools` with
# GH-288 / PR #305 merged. M2-S11 is delivered, the flat `projects list` has
# shipped and is mounted, and current truth (feature-projects,
# feature-cli-entrypoint, the migration guide, TDR-0022) describes that shipped
# behaviour. This change's planning corpus records the prospective split: from
# M2-S18 `projects list` enumerates groups (`project-groups.v1`, `data.groups[]`,
# `groupKey`), `repos list` enumerates the flat record set (`repos.v1`,
# `data.repos[]`, `repoKey`), the delivered `projects.v1` payload
# (`data.projects[]`, `projectKey`, `hostIndexRevision`) survives as the payload
# of the `projects list --flat` alias owned by M2-S18 and retired at the M3
# boundary, and `projectKey` is never a group identity. Every delivered GH-288
# fact is a preservation obligation, never an edit target (AC-F1-1, AC-F1-2,
# AC-F2-1, AC-F6-3, AC-F7-1, AC-F7-3, AC-F10-1, AC-F12-1, AC-F13-1,
# AC-NFR3-1, AC-F14-2, DEC-18, DEC-19..DEC-22).
#
# Sources (single source of truth):
#   - Spec: ./chg-GH-303-spec.md v1.4 — F-1..F-14, NFR-1..NFR-13, DM-1..DM-13,
#     DEC-1..DEC-32, RSK-1..RSK-21, AC-F1-1..AC-F14-3, AC-NFR1-1..AC-NFR13-1,
#     §17.3 DoD, Appendices A-D.
#   - Test plan: ./chg-GH-303-test-plan.md v1.4 — 69 TCs and 69 procedures
#     P00..P69, §3.1/§3.3 one-to-one AC <-> TC coverage, §5.1/§5.2 scenarios,
#     §6 base-observed and fixture-observed facts plus the P15/P16 gate
#     contract, §7.1 procedure pack, §7.2 mapping, §7.3 triage, §8.4 TP-1..TP-10,
#     §10 execution log (base 0/69, conforming fixture 68/69 — the single
#     non-PASS is the aggregate gate P62, recorded as a delivery-time
#     obligation).
#   - PM notes: ./chg-GH-303-pm-notes.yaml — docs-only autonomous delivery and
#     the recorded repository/guard/TMPDIR facts.
#   - Ticket: juliusz-cwiakalski/agentic-delivery-os#303 — normative clause
#     source for the M2-S11 amendment and the S18/S19 story text.
#   - Base revision: 723454e4. Every preservation oracle compares against it.
#
# Change shape: docs-only. Exactly fifteen product files change — fourteen under
# doc/planning/oss-tooling/** (thirteen modified plus the new
# milestones/m2/commands/repos.md) and
# scripts/checks/forbidden-literals.registry.json (one registration row,
# 141 -> 142). Per-phase scope is disjoint and sums to fifteen:
#   P1 backlog.md ....................................................... (1)
#   P2 architecture.md + contracts.md ................................... (2)
#   P3 commands/repos.md (new) + commands/projects.md + commands/queue.md
#      + commands/board.md + test-scenarios.md + journeys.md
#      + entrypoint-delta.md ............................................ (7)
#   P4 forbidden-literals.registry.json (one row) ....................... (1)
#   P5 m2/README.md + milestones/README.md + status.md
#      + cli-command-registry.md + the full verification battery ........ (4)
#   P6 conditional review remediation (no product path of its own) ...... (0)
# No file appears in two phases. No file changes under doc/spec/**,
# doc/overview/**, doc/guides/**, doc/templates/**, packages/**, tests/**,
# .opencode/**, .ai/**, or any other scripts/** path, and
# milestones/m1/commands/status.md is byte-identical (AC-NFR1-1, AC-F7-9,
# AC-NFR3-1). The workflow phase `system_spec_update` records "no current-truth
# change required" and edits nothing (DEC-17).
#
# Forbidden-literal constraint (AC-NFR9-1, NFR-9): the guard literal-scans only
# the registered documents absent at `corpusBaseline`, so exactly twelve of the
# fourteen planning documents are scanned — `milestones/README.md`,
# `m2/README.md`, `m2/architecture.md`, `m2/contracts.md`,
# `m2/commands/projects.md`, the new `m2/commands/repos.md`,
# `m2/commands/queue.md`, `m2/commands/board.md`, `m2/test-scenarios.md`,
# `m2/journeys.md`, `m2/entrypoint-delta.md`, and `status.md`. Each must contain
# zero occurrences of `ados`, `ADOS_`, and `~/.ados` and must write every command
# name with the `<binary>` prefix. `backlog.md` and `cli-command-registry.md` are
# unregistered and present at `corpusBaseline`, so they are not literal-scanned;
# NFR-9(c)'s ban on private fleet, repository, host, hosted, or proprietary names
# still applies to their new text. The constraint is declared in P1, P2, P3, and
# P5, gated by P60 at P4 and by P65 at P5.
#
# Six phases, one Conventional Commit each via the `commit` primitive; no
# hand-authored git command, no manual staging, no phase-state edit. Five phases
# are unconditional; P6 is the conditional post-review remediation phase and
# opens with the review-board verdict (see `revision.boardProvenance`).
#
# Ordering note (binding, see orderingConstraints): P4 is sequenced immediately
# after P3 because the forbidden-literals guard fails closed on an unregistered
# user-facing document, so from the moment m2/commands/repos.md exists until its
# registration lands the guard — and therefore `pnpm check` — is red by
# construction. P3 and P4 land back-to-back with no intervening commit, and P3
# claims no guard gate. Every other phase boundary is guard-green.
#
# TC mapping (all 69, each claimed exactly once; TC <-> AC is 1:1 per test plan
# §3.1, so AC coverage is the same partition):
#   P1 (15): 001, 002, 003, 004, 006, 007, 008, 010, 011, 012, 014, 015, 016,
#            017, 058
#   P2 (13): 005, 013, 018, 019, 020, 021, 022, 023, 024, 027, 028, 029, 030
#   P3 (17): 026, 031, 032, 033, 034, 035, 036, 037, 038, 040, 041, 042, 043,
#            044, 045, 046, 047
#   P4 ( 1): 060
#   P5 (23): 009, 025, 039, 048, 049, 050, 051, 052, 053, 054, 055, 056, 057,
#            059, 061, 062, 063, 064, 065, 066, 067, 068, 069
#   P6 ( 0 claimed): re-proves without re-claiming; a remediated artifact's TC
#            moves to P6 only if the remediation re-delivers it, and the plan is
#            revised in the same commit so the mapping stays 69/69 exactly once.
# (15+13+17+1+23 = 69; set difference against 001..069 is empty.)
#
# This plan declares phases, scope, goals, gates, and done-conditions only. It
# records no progress and carries no task log: phase state belongs in
# chg-GH-303-pm-notes.yaml, progress in a pm-notes `notes:` entry.
