# GH-303 implementation plan — amend the M2 plan to a three-level domain model
# (repository, project, optional workspace) with project groups and
# cross-repository changes.
#
# Plan revision: v1.2 (2026-11-11). Aligned to spec v1.2 (45 ACs: 33 functional
# + 12 non-functional, Appendix A 26-clause oracle, Appendix B 16-row naming
# matrix walked as 17 regions, Appendix C 13-file manifest — 11 modified plus 1
# new plus the registry row, Appendix D gate record with the repository-local
# run authoritative; AC-NFR9-1 pins the forbidden-literal scanned set to exactly
# ten documents with zero seed literals) and test plan v1.2 (45 TCs
# TC-M2DOM-001..045, procedures P00..P45 in §7.1, §8.4 interpretation decisions
# TP-1..TP-8, §6 base-observed versus fixture-derived expectations plus the
# binding "Plan-gate contract for P09/P10" row that separates the gated
# invariants from the non-gated measurements, §10 base-tree and
# conforming-fixture log).
# Revision history and the fixed DoR findings are declared under `revision:`.
#
# Sources (single source of truth):
#   - Spec: ./chg-GH-303-spec.md v1.2 — F-1..F-14, NFR-1..NFR-12, DM-1..DM-8,
#     DEC-1..DEC-17, RSK-1..RSK-12, AC-F1-1..AC-F14-2, AC-NFR1-1..AC-NFR12-1,
#     §17.3 DoD, Appendices A-D. AC-NFR9-1 is the literal-scan pin: exactly ten
#     registered planning documents are literal-scanned, `backlog.md` and
#     `cli-command-registry.md` are not.
#   - Test plan: ./chg-GH-303-test-plan.md v1.2 — 45 TCs, procedures P00..P45 in
#     §7.1, §7.2 TC -> procedure map, §1.2 declared gaps G-1..G-10, §8.4
#     interpretation decisions TP-1..TP-8, §6 expectation classes plus the
#     "Plan-gate contract for P09/P10" row quoted below, §10 base-tree execution
#     log plus the conforming-fixture run of every changed procedure.
#   - PM notes: ./chg-GH-303-pm-notes.yaml — docs-only autonomous delivery, the
#     `repos`/M3-S6 name resolution, the entrypoint-delta reading, the derived
#     index and registry scope, the flat-envelope contract name, and the
#     observed guard/TMPDIR facts.
#   - Ticket: juliusz-cwiakalski/agentic-delivery-os#303 — normative clause
#     source for the M2-S11 amendment and the S18/S19 story text.
#   - Base revision: 5372dbac (= origin/main-tools). Every preservation oracle
#     compares against it. Branch: docs/GH-303/project-groups-domain-model.
#
# Change shape: docs-only. Exactly thirteen product files change — twelve under
# doc/planning/oss-tooling/** (eleven modified plus the new
# milestones/m2/commands/repos.md) and scripts/checks/forbidden-literals.registry.json
# (one registration row, 139 -> 140). Per-phase scope: P1 backlog (1), P2
# architecture + contracts (2), P3 the two command pages + seeds + journeys +
# entrypoint delta (5), P4 the registry row (1), P5 the two indices + status +
# command registry (4); the sets are disjoint and sum to 13. No file changes
# under doc/spec/**, doc/overview/**, doc/guides/**, doc/templates/**,
# packages/**, tests/**, .opencode/**, .ai/**, or any other scripts/** path, and
# `milestones/m2/commands/board.md` is deliberately out of scope and unedited
# (its `projects[]` reconciliation is a deferred item recorded in test plan §8.4
# TP-7 and in this plan's P5 constraint; spec §7.3 defers only board *scoping*
# to M2-S4 and never names the page). The workflow
# phase `system_spec_update` records "no current-truth change required" and edits
# nothing (DEC-17, NFR-1). doc/changes/** artifacts are change evidence and
# never count toward the 13-file budget.
#
# Forbidden-literal constraint (AC-NFR9-1, NFR-9): the guard literal-scans only
# the registered documents absent at `corpusBaseline`, so exactly ten of the
# twelve planning documents are scanned — `milestones/README.md`,
# `milestones/m2/README.md`, `milestones/m2/architecture.md`,
# `milestones/m2/contracts.md`, `milestones/m2/commands/projects.md`, the new
# `milestones/m2/commands/repos.md`, `milestones/m2/test-scenarios.md`,
# `milestones/m2/journeys.md`, `milestones/m2/entrypoint-delta.md`, and
# `status.md`. Each of the ten must contain zero occurrences of `ados`, `ADOS_`,
# and `~/.ados` and must write every command name with the `<binary>` prefix.
# `backlog.md` and `cli-command-registry.md` are NOT registered and therefore not
# literal-scanned; NFR-9(c)'s ban on private fleet, repository, host, hosted, or
# proprietary names still applies to their new text. The constraint is declared
# in P1..P3 and P5 and gated by P42 at P4, P5, and P6.
#
# Six phases, one Conventional Commit each via the `commit` primitive; no
# hand-authored git command, no manual staging, no phase-state edit. Five phases
# are unconditional and map one-to-one onto the requested deliverable set; P6 is
# the conditional post-review remediation phase and stays closed unless a review
# verdict names a product-file defect.
#   P1  backlog.md (S11 amendment, context paragraph, S18 + S19)      (a)
#   P2  architecture.md + contracts.md                                (b)
#   P3  commands/repos.md (new) + commands/projects.md + seeds +
#       journeys.md + entrypoint-delta.md                             (c)
#   P4  forbidden-literals.registry.json (one row)                    (e)
#   P5  m2/README.md + milestones/README.md + status.md +
#       cli-command-registry.md + the final verification battery      (d)
#   P6  conditional review remediation (opened only on a FAIL verdict)
#
# Ordering note (binding, see orderingConstraints): the requested deliverable
# set lists the indices/status/registry commit before the forbidden-literals row.
# That order is not executable here: the guard fails closed on an unregistered
# user-facing doc, so from the moment milestones/m2/commands/repos.md exists
# (P3) until its registration lands (P4) the forbidden-literals guard and
# therefore `pnpm check` are red by construction. P4 is sequenced immediately
# after P3, P3 and P4 land back-to-back with no intervening commit, and P3
# claims no guard gate. Every other phase boundaries on a guard-green tree. This
# plan's order is authoritative for execution and supersedes the recommended
# commit sequence in spec §18 for this delivery; no oracle depends on commit
# order (TP-8, test plan §8.4).
#
# TC mapping (all 45, each claimed exactly once; TC <-> AC is 1:1 per test plan
# §3.1, so AC coverage is the same partition):
#   P1 (10): 001, 002, 003, 005, 006, 008, 009, 010, 035, 041
#   P2 (10): 004, 007, 011, 012, 013, 014, 015, 016, 017, 040
#   P3 ( 8): 019, 020, 021, 022, 023, 024, 025, 036
#   P4 ( 1): 037
#   P5 (16): 018, 026, 027, 028, 029, 030, 031, 032, 033, 034, 038, 039, 042,
#            043, 044, 045
#   P6 ( 0 claimed): re-proves without re-claiming; a remediated artifact's TC
#            moves to P6 only if the remediation re-delivers it, and the plan is
#            revised in the same commit so the mapping stays 45/45 exactly once.
# (10+10+8+1+16 = 45; set difference against 001..045 is empty.)
#
# This plan declares phases, scope, goals, gates, and done-conditions only. It
# records no progress and carries no task log: phase state belongs in
# chg-GH-303-pm-notes.yaml, progress in a pm-notes `notes:` entry.
