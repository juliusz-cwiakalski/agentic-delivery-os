gateCommands:
  planSchema:
    command: "./node_modules/.bin/delivery-os plan validate GH-303"
    expectation: "verdict=valid, readyForDevelopment=true, totalErrors=0"
  planConformance:
    command: "./node_modules/.bin/delivery-os lint GH-303"
