commitConvention:
  oneCommitPerPhase: true
  subjectTemplate: "docs(GH-303): followed by the phase's one-line summary"
  mechanism: "the `commit` primitive, driven by the phase `summary`; never a hand-authored git command"
  forbidden:
    - "manual `git add` / `git commit` / `git stash`"
    - "hand-edited phase state or completion markers"
    - "a second commit inside one phase to hide a failed gate"
  phaseState: "`phase complete GH-303 delivery` at the lifecycle boundary; `phase list` to read state"
gateCommands:
  planSchema:
    command: "./node_modules/.bin/delivery-os plan validate GH-303"
    expectation: "verdict=valid, readyForDevelopment=true, totalErrors=0"
  planConformance:
    command: "./node_modules/.bin/delivery-os lint GH-303"
    expectation: "exit 0 (pm-notes and plan conformance)"
  planWriteConformance:
    command: "./node_modules/.bin/delivery-os lint plan GH-303"
    expectation: "verdict=valid with no error entry (write-time plan conformance)"
  containment:
    command: "none — P57 is the containment oracle"
    expectation: >-
      `plan diff` is not usable in this checkout: the composed runtime returns an
      unreadable diff port, so the command is declared unavailable rather than
      declared green. P57's base..worktree manifest (base revision versus the
      working tree, filtered to product paths) is the authoritative containment
      check and is decidable at the P5 boundary; the committed range is reported
      separately as `post_commit_check` after the P5 commit. The reviewer
      re-reads the diff at phase 8.
  docDistribution:
    command: "env -u TMPDIR bash scripts/.tests/test-doc-distribution.sh"
    tmpdir: "default (unset / environment TMPDIR)"
    expectation: "exit 0; `planning_markers=0` (P61)"
  forbiddenLiterals:
    command: "bun run scripts/checks/forbidden-literals.ts"
    expectation: >-
      exit 0; `registered=142` against `base_registered=141` (`delta=1`); the new
      row is `doc/planning/oss-tooling/milestones/m2/commands/repos.md` placed
      between the `queue.md` and `spend.md` entries; `duplicates=0`;
      `failures=0`; `violations=0`; `seed_hits=0`; and the literal scan covering
      exactly the twelve planning documents AC-NFR9-1 names
      (`set_scanned=12/12`, `exempt_scanned=0`, `exempt_unregistered=2`). Scanned
      command names carry the `<binary>` prefix. `backlog.md` and
      `cli-command-registry.md` are unregistered and not literal-scanned (P60,
      P65, AC-NFR4-1, AC-NFR9-1)
  aggregateGateAuthoritative:
    command: "mkdir -p \"$REPO_ROOT/tmp/tmpdir\" && TMPDIR=\"$REPO_ROOT/tmp/tmpdir\" pnpm check"
    tmpdir: "repository-local (repo/tmp/tmpdir), required because tests/checks/ci-baseline-parity.test.ts runs `git clone --local` and a tmpfs TMPDIR fails with a cross-device hardlink"
    expectation: >-
      exit 0, and this run is authoritative. Any failure here — including a
      repeated TC-WIRE-002 timeout — is a delivery failure; there is no
      environmental exemption for the repository-local run (P62,
      AC-NFR6-1(a), UG-1)
    observedAtPlanTime: >-
      red on this host (test plan §1.2 G-6, §10: `repo_local_exit=1`, a
      wall-clock timeout under a sibling delivery's load), recorded as a
      delivery-time obligation, never as an excuse
  aggregateGateRecorded:
    command: "env -u TMPDIR pnpm check"
    tmpdir: "default (environment TMPDIR)"
    expectation: >-
      recorded with its exit code, pass/skip/fail summary, and every failing test
      name, on the same head as the authoritative run. Only two default-run-only
      failures are excusable: tests/checks/ci-baseline-parity.test.ts and the
      TC-WIRE-002 5000 ms timeout in tests/checks/privacy-ci-wiring.test.ts. Each
      must be recorded AND re-run, and is excused only while
      `repo_local_exit=0` on the same head; any other default-run failure is a
      delivery failure to investigate (P62, AC-NFR6-1(b)(c)(d), UG-1)
  aggregateGateRerunRecord:
    artifact: "/tmp/gh303/p62-rerun.txt (P62 `$SH/p62-rerun.txt`)"
    required: "whenever a default-run failure is being excused"
    expectation: >-
      present and non-empty, naming each excused test with its isolation re-run
      result; P62 reports `rerun_recorded=yes (...)` and downgrades to
      `missing-rerun` (a FAIL) when the record is absent (AC-NFR6-1(c))
  tmpdirRule: >-
    The two guards have opposite TMPDIR requirements in this environment and are
    invoked per guard as above: the distribution guard with the default TMPDIR
    (it is the classic guard and needs no cross-device clone), the aggregate gate
    with a repository-local TMPDIR (it is authoritative). The environment is
    never changed to make a guard pass, no carve-out is claimed while the
    repository-local run is red, and both aggregate runs are recorded in the
    delivery evidence (DEC-16, NFR-5, NFR-6).
orderingConstraints:
  - "P1 -> P2 -> P3 -> P4 -> P5. P3 and P4 are adjacent by construction: the forbidden-literals guard fails closed on the new page between them, so P3 claims no guard gate and the pair lands back-to-back with no intervening commit."
  - "P2 precedes P3 because the four command pages, the seeds, and the journey point at `repos.v1`, `project-groups.v1`, the alias rule, the configuration document, and the aggregation clause that P2 lands; a forward reference would make P26/P36/P42 fail at the P3 boundary."
  - "P1 precedes P2 in commit order because P2's map rows and contracts cite the story codes M2-S11/M2-S18/M2-S19 and the S18 entry is where the mixed-tracker clause lives that P05 checks."
  - "P5 runs last because P57's base..worktree containment oracle needs all fifteen product files present, and P25/P54/P55/P56/P68/P69 need every planning document in place; P57 does not require a clean worktree, and the committed range is checked separately as `post_commit_check`."
  - "P6, when opened, runs after the review verdict and before the PR; it adds no product path and no phase except itself."
  - "`plan diff` is unavailable in this checkout (the composed runtime returns an unreadable diff port), so P57's base..worktree manifest is the sole containment oracle; the reviewer additionally re-reads the change diff at phase 8."
crossArtifactResolutions:
  note: >-
    The test plan flags ten places where two artifacts pull in different
    directions (TP-1..TP-10, test plan §8.4). Each is resolved here by naming the
    governing AC/TC and the phase that owns the gate; none is silently absorbed
    and none requires a further spec change.
  TP-1:
    tension: "AC-F12-2 and AC-NFR11-1 both govern status.md line retention, so a naive mapping yields two test cases over one predicate."
    governing: "AC-F12-2 (TC-M2DOM-051) and AC-NFR11-1 (TC-M2DOM-067)."
    resolution: >-
      Kept as two TCs by predicate, not collapsed: TC-051 owns presence, order,
      and addition confinement; TC-067 owns byte identity plus the oracle's
      soundness (delete, modify, swap, outside-insertion mutants) with an
      explicit "no whole-section cmp" clause. Both are claimed at P5 because
      status.md lands there, and both are gated as a pair.
  TP-2:
    tension: "AC-F3-4 and AC-F6-9 both describe the cross-repository change plan shape in contracts.md."
    governing: "AC-F3-4 (TC-M2DOM-013) and AC-F6-9 (TC-M2DOM-030)."
    resolution: >-
      Split by direction inside P2: TC-013 asserts the field inventory
      (`plan_shape_fields=16/16`) and TC-030 asserts the behavioural clauses
      (`plan_shape_behaviour=11/11` — review flow, CI corroboration, ordering,
      evidence). The S19 entry lands in P1 but AC-F3-4 cannot pass before
      contracts.md exists, so its TC is owned by P2; the overlap is declared, not
      double-counted.
  TP-3:
    tension: "AC-F7-7 forbids the flat surface on the projects page while AC-F14-2 requires every both-name location to state the boundary, so a literal word ban on `repos` would make the two criteria mutually unsatisfiable."
    governing: "AC-F7-7 (TC-M2DOM-037) and AC-F14-2 (TC-M2DOM-055)."
    resolution: >-
      The projects page MUST name the flat surface in its boundary and alias
      pointers; the ban is on attaching the flat envelope to the group page.
      P37 therefore tests envelope tokens (`repos.v1`, `data.repos[]`,
      `project-groups.v1`, `data.groups[]`), not the bare word, and P55
      positively requires the boundary statement at the six both-name prose
      locations.
  TP-4:
    tension: "NFR-7 states `## Key flows` holds exactly eight `###` headings while the base tree has seven."
    governing: "AC-NFR7-1 (TC-M2DOM-063), with AC-F5-3 (TC-M2DOM-020)."
    resolution: >-
      Seven to eight is the derived consequence of the new cross-repository flow,
      not an unexplained constant. P20 proves the flow exists at P2 and P63
      records `key_flows_headings=8/8` over the touched set at P5; a missing flow
      therefore fails as a count mismatch. P63 is claimed at P5 and re-run there
      over the full set without re-claiming TC-020.
  TP-5:
    tension: "F-12/AC-F12-1 fix neither the new status section's title nor its exact date text."
    governing: "AC-F12-1 (TC-M2DOM-050) and AC-F12-2 (TC-M2DOM-051)."
    resolution: >-
      The plan constrains the heading form and the date, not the title string:
      the section is the only `## ` heading present in the head and absent from
      the base, no `##` heading follows it, and the heading matches
      `^## .+ \(2026-11-11\)$`. P50 gates `new_section_count=1`,
      `headings_after_new_section=0`, `section_anchors=14/14`, and
      `delivery_claim=0`; its line number is an observation, never a gate value.
  TP-6:
    tension: "AC-F14-2's 'every location that names both surfaces' versus Appendix B's two index rows."
    governing: "AC-F14-2 (TC-M2DOM-055), with AC-F11-1/AC-F11-2 (TC-048/TC-049)."
    resolution: >-
      P55 owns the six both-name prose locations (`backlog.md`, `contracts.md`,
      the projects page, `test-scenarios.md`, `journeys.md`, and the new
      `status.md` section) and gates `disambiguated_pages=6/6`. P48/P49 own the
      two index rows as row and link coverage only.
  TP-7:
    tension: "AC-F6-2's 'a member field never denotes the group, and no group-named field denotes a repository' versus a section that must mention `projectKey` to deny it."
    governing: "AC-F6-2 (TC-M2DOM-023)."
    resolution: >-
      P23 bans only affirmations (`projectKey … is/denotes the group identity`)
      and positively requires the two denial statements; the section may name the
      token to deny it. The ban is scoped to the `## project-groups.v1` section,
      not applied corpus-wide.
  TP-8:
    tension: "AC-F14-1 sanctions 'statements recording delivered GH-288 facts', while AC-F14-3 sets a zero count on old-identity affirmations."
    governing: "AC-F14-1 (TC-M2DOM-054), AC-F14-3 (TC-M2DOM-056), AC-NFR13-1 (TC-M2DOM-069)."
    resolution: >-
      P54 sanctions four classes — the time-scoped disambiguation, a GH-288
      fact, the alias definition, and the delivered enumeration AC that F-1 keeps
      — and requires both direction fixtures to keep biting. P56/P69 count only
      affirmations of the wrong identity, never the delivered surface's own name.
  TP-9:
    tension: "AC-NFR6-1's 'repository-local TMPDIR' versus this environment, where the repository lives on a normal filesystem but the fixture lives under tmpfs."
    governing: "AC-NFR6-1 (TC-M2DOM-062)."
    resolution: >-
      P62 is a delivery-time gate: it requires a record taken on a real install
      with a repository-filesystem `TMPDIR`, binds it to a code-tree fingerprint
      (NFR-1 forbids code changes, so docs cannot alter the suite's result) and
      to a change-presence check, and classifies per the AC. The plan records the
      observed red run rather than weakening the criterion (UG-1).
  TP-10:
    tension: "AC-F8-1 requires a seed covering `queue list --project <groupKey>` and `status --project <groupKey>`, while AC-F8-3 restricts every assertion to `project-groups.v1`, `repos.v1`, `plan.data.members[]`, `closeout.data.members[]`, and `verify gates`."
    governing: "AC-F8-1 (TC-M2DOM-040), AC-F8-3 (TC-M2DOM-042), AC-F6-7 (TC-M2DOM-028)."
    resolution: >-
      The seed invokes both scoped reads and asserts the scoped member set
      through `project-groups.v1` (`data.groups[].members[]`, `groupKey`) plus
      the invocation's exit code; no undeclared `queue.*`/`status.*` envelope is
      read. The aggregation clause is what makes the exit code an assertion, so
      P3 depends on P2 for it.
upstreamGaps:
  - id: UG-1
    severity: medium
    summary: >-
      The authoritative repository-local aggregate gate is red at plan time on
      this host — a wall-clock timeout under a sibling delivery's load — and the
      default-TMPDIR run is separately known to fail
      `tests/checks/ci-baseline-parity.test.ts` and, standalone, the TC-WIRE-002
      5000 ms timeout (test plan §1.2 G-6, §10; AC-NFR6-1).
    disposition: >-
      AC-NFR6-1 names both default-run failures and admits them only as recorded,
      re-run exemptions behind a green repository-local run on the same head, so
      nothing is reclassified and nothing is widened. Concretely: the
      authoritative repository-local run must exit 0 — any failure there,
      including a repeated TC-WIRE-002, FAILS the phase and is escalated to the
      ticket owner as a gate defect; both runs are recorded with their failing
      test names; the excused pair is re-run with the record captured in
      `p62-rerun.txt` (a required artifact); any other default-run failure, or an
      excused pair without a green repository-local run, FAILS the phase. The
      plan reports the observed red run instead of excusing it (AC-NFR6-1,
      test plan TP-9).
    owner: "@runner (phase 9 quality_gates); escalation target: ticket owner"
  - id: UG-2
    severity: low
    summary: >-
      AC-F8-1 and AC-F8-2 require the S18/S19 seed sets to cover fifteen topics
      but do not say which seed carries which topic; P40/P41 squash the seed set
      before matching.
    disposition: >-
      The plan treats the coverage anchors as a property of the seed set (at
      least five S18 and five S19 seeds, each with exactly one `Assert:` line),
      never of an individual seed. No seed is required to carry all topics, and
      no anchor may be carried by prose outside the seeded blocks.
    owner: "@coder at P3; @reviewer reads the seeds against the spec (test plan G-9)"
  - id: UG-3
    severity: low
    summary: >-
      AC-NFR3-1's delivery-claim barrier is broader than its mechanical oracle:
      P59 greps for a fixed vocabulary of delivered-surface claims, so prose that
      attributes delivery to a planned surface in unanticipated words would pass
      the scan.
    disposition: >-
      Declared residual, matching test plan G-4/G-5/G-9. The plan states the
