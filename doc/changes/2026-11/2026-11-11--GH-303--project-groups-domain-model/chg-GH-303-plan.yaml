      Six GH-288 delivered facts are preservation obligations across the twelve
      planning documents: the M2-S11 `Ticket`/`Progress` record, the
      `projects.v1` closed daemon reason vocabulary, the `unbound` scope, the
      mounted entrypoint-delta note, the registry's "Shipped in GH-288 (M2-S11)"
