orderingConstraints:
  - "P1 -> P2 -> P3 -> P4 -> P5. P3 and P4 are adjacent by construction: the forbidden-literals guard is red between the new page (P3) and its registration (P4)."
  - "P2 precedes P3 because both command pages, the seeds, and the journey point at `repos.v1`, the group envelope, and the configuration schema that P2 lands; a forward reference would make P43 fail at the P3 boundary."
  - "P2 precedes P1 only in reader order, not in commit order: P1 lands the story codes that P2's map rows and contracts cite, and P4 is independent of P5 except for the entry count."
  - "P5 runs last because P34's base..worktree containment oracle needs all thirteen product files present, and P26/P27/P32/P33/P45/TM-034 need every artifact in place; P34 no longer requires a clean worktree, and the committed range is checked separately as `post_commit_check`."
  - "P6, when opened, runs after the review verdict and before the PR; it adds no product path and no phase except itself."
  - "`plan diff` is unavailable in this checkout (the composed runtime returns an unreadable diff port), so P34's base..worktree manifest is the sole containment oracle; the reviewer additionally re-reads the change diff at phase 8."
crossArtifactResolutions:
  note: >-
    The test plan flags eight places where two artifacts pull in different
    directions (TP-1..TP-8, test plan §8.4). Each is resolved here by naming the
    governing AC/TC and the phase that owns the gate; none is silently absorbed
    and none requires a further spec change.
  TP-1:
    tension: "AC-F12-2 and AC-NFR11-1 both govern status.md line retention, so a naive mapping yields two test cases over one predicate."
    governing: "AC-F12-2 (TC-M2DOM-029) and AC-NFR11-1 (TC-M2DOM-044)."
    resolution: >-
      Kept as two TCs by predicate, not collapsed: TC-029 owns presence, order,
      and addition confinement; TC-044 owns byte identity plus the oracle's
      soundness (delete, modify, swap, outside-insertion mutants) and the
      explicit "no whole-section cmp" clause. Both execute at P5 because
      status.md lands there; the plan gates them as a pair and never asserts a
      whole-section comparison anywhere.
  TP-2:
    tension: "AC-F3-3 and AC-F6-4 both describe the cross-repository change plan shape in contracts.md."
    governing: "AC-F3-3 (TC-M2DOM-007) and AC-F6-4 (TC-M2DOM-017)."
    resolution: >-
      Split by direction inside P2: TC-007 traces the six S19 task clauses
      forward (clause -> contract) and TC-017 asserts the shape backward
      (contract -> fields) with P17's eight procedure anchors, which cover
      AC-F6-4's seven elements (the lifecycle element is checked twice, as
      `branch` and as `pull request`). AC-F3-3 cannot pass before
      contracts.md exists, so its TC is owned by P2 even though the S19 entry
      lands in P1; the overlap is declared, not double-counted.
  TP-3:
    tension: "AC-F7-3 forbids the flat enumeration on the projects page while AC-F14-2 requires every both-name location to state the boundary, so a literal word ban on `repos` would make the two criteria mutually unsatisfiable."
    governing: "AC-F7-3 (TC-M2DOM-021) and AC-F14-2 (TC-M2DOM-033)."
    resolution: >-
      The projects page MUST name `repos` in its boundary sentence; the ban is
      on attaching the enumeration to `projects`. P21 therefore tests contract
      pointers and envelope keys (`repos.v1`, `repos[]`, `projects.v1`,
      `projects[]`) rather than the bare word, and P33 positively requires the
      boundary statement at the six both-name prose locations. Both gates run at
      the phases that own them (P3 for P21, P5 for P33).
  TP-4:
    tension: "NFR-7 states `## Key flows` holds exactly eight `###` headings while the base tree has seven."
    governing: "AC-NFR7-1 (TC-M2DOM-040), with AC-F5-3 (TC-M2DOM-013)."
    resolution: >-
      Seven to eight is treated as the derived consequence of the new
      cross-repository flow, not as an unexplained constant. P13 proves the flow
      exists and P40 records both the base seven and the head eight; a missing
      flow therefore fails as a count mismatch. P40 is claimed at P2, where the
      only diagram-bearing file is touched, and re-run at P5 over the full
      touched set without re-claiming TC-040.
  TP-5:
    tension: "F-12/AC-F12-1 fix neither the new status section's title nor its exact date text."
    governing: "AC-F12-1 (TC-M2DOM-028) and AC-F12-2 (TC-M2DOM-029)."
    resolution: >-
      The plan pins the heading form and the date, not the title string: P28
      requires exactly one new `##` heading matching `^## <title> \(2026-11-11\)$`
      — the file's own convention, `## M2 planning snapshot (2026-11-10)`, title
      first with the date parenthesised — plus `new_section_count=1` and
      `headings_after_new_section=0`. A second new `##` heading anywhere in
      status.md moves the derived boundary and therefore fails, so an
      out-of-section insertion cannot hide behind the positional derivation. The
      title text itself is the author's choice.
  TP-6:
    tension: "AC-F14-2 requires the boundary at every location that names both surfaces, while Appendix B's two index rows (`m2/README.md` map rows, `milestones/README.md` M2 row) require only that both pages are linked."
    governing: "AC-F14-2 (TC-M2DOM-033) with AC-F11-1/AC-F11-2 (TC-M2DOM-026, TC-M2DOM-027)."
    resolution: >-
      Split by location class: P33 owns the six prose locations whose Appendix B
      row requires a relation statement (backlog context paragraph, architecture,
      journeys, entrypoint delta, registry, status section) and gates
      `boundary_locations=6/6`; P26 and P27 own the two index rows as contents-row,
      map-row, and link coverage. No boundary sentence is demanded in a link
      table, and no prose location is left without one.
  TP-7:
    tension: "AC-F6-2's group-envelope rule versus `milestones/m2/commands/board.md`, which already carries a `projects[]` field."
    governing: "AC-F6-2 (TC-M2DOM-015) and AC-NFR12-1 (TC-M2DOM-045), with AC-NFR1-1 (TC-M2DOM-034)."
    resolution: >-
      `commands/board.md` is not in the thirteen-file manifest, is not edited,
      and its pre-existing `projects[]` ("project keys included in the board")
      is not the redefined group envelope. P15's repository-identity ban is
      scoped to the `## projects.v1` section of contracts.md, and P32 carries the
      negative control `base_board_accepted=OK` so the unchanged base page is
      provably not flagged. The page's reconciliation is a deferred item recorded
      in test plan §8.4 TP-7 and in this plan's P5 constraint — the two places
      that hold the same reading; spec §7.3 defers only board *scoping* to M2-S4
      and never names the page, so no spec obligation is claimed or discharged
      here. This is not a defect of this change.
  TP-8:
    tension: "Spec §18's recommended five-commit sequence puts the registry row with the indices and status last; this plan lands it in P4, before P5."
    governing: "AC-NFR1-1 (TC-M2DOM-034) and AC-NFR9-1 (TC-M2DOM-037)."
    resolution: >-
      This plan's order is authoritative for execution and supersedes the spec
      §18 recommended sequence: P4 immediately follows P3 because the
      forbidden-literals guard fails closed on an unregistered new page, so the
      alternative creates a guard-red window three commits wide. No oracle
      depends on commit order — P34's base..worktree manifest and P37's position
      check are commit-order independent — and the spec's sequence remains a
      statement of the recommended review order, not a gate.
upstreamGaps:
  - id: UG-1
    severity: medium
    summary: >-
      The default-TMPDIR aggregate run at base exits 1 on two named tests:
      tests/checks/ci-baseline-parity.test.ts and the TC-WIRE-002 5000 ms timeout
      in tests/checks/privacy-ci-wiring.test.ts. The same TC-WIRE-002 test also
      exceeds 5000 ms standalone in both TMPDIR modes but passes inside both full
      suites (test plan §1.2 G-6, TR-11, §10).
    disposition: >-
      AC-NFR6-1 v1.1 names both failures and admits them only as recorded,
      re-run exemptions behind a green repository-local run on the same head, so
      nothing is reclassified and nothing is widened. Concretely: the
      authoritative repository-local run must exit 0 — any failure there,
      including a repeated TC-WIRE-002, FAILS the phase and is escalated to the
      ticket owner as a gate defect; both runs are recorded with their failing
      test names; the two named default-run failures are recorded and re-run with
      the re-run captured in `p39-rerun.txt` (a required artifact); any other
      default-run failure, or an excused pair without a green repository-local
      run, FAILS the phase.
    owner: "@runner (phase 9 quality_gates); escalation target: ticket owner"
  - id: UG-2
    severity: low
    summary: >-
      F-8 and AC-F8-1 require the S18/S19 seed set to cover ten topics but do
      not say which seed carries which topic; P22 squashes the seed set before
      matching.
    disposition: >-
      The plan treats the ten coverage anchors as a property of the seed set
      (at least two S18 and two S19 seeds, each with exactly one `Assert:`
      line), never of an individual seed. No seed is required to carry all
      topics, and no anchor may be carried by prose outside the seeded blocks.
    owner: "@coder at P3; @reviewer reads the seeds against the spec (test plan G-9)"
  - id: UG-3
    severity: low
    summary: >-
      The spec's NFR-3 barrier is broader than its mechanical oracle: P36 greps
      for a fixed vocabulary of delivery claims, so prose that attributes
      delivery to the planned surfaces in unanticipated words would pass the
      scan.
    disposition: >-
      Declared residual, matching test plan G-4/G-5/G-9. The plan states the
      authoring prohibition as a constraint in P3, P5, and P6 and hands the
      semantic read to `@reviewer`; P36 remains the mechanical floor and its
      green result is never presented as proof of wording quality.
    owner: "@reviewer (phase 8 review_fix)"
