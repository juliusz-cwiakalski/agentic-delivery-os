mergedTruth:
  note: >-
    Facts this base already carries. They are stated here so no phase can
    restate them as plan or contradict them.
  gh288ShippedFlatProjectsList:
    status: merged
    detail: >-
      GH-288 / PR #305 delivered M2-S11 and mounted the read-only
      `projects list [--json]` overview returning `projects.v1`
      (`data.projects[]`, `projectKey`, `hostIndexRevision`). The flat
      enumeration therefore exists today under the `projects` name; current truth
      (feature-projects, feature-cli-entrypoint, the migration guide, TDR-0022)
      describes that shipped behaviour and is not edited by this change.
  planningCorpusRecordsTheSplit:
    status: prospective
    detail: >-
      This change's corpus records the prospective split: from M2-S18
      `projects list` enumerates groups (`project-groups.v1`) and `repos list`
      enumerates the flat record set (`repos.v1`), with
      `projects list --flat` returning the delivered `projects.v1` payload as a
      deprecation alias owned by M2-S18 and retired at the M3 boundary. No alias,
      rename, field rename, configuration loader, scan, or scoped read is
      implemented here (NG-1..NG-4, DEC-7).
  deliveredFactsArePreserved:
    status: binding
    detail: >-
      Nine GH-288 delivered facts are preservation obligations across the
      fourteen planning documents and are enumerated by P55's
      `delivered_facts=9/9`: the M2-S11 `Ticket`/`Progress` record, the closed
      daemon reason set, the `unbound` scope at exit 0, the exit projection, the
      `projects.*` error identities, the host-root state layout, the mounted
      entrypoint-delta note, the shipped `projects` registry attribution, and the
      2026-11-11 status snapshot. Where a page's surface name moves, the
      delivered fact is carried to the location that owns the delivered surface,
      never dropped.
  noConflictMarkers:
    status: binding
    detail: >-
      No conflict marker may remain in any product file; the committed range must
      reproduce the base..worktree product set (P57).
