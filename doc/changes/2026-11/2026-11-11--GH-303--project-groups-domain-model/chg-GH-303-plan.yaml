      - "Adds no product path: every edited product file is already inside the thirteen-file manifest, so P34's budget is unchanged."
      - "Fixes the named finding only; it does not re-litigate upstream decisions (DEC-1..DEC-18) or re-scope a neighbouring page. A remediation must not regress a GH-288 delivered fact or introduce a conflict marker, and it must keep the sanctioned-shape allowances intact (the per-page disambiguation sentence and the preserved delivered facts)."
      - "If a remediation re-delivers an artifact whose TC was claimed in an earlier phase, this plan is revised in the same commit to move that TC to P6, keeping the 45/45 exactly-once mapping true."
      - "Any gate that was green at P5 is re-run after remediation; no phase may pass by lowering a gate, deleting a procedure, or narrowing a scan."
    gates:
      - >-
