rejected_or_weakened_findings:
  - finding: "API BLOCKING — `status --project <groupKey>` is asserted five times and declared nowhere; no page declares the option or its envelope delta."
    disposition: WEAKENED to NOTE (N01)
    rationale: >-
      The grammar is pinned by AC-F7-9 and DEC-25 (README S18 row) and by
      projects.md's family sentence; the M1 status page is required to stay
      byte-identical, and AC-F8-3 forbids asserting an undeclared envelope. The
      correct reading is a deliberately uncontracted, planned delta — which is
      precisely why SC-M2-S18-04 was rewritten to assert through
      project-groups.v1 + exit code. The reviewer's evidence is accurate; the
      BLOCKING consequence ("unassertable acceptance") is not, because the AC
      accepts the surface by name, not by payload.
  - finding: "CTO — the version-history item (4) cites retired fixture numbers while §6 says they are no longer cited."
    disposition: REJECTED
    rationale: >-
      Item (4) is a dated changelog entry recording what the v1.4 authoring run
      measured; item (f) of the same row explicitly supersedes it for the current
      head, and §6's retirement statement is about the plan-time scaffold as a
      live control. Historical rows are expected to keep recorded values (the
      same convention the iteration-1 record used for the registry's 139/140
      history). No current-truth claim is made.
  - finding: "PM — the queue representation is contract-owned but story-unowned, so ownership was not removed."
    disposition: WEAKENED to NOTE (N06)
    rationale: >-
      `contracts.md` states "Owned by M2-S18 for cross-repository changes", and
      board finding B12 closed on that statement plus the architecture anchors.
      Ownership is single and explicit; what is absent is a story-level task/AC
      pointer, which is a traceability note, not an ownership failure.

