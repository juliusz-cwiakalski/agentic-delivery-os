  was convened to remove (a repository-meaning `projects` token; an assertion
  against an undeclared shape), and both are cheap to fix. The aggregate gate is
  green on the recorded authoritative repository-local run (exit 0, 7206 pass /
  4 skip / 0 fail, code fingerprint matching HEAD); the test plan's section 10
  P62 FAIL and several section 10 observations are stale, not current-truth
  failures.

