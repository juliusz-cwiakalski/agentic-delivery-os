decisions:
  - text: "Delivery mode: autonomous. The session asked for end-to-end delivery of
      exactly GH-303 with PR creation, leaving merge authority to the CEO (Mode
      A) or the human via batch-deliver.sh (Mode B)."
    date: "2026-11-11"
  - text: "PM decision (naming boundary vs the M3 registry row): the ticket states
      the flat enumeration belongs to `repos`, 'the name M3 already reserves'.
      cli-command-registry.md currently assigns `ados repos` to M3-S6 repository
      hygiene (clone, branch, worktree) and `ados projects` to the M2-S11 flat
      enumeration. Resolution: `repos` is the flat enumeration family delivered
      by the amended M2-S11 (`repos list`), and the M3-S6 hygiene verbs are
      `repos` subcommands delivered later; `projects` becomes the group surface
      owned by M2-S18. The registry is therefore a derived deliverable of this
      change even though the ticket's file list names only the blueprint
      documents — leaving it contradictory would break the 'docs-only, guards
      green' acceptance."
    date: "2026-11-11"
  - text: "PM decision ('entrypoint delta note'): the ticket's backlog bullet names
      an entrypoint delta note without naming a file. Read as two requirements:
      a note in backlog.md's M2 context recording the root-family change, and
      the m2/entrypoint-delta.md M2-planned-additions list updated so its
      'projects becomes a root family: the host overview of managed checkouts'
      line stops contradicting the amended naming boundary (`repos` = flat
      enumeration, `projects` = groups)."
    date: "2026-11-11"
  - text: "PM decision (derived index and pack consistency): a new command page
      makes milestones/m2/README.md's pack-contents table, its story-to-artifact
      map, and the milestones/README.md M2 index row incomplete unless they
      learn about commands/repos.md and stories S18/S19. Those index edits are
      in scope as derived consistency, exactly as the GH-284 precedent treated
      the pack index."
    date: "2026-11-11"
  - text: "PM decision (flat enumeration contract surface): contracts.md must define
      the `repos list` envelope (flat enumeration: repo key, root, state
      location, daemon reachability, handover state) alongside the redefined
      projects.v1 group envelope and the new project-configuration schema, so
      the command pages have a contract to point at. The ticket names the
      projects envelope and the configuration schema but not a name for the flat
      envelope; the spec picks one consistent name and uses it in both pages."
    date: "2026-11-11"
