  - text: "RETRO (DoR iteration 1): the readiness gate found nine executable defects
      the author's own base-tree run could not — every procedure was run in one
      shared shell, so cross-procedure dependencies stayed invisible and
      undefined variables failed open, and no procedure was executed against a
      conforming head where a last-line-before-next-heading window collapses.
      Same root class as the GH-284 rounds: predicates authored as prose, then
      run once. Improvement: the test-plan author must execute each procedure in
      a fresh shell and against a conforming fixture in the same edit, and must
      treat any expected post-change literal as a derived value with the
      derivation shown."
    type: "retro"
    date: "2026-11-11"
  - text: "DoR iteration 1 remediation complete. Spec v1.1: AC-NFR6-1 rewritten to
