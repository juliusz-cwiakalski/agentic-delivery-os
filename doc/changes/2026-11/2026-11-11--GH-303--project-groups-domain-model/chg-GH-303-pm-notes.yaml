    type: "info"
    date: "2026-11-11"
  - text: "Rejected residual (verified, not absorbed): the plan-writer reported that
      the test plan's P39 verdict line parses as `((A||B)&&PASS)||FAIL` and
      therefore prints FAIL when cls=none. Shell evaluation says otherwise — `[
      A ] || [ B ] && echo PASS || echo FAIL` is left-associative, so cls=none
      short-circuits to PASS, cls=excused runs the second test and PASSes, and
      only a cls=delivery pairing reaches FAIL. No test-plan edit is needed; the
      plan gates on the classifier token anyway."
    type: "decision"
    date: "2026-11-11"
