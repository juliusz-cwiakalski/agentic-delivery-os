notes:
  - text: "Intake state (2026-11-11): GH-303 open with label `change` only, zero
      comments; no PR in any state for branch
      docs/GH-303/project-groups-domain-model and none matching GH-303; branch
      is checked out, clean, zero commits ahead of origin/main-tools 5372dbac.
      Fresh start: no resume merge, no review threads."
    type: "info"
    date: "2026-11-11"
  - text: "Scope read against current system truth: doc/spec/features/ carries no
      spec for `projects`, `repos`, or a project-group surface, because these
      are M2-planned surfaces and not delivered behaviour. The planning corpus
      under doc/planning/oss-tooling/** is the only place these surfaces are
      stated, so the change reconciles the planning corpus with itself and adds
      no current-truth contradiction. No product code is touched: the ticket's
      acceptance is 'docs-only change; guards green; no code'."
    type: "info"
    date: "2026-11-11"
  - text: "Repository facts for artifact authors: the M2 pack lives at
      doc/planning/oss-tooling/milestones/m2/ (README, architecture, contracts,
      test-scenarios, journeys, entrypoint-delta, commands/{projects,attempts,
      events,spend,queue,board}.md). Backlog is
      doc/planning/oss-tooling/backlog.md with the Epic M2 block closing in a
      `---` separator before `## Epic M3`; the M2 stories are not contiguous by
      number (S2,S3,S10,S4..S9 order in the file), so insertion position must be
      chosen from the file, not assumed. status.md ends with the dated
      2026-11-10 M2 planning snapshot, whose maintenance convention asks each M2
      story delivery to update the snapshot at meaningful boundaries."
    type: "info"
    date: "2026-11-11"
  - text: "Guards that matter for this docs-only change, read from source rather
      than remembered: `pnpm check` is the aggregate gate (lint, format:check,
      typecheck, test, boundaries, prompt-conformance, help-guide-coverage,
      exports-parity); `scripts/checks/forbidden-literals.ts` scans user-facing
      docs under doc/** except doc/changes/** and doc/decisions/**, and requires
      every such file to be registered in
      scripts/checks/forbidden-literals.registry.json — so a NEW file
      milestones/m2/commands/repos.md needs one sorted registry row.
      `scripts/.tests/test-doc-distribution.sh` skips doc/planning (82 in-scope
      docs, planning_markers=0 at base). The aggregate gate is known to fail
      ci-baseline-parity on a tmpfs TMPDIR (cross-device hardlink) and to pass
      with a repo-local TMPDIR, the reverse of test-doc-distribution.sh, which
      needs the default TMPDIR."
    type: "info"
    date: "2026-11-11"
  - text: "Clarify-scope verdict: no ticket comment asking for requirements and no
      human hold. The ticket supplies the normative story text, ACs,
      dependencies, amendment wording, and blueprint targets; every ambiguity
      found resolved to a PM decision recorded above rather than to a missing
      requirement. One durable scope note is left on the ticket: the
      registry/index reconciliation and the repos-vs-M3-S6 naming resolution."
