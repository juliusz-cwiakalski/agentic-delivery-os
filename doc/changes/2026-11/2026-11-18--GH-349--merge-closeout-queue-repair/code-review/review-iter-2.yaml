summary: >-
  Review-iteration-1 remediation verified against the delivered tree, not the
  report. The blocker is genuinely gone: one shared `normalizeMilestoneTitle`
  canonicalizes the `M<n>:` prefix on BOTH sides, the fixture carries the
  provider-native prefixed title, and a production-composition suite drives the
  shipped `createProductionComposer` (planFacts -> milestoneStep) through
  would-apply, withheld closure and a true mismatch; a live `closeout GH-349`
  plan against the real provider now reports `milestone-sync` skipped-noop with
  reason `closure-withheld` and `detail.attachment: matched` for GH-349's own
  work item (provider milestone title "M4: Jaiship-native delivery"), exactly
  the attachment-plus-withheld outcome AC-F4-2/AC-F4-7 require. M1 now ranges
  over the declared `required-ci-job` set on both arms and proves the undeclared
  job non-evidence; M2 round-trips a recorded `close-milestone` through a real
  JSONL store with a failing control; M3 isolates ledger-terminal reuse; M5
  makes withheld residue informational (0 withheld-only / 1 other residue / 2
  gated failure) with a real mutant control. Two majors remain, both in the
  declaration/enforcement layer rather than behaviour. (1) The nine-changed /
  seven-green correction stops at prose: `tests/structure/merge-suite-obligations.test.ts`
  still asserts eight changed / eight green with `merge-probe` in GREEN, so the
  amended plan obligation 2.5 and TC-F1-014 ("pin `merge-probe`'s inverted case
  id") are undelivered and the meta-check still cannot see the semantic edit;
  the test-plan's §7.6 landing row also still says eight/eight. (2) Six
  remediation paths (including the production file
  `packages/cli/src/commands/closeout.ts`) are outside every phase's declared
  scope although the plan's remediation note claims they are inside it. Seven
  iteration-1 minors/infos persist (unchanged code paths). No blocker, no failing
  AC: 44 pass, 2 pass-with-notes, 0 fail.
