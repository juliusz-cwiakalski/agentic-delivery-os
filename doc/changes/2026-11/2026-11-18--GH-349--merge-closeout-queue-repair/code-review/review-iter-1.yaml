findings:
  - id: B1
    severity: blocker
    confidence: high
    category: correctness
    location: packages/core/src/domain/closeout.ts:1155
    ac_refs: [AC-F4-2, AC-F4-7]
    message: >-
      [B | owner: plan Phase 5] The milestone attachment check normalizes the
      declaration with `/^M(\d+):\s*(\S.*)$/` and compares the captured phrase
      (`declaredTitle`, e.g. "Jaiship-native delivery") to
      `facts.observedWorkItem.value.milestone`, which the GitHub normalizer copies
      verbatim from the provider milestone title (e.g. "M4: Jaiship-native
      delivery"). The prefix is dropped on one side only, so a real work item never
      matches its declaration: `milestoneStep` returns `attachment-mismatch` and
      the step is skipped-noop with residue instead of the applied/withheld outcome
      the ACs require. Verified empirically by driving `buildCloseoutPlan` with the
      production-shaped observed title ("M4: Jaiship-native delivery") and a
      conforming open record: outcome `skipped-noop`, reason/`residue.item`
      `attachment-mismatch`. The suites pass only because
      `tests/fixtures/closeout/milestone.ts` sets `MILESTONE_TITLE` to the
      phrase-only form and `milestoneFacts` uses it for the work item, so AC-F4-2's
      `applied` arm and AC-F4-7's attachment-pass outcome are vacuous with respect
      to the real provider shape. GH-349's own work item carries
      "M4: Jaiship-native delivery" (verified via `gh issue view 349`).
    suggestion: >-
      Compare the full declaration against the provider-asserted title (or strip
      the `M<n>:` prefix from both sides) and add a regression case whose work-item
      milestone is the real prefixed title; re-point the M4 fixture
      (`m4-attached-set.ts`/`milestone.ts`) to the prefixed title so the oracle
      cannot pass on the phrase-only form. Add an end-to-end composition case
      (`production.ts` `planFacts` -> `milestoneStep`) so the glue is exercised.
  - id: M1
    severity: major
    confidence: medium
    category: correctness
    location: packages/core/src/domain/merge-transaction.ts:478
    ac_refs: [AC-F3-3, AC-F2-2]
    message: >-
      [M | owner: plan Phase 2] `checksPostureOf` collects every `pipelineName` on
      the bounded check-run page and classifies the first non-green one through
      `evaluateRequiredJobGate`, without intersecting the page against the
      effective gate set's declared required jobs. The delivered `ci-green` gate
      is evaluated over `workflow.names`; a job outside that expected set is not
      gate evidence. Consequently the not-mergeable post-refusal classifier can
      emit `merge.gate.ci-green.failed` for an undeclared failing job even though
      the provider refused the landing for a different protection rule, violating
      AC-F3-3 ("a job the effective gate set does not declare ... produces no
      refusal") and misdirecting the operator's remediation. The main probe loop
      correctly restricts to declared entries; only this branch is over-broad and
      is untested for the undeclared case.
    suggestion: >-
      Derive the candidate job set from `config.gateSet.enforcedMergeEntries`
      (the effective declared required jobs) rather than the raw page (or thread
      the expected workflow names through), and add a not-mergeable case with an
      undeclared non-green job asserting `behind-unconfirmed` rather than a
      checks-posture row.
