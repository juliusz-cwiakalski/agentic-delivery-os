  - id: M5
    severity: major
    confidence: high
    category: correctness
    location: packages/cli/src/commands/closeout.ts:50
    ac_refs: [AC-F4-3, AC-F4-7]
    message: >-
      [M | owner: plan Phase 5] The withheld/absent milestone outcome always
