summary: >-
  The delivery is large, disciplined, and largely faithful to spec v2.3: the one
  landing mechanism composes the closed `merge-delivery-request` operation with
  the crafted title/fallback and the exact verbatim trailer, the exact-head
  guard, provider-asserted truth, and a total four-state refusal taxonomy; the
  emittable declaration now carries the gate family and the two additive rows;
  `shaOnBase` is widened to `boolean | "unknown"` with a state-layer validator
  and a real write-then-read round trip; the phase mirror is derived from the
  post-transition fold on every document-writing branch and the read-only
  `lint.phases.divergent` row is scoped to ledger-backed, completion-only
  phases; the seven queue properties and the three defect-named suites carry
  genuine substituted/derived controls; the tenth operation, thirteenth step,
  seventh operation name, seventh assertion family, ninth residue kind, thirty
  parity cells and the identity total 167 are coherent on both tables and all
  seven pin sites (targeted suites: error-table sync/structure 249 pass,
  milestone 40 pass, defect/refusal 53 pass, queue/removal 33 pass, structure
  pin set 131 pass, pilot/merge 25 pass, doc-conformance 25 pass,
  privacy-release 7 pass). One blocker survives the green battery and four
  majors weaken acceptance evidence. The blocker: the milestone attachment
  check strips the `M<n>:` prefix from the declaration but compares against the
  provider-native title (which carries that prefix), so a real GitHub work item
  ("M4: Jaiship-native delivery") never matches the declaration
  ("M4: Jaiship-native delivery") and `closeout --apply` reports
  `attachment-mismatch` instead of `applied`/withheld-closure; the suites pass
  only because their fixtures use the phrase-only title. Majors: the
  not-mergeable checks-posture classifier ranges over every page job rather
  than the declared required set (AC-F3-3); the AC-F4-5 recorded
  `close-milestone` round trip through the real state validator is unproven;
  TC-F4-011's second apply uses an already-closed observation so it does not
  isolate ledger-terminal idempotency; `merge-probe` is edited although
  AC-F1-1/§16 declare it one of the eight green-unedited suites; and the
  withheld milestone residue forces the `attention` exit for every change
  without a conforming milestone declaration, contradicting the rollout's
  "no behaviour change beyond one extra plan line" and AC-F4-7's
  "success-shaped" claim.
