findings:
  - id: n1
    severity: minor
    confidence: high
    category: test-quality
    location: tests/structure/merge-suite-obligations.test.ts:77
    ac_refs: [AC-F1-1, AC-F3-3]
    message: >-
      [m | owner: test-plan owner + phase-2 scope] Resolving N1 pinned the AC-F3-3
      inversion but not the other half of `merge-probe`'s declared obligation.
      TC-F1-014's Pass (`chg-GH-349-test-plan.md:450`) states "nine obligation
      assertions (including `merge-probe`'s five not-green states)" and its Then
      (`:449`) names the five states, while AC-F1-1 (`chg-GH-349-spec.md:469`) names
      `TC-F3-001`, `TC-F3-002` and `TC-F3-006` as "the suite's obligation cases". The
      delivered `OBLIGATIONS["merge-probe"]` markers are `TC-MERGE-016`, the inversion
      sentence, `AC-F3-3` and the inverted assertion only, so the five-state block
      (`tests/behaviour/merge-probe.test.ts:239-296`, added by `e0aa765f` as the
      "extended" half) has no enforcing marker: deleting it would leave the meta-check
      green. A second, inherent limit: a source-marker oracle cannot see every
      semantic edit — keeping the title, the `AC-F3-3` comment and the
      `toBeUndefined` line while flipping `expect(result.exitCode).toBe(0)` to `1`
      still passes 22/22 (the runtime suite fails, so the inversion cannot silently
      ship). Neither gap is reachable by a real revert of the probe case, which the
      mutation run above fails by name; both are declaration/coverage nits, not
      behaviour defects.
    suggestion: >-
      Minimal fix, either direction: add `TC-F3-001` (and the `queued`/`running`/
      `canceled`/`skipped`/`failed` identifiers of that block) to
      `OBLIGATIONS["merge-probe"]` — the markers are present today, so the check stays
      green and gains the ability to see the extension reverted; or reword
      TC-F1-014's Then/Pass and AC-F1-1's clause to declare the inversion as the
      pinned obligation and the five states as runtime-only coverage. (The label
      difference — spec §16/AC-F1-1 call `merge-probe` "re-pointed", test-plan §7.6
      and TC-F1-014 call it "extended" — is cosmetic and needs no change.)
    suppressed: false
  - id: I-1
    severity: info
    confidence: high
    category: tooling
    location: tests/structure/memory-lint-docs.test.ts:117
    ac_refs: []
    message: >-
      [I | no action in this change] In this host, `tests/structure` is 1886 pass /
      1 fail: `memory-lint-docs.test.ts:123` fails only because
      `scripts/.tests/test-doc-distribution.sh` runs a sandbox `install.sh --local`
      that refuses when `~/.jaiship/bin/jaiship` already holds the compiled binary.
      With `HOME=/tmp/guardhome` the same guard passes ("no drift — 96 in-scope docs;
      install set matches ados_distribution markers"), so GH-349's markers are clean
      and the failure is host state, not a tree defect. The change's other gates are
      unaffected (pm-notes records a clean `bun test tests/structure tests/checks`).
    suggestion: >-
      No action in GH-349; run the guard with an isolated HOME in the pipeline, or
      clear the host launcher slot before the quality-gates phase.
    suppressed: false
