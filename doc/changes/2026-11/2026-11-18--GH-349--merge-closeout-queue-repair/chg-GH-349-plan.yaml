#   F8 in phase 2, F4 in phase 4 — and each repair phase asserts the FIXED
#   behaviour through its own behaviour suite, so no phase ships an unproven
#   repair. Phase 7 additionally owns the meta-check (TC-F7-005: an
#   assertion-presence registry plus a control-differs assertion per suite) and
#   the discovery/offline/topology case (TC-F7-006).
