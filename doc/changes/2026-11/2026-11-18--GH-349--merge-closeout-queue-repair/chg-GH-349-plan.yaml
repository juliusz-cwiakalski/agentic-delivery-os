#      bookkeeping citation: TC-SYNC-003 asserts the all-gaps representation
#      (M101), and AC-F1-7's behaviour half stays with TC-F1-008 (phase 2).
#   3. AC-F2-5 (owner phase 2) cites TC-SYNC-001 (phase 1): the documented and
#      machine rows moving together is a phase-1 fact (the binding sync check
#      reads both tables from the live tree); the emitted-code/kind/exit half of
