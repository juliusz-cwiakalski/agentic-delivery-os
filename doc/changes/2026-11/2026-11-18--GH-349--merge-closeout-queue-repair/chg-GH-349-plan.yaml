# SCOPE DECLARATION RULE (binding on every phase; inherited from GH-338/GH-339):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   regression control (the delivered read-only suites, the topology pin
#   `tests/structure/ci-topology-pin.test.ts`, `scripts/checks/**`,
#   `.github/workflows/**`, `tests/boundaries/**`, `tests/behaviour/providers/**`,
#   `packages/adapters/src/git/merge.ts`) is NOT declared: declaring it would only
#   produce an advisory `plan diff` `undeclared-missing` for a file that needs no
#   edit. Every file the test plan names as an assertion site to CREATE or EXTEND
#   is declared by the phase that owns that half of the case.
#   ONE DECLARED EXCEPTION, stated so rule and declaration do not contradict:
#   `doc/decisions/00-index.md` in phase 1 is a CONDITIONAL-STAGING declaration.
#   It is clean at plan time and its rows are committed; it may be touched (a
#   status row or a typo) while the three records it indexes land. It is never a
#   licence to edit an unrelated row.
#   A FILE TOUCHED BY TWO PHASES IS DECLARED BY BOTH, WITH ONE OWNER:
#   `packages/core/src/domain/merge-transaction.ts` (phases 2 and 3),
#   `packages/core/src/contracts/ports.ts` and
#   `packages/core/src/contracts/index.ts` (phases 1 and 5),
#   `packages/cli/src/edge.ts` (phases 2 and 4),
#   `packages/cli/src/production.ts` (phases 2, 4 and 5),
#   `tests/structure/content-inventory.test.ts` (phases 1 and 5),
#   `tests/checks/error-table-sync.test.ts` (phases 1 and 7),
#   and `packages/adapters/src/github/client.ts` (phases 2 and 5). In each case
#   the split is an AUTHORING split: the owning phase named in the AC/TC tables
#   below is the one that closes the case.
#
# ORDERING (spec §18 "by outcome, so each declaration lands with the evidence that
# proves it"), made concrete. Seven phases; the reasons force the exact order:
#
#   (a) THE IDENTITY TOTAL MOVES ONCE (149 → 152 in a single commit).
#       The delivered bidirectional sync check
#       (`tests/checks/error-table-sync.test.ts` → `scripts/checks/error-table-sync.ts`)
#       reads the DOCUMENTED table out of the live tree at
#       `doc/spec/features/feature-result-contract.md`, and
#       `tests/structure/error-table.test.ts` pins `149` in four places plus the
#       documented statements and scans `APPENDIX_D_FILES` for a stale count —
#       which includes `doc/spec/features/feature-ceremony-runner.md`. So the
#       three rows, both tables, every `149` pin and those two carrier pages must
#       land in ONE commit. Splitting the total across phases would move every
#       pin twice and turn RSK-6's "half-moved surface" risk into a scheduled
#       event; this plan does not do it. Phase 1 therefore carries all three rows
#       (two `merge` + one `lint`), and phase 4 only gives the lint row its
#       emitting branch. Test-plan §7.6 obligation (ii) is satisfied literally:
#       both sides of every pair move in the same commit.
#   (b) A DECLARED-BUT-UNEMITTED ROW IS LEGAL AT ITS DECLARING PHASE.
#       The delivered error-table suites pin rows, kinds and counts; no delivered
#       check asserts that every row is emitted. Reachability is asserted by THIS
#       change's TC-SYNC-001, whose reachability half is authored in phase 7 —
#       the first phase where all three rows have an emitting branch. That is why
#       phase 1 can declare the lint row whose comparison lands in phase 4 and the
#       two merge rows whose branches land in phase 2 without a red boundary.
#   (c) THE MILESTONE ADDITIVE SURFACE AND THE WHOLE APPENDIX E RIPPLE ARE ONE
#       COMMIT (phase 5), NOT TWO. The delivered
#       `tests/structure/closeout-contract.test.ts` asserts
#       `operationsInFlows` (from `packages/testkit/src/conformance/flows.ts`)
#       EQUALS `ADAPTER_OPERATIONS`, each adapter's exact partition of the closed
#       set, the `change-lifecycle` step list, the total flow step count (14), the
#       closeout step-id list and its length (12); `tests/structure/closeout-additive.test.ts`
#       and `tests/fixtures/closeout/plan.ts` pin the step inventory and the plan's
#       step ids; `tests/checks/capsule-bounds.test.ts` pins the residue-kind count
#       (8). Adding the tenth operation or the thirteenth step id without the
#       registry, the three capability declarations, the parity matrix, the mock
#       routes and the plan fixture fails a DELIVERED gate inside the same commit,
#       and §24.5 says any subset is a red gate. §7.6 row 1 lists
#       `adapter-capabilities.ts`, `closeout.ts` and `capsule.ts` with the first
#       phase; this plan moves those three declarations to phase 5 as a DECLARED
#       deviation, because a step id with no step, and an operation with no
#       capability declaration, are exactly the half-moved surfaces RSK-6 and
#       §24.5 forbid. TC-SYNC-002, TC-SYNC-003, TC-SYNC-007 and TC-SYNC-008 are
#       phase-5-owned for the same reason.
#   (d) THE PROBE EXTENSION FOLLOWS THE LANDING PATH (phase 3), because the
#       additive attribution field is only observable through the refusal evidence
#       the taxonomy produces, and its two goldens move in the same commit as the
#       rendering that produces the attribution line.
#   (e) THE PHASE MIRROR (phase 4) is independent of the merge work; it precedes
#       the milestone step because the milestone step's apply evidence is recorded
#       through the same phase/closeout command path.
#   (f) THE QUEUE PROOFS (phase 6) are behaviour-identical by obligation and
#       depend on the step insertion only for TC-F6-008 (the automatic `landed`
#       removal across the milestone variants), which is why they follow phase 5.
#   (g) THE DEFECT-NAMED REGRESSIONS AND THE FLOOR (phase 7) close the change:
#       each defect suite's control RESTORES the pre-fix behaviour (the history
#       lookup, the seventeen-member emittable set, the refresh injection), which
#       is only a well-formed derivate once the repairs landed; and the residual
#       pins plus the aggregate gate are whole-change evidence (spec §18 puts the
#       defect regressions and the documentation reconciliation last).
#
# THE ADDITIVE SURFACE IS THREE MOVES, NEVER FOUR (Appendix D counts):
#   1. phase 1: normalized title (0→1 optional field), concrete merge rows (7→9),
#      lint family rows (5→6, lint-kind concrete rows 6→7), identity total
