# THE RIPPLE IS ALL-OR-NOTHING (Appendix E, binding on phase 5):
#   An operation-set change is not complete until EVERY item below lands in the
#   SAME commit: (1) the closed set gains `close-milestone` by APPEND with no
#   index moving; (2) the flow registry represents it with a step (executing on
#   GitHub, gap-reaching on GitLab and Jira) and renumbers nothing; (3) the
#   structural coverage gate's representation requirement moves nine→ten; (4) the
#   runtime coverage gate executes the supported operation on the mock tenant and
#   encounters each declared gap with its exact reason; (5) the mock tenant's
#   route table carries the write route and its read-back route with expected
#   projections; (6) the parity matrix gains one row (30 cells) with three
#   adjudicated cells — GitHub `same-as-reference`, the other two `gap` citing
#   their declared reason; (7) the declared-difference register is unchanged or
#   carries exactly one entry per new declared-difference cell; (8) the per-file
#   executable-export inventory and discipline expectation are updated exactly for
#   any new export; (9) the identity-construct scan's allowlist is unchanged;
#   (10) every gap reason is drawn from the closed reason set; (11) the
#   help/reference coverage inventory keeps its command set (no new command) and
#   the touched pages keep `--help`/`--version`; (12) the topology contract test
#   stays green with zero workflow-file, job, trigger, permission or upload
#   change. A partial move is a RED GATE, not a partial success: TC-SYNC-003
#   fails naming the missing item and M83 mutates each supplied item.
#   The six-family × three-adapter accounting stays 18 cells, because
#   `close-milestone` is NOT a trap family and must not enter the family
#   vocabulary (DM-7, Appendix D).
#
# INVARIANTS BINDING ON EVERY PHASE (spec §24.3 Appendix C; a phase that needs to
# cross one is out of scope and returns for a specification revision):
#   C1  No new queue verb, subcommand, record kind, state key, or flag; queue
#       integrity is property proof plus repair to the declared sentence.
#   C2  No milestone create, attach, detach, rename, reopen, entry review,
#       planned-scope verification, extension, or `milestone` command family, by
#       any actor. The `close-milestone` vocabulary cannot express them.
#   C3  No new closed adapter operation beyond the single milestone close; no
#       removed, renamed, retyped, or reordered operation, carrier kind, gap
#       reason, or capability flag.
#   C4  No landing force, bypass, auto-merge, merge-queue, rebase, or
#       merge-commit strategy, no landing retry, no second landing mechanism, and
#       no silent local fallback on a declared gap.
#   C5  No fetch, push, remote read, or base mutation on the merge path; the git
#       seam stays remote-free; the merged-diff anchor stays a read of the
#       recorded landing identity (Appendix G-2).
#   C6  No second required-check evaluator and no prose matching anywhere in the
#       check or refusal path.
#   C7  No `phase repair`, no lint fix mode, no new phase state kind, and no
#       change to `verify change`'s verdict, precedence, or read-only contract.
#   C8  No second derived mirror of phase state, and no surface that treats the
#       pm-notes document as truth.
#   C9  No new error identity beyond the two `merge` rows and the one `lint` row;
#       no pattern widening; no exit class, domain kind, or projection change; the
#       retained reserved `merge.rebase-conflict` row is neither removed nor
#       re-meant.
#   C10 No new CI workflow file, job, trigger, permission, upload, or artifact
#       field; every added suite rides the existing test jobs.
#   C11 No new network location, credential, transport, secret-read allowlist
#       entry, or ambient environment read.
#   C12 No test executes a provider write, a close, or a phase transition: every
#       new suite drives injected transports and temporary local repositories
#       offline.
#   C13 Capability declarations stay honest: every adapter declares support or a
#       valid closed gap reason for every declared operation.
#   C14 No adapter behaviour change outside the declared operation addition and
#       the bounded milestone read.
#   C15 Testkit stays runtime-neutral (no `node:*`/`bun:*`, no ambient
#       environment/clock/randomness).
#   C16 No change to the capsule event vocabulary, the promotion rules, the retro
#       surface, or harness telemetry.
#   C17 No touched pin is loosened, skipped, made vacuous, or updated without its
#       pinned counterpart.
