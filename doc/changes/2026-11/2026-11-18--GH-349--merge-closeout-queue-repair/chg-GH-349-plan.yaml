  # ---------------------------------------------------------------------------
  # Phase 2 — The provider-side landing path and the total refusal taxonomy
  # (F-1, F-2; DEC-1, DEC-2; ADR-0012 is the authority).
  #
  # Goal: a landing is one provider-verified mutation at the head the freshness
  # envelope verified, carrying deterministic operator-free metadata, and every
  # mergeability state resolves to exactly one declared identity with no head
  # mutation anywhere on the path.
  #
  # Owns: ACs — AC-F1-1..AC-F1-9 (9) and AC-F2-1..AC-F2-6 (6) = 15 of 46.
  #       TCs — TC-F1-001..014 (14), TC-F2-001..008 (8), TC-SYNC-005 (1)
  #       = 23 of 87.
  #
  # Contract (F-1, F-2, API-1, API-2, DM-3; ADR-0012 as revised):
  #   - EXACTLY ONE landing mechanism: the closed `merge-delivery-request` adapter
  #     operation through the transaction's ports, issued at most once per
  #     invocation, never re-issued after a failure, with no force, bypass,
  #     auto-merge, queue, or retry variant — absent from the type, not rejected at
  #     runtime. The local squash landing and the local refresh stay declared and
  #     tested capabilities with ZERO composed callers, and each carries its OWN
  #     seam-level unit proof of the behaviour it still offers (its success and its
  #     refusal paths exercised directly against the seam, never through a
  #     command), so "retained" means proven at the seam and unused by composition
  #     (spec v1.3 R1; AC-F1-8, TC-F1-009 + TC-F1-013).
  #   - **EIGHT OF THE SIXTEEN DELIVERED MERGE SUITES CHANGE AND ARE CLAIMED HERE**
  #     (spec v1.5 M1; AC-F1-1, TC-F1-014). Three INVERT: `merge-rebase` (no
  #     refresh attempts + the typed sync refusal), `merge-coordinator-boundary`
  #     (zero composed local landing + the declared-gap refusal, replacing its
  #     positive `git-squash-land` control), `merge-waivers` (the provider landing
  #     identity and its records, replacing the local-landing ordering assertion).
  #     Three are RE-POINTED: `merge-landing` and `merge-convergence` (a
  #     `git-squash-land` count becomes the provider landing call count),
  #     `merge-refusal-surface` (the `merge.rebase-conflict` matrix row becomes
  #     `merge.sync-required` with reason `dirty`). Two are MECHANICALLY EDITED
  #     because the retired golden forces them: `merge-bounds` (its
  #     capped-conflicting-paths case loses its producer and is re-pointed or
  #     retired, with its line/byte bound assertions kept) and `merge-determinism`
  #     (drops the retired `refusal-rebase` scenario name). The OTHER EIGHT
  #     (`merge-classification`, `merge-dry-run`, `merge-freshness`,
  #     `merge-gate-set`, `merge-privacy`, `merge-probe`,
  #     `merge-production-composition`, `merge-verification-record`) are GREEN
  #     UNEDITED and must not be touched. `tests/structure/merge-suite-obligations.test.ts`
  #     asserts the split in both directions; "the nine merge suites" and
  #     "three invert / thirteen unedited" are retired claims (M107).
  #   - The title is the provider-asserted request title VERBATIM; only when that
  #     signal is absent does the deterministic fallback
  #     `merge(<ref>): squash <sourceRef>` (change ref, then the request's source
  #     ref) apply. The message is exactly
  #     `Landed by the delivery lifecycle merge primitive.` for every landing — one
  #     bounded line, no interpolation, no provider prose. No flag, free-form
  #     input, or request body participates.
  #   - `result=merged` requires a read-back in which the provider asserts merged;
  #     the provider's merge commit is the recorded landing identity and its
  #     absence is unknown (`merge.landing-unverified`), never derived. Local
  #     containment stops being landing evidence, and the delivered "already
  #     merged" converged-replay branch therefore decides from the PROVIDER request
  #     read (and the recorded identity when present) with zero landing calls
  #     (test plan §7.6(v); TC-F1-004, TC-SYNC-005).
  #   - `landing.shaOnBase` WIDENS to `boolean | "unknown"` (spec v1.3 M3; DM-3,
  #     AC-F1-2): it reports containment of the provider-asserted merge commit on
  #     the base only when a local containment read ANSWERS for that identity, and
  #     reports `unknown` otherwise — after a provider landing with no fetch the
  #     object is not in the checkout, so a production run reports `unknown`, never
  #     a locally derived `true`. The human line renders the third state; legacy
  #     records carrying a boolean still read and replay exactly as delivered; the
  #     field is NEVER landing evidence (TC-F1-011/TC-F1-012). THE SUCCESS GOLDEN
  #     IS NOT DECLARED AS CHANGED: its injected containment read answers for the
  #     recorded identity, so it stays byte-identical, and the `unknown` rendering
  #     is asserted by a behaviour case instead of by a new golden.
  #   - The exact-head guard binds the landing to the evidence: the expected head is
  #     the verified head, and a moved head refuses `merge.gates-stale` with
  #     recorded and current head and ZERO landing calls.
  #   - The decision rule is total over `mergeable`, `conflicting`,
  #     `not-mergeable`, `unknown`/absent, and "landing fired, truth not observed":
  #     conflicting → one `merge.sync-required` reason `dirty`; not-mergeable →
  #     offer the guarded landing, then classify ONE bounded post-refusal re-read
  #     (a checks posture → the effective gate set's row with its delivered reason;
  #     ANY other re-read → `sync-required` reason `behind-unconfirmed` naming the
  #     observed provider state with the caveated remediation, because the
  #     delivered four-value normalization exposes no signal that could confirm an
  #     out-of-date head); unknown/absent → exactly one bounded exact-head re-read
  #     (recovered → the rule above; head changed → `merge.gates-stale`; still
  #     unknown → `merge.mergeability-unknown` retryable, `not_landed`, exit 2, no
  #     polling). The closed reason vocabulary is the PAIR `dirty` |
  #     `behind-unconfirmed`; there is NO `behind` arm to implement (spec v1.3 R4).
  #   - A declared landing gap refuses `merge.transaction-aborted` at exit 1 with
  #     evidence naming the operation and its declared `CapabilityGapReason`, zero
  #     landing attempts, zero local squash, zero fallback. No new identity: the
  #     concrete `merge` rows stay at nine.
  #   - NO internal rebase on the command path; no branch mutates the head it
  #     verified. `merge.rebase-conflict` stays declared and reserved and no
  #     delivered path emits it (§24.7 G-5) — which is why its golden SCENARIO
  #     retires in this phase (see the golden obligation below).
  #   - The classification-totality repair (F1, DEC-7): the composition's declared
  #     emittable set covers EVERY code its refusal branches emit — the
  #     `merge.gate.<gate-id>.failed` FAMILY as a declared family expression
  #     expanded by the proof, never an enumerated gate-id list — and every emitted
  #     pair resolves to a row whose declared kind equals the emitted kind, so a
  #     declared refusal cannot reach `fallback.internal`. The refusal-site scan is
  #     extended so a family emission is visible to it (test plan §7.6(iv)).
  #
  # THE GOLDEN DELTA THIS PHASE OWNS (ORDERING (h); §7.6(vi)):
  #   DELETE `tests/fixtures/merge/golden/refusal-rebase-human.txt` and
  #   `tests/fixtures/merge/golden/refusal-rebase-scripted.json`, and REMOVE the
  #   `refusal-rebase` entry from `tests/fixtures/merge/golden-scenarios.ts`: with
  #   the composed refresh removed, no CLI path can emit `merge.rebase-conflict`,
  #   and a kept scenario could only be regenerated by re-adding the mechanism this
  #   change removes. The identity is NOT retired (see above). The
  #   `refusal-gate-*` pair is declared READ-PINNED (see the SCOPE DECLARATION
  #   RULE) and moves in phase 3; this phase demands ELEVEN byte-identical files
  #   and TWO absent files, never thirteen byte-identical ones.
  #
  # Read-only controls in this phase (NOT declared): `packages/adapters/src/git/merge.ts`
  #   (the retained capability — declared nowhere, never edited),
  #   `MERGE_GIT_OPERATIONS`, the `merge.rebase-conflict` row,
  #   `tests/fixtures/merge/golden/success-*` and the other refusal pairs
  #   (byte-identical), and `.github/workflows/**`.
  #
  # Obligations:
  #   2.1 Re-point the transaction's landing port, remove the internal rebase, and
  #       implement the five-outcome decision rule over the delivered identities
  #       with the TWO-member reason pair.
  #   2.2 Compose the crafted metadata in the production composition from the
  #       request title and the declared fallback only.
  #   2.3 Widen `landing.shaOnBase` to `boolean | "unknown"`, answer it from the
  #       local containment read only when that read answers, and render the third
  #       state in `packages/cli/src/output/merge-text.ts`.
  #   2.3a **Widen the delivered state-layer validator in the SAME commit** (spec
  #        v1.5 N2a; ORDERING (i)): `packages/core/src/state/merge.ts`'s landing
  #        check requires a boolean today and would read a written `unknown` as
  #        torn state, so it accepts exactly `boolean | "unknown"` while a legacy
  #        boolean record reads exactly as before. The acceptance obligation is a
  #        WRITE-THEN-VERIFIED-READ ROUND TRIP plus the legacy read, asserted by
  #        TC-F1-012 — a type change alone is not acceptance (M105).
  #   2.4 Make the emittable declaration exhaustive over the family it emits, with
  #       the family expression and the extended refusal-site scan.
  #   2.5 Bring the EIGHT changed suites to their post-change obligations (three
  #       inverted, three re-pointed, two mechanically edited) and keep the OTHER
  #       EIGHT delivered merge suites GREEN UNEDITED. Author
  #       `tests/structure/merge-suite-obligations.test.ts` (TC-F1-014) asserting,
  #       in both directions, each changed suite's obligation, the three
  #       token-absence scans (no `git-squash-land` COUNT, no
  #       `merge.rebase-conflict` PRODUCER claim, no `refusal-rebase` scenario
  #       name) and the eight green suites' unchanged assertion inventories (M107).
  #   2.6 Author the seam-capability suite (TC-F1-013: `squashLand` on a clean and
  #       a conflicting branch; `refresh` clean, conflicting and broken) plus the
  #       `shaOnBase` behaviour and type cases (TC-F1-011/TC-F1-012).
  #   2.7 Author the taxonomy, head-guard, metadata, gap-refusal, retirement,
  #       convergence and classification-conformance suites this phase owns, each
  #       with its control (M1..M32, M96).
  #   2.8 Record the production-source scan's mandatory failing control: zero
  #       composed callers of the local landing/refresh, and no platform-CLI
  #       literal on any landing path.
  #   2.9 Delete the retired golden pair and its scenario entry (see the golden
  #       obligation); do not touch the `refusal-gate-*` pair.
  #
  # Verification (expected signal: exit 0; one landing call with the captured
