#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   regression control (the delivered read-only suites, the topology pin
#   `tests/structure/ci-topology-pin.test.ts`, `scripts/checks/**`,
#   `.github/workflows/**`, `tests/boundaries/**`, `packages/adapters/src/git/merge.ts`)
#   is NOT declared: declaring it would only produce an advisory `plan diff`
#   `undeclared-missing` for a file that needs no edit. Every file the test plan
#   names as an assertion site to CREATE or EXTEND is declared by the phase that
#   owns that half of the case.
#   `tests/behaviour/providers/**` IS NOT WHOLLY READ-ONLY (spec v1.5 M2): exactly
#   THREE of its suites move with the tenth operation — `github-cli-transport`,
#   `github-landing`, `github-collection` — and are declared in phase 5; every
#   OTHER suite under that tree stays read-only. Appendix H's derived-consumer
#   rows are the authority for which is which.
#   ONE DECLARED EXCEPTION, stated so rule and declaration do not contradict:
#   `doc/decisions/00-index.md` in phase 1 is a CONDITIONAL-STAGING declaration.
#   It is clean at plan time and its rows are committed; it may be touched (a
#   status row or a typo) while the three records it indexes land. It is never a
#   licence to edit an unrelated row.
