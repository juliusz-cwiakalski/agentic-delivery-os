phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — The additive contract surface and its synchronized pins, with the
  # three decision records landed on the branch (DEC-1..DEC-5 declarations).
  #
  # Goal: every additive declaration this change owes becomes visible in ONE
  # commit together with every count that states it — so no later phase can move a
  # table without its counterpart, and so no phase ever runs with a stale pin.
  #
  # Owns: ACs — none (a declaration phase; see CROSS-PHASE CARRIER CASES).
  #       TCs — TC-SYNC-001 (the IDENTITY-TOTAL half: seven pin sites, the
  #       legacy-token scan, `PM_NOTES_LINT_CODES` at five, the two identity-count
  #       pages; its row-REACHABILITY assertion is authored in phase 7 as an
  #       authoring split inside this one owner) and TC-SYNC-004. 2 of 87.
  #       TC-SYNC-010 (the three prose-only operation-count pages) is a SEPARATE
  #       case owned by phase 7 and is NOT claimed here (test plan v1.7).
  #
  # Contract (DM-1, DM-2 rows, DM-8 row, API-2's reason PAIR; ADR-0012, TDR-0040
  # and ODR-0005 are cited, never duplicated):
  #   - `DeliveryRequest` gains ONE additive optional `title` (provider-asserted,
  #     verbatim; absent = unknown, never derived). No delivered field is removed,
  #     retyped, or made required; no schema version changes (DM-1). The optional
  #     probe lives in `tests/types/delivery-request-title.type-test.ts` (TC-SYNC-004's
  #     target), not only in the inventory expectation.
  #   - The `merge` domain kind carries two additive concrete rows:
  #     `merge.sync-required` (user, non-retryable, `not_landed`,
  #     user-validation → exit 1) and `merge.mergeability-unknown` (platform,
  #     retryable, `not_landed`, platform-provider → exit 2), taking the concrete
  #     rows 7 → 9. The `merge.gate.<gate-id>.failed` open-slot family is
  #     UNCHANGED in identity and slot rule. `merge.rebase-conflict` is retained
  #     verbatim, stays in the declared emittable set, and carries its revisit
  #     trigger (DM-2, §24.7 G-5). Its SCENARIO is retired in phase 2; the row is
  #     not.
  #   - `merge.sync-required`'s closed reason PAIR `dirty`|`behind-unconfirmed` is
  #     declared ONCE (packages/core/src/contracts/merge.ts) and consumed by the
  #     two refusing branches, the row's documented entry and the caveated
  #     `behind-unconfirmed` remediation. NO `behind` member exists: the delivered
  #     normalization exposes no signal that could confirm an out-of-date head
  #     (spec v1.3 R4, Appendix G-1). No second vocabulary, and no third value.
  #   - The additive optional bounded refusal-evidence field carrying the closed
  #     pair `recorded`|`probe` is DECLARED here as a closed constant pair; its
  #     producer, rendering and the two moved goldens land in phase 3. Exactly one
  #     field — a second evidence field is an escalation trigger.
  #   - The documented pm-notes lint ROW SET gains `lint.phases.divergent` as its
  #     sixth row in the declared rule order, documented and machine-declared
  #     together, so the `lint` kind's concrete MACHINE rows move 6 → 7 and the
  #     identity total moves 149 → 152. The five delivered rows keep their codes
  #     and remediation, and the plan-target row is untouched (DM-8, AC-F5-6).
  #     **`PM_NOTES_LINT_CODES` STAYS FIVE**: it declares the identities the
  #     pm-notes-only lint can emit, and the divergence finding is a cross-surface
  #     finding of the both-target invocation. No phase widens that constant, and
  #     TC-FLOOR-001 fails one that does (spec v1.3 F8).
  #   - NO closeout step id, NO residue kind, NO adapter operation, NO recorded
  #     closeout operation name, NO conformance flow step and NO assertion family
  #     is declared here: see ORDERING (c). Those declarations move with the
  #     surfaces that make them meaningful in phase 5, and declaring them early
  #     would leave a delivered structure gate red inside this commit.
  #
  # Pin movement IN THIS COMMIT (ORDERING (a); the pairs block in this file's
  # header is the checklist):
  #   `doc/spec/features/feature-result-contract.md` gains the three rows, the
  #   `7 → 9` concrete merge-row statement, the `5 → 6` documented lint-row
  #   statement and the `149 → 152` statements on BOTH sides;
  #   `doc/spec/features/feature-ceremony-runner.md`'s three `149 identities`
  #   statements move with them (it is read by the delivered no-leftover pin
  #   scan), and `doc/spec/features/feature-metrics.md`'s three carried statements
  #   move 149/148/65/`+115` → 152/151/65/`+118`;
  #   the SEVEN `149` pin sites move to `152` in the same commit (including
  #   `tests/checks/supervision-error-socialization.test.ts`, whose
  #   `sourceEntries`, `documentedRows` and `BASELINE_ROWS.length + 115`
  #   arithmetic all move), and the documented↔machine comparison is extended to
  #   the three new rows with a paired negative for each (no wildcard, no
  #   exemption).
  #   THE LEGACY-TOKEN EXTENSION LANDS HERE TOO (spec v1.5 minors; N7; M108):
  #   `tests/structure/error-table.test.ts`'s no-leftover scan admits `149`, `148`
