#       b. `doc/spec/features/feature-ceremony-runner.md` — three
#          `149 identities` statements inside `APPENDIX_D_FILES`        (phase 1)
#       c. `doc/spec/features/feature-adapter-reference-behavior.md` — spec v1.5
#          M2's reclassification: `tests/structure/reference-behavior.test.ts`
#          set-equals this page's transport table to the closed operation set, so
#          the table and its per-operation rows move with the tenth operation in
#          **phase 5**, never in the documentation phase alone (ORDERING (k)).
#
#   (2) CASE-BOUND — a case this change authors asserts the page's exact
#       statements, and that case lives in the phase that moves them. ONE page:
#       `doc/spec/features/feature-metrics.md` (149/148/65/`+115` →
#       152/151/65/`+118`), asserted by **TC-SYNC-001** whose identity half is
#       phase 1. It is NOT delivered-check-bound: no shipped suite reads it; the
#       binding is the case, and the case's phase is phase 1.        (phase 1)
#
#   (3) AC-BOUND — an acceptance criterion itself requires the page's inventory,
#       so the page cannot wait for the documentation phase without failing the
#       AC. ONE page: `doc/spec/features/feature-closeout.md`, because **AC-F4-1
#       requires "the documented inventory states thirteen"** (and DM-4: "the
#       documented inventory changes from twelve to thirteen steps in the same
#       change"), so its step inventory moves with the step in **phase 5**. Its
#       surrounding substance is reconciled in phase 7.               (phase 5)
#
#   (4) TEST-PLAN-BOUND — no AC and no delivered check binds the page; a §7.6
#       row names it as an editable target of a phase, and the page moves there
#       for scope completeness. ONE page: `doc/guides/milestone-management.md`,
#       named by §7.6 row 5's milestone targets. **It is the one page that COULD
#       wait for phase 7 without breaking an AC** — its content (closure runs
