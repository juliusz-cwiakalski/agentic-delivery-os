# GH-349 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly. Extra phase data (goal, obligations, AC/TC ownership, gate commands,
# the all-or-nothing ripple, the invariants) rides in YAML comments so the
# parsed document stays schema-strict; the plan declares phases and scope only —
# no `tasks` key and no progress log (progress is a pm-notes `notes:` entry
# naming the plan phase id, the commit hash, and the gate result).
