# OPEN ITEMS AND PRECONDITIONS AT PLAN TIME (OQ-1 is a PRECONDITION, not a note;
#   OQ-2/OQ-3 and RSK-1/DEC-8 carry; D8 is recorded as closed so a reader sees it):
#   OQ-1 (owner judgment) — PDR-0005's scope reading. **A GATE ON PHASE 5, NOT A
#     DELIVERY-TIME SWITCH.** Delivery implements the SCOPED reading only, and the
#     owner's answer must be recorded BEFORE phase 5 starts. A GLOBAL reading is a
#     specification revision and an explicit scope reduction whose true blast
#     radius is phase 5's entire atomic ripple: it withdraws the closure half and
#     with it the tenth adapter operation, the 30-cell parity row and its three
#     adjudications, the seventh closeout operation name and its argument arm, the
#     appended flow step and the seventh assertion family, the mock routes and
#     projections, Appendix E items 1–11, and the write arms of AC-F4-2, AC-F4-5,
#     AC-F4-8 (spec v1.3 OQ-1/RSK-2/Appendix G-6). No agent may decide that a
#     milestone closes; a plan that proceeds to phase 5 without the answer is
#     blocked, and the phase must not be "planned around".
#   OQ-2 (measurement) — whether the acceptance corpus already diverges. Phase 4
#     measures it with G11; a hit is recorded and investigated as a second-writer
#     defect, never suppressed.
#   OQ-3 (fixture) — GitHub's milestone write surface, read-back shape and the
#     provider's attached-item PAGE SIZE (which is the effective single-read
#     bound). Settled by committed synthetic fixtures in phase 5. The read is ONE
#     bounded page at the declared page size with no follow-up pagination, so a
#     milestone above one page reports `attached-set-truncated` and cannot close
