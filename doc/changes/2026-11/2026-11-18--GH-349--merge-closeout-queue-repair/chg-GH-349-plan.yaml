# QUEUE: PROOF OR REPAIR, NEVER WIDENING (F-6, §24.7 G-7, DEC-6):
#   Phase 6 proves seven properties through the production composition, each with
#   a mutation control that injects exactly one breach over the production shapes
#   (`tests/fixtures/queue/integrity-breaches.ts` — a compile error, not a passing
#   no-op). A repair happens ONLY where a control demonstrates a breach, restores
#   the declared sentence, and changes no vocabulary value, key, flag, or refusal
#   into a success (AC-F6-2, TC-F6-012). The phase MUST record which of the seven
#   proved clean and say so explicitly — "property proved clean; no repair" — so a
#   silent no-op phase does not read as an unfinished one at the DoD gate. The
#   automatic `landed` removal keeps its non-step, fail-open, merge-truth-gated,
#   idempotent contract inside the transaction's existing fence, including when
#   the milestone step was withheld or gapped (AC-F6-4, TC-F6-008).
