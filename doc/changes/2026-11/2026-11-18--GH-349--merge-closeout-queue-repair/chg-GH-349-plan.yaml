#   there) or re-planned — never by deleting or renaming an assertion, never by
#   regenerating a golden, never by widening a vocabulary or an allowlist.
#
# DOCUMENTATION (Appendix A as amended by spec v1.3 M2 and spec v1.5 M2; the
#   "docs untouched" statement):
#   A delivery phase edits a system specification page ONLY when a named
#   obligation binds THAT page to THAT commit. The rule is not "a delivered check
#   reads it" — that was too narrow, and leaving it implicit is what made phase
#   5's two page edits look like a silent widening (readiness-iter-2 N1/N4). There
#   are FOUR CARRIER CLASSES, each with its binding named:
#
#   (1) DELIVERED-CHECK-BOUND — a delivered suite reads the page's live content,
#       so the page must move with the code that suite pins. THREE pages:
#       a. `doc/spec/features/feature-result-contract.md` — the documented error
#          table and its `149` statements, read by
