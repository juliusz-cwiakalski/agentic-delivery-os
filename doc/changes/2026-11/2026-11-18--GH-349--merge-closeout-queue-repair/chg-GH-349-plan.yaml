  # ---------------------------------------------------------------------------
  # Phase 6 — Queue integrity proved property by property, repaired only where a
  # control demonstrates a breach, and widened by nothing (F-6; DEC-6; API-7).
  #
  # Goal: each of the seven declared properties carries a named proof over the
  # production composition with a control that injects exactly one breach and
  # fails naming the property — and the change reports which properties proved
  # clean.
  #
  # Owns: ACs — AC-F6-1..AC-F6-6 = 6 of 46.
  #       TCs — TC-F6-001..012 = 12 of 87.
  #
  # Contract (F-6, API-7; AC-F6-1 as amended by spec v1.3 F10):
  #   - The seven properties: claim integrity (single-flight naming the live
  #     holder, same-holder renewal, stale takeover with incident evidence,
  #     cross-ref lease conflict); park integrity (closed cause vocabulary, the
  #     battery-only cause refused by name on the operator path, an
  #     expiry-carrying cause requiring its expiry, a non-expiring cause refusing
  #     one, and removal releasing the active park first); reconcile integrity
  #     (done/canceled only, unobserved items retained, a bounded examined set
  #     reporting its remainder, `--ref` narrowing to exactly one entry); CRUD
  #     integrity (one edge per accepted add, a one-edge `dep remove`, an add-only
  #     cycle check naming the existing path, no cascade, unchanged
  #     `added`/`updated`/`noop` and `removed`/`noop`); reason-bearing removal (the
  #     four closed reasons, the full refusal set, zero appends on any refusal, and
  #     the deliberate non-idempotency of the explicit verb preserved alongside the
  #     converging automatic path); single-flight (the holder named at the envelope
  #     root within its bound, and the holder identity is the live one);
  #     append-position presence (presence by record sequence, never timestamp
  #     text, a later re-declaration restoring an entry with no special case, and
  #     no representable tie).
  #   - EACH CONTROL DECLARES ONE OF TWO SHAPES, AND NONE CLAIMS A PRODUCTION
  #     BREACH (spec v1.3 F10; AC-F6-1): a property that HOLDS in production cannot
  #     be violated by any production input and no seam exists to inject into, so
  #     each of the seven controls is either a DERIVED COMPARISON (the property
  #     recomputed from the delivered records and compared) or a DELIBERATELY
  #     BROKEN DOUBLE (a typed double built from
  #     `tests/fixtures/queue/integrity-breaches.ts`, so a breach cannot silently
  #     stop being a breach when a type changes — a compile error, not a passing
  #     no-op). Each control fails NAMING the property. A token assertion that
  #     cannot fail is a blocking finding (M98).
  #   - A repair happens ONLY where a control demonstrates a breach; it restores
  #     the declared sentence and changes no vocabulary value, key, flag, or
  #     refusal into a success (AC-F6-2, TC-F6-012). Where a property holds, the
  #     change adds proof and nothing else.
  #   - The phase MUST record which of the seven proved clean and say
  #     "property proved clean; no repair" explicitly per property, so a silent
  #     no-op does not read as an unfinished phase at the DoD gate, and MUST report
  #     the metric as 7/7 property suites carrying a declared control shape and
  #     3/3 named defects carrying a defect-named regression (spec v1.3 F19) — the
  #     two counts are never conflated.
  #   - The automatic `landed` removal is proved unchanged across the milestone
  #     variants (applied, withheld, gap): non-step, fail-open,
  #     merge-truth-gated, idempotent, inside the transaction's existing fence,
  #     with zero duplicate removals on re-run and no second fence (AC-F6-4).
  #   - Nothing here moves the closeout interaction, and nothing widens the verb
  #     set, the record kinds, the state keys, the flag grammar, the caps, or the
  #     refusal-detail bound (AC-F6-3, AC-F6-6, §24.7 G-7).
  #
  # Conditional edit: `packages/core/src/app/queue.ts` is declared because a
  #   failing control may require a repair THERE. If all seven prove clean, the
  #   file is not edited and `plan diff` reports at most an advisory
  #   `undeclared-missing` for it — and the phase says so in its record. The
  #   declaration is never a licence to widen the surface.
  #
  # Obligations:
  #   6.1 Author `tests/behaviour/queue-integrity.test.ts` with seven named
  #       property blocks, each asserting its declared outcome through the
  #       production composition AND declaring its control shape — DERIVED
  #       COMPARISON or DELIBERATELY BROKEN DOUBLE (spec v1.3 F10).
  #   6.2 Author the seven typed breach/control builders, one per property, so a
  #       breach cannot silently stop being a breach when a type changes (a
  #       compile error, not a passing no-op) and so a token assertion cannot pass
  #       for a control (M98).
  #   6.3 Author the surface and bounds pins: the verb/record-kind/state-key/flag
  #       exact-set equality with add/remove mutations, the folded-read cap, the
  #       reconcile cap and remainder, the four removal reasons and the
  #       refusal-detail bound (M72).
  #   6.4 Extend the closeout × queue-removal suites for TC-F6-008 across the
