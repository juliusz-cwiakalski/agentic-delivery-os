    type: info
    date: "2026-11-18"
  - text: "DoR gate iteration 1 = NOT_READY (readiness-review/readiness-iter-1.md).
      Facets PASS: ticket alignment, scope honesty, decision capture. FAIL:
      specification quality, carrier/observability, testability,
      traceability/coverage, plan buildability/ordering, documentation-impact
      identification, risk/boundary honesty. Six blocking, nine major. Blocking:
      (1) the refusal-rebase golden scenario is unproducible once refresh leaves
      the command while phase 2 demands byte-identical goldens; (2) three
      delivered merge suites invert and no phase declares them (the plan said
      'nine merge suites'; sixteen exist); (3) a seventh 149-identity pin site
      (supervision-error-socialization) is undeclared while phase 1 moves the
      total to 152; (4) reason value `behind` is unreachable under the delivered
      four-value normalization, so AC-F2-2's decisive arm and two cases assert a
      dead branch; (5) the closeout operation-name set (6 to 7) and the flow
      registry step count (14 to 15) are missing from the additive inventory
