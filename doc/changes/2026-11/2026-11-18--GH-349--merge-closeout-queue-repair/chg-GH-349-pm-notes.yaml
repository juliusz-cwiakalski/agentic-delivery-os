  - text: >-
      Plan phase 6 COMPLETE (implementation commit
      d1213762dfd5a73c557189775fbe7325e44818ac): the seven queue-integrity
      properties proved through the production composition, each with one
      declared-shape control that fails naming the property, and the automatic
      landed removal proved unchanged across the milestone variants. NO REPAIR
      WAS REQUIRED: every property proved clean ("property proved clean; no
      repair"), so the conditional packages/core/src/app/queue.ts was NOT edited
      and the commit's scopeDrift is empty. SEVEN PROPERTIES AND THEIR CONTROL
      SHAPES: (1) claim integrity — deliberately broken double (a renewal double
      appending a second lease record; the production outcomes are same-holder
      renewal with one record and the same lease id, a stale takeover with one
      incident naming the previous holder, queue.single-flight naming the live
      holder, and queue.lease-conflict on a same-repository other-ref hold); (2)
      park integrity — deliberately broken double (an operator park writer that
      accepts the battery-only liveness-stall cause; the production path refuses
      it by name, refuses an out-of-vocabulary cause, requires an expiry for
      provider-window/peak-window, refuses one for owner-hold, and a removal
      leaves no active park); (3) reconcile integrity — deliberately broken
      double (a tracker-read double that reports in-review as done; the
      production run removes only done/canceled, retains in-progress/in-review,
      reports the not-found and the 100-entry cap with remainder 5 on 105
      entries, and --ref narrows to one entry); (4) CRUD integrity — derived
      comparison (an independent edge-multiset re-derivation; one edge per
      accepted add, a one-edge dep remove, the add-only cycle check naming the
      existing path, and no cascade — the dependent survives with byte-identical
      records and remains held dependency-unobserved); (5) reason-bearing
      removal — derived comparison (an independent append-sequence comparison on
      each of the five refusals, each appending zero records, plus the
      deliberate non-idempotency of the explicit verb against the converging
      automatic path); (6) single-flight — deliberately broken double (an
      envelope double that returns the holder only in nested detail and one that
      returns a stale holder; the production refusal carries the live holder at
      the envelope-root detail within COMMAND_FAILURE_DETAIL_MAX_CHARS=128); (7)
      append-position-presence — derived comparison (a sequence-only
      re-derivation compared with a timestamp-text one under deliberately
      inverted timestamps, plus a re-declaration special-case breach; the
      production fold is absent after the removal and present after the earlier-
      timestamp re-declaration with no special case). Each control is exercised
      against a real observation captured from the production composition, and a
      control that returns no divergence is itself a named failure (the M98/
      TC-F6-012 guard). FOUR properties use derived comparisons and THREE use
      deliberately broken doubles, so the metric is 7/7 property suites with a
      declared control shape. The 3/3 named defects (F1, F4, F8) are reported
      SEPARATELY as phase 7's declared obligation — each carries a defect-named
