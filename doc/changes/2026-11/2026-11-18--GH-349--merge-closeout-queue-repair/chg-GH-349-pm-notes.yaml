      step needs a seventh ConformanceAssertionFamily member while DM-7 forbids
      one. Reopened specification, test_planning and delivery_planning."
    type: blocker
    date: "2026-11-18"
  - text: "PM direction for the DoR-1 remediation (bounded): R1 retire the
      refusal-rebase goldens (2 moved + 2 retired) and prove the retained
