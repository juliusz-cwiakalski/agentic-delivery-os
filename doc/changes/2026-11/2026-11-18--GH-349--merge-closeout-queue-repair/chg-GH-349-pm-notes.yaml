      truncation withholding."
    type: decision
    date: "2026-11-18"
  - text: "RETRO (DoR iteration 1): every blocking finding was a real delivered-tree
      fact the authors could have read — a golden scenario, three suites, a
      seventh pin site, a normalization branch, two exact pins, a closed union.
      Common cause: the artifacts were reasoned from the spec's own vocabulary
      and the decision records, never from the tests and contracts that enforce
      them. Process fix: before the DoR gate, require an author pass that greps
      the enforcing surfaces (every test that pins a count, every union a new
      value enters) and lists them in the plan's scope."
    type: retro
    date: "2026-11-18"
  - text: "RETRO (tooling defect, observed in this session): a `phase complete`
      read-modify-writes the pm-notes document, and an edit made to that
      document while a completion was already running was overwritten by the
      completion's pre-edit snapshot — two appended notes were lost, with no
      error and no diff. Reproduced once (delivery_planning completion vs a
      concurrent note append). Mitigation used here: append notes only when no
      phase command is running, and verify the note count after each completion.
      Candidate follow-up: the phase write path should read the document under
      the same fence it writes under, or refuse a snapshot it has proven stale.
      Out of scope for GH-349 (TDR-0040 fixes the derivation, not the
      read-modify-write race); not filed as a ticket because ticket creation
      needs human approval."
    type: risk
    date: "2026-11-18"
