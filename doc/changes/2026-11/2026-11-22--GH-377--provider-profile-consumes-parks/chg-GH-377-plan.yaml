        - tests/structure/content-inventory.test.ts
        - tests/structure/provider-policy-adoption-reference.test.ts
        - tests/fixtures/provider/profile/probes/fixtures.ts
  - id: 2
    title: Seat-level re-check, substitution, and the named refusal
    kind: delivery
    summary: Re-check every effective seat model's provider against the same memoized availability facts, substitute the seat from the next eligible profile in preferenceChain order with the capability gate preserved, and refuse provider.profile.unavailable naming seat and provider when no profile supplies it (TC-PROFILE-066, 067, 068, 069, 070, 092, 093); the selected profile, tier, rung and agent overrides are otherwise unchanged.
    scope:
