    title: Park-aware availability facts and probe composition
    kind: delivery
    summary: compose provider availability from declaration, enablement, declared peak, active provider-attributable parks and the per-target observation seam, in one memoized probe per distinct provider fed by the profile-resolve handler's state store, with one verified park fold per resolution and a named unavailable verdict when that fold read fails; the boundary-stale freshness rule, the never-stale provider with no declared target, the inert absent observation and the no-network, credential, timer or write evidence cases are all proved here.
