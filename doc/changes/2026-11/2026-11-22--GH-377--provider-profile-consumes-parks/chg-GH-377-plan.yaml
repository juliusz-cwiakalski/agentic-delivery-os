    kind: delivery
    summary: Pin the eight-cause classification fixture with a subject and effect per cause and its drift arms, prove the exact-expiry, cleared-condition and never-parked equivalences and the zero-write audit, prove determinism and memoization over one hundred providers, and prove the unchanged chain resolver (TC-PROFILE-076, 077, 078, 079, 080, 081, 082, 083, 084, 085, 086); the four documentation paths are declared for final-diff coverage only, are excluded from this phase's commit, and are reconciled by `@doc-syncer` in phase 7; delivery authors none of them.
