  - id: 2
    title: Seat-level re-check, substitution, and the named refusal
    kind: delivery
    summary: narrow the seat guarantee to recorded unavailability only, re-check every effective seat model's provider against the same memoized availability facts, substitute the seat from the next eligible profile in preferenceChain order when a provider is not recorded-unavailable and satisfies the required capability with the capability gate preserved, and refuse with the owner-mandated unavailable error at exit 2 naming both the seat and the provider when no later eligible profile supplies that seat; the eligibility list is carried through unchanged, with the selected profile still eligible, later profiles still shadowed and unprobed, no blocker appended and no verdict flip, while a seat model on an undeclared, disabled or peak-parked provider stays outside this gate.
    # TC ownership: TC-PROFILE-066, TC-PROFILE-067, TC-PROFILE-068, TC-PROFILE-069, TC-PROFILE-070, TC-PROFILE-092, TC-PROFILE-093, TC-PROFILE-094
