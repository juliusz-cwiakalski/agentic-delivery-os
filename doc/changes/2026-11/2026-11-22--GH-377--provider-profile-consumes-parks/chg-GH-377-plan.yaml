tier:
  name: full
phases:
  - id: 1
    title: Park-aware availability facts and probe composition
    kind: delivery
    summary: Compose provider availability from declaration, enablement, declared peak, active provider-attributable parks and supplied observations in one memoized probe, feed the profile-resolve handler's state store into it, and prove the probe, edge, closure and freshness-bound cases (TC-PROFILE-059, 060, 061, 062, 063, 064, 065, 087, 088, 091); one verified park fold per resolution, per-provider memoization, fail-closed on a failed read, and no network, credential, timer or write.
    scope:
      files:
        - packages/cli/src/edge.ts
        - tests/behaviour/provider-profile-probes.test.ts
        - tests/behaviour/provider-profile-edge-wiring.test.ts
        - tests/behaviour/provider-profile-selection.test.ts
        - tests/checks/provider-profile-hermetic.test.ts
