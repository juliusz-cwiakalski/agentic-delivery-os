    kind: delivery
    summary: Pin the eight-cause classification fixture with a subject and effect per cause and its drift arms, prove the exact-expiry, cleared-condition and never-parked equivalences and the zero-write audit, prove determinism and memoization over one hundred providers, and prove the unchanged chain resolver (TC-PROFILE-076, 077, 078, 079, 080, 081, 082, 083, 084, 085, 086); the declared documentation paths are the phase-7 reconciliation scope owned by @doc-syncer, and delivery does not author them — the declaration exists only so the final diff stays within plan scope.
