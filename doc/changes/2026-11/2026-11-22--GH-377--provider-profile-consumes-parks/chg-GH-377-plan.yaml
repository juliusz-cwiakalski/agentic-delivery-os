    kind: delivery
    summary: Pass the same park-aware facts through resolveProfileContextFrom's injected reader and the dispatch nomination predicate, and prove refusal projection, per-seat env-record/binding agreement, all-or-nothing emission, nomination parity, recovery through the edge and the refreshed goldens (TC-PROFILE-071, 072, 073, 074, 075, 089, 090); the CLI profile-resolve wiring landed in phase 1.
