  - text: "Retro (DoR iteration 2): the second gate caught a projection-shape error
      that would have made the only edge test for the seat refusal
      unimplementable, plus a real ambiguity between candidate substitution
      searching and the unprobed selection-time list. Root causes: the spec
      stated the delivered list's 'not probed' property as an absolute without
      distinguishing the later substitution search, and the test plan asserted
      the refusal envelope from memory rather than from the delivered
      projection. Improvement: whenever a new refusal path is specified, name
      the delivered envelope shape and event set in the same sentence, and
      distinguish selection-time verdicts from post-selection searches."
    type: retro
    date: "2026-11-22"
  - text: "Retro (commit primitive, second environment defect): two more commits
      were refused by the tracker-reference and subject-case guards. Root
      causes: (a) deterministic phase summaries embedded TC ids that the
      tracker-ref regex reads as invented references, and a standalone commit's
      first staged path was the `TDR-0075` filename; (b) every phase summary
      began with a capital verb, so the rendered Conventional Commit description
      was sentence-case. Fixed by moving TC ownership to YAML comments, adding a
      lowercase safe-summary declaration-only planning phase for the decision
      and documentation scope, and committing the TDR through that phase. Cost
      ~15 minutes across three attempts. Improvement: plan phase summaries must
      be lowercase, free of `<PREFIX>-<number>` tokens, and a decision record
      must never be the only pending path of a standalone commit."
    type: retro
    date: "2026-11-22"
  - text: "DoR ITERATION 1 = NOT_READY (Pause Required: no). Findings: F-1 critical
      cross_artifact_consistency — AC-F3-1/TC-069 pin
      `provider.profile.capability-denied` for a capability-inadequate
