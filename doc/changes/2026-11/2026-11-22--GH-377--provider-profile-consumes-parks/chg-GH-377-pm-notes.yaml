  - text: "Post-delivery artifact alignment (PM-decided, autonomous): the coder
      surfaced two literal mismatches between the artifacts and delivered
      behaviour, both fixed as spec v1.3 / test plan v1.3 with no scope, AC set,
      DOD, TDR, or vocabulary change. (1) AC-F1-1/TC-059 now accept the
      delivered lifecycle `outcome` (`selected` or `switched` on the first
      base→paid target move) while pinning the selection facts; §8.5 states the
      criterion asserts the selection facts, not a forced lifecycle outcome. (2)
      TC-095 now uses three providers (A short bound stale, B long bound fresh,
      C no target never stale) because the delivered `provider.profiles.watch`
      shape is one target per provider name. DoR iteration 3 remains READY; per
      the three-iteration cap no fourth gate run is made, and the alignment
      changes no facet."
