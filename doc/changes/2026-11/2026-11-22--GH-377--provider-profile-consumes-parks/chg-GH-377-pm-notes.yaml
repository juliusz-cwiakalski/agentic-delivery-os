decisions:
  - text: "Scope source is the ticket body plus the owner-authored
      implementation-pointer comment of 2026-11-22. The comment is binding: the
      defect is the synchronous profile probe in `createResolvedProviderProbe`
      (`packages/cli/src/edge.ts`), seat substitution is required, the committed
      `provider.profiles` policy must not be edited, the operator-local
      `config.local.yaml` workaround must not be required, GH-366's
      branch/worktree is out of scope, and the PR stays open against
      `main-tools`."
    date: "2026-11-22"
  - text: "PM-decided (autonomous): the profile probe reads the same verified
      provider-park fold the `provider parks list` surface reads. It performs no
      live quota fetch and no watch transport call; the delivered contract that
      the synchronous CLI probe never fetches quota is preserved. Recorded parks
      and read-time expiry are the eligibility input; recovering a provider
      requires no timer, no write, and no configuration edit."
    date: "2026-11-22"
  - text: "PM-decided (autonomous): the fix stays in the resolver/composition seam,
      not in policy data. The committed `provider.profiles` base `delivery`
      profile and its `paid` fallback remain unchanged. Acceptance evidence
      comes from fixtures over recorded park state plus the delivered CLI
      surfaces; the live z.ai quota state is corroborating evidence, never a
      test dependency."
    date: "2026-11-22"
  - text: "PM-decided (autonomous): chain-level park causes (`chain-exhausted`,
      `reevaluation-cap`) are not provider-attributable and must not be read as
      a provider's own unavailability. The clause that every declared park cause
      is pinned is satisfied by a fixture over the full eight-value
      `PARK_CAUSES` taxonomy that classifies each cause's subject and proves no
      cause silently clears a parked provider."
    date: "2026-11-22"
  - text: "PM-decided (autonomous): decision ids TDR-0075..0076 remain reserved for
      this change only if a genuinely precedent-setting choice emerges.
      Re-verified on `origin/main-tools` at intake: the maximum is TDR-0074, so
      the reservation stands. No TDR is authored pre-emptively."
    date: "2026-11-22"
  - text: "OQ-1 RESOLVED (PM, autonomous): a stale watch observation is a named
      eligibility blocker using the existing `watch-stale` watch-only condition.
      It adds no park cause, skip reason, announcement, timer, cache, or state
      write, so TDR-0062's closed sets are preserved. A live read observes at
      the read instant and is never stale; this is the fail-loud guard for
      composition-supplied observations and the park-expiry clamp, not a new
      steady-state ineligibility. The specification states this contract; no TDR
      is needed."
    date: "2026-11-22"
  - text: "OQ-2 RESOLVED (PM, autonomous): seat resolution independently re-checks
      the seat model's provider against the same availability facts. When the
      selected profile's seat model pins a parked provider, the seat is
      substituted from the next eligible profile in `preferenceChain` order and
      that model is emitted; when no eligible profile supplies the seat,
      resolution refuses `provider.profile.unavailable` naming the seat and the
      provider. This is the ticket's required behaviour, expressed as a
      contract; no TDR is needed."
    date: "2026-11-22"
  - text: "OQ-1 REVISED (DoR iteration 1, finding 5): making a stale watch
      observation an eligibility blocker narrows TDR-0062 D2's absolute
      statement that `watch-stale` never enters profile eligibility. That is
      precedent-setting, so the earlier 'no TDR needed' statement for OQ-1 is
      superseded: `@decision-advisor` authors TDR-0075 to record the boundary
      and its justification, and the specification cites it. TDR-0076 stays
      unused unless a second genuine decision emerges."
    date: "2026-11-22"
