  - text: "Spec contradiction to reconcile in phase 7:
      `feature-provider-profiles.md` currently states that the production probe
      checks only declared, enabled, and peak window, and that quota conditions
      reach the seam through the daemon, never the CLI probe. The delivered
      change makes recorded parks a synchronous eligibility input while keeping
      the no-live-fetch rule, so that page (and any peak-pausing/parks-guide
      text that repeats the old boundary) must be updated. The same page's
      overview already says an unavailable condition switches the target, so the
      implementation is the gap, not the intent."
    type: risk
    date: "2026-11-22"
  - text: "Token-budget constraint recorded from the owner comment: DeepSeek is the
      only live rail with roughly $5 remaining and the key is shared. Keep the
      plan small and checkpoint each plan phase commit; if the provider floor is
      hit, finish the current phase commit and write a clean checkpoint in these
      notes."
    type: info
    date: "2026-11-22"
  - text: "Retro (environment defect): the first `phase complete clarify_scope`
      failed with `commit.commitlint-failed` although the generated message
      `docs(GH-377): update doc` is valid. Root cause: the commit primitive
      spawns bare `commitlint` via execFile; it is not on the runner shell PATH,
      and the ENOENT maps to status 1 with empty output, which the probe reports
      as 'commitlint rejected the message' instead of 'commitlint could not be
      executed'. Re-running with `PATH=\"$PWD/node_modules/.bin:$PATH\"`
      succeeded. Cost ~5 minutes; out of scope to fix here (probe classification
      belongs to the conformance/repair line), but every subsequent commit from
      a bare shell must carry the PATH prefix."
    type: retro
    date: "2026-11-22"
