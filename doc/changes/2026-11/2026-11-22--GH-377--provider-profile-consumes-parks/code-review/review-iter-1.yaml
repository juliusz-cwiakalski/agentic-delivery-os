summary: >-
  The GH-377 delivery is faithful to spec v1.3. The composed profile availability
  probe now folds the verified provider-park ledger once per resolution and treats
  an active provider-attributable park (six causes; `chain-exhausted` and
  `reevaluation-cap` excluded) and a per-declared-target stale observation as
  eligibility inputs, preserving declaration/enablement/declared-peak and adding no
  live fetch, credential read, network call, sleep, or state write. Seat-level
  re-check consumes recorded unavailability only, substitutes from the first valid
  later profile through the same memoized probe without re-verdicting the eligibility
  list, and refuses `provider.profile.unavailable` as the delivered `data` envelope
  at exit 2 naming seat and provider, with the list carried unchanged, no profile
  event, and no env record. The substituted model travels in the existing per-seat
  map so the env record and the per-spawn binding agree by construction, and the
  dispatch nomination predicate uses the same factory (three call sites, one fold
  read). Every AC (AC-F1-1..AC-NFR1-1) maps to a meaningful owning case; the
  changed suites (271 targeted tests across 18 files), `pnpm typecheck`, the
  boundaries and fixture-coverage meta-checks all pass; the committed policy and any
  operator-local file are untouched; no closed vocabulary, envelope key, error
  identity, event code, record kind, or contract-subpath member is added; and the
  phase-7 reconciliation of the profiles, engine, peak-pausing, dispatch-engine,
  result-contract and parks-guide pages is present with no residual three-check or
  absolute-`watch-stale` contradiction. Remaining findings are non-blocking
  documentation/test-quality nits: the plan phase-2 summary still says "unprobed",
  TDR-0075 keeps a multi-target "any stale target" phrasing and a "DEC-7 superseded"
  sentence that the revised spec no longer supports, the glossary was reconciled
  outside declared phase scope, one ticket-scope and one no-park chain regression
  case assert proxies rather than the behaviour, and the result-contract error-table
  cell still reads all-candidates-only although an adjacent paragraph clarifies both
  refusal causes.
