#   TC-GRPSREAD-003 and TC-GRPBOUND-001
#
# COMMIT CONVENTION (one commit per plan phase; subjects declared here so the
# commit path and review agree; scope is the workItemRef per repo convention):
#   phase 1  docs(GH-309): land ODR-0004 superseding record for the repos rename
#   phase 2  feat(GH-309): project group configuration with classified validation
