# GH-309 delivery plan — machine-readable document (delivery.plan.v1), revision 1.1
# (2026-11-14). Authored against spec v1.0 and test plan v1.0, on branch
# feat/GH-309/project-groups (from main-tools tip 13431e13; artifact commits
# 77fffac7 clarify_scope, eefb2d3b specification, db85ac35 test_planning +
# the ODR-0004 index-row drift).
#
# REVISION NOTE (revision 1.1, after DoR iteration-1 minors 3 and 5, synced
# to spec v1.1 and test plan v1.5). Mechanical remediation only: no phase
# count, phase id, ordering, or parsed-key changes beyond the two declared
# scope additions (phase 5 gains the tests/fixtures/projects folder for the
# reused failure fixtures; phase 6 gains m2/contracts.md).
#   Minor 3 (phase-1 done-when cited tests/checks/decision-record.test.ts,
#      which is TDR-0013-specific and outside phase-1 scope): replaced with
#      the phase-1 verifiables — decision-register inspection (the ODR-0004
#      file present in the register index beside its 00-index.md row, already
#      landed in db85ac35) and commit-order evidence (the record's commit
#      precedes every rename-code commit on the branch, verified at the
#      delivery gate per TC-GRPDR-001, because permanent suites never assert
#      branch diffs per testing-strategy rules).
#   Minor 5 (m2/contracts.md's "Queue and lane representation" section opens
#      "Owned by M2-S18 for cross-repository changes", which goes stale the
#      moment GH-309 delivers WITHOUT that scope per DEC-4/NG-2 — it is
#      M2-S19-consumed groundwork): phase 6's scope and obligations gain the
#      one-line correction attributing ownership/consumption to M2-S19 (the
#      milestone pack is Proposed-status planning truth, not current-truth
#      spec, so the correction is delivery-phase work, not phase 7).
#   SYNC (spec v1.1): the alias FAILURE envelope carries the moved repos.*
#      identity (DoD-8 now requires an alias failure probe); C-6 declares the
#      feature-result-contract.md sync-carrier exception this plan already
#      carried. SYNC (test plan v1.5): 31 TCs — new TC-GRPREN-006 (alias
#      failure probe, home tests/behaviour/projects-flat-alias.test.ts) joins
#      phase 5 with the failure fixtures it reuses; TC-GRPREN-005 asserts
#      input.value.rejected as pinned; TC-GRPBOUND-003 carries the C-6
#      exception.
#
# One ticket, one PR against main-tools, six delivery phases. Every phase is
# an independently committable slice that is green at its own boundary, and
# every phase is ONE delivery commit through the commit primitive (conventional
# subject, scope GH-309 per repo convention, every body/footer line <= 100
# characters; the phase-9 range gate ./scripts/lint-commit-range.sh --base
# main-tools lints every commit on this branch). Extra phase data (content
# obligations, test obligations, done-when, gate commands) is carried in YAML
# comments so the parsed document stays schema-strict: the only parsed keys are
# schemaVersion, workItemRef, tier, defaultLeases, defaultWeightClass and
# phases (id, title, kind, summary, scope, interactions, doneArtifacts,
# leases, weightClass, leaseClass). The plan declares phases and scope only;
# progress is a pm-notes `notes:` entry naming the plan phase id, commit hash,
# and test result; there is no `tasks` key and no progress log.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:      ./chg-GH-309-spec.md (v1.1; F-1..F-10; DM-1..DM-5; NFR-1..NFR-7;
#                NG-1..NG-8; DEC-1..DEC-7; RSK-1..RSK-7; 16 ACs AC-F1-1..
#                AC-NFR6-1 (§17); DoD-1..DoD-17 (§17.1) with per-condition
#                plan-phase ownership; OQ-1..OQ-3 proposed resolutions (§14);
#                Appendix C constraint register C-1..C-7)
#   - Test plan: ./chg-GH-309-test-plan.md (v1.5; 31 TCs in 12 families
#                TC-GRPDOC-001..TC-GRPGATE-001; §3 coverage matrix all Covered;
#                §7 suite homes; §8.3 OQ expectations + TP-Q1/TP-Q2; §9
#                reconciliation rule)
#   - PM notes:  ./chg-GH-309-pm-notes.yaml (binding: the superseding record
#                lands before delivery and the registry row moves only with the
#                code; TP-Q1 MCP resolution; phase-7 documentation impacts;
#                delivery conventions per spec DEC-7)
#   - Ticket:    GH-309 (M2-S18). Backlog canonical entry with derived tasks
#                a-f; scenario seeds SC-M2-S18-01..08 inherited by the test
#                plan by name and not restated here.
#   - Repo truth verified at plan time: doc/decisions/ODR-0004-flat-record-
#                set-rename-projects-to-repos.md exists on disk UNTRACKED while
#                its doc/decisions/00-index.md row (line 24) is already
