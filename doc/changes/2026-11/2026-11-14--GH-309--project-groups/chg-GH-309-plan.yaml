# PHASE ORDER AND WHY (spec DoD-table phase vocabulary mapped onto this plan;
# test plan §2 constraints (c)/(d) and the PM ordering honored):
#   1 ODR-0004 landing FIRST — the rename is lawful only under ODR-0003 DC-4
#     (superseding record plus code change); the record file is untracked on
#     disk while its index row is already committed, so the very first
#     delivery commit lands the file beside the row and every rename-code
#     phase (5) is trivially after it (DoD-11, C-3, DEC-2)
#   2 the configuration document + load-time validation — every group-scoped
#     read consumes it; delivers the three projects.* identities and the
#     `--project <groupKey>` scoped read as the validation seam (DoD-1/2 →
#     spec "Configuration phase")
#   3 workspace discovery + the group surface — the scan that locates declared
#     members (containment invariant) and the group enumeration with member
#     health/state (DoD-3/4/5 → spec "Discovery phase" + "Group-surface phase",
#     merged: the discovery TCs are observable only through the surface)
#   4 the aggregation clause + group-scoped queue/status reads — one shared
#     definition over per-checkout state (DoD-6/7 → spec
#     "Aggregation/scoped-read phase")
#   5 the rename LAST among code phases — `repos list`, the `--flat`
#     byte-compat alias, the field renames, the `repos.*` identities, and the
#     full registration mount as ONE indivisible unit (GH-288 B3 lesson);
#     keeping it late makes the decision-record gate trivially verifiable by
#     commit order (DoD-8; C-2 alias byte-compat stays in this phase's scope —
#     constraint (d))
#   6 naming boundary + operator docs + planning corpus + the full gate
#     battery — the release phase; the registry `repos` row moves to Delivery
#     HERE, after the code exists (same change, later phase: DC-4's
#     "never before" holds; constraint (c))
#
# INTERMEDIATE-STATE RULE (binding; prevents every red boundary): until phase
# 5 lands, `projects list` without flags keeps returning the DELIVERED flat
# `projects.v1` payload (current truth per DEC-1/NG-6). The group surface is
# observable from phase 2 onward through the scoped read `projects list
# --project <groupKey>` (and, from phase 3, over every configured group via
# scoping). The default-form flip to `project-groups.v1`, the `--flat` alias,
# and `repos list` land together in phase 5 — one atomic rename unit, no
# intermediate tree breaks the delivered flat contract, and the alias keeps
# the delivered payload reachable continuously (C-2).
#
# AC OWNERSHIP (all 16 ACs, exactly one owning phase each; an earlier phase
# may produce partial verdicts, which is additive and never transfers
# ownership):
#   phase 1  AC-F10-1 (record-exists half; the registry-row half completes at
#            phase 6 and the full verdict is proven at the delivery gate)
#   phase 2  AC-F2-1
#   phase 3  AC-F1-1, AC-F3-1, AC-F3-2, AC-F4-1, AC-F4-2
#   phase 4  AC-F5-1, AC-F6-1
#   phase 5  AC-F7-1, AC-F7-2, AC-NFR1-1 (full envelope set), AC-NFR2-1
#   phase 6  AC-F8-1, AC-F9-1 (guide half; the registration half's verdict is
#            produced at phase 5), AC-NFR6-1
#
# DoD MAPPING (§17.1 "Proven in plan" column → this plan's phases):
#   DoD-1/2 → 2; DoD-3/4/5 → 3; DoD-6/7 → 4; DoD-8 → 5; DoD-9 → 6;
#   DoD-10 → 5 (registration) + 6 (guide); DoD-11 → 1 (record) with the
#   registry-row move at 6 and review-time verification (TC-GRPDR-001);
#   DoD-12 → 3 (group envelopes) + 5 (full set); DoD-13 → 5; DoD-14 → every
#   phase's gate (review-time); DoD-15 → 6 (roll-up); DoD-16 → 6;
#   DoD-17 → lifecycle phase 11 (pr_creation), not a plan phase.
#
# TC OWNERSHIP (31/31 accounted for; ownership = the phase that lands the
# asserted content and where the TC's verdict is first fully green):
#   phase 1  (content only — TC-GRPDR-001's register half becomes inspectable)
#   phase 2  TC-GRPDOC-001..005 (GRPDOC-004's queue/status steps complete at
#            phase 4 in the same suite file)
#   phase 3  TC-GRPWORK-001..003, TC-GRPSURF-001..003 (through the scoped and
