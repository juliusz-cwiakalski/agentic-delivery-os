#                M2-S18 entry at line 1384; status.md delivery-snapshot
#                addendum convention; m2/commands/events.md "Delivered (M2-S13)"
#                is the delivered-page header precedent.
#
# ---------------------------------------------------------------------------
# THE THREE OQ PINS (test plan §2 constraint (a); binding on every phase).
# OQ-1 and OQ-2 pin EXACTLY the spec's proposed resolutions. OQ-3 pins the
# concrete value set the spec left abstract. A differing pin forces a
# test-plan revision (§9 revision log) before DoR — never silent drift.
#
# OQ-1 PIN — groupKey rules and contradictory declarations:
#   groupKey is a non-empty string, unique across the configuration document
#   (one document per host scope ⇒ host-unique). Duplicate groupKey
#   declarations are projects.config-invalid. Self-contradictory member
#   declarations are projects.config-invalid, pinned as exactly four cases:
#   a member declaring both `root` and `repoKey`; a member declaring neither;
#   a duplicate member declaration inside one group (the same selector
#   resolving twice); and an empty `members[]` (a group declares at least one
#   member). No new public key pattern is introduced — groupKey carries no
#   regex constraint beyond non-empty; no PROJECT_KEY_PATTERN analog exists
#   for group keys.
#
# OQ-2 PIN — `--flat` + `--project` combination (also resolves TP-Q2):
#   `--flat` and `--project` are mutually exclusive. `projects list --flat
#   --project <groupKey>` is refused at exit 1; the alias takes no group
#   scoping and the combination is never silently coerced to either synopsis
#   form. TP-Q2: the refusal classification is the SHARED user-validation
#   identity `input.value.rejected` — the delivered broken-invocation-grammar
#   classification — NOT a new projects.* identity; no identity is invented
#   for a grammar refusal (RSK-3 schema-invention guard).
#
# OQ-3 PIN — member `health` value set (state explicitly):
#   Member `health` on group entries is the CLOSED five-value vocabulary
#     healthy | degraded | state-unavailable | not-yet-supported | unregistered
#   declared with the group contract (project-groups.v1), pinnable by contract
#   tests exactly like the delivered daemon-reason vocabulary. `not-yet-
#   supported` is MANDATORY for a member whose trackerKind has no implemented
#   adapter (NG-5). Reconciliation with the DM-5 aggregation outcomes: the
#   outcomes `not-yet-supported`, `state-unavailable`, and `unregistered` map
#   to health values of the same name; the `observed` outcome splits into
#   `healthy` (clean read) or `degraded` (read succeeded but reports a
#   degradation, e.g. daemon-unreachable with a closed reason). Every member
#   carries exactly one health and resolves to exactly one outcome — no fourth
#   outcome, no empty resolution (TC-GRPAGG-002). The fifth value
#   (`unregistered`) extends the pack example rendering (healthy/degraded)
#   because TC-GRPAGG-002 step 3 requires a declared-but-unlocated member to
#   remain in `members[]` classified rather than silently vanish; this pin
#   concretizes the spec's proposed resolution (closed vocabulary, mandatory
#   not-yet-supported), it does not diverge from it.
#
# TEST-PLAN RECONCILIATION (§9; the pins recorded at v1.0 are reconciled
# upstream in test plan v1.5): OQ-1 and OQ-2 pins equal the asserted
# proposals. OQ-3's concrete five-value set and the TP-Q2 identity pin
# (`input.value.rejected`) went beyond what the v1.0 text named; v1.5 records
# them — TC-GRPAGG-002 and TC-GRPREN-005 assert these pins as written, and
# TC-GRPBOUND-003 carries the C-6 sync-carrier exception. Suite file names
# adopt the test plan §7 proposals VERBATIM; the two
# splits §7 left to the plan are pinned in phase 5 (TC-GRPREG-001 → new
# tests/behaviour/repos-help.test.ts + the existing composition/coverage/parity
# pins updated in place).
#
# TP-Q1 PIN (MCP; PM-resolved, pinned as a non-goal): NO MCP surface change
# ships in GH-309. Zero changes under packages/mcp/** and packages/opencode/**;
# tests/behaviour/projects-scope-mcp.test.ts stays green UNTOUCHED (it asserts
# state-root parity between MCP and CLI compositions, which is unaffected
# because the two-layer state scope is reused unchanged per NG-8). The group
# surface and `--project` scoping are CLI-only; no projects/repos MCP tool
# exists or is added.
#
# SUITE-NAME PINS (test plan §2 constraint (b); any later rename is a
# deliberate suite update per §8.1, never a silent one):
#   tests/behaviour/projects-config.test.ts            TC-GRPDOC-001..005
#   tests/behaviour/projects-groups-list.test.ts       TC-GRPWORK-001..003,
