summary: >-
  Re-review of HEAD c4dce585 after remediation commits dc8e6851 (code + tests)
  and c4dce585 (doc/spec). Findings F-1, F-2, F-3, F-4, F-5, F-6, F-7, F-8 and
  F-9 are closed: every scoped surface now refuses an undeclared --project with
  projects.unknown-group at exit 1 on an absent/zero-group document while the
  unscoped default keeps the empty listing (D1); group-scoped queue/status are
  marked read-only at the entrypoint and no longer run composition-level
  host-index maintenance on success or classified failure (D1/F-3); a corrupt
  index is an empty resolution aid with no fourth identity and exit 2 reserved
  for configuration/scope (D2); the validator rejects a present non-string
  workspaceRoot and normalizes trailing separators exactly as resolution does;
  an unlocated root-selected member now carries repoKey "" with the declaration
  in root; and the alias golden asserts serialized key order in the true
  GH-288 emitted order (projects, hostIndexRevision). The unbounded workspace
  scan is accepted per D3. Three low residuals and one info item remain: the
  queue --watch + --project combination still silently drops group scope
  (untriaged), projects.registry-corrupt is a retained contract identity whose
  current-truth narrative still claims a live refusal, and the change test plan
  still describes the superseded TC-GRPDOC-005 empty-listing semantics. No
  critical/high/medium finding remains. Note: the working tree carried one
  pre-existing uncommitted pm-notes modification (the residual disclosure) at
  review time, not authored by this review; the reviewed target is c4dce585.
