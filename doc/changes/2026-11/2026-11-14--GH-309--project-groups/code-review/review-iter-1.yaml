summary: >-
  Review target is committed HEAD d4433409 (the requested 85c7c69b plus the
  docs-only d4433409 reconciliation commit; source is unchanged by it). This is
  a strong, unusually faithful delivery: C-1 holds (every new envelope is the
  five-field delivery.result.v1 shape, all new keys under data, zero
  ok/command), the --flat alias reuses the delivered readProjects path and its
  failure probe carries the moved repos.* identities with unchanged exit
  meanings (C-2, spec v1.1), the OQ-2 --flat + --project refusal is
  input.value.rejected at exit 1 with no invented identity, ODR-0004
  (23b1a12f) precedes every rename-code commit (3229a2e4) and the registry row
  move follows (C-3), workspace containment is configuration-only (C-4), the
  repos mount/help/page and prompt-set 19->20 are complete, and no MCP/opencode
  surface changed (TC-PROJ-022 untouched). However, three contract-level
  deviations survive: scoped --project reads on an absent/empty configuration
  silently succeed instead of refusing projects.unknown-group, and the
  group-scoped queue/status forms still perform host-index maintenance -
  including on their classified-failure paths - contradicting
  NFR-2/AC-NFR2-1/DoD-13 and the current-truth page's write-free group-read
  claims. A fourth identity/exit-2 path (projects.registry-corrupt) is also
  reachable on the group surface although F-5 restricts exit 2 to
  configuration/scope failures. Delivered suites (config, groups-list,
  flat-alias, repos-list-contract, queue-status scope, envelope, naming
  boundary, read-only audit, repos-help, error-table, reference-page parity)
  were re-run green at this HEAD; the index-maintenance gap was confirmed with
  a direct fixture probe. Note: while this review ran, uncommitted remediation
  edits appeared in the working tree (entrypoint.ts, production.ts,
  project-groups.ts, a fixture, plan.yaml) from another session; they are not
  authored here and are not part of this verdict.
