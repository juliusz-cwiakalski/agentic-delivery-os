    location: packages/cli/src/commands/queue.ts:533
    message: >-
      The queue handler returns the live watch stream before parsing the verb
      and flags, so `queue list --project <groupKey> --watch` silently drops
      the group scope and streams the unscoped queue at exit 0. The change's
