    category: correctness
    location: packages/core/src/domain/project-groups.ts:120
    message: >-
      validateGroup silently drops a `workspaceRoot` that is present but not a
      non-empty string
      (`...(nonEmptyString(workspaceRoot) ? {workspaceRoot} : {})`). A declared
