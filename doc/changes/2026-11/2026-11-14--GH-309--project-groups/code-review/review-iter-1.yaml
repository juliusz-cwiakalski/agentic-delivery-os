findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:2852
    message: >-
      A scoped `projects list --project <key>` on an absent or empty
      configuration document returns `{data:{groups:[]}}` at exit 0 instead of
      refusing the unconfigured key with `projects.unknown-group` at exit 1.
      readProjectGroups short-circuits `config.state === "empty"` (lines
      2852-2854) before the projectGroupDeclared check. AC-F2-1 states "a
      requested group key that is not configured ... is refused with
      projects.unknown-group at exit 1" with no empty-document carve-out, F-2
      repeats it, and TC-GRPDOC-004's expected outcome adds "no surface invents
      a partial or empty success". The opposite behaviour is encoded in
      TC-GRPDOC-005 (tests/behaviour/projects-config.test.ts:315-328), so the
      coverage matrix's "Covered" claim for AC-F2-1 is not faithful at this
      edge.
    suggestion: >-
      Either (a) run the unknown-key check before the empty-config
      short-circuit so an explicit `--project` on an absent/empty document
      refuses with projects.unknown-group exit 1 (keeping the unscoped default
      form's empty listing at exit 0) and update TC-GRPDOC-005, or (b) if the
      PM intends the carve-out, amend AC-F2-1/F-2 (spec v1.2) to say "missing
      from a non-empty document" and reconcile the test plan and current-truth
      doc. Never leave the AC and the code disagreeing. The same decision
      governs F-2.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:2901
    message: >-
      `queue list --project <key>` and `status --project <key>` on an
      absent/empty configuration return a success envelope that echoes the
      requested groupKey with `members: []` at exit 0 (readProjectGroupWorkFor
      lines 2901-2903) instead of projects.unknown-group exit 1. This is worse
      than F-1 because the payload names a group that is not configured, so a
      caller cannot distinguish "the group has no work" from "the group does
      not exist". It violates AC-F2-1, F-2, F-6 and the fail-closed intent of
      NFR-5. TC-GRPDOC-004 covers only a populated document, so this path is
      untested.
    suggestion: >-
      Same resolution as F-1: refuse an explicit --project for a key that is
      not declared even when the document is absent/empty (unknown-group, exit
      1), and add the empty-config cell to TC-GRPDOC-004 for queue and status.
      If the spec is amended instead, make the "not configured" carve-out
      explicit for all three scoped surfaces.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:750
    message: >-
      `maintainsIndex` is disabled only for the `projects` and `repos` command
      tokens (lines 750-752), so the group-scoped forms of `queue` and
      `status` still run the composition-level host-index maintenance block
      (lines 764-806) before the handler - including when the handler later
      fails classified. Verified with a fixture probe: `queue list --project`
      on a fresh checkout creates and advances `<hostRoot>/host-index.json`
      (absent before, written after), and a failed group-scoped read still
      performs the maintenance. NFR-2 and AC-NFR2-1 require group reads to
      write no index and to exhibit exactly the two delivered permitted side
      effects (create-once marker + `*.tmp` removal); DoD-13 repeats it and C-4
      calls the write budget absolute. Current-truth
      doc/spec/features/feature-project-groups.md further claims group reads
      perform no host-index maintenance and that a classified failure writes
      nothing at all. The read-only audit
      (tests/behaviour/projects-read-only-audit.test.ts) covers only the
      `projects list` forms and `repos list`, not the queue/status group forms,
      so the gap shipped green.
    suggestion: >-
      Gate index maintenance off for group-scoped queue/status invocations
      (expose the group-scope fact on the entrypoint invocation fact and treat
      queue/status plus --project as non-maintaining), and extend TC-GRPRO-001
      with queue/status --project success and classified-failure cases.
      Alternatively, if index maintenance is intended as a third permitted side
      effect, amend NFR-2/AC-NFR2-1/DoD-13 and correct the two current-truth
      claims. Impact is bounded to host-index housekeeping (not member state),
      but the contract says "no index write".
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: medium
    confidence: medium
    category: spec-compliance
    location: packages/cli/src/production.ts:2733
    message: >-
      readProjectGroupsHostIndex returns `projects.registry-corrupt` (exit 2)
      when the host index is unreadable or unparsable, and every group read
      (default, --project, and the queue/status group forms) consumes it. The
      spec's group-surface identity set is closed at three
      (PROJECT_GROUP_ERROR_CODES: config-invalid, unknown-group,
      scope-unavailable), F-5 restricts exit 2 to "the configuration document
      or the invoking scope cannot be read", and section 10 lists only those
      identities. A corrupt host index is neither, so this is an undeclared
      fourth identity/exit-2 path. The current-truth feature-project-groups.md
      does document it, so spec and docs now disagree. It also fails the whole
      listing even when root-selected or workspace-located members could be
      resolved without the index.
    suggestion: >-
      Make the spec-compliant choice: treat an unreadable/corrupt index as an
      empty resolution aid (members that need it classify `unregistered`) and
      keep exit 0; OR declare projects.registry-corrupt in F-2/F-5/section 10,
      add it to PROJECT_GROUP_ERROR_CODES, and pin it with a group-surface
      test. Do not leave the spec's three-identity/restricted-exit-2 statement
      contradicted by code.
    suppressed: false
    published_url: null
    published_at: null
