findings:
  - id: F-7
    severity: low
    confidence: high
    category: correctness
    location: packages/cli/src/entrypoint.ts:393
    message: >-
      Residual containment hole after the F-2 fix (verified by probe): when
      `--version` is the immediate next token of a known command, everything
      AFTER it is ignored — `board --version positional` and
      `board --version --bogus` answer the version text at exit 0, while the
      spec grammar (§8.3, DEC-17/C-10) refuses any positional and any unknown
      flag. Impact is minimal (identity-only answer, no state read, no
      composition) and the reference page documents `--version` as a terminal
      self-description flag, so this is a defensible reading — but the letter
      of the grammar contract still deviates.
    suggestion: >-
      Answer the command-scoped version only when `--version` is the LAST
      non-global token (or validate the remaining tail contains no positional
      and no unknown flag before answering); add the
      `board --version positional` refusal cell. Non-blocking; fold into a
      later change if the owner agrees the terminal-flag reading is intended.
  - id: F-8
    severity: low
    confidence: high
    category: testing
    location: tests/fixtures/board/selection.ts:189
    message: >-
      `indexWrites` is a constant `0` in the selection harness, so the two
      `expect(harness.indexWrites()).toBe(0)` assertions in
      board-write-discipline.test.ts can never fail — a decorative counter.
      The no-index-write invariant itself IS genuinely proven by the host-root
      snapshot (the mutant shows an index rewrite is detected and named) and
      by the real revision assertion, so this is test hygiene, not a coverage
      hole.
    suggestion: >-
      Either back the counter with real interception (wrap the index file
      write path the production composer would use) or delete the counter and
      keep the snapshot/revision assertions as the declared evidence, so no
      vacuous assertion masquerades as coverage.
