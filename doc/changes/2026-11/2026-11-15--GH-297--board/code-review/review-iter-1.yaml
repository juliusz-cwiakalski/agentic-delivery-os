summary: >-
  The change is broad and unusually disciplined: the four-section board, the
  shared `stateSource` identity (the backlog AC, verified byte-equal across
  board/status/brief by TC-BOARD-003), repository selection with the 128 cap
  and deterministic retained set, the preserved owner-gate SLA with the
  per-repository idempotent append and the DEC-16 post-append ask join, the
  Appendix D error-table unit (23 sites moved, four-way agreement 138/137/55/2
  verified green, no-leftover scan clean), and the 21st-family mount are all
  delivered and the targeted suites pass. Two defects block the PR: the
  per-repository tracker read joins merge waivers from the INVOKING
  repository's store, so non-invoking repositories lose their recorded waivers
  (and can import the invoking repository's waiver on a shared ref number) in
  `--all`/`--project` runs, and the new command-scoped `--version` intercept
  answers exit 0 for unknown commands and positional-carrying invocations,
  bypassing the delivered fail-closed containment. The declared Critical
  TC-BOARD-061 also landed in reduced form (no host-root/index snapshot, no
  index-maintenance mutant), leaving DoD-11's zero-index-write evidence unproven.
