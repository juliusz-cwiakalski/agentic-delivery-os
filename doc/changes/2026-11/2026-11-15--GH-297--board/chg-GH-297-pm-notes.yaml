  - text: "Doc impact to reconcile in phase 7: new feature spec for the full board;
      current-truth updates to feature-owner-gate-sla, feature-status-digest and
      feature-brief shared-source wording, CLI command registry, M2 board page
      status, entrypoint delta, and the M2-S4 backlog progress marker."
    type: risk
    date: "2026-11-15"
  - text: >-
      Readiness gate iteration 1 verdict: NOT_READY (record:
      readiness-review/readiness-iter-1.md). Findings: (F1, critical, plan) the
      two new two-segment error codes board.repository-unknown and
      board.state-unavailable require an exact allowlist widening in both
      scripts/checks/error-table-sync.ts and tests/structure/error-table.test.ts
      (53 -> 55) plus the identity-table counts, and neither file is in any plan
      phase scope; (F2, major, spec) DM-8/DEC-8/C-7 silently widen the closed
      two-segment set contrary to feature-result-contract; (F3, minor, test
      plan) no case owns the allowlist addition/count bumps or near-miss
      rejection; (F4, minor, plan) six delivered board suites (board-escalation,
      board-aging, board-records, board-waiver-recording, board-privacy,
      board-corpus) are absent from phase scopes. Reopened: specification (F2),
      test_planning (F3), delivery_planning (F1, F4). No human decision needed.
    type: blocker
    date: "2026-11-15"
  - text: >-
      Retro: the spec introduced two-segment error identities without checking
      the delivered error-table sync allowlist and its mirrored 53-entry set, so
      the DoR gate caught an unsatisfiable phase-3 done-when. The plan also
      missed delivered board suites that the four-section flip will break.
      Improvement: spec and plan authoring must explicitly enumerate the
      error-table carrier files and the delivered test suites touched by a
      contract flip; the readiness gate did its job before code was written.
    type: retro
    date: "2026-11-15"
