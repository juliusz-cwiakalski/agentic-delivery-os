  - text: "Dependency check: M1-S5 board SLA (GH-229), M1-S17 scheduling engine
      (GH-237), M2-S11 multi-repository state scope (GH-288), and M2-S18 project
      groups (GH-309) are all delivered on main-tools. No unmet dependency."
    type: info
