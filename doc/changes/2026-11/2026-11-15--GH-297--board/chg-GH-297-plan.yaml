# Phase 3 — Repository selection, per-repository composition, error identities,
# and the production board composition
# Commit: feat(GH-297): repository selection, per-repository composition and board error identities
#
# Goal: the board spans managed repositories without state mixing — the
# default form, `--project <repoKey>`, `--all` bounded to 128 with a
# deterministic retained set and counted overflow, the `unbound` scope, the
# two new classified identities with their error-table rows and the C-7
# carrier, the grammar refusals through the delivered containment identity,
# and the production composition root supplying the board runtime
# unconditionally over the delivered adapters (F-3, F-8, the cap half of
# F-9, the composition half of F-7).
#
# Obligations:
#  3.1 Command grammar and refusal precedence (DM-8/DEC-17, C-10, AC-F3-4):
#      `<binary> board [--all] [--project <key>] [--json]`; zero positionals;
#      `--all` takes no value, `--project` requires one; any other flag, any
#      positional, `--all` + `--project`, and a valueless `--project` are
#      refused BEFORE any source is read with the delivered
#      `fallback.invocation` at exit 1 (the delivered constant, not a
#      `board.*` code); no `board.*` grammar identity is ever added to the
#      error table.
#  3.2 Managed-set resolution and scope (F-3, DM-7, DEC-5, DEC-14, C-5,
#      C-15, §8.3 scope resolution): the managed set is the host index's
#      recorded checkouts whose root exists plus the invoking checkout when
#      bound (the index record wins on collision). The default form performs
#      ZERO host-index reads and uses the invoking checkout only (scope
#      `repository`, selection `current`); `--project` resolves against the
#      full managed set (one index read; a key beyond the ascending cap is
#      still valid and always included; an unmanaged key — including a group
#      key — is `board.repository-unknown` at exit 1 with nothing rendered);
#      `--all` reads the index exactly once and reports `selection: all`. An
#      absent index is not an error (the managed set is the invoking checkout
#      alone, or empty when unbound); a present-but-unreadable or unparseable
#      index is `board.state-unavailable` at exit 2 naming the index path. A
#      default-form invocation outside any work tree, or whose checkout
#      identity cannot be derived, resolves the declared `unbound` scope:
#      `scope: "unbound"`, empty `repositories[]`, empty sections, the
#      delivered bounded warning (never in `data`, never an exit change),
#      exit 0 — never a host-index fallback, never a fabricated key.
#      `--all`/`--project` report `scope: "repository"` even when
#      `repositories[]` is empty. No board form enumerates or infers a group.
#  3.3 The 128 cap and the retained set (DM-11, DEC-13, C-6, AC-F9-4):
#      `BOARD_MAX_REPOSITORIES` = 128 included repositories per `--all` run;
#      `repositories[]` ascends by key, is unique, and always includes the
#      selected repository; when the managed set exceeds the cap the retained
#      set is the first 128 keys ascending when the invoking key is among
#      them (or the invocation is unbound), otherwise the first 127 ascending
#      plus the invoking key, re-sorted ascending; `truncated` is true and
#      `omittedBySection.repositories` equals the unretained count; only
#      retained repositories are read (unretained stores are never opened).
