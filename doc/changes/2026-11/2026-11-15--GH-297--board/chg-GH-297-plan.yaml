# PHASE ORDER AND WHY (spec section 18 sequencing, made concrete):
#   1 Shared source and contracts first — the backlog AC ("board, brief, and
#     status share one state source") must be observable before the board
#     surface consumes it (test plan GAP-T5: the equality has no fallback
#     path), the lane `leaseHolder` extension must land before the lane row,
#     and every later phase consumes the declared vocabulary (DM-1..DM-11) and
#     bounds (BOARD_MAX_REPOSITORIES = 128, per-section caps, field caps).
#   2 Four-section projection second — the pure board (lanes, gates, asks,
#     parked) over one repository's facts plus the lane fold, with the asks
#     join, the parked projection, omission accounting, the byte guard, and
#     the deterministic renderer. The delivered owner-gate SLA is preserved,
#     not re-implemented (C-3): the gates section IS the delivered evaluator.
#   3 Repository selection and per-repository composition third — grammar
#     (--all/--project), managed-set resolution over the delivered host index
#     and state scope, the 128 cap with its retained set and counted overflow,
#     the two new error identities with their error-table rows and the C-7
#     carrier, and the production composition root supplying the board runtime
#     unconditionally over the delivered adapters. The composition half of
#     mounting lands HERE, not in phase 4, because the test plan's
#     real-production-composition cases (TC-BOARD-010/011/012/014/015/016/064)
#     exercise selection through the real `createProductionComposer`
#     (tests/fixtures/projects/production.ts) and can be first-green only once
#     production composes board. This is contract-legal and regression-free:
#     between the phase-3 and phase-4 commits the entrypoint still drops the
#     un-advertised family exactly as it drops every non-prompt command today,
#     so root --help and every other surface stay byte-identical.
#   4 Mounting advertisement and write discipline fourth — the prompt-set
#     entry (21st family), root and family help entries, the reference page
#     serving the coverage check, the coverage-inventory row, the 20 -> 21
#     family-count assertion updates, and the read-only write-discipline audit
