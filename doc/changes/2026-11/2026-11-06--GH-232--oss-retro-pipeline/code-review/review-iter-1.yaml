      verifier) honor §4.2's binding non-vacuity contract. The pm-notes claim
      "64/64 TC coverage mapped to suites" overstates delivered coverage.
    suggestion: >-
      Add the TC-RETRO-032 test to retro-malformed: run report on a clean
      fixture and on the equivalent one-malformed-entry fixture, strip the
      flag/diagnostic line, and assert the preserved valid-entry output is
