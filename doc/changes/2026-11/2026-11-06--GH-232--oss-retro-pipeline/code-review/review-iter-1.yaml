summary: >-
  The delivered retro pipeline is architecturally sound and spec-faithful on the
  load-bearing guarantees: the sidecar HMAC chain is correctly constructed
  (distinct 0600 key artifact, canonical field order, NUL-delimited HMAC
  inputs), the full six-class tamper matrix and cross-process continuity are
  genuinely tested through the production node:crypto edge, the locked CLI
  surface is honored (no export verb/flag anywhere), the four retro error rows
  round-trip exactly against the documented table, the no-target/vacuous-run
  split matches DEC-14, and all 298 retro-related tests plus both new invariant
  checks pass under my own runs. Two findings block: (1) NFR-7's collect
  budget is empirically breached — a collect appending ~1,005 records onto a
  10,000-record sidecar takes ~57s (budget 30s) because every per-record append
  re-reads and re-verifies the entire growing sidecar under its own fence
  (O(n*m) amplification, contradicting DEC-13's one-fence-per-run intent), and
  the perf suite only measured the single-read path while the phase-7 doc
  reconciliation quietly restated the wall-clock budgets as inert timeout
  constants; (2) TC-RETRO-032 — the byte-equality oracle that proves binding
  AC 1's no-data-loss claim — is entirely missing, the promised 24-case
  entry-level matrix is reduced to ~9 cases, and most mutant/non-vacuity
  obligations pinned by test-plan §4.2/§4.3 (crash/drop, ignore-malformed,
  repaired-store controls, export/levels mutants) were not delivered, so the
  "64/64 TCs covered" claim in pm-notes overstates. Non-blocking findings cover
  a throw across the memory-audit engine seam, an unvalidated `as
  StateFailureCode` cast, the registry riding the delivery store despite
  PIN-4's own-store pin (dead fence-namespace constant), an under-scoped
  key-containment scan, and the two carried DoR nits.
