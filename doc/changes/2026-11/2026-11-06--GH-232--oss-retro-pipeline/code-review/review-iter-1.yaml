findings:
  - id: F-1
    severity: high
    confidence: high
    category: performance
    location: packages/core/src/domain/retro.ts:594
    message: >-
      NFR-7's collect budget (<= 30s on a 10,000-record sidecar) is breached.
      Empirically verified on this machine: a collect appending 1,005 records
      onto a 10,000-record sidecar took 56.9s (probe: tmp/gh232-review/
      collect-probe.ts). Root cause: appendAll calls sidecar.append once per
      draft, and each append (retro-sidecar.ts:443-520) acquires/releases its
      own fence file and performs a full verified re-read + re-HMAC of the
      entire sidecar — O(append_count x total_records) work (~10.7M HMAC +
      JSON.parse operations in the probe), plus 2 file writes per record (lock
      + line). DEC-13 pins ONE collector fence covering the verified
      pre-append read, the link computation, AND the appends (plural) — the
      run-level fence was implemented per-record. The delivered perf suite
      (TC-RETRO-061) only measured the single-read path (50.7ms) and
      append==items on a fresh tiny store, never collect-on-large-sidecar;
      PIN-7's one-time wall-clock reference measurement was never recorded
      (execution-log deviation), so the breach went undetected. The report and
      export paths are fine (~60ms at 10k); only collect is quadratic.
    suggestion: >-
      Add a batched append to the sidecar seam — one fence acquire, one
      verified read, compute all links in memory, one appendText of all lines,
      one fence release (keeps DEC-13's single-fence discipline and drops
      collect to one chain walk); have collectRetro use it. Then record the
      NFR-7 wall-clock reference numbers (collect/report/export at 10k) in the
      change evidence per PIN-7, and restore the per-command budgets in
      doc/spec/features/feature-retro-pipeline.md:322 instead of the inert
      timeout-constant restatement.
    suppressed: false
