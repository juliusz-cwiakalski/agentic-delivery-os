  - id: F-5
    severity: medium
    confidence: high
    category: plan-compliance
    location: packages/cli/src/edge.ts:2467
    message: >-
      Plan PIN-4 pins the retro registry as "its own validated store via the
      public state port (fence namespace `retro-registry`)"; spec DEC-3/§8.5
      call it a distinct validated store boundary. The implementation treats
      the registry as three record kinds inside whatever StateStorePort it is
      handed — the CLI edge's RetroCompositionOptions has a single `store`
      used for BOTH registry writes and delivery-family reads, registry
      appends ride the store's generic fence, and the declared
      RETRO_REGISTRY_FENCE_NAMESPACE constant is dead vocabulary (no src
      consumer). Side effects: doctor `readStateStores` sums delivery record
      count + retro artifact count, double-counting retro records when one
      store backs both (edge.ts:1838-1844). No integrity impact (registry is
      levels/runs/triggers, not evidence), but the boundary is nominal.
    suggestion: >-
      Either compose a distinct store instance (separate artifact scope) for
      the retro registry at the edge and use the declared fence namespace for
      registry appends, or record the single-store decision as a reviewed
      deviation, remove or use the dead constant, and fix the doctor
      record-count aggregation to avoid double counting.
    suppressed: false
