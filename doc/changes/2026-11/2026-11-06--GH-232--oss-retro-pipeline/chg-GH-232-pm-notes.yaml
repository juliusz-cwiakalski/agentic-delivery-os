  - text: "Design tension for spec/decision phase: audit-ledger keyed chain uses invertible FNV-1a-64 where same-user forgery resistance rests on 0600 file permissions (documented honestly in SPEC-AUDIT-LEDGER), while the pinned GH-232 decision requires a chaining key that never enters lane environments so a delivery agent cannot alter evidence undetectably. Evidence sidecar likely needs a non-invertible keyed construction (e.g. HMAC) with key material outside lane reach. This is a technical decision grounded in the pinned ticket decision, not a human-input blocker."
