# GH-232 implementation plan — M1-S8: OSS retro pipeline
#
# Sources (single source of truth; plan revision 1, 2026-11-06):
#   - Spec:  ./chg-GH-232-spec.md (v1.1; 16 ACs AC-F1-1..AC-F9-1; F-1..F-10;
#     DEC-1..DEC-13; OQ-1..OQ-7 all resolved; four-row `retro` error set incl.
#     retro.truth.vacuous-run; per-identity store-level exit taxonomy DEC-7;
#     export as engine/library surface only; Appendix B test-coverage handoff)
#   - Test plan: ./chg-GH-232-test-plan.md (v1.1; 64 TCs TC-RETRO-001..064;
#     16/16 AC coverage; §3.5 suite legend; §4.3 normative table; §4.4-4.5
#     mutation/shape matrices; §4.6 level matrix; §4.7 truth matrix; §4.8 exit
#     oracle; §7.1 execution order; §7.2 CI mapping; §7.3 evidence commands)
#   - Decision: ../../../../doc/decisions/TDR-0009-retro-evidence-sidecar-
#     keyed-chain-construction.md (ALT-2: HMAC-style keyed chain, distinct
#     store-managed key, claimed identity; C-1..C-7; TO-CONFIRM primitive/
#     digest/encoding/key-filename pins are plan-time — pinned below)
#   - Ticket: GH-232 (open; binding AC 1 + binding AC 2 verbatim in spec §17)
#
# Format note: this document is the machine-readable plan (delivery.plan.v1).
# Phase goals, tasks (with TC/AC traceability), per-phase verification commands,
# per-phase commit steps, the phase->AC->TC matrix, and the phase-7 doc-sync
# handoff notes are carried as YAML COMMENTS so the parsed document stays
# strictly schema-conformant. `plan validate GH-232` must return `valid`.
#
# Tier rationale: `full` — 10 capabilities, 16 ACs, 64 automated TCs, cross-
# package delivery (core contracts + state tier + domain engine + CLI +
# invariant checks + golden fixtures), medium security impact (spec front
# matter), autonomous delivery mode (pm-notes). Lease names and weight classes
# are omitted: the lease/weight vocabulary belongs to the downstream scheduler
# and neither spec nor test plan pins names; all phases are lease-taking by
# kind.
#
# =====================================================================
# DELIVERY-BOUND PINS (resolved here; test plan OQ-T6/T7/T8, GAP-T8, and
# TDR-0009 TO-CONFIRM items — every value below lands as a declared contract
# constant so tests read the constant, never a hardcoded string):
#
#   PIN-1 Chain primitive (TDR-0009 TO-CONFIRM 1+2, C-7): HMAC-SHA-256 via
#         node:crypto (`createHmac` + `randomBytes`) at the core state driver
#         runtime edge — the admitted runtime-API location; NO new third-party
#         dependency. Digest 256-bit, hex-encoded: RETRO_CHAIN_VALUE_HEX_LENGTH
#         = 64. Key: RETRO_CHAIN_KEY_BYTES = 32 random bytes, generated once at
#         the runtime edge on first append, persisted 0600.
#   PIN-2 Canonical encoding: the sidecar record serialized as UTF-8 JSON over
#         the declared field order RETRO_CANONICAL_FIELD_ORDER with the record's
#         own chainValue EXCLUDED; link = HMAC(key, prevLink || anchor,
#         canonicalContent); first record chains from RETRO_CHAIN_ANCHOR
#         ("retro.chain.anchor.v1").
#   PIN-3 Artifact spellings (spec OQ-2): sidecar ledger
#         `retro-evidence.<workspace>.jsonl`, chaining-key artifact
#         `chain-key.retro.<workspace>.json` (payload schema
#         `delivery.retro.chain-key.v1`; distinct path AND bytes from the audit
#         `chain-key.<workspace>.json`), collector fence file
#         `retro-evidence.lock` — all beside the delivery state store layout in
#         the state directory.
#   PIN-4 Retro registry store: its own validated store via the public state
#         port (fence namespace `retro-registry`), three additive record kinds —
#         `retro.level` (`delivery.retro.level.v1`, identity `name`),
#         `retro.run` (`delivery.retro.run.v1`, identity `runId`), and
#         `retro.trigger` (`delivery.retro.trigger.v1`, identity `name`; hosts
#         the periodic memory-audit trigger per DEC-10) — under key prefixes
#         `retro.levels` / `retro.runs` / `retro.triggers`. A-T5 named two
#         kinds; the trigger kind is the honest third (TC-RETRO-060 asserts the
#         trigger lives in the registry; boundary properties, not kind count,
#         are the contract).
#   PIN-5 Target ordering (OQ-T6 / A-T3): RETRO_TARGET_ORDER = completion
#         timestamp DESC, then change ref ASC. "Completed change" = a change
#         whose latest phase.transition is `complete` for its terminal
#         lifecycle phase (pr_creation) with no later `reopen`; in-flight
#         changes are never selected; no eligible target -> explicit no-target
#         SUCCESS (exit 0) with explicit no-target evidence naming the empty
#         selection — the null-retro analogue; never a fabricated scope.
#   PIN-6 Level->owning-story map (OQ-T7 / A-T6): session / incident / window /
#         project -> "M2-S3 (ceremony runner)" — M2-S3 schedules retro levels
#         and owns the close stage (spec §13, backlog M2-S3 AC); M2-S10 co-owns
#         the R4+ follow-through gate; fleet -> "post-M4 fleet retro
#         (unscheduled)" per spec §7.3 / concepts doc. Declared as
#         RETRO_LEVEL_OWNING_STORIES contract data.
#   PIN-7 NFR-7 measurement (OQ-T8 / GAP-T2): CI gates BOUNDED WORK only —
#         call-count invariance (10-record vs 10,000-record sidecar: one chain
#         walk per read; appends == collected items; export reads <= limit plus
#         one verdict pass; positive audit-read limit) and declared timeout
#         constants (RETRO_READ_TIMEOUT_MS = 10000, RETRO_APPEND_TIMEOUT_MS =
#         30000 per the NFR-7 budgets) referenced at the admitted I/O seams.
#         The 10,000-record wall-clock numbers are recorded ONCE in the change
#         execution log as a non-CI reference — never a pass gate.
#   PIN-8 Export bound: RETRO_EXPORT_MAX_LIMIT = 1000 (TC-RETRO-050 asserts an
#         over-cap refusal); no optional-limit overload, no "all records" mode.
#   PIN-9 Memory-audit cadence: trigger kind "schedule", cadence "weekly" from
#         the declared cadence vocabulary — a plan-time value consistent with
#         the documented "periodic" memory audit; on-demand invocation only in
#         M1-S8 (scheduled invocation arrives with M2-S3).
#   PIN-10 Finding-kind vocabulary: ["retro-note", "collector-finding",
#         "truth-check", "tamper-flag", "malformed-entry", "verified-empty"];
#         follow-through verdicts ["verified", "unverified", "unknown"].
# =====================================================================
#
# Delivery risks pinned as explicit tasks:
#   - The sidecar is OUTSIDE the store port (DEC-3): its file I/O and crypto
#     live at the core state driver runtime edge (the admitted location,
#     extending the GH-223 audit-key precedent) behind a contracts-declared
#     RetroSidecarIo port injected into the pure consumer — task 2.1/2.2. A new
#     adapters subpath was considered and rejected: it would need a new
#     .dependency-cruiser.cjs rule plus failing fixtures with zero precedent;
#     NO new boundary rule is required by this change.
#   - The state tier imports ./contracts only (ADR-0003): the domain engine
#     (collect/report/export folds) consumes contracts-declared runtime port
#     types; the CLI edge composes the state-tier consumers into them — the
#     closeout/commit precedent (tasks 3.1, 4.2).
#   - The documented error table is BINDING (bidirectional sync): the four
#     `retro` rows land in doc/spec/features/feature-result-contract.md in the
#     SAME phase as the machine rows (task 1.3), or error-table-sync fails at
#     the first commit. The remaining spec narrative is phase-7 doc-sync work.
#   - The locked surface has no export verb (NG-1 amendment): the export
#     surface ships as a core engine function only; TC-RETRO-049 step 6 and
#     TC-RETRO-060 step 4 assert the CLI registry and edge composition carry NO
#     export entry, flag, or memory-audit command (tasks 3.5, 4.1, 4.2).
#   - `--ref` must classify fallback.invocation (L-12) while value/positional
#     errors classify input.value.rejected (L-10/L-11): the command definition
#     declares `--level` as a parser-level flag and parses VALUES in the
#     handler — the exact db.ts pattern (task 4.1).

