# CONSTRAINTS BINDING ON EVERY PHASE (spec sections 5, 8, 9; do not reshape at
# delivery):
#   - Envelope continuity (NFR-1, AC-F9-3): every new key lives under `data`;
#     the five-field delivery.result.v1 envelope is untouched; zero
#     `ok`/`command` fields anywhere; one payload identity delivery.steer.v1
#     across all four subcommands (DEC-3).
#   - Layering and purity (ADR-0003, NFR-6, NFR-7): contracts and pure domain
#     in packages/core (no I/O in the domain; injected clock, id factory,
#     state port, phase read, ledger view, secrets record, origin source);
#     command definitions and edge composition in packages/cli; the binary
#     name in human output comes from the brand seam only (zero product or
#     binary literals); no LLM, network, tracker/provider, timer, daemon,
#     control socket, or session operation of any kind (NG-3, NG-4, DEC-12).
#   - The shared record (DM-1, DEC-2, AC-F2-1): exactly the eleven declared
#     keys; the four vocabularies are the shared closed sets declared once as
#     contract data (scope session|change|repo|fleet; kind
#     ask|answer|notify|request|escalate|report|heartbeat; priority
#     low|normal|high|urgent); the S5 filing subset (kind request|escalate,
#     scope repo, from owner, to the role delivery) is a declared restriction
#     over those sets, never a second schema; the record is immutable once
#     appended; lifecycle derives at read time, never stored.
#   - The ttl grammar (section 8.3, DM-1, DM-8, AC-F1-2): `<duration>` is
#     `<positive-integer><unit>` with unit in s|m|h|d; maximum 30d
#     (2 592 000 s); drawn default 24h; zero, negative, oversized, and
#     malformed values are input.value.rejected value violations refused
#     pre-write through the same path as the other value violations; ONE
#     shared validator, no second duration parser (TC-STEER-004 step 6).
#   - Write discipline (NFR-5, DM-2): three additive append-only record kinds
#     (steering.message, steering.outcome, steering.completion) in the
#     repository's local state scope; send appends exactly 1 message; read
#     appends <= 1 outcome per note and only for transitioning notes;
#     complete appends exactly 1 and a second completion 0; zero edits,
#     deletes, or prunes; fenced appends with post-append verification — a
#     landing is never reported that did not durably land.
#   - Bounds and the landing/display split (DM-8, NFR-4, AC-F3-4, AC-F10-3):
#     text <= 160 chars; ref <= 160; list <= 8 rows per group; the read
#     PAYLOAD lists <= 20 notes with counted overflow while the LANDING WRITE
#     is uncapped — every due note lands and is receipted, nothing dropped,
#     deferred, or rolled; serialized data <= 65 536 UTF-8 bytes; human <= 32
#     lines / 6 144 bytes; when the byte cap binds, rows drop tail-first in
#     the fixed order asks -> notes (tail-first by rank within notes), each
#     drop counted in omitted with truncated: true; the boundary block is
#     never dropped. data.applied is true iff >= 1 note landed; data.expiry.
#     reason is present exactly when >= 1 note expired (DEC-7).
#   - Error identities and the closed allowlist (DM-7, DEC-8, C-7, AC-F9-4):
#     exactly three rows under one new `steer` domain kind —
#     steer.unknown-id (user, exit 1, not_landed, scoped to complete ONLY),
#     steer.credential-value-rejected (user, exit 1, not_landed, zero
#     persisted bytes), steer.queue-unavailable (platform, exit 2,
#     not_landed) — registered in packages/core/src/contracts/error-table.ts
#     and projected through packages/cli/src/classify.ts; value violations
#     reuse the delivered input.value.rejected; grammar violations (unknown
#     subcommand/flag, positional count — including ANY positional on `read`,
#     so `steer read <id>` is fallback.invocation, never steer.unknown-id —
#     and missing flag values) reuse the delivered fallback.invocation at
#     exit 1 before any state read; the closed two-segment allowlist widens
#     by EXACT declaration (56 -> 59, no steer.* family, no pattern
#     widening); EVERY Appendix D site (D-1..D-13) moves in the SAME commit
#     as the rows (140 -> 143 entries; 139 -> 142 delivered; 56 -> 59
#     allowlist; 140 -> 143 documented; BASELINE_ROWS.length + 106 -> +109;
#     3 steer rows; board stays 2, ceremony stays 2), followed by the
#     repo-wide no-leftover scan for 140/139/56/+106 with those tokens added
#     to the legacy list, and four-way classifier/sync-check/structural-
#     mirror/carrier agreement; a near-miss two-segment steer.* code is
#     rejected, never family-matched.
#   - The no-secrets guard (F-7, AC-F7-1, TDR-0012): note text, --ref, and
#     derived origin values are matched against the registered secret values
#     (the same registered-secrets record the serialization redaction
#     chokepoint consumes) and refused before any byte lands; NO token-shape
#     pattern scan exists — the boundary is exactly the registered-value
#     match.
#   - Composition discipline (F-4, DM-6, NG-8): asks[] is the delivered
#     open-question view with the delivered PDR-0003 drawn-default join
#     (drawnDefault or bare null, defaultState none|pending|applied) and the
#     delivered ranking, bounds, and cap of 8, read-only — coordinator
#     questions excluded, no ledger write, no second ranking or default
#     mechanism; the boundary derivation reads the delivered phase-state fold
#     and adds no phase record kind (DEC-5); no board payload key, no fifth
#     board section, no steering column on any board row (NG-1, DEC-1); no
#     new event topic (NG-5, DEC-10); no aging-based promotion of stored
#     records (NG-6, DEC-11) — order is derived at every read, never stored.
#   - Current-truth boundary (NG-7, C-7): doc/spec/** flips only in lifecycle
#     phase 7 (@doc-syncer), never in a delivery phase; the ONE same-commit
#     exception is the error-table carrier
#     doc/spec/features/feature-result-contract.md in phase 3, whose rows,
#     counts, and allowlist paragraph TC-STEER-076 asserts.
