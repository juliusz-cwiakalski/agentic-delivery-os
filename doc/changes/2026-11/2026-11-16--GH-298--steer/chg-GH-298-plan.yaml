#     declared before any writer exists).
#   2 Pure domain and state records second — validation order, ttl parse and
#     judgement, aging, the shared rank, the boundary-open derivation over
#     the delivered phase fold, derived lifecycle, the read/list projections,
#     the asks-batch composition over the delivered open-question view and
#     PDR-0003 join, the bounded renderers, and the three append-only record
#     kinds with fenced verified appends (spec 18: the record schema and
#     state records land before the boundary read point). No I/O in the
#     domain; injected clock and ports only (ADR-0003, NFR-7).
#   3 Error-table registration third — the `steer` domain kind, its three
#     rows, the exact allowlist widening (56 -> 59), and EVERY Appendix D
#     site move in ONE commit, with the repo-wide no-leftover scan and
#     four-way classifier/sync/mirror/carrier agreement (AC-F9-4, DEC-8,
#     C-7, C-16). Registering before the CLI paths exist is green and keeps
#     the count move atomic; the first refusing path that emits a steer.*
#     identity arrives with the CLI phases inside the same change boundary.
#   4 Filing and the queue view fourth — `steer send` and `steer list` over
#     the edge composition and the unconditional production composition:
#     drawn defaults, the derived origin block (real checkouts), value and
#     grammar refusals pre-read, aging/rank on every surface, the three
#     lifecycle groups side by side with counted caps (DEC-1's auditable
#     view). Between this commit and phase 7 the entrypoint still drops the
#     un-advertised family exactly as it drops every non-prompt command
#     today, so root --help and every other surface stay byte-identical.
#   5 The boundary read point fifth — `steer read`: the three boundary-open
#     routes and the closed decline, batched landing in rank order with one
#     receipt per note and the landing write uncapped by the payload's
#     20-note display bound (AC-F3-4), ttl-elapsed as a classified outcome,
#     idempotence, and the batched asks with the delivered join (ticket
#     AC-1); the payload bounds and the byte-guard drop order.
#   6 Completion, the guard, and the error matrix sixth — `steer complete`
#     with artifact-ref authority, the registered-secrets guard on every
