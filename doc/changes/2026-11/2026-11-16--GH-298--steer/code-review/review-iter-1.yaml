findings:
  - id: F-1
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:3234-3238
    message: >-
      The production steer composition injects join:
      { defaultableRefs: {}, appliedRefs: [] } into readAsks, so every
      production steer read projects drawnDefault null and defaultState
      "none" for every owner ask. The PDR-0003 defaultable-gate facts are
      tracker-derived (the board edge builds gate facts from
      client.listWorkItems plus local waivers, packages/cli/src/edge.ts:3209-3254)
      and the steer family is hard local-only (NFR-6/NFR-8; the declared
      read set admits no gate-facts read), so the empty map is the only
      composition that invents no default — but the consequence is that
      ticket AC-1's "asks batched with drawn defaults" lights up only at
      the injected seam (tests prove all three join states, TC-STEER-031)
      and never in production. The limitation is documented in the
      current-truth spec (doc/spec/features/feature-steer.md, "Asks join
      facts" known limitation) yet was never declared in the change spec
      (which promises the delivered join composed "verbatim", F-4/DM-6)
      nor disclosed as a delivery deviation in pm-notes.
    suggestion: >-
      Record the deviation where the change is accepted: a pm-notes
      delivery-finding entry (review_fix or closeout) stating the
      production none-truth and its local-only cause, plus an explicit
      owner decision — accept as documented, or file a follow-up ticket
      to wire locally-derivable join facts (merge-waiver refs and local
      owner-gate decision records) so pending/applied can light without a
      tracker read. No code change is required for this change to pass.
    suppressed: false
    published_url: null
    published_at: null
