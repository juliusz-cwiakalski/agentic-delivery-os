    type: info
    date: "2026-11-11"
  - text: "State detection: branch feat/GH-288/multi-repo-workstations exists and is
      checked out at origin/main-tools (5372dbac) with zero commits beyond it;
      no open or merged PR; no doc/changes folder for GH-288. Treated as a fresh
      start, not a resume, so the main-tools sync merge is a no-op."
    type: info
    date: "2026-11-11"
  - text: "Current-truth cross-check (doc/spec/**): the state layer stores one store
      per workspace inside an injected state directory, and production resolves
      that directory once from the injected home plus brand.stateDirectoryName
      with workspaceId 'default' (production.ts). Queue entries, lane leases,
      phase documents, dispatch authority views and the owner-hold marker all
      live under that single root, so two repositories on one host share one
      store keyed only by ref - the collision M2-S11 removes. No existing spec
      contradicts the ticket; the ticket extends the state and CLI surfaces
      additively."
    type: info
    date: "2026-11-11"
  - text: "Known doc-impact risks for phase 7: feature-state-layer.md (state root
      resolution and the host index), feature-cli-entrypoint.md (new root family
      plus prompt-required command set), feature-branding-seam.md
      (stateDirectoryName consumer list), a new feature-projects.md (spec
      coverage for the new surface), feature-capture-capsule/closeout if the
      host index touches closeout, doc/planning/oss-tooling/backlog.md M2-S11
      progress markers and status.md,
      doc/planning/oss-tooling/cli-command-registry.md,
      tests/fixtures/help-guide/coverage.json plus a reference page for the new
      family, and the migration note owed to existing single-store users."
    type: info
    date: "2026-11-11"
  - text: "Test planning found two spec gaps (an in-scope unbound behaviour with no
      AC, and an unspecified identity-refusal subject) plus a source-probe
      accuracy finding: production.ts composes the state directory inline and
      ignores the delivered <PREFIX>_STATE_DIR override, and mcp/serve.ts
      repeats it, so three derivation sites exist today and only the
      runtime-aware edge honours the override. Specification reopened, revised
      to v1.1 (AC-F1-5, AC-F3-3 naming, AC-F6-1 strengthened, DEC-16, §2.1
      corrected), re-completed (commit 6f28f34b); test plan revised to v2 (39
      TCs, 35/35 ACs) and completed (commit 754a7062); plan validated and
      completed (commit 1c8f2f6f)."
    type: info
    date: "2026-11-11"
  - text: "DoR iteration 1 = NOT_READY (readiness-review/readiness-iter-1.md). 12
      blocking: B1 project-key collision for two checkouts with the same
      basename; B2 the F-3 read-only clause has no owning AC; B3 phase 4 needs
      the prompt-required set change owned by phase 6 (both help gates verify
      set equality, so it cannot be green early); B4 phase 1 asserts a host-root
      listing that only exists after the phase-2 index; B5 the policy location
      (core/domain consuming core/config) violates the
      tier-domain-only-contracts boundary rule and plan/test-plan name different
      policy files; B6 the AC-F3-3 identity-refusal provocation is unreachable
      through the delivered git-directory resolution; B7 DEC-8 and DEC-16
      disagree about whether projects.state-unavailable can name a project key
      and state location that cannot exist, with no covering cell; B8 the M2
      projects page contradicts AC-F1-5 and AC-F3-2 and nothing corrects it; B9
      no phase owns the forbidden-literals registry entry the new guide
      requires; B10 two ACs declare Suite evidence for assertions the pinned
      release gate does not make and for a diff-against-moving-base half; B11
      AC-F6-4 is already satisfied by unmodified resolveDaemonSettings while
      plan 4.4 names a file that does not derive the socket; B12 four
      precedent-setting DECs have no TDR. Advisories A1-A8. Reopened
      specification, test_planning, delivery_planning; no delivery phase
      entered."
    type: blocker
    date: "2026-11-11"
  - text: "Retro: the spec set the contract surface correctly but two classes of
      defect reached the gate. (i) Placement/sequencing was asserted instead of
      probed: B5 (dependency-cruiser tier rule) and B3 (help gates verify set
      equality, so the prompt-set change and the command definition must land in
      one phase) would both have been caught by running the two gates and
      reading .dependency-cruiser.cjs before writing the policy location and
      phase order. (ii) Evidence classes were declared from intent rather than
      from the pinned test sources: B10/B11 would have been caught by reading
      privacy-release.test.ts and resolveDaemonSettings before labelling Suite.
      Lesson: when a spec places a module or orders phases, run the boundary and
      coverage gates against the plan's file list; when an AC declares Suite,
      name the pinned test that makes it red."
    type: retro
    date: "2026-11-11"
  - text: "Scope clarifications resolved without human input: the M2 pack fixes the
      contract (projectKey from the git common dir marker, stateLocation per
      repository, daemonReachable, handoverState engine|shell|in-transition,
      hostIndexRevision) and requires the migration note; dependencies M0-S5
      (state layer) and M1-S17 (queue/scheduling, GH-237) are delivered on
      main-tools. No contradiction with the system spec and no missing
      acceptance criterion requiring a tracker question, so clarify_scope closes
      without a ticket comment."
    type: info
    date: "2026-11-11"
