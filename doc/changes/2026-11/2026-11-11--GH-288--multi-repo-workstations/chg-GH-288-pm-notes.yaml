      the edit; AC/TC ownership re-derived as 38/38 and 42/42 with no orphan.
      Accepted residual risks (reviewer-endorsed, none blocking): a 32-bit key
      discriminator whose collision is made visible by the index guard rather
      than eliminated outright; review-verified diff halves; no live daemon
      probe in the shipped build by design; the unbound-basename replacement
      wording; and first-use daemon-reason wording."
    type: info
    date: "2026-11-11"
  - text: "Retro: the second gate cycle reproduced the same defect class as the
      first — scope completeness of a declared file list, not design.
      B13/B14/B15 were each found by reading one pinned gate or one composition
      file that the plan had not scoped. Lesson: derive a plan phase's scope
      from the *gates that must be green at that boundary* (each check's file
      inputs, each literal-inventory test, each export surface the importing
      tier may use), not from the files the feature conceptually owns."
