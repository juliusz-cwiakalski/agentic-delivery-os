# One ticket, one PR against main-tools, six delivery phases. Every phase is an
# independently committable slice that is green at its own boundary: no phase needs
# a later phase to compile, to assert, or to be meaningful. Extra phase data (goal,
# work items, test obligations, done-when, non-goals, commit subject, gate commands,
# evidence notes) is carried in YAML comments so the parsed document stays
# schema-strict: the only parsed keys are schemaVersion, workItemRef, tier,
# defaultLeases, defaultWeightClass and phases (id, title, kind, summary, scope,
