# GH-288 delivery plan — machine-readable projection (delivery.plan.v1), revision 1.0
# (2026-11-11).
#
# One ticket, one PR against main-tools, seven delivery phases. Every phase is an
# independently committable slice that is green at its own boundary: no phase needs
# a later phase to compile, to assert, or to be meaningful. Extra phase data
# (goal, test obligations, done-when, non-goals, commit subject, gate commands) is
# carried in YAML comments so the parsed document stays schema-strict: the only
# parsed keys are schemaVersion, workItemRef, tier, defaultLeases,
# defaultWeightClass and phases (id, title, kind, summary, scope, interactions,
# doneArtifacts, leases, weightClass, leaseClass). The plan declares phases and
# scope only; phase progress is a pm-notes `notes:` entry, never a plan field.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:      ./chg-GH-288-spec.md (v1.1; F-1..F-10, AC-F1-1..AC-F10-3 — 35
#                criteria including AC-F1-5 for the `unbound` scope, DM-1..DM-7,
#                NFR-1..NFR-11, DEC-1..DEC-16, Appendix A state-scope matrix,
#                Appendix B handover matrix, Appendix C daemon reason
#                vocabulary, Appendix D evidence map, Appendix E seed
#                reconciliation)
#   - Test plan: ./chg-GH-288-test-plan.md (v2; 39 TCs TC-PROJ-001..039, P1..P7
#                revert/mutation procedures, §3 coverage, §5 scenarios, §6
#                environments and fixtures, §7 automation mapping, §10 evidence)
#   - Ticket:    GH-288 (M2-S11). AC-1 → AC-F1-1/AC-F1-2; AC-2 → AC-F2-2 with
#                AC-F2-1 and AC-F3-1 supplying the shape (spec §"AUTHORING
#                GUIDELINES").
#   - M2 pack:   doc/planning/oss-tooling/milestones/m2/{contracts.md
#                (projects.v1), architecture.md, commands/projects.md,
#                entrypoint-delta.md, test-scenarios.md}
#   - Schema:    doc/spec/features/feature-plan-schema.md,
#                packages/core/src/domain/plan-validate.ts,
#                doc/templates/implementation-plan-template.md
#   - Rules:     AGENTS.md, .ai/rules/typescript.md, .ai/rules/testing-strategy.md,
#                .ai/rules/bash.md, .dependency-cruiser.cjs
#
# PHASE ORDER AND WHY (spec §18 "Order within the change", refined):
#   1 identity marker + state-scope policy + the production store root — everything
#     else consumes them, and the isolation evidence is the ticket's reason to exist
#   2 the derived host index — nothing can be discovered before it exists
#   3 the `projects list` surface and its honest projections — the only observable
#     of the index and of the two health projections
#   4 one policy on every other store-opening surface — a per-repository rule
#     applied at one site and not another splits one repository's state in two
#   5 migration and legacy detection — needs 1-2 to decide "unmigrated host"
#   6 mount obligations — a family that is composed but not reachable repeats the
#     recorded board-family mount gap
#   7 reconciliation, evidence, and release — the durable record of the delivery
#
# AC OWNERSHIP (every one of the 35 ACs has exactly one owning phase; a later
# phase may re-run an assertion, which is additive and never transfers ownership):
#   phase 1  AC-F1-1, AC-F1-2, AC-F1-3, AC-F1-4
#   phase 2  AC-F2-4                    (pruning is index-only; state survives)
#   phase 3  AC-F1-5, AC-F2-1, AC-F2-2, AC-F2-3, AC-F2-5, AC-F3-1, AC-F3-2,
#            AC-F3-3, AC-F4-1, AC-F4-2, AC-F4-3, AC-F5-1, AC-F5-2, AC-F5-3,
#            AC-F9-3
#   phase 4  AC-F6-1, AC-F6-2, AC-F6-3, AC-F6-4, AC-F6-5, AC-F7-1
#   phase 5  AC-F8-1, AC-F8-2, AC-F8-3
#   phase 6  AC-F9-1, AC-F9-2, AC-F9-4
#   phase 7  AC-F10-1, AC-F10-2, AC-F10-3
#   (4 + 1 + 15 + 6 + 3 + 3 + 3 = 35; no AC is unmapped and no AC id is invented.)
#
# TC OWNERSHIP (39/39, each owned exactly once):
#   phase 1  TC-PROJ-001, 002, 003, 004, 038
#   phase 2  TC-PROJ-009
#   phase 3  TC-PROJ-005, 006, 007, 008, 010, 011, 012, 013, 014, 015, 016, 017,
#            018, 019, 031, 037
#   phase 4  TC-PROJ-020, 021, 022, 023, 024, 025
#   phase 5  TC-PROJ-026, 027, 028
#   phase 6  TC-PROJ-029, 030, 032
#   phase 7  TC-PROJ-033, 034, 035, 036, 039
#
# DEVIATIONS from test-plan §7 "Phase grouping" (each is a fact about where the
# assertion can actually be green, not a scope reduction; the test plan's own note
# invites this: "the delivery plan should say which"):
#   - TC-PROJ-001/002 are owned by phase 1, not phase 3. Both read store artifacts
#     directly and drive delivered commands (`queue add`, `phase complete`,
#     `phase list`, `queue list`, `lanes list`, `status`, `dispatch`) and resolve
#     the project root through the policy; neither needs `projects list`. They are
#     the headline revert-sensitive evidence (P1) for phase 1's code.
#   - TC-PROJ-005 is owned by phase 3, not phase 1. Its `unbound` clause also
#     asserts that `projects list --json` does not report the unbound scope as a
#     project row and still reports the two registered projects, so it cannot be
#     green before the surface exists. The unbound implementation still lands in
#     phase 1.
#   - TC-PROJ-006/007/008/010 are owned by phase 3, not phase 2. Each asserts
#     through `projects list` (absent-index first run, two discovered rows, corrupt
#     refusal, revision and re-derived location). Only TC-PROJ-009 is index-only,
#     so it is phase 2's owning TC.
#   - TC-PROJ-020 is owned by phase 4, not phase 1. It asserts exactly one policy
#     implementation AND every consuming site (three derivation sites plus the
#     seven-consumer allowlist) with no inline home-plus-brand composition; before
#     phase 4 two inline compositions still exist by design.
#   - TC-PROJ-031 is owned by phase 3, not phase 6. `packages/cli/src/classify.ts`
#     resolves an error code absent from `ERROR_TABLE` to `fallback.internal`, so
#     the three identities must land in the same phase as the command that emits
#     them; TC-PROJ-013 (phase 3) already asserts those exact codes at exit 1/2.
#     Phase 6 keeps the mount, help, coverage, and literal obligations.
#   - TC-PROJ-037 is owned by phase 3, not phase 2. It measures `projects list`
#     latency at 25 and 200 projects as well as maintenance cost, so it needs both
#     the index and the surface.
#   - TC-PROJ-039 (the P1..P7 revert/mutation bundle, review-verified) is owned by
#     phase 7 because it records the red sets produced by every earlier phase.
#
# COMMIT CONVENTION (one commit per plan phase; subjects are declared here so the
# commit path and review agree; every line stays within 100 characters):
#   phase 1  feat(projects): scope delivery state per checkout identity
#   phase 2  feat(projects): maintain the derived host index with bounded pruning
#   phase 3  feat(projects): add projects list with honest health projections
#   phase 4  feat(projects): consume one state-scope policy on every surface
#   phase 5  feat(projects): detect legacy stores and document the one-step move
#   phase 6  feat(projects): mount the projects family in help and coverage gates
#   phase 7  docs(projects): reconcile system specs and close the minor release
#
# TEST ISOLATION IS A GATE CONDITION IN EVERY PHASE THAT TOUCHES STATE (NFR-8,
# TC-PROJ-038, spec RSK-12): every suite creates a per-test host root and a per-test
# home that is a distinct directory and neither ancestor of the other, sets the
# brand-derived `<PREFIX>_STATE_DIR` override to the absolute host root, and the
# fixture guard throws before a store is opened if the root is the live workspace
# root, an ancestor of it, the home-derived real state directory, or outside the
# approved base. A post-run fingerprint of the real state directory must be
# unchanged. No suite may compose the production program with `cwd` set to this
# repository (an identity marker would be minted in the live git common
# directory), and the aggregate gate runs as
# `mkdir -p tmp/tmpdir && TMPDIR=$PWD/tmp/tmpdir pnpm check`.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - STATE_SCHEMA_VERSION stays `delivery.state.v1`; workspaceId stays `default`;
#     the store artifact names, key prefixes, record kinds, fold rules, validation
#     predicates and modes inside a root are unchanged (NG-1, DEC-2). Isolation
#     comes from the root; contracts/state.ts and contracts/registry.ts are
#     deliberately untouched.
#   - Project identity is the checkout identity marker in the git COMMON
#     directory — never the path (breaks on rename/move, RSK-3) and never the
#     remote identity (collapses two clones of one remote, RSK-4, DEC-3).
#   - The host root is the delivered override-aware catalog rule: an absolute
#     `<PREFIX>_STATE_DIR` wins, otherwise injected home plus
#     `brand.stateDirectoryName`. That rule keeps one implementation in
#     packages/core/src/config/catalog.ts; the new policy consumes it and no
#     surface composes home-plus-brand inline afterwards (DEC-12, NFR-9).
#   - Absent is not corrupt: no index means an empty successful list at revision 0
#     (DEC-5, DEC-14); a present but unparsable index is corruption for a read,
#     preserved as a timestamped sibling before maintenance replaces it.
#   - stateLocation is always re-derived from the project key; the index is
#     untrusted input for reads, and pruning removes index entries only and never
#     a state root (spec §21).
#   - `daemonReachable` is `{ reachable, reason? }` with the closed reason
#     vocabulary of Appendix C; `handoverState` is `engine` | `shell` |
#     `in-transition` and only ever derived by comparing the folded handover truth
#     with the derived authority document (Appendix B, DEC-7).
#   - The owner hold stays host-wide at the host root (DEC-9); no per-project
#     marker exists.
#   - The `projects list` envelope adds no top-level key: `data` carries exactly
#     `projects` and `hostIndexRevision`, and each entry carries exactly
#     `projectKey`, `root`, `stateLocation`, `daemonReachable`, `handoverState`.
#   - Exactly three new error rows under one new domain kind
#     (`projects.identity-unreadable`, `projects.registry-corrupt`,
#     `projects.state-unavailable`); all three are three-segment codes, so
#     RESERVED_TWO_SEGMENT_CODES is unchanged, and no existing row is added,
#     retired, or reworded.
#   - No new package, no new external dependency, no new subpath, and no new
#     hardcoded product or binary literal: every name resolves from the injected
#     brand identity, and marker/index document names live in one contracts
#     constant that tests import rather than spell (NFR-10, AC-F9-4).
#   - Boundaries hold in every phase (`.dependency-cruiser.cjs`,
#     `.ai/rules/typescript.md`): core stays runtime-neutral — no `node:fs`,
#     `node:child_process`, `process`, clock, or environment read in
#     `packages/core/src/{contracts,domain,app}`; filesystem and git IO live in
#     `packages/adapters`; CLI and MCP each own their composition and neither
#     imports the other; `packages/cli/src/help/prompt-required-commands.ts` stays
#     dependency-free so the gates can import it without resolving `dist/`.
#
# LIFECYCLE PHASE 7 HANDOFF OBLIGATIONS (`system_spec_update`, `@doc-syncer`;
# declared here so they are not silently dropped after DoD. Plan phase 7 authors
# the same pages so the handoff is a verification of current truth, not a first
# write):
#   - doc/spec/features/feature-state-layer.md: state root becomes the host root
#     plus the per-project root; the host index is the only host-level document
#     besides the host-wide owner-hold marker; the same delivered artifacts are
#     opened per project root; the delivered override-aware rule IS the store's
#     host-root rule (the store honours it after this change, which it did not
#     before); migration is a move, never a rewrite.
#   - doc/spec/features/feature-cli-entrypoint.md: the prompt-required table gains
#     `projects list`; state resolution is stated as the two-layer policy that
#     honours the override, replacing the inline home-plus-brand composition; the
#     unmounted-daemon statement stays and is referenced by the degradation reason.
#   - doc/spec/features/feature-branding-seam.md: `stateDirectoryName` names the
#     host root from which project roots derive (consumer list updated).
#   - doc/spec/features/feature-projects.md (new): `projects.v1`, the envelope and
#     text contract, exit codes, the three error identities, discovery and pruning
#     rules, the handover and daemon projections, and the identity marker.
#   - doc/spec/features/feature-result-contract.md: the three identities under the
#     new domain kind (documented in plan phase 3 so the bidirectional sync gate
#     is green from the phase that emits them; phase 7 re-verifies it).
#   - doc/spec/features/feature-dispatch-engine.md: the authority view is consumed
#     from the project state root, and the shell fallback resolves the project
#     root before reading the document.
#   - doc/spec/features/feature-owner-gate-sla.md: the owner-hold marker is
#     host-wide and read at the host root.
#   - doc/planning/oss-tooling/backlog.md (M2-S11 progress markers),
#     doc/planning/oss-tooling/status.md (M2 delivery snapshot per its own
#     maintenance convention), doc/planning/oss-tooling/cli-command-registry.md
#     (`projects` row moved from planned to delivered by this change),
#     doc/planning/oss-tooling/milestones/m2/entrypoint-delta.md (observed
#     composition gains `projects`; the remaining M2 additions stay planned),
#     doc/planning/oss-tooling/milestones/m2/commands/projects.md (delivered
#     reference page; the pack's "planned until M2 exit" status is retained).
#   - Current-truth facts the reconciliation must state, not paraphrase away:
#     three derivation sites existed and only the runtime-aware edge honoured the
#     override before this change, so the store now relocates for a host that sets
#     it; the resident daemon is still unmounted in this build and the overview
#     reports that reason; `projects list` is read-only with respect to delivery
#     state; discovery is derived from use and is not a filesystem crawl; two
#     clones of one remote are two projects and all linked worktrees of one clone
#     are one project.
#
# EVIDENCE DISCIPLINE (spec §17 classes, carried not upgraded):
#   - Suite: the phase gates below. Revert-sensitive evidence is marked in the
#     test plan as P1 (two-layer resolution reverted to the single host root),
#     mutation-verified evidence as P2..P7; the red sets are executed inside the
#     owning phase and recorded in the change review and test-plan §10
#     (TC-PROJ-039, phase 7).
#   - Review-verified: AC-F8-3, AC-F10-1, AC-F10-2 and the diff halves of
#     AC-F9-2/AC-F9-3/AC-F10-3. No permanent suite asserts a diff against a moving
#     base, so these are recorded as review evidence and never claimed as suite.
#   - NFR-2 is asserted by the existing state/audit/retro suites staying green
#     UNMODIFIED plus a review-verified diff (TC-PROJ-036, phase 7).
#
# ROLLBACK: reverting the change restores the single-root behaviour. A host that
# has already migrated must move the artifacts back; nothing was rewritten and
# nothing was re-keyed, so the inverse move is sufficient (spec §18, §19). No
# schema, record, envelope, or exit projection rollback is required, and no
# feature flag exists because a flag would have to select between two state roots
# — the ambiguity this change removes.
schemaVersion: delivery.plan.v1
workItemRef: GH-288
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7]
  escalationTriggers:
    - state-record-contract-schema-version-key-prefix-or-layout-changed
    - project-key-derived-from-path-or-remote-instead-of-the-marker
    - second-state-scope-derivation-or-inline-home-plus-brand-composition
    - host-index-treated-as-authoritative-or-pruning-deletes-a-state-root
    - daemon-or-handover-claim-not-backed-by-a-derived-fact
    - owner-hold-narrowed-to-a-project
    - list-surface-writes-state-index-or-revision
    - fourth-error-row-or-two-segment-code-added
    - m1-reference-page-or-existing-error-row-modified
    - new-package-dependency-subpath-or-brand-literal
    - test-writes-to-the-real-user-state-directory-or-the-live-checkout
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Checkout identity marker, state-scope policy, per-project state root
  # Commit: feat(projects): scope delivery state per checkout identity
  #
  # Goal: make state resolution two layers — the delivered host root plus a
  # per-repository project root derived from the checkout identity — and open the
  # production store at that root, so two checkouts of different repositories can
  # never write the same phase document or queue key for one ref.
  #
  # Work:
  #  1.1 packages/core/src/contracts/projects.ts (new, data only): the project
  #      scope vocabulary — the checkout identity marker name, the project
  #      container segment, the declared `unbound` segment, the marker payload
  #      type (readable key, opaque identifier, created time), the project scope
  #      result type, and bounds. Names are declared here once and imported by
  #      tests, never spelled as literals and never containing a product name.
  #  1.2 packages/core/src/domain/state-scope.ts (new, pure): the single
  #      state-scope rule over injected facts (host root, brand state directory
  #      name, home, environment record, resolved checkout identity). It returns
  #      either the project scope (key, identifier, checkout root, project state
  #      root `<host root>/<projects>/<key>`) or the declared unbound host scope;
  #      it never invents a key from a path, never falls back into a project root,
  #      and treats an uncreatable marker or unreadable git metadata as a
  #      state-location failure, not a substitute key (Appendix A rows 1-10).
  #  1.3 packages/core/src/config/catalog.ts: keep `resolveStateDirectoryScope`
  #      as the ONE host-root implementation (absolute override wins, otherwise
  #      home plus brand; a non-absolute override stays config.value.invalid) and
  #      make it the policy's only host-root input. No second implementation and
  #      no duplicated validation.
  #  1.4 packages/adapters/src/file/project-identity.ts (new): the create-once
  #      marker read/mint inside the checkout's git common directory, following
  #      the delivered dispatch-identity discipline exactly — synced sibling plus
  #      link, 0600, never rewritten, a loser of a race reads the winner's file,
  #      no temp sibling left behind, shared by the clone's worktrees, travelling
  #      with a renamed or moved checkout.
  #  1.5 packages/adapters/src/repo/index.ts: extend the checkout read so one call
  #      returns the working root (nearest enclosing `.git`), the git directory
  #      and the common directory, reusing `findGitRoot` and
  #      `resolveCheckoutGitDirectories`; no new process spawn and no network.
  #  1.6 packages/cli/src/production.ts: replace the inline home-plus-brand
  #      composition with the policy; open the store at the project state root
  #      with workspaceId `default` and the unchanged layout; for an invocation
  #      outside any git work tree emit exactly one bounded warning to the error
  #      stream, open the declared unbound root, register nothing, and keep the
  #      exit code unchanged.
  #  1.7 Test isolation fixtures (new): tests/fixtures/projects/state-scope.ts
  #      (approved base `tmp/tmpdir`, host-root factory, a home that is distinct
  #      by construction, the brand-derived override name, the pre-write guard,
  #      the real-state fingerprint, the non-checkout directory helper with its
  #      `findGitRoot === undefined` pre-assertion), temp-repos.ts (real
  #      `git init` repositories, clones, linked worktrees, nested repository,
  #      sanitized git environment, GIT_CEILING_DIRECTORIES pinned), and
  #      production.ts (the production-composition harness that accepts only
  #      home, environment, cwd and declared seams — never a root or a key).
  #  1.8 Existing suites that pinned the host-root store path or composed the
  #      production program from this repository's own `cwd` are updated to
  #      derive the project root through the same policy and to use a temporary
  #      checkout or non-checkout `cwd`: the queue production harness, the
  #      dispatch admission fixture, the production-composition suite, the
  #      owner-hold production-composition suite, and the three
  #      coordinator/dispatch structural composition suites named in scope.
  #  1.9 Registration: every new module gets its `tests/structure/inventory.json`
  #      row AND its `EXECUTABLE_ALLOWANCES` row in
  #      tests/structure/content-inventory.test.ts (that allowlist is the only
  #      place an executable export may be declared); existing modules that gain
  #      an export grow their existing row.
  #
  # Test obligations (owning TCs; must be green at this boundary):
  #   TC-PROJ-001  two real checkouts, one ref: disjoint phase documents and
  #                disjoint queue records under two project roots (P1 revert)
  #   TC-PROJ-002  no read surface observes the other checkout
  #   TC-PROJ-003  identity matrix: nested, linked worktree, rename, move,
  #                nested repository
  #   TC-PROJ-004  two clones are two projects; one clone's worktrees are one;
  #                marker create-once/0600/no-literal discipline
  #   TC-PROJ-038  the isolation guard, the leak detector, and the fixture
  #                meta-assertions (home distinct from host root)
  #
  # Done when: those five suites are green; the store file names under each
  # project root are exactly the delivered layout and the host root holds no store
  # artifact; `pnpm typecheck`, `pnpm check:boundaries`,
  # `bun run scripts/checks/prompt-conformance.ts` and `biome check` are green;
  # the existing state, queue, dispatch, and coordinator suites are green without
  # assertion edits; no test writes outside its temporary root.
  #
  # Non-goals (a later phase owns each): host index and maintenance (phase 2);
  # the `projects` family and its projections (phase 3); MCP, the runtime-aware
  # edge audit store, daemon socket derivation, dispatch state root, retro
  # sidecar, owner-hold wiring, and the bash fallback (phase 4); the legacy
  # detection warning (phase 5); mount and help (phase 6).
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Checkout identity marker, state-scope policy, and the per-project state root"
    kind: delivery
    summary: >-
      Make state resolution two layers and open the production store at the
      project root: a runtime-neutral policy over injected facts whose host root
      is the one delivered override-aware rule (absolute `<PREFIX>_STATE_DIR`
      wins, otherwise injected home plus `brand.stateDirectoryName`), returning
      either the project scope keyed by a create-once checkout identity marker in
      the git common directory (atomic synced sibling plus link, 0600, never
      rewritten, shared by the clone's worktrees, travelling with a renamed or
      moved checkout, no path-derived and no remote-derived key) or the declared
      `unbound` host scope with exactly one bounded warning and an unchanged exit
      code; the adapter read returns working root, git directory and common
      directory in one call with no spawn and no network; the store keeps
      workspaceId `default` and the delivered artifact layout inside the new root
      so migration stays a move; and the new tests carry the isolation contract —
      per-test host root, a home that is distinct by construction, the
      brand-derived override, a pre-write guard rejecting the live workspace root
      and the real state directory, and a leak fingerprint — with every existing
      production-composition fixture repointed at the policy.
    scope:
      files:
        - packages/core/src/contracts/projects.ts
        - packages/core/src/contracts/index.ts
        - packages/core/src/index.ts
        - packages/core/src/domain/state-scope.ts
        - packages/core/src/domain/index.ts
        - packages/core/src/config/catalog.ts
        - packages/adapters/src/repo/index.ts
        - packages/adapters/src/file/project-identity.ts
        - packages/adapters/src/file/index.ts
        - packages/cli/src/production.ts
        - tests/structure/inventory.json
        - tests/structure/content-inventory.test.ts
        - tests/fixtures/projects/state-scope.ts
        - tests/fixtures/projects/temp-repos.ts
        - tests/fixtures/projects/production.ts
        - tests/fixtures/queue/production/harness.ts
        - tests/fixtures/dispatch/admission.ts
        - tests/behaviour/projects-scope-isolation.test.ts
        - tests/behaviour/projects-identity.test.ts
        - tests/behaviour/production-composition.test.ts
        - tests/behaviour/owner-hold-production-composition.test.ts
        - tests/structure/dispatch-composition.test.ts
        - tests/structure/coordinator-production-composition.test.ts
        - tests/structure/coordinator-production-session.test.ts
        - tests/checks/projects-test-isolation.test.ts
      folders:
        - tests/fixtures/projects
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/projects.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/domain/state-scope.ts
        role: producer
    doneArtifacts:
      trackerTransition: "GH-288 in progress; phase 1 evidence recorded in pm-notes notes"
    weightClass: heavy

  # ---------------------------------------------------------------------------
  # Phase 2 — Derived host index: schema, revision, bounded maintenance, corruption
  # Commit: feat(projects): maintain the derived host index with bounded pruning
  #
  # Goal: make discovery work without a hand-written registry, and make the index a
  # derived cache that can never be authoritative over delivery state.
  #
  # Work:
  #  2.1 packages/core/src/contracts/projects.ts: add the host index schema
  #      identity, the entry payload type (project key, identifier, absolute
  #      checkout root, derived state location, last-written time), the revision
  #      type and the bounds. The index is not a state record and adds no state
  #      record kind.
  #  2.2 packages/core/src/domain/host-index.ts (new, pure): parse/validate the
  #      document; the upsert of the current project; the prune predicate that
  #      removes only provably dead entries (recorded root absent, or the root's
  #      marker resolves to a different project identifier) and leaves every
  #      uncertain entry; the next revision (monotonic by one per write); the
  #      re-derivation of every state location from its key, with a disagreement
  #      reported as a warning and never used to redirect a read or a probe.
  #  2.3 packages/adapters/src/file/host-index-store.ts (new): read (absent,
  #      parsable, corrupt), atomic replace through a synced sibling plus rename,
  #      preserve a corrupt document as a timestamped sibling exactly once before
  #      writing a fresh index containing the current project, and a counting seam
