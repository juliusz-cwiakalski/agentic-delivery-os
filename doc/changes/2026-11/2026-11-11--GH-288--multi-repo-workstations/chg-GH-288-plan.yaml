phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Identity, key derivation, the app-tier policy, per-project store root
  # Commit: feat(projects): mint checkout identity keys behind an app-tier policy
  #
  # Goal: resolve delivery state as two layers — the delivered host root plus a
  # per-repository project root derived from the checkout identity — behind one
  # app-tier policy, and open the production store at that root, so two checkouts
  # of different repositories (even with the same basename) can never write the
  # same phase document or queue key for one ref.
  #
  # Work (1.0 is a prerequisite: delivery does not start before it exists):
  #  1.0 AUTHOR `doc/decisions/TDR-0022-multi-repository-workstation-state-scope.md`
  #      through `@decision-advisor` (DEC-19): it covers DEC-1 (the durable
  #      workstation state layout: host root plus `projects/<key>`, host index at
  #      `<host root>/host-index.json`), DEC-3 (project identity minted from the
  #      checkout identity marker with the key/discriminator format), DEC-12 (one
  #      state-scope policy in the app tier, exported from the core root entry,
  #      consumed by every surface) and DEC-13 (the help gates learn a per-command
  #      reference-page root), with their consequences for later changes. Register
  #      it in `doc/decisions/00-index.md` at the next free id. Do NOT restate the
  #      contents in this plan.
  #  1.1 packages/core/src/contracts/projects.ts (new, data only): the identity
  #      marker name and schema, the key format constants and basename bounds, the
  #      host index artifact name (`host-index.json`), its schema identity
  #      (`delivery.projects.host-index.v1`) and entry bounds, the project container
  #      segment, the declared `unbound` segment, the closed identity-outcome
  #      vocabulary, and the closed daemon/handover vocabularies. No product or
  #      binary literal; tests import these constants instead of spelling names.
  #  1.2 packages/core/src/app/state-scope.ts (new, APP tier — never domain): the
  #      single state-scope rule over injected facts (home, environment record,
  #      brand state directory name, resolved checkout identity, marker port,
  #      index port). It owns the HOST-ROOT RULE (the absolute `<PREFIX>_STATE_DIR`
  #      override wins, otherwise home plus brand, a relative override is
  #      `config.value.invalid`) — the implementation MOVES here from
  #      `packages/core/src/config/catalog.ts` — plus the project root
  #      `<host root>/projects/<key>`, the declared `unbound` scope, the closed
  #      identity outcome, the key minting rules (sanitised mint-time basename ≤ 32
  #      chars, `project` fallback, `unbound` refused, discriminator = first eight
  #      lowercase hex of the identifier), and the marker read validation that
  #      refuses a key whose basename or discriminator disagrees with the recorded
  #      identifier. Pure: no filesystem, git, clock, or process access; I/O arrives
  #      through the injected ports.
  #  1.3 packages/core/src/config/catalog.ts: remove `resolveStateDirectoryScope`
  #      and `StateDirectoryScopeInput` once the policy owns the rule (the config
  #      catalog keeps `resolveDaemonSettings` and everything else, unchanged);
  #      update `packages/core/src/config/index.ts` and
  #      `packages/core/src/index.ts` so the policy is exported from the existing
  #      `@delivery-os/core` root entry and `packages/core/package.json` `exports`
  #      gains nothing.
  #  1.4 packages/adapters/src/file/project-identity.ts (new): the create-once
  #      marker read/mint inside the checkout's git common directory, following the
  #      delivered dispatch-identity discipline exactly — synced sibling plus link,
  #      0600, never rewritten, a race loser reads the winner's file, no temp
  #      sibling left behind, shared by the clone's worktrees, travelling with a
  #      renamed or moved checkout; a marker that cannot be created is a
  #      state-location failure, never a path-derived substitute.
  #  1.5 packages/adapters/src/repo/index.ts: add a closed-outcome checkout read
  #      that distinguishes "not inside a git work tree" (→ `unbound`) from "git
  #      metadata present but unusable" (an empty `gitdir:` value → identity
  #      refusal), reusing `findGitRoot` and `resolveCheckoutGitDirectories`
  #      internally; no new process spawn, no network, no ascent above the first
  #      `.git` entry.
  #  1.6 packages/cli/src/production.ts: split the two roots — `hostRoot` from the
  #      policy feeds the owner-hold read (host-wide, unchanged semantics), and
  #      `projectRoot` feeds the store, the dispatch state root, the retro sidecar
  #      and the coordinator state directory; open the store with workspaceId
  #      `default` and the unchanged layout; emit exactly one bounded warning and
  #      open the declared unbound root for an invocation outside any git work tree
  #      (registering nothing, exit code unchanged); surface the identity refusal
  #      and the state-location failure as classified failures under the three
  #      codes declared in phase 3.
  #  1.7 packages/cli/src/edge.ts: `stateDirectoryFor` consumes the policy instead
  #      of the removed catalog helper (the runtime-aware edge is the third of the
  #      three historical derivation sites and honours the override today), and
  #      `tests/behaviour/config-resolver.test.ts` re-points its host-root
  #      assertions at the policy. Do not add a second precedence site.
  #  1.8 Test isolation fixtures (new): tests/fixtures/projects/state-scope.ts
  #      (approved base `tmp/tmpdir`, host-root factory, a home distinct by
  #      construction, the brand-derived override name, the pre-write guard, the
  #      real-state fingerprint, the non-checkout helper with its
  #      `findGitRoot === undefined` pre-assertion), temp-repos.ts (real `git init`
  #      repositories, same-basename parents, clones, linked worktrees, nested
  #      repository, sanitized git environment, GIT_CEILING_DIRECTORIES pinned),
  #      production.ts (the production-composition harness: host root, home, cwd,
  #      the declared seams, `run(argv)`, project-root resolution, host/project
  #      snapshots — and NO way to inject a root or a key), and markers.ts (marker
  #      read/write helpers for the corruption and copied-marker cells, built on the
  #      product's own seam).
  #  1.9 Existing suites that pinned the host-root store path or composed the
  #      production program from this repository's own `cwd` are updated to derive
  #      the project root through the policy and to use a temporary checkout or
  #      non-checkout `cwd`: the queue production harness, the dispatch admission
  #      fixture, the production-composition suite, the owner-hold
  #      production-composition suite, and the coordinator/dispatch structural
  #      composition suites named in scope.
  #  1.10 Registration: `tests/structure/inventory.json` row and the
  #      `EXECUTABLE_ALLOWANCES` row in tests/structure/content-inventory.test.ts
  #      for every new module, and the existing row of every module that gains or
  #      loses an export (`catalog.ts`, `config/index.ts`, `core/index.ts`,
  #      `repo/index.ts`, `edge.ts`).
  #
  # Test obligations (owning TCs; must be green at this boundary):
  #   TC-PROJ-001  two real checkouts, one ref: disjoint phase documents and
  #                disjoint queue records under two project roots, and NO store
  #                artifact at the host root (absence, not an exact set — B4)
  #   TC-PROJ-002  no read surface observes the other checkout
  #   TC-PROJ-003  identity matrix: nested, linked worktree, rename, move,
  #                nested repository
  #   TC-PROJ-004  two clones are two projects; one clone's worktrees are one;
  #                marker create-once/0600/no-literal discipline
  #   TC-PROJ-038  cross-cutting: the isolation guard, the leak detector, and the
  #                fixture meta-assertions (home distinct from the host root)
  #
  # Done when: TDR-0022 exists and is registered in the decision index; those five
  # suites are green; the store file names under each project root are exactly the
  # delivered layout and the host root holds no store artifact (and no index — the
  # index is phase 2's); the policy is the only module that reads `_STATE_DIR` or
  # composes home plus brand (`grep`-free: `pnpm check:boundaries` plus the phase-4
  # structural assertion are the permanent guards); `pnpm typecheck`,
  # `pnpm check:boundaries`, `bun run scripts/checks/prompt-conformance.ts`,
  # `bun run scripts/checks/workspace-entrypoints.ts`, `tests/structure/subpaths.test.ts`
  # and `biome check` are green; the existing state, queue, dispatch, coordinator,
  # config and audit suites are green without assertion edits; no test writes
  # outside its temporary root.
  #
  # Non-goals (a later phase owns each): the host index and maintenance (phase 2);
  # the `projects` family, its projections, its error rows and its mount (phase 3);
  # MCP, the daemon settings site and the bash fallback (phase 4); the legacy
  # detection warning and the guide (phase 5); reconciliation and release
  # (phase 6).
  # ---------------------------------------------------------------------------
  - id: 1
    title: "TDR-0022, checkout identity and key minting, the app-tier state-scope policy, and the per-project state root"
    kind: delivery
    summary: >-
      Author TDR-0022 first (the decision record is a prerequisite: delivery does
      not start before it exists) and then make state resolution two layers behind
      one app-tier policy: `packages/core/src/app/state-scope.ts` owns the host-root
      rule (an absolute `<PREFIX>_STATE_DIR` wins, otherwise injected home plus
      `brand.stateDirectoryName`, a relative override is `config.value.invalid`),
      the project root `<host root>/projects/<projectKey>`, and the declared
      `unbound` scope, with the host-root implementation moved out of the config
      catalog so exactly one home-plus-brand composition and one override
      precedence remain; the project key is minted once as
      `<sanitised mint-time basename>-<eight hex of the identifier>` (≤ 32
      characters, `project` fallback, `unbound` refused) and persisted in a
      create-once marker inside the git common directory (atomic synced sibling
      plus link, 0600, never rewritten, shared by the clone's worktrees, travelling
      with a rename), while the identity outcome is a closed table with git metadata
      unusable and marker corruption as refusals and a missing marker as mint; the
      production composition opens the store, the dispatch state root, the retro
      sidecar and the coordinator state at the project root and keeps the owner-hold
      read at the host root, and the new suites carry the isolation contract —
      per-test host root, a home distinct by construction, the brand-derived
      override, a pre-write guard and a leak fingerprint — with every existing
      production-composition fixture repointed at the policy.
    scope:
      files:
        - doc/decisions/TDR-0022-multi-repository-workstation-state-scope.md
        - doc/decisions/00-index.md
        - packages/core/src/contracts/projects.ts
        - packages/core/src/contracts/index.ts
        - packages/core/src/index.ts
        - packages/core/src/app/state-scope.ts
        - packages/core/src/app/index.ts
        - packages/core/src/config/catalog.ts
        - packages/core/src/config/index.ts
        - packages/adapters/src/repo/index.ts
        - packages/adapters/src/file/project-identity.ts
        - packages/adapters/src/file/index.ts
        - packages/cli/src/production.ts
        - packages/cli/src/edge.ts
        - tests/structure/inventory.json
        - tests/structure/content-inventory.test.ts
        - tests/behaviour/config-resolver.test.ts
        - tests/fixtures/projects/state-scope.ts
        - tests/fixtures/projects/temp-repos.ts
        - tests/fixtures/projects/production.ts
        - tests/fixtures/projects/markers.ts
        - tests/fixtures/queue/production/harness.ts
        - tests/fixtures/dispatch/admission.ts
        - tests/behaviour/projects-scope-isolation.test.ts
        - tests/behaviour/projects-identity.test.ts
        - tests/behaviour/production-composition.test.ts
        - tests/behaviour/owner-hold-production-composition.test.ts
        - tests/structure/dispatch-composition.test.ts
        - tests/structure/coordinator-production-composition.test.ts
        - tests/structure/coordinator-production-session.test.ts
        - tests/checks/projects-test-isolation.test.ts
      folders:
        - tests/fixtures/projects
    interactions:
      - kind: contract-file
        target: packages/core/src/app/state-scope.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/contracts/projects.ts
        role: producer
      - kind: contract-file
        target: doc/decisions/TDR-0022-multi-repository-workstation-state-scope.md
        role: producer
    doneArtifacts:
      trackerTransition: "GH-288 in progress; TDR-0022 authored and indexed; phase 1 evidence recorded in pm-notes notes"
    weightClass: heavy

  # ---------------------------------------------------------------------------
  # Phase 2 — Derived host index: document, revision, bounded maintenance
  # Commit: feat(projects): maintain a derived host index with bounded writes
  #
  # Goal: make discovery work without a hand-written registry, and make the index a
  # derived cache that can never be authoritative over delivery state.
  #
  # Work:
  #  2.1 packages/core/src/contracts/projects.ts: add the index entry payload type
  #      (project key, identifier, absolute checkout root, derived state location,
  #      last-written time), the revision type and the bounds (the artifact name and
  #      schema identity were pinned in phase 1). The index is not a state record
  #      and adds no record kind.
  #  2.2 packages/core/src/app/host-index.ts (new, app tier — it composes config and
  #      contracts and needs no domain import): the pure fold — parse/validate the
  #      document, upsert the current project, prune only provably dead entries
  #      (recorded root absent, or the root's marker resolves to a different
  #      identifier), leave uncertain entries, compute the next revision, re-derive
  #      every state location from its key and report a disagreement as a warning
  #      that never redirects a read, and enforce the DEC-18 key guard (a key held
  #      under a different identifier keeps the existing entry unchanged and yields
  #      the conflicting-registration outcome). No index write when nothing changed.
  #  2.3 packages/adapters/src/file/host-index-store.ts (new): read (absent,
  #      parsable, corrupt), atomic replace through a synced sibling plus rename,
  #      preserve a corrupt document as a timestamped sibling exactly once before a
  #      fresh index is written, and expose the index-access fact (read/write/list
  #      counters) declared among the production composition facts — the counters
  #      accept no root, no key and no path, so TR-1 still holds.
  #  2.4 packages/cli/src/production.ts: run maintenance at most once per
  #      store-opening invocation whose scope resolves inside a checkout — exactly
  #      one index read, at most one write, ZERO writes and no revision advance when
  #      nothing changed, no filesystem crawl, and never on the `projects list` path
  #      (the path does not exist yet; the rule is stated here and asserted by
  #      TC-PROJ-041 in phase 3). Record the legacy-detection exclusions (the index,
  #      the owner-hold marker, the `unbound` scope) as declared data for phase 5.
  #  2.5 packages/core/src/index.ts (B15): the root entry re-exports app symbols by
  #      an explicit name list, and the CLI may import core only from `.` and its
  #      declared subpaths, so the new app-tier names the production composition
  #      consumes (the host-index fold and its result/entry types, and the state
  #      scope policy already exported in phase 1) are added to that list here.
  #      This is an additive re-export of an existing module: the core package
  #      manifest's `exports` map gains nothing, so no new subpath exists, and
  #      `scripts/checks/workspace-entrypoints.ts` plus
  #      `tests/structure/subpaths.test.ts` stay green.
  #  2.6 Registration: inventory and executable-allowance rows for the two new
  #      modules, and the existing row of the root entry if it lists its exports.
  #
  # Test obligations (owning TC; must be green at this boundary):
  #   TC-PROJ-009  pruning is index-only: the vanished-root entry and the
  #                re-keyed entry are removed, the referenced state roots are
  #                byte- and mode-identical afterwards, re-registration restores
  #                the same key and state location, and a marker replacement
  #                changes the key (P3 mutation: deleting the referenced state
  #                root during pruning must red it).
  #
  # Done when: TC-PROJ-009 is green; the revision advances by exactly one per
  # genuine change and does NOT advance (and no write occurs) when nothing changed;
  # the counter fact shows at most one read and one write per maintaining
  # invocation; pruning never deletes a state root; the DEC-18 guard leaves the
  # existing entry byte-identical and advances no revision; the root entry exports
  # the new app-tier names with `packages/core/package.json` `exports` unchanged;
  # `tests/structure/inventory.json` and the executable allowlist are updated;
  # `pnpm typecheck`, `pnpm check:boundaries`,
  # `bun run scripts/checks/workspace-entrypoints.ts`,
  # `tests/structure/subpaths.test.ts` and `biome check` are green.
  # Isolation: the index suites run over the phase-1 host-root/home pair and the
  # pre-write guard; no suite writes to the real state directory or the live
  # checkout.
  # NOT claimed here (A8): corrupt-index READ refusal and evidence-preserving
  # replacement are proven by TC-PROJ-008 at phase 3 and by TC-PROJ-027 at phase 5;
  # this phase implements the seam behaviour but asserts only TC-PROJ-009.
  #
  # Non-goals: the `projects` surface and its mount (phase 3 — including the
  # `projects list` write-nothing assertion); MCP, the daemon settings site and the
  # bash fallback (phase 4); the legacy warning and the guide (phase 5).
  # ---------------------------------------------------------------------------
  - id: 2
    title: "Derived host index: document, revision, bounded maintenance, and the DEC-18 key guard"
    kind: delivery
    summary: >-
      Add the host-level index as a derived, revisioned cache at
      `<host root>/host-index.json`: one entry per registered project (key,
      identifier, absolute checkout root, derived state location, last write) plus
      a schema identity and a monotonic revision; a pure app-tier fold decides the
      upsert, the provably-dead prune (recorded root absent, or the root's marker
      now resolves to a different identifier), the revision and the DEC-18 key guard
      (a key held under another identifier keeps the existing entry unchanged and
      reports the conflict), while the adapter owns the read, the atomic replace,
      the corrupt-versus-absent distinction and the once-only preservation of a
      corrupt document before a fresh index is written; an observability-only
      index-access fact exposes read/write/list counters without accepting a root,
      key or path; maintenance runs at most once per store-opening invocation inside
      a checkout with exactly one read and at most one write, zero writes and no
      revision advance when nothing changed, never on a `projects list` path, and
      removes index entries only and never a state root, with every reported state
      location always re-derived from its key.
    scope:
      files:
        - packages/core/src/contracts/projects.ts
        - packages/core/src/app/host-index.ts
        - packages/core/src/app/index.ts
        - packages/core/src/index.ts
        - packages/adapters/src/file/host-index-store.ts
        - packages/adapters/src/file/index.ts
        - packages/cli/src/production.ts
        - tests/structure/inventory.json
        - tests/structure/content-inventory.test.ts
        - tests/fixtures/projects/host-index.ts
        - tests/fixtures/projects/host-root.ts
        - tests/behaviour/projects-host-index.test.ts
      folders:
        - tests/fixtures/projects
    interactions:
      - kind: contract-file
        target: packages/adapters/src/file/host-index-store.ts
        role: producer
    doneArtifacts:
      trackerTransition: "GH-288 in progress; phase 2 evidence recorded in pm-notes notes"
    weightClass: heavy

  # ---------------------------------------------------------------------------
  # Phase 3 — The `projects` surface AND its mount, as one indivisible unit (B3)
  # Commit: feat(projects): mount projects list as one reachable unit
  #
  # Goal: deliver the host overview — the family's only verb, its contract, its two
  # health projections, its three error identities — and make it reachable in one
  # step. This phase is the change's largest slice by design: three pins assert the
  # composed command set (`scripts/checks/help-guide-coverage.ts` set equality with
  # the inventory, `tests/checks/reference-page-parity.test.ts` set equality with
  # PROMPT_REQUIRED_COMMANDS, and TC-ENTRY-009's literal expectation in
  # `tests/behaviour/entrypoint-composition.test.ts`), so the prompt-set entry, the
  # command definition and its composition, the help entries, the reference page,
  # the coverage-inventory row and the three error rows are green only together
  # (DoR B3, B14; TC-PROJ-030).
  #
