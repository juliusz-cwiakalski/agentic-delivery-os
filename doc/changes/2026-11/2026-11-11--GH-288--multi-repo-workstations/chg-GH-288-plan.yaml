# TEST ISOLATION IS A GATE CONDITION IN EVERY PHASE THAT TOUCHES STATE (NFR-8,
# TC-PROJ-038, spec RSK-12): every suite creates a per-test host root and a
# per-test home that is a distinct directory and neither an ancestor of the other
# (TR-10), sets the brand-derived `<PREFIX>_STATE_DIR` override to the absolute
# host root, and the fixture guard throws before a store is opened if the root is
# the live workspace root, an ancestor of it, the home-derived real state
# directory, or outside the approved base. A post-run fingerprint of the real state
# directory must be unchanged. No suite may compose the production program with
# `cwd` set to this repository (an identity marker would be minted in the live git
# common directory), and the aggregate gate runs as
# `mkdir -p tmp/tmpdir && TMPDIR=$PWD/tmp/tmpdir pnpm check`.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - STATE_SCHEMA_VERSION stays `delivery.state.v1`; workspaceId stays `default`;
#     the store artifact names, key prefixes, record kinds, fold rules, validation
#     predicates and modes inside a root are unchanged (NG-1, DEC-2). Isolation
#     comes from the root; `packages/core/src/contracts/state.ts` and
#     `packages/core/src/contracts/registry.ts` are deliberately untouched.
#   - Project identity is the checkout identity marker in the git COMMON
#     directory — never the path and never the remote identity (DEC-3, RSK-3,
#     RSK-4). The key is `<sanitised basename>-<eight lowercase hex of the
#     identifier>`: the basename is lowercased, non-`[a-z0-9]` runs collapse to one
#     `-`, leading/trailing separators are stripped, the result is at most 32
#     characters, a basename that sanitises to nothing falls back to `project`, and
#     `unbound` is refused as a basename. The mint-time basename travels in the
#     marker, so a rename cannot re-key a project, and two same-basename checkouts
#     cannot collide by construction (AC-F1-6, DEC-18).
#   - The identity outcome is a closed table (DEC-17): not a work tree →
#     `unbound` (exit 0, one warning, never a refusal); git metadata present but
#     unusable (an empty `gitdir:` value) → identity refusal; marker absent →
#     mint; marker unreadable, invalid, missing a field, or inconsistent with its
#     key/identifier → identity refusal; marker write failure → state-location
#     failure. `findGitRoot` returning `undefined` is the `unbound` state and is
#     never an identity failure.
#   - The host root is the delivered override-aware rule, implemented ONCE inside
#     `packages/core/src/app/state-scope.ts`: an absolute `<PREFIX>_STATE_DIR` wins,
#     otherwise the injected home plus `brand.stateDirectoryName`; a non-absolute
#     override is `config.value.invalid`; the `_STATE_DIR` suffix, the override read
#     and its precedence appear in exactly one place. No surface composes
#     home-plus-brand inline afterwards (DEC-12, NFR-9, AC-F6-1).
#   - The host index is `<host root>/host-index.json` with schema identity
#     `delivery.projects.host-index.v1`, declared once in
#     `packages/core/src/contracts/projects.ts`; its name is excluded by name from
#     the legacy-detection predicate, together with the host-wide owner-hold marker
#     and the `unbound` scope (A4). The index is derived, revisioned, never
#     authoritative, and always re-derived for `stateLocation`.
#   - Index maintenance: at most once per store-opening invocation inside a
#     checkout; exactly one read and at most one write; ZERO writes and no revision
#     advance when nothing changed; never run on the `projects list` path (A3,
#     DEC-5, AC-F3-4).
#   - Absent is not corrupt: no index means an empty successful list at revision 0
#     (DEC-5, DEC-14); a present but unparsable index is corruption for a read,
#     preserved once as a timestamped sibling before maintenance replaces it.
#   - `daemonReachable` is `{ reachable, reason? }` with the closed reason
#     vocabulary of Appendix C; `handoverState` is `engine` | `shell` |
#     `in-transition` and only ever derived by comparing the folded handover truth
#     with the derived authority document (Appendix B, DEC-7).
#   - The owner hold stays host-wide at the host root (DEC-9); no per-project
#     marker exists, and the hold's marker is never moved by migration.
#   - The `projects list` envelope adds no top-level key: `data` carries exactly
#     `projects` and `hostIndexRevision`, and each entry carries exactly
#     `projectKey`, `root`, `stateLocation`, `daemonReachable`, `handoverState`.
#   - Exactly three new error rows under one new domain kind
#     (`projects.identity-unreadable`, `projects.registry-corrupt`,
#     `projects.state-unavailable`); all three are three-segment codes, so
#     RESERVED_TWO_SEGMENT_CODES is unchanged, and no existing row is added,
#     retired, reworded, or reordered.
#   - No new package, no new external dependency, no new subpath, and no new
#     hardcoded product or binary literal: every name resolves from the injected
#     brand identity, marker/index names live in one contracts constant that tests
#     import rather than spell, and every new document under the scanned `doc/`
#     roots is registered in the forbidden-literals registry in the phase that
#     adds it rather than exempted (NFR-10, AC-F9-4): the migration guide in
#     phase 5, the `feature-projects` page in phase 6.
#   - Boundaries hold in every phase (`.dependency-cruiser.cjs`,
#     `.ai/rules/typescript.md`): `packages/core/src/domain` imports `contracts`
#     only; `packages/core/src/app` is the only tier that may import `domain`,
#     `config` and `contracts` together; filesystem and git I/O live in
#     `packages/adapters`; CLI and MCP each own their composition and neither
#     imports the other; `packages/cli/src/help/prompt-required-commands.ts` stays
#     dependency-free.
#
