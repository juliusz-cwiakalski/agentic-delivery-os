findings:
  - id: F-1
    severity: high
    blocking: true
    confidence: high
    category: security
    location: packages/core/src/app/host-index.ts:103
    message: >-
      The untrusted host index's `projectKey` is not validated as a single path
      segment: `parseHostIndexDocument` rejects only keys containing `/` or
      `\`, so `.` and `..` (and any other non-slash string) are accepted. The
      list path then calls `projectStateRoot(hostRoot, entry.projectKey)`
      (state-scope.ts:138), so a tampered entry with key `..` yields
      `<host root>/projects/..`, which resolves to the host root and escapes the
      project container. I reproduced it with the built binary: a host index
      containing one entry with `projectKey: ".."` is accepted and reported
      with `stateLocation: "<host>/projects/.."`, and the overview constructs a
      store there to derive handover. This contradicts spec §21 ("Project keys
      ... validated as a single path segment before use, so a tampered key
      cannot escape the project container") and F-2 (the reported state location
      can never be redirected).
    suggestion: >-
      Reject any index `projectKey` that is not a lone segment matching the
      declared `PROJECT_KEY_PATTERN` (imported from contracts, not re-spelled)
      in `parseHostIndexDocument` (or at minimum reject `.` and `..` and any
      key failing the pattern), so a tampered document is treated as corrupt
      rather than traversed. Add a cell to `projects-list-contract.test.ts`
      that seeds keys `.` and `..` and asserts `projects.registry-corrupt`
      (or an ignored entry), never a row whose `stateLocation` leaves
      `<host root>/projects/`.
  - id: F-2
    severity: high
    blocking: true
    confidence: high
    category: plan-compliance
    location: doc/changes/2026-11/2026-11-11--GH-288--multi-repo-workstations/chg-GH-288-pm-notes.yaml:20
    message: >-
      Delivery plan phases 1-6 have no completion evidence in pm-notes. The
      `notes:` array holds only intake, DoR and retro entries; it contains no
      "Plan phase N complete (commit <sha>): ... verification ..." entry for any
      of 859e1b60, e581e4e2, ec361895, 3480e4b8, cad45ee3, 9f6a4a64. The plan
      states "phase progress is a pm-notes `notes:` entry, never a plan field",
      and the DoD phase requires per-phase pm-notes evidence; GH-280 (a sibling
      change one day earlier) records exactly this shape. This is gap type
      OPEN_PHASES / EVIDENCE_MISSING for all six phases.
    suggestion: >-
      @pm appends one `notes:` entry per delivery plan phase naming the phase
      id, its commit hash, and the owning TCs green at that boundary (the test
      plan §10 already carries the per-TC results). Do not edit source, spec,
      plan or test plan to close this.
  - id: F-3
    severity: medium
    blocking: false
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:1844
    message: >-
      `readProjects` reports every entry in the host index and never checks
      whether the recorded checkout `root` still exists, so `projects list`
      emits a row for a project whose checkout was moved or deleted. Spec F-3
      says "a project whose root has vanished is not invented and not reported,
      and is removed by the next maintenance run", and §8.1 Flow 3 repeats it.
      The deviation is entrenched by design in the delivered migration guide
      (doc/guides/migrating-to-per-repository-state.md:126) and by the
      200-project performance test, which seeds 200 non-existent roots and
      expects 200 rows. I confirmed a row is reported for a non-existent `root`.
    suggestion: >-
      Either filter rows whose `entry.root` is absent (and emit the declared
      stale-entry warning) in `readProjects`, or record a spec v1.4 amendment
      that the delivered behaviour is "report a stale entry until the next
      maintenance prunes it" and update §8.1 Flow 3 plus the guide. Do not leave
      F-3 prose and the delivered guide contradicting each other.
  - id: F-4
    severity: medium
    blocking: false
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:1737
    message: >-
      The `projects list` path is not literally write-free, so F-3's "writes
      nothing outside the process" and AC-F3-4's intent are under-enforced in
      two places. (a) `readProjectHandover` constructs a full state store per
      project; `createStateStore` runs its open check at construction
      (packages/core/src/state/index.ts:361), which deletes leftover `*.tmp`
      files under `documents.<ws>/` and `<index>.tmp` - a filesystem write on a
      read-only command. (b) Scope resolution mints `.git/project-identity.json`
      on a fresh checkout before the list runs; I confirmed the built binary
      writes a 0600 marker on `projects list` in a marker-less checkout. The
      AC-F3-4/TC-PROJ-041 snapshot seeds clean stores and never exercises either
      case.
    suggestion: >-
      Derive the handover evidence without constructing the store (or gate the
      temp cleanup to write paths), and either skip marker minting for the
      read-only verb or state explicitly that identity minting is permitted.
      Extend the write-nothing suite with a project carrying a stale `.tmp` and
      with a fresh-checkout cell that asserts the marker is or is not minted.
  - id: F-5
    severity: medium
    blocking: false
    confidence: high
    category: spec-compliance
    location: doc/planning/oss-tooling/milestones/m1/commands/doctor.md:83
    message: >-
      AC-F9-2 and DEC-13 require the M1 milestone snapshot pages to stay
      unmodified ("the M1 snapshot is a dated record that stays as written"),
      but the doc-sync commit f5fa0813 rewrites the owner-hold marker-path
      paragraph in three M1 command pages
      (milestones/m1/commands/doctor.md, queue.md, status.md) to the new
      `<host root>/owner-hold` wording. The edits are arguably necessary for
      current truth because the store now honours `<PREFIX>_STATE_DIR`, but they
      are outside §16.1's declared documentation-impact set and falsify AC-F9-2's
      review-verified half.
    suggestion: >-
      Record the M1-page reconciliation as an explicit spec refinement (spec
      §16.1 + AC-F9-2 wording change to "M1 snapshot pages unmodified except the
      owner-hold path statement reconciled for the now-honoured override"), or
      revert those three edits and accept the stale M1 wording. The review
      evidence must not claim the half held when the diff shows otherwise.
  - id: F-6
    severity: medium
    blocking: false
    confidence: medium
    category: spec-compliance
    location: scripts/lib/dispatch-authority.sh:58
    message: >-
      The shell fallback honours `ADOS_DISPATCH_STATE_ROOT` for its host root,
      while the typed store and every other surface now honour the
      brand-derived `<PREFIX>_STATE_DIR` (state-scope.ts:56). On a host that sets
      only `<PREFIX>_STATE_DIR`, the typed store relocates but the fallback keeps
      its old root, finds no project authority document and stays `dual-run`.
      G-6/§7.1 claim every surface honours the delivered override, and the
      migration guide's override section never mentions
      `ADOS_DISPATCH_STATE_ROOT`. AC-F6-5's literal wording ("precedence
      unchanged") is satisfied, but the cross-surface agreement is not.
    suggestion: >-
      Have `_dispatch_authority_host_root` also prefer the brand-derived
      `ADOS_STATE_DIR` (the shipped fallback is already brand-specific), or
      document in the migration note that a host setting `<PREFIX>_STATE_DIR`
      must also set `ADOS_DISPATCH_STATE_ROOT` for the fallback, and add a bash
      cell that sets only the typed override.
  - id: F-7
    severity: medium
    blocking: false
    confidence: high
    category: testing
    location: tests/behaviour/projects-performance.test.ts:191
    message: >-
      TC-PROJ-037 measures the maintenance cost by calling `maintainHostIndex`
      with `probe: () => ({ state: "uncertain" })`, so the <=10 ms p95 excludes
      the production per-entry probe (`existsSync` + `readCheckoutIdentity` +
      marker read) that the real maintenance step runs for every index entry;
      the 200-project list latency is measured over empty seeded roots. The real
      path is O(n) with cheap stats, but NFR-4's maintenance threshold is not
      proven for the production probe and the test can pass while the real cost
      regresses.
    suggestion: >-
      Measure `maintainHostIndex` with the real `probeRecordedRoot` (or a
      representative bounded probe) over 200 entries and record the p95, or
      explicitly scope the NFR to the pure fold and say so in the spec.
  - id: F-8
    severity: low
    blocking: false
    confidence: high
    category: testing
    location: tests/structure/projects-state-scope-policy.test.ts:28
    message: >-
      The structural single-policy assertion's `STATE_CONSUMERS` allowlist has
      four entries (production, mcp serve, edge, daemon-compose), not the
      "seven-consumer allowlist plus the shell fallback" that NFR-9 and the plan
