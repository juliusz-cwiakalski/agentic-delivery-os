    suggestion: >-
      Either add the declared seven surfaces to the structural assertion, or
      correct NFR-9/plan wording to "one policy module plus the four files that
      consume it, with a whole-tree scan for re-derived paths".
  - id: F-9
    severity: low
    blocking: false
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:1855
    message: >-
      `readProjects` passes `readable: stat !== undefined` to
      `classifyProjectStateLocation`, so the classification's "unreadable"
      branch can never fire from readability; a present-but-unreadable directory
      is classified "ready" and only later fails via the store's permission
      check. The observable outcome is still `projects.state-unavailable`, but
      the parameter is misleading dead logic and the intended DEC-8 cell is
      proven only indirectly.
    suggestion: >-
      Pass a real readability probe (e.g. an access/list check), or drop the
      `readable` parameter and classify on exists/non-directory only with a
      comment that the store open enforces readability.
  - id: F-10
    severity: low
    blocking: false
    confidence: high
    category: spec-compliance
    location: doc/changes/2026-11/2026-11-11--GH-288--multi-repo-workstations/chg-GH-288-spec.md:340
    message: >-
      NFR-4 and §4.1 say index maintenance never runs on "`projects list` or any
      other read-only verb", but the delivered and tested rule runs maintenance
      on every non-`projects` command, including the read-only reads `status`
