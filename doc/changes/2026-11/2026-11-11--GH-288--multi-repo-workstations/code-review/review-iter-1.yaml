      `queue list`). The spec text is self-contradictory with its own
      "store-opening invocation" definition; the implementation matches the
      plan's intended reading.
    suggestion: >-
      Amend NFR-4/§4.1 to "never on `projects list` (the only verb that does not
      open a store)" or enumerate which store-opening verbs maintain.
  - id: F-11
    severity: low
    blocking: false
    confidence: high
    category: plan-compliance
    location: .changeset/gh-288-multi-repo-workstations-minor.md:1
    message: >-
      Declared plan-vs-delivery deviations, judged individually safe: (i) the
      release changeset landed in the phase-3 commit ec361895, not phase 6; the
