  - id: F-12
    severity: low
    blocking: false
    confidence: high
    category: robustness
    location: packages/adapters/src/file/host-index-store.ts:103
    message: >-
      `preserveCorruptHostIndex` calls `mkdirSync(dirname(path), { recursive:
      true })` outside its try/catch, so it can throw and break the seam's
      "never throws" posture. It is only reachable when the host root exists
      (an index file was read), so the practical exposure is small, but the
      contract is stated more strongly than the code.
    suggestion: >-
      Move the `mkdirSync` inside the try block (or guard with
      `existsSync`/`statSync().isDirectory()`) and return `false` on failure, as
      `replaceHostIndexFile` already does.
