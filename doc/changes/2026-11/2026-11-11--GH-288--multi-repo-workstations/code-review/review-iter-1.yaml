summary: |
  First local review of the 119-file / ~14.9k-insertion GH-288 change against
  spec v1.3 (38 ACs), test plan v4 (42 TCs, P1-P8) and plan revision 2.0.
  All 38 ACs trace to delivered code with an owning suite or review-verified
  evidence; the two ticket acceptance criteria are demonstrably met (two
  same-host checkouts working GH-241 hold disjoint phase documents and queue
  records and no read surface observes the other; `projects list` enumerates
  both registered checkouts from a derived host index with no hand-written
  registry). Every quality gate I re-ran is green: pnpm build, pnpm typecheck,
  pnpm check:boundaries (depcruise + ambient + workspace-entrypoints +
  secret-read), pnpm check:help, reference-page parity, error-table sync,
  privacy-release, doc-distribution, forbidden-literals, privacy-literals,
  prompt-conformance, exports-parity, subpaths, plus the projects suites (68
  pass), the affected legacy suites (102 pass) and the bash fallback
  (7/7). The design is strong and the tests are non-tautological: isolation is
  proven by record content (phase count 2 vs 1, queue priority 1 vs 5), the
  handover matrix is seeded through the delivered ledger APIs, the daemon probe
  counts real connections and zero frames, migration compares per-file digests
  and modes, and the test-isolation guard has live negative controls.

  The change is FAIL because of one code defect that contradicts the spec's own
  security claim, plus a delivery-record gap: (1) the host index's `projectKey`
  is not validated as a single path segment, and a tampered index entry with
  key `..` is accepted and derives `stateLocation` `<host root>/projects/..`,
  escaping the project container (spec §21, F-2) - confirmed by running the
  built binary; (2) no per-plan-phase `pm-notes` completion evidence exists for
  delivery plan phases 1-6. Advisories record the remaining spec-fidelity and
  evidence gaps (vanished-root rows, the list path not being literally
  write-free, three M1 snapshot pages edited against AC-F9-2, the bash override
  variable divergence, the performance probe not exercised, a narrower
  structural allowlist than claimed, NFR-4 wording, and process deviations).
spec_compliance: FAIL
