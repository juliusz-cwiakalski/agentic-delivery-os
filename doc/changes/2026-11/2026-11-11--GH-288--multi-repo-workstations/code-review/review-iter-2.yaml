    severity: info
    blocking: false
    confidence: high
    category: testing
    location: "chg-GH-288-spec.md:357 (NFR-4); tests/behaviour/projects-performance.test.ts:195"
    message: >-
      NFR-4's ceiling is now honestly scoped to "one index read, the pure fold,
