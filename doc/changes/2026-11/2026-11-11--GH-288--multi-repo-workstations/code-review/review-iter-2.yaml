findings:
  - id: F-1
    severity: high
    blocking: true
    confidence: high
    category: spec-compliance
    location: "chg-GH-288-spec.md:286 (§8.1),:682 (Appendix D); chg-GH-288-test-plan.md:91,227,1799; doc/spec/features/feature-projects.md:29,131-136; doc/planning/oss-tooling/milestones/m2/commands/projects.md:99-101"
    message: >-
      The remediation narrowed AC-F3-4 and F-3 to "no index write, no revision
      change, no prune, no corrupt-file replacement, no project-root creation,
      and no write to any store artifact's content, except two permitted side
      effects", but the narrowing reached only F-3, AC-F3-4, the migration guide
      and the TC-PROJ-041/042 result rows. Six other statements still assert an
      absolute write-free posture and now contradict the criterion they cite:
      (a) spec §8.1, "Performs no index maintenance, creates no project state
      root, performs no migration, and writes nothing"; (b) the §13 traceability
      row "`projects list` writes nothing | AC-F3-4"; (c) the test plan's AC-F3-4
      mapping row, which still reads "identical ... no state mutation" and so no
      longer mirrors the spec's AC text (an AC/TC traceability break); (d) the
      TC-PROJ-041 title, "`projects list` writes nothing"; (e) the delivered
      system spec, `doc/spec/features/feature-projects.md:29` ("...and writes
      nothing") and its Read-only bullet ("no write under the host root. Host-root
      and `projects/` bytes, modes, and mtimes are unchanged across a listing");
      and (f) the M2 command contract page, "writes nothing under the host root".
      All six are false as delivered for at least one of the two declared side
      effects: scope resolution mints the invoking checkout's identity marker
      when it is absent (a byte write), and opening a project store to read
      handover evidence removes a leftover `*.tmp` sibling under
      `<host root>/projects/<project key>/documents.<ws>/` (a removal under the
      host root, which is why F-3 calls it a write). Iteration 1's F-4 asked for
      exactly one of two outcomes; the team chose "state explicitly that the side
      effects are permitted", so the explicit statement must be the only claim
      left standing.
    suggestion: >-
      Propagate the narrowed claim in one pass, with no code change: qualify the
      §8.1 row and the traceability row ("writes no index or store content; F-3
      names the two permitted side effects"), replace the test plan's AC-F3-4
      mapping row with the spec's sentence and retitle TC-PROJ-041, qualify
      feature-projects.md line 29 and its Read-only bullet (the marker mint and
      the temp-sibling removal, with bytes/modes/mtimes unchanged for every other
      file), and qualify the M2 page the same way. Add the review-fix revision row
      to spec §25 and test plan §9 while touching them (see F-2).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    blocking: false
    confidence: high
    category: documentation
    location: "chg-GH-288-spec.md:707-714 (§25); chg-GH-288-test-plan.md:2148-2155 (§9); chg-GH-288-test-plan.md:2173 (§10 aggregate row)"
    message: >-
      The review-fix revision is not recorded in either document history. Spec
      §25 stops at 1.3 ("No AC, DEC, requirement, or behaviour changed"), yet
      887c00d7 changed AC-F3-4, AC-F9-2, DEC-13, NFR-4 and NFR-9 and added the
      §16.1 exception row - a row the document's own convention requires for far
      smaller edits. Test plan §9 stops at revision 4 while §10's expected results
      were rewritten and a remediation paragraph added. §10's aggregate gate row
      also still cites the pre-remediation tree (7200 pass / 895 files); the
      current tree is green but at 7206 pass. The missing rows are what let the
      stale "writes nothing" claims survive: a reader of the history cannot see
      that the criterion changed.
    suggestion: >-
      Add one §25 row (spec) and one §9 row (test plan) for the review-fix
      revision naming the narrowed AC-F3-4/F-3, the DEC-13/AC-F9-2 M1 exception,
      the NFR-4/NFR-9/F-6 reconcilations and the new cells, and refresh §10's
      aggregate row after the review-fix tree is re-gated.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    blocking: false
    confidence: high
    category: testing
    location: "scripts/.tests/test-dispatch-bash-fallback.sh:127,226-238"
    message: >-
      TC-BASH-007 ("the environment override keeps precedence over the home
      default") no longer tests precedence. The isolation change at line 127
      forces `HOME=${_test_tmpdir}/home` (an uncreated directory) on every cell,
      so the `HOME="${home_root}"` that the cell sets at line 232 never reaches
      the fallback; and the seed at line 230 puts the authoritative document at
      `<home_root>/projects/<key>/documents.workspace-a/` while
      `_dispatch_authority_host_root` (scripts/lib/dispatch-authority.sh:66)
      resolves the home default as `${HOME}/.delivery-os`, one level lower. I
      reproduced both halves against the delivered scripts: a flat seed yields no
      pointer, the same document under `<HOME>/.delivery-os/...` yields the
      pointer, and the cell still passes either way, so it cannot detect a
      reversed precedence. The product behaviour is correct (override wins over a
      correctly seeded home, verified directly); the defect is the evidence, and
      the depth half pre-dates this remediation.
    suggestion: >-
      Seed the home store at `<home_root>/.delivery-os/projects/<key>/documents.<ws>/`
      and give `_run_cell` an explicit home parameter (default
      `${_test_tmpdir}/home`, overridden by the precedence cell) instead of
      clobbering HOME, so the cell fails under a reversed precedence. Add a
      control cell that asserts the pointer appears with the home default alone.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: low
    blocking: false
    confidence: high
    category: plan-compliance
