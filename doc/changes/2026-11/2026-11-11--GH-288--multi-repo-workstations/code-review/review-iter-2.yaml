    published_at: null
  - id: F-5
    severity: info
    blocking: false
    confidence: high
    category: security
    location: "packages/cli/src/production.ts:1847"
    message: >-
      The vanished-root filter makes the list path stat an index-supplied
      absolute `entry.root` before anything is derived. This is a read-only
      existence check whose result only decides whether a row is reported; the
      value is never composed into a state path, and maintenance already probes
      recorded roots the same way, so no privilege boundary is crossed. Recorded
      so §21's "no untrusted input at the surface" claim is understood as
      covering this one added read.
    suggestion: >-
      No action required. If §21 is next revised, say that recorded roots are
      stat-only inputs and that no state path is ever composed from them.
    suppressed: false
    published_url: null
    published_at: null
