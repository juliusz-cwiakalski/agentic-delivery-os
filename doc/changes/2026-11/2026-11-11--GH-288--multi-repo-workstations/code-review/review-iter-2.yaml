summary: >-
  Second local review of GH-288 after remediation commit 887c00d7 (plus
  29f7c9cf). Both iteration-1 blocking findings are closed and verified
  independently, not taken on trust. F-1 is total: `parseHostIndexDocument`
  re-validates every index key against the declared `PROJECT_KEY_PATTERN`
  (imported from contracts, not re-spelled), the 32-character mint bound, the
  `sanitizeProjectBasename` fixpoint and, through that fixpoint, the reserved
  `unbound` basename; both index consumers (`production.ts:488` maintenance and
  `production.ts:1833` list) parse through it, the handover read and
  `projectStateRoot` only ever receive the derived path, and a legitimately
  minted key still parses - including a `unbound-alpha-<hex>` checkout, which
  registers and is reported (projects-identity TC-PROJ-005/040), so the frozen
  key rule is intact. F-2 is closed: `chg-GH-288-pm-notes.yaml` now carries one
  evidence entry per delivery plan phase 1-6 (859e1b60, e581e4e2, ec361895,
  3480e4b8, cad45ee3, 9f6a4a64), plus the doc-sync entry (f5fa0813) and the
  review-iteration-1 disposition; every named SHA matches git history, each
  entry names the suites and gate results, and the delivery/doc-sync phase
  timestamps bracket the commits they describe. Advisories F-3..F-12 are closed
  or reduced to documented residuals (vanished-root rows filtered and the guide
  reconciled, the readability probe made real, `mkdir` contained, NFR-4/NFR-9
  and §4.1 wording corrected, the M1 snapshot exception declared in DEC-13,
  AC-F9-2 and §16.1 with exactly the three owner-hold paragraphs and no other
  M1 page touched, the shell-side override declared as its own contract with two
  new bash cells). Every gate I re-ran is green: pnpm typecheck, pnpm
  check:boundaries (383 modules, 0 violations), pnpm check:help, the 13 projects
  behaviour suites (50 pass), the structure and checks suites (122 pass,
  including owner-hold-doc, error-table-sync and reference-page-parity), the
  test-isolation guard (8 pass), the bash authority suite (7 pass), the fallback
  matrix (9/9) and TMPDIR=$PWD/tmp/tmpdir pnpm check (exit 0, 7206 pass / 4
  skip / 0 fail across 895 files, 474 s; the known privacy-ci-wiring flake did
  not recur).

  The change still FAILs on one artifact-consistency defect that the F-4
  narrowing introduced, not on code. AC-F3-4 and F-3 now permit exactly two
  side effects, but six statements outside that narrowing still assert an
  absolute write-free posture: spec §8.1 and the §13 traceability row ("`projects
  list` writes nothing"), the test plan's AC-F3-4 mapping row and its TC-PROJ-041
  title (still "no state mutation"), `doc/spec/features/feature-projects.md`
  ("writes nothing" and "host-root and `projects/` bytes, modes, and mtimes are
  unchanged across a listing") and the M2 `projects list` contract page ("writes
  nothing under the host root", although the store open removes a leftover
  `*.tmp` under `<host root>/projects/<key>/`). The result is a spec that
  contradicts itself, a test plan whose AC text no longer mirrors the spec, and a
  delivered system spec plus command page that overclaim a read-only guarantee
  the code does not keep. Advisories record the missing spec/test-plan
  revision-log rows for this review-fix revision, a vacuous TC-BASH-007, and one
  unrecorded out-of-scope test file.
