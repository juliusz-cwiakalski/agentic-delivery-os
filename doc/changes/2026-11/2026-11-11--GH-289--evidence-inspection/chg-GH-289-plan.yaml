#
# TDR-0023 RESIDUAL RISKS AS OWNED WORK (phase 3; do not let either drift):
#   - One shared exact count computation consumed by BOTH the resolve result and the
#     summary, with no list-length derivation anywhere. The computation lives in
#     `packages/core/src/domain/dispatch-gate.ts` (the module that already owns the
#     divergence block and the gate that reads it) as one exported pure function over
#     (records, repository) returning `{reported, resolved, unresolved, unresolvedIds,
#     idsTruncated}`; `foldEvidenceWindow` consumes it, `resolveDispatchDivergenceEvidence`
#     consumes it, and the retired `summarizeDispatchDivergences` list-length
#     derivation is DELETED from `packages/core/src/app/dispatch-ledger.ts` with its
#     `DispatchDivergenceSummary` type. TC-ATTEMPT-038 pins the single derivation
#     structurally and TC-ATTEMPT-022 pins the exact numbers behaviourally; P2 is
#     their negative control.
#   - What actually moves, stated as the delivered code and spec v1.4 §8.5 / RSK-6 /
#     DEC-15 state it — the delivered summary's `unresolved` is ALREADY exact and
#     store-wide, so nothing moves up past 20 and no delivered count was a capped-list
#     artefact: `foldEvidenceWindow` keeps every open identifier with no cap,
#     `unresolved` is that list's length, `resolved` is the fold minus it, and
#     `packages/cli/src/output/dispatch-text.ts` prints every identifier. The change
#     therefore does four things, and each is asserted or declared: (a) it computes the
#     block over the reported repository, so on a migrated root the count and
#     `reported` move DOWN by the other repository's open divergences (TC-ATTEMPT-022
#     asserts 33/3/30 delivered → 28/3/25 scoped, with 25 open for the reported
#     repository and 5 open for another that must not be counted, and 28/3/25 unchanged
#     on an unmigrated root); (b) it puts that block on the resolve result, which
#     reported no counts before; (c) it narrows the summary's `unresolvedIds` and the
#     human `unresolved_divergences=` line to the documented at-most-20 list with
#     `idsTruncated`, aligning the field with the bound
#     `doc/spec/features/feature-dispatch-engine.md` already states; and (d) it retires
#     the uncalled `summarizeDispatchDivergences`, the only place a list-length
#     derivation ever existed and the only place any surface could have reported 20 for
#     25 open divergences. Phase 5's reconciliation notes state these movements for
#     `@doc-syncer` and for the M2 page and claim no upward movement.
#   - Disclosure-only cross-repository resolution stays disclosed, not prevented:
#     the resolve result names the divergence's own repository and scopes its counts
#     to it (DEC-9, TDR-0023 D-7). No guard is added (NG-7, deferred with OQ-1).
#   - The projection is a fixed allowlist that must move with the record: the
#     sixteen-field exact-set assertion is the intended friction (TC-ATTEMPT-006).
#
# TEST ISOLATION IS A GATE CONDITION IN EVERY PHASE THAT BUILDS A FIXTURE (NFR-11,
# TC-ATTEMPT-036, TR-4): every suite reaches `mkdtempSync` only through an approved
# helper under `tests/fixtures/projects/state-scope.ts`'s `APPROVED_BASE`
# (`<repo>/tmp/tmpdir`); the host root and the home are always distinct directories
# (neither an ancestor of the other); the brand-derived state override points at the
# per-test host root; the non-checkout cell uses `nonCheckoutDirectory()`, which
# pre-asserts `findGitRoot === undefined`; no suite composes the production program
# with this repository as `cwd`; a post-run fingerprint of the real state directory
# is unchanged. The aggregate gate runs as
# `mkdir -p tmp/tmpdir && TMPDIR=$PWD/tmp/tmpdir pnpm check`.
#
# EVIDENCE DISCIPLINE (spec §17 classes, carried not upgraded):
#   - Suite: the phase gates below. The P1..P4 revert/mutation bundle (§7.4) proves
#     the detection power of behaviour that the pre-change tree already exhibits and
#     is executed and recorded in phase 5 (the review gate before DoD): P1 renames a
#     delivered resolve key and must red TC-ATTEMPT-034; P2 reintroduces a list-length
#     derivation in the shared block (`unresolved: unresolvedIds.length`,
#     `resolved: folded.length - unresolvedIds.length`), which reports 20 for a 25-open
#     repository, and must red TC-ATTEMPT-022 and TC-ATTEMPT-038; P3 drops
#     the logical repository filter and must red TC-ATTEMPT-011 and TC-ATTEMPT-012;
#     P4 clamps an over-limit `--limit` and accepts `07`/`001`/`+7` and must red
#     TC-ATTEMPT-003. Each is applied, run, reverted, and re-run green; none is
#     committed.
#   - Review-verified (never claimed as suite): AC-F8-3 (TC-ATTEMPT-032), AC-F8-4
#     (TC-ATTEMPT-033), the side-effect enumeration half of AC-F4-1, the string-absence
#     half of AC-F4-4 over the M2 page and corpus, the reference-page half of AC-F7-2,
#     the additive-only half of AC-F9-1 (TC-ATTEMPT-034 cell 6, the diff inspection
#     against the merge base — the delivered forms' refusal is cell 7 and is suite
#     evidence at phase 2), and the lockfile/diff half of AC-F9-2.
#   - Not claimed by any phase: cross-platform path/mtime semantics (TR-2), any
#     performance framework beyond the single in-process p95 cell (TC-ATTEMPT-037).
#
# LIFECYCLE PHASE 7 HANDOFF OBLIGATIONS (`system_spec_update`, `@doc-syncer`;
# phase 5 authors the same pages so the handoff is a verification of current truth):
#   - doc/spec/features/feature-dispatch-engine.md: the grammar gains
