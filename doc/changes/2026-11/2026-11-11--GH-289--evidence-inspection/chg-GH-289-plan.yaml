  #
  # Non-goals: the command branch, the flags, the digest and the composition (phase 2);
  # the resolve extension and the count rule (phase 3 — the summary's block is NOT
  # touched here, so no reported number moves without its owning criterion); help,
  # inventory and the parity pin (phase 4); reconciliation and release (phase 5).
  # ---------------------------------------------------------------------------
