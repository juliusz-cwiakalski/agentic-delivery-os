  #   TC-ATTEMPT-010  a ledger above 5,000 considers at most 5,000, declares scope
  #                   `"ledger"` with `bound: 5000` and the omitted count, keeps
  #                   `matched <= 5000`, returns the newest rows, lets the ledger scope
  #                   win over the page scope, and does NOT count a foreign record that
  #                   sits only in the omitted tail
  #   TC-ATTEMPT-037  exactly one `readRecords` per invocation, zero additional reads,
  #                   and p95 within 5 s over the 5,000-record bound (frozen records
