  #      contract inventory red. No new subpath and no
  #      `packages/core/package.json` `exports` change, so
  #      `bun run scripts/checks/workspace-entrypoints.ts`, `tests/structure/subpaths.test.ts`
  #      and `pnpm check:boundaries` stay green.
  #  1.6 Registration: `tests/structure/inventory.json` rows for the two new modules
  #      and `EXECUTABLE_ALLOWANCES` entries for their exported functions and for the
  #      five new constants in `core/src/contracts/dispatch.ts` — no allowance row for
  #      the three reused dispatch budgets, which keep their delivered rows.
  #  1.7 Fixtures (new): tests/fixtures/dispatch/attempt-records.ts — `maximalAttempt()`
  #      (16 x 64-character evidence references, 40-character attempt id),
  #      `ledgerOf(n)` (ascending `startedAt`, shared frozen objects), `openDivergences(n,
  #      repository)`, `resolvedDivergences(n, repository)`, `withHistory(id)` (an open
  #      record after an earlier resolved one, so the fold's latest-per-identifier rule
  #      is exercised) and `longNote(400)`; and tests/fixtures/dispatch/attempts-harness.ts
  #      — an isolated state root, a store wrapper exposing read/append/fence counters
