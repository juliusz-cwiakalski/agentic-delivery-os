  # `bun test tests/structure/subpaths.test.ts tests/structure/content-inventory.test.ts
  # tests/structure/port-contract-inventory.test.ts` (the contract-surface gate this
  # phase can red: nine added exports, both fixture entries),
  # `biome check` and the aggregate gate
  # (`mkdir -p tmp/tmpdir && TMPDIR=$PWD/tmp/tmpdir pnpm check`) are green; and no test
  # writes outside its temporary root. The aggregate runs here because this phase adds
