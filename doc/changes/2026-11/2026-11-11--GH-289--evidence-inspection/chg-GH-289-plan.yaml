# GH-289 delivery plan — machine-readable projection (delivery.plan.v1), revision 1.0
# (2026-11-11). Authored against spec v1.2 and test plan v1.1.
#
# One ticket, one PR against main-tools, five delivery phases. Every phase is an
# independently committable slice that is green at its own boundary: no phase needs
# a later phase to compile, to assert, or to be meaningful. Everything richer than
# the parsed schema is carried in YAML comments so the parsed document stays
# schema-strict: the only parsed keys are schemaVersion, workItemRef, tier,
# defaultLeases, defaultWeightClass and phases (id, title, kind, summary, scope,
# interactions, doneArtifacts, leases, weightClass, leaseClass). This plan declares
# phases and scope only: there is no `tasks` key and no progress log — phase
# progress is a pm-notes `notes:` entry.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:      ./chg-GH-289-spec.md — v1.2, 36 acceptance criteria
#                (AC-F1-1..AC-F9-2), F-1..F-9 with capability detail in §5.1,
#                DM-1..DM-6 in §8.3, §8.5 backward compatibility (the two declared
#                additive points), NFR-1..NFR-11 in §9, RSK-1..RSK-10 in §11,
#                OQ-1..OQ-3 in §14, DEC-1..DEC-16 in §15 and the five graduated
#                rulings in §15.1, §16 component impact and §16.1 documentation
#                impact with the phase-7 handoff facts, §17 evidence classes,
#                §18 delivery order, §19 (no migration), Appendices A (traceability),
#                B (SC-M2-S12-01/02 reconciliation), C (M2 attempts(1) corrections,
#                items 1-6) and D (normative read-side field set).
#   - Test plan: ./chg-GH-289-test-plan.md — v1.1, 39 test cases
#                (TC-ATTEMPT-001..039) covering 36/36 ACs; §3.1 AC→TC coverage and
#                evidence classes, §3.2 interface coverage, §3.3 NFR coverage,
#                §4 test types and layers, §5.2 scenario details, §6 environments
#                and the fixture inventory, §7.1 the TC→file mapping (the exact
#                test paths this plan declares), §7.2 supporting changes, §7.3 phase
#                grouping, §7.4 the P1..P4 revert/mutation bundle, §7.5 gate
#                commands, §8.1 risks TR-1..TR-15, §8.3 the closed findings X-1..X-9
#                and their reconciliation notes to `@doc-syncer`, §9 revision log,
#                §10 execution log (which this change fills).
#   - Decision:  doc/decisions/TDR-0023-dispatch-attempt-read-side-and-local-evidence-resolve.md
#                (Proposed) — D-1..D-7 and C-1..C-8, the eight-step implementation
#                order, the verification criteria, and the residual risks this plan
#                must own: the two-direction count movement, the two-fold-site
#                convergence, the disclosure-only cross-repository posture, and the
#                projection-widening obligation.
#   - Ticket:    GH-289 (M2-S12). Three acceptance clauses, traced in spec Appendix A:
#                the attempt read side carrying token / corroboration triple /
#                divergence refs / timestamps / harness; the machine envelope per
#                repository; the local-only resolve with the mode declared and the
#                unresolved counts left behind; coverage and floor staying on the
#                summary.
#   - M2 pack:   doc/planning/oss-tooling/milestones/m2/{contracts.md (§ attempts.v1),
#                commands/attempts.md, test-scenarios.md (SC-M2-S12-01/02),
#                architecture.md, entrypoint-delta.md, README.md} plus
#                doc/planning/oss-tooling/{backlog.md (M2-S12), status.md,
#                cli-command-registry.md}.
#   - Schema:    doc/spec/features/feature-plan-schema.md,
#                packages/core/src/domain/plan-validate.ts,
#                packages/core/src/contracts/plan.ts,
#                doc/templates/implementation-plan-template.md.
#   - Rules:     AGENTS.md, .ai/rules/typescript.md, .ai/rules/testing-strategy.md,
#                .ai/rules/bash.md, .dependency-cruiser.cjs.
#   - Precedent: doc/changes/2026-11/2026-11-11--GH-288--multi-repo-workstations/
#                chg-GH-288-plan.yaml (structure, phase-boundary discipline,
#                mount-unit atomicity, comment-carried phase data).
#
# PHASE ORDER AND WHY (spec §18, with the test plan's §7.3 grouping):
#   1 contracts + the pure projection/order/page helper + the repository-scoped read
#     use case. Everything after consumes them, and the two independent output
#     bounds (ledger 5,000 and machine 65,536 bytes) are properties of the `data`
#     object this phase produces, so they are assertable here.
#   2 the `attempts` branch, its grammar refusals, the bounded digest, and the
#     composition that opens exactly one store. The surface is the only observable
#     of phase 1 and the only place where repository isolation, read-only posture,
#     refusals, determinism, and additive stability can be asserted end to end.
#   3 the resolve result extension and the one exact divergence-count rule. TDR-0023
#     D-5 and D-7 bind the resolve block and the summary block to one computation,
#     so both surfaces and both count directions move in the same commit as their
#     owning criteria (AC-F5-5, TC-ATTEMPT-022/038).
#   4 the mount unit: family usage line, fifth help entry, coverage-inventory row,
#     parity pin, and the help suites that pin the count. One unit, because the
#     parity gate asserts the see-also target exists AND is registered, so a partial
#     landing leaves a gate red (spec F-8, DEC-14).
#   5 reconciliation, execution evidence, the changeset, and the closing aggregate
#     gate. Nothing here changes product behaviour.
#
# TWO DECLARED DEVIATIONS from test-plan §7.3 (both are facts about where an
# assertion can be green, not scope reductions; the test plan's own rules permit the
# deviation and ask the plan to name it):
#   - TC-ATTEMPT-009, TC-ATTEMPT-010 and TC-ATTEMPT-037 are owned by phase 1, not by
#     the command phase. Each asserts a property of the read use case's `data`
#     (byte budget and page omission, ledger retention and its precedence, the
#     single verified read and its latency), so all three are green at phase 1's
#     boundary over the delivered store port; phase 2 re-runs them through the CLI
#     as an additive cell (the file is declared in both phases) and does not take
#     ownership. AC-F2-4 and AC-F2-5 are therefore owned by phase 1.
#   - TC-ATTEMPT-036 (NFR-11 test isolation) is owned by phase 3, not by phase 2:
#     it scans every new suite for the approved base and a post-run fingerprint, and
#     phase 3 is the LAST phase that creates a new suite. Phase 1 and phase 2 run it
#     over their own files as a supporting gate without transferring ownership.
#
# AC OWNERSHIP (all 36 criteria, exactly one owning phase each; a later phase may
# re-run an assertion, which is additive and never transfers ownership):
#   phase 1  AC-F2-4, AC-F2-5                                  (2)
#   phase 2  AC-F1-1, AC-F1-2, AC-F1-3, AC-F1-4, AC-F1-5, AC-F1-6,
#            AC-F2-1, AC-F2-2, AC-F2-3,
#            AC-F3-1, AC-F3-2, AC-F3-3,
#            AC-F4-1, AC-F4-2, AC-F4-3, AC-F4-4,
#            AC-F6-1, AC-F6-2, AC-F6-3, AC-F6-4,
#            AC-F7-1, AC-F9-1                                 (22)
#   phase 3  AC-F5-1, AC-F5-2, AC-F5-3, AC-F5-4, AC-F5-5, AC-F6-5  (6)
#   phase 4  AC-F7-2, AC-F8-1, AC-F8-2                          (3)
#   phase 5  AC-F8-3, AC-F8-4, AC-F9-2                          (3)
#   (2 + 22 + 6 + 3 + 3 = 36; no AC is unmapped and no AC id is invented.)
#
# TC OWNERSHIP (39/39, each owned exactly once):
#   phase 1  TC-ATTEMPT-009, TC-ATTEMPT-010, TC-ATTEMPT-037       (3)
#   phase 2  TC-ATTEMPT-001, TC-ATTEMPT-002, TC-ATTEMPT-003,
#            TC-ATTEMPT-004, TC-ATTEMPT-005, TC-ATTEMPT-006,
#            TC-ATTEMPT-007, TC-ATTEMPT-008, TC-ATTEMPT-011,
#            TC-ATTEMPT-012, TC-ATTEMPT-013, TC-ATTEMPT-014,
#            TC-ATTEMPT-015, TC-ATTEMPT-016, TC-ATTEMPT-017,
#            TC-ATTEMPT-023, TC-ATTEMPT-024, TC-ATTEMPT-025,
#            TC-ATTEMPT-026, TC-ATTEMPT-028, TC-ATTEMPT-034,
#            TC-ATTEMPT-039                                      (22)
#   phase 3  TC-ATTEMPT-018, TC-ATTEMPT-019, TC-ATTEMPT-020,
#            TC-ATTEMPT-021, TC-ATTEMPT-022, TC-ATTEMPT-027,
#            TC-ATTEMPT-036, TC-ATTEMPT-038                       (8)
#   phase 4  TC-ATTEMPT-029, TC-ATTEMPT-030, TC-ATTEMPT-031       (3)
#   phase 5  TC-ATTEMPT-032, TC-ATTEMPT-033, TC-ATTEMPT-035       (3)
#   (3 + 22 + 8 + 3 + 3 = 39; no TC is unowned and no TC id is invented.)
#
# COMMIT CONVENTION (one commit per plan phase; subjects declared here so the commit
# path and the review agree; every line stays within 100 characters):
#   phase 1  feat(dispatch): read the attempt ledger through one projection and page
#   phase 2  feat(dispatch): mount attempts with a bounded deterministic digest
#   phase 3  feat(dispatch): declare local-evidence resolve and one exact count
#   phase 4  feat(dispatch): advertise attempts and register its reference page
#   phase 5  docs(dispatch): reconcile evidence inspection and close the release
#
# THE MOUNT UNIT IS PHASE 4, NOT PHASE 2, AND BOTH BOUNDARIES ARE GREEN.
# `dispatch attempts` is a subfamily, so the prompt-required set and the root family
# listing do not change (spec F-8, NG-6). No gate asserts that a delivered verb has
# a help entry, and the only pinned count is the four dispatch entries asserted by
# `tests/structure/dispatch-help-inventory.test.ts` plus the parity pin. Phase 2
# therefore cannot move that count, and phase 4 lands, in one commit: the family
# usage line plus `--ref`/`--limit` options and one example in
# `packages/cli/src/help.ts`, the fifth entry whose see-also target is
# `pageIn(M2_REFERENCE_ROOT, "attempts")` (the delivered M2 page-root helper), the
# `referencePages` row in `tests/fixtures/help-guide/coverage.json`, the pin moving
# from four to five and the test title stating five in
# `tests/checks/reference-page-parity.test.ts`, the five-entry list and the new
# entry's option/example cells in `tests/structure/dispatch-help-inventory.test.ts`,
# and `dispatch attempts --help` added to the poisoned-composer set in
# `tests/behaviour/dispatch-help-version.test.ts`. `scripts/checks/help-guide-coverage.ts`
# needs no change: `attempts` is not prompt-required, so the per-command page map is
# untouched and the M1 `dispatch(1)` page stays dispatch's family page (DEC-13).
#
# THE COMMAND-LINE GRAMMAR IS OWNED BY THE COMMAND MODULE, AND THE DELIVERED
# REFUSALS ARE PRESERVED. AC-F1-3 requires a missing `--limit` value to be
# `input.value.rejected` at exit 1, and AC-F1-6 requires an unknown flag and an
# unexpected positional to be `input.value.rejected` as well. The shared parser
# (`packages/cli/src/index.ts` `parseInvocation`) classifies a missing value for a
# `requiresValue` flag, an unknown flag, and a fourth positional as
# `fallback.invocation` (verified by reading the parser and by invoking the built
# entrypoint on 2026-11-11), so the two requirement cannot both be met by adding the
# flags to `requiresValue`. Phase 2 therefore: (a) leaves the delivered
# `requiresValue` entries (`--harness`, `--resume-prompt`, `--repo`, `--note`)
# untouched and adds `acceptsAnyFlag: true`, so no parser-level refusal pre-empts
# the attempts grammar; (b) validates the `attempts` tail from `invocation.argv`
# inside the command module — canonical `[A-Z]+-\d+` ref, canonical decimal
# `[1-9][0-9]*` limit in 1..100 with default 20, unknown flag, unexpected positional
# — all as `input.value.rejected` with a bounded summary, before any runtime call
# and therefore before any store read; and (c) keeps every delivered form's refusal
# identity by classifying an unknown flag on `dispatch <ref>`,
# `dual-run summary|resolve`, and `handover` as `fallback.invocation` in the same
# handler guard, so AC-F9-1 and NG-6 hold (TC-ATTEMPT-034 adds the cell that pins
# it). The two flags are still declared value-taking flags in the published grammar
# (help entry, synopsis, reference page); `CommandDefinition.requiresValue` is a
# parser hint, not the published grammar.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - No new error identity. `ERROR_TABLE` stays at 124 identities with exactly four
#     `dispatch` rows, no `attempts.*` string exists anywhere, and no token,
#     projection class, or exit literal is added (AC-F4-4, DM-6, DEC-1, TDR-0023
#     C-1). Malformed request, unresolvable active reference and unresolvable
#     identity are `input.value.rejected` under `kind: "input"` at exit 1; an
#     unreadable store keeps its own `state.*` code under `kind: "state"` at exit 2.
#   - `attempts.v1` `data` carries exactly `repository`, `ref`, `refSource`
#     (`"flag"` | `"active-change"`), `limit`, `matched`, `hasMore`, `attempts[]`,
#     `excluded.foreignRepository`, and `truncation` only when a bound binds; no
#     top-level envelope key is added and `command` stays `"dispatch"` (DEC-7,
#     Appendix D).
#   - Each row projects exactly the sixteen declared fields; `divergenceRef` is one
#     identifier or explicit `null` (never a list); `endedAt` maps the stored finish
#     timestamp one-to-one; `comparison` is `{class, token, outcome}` with `token`
#     `null` exactly when the class is not-applicable; `resumeMode` is the recorded
#     mode or `null`; `evidenceRefs` is at most sixteen identifiers; no `schema`,
#     `handoverState`, or `prefillCostAcknowledged` key is projected (DEC-4, DEC-6,
#     TDR-0023 C-3).
#   - Read bounds: ledger read 5,000 records; page 20 by default, 1 minimum, 100
#     maximum; machine `data` 65,536 UTF-8 bytes; human digest 40 lines and 8,192
#     bytes with at most 37 rows beside a truncation line; 16 evidence references
#     per record; 20 unresolved identifiers per block; resolution note 240
#     characters (DM-4). Every bound that binds is declared; `truncation.bound` is
#     5000 for `ledger` and 65536 for `page`, and the ledger scope wins (DM-5).
#   - `unresolved` is the exact folded open count for the reported repository on
#     BOTH the resolve result and `dispatch dual-run summary`; `unresolvedIds` is
#     bounded to 20 with `idsTruncated` true exactly when identifiers were omitted;
#     no surface derives a count from an identifier list's length (DEC-15, TDR-0023
#     C-5, D-5). The eligibility predicate tests for zero and no verdict moves.
#   - Repository scope is enforced twice: the project state root from GH-288 plus a
#     logical filter on each record's own `repository`; excluded records are counted
#     (`excluded.foreignRepository`, independent of `--ref`, computed over the
#     retained ledger window) and never named; identity resolves with persistence
#     disabled, so the dispatch repository binding marker is never created, repaired,
#     or re-persisted; an invocation outside a checkout refuses at exit 1 (DEC-8,
#     TDR-0023 C-6).
#   - The READ performs exactly one verified store read: the repository port supplied
#     by the composition passes NO scheduler key (`resolveProductionRepository(
#     undefined, { persist: false })`), because `schedulerKeyForRef` would read the
#     queue ledger and break NFR-2's exactly-one-read bound. A checkout whose
#     identity resolves from neither the marker nor the normalized remote refuses
#     rather than reading the queue. This is a composition decision, recorded here
#     so the identity chain's inputs are reviewable.
#   - Read-only with respect to evidence: 0 attempt/divergence/handover/authority
#     appends, 0 fence acquisitions, store bytes/modes/mtimes unchanged; the only
#     permitted effects are the host-index maintenance write (zero when unchanged)
#     and the create-once project checkout identity marker (NFR-3, AC-F4-1).
#   - No new state record kind, schema version, key prefix, fold rule, validation
#     predicate, configuration key, workspace package, subpath, external dependency,
#     product literal, or binary literal (NG-1, NFR-9, AC-F9-2).
#   - Boundaries hold in every phase (`.dependency-cruiser.cjs`,
#     `.ai/rules/typescript.md`): `packages/core/src/domain` imports `contracts`
#     only; `app` may import `domain`, `config` and `contracts`; filesystem and git
#     I/O stay in `packages/adapters`; the CLI imports core only from `.` and the
#     declared subpaths; `packages/cli/src/help/prompt-required-commands.ts` is
#     dependency-free and unchanged.
#   - The M1 page `doc/planning/oss-tooling/milestones/m1/commands/dispatch.md` is
#     BYTE-UNCHANGED (DEC-13). No phase declares it, no phase edits it.
#   - Every new module is registered in `tests/structure/inventory.json` and its
#     executable exports in `tests/structure/content-inventory.test.ts` IN THE PHASE
#     THAT CREATES THEM, because those suites compare the committed inventory with
#     the actual file set and the actual export set.
#
# TDR-0023 RESIDUAL RISKS AS OWNED WORK (phase 3; do not let either drift):
#   - One shared exact count computation consumed by BOTH the resolve result and the
#     summary, with no list-length derivation anywhere. The computation lives in
#     `packages/core/src/domain/dispatch-gate.ts` (the module that already owns the
#     divergence block and the gate that reads it) as one exported pure function over
#     (records, repository) returning `{reported, resolved, unresolved, unresolvedIds,
#     idsTruncated}`; `foldEvidenceWindow` consumes it, `resolveDispatchDivergenceEvidence`
#     consumes it, and the retired `summarizeDispatchDivergences` list-length
#     derivation is DELETED from `packages/core/src/app/dispatch-ledger.ts` with its
#     `DispatchDivergenceSummary` type. TC-ATTEMPT-038 pins the single derivation
#     structurally and TC-ATTEMPT-022 pins the exact numbers behaviourally; P2 is
#     their negative control.
#   - The count moves in BOTH directions on a migrated root, and only one direction is
#     named in the spec's risk table: UP when more than 20 divergences are open (the
#     delivered rule reported the capped list length) and DOWN when foreign open
#     divergences leave the repository-scoped count. TC-ATTEMPT-022 asserts both
#     directions (25 open for the reported repository, plus 5 open for another
#     repository that must not be counted), and phase 5's reconciliation notes state
#     both movements for `@doc-syncer` and for the M2 page.
#   - Disclosure-only cross-repository resolution stays disclosed, not prevented:
#     the resolve result names the divergence's own repository and scopes its counts
#     to it (DEC-9, TDR-0023 D-7). No guard is added (NG-7, deferred with OQ-1).
#   - The projection is a fixed allowlist that must move with the record: the
#     sixteen-field exact-set assertion is the intended friction (TC-ATTEMPT-006).
#
# TEST ISOLATION IS A GATE CONDITION IN EVERY PHASE THAT BUILDS A FIXTURE (NFR-11,
# TC-ATTEMPT-036, TR-4): every suite reaches `mkdtempSync` only through an approved
# helper under `tests/fixtures/projects/state-scope.ts`'s `APPROVED_BASE`
# (`<repo>/tmp/tmpdir`); the host root and the home are always distinct directories
# (neither an ancestor of the other); the brand-derived state override points at the
# per-test host root; the non-checkout cell uses `nonCheckoutDirectory()`, which
# pre-asserts `findGitRoot === undefined`; no suite composes the production program
# with this repository as `cwd`; a post-run fingerprint of the real state directory
# is unchanged. The aggregate gate runs as
# `mkdir -p tmp/tmpdir && TMPDIR=$PWD/tmp/tmpdir pnpm check`.
#
# EVIDENCE DISCIPLINE (spec §17 classes, carried not upgraded):
#   - Suite: the phase gates below. The P1..P4 revert/mutation bundle (§7.4) proves
#     the detection power of behaviour that the pre-change tree already exhibits and
#     is executed and recorded in phase 5 (the review gate before DoD): P1 renames a
#     delivered resolve key and must red TC-ATTEMPT-034; P2 restores the delivered
#     list-length derivations and must red TC-ATTEMPT-022 and TC-ATTEMPT-038; P3 drops
#     the logical repository filter and must red TC-ATTEMPT-011 and TC-ATTEMPT-012;
#     P4 clamps an over-limit `--limit` and accepts `07`/`001`/`+7` and must red
#     TC-ATTEMPT-003. Each is applied, run, reverted, and re-run green; none is
#     committed.
#   - Review-verified (never claimed as suite): AC-F8-3 (TC-ATTEMPT-032), AC-F8-4
#     (TC-ATTEMPT-033), the side-effect enumeration half of AC-F4-1, the string-absence
#     half of AC-F4-4 over the M2 page and corpus, the reference-page half of AC-F7-2,
#     the additive-only half of AC-F9-1, and the lockfile/diff half of AC-F9-2.
#   - Not claimed by any phase: cross-platform path/mtime semantics (TR-2), any
#     performance framework beyond the single in-process p95 cell (TC-ATTEMPT-037).
#
# LIFECYCLE PHASE 7 HANDOFF OBLIGATIONS (`system_spec_update`, `@doc-syncer`;
# phase 5 authors the same pages so the handoff is a verification of current truth):
#   - doc/spec/features/feature-dispatch-engine.md: the grammar gains
#     `dispatch attempts [--ref <ref>] [--limit <n>]`; a read-side section states the
#     envelope, the sixteen-field projection, the total order, the three bounds and
#     their declared omissions, the ref resolution, the empty-history rule, and the
#     count-only foreign disclosure; the resolve paragraph gains the unconditional
#     `local-evidence` mode, the subject repository, and the shared counts; the error
#     paragraph states that the read side adds no row and maps its refusals; the
#     bounds table gains the page bounds, the human row budget, and the 65,536-byte
#     data budget.
#   - doc/spec/features/feature-result-contract.md: no row changes; one clarifying
#     sentence where the dispatch rows are consumed — the attempts read and the
#     resolve extension reuse the `input` and `state` identities and add no entry.
#   - doc/spec/features/feature-cli-entrypoint.md: `dispatch attempts` joins the
#     enumerated dispatch subforms; the prompt-required set and the seventeen-family
#     root listing are unchanged.
#   - doc/spec/features/feature-state-layer.md: the store-opening read paragraph names
#     the attempts read as a store opener that writes no delivery evidence and
#     inherits only the host-index maintenance write and the create-once project
#     checkout identity marker.
#   - doc/spec/features/feature-projects.md: one sentence — the dispatch attempts read
#     is read-only with respect to evidence and inherits the store-opening effects;
#     the dispatch repository binding marker is never created or repaired by a read.
#   - doc/quality/test-specs/test-spec-dispatch-engine.md: coverage rows for the
#     attempts read and the resolve result; `links.related_changes` gains `GH-289`;
#     `last_updated` advances.
#   - doc/planning/oss-tooling/milestones/m2/commands/attempts.md: the delivered
#     reference page (Appendix C items 1-6): `--help` and `--version`, the resolved
#     exit table with no `attempts.*` rows and empty history at exit 0,
#     `command: "dispatch"`, `divergenceRef` singular-or-`null`, the declared digest
#     with its truncation line and coverage/floor pointer, the stated bounds, and the
#     proposed status header retained (planned-until-milestone-exit).
#   - doc/planning/oss-tooling/milestones/m2/contracts.md: `attempts.v1` refined at
#     story delivery — singular divergence reference, unconditional `local-evidence`
#     mode, repository-scoped counts, and the read bounds.
#   - doc/planning/oss-tooling/{backlog.md (M2-S12 progress marker), status.md (M2
#     delivery snapshot per its maintenance convention), cli-command-registry.md (the
#     `attempts` subfamily note gains GH-289 / M2-S12)} and
#     doc/planning/oss-tooling/milestones/m2/entrypoint-delta.md (the observed
#     composition note: `dispatch attempts` mounted as a subfamily, the root listing
#     unchanged).
#   - doc/planning/oss-tooling/milestones/m1/commands/dispatch.md: BYTE-UNCHANGED
#     (DEC-13); the subfamily documents itself in its own milestone's page root.
#   - Current-truth facts the reconciliation must state rather than paraphrase away:
#     the read side adds no error identity and an `attempts.*` string anywhere means
#     the document is stale; a store is not a repository, so the physical root is
#     necessary but not sufficient; an empty verified history is success while a torn
#     store is a fault at exit 2; the summary's number moves in both directions on a
#     migrated root; coverage and floor live only on the summary.
#
# ROLLBACK: the change is additive and ships behind no flag. Reverting the change
# removes one verb, two flags, three additive resolve `data` keys, one additive human
# line, and the `idsTruncated` key, and restores the retired count derivations (which
# under-reported past 20 open divergences and over-reported on a migrated root). No
# record was written, rewritten, re-attributed, or migrated by this change, so no data
# rollback exists; the read side wrote no delivery evidence. TDR-0023 stays valid as a
# record of the design even if the change is reverted; a reversal is recorded in the
# record's history.
