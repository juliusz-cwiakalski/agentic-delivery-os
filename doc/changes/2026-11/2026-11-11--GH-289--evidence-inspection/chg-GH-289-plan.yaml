  #      projection types beside the delivered dispatch constants — `DispatchAttemptView`
  #      (the sixteen fields of Appendix D, with `divergenceRef` typed as
  #      `string | null` and no optional members), `DispatchAttemptsTruncation`
  #      (`{scope: "ledger" | "page", bound, omittedRecords}`), `DispatchAttemptsData`
  #      (the nine declared keys), the `AttemptsRefSource` vocabulary
  #      (`"flag" | "active-change"`), and the read bounds
  #      `ATTEMPTS_DEFAULT_LIMIT = 20`, `ATTEMPTS_MIN_LIMIT = 1`, `ATTEMPTS_MAX_LIMIT = 100`,
  #      `ATTEMPTS_MAX_DATA_BYTES = 65536`, `ATTEMPTS_MAX_HUMAN_LINES = 40`,
  #      `ATTEMPTS_MAX_HUMAN_BYTES = 8192`, `ATTEMPTS_HUMAN_ROW_BUDGET = 37`, and the
  #      canonical limit form `ATTEMPTS_LIMIT_PATTERN = "[1-9][0-9]*"`. Types and
  #      constants only: no record kind, schema version, token, projection class,
  #      configuration key, or product literal.
  #  1.3 packages/core/src/domain/dispatch-attempts.ts (new, pure): `projectAttempt`
  #      (the sixteen-field projection, `endedAt` from the stored finish timestamp,
  #      `divergenceRef` present-and-`null` when the record has none, `resumeMode`
  #      `null` when absent, `evidenceRefs` passed through bounded), `orderAttempts`
  #      (`startedAt` descending, `recordedAt` descending, `attemptId` ascending, so
  #      the order is total and independent of insertion and map order) and
  #      `selectAttemptsPage` (repository filter, then ref filter, then order, then the
  #      row bound, then the UTF-8 byte budget, returning the kept rows, `matched`,
  #      `hasMore`, the count-only foreign disclosure, and at most one truncation
  #      object whose ledger scope wins). No I/O, no clock, no locale, no terminal
  #      width, no `Buffer`: the byte length is computed in runtime-neutral code.
  #  1.4 packages/core/src/app/dispatch-attempts.ts (new, app tier): the read use case
  #      over injected ports — the store, the repository port, the active-reference
  #      port and the clock. It refuses with `input.value.rejected` (kind `input`) and
  #      a bounded summary naming the context file and the `--ref` remedy when the
  #      active reference does not resolve, and naming the checkout when the repository
  #      does not resolve, in both cases BEFORE touching the store; it performs exactly
  #      one `readDispatchAttempts` call; and it maps a read failure to the delivered
  #      `state.*` code under `kind: "state"` (never `dispatch.state-unverified`, which
  #      is the gate's own wrapper, and never an empty success). An empty verified read
  #      is a success with `attempts: []`, `matched: 0`, `hasMore: false`.
  #  1.5 Export surface: add the new module's exported names to
  #      packages/core/src/app/index.ts and packages/core/src/index.ts (both use
  #      explicit name lists, so the additions are deliberate one-line entries), and
  #      add the new contract names to packages/core/src/contracts/index.ts. No new
  #      subpath and no `packages/core/package.json` `exports` change, so
  #      `bun run scripts/checks/workspace-entrypoints.ts`, `tests/structure/subpaths.test.ts`
  #      and `pnpm check:boundaries` stay green.
  #  1.6 Registration: `tests/structure/inventory.json` rows for the two new modules
  #      and `EXECUTABLE_ALLOWANCES` entries for their exported functions and for the
  #      new constants in `core/src/contracts/dispatch.ts`.
  #  1.7 Fixtures (new): tests/fixtures/dispatch/attempt-records.ts — `maximalAttempt()`
  #      (16 x 64-character evidence references, 40-character attempt id),
