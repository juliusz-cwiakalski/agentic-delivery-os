  # Test obligations (owning TCs; must be green at this boundary):
  #   TC-ATTEMPT-009  100 maximal records serialize to at most 65,536 UTF-8 bytes of
  #                   `data`; a shortened page declares scope `"page"`, `bound: 65536`
