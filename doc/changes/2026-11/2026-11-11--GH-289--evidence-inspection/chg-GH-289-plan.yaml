#     envelope, the sixteen-field projection, the total order, the three bounds and
#     their declared omissions, the ref resolution, the empty-history rule, and the
#     count-only foreign disclosure; the resolve paragraph gains the unconditional
#     `local-evidence` mode, the subject repository, and the shared counts; the error
#     paragraph states that the read side adds no row and maps its refusals; the
#     bounds table gains the page bounds, the human row budget, and the 65,536-byte
#     data budget.
#   - doc/spec/features/feature-result-contract.md: no row changes; one clarifying
#     sentence where the dispatch rows are consumed — the attempts read and the
#     resolve extension reuse the `input` and `state` identities and add no entry.
#   - doc/spec/features/feature-cli-entrypoint.md: `dispatch attempts` joins the
#     enumerated dispatch subforms; the prompt-required set and the seventeen-family
#     root listing are unchanged.
#   - doc/spec/features/feature-state-layer.md: the store-opening read paragraph names
#     the attempts read as a store opener that writes no delivery evidence and
#     inherits only the host-index maintenance write and the create-once project
#     checkout identity marker.
#   - doc/spec/features/feature-projects.md: one sentence — the dispatch attempts read
#     is read-only with respect to evidence and inherits the store-opening effects;
#     the dispatch repository binding marker is never created or repaired by a read.
#   - doc/quality/test-specs/test-spec-dispatch-engine.md: coverage rows for the
#     attempts read and the resolve result; `links.related_changes` gains `GH-289`;
#     `last_updated` advances.
#   - doc/planning/oss-tooling/milestones/m2/commands/attempts.md: the delivered
#     reference page (Appendix C items 1-6): `--help` and `--version`, the resolved
#     exit table with no `attempts.*` rows and empty history at exit 0,
#     `command: "dispatch"`, `divergenceRef` singular-or-`null`, the declared digest
