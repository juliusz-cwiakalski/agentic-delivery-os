# THE COMMAND-LINE GRAMMAR IS OWNED BY THE COMMAND MODULE, AND THE DELIVERED
# REFUSALS ARE PRESERVED. AC-F1-3 requires a missing `--limit` value to be
# `input.value.rejected` at exit 1, and AC-F1-6 requires an unknown flag and an
# unexpected positional to be `input.value.rejected` as well. The shared parser
# (`packages/cli/src/index.ts` `parseInvocation`) classifies a missing value for a
# `requiresValue` flag, an unknown flag, and a fourth positional as
# `fallback.invocation` (verified by reading the parser and by invoking the built
# entrypoint on 2026-11-11), so the two requirement cannot both be met by adding the
# flags to `requiresValue`. Phase 2 therefore: (a) leaves the delivered
# `requiresValue` entries (`--harness`, `--resume-prompt`, `--repo`, `--note`)
# untouched and adds `acceptsAnyFlag: true`, so no parser-level refusal pre-empts
# the attempts grammar; (b) validates the `attempts` tail from `invocation.argv`
# inside the command module — canonical `[A-Z]+-\d+` ref, canonical decimal
# `[1-9][0-9]*` limit in 1..100 with default 20, unknown flag, unexpected positional
# — all as `input.value.rejected` with a bounded summary, before any runtime call
# and therefore before any store read; and (c) keeps every delivered form's refusal
# identity by classifying an unknown flag on `dispatch <ref>`,
# `dual-run summary|resolve`, and `handover` as `fallback.invocation` in the same
# handler guard, so AC-F9-1 and NG-6 hold. That guard is proven by a named suite
# cell, not by a review: TC-ATTEMPT-034 cell 7 runs each of the four delivered forms
# with an undeclared flag through a store seam whose `read`/`readRecords` throw, in
# tests/behaviour/dispatch-additive-stability.test.ts, so a declaration landed
# without the guard reds the cell at phase 2's boundary. The two flags are still
# declared value-taking flags in the published grammar
# (help entry, synopsis, reference page); `CommandDefinition.requiresValue` is a
# parser hint, not the published grammar.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - No new error identity. `ERROR_TABLE` stays at 124 identities with exactly four
#     `dispatch` rows, no `attempts.*` string exists anywhere, and no token,
#     projection class, or exit literal is added (AC-F4-4, DM-6, DEC-1, TDR-0023
#     C-1). Malformed request, unresolvable active reference and unresolvable
#     identity are `input.value.rejected` under `kind: "input"` at exit 1; an
#     unreadable store keeps its own `state.*` code under `kind: "state"` at exit 2.
#   - `attempts.v1` `data` carries exactly `repository`, `ref`, `refSource`
#     (`"flag"` | `"active-change"`), `limit`, `matched`, `hasMore`, `attempts[]`,
#     `excluded.foreignRepository`, and `truncation` only when a bound binds; no
#     top-level envelope key is added and `command` stays `"dispatch"` (DEC-7,
#     Appendix D).
#   - Each row projects exactly the sixteen declared fields; `divergenceRef` is one
#     identifier or explicit `null` (never a list); `endedAt` maps the stored finish
#     timestamp one-to-one; `comparison` is `{class, token, outcome}` with `token`
#     `null` exactly when the class is not-applicable; `resumeMode` is the recorded
#     mode or `null`; `evidenceRefs` is at most sixteen identifiers; no `schema`,
#     `handoverState`, or `prefillCostAcknowledged` key is projected (DEC-4, DEC-6,
#     TDR-0023 C-3).
#   - Read bounds: ledger read 5,000 records; page 20 by default, 1 minimum, 100
#     maximum; machine `data` 65,536 UTF-8 bytes; human digest 40 lines and 8,192
#     bytes with at most 37 rows beside a truncation line; 16 evidence references
#     per record; 20 unresolved identifiers per block; resolution note 240
#     characters (DM-4). Every bound that binds is declared; `truncation.bound` is
#     5000 for `ledger` and 65536 for `page`, and the ledger scope wins (DM-5).
#   - `unresolved` is the exact folded open count for the reported repository on
#     BOTH the resolve result and `dispatch dual-run summary`; `unresolvedIds` is
#     bounded to 20 with `idsTruncated` true exactly when identifiers were omitted;
#     no surface derives a count from an identifier list's length (DEC-15, TDR-0023
#     C-5, D-5). The eligibility predicate tests for zero and no verdict moves.
#   - Repository scope is enforced twice: the project state root from GH-288 plus a
#     logical filter on each record's own `repository`; excluded records are counted
#     (`excluded.foreignRepository`, independent of `--ref`, computed over the
#     retained ledger window) and never named; identity resolves with persistence
#     disabled, so the dispatch repository binding marker is never created, repaired,
#     or re-persisted; an invocation outside a checkout refuses at exit 1 (DEC-8,
#     TDR-0023 C-6).
#   - The READ performs exactly one verified store read: the repository port supplied
#     by the composition passes NO scheduler key (`resolveProductionRepository(
#     undefined, { persist: false })`), because `schedulerKeyForRef` would read the
#     queue ledger and break NFR-2's exactly-one-read bound. A checkout whose
#     identity resolves from neither the marker nor the normalized remote refuses
#     rather than reading the queue. This is a composition decision, recorded here
#     so the identity chain's inputs are reviewable.
#   - Read-only with respect to evidence: 0 attempt/divergence/handover/authority
#     appends, 0 fence acquisitions, store bytes/modes/mtimes unchanged; the only
#     permitted effects are the host-index maintenance write (zero when unchanged)
#     and the create-once project checkout identity marker (NFR-3, AC-F4-1).
#   - No new state record kind, schema version, key prefix, fold rule, validation
#     predicate, configuration key, workspace package, subpath, external dependency,
#     product literal, or binary literal (NG-1, NFR-9, AC-F9-2).
#   - Boundaries hold in every phase (`.dependency-cruiser.cjs`,
#     `.ai/rules/typescript.md`): `packages/core/src/domain` imports `contracts`
#     only; `app` may import `domain`, `config` and `contracts`; filesystem and git
#     I/O stay in `packages/adapters`; the CLI imports core only from `.` and the
#     declared subpaths; `packages/cli/src/help/prompt-required-commands.ts` is
#     dependency-free and unchanged.
#   - The M1 page `doc/planning/oss-tooling/milestones/m1/commands/dispatch.md` is
#     BYTE-UNCHANGED (DEC-13). No phase declares it, no phase edits it.
#   - Every new module is registered in `tests/structure/inventory.json` and its
#     executable exports in `tests/structure/content-inventory.test.ts` IN THE PHASE
