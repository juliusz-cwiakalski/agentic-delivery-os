  #      arrive after the code it binds. doc/decisions/00-index.md is declared with it;
  #      its TDR-0023 row is already committed at the next free identifier, and the
  #      declaration keeps any index correction inside this phase's scope. Do NOT
  #      restate the record's contents in this plan or in the spec.
