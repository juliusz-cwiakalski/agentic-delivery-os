phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Attempts contracts, the projection, the ordered bounded page, and the
  # repository-scoped read use case
  # Commit: feat(dispatch): read the attempt ledger through one projection and page
  #
  # Goal: turn the durable attempt record into one declared consumer shape and one
  # bounded, deterministic, repository-scoped read, with every bound declared and no
  # surface change yet — so phase 2 has nothing left to decide about what the data is.
  #
  # Work:
  #  1.1 doc/decisions/TDR-0023-dispatch-attempt-read-side-and-local-evidence-resolve.md
  #      is already committed and indexed on this branch, together with its row at the
  #      next free identifier in doc/decisions/00-index.md. D-1..D-7 and C-1..C-8 govern
  #      every later phase, and they must not arrive after the code they bind, so this
  #      item VERIFIES presence and index and changes no content: no authoring, no
  #      re-commit, no amend. The record stays `Proposed` with `decision_date: null` —
  #      the owner accepts it at the PR review, not here. Both paths stay declared so
  #      that any correction required by this change remains inside this phase's scope.
  #      Do NOT restate the record's contents in this plan or in the spec.
  #  1.2 packages/core/src/contracts/dispatch.ts: the `attempts.v1` data and
  #      projection types beside the delivered dispatch constants — `DispatchAttemptView`
  #      (the sixteen fields of Appendix D, with `divergenceRef` typed as
  #      `string | null` and no optional members), `DispatchAttemptsTruncation`
  #      (`{scope: "ledger" | "page", bound, omittedRecords}`), `DispatchAttemptsData`
  #      (the eight always-present keys plus `truncation` only when a bound binds), the
  #      `AttemptsRefSource` vocabulary
  #      (`"flag" | "active-change"`), and the read bounds. Only five of the bound names
  #      are new — `ATTEMPTS_DEFAULT_LIMIT = 20`, `ATTEMPTS_MIN_LIMIT = 1`,
  #      `ATTEMPTS_MAX_LIMIT = 100`, `ATTEMPTS_HUMAN_ROW_BUDGET = 37` and the canonical
  #      limit form `ATTEMPTS_LIMIT_PATTERN = "[1-9][0-9]*"`. The three byte/line
  #      budgets are IMPORTED from the delivered dispatch bounds rather than declared
  #      again: `DISPATCH_MAX_MACHINE_BYTES` (65,536) for the serialized `data`,
  #      `DISPATCH_MAX_HUMAN_LINES` (40) and `DISPATCH_MAX_HUMAN_BYTES` (8,192) for the
  #      digest, which is what spec §22's "beside the delivered dispatch bounds" means;
  #      a second declaration of one bound is the drift that sentence prevents, and each
  #      extra name would cost a contract-fixture entry.
  #      CONTRACT SURFACE (a gate, not a formality): the nine names this item adds —
  #      these four types and five constants — are entered in BOTH the `"dispatch.ts"`
  #      list and the contracts barrel `"index.ts"` list of
  #      tests/fixtures/ports/v1-contract-inventory.json in the SAME commit, because
  #      `tests/structure/port-contract-inventory.test.ts` compares that fixture with
  #      the real export set in both directions and reds on a missing or unexpected
  #      name. Types and constants only: no record kind, schema version, token,
  #      projection class, configuration key, or product literal.
  #  1.3 packages/core/src/domain/dispatch-attempts.ts (new, pure): `projectAttempt`
  #      (the sixteen-field projection, `endedAt` from the stored finish timestamp,
  #      `divergenceRef` present-and-`null` when the record has none, `resumeMode`
  #      `null` when absent, `evidenceRefs` passed through bounded), `orderAttempts`
  #      (`startedAt` descending, `recordedAt` descending, `attemptId` ascending, so
  #      the order is total and independent of insertion and map order) and
  #      `selectAttemptsPage` (repository filter, then ref filter, then order, then the
  #      row bound, then the UTF-8 byte budget, returning the kept rows, `matched`,
  #      `hasMore`, the count-only foreign disclosure, and at most one truncation
  #      object whose ledger scope wins). No I/O, no clock, no locale, no terminal
  #      width, no `Buffer`: the byte length is computed in runtime-neutral code.
  #  1.4 packages/core/src/app/dispatch-attempts.ts (new, app tier): the read use case
  #      over injected ports — the store, the repository port, the active-reference
  #      port and the clock. It refuses with `input.value.rejected` (kind `input`) and
