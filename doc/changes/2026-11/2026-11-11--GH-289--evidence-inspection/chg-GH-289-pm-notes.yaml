  - text: "Operational hazard observed at phase 9: this workstation is running
      concurrent delivery drivers against this same worktree - GH-303 drivers
      from deliver-ticket.sh plus duplicate GH-289 drivers (several
      deliver-ticket.sh GH-289 wrappers and an extra opencode PM session). The
      per-repo single-flight assumption is violated, which is what produced the
      contention artifacts above and could interleave phase writes. My runs were
