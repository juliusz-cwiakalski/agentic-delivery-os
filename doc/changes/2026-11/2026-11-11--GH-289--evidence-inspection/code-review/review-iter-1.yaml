summary: >-
  First local review of GH-289 (M2-S12), 22 commits over merge base 723454e4.
  No product defect and no AC contradicted by shipped behaviour: the read side is
  a pure domain projection over an injected app use case, the attempts grammar is
  validated in the command module before any runtime call, repository scope is
  enforced physically and logically with count-only foreign disclosure, one
  exported domain function now produces the divergence block for both the resolve
  result and the summary with the list-length helper deleted, and every GH-289
  suite and every change-relevant gate is green when re-run (56 + 30 + 33 targeted
  suite tests, 457 dispatch regression tests, 171 inventory/registry tests, typecheck,
  boundaries, help coverage, exports parity, literal/privacy scans, doc-distribution).
  The change fails this iteration on evidence quality: four medium findings show
  delivered assertions narrower than the test plan declares inside TCs that carry AC
  evidence (the attempts envelope key set is never asserted, TC-022 omits its
  unmigrated-root baseline and the narrowed human unresolved_divergences= line,
  TC-014 omits its append/fence counters, sha256 evidence, torn-binding cell and
  project-marker cell, and TC-029 step 3 neither implements nor asserts the attempts
  help pointer). Six low findings cover a spec AC that contradicts the digest grammar
  (AC-F2-2), reduced TC-039/TC-038/TC-036 coverage, a duplicated flag vocabulary in the
  command module, and one undeclared phase-3 file. All findings are remediable inside
  the change's declared file scope in review_fix without new scope and without
  behaviour change.
