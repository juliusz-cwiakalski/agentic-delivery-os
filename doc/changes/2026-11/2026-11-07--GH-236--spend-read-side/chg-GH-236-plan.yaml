  #       (a) tokensByClass: five-class sums over all captured session-group
  #       records, non-null classes only, never fabricated to zero; calls;
  #       (b) perAgent[] grouped by (agent, model) across ALL runs, ordered
  #       per PIN-3; (c) perPhase[] by capture-time attribution over the
