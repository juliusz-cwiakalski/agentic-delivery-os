# Format note: this document is the machine-readable plan (delivery.plan.v1).
# Phase goals, tasks (with TC/AC traceability), per-phase verification
# commands, per-phase commit steps, the phase->AC->TC matrix, and the phase-7
# doc-sync handoff notes are carried as YAML COMMENTS so the parsed document
# stays strictly schema-conformant. `plan validate GH-236` must return `valid`.
#
# Tier rationale: `full` — 8 capabilities, 19 ACs, 34 automated TCs, cross-
# package delivery (core contracts + state read consumer + domain fold +
# CLI command + status-digest flip + invariant suites + golden fixtures),
# security_impact low / risk medium (spec front matter), autonomous delivery
# mode (pm-notes). Lease names and weight classes are omitted: the lease/
# weight vocabulary belongs to the downstream scheduler and neither spec nor
# test plan pins names; every phase below is lease-taking by kind.
#
# EXECUTION CONTRACT (binding for every task):
#   - No task touches doc/changes/** or .ai/local/** — the change-folder
#     execution log and pm-notes phase bookkeeping are @pm-owned; per-phase
#     evidence (commands + results, plus the PIN-10 non-CI performance
#     reference numbers) is REPORTED to @pm, never written by the coder.
#   - doc/spec/** reconciliation is lifecycle-phase-7 @doc-syncer work on this
#     branch, declared as Phase 6 SCOPE below (so plan diff classifies it
#     `within`) and NEVER as coder tasks. The single exception that lands with
#     the code is the documented error-table companion row in Phase 1 — the
#     bidirectional error-table-sync gate is binding from the first commit
#     (the GH-232 lesson). The forbidden-literals registry registration for
#     the future feature-spend spec is @doc-syncer's, excluded here.
#   - One commit per phase, conventional-commit messages pinned per phase.
#   - Scope deviation policy: any file touched outside a phase's declared
#     scope is reported to @pm as a reviewed SCOPE_DEVIATION and recorded in
#     pm-notes (the GH-223 rev-3 precedent), never silently widened.
#
# =====================================================================
# DELIVERY-BOUND PINS (test plan TP-DEC-2..9 + GAP-2/GAP-3/GAP-6 resolved
# here; every value lands as a declared contract constant so tests read the
# constant, never a hardcoded string):
#
#   PIN-1 Data schema identity (TP-DEC-9): SPEND_DATA_SCHEMA_ID =
#         "delivery.spend.v1" declared once in contracts/spend.ts — a contract
#         constant, NEVER a `data` field; `data` carries exactly the six keys
#         tokensByClass / perPhase[] / perAgent[] / restarts / amplification /
#         degradation inside the unchanged delivery.result.v1 envelope.
#   PIN-2 Output bounds (spec NFR-1, not delivery-bound): SPEND_MAX_MACHINE_
#         BYTES = 65_536; SPEND_MAX_HUMAN_BYTES = 16_384; SPEND_MAX_HUMAN_
#         LINES = 200; all measured in UTF-8 bytes. NO separate perAgent[]/
#         perPhase[] entry cap exists — the byte/line bound is the operative
#         cap and truncation drops from the declared tail (PIN-3). The spec
#         pins no entry count and inventing one would be a new contract.
#   PIN-3 Roll-up ordering and truncation tail (TP-DEC-5 / GAP-6 / OQ-T5):
#         perAgent[] ordered by tokens DESC, then agent ASC, then model ASC;
#         perPhase[] ordered by window start ASC, then phase id ASC, with the
#         `unknown` window last. Truncation drops trailing perAgent[] entries
#         first, then perPhase[], and records SPEND_TRUNCATION_MARKER in the
#         truncated channel (envelope metadata and a human digest line) with
#         the dropped counts — NEVER as a new `data` key (DM-1 exactness).
#         Declared as one contracts constant set; TC-SPEND-021/003 assert
#         through the constant so a reviewed re-ordering updates one constant
#         and the goldens together.
#   PIN-4 Boundary attribution (TP-DEC-2 / OQ-T3): a record whose capturedAt
#         equals a `complete` stamp attributes to the completing phase (window
#         end inclusive); at a `reopen` stamp, to the reopened phase (window
#         start inclusive); when a `complete` and a `reopen` share a stamp the
#         `reopen` wins (the phase is open at that instant). Matrix P-03/P-05.
#   PIN-5 Share and phase-entry shape (TP-DEC-3/TP-DEC-4): share = floor(phase
#         tokens * 100 / total tokens); total tokens 0 -> every share 0;
#         shares may not sum to 100; exactly one perPhase[] entry per phase id
#         aggregating all of that phase's windows (complete->reopen->complete
#         is one entry). Spec DEC-9 pins the integer-percentage rule.
#   PIN-6 `--phase` scoping (TP-DEC-6 / OQ-T4): the filter selects the
#         phase-attributed record subset — ONE selection, ONE fold — so
#         tokensByClass, calls, perAgent[], perPhase[] AND the amplification
#         block derive from the subset; an out-of-vocabulary value refuses
#         input.value.rejected before any read; a canonical phase whose window
#         holds no records returns spend.telemetry-absent naming the phase.
#   PIN-7 Transitions readability (TP-DEC-7 / OQ-T7): an unreadable/corrupt
#         transitions payload classifies through its delivered state identity
#         (exit 2) — never a silent `unknown` attribution; only an ABSENT
#         transition history falls back to the named `unknown` window.
#   PIN-8 Degradation population (TP-DEC-8 / OQ-T6): degradation counts
#         warnings from BOTH telemetry families (session-group records and
#         capture-outcome records) so a capture-outcome `session-capture-
#         failed` can never vanish; `records` counts the telemetry records
#         bearing warnings; byReason keys are exactly HARNESS_WARNING_REASONS.
#   PIN-9 Honesty-limit prose (GAP-3 / OQ-T2-resolved companion): the four
#         disclosure obligations are declared ONCE as SPEND_DISCLOSURES
#         contract data — (a) run duplication is proven while semantic
#         duplication is not; (b) runs that never reached closeout capture are
#         invisible; (c) restart counts share that capture-reached evidence
#         basis; (d) a zero-token progress run reports no ratio and names the
#         run in amplification.progressRun (paid > 0 or paid = 0). The human
#         amplification section renders them verbatim; goldens pin the bytes;
#         a reviewed rewording updates the constant and its golden together.
#   PIN-10 NFR-4 measurement (GAP-2): CI gates BOUNDED WORK only — read-count
#         invariance at 1,000 vs 10,000 records (exactly one verified read per
#         telemetry family plus one transitions read per invocation; no
#         per-record re-read; zero network; linear fold over bounded input; no
#         pagination crawl). The p95 wall-clock targets (<= 500 ms at 1,000
#         records; <= 2 s at 10,000) are measured ONCE locally and REPORTED to
#         @pm for the execution log as a non-CI reference — never a CI gate.
#   PIN-11 Grammar constants (DEC-6): SPEND_WORK_ITEM_REF_PATTERN =
#         "^[A-Z][A-Z0-9]*-[0-9]+$" — the closeout precedent, case-sensitive,
#         no folding — declared in contracts so the test asserts the constant,
#         not a copied regex; the `--phase` vocabulary is CANONICAL_PHASE_IDS
#         reused by reference (never re-declared); the parser-level declared
#         flags are exactly ["--ref", "--phase", "--amplification"] with
#         values consumed in the handler (the retro/db pattern), so an
#         undeclared flag classifies fallback.invocation at the shared parser
#         (L-11) while missing values, bad shapes, and unexpected positionals
#         classify input.value.rejected in the handler (L-04..L-10) — and
#         `--json` stays a global flag the handler never inspects.
#   PIN-12 State read surface (no new record kinds, no schema change, no
#         fence): additive readHarnessCaptureOutcomes(store, workItemRef) in
#         state/harness-telemetry.ts — verified, prefix-scoped to
#         HARNESS_TELEMETRY_CAPTURE_KEY_PREFIX, wrong-kind/malformed ->
#         state.store.torn naming the record position — plus a new
#         state/spend-reads.ts composing readHarnessTelemetry +
#         readHarnessCaptureOutcomes + readChangeTransitionsTolerant into one
#         classified SpendLedgerRead. Read-only by construction: no append/
#         fence/salvage member, and NO harness adapter, session reader, or
#         provider client is imported anywhere in the spend path (structural,
#         asserted by TC-SPEND-002/006/032).
#
# Delivery risks pinned as explicit tasks:
#   - The documented error table is BINDING (bidirectional sync): the
#     spend.telemetry-absent row lands in doc/spec/features/
#     feature-result-contract.md in the SAME phase as the machine row (task
#     1.3), or error-table-sync fails at the first commit.
#   - The digest flip is ONE commit (task 4.3/4.4): contracts/status.ts kind
#     vocabulary, placeholder ids, derivation row, evidence source `state-log`
#     AND domain/status.ts section 8 + human line + placeholderSectionCount
#     land together with the corpus/golden regeneration, so the pinned digest
#     invariants never contradict the rendered output mid-change (spec §8.5,
#     RSK-4).
#   - Read-only discipline is structural, not conventional: the spend path
#     acquires no fence, writes nothing, spawns nothing, resolves no
#     credential — verified by byte-snapshot suites (TC-SPEND-032) and the
#     imports guard (TC-SPEND-002). state.lock.busy is unreachable from spend.
#   - Digest and command share ONE fold (spec §1, DM-6): the status digest
#     consumes the Phase-3 fold through the same injected store seam — a
#     second aggregation inside domain/status.ts is a review-blocking defect
#     (TC-SPEND-030 parity + single-fold spy).
#   - Help surface: the CLI grammar is locked (AC-F6-1 — no flag outside the
#     locked set), so there is NO `--help` flag; the man-page-grade help and
#     examples are delivered on the documented surfaces (M1 pack man-page.md /
#     commands/spend.md, reconciled with feature-spend.md in phase 7). The
#     test plan's TC-031 step 1 "or the documented help path" is the operative
#     reading; no CLI flag is added for help.
#   - NO new boundary rule, package, subpath, or dependency: spend consumes
#     delivered primitives only; the existing gate battery (depcruise,
#     ambient-globals, exit-code-literals, forbidden-literals,
#     workspace-entrypoints, content inventory) covers the negative space —
#     no new scripts/checks/*.ts invariant is required by this change.
# =====================================================================

