  #       named `unknown` window; (d) restarts = max(0, N-1) over the union of
  #       run identities across BOTH families (DM-4/DEC-5); (e) amplification
  #       exactly per TDR-0011 as amended (DM-3/DEC-3/DEC-11): paid = the
  #       five-class sum over all captured records; the progress run = the
  #       latest record-bearing run (captured-at DESC, run-id ASC tie-break —
  #       no run-id format property assumed); ratio = paid / progress; a
  #       zero-token progress run (paid > 0 OR paid = 0 with every class
  #       null) reports ratio null with progressRun naming that run, null
  #       whenever progress > 0, and null/null only when no record-bearing
  #       run exists (A-11); ONE event per earlier record-bearing run with
  #       positive spend — cause "restart-loop prefill re-pay", window
  #       [previous record-bearing run's capturedAt || earliest transition
  #       timestamp || point] -> this run's capturedAt, tokensWasted = that
  #       run's spend — sorted by window start then run id, the progress run
  #       never raising an event; a capture-outcome-only run counts toward
  #       restarts, adds zero paid, raises no event; (f) degradation per
  #       PIN-8 (both families, closed reason vocabulary). Determinism: no
  #       clock, no randomness, permutation-invariant output (A-10).
  #       (F-1, F-3, F-4, F-5; DEC-2..DEC-5, DEC-11; AC-F1-1, AC-F3-1,
  #       AC-F3-2, AC-F4-1, AC-F5-1 (binding AC 2 anchor), AC-F5-2 (binding
