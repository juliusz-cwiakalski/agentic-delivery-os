findings:
  - id: F-1
    severity: low
    confidence: high
    category: correctness
    location: packages/core/src/domain/spend-text.ts:88-96
    message: >-
      Under event truncation the human amplification decomposition becomes
      internally inconsistent. `amplificationLines` recomputes `wasted` from the
      mutable `events` array and prints `progress = paid - wasted`; when the
      machine report already dropped events (or the human renderer pops events
      to stay within 16 KiB), `wasted` undercounts, so the printed
      "(paid P / progress Q)" does not satisfy P/Q == the printed ratio, even
      though `amplification.ratio` is the true value.
    suggestion: >-
      Compute the progress denominator from the pre-truncation data (carry the
      untruncated events total or progress into the renderer), or omit the
      paid/progress parenthetical and render only the ratio when any events were
      omitted, appending the truncation note.
    suppressed: false
  - id: F-2
    severity: low
    confidence: high
    category: correctness
    location: packages/core/src/domain/status.ts:1857
    message: >-
      `spendHumanLine` renders every non-observed-empty spend section as
      `spend      unknown  state-unreadable (<code>)`. The edge's
      `spendDigestFor` emits `reason: local-context-missing` when no active
      change ref resolves (packages/cli/src/edge.ts:1651-1652), so a normal
      no-active-context status prints "state-unreadable
      (local-context-missing)", conflating a missing context with an unreadable
      store. The machine projection (`reason`) is correct; only the human wording
      is inaccurate. The projection-undefined fallback also prints
      "state-unreadable (state-unreadable)".
    suggestion: >-
      Branch the human line on `projection.reason` (e.g.
      `unknown  local-context-missing` vs `unknown  state-unreadable (<code>)`),
      and give the projection-undefined fallback a neutral wording.
    suppressed: false
  - id: F-3
    severity: low
    confidence: high
    category: code-quality
    location: packages/core/src/domain/spend.ts:240-282
    message: >-
      The declared contract constants PIN-3/PIN-5 intend to be the single source
      of truth for ordering and truncation, but `SPEND_AGENT_ORDER`,
      `SPEND_PHASE_ORDER`, and `SPEND_TRUNCATION_TARGETS`
      (packages/core/src/contracts/spend.ts:64-70) are never consumed by the fold
      or the bounder. `perAgentOf`/`perPhaseOf` sort keys and `boundReport`'s
      agents->phases->events tail are hardcoded, so a lone change to a constant
      silently no longer describes behavior (drift is only caught because tests
      separately pin both the constant literal and the behavior).
    suggestion: >-
      Either drive the sort comparators and the truncation tail from the
      constants (or a small helper derived from them), or document the constants
      explicitly as test pins rather than runtime sources.
    suppressed: false
  - id: F-4
    severity: low
    confidence: medium
    category: testing
    location: packages/cli/src/edge.ts:1639-1657
    message: >-
      The status-digest spend composition seam (`spendDigestFor`) is not
      exercised end-to-end against a real store. The digest behaviour tests
      inject `SpendDigestSection` facts directly (status-spend-section/-degraded),
      and status-spend-degraded's "the digest degrades" case uses injected
      `failedSpend(...)`; the actual mapping from a torn/captured/local-context-
      missing store through `createStatusCommandRuntime().readSpend` to the
      rendered digest is only structurally asserted (cli-edge-seam) and
      read-count asserted (brief-read-cost), not behaviour-asserted.
    suggestion: >-
      Add one status-through-edge case seeding a real torn store and an active
      change context (and one verified-empty positive control) asserting the
      rendered digest section is unknown/state-unreadable at exit 0 — closing
      AC-F8-2 at the composition seam.
    suppressed: false
  - id: F-5
    severity: info
    confidence: high
    category: spec-compliance
    location: packages/mcp/src/commands/status.ts:91
    message: >-
      The shipped MCP status composition supplies no spend read, so its digest
      always reports spend observed / captured:false even when the CLI (which
      composes `readSpend`) shows captured telemetry for the same store. This is
      intentional and documented (feature-status-digest.md, feature-mcp-surface.md)
      and honours NG-5 (no MCP spend tool/projection), but CLI-vs-MCP digests can
      diverge on spend for downstream MCP consumers.
    suggestion: >-
      No code change required for GH-236. Note for M1-S12/GH-240 or M2-S6 that an
      MCP consumer should treat the shipped verified-empty spend observation as
      non-authoritative rather than as a zero-spend claim.
    suppressed: false
  - id: F-6
    severity: info
    confidence: high
    category: documentation
    location: doc/changes/2026-11/2026-11-07--GH-236--spend-read-side/chg-GH-236-spec.md:230
    message: >-
      Change-spec NFR-1 (v1.2) names truncation only for `perAgent[]` then
      `perPhase[]`. The delivered `events` tail (deviation 8) is required to keep
      the 64 KiB machine bound for long restart loops, is permitted by
      TC-SPEND-021 step 5 (drop only with the marker; totals/restarts/ratio
      never dropped), and is correctly documented in the delivered system docs
      (feature-spend.md, nonfunctional.md). Only the frozen change-spec NFR-1
      text does not name the events tail.
    suggestion: >-
      No blocking action. If the change spec is reopened for any reason, extend
      NFR-1 to name the events tail; the canonical system spec is authoritative
      and already accurate.
    suppressed: false
  - id: F-7
    severity: info
    confidence: medium
    category: plan-compliance
    location: doc/changes/2026-11/2026-11-07--GH-236--spend-read-side/chg-GH-236-pm-notes.yaml:95
    message: >-
      PIN-10 requires the NFR-4 wall-clock reference numbers (p95 <= 500 ms at
      1,000 records; <= 2 s at 10,000) to be measured once locally and reported
      to @pm for the execution log. The delivery note records the aggregate
      gate result but not these reference numbers; the CI half (read-count
      invariance / bounded work) is present in spend-performance.test.ts.
    suggestion: >-
      Record the measured reference numbers in pm-notes (or state explicitly that
      they were reported out-of-band) so the PIN-10 evidence obligation is
      visible in the artifact.
    suppressed: false
  - id: F-8
    severity: info
    confidence: high
    category: code-quality
    location: packages/core/src/domain/spend-text.ts:21-25
    message: >-
      `SpendHumanOptions.brand` is accepted by `renderSpendHuman` but never read
      on the success path; the brand is only used in the failure text in
      cli/commands/spend.ts. The unused option field is a minor smell and could
      mislead a reader into expecting a branded human header.
    suggestion: >-
      Drop `brand` from `SpendHumanOptions` (keep it on the failure renderer), or
      use `brand.binaryName` in the success header if a branded line is intended.
    suppressed: false
