# GH-234 implementation plan — M1-S21: Model profiles and provider watching
#
# Sources (single source of truth):
#   - Spec:  ./chg-GH-234-spec.md (v1.0; F-1..F-11; 9 ACs AC-F8-1, AC-F6-1,
#     AC-F6-2, AC-F3-3, AC-F7-4, AC-F1-5, AC-F11-6, AC-F9-7, AC-F8-8;
#     DM-1..DM-10; EVT-1..EVT-5; NFR-1..NFR-11; DEC-1..DEC-9; RSK-1..RSK-8;
#     §14 OQ-1..OQ-3; §18 delivery order; Appendix A ported groups,
#     Appendix C envelope shapes, Appendix D env-record classes)
#   - Test plan: ./chg-GH-234-test-plan.md (v1.0; 58 TCs TC-PROFILE-001..058;
#     §4 layer table; §7 automation mapping incl. the implementation-order
#     steps 1-7; gaps GAP-T1..T8; OQ-T1..T7)
#   - Man page contract: doc/planning/oss-tooling/milestones/m1/commands/provider.md
#     (grammar, envelope `data` shapes, exit statuses)
#
# TC-mapping obligation: all 58 TCs are mapped onto Phases 1-9 below,
# following the test plan §7 implementation-order mapping (config branch ->
# selection engine -> lifecycle/pacing -> watch -> CLI -> spawn seam ->
# cross-cutting battery) reconciled with spec §18 delivery order
# (configuration + engine first, then CLI, then spawn-seam integration).
# TCs whose halves land in different phases are marked in `coverage` with
# their completing phase (GH-225/GH-233 discipline). Two reconciliation
# notes against the §7 step list, neither reshaping a pinned oracle:
#   - TC-PROFILE-053 (100-run replay) is grouped in step 7 but lives in the
#     selection and park-switch-revert suites; its replay rows land with
#     those host suites (Phase 3 selection half, completing Phase 4).
#   - TC-PROFILE-045 spans step 4 (engine-level status read) and step 5
#     (CLI envelope + golden); split accordingly (completes Phase 6).
# Spec and test plan were cross-checked: no behavioural inconsistency found
# (one representational observation — the man-page example renders
# `envRecord` as a structured map with `recordFormat: data-v1` while DM-7
# describes the serialized data-v1 grammar; pinned below as a delivery
# decision: the envelope carries the structured record, the serialized
# grammar is the wrapper-consumed wire form).
#
# Delivery decisions recorded by this plan (PM-decided 2026-11-07 or
# placement choices the spec/test plan leave delivery-bound; each is a
# placement, spelling, or precedence pin — never a behaviour change):
#   - PM decision (pacing goal-priority precedence; closes test-plan
#     OQ-T2 / GAP-T4, spec DM-5 gap): the DECLARED ORDER of goal priorities
#     in configuration IS the precedence — first declared wins; the engine
#     evaluates deterministically over the declared order and contains no
#     hardcoded precedence. `pacing.goalPriorities` is an ordered list;
#     duplicate priority ids are a validation error. This keeps
#     AC-F7-4/AC-F1-5 (rungs/thresholds/overrides are configuration)
#     intact and finalizes TC-PROFILE-031's assertions.
#   - PM decision (spawn-surface enforcement; closes OQ-T1 / GAP-T3): the
#     in-change enforcement points are (a) the `provider profile resolve
#     --for-spawn` seam and (b) the hardened data-v1 env-record contract
#     flowing into the harness spawn-env deny-by-default construction.
#     The legacy bash hook (scripts/ceo-loop.sh) is NOT rewritten in this
#     change — it stays byte-unchanged (asserted structurally in Phase 8);
#     its `ADOS_HOOK_ENV_V1` contract is consumed as data only (NG-6,
#     DEC-3, DEC-6). M1-S9 (daemon) and M1-S20 (agent integration) own
#     surface rewiring; this change delivers the seam they consume.
#   - PM decision (vendor watch mappings are fixture-proven; GAP-T2 /
#     OQ-T4): snapshot normalizers are proven against committed recorded
#     fixtures per vendor shape — coding-plan weekly + rolling windows,
#     DeepSeek balance vs configured floor, OpenAI usage windows. Zero
#     live network in tests; a missing fixture fails the mapping test
#     naming it, never a weakened assertion.
#   - PM decision (empty-by-default fail-closed; DEC-9): the
#     `provider.profiles` branch ships empty — no tier, no profile, no
#     preference chain, no rung, no pacing goals — mirroring the engine's
#     shipped no-default-chain precedent (`provider.chains` empty,
#     `provider.defaultChain` absent). A fresh installation resolves no
#     profile and refuses spawns with a classified error.
#   - Placement (GAP-T8): the profile-family contract module is the NEW
#     packages/core/src/contracts/provider-profile.ts (the delivered
#     contracts/provider.ts gains only the additive watch mapping-kind
#     closed set); the selection/lifecycle/pacing/env-record policy lives
#     as new flat modules in packages/core/src/provider/ (parks.ts
#     precedent for record handling); the three vendor normalizers live
#     INSIDE packages/adapters/src/provider-quota/ — they join the
#     existing `^packages/adapters/src/provider-quota/` runtime-API
#     confinement entry (comment updated to name them); NO new boundary
#     edge, NO new subpath export, NO new secret-read allowlist entry.
#     Exact record-kind/payload-schema/error-identity spellings are
#     implementation-bound within the pinned families.
#   - Placement (envelope envRecord representation): per Appendix C and
#     the man page, the selection envelope carries `envRecord` as the
#     structured record (name->value entries plus
#     `recordFormat: "data-v1"`); the serialized data-v1 grammar
#     (header line, `set`/`unset` records, final LF) is the wire form the
#     spawn wrapper consumes and the hardened validator (DM-7, Appendix D)
#     rejects or accepts byte-level. Both directions are tested.
#   - Doc placement (spec OQ-7 analogue, test-plan OQ-T7): the default is
#     a NEW doc/spec/features/feature-provider-profiles.md per the
#     first-spec rule (the profile area is a distinct capability surface);
#     feature-provider-engine.md is reconciled either way (watch mappings,
#     guarded-vocabulary growth, the profile exclusion flips). Final
#     placement is confirmed at doc-sync (lifecycle phase 7); the
#     docs-touch list is declared as Phase 9 scope below.
#
# Tier rationale: `full` — 11 capabilities, 9 ACs, 58 automated TCs,
# cross-package delivery (core contracts + provider engine + config,
# adapters provider-quota normalizers, CLI command surface),
# security_impact high (spec front matter; env-record injection is the
# highest-severity surface). All phases are delivery kind; plan-level
# defaultLeases/defaultWeightClass apply. Per-phase completion: one
# Conventional Commit per phase (the `summary` key, landed via
# @committer) plus the `testGate` commands passing; typed doneArtifacts
# are declared on the final phase where the evidence exists.
#
# Invariants carried by every phase (spec §9, §21; DEC-1..DEC-9):
# selection policy is pure and runtime-neutral (imports only core
# contracts; NFR-3); identical config + provider facts + injected clock
# produce identical decisions, eligibility lists, env records, and event
# identities (NFR-1); the test battery is hermetic — zero live network,
# live credential reads, or real sleeps (NFR-2); zero secret bytes,
# auth headers, raw vendor bodies, or endpoint userinfo on any surface,
# watch authorization credential-port-only with one-time handoff (NFR-4,
# §20); evidence bounded to closed allowlists (NFR-8); idempotent events
# and zero-write reads (NFR-9); error identities exact-code and total
# with fallback.internal containment, appended never renumbered (NFR-10);
# configuration-only tuning with zero code changes (NFR-11); the engine
# v1 vocabulary (conditions, parks, announcements, exit conventions) is
# reused, never forked; the legacy bash hook stays untouched (NG-6).

