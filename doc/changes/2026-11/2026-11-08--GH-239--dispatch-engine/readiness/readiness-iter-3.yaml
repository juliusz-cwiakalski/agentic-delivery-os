findings:
  - id: R1
    severity: minor
    facet: plan_code_area_coverage
    artifact: chg-GH-239-plan.yaml phase 1 summary; tests/checks/error-table-sync.test.ts:1079,1080,1160,1183
    gap: >-
      Phase 1 enumerates the count invariants it must update but omits the three
      `BASELINE_ROWS.length + 79` assertions in tests/checks/error-table-sync.test.ts
      (baselineViolations, the unchanged-copy control, and the db suite). With the
      table at 115 instead of 113 these three fail, so phase 1 is green only after an
      edit the enumeration does not name. The plan's binding general clause ("must
      change every count, reserved-set, and row invariant the same phase's tests
      enforce") does cover it, and the file is already in phase 1 scope, so this is
      non-blocking.
    remediation_target: delivery_planning
    fix: >-
      Add to the phase-1 summary: `BASELINE_ROWS.length + 79` becomes `+ 81` at all
      three sites (including the failure message), alongside the already-named
      `dispatch: 2 -> 4`.

  - id: R2
    severity: minor
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-239-test-plan.md Section 7.5 (TC-HELP-003 row) and Section 7.1;
      chg-GH-239-plan.yaml header phase lists, phase 1 and phase 4 tests
    gap: >-
      TC-HELP-003 spans `tests/structure/harness-review-deferrals.test.ts` (inverted
      in phase 1), `tests/behaviour/entrypoint-composition.test.ts` (pre-inversion
      run in phase 4, inverted in phase 7), and `tests/conformance/pilot/
      pilot-isolation.test.ts` (phase 7). Section 7.5 gives the TC earliest phase 7
      and lists only the P4 pre-inversion run and the P7 completion, so the phase-1
      inversion slice is undeclared; the plan's phase-1 declaration says
      "confirmations: none" while its test list runs and inverts that file, and phase
      4 runs the entrypoint-composition file without listing TC-HELP-003 in its
      confirmations. No phase goes red under the plan's explicit phase-1/phase-7
      instructions, so this is a declaration gap, not an execution defect.
    remediation_target: test_planning
    fix: >-
      In Section 7.5's TC-HELP-003 row add "P1 inverts
      tests/structure/harness-review-deferrals.test.ts" to the executable slices and
      to the cross-phase column; in the plan add TC-HELP-003 (harness-review-deferrals
      slice) to phase 1's executable/confirmation declaration and TC-HELP-003
      (pre-inversion entrypoint run) to phase 4's confirmations. TC ownership and the
      per-phase counts are unchanged.

  - id: R3
    severity: nit
    facet: decision_capture
    artifact: doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md; doc/decisions/00-index.md:41; doc/decisions/00-register.md:14,34,38
    gap: >-
      TDR-0015 exists only in the working tree (untracked) while 00-index.md and
      00-register.md, already committed in adcc7d83, reference it. Until the record is
      added, the branch carries a committed dangling link to a Proposed record.
    remediation_target: delivery_planning
    fix: >-
      Commit the TDR together with this verdict (or confirm phase 1's commit adds it)
      before any PR is opened.

  - id: R4
    severity: nit
    facet: decision_capture
    artifact: doc/decisions/TDR-0015 Section 5; chg-GH-239-spec.md Appendix G
    gap: >-
      Appendix G sends the two dispatch-derived `failed` pairs (spawn failure and
      resume-economics refusal) to a not-applicable comparison with reason
      `comparison-source-unavailable`, while TDR-0015 Section 5 declares only
      `state-unverified` as the not-applicable exception inside the verify-change
      family. A consumer implementing only TDR-0015 re-derives the family and reaches
      the same record-level degradation, so the outcome agrees, but the durable home
      of the comparison shape is under-declared.
    remediation_target: specification
    fix: >-
      Add one clause to TDR-0015 Section 5 naming the two dispatch-derived `failed`
      pairs as not-applicable/comparison-source-unavailable (the file is already in
      plan phase-1 scope).

  - id: R5
    severity: nit
    facet: spec_completeness
    artifact: >-
      chg-GH-239-spec.md Section 2.1 / Section 5.1 F-6; GH-239 body; backlog.md
      M1-S9 phasing sentence; chg-GH-266-spec.md:33
    gap: >-
      The ticket and the canonical backlog state that per-repository handover
      "additionally requires the resident daemon live (M1-S18) and the evidence
      window elapsed". The spec supersedes the window wording (DEC-1) and delivers the
      daemon seam (F-10/D5), but never states whether the daemon-live clause is a
      satisfied sequencing prerequisite or a fifth gate condition. The gate is
      correctly the backlog's four-condition `clean` definition and handover is
      state-based per contracts.md, so the reading is inferable but untraced.
    remediation_target: specification
    fix: >-
      Add one sentence (Section 2.1 or a DEC) recording that M1-S18 is delivered
      (D5), that the daemon-live clause is a satisfied sequencing prerequisite rather
      than a fifth gate condition, and that `dispatch handover` therefore evaluates the
      four conditions only.

  - id: R6
    severity: nit
    facet: plan_code_area_coverage
    artifact: tests/structure/error-table.test.ts:1611; chg-GH-239-plan.yaml phase 1
    gap: >-
      The delivered test title "every new row projects user-validation and no new
      platform-provider row exists" becomes false once `dispatch.state-unverified`
      (platform-provider) is added. The assertion body only checks the three
      previously added codes, so it still passes; the title would carry a stale truth
      claim.
    remediation_target: delivery_planning
    fix: >-
      Rename that test in the same phase-1 edit (for example "every pinned economics
      row projects user-validation and only the declared dispatch state row is
      platform-provider").

  - id: R7
    severity: nit
    facet: plan_coverage
    artifact: chg-GH-239-plan.yaml phase 10 tests; chg-GH-239-test-plan.md TC-NFR-004, TC-EVID-006/TC-GATE-011 P10 slices
    gap: >-
      Phase 10 extends `tests/behaviour/dispatch-gate-evidence.test.ts` (TC-NFR-004's
      truncation slice) and `tests/behaviour/dispatch-evidence-class.test.ts` (the
      controlled-class declaration) but its test list runs neither file explicitly;
      both are covered only by the trailing `pnpm check`.
    remediation_target: delivery_planning
    fix: >-
      Add "bun test tests/behaviour/dispatch-gate-evidence.test.ts
      tests/behaviour/dispatch-evidence-class.test.ts" to phase 10's tests.

