iteration_2_dispositions:
  - id: N1
    status: CLOSED
    evidence: >-
      test-plan Section 7.5 declares the earliest executable phase, per-phase
      executable slices, and cross-phase confirmations for all 82 TCs, with per-phase
      counts 5/12/8/12/4/17/4/5/3/12 (sum 82). Mechanical re-check of every plan
      phase `tests` command against the Section 7.5 ownership: phases 2-3 run only
      pure-domain and ledger files (liveness, token-closure, exit-projection,
      truth-derivation, state-unverified, evidence-record, evidence-class,
      comparison, identity, false-success, unevaluable, authority-view) with no
      `dispatch`, `dual-run summary`, `handover`, or bash invocation; command slices
      start at phase 4 and summary/gate at phase 6. TC-EVID-002 is owned by phase 6
      while the phase-3 divergence-append primitive is TC-EVID-005. The plan header,
      the per-phase declarations, and Section 7.5 agree on ownership lists and
      counts. Residual slice-declaration omissions for TC-HELP-003 and two delivered
      regression files are logged separately as R2/R7; neither makes a phase red.
  - id: N2
    status: CLOSED
    evidence: >-
      Plan phase 1 now names, and the delivered code confirms:
      `RESERVED_TWO_SEGMENT_CODES` gains `dispatch.state-unverified` and its
      `toHaveLength(35)` at tests/structure/error-table.test.ts:1374 becomes 36
      (CODE_PATTERN requires >=3 segments, so the 2-segment code is unreservable
      otherwise); the delivered-table `toHaveLength(112)` at line 1761 becomes 114;
      the four `toHaveLength(113)` assertions (790, 866, 1100, 1668) become 115; the
      `113 identities` phrase assertion (1780) becomes 115; DISPATCH_ROWS grows to
      four; the dispatch kind `toHaveLength(2)` and the "exactly the two economics
      identities" prose expectation become four; the two-way sync and the
      `dispatch: 2 -> 4` kind count (tests/checks/error-table-sync.test.ts:1112) are
      named. A same-class residual (three `BASELINE_ROWS.length + 79` assertions in
      the same sync file) is logged as R1.
  - id: N3
    status: CLOSED
    evidence: >-
      `tests/structure/harness-review-deferrals.test.ts` is phase-1-owned and in the
      header cross-phase ownership note; phase 1 updates the F-9 deferral record and
      inverts the assertion in the same edit as the spawn-failure row; phase 7's
      scope no longer lists the file and its summary says "must not edit or re-run
      that file". Phase 7 owns only the entrypoint-composition inversion and the
      narrowed pilot-isolation comment.
  - id: N4
    status: CLOSED
    evidence: >-
      Spec Appendix G pins, per failure class, the attempt-record policy, result
      token, engine outcome, exit, and comparison treatment (spawn failure
      failed/failed/1/comparison-source-unavailable; restart-budget
      max-restarts/failed/1/dispatch-session-family; resume-economics
      failed/failed/1/comparison-source-unavailable; harness spawn refusal
      noop-lane-permission/refused/1/dispatch-session-family; the three pre-session
      refusals unrecorded). It is referenced from F-2, F-3, F-4, F-12, DM-1, EVT-1,
      DEC-19, AC-F2-4, AC-F4-1, AC-F12-1, AC-F12-2 and the DoD; the test plan
      asserts the same pairs in TC-DISP-009/010/011, TC-EVID-001, TC-ERR-001/002,
      TC-RESUME-002/003; plan phases 2/4/5 restate them consistently.
  - id: N5
    status: CLOSED
    evidence: >-
      No artifact calls a spawn refusal "pre-session". Spec glossary separates
      "Pre-session refusal" (envelope-only, no record, no token) from "Spawn-refused"
      (recorded attempt, noop-lane-permission/refused, exit 1); F-4/AC-F2-4/DEC-19
      say an attempt-stage failure is never a pre-session refusal; plan phase 2 says
      "a harness refusal before a session exists (spawn-refused)"; test-plan judgment
      call 19 forbids the wording and TC-DISP-002/TC-DISP-011 assert the contrast.
  - id: N6
    status: CLOSED
    evidence: >-
      Spec glossary "Counted dispatch" now defines complete as every declared field
