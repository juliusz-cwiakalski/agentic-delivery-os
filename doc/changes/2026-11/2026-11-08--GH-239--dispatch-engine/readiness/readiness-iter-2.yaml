verdict_basis: >-
  NOT_READY. Iteration-1 findings F1-F9 and F11-F16 are CLOSED and F10 is
  PARTIALLY CLOSED. A new major plan-coverage defect remains: the plan assigns
  behaviour-level test cases that require the phase-4 one-shot dispatch command,
  the phase-6 summary/gate, and the phase-8 bash fallback to phase 2 and phase 3,
  so those phases cannot be independently green as the plan claims. The plan also
  contradicts its own TC ownership statement by placing TC-EVID-002 in phase 6
  while the header assigns it to phase 3. Minor residual issues remain in the
  phase-1 count invariants, a phase-1/7 duplicate inversion claim, and an
  unpinned result token for three classified failure identities. The core
  iteration-1 root causes (unreachable gate, uncountable controlled-proof
  evidence, undefined window/identity/comparison semantics) are resolved and
  TDR-0015 is Proposed with owner acceptance at PR review.

