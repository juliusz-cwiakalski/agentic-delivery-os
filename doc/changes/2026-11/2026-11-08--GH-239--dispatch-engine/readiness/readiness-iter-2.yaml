findings:
  - id: N1
    severity: major
    facet: plan_coverage
    artifact: >-
      chg-GH-239-plan.yaml header (phase ownership and "independently green"),
      phase 2 scope/tests, phase 3 scope/tests, phase 6 scope/tests;
      chg-GH-239-test-plan.md TC-TRUTH-001..006, TC-EVID-001..005, TC-EVID-002,
      TC-EVID-007
    gap: >-
      The plan claims each phase is independently green, but phase 2 owns
      behaviour-level TCs that require later phases. TC-TRUTH-001..005 each
      invoke `dispatch <ref>` (test plan steps at lines 709, 737, 767, 801, 829),
      but dispatch is the phase-4 command; phase 2 implements only
      dispatch-result.ts and dispatch-liveness.ts. TC-TRUTH-006 (phase 2) runs the
      summary, evaluates the gate, and invokes a bash entry point (steps 4-6),
      which are phase 6 and phase 8 surfaces. Phase 3 similarly owns
      TC-EVID-003 and TC-EVID-004 (behaviour: dispatch + summary + gate) and
      TC-EVID-007 step 5 (summary/handover parity), none of which exist until
      phase 4/6. In addition, the header assigns TC-EVID-001..007 to phase 3, but
      the TC-EVID-002 file tests/behaviour/dispatch-divergence.test.ts is scoped
      and run in phase 6, not phase 3. The plan's own test-harness note says the
      command/output/record assertions bind "from phase 4", which contradicts
      running those files in phases 2-3. The per-phase TC counts (phase 2: 12,
      phase 3: 8) are therefore also inaccurate.
    remediation_target: delivery_planning
    fix: >-
      Rebalance phase ownership and test commands: split the scenarios so
      phases 2-3 keep only pure-domain/ledger-level assertions and move the
      behaviour-level parts of TC-TRUTH-001..006 and TC-EVID-001..005/007 to the
      phase that owns the dispatch command (phase 4) and the summary/gate/
      handover (phase 6), or reorder the phases so those surfaces exist before
      the behaviour TCs run. Reconcile the header TC ownership (including
      TC-EVID-002) and the per-phase counts with @test-plan-writer.

  - id: N2
    severity: minor
    facet: plan_code_area_coverage
    artifact: >-
      chg-GH-239-plan.yaml phase 1 summary; tests/structure/error-table.test.ts
      lines 1374 and 1761
    gap: >-
      F10 remains partially closed. Phase 1 names the 113-count and dispatch-row
      invariants but not the RESERVED_TWO_SEGMENT_CODES update (adding
      dispatch.state-unverified, which is a two-segment code that fails
      CODE_PATTERN unless reserved) and its toHaveLength(35) -> 36 assertion, nor
      the spend test's delivered toHaveLength(112) -> 114 assertion. Both files
      are in phase 1 scope and both fail when the table grows to 115, so the
      phase-1 claim to change "every count and row invariant" is false.
    remediation_target: delivery_planning
    fix: >-
      Add the reserved-set entry and both assertions to the phase-1 summary and
      test plan, or explicitly require the phase to update every count/validity
      invariant in tests/structure/error-table.test.ts.

  - id: N3
    severity: minor
    facet: cross_artifact_consistency
    artifact: >-
      chg-GH-239-plan.yaml phase 1 scope (tests/structure/harness-review-deferrals.test.ts)
      and phase 7 scope; header cross-phase ownership note
    gap: >-
      Phase 1 and phase 7 both claim to invert the same harness-review-deferrals
      production-absence assertion, and the test file is not listed in the
      cross-phase ownership declaration. Phase 1 must invert it because it adds
      the dispatch.session.spawn-failed row, so phase 7's claim is redundant and
      the ownership is ambiguous.
    remediation_target: delivery_planning
    fix: >-
      Assign the harness-review-deferrals inversion to exactly one phase (phase
      1) and list the file in the cross-phase ownership note; remove the
      duplicate claim from phase 7 or narrow phase 7 to the entrypoint
      composition assertion.

  - id: N4
    severity: minor
    facet: spec_completeness
    artifact: >-
      chg-GH-239-spec.md F-4/AC-F4-1, AC-F1-4, F-12; chg-GH-239-test-plan.md
      TC-EVID-001, TC-ERR-001, TC-DISP-009
    gap: >-
      The result token for three classified failure identities is not declared:
      dispatch.session.spawn-failed, dispatch.restart-budget-exceeded, and
      dispatch.resume-uneconomical. F-4/AC-F4-1 require every attempt record to
      carry "engine outcome and token"; TC-EVID-001 expects the restart-budget and
      resume-economics refusals to append a record carrying a token; TC-ERR-001
      leaves the spawn-failure record policy as "if any". The spec does not pin
      which of the eleven tokens these refusals emit, whether a spawn failure
      appends a record, or the comparison family for those tokens.
    remediation_target: specification
    fix: >-
      Declare the result token and comparison treatment for each of the three
      failure identities, and state explicitly whether dispatch.session.spawn-failed
      appends an attempt record or is a pre-session refusal under DEC-19. Align
      TC-EVID-001 and TC-ERR-001.

  - id: N5
    severity: nit
    facet: plan_coverage
    artifact: chg-GH-239-plan.yaml phase 2 summary
    gap: >-
      Phase 2 calls noop-lane-permission a "pre-session harness refusal", while
      the glossary reserves "Pre-session refusal" for the three DEC-19 cases that
      append no record. The phrase risks conflating spawn-refused (a recorded,
      classified token) with the unrecorded DEC-19 refusals.
    remediation_target: delivery_planning
    fix: >-
      Reword phase 2 to "a harness refusal before a session exists
      (spawn-refused)" and keep "pre-session refusal" for the DEC-19 envelope-only
      cases.

  - id: N6
    severity: nit
    facet: spec_completeness
    artifact: chg-GH-239-spec.md §23 Glossary "Counted dispatch"
    gap: >-
      The glossary requires a counted dispatch's "comparison record and
      corroboration tri-state [to be] complete", while F-4/AC-F4-4 and TDR-0015 §1
      explicitly count unevaluable non-success records (for example
      state-unverified) for coverage. "Complete" should mean the fields are
      present with an explicit unknown/not-applicable marker, not fully satisfied.
    remediation_target: specification
    fix: >-
      Clarify the glossary (and DM-6 wording) that "complete" means present with
      an explicit value, and that an unevaluable non-success record remains
      counted for exposure.

