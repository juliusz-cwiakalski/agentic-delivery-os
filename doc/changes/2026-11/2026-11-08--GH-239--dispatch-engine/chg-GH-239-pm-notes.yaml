  - text: "DoR iteration 1 verdict NOT_READY (readiness/readiness-iter-1.yaml). 2
      critical + 7 major findings. Root causes: (a) the four-condition gate is
      not jointly satisfiable because class coverage requires state-unverified
      and pr-open-unverified while comparison/corroboration rules reject them;
      (b) the controlled-proof E2E cannot count its own dispatches because there
      is no evidence-class discriminator on the attempt record. Other majors:
      incident-reset window inclusivity, AC-F4-1 vs PM D6, DoD/doc-spec wording
      contradiction, daemon-path attempt record unplanned, pilot-isolation test
      misclassified as a production absence assertion, repository-identity
      fallback not rename-stable, and system-wide gate semantics with no
      decision record."
    type: blocker
    date: "2026-11-08"
