decisions:
  - text: "D1 — Handover gate definition follows the amended canonical backlog
      (GH-266 / CEO-D-073 evidence bar), not the stale two-week wording still
      quoted in the GH-239 ticket body. The backlog is canonical; the ticket
      body is reported, not edited."
    date: "2026-11-08"
  - text: "D2 — The deliverable is the handover mechanism plus its gate and records;
      actually flipping this repository to engine-authoritative is an
      operational act after real pilot evidence, not something a PR can satisfy.
      End-to-end 'handed-over repository dispatches through the new stack' is
      demonstrated on a controlled test repository/fixture."
    date: "2026-11-08"
  - text: "D3 — Dual-run comparison baseline is the token independently derived by
      verify-change (ledger/tracker truth), consistent with SC-M1-30 and
      TDR-0005 token-level parity. 'Bash stack authoritative' means dispatch
      never claims authority and never merges while the repository is in
      dual-run; it does not mean both stacks deliver the same ticket twice."
    date: "2026-11-08"
  - text: "D4 — 'dispatch' joins the prompt-required CLI composition so agents and
      the coordinator can consume it; the entrypoint, help inventory, and
      reference-page coverage are updated together, and the tests that assert
      dispatch absence are retired or inverted."
    date: "2026-11-08"
  - text: "D5 — Dependency set (M0-S8, M1-S11, M1-S17, M1-S18) is delivered on
      main-tools: verify change, harness adapters, scheduling engine, and
      resident daemon are all present, so the story is not blocked."
    date: "2026-11-08"
  - text: "D6 — Resolves test-plan OQ-T2: pre-session refusals (unknown harness,
      input rejection, lease conflict before a spawn) emit the classified
      envelope and exit without appending a dispatch attempt record, because an
      attempt record requires an outcome/token. Attempt records are appended
      only once a dispatch attempt exists (spawn attempted or resumed)."
    date: "2026-11-08"
