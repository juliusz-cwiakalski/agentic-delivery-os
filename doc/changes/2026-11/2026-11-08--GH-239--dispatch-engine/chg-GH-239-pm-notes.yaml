  - text: "Contradiction resolved: GH-239 ticket body still quotes the superseded
      rolling-two-week clean window; backlog.md now defines a composite evidence
      bar. GH-266 explicitly declares the ticket body stale and out of scope for
      editing; backlog is canonical."
    type: decision
    date: "2026-11-08"
  - text: "Scope risk (retro): GH-239 is the milestone-closer with a very large
      surface (new command, state record families, daemon planner seam, bash
      deprecation integration, 11-class gate, docs). Watch for plan phasing that
      defers AC-bearing behavior into 'documentation/tests only'."
    type: risk
    date: "2026-11-08"
  - text: "DoR iteration 1 verdict NOT_READY (readiness/readiness-iter-1.yaml). 2
      critical + 7 major findings. Root causes: (a) the four-condition gate is
      not jointly satisfiable because class coverage requires state-unverified
      and pr-open-unverified while comparison/corroboration rules reject them;
      (b) the controlled-proof E2E cannot count its own dispatches because there
      is no evidence-class discriminator on the attempt record. Other majors:
      incident-reset window inclusivity, AC-F4-1 vs PM D6, DoD/doc-spec wording
      contradiction, daemon-path attempt record unplanned, pilot-isolation test
      misclassified as a production absence assertion, repository-identity
      fallback not rename-stable, and system-wide gate semantics with no
      decision record."
    type: blocker
    date: "2026-11-08"
  - text: "Reopened specification, test_planning and delivery_planning for DoR
      iteration 1 remediation. Routing: decision record for handover-gate
      operational semantics (window reset, day floor, repository identity,
      evidence-class counting) to @decision-advisor; spec fixes F1-F5, F7-F9,
      F11-F14; test-plan fixes F1/F3/F4/F6/F11/F13/F16; plan fixes F6/F10/F15
      plus evidence-class counting in phase 10."
    type: info
    date: "2026-11-08"
  - text: "Retro: the readiness gate caught a logical impossibility (unreachable
      handover gate) that survived spec, test-plan and plan authoring. Root
      cause was treating 'class exposure' and 'clean success' as the same
      condition. Improvement: spec authors should state, for gate-style ACs, the
      positive reachability proof (an input state that makes the gate true), not
      only the refusal cases."
    type: retro
    date: "2026-11-08"
  - text: "DoR iteration 2 verdict NOT_READY (readiness/readiness-iter-2.yaml).
      Iteration-1 findings F1-F9, F11-F16 CLOSED; F10 PARTIALLY CLOSED. New
      major N1: the plan claims phase independence while phases 2-3 own
      behaviour-level TCs that need phases 4/6/8. Minors: N2 missing error-table
      count invariants, N3 duplicate harness-review-deferrals ownership, N4
      unpinned result tokens for dispatch failure classes, N5 wording conflating
      harness spawn refusal with pre-attempt refusals, N6 glossary completeness
      wording."
    type: blocker
    date: "2026-11-08"
  - text: "Reopened specification, test_planning and delivery_planning for DoR
      iteration 2 remediation (N1-N6). Iteration budget: this is iteration 3 of
      3; escalate to human if iteration 3 is NOT_READY."
    type: info
    date: "2026-11-08"
  - text: "Retro: iteration 2 found an internal contradiction the authors created
      across artifacts (phase independence vs TC ownership). Improvement: the
      plan should declare, per phase, which TCs are executable at that phase and
      which are cross-phase confirmations, and the readiness gate should check
