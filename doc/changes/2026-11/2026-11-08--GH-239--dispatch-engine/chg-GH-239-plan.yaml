        target: packages/core/src/contracts/error-table.ts
        role: producer
    doneArtifacts:
      trackerTransition: "GH-239 in progress; phase 1 evidence recorded in pm-notes notes (contracts, two dispatch error rows, F-9 production-consumer outcome)"
    leases:
      - lease:core-contracts
    weightClass: heavy
    summary: "Declare the dispatch language once in the runtime-neutral contracts tier: the three additive record kinds with payload schemas and key prefixes (`dispatch.attempt` / `delivery.dispatch.attempt.v1`, `dispatch.divergence` / `delivery.dispatch.divergence.v1`, `dispatch.handover` / `delivery.dispatch.handover.v1`), the derived `delivery.dispatch.authority.v1` view schema and its single production document name, the dispatch envelope data (`result`, `prUrl`, `phaseLedger{completed,total,variant}`, `restarts`, `resumeAmplification`, `harness`, `handoverState`, `outcome`), the summary data (window start and reason, UTC day count, counted deliveries, incidents, divergences, class coverage, corroboration, eligibility, unmet conditions), the four handover condition identifiers, the corroboration family sufficiency map, the bounded constants (5,000 attempt records per read, 65,536 machine bytes, 40 human lines, 8,192 human bytes, 20 dispatches, 7 consecutive UTC dates) and the injected authority-read port; the eleven tokens are imported from `DELIVERY_RESULT_TOKENS` and no second token list exists. Add `dispatch.session.spawn-failed` (category user, non-retryable, `not_landed`, user-validation, exit 1) and `dispatch.state-unverified` (platform, exit 2) to the machine table and to the documented rows in `doc/spec/features/feature-result-contract.md`; the two existing dispatch rows stay unchanged and resolve by exact code. This is the only planned `doc/spec/**` touch: the two documented rows are mechanically required by the two-way sync (AC-F12-1, TC-ERR-005) and carry no current-truth reconciliation, which stays with the system_spec_update phase. It also records the F-9 production-consumer outcome in `HARNESS_REVIEW_DEFERRALS` and inverts the delivered no-dispatch-surface/no-spawn-failure-row assertion, so the error row and the deferral record cannot contradict each other. No new configuration key is introduced (DEC-17): `lane.restart-budget` and `lane.liveness-interval` remain the policy homes and the evidence bounds are contract constants."
