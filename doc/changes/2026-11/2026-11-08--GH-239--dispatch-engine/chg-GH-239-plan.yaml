    summary: "Deliver the one-shot `dispatch <ref> [--harness <name>]` path end to end. Resolve the harness from the flag then configuration, refuse an unknown name as a classified input error without claiming a lease or spawning, claim the repository lease through the delivered scheduling engine, refuse an active conflicting lease without spawning, spawn through the delivered `HarnessSessionPort`, watch with the phase-2 progress verdict at the `lane.liveness-interval` cadence, classify through the shared classifier, derive truth through injected read ports, append exactly one attempt record through the phase-3 ledger, and emit the machine envelope (`result`, `prUrl`, `phaseLedger`, `restarts`, `resumeAmplification`, `harness`, `handoverState`, `outcome`) or, in text mode, exactly `result=`, `pr_url=`, `exit_code=`, `last_message=` in bash order with no fifth key and no `closeout_unverified=`. The handler returns data or a classified failure and never chooses an exit literal; the definition supplies the TDR-0005 token projection, and a failing run still emits a complete error envelope with the full error fields. A merge-ready PR stays `pr-open`/`pr-open-unverified` and no merge is fired: a declared dependency-cruiser merge-absence rule with a registered negative fixture, a source-level import scan, and a production-composition check together prove no merge port or code path is reachable (AC-F9-1, NFR-9). The phase adds the command definition, the four-key and error goldens, the dispatch runtime factory in `edge.ts`, and the `production.ts` composition (harness session ports, host spawn runner, read-only tracker/CI/VCS ports, queue lease, state store, evidence ledger); because the prompt-required set is unchanged until phase 7, the composed command is dropped from the advertised surface and composition honesty stays green."
