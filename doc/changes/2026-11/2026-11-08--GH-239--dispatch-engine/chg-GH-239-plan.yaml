    weightClass: heavy
    summary: "Prove the mechanism and release the change. Add the controlled-repository conformance suite (real state store, real local git, real change files; injected harness, tracker, CI, and VCS read ports; deterministic UTC date advance) under a composition that declares `evidenceClass: controlled-proof` for every dispatch it drives, so no dispatch is declared by a test body or read from record content. The suite accrues evidence through genuine `dispatch` invocations until the gate is met, runs the summary, flips the repository, dispatches once more end to end, reverses the flip, and invokes a bash entry point after reversal. The controlled proof must reach eligibility with all eleven classes, including an exposure-only `state-unverified` attempt (not-applicable comparison, no divergence, not blocking) and a tracker-corroborated `pr-open-unverified` attempt (`token: pr-open`, `outcome: match`, `urlResolved: false`, no divergence), with zero incidents, zero unresolved divergences, the floor met, and every success claim corroborated. Evidence-class counting is proven at both scopes: a production repository counts only `pilot` attempts and zero `controlled-proof`, `smoke`, or `fixture`; the controlled repository counts only `controlled-proof` attempts and zero `pilot`, `smoke`, or `fixture`; `smoke` and `fixture` advance no handover in either scope; and a `controlled-proof` record recorded under a production repository identity is surfaced as excluded and counts toward no floor, coverage, incident, or corroboration. A provenance guard proves every attempt, divergence, and handover record came from a real command invocation with the declared class, that the fixture API exposes no ledger writer, that the attempt count equals the dispatch count, and that no real repository, network, or model is touched (D2). Add the bounds suite (machine payload at most 65,536 bytes, human output at most 40 lines and 8,192 bytes, the bounded summary read with declared truncation instead of fabricated zeros, and p95 summary within 5 s on the reference host), the determinism suite (byte-identical repeats and zero model calls in help, summary, gate, classification, and render paths), the idempotency suite (replayed summary, handover, reversal, and resume append nothing, report noop, and consume no duplicate ordinal), and the privacy suite (no secret, credential, prompt, transcript, diff, or raw payload in output, records, help, or logs; every child environment variable declared). Then run the aggregate gate and add the minor changeset. Release obligations: exactly one PR to main-tools, a description naming the new command family, the four dispatch error rows in both the machine and documented tables, the controlled-repository proof boundary, the evidence-class counting rule, the D1 four-condition bar and D3 comparison baseline, and every Section 17 AC covered by passing evidence with the execution log populated. As the controlled proof, this phase confirms and does not re-own TC-GATE-007 (AC-F5-5), TC-GATE-011 (AC-F8-3), and TC-HAND-002 (AC-F6 flip)."
