ts to independent tracker truth (with `pr-open-unverified` equal to tracker `pr-open` plus `urlResolved: false` and no divergence), and dispatch-session attempts carry the declared not-applicable marker and are exposure-only. Degraded reads have pinned exits: an unreadable, torn, or malformed summary read exits 2 with `dispatch.state-unverified` or a delivered `state.*` identity and a verdict of unverifiable; a bounded-but-truncated valid read exits 0 with eligibility false/unverifiable, the truncation and omitted range declared, and every unmet condition named; `dispatch handover` over an unreadable or torn read exits 2 with the classified identity and no authority-changing record; `dispatch handover` over a readable-but-unmet bar exits 1 as a clean verification negative. No degraded case is eligible, no fabricated zeros are reported, and an unresolvable repository identity is the phase-3 clean exit-1 refusal. `evaluateHandoverGate(...)` returns the four-condition conjunction — zero false-success incidents and zero unresolved divergences in the window, all eleven classes as exposure, floor-only exposure (20 counted dispatches or 7 consecutive UTC dates), and corroboration of every success-claimed counted dispatch — with every unmet condition named. The positive reachability case (a controlled-scope window carrying all eleven classes, including an exposure-only `state-unverified` and a tracker-corroborated `pr-open-unverified`, with zero incidents, zero unresolved divergences, the floor met, and every success claim corroborated, evaluates eligible with no unmet condition) and the post-incident recovery case (an incident at T, then sufficient counted evidence strictly after T, evaluates eligible with zero in-window incidents and excludes the same-instant record) are named verification, not review notes. `dispatch dual-run summary --repo <repo>` reports the window, counts, coverage, corroboration, verdict, and unmet conditions at exit 0 even when ineligible; `dispatch dual-run resolve <divergence-id> --note <text>` appends the resolution; `dispatch handover <repo>` resolves the repository through the phase-3 identity resolver, refuses at exit 1 as a clean verification with no authority record when the bar is unmet, and on a met gate appends one handover record with the conditions snapshot and bounded evidence references, flips only that repository, replaces the derived view atomically, and reports the flip as recorded and reversible; `dispatch handover <repo> --revert` appends a reversal that restores dual-run, preserves the full history, and is an idempotent noop at exit 0 when the repository is already dual-run. Every dispatch reports `handoverState` from the folded ledger, claims no authority in dual-run, suppresses no bash path, and fires no merge. This phase is the earliest executable phase for TC-GATE-001..011, TC-EVID-002, and TC-HAND-001/002/003/005/006; TC-TRUTH-003/005/006, TC-EVID-003/004/005/007, TC-HAND-004, and TC-HAND-007 run here only as cross-phase confirmations of their phase-2/phase-3 slices, and TC-EVID-002's resolve command and summary are owned here while the phase-3 divergence-append primitive stays with TC-EVID-005."
