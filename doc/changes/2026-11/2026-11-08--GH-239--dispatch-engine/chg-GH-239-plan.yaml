  - id: 2
    title: "Pure dispatch domain: truth-bound derivation, failure classification, and progress-based liveness"
    kind: delivery
    scope:
      files:
        - packages/core/src/domain/dispatch-result.ts
        - packages/core/src/domain/dispatch-liveness.ts
        - packages/core/src/domain/index.ts
        - packages/core/src/index.ts
