    weightClass: heavy
    summary: "Add the durable dispatch evidence ledger over the injected state port: one fenced append plus a verified post-append read per attempt, divergence, and handover record; a fold that keeps the latest state per divergence identifier and per repository while preserving every original record; and exactly one attempt record per dispatch carrying repository identity, reference, start and finish timestamps, harness, handover state at run, engine outcome and token, comparison token or explicit not-applicable marker, divergence reference, false-success classification, tri-state corroboration, resume mode, and bounded evidence references, with no prompt, transcript, diff, credential, or raw payload. A disagreement appends an open divergence and a resolution appends a resolved record with a bounded note, principal, and timestamp without rewriting the open record; a contradicted success claim is recorded as a false-success incident and an unevaluable comparison is recorded with its classified state or provider identity. The derived per-repository authority view is rebuilt from the folded handover ledger and replaced atomically through the store document replace, under one declared production document name, and `readDispatchAuthority(stateRoot, repository)` reads that document as a plain file so a non-typed consumer needs no CLI: absent, unreadable, or malformed resolves to dual-run. Repository identity is the scheduling `repository` value with a stable checkout-root digest fallback (DEC-13), the read is bounded at 5,000 attempt records and declares truncation instead of zero, and an identical replay appends no duplicate. Fault-injection coverage proves a failed append or torn read is a classified state failure and never a clean verdict or a fabricated record."
