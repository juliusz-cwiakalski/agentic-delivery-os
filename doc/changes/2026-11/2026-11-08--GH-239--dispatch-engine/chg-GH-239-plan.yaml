        - tests/fixtures/dispatch/truth.ts
        - tests/behaviour/dispatch-truth-derivation.test.ts
        - tests/behaviour/dispatch-state-unverified.test.ts
        - tests/behaviour/dispatch-liveness.test.ts
        - tests/behaviour/dispatch-token-closure.test.ts
        - tests/behaviour/dispatch-exit-projection.test.ts
    doneArtifacts:
      trackerTransition: "GH-239 in progress; phase 2 evidence recorded in pm-notes notes (truth-bound derivation, failure classification, progress liveness)"
    leases:
      - lease:core-domain
    weightClass: heavy
    summary: "Implement the pure dispatch domain over the phase-1 vocabulary. `deriveDispatchResult(...)` is artifact-first: an exit-0 session with no branch commit, no PR, and no ledger progress is `failed` with the missing artifact named; an open PR is `pr-open`, an unresolvable PR URL `pr-open-unverified`, an independently observed merged PR `merged` as detection only, a blocking tracker state `blocked`, an exhausted lane `noop-lane-nothing-to-do` only when no work remains, a pre-session harness refusal `noop-lane-permission` meaning spawn-refused, and a timeout that exhausts liveness `max-restarts` through the restart admission path. Every branch returns a TDR-0005 token plus its harness `outcome`, so `partial` never travels alone and `noop-lane-nothing-to-do` is derived outside the shared classifier (DEC-14). `classifyDispatchFailure(...)` maps a spawn failure before a session to `dispatch.session.spawn-failed` at exit 1 and an unverifiable ledger, tracker, artifact, or state read to `dispatch.state-unverified` at exit 2, and reuses the delivered projection module instead of any call-site exit literal. The progress verdict (`lane.liveness-interval` cadence supplied as data) requires two consecutive sourced evaluations with no advance before a stalled verdict; an advancing token delta, traffic, worktree, or prefill signal keeps the lane progressing; all-absent readings report unknown/absent with their reasons, no absent reading is coerced to zero, and elapsed time alone never stalls. Nothing in the module declares a token or an exit literal outside the contracts home."
    tests:
      - "bun test tests/behaviour/dispatch-truth-derivation.test.ts tests/behaviour/dispatch-state-unverified.test.ts"
      - "bun test tests/behaviour/dispatch-liveness.test.ts"
      - "bun test tests/behaviour/dispatch-token-closure.test.ts tests/behaviour/dispatch-exit-projection.test.ts"
      - "bun test tests/structure/delivery-result-contract.test.ts tests/structure/result-contract.test.ts"
      - "pnpm typecheck"
