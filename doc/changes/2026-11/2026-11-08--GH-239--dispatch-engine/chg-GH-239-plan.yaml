    doneArtifacts:
      trackerTransition: "GH-239 in progress; phase 3 evidence recorded in pm-notes notes (attempt/divergence/handover ledgers, evidence class, comparison record, rename-invariant identity, atomic authority view)"
    leases:
      - lease:dispatch-evidence
    weightClass: heavy
    summary: "Add the durable dispatch evidence ledger over the injected state port: one fenced append plus a verified post-append read per attempt, divergence, and handover record; a fold that keeps the latest state per divergence identifier and per repository while preserving every original record; and exactly one attempt record per dispatch that reaches classification, carrying repository identity, reference, start and finish timestamps, harness, the declared `evidenceClass`, handover state at run, engine outcome and token, the comparison record, divergence reference, false-success classification, tri-state corroboration, resume mode, and bounded evidence references, with no prompt, transcript, diff, credential, or raw payload. `evidenceClass` is a closed union of exactly `pilot`, `controlled-proof`, `smoke`, and `fixture`: it is attached at record creation from a declared invocation/composition input or the documented configuration default, validated at the append boundary, never inferred from the outcome, never read from a supplied record payload, and immutable after append — a second append or in-place mutation that escalates `fixture`, `smoke`, or `controlled-proof` to `pilot` is refused and the original record stays byte-identical. `buildComparisonRecord(...)` is the one declared comparison shape and the only family classifier: `class` in `verify-change | tracker-truth | not-applicable`, `token` a TDR-0005 token or null, `outcome` in `match | mismatch | not-applicable`, optional `reason`, and `urlResolved` for tracker facts, with `token = null` if and only if the class is `not-applicable`, `outcome = not-applicable` if and only if the class is, and a divergence appended if and only if the outcome is `mismatch`. Verify-class tokens (`failed`, `finished`, `partial`) compare by exact token equality with the verify-change ledger outcome for the same reference; the two dispatch-derived `failed` pairs (the spawn failure and the resume-economics refusal) have no independently derived verify-change outcome for that attempt and therefore carry `not-applicable` with reason `comparison-source-unavailable`, exposure-only and divergence-free (Appendix G); `state-unverified` carries `not-applicable` with reason `comparison-source-unavailable` and is exposure-only; tracker-pr tokens (`merged`, `blocked`, `pr-open`) compare to independent tracker truth at PR-state granularity, and `pr-open-unverified` equals tracker truth `pr-open` with `urlResolved: false` and no divergence; dispatch-session tokens (`max-restarts`, `noop-lane-permission`, `noop-lane-nothing-to-do`) carry `not-applicable` with reason `dispatch-session-family` and are exposure-only. Repository identity is resolved by `resolveDispatchIdentity(...)` in the TDR-0015 order: the scheduling engine's normalized `repository` key (`host/owner/name`) first, then the checkout's configured VCS remote normalized through the delivered `normalizeRepositoryKey`, then a persisted first-use identity marker created once through the state layer's store-managed artifact get-or-create with guard kinds and runtime-edge random material (adapter `file/dispatch-identity.ts`) and never derived from the checkout path. The first successful step is persisted as the checkout binding and reused across a checkout rename, a remote change, and a restart without re-keying history; when none resolves, the caller refuses cleanly at exit 1 with a classified exit-1 identity refusal reusing the delivered `input.value.rejected` user-validation identity and appends nothing. A checkout-path digest is never recorded, persisted, or presented as a repository identity, and the withdrawn DEC-13 path-digest fallback appears nowhere in the code or records. A disagreement appends an open divergence and a resolution appends a resolved record with a bounded note, principal, and timestamp without rewriting the open record; a contradicted success claim is recorded as a false-success incident and an unevaluable comparison is recorded with its classified state or provider identity, degrading only that record. The derived per-repository authority view is rebuilt from the folded handover ledger and replaced atomically through the store document replace, under one declared production document name, and `readDispatchAuthority(stateRoot, repository)` reads that document as a plain file so a non-typed consumer needs no CLI: absent, unreadable, or malformed resolves to dual-run. The read is bounded at 5,000 attempt records and declares truncation instead of zero, and an identical replay appends no duplicate. Fault-injection coverage proves a failed append or torn read is a classified state failure and never a clean verdict or a fabricated record. The production-default `pilot` declaration is wired in phase 4 and the controlled `controlled-proof` declaration in phase 10; this phase asserts the record-level rules with injected declarations. This phase asserts only the ledger, identity, and record-level slices of its owned TCs: it invokes no `dispatch`, `dual-run summary`, `handover`, or bash command; the command-level confirmations of TC-EVID-001 and TC-EVID-006 run in phase 4, and the summary/window/handover confirmations of TC-EVID-003/004/005/007 and TC-HAND-004/TC-HAND-007 run in phase 6."
