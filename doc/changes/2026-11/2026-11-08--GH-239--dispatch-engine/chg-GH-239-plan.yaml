    weightClass: heavy
    summary: "Deliver the evidence gate and the authority mechanism with one declared predicate home. `foldEvidenceWindow(...)` folds the bounded attempt, divergence, and handover ledgers into the window (start is the later of the first counted dispatch and the most recent false-success incident, with the reason reported), the UTC day count over distinct dates in a run of at least seven consecutive dates, counted deliveries, incidents, reported/resolved/unresolved divergences with identifiers, class coverage over the eleven TDR-0005 tokens with missing classes named, and per-family corroboration; an unreadable, torn, or truncated read is unverifiable and never eligible, and an unresolvable repository identity is a clean refusal. `evaluateHandoverGate(...)` returns the four-condition conjunction — zero false-success incidents and zero unresolved divergences, all eleven classes, floor-only exposure (20 counted dispatches or 7 consecutive UTC dates), and corroboration per outcome family — with every unmet condition named. `dispatch dual-run summary --repo <repo>` reports the window, counts, coverage, corroboration, verdict, and unmet conditions at exit 0 even when ineligible; `dispatch dual-run resolve <divergence-id> --note <text>` appends the resolution; `dispatch handover <repo>` refuses at exit 1 as a clean verification with no authority record when the bar is unmet, and on a met gate appends one handover record with the conditions snapshot and bounded evidence references, flips only that repository, replaces the derived view atomically, and reports the flip as recorded and reversible; `dispatch handover <repo> --revert` appends a reversal that restores dual-run, preserves the full history, and is an idempotent noop at exit 0 when the repository is already dual-run. Every dispatch reports `handoverState` from the folded ledger, claims no authority in dual-run, suppresses no bash path, and fires no merge."
