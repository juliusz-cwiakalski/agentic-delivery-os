    summary: "Deliver `--resume-prompt <text>` and dispatch admission. Resolve the existing lane, record the resume mode (`attach-continue`, or `resume-prompt-reentry` with its acknowledged prefill cost when the adapter lacks resume injection), continue from the phase-ledger position, and skip completed phases idempotently without re-executing them. Restart admission delegates to the delivered restart-budget gate with the bound resolved from `lane.restart-budget`: at or above the bound the attempt is refused at exit 1 with `dispatch.restart-budget-exceeded`, the delivered terminal exhaustion record is present, a typed escalation is surfaced, no spawn occurs, and the delivery is never silently requeued. Resume economics delegates to the delivered admission: attach-and-continue consumes no restart ordinal, an uneconomical prefill re-pay is refused with `dispatch.resume-uneconomical`, and unreadable token or cost facts refuse or classify unevaluable instead of admitting. The recorded resume mode, prefill acknowledgement, and admission verdict are carried onto the attempt record, and an identical replay converges on the same lane position with no duplicate ordinal and no second spawn. The phase extends the phase-4 loop and command surface additively."
