    summary: "Declare the dispatch language once in the runtime-neutral contracts tier: the three additive record kinds with payload schemas and key prefixes (`dispatch.attempt` / `delivery.dispatch.attempt.v1`, `dispatch.divergence` / `delivery.dispatch.divergence.v1`, `dispatch.handover` / `delivery.dispatch.handover.v1`), the derived `delivery.dispatch.authority.v1` view schema and its single production document name, the dispatch envelope data (`result`, `prUrl`, `phaseLedger{completed,total,variant}`, `restarts`, `resumeAmplification`, `harness`, `handoverState`, `outcome`), the summary data (window start and reason, UTC day count, counted deliveries, counted evidence class and cross-class exclusions, incidents, divergences, class coverage, corroboration, eligibility, unmet conditions), the four handover condition identifiers, the corroboration family sufficiency map, the bounded constants (5,000 attempt records per read, 65,536 machine bytes, 40 human lines, 8,192 human bytes, 20 dispatches, 7 consecutive UTC dates) and the injected authority-read port; the eleven tokens are imported from `DELIVERY_RESULT_TOKENS` and no second token list exists. Declare the closed `evidenceClass` union (`pilot | controlled-proof | smoke | fixture`) and the comparison record shape (class, token or null, outcome, optional reason, `urlResolved`) as contract types, so every later phase consumes one declaration. Add `dispatch.session.spawn-failed` (category user, non-retryable, `not_landed`, user-validation, exit 1) and `dispatch.state-unverified` (platform, non-retryable, `not_landed`, platform-provider, exit 2) to the machine table after the two existing rows, and mirror all four dispatch rows in `doc/spec/features/feature-result-contract.md`; the two existing dispatch rows stay byte-identical and every dispatch failure resolves by exact code. The table grows from 113 to 115 identities, so this phase must change every count, reserved-set, and row invariant the same phase's tests enforce, in one edit: the four `toHaveLength(113)` assertions in `tests/structure/error-table.test.ts` become 115; the assertion pinning the `113 identities` phrase becomes 115; `RESERVED_TWO_SEGMENT_CODES` gains `dispatch.state-unverified` as a reserved two-segment code and its `toHaveLength(35)` assertion becomes 36, because the delivered `CODE_PATTERN` refuses an unreserved two-segment code; the delivered-table `toHaveLength(112)` assertion becomes 114; `DISPATCH_ROWS` grows from two to four rows in table order; the `dispatch` kind assertions `toHaveLength(2)` and the prose expectation that the `dispatch` kind carries exactly the two economics identities become four; and the same table's documented-row, hint, projection, and byte-identity rows for the two existing codes stay unchanged. In `doc/spec/features/feature-result-contract.md`, the four dispatch rows, the frontmatter summary phrase naming the two dispatch economics rows, the two prose counts (the `113 machine identities` sentence and the `same 113 identities` sentence, including the two-dispatch-economics-rows enumeration), and the `dispatch.session.spawn-failed` is not yet declared (M1-S9) sentence change together, and that last sentence is replaced by the declared four-row description. `tests/checks/error-table-sync.test.ts` updates its live kind-count expectation `dispatch: 2` to 4. The phase cannot go green on an incomplete documented table: the structure count assertions, the documented-row assertions, the two-way sync check, and the standalone sync script all run here, so a machine row without its documented row (or a stale 113) fails the phase. This is the only planned `doc/spec/**` touch and carries no current-truth reconciliation, which stays with the system_spec_update phase. It also records the F-9 production-consumer outcome in `HARNESS_REVIEW_DEFERRALS` and inverts the delivered no-dispatch-surface/no-spawn-failure-row assertion, so the error rows and the deferral record cannot contradict each other. No new configuration key is introduced (DEC-17): `lane.restart-budget` and `lane.liveness-interval` remain the policy homes and the evidence bounds are contract constants."
