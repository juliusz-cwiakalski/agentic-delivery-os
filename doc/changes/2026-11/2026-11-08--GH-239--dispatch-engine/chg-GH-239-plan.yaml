# GH-239 delivery plan. `tests` is delivery evidence for plan review; it is not a
# plan-schema field. Phase progress stays in pm-notes `notes:` entries.
#
# Ceremony: one ticket, one PR targeting main-tools. The ten phases are sequenced
# so each is independently green on its declared slice set (see the phase-
# independence block below) and independently committable: contracts before the
# pure domain, the pure domain before the ledger, the ledger before orchestration,
# orchestration before the gate and handover, and the end-to-end proof last. No
# phase depends on a later phase to compile or to assert.
#
# Coverage: 53/53 spec acceptance criteria (Section 17, AC-F1-1 through
# AC-NFR9-1) and 82/82 test-plan TCs (TC-DISP-001 through TC-REG-001) are mapped
# to exactly one owning phase each, where the owning phase is the TC's earliest
# executable phase in test-plan Section 7.5. Owning phase per TC:
#   phase 1  (2 ACs, 5 TCs): AC-F12-2, AC-NFR1-1; TC-DISP-008, TC-ERR-003,
#            TC-ERR-005, TC-TOKEN-001, TC-TOKEN-002
#   phase 2  (5 ACs, 12 TCs): AC-F1-2, AC-F2-1..AC-F2-4; TC-DISP-003/004/005/
#            009/011/012, TC-TRUTH-001..TC-TRUTH-006
#   phase 3  (6 ACs, 8 TCs): AC-F4-1..AC-F4-6; TC-EVID-001, TC-EVID-003..007,
#            TC-HAND-004, TC-HAND-007
#   phase 4  (8 ACs, 12 TCs): AC-F1-1, AC-F1-3, AC-F1-4, AC-F9-1, AC-F9-2,
#            AC-F12-1, AC-F12-3, AC-NFR9-1; TC-DISP-001/002/006/007/010,
#            TC-MERGE-001..TC-MERGE-004, TC-ERR-001/002/004
#   phase 5  (4 ACs, 4 TCs): AC-F3-1..AC-F3-4; TC-RESUME-001..TC-RESUME-004
#   phase 6  (13 ACs, 17 TCs): AC-F5-1..AC-F5-6, AC-F6-1..AC-F6-6, AC-F8-3;
#            TC-GATE-001..TC-GATE-011, TC-EVID-002,
#            TC-HAND-001/002/003/005/006
#   phase 7  (3 ACs, 4 TCs): AC-F11-1..AC-F11-3; TC-HELP-001..TC-HELP-003,
#            TC-PLANREC-001
#   phase 8  (4 ACs, 5 TCs): AC-F7-1..AC-F7-3, AC-NFR8-1; TC-BASH-001..TC-BASH-005
#   phase 9  (3 ACs, 3 TCs): AC-F10-1..AC-F10-3; TC-DAEMON-001..TC-DAEMON-003
#   phase 10 (5 ACs, 12 TCs): AC-F8-1, AC-F8-2, AC-NFR4-1, AC-NFR6-1, AC-NFR7-1;
#            TC-E2E-001..TC-E2E-003, TC-NFR-001..TC-NFR-007, TC-DET-001,
#            TC-REG-001
#
# Phase independence (mirrors test-plan Section 7.5). A phase may go green only
# on the slices whose earliest executable phase is at or before it. A later-layer
# slice of an earlier-owned TC is a cross-phase confirmation: it is run in the
# phase named below, never as a phase-green requirement of an earlier phase, and
# it never transfers TC ownership. This is the verifiable statement of "every
# phase independently green":
#   phase 1  executable: TC-DISP-008 (structure token home), TC-ERR-003,
#            TC-ERR-005, TC-TOKEN-001, TC-TOKEN-002. confirmations: none.
#   phase 2  executable: TC-DISP-003/004/005 (pure liveness), TC-DISP-009 (pure
#            projection), TC-DISP-011 (classification slice), TC-DISP-012 (pure
#            derivation), TC-TRUTH-001..TC-TRUTH-006 (pure derivation and
#            classification slices). No `dispatch` invocation and no ledger
#            append. confirmations: TC-DISP-008 (token closure).
#   phase 3  executable: TC-EVID-001 (ledger record and type), TC-EVID-003
#            (false-success record), TC-EVID-004 (record-level degradation),
#            TC-EVID-005 (append/torn record), TC-EVID-006 (class declaration,
#            immutability, and type), TC-EVID-007 (unit comparison shape and
#            type), TC-HAND-004 (authority-view structure), TC-HAND-007
#            (identity resolution order, marker reuse, rename/restart
#            invariance). No `dispatch`, `dual-run summary`, `handover`, or bash
#            invocation. confirmations: TC-DISP-011 (ledger record), TC-TRUTH-001
#            (ledger record), TC-TRUTH-002 (comparison record), TC-TRUTH-005
#            (ledger record), TC-TRUTH-006 (ledger record).
#   phase 4  executable: TC-DISP-001/002/006/007/010, TC-MERGE-001..004,
#            TC-ERR-001/002/004. confirmations: TC-DISP-009 (process exit),
#            TC-DISP-011 (command refusal and record), TC-TRUTH-001..004
#            (command path), TC-EVID-001 (command record), TC-EVID-006
#            (production default class).
#   phase 5  executable: TC-RESUME-001..004. confirmations: none.
#   phase 6  executable: TC-GATE-001..011, TC-EVID-002, TC-HAND-001/002/003/
#            005/006. confirmations: TC-TRUTH-003 (summary/gate), TC-TRUTH-005
#            (corroboration), TC-TRUTH-006 (window), TC-EVID-003/004/005/007
#            (summary/window/parity), TC-HAND-004 (handover fold parity),
#            TC-HAND-007 (unresolvable refusal).
#   phase 7  executable: TC-HELP-001/002/003, TC-PLANREC-001. confirmations:
#            none (the phase-4 pre-inversion run of the entrypoint assertion is
#            recorded in phase 4, not here).
#   phase 8  executable: TC-BASH-001..005. confirmations: TC-TRUTH-006 (bash
#            fallback slice).
#   phase 9  executable: TC-DAEMON-001..003. confirmations: none.
#   phase 10 executable: TC-E2E-001..003, TC-NFR-001..007, TC-DET-001,
#            TC-REG-001. confirmations: TC-GATE-007 (AC-F5-5), TC-GATE-011
#            (AC-F8-3), TC-HAND-002 (AC-F6 flip).
# A phase's own `tests` list is limited to its executable slices plus the
# confirmations assigned to it above; no phase claims a TC whose earliest
# executable phase is later.
#
# Cross-phase AC/TC confirmation is deliberate and additive: AC-F5-5 is owned by
# the phase-6 positive gate case and confirmed by the phase-10 controlled proof;
# AC-F8-3 counting is owned by the phase-6 predicate and confirmed by the phase-10
# proof; AC-F12-1 rows land in phase 1 and its classification is confirmed in
# phase 4; AC-F12-2 rows also land in phase 1 and the refusal behaviour is
# confirmed in phases 4 and 5; AC-F6-1/AC-F6-2 flips are owned by phase 6 and
# confirmed by the phase-10 reversal proof.
#
# Cross-phase file ownership (declared because these files are touched by more
# than one phase, or are delivered files one phase extends; the earliest
# declaration is the shared interface and every later phase extends it
# additively — no later phase may rewrite, reorder, or remove an earlier phase's
# declaration):
# - `packages/core/src/app/dispatch.ts` — phase 4 creates the fresh-run loop,
#   phase 5 adds resume admission to the same loop.
# - `packages/cli/src/commands/dispatch.ts` — phase 4 creates the run form,
#   phase 5 adds `--resume-prompt` handling, phase 6 adds `dual-run summary`,
#   `dual-run resolve`, and `handover --revert`.
# - `packages/cli/src/output/dispatch-text.ts` — phase 4 creates the four-key and
#   error renderers, phase 6 adds the summary and handover renderers.
# - `packages/cli/src/edge.ts` — phase 4 creates the dispatch runtime factory,
#   phases 5 and 6 extend it with the resume and gate/handover capabilities.
# - `packages/core/src/app/daemon-supervision.ts` — phase 9 adds one optional
#   collection seam additively; the delivered supervision modes are unchanged.
# - `packages/core/src/index.ts`, `packages/core/src/domain/index.ts`, and
#   `packages/core/src/app/index.ts` are the shared barrels: phases 2 through 9
#   each append their own export line and no phase rewrites or re-orders another
#   phase's line. The same additive-extend rule applies to the test inventory
#   manifests (`tests/structure/inventory.json` and the `EXECUTABLE_ALLOWANCES`
#   table in `tests/structure/content-inventory.test.ts`): every phase that adds
#   a source file adds its own two entries; this is bookkeeping, never behavior.
# - Shared test files, extended additively: `tests/behaviour/dispatch-evidence-class.test.ts`
#   (phase 3 record-level rules, phase 4 production default, phase 6 counting per
#   repository scope, phase 10 controlled declaration), `tests/behaviour/dispatch-identity.test.ts` (phase 3 resolution
#   order and marker reuse, phase 6 unresolvable-identity refusal), and
#   `tests/types/dispatch-contract.type-test.ts` (phase 1 record types, phase 3
#   evidence-class and comparison unions).
# - `tests/structure/harness-review-deferrals.test.ts` is phase-1-owned: phase 1
#   delivers the phase-1 TC-HELP-003 harness-review-deferrals record slice (the
#   F-9 production-consumer outcome and its inverted assertion land with the
#   spawn-failure row); phase 7 owns only the inverted entrypoint assertion and
#   the narrowed pilot comment.
#   updates the F-9 deferral record and inverts its assertion in the same edit as
#   the `dispatch.session.spawn-failed` row, so the row and the deferral record
#   cannot contradict each other. No other phase declares this file, and phase 7
#   must not edit or re-run it.
#
# Test harness note: dispatch behaviour suites drive `runCli` with an injected
# command program, which is the same surface `runEntrypoint` delegates to and the
# convention every delivered command suite already uses. `dispatch` joins the
# prompt-required set in phase 7, so the entrypoint path is asserted there by the
# updated composition and help-coverage suites; the behavior, command, output,
# record, and exit assertions of every scenario stay binding from phase 4.
#
# Absence-assertion note: only the two production-surface assertions are retired
# or inverted (`tests/behaviour/entrypoint-composition.test.ts`, inverted in
# phase 7, and `tests/structure/harness-review-deferrals.test.ts`, inverted in
# phase 1 and phase-1-owned).
# `tests/conformance/pilot/pilot-isolation.test.ts` guards a deliberately reduced
# test-only fixture: its exact command list and its non-import of
# production/entrypoint stay unchanged, dispatch is never composed into it, and
# only the stale name/comment is narrowed.
#
# Evidence-semantics note: the gate's durable operational semantics are TDR-0015
# (evidence-class counting, incident-exclusive window, floor, comparison shape,
# repository identity, reversal idempotency). This plan applies them; it does not
# restate or reinterpret them, and no phase re-derives family membership.
#
# Documentation boundary: the only planned `doc/spec/**` touch is the documented
# error-table rows and their prose in `feature-result-contract.md` (phase 1),
# because the delivered two-way error-table sync refuses a machine row with no
# documented row and a green phase requires it. That is row data plus the counts
# the same phase's tests assert, not current-truth reconciliation: every other
# `doc/spec/**` change stays with the lifecycle system_spec_update phase owned by
# @doc-syncer.
#
# Planning reconciliation is limited to the two story-owned surfaces the spec
# names (`commands/dispatch.md` and SC-M1-29/SC-M1-30 in `test-scenarios.md`);
# the GH-239 ticket body and the remaining planning residual are reported, never
# edited.
