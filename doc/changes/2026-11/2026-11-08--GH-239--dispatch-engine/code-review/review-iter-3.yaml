  - id: F-20
    severity: low
    confidence: medium
    category: correctness
    location: packages/adapters/src/file/dispatch-identity.ts:41-53
    message: >-
      The create-once marker is written non-atomically with a single
      `writeFileSync(path, content, { flag: "wx" })`, and every write error is
      swallowed. Because the file is never overwritten, a crash or partial write
      that leaves a torn marker is permanent: `parseIdentityMarker` returns
      undefined, `resolveDispatchIdentity` falls back to the scheduler key/remote
      (ungoverned, so a later remote change can re-key history), and `ensure`
      can never repair it because `wx` fails on the existing file and the
      read-back returns the torn content unexamined. The doc already states an
      unpersistable marker never changes the resolved identity, so silent
      degradation is intended; the unrepairable state is not.
    suggestion: >-
      Write to a sibling temporary file and hard-link/rename it into place (or
      open with 'wx', write, fsync, close, and delete on failure), and treat an
      unparseable existing marker as absent-and-replaceable while keeping
      create-once for a valid marker.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-21
    severity: low
    confidence: high
    category: documentation
    location: doc/planning/oss-tooling/milestones/m1/commands/dispatch.md:31-38
    message: >-
      The dispatch command reference page still states "A corroborated stall at
      or above `lane.restart-budget` is the restart-budget refusal" with no
      qualifier, so it describes the pre-F-16 latched semantics: it omits both
      that a later `progressing` observation clears a transient stall and that a
      completed session is never re-keyed to `max-restarts` by an
      already-reached bound. `feature-dispatch-engine.md`,
      `feature-session-lifecycle-economics.md` and the test spec were
      reconciled; this help-linked page (the entrypoint's help entries point at
      it) was not.
    suggestion: >-
      Add the "stall that is still current when evidence collection resolves"
      qualifier and the completed-session exemption to the reference page — it
      is one of the two planning files the change is allowed to reconcile
      (OQ-T6).
    suppressed: false
    published_url: null
    published_at: null

  - id: F-23
    severity: low
    confidence: medium
    category: spec-compliance
    location: doc/decisions/TDR-0015-dispatch-handover-gate-operational-semantics.md:427
    message: >-
      TDR-0015 §6 states that when a later derived value disagrees with the
      persisted binding, "the discrepancy is recorded as a bounded attribute,
      not a new repository identity". No record carries that attribute:
      `DispatchAttemptRecord.engineIdentity` (contracts/dispatch.ts:205) is
      declared and never produced anywhere in `packages/**`, and
      `resolveProductionRepository` discards the source and any disagreement.
      Because the marker now governs over a disagreeing scheduler key, a
      dispatch of a ref queued for another repository is silently attributed to
      the checkout's binding with no trace. No AC requires the attribute, so
      this is record-completeness rather than behavior.
    suggestion: >-
      Either populate `engineIdentity` with the scheduler key when it differs
      from the governing binding (and document that it is the recorded
      discrepancy), or narrow the TDR §6 sentence to the behavior actually
      delivered so the record and the code agree.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-22
    severity: info
    confidence: high
    category: process
    location: doc/changes/2026-11/2026-11-08--GH-239--dispatch-engine/code-review/
    message: >-
      `code-review/review-iter-1.yaml`, `review-iter-2.yaml` and now
      `review-iter-3.yaml` are the only untracked paths in the tree, and no
      plan phase declares `code-review/` in its scope. The pm-notes iteration-1
      entry already records that the commit primitive does not stage the review
      folder, so the durable review record for this change will not land in the
      PR unless the review-phase commit is given the folder explicitly.
    suggestion: >-
      Include `doc/changes/.../code-review/` in the review-phase commit (or
      declare it in the plan) so the review gate evidence travels with the PR.
    suppressed: false
    published_url: null
    published_at: null

