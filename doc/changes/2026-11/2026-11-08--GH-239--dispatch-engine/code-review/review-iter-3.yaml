summary: >-
  Third and final review, after remediation commits 10857a2c (F-15, F-16,
  tests, spec/TDR/feature reconciliation), 74412769 (pm-notes evidence) and the
  doc-verification pass 44ad1208. Both blocking findings are closed and I
  re-proved them myself rather than trusting the added suites. F-15: the
  identity binding is now a create-once marker inside the checkout's git common
  directory (`<git-common-dir>/dispatch-identity.json`); through
  `createProductionComposer` two checkouts in one home recorded GH-901 under
  acme/alpha and GH-902 under acme/beta with distinct markers, a third
  checkout's read-only `dual-run summary --repo` (foreign and own repo) created
  no marker and never re-keyed a later dispatch (the exact F-15 regression
  shape now records acme/gamma), a renamed checkout with a changed remote and
  scheduler key kept its acme/alpha binding, and a linked worktree resolved the
  main checkout's common directory and shared its marker (24/24 probes). F-16:
  a latching stall is gone (a `progressing` verdict clears it) and
  `deriveDispatchResult` no longer re-keys a completed session to
  `max-restarts`; a transient stall followed by progress classifies `finished`
  at an exhausted budget, while a persistently stalled session at the bound
  still refuses `max-restarts` with the terminal exhaustion record and one
  attempt record. No regression found in the adapter read/write paths (no
  marker was written into the real repository's git dir by any suite or probe),
  the `persist` gate-read separation, secret/privacy bounds, or the merge
  absence. `TMPDIR="$PWD/tmp/tmpdir" pnpm check` is EXIT 0 (6442 pass / 4 skip /
  0 fail across 767 files; boundaries, ambient globals, workspace entrypoints,
  secret-read boundary, prompt conformance, help coverage, exports parity
  green); the dispatch suites (246 pass across 44 files), the watch/identity/
  composition trio (34 pass), dispatch conformance plus doc conformance (12
  pass) and the bash fallback matrix (5/5) all pass. Remaining findings are
  hygiene only: two stale code docblocks that still describe a store-managed
  marker, one undeclared supporting adapter file in the plan scope, one lost
  derivation-level assertion for the restart-budget branch, a non-atomic
  create-once marker write, a command reference page that still describes the
  latched stall, an unimplemented "recorded discrepancy" sentence in TDR-0015
  §6 with a dead `engineIdentity` field, and the still-untracked review
  artifacts. Severity: 0 critical / 0 high / 0 medium / 6 low / 1 info, with
  F-14 carried as an open info item from the prior iteration.
