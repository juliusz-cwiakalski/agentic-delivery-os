summary: >-
  First substantive review. The delivered library surface is strong: the closed
  token taxonomy is untouched (11/11), the four-key text summary is exact, the
  Appendix G failure-token mapping (spawn-failed, restart-budget, resume-economics,
  spawn-refused, and the three unrecorded pre-session refusals) is implemented and
  tested, the evidence-class counting and incident-exclusive window are correct,
  the four-condition gate is reachable (including exposure-only `state-unverified`
  and tracker-corroborated `pr-open-unverified`), the controlled-proof E2E runs
  through the real state store and command path, the bash fallback is CLI-independent
  and the three absence assertions are handled correctly (only the two
  production-surface assertions are inverted; pilot-isolation stays reduced), and
  `dispatch` is registered in the prompt-required surface. The blocker is the
  production composition: `createProductionComposer`/`packages/cli/bin/delivery-os.ts`
  builds a run-only dispatch runtime. It composes the real harness ports and real
  truth reads, but it does NOT compose `gate`, `existingLane`, `restartBudget`, or the
  repository-identity resolver. Empirically (probes run for this review),
  `dispatch dual-run summary|resolve` and `dispatch handover` return
  `input.value.rejected` at exit 1 in the shipped CLI, and `dispatch <ref>
  --resume-prompt` spawns a fresh `opencode run --format json` with no `resumeMode`
  recorded. So F-5/F-6/F-11 and the entire resume path (F-3) are proven only through
  the edge factory in tests, not delivered by the product. Additionally the handover
  is not idempotent under a real clock, the `pr-open-unverified` comparison baseline
  is not independent, and an unreadable corroboration source resets the evidence
  window. Severity: 0 critical / 3 high / 5 medium / 5 low / 1 info.
