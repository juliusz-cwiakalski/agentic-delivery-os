findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:702-808
    message: >-
      The shipped production composition (`createProductionComposer`, used by
      `packages/cli/bin/delivery-os.ts`) constructs `const dispatch =
      { run: {...} }` only. `dispatchComposition` passes no `gate`, so
      `createDispatchCommandRuntime` exposes no `summary`, `resolve`, or `handover`
      capability (edge.ts:4587), and the command handler returns
      `input.value.rejected` for all three. Empirically, `dispatch dual-run summary
      --repo X`, `dispatch dual-run resolve DIV-1 --note x`, and `dispatch handover X`
      all exit 1 with `error.code=input.value.rejected` against the real production
      composer. F-5, F-6, and F-11 and AC-F5-1..4 / AC-F6-1..6 / AC-F11-1 are only
      proven through the test fixture/edge composition; the delivered CLI advertises
      them in help but cannot run them. The controlled-proof E2E uses
      `createControlledRepo` (edge composition with `gate`), so it does not catch
      this.
    suggestion: >-
      Compose the gate in the production dispatch runtime: set `gate: { scope:
      "production", principal: <resolved principal>, resolveRepository: <resolve via
      resolveDispatchIdentity> }` in `dispatchComposition`, and add a
      production-composition test that drives `summary`/`handover`/`resolve` through
      `createProductionComposer` (as `dispatch-composition.test.ts` already does for
      `run`). Do not advertise the surfaces in help until they are composed.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-2
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:702-748
    message: >-
      `dispatchComposition` provides no `existingLane` and no `restartBudget`
      (production.ts), so in the shipped CLI `createDispatchCommandRuntime`
      (edge.ts:4512-4513) never resolves a lane, `admission` is never computed
      (edge.ts:4517-4551), and `runDispatch` sees `resumePrompt` but no
      `existingHandle`, so it spawns fresh. Empirically `dispatch GH-301
      --resume-prompt 'keep going'` executed `opencode run --format json` (a spawn,
      not `--session` resume) and the attempt record had `resumeMode: undefined`.
      Consequently AC-F3-1 (resume existing lane + recorded mode), AC-F3-2
      (restart-budget refusal with the terminal exhaustion record — the one-shot path
      never calls `ensureEconomicsExhaustionRecord`), AC-F3-3 (resume economics), and
      AC-F3-4 (idempotent replay) are not enforced in the product. `lane.restart-budget`
      is never resolved. The controlled-proof/harness-resume tests pass only because
      the fixture supplies `existingLane`/`restartBudget` directly to the edge factory.
    suggestion: >-
      Compose `existingLane` from the delivered lane facts (and/or `readDaemonLanes`)
      and resolve `lane.restart-budget` into `restartBudget` in `dispatchComposition`;
      ensure a restart-budget refusal appends the delivered terminal exhaustion
      record in the one-shot path (as the daemon path does with
      `ensureEconomicsExhaustionRecord`); add a production-composition resume test.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-3
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:223
    message: >-
      Production resolves repository identity with
      `normalizeRepositoryRemote(repositoryFacts.originUrl)` only. The delivered
      `resolveDispatchIdentity` (scheduler key -> normalized remote -> persisted
      first-use marker) and `ensureDispatchIdentityMarkerText` are implemented and
      unit-tested but never called from any composition (only domain exports and
      tests reference them). Therefore AC-F6-2's declared identity resolution order
      and AC-F6-6's rename/remote-change/restart invariance are not satisfied by the
      command: a remote change re-keys `repository` on subsequent attempt records and
      authority, exactly what DEC-13/TDR-0015 §6 forbid. Plan phase 4 explicitly
      declared the production composition to include "the identity resolver".
    suggestion: >-
      Resolve identity in the composition via `resolveDispatchIdentity({ schedulerKey,
      remoteUrl, persistedMarker })` using the scheduling engine's normalized key, the
      normalized remote, and the store-managed marker (`readDispatchIdentityMarkerText`
      / `ensureDispatchIdentityMarkerText`), persisting the first successful binding and
      refusing cleanly when none resolves; add a production-path rename/remote-change
      test.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-4
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch-gate.ts:188-239
    message: >-
      `handoverDispatchEvidence` does not consult the current authority before
      appending; `appendDispatchHandover` (dispatch-ledger.ts:351-373) de-duplicates
      only an identical `(repository, operation, recordedAt)`. Under a real clock a
      second identical `dispatch handover` appends a second handover record and
      reports `{recorded:true, noop:false}` (probe: two calls at t and t+5min -> 2
      records), violating AC-NFR6-1 / NFR-6 ("Replaying an identical handover appends
      0 duplicate records ... a noop is reported instead of a second effect"). The
      idempotency test (tests/behaviour/dispatch-idempotency.test.ts:44-58) passes
      only because tests/fixtures/dispatch/golden/harness.ts:149 freezes `nowIso`, so
      the second append is byte-identical; the assertion is weakened and does not
      exercise a real replay.
    suggestion: >-
      Before appending, fold the handover ledger; if the repository is already
      `authoritative` return `{recorded:false, noop:true, verdict}` without a new
      record. Add an idempotency test with an advancing clock (or two distinct
      `nowIso` values) asserting exactly one handover record.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-5
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:632-642
    message: >-
      `trackerTokenOf` maps an open PR with an unresolved URL to
      `pr-open-unverified`, and `comparisonFor` (app/dispatch.ts:198-206) uses
      `reads.trackerToken` as the "independent" baseline. So in production a
      `pr-open-unverified` attempt records a comparison row whose token is
      `pr-open-unverified` with outcome `match`
      (codified by tests/structure/dispatch-composition.test.ts:516-521), whereas
      AC-F4-6/DEC-3 require it to compare to independent tracker truth `pr-open` with
      `urlResolved:false` as an attribute. The fixture path
      (tests/fixtures/dispatch/ledger.ts:52) uses `pr-open`, so the production
      behaviour is not exercised by the gate/E2E fixtures.
    suggestion: >-
      Return `pr-open` from `trackerTokenOf` for an open PR regardless of URL
      resolution (keep `urlResolved:false` as the comparison attribute), and change
      the production-composition test to assert `comparison.token === "pr-open"`.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-6
    severity: medium
    confidence: medium
    category: correctness
    location: packages/core/src/domain/dispatch-comparison.ts:187-194
    message: >-
      `classifyFalseSuccess` returns true for any success-class token with any
      unsatisfied corroboration source. The app collapses an unreadable source, a
      pending source, and a contradictory source into `"unsatisfied"`
      (app/dispatch.ts:487-499). AC-F4-4 requires an attempt "whose ... corroboration
      source cannot be read" to fail corroboration "without creating a divergence or
      resetting the window"; a `merged` claim with an absent/failed CI read therefore
      becomes a false-success incident and resets the evidence window, which AC-F4-4
      forbids. This is reachable in production (`readCiTruth` returns `ok:false` for
      absent/non-success check-runs) and is not covered by a test that runs
      `classifyFalseSuccess`.
    suggestion: >-
      Distinguish "unreadable" from "contradicted" in the corroboration facts (e.g.
      a fourth state or an explicit unreadable marker) and only set
      `falseSuccess=true` for a genuine contradiction; or record unreadable
      corroboration as an unevaluable success claim that blocks eligibility without
      resetting the window. Add a merged+unreadable-CI test.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-7
    severity: medium
    confidence: high
    category: plan-compliance
    location: packages/core/src/app/dispatch.ts:429-441
    message: >-
      The one-shot path does not watch the session. It spawns, awaits
      `ports.harness.collect` to completion, then performs a single `liveness` read
      whose verdict is discarded (`evaluateDispatchLiveness(...)` result unused; no
      `previous` observation is ever supplied). There is no cadence loop and no
      liveness-driven stall/`max-restarts` classification. Plan phase 4 declared
      "watch with the phase-2 progress verdict at the `lane.liveness-interval`
      cadence", and F-1 states the command "watches it with progress-based liveness".
      The pure evaluator and its tests are correct, but the command does not use it.
    suggestion: >-
      Poll `harness.liveness` at `lane.liveness-interval` while the session runs,
      carry the previous observation, and route a stalled verdict through restart
      admission; or narrow F-1/the plan to state that one-shot watching is delegated
      to `collect`. As delivered, the "watch" capability is not present.
    suppressed: false
    published_url: null
    published_at: null

