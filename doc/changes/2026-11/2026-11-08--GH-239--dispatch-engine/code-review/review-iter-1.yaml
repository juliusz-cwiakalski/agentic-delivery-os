  - id: F-10
    severity: low
    confidence: medium
    category: architecture
    location: packages/core/src/contracts/dispatch.ts:285-286
    message: >-
      Attempt-stage classified failures carry `error` nested inside the success-shaped
      `data` (`DispatchEnvelopeData.error`) while the top-level envelope stays
      `CommandResultSuccess` with exit 1/2. This keeps the type-level `data XOR error`
      invariant and is documented in the type, but it is a deliberate deviation the
      spec does not name: DM-5 says "error envelopes keep the full error-table fields"
      and AC-F12-3/AC-F1-4 read as a failure envelope. A generic `CommandResult`
      consumer sees a success envelope on a failing dispatch and may not surface the
      nested error. Judgment: not a contract violation, but an undocumented contract
      extension.
    suggestion: >-
      Add one sentence to spec DM-5 (or a decision) stating that an attempt-stage
      classified failure is a data-bearing success envelope whose `data.error` carries
      the full error fields, and that consumers read `data.result` + `data.error`
      together; alternatively rename the field (`failure`) to avoid overloading
      "error".
    suppressed: false
    published_url: null
    published_at: null

  - id: F-11
    severity: low
    confidence: high
    category: performance
    location: packages/core/src/app/dispatch-ledger.ts:140-160
    message: >-
      `readLedger` calls `store.readRecords()` (the whole store) and only bounds the
      returned slice to `DISPATCH_MAX_ATTEMPT_RECORDS`. NFR-4's "reads at most 5,000
      attempt records" is therefore a returned-set bound, not a read bound, and the
      p95 test (dispatch-bounds.test.ts:86-135) uses a pre-bounded 5,000-record fake
      store, so it cannot detect an unbounded real read.
    suggestion: >-
      Bound at the store read where the delivered store supports it, or document that
      the delivered JSONL read is the bound and that truncation is declared; add a
      test over a >5,000-record store with an advancing read to prove the declared
      truncation path.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-12
    severity: low
    confidence: medium
    category: testing
    location: tests/structure/dispatch-composition.test.ts:110-111
    message: >-
      The production-composition test derives the expected PR URL from the checkout's
