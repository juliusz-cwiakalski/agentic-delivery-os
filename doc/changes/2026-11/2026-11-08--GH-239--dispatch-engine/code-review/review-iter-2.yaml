findings:
  - id: F-15
    severity: high
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:465-479
    message: >-
      The persisted first-use identity marker is a single global artifact
      (`DISPATCH_IDENTITY_MARKER_NAME = "dispatch-identity.json"`,
      contracts/dispatch.ts:39) in the shared per-user state store
      (`stateDirectory = ${homeDirectory}/${brand.stateDirectoryName}`, production.ts:224).
      `resolveProductionRepository` reads the marker first and writes it on every
      resolution, so the first dispatch in any repository binds the store to that
      identity and every later dispatch/summary/handover for a different repository
      in the same HOME resolves to the first identity. Probes through
      `createProductionComposer`: `dispatch GH-903` (acme/alpha) then `dispatch
      GH-905` (acme/beta) recorded BOTH attempts under `github.com/acme/alpha`; and a
      read-only `dispatch dual-run summary --repo github.com/owner/other` bound the
      marker before any dispatch, after which `dispatch GH-900` (queued
      `github.com/owner/project`) recorded under `github.com/owner/other`. This
      breaks DEC-13 / AC-F6-2 / AC-F6-6 per-repository isolation (evidence and
      authority are attributed to the wrong repository), and the green suites miss
      it because every production identity test shares one home and one ref (rename
      only).
    suggestion: >-
      Scope the identity binding per repository/checkout so one repository can never
      re-key another (for example key the marker by a repository/checkout discriminator,
      or consult and persist it only as a fallback for the checkout's own facts), and
      do not persist the marker from read-only gate commands using an arbitrary
      `--repo` argument. Reconcile the spec identity paragraph with per-repository
      isolation, and add a two-repository production-composition test asserting each
      repository records and summarizes only its own evidence.
    suppressed: false
    published_url: null
    published_at: null

  - id: F-16
    severity: medium
    confidence: medium
    category: correctness
    location: packages/core/src/app/dispatch.ts:577-609
    message: >-
      The one-shot watcher sets `stalled` on any two consecutive no-advance sourced
      readings and never clears it on later progress; after `collect` resolves
      successfully, `if (stalled)` still routes to restart admission and, at or above
      `lane.restart-budget`, returns the `max-restarts`/failed refusal and discards
      the successful collected evidence. A transient mid-run stall therefore turns a
      completed session into a restart-budget refusal. This deviates from the
      remediated F-1 wording ("a corroborated *terminal* stall") and is codified by
      the new test, which feeds `COMPLETED_EVIDENCE` yet expects `max-restarts`
      (dispatch-watch.test.ts:59-84). Reachable for a plain `dispatch` whose persisted
      restart count already equals the budget (initialRestarts = restartCount).
    suggestion: >-
      Treat a stall as terminal only when it accompanies a failed/timed-out
      collection (or abort/stop the session on a corroborated stall), and otherwise
      record the transient stall as liveness evidence while classifying the collected
      evidence normally. Update the dispatch-watch test to assert a completed session
      is not reclassified `max-restarts` solely from an observed transient stall.
    suppressed: false
    published_url: null
    published_at: null

