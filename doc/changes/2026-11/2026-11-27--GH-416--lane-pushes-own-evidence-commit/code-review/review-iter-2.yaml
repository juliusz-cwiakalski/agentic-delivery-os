summary: >
  Second review, after plan phase 9 (commits 468deaeda..b7823930c), against
  spec v1.6, test plan v1.8, plan v1.7 and PM ruling R17, at HEAD b7823930c.
  The blocking defect is fixed, and this review proved the fix on real git
  rather than taking it from the delivery's note. With the seam's default
  runner and a PATH shim in front of git, the observed child argv is exactly
  `git push <resolved remote> HEAD:refs/heads/<branch>`, with no `--ff-only`,
  no force flag and no `+` prefix; a first push is accepted and the bare
  remote holds the checkout head, the repeat push is accepted with the ref
  unmoved, a moved remote is refused `non-fast-forward` with the ref unmoved,
  and the safe-ref guard, the protected-name guard and a missing destination
  all answer with zero children started. The push remote followed the
  declared order in all four positions; the ambiguous, URL-valued and
  option-shaped destinations and a checkout with neither `origin` nor a
  branch destination were refused without a child starting. The
  real-git suite (TC-LGIT-001) drives the default runner with no injection in
  every outcome arm, passes with every internet connect() blocked by an
  LD_PRELOAD shim (zero attempts), and fails 9 of its 14 cases when the old
  argv is restored in a scratch copy. Classification on real git text: a
  vanished remote path and an undeclared remote name are
  `remote-unavailable`, a pre-receive `Write access ... not granted` and a
  local 403 remote helper are `auth-rejected`, a plain hook decline is
  `protected-ref`; a 111-text corpus differs from the pre-phase-9 seam on
  exactly the four intended texts and on nothing else; `unsafe-branch` is
  refused by the record validator and mapped to `unclassified` by the act
  mapping, so it cannot reach a record. Every iteration-1 finding is closed
  or dispositioned: F-9 stays open by ruling R17, guarded by the pinned array
  order, and F-10's diagnostic channel is required by no criterion, the
  delivered `recorded: false` disclosure carrying the unrecorded case.
  Nothing blocks. Twelve advisories continue the numbering
  from iteration 1 (F-14..F-25); F-14, a header line with trailing text that
  git accepts is skipped and the keys after it re-attributed, is the one
  worth a small follow-up. Verification by this review at the frozen tree:
  the `pnpm check` aggregate, run step by step without its two build hooks
  (the built dist verified current), is green: 13 166 pass, 4 skip, 0 fail
  across 1 571 files, and lint, format, typecheck, boundaries, the allowlist
  tripwire, memory lint, forbidden literals, new-code naming, namespace tree,
  prompt conformance, help-guide coverage, exports parity and the no-shell
  invariant all pass. Spec section 17 is byte-identical to the iteration-1
  reviewed revision, `jaiship plan validate GH-416` is valid, the
  commit-range gate is PASS over 33 commits, the built dist carries the
  corrected argv, and the plugin projection is in sync with its source.
