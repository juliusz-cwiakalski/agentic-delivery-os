findings:
  - id: F-14
    severity: medium
    confidence: high
    category: correctness
    location: packages/adapters/src/git/push.ts:196
    message: >
      The configuration parser drops a section-header line it cannot match and
      keeps the previous section, but git accepts trailing text after the
      closing bracket. Probed against git 2.53.0 with `git config --local
      --get-all` as the reference: with `[branch "<branch>"] # lane` above
      `pushRemote = pushed`, git reads `pushed` and the seam passes `origin`.
      The same holds for a header with trailing garbage, for `[remote] #
      defaults` above `pushDefault`, and for a `branch.<branch>.remote` under
      an annotated header; an annotated `[remote "origin"]` header makes the
      seam refuse `remote-unavailable` on a checkout git considers configured.
      In the first four shapes the act goes to a lower-precedence remote and
      answers `pushed`, against the order spec F-1 declares; the engine's
      parity check at classification still reports the lagging PR head. The
      trigger is rare (a hand-annotated header line in `.git/config`) and the
      first consumer's own configuration has none.
    suggestion: >
      Fail closed instead of skipping: a line that starts with `[` and does not
      match the header grammar should make the whole parse an unresolvable
      destination (the typed `remote-unavailable`), or the header pattern
      should tolerate the trailing comment text git tolerates. Add the five
      shapes as parser cases; an injected runner is enough to observe the
      resolved name.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-15
    severity: low
    confidence: high
    category: correctness
    location: packages/adapters/src/git/push.ts:280
    message: >
      `readBoundedText` stops at the 64 KiB cap without reporting truncation,
      so a `.git/config` larger than that is parsed partially. A
      `branch.<branch>.pushRemote` written past the cap (git appends new keys
      at the end) then resolves to a lower-precedence stage or to `origin`
      instead of a typed refusal. Submodule-heavy or branch-heavy checkouts
      are the realistic shape; the bound itself is sound.
    suggestion: >
      Read one byte past the cap and treat an oversized configuration as an
      unresolvable destination (`remote-unavailable`), and name the bound in
      the seam's contract.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-16
    severity: low
    confidence: high
    category: correctness
    location: packages/adapters/src/git/push.ts:103
    message: >
      The destination alphabet `[A-Za-z0-9._/-]` is narrower than git's
      remote-name grammar: `git remote add` accepts `fork+oss`, `user@fork`,
      `a%b`, `a=b` and non-ASCII names, and each is refused
      `remote-unavailable` when it is the configured push remote (probed with
      an injected runner; fail-closed, never a wrong remote). The restriction
      is stated in the seam's comment and the pm-notes ("unsafe-shaped") but
      not in the spec or the reference page, which describe only a missing or
      an ambiguous destination.
    suggestion: >
      Widen the alphabet to what git accepts in a remote nickname while
      keeping the leading-dash and whitespace refusals, or document the shape
      as a third `remote-unavailable` condition on the reference page and in
      spec DM-4.
    suppressed: false
    published_url: null
    published_at: null
