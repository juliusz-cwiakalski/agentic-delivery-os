findings:
  - id: F-1
    severity: critical
    confidence: high
    category: correctness
    location: packages/adapters/src/git/push.ts:203
    message: >
      The seam's fixed argv `git push --ff-only HEAD:refs/heads/<branch>` is
      rejected by real git before any transport work. `git push` has no
      `--ff-only` option (the flag belongs to merge, pull and fetch), so the
      child exits 129 with `error: unknown option 'ff-only'`; and a lone
      `<src>:<dst>` positional is parsed as the `<repository>` argument, not a
      refspec, so removing only the flag is not a fix. Probed with git 2.53.0
      over a local bare remote with `origin` configured: the delivered module
      with its default runner answered `{outcome: rejected, detail:
      unclassified}` for a push that plain `git push origin
      HEAD:refs/heads/<branch>` accepts; a scratch copy of the same module with
      only the argv changed answered accepted, accepted (Everything up-to-date),
      non-fast-forward and protected-ref on the same repository. Both production
      consumers use that default runner (`packages/cli/src/production.ts:4234`
      engine ensure-push, `:6890` lane push; `gitPushRunner` is test-only).
      Consequence: `push <ref>` refuses every real push (`failed`,
      `unclassified`, exit 1), the lane's last evidence commit stays local, and
      ticket requirement 1, goal G-1 and the first KPI are not delivered. The
      host state ledger holds no attempt that ever recorded `push:pushed` or
      `push:failed` (5 x `push:clean` only), so no production evidence
      contradicts the probe.
    suggestion: >
      PM ruling first, because the spec declares the seam's argv unchanged
      (F-1, section 16) and the plan's first escalation trigger forbids a
      repository argument: absorb the seam fix into GH-416 (recommended, since
      the change is meaningless without it), or land it as a predecessor and
      rebase. Then replace the argv with a valid non-force invocation that
      pushes `HEAD` to `refs/heads/<branch>` on the checkout's configured push
      remote (resolve the push remote from the branch configuration or
      `remote.pushDefault` in one bounded local read and pass it as the
      repository argument or through `--repo`), and amend the argv statements
      in the spec, the reference page `:63`, TDR-0079 `:103` and `:410`.
