summary: >
  First review of the 28-commit range against spec v1.5, test plan v1.7, plan
  v1.5, ticket #416 and its owner comment. The orchestration is sound and
  matches the spec: one safe-ref predicate in the dispatch contract module with
  the protected-name set left untouched in the closeout contract module, a
  closed eight-token cause set split as one guard-only token and seven
  recordable causes, a fold that adds evidence references only, a byte-identical
  `dispatch status` absence with one additive bounded read, a command whose
  grammar, act-then-append order and answer shapes are proven through the
  production composition, and both product surfaces in sync with the generated
  plugin. One blocking defect defeats the change's purpose: the delivered push
  seam's fixed argv (`git push --ff-only HEAD:refs/heads/<branch>`) is not a
  valid git invocation. Probed against real git 2.53.0 over a local bare remote
  with `origin` configured, the delivered module refuses every push
  (`rejected` / `unclassified`) because `git push` has no `--ff-only` option
  (exit 129) and a lone refspec positional is parsed as the repository argument.
  The lane's `push <ref>` therefore cannot put the lane's last evidence commit
  on the remote, so AC-F1-1 and the repeat-act clause of AC-F2-1 hold only
  against injected runners. The defect pre-dates this change (the GH-386 seam)
  but this branch adds a second consumer, a prompt-required command and a `pm`
  instruction on top of it, re-pins the argv in three more tests and records it
  as a fact in TDR-0079 and the reference page. Everything else is non-blocking:
  two vacuous assertions, an undelivered overflow arm, eight files outside the
  declared phase scopes, classification gaps on real git wording, and wording
  that claims an unconditional push. Verification run by this review at HEAD
  a80bc9928: 475 targeted tests pass across 42 files; prompt-conformance,
  help-guide-coverage, no-shell, doc-distribution and plan-validate green;
  commit-range gate PASS (28 commits); plugin projection body-identical to its
  source.
