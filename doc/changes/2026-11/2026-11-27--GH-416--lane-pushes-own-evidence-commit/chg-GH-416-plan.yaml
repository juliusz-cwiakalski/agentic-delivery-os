tier:
  name: full
  escalationTriggers:
    - "A force flag, `--force-with-lease`, a second refspec, a repository argument, a retry, or a shell invocation appears in the command's act path or in the push seam (NG-1, NG-8, NFR-1, NFR-6, TC-LBND-001): stop and report; the act is the delivered seam's fixed argv, once."
    - "A push is performed for a branch that exactly one rule did not resolve: a guessed, current-checkout, ambiguous, unsafe, or protected ref (AC-F1-2, NFR-7, TC-LRES-001 to TC-LRES-004): stop and report; this is the worst outcome of the change."
    - "The two layers drift: the command's resolution and the push seam's guard stop applying the one shared predicate, a second copy of the predicate appears on that path, a pre-act resolution refusal starts a child or appends a record, `unsafe-branch` reaches the command's answer or a lane-push record, or a `protected-ref` record is written for a protected-set name instead of a server-side decline (F-1, DM-4, TC-LRES-004, TC-LCAUSE-001): stop and report."
    - "A phase edits the private safe-ref predicate copies in packages/adapters/src/git/index.ts, merge.ts, or watchdog.ts, or any other adapters module adopts the shared predicate (R10, spec section 7.2): stop and report; the predicate is unified for the push seam and its command only."
    - "The safe-ref predicate lands in a contracts module pinned declaration-only (packages/core/src/contracts/closeout.ts is one), a function or a regex is added to such a module, or a declaration-only pin (tests/structure/closeout-contract.test.ts, tests/structure/port-neutrality.test.ts) is relaxed to admit it (R12): stop and report; the predicate's home is packages/core/src/contracts/dispatch.ts."
    - "A suite fakes a branch selection, or injects `main`, `main-tools`, or `HEAD` as a resolved branch, to produce a protected-set refusal on the command path (R13, AC-F1-2, TC-LRES-004): stop and report; that check is structurally unreachable from a resolved branch and is proven by a direct call of the predicate."
    - "A suite or a phase asserts a durable fact (a record, a status fact, a folded reference) for a pre-act resolution refusal (RSK-10, AC-F1-2, TC-LRES-004): stop and report."
    - "A new golden, fixture, or module lands outside the declared scope, so a commit is green locally and would be red on a fresh checkout (the staging rule of packages/core/src/domain/commit-staging.ts): stop and declare it before committing."
    - "The record append precedes the act, a record claims a push that did not happen, the payload exceeds 512 UTF-8 bytes, or git's failure text, a remote URL, or a credential-shaped fragment reaches the record, the answer, the status fact, or the evidence (DM-1, TC-LSTORE-001, TC-LCMD-002, TC-LCAUSE-002): stop and report."
    - "A third lane-push reference joins the reserved block, the block exceeds seven of sixteen, or a new result token, error identity, error-table row, comparison reason, corroboration source, derivation arm, read-failure source, or attempt-record field appears (NG-2, DEC-5, NFR-5, TC-LFOLD-001): stop and report."
    - "The fold fabricates a lane push (a foreign attempt, an absent record, or an unreadable store yields a reference), or a recorded `lane-push:failed` turns a truthful `pr-open` into a failure or suppresses the delivered `push-parity-unmet` row (AC-F3-1, DEC-5, TC-LFOLD-003, TC-LFOLD-004): stop and report."
    - "`dispatch status` makes a network call, starts a process, takes a fence, appends or deletes anything, or takes more than one additional bounded lane-push read, or a delivered member or line changes when the fact is absent (NFR-3, NFR-4, TC-LSTATUS-002, TC-LSTATUS-003): stop and report."
    - "The lane fact appears on the one-shot `dispatch` run's machine envelope or as a fifth key of its text, or a golden of that text is regenerated (NG-3, NFR-4, TC-LOUT-001): stop and report; a golden that must change is escalated, never accepted."
    - "A delivered push path (the PR workflow's pre-PR push, the engine's ensure-push at the `pr-open` arm, a bash wrapper's own push) is removed, reordered, or turned into an error, or a repeat push of an equal head becomes an error (NG-4, NG-10, AC-F2-1, TC-LPUSH-002, TC-LPUSH-004): stop and report."
    - "A product surface orders the push before the `phase complete` step that lands the `pr_creation` completion commit, tells the lane to retry, force, author a commit, or reopen a phase on a refusal, or adds a prompt section marker (DEC-6, TC-LMSG-001, TC-LMSG-002): stop and report."
    - "The full battery is started before the change's changeset exists, or any gate is reported green while a check was skipped, disabled, or made vacuous (NG-11, TC-LGATE-001): stop; the changeset lands in phase 1."
    - "The state-additivity baseline gains anything but the three lane-push constants, a second record kind appears, or a pre-existing changeset, the contract baseline, or a delivered GH-386 suite is edited to go green (DEC-2, TC-RELEASE-001, TC-LPUSH-004): stop and report."
    - "A page outside the declared count-and-tail set is rewritten to satisfy a pin, or the reference page lands outside the M4 command-page root (RSK-7, section 8.1, TC-LDOC-001): stop and report."
    - "Delivery searches the file system outside the checkout and the change folder (owner delivery note 3): stop and report."
defaultLeases:
  - "repo:main-tools"
defaultWeightClass: standard
phases:
  - id: 1
    title: "Contracts: the safe-ref predicate's home in the dispatch contract module, the `dispatch.lane-push` record kind with its append and read, and the changeset"
    kind: delivery
    summary: "declare the contracts every later phase consumes and add the changeset first: the safe-ref predicate in the dispatch contract module, packages/core/src/contracts/dispatch.ts, which already carries functions, with the protected-name set staying as delivered in the closeout contract module and the adapters push seam importing both through the package barrel, then the `dispatch.lane-push` record kind with its bounded identifier-only payload, the closed eight-token refusal-cause vocabulary (one guard-only token, seven recordable causes), the `lane-push:` evidence builders, the `push` answer contract, the additive optional `lanePush` status fact, and the record's validator, read, and append in the delivered dispatch ledger."
    # AC: AC-F3-1 and AC-F5-1 (contract basis: DM-1, DM-2, DM-3), AC-F4-1
    # (contract basis: DM-4), AC-F1-1 (contract basis: DM-5), AC-F1-2
    # (contract basis: the one predicate and set of F-1).
    # TC ownership: TC-LGATE-001 (the changeset half; its release-suite half
    # is the lifecycle gate's, named in phase 8). The record's behaviour
    # coverage (TC-LSTORE-001, TC-LSTORE-002) rides phase 3, its first real
    # writer: an unused read and append keep this boundary green without a
    # suite of their own (the GH-404 phase 1 pattern).
    # Scope: spec F-1 "One predicate, two layers, three refusal conditions"
    # (the homes and the seam's import), F-3 "The record", F-4 (the cause
    # vocabulary), F-5 (the fact shape), DM-1, DM-2, DM-3, DM-4, DM-5, NFR-5
    # (the payload bound), NG-9, NG-11, section 7.1, section 7.2, section 12,
    # section 13, section 16, section 18, section 21, Appendix A, Appendix B,
    # Appendix C, Appendix E; test plan section 3.2 and TC-LGATE-001.
    #
    # The predicate's home (PM rulings R1 and R12, findings D1 and 2-B1). The
    # two contract symbols, by name:
    #   - `isSafeRef`: the safe-ref predicate, the seam's module-private
    #     function lifted unchanged in behaviour (its alphabet and its
    #     forbidden-character rule), declared in
    #     packages/core/src/contracts/dispatch.ts. That module already
    #     carries functions (`dispatchAttemptRecordKey`,
    #     `dispatchPushEvidenceRef`, `dispatchLaneRecordKey`) and string
    #     patterns, and no suite pins it declaration-only. Its form is
    #     admitted too: an unpinned contracts module already carries a
    #     top-level `new RegExp` built from an `as const` string pattern
    #     (`DECLARED_PRODUCT_KEY_REGEX`,
    #     packages/core/src/contracts/projects.ts:72), and the directory-wide
    #     guard over the contracts tier is the ambient one, which a pure
    #     predicate does not trip.
    #   - `PROTECTED_REF_NAMES`: the protected-name set, which stays where it
    #     is published, packages/core/src/contracts/closeout.ts, untouched,
    #     as the `as const` data it already is. Every consumer (the push
    #     seam, the git index and merge adapters, the closeout domain, all
    #     through the package barrel) is untouched, the value pin of
    #     tests/structure/closeout-contract.test.ts holds without edit, and
    #     the closeout ref guard's `protected-ref` reason literal in
    #     packages/core/src/domain/closeout.ts is not edited.
    #   So the predicate has its home in the dispatch contract module and the
    #   set keeps its home in the closeout contract module; the push seam
    #   (this phase) and the command's resolution (phase 3) import both
    #   through the `@delivery-os/core/contracts` barrel. No new module is
    #   created. Spec section 16 files it the same way, in three rows.
    # Why the predicate is not homed in the closeout contract module (its
    # home until this plan's revision v1.3): two delivered suites pin that
    # module "declarations plus `as const` data",
    # tests/structure/closeout-contract.test.ts:210-213 and
    # tests/structure/port-neutrality.test.ts:17-23, :88-99. The rule names
    # every top-level function an executable declaration and every variable
    # without an `as const` initializer a non-as-const data declaration, and
    # a regex literal cannot take `as const`, so no form of the predicate
    # fits there. The pins are not relaxed (PM ruling R12): the module is
    # outside every scope and both suites run below as read-only controls.
    # The seam (packages/adapters/src/git/push.ts), in this phase: it imports
    # `isSafeRef` and `PROTECTED_REF_NAMES` from `@delivery-os/core/contracts`
    # (adapters import core; the dependency matrix forbids only the reverse)
    # and deletes its own `REF_PATTERN`, `FORBIDDEN_REF`, and `isSafeRef`.
    # Both guards stay byte-identical in behaviour, literals, and order: the
    # unsafe-name check, then the protected-name check, both before any child.
    # Its four exported names stay as delivered (`createGitPushSeam`,
    # `GitPushOutcome`, `GitPushSeam`, `GitPushSeamOptions`), because the
    # module that re-exports them is out of scope (below). This phase touches
    # nothing else in the seam; the `detail` classification is phase 2's.
    # The predicate is unified for the push seam and its command only (PM
    # ruling R10, spec section 7.2 and section 12). The identical private
    # copies in packages/adapters/src/git/index.ts, merge.ts, and watchdog.ts
    # are declared out of scope: those modules stay as delivered, no phase
    # declares an edit to them, and their unification is separate work.
    #
    # The contracts (packages/core/src/contracts/dispatch.ts):
    #   - the record kind `dispatch.lane-push`, payload schema
    #     `delivery.dispatch.lane-push.v1`, and key prefix
    #     `dispatch.lane-pushes:` (keyed per work-item reference), with the
    #     payload of Appendix B in its declaration order: schema, ref,
    #     repository, branch, head (full-hex; the invocation checkout's `HEAD`
    #     read at act time, DM-1), verdict over `pushed | failed`, cause
    #     present exactly when the verdict is `failed`, attemptId and
    #     sessionId present exactly when a lane record was readable at push
    #     time, recordedAt. Identifiers and SHAs only, single-line members, the
    #     whole payload at most 512 UTF-8 bytes.
    #   - the closed refusal-cause vocabulary of DM-4 as ONE constant with
    #     exactly eight members (the set is unchanged), declared with the
    #     split DM-4 states so a pin can assert it: one guard-only token
    #     (`unsafe-branch`), which no lane-push record can carry, and seven
    #     recordable child-act causes (`non-fast-forward`, `auth-rejected`,
    #     `remote-unavailable`, `spawn-failed`, `timed-out`, `protected-ref`,
    #     `unclassified`). `protected-ref` is the one token with two sources:
    #     protected-set membership, defence in depth that no resolved name
    #     triggers (proven by a direct call), and a protection or hook decline
    #     git reports, classified from the child act (verdict `failed`,
    #     record appended). The token
    #     alone never identifies the source; the layer and the child count
    #     do. `protected-ref` is the delivered literal; no `protected-branch`
    #     alias, mapping, or second spelling is declared anywhere. The seam
    #     (phase 2), the command (phase 3), the record validator, and every
    #     pin import this one constant.
    #   - the evidence-reference builders `lane-push:<verdict>` and
    #     `lane-push-cause:<cause>` (DM-2): identifiers only, never git text.
    #   - the `push` answer contract of DM-5 and section 8.1: the data keys
    #     `ref`, `repository`, and `lanePush` (verdict, branch, head, cause,
    #     recorded, recordedAt) and the human block's declared key order.
    # Conditional, ONLY IF the named change happens:
    #   - packages/core/src/contracts/push.ts, when the `push` answer contract
    #     gets its own contracts module (the per-family pattern of
    #     `contracts/commit.ts`). This plan's primary declaration keeps every
    #     addition in the spec-named `contracts/dispatch.ts`, and the record
    #     and the vocabularies stay there whichever way the answer contract
    #     goes.
    #   - tests/structure/inventory.json, when that conditional module is
    #     created: a new source file joins the committed inventory in the same
    #     commit. Otherwise the file is untouched in this phase.
    # The status fact (packages/core/src/contracts/dispatch-operator.ts): the
    # additive optional `lanePush` member on `DispatchStatusData` (DM-3):
    # verdict, branch, head, recordedAt, and cause when the verdict is `failed`.
    # An optional member nothing produces yet is byte-identical absence, so
    # every delivered status pin holds at this boundary.
    # The ledger (packages/core/src/app/dispatch-ledger.ts, the module that
    # owns every `dispatch.*` record read and append): the record's validator,
    # one bounded read of the family, and one append. The append writes under
    # the store fence, append-only, never rewritten. The read is the one both
    # later readers consume (the fold in phase 4, the status fact in phase 5).
    # Nothing is appended here: no writer exists until phase 3.
    # The pm-notes contract is OUTSIDE every scope (NG-9): the change record's
    # `branch:` value is read as an opaque top-level string and no typed key
    # is added.
    # Pins that move with the contracts, each by exactly the declared addition:
    #   - tests/fixtures/events/state-additivity-baseline.json gains exactly
    #     three constants (the record kind, the payload schema, the key prefix)
    #     and nothing else; the strict equality of
    #     tests/structure/event-state-additivity.test.ts is the proof.
    #   - tests/fixtures/ports/v1-contract-inventory.json and
