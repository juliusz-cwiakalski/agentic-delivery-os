  - id: 6
    title: "The two product surfaces: the `pm` agent's `pr_creation` tail and the built lifecycle prompt's sentence"
    kind: delivery
    summary: "instruct the lane on both surfaces that reach it: the `pm` agent definition's `pr_creation` step and one sentence of the built lifecycle prompt order the tail as pull request, URL note, phase completion, `push`, final message, stop, and carry the final-message rule, with the five prompt markers unchanged."
    # AC: AC-F4-1 (the final-message contract on both product surfaces),
    # AC-F2-1 (the delivered push landscape intact), AC-F6-1 (the declared
    # divergence's product surface).
    # TC ownership: TC-LMSG-001, TC-LMSG-002, TC-LPUSH-004.
    # Scope: spec F-4 "The lane's final message", F-6, DEC-6 (including its
    # `no commit` sentence), RSK-5, RSK-10, NG-4, NG-5, NG-10, section 16,
    # Appendix D; test plan section 8.3's coverage boundary CB-1.
    #
    # The ordered tail (DEC-6, Appendix D), identical on both surfaces:
    #   1. `@pr-manager` creates or updates the pull request (its own pre-PR
    #      push stays first: NG-4);
    #   2. the PM records the pull request URL as a pm-notes note, landed by
    #      the commit primitive;
    #   3. `phase complete <ref> pr_creation` lands the phase completion commit;
    #   4. `push <ref>` (one act, one record);
    #   5. the final message names the pull request URL and the push outcome,
    #      then the lane stops.
    # The push instruction sits AFTER the phase-completion instruction, so the
    # commit pushed is the lane's actual last commit (the section 14 reading).
    # The final-message contract: accepted, the branch head is pushed and the
    # head is named when the answer names it; refused, the cause is named and
    # the message never states or implies that the branch is on the remote;
    # unrecorded, the message says the push landed and its record did not. The
    # lane does not retry, force, author a commit to make the push succeed, or
    # reopen a phase: a transport refusal is not a workflow regression.
    # RSK-10: a pre-act resolution refusal leaves no durable fact, so the
    # lane's final message is its only immediate disclosure. Both surfaces
    # therefore instruct the lane to name a refused resolution as a refused
    # push (the observed state), never as a pushed branch.
    # The `no commit` directive (DEC-6): the delivered directive suppresses
    # commits, not the push. The tail states that under it the
    # phase-completion commit is skipped and the push step still runs, still
    # records, and is still named by the final message; the push instruction
    # is not conditioned on the directive (TC-LMSG-002 step 5).
    # Surface 1, .opencode/agent/pm.md: the element `<step id="10">` ("PR/MR
    # creation (phase 11)") gains the `push` step and the final-message rule
    # after its `phase complete` instruction and keeps its delivered members
    # (the pull request creation or update, the URL note, the ticket
    # assignment, the phase completion, the stop) in their delivered order;
    # the phase-definition item 11 inside `<step id="3">` states the same tail.
    # The element is addressed by its content, never by a bare number (finding
    # I-1). The edit follows the repository's rule for agent definitions: the
    # prompt edit is delegated to `@toolsmith`.
    # Surface 2, packages/core/src/domain/dispatch-prompt.ts: one sentence in
    # the eleven-phase section naming the `pr_creation` push and its reporting
    # rule. `DISPATCH_LIFECYCLE_SECTIONS` is byte-identical: five markers, in
    # order, no new marker.
    # The two surfaces are asserted SEPARATELY in
    # tests/checks/lane-push-surfaces.test.ts (a missing sentence in either
    # fails by name), because they reach different lanes: a typed spawn, and an
    # operator-run `pm`.
    # The generated projection (finding I-7): .ados-claude/agents/pm.md is
    # regenerated from the source by scripts/build-claude-plugin.sh and lands
    # in the same commit (CI fails a stale projection); it is never edited.
    # The prompt inventory: tests/fixtures/prompt-inventory/lifecycle.json
    # gains `push` among pm.md's required phrases.
    # Doc obligations `pnpm check` depends on (the GH-413 rule: they land here,
    # not in the documentation phase). TC-LMSG-002 step 4 asserts that the
    # feature pages state the same order and the same refusal rule, so
    # doc/spec/features/feature-quality-gates-and-pr.md and
    # doc/spec/features/feature-delivery-lifecycle.md gain their `pr_creation`
    # tail statements in this commit, each keeping every phrase row it already
    # carries. Their wider reconciliation stays phase 7's (named in phase 8).
    # The delivered push landscape (TC-LPUSH-004): the PR workflow's pre-PR
    # push instruction in .opencode/agent/pr-manager.md, the engine's ensure-push
    # at the `pr-open` arm, and the bash wrappers' own pushes are untouched;
    # .opencode/agent/pr-manager.md and the wrappers are outside every scope.
    # The content review of TC-LPUSH-004 step 5 is recorded as a pm-notes
    # `notes:` entry naming the pages reviewed.
    # Coverage boundary CB-1 stands as declared: no suite reads a session's
    # final message, because no delivered seam exposes it.
    # Conditional, ONLY IF the named change happens:
    #   - tests/checks/doc-conformance.test.ts, when the two pages' tail
    #     statements are pinned as phrase rows.
    # Verify: TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/lane-push-surfaces.test.ts
    # Verify: TMPDIR=$PWD/tmp/tmpdir pnpm check:prompt
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/doc-conformance.test.ts tests/checks/prompt-conformance.test.ts
    # Verify (TC-LPUSH-004 step 1; the delivered GH-386 suites, their delivered
    # cells unchanged and none edited in this phase):
    # TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-push-parity.test.ts tests/behaviour/dispatch-push-evidence.test.ts tests/conformance/dispatch/dispatch-parity-push.test.ts tests/structure/dispatch-push-envelope.test.ts
    # Verify (the projection is current): ./scripts/build-claude-plugin.sh, then
    # `git status --short` shows only .ados-claude/agents/pm.md changed under
    # .ados-claude/, and a second run changes nothing.
    # Verify: git diff --check
    # Exit criteria:
    #   - every verify line exits 0;
    #   - the agent step and the built prompt each carry the ordered tail and
    #     the final-message rule, and the suite fails by name if either loses
    #     its sentence;
    #   - the push instruction follows the phase-completion instruction, and no
    #     instruction tells the lane to retry, force, author a commit, or
    #     reopen a phase on a refusal;
    #   - under the `no commit` directive only the phase-completion commit is
    #     skipped: the tail states that the push still runs and still records;
    #   - both surfaces name a refused resolution as a refused push (RSK-10);
    #   - the five prompt markers are byte-identical, `pnpm check:prompt` is
    #     green, and the prompt inventory names `push` for pm.md;
    #   - the generated projection is current;
    #   - the delivered GH-386 suites are green with their delivered cells
    #     unedited;
    #   - only the declared paths changed.
    scope:
      files:
        - .ados-claude/agents/pm.md
        - .opencode/agent/pm.md
        - doc/spec/features/feature-delivery-lifecycle.md
        - doc/spec/features/feature-quality-gates-and-pr.md
        - packages/core/src/domain/dispatch-prompt.ts
        - tests/checks/doc-conformance.test.ts
        - tests/checks/lane-push-surfaces.test.ts
        - tests/fixtures/prompt-inventory/lifecycle.json
    interactions:
      # The agent file is the source of truth; the plugin file is generated
      # code that is rebuilt from it, never edited.
      - kind: contract-file
        target: .opencode/agent/pm.md
        role: producer
      - kind: generated-code
        target: .ados-claude/agents/pm.md
        role: consumer
      - kind: contract-file
        target: packages/core/src/domain/dispatch-prompt.ts
        role: producer

  - id: 7
    title: "Decision record: the amendment of TDR-0076's push ownership"
    kind: delivery
    summary: "stage the companion decision record as Proposed with its index row: one technical decision record amending TDR-0076's push ownership, authored by the decision advisor and accepted or rejected by the owner at pull-request review."
    # Scope: spec DEC-7, section 7.1, section 13, section 16, section 18; the
    # next free technical decision id on `main-tools` (finding I-8).
    # TC ownership: none. This phase stages an artifact and owns no test case.
    # The record is authored by `@decision-advisor` as Proposed with a null
    # decision date. Its content is the decision advisor's: this plan declares
    # only the file and its index row, so the delivery commit stages them. The
    # index is a tracked file and the commit primitive stages every tracked
    # edit, so the row is written with the record and no commit carries an
    # index row that points at an untracked record.
    # The record amends three things in TDR-0076 (the spec's DEC-7 wording):
    # its "session-side push convention unchanged" boundary (the session-side
    # act becomes a typed product surface), its engine-first framing (the
    # engine's act stays the backstop), and its record-kind boundary (the one
    # declared growth, `dispatch.lane-push`, DEC-2).
    # TDR-0076 itself is OUTSIDE every scope: TDR-0078 amended TDR-0050 without
    # editing it, and the amending record stands alone with its index row.
    # The declared path pins the next free id and a slug in the `amends`
    # pattern of TDR-0078. The record's title and slug are the decision
    # advisor's; if either differs, the declared path moves with the file in
    # the same commit. If another lane lands a record first, the next free id
    # is taken and this path is updated.
    # Open for the decision advisor (finding I-9): whether the `push` family
    # name is recorded inside this record or needs a note of its own under the
    # naming lock (ODR-0003). This plan declares no second record.
    # Owner acceptance happens at the pull-request review, outside Done: a
    # record still Proposed at Done does not fail it; a missing record does.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/decision-record.test.ts tests/checks/doc-conformance.test.ts
    # Exit criteria:
    #   - the verify line exits 0;
    #   - exactly one new decision record exists, at its declared path, as
    #     Proposed with a null decision date, and the index carries its row;
    #   - the record amends TDR-0076's push ownership in substance (the
    #     session-side act as a typed product surface; the one record-kind
    #     growth) and no other record was created or edited;
    #   - only the declared paths changed.
    scope:
      files:
        - doc/decisions/00-index.md
        - doc/decisions/TDR-0079-lane-push-amends-tdr-0076.md

