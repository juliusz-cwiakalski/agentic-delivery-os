  - id: 4
    title: "The classification fold: the lane's own act in the attempt's reserved evidence"
    kind: delivery
    summary: "fold the lane's own push into the attempt record the engine appends at classification: one bounded read of the lane-push family, the newest record for the resolved repository whose attempt identity equals the classified attempt, and at most two references reserved ahead of the evidence slice, with nothing fabricated and no classification vocabulary grown."
    # AC: AC-F3-1; AC-F2-1 (the classification half: `pr-open` with zero engine
    # push invocations); DM-2, NFR-5, NFR-8.
    # TC ownership: TC-LFOLD-001, TC-LFOLD-002, TC-LFOLD-003, TC-LFOLD-004,
    # TC-LPUSH-003, TC-LOUT-001, TC-LBND-002 (the classification half).
    # Scope: spec F-3 "The read at classification", "The evidence", "No
    # classification growth", "A disclosure, not a claim", DEC-2, DEC-5,
    # NG-2, NG-3, NFR-5, NFR-8, RSK-1, RSK-3, RSK-8; flows 2, 3, and 5;
    # Appendix C.
    #
    # The fold site (packages/core/src/app/dispatch.ts): `record` is the single
    # attempt-append site, so one read there reaches every terminal path.
    #   - The read: at most ONE bounded read of the lane-push family per
    #     classification (NFR-8). Records are filtered to the resolved
    #     repository first; the newest record whose attempt identity equals the
    #     attempt being classified is the fact. An unreadable store, no
    #     matching record, a record with no identity members, and a record for
    #     another attempt each contribute nothing, fabricate nothing, and never
    #     block classification. No `state.*` identity replaces the derived
    #     token, and no read-failure source is added.
    #   - The engine's own branch (NG-4, section 12): the engine resolves the
    #     branch it pushes independently of the command, by a first-match
    #     read. The fold reads the lane-push record for the attempt whatever
    #     branch each of them resolved, and it compares no branches.
    #   - The references: `lane-push:pushed` for an accepted act; for a refusal
    #     `lane-push:failed` together with `lane-push-cause:<cause>`, the cause
    #     carried verbatim (no paraphrase, no truncation of the token), over
    #     the seven recordable causes a lane-push record can carry. Each
    #     appears exactly once.
    #   - The reservation: the references join the reserved block ahead of the
    #     16-slice, beside the five delivered disclosures. The block grows by
    #     at most two, so its maximum is seven of the sixteen-reference budget,
    #     and a lane-push disclosure is never truncated away under a full
    #     slice. The bound is asserted as membership and bound, never as
    #     arithmetic on a literal count.
    #   - No classification growth (NG-2, DEC-5): no result token, error
    #     identity, error-table row, comparison reason, corroboration source,
    #     derivation arm, read-failure source, or attempt-record field. The
    #     attempt record's key set is byte-identical; only `evidenceRefs`
    #     changes. The `dispatch <ref>` machine envelope and its four-key text
    #     are untouched: the GH-386 `push` block stays the parity block and
    #     carries neither a lane-push member nor a cause member, because the
    #     engine consumes the seam's outcome only (NG-3).
    #   - A disclosure, not a claim: a recorded `lane-push:failed` beside parity
    #     that holds leaves the truthful `pr-open` untouched; parity that does
    #     not hold fires the delivered lifecycle push-failure row exactly as
    #     delivered (`failed` / `failed` / exit 1 / `push-parity-unmet`), one
    #     failure and not two; a recorded `lane-push:pushed` masks nothing and
    #     is never rewritten.
    #   - Two families, two questions (RSK-8): `push:<verdict>` is the engine's
    #     parity outcome; `lane-push:<verdict>` is the lane's own act. They
    #     never collapse into one prefix.
    # Proof, with records the command of phase 3 appends and with seeded
    # records:
    #   - tests/behaviour/dispatch-lane-push-fold.test.ts (new) carries the four
    #     fold cases, including the disclosure-stress slice and, for
    #     TC-LFOLD-001, the seven recordable causes. It also completes the one
    #     clause of TC-LCAUSE-001's engine step that names the folded
    #     reference: the cause reaches the attempt only as
    #     `lane-push-cause:<cause>`, while the engine's verdict and evidence
    #     stay identical for two different causes;
    #   - tests/behaviour/dispatch-lane-push.test.ts gains the TC-LPUSH-003 arm
    #     (a seeded `pushed` record, equal heads, zero engine push invocations,
    #     `push:clean` and `lane-push:pushed` each exactly once);
    #   - the parity battery gains its rows in tests/fixtures/dispatch/parity/cases.ts
    #     (the existing `push-parity` group and `push` seam; no new group or
    #     seam) and tests/conformance/dispatch/dispatch-parity-push.test.ts.
    # Pins that move with the fold:
    #   - tests/structure/dispatch-push-envelope.test.ts gains the assertion
    #     that no cause member appears anywhere on the `dispatch <ref>`
    #     envelope: neither a lane-push member, verdict, or head, nor a
    #     `cause` field under any name (TC-LOUT-001 step 2, NG-3);
    #   - tests/checks/dispatch-contract-invariance.test.ts is the closure
    #     proof (the sibling structural pin of TC-LFOLD-003): its delivered
    #     assertions are re-run and none is edited.
    # Conditional, ONLY IF the named change happens:
    #   - packages/core/src/domain/dispatch-lane-push.ts and
    #     packages/core/src/domain/index.ts, when the fold's pure
    #     newest-matching-record selection lives in the domain module phase 3
    #     may create;
    #   - tests/behaviour/dispatch-push-evidence.test.ts, only to add a
    #     lane-push disclosure-stress arm; its delivered cells are never edited.
    # Read-only controls in this phase (not edited here): the `dispatch <ref>`
    # goldens under tests/golden (TC-LOUT-001 step 4: no golden is regenerated
    # for this change; a golden that must change is escalated, never
    # accepted), the delivered cells of the GH-386 suites, and
    # tests/fixtures/dispatch/operator/contract-baseline.ts.
    # Verify: TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-lane-push-fold.test.ts tests/behaviour/dispatch-lane-push.test.ts tests/conformance/dispatch/dispatch-parity-push.test.ts tests/structure/dispatch-push-envelope.test.ts
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/conformance/dispatch
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/dispatch-contract-invariance.test.ts tests/structure/dispatch-contract.test.ts tests/checks/operator-contract-invariance.test.ts tests/structure/event-state-additivity.test.ts
    # Verify (read-only controls in this phase: delivered cells never edited):
    # TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-push-parity.test.ts tests/behaviour/dispatch-push-evidence.test.ts tests/golden
    # Verify (the fold adds evidence references only; no token or verdict
    # literal enters packages/core/src/app/dispatch.ts):
    # TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/dispatch-token-home.test.ts
    # Verify: git diff --check
    # Exit criteria:
    #   - every verify line exits 0;
    #   - a recorded refusal reaches the attempt as `lane-push:failed` plus
    #     `lane-push-cause:<cause>`, and an accepted act as `lane-push:pushed`
    #     with no cause reference, each exactly once and never truncated away
    #     under a full slice;
    #   - a foreign-attempt record, an absent record, and an unreadable store
    #     each contribute zero references and never block classification, at
    #     exactly one lane-push read per classification;
    #   - a recorded refusal turns no truthful `pr-open` into a failure and
    #     masks no delivered `push-parity-unmet` row;
    #   - the token, outcome, exit, comparison-reason, corroboration,
    #     derivation-arm, and attempt-key vocabularies are byte-identical to
    #     their delivered selves;
    #   - the `dispatch <ref>` envelope, its four-key text, and its goldens are
    #     unchanged;
    #   - only the declared paths changed.
    scope:
      files:
        - packages/core/src/app/dispatch.ts
        - packages/core/src/app/index.ts
        - packages/core/src/domain/dispatch-lane-push.ts
        - packages/core/src/domain/index.ts
        - packages/core/src/index.ts
        - tests/behaviour/dispatch-lane-push-fold.test.ts
        - tests/behaviour/dispatch-lane-push.test.ts
        - tests/behaviour/dispatch-push-evidence.test.ts
        - tests/checks/dispatch-contract-invariance.test.ts
        - tests/conformance/dispatch/dispatch-parity-push.test.ts
        - tests/structure/dispatch-push-envelope.test.ts
      folders:
        - tests/fixtures/dispatch/parity
    interactions:
      - kind: contract-file
        target: packages/core/src/app/dispatch.ts
        role: producer

  - id: 5
    title: "The `dispatch status` `lanePush` fact: one more bounded read, additive lines, the posture intact"
    kind: delivery
    summary: "carry the lane's own push to the operator: `dispatch status` gains the additive optional `lanePush` fact from at most one more bounded record read, rendered as additive lines only when present and byte-identical when absent, with no network call, process start, fence, append, or deletion."
    # AC: AC-F5-1; DM-3, NFR-3, NFR-4.
    # TC ownership: TC-LSTATUS-001, TC-LSTATUS-002, TC-LSTATUS-003.
    # Scope: spec F-5, DEC-3, DM-3, NFR-3, NFR-4, RSK-2, RSK-10, section 8.5,
    # section 22; flow 4.
    #
    # The chain, each link the `park` fact's precedent (GH-413 DM-3):
    #   - packages/core/src/app/dispatch-lane-view.ts: `readOperatorStatus`
    #     takes at most ONE additional bounded read of the lane-push family.
    #     The fact is the newest record whose attempt identity equals the
    #     addressed lane's attempt identity, after the repository filter.
    #   - packages/core/src/domain/dispatch-operator-view.ts: `buildStatusData`
    #     carries the fact verbatim (verdict, branch, head, recordedAt, and
    #     cause when the verdict is `failed`): no re-derivation, no truncation,
    #     no reformatting of the instant.
    #   - packages/cli/src/output/dispatch-text.ts: additive human lines in the
    #     `park` lines' pattern, appended after the delivered block, `cause`
    #     rendered only when present.
    # Absence is an absent key, never null and never an empty object: no record
    # stands for the attempt, the addressed reference has no lane, the record
    # belongs to another attempt, or the record carries no identity. Every
    # delivered member and line is byte-identical in that case, and the machine
    # and human forms agree about presence. An absent fact is one answer
    # covering three states (RSK-10): the push never ran, a pre-act resolution
    # refusal (which appends no record), and a record that did not land. The
    # fact does not distinguish them and no suite asserts that it does.
    # A recorded snapshot, never a live equality (DEC-3): the fact names the
    # head the lane pushed and the instant it was recorded. No code path
    # compares it with a local head and no member claims equality.
    # The read posture (NFR-3): zero network calls, zero process starts, zero
