#
# Declaration discipline
#   - The commit primitive stages an untracked (new) file only inside the
#     declared scope and reports the rest as `untrackedNotStaged`, blocking
#     only when nothing else is staged. So every new file is declared by exact
#     path in the phase that creates it: an undeclared golden, fixture, or
#     module is a locally-green, fresh-checkout-red commit. A tracked file
#     edited outside the declared scope is still staged, with its drift
#     disclosed. Read-only pins (the contract baseline, the `dispatch <ref>`
#     goldens, the delivered cells of the GH-386 suites,
#     packages/core/src/domain/closeout.ts, packages/core/src/contracts/pm-notes.ts,
#     packages/cli/src/entrypoint.ts) are never edited: an edit to one is
#     disclosed, never silent. Three modules are outside every scope by
#     ruling R10: packages/adapters/src/git/index.ts, merge.ts, and
#     watchdog.ts keep their private predicate copies. The closeout contract
#     module, packages/core/src/contracts/closeout.ts, is outside every scope
#     by ruling R12: it is pinned declaration-only and is not edited.
#     tests/behaviour/dispatch-push-parity.test.ts is declared in phases 2
#     and 3 for additive cells only.
#   - A pinned surface moves in the same commit as the code it pins (the
#     GH-413 rule): the inventories, the additivity baseline, the no-shell
#     surface, the family-count pins, the phrase rows. Each is declared beside
#     its code with its authorising clause.
#   - `@doc-syncer` reconciles documentation in lifecycle phase 7 and modifies
#     no source, test files included. So a document statement that a test pins
#     moves with its pin in a delivery phase (the count-and-tail pages in
#     phase 3, the `pr_creation` tail statements in phase 6), and only the
#     unpinned reconciliation is left to phase 7 (named in phase 8).
#   - A file whose edit is conditional says so beside it. A conditional file
#     left untouched is an `undeclared-missing` observation in `plan diff`,
#     never a failure.
#   - Every new source file is governed by the new-code naming check from
#     birth, and formatting follows the repository formatter (`pnpm check` runs
#     the lint and the format check).
#
# Fences binding every phase (spec sections 4.2, 5.1, 7.2, 8, 9, 11, 18)
#   - Owner delivery notes (pm-notes): add the change's changeset before the
#     first gate run; run only the tests a phase affects while working and the
#     whole battery once, at the gate; never search the file system outside the
#     checkout and the change folder; gate evidence uses TMPDIR=$PWD/tmp/tmpdir
#     (with tmp/tmpdir present); commits go through the commit primitive; the
#     pull request targets `main-tools` and stays open.
#   - NG-1 and NFR-1: no force push, no history rewrite, no ref but the change
#     branch's configured upstream. The act is the delivered seam's fixed argv,
#     its literal non-shell child, its 60 000 ms injectable budget, one attempt,
#     no retry; no second git path and no new configuration key.
#   - AC-F1-2 and NFR-7: a branch is pushed only when exactly one rule resolved
#     it. A guessed, current-checkout, ambiguous, unsafe, or protected ref is
#     never pushed.
#   - One predicate, two layers, three refusal conditions (F-1, DM-4): the
#     safe-ref predicate lives in the dispatch contract module,
#     packages/core/src/contracts/dispatch.ts, which already carries
#     functions; the protected-name set stays in the closeout contract module
#     as `as const` data. The push seam's guards and the command's resolution
#     import both through the `@delivery-os/core/contracts` barrel and apply
#     that one predicate: no second copy on that path, no new module, and no
#     pinned invariant relaxed (R12). The command's pre-act guard is the
#     safe-ref predicate: `unsafe-branch` is guard-only, always the command's
#     pre-act resolution refusal (a typed input refusal with no child
#     process, no act, no record, and no verdict/cause pair), and no
#     lane-push record can carry it. The protected-set check is defence in
#     depth on both layers and structurally unreachable from a resolved
#     branch: resolution only ever yields a convention match, which always
#     contains a slash, and no member of PROTECTED_REF_NAMES is
#     convention-shaped. It is proven by a direct call of the command's
#     guard, the alphabet predicate and the protected-name membership check
#     together, never by faking a selection (R13): the alphabet predicate
#     alone accepts the protected members, which is why the set check is a
#     separate second guard. `protected-ref` is one token with
#     two sources, of which only a protection or hook decline git reports is
#     command-reachable: that one is classified from the child act (verdict
#     `failed`, record appended). The token alone never identifies the
#     source; the layer and the child count do. So seven causes are
#     recordable, and the command's recorded `failed` verdicts are exactly
#     those seven.
#   - R10 (spec section 7.2 and section 12): the predicate is unified for the
#     push seam and its command only. The identical private copies in
#     packages/adapters/src/git/index.ts, merge.ts, and watchdog.ts are out
#     of scope: no phase declares an edit to those modules.
#   - RSK-10: a pre-act resolution refusal appends no record by design. No
#     phase asserts a durable fact for it. Phase 3's suites assert the
#     refusal's answer and that no act, child process, or record followed.
#   - NFR-2: one lane end costs at most one bounded pm-notes document read
#     (the change record's `branch:` declaration), one bounded local branch
#     read, one bounded local checkout/head read (the recorded `head`), one
#     bounded lane read, one push (60 000 ms at most), and one record append;
#     classification adds at most one bounded record read; zero added
#     provider reads.
#   - NG-3 (the engine consumes the outcome only): the seam returns a cause to
#     both of its callers; the lane's command surfaces and records it, and the
#     engine's parity act discards the detail. No engine classification,
#     envelope, or comparison carries a cause.
#   - NG-4 and section 12: the engine resolves its own branch (a first-match
#     read, independent of the command's resolution). This change leaves that
#     as delivered.
#   - Act first, append second (RSK-6): a record can never claim a push that
#     did not happen; a failed append is `recorded: false` on the answer.
#   - DM-1 and section 20: the record, the answer, the status fact, and the
#     evidence carry identifiers and full-hex SHAs only; the payload is at most
#     512 UTF-8 bytes; git's failure text, a remote URL, and any credential
#     never reach them.
#   - DM-2 and NFR-5: the reserved block gains at most two references
#     (`lane-push:<verdict>`, `lane-push-cause:<cause>`), so its maximum is
#     seven of the sixteen-reference budget.
#   - NG-2 and DEC-5: no new result token, error identity, error-table row,
#     comparison reason, corroboration source, derivation arm, read-failure
#     source, or attempt-record field. One record kind is the whole structural
#     growth (DEC-2).
#   - NG-3 and NFR-4: `dispatch <ref>` keeps its machine envelope and its
#     four-key text; the GH-386 `push` block stays the parity block; no
#     `dispatch <ref>` golden is regenerated for this change.
#   - NG-4, NG-5, NG-10: the PR workflow's pre-PR push, the engine's ensure-push
#     at the `pr-open` arm, and the bash wrappers' own pushes are untouched,
#     and a repeat push of an equal head is never an error.
#   - NG-6, NG-7, NG-9: no merge capability, no credential or transport change,
#     no pm-notes schema change (the `branch:` value stays opaque).
#   - DEC-6: the tail is pull request, URL note, phase completion, `push`, final
#     message, stop; the push never precedes the phase completion; the lane
#     never retries, forces, authors a commit, or reopens a phase on a refusal;
#     the five prompt markers are unchanged. The delivered `no commit`
#     directive suppresses commits, not the push: under it the phase-completion
#     commit is skipped and the push still runs and still records.
#   - NFR-3: `dispatch status` makes no network call, starts no process, takes
#     no fence, appends nothing, deletes nothing, and takes at most one
#     additional bounded lane-push read.
#   - NG-11 and TC-RELEASE-001: the changeset is exactly one new file for the
#     five fixed-group packages at minor; no pre-existing changeset, no
#     `package.json` version, and no lockfile is edited.
#   - The aggregate gate runs ONCE, at the lifecycle quality_gates phase, never
#     in a plan phase:
#       TMPDIR=$PWD/tmp/tmpdir pnpm check
#       TMPDIR=$PWD/tmp/tmpdir ./scripts/lint-commit-range.sh --base origin/main-tools
#     A plan phase runs only what it touches. A command that did not run is
#     never reported as passing.
#
# Findings reported to the PM. Part A holds what this plan reported when it
# was authored against v1.1; part B holds the plan-routed findings of DoR
# iteration 1; part C holds what revision v1.2 found; part D holds the
# plan-routed findings of DoR iteration 2; part E holds what revision v1.4
# found; part F holds the plan-routed finding of DoR iteration 3. Each
# entry records what
# was reported, what the plan declared meanwhile, and who routes it. An entry
# marked CLOSED keeps its text as the record; the others stay open with the PM.
# Part A:
#   I-1 (CLOSED by test plan v1.2) Step numbering in pm.md. The spec says
#      "step 10" (section 2.1, section 16, DEC-6); the test plan said "step 11
#      = `pr_creation`" (section 2 and the TC-LMSG-001 preconditions). The
#      element is `<step id="10">` and the lifecycle phase is 11. Declared:
