  - id: 3
    title: "The `push` command (the lane's own evidence push) and its prompt-required mount"
    kind: delivery
    summary: "add the lane's own act as the twenty-ninth prompt-required command: one structural branch resolution that refuses instead of guessing, one fast-forward push over the delivered seam with nothing authored, one durable record appended after the act, one bounded answer with exit 0 exactly when pushed, and the command composed, helped, counted, documented, and carried through the count-and-tail movement its listing forces."
    # AC: AC-F1-1, AC-F1-2, AC-F4-1 (the command's answer), AC-F2-1 (the
    # repeat act), AC-F6-1 (the composition half: the command is a product
    # surface); DM-1 (the `head` source), DM-4 (the seven recordable causes
    # the command records), DM-5, NFR-1, NFR-2 (the lane end), NFR-4 (the
    # command's own bounds), NFR-6, NFR-7.
    # TC ownership: TC-LCMD-001, TC-LCMD-002, TC-LPUSH-001, TC-LPUSH-002,
    # TC-LRES-001, TC-LRES-002, TC-LRES-003, TC-LRES-004, TC-LRES-005,
    # TC-LSTORE-001, TC-LSTORE-002, TC-LCAUSE-001, TC-LCAUSE-002 (the
    # command-path arms; the seam-level arms landed in phase 2), TC-LOUT-002,
    # TC-LDOC-001, TC-LBND-001, TC-LBND-002 (the lane-end half; its
    # classification half is phase 4's).
    # Scope: spec F-1 ("Branch resolution", "One predicate, two layers, three
    # refusal conditions": the command's layer, the pre-act refusal, and the
    # reachability of the protected-set check), AC-F1-2's Given, F-2 (the
    # lane half), F-3 "The record", F-4 "The command's answer", DEC-1, DEC-4,
    # DM-1, DM-4, DM-5, NFR-1, NFR-2, NFR-4, NFR-6, NFR-7, RSK-1, RSK-6,
    # RSK-7, RSK-9, RSK-10, section 7.2, section 8.1, section 8.2, section 12,
    # section 21, Appendix B, Appendix D step 4, Appendix E; flows 1, 3, and 5.
    #
    # The command, in its declared order.
    # 1. Grammar: exactly one positional, the work-item reference. A missing,
    #    empty, or malformed reference is the delivered `input.value.rejected`
    #    before any branch read, act, or append; an undeclared flag is the
    #    delivered `fallback.invocation`. No new error identity exists.
    # 2. Resolution (NFR-7, AC-F1-2), over two delivered reads reused
    #    unchanged and one delivered pure selection: the change record's
    #    opaque `branch:` value (one bounded pm-notes document read), the git
    #    port's `listBranches` (one bounded local branch read), and
    #    `selectMatchingBranch` over that read with no merged head. Exactly
    #    one rule: a unique convention match that agrees with the declaration,
    #    when a declaration exists, is the resolution (a record without a
    #    declaration resolves on the convention read alone). Everything else
    #    is a typed pre-act input refusal naming the observed state: a
    #    disagreement (both values named), no match (never a current-checkout
    #    fallback), more than one match (the bounded candidate list), or a
    #    resolved name that fails the safe-ref predicate. The command imports
    #    that predicate and the protected-name set from phase 1's two contract
    #    homes through the `@delivery-os/core/contracts` barrel, declares no
    #    copy of either, and never asks the seam for a name its resolution
    #    refused, so the seam's guard is unreachable from here (F-1 "One
    #    predicate, two layers, three refusal conditions").
    #    The safe-ref predicate is the command's one pre-act guard, and it is
    #    exercisable: the convention's final segment is `.+`, so a real
    #    convention match can carry a character the predicate forbids.
    #    The protected-set check stays in the command as defence in depth and
    #    is structurally unreachable (PM ruling R13): resolution only ever
    #    yields a convention match, `^[a-z][a-z0-9-]*/<ref>/.+$`, which always
    #    contains a slash, and no member of `PROTECTED_REF_NAMES` (`main`,
    #    `main-tools`, `HEAD`) is convention-shaped, so no command-path input
    #    can trigger it. It is proven by a direct call of the command's guard
    #    with each protected member, the alphabet predicate and the
    #    protected-name membership check together (the alphabet predicate
    #    alone accepts those names), and by a structural pin of that shape
    #    rule, never by faking a branch selection (TC-LRES-004 steps 5 and 6).
    #    The identical private predicate copies in the git index, merge, and
    #    watchdog adapters stay as delivered (PM ruling R10): the predicate is
    #    unified for the push seam and its command only.
    # 3. The pre-act resolution refusal: no child process, no act, no record,
    #    and an answer that is a typed input refusal carrying neither a verdict
    #    nor a `cause`. Its one exercisable guard arm is the safe-ref refusal
    #    (TC-LRES-004 arm a1: a convention-resolved name carrying a character
    #    the predicate forbids, injected as a branch fact). `unsafe-branch` is
    #    therefore the only guard token a command-path refusal can concern,
    #    and `protected-ref` reaches a record from one command-reachable
    #    source only, a server-side decline (phase 2); the token alone never
    #    identifies the source. The refusal leaves no durable fact by design
    #    (RSK-10): the suites assert the refusal's answer and that no act,
    #    child process, or record followed, and nothing asserts a durable
    #    fact for it.
    # 4. The act: exactly one call of the delivered seam's `pushChangeBranch`
    #    for the resolved branch, in the invocation's own checkout (for a
    #    dispatch-provisioned lane, its worktree). The command stages, commits,
    #    amends, resets, and rewrites nothing: it pushes the head that exists.
    #    No second git path, no shell, no force-capable variant, no retry. At
    #    act time the command reads the invocation checkout's `HEAD` through
    #    the delivered local checkout/head read (the git port's `readCheckout`):
    #    that value is the record's and the answer's `head`, never a value the
    #    transport reports, because the transport returns an outcome and
    #    nothing else (DM-1). The read's checkout-state member is not a refusal
    #    input: resolution refuses a ref, never a checkout state (RSK-9).
    # 5. The verdict: the seam's `accepted` (git exit 0, an already up-to-date
    #    branch included) is `pushed`. The seven recordable causes are
    #    `failed` with the seam's cause, recorded and carried into the answer:
    #    a rejection classified `non-fast-forward`, `auth-rejected`,
    #    `remote-unavailable`, `protected-ref` (a protection or hook decline
    #    git reports), or `unclassified`, a timeout (`timed-out`), and a
    #    spawn-level failure (`spawn-failed`). `unsafe-branch` is guard-only
    #    and never reaches the command, and a protected-set name can never be
    #    a resolved branch (PM ruling R13), so no path turns a pre-act refusal
    #    into a recorded rejection (F-1, DM-4).
    # 6. The record: one append of the phase 1 record under the store fence,
    #    bound to the attempt and session identity of the newest readable lane
    #    record. With no readable lane record (a manual run outside any
    #    dispatch) or an unreadable lane store the identity members are absent
    #    and the act still happens: the identity is best-effort, the act is
    #    not. Act first, append second (RSK-6): a fence or append that fails
    #    in one bounded attempt is disclosed as `recorded: false` with no
    #    `recordedAt`; the act is neither retried nor repeated and no partial
    #    record exists.
    # 7. Idempotence: a second invocation performs another single act and
    #    appends another record (append-only, latest wins). A standing record
    #    never suppresses an act, and a past refusal is never a licence to
    #    force.
    # 8. The answer (DM-5, section 8.1): `ref`, `repository`, and one bounded
    #    `lanePush` object (verdict, branch, the full-hex head read at act
    #    time, one of the seven recordable causes exactly when `failed`,
    #    `recorded`, `recordedAt` exactly when recorded). Human: one
    #    key=value block in the declared key order, at most 16 lines and 2 KiB,
    #    `cause` and `recordedAt` only when present. Exit 0 exactly when the
    #    verdict is `pushed`; exit 1 for a refused act as a data-bearing answer
    #    with no top-level error identity. Redaction rides the delivered
    #    serialization chokepoint unchanged.
    # The lane end's reads and writes, mirroring NFR-2 (PM ruling R8): at
    # most one bounded pm-notes document read (the `branch:` declaration), one
    # bounded local branch read, one bounded local checkout/head read (the
    # recorded `head`), one bounded lane read (the attempt and session
    # identity), one push (60 000 ms at most), and one record append. Each
    # read happens once per invocation, never per step; a re-invocation
    # repeats all six parts once more, because each invocation is a fresh
    # process, and reads the standing lane-push record on no write path
    # (TC-LBND-002 step 3); and no provider read is added.
    #
    # Expected new files, declared by exact path because the commit primitive
    # stages an untracked file only inside the declared scope. The names follow
    # the module families they join; a sibling name is declared drift: this
    # plan is updated and the file is never renamed silently.
    #   - packages/core/src/app/dispatch-lane-push.ts: the use case over
    #     injected ports (the three resolution reads, the seam, the store and
    #     fence, the clock): resolve, act, append, answer.
    #   - packages/cli/src/commands/push.ts: the command definition (the
    #     grammar and the runtime type), in the house pattern of
    #     `commands/commit.ts`.
    #   - packages/cli/src/output/push-text.ts: the answer renderer, in the
    #     per-family pattern of `output/commit-text.ts`. The test plan places
    #     the rendering "beside packages/cli/src/output/dispatch-text.ts"; this
    #     plan reads that as the output family's directory.
    #   - packages/core/src/domain/dispatch-lane-push.ts, CONDITIONAL: only if
    #     the pure rules (the declaration and convention cross-check, the
    #     verdict-to-reference mapping, the record-to-fact projection) get
    #     their own domain module; they may stay pure helpers of the app module.
    # The binding chain: packages/cli/src/production.ts (the act bound over
    # the delivered seam, the store and fence token, the clock, the branch
    # read, the checkout/head read, the change-record read, the command's
    # registration) and
    # packages/cli/src/edge.ts (the runtime assembly, in the pattern of the
    # operator status runtime). The index files are declared for the exports.
    #
    # The mount. RSK-7 names the obligation: the help inventory, the coverage
    # inventory, the reference-page parity pins, the entrypoint restriction,
    # and the composition grow by one in the same change.
    #   - packages/cli/src/help/prompt-required-commands.ts: `push` appended as
    #     the twenty-ninth and last member; every delivered member unchanged.
    #   - packages/cli/src/help.ts: the `push` help entry with a see-also
    #     target in the M4 page root; `dispatch` keeps its ten entries.
    #   - doc/planning/oss-tooling/milestones/m4/commands/push.md: the
    #     reference page at the current milestone's command-page root (spec
    #     section 8.1), carrying `--help` and `--version` like every
    #     prompt-required page.
    #   - tests/fixtures/help-guide/coverage.json: the command and its page.
    #   - scripts/checks/help-guide-coverage.ts and
    #     tests/checks/reference-page-parity.test.ts: the `push` arm of each
    #     `pageFor`, to the M4 root (the GH-346 and GH-348 pattern).
    #   - packages/cli/src/entrypoint.ts is OUTSIDE every scope: it restricts
    #     a composed program by `PROMPT_REQUIRED_COMMANDS` and needs no edit.
