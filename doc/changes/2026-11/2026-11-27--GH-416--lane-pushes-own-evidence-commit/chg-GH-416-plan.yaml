# Phase order
#   1 contracts, the record kind, and the changeset (every later phase
#     consumes them; the changeset exists before any gate can run), plus the
#     safe-ref predicate's home in the dispatch contract module, the
#     protected-name set staying in the closeout contract module, and the push
#     seam importing both through the package barrel;
#   2 the push seam's closed cause (the seam's remaining edit: the child-act
#     classification, a server-side protection decline into `protected-ref`
#     included; its guards run on the shared predicate; reporting only, and
#     the engine consumes the outcome while discarding the cause);
#   3 the `push` command and its mount (the ticket's headline claim, and the
#     only writer of the record the later phases read);
#   4 the classification fold (reads what the command appended);
#   5 the `dispatch status` fact (reads the same record);
#   6 the two product surfaces (the instruction that makes a lane invoke the
#     command; it lands after the command it names is composed);
#   7 the companion decision record;
#   8 the release and reconciliation declaration.
# The command precedes its readers, the reverse of a pure contracts-then-readers
# order, for two reasons: the test plan's risk ranking (section 7.2) puts the
# command's cases first, and with the command first the fold and status suites
# can be driven by records the real command appended as well as by seeded
# records. The mount is part of phase 3 and not a phase of its own: the
# entrypoint selects exactly the prompt-required set and drops every unlisted
# registration, so the command's program-path proofs exist only once it is
# listed, and the help, coverage, parity, and count pins move with the listing
# or the boundary is red. No code-review phase is declared: the lifecycle's
# review_fix phase appends remediation phases to this plan when a review fails
# (the GH-413 pattern), and an empty phase is omitted.
#
# Test plan alignment: the plan is the authority for phase numbering. Each of
# the 31 cases is owned by exactly one phase; a case whose steps span two
# phases names the phase that completes it as its owner:
#   phase 1  TC-LGATE-001 (the changeset half)
