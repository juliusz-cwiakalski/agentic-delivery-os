# ---------------------------------------------------------------------------
# GH-416: M4-S45: A lane pushes its own last evidence commit before it stops
#
# Plan revision v1.0 (2026-11-27), authored from spec v1.1 and test plan v1.1.
#
# Sources, read in full before this plan was authored (the single source of
# truth for every phase, test case, and path below):
#   chg-GH-416-spec.md (v1.1: F-1..F-6, DM-1..DM-5, NFR-1..NFR-8, RSK-1..RSK-9,
#   DEC-1..DEC-7, AC-F1-1..AC-F6-1, Appendices A to E) and
#   chg-GH-416-test-plan.md (v1.1, 31 cases, section 8.3), this folder;
#   chg-GH-416-pm-notes.yaml, whose intake decisions, doc-risk inventory, and
#   owner delivery notes bind the plan.
# Precedent plans read for shape and for pinned-surface discipline:
#   chg-GH-413-plan.yaml (v1.7: the header fences, the per-phase comments, a
#   planning finalize phase) and chg-GH-350-plan.yaml (phase 8: the
#   count-and-tail movement every new prompt-required family carries).
#
# What each phase declares, and where it lives
#   id, title, kind, scope, and interactions are schema keys. Everything the
#   `delivery.plan.v1` schema keeps out of the document is a YAML comment, the
#   established home in both precedent plans: the objective is the one-line
#   `summary` (the commit path uses it as the template subject's text, capped
#   at 72 characters, so each summary leads with the phase's act); the AC and
#   TC ids the phase satisfies are the `# AC:` and `# TC ownership:` comments;
#   the verification commands are the `# Verify:` comments; the exit criteria
#   are the `# Exit criteria:` comments. The plan records no progress: that is
#   a pm-notes `notes:` entry per plan phase (id, commit hash, test result).
#
# Code truth this plan restates, each with the location it was read from (the
# pm-notes retro rule: a restated delivered constant cites its source):
#   - packages/core/src/app/dispatch.ts:1155: the single `appendDispatchAttempt`
#     call, inside `record`; every terminal path reaches classification and its
#     attempt append through that one function.
#   - packages/core/src/app/dispatch.ts:1110-1117: the reserved disclosure
#     block ahead of the 16-slice holds five members: `lane:append-failed`,
#     `lease:not-owned`, `lease:renewal-failed`, `park:recovery-append-failed`,
#     and the `push:<verdict>` parity reference.
#   - packages/core/src/app/dispatch.ts:2213-2221: `tracker:exhausted` rides
#     the evidence slice, not the reserved block.
#   - packages/adapters/src/git/push.ts:145-160: both guards return before the
#     child runner is called (the guards at 145 and 147, the runner at 152);
#     `unsafe-branch` and `protected-ref` are `rejected`; `spawn-failed` is the
#     `failed` outcome's detail; a non-zero git exit is `rejected` with the
#     detail `git-exit-<status>`; `timed-out` carries no `detail` member; the
#     outcome union is `accepted | rejected | failed | timed-out`.
#   - packages/adapters/src/git/push.ts:73: PUSH_DEFAULT_TIMEOUT_MS = 60_000.
#   - packages/core/src/contracts/closeout.ts:146: PROTECTED_REF_NAMES is
#     `main`, `main-tools`, `HEAD`; packages/core/src/domain/closeout.ts:365
#     and :1464 publish the same `protected-ref` literal the seam emits.
#   - packages/core/src/domain/closeout.ts:337-358: `branchConvention` and
#     `selectMatchingBranch` return `none | unique | ambiguous`.
#   - packages/adapters/src/git/index.ts:437-451: the git port's `listBranches`
#     is one bounded local read already narrowed by the convention, carrying
#     each matching branch's name and head.
#   - packages/core/src/contracts/pm-notes.ts:51-59: `branch` is not a typed
#     key of the change record; it is an opaque top-level value.
#   - packages/core/src/contracts/dispatch.ts:89, :97, :636, :672-674: the
#     three-member push-verdict union, `push:<verdict>`, the 16-reference
#     budget, and the lane record's kind and key prefix.
#   - packages/core/src/app/dispatch-lane-view.ts:102-132: `readOperatorStatus`
#     takes one lane read and one park read today.
#   - packages/cli/src/help/prompt-required-commands.ts:11-43: the
#     prompt-required set holds 28 commands and `provider` is last.
#   - .opencode/agent/pm.md: the `pr_creation` work is the element
#     `<step id="10">` ("PR/MR creation (phase 11)") plus phase-definition
#     item 11 inside `<step id="3">`; `<step id="11">` is the stop condition.
#   - .ados-claude/agents/pm.md: a generated projection of that agent file
#     (CI fails a stale projection).
#
# Phase order
#   1 contracts, the record kind, and the changeset (every later phase
#     consumes them; the changeset exists before any gate can run);
#   2 the push seam's closed cause (the only edit to the delivered remote-write
#     seam; reporting only, nothing branches on it);
#   3 the `push` command and its mount (the ticket's headline claim, and the
#     only writer of the record the later phases read);
#   4 the classification fold (reads what the command appended);
#   5 the `dispatch status` fact (reads the same record);
#   6 the two product surfaces (the instruction that makes a lane invoke the
#     command; it lands after the command it names is composed);
#   7 the companion decision record;
#   8 the release and reconciliation declaration.
# The command precedes its readers, the reverse of a pure contracts-then-readers
# order, for two reasons: the test plan's risk ranking (section 7.2) puts the
# command's cases first, and with the command first the fold and status suites
# can be driven by records the real command appended as well as by seeded
# records. The mount is part of phase 3 and not a phase of its own: the
# entrypoint selects exactly the prompt-required set and drops every unlisted
# registration, so the command's program-path proofs exist only once it is
# listed, and the help, coverage, parity, and count pins move with the listing
# or the boundary is red. No code-review phase is declared: the lifecycle's
# review_fix phase appends remediation phases to this plan when a review fails
# (the GH-413 pattern), and an empty phase is omitted.
#
# Test plan alignment: the plan is the authority for phase numbering. Each of
# the 31 cases is owned by exactly one phase; a case whose steps span two
# phases names the phase that completes it as its owner:
#   phase 1  TC-LGATE-001 (the changeset half)
#   phase 2  (the seam-level arms of TC-LCAUSE-001 and TC-LCAUSE-002)
#   phase 3  TC-LCMD-001, TC-LCMD-002, TC-LPUSH-001, TC-LPUSH-002,
#            TC-LRES-001..005, TC-LSTORE-001, TC-LSTORE-002, TC-LCAUSE-001,
#            TC-LCAUSE-002, TC-LOUT-002, TC-LDOC-001, TC-LBND-001,
#            TC-LBND-002 (the lane-end half)
#   phase 4  TC-LFOLD-001..004, TC-LPUSH-003, TC-LOUT-001,
#            TC-LBND-002 (the classification half)
#   phase 5  TC-LSTATUS-001..003
#   phase 6  TC-LMSG-001, TC-LMSG-002, TC-LPUSH-004
#   phase 7  none
#   phase 8  TC-LDOC-002 (manual, after the lifecycle's documentation phase),
#            TC-LGATE-001 (the gate half)
#
# Declaration discipline
#   - The commit primitive stages an untracked (new) file only inside the
#     declared scope, so every new file is declared by exact path in the phase
#     that creates it. A tracked file edited outside the declared scope is
#     still staged, with its drift disclosed. Read-only pins (the contract
#     baseline, the `dispatch <ref>` goldens, the delivered GH-386 suites,
#     packages/core/src/domain/closeout.ts, packages/core/src/contracts/pm-notes.ts,
#     packages/cli/src/entrypoint.ts) are deliberately outside every scope: an
#     edit to one is disclosed, never silent.
#   - A pinned surface moves in the same commit as the code it pins (the
#     GH-413 rule): the inventories, the additivity baseline, the no-shell
#     surface, the family-count pins, the phrase rows. Each is declared beside
#     its code with its authorising clause.
#   - `@doc-syncer` reconciles documentation in lifecycle phase 7 and modifies
#     no source, test files included. So a document statement that a test pins
#     moves with its pin in a delivery phase (the count-and-tail pages in
#     phase 3, the `pr_creation` tail statements in phase 6), and only the
#     unpinned reconciliation is left to phase 7 (named in phase 8).
#   - A file whose edit is conditional says so beside it. A conditional file
#     left untouched is an `undeclared-missing` observation in `plan diff`,
#     never a failure.
#   - Every new source file is governed by the new-code naming check from
#     birth, and formatting follows the repository formatter (`pnpm check` runs
#     the lint and the format check).
#
# Fences binding every phase (spec sections 4.2, 5.1, 7.2, 8, 9, 11, 18)
#   - Owner delivery notes (pm-notes): add the change's changeset before the
#     first gate run; run only the tests a phase affects while working and the
#     whole battery once, at the gate; never search the file system outside the
#     checkout and the change folder; gate evidence uses TMPDIR=$PWD/tmp/tmpdir
#     (with tmp/tmpdir present); commits go through the commit primitive; the
#     pull request targets `main-tools` and stays open.
#   - NG-1 and NFR-1: no force push, no history rewrite, no ref but the change
#     branch's configured upstream. The act is the delivered seam's fixed argv,
#     its literal non-shell child, its 60 000 ms injectable budget, one attempt,
#     no retry; no second git path and no new configuration key.
#   - AC-F1-2 and NFR-7: a branch is pushed only when exactly one rule resolved
#     it. A guessed, current-checkout, ambiguous, unsafe, or protected ref is
#     never pushed.
#   - The two refusal arms (F-1 "Two refusal arms, one question each", DM-4):
#     arm (a) is the command's pre-act input refusal (no child, no act, no
#     record); arm (b) is the seam's own rejection or classification (verdict
#     `failed`, record appended, closed cause). Neither becomes the other.
#   - Act first, append second (RSK-6): a record can never claim a push that
#     did not happen; a failed append is `recorded: false` on the answer.
#   - DM-1 and section 20: the record, the answer, the status fact, and the
#     evidence carry identifiers and full-hex SHAs only; the payload is at most
#     512 UTF-8 bytes; git's failure text, a remote URL, and any credential
#     never reach them.
#   - DM-2 and NFR-5: the reserved block gains at most two references
#     (`lane-push:<verdict>`, `lane-push-cause:<cause>`), so its maximum is
#     seven of the sixteen-reference budget.
#   - NG-2 and DEC-5: no new result token, error identity, error-table row,
#     comparison reason, corroboration source, derivation arm, read-failure
#     source, or attempt-record field. One record kind is the whole structural
#     growth (DEC-2).
#   - NG-3 and NFR-4: `dispatch <ref>` keeps its machine envelope and its
#     four-key text; the GH-386 `push` block stays the parity block; no
#     `dispatch <ref>` golden is regenerated for this change.
#   - NG-4, NG-5, NG-10: the PR workflow's pre-PR push, the engine's ensure-push
#     at the `pr-open` arm, and the bash wrappers' own pushes are untouched,
#     and a repeat push of an equal head is never an error.
#   - NG-6, NG-7, NG-9: no merge capability, no credential or transport change,
#     no pm-notes schema change (the `branch:` value stays opaque).
#   - DEC-6: the tail is pull request, URL note, phase completion, `push`, final
#     message, stop; the push never precedes the phase completion; the lane
#     never retries, forces, authors a commit, or reopens a phase on a refusal;
#     the five prompt markers are unchanged.
#   - NFR-3: `dispatch status` makes no network call, starts no process, takes
#     no fence, appends nothing, deletes nothing, and takes at most one
#     additional bounded lane-push read.
#   - NG-11 and TC-RELEASE-001: the changeset is exactly one new file for the
#     five fixed-group packages at minor; no pre-existing changeset, no
#     `package.json` version, and no lockfile is edited.
#   - The aggregate gate runs ONCE, at the lifecycle quality_gates phase, never
#     in a plan phase:
#       TMPDIR=$PWD/tmp/tmpdir pnpm check
#       TMPDIR=$PWD/tmp/tmpdir ./scripts/lint-commit-range.sh --base origin/main-tools
#     A plan phase runs only what it touches. A command that did not run is
#     never reported as passing.
#
# Findings reported to the PM (not resolved here). Each line states what the
# plan declares meanwhile, so delivery is not blocked, and who routes it. A
# finding the PM settles differently revises this plan.
#   I-1 Step numbering in pm.md. The spec says "step 10" (section 2.1, section
#      16, DEC-6); the test plan says "step 11 = `pr_creation`" (section 2 and
#      the TC-LMSG-001 preconditions). The element is `<step id="10">` and the
#      lifecycle phase is 11. Declared: phase 6 addresses the element and the
#      phase-definition item by content. Route: test-plan-writer (wording).
#   I-2 TC-LCAUSE-001 step 4 asserts "a child invocation" for the two
#      guard-shaped classes reaching the seam. Code truth, spec section 21,
#      TC-LBND-001 step 5, and TC-LRES-004 step 6 all keep the seam's guards
#      before any child. Declared: arm (b) is told from arm (a) by the appended
#      record (verdict `failed`) for every class, and by a child start only for
#      the classes that reach the transport. Route: test-plan-writer.
#   I-3 The test plan's broad note (section 7) calls TC-STATUS-007's read count
#      "the only delivered assertion that must change". The tree disagrees:
#      a twenty-ninth prompt-required command moves the family-count pins
#      enumerated in phase 3, and TC-LDOC-001 step 1 itself requires 29.
#      Declared: mechanical re-pins, each by exactly one; any other delivered
#      assertion that moves is a defect, as the note intends. Route:
#      test-plan-writer.
#   I-4 TC-LDOC-001 step 5 keeps "the M1/M2 page sets byte-unchanged", but
#      doc/planning/oss-tooling/milestones/m1/commands/provider.md:31 calls its
#      family "the twenty-eighth and last", a phrase-pinned statement that
#      stops being true. Decision needed: correct the tail and its phrase row
#      in phase 3 (recommended; GH-350 corrected the previous tail statement the
#      same way) or declare the page a dated snapshot. The page is conditional
#      in phase 3. Route: PM.
#   I-5 TC-LDOC-001 names packages/cli/src/help/index.ts, which does not exist
#      (the inventory is packages/cli/src/help.ts), and names
#      packages/cli/src/entrypoint.ts, which needs no edit. Declared: the real
#      inventory file; the entrypoint outside every scope. Route:
#      test-plan-writer.
#   I-6 RSK-9 and section 12 say an unrelated-checkout run "yields a refusal"
#      and that a main-checkout lane "pushes the branch ref it resolved". The
#      fixed argv (reused unchanged) sources its refspec from the checkout's
#      `HEAD`, and no declared resolution rule compares the resolved branch
#      with the checkout's current branch; no test case covers that run.
#      Decision needed: declare a fifth pre-act refusal with its own case, or
#      restate the residual. Declared: the four spec refusals and the two
#      guards only. Route: spec-writer and test-plan-writer.
#   I-7 Reach neither artifact names: the generated projection
#      .ados-claude/agents/pm.md (declared in phase 6); the count-and-tail
#      pages and pins (declared in phase 3); doc/guides/change-lifecycle.md and
#      doc/overview/glossary.md as phase 7 reach (named in phase 8). Route: PM.
#   I-8 The companion record's id. The next free technical decision id on this
#      branch is TDR-0079. It is a declared expectation: another lane landing a
#      record first moves the declared path. Route: PM, `@decision-advisor`.
#   I-9 The naming lock. ODR-0003 says new commands "join existing families"
#      and the registry asks each family's delivery to record its name, while
#      `install`, `loop`, and `provider` each shipped as a new top-level
#      family. DEC-1 chooses a new top-level family and DEC-7 authorizes one
#      record. Decision needed: the `push` name is recorded inside the
#      companion record or by a note of its own. Declared: one record, no
#      second. Route: PM, `@decision-advisor`.
#   I-10 A phase 7 input, not a defect in the artifacts:
#      doc/spec/features/feature-dispatch-engine.md states that
#      `lane:append-failed`, `push:<verdict>`, and `tracker:exhausted` are
#      reserved ahead of the slice; the reserved block is the five members
#      cited above and `tracker:exhausted` rides the slice. The same page's
#      closure note says the dispatch closure forbids new record kinds. Both
#      are named in phase 8.
# ---------------------------------------------------------------------------
schemaVersion: delivery.plan.v1
workItemRef: GH-416
tier:
  name: full
  escalationTriggers:
    - "A force flag, `--force-with-lease`, a second refspec, a repository argument, a retry, or a shell invocation appears in the command's act path or in the push seam (NG-1, NG-8, NFR-1, NFR-6, TC-LBND-001): stop and report; the act is the delivered seam's fixed argv, once."
    - "A push is performed for a branch that exactly one rule did not resolve: a guessed, current-checkout, ambiguous, unsafe, or protected ref (AC-F1-2, NFR-7, TC-LRES-001 to TC-LRES-004): stop and report; this is the worst outcome of the change."
    - "The two refusal arms collapse: a pre-act resolution refusal starts a child or appends a record, or a seam rejection appends none (F-1, DM-4, TC-LRES-004, TC-LCAUSE-001): stop and report."
    - "The record append precedes the act, a record claims a push that did not happen, the payload exceeds 512 UTF-8 bytes, or git's failure text, a remote URL, or a credential-shaped fragment reaches the record, the answer, the status fact, or the evidence (DM-1, TC-LSTORE-001, TC-LCMD-002, TC-LCAUSE-002): stop and report."
    - "A third lane-push reference joins the reserved block, the block exceeds seven of sixteen, or a new result token, error identity, error-table row, comparison reason, corroboration source, derivation arm, read-failure source, or attempt-record field appears (NG-2, DEC-5, NFR-5, TC-LFOLD-001): stop and report."
    - "The fold fabricates a lane push (a foreign attempt, an absent record, or an unreadable store yields a reference), or a recorded `lane-push:failed` turns a truthful `pr-open` into a failure or suppresses the delivered `push-parity-unmet` row (AC-F3-1, DEC-5, TC-LFOLD-003, TC-LFOLD-004): stop and report."
    - "`dispatch status` makes a network call, starts a process, takes a fence, appends or deletes anything, or takes more than one additional bounded lane-push read, or a delivered member or line changes when the fact is absent (NFR-3, NFR-4, TC-LSTATUS-002, TC-LSTATUS-003): stop and report."
    - "The lane fact appears on the one-shot `dispatch` run's machine envelope or as a fifth key of its text, or a golden of that text is regenerated (NG-3, NFR-4, TC-LOUT-001): stop and report; a golden that must change is escalated, never accepted."
    - "A delivered push path (the PR workflow's pre-PR push, the engine's ensure-push at the `pr-open` arm, a bash wrapper's own push) is removed, reordered, or turned into an error, or a repeat push of an equal head becomes an error (NG-4, NG-10, AC-F2-1, TC-LPUSH-002, TC-LPUSH-004): stop and report."
    - "A product surface orders the push before the `phase complete` step that lands the `pr_creation` completion commit, tells the lane to retry, force, author a commit, or reopen a phase on a refusal, or adds a prompt section marker (DEC-6, TC-LMSG-001, TC-LMSG-002): stop and report."
    - "The full battery is started before the change's changeset exists, or any gate is reported green while a check was skipped, disabled, or made vacuous (NG-11, TC-LGATE-001): stop; the changeset lands in phase 1."
    - "The state-additivity baseline gains anything but the three lane-push constants, a second record kind appears, or a pre-existing changeset, the contract baseline, or a delivered GH-386 suite is edited to go green (DEC-2, TC-RELEASE-001, TC-LPUSH-004): stop and report."
    - "A page outside the declared count-and-tail set is rewritten to satisfy a pin, or the reference page lands outside the M4 command-page root (RSK-7, section 8.1, TC-LDOC-001): stop and report."
    - "Delivery searches the file system outside the checkout and the change folder (owner delivery note 3): stop and report."
defaultLeases:
  - "repo:main-tools"
defaultWeightClass: standard
phases:
  - id: 1
    title: "Contracts, the `dispatch.lane-push` record kind with its append and read, and the changeset"
    kind: delivery
    summary: "declare the contracts every later phase consumes and add the changeset first: the `dispatch.lane-push` record kind with its bounded identifier-only payload, the closed eight-member refusal-cause vocabulary, the `lane-push:` evidence builders, the `push` answer contract, the additive optional `lanePush` status fact, and the record's validator, read, and append in the delivered dispatch ledger."
    # AC: AC-F3-1 and AC-F5-1 (contract basis: DM-1, DM-2, DM-3), AC-F4-1
    # (contract basis: DM-4), AC-F1-1 (contract basis: DM-5).
    # TC ownership: TC-LGATE-001 (the changeset half; its release-suite half
    # is the lifecycle gate's, named in phase 8). The record's behaviour
    # coverage (TC-LSTORE-001, TC-LSTORE-002) rides phase 3, its first real
    # writer: an unused read and append keep this boundary green without a
    # suite of their own (the GH-404 phase 1 pattern).
    # Scope: spec F-3 "The record", F-4 (the cause vocabulary), F-5 (the fact
    # shape), DM-1, DM-2, DM-3, DM-4, DM-5, NFR-5 (the payload bound), NG-9,
    # NG-11, section 18, Appendix B, Appendix C, Appendix E; test plan section
    # 3.2 and TC-LGATE-001.
    #
    # The contracts (packages/core/src/contracts/dispatch.ts):
    #   - the record kind `dispatch.lane-push`, payload schema
    #     `delivery.dispatch.lane-push.v1`, and key prefix
    #     `dispatch.lane-pushes:` (keyed per work-item reference), with the
    #     payload of Appendix B in its declaration order: schema, ref,
    #     repository, branch, head (full-hex), verdict over `pushed | failed`,
    #     cause present exactly when the verdict is `failed`, attemptId and
    #     sessionId present exactly when a lane record was readable at push
    #     time, recordedAt. Identifiers and SHAs only, single-line members, the
    #     whole payload at most 512 UTF-8 bytes.
    #   - the closed refusal-cause vocabulary of DM-4 as ONE constant with
    #     exactly eight members: `protected-ref`, `non-fast-forward`,
    #     `auth-rejected`, `remote-unavailable`, `spawn-failed`, `timed-out`,
    #     `unsafe-branch`, `unclassified`. `protected-ref` is the delivered
    #     literal; no `protected-branch` alias, mapping, or second spelling is
    #     declared anywhere. The seam (phase 2), the command (phase 3), the
    #     record validator, and every pin import this one constant.
    #   - the evidence-reference builders `lane-push:<verdict>` and
    #     `lane-push-cause:<cause>` (DM-2): identifiers only, never git text.
    #   - the `push` answer contract of DM-5 and section 8.1: the data keys
    #     `ref`, `repository`, and `lanePush` (verdict, branch, head, cause,
    #     recorded, recordedAt) and the human block's declared key order.
    # Conditional, ONLY IF the named change happens:
    #   - packages/core/src/contracts/push.ts, when the `push` answer contract
    #     gets its own contracts module (the per-family pattern of
    #     `contracts/commit.ts`). This plan's primary declaration keeps every
    #     addition in the spec-named `contracts/dispatch.ts`, and the record
    #     and the vocabularies stay there whichever way the answer contract
    #     goes.
    # The status fact (packages/core/src/contracts/dispatch-operator.ts): the
    # additive optional `lanePush` member on `DispatchStatusData` (DM-3):
    # verdict, branch, head, recordedAt, and cause when the verdict is `failed`.
    # An optional member nothing produces yet is byte-identical absence, so
    # every delivered status pin holds at this boundary.
    # The ledger (packages/core/src/app/dispatch-ledger.ts, the module that
    # owns every `dispatch.*` record read and append): the record's validator,
    # one bounded read of the family, and one append. The append writes under
    # the store fence, append-only, never rewritten. The read is the one both
    # later readers consume (the fold in phase 4, the status fact in phase 5).
    # Nothing is appended here: no writer exists until phase 3.
    # The pm-notes contract is OUTSIDE every scope (NG-9): the change record's
    # `branch:` value is read as an opaque top-level string and no typed key
    # is added.
    # Pins that move with the contracts, each by exactly the declared addition:
    #   - tests/fixtures/events/state-additivity-baseline.json gains exactly
    #     three constants (the record kind, the payload schema, the key prefix)
    #     and nothing else; the strict equality of
    #     tests/structure/event-state-additivity.test.ts is the proof.
    #   - tests/fixtures/ports/v1-contract-inventory.json and
    #     tests/structure/content-inventory.test.ts register the new exports
    #     and the ledger's two new functions.
    #   - tests/checks/dispatch-contract-invariance.test.ts gains the cause-set
    #     pin of TC-LCAUSE-002 (the eight members, `protected-ref` the
    #     delivered literal) and keeps every delivered closure assertion
    #     byte-identical: the eleven tokens, the closed dispatch and queue error
    #     rows, the three-member push-verdict union, and the comparison-reason,
    #     corroboration, and read-failure vocabularies.
    # Read-only controls proving nothing else grew (never edited):
    # tests/fixtures/dispatch/operator/contract-baseline.ts and
    # tests/checks/operator-contract-invariance.test.ts. The attempt-record key
    # set, the lane-record key set, the error-row count, the configuration-key
    # count, and the token list stay byte-unchanged: no attempt field, no error
    # identity, no configuration key.
    # The changeset (TC-LGATE-001, TC-RELEASE-001): exactly one new file naming
    # the five fixed-group packages (@delivery-os/core, @delivery-os/adapters,
    # @delivery-os/cli, @delivery-os/mcp, @delivery-os/opencode) at minor,
    # `@delivery-os/testkit` absent, with a non-empty body and no pre-existing
    # changeset modified. Its body is the release note: the lane-owned push at
    # `pr_creation` through the `push` command as the twenty-ninth
    # prompt-required command, the durable lane-push record and its folded
