  - id: 2
    title: "The push seam's closed refusal cause: `detail` names why, and git's text stays inside"
    kind: delivery
    summary: "make the delivered push seam name a refusal: `detail` becomes one token of the closed cause vocabulary instead of an exit-code string, a protection or hook decline git reports classifies `protected-ref`, the guards run unchanged on the shared predicate and set, git's failure text is classified inside the seam and never leaves it, and the argv, the spawn, the budget, the single attempt, the four exported names, and the outcome union stay exactly as delivered."
    # AC: AC-F4-1 and AC-F3-1 (the cause half: DM-4); AC-F1-2 (the seam's
    # layer of the one predicate).
    # TC ownership: the seam-level arms of TC-LCAUSE-001 (its vocabulary pin;
    # its guard-only `unsafe-branch` step, a direct seam call refused before
    # the child; the server-side-decline half of its two-source step; the
    # seam-`detail` and child-count halves of its mapping and accounting
    # steps; the engine-consumes-the-outcome-only half of its engine step;
    # and its outcome mapping; v1.6 steps 1 to 5, 7, and 8) and of
    # TC-LCAUSE-002 (v1.6 steps 1, 3, 4, 5, 6, and 7). The direct-consumer
    # step of TC-LRES-004 (its step 7) makes the same direct-seam assertion
    # with an unsafe name and with each protected member. Phase 3 completes
    # both cases with their command-path arms and is their owner; TC-LRES-004
    # is phase 3's in full.
    # Scope: spec F-1 "One predicate, two layers, three refusal conditions"
    # (the seam's layer and the child-act classification), DM-4, DEC-4, F-4
    # "The cause vocabulary is closed", NFR-1, NFR-6, NG-3, section 10,
    # section 13 (the seam reused unchanged except for `detail` and the
    # shared predicate home), section 20, section 21, section 22, Appendix A,
    # Appendix E.
    #
    # What moves in packages/adapters/src/git/push.ts (its remaining edit;
    # the import of the shared predicate landed in phase 1):
    #   - the last return, today `rejected` with the detail
    #     `git-exit-<status>`, classifies git's own bounded failure text into
    #     `non-fast-forward`, `auth-rejected`, `remote-unavailable`,
    #     `protected-ref` (a branch protection or hook decline git reports),
    #     or the honest fallback `unclassified`. The classification patterns
    #     live in this one module; the tokens are imported from the contracts
    #     constant of phase 1, never re-typed. A protection or hook decline
    #     is named `protected-ref` and nothing else (PM ruling R7).
    # What does not move:
    #   - the guard literals `unsafe-branch` and `protected-ref` (the delivered
    #     literal the closeout ref guard also publishes) and the `spawn-failed`
    #     detail;
    #   - the outcome union `accepted | rejected | failed | timed-out`, and
    #     the four exported names (`createGitPushSeam`, `GitPushOutcome`,
    #     `GitPushSeam`, `GitPushSeamOptions`), because
    #     packages/adapters/src/git/index.ts re-exports them and is out of
    #     scope (PM ruling R10);
    #   - the fixed argv `git push --ff-only HEAD:refs/heads/<branch>`, the
    #     literal non-shell spawn with `shell: false`, the 60 000 ms injectable
    #     default with no configuration key, one attempt with no retry, and the
    #     fast-forward-only rule;
    #   - the guard order: both guards return before any child starts, now on
    #     the shared predicate and set.
    # One predicate, two layers, three refusal conditions (F-1). The seam's
    # guard is the layer a direct consumer meets, and the engine's ensure-push
    # is that consumer: an unsafe or protected name is `rejected` with
    # `unsafe-branch` or `protected-ref` before any child, and the engine
    # records it as the delivered `push:failed` parity evidence on its own
    # attempt. The three refusal conditions: an unsafe name is guard-only,
    # always the command's pre-act resolution refusal, and no lane-push
    # record can carry `unsafe-branch`; the protected-set check is defence in
    # depth on both layers, structurally unreachable from a resolved branch
    # (a resolved name is always a convention match and contains a slash; no
    # protected member is convention-shaped), so on the command path no input
    # triggers it while the seam's own guard still refuses a protected name
    # for a direct consumer; a protection or hook decline git reports is
    # observed only through the invocation and is classified from the child
    # act into `protected-ref` (verdict `failed`, record appended), the one
    # command-reachable source of that token. The token alone never
    # identifies the source; the layer and the child count do.
    # The `timed-out` outcome keeps its delivered member-less shape (the union
    # is unchanged, DM-4); its cause token is the outcome's own name, which the
    # command of phase 3 records.
    # No raw text leaves the seam: its return type carries no stdout or stderr
    # and classification discards git's text. The seam returns a closed cause
    # to both of its callers; only the lane's command (phase 3) surfaces and
    # records it. The engine's parity act consumes the outcome only
    # (`accepted` or not) and discards the detail, so its behaviour and its
    # envelope are unchanged and no engine surface carries a cause (NG-3).
    # The suite tests/behaviour/dispatch-lane-push-causes.test.ts is created
    # here for the seam-level arms over the injected child runner: one
    # scripted result for each of the seven recordable outcomes (a protection
    # or hook decline included), a locale-flavoured text, an
    # unclassifiable text, and a stderr carrying a URL and a token-shaped
    # fragment; plus the guard layer by direct seam call, and the engine
    # step's classification arm (two different rejection causes leave the
    # engine's verdict, evidence, token, outcome, exit, and comparison
    # identical). The seam-level class table TC-LCAUSE-001's location names
    # lands in the delivered tests/behaviour/dispatch-push-parity.test.ts,
    # which this phase declares for additive cells only: every delivered cell
    # is never edited (TC-LPUSH-004 step 1).
    # Conditional, ONLY IF the named change happens:
    #   - tests/structure/content-inventory.test.ts, when an edited module's
    #     export allowance changes. The seam's exported names stay as
    #     delivered, so no re-export moves.
    # Read-only controls in this phase (not edited here): the delivered GH-386
    # suites tests/behaviour/dispatch-push-evidence.test.ts,
    # tests/conformance/dispatch/dispatch-parity-push.test.ts, and
    # tests/structure/dispatch-push-envelope.test.ts, and the delivered cells
    # of tests/behaviour/dispatch-push-parity.test.ts.
    # Verify: TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-lane-push-causes.test.ts
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-push-parity.test.ts tests/behaviour/dispatch-push-evidence.test.ts tests/conformance/dispatch/dispatch-parity-push.test.ts tests/structure/dispatch-push-envelope.test.ts
    # Verify: TMPDIR=$PWD/tmp/tmpdir pnpm check:no-shell
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/no-shell-dispatch.test.ts
    # Verify: git diff --check
    # Exit criteria:
    #   - every verify line exits 0;
    #   - `detail` is always one closed token and never `git-exit-<n>`, an
    #     exit-code string, or raw text; an unclassifiable rejection is
    #     `rejected` with `unclassified`;
    #   - the token set is exactly the eight members, pinned as one guard-only
    #     token and seven recordable causes, and the outcome union and the
    #     four exported names are unchanged;
    #   - a direct seam call with an unsafe or a protected name is `rejected`
    #     with its guard token before any child (zero child invocations), and
    #     every child-act outcome names one of the seven recordable causes
    #     with exactly one child invocation attempt; a protection or hook
    #     decline classifies `protected-ref` and nothing else;
    #   - two different rejection causes leave the engine's verdict, evidence,
