  - id: 2
    title: "The push seam's closed refusal cause: `detail` names why, and git's text stays inside"
    kind: delivery
    summary: "make the delivered push seam name a refusal: `detail` becomes one token of the closed cause vocabulary instead of an exit-code string, both guard literals stay byte-unchanged, git's failure text is classified inside the seam and never leaves it, and the argv, the spawn, the budget, the single attempt, and the outcome union stay exactly as delivered."
    # AC: AC-F4-1 and AC-F3-1 (the cause half: DM-4).
    # TC ownership: the seam-level arms of TC-LCAUSE-001 (steps 1, 2, and 7)
    # and TC-LCAUSE-002 (steps 1, 3, 4, and 5). Phase 3 completes both cases
    # with their command-path arms and is their owner.
    # Scope: spec DM-4, DEC-4, F-4 "The cause vocabulary is closed", NFR-1,
    # NFR-6, section 13 (the seam reused unchanged except for `detail`),
    # section 20, section 21, Appendix A, Appendix E.
    #
    # What moves in packages/adapters/src/git/push.ts:
    #   - the last return, today `rejected` with the detail
    #     `git-exit-<status>`, classifies git's own bounded failure text into
    #     `non-fast-forward`, `auth-rejected`, `remote-unavailable`,
    #     `protected-ref` (a protection or hook decline git reports), or the
    #     honest fallback `unclassified`. The classification patterns live in
    #     this one module; the tokens are imported from the contracts constant
    #     of phase 1, never re-typed.
    # What does not move:
    #   - the guard literals `unsafe-branch` and `protected-ref` (the delivered
    #     literal the closeout ref guard also publishes) and the `spawn-failed`
    #     detail;
    #   - the outcome union `accepted | rejected | failed | timed-out`;
    #   - the fixed argv `git push --ff-only HEAD:refs/heads/<branch>`, the
    #     literal non-shell spawn with `shell: false`, the 60 000 ms injectable
    #     default with no configuration key, one attempt with no retry, and the
    #     fast-forward-only rule;
    #   - the guard order: both guards return before any child starts.
    # The `timed-out` outcome keeps its delivered member-less shape (the union
    # is unchanged, DM-4); its cause token is the outcome's own name, which the
    # command of phase 3 records.
    # No raw text leaves the seam: its return type carries no stdout or stderr
    # and classification discards git's text. The cause is reporting only:
    # nothing branches on it, and the engine's ensure-push, the seam's other
    # consumer, ignores `detail`, so its behaviour is unchanged.
    # The suite tests/behaviour/dispatch-lane-push-causes.test.ts is created
    # here for the seam-level arms over the injected child runner: one scripted
    # result per class, a locale-flavoured text, an unclassifiable text, and a
    # stderr carrying a URL and a token-shaped fragment.
