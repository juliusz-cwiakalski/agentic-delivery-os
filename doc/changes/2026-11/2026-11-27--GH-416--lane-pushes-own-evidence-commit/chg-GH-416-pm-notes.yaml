  - text: "Review iteration 1: FAIL (code-review/review-iter-1.yaml, 1 critical, 1
      high, 3 medium, 5 low, 3 info). Critical: the delivered push seam's fixed
      argv is invalid - `git push --ff-only HEAD:refs/heads/<branch>` exits 129
