decisions:
  - text: "Milestone confirmed at intake: the ticket is attached to M4:
      Jaiship-native delivery (milestone 5). No milestone change proposed."
    date: "2026-11-27"
  - text: "Requirements are complete and consistent with the system spec and need no
      owner question. The ticket body plus the owner's delivery comment
      (issuecomment-7205540856, 2026-11-26) define four required behaviours and
      three acceptance criteria, and state that no scope is added or removed.
      The mechanism is left to the delivery and is the specification phase's
      design job."
    date: "2026-11-27"
  - text: "Scope reading of the four required behaviours. (1) The lane pushes its
      own last evidence commit at pr_creation, after the pull request is
      recorded in the pm-notes and before the lane reports; the act authors and
      amends nothing. (2) The wrapper's push stays as a second idempotent step
      and an already-up-to-date push is not an error - the delivered
      adapters/git/push.ts seam already returns accepted on git exit 0. (3) A
      refused push is named in the lane's last message and in the attempt
      record, and the lane never reports completion as if the evidence were on
      the remote. (4) dispatch status reports whether the branch head is on the
      remote."
    date: "2026-11-27"
  - text: "Three design points are reserved for the specification phase and, where
      precedent-setting, a decision record: (a) which typed seam the session
      invokes to push, since no CLI push primitive exists today and the
      delivered push seam is engine-side (TDR-0076, GH-386); (b) how a
      session-side refused push reaches the dispatch attempt record, which the
      engine appends at terminal classification and the session cannot write;
      (c) how dispatch status derives the remote-head fact without breaking its
      declared record-only read posture. feature-dispatch-engine.md states that
      the four operator queries 'make no network call' and each take at most one
      bounded lane read plus at most one bounded artifact or transcript read;
      the delivered additive optional park fact is the precedent for one extra
      bounded record read. The spec must ground each point in a delivered seam
      rather than invent a parallel one, and must reconcile that clause in phase
      7."
    date: "2026-11-27"
  - text: "Owner delivery notes for this lane, taken as part of the brief: add the
      change's changeset before the first gate run (TC-RELEASE-001 fails a
      packages change with no changeset); run only the tests this change affects
      while working and the whole battery once, at the gate; never search the
      file system outside the checkout and this change folder. Gate evidence
      uses TMPDIR=$PWD/tmp/tmpdir; commits go through the commit primitive; the
      pull request targets main-tools."
    date: "2026-11-27"
