decisions:
  - text: "Scope: `ados closeout <workItemRef>` is one idempotent post-merge transaction covering the backlog steps — ticket-to-done, lifecycle label sweep, unassign, owed-flip sweep, comment resolution, checkout restore, and squash-safe local branch cleanup. Harness session telemetry is explicitly out of scope (backlog assigns it to M1-S11)."
    date: "2026-11-01"
  - text: "Provider write coverage v1: GitHub write surface (this repo's dogfood host) and Jira write surface (GH-188 NG-5 explicitly defers ticket-to-done, label sweep, comment resolution, and owed-flip writes to M0-S14). GitLab writes stay declared capability gaps. Remote branch deletion is out of scope; branch cleanup is local and squash-safe."
    date: "2026-11-01"
  - text: "Safety model: closeout is dry-run by default and mutates only with `--apply`, matching the delivered `db` mutating-command precedent. Both plan and apply modes compute the same deterministic transaction plan and converge under re-run."
    date: "2026-11-01"
  - text: "`owed-flip` interpretation (backlog M0-S14 has no further definition): an open work item whose `blocked-by` relations become fully satisfied by this closeout is flipped to the declared owner-attention state `hand-back` (owner owes the next action) and has a `blocked` label removed when present. The sweep is bounded, deterministic, and records every flip."
    date: "2026-11-01"
  - text: "`comment resolution` interpretation: resolve unresolved review threads on the merged delivery request through the provider's thread-resolution surface (GitHub GraphQL `resolveReviewThread`, per .ai/agent/pr-instructions.md). Providers with no delivery-request surface (Jira) declare a capability gap and skip with evidence; do not fail."
    date: "2026-11-01"
  - text: "Idempotency: deterministic operationId from workspace, work item ref, engine, operation, canonical arguments, and provider target (ADR-0003). The first outcome is persisted in the append-only state ledger; a repeat with the same identity returns the persisted outcome instead of re-mutating. Already-satisfied provider state (issue closed, label absent, branch gone, thread resolved) converges as satisfied, never as failure."
    date: "2026-11-01"
  - text: "Git write path: a dedicated git branch-cleanup seam behind a port in the adapters I/O tier; the existing read-only `repo` adapter keeps its no-spawn guarantee so `status`/`queue` stay read-only."
    date: "2026-11-01"
  - text: "OQ-1 resolved by TDR-0008: the additive `DeliveryRequest.headSha` field and `resolve-delivery-thread` operation are decision-record governed and admissible additive-within-v1 extensions; no schema bump/migration; GitHub implements thread resolution, Jira/GitLab declare gaps; owner acceptance rides the GH-183 PR review. The conformance flow registry must gain a `resolve-delivery-thread` step in the same change."
    date: "2026-11-01"
  - text: "OQ-2 resolved (PM-decided): closeout v1 posts no closure comment; `write-comment` stays a declared gap on every provider. No decision record required."
    date: "2026-11-01"
