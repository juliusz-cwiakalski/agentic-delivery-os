findings:
  - id: F-1
    severity: low
    confidence: medium
    category: correctness
    location: packages/core/src/state/closeout.ts:130
    message: >-
      recordFrom validates presence, types, and vocabularies of every expected
      field but does not reject unknown extra top-level keys (hasOnlyKeys is
      applied to target, arguments, and evidence entries, not to the record
      object itself), and timestamp is checked only as a non-empty string
      rather than an ISO-8601 shape. A payload with a stray extra field or a
      non-ISO timestamp validates; folding semantics are unaffected, so this is
      a strictness residual, not a correctness bug.
    suggestion: >-
      Optionally enforce hasOnlyKeys on the record's allowed key set
      (schemaId, operationId, workItemRef, engine, capabilityContext,
      operation, arguments, target, outcome, reason?, evidence, timestamp) and
      an ISO-8601 regex on timestamp. Non-blocking; forward-compatibility
      leniency is a defensible choice if documented.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-2
    severity: info
    confidence: high
    category: design
    location: packages/core/src/state/closeout.ts:201
    message: >-
      appendCloseoutOutcome admits-then-verifies: the new record is written
      before the post-append readCoverage re-read, so a malformed record
      (constructible only by defeating the CloseoutOperationRecord type)
      physically lands in the JSONL and tears the ledger until repairTornTail,
      even though the call returns the classified state.store.torn error. This
      is consistent with the store's append-only/torn-tail design and satisfies
      the thread's never-silent-drop requirement; noting the semantic
      difference from literal pre-admission rejection.
    suggestion: >-
      If strict pre-admission rejection is wanted, run
      recordFrom(payloadFor(record)) before store.append. No action required
      for v1.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-3
    severity: info
    confidence: high
    category: performance
    location: packages/core/src/state/closeout.ts:174
    message: >-
      readCloseoutHistory iterates and validates every closeout record for the
      key on each read, and appendCloseoutOutcome performs two full history
      passes (pre-read + coverage read) on top of the store's own whole-ledger
      verification per operation — cost per closeout operation is linear in
      total ledger size. This matches the pre-existing GH-174 full-verification
      design and per-run operation counts are bounded by the CLOSEOUT_MAX_*
      caps (<= ~311 ops/run), so storage is linear (thread 11's requirement)
      while CPU is O(n^2) across a run; acceptable at v1 scale.
    suggestion: >-
      None now; if multi-work-item stores grow large, consider per-key
      verification caching or an index at a future schema version.
