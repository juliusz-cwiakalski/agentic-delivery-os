summary: >-
  First review iteration of the GH-183 closeout v1 delivery (24 commits, ~14.1k/-0.3k,
  base origin/main-tools). The pure kernel is strong: SHA-256 identity verified
  against node:crypto, deterministic planning, windowed branch-safety predicate,
  bounded output, offline fixtures, and a green battery (structure 97, behaviour
  closeout 110, conformance 82, checks 346, golden 4, providers 78; doc-distribution,
  forbidden/privacy/exit-literal/secret-read/error-table-sync all green). Three
  headline gaps block PASS. (1) There is no production composition: CloseoutComposition.planFacts
  and the provider/git/state runtime bridging exist only in tests/fixtures/closeout/cli.ts,
  so the command has no end-to-end path and the real git seam/state ledger/provider clients
  are never wired to the engine (plan 7.2 / D11, G-1, F-1, §6 Flow 1, §18 dogfood). (2) The
  real `packages/core/src/state/closeout.ts` ledger module is dead code — never invoked by
  production or tests — so NFR-8/AC-NFR8-1 (verified read, torn/malformed classification,
  one-append-per-terminal) is proven only against an in-memory fake. (3) The discriminated
  read observation is not produced by the adapters: an absent GitHub reverse-dependent
  surface collapses to `skipped-noop` (AC-F7-6 wants `skipped-gap` provider-unsupported),
  and an absent label signal collapses to an empty array so AC-F5-3's
  `label-signal-unavailable` skip is unreachable (the `signals` carrier is test-only).
  Tests are green because they inject fakes that model behaviors production cannot emit.
  Spec deviation analysis and per-deviation verdicts are below.
