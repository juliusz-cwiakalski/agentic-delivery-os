    published_thread_id: null
  - id: F-3
    severity: info
    confidence: high
    category: observability
    location: packages/adapters/src/jira/client.ts:294
    message: >-
      unambiguousTransitionId reports zero-match and multi-match through one shared refusal detail
      ("Jira has no unambiguous transition to X"), so an operator cannot distinguish a workflow
      without the destination from two transitions reaching it. Behaviorally correct per thread 7
      (both refuse, never guess); informational only.
    suggestion: >-
      Optionally split the refusal detail into "no transition" vs "ambiguous transition" counts for
      easier triage. No action required for v1.
    suppressed: false
