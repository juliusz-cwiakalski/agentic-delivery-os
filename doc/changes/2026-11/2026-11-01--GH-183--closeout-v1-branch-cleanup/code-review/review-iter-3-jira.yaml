findings:
  - id: F-1
    severity: low
    confidence: high
    category: test-quality
    location: tests/behaviour/providers/jira-closeout.test.ts:111
    message: >-
      The native-transport 204 test hand-rolls a globalThis.fetch replacement with an afterEach
      restore instead of reusing the established fetch-guard seam in
      tests/behaviour/providers/support.ts:98-122. The existing guard is throwing-only so a serving
      stub is understandable, but the ambient-global mutation pattern now lives inline in a test
      file rather than centralized in support.ts. Bun runs tests within a file sequentially, so the
      restore is adequate; this is containment/consistency only.
    suggestion: >-
      Extract a serving fetch guard (canned responses + restore) into tests/behaviour/providers/support.ts
      beside installThrowingFetchGuard and use it for the TC-CLOSE-004 native-transport test.
    suppressed: false
    published_url: null
