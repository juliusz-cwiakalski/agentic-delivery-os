  - id: F-2
    severity: low
    confidence: medium
    category: robustness
    location: packages/adapters/src/jira/client.ts:236
    message: >-
      listBlockedByDependents maps every request() failure — including a preserved
      credential/config failure code — to the plain observation "unavailable", which the domain
      treats as a signal-level skipped-noop. In the composed closeout flow this is unreachable
      because planFacts reads the work item first and throws on a non-payload code
      (packages/cli/src/edge.ts:558-570), but a future direct consumer of the Jira client would
      silently downgrade a config failure to a skip.
    suggestion: >-
      When !response.ok carries a code other than provider.payload.invalid, either surface a
      distinct observation or document the composition precondition (credential identity is
      fail-fast only at the work-item read) on the client contract.
    suppressed: false
