      unchanged control source passes every guard. This is real source-mutation non-vacuity, not
      hand-built tautologies.
  F-12:
    verdict: resolved
    evidence: >-
      packages/cli/src/classify.ts:59-72 documents that the adapter-local provider.payload.invalid
      domainKind "provider" is not the DEC-15/DEC-F-14 AI-model provider engine and adds no
      DOMAIN_KINDS member nor error-table row. Documentation-only; no contract change.
