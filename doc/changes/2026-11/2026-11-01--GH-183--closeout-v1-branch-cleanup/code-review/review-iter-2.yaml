    verdict: resolved
    evidence: >-
      packages/cli/src/edge.ts:360 bridgeCloseoutProvider (GitHub/Jira/GitLab/declared),
      :532 createCloseoutStateRuntime, :546 createCloseoutComposition with planFacts
      (:555) performing read orchestration (readWorkItemObservation, findMergedDeliveryRequest,
      listBlockedByDependents + per-candidate relation reads, git.readCheckout/isClean/resolveRef/
      listBranches/isCheckedOutElsewhere, readCloseoutHistory + foldCloseoutHistory), and
      :1086-1090 registering commands.closeout from a raw CloseoutComposition. The readWorkItem
      impedance is resolved (:373-374 both readWorkItem/readWorkItemObservation delegate to
      client.readWorkItemObservation -> CloseoutReadObservation<WorkItem>).
      tests/behaviour/closeout-integration.test.ts:165 drives plan + apply through runCli, the real
      createGitBranchSeam on a temp repo, and the real JSONL store; the delivery branch exists after
      plan and is absent after apply, and the ledger has records. Matches plan 7.2/D11/G-1/F-1 and
      the status-command composition pattern.
  F-2:
    verdict: resolved
    evidence: >-
      packages/core/src/contracts/closeout.ts:93 CLOSEOUT_REVERSE_DEPENDENT_OBSERVATIONS and :207
      CloseoutReverseDependentObservation (observed/no-surface/not-found/unavailable/invalid).
      Domain mapping packages/core/src/domain/closeout.ts:528 (no-surface -> skipped-gap
      provider-unsupported) and :536-540 (unavailable -> skipped-noop relation-signal-unavailable).
      GitHub client packages/adapters/src/github/client.ts:313-325 maps 404/410 -> no-surface, other
      non-2xx/transport -> unavailable; Jira client src/jira/client.ts:197-202 likewise. Tests:
      closeout-owed-flip.test.ts:14 asserts read-work-item supported + no-surface -> skipped-gap;
      providers/github-closeout.test.ts:113 and providers/jira-closeout.test.ts:156 pin
      404 -> no-surface and 500 -> unavailable. Iteration-1 probe (read-work-item supported +
      dependents unavailable -> skipped-noop) is now the intended signal-level skip.
  F-3:
    verdict: resolved
    evidence: >-
      packages/adapters/src/github/normalize.ts:369-374 observationSignals sets signals.labels/
      relations (observed for a present container incl [], unavailable when omitted) and attaches
      them at :404; jira/normalize.ts:226-231 + :263 equivalent. Write refusal: github/client.ts:346
      and jira/client.ts:215 return providerPayloadFailure when signals.labels is unavailable, so no
      collapsed-empty full-array replace. Tests providers/github-closeout.test.ts:30/41 and
      providers/jira-closeout.test.ts:37 assert the signal originates from the real normalizer and
      the write is refused. Independent probe confirmed omitted-labels -> {labels:unavailable,
      relations:unavailable}, empty-labels -> {labels:observed}, 401/403/500 -> invalid,
      404 -> not-found.
  F-4:
    verdict: resolved
    evidence: >-
      packages/cli/src/edge.ts:532 createCloseoutStateRuntime bridges StateStorePort to
      acquireFence/appendCloseoutOutcome/releaseFence/readCloseoutHistory; planFacts reads history at
      edge.ts:615-621 and throws a classified {kind:"state", code} contained by classifyThrown to
      state.* (packages/client/src/index.ts runCli try/catch). runCloseout consumes the real runtime.
      tests/behaviour/closeout-idempotency.test.ts:306-341 over the real JSONL driver: one record per
      terminal operation, verified re-read, re-run reuse (provider/git call logs empty on second
      apply), and a torn tail -> state.store.torn with empty provider/git calls. Dead-code gap
      removed: appendCloseoutOutcome/readCloseoutHistory are now invoked in production code.
  F-5:
    verdict: resolved
    evidence: >-
      packages/adapters/src/github/normalize.ts:389-392 and jira/normalize.ts:246-249 map 404 ->
      not-found and any other non-404 non-2xx (auth/transport/server) -> invalid with a
      provider.payload.invalid-compatible detail; credential-resolution failure already returned
      invalid. Tests providers/github-closeout.test.ts:54 and jira-closeout.test.ts:55 pin
      401/403/500 -> invalid; 404 remains not-found.
  F-6:
    verdict: resolved
    evidence: >-
      packages/core/src/domain/closeout.ts:555-557,573-574,595-597 adds aggregate openBlockers,
      maxOpenBlockers, and unavailableSignals to the bounded owed-flip evidence;
      closeout-owed-flip.test.ts asserts openBlockers/maxOpenBlockers = 1; golden envelope fixture
      updated (tests/fixtures/closeout/golden/envelope-data.json). Satisfies AC-F7-2.
  F-7:
    verdict: resolved
    evidence: >-
      packages/adapters/src/git/index.ts:202-219 remove() re-reads refs/heads/<branch> immediately
      before `git branch -D` and refuses closeout.branch.unsafe when the head differs from
      expectedHead; :207-212 rejects PROTECTED_REF_NAMES as defense in depth. The planner passes the
      merged head as expectedHead (domain closeout.ts:1018,882-914). Tests:
      closeout-branch.test.ts moved-head-at-delete refuses and keeps the branch; protected-ref
      rejected by the seam.
  F-8:
    verdict: resolved
    evidence: >-
      packages/core/src/domain/closeout.ts:959 targetFailure only projects closeout.target.ambiguous
      when apply is true; plan mode renders the would-refuse branch step. Tests:
      closeout-plan.test.ts plan-mode ambiguity exit 0 with would-refuse step and no git calls;
      apply mode exit 1 closeout.target.ambiguous with no git calls; closeout-output.test.ts ambiguous
      projection is now an apply case. Spec F-10/F-10 wording aligns (feature-closeout.md).
  F-9:
    verdict: resolved
    evidence: >-
      packages/core/src/domain/closeout.ts:495-501 unassignStep reports provider-unsupported with the
