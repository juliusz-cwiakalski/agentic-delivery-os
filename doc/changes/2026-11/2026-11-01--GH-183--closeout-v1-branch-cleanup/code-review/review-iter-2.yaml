      Change-spec DM-11 still describes the read observation as `unavailable` when the provider
      "omitted the signal", but the remediated implementation now models an omitted label/relation
      container as an `observed` read that carries `signals.<field> = "unavailable"` (see
      packages/adapters/src/github/normalize.ts:369 and jira/normalize.ts:226, and the labelStep
      branch at packages/core/src/domain/closeout.ts:451). The downstream behavior (`skipped-noop`
      `label-signal-unavailable`) is unchanged, and the canonical system spec
      (doc/spec/features/feature-closeout.md, feature-provider-client-seeds.md) is accurate, so this
      is a change-artifact wording nuance, not an AC violation. The plan intentionally froze spec/
      test-plan edits during remediation (10.1/10.2).
    suggestion: >-
      When the change artifacts are next touched, reword DM-11 to say an omitted container is an
      `observed` read with an `unavailable` per-signal marker (matching the system spec). No code
      change required for v1.
