      reason is used only when read is observed. closeout-unassign.test.ts asserts unavailable read ->
      skipped-gap/provider-unsupported.
  F-10:
    verdict: resolved
    evidence: >-
      packages/core/src/domain/closeout.ts:806 utf8ByteLength and :814/:816/:1157 use it for the
