summary: >-
  Iteration-2 re-review of the GH-183 closeout v1 delivery after remediation commits
  3737d17, 546ec43, 261123b, ab29d9b, 549a39f and the doc re-sync 5ef24ed. All four
  blocking findings (F-1..F-4) and all eight non-blocking findings (F-5..F-12) are
  resolved with code, tests, and docs, and I independently reproduced the iteration-1
  probes that exposed them. The production closeout composition now exists in
  packages/cli/src/edge.ts (createCloseoutComposition bridges real GitHub/Jira/GitLab
  clients, the real git seam, and the StateStorePort; planFacts implements the read
  orchestration; createConfigProgram registers the command from the raw composition) and
  is driven end to end through runCli against a temp git repo. The reverse-dependent read
  now carries a distinct no-surface observation that maps to skipped-gap/provider-unsupported
  while unavailable stays skipped-noop/relation-signal-unavailable. The real normalizers emit
  signals.labels/relations and both label-write paths refuse an unavailable signal instead of
  replacing from a collapsed empty set. The real closeout.operation ledger is wired over the
  JSONL driver and tested for one-record-per-terminal, verified re-read, torn tail -> state.*,
  and re-run reuse. The full offline battery is green (2243 pass / 3 skip / 0 fail),
  typecheck/lint/format/boundaries/build/exports-parity pass, and every invariant gate
  (error-table-sync, secret-read-boundary, conformance, inventory/allowances, doc-distribution)
  is intact and unweakened. Two low and one info non-blocking observations remain; none blocks
  PASS. Recommend proceeding to quality gates and DoD.
