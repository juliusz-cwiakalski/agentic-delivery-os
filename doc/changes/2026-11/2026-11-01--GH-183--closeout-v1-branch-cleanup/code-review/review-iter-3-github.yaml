cross_cutting_checks:
  gate_weakening: >-
    None. tests/structure/content-inventory.test.ts adds exactly one allowance for the one new
    export (normalizeReviewThreads). No existing assertion was loosened; the merged-selection,
    reverse-dependent, and write tests are unchanged and now additionally assert the blockers
    URL, GraphQL thread content, and the unresolved-mutation failure. The fixture transport
    still throws on any unfixtured request (tests/behaviour/providers/support.ts:75-88), and
    the new requestBodyContains matcher is precise: "reviewThreads" does not substring-match
    "resolveReviewThread(" (next char is "(", not "s") and vice versa, so the two /graphql
    routes cannot satisfy each other.
  synthetic_fixtures_hiding_production_gaps: >-
    Largely addressed — the synthetic `merged: true` and `issue_links` fields are gone from the
    closeout fixtures and the issue_links shape survives only as a negative control. Two
    residuals are filed as findings: the un-paginated first:100 reviewThreads read (F-1) and
    the conformance read-work-item expectation still pinning issue_links-derived relations
    (F-3), plus a live-shape confirmation note (F-5).
  read_only_isolation: >-
    No regression. The commit adds one REST GET (blocked_by) and one GraphQL query POST (a
    semantic read; GitHub GraphQL requires POST). No new mutating surface, no ambient I/O;
    credential resolution still flows exclusively through the injected CredentialPort.
  capability_honesty: >-
    Preserved. The threadStep capability-gap branch (skipped-gap/provider-unsupported) still
    precedes signal handling; the new threads-unavailable branch is a signal-level
    skipped-noop consistent with the established label/relation signal pattern, and no-surface
    vs unavailable remains discriminated for the reverse read.
  contract_additions: >-
    CloseoutObservedSignals.threads (contracts/closeout.ts:184) is produced by the GitHub
    client and consumed by the domain threadStep. The optional invalid.code field (:199) is
    forward-looking within 87b1214 but is consumed by the sibling Jira remediation commit
    601706c (packages/adapters/src/jira/client.ts:200), so it is not dead contract surface on
    the branch.
findings:
  - id: F-1
    severity: medium
    confidence: medium
    category: correctness
    location: packages/adapters/src/github/client.ts:123
    message: >-
      REVIEW_THREADS_QUERY fetches `reviewThreads(first: 100)` with no `pageInfo/hasNextPage`
      follow-up. CLOSEOUT_MAX_THREADS is also 100, so resolution count is aligned, but a PR
      with more than 100 unresolved threads has the overflow silently invisible: the signal
      reports "observed", the domain's truncation evidence never fires (100 is not > 100), and
      if GitHub returns threads in creation order a second closeout run would re-read the same
      resolved first page and report the step satisfied while threads 101+ remain unresolved.
      This is the same bounded-read-presented-as-full-truth class the PR review targeted.
    suggestion: >-
      Request `pageInfo { hasNextPage endCursor }` and either follow pages while below the
      domain cap, or treat hasNextPage=true at the cut as a truncation/unavailable signal so
      the plan never claims full thread truth from a partial page. Low likelihood (>100-thread
      PRs are rare) but cheap to make honest.
    suppressed: false
