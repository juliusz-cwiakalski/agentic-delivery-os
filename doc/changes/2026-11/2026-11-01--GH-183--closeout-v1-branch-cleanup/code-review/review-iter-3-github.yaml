review_threads:
  "1 PRRT_kwDORCEXJ86yYRX4 (REST merged_at as merge truth)":
    verdict: resolved
    evidence: >-
      Code: packages/adapters/src/github/normalize.ts:119 computes
      `merged: payload.merged === true || stringField(payload, "merged_at") !== undefined`; a
      non-null timestamp string is merge truth, and `null` returns undefined from stringField
      (typeof null !== "string") so an unmerged PR stays unmerged. The merged-only filter at
      normalize.ts:319 (reviewState === "merged") is unchanged. Fixtures:
      tests/fixtures/providers/github/closeout-pulls-merged.json now carries realistic REST list
      shapes — PR 42 `merged_at: "2026-10-20T09:15:00Z"` (line 7), PR 504
      `merged_at: "2026-10-31T18:42:11Z"` (line 17), open PR 505 `merged_at: null` (line 27) —
      with the synthetic `merged: true/false` fields removed. Tests:
      tests/behaviour/providers/github-closeout.test.ts:136-144 asserts exactly ["42", "504"]
      survive the merged filter, and the production-composition test at
      tests/behaviour/closeout-integration.test.ts:184-189 drives the real composition with a
      `merged_at`-only PR (no `merged`, no synthetic `review_threads`).
  "2 PRRT_kwDORCEXJ86yYRYF (GraphQL review threads for the selected merged PR)":
    verdict: resolved
    evidence: >-
      Code: packages/adapters/src/github/client.ts:122-123 defines the REVIEW_THREADS_QUERY;
      client.ts:361-398 re-reads the selected merged PR through `POST /graphql` after the REST
      list selection. Every failure mode — non-numeric entity id (:365-371), non-OK GraphQL
      response (:380-386), and a malformed payload via normalizeReviewThreads
      (normalize.ts:377-412 rejects a missing data/repository/pullRequest/reviewThreads/nodes
      chain as a payload failure, never an empty set) — returns `observation: "observed"` with
      `signals: { threads: "unavailable" }`, per the comment at client.ts:361-363. Domain:
