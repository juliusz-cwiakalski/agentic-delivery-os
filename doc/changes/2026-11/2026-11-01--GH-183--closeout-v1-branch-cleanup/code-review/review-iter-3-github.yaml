scope: >-
  Focused static review of the GitHub-provider remediation commit 87b1214 ("fix(github): read
  merge truth, threads, and dependency shapes") against five PR #215 review threads. Per the
  requester's constraint this is a static review: the commit diff and the named files were read;
  no test suite was executed and no source file was modified.
status: PASS
summary: >-
  All five in-scope PR #215 review threads (1, 2, 3, 9, 13) are resolved in commit 87b1214 with
  both production code and committed tests. The REST PR list merge truth now reads `merged_at`
  with realistic timestamp/null fixtures; the selected merged PR's review threads are re-read
  through a GraphQL `reviewThreads` query whose failure preserves a `threads: "unavailable"`
  signal that the domain maps to `skipped-noop/thread-signal-unavailable`, never an observed
  empty set; thread resolution now requires the provider-asserted `isResolved: true` and treats
  `false` as `provider.payload.invalid`; blocker relations come exclusively from the
  `/issues/{n}/dependencies/blocked_by` surface with availability derived from that response;
  and the reverse read uses the production `/issues/{n}/dependencies/blocking` endpoint where
  404/410 is a declared `no-surface` gap, never an empty observed set. No gate weakening was
  found: the content-inventory allowance adds exactly the one new export, no assertion was
  loosened, several were strengthened, and the fixture transport still throws on any unfixtured
  provider request. Five non-blocking findings remain (1 medium bounded-read honesty gap on
  >100-thread PRs, 2 low, 2 info); none blocks PASS.
