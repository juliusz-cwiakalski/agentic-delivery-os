# GH-243 implementation plan — M1-S10: Status collector expansion
#
# Sources (single source of truth):
#   - Spec:  ./chg-GH-243-spec.md (v1.1; F-1..F-10 plus F-4a; 23 ACs
#     AC-F1-1..AC-F10-1 and AC-NFR-1..3; NFR-1..10; DM-1..DM-13; DEC-1..DEC-18;
#     Appendix A finding-code registry, Appendix B bounds, Appendix C
#     ready-to-merge derivation row, Appendix D ticket-AC traceability)
#   - Test plan: ./chg-GH-243-test-plan.md (rev 1.1; 42 TCs TC-ATT-001..042;
#     binding in-process harness §4.1; non-vacuity contract §4.2; automation
#     map §7; execution order §7)
#   - PM notes: ./chg-GH-243-pm-notes.yaml (three binding decisions: exit codes
#     unchanged, no --watch, lanes declared not-delivered; phase-7 doc-risk list)
#   - Code truth inspected: packages/core/src/contracts/status.ts (six ids,
#     24/4096 human bounds, STATUS_HYGIENE_FINDINGS item-level vocabulary),
#     packages/core/src/domain/status.ts (six section builders, summaryOf,
#     renderStatusHuman), packages/cli/src/commands/status.ts +
#     packages/cli/src/edge.ts (composition — NO change required; every new
#     surface derives inside the pure aggregator from already-injected facts),
#     packages/adapters/src/github/normalize.ts (labels mapped, milestone NOT
#     yet), packages/adapters/src/file/pm-context.ts (parked projection lacks a
#     condition), packages/core/src/{contracts,domain}/owner-gate-sla.ts
#     (evaluateOwnerGateSla, OWNER_GATE_SLA_POLICY, unknown-age markers),
#     packages/core/src/{contracts,domain}/queue-ready.ts (close-class
#     vocabulary + numeric-aware rank keys), tests/fixtures/status/** (harness,
#     12 corpus cases, matrix, goldens), tests/structure/**, tests/types/**,
#     tests/checks/**, scripts/checks/**.
#
# GAP-1/A-T2 mapping obligation: all 42 TCs are mapped onto Phases 1–7 below
# without reshaping any TC's behaviour, states, reasons, codes, bounds,
# assertions, or AC/NFR mapping. Per-phase `coverage` entries carry the
# mapping; TCs whose structure half and behaviour half land in different phases
# are marked with the completing phase. The full TC and AC matrices are pinned
# in the comment block at the end of this file.
#
# Spec/test-plan/code cross-check (performed before authoring; findings
# recorded, none blocking, nothing silently adapted):
#   1. BRIEF_SURFACE_ORDER (packages/core/src/contracts/brief.ts) is today
#      auto-derived as [...STATUS_SECTION_ORDER, ...placeholder ids]. Spec §12
#      assumes the brief's nine-surface catalog "is its own contract and is not
#      auto-derived from the section count". Growing STATUS_SECTION_ORDER 6→9
#      without decoupling would silently grow the brief catalog to twelve and
#      break TC-ATT-038. Resolution (Phase 1, delivery decision D-3): pin
#      BRIEF_SURFACE_ORDER to its own literal nine-id list — same nine values,
#      zero brief payload change, brief suites stay green with no contract-edit
#      beyond the mechanical decoupling. Reported to the orchestrator.
#   2. Findings-cap constant spelling varies inside the test plan: TC-ATT-002
#      step 1 writes `STATUS_MAX_SECTION_FINDINGS` while TC-ATT-003 step 2 and
#      DEC-15 write `STATUS_MAX_FINDINGS_PER_SECTION`. GAP-12/A-T8 pin values,
#      not spellings ("names delivery-bound; values pinned"). Resolution
#      (delivery decision D-1): one canonical constant named
#      STATUS_MAX_FINDINGS_PER_SECTION = 8; TC-ATT-002's spelling is read as
#      the same constant. Non-blocking.
#   3. "Nine sections × five states" (AC-NFR-1, NFR-10) is shorthand; the
#      precise oracle is TC-ATT-033 step 2 — every state in each section's
#      DECLARED derivation row (ready-to-merge: four states, never
#      not-delivered; lanes/spend/blockers: not-delivered only). The plan
#      follows the precise reading.
#   4. The CLI edge and StatusCommandRuntime need NO change: the
#      ready-to-merge section, findings, hygiene assertions, owner-gate ages,
#      and placeholders all derive inside aggregateStatus from facts the edge
#      already injects (spec Flow 4). Confirmed against edge.ts.
#   5. The existing item-level hygiene field `findings: ["missing-title", ...]`
#     (kebab, on StatusTrackerItem) is a different layer from the registry's
#     dotted section-level findings[] codes; TC-ATT-010 keeps the item field
#     unchanged while the section findings[] carries the code. No conflict.
#
# Delivery decisions recorded by this plan (delivery-bound items the spec and
# test plan leave open; recorded against the spec per the GAP/OQ discipline):
#   - D-1 Canonical bound constant spellings (GAP-12): STATUS_MAX_FINDINGS_PER_SECTION,
#     STATUS_MAX_FINDING_MEMBERS, STATUS_MAX_READY_ITEMS (all = 8), plus the
#     raised STATUS_MAX_HUMAN_LINES = 32 and STATUS_MAX_HUMAN_BYTES = 6144.
#   - D-2 Findings-layer seam (DEC-15/TC-ATT-008): the pure findings evaluation
#     accepts an injectable registry whose default is the shipped contract
#     registry; the test-only 10-code extension injects at that seam inside the
#     test tree only, and the production registry is never mutated or widened.
#   - D-3 Brief surface-order decoupling (cross-check item 1): literal
#     nine-id BRIEF_SURFACE_ORDER, byte-identical brief output.
#   - D-4 SLA reuse seam (DEC-6/F-5): domain/status derives gate facts from the
#     SAME tracker read's owner-hand-back items (kind "owner-review", ref =
#     entityId, activityAt = updatedAt), evaluates with OWNER_GATE_SLA_POLICY
#     imported by reference over the injected clock, audience "coordinator",
#     injects NO existing decision records (no state read; the read budget
#     stays 3 network reads / 1 park fold / 1 config resolve), DISCARDS
#     decisionsToApply, and projects only age/ageUnknownReason/slaState (DM-8;
#     default/waivedBy never rendered — TC-ATT-014 step 5). Unknown age
#     therefore always escalates (TC-ATT-015) and expiry-eligible gates render
#     default-applied without any write.
#   - D-5 Mapped-signal projection (F-4a/DM-13/DEC-14): WorkItem gains an
#     optional additive `milestone` field (camelCase, DEC-17) mapped in
#     normalizeGithubIssue from the same issue payload's milestone; the GitHub
#     slice declares all three assertion signals available (labels were already
#     normalized; milestone now mapped); availability is declared contract data
#     on the tracker read result, never runtime-inferred. Other slices stay
#     all-unknown where unmapped.
#   - D-6 Placeholder identity (DM-6): spend capability id `spend-summary`
#     (expectedStory M1-S19) and blockers capability id `typed-blockers`
#     (expectedStory M1-S16), reason engine-not-delivered, notes exactly
#     "spend summary arrives with M1-S19" / "typed blockers arrive with M1-S16"
#     (human lines pinned byte-exact by TC-ATT-019/020; ids delivery-bound).
#   - D-7 Truncation-marker reading (TC-ATT-007 notes): the section `truncated`
#     flag declares member/finding drops; counts.omitted keeps its shipped
#     ranked-item meaning and is never inflated by member drops.
#   - D-8 Golden regeneration (A-T10): digest.json/human.txt plus the declared
#     state variants (header-absent, degraded merge-ready-?) are regenerated
#     exactly ONCE in Phase 2 — the only phase that changes rendered bytes —
#     as a reviewed diff recorded in the change revision log; later phases add
#     tests/fixtures only and never touch committed golden bytes.
#   - D-9 Section item surface for sections 7–9 (DM-3 uniform shape): the
#     ready-to-merge section renders its DM-5 items through the uniform
#     `items` surface (union item type); placeholders carry zero items.
#
# Phase-boundary greenness strategy (each phase committable, type-safe,
# gate-green): Phase 1 adds contract data, types, and the adapter mapping but
# changes NO rendered digest bytes (the aggregator keeps emitting six sections;
# structure suites are extended in the same phase). Phase 2 is the single
# machine-and-human surface phase: it wires every additive surface and lands
# the one golden regeneration plus the allowlist-governed expectation updates
# (TC-ATT-037 discipline). Phases 3–6 add behaviour suites, fixtures, and
# checks over already-wired, already-pinned behaviour; Phase 7 finalizes.
#
# Tier rationale: `full` — 10+1 capabilities, 23 ACs, 42 automated TCs,
# cross-package delivery (core contracts + ports + domain, github/file
# adapters, consumer reconciliation), an additive change to a shipped,
# byte-pinned contract surface. All phases are delivery kind; plan-level
# defaultLeases/defaultWeightClass apply. Per-phase completion: one
# Conventional Commit per phase (the `summary` key, landed via @committer)
# plus the `testGate` commands passing; typed doneArtifacts slots are declared
# on the final phase where the evidence exists.
#
# Invariants carried by every phase (spec §7.2/§21, NFR-1..10, DEC-1/DEC-16):
# additive-only over delivery.status.v1 (sections 1–6 frozen in id, order,
# derivation, required fields; only the DEC-16 optional-field allowlist may be
# added); exit codes unchanged (DEC-9); no --watch (DEC-10); read budget
# exactly 3 network reads + 1 park fold + 1 config resolve with zero new reads
# (NFR-4); read-only — zero writes, fences, mutations, child processes, and
# zero SLA decision records (NFR-7); no new package, subpath, runtime-API
# location, error-table row, domain kind, or configuration key (NG-10);
# brand-neutral (injected binary name, no product literals); every new item
# surface capped with explicit truncation (NFR-1); determinism — total,
# order-independent rank keys (NFR-6); no-evidence-no-claim (DEC-18); lanes
# never fabricated, dormant lane.idle-no-reason never emitted (DEC-7); findings
# carry registry codes and identities only — no titles, payloads, secrets, or
# free-form text (NFR-8/9); schema version stays delivery.status.v1 (DEC-1).

