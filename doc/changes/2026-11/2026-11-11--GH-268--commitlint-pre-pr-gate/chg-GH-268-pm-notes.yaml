decisions:
  - text: "Keep `.husky/commit-msg` warn-only (ticket item 3 is explicitly
      optional). The hook documents 'CI commitlint is the authority' under
      RSK-3/NFR-9 and a blocking hook would change commit-time behaviour for
      every commit and collide with the `commit` primitive's own
      validation-and-one-retry path. The ticket's own acceptance scopes the
      change to docs + script/prompt with no behavioural change to delivery
      semantics."
    date: "2026-11-11"
  - text: "Include the resume-sync merge instruction in scope.
      `scripts/deliver-ticket.sh` emits a bare `git merge origin/<base>`, which
      produces exactly the plain `Merge remote-tracking branch ...` commit the
      ticket's rule 1 forbids; leaving it unchanged would keep generating the
      violations the gate then rejects. Expect a conventional-subject `--no-ff`
      merge (or rebase) instruction plus its prompt assertion in
      `scripts/.tests/test-deliver-ticket.sh`."
    date: "2026-11-11"
  - text: "Local gate is repo automation (a `scripts/*.sh` gate plus its
      `scripts/.tests/` suite), not a new CLI command. The ticket bounds the
      change to 'docs-only + script/prompt change; no behavioural change to
      delivery semantics', and a new `delivery-os` subcommand would be a
      product-surface change outside that boundary."
    date: "2026-11-11"
