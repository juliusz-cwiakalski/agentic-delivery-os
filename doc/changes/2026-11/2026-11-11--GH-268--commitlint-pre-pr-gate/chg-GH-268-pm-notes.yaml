      index/ref/stash digests identical across a PASS run and a usage-error run.
      Dogfood: ./scripts/lint-commit-range.sh --base main-tools -> 'VERDICT:
      PASS — 18 commits in range; 0 offending commit(s); 0 distinct rule(s)
      hit', binary=node_modules/.bin/commitlint origin=repository-local, no PATH
