      change (stash@{0} feat/GH-112 and stash@{1} feat/GH-37, both 2026-07-04).
      The property the line exists to protect — the stash is unchanged by the
      gate — is proven directly: identical stash-list digest before/after PASS
      and usage-error runs, plus TC-COMMITLINT-018's index/ref/file-list/fsck
      digests across PASS, FAIL, SKIP and ERROR. No stash was touched or dropped."
    type: info
    date: "2026-11-11"
  - text: "Plan phase 2 COMPLETE — the stated commit-message contract and the
      quality_gates wiring. Commit 8a1a43de: .opencode/agent/committer.md gains a
      <message_contract> block (conventional `type(scope): summary` subject
