      markers so the plan's declared bash posture (per .ai/rules/bash.md section
      10.2) holds — comment-only, suite re-run green; (b) one declared
      verification literal is not literally satisfiable and is recorded rather
      than weakened: plan line 13 also asserts 'test -z \"$(git stash list)\"',
      but two user-owned stashes predate this change (stash@{0} feat/GH-112 and
      stash@{1} feat/GH-37, both 2026-07-04). The property the line exists to
      protect — the stash is unchanged by the gate — is proven directly:
      identical stash-list digest before/after PASS and usage-error runs, plus
      TC-COMMITLINT-018's index/ref/file-list/fsck digests across PASS, FAIL,
      SKIP and ERROR. No stash was touched or dropped."
    type: info
    date: "2026-11-11"
  - text: "Plan phase 2 COMPLETE — the stated commit-message contract and the
      quality_gates wiring. Commit 8a1a43de: .opencode/agent/committer.md gains
      a <message_contract> block (conventional `type(scope): summary` subject
      carrying the work item ref; body and footer lines within 100 characters;
      no plain 'Merge remote-tracking branch ...' subject left behind; both
      remediation modes SURGICAL REWORD / CONDENSE-TO-ONE by offending-commit
      count; the four-clause ownership split), .opencode/agent/pm.md step 8
      gains the range lint as a required step before `phase complete` (PASS/SKIP
      proceed, FAIL loops in the named mode through @coder and re-runs, ERROR is
      never a pass and blocks completion, verdict recorded as a pm-notes notes
      entry, ownership restated), and .ados-claude/agents/{committer,pm}.md were
      regenerated together. Delivered criterion: AC-F4-1 (TC-PROMPT-001,
      TC-PROMPT-002, TC-PROMPT-003). Verification observed: pnpm check:prompt ->
      'prompt-conformance: 5 prompt(s) clean'; the load-bearing prohibition
      survives byte-identical ('Never run `git add`, `git commit`, `git reset`,'
      now at committer.md:39 after the insertion); the raw-write scan over both
      prompts yields only negated matches (empty after the negation filter);
      SURGICAL REWORD/CONDENSE-TO-ONE, 'Merge remote-tracking branch'/100,
      type(scope)/conventional and the ownership greps all hit;
      lint-commit-range/phase complete/unable to verify/ERROR/pm-notes all
      present in pm.md step 8; scripts/build-claude-plugin.sh rebuilt 24 agents
      and 20 skills and left no pending .ados-claude change (porcelain empty),
      and the .ados-claude diff since the delivery base is exactly
      .ados-claude/agents/committer.md and .ados-claude/agents/pm.md. Mechanism
      note on subjects: the commit primitive's template derives the subject from
      the top staged path for a standalone commit, because a lifecycle phase
      that maps to several plan phases suppresses the per-phase summary (the
      union is only used when every matching summary is identical); every commit
      of this change is therefore 'chore(GH-268): update <top-path>', which is
      conventional and carries the work item ref as required, but not the plan
      phase summary the plan's pins describe."
    type: info
    date: "2026-11-11"
  - text: "Plan phase 3 COMPLETE — the resume-sync instruction stops manufacturing
      the forbidden subject. Commit 7c789e7d changes one line of
      scripts/deliver-ticket.sh inside build_delivery_prompt: 'git merge
      origin/${base_branch}' becomes 'git merge --no-ff origin/${base_branch} -m
      \"chore(${ticket_ref}): sync with ${base_branch}\"'; the fetch line and
      every other instruction are untouched.
      scripts/.tests/test-deliver-ticket.sh replaces the old assertion with a
      shared assert_resume_sync_contract helper (exactly one merge line, -m with
      a conventional chore/build/ci subject naming the work item ref, zero bare
      'git merge origin/<ref>' lines, fetch preserved) and adds TC-DT-08g3, a
      counterexample probe that reverts the instruction in a throwaway copy of
      the script under test and requires the helper to reject it. Delivered
      criterion: AC-F5-1 (TC-PROMPT-004, TC-PROMPT-005, TC-PROMPT-006).
      Verification observed: suite 136/136 PASS including both resume-sync
      tests; test-deliver-ticket-result-tuples.sh and
      test-deliver-ticket-result-tuples-modes.sh green; the diff since the
      delivery base for deliver-ticket.sh contains zero changed content lines
      that do not mention 'git merge' (confinement to build_delivery_prompt's
      merge instruction); zero bare-merge matches in the script and zero in the
      generated prompt; worktree clean at the phase boundary. One mechanism
      deviation, recorded not weakened: TC-PROMPT-005 describes the probe as a
      'cp -a' copy of the repository with the suite re-run from the copy. The
      probe here copies only scripts/deliver-ticket.sh and evaluates the shared
      assertion against the prompt it builds. Rationale: a full-repository copy
      carries the 280 MB node_modules tree and a nested full-suite run (~60 s)
      that would re-enter this same probe; copying the single script under test
      exercises the identical assertions and isolates the reverted instruction
      as the only cause of failure, which is stronger evidence than a nested run
      that could fail for unrelated reasons. The probe also asserts the delivery
      tree still carries the conventional-subject instruction after it runs."
    type: info
    date: "2026-11-11"
