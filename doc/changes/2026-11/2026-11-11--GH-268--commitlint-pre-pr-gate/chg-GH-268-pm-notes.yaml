      AC-F3-1..AC-F3-6, AC-NFR4-1, AC-NFR6-1. Verification observed: bash -n
      clean; suite 39/39 PASS (TC-COMMITLINT-001..021); --help and --version
      exit 0 with a semver-shaped 1.0.0; usage documents 0/1/2 with meanings
      plus the 130 interrupt carve-out; --nonsense exits 2 naming the accepted
      invocation with GIT_TRACE showing zero
      rev-list/merge-base/rev-parse/for-each-ref calls; exit literals limited to
      2 plus exactly one 130 inside _on_interrupt, installed by trap (INT/TERM);
