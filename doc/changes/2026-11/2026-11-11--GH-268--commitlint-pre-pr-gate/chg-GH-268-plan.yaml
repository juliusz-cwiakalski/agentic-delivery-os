#     `implementation_plan: ./chg-GH-268-plan.yaml`; 40 TCs:
#     TC-COMMITLINT-001..021, TC-PROMPT-001..006, TC-DOC-001..007,
#     TC-DIST-001..003, TC-CONFINE-001..002, TC-DOGFOOD-001; §6.2 fixture matrix
#     with the amended binary-resolution rows FX-CLEAN-NO-DEPS/FX-LOCAL-BIN/
#     FX-DECOY-PATH/FX-PATH-FOREIGN/FX-NO-CONFIG-LOCAL-BIN, the split DM-1.h
#     fixtures FX-BAD-CONFIG (fixture-local binary) / FX-BAD-CONFIG-NO-LOCAL
#     (no local tree, single-commit range, self-evidencing PATH shim), and the
