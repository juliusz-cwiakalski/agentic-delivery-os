#     4 and 6 closed in plan v1.1), ./readiness-review/readiness-iter-2.md
#     (findings 4 and 6 and the execution-failure shim mirror closed in plan v1.2;
#     findings 1, 2, 3 and 5 are spec/test-plan owned and landed in spec v1.3-v1.4
#     and test plan v0.4), and ./readiness-review/readiness-iter-3.md (its blocking
#     fixture-mechanism finding and the exit-literal carve-out are mirrored here in
#     plan v1.3; the remaining findings are spec/test-plan owned and landed in spec
#     v1.5 and test plan v0.5)
#   - PM record: ./chg-GH-268-pm-notes.yaml (three binding decisions: warn-only
#     hook, resume-sync instruction in scope, repository automation not a CLI
#     command)
#   - System spec reconciled in lifecycle phase 7 (@doc-syncer), not here — the
#     plan records these as handoff obligations, never as code edits:
#     doc/spec/features/feature-quality-gates-and-pr.md (row 1),
#     doc/spec/features/feature-autonomous-delivery.md (row 2 plus row 9's three
#     delivered-set enumerations: the overview sentence, the Core Components
#     table, and the "Install inventory" blockquote),
#     doc/spec/features/feature-monorepo-scaffold-toolchain.md (row 3),
#     doc/guides/autonomous-batch-delivery.md (row 10, the install comment
#     block). TC-DOC-002/003/005 are that phase's obligation.
#
# ORDERING (every phase independently committable; the tree is green at every
# phase boundary):
#   1 range gate + its suite -> 2 stated contract + phase wiring -> 3 corrected
#   resume-sync instruction + assertion -> 4 distribution registration ->
#   5 documentation truth + dogfood verdict + conformance battery + release.
#   - Phase 1 lands first so the gate EXISTS before any prompt claims it does
#     (TC-DOGFOOD-001 precondition). Nothing else in the change can be verified
#     against a gate that is not in the tree, and the suite is the only proof
#     that the verdict, the exit contract, and the diagnostics are real.
#   - Phase 2 states the contract in the two prompts that own it. It depends on
#     Phase 1 only for the wiring sentence's truthfulness, not for compilation.
#   - Phase 3 changes the prompt builder and its assertion in one commit: spec §22
#     makes changing either without its assertion a review-blocking gap, and
#     TC-PROMPT-005 proves the assertion has teeth against a throwaway copy.
#   - Phase 4 distributes a script that already exists and is tested; registering
#     it earlier would ship an installer entry pointing at nothing.
#   - Phase 5 carries the two delivery-owned docs, the self-application run over
#     this branch's own range, the aggregate/conformance battery, and the release
#     obligations as scope — not as prose.
#
# DELIVERY PINS (mechanics the spec/test plan leave to delivery planning; none
# changes a requirement, and no AC/TC outcome depends on the choice):
#   - Invocation contract: ./scripts/lint-commit-range.sh [--base REF], --help,
#     --version. Exactly three VERDICT codes exist: 0 = PASS or SKIP, 1 = FAIL
#     (offenders), 2 = ERROR or usage. A signal-interrupted or pre-verdict aborted
#     run follows the repository's bash interrupt convention (non-zero,
#     conventionally 130), carries no verdict, and is documented in usage() as an
#     interrupt code — never a fourth verdict code and never a gate outcome
#     (spec NFR-7, .ai/rules/bash.md). The assertions are Phase 1's: every
#     outcome-path literal is in {0, 1, 2, 130}, exactly one 130 sits inside
#     `_on_interrupt` with an installed INT/TERM trap, and usage() documents only
#     the three verdict codes as outcomes (TC-COMMITLINT-012 step 5).
#   - Bash posture (.ai/rules/bash.md): #!/usr/bin/env bash, set -Eeuo pipefail
#     plus errtrace/inherit_errexit/IFS, ERR/EXIT/INT/TERM traps, usage(), small
#     named functions with one job each, and a PURE:/IMPURE: sectioning comment.
#   - Base precedence (DEC-7, TC-COMMITLINT-010): --base REF, then
#     ADOS_BASE_BRANCH, then `- **Default base branch**: `<ref>`` in
#     ADOS_PR_INSTRUCTIONS_FILE (default .ai/agent/pr-instructions.md), then
#     main. The resolved ref is refs/remotes/origin/REF when that resolves,
#     otherwise REF; it is then pinned to a commit with rev-parse. Every
#     unresolvable base is DM-1.e: exit 2, cause, and a `fetch` hint. The gate
#     never fetches, never guesses, and never treats an empty range as an error.
#   - Terminal resolution order: usage validation (DM-1.i, no history consulted)
#     -> commitlint configuration presence (DM-1.d SKIP, exit 0) -> base
#     resolution (DM-1.e) -> merge-base (DM-1.f) -> binary availability
#     (DM-1.g) -> per-commit lint (DM-1.a/b/c/h). Exactly one outcome per run.
#     This order is normative in spec §5.1 (v1.4): a repository with no
#     commitlint configuration reports SKIP regardless of base or binary state,
#     and an unresolvable base is reported before a missing binary (e before g) or
#     an unrenderable verdict (e before h).
#   - Configuration discovery uses the same eight root candidates as
#     scripts/checks/commitlint-authority.ts (commitlint.config.{js,cjs,mjs,ts},
#     .commitlintrc{,.json,.yaml,.yml}) checked at the repository top level; the
#     gate adds no config source and passes no --config, so the authority's
#     discovery is mirrored rather than re-implemented (DEC-1, RSK-1).
#   - Binary resolution and disclosure (DEC-10, amended AC-F3-3): the lint tool
#     is resolved repository-local first — `<repository-toplevel>/node_modules/.bin/commitlint`
#     when present and executable — then by `command -v commitlint` on `PATH`.
#     The verdict header names the resolved binary and its origin
#     (`repository-local` | `PATH` | unavailable). A binary resolved through
#     `PATH` from outside the repository is disclosed with a parity-risk token
#     (`parity` / `outside the repository`) and still renders its normal verdict:
#     disclosure is a risk to reconcile, never a failure. `DM-1.g` keeps its
#     meaning — no usable binary at all is `ERROR`, exit 2, with an install hint.
#     The configuration check precedes binary resolution, so a present binary can
#     never manufacture a verdict where there is no authority to mirror
#     (TC-COMMITLINT-007 step 3). The published invocation
#     `./scripts/lint-commit-range.sh --base <ref>` therefore works on this
#     repository with no `PATH` modification — the workspace install places the
#     CLI in `node_modules/.bin` and does not put it on `PATH` (spec §12, RSK-1).
#   - Suite fixtures that need a local binary install one through the test plan's
#     helper `_install_local_commitlint`, which writes an **exec wrapper** — never
#     a symlink and never a copy:
#       printf '#!/bin/sh\nexec "%s" "$@"\n' "${REPO_ROOT}/node_modules/.bin/commitlint" \
#         > "${repo}/node_modules/.bin/commitlint"; chmod +x ...
#     Mechanism: this repository's `node_modules/.bin/commitlint` is a `/bin/sh`
#     shim that resolves its CLI relative to its own invoked path
#     (`$basedir/../@commitlint/cli/cli.js`, with an absolute `NODE_PATH`), so a
#     link or copy placed under a fixture fails with MODULE_NOT_FOUND, exits 1
#     with no `[rule-id]` line, and the pinned parse contract classifies that as
#     DM-1.h — turning every local-binary fixture into ERROR instead of the
#     outcome it exists to prove (iter-3 finding 1). The wrapper therefore invokes
#     the repository's real binary by absolute path; it must never be simplified
#     back to a link or copy. Fixtures that test absence contain no `node_modules`
#     tree at all, so the host dependency tree can never make an absence case
#     vacuous (TC-COMMITLINT-008 notes). `FX-PATH-FOREIGN` uses the **same
#     wrapper** written into a directory outside the fixture repository
#     (`${_test_tmpdir}/bin/commitlint`) so the resolved origin is still `PATH`
#     and the parity-risk disclosure path is exercised. A decoy earlier on `PATH`
#     must never execute (DECOY_MARKER absent) and the local binary must decide
#     the verdict.
#   - Lint invocation and parse contract (test plan OQ-1): one
#     `commitlint --color=false` invocation per commit in
#     `git rev-list --reverse <merge-base>..HEAD`, message read with
#     `git log -1 --format=%B <sha>`. A commit is an offender iff the invocation
#     exits 1 AND at least one `[rule-id]` problem line parses. Exit >=2, or exit
#     1 with no parsed problem, is DM-1.h (exit 2, cause plus hint) — never a
#     FAIL with no diagnostics and never a PASS. The per-commit union is the
#     authority's `--from <merge-base> --to HEAD` verdict for the same range and
#     configuration; the suite cross-checks that parity against the CLI directly
#     (TC-COMMITLINT-004) and pins zero false positives on merge subjects.
#   - Attribution (DM-2, test plan OQ-3): line number and bounded excerpt are
#     computed locally as diagnostics only — line 1 for header rules,
#     type-empty/subject-empty/type-enum/header rules, and the first over-length
#     body/footer line for body-/footer-max-line-length. Rule ids are the
#     configuration's ids verbatim; the verdict is never recomputed locally.
#     Block template: `FAIL <short-sha> (<full-sha>) · rule=<id> line=<n> · <excerpt>`,
#     bounded to 160 characters per excerpt, 20 rule lines per commit, 200
#     diagnostic lines per run, oldest to newest, no timestamps or durations on
#     the default channel (NFR-1, NFR-6).
#   - Remediation aggregation (DM-3, DEC-9): offender count is per commit;
#     1-2 offenders -> `MODE: SURGICAL REWORD`, >=3 -> `MODE: CONDENSE-TO-ONE`.
#     Advisory text only; the gate rewrites nothing (NFR-5).
#   - Committed fixtures live in scripts/.tests/fixtures/lint-commit-range/ with
#     the exact file names of test plan §6.2; the invalid-JS fixture ships as
#     .txt so biome lint/format never parses it (TR-9).
#   - DM-1.h has two declared binary origins (test plan v0.5, iter-2 finding 1):
#     `FX-BAD-CONFIG` carries the fixture-local `node_modules/.bin/commitlint`
#     written by the `_install_local_commitlint` exec wrapper and is the
#     invalid-configuration half, decided locally with header origin
#     `repository-local`; `FX-BAD-CONFIG-NO-LOCAL` has no `node_modules` tree at
#     all, declares a single-commit range, and is the execution-failure half, where
#     the self-evidencing `fake-commitlint-exec-failure.sh` shim is reached only
#     through `PATH` — the absence of a local `node_modules/.bin` is asserted
#     before the run, the shim appends one line per invocation to `SHIM_MARKER`
#     naming its own path and prints the distinct `SHIM-EXEC-FAILURE` token, and
#     the marker (non-empty, every line the shim path, count at least the declared
#     commit count) is the load-bearing evidence that the shim ran — never an exact
#     invocation total, so a gate that legitimately probes `--version` or lints
#     before reporting is not penalised. A single fixture would let DEC-10's
#     local-first resolution decide both halves, reporting green while proving
#     nothing; the shim is never installed into any `node_modules/.bin`.
#   - Prompt contract (AC-F4-1, TC-PROMPT-001/003): the committer and PM prompts
#     state the subject rule, the body/footer 100-character rule, the
#     no-plain-merge-subject rule, both remediation modes, and the ownership split
#     as constraints on the artifact: the committer owns the message it produces
#     and never rewrites history; the PM owns the range verdict and selects the
#     mode; the acting agent performs the history action outside the gate; the gate
#     only reports. They teach no raw git write recipe. The pre-existing
#     prohibition at `.opencode/agent/committer.md:31`
#     (`Never run `git add`, `git commit`, `git reset`, or any other raw git write
#     command.`) is load-bearing and stays: prompt conformance is negation-exempt,
#     so a matching line inside a negation is compliant, and deleting it would
#     remove the rule the scan relies on (readiness finding 1).
#   - Generated plugin (AGENTS.md "Generated plugin rule"): editing
#     .opencode/agent/{committer,pm}.md makes .ados-claude/agents/{committer,pm}.md
#     stale, and CI fails on a stale plugin. Phase 2 regenerates with
#     scripts/build-claude-plugin.sh and commits the two generated files with
#     their sources. This is the only path outside the test plan's PR-time
#     allowlist, and it is mandated by the repository's own generation contract.
#   - Resume-sync instruction (AC-F5-1, TC-PROMPT-004/005): the Resume Sync block
#     keeps `git fetch origin <base>` and emits exactly one merge line of the
#     form `git merge --no-ff origin/<base> -m "chore(<workItemRef>): sync with <base>"`,
#     so no bare `git merge origin/<base>` survives and the counterexample probe
#     in TC-PROMPT-005 step 3 matches. Only that block changes; orchestration,
#     single-flight, liveness, and result classification are untouched.
#   - Distribution (AC-F7-1): the gate joins ADOS_DELIVERY_SCRIPTS in
#     scripts/install.sh and the unconditional delivery list in
#     scripts/uninstall.sh; the installer/uninstaller fixture helpers seed the
#     file so install, re-install, dry-run, and removal are all asserted. No
#     marker-driven path and no doc-distribution change is involved.
#   - Executable bits (AC-F7-1, TC-DIST-001 steps 2-3, readiness finding 6):
#     scripts/lint-commit-range.sh and scripts/.tests/test-lint-commit-range.sh
#     are committed mode 100755. `scripts/test-all.sh` discovers suites with
#     `find ... -name 'test-*.sh' -perm -u+x`, so a 100644 suite is silently
#     omitted and the aggregate runner would print "all passed" without running
#     the change's primary suite. `bash scripts/.tests/test-lint-commit-range.sh`
#     passes regardless of the bit, so only the committed-mode assertion catches
#     the omission; Phase 1 asserts it and Phase 4 proves discovery by name.
#   - Documentation (AC-F6-2, AC-F8-1): AGENTS.md states the gate as a
#     supplementary lifecycle pre-PR gate in the delivery-process and
#     delivery-infrastructure notes (never in the /check or /check-fix rows, and
#     never as a repository-wide quality-gates command); the change-lifecycle
#     guide's §9 actions and exit criteria name the range lint and the never-waive
#     rule. doc/guides/change-lifecycle.md keeps `ados_distribution:
#     redistributable`; AGENTS.md carries no marker today and gains none.
#     Row literals are pinned against the current file and must be re-verified
#     before use: the /check and /check-fix rows carry backticks around the
#     command names (`| `/check` | Run quality gates (no fixes) |`, AGENTS.md
#     lines 111-112 today). Asserting the bare `| /check | ...` form is
#     unsatisfiable and would tempt stripping a row this change must not touch
#     (readiness finding 2); every other literal assertion in this plan was
#     re-checked against the tree the same way.
#   - Handoff obligations created by distribution (Appendix C rows 9-10,
#     readiness finding 4): the moment Phase 4 registers the gate, three
#     enumerations on doc/spec/features/feature-autonomous-delivery.md (the
#     overview sentence listing delivered scripts, the Core Components table, and
#     the "Install inventory" blockquote naming the ADOS_DELIVERY_SCRIPTS set) and
#     the install comment block in doc/guides/autonomous-batch-delivery.md become
#     factually incomplete. They are recorded on Phases 4 and 5 as `docHandoffs`
#     and reconciled by @doc-syncer in lifecycle phase 7; no delivery phase edits
#     doc/spec/** or that guide, and no doneArtifacts slot exists for a doc
#     reconciliation, so the handoff is declared as data instead.
#   - Release obligations: no changeset is authored, because no package surface
#     moves (NG-5, DEC-8) — the change is scripts, prompts, and docs only. The
#     release artifact is the pull request to main-tools with the dogfood verdict
#     and the gate verdict recorded in the change's pm-notes.
#   - Every commit lands through the `commit` primitive with the phase `summary`
#     as its subject (conventional, work item referenced), body/footer lines
#     <= 100 characters, and no manual staging.
#
# DECLARATION-ONLY KEYS: `acCoverage`, `tcCoverage`, `verification`, and
# `docHandoffs` are evidence/handoff declarations consumed by the delivery loop;
# `plan validate` ignores them. They record no progress and no task list —
# progress lives in pm-notes `notes:`.
#
# COVERAGE INVARIANT: all 19 acceptance criteria appear exactly once in
# `acCoverage`, in the phase that can satisfy each in full (AC-F6-1 lands with
# Phase 5 because its recorded-evidence half needs the dogfood run over a range
# that contains every delivered commit; AC-F3-3's amended binary-resolution and
# disclosure half is satisfied by Phase 1's suite). All 40 test cases have a
# declared home: TC-DOC-002/003/005 and TC-CONFINE-001 are declared here as
# handoffs (system-spec update phase and PR-time review respectively), never
# silently dropped.

schemaVersion: delivery.plan.v1
workItemRef: GH-268

tier:
  name: full
  phases: [1, 2, 3, 4, 5]
  escalationTriggers:
    - "a path under .github/workflows/, .husky/, packages/**, or a commitlint configuration file appears in the change diff"
    - "the gate exits with a code outside {0, 1, 2} on a verdict-carrying run (the documented 130 interrupt path carries no verdict and is exempt), or returns PASS without resolving a base commit and a merge-base"
    - "the gate fetches, pushes, or mutates refs, the index, the working tree, the stash, or history"
    - "the gate adds, relaxes, or re-implements a commitlint rule instead of consuming the root configuration's verdict"
    - "a repository that configures commitlint and cannot verify reports SKIP or PASS instead of ERROR"
    - "a repository-local node_modules/.bin/commitlint is present but a PATH binary decides the verdict, or a decoy on PATH executes"
    - "a foreign-origin binary is reported as a failure instead of a disclosed parity risk"
    - "the new gate or its suite is committed without the executable bit, so scripts/test-all.sh discovery skips it"
    - "a prompt states a raw git write recipe (git add/commit/reset/stash/rebase in command position) and pnpm check:prompt fails, or the pre-existing prohibition at .opencode/agent/committer.md:31 is deleted"
    - "the range lint is referenced by AGENTS.md, the change-lifecycle guide, or a lifecycle prompt before the script exists in the tree"
    - "the resume-sync instruction still emits a bare merge, or its assertion passes against the reverted instruction"
    - "pnpm check, /check, /check-fix, the CLI/MCP surface, or scripts/quality-gates.sh changes"
    - "a touched doc loses its ados_distribution marker, gains a marker where none existed, or a new doc area is created"
    - "an existing suite protecting replaced behaviour is deleted instead of updated (installer, uninstaller, deliver-ticket prompt)"
    - "a commit in this change's range fails the repository's commitlint configuration"

defaultLeases:
  - repo:main-tools
defaultWeightClass: standard

phases:
  # ---------------------------------------------------------------------------
  # PHASE 1 — the gate and its proof
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Branch-range commit-message gate with per-commit diagnostics, the four-outcome exit contract, and the 21-case self-test suite"
    kind: delivery
    summary: "chore(GH-268): add the branch-range commit-message lint gate"
    leases:
      - repo:main-tools
    weightClass: heavy
    scope:
      files:
        - scripts/lint-commit-range.sh
        - scripts/.tests/test-lint-commit-range.sh
      folders:
        - scripts/.tests/fixtures/lint-commit-range
    interactions:
      - kind: contract-file
        target: scripts/lint-commit-range.sh
        role: producer
    acCoverage:
      - "AC-F1-1"
      - "AC-F1-2"
      - "AC-F2-1"
      - "AC-F2-2"
      - "AC-F3-1"
      - "AC-F3-2"
      - "AC-F3-3"
      - "AC-F3-4"
      - "AC-F3-5"
      - "AC-F3-6"
      - "AC-NFR4-1"
      - "AC-NFR6-1"
    tcCoverage:
      - "TC-COMMITLINT-001..021 (all 21 cases: attribution, clean and merge-subject parity, merged-upstream isolation, empty range, skip with and without a local binary and an unresolvable base in a no-configuration repo, binary resolution and disclosure — local-first preference, decoy never executed, foreign origin disclosed not failed, absence loud — invalid config and execution failure, base precedence and remote-tracking preference, undeterminable merge-base, usage/help/version with the outcome-path exit literals and the documented 130 interrupt carve-out, ordering, determinism, bounds, mode thresholds, per-commit counting, read-only, no network, exit matrix, runtime budget)"
    verification:
      - "bash -n scripts/lint-commit-range.sh || syntax clean; set -Eeuo pipefail plus traps, usage(), --help, --version, and one-job-per-function sectioning per .ai/rules/bash.md"
      - "bash scripts/.tests/test-lint-commit-range.sh || all 21 TC-COMMITLINT cases pass against the real pinned @commitlint/cli 21.2.4 binary; every fixture-local node_modules/.bin/commitlint is an exec wrapper written by _install_local_commitlint (printf '#!/bin/sh\\nexec \"%s\" \"$@\"\\n' \"${REPO_ROOT}/node_modules/.bin/commitlint\"), never a symlink or a copy — the repository's pnpm shim resolves its CLI relative to its invoked path, so a link or copy would fail with MODULE_NOT_FOUND, exit 1 with no parsed rule, and be classified DM-1.h; FX-PATH-FOREIGN uses the same wrapper outside the fixture repository so the origin still reports PATH; absence fixtures carry no node_modules tree, the DM-1.h halves are split (FX-BAD-CONFIG decides invalid configuration with its wrapper-installed local binary; FX-BAD-CONFIG-NO-LOCAL proves the execution-failure shim ran via SHIM_MARKER after asserting no local node_modules/.bin), and the suite fails loudly with an install hint when the host binary is missing (never a silent skip)"
      - "./scripts/lint-commit-range.sh --help >/dev/null && ./scripts/lint-commit-range.sh --version | grep -Eq '^[0-9]+\\.[0-9]+\\.[0-9]+' || help and version exit 0 and the version is semver-shaped"
      - "./scripts/lint-commit-range.sh --nonsense; test $? -eq 2 || usage error names the accepted invocation and the offending argument, and GIT_TRACE shows no rev-list/merge-base/rev-parse/for-each-ref call"
      - "test -z \"$(grep -oE 'exit [[:digit:]]+' scripts/lint-commit-range.sh | awk '{print $2}' | sort -u | grep -vE '^(0|1|2|130)$')\" || empty output is required: every exit literal is an outcome code (0 pass/skip, 1 violations, 2 unable-to-verify/usage) or the documented interrupt code 130; any other digit prints and fails"
      - "test \"$(grep -cE '^[[:space:]]*exit 130[[:space:]]*$' scripts/lint-commit-range.sh)\" = \"1\" && test \"$(awk '/_on_interrupt\\(\\)[[:space:]]*\\{/{inb=1} inb&&/exit 130/{hit=1} inb&&/^\\}/{inb=0} END{print hit+0}' scripts/lint-commit-range.sh)\" = \"1\" && test -n \"$(grep -nE 'trap .*_on_interrupt.* (INT|TERM)' scripts/lint-commit-range.sh)\" || exactly one 130 site exists, it lies inside the `_on_interrupt` handler, and the handler is installed by a trap: 130 is an interrupt code (spec NFR-7 carve-out, .ai/rules/bash.md canonical trap block), never a fourth verdict outcome; a 130 anywhere else fails the handler-body probe"
      - "help=\"$(./scripts/lint-commit-range.sh --help)\" && printf '%s' \"${help}\" | grep -qiE '^[[:space:]]*0[[:space:]]*[-:]?[[:space:]]*(pass|skip)' && printf '%s' \"${help}\" | grep -qiE '^[[:space:]]*1[[:space:]]*[-:]?[[:space:]]*(fail|violation)' && printf '%s' \"${help}\" | grep -qiE '^[[:space:]]*2[[:space:]]*[-:]?[[:space:]]*(error|unable|usage)' || usage() documents the three outcome codes each on its own line with its meaning; a missing or renamed outcome line fails the corresponding grep"
      - "test -z \"$(./scripts/lint-commit-range.sh --help | grep -oE '^[[:space:]]*[0-9]+[[:space:]]*[-:]' | grep -oE '[0-9]+' | sort -u | grep -vE '^(0|1|2|130)$')\" || empty output is required: every code documented as an outcome is one of 0, 1, 2 (130 may appear separately as the interrupt code); any other documented outcome code prints and fails"
      - "test \"$(grep -cE '^[[:space:]]*(curl|wget|scp|ssh|nc)[[:space:]]' scripts/lint-commit-range.sh)\" = \"0\" && test \"$(grep -cE '^[[:space:]]*git[[:space:]]+(fetch|pull|push|clone|ls-remote)' scripts/lint-commit-range.sh)\" = \"0\" || no network helper and no network git subcommand appears in command position; distribution hints live inside quoted strings and therefore cannot match these line-anchored patterns"
      - "./scripts/lint-commit-range.sh --base main-tools || PASS naming the resolved base, merge-base, HEAD, commit count, and a verdict header whose binary field is node_modules/.bin/commitlint with origin repository-local; no PATH prefix is used, so this also proves the published invocation works on this repository (early smoke; formal dogfood evidence is Phase 5)"
      - "test \"$(git ls-files -s scripts/lint-commit-range.sh scripts/.tests/test-lint-commit-range.sh | awk '{print $1}' | sort -u | tr '\\n' ' ')\" = \"100755 \" || both entries are mode 100755, matching the existing gate/suite convention, so scripts/test-all.sh discovery (-perm -u+x) cannot silently skip the suite; a 100644 entry changes the observed set and fails"
      - "test -x scripts/lint-commit-range.sh && test -x scripts/.tests/test-lint-commit-range.sh || both files are executable on disk as well as in the index"
      - "test -z \"$(git status --porcelain)\" && test -z \"$(git stash list)\" || the working tree and stash are unchanged after every outcome: a dirty tree or a stash entry makes this fail by name, and the suite separately asserts index, ref, file-list, and fsck digests across PASS, FAIL, SKIP, and ERROR"

