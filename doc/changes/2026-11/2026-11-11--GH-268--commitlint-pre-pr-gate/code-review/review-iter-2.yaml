  repo digests unchanged), no network, PASS/FAIL/SKIP/ERROR with 130 confined to
  `_on_interrupt`, branch range PASS at 26 commits, 20-commit case 2.1-2.3 s
  (serial 8.8 s). Fail-closed is real: a missing worker record (git log forced to
  fail) and a SIGKILLed worker both exit 2 with ERROR and never PASS. One
  reproducible regression blocks a pass: the worker-pool refactor broke the
  DM-1.h execution-error diagnostic. `_collect_lint_results` reads
  `<index>.status` with `read -r status_token detail` under the global
  `IFS=$'\n\t'`, so the line `error <exit>` becomes one token; the `error` case
  never matches and the fallback prints the *worker's* exit (0) instead of
  commitlint's, so both the invalid-config and execution-failure paths report
  "(exit 0)" for a non-zero commitlint failure. Outcome stays ERROR/exit 2, but
  the cause detail is wrong and the `error` branch is dead. The pool also has no
  committed regression tests, and spec section 10's "creates no files" is now
  literally inaccurate (transient TMPDIR dir). Plan Phase 6 is complete with
  pm-notes evidence; a further remediation phase (Phase 7) is appended. I also
  corrected two plan-artifact defects in the change folder (see F-4/F-5).
