findings:
  - id: F-1
    severity: medium
    confidence: high
    category: correctness
    location: scripts/lint-commit-range.sh:735
    message: >-
      Worker-pool regression in the DM-1.h path. `_collect_lint_results` parses
      `<index>.status` with `read -r status_token detail < file` while the shell's
      global `IFS` is `$'\n\t'` (space is not a separator), so a line `error 3`
      yields `status_token="error 3"`, `detail=""`. The `case ... error)` branch
      never matches; the `*)` fallback reports `WORKER_STATUS[index]` (the worker's
      own exit, 0) instead of commitlint's exit, so the message prints
      "commitlint could not render a verdict ... (exit 0)". Reproduced for both
      DM-1.h sub-cases: the execution-failure shim (exit 3 -> "(exit 0)") and an
      invalid configuration (commitlint exit 1 -> "(exit 0)"). The outcome is
      still ERROR/exit 2 (fail-closed holds) and no committed test asserts the
      exit detail, so this is a diagnostic/cause regression, not a verdict change.
    suggestion: >-
      Read the status file with a local field separator that includes a space
      (`IFS=' ' read -r status_token detail <"${prefix}.status" || status_token=""`),
      keep the `error` branch (it then carries `detail`), and assert in the
      execution-failure test that the Cause line prints the shim's real exit (3),
      which fails against the current parse.
    suppressed: false
