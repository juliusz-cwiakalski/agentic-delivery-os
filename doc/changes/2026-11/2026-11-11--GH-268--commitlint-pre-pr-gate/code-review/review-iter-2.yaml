  Iteration-1 findings F-1..F-8 are fixed and the fixes are non-vacuous: I
  reverted the rule-id parser and the diagnostic renderer on throwaway copies and
  reproduced the old failure (`rule=docs` phantom and 50/51 offender blocks),
  while the committed tests assert the corrected behaviour. The worker-pool
  performance fix preserves the main contracted properties: per-commit rule
  attribution, oldest-to-newest ordering, byte-identical serial-vs-parallel
  output (ADOS_LINT_JOBS=1 vs 8 over a 3-offender range), the two-pass 200-line
  budget (51 offenders -> 51 blocks, no TRUNCATED), SURGICAL REWORD /
