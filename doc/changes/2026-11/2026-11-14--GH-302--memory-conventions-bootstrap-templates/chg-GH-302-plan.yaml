#      other content assertions), not the bash guard.
#
# REVISION NOTE (revision 1.2, after DoR iteration-2 finding: spec v1.2 sync).
# Mechanical sync only — no phase structure, scope paths, commit subjects,
# constraints, or escalation-trigger changes; the only parsed-data delta is
# the phase-1 summary's twelve-class wording.
#   SYNC (spec v1.2) the kernel-section contract is the TWELVE-class list:
#      canonical and ephemeral locations; advisory/untrusted preamble;
#      read policy; capture bar; write ownership; evidence over recency;
#      unique ids; reviewer independence; caps and growth; promotion handoff;
#      capsule completion; conflict reality. Obligation 1.4 and the phase-1
#      summary now carry the twelve-class contract; the SOURCES citation is
#      bumped to spec v1.2.
#
# One ticket, one PR against main-tools, five delivery phases. Every phase is an
# independently committable slice that is green at its own boundary, and every
# phase is ONE delivery commit through the commit primitive (conventional
# subject, scope GH-302 per repo convention `feat(GH-294): ...`, every
# body/footer line <= 100 characters). Extra phase data (content obligations,
# test obligations, done-when, gate commands) is carried in YAML comments so the
# parsed document stays schema-strict: the only parsed keys are schemaVersion,
# workItemRef, tier, defaultLeases, defaultWeightClass and phases (id, title,
# kind, summary, scope, interactions, doneArtifacts, leases, weightClass,
# leaseClass). The plan declares phases and scope only; progress is a pm-notes
# `notes:` entry, never a plan field, and there is no `tasks` key.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:      ./chg-GH-302-spec.md (v1.2; F-1..F-7, AC-F1-1..AC-NFR4-1 — 11
#                criteria; DM-1..DM-3 with the twelve-class kernel contract;
#                NFR-1..NFR-6; NG-1..NG-6; DEC-1..DEC-6;
#                OQ-1/OQ-2 resolved; Appendix A source mapping; Appendix C
