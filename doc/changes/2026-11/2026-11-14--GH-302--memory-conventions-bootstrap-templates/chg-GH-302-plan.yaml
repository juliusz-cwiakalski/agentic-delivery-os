#                tracks modules only — the new test file needs no inventory row.
#
# TEMPLATE FILENAMES FIXED BY THIS PLAN (resolves test-plan OQ-TP-2 and OQ-TP-3;
# the bun suite pins its anchors to these names and any later rename is a
# deliberate suite update per test-plan §8.1, never a silent one):
#   - memory-index-template.md               → renders .ai/memory/README.md
#   - memory-agent-entrypoint-template.md    → renders .ai/memory/agents/<agent>/README.md
#                                               (ONE generic template parameterized by agent
#                                               role — resident roles vary per project)
#   - memory-area-template.md                → renders .ai/memory/lessons/README.md and
#                                               .ai/memory/tacit/README.md (ONE template
#                                               parameterized by area; materializes the two
#                                               empty areas in git and states their purpose)
#   - memory-kernel-section-template.md      → the AGENTS.md memory kernel section
#   - memory-coordinator-wiring-template.md  → capture bar + promotion path + curation
#                                               mandate, rendered into the installed
#                                               .ai/agent/pm-instructions.md
#   - memory-instruction-expectations-template.md → per-role memory expectations (read own
