#      text is the bootstrapper prompt's list-form allowlist entry; the guide
#      and the feature spec adopt that same list-form entry verbatim, and the
#      feature spec's compact brace form is replaced by the list form as part
#      of phase 2 — so TC-MEMCONT-001 / guard Check 7 compares like-for-like
#      text across the three carriers.
#   SYNC (test plan v1.2) TC-MEMALIGN-004 (new, automated, critical): zero
#      doc/planning/concepts/** references inside the installed carriers (the
#      nine memory templates and the inception guide's Phase 5 memory content;
#      fully-qualified public ADOS URLs permitted). Enforcement home pinned in
