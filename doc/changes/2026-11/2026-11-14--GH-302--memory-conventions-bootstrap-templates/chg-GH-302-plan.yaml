#                bootstrap-templates from main-tools @ 92b64753)
#   - Ticket:    GH-302 (M2-S9). Milestone pack scenario seeds SC-M2-S9-01/02
#                are inherited by the test plan and are not restated here.
#   - Repo truth verified at plan time: the write allowlist today has exactly 21
