# GH-302 delivery plan — machine-readable document (delivery.plan.v1), revision 1.2
# (2026-11-14). Authored against spec v1.2 and test plan v1.2 (both
# repo-truth-corrected: this repository's .ai/memory tree exists and is populated
# by GH-204; NG-4 guards it; GH-301 owns its evolution).
#
# REVISION NOTE (revision 1.1, after DoR iteration-1 findings 4 and 5 plus the
# test-plan v1.2 downstream sync). Mechanical remediation only: no phase count,
# no phase ids, no scope paths, no parsed-key changes beyond the phase-1
# summary's marker-only echo.
