phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Memory bootstrap template set (nine templates + index rows)
  # Commit: feat(GH-302): memory bootstrap template set with distribution markers
  #
  # Goal: every convention the learning loop needs exists as an installable
  # template before any prompt, guide, or spec names it, so phase 2 renders from
  # a settled surface (F-1, F-2, F-3 carriers, F-4, F-5, adoption checklist).
  #
  # Content obligations (each template mirrors the current-truth kernel — C-1):
  #  1.1 memory-index-template.md — the memory index entry point: what exists,
  #      read-when hints, coverage honesty; <= 200 lines (NFR-2).
  #  1.2 memory-agent-entrypoint-template.md — per-agent entry point,
  #      parameterized by agent role: states the capture bar (same mistake
  #      twice, review catch, repeated correction, verified outcome, repeated
  #      workflow) and the read/write policy (read own entry point at session
  #      start; write own folder only; shared surfaces are consolidation-owned);
  #      <= 150 lines (NFR-2, TC-MEMSCAF-003).
  #  1.3 memory-area-template.md — lessons/tacit area README, parameterized by
  #      area: purpose, promotion-handoff target, append discipline; seeding is
  #      structural (empty; conventions, not records — DM-1).
  #  1.4 memory-kernel-section-template.md — the AGENTS.md memory kernel
  #      section carrying ALL TWELVE content classes (DM-2, spec v1.2):
  #      canonical and ephemeral locations; advisory/untrusted preamble; read
  #      policy; capture bar; write ownership; evidence over recency; unique
  #      ids; reviewer independence; caps and growth; promotion handoff;
  #      capsule completion (referenced only); conflict reality. It routes
  #      to the installed conventions rather than duplicating them and contains
  #      ZERO record-schema fields (TC-MEMKERN-001/002).
  #  1.5 memory-coordinator-wiring-template.md — the coordinator (PM-facing)
  #      memory wiring: capture bar + promotion path (candidates route to
  #      exactly one home) + the curation/consolidation mandate (TC-MEMWIRE-001).
  #  1.6 memory-instruction-expectations-template.md — companion per-role
  #      memory expectations (read own entry point, write own folder, no
  #      cross-agent memory edits) that REFERENCE the kernel, never restate it
  #      (TC-MEMWIRE-002); rendered into pr/decision/code-review instructions.
  #  1.7 memory-retro-notes-template.md — retro-note conventions: append-only
  #      notes with a generated index, documentation alone; references the
  #      capture bar and promotion path rather than duplicating them (DM-3,
  #      TC-MEMWIRE-003); no ceremony content (NG-5).
  #  1.8 memory-doctor-checklist-template.md — manual doctor checklist: the six
  #      audit areas (index coverage; budget caps ~150/<=200; dangling
  #      references; contradictions; derivable-content heuristics; secret-
  #      pattern scan), explicit manual-until-memory-lint status (GH-301), a
  #      prescribed cadence (per-retro or periodic audit), performing nothing
  #      (AC-F5-1, TC-MEMDOCT-001).
  #  1.9 memory-adoption-checklist-template.md — manual adoption checklist for
  #      previously bootstrapped projects (spec §8.5, NG-6): adopt kernel
  #      section, instruction wiring, and tree scaffold by hand.
  #  1.10 doc/templates/README.md — index rows for all nine templates (the
  #       inception guard's template-index check is containment, so it stays
  #       green before phase 4 extends its list).
  #  Every new file: ados_distribution: redistributable inside its frontmatter,
  #  marker-only (C-3) — NO license header is added (doc/templates/ is outside
  #  the header script's scope and agents never hand-add headers).
  #  Self-containment (DEC-6 / PDR-0004): installed carriers cite the public
  #  ADOS repository URL as optional further reading only — no
  #  doc/planning/concepts/** references (enforced by TC-MEMALIGN-004 in
  #  phase 4).
  #
  # Test obligations (content owned here; verdicts produced at phase 4):
  #   TC-MEMSCAF-001/002/003, TC-MEMKERN-001/002, TC-MEMWIRE-001/002/003,
  #   TC-MEMDOCT-001, TC-MEMBUDGET-001 (seed-template line counts).
  #
  # Done when: all nine templates + README rows exist with their distribution
  # markers — marker-only, no agent-added license headers and no header-script
  # edits (C-3);
  # `bash scripts/.tests/test-doc-distribution.sh` green (every new template
  # classified and installed); `bash scripts/.tests/test-inception-doc-
  # consistency.sh` still green; `TMPDIR=$PWD/tmp/tmpdir pnpm check` green.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Memory bootstrap template set (nine templates plus template-index rows)"
    kind: delivery
    summary: >-
      Author the nine memory bootstrap templates under doc/templates/ — index
      entry point, per-agent entry point (parameterized by role), lessons/tacit
      area README, AGENTS.md kernel section with all twelve content classes and
      zero record-schema fields, coordinator capture/promotion wiring, companion
