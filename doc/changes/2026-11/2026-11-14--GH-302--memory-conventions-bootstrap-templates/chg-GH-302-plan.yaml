#   - doc/guides/project-inception.md: already current after phase 2 — verify,
#     do not rewrite.
#   - doc/templates/** install set: verified continuously by the distribution
#     guard; no further reconciliation expected.
#   - The kernel-section template stays in lockstep with this repository's
#     AGENTS.md "Agent memory" section; GH-301 is the next expected reconciler.
