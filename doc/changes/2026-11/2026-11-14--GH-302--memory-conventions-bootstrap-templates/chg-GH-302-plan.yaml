#                                               generated index; references capture bar and
#                                               promotion path, never duplicates)
#   - memory-doctor-checklist-template.md    → manual doctor checklist (OQ-TP-3 resolved: a
#                                               doc/templates/** template in the installed
#                                               set, not a guide page)
#   - memory-adoption-checklist-template.md  → manual adoption checklist for previously
#                                               bootstrapped projects (NG-6)
#
# PHASE ORDER AND WHY (dependencies land first):
#   1 the template set — every later surface renders from it; the distribution
#     guard is green at this boundary already (markers + install set), and the
#     inception guard's template-index check is containment, so new README rows
#     land safely before the guard's list extension arrives in phase 4
#   2 the three-surface allowlist extension + Phase 5/6 wiring + regenerated
#     plugin output — ONE indivisible unit (the GH-288 B3 lesson): the prompt
#     block, the guide's enumerated allowlist and Phase 6 readiness, and the
#     feature spec's allowlist/outputs rows must move together or AC-F7-1's
#     identical-text contract is unenforceable at every intermediate boundary;
#     depends on phase 1 because the prompt names the templates it renders
#   3 PDR-0004 landing + F-6 concept alignment — one commit keeps the decision
#     and the practice it governs atomic (pm-notes DEFER contract); turns
#     TC-MEMALIGN-003 green; depends on phase 1 because the corrected adoption
#     checklist must match the scaffolded tree shape (DEC-2)
#   4 the verification suites — they assert content from phases 1-3, so they
#     land after all of it; at this boundary every automated TC is green
#   5 milestone bookkeeping + the full gate battery — the M2-S9 Progress marker
#     is true only when everything before it is green, and the battery re-run
#     makes lifecycle phase 9 (quality_gates) a cheap re-verification
#
# AC OWNERSHIP (all 11 ACs, exactly one owning phase each; phase 4 owns no AC —
# it is the assertion layer for ACs owned by phases 1-3; phase 5 owns the
# aggregate conformance verdict):
#   phase 1  AC-F1-1 (template side), AC-F2-1, AC-F3-1 (carrier side),
#            AC-F4-1, AC-F5-1, AC-NFR2-1 (seed templates)
#   phase 2  AC-F1-2 (resume semantics stated), AC-F7-1, AC-F7-2
#   phase 3  AC-F6-1
#   phase 5  AC-NFR4-1
#
# TC OWNERSHIP (28/28 accounted for — test plan v1.2; ownership = the phase
# that lands the asserted content; every automated TC's verdict is first
# PRODUCED at phase 4's boundary when the suites land, and re-run green by
# phase 5):
#   phase 1  TC-MEMSCAF-001, TC-MEMSCAF-002, TC-MEMSCAF-003, TC-MEMKERN-001,
#            TC-MEMKERN-002, TC-MEMWIRE-001, TC-MEMWIRE-002, TC-MEMWIRE-003,
#            TC-MEMDOCT-001, TC-MEMBUDGET-001, TC-MEMALIGN-004 (v1.2; the
#            self-containment content spans the phase-1 templates and the
#            phase-2 guide memory content)
#   phase 2  TC-MEMCONT-001, TC-MEMCONT-002, TC-MEMCONT-003 (automated part),
#            TC-MEMRESUME-001, TC-MEMFLOW-001 (automated part), TC-MEMCONF-003
#   phase 3  TC-MEMALIGN-001, TC-MEMALIGN-002, TC-MEMALIGN-003
#   phase 4  TC-MEMDOCT-002 (structural negative scan; green from suite
#            creation — the asserted absence is upheld by every phase)
#   phase 5  TC-MEMCONF-001, TC-MEMCONF-002 (verdicts recorded)
#   manual   TC-MEMKERN-003, TC-MEMSCAF-004, TC-MEMWIRE-004 (review-time
#            changed-file checks), TC-MEMRESUME-002, TC-MEMBUDGET-002 and the
#            manual halves of TC-MEMFLOW-001/TC-MEMCONT-003 (live dry-run) —
#            DoD/review evidence owned by the lifecycle, not plan scope
#
# COMMIT CONVENTION (one commit per plan phase; subjects declared here so the
# commit path and review agree; scope is the workItemRef per repo convention):
#   phase 1  feat(GH-302): memory bootstrap template set with distribution markers
#   phase 2  feat(GH-302): wire the memory scaffold into bootstrap phase 5 and 6
#   phase 3  docs(GH-302): land PDR-0004 and align the memory-practices concept
#   phase 4  test(GH-302): memory template invariants and allowlist identity guards
#   phase 5  docs(GH-302): mark M2-S9 delivered with the full gate battery green
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - C-1 mirror constraint (DEC-1, NFR-1): the scaffolded conventions mirror
#     the "Agent memory" section of this repository's AGENTS.md exactly. None of
#     the typed-record fields id/kind/scope/provenance/trust/validity/status is
#     ever presented as a required record field or schema table (NG-2); the only
#     record properties stated are dated, evidence-linked,
#     supersede-never-rewrite.
#   - C-2 no tooling, no code, no doctor automation (DEC-3, NG-1, NG-3): zero
#     changes under scripts/ (except the declared test file in phase 4), tools/,
#     or packages/**; root package.json untouched; the doctor is documentation.
#   - C-3 marker-only (DoR finding 4): each new template carries its
#     ados_distribution: redistributable marker inside its existing
#     frontmatter per the AGENTS.md doc-distribution marker rules (NFR-4,
#     RSK-5); bash scripts/.tests/test-doc-distribution.sh must pass at every
#     boundary that adds or edits a distributable doc. NO license header is
#     added by agents: doc/templates/ is not in
#     scripts/add-header-location.sh scope, agents must never add license
#     headers themselves (AGENTS.md), and the script is not edited in this
#     change (C-2). Boundary, explicitly: no header edits, no script edits.
#   - C-4 prompt edits are current-state only (no evolution-history wording);
#     scripts/build-claude-plugin.sh output (.ados-claude/agents/bootstrapper.md,
#     .ados-claude/skills/bootstrap/SKILL.md) is regenerated and committed in
#     the SAME commit as its .opencode/** source; generated files are never
#     hand-edited (RSK-6).
#   - NG-4: zero writes under this repository's .ai/memory/** or .ai/local/**
#     (the populated tree is the living reference instance; GH-301 owns its
#     evolution). Enforced at review time by TC-MEMSCAF-004.
#   - NG-5: no retro ceremony, command, or automation ships — conventions only
#     (DEC-4). TC-MEMWIRE-004 enforces at review time.
#   - The allowlist extension is exactly `.ai/memory/**` and nothing broader
#     (RSK-3): the golden post-change set is the current 21 entries plus the
#     memory root (22), slotted after the four instruction files; the
#     out-of-allowlist confirmation sentence stays byte-identical in all three
#     carriers; the inception guide ENUMERATES the set (new — today it has no
#     enumerated allowlist).
#   - NFR-3: Phase 5 gains no human gates and zero interview questions; the
#     single Phase 5 approval covers the memory artifacts.
#   - TC-MEMALIGN-003 is intentionally red until phase 3 lands the PDR file —
#     never "fix" it by touching the spec, the test plan, or the index ahead of
#     the phase (pm-notes DEFER contract).
#   - Gates run as `mkdir -p tmp/tmpdir && TMPDIR=$PWD/tmp/tmpdir pnpm check`
#     (pm-notes convention; tmp/ is workspace-local scratch, never committed).
#
# LIFECYCLE PHASE 7 HANDOFF OBLIGATIONS (`system_spec_update`, @doc-syncer;
# declared here so nothing is dropped after DoD — NOT plan scope; doc/spec/
# feature-bootstrapper.md is the one doc/spec file delivery touches, as an
# implementation carrier of the allowlist and Phase 5/6 rows in phase 2; the
