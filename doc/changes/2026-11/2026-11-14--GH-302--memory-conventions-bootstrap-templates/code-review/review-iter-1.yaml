      test plan (TC-MEMKERN-002 step 2) names "a schema table" as an assertable
      shape. No current template contains such a table, so the gap is latent,
      not live.
    suggestion: >-
      Either add a table-header check (fail a line that matches two or more of
      the typed fields inside pipe columns, e.g. /\|(id|kind|scope|provenance|
      trust|validity|status).*(\|(kind|scope|provenance|trust|validity|status))/
      applied to the same four schemaFiles), or narrow the comment and the
      recorded coverage claim to bullet-form detection only. One-line fix
      inside the existing loop over text.split("\n").
