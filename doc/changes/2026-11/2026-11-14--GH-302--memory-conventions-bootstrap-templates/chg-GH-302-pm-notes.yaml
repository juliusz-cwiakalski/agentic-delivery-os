  - text: "RETRO: `phase complete` failed twice before landing — environmental, not
      artifact content. (1) bare `phase` is not on PATH in runner shells; the
      harness entrypoint is the `delivery-os` binary with subcommands. (2) the
      commit primitive's commitlint probe
      (packages/adapters/src/file/commitlint.ts) invokes `commitlint` by bare
      name over PATH; without node_modules/.bin on PATH the probe throws ENOENT
      and reports invalid ('commitlint could not be executed'), failing the
      template message with commit.commitlint-failed. Working invocation for all
      lifecycle commands in this repo: PATH=\"$PWD/node_modules/.bin:$PATH\"
      delivery-os <cmd>. Candidate upstream fix (NOT this change's scope):
      resolve node_modules/.bin/commitlint explicitly like
      scripts/checks/commitlint-authority.ts does."
    type: retro
    date: "2026-11-14"
