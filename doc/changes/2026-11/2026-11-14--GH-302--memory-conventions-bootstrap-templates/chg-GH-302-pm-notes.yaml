  - text: "RETRO root cause of the false premise: PM's discovery glob for
      .ai/memory/** ran with hidden=false (the default), so dot-directory
      content was invisible and 'does not exist' was inferred from absence of
      evidence. LESSON: when probing dot-paths (.ai/**, .github/**,
      .opencode/**) always pass hidden:true to the glob tool, and treat
      glob-empty as inconclusive for tracked-file existence — verify with git
      ls-files or a direct read before stating existence claims in specs."
    type: retro
    date: "2026-11-14"
