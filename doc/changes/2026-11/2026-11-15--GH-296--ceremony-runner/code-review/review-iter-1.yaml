    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/ceremony-run.ts:236
    message: >-
      `renderBrief` hardcodes `counts: {total: 0, ...}` and empty anchor entries
      for every surface even when the declared source is `present`, embedding the
      raw facts under `facts` instead of projecting them — turning a present read
      into a zero/empty claim, the exact anti-pattern F-3's parity obligations
      forbid for degraded reads. Plan Phase 5 declared "the brief render reusing
      the delivered `delivery.brief.v1` projection"; the shipped code builds a
      parallel skeleton renderer. Production impact is currently masked because
      `status-facts` is never composed (the disclosed section-9 known gap), but
      any composed present source renders fabricated zeros and the artifact
      still "verifies".
    suggestion: >-
      Either reuse the delivered brief projection (packages/core/src/domain/brief.ts)
      over the injected facts, or derive surface counts/entries from the present
      facts and refuse to emit zero counts a present source did not declare; add
      a test injecting non-empty present facts and asserting they surface.
    suppressed: false
