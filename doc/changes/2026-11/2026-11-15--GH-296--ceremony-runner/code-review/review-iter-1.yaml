findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/core/src/domain/ceremony-run.ts:926
    message: >-
      `compactCeremonyCarried`'s final byte-bounding `while` loop pops the
      `omitted:` marker it just pushed, so the summary bytes never decrease; any
      compaction that needs to drop more than one line for the 4096-byte bound —
      including every case where the 40-line bound already truncated, because the
      marker is then the last line — loops forever. Reproduced empirically: 50
      entries x 120-char content hangs (killed by timeout; 30 entries x 120
      terminates only because a single pop suffices). A legal project declaration
      (<=32 steps, ~140-byte lines, compaction at a phase boundary) reaches this
      through `ceremony run`/`resume`/`catch-up`, violating NFR-7, NFR-13, and
      AC-F4-4 (an over-bound summary must return with an explicit omitted count).
    suggestion: >-
      Rebuild the summary inside the loop instead of mutating the marked list:
      drop content lines from the front (or recompute the marker after each
      truncation), e.g. keep the marker out of the array and append
      `omitted: N` only when computing `summary`, so each iteration removes one
      content line and bytes strictly decrease. Add a bounds test at the
      composition of both limits (line-overflow + byte-overflow) asserting
      termination and the omitted count; the current ceremony-bounds.test.ts:29-42
      covers only the single-pop byte case.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
