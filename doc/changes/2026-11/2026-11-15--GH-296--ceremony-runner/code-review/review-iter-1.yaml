  - id: F-3
    severity: medium
    confidence: high
    category: testing
    location: packages/cli/src/edge.ts:3961
    message: >-
      The assessment `covered` verdict is unreachable in the composed runtime.
      The note contract carries `facts: readonly string[]` (contracts/ceremony.ts:373)
      — there is no per-item citation channel — and the edge composes `owner-note`
      items as `{text}` only, so every production assessment item is `uncovered`.
      The `covered` path exists only in the test harness's fabricated
      `{text, evidenceRef}` shape (tests/fixtures/ceremony/builtins.ts:79), a
      fixture-versus-production divergence of exactly the GH-170 class the review
      instructions call out: the parity green over `covered` is not evidence of a
      production capability. Additionally, the verdict mapping grants `covered`
      on citation presence alone without checking the citation resolves to
      delivered evidence, unlike the follow-through discipline in the same change.
    suggestion: >-
      Compose a real citation channel (e.g. resolve an item's citation against the
      note's `evidenceRefs` or the delivered gate-report source, granting `covered`
      only when it resolves), or state in the feature spec section-9 gap list and
      the guide that production assessments are all-`uncovered` today; add a test
      asserting a cited-but-unresolvable item is `uncovered`.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
