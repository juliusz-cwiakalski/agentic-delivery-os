    location: packages/cli/src/edge.ts:4305
    message: >-
      `catchUp` passes one shared `envFor("built-in", undefined)` for every
      target, and `runRecordFor` takes the run record's `origin` from
      `env.origin` (ceremony-run.ts:1159), so a catch-up replay of a
      project-declared ceremony records `origin: "built-in"` — a false
      provenance field on a DM-3 record whose origin is load-bearing for
      `ceremony list`'s origin column and idempotency audits.
    suggestion: >-
      Build a per-target environment from the registry entry's origin (the same
      `envFor(entry.origin, undefined)` the `run` verb uses), or thread the entry
      origin into `catchUpCeremonies` targets so the replayed run record carries
      the declaration's true origin. Add a catch-up test with a project
      declaration asserting the recorded origin.
