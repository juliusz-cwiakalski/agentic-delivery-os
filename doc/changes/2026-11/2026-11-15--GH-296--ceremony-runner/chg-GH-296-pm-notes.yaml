  - text: "Lifecycle commands must run with the workspace bin on PATH:
      `PATH=\"$PWD/node_modules/.bin:$PATH\" bun packages/cli/bin/delivery-os.ts
      ...`. Without it the commitlint probe cannot execute and every atomic
      phase completion fails as commit.commitlint-failed, which reads like a
      message problem but is an environment problem."
    type: retro
    date: "2026-11-15"
  - text: "Ran `pnpm build` before any lifecycle command; the CLI resolves workspace
      packages from dist, so an unbuilt tree fails at module load (missing
      @delivery-os/adapters/credentials)."
    type: retro
    date: "2026-11-15"
  - text: "Specification was reopened once: Appendix B cited AC-NFR1-1, which
      section 17 never declared. The test-plan author caught it, not the spec
      author. A mechanical defined-vs-referenced id diff over the whole spec is
      cheap and should run immediately after every spec authoring, before the
      downstream artifacts are written."
    type: retro
    date: "2026-11-15"
  - text: "test_planning: 60 test cases, 45/45 spec ACs traced, SC-M2-S3-01/02
      adopted by id, DM-1..DM-9 and NFR-1..NFR-14 all mapped. AC-NFR14-1 is
      process-evidenced (gate log + PR metadata), not suite-asserted."
    type: info
    date: "2026-11-15"
  - text: "dor_check iteration 1: NOT_READY. Verdict record:
      readiness-review/readiness-iter-1.md. Facets FAIL: spec_completeness,
      cross_artifact_consistency. Blocking findings: (1) scope-key source
      undefined for note-less declarations, so run identity and idempotency are
      undefined for four of six built-ins; (2) retro-evidence-pass declares
      event `change-merged`, which maps to no sub-R1 level and contradicts
      F-9/DEC-4, and explicit runs record no declared trigger; (3) window
      fallback undefined for note-less event-triggered runs
      (decision-record-mirror-sync). Minor: trigger bound stated twice and
      untested; plan phase 8 over-claims AC-F8-1; spec overstates the M2-S10
      dependency edge. No human input required; remediation = reopen
      specification, then test_planning, then delivery_planning, then re-run the
      gate."
    type: info
    date: "2026-11-15"
  - text: "The DoR gate was worth its cost here: three contract-detail holes that
      every traceability matrix said were fine would each have forced the coder
      to invent product behaviour (run identity for four built-ins, a trigger
      that fires no level, and a window that does not exist). Traceability
      coverage is not the same as semantic completeness."
    type: retro
    date: "2026-11-15"
  - text: "dor_check iteration 2: NOT_READY, all six iteration-1 findings verified
      resolved on merit. One new blocking finding introduced by the remediation:
      the explicit-run non-counting rule collides with the catch-up
      missed-window arithmetic (kind-based vs existence-based reading), and both
      readings jam catch-up or leave a window outstanding forever. Minor: two
      plan scope/claim residues, one spec wording nit, one stale test-plan gap
      marker."
    type: info
    date: "2026-11-16"
  - text: "Decided (PM, iteration-2 finding 1): obligation satisfaction is by run
      identity, not by trigger kind. A window is satisfied when a run with that
      (ceremony, scopeKey, window) identity exists, whichever kind produced it;
      the explicit kind is provenance honesty in the record and never
      impersonates a scheduled or event firing. Rationale: idempotency already
      forbids a second execution of one identity, so a kind-based obligation
      could never be cleared and the one-replay-per-invocation slot would jam
      permanently. Recorded in the spec as DEC-19."
    type: decision
    date: "2026-11-16"
  - text: "Two DoR iterations were spent on contract-detail holes that the spec's
      own matrices could not see, and the second one was created by the first
      fix. Lesson: when a new rule interacts with an existing arithmetic
      (obligations vs missed windows), pin the composition in the same pass as
      the rule."
    type: retro
    date: "2026-11-16"
  - text: "dor_check iteration 3: READY, all 10 facets PASS, no pause required.
      Verdict record: readiness-review/readiness-iter-3.md. Iteration-2 findings
      1-5 verified resolved on merit; DEC-19 is the only surviving obligation
      rule across all 13 locations; plan map matches the test plan id for id (65
      TCs); 50/50 ACs, 9/9 DMs, 14/14 NFRs claimed. Accepted non-blocking
      residue for review: a stale GAP-8 PENDING marker in the test plan (plan
      now owns 001..065) and two test-plan lines retaining the old 'before any
      read' shorthand."
    type: info
    date: "2026-11-16"
  - text: "Delivery gate cleared at iteration 3 of 3. Reopening an artifact phase
      after READY would restart the gate, so the two non-blocking wording
      defects are carried as declared residue and surfaced to the reviewer
      instead."
    type: decision
    date: "2026-11-16"
