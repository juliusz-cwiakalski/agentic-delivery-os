      a recorded before/after comparison in this change's artifacts, using the
      committed MET-CEREMONY-SHARE definition. The `ados metrics` surface itself
      belongs to M2-S6 and is out of scope."
    date: "2026-11-15"
  - text: "The ceremony tier engine consumes the delivered plan `tier` declaration
      and the delivered pm-notes `variant` phase sets instead of introducing a
      second phase-set vocabulary; the mapping is specified once."
