  - text: "Lifecycle commands must run with the workspace bin on PATH:
      `PATH=\"$PWD/node_modules/.bin:$PATH\" bun packages/cli/bin/delivery-os.ts
      ...`. Without it the commitlint probe cannot execute and every atomic
      phase completion fails as commit.commitlint-failed, which reads like a
      message problem but is an environment problem."
    type: retro
    date: "2026-11-15"
  - text: "Ran `pnpm build` before any lifecycle command; the CLI resolves workspace
      packages from dist, so an unbuilt tree fails at module load (missing
      @delivery-os/adapters/credentials)."
    type: retro
    date: "2026-11-15"
  - text: "Specification was reopened once: Appendix B cited AC-NFR1-1, which
      section 17 never declared. The test-plan author caught it, not the spec
      author. A mechanical defined-vs-referenced id diff over the whole spec is
      cheap and should run immediately after every spec authoring, before the
      downstream artifacts are written."
    type: retro
    date: "2026-11-15"
  - text: "test_planning: 60 test cases, 45/45 spec ACs traced, SC-M2-S3-01/02
