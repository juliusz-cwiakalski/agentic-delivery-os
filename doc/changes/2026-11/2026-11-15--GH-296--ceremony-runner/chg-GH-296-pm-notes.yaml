    date: "2026-11-16"
  - text: "Remediation slice B (tier engine composition, AC-F7-1..F7-5, DM-7):
      commit 4b275dbb. The runtime now evaluates the tier verdict per
      invocation: it selects the checkout's delivery change from the recorded
      phase.transition ledger truth (newest transition timestamp, greatest ref
      on ties), reads the selected change's committed pm-notes (variant,
      blockers) and plan (tier) documents through a new bounded adapter, and
      maps recorded reopens to the closed escalation-trigger facts (reopen =
      phase-reopen; review_fix = review-rework; quality_gates = gate-failure;
      dor_check = dor-rework; open blocker = owner-escalation). ceremony list
      populates data.tier with a per-ceremony obligated flag and reads the
      ledger in one verified partitioned scan (runs+steps+transitions via the
      new readCeremonyState); ceremony run threads the verdict into runCeremony
      so the run record carries effectiveTier, phaseSetSize and escalations;
      catch-up filters non-obligated declarations and records the verdict on
      replayed runs; an explicit run is never gated. A checkout with no recorded
      lifecycle history resolves no verdict and keeps the delivered default.
      Suites: pnpm typecheck green; new
      tests/behaviour/ceremony-tier-composition.test.ts 10 pass (TC-067);
      cli/list/envelope/catch-up/state-boundary/performance/determinism/bounds/
      hermetic/mutants/non-regression 95 pass; parity/run/notes/resume/TC-066/
      project-declarations/tier suites 112 pass; doc-conformance green; biome
      clean. The tier known-gap bullet in the feature spec and the guide's
      shipped-composition note were replaced with the composed truth."
    type: info
    date: "2026-11-16"
  - text: "Remediation slice C (mirror-sync composition, AC-F3-5, AC-F4-5, NFR-12):
      commit 86739473. The shipped decision-record-mirror-sync now resolves a
      real affected-repository target set and landing path: targets come from
      the committed projects.yaml members (repoKey minus the invoking
      repository; root names the local checkout) through a new decision-register
      adapter; the source set is the invoking repository's committed
      doc/decisions register; mirror.inspect reads the target checkout's
      decision-record set; --apply lands the declared write set as a byte copy
      into the target checkout's decisions directory (idempotent, no force path,
      no child process, no commit in the ceremony path). The dry run now
      verifies the computed write set and preconditions without requiring
      equality (E-8/AC-F4-5), so a fresh target set is dry-run at exit 0; the
      applied run still requires two-way equality (NFR-12), and a drifted or
      absent target is unverified naming the target. Absent projects
      configuration or register degrades declaredly. Suites: pnpm typecheck
      green; new tests/behaviour/ceremony-mirror-composition.test.ts 5 pass
      (TC-068: dry-run lands nothing, apply lands equal byte for byte,
      extra-record drift unverified naming the target, absent target
      precondition named, no-config degradation); flow-mirror/parity/run/
      resume/mutants/hermetic/non-regression/determinism/bounds/performance 77
      pass; flow + tier + runtime + cli/list/envelope/catch-up suites 71 pass;
      doc-conformance green; biome clean. The mirror known-gap bullets in the
      feature spec and the guide were replaced with the composed truth."
    type: info
    date: "2026-11-16"
  - text: "Remediation slice D (slot fidelity, note bounds, read budget — items 4-6
      of the reopened-delivery list; DM-1, DM-2, DM-6, NFR-11): commit f8419a7b.
      The state-record output slot now lands the ledger record its slot
      declares: the step's rendered record document is validated against its
      declared schema and the caller's fenced append is the landing, the step
      record's artifactRef names the ledger record
      (ledger:ceremony.steps:<runId>:<index>), and no artifact file is written
      for the slot. Per-step artifacts in the ceremony-artifact slot are named
      <runId>.s<index>.json so two steps never overwrite one another and a
      re-attempt replaces its own step's file. The note read is bounded in bytes
      before any parse at CEREMONY_NOTE_MAX_BYTES (1 048 576, the configuration
      parser class's bound) with an over-bound note refused as
      ceremony.note-invalid naming the bound, and a stored note read back for a
      resume is re-validated against the note contract — a body that merely
      parses but no longer conforms refuses the resume with the field named.
      Each fenced append now costs exactly one verified state read: the expected
      post-append record total arrives from the caller's own verified read, so
      the append's pre-append list read is gone, and ceremony list keeps at most
      two verified reads through the one partitioned readCeremonyState scan
      (NFR-11 delivered at its original target). New
      tests/behaviour/ceremony-slot-bounds.test.ts pins all three properties
      (TC-CEREMONY-069, 5 tests). The interrupted run's lost failure report
      (9324 pass / 4 skip / 32 fail) was re-enumerated on the completed tree:
      targeted ceremony suites (slot-bounds, run, resume, state-boundary,
      performance, structure and golden ceremony) reported 0 fail, the broad
      ceremony flow/checks/list/bounds/non-regression sweep reported 0 fail, and
      no failure on the current tree reproduces any of the 32 — the failures
      predate the session's final fixture and test edits. Final verification,
      full foreground run kept at tmp/tmpdir/slice-d-final.log:
      TMPDIR=$PWD/tmp/tmpdir PATH=\"$PWD/node_modules/.bin:$PATH\" bun test
      reports 9356 pass / 4 skip / 0 fail across 9360 tests in 1163 files
      (806.05s), confirmed green twice consecutively (907.18s first). No
      assertion weakened and no skip counts as a pass. pnpm typecheck green;
      biome clean on the 16 changed TypeScript files. The commit primitive
      staged all 22 files including the git-added new test and disclosed the
      expected scope drift (doc-sync documents, the new test, the two
      inventories). The spec's slot table, state-layer artifact row, and the
      guide's slot and note sections now state the delivered truth; the
      read-cost and state-record known-gap bullets were replaced with the
      composed truth."
    type: info
    date: "2026-11-16"
