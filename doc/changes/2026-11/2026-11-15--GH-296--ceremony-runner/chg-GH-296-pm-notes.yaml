    date: "2026-11-16"
  - text: "Reopened delivery rather than shipping a mostly-wired surface.
      Remediation list, in priority order: (1) follow-through and assessment
      must never accept a note-supplied status claim - no synthetic evidence
      refs, unverified when the declared artifact is absent, uncovered when no
      evidence exists (AC-F9-2, AC-F9-3, AC-F3-4); (2) compose the tier engine
      into ceremony list and ceremony run so tiered intake is reachable, with
      data.tier populated and the run record carrying effectiveTier,
      phaseSetSize and escalations (AC-F7-1..F7-5, DM-7); (3) compose the
      mirror-sync target set and landing path so decision-record-mirror-sync
      returns verified on a clean mirror, unverified on drift, with a real
      dry-run/--apply split (AC-F3-5, AC-F4-5, NFR-12); (4) state-record and
      mirror-target output slots must write what DM-1 declares, and per-step
      artifacts must not overwrite one another (DM-1, DM-6); (5) bound the note
      read in bytes and re-validate the note schema on read-back (DM-2); (6)
      meet the NFR-11 read budget (<=1 verified read per append, <=2 for list)."
    type: decision
    date: "2026-11-16"
  - text: "Two integrity defaults survived 9334 green tests, three DoR passes, and
      every traceability matrix: the tests asserted that a verdict is produced,
      not that the verdict is earned. A suite that plants a note with no
      verification artifact and asserts unverified would have caught it in phase
      5. Treat 'the default verdict when evidence is absent' as its own required
      negative case for any verification-shaped feature."
