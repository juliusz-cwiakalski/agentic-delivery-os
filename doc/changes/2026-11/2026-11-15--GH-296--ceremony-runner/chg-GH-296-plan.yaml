  # ---------------------------------------------------------------------------
  # Phase 1 — Ceremony declaration contracts, vocabularies, and the single
  # validator (F-2; DM-1, DM-2, DM-9; C-1, C-2, C-7).
  #
  # Goal: land the authored vocabulary every later phase asserts through, as
  # contracts data plus one pure validator used by built-ins and projects
  # alike: the `delivery.ceremony.declarations.v1` member set and bounds
  # (16 ceremonies/document, 12 phases, 32 steps, 16 inputs, 8 targets,
  # triggers 1..8 with at most one `schedule` per declaration, 1 MiB, id
  # grammar <= 64, unique); the closed vocabularies (step kinds, output
  # slots, verification modes, trigger events, cadences, catch-up modes,
  # scope-key derivations (`literal`, `repository`, `note`), recorded
  # trigger kinds (`schedule`, `event`, `catch-up`, `explicit`), recorded
  # trigger resolutions (`note`, `declaration`, `unspecified`), assess
  # verdicts, run verdicts, carry-over reasons — GAP-2 literals pinned here
  # as contract constants); the required `scopeKey` declaration member with
  # its closed derivation set and one precedence rule (a `note` derivation
  # only where a note is required; no default, no implied source; a missing
  # derivation, a `note` derivation without a note requirement, a malformed
  # literal token, or two `schedule` triggers refused as
  # `ceremony.declaration.invalid` naming `scopeKey` or `triggers[]` —
  # DEC-16, E-19); the note contract `delivery.ceremony.note.v1` with
  # `scopeKey` as the idempotency anchor and the retro fixed members; the
  # run/step payload schema shapes (`delivery.ceremony.run.v1`,
  # `delivery.ceremony.step.v1`) carrying the recorded trigger kind,
  # resolution, and declared-trigger/set members (DM-3), tier verdict
  # types (DM-7), and comparison record types (DM-8); and the two additive
  # error identities (`ceremony.note-invalid`, `ceremony.declaration.invalid`)
  # under the new `ceremony` domain kind, with the reserved two-segment
  # allowlist 52 -> 53 and the documented table 136 -> 138 — code rows and
  # the documented rows land in ONE commit because the error-table sync gate
  # lives in `pnpm check` (Appendix C #2, delivering). No behaviour change
  # runs yet: no engine, no state, no surface. The defect corpus (D-01..D-18,
  # the D-15..D-18 scopeKey/trigger half), one committed declaration per
  # legal derivation with the repository-identity fixture, and the bound
  # ladder including the 8/9-trigger rung are committed fixtures.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/structure/{ceremony-contract,ceremony-imports,error-table}.test.ts
  #   bun test tests/behaviour/ceremony-{declaration,declaration-bounds}.test.ts
  #   bun test tests/checks/{error-table-sync,fixture-privacy}.test.ts
  #   bun run scripts/checks/error-table-sync.ts
  #   bun run scripts/checks/ambient-globals.ts
  # ---------------------------------------------------------------------------
