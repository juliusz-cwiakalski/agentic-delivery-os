  # ---------------------------------------------------------------------------
  # Phase 4 — Catch-up of a missed scheduled run (F-5; NFR-6; CU-01..CU-10;
  # E-14, E-15; DEC-19).
  #
  # Goal: schedule evaluation as a pure function of the declaration, the
  # injected clock, and the recorded runs — for a cadence, the windows due
  # before now minus the windows whose run identity
  # `(ceremony, scopeKey, window)` is already recorded for that ceremony are
  # the missed windows; the arithmetic is existence-based over the identity
  # and never scoped to the recorded trigger kind that produced the recorded
  # run (DEC-19), so a window whose identity an explicit run already occupies
  # is not missed: it is reported satisfied with zero new records, no replay
  # for that identity, no outstanding obligation, and it never jams the
  # single replay slot (AC-F5-4, TC-CEREMONY-065); an event-triggered
  # ceremony has none and its missed obligation is a declared gap. `catch-up` replays at most one missed window per ceremony per
  # invocation (`maxMissedWindows: 1`), labelled `trigger.kind: "catch-up"`
  # with the missed bounds and the execution window; a second catch-up
  # appends nothing and reports the window caught up; a no-miss catch-up is
  # `data.outcome: "nothing-missed"` with zero records at exit 0;
  # `catchUp.mode: "none"` reports a declared gap with bounds and no run; a
  # removed declaration keeps its history readable and reports the gap; the
  # replayed run reads current inputs and fabricates nothing. The structure
  # suite pins purity: the only time input is the injected clock port, and a
  # `Date.now` mutation fails.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/ceremony-catch-up.test.ts
  #   bun test tests/structure/ceremony-catch-up-purity.test.ts
