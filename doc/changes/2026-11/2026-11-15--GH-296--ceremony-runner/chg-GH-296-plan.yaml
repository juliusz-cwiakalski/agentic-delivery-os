#
# SCOPE CONVENTION: concrete files are exact paths; folders are declared by
#   every phase that writes a new file inside them (the commit primitive stages
#   only the declared phase scope). A file edited in two phases is declared in
#   both phases; `plan diff` reports the first covering phase.
#
# DECLARED CONTROLS, NOT EDITS: the delivered regression suites named in the
#   test plan §7 ("existing suites asserted unchanged" — the retro-*, closeout-*,
