# GH-296 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly.
#
# SOURCES (single source of truth):
#   - Spec:     ./chg-GH-296-spec.md (v1.2; 9 capabilities F-1..F-9; data model
#               DM-1..DM-9; NFR-1..NFR-14; 50 ACs in §17 — AC-F1-1..4,
#               AC-F2-1..4, AC-F3-1..8, AC-F4-1..8, AC-F5-1..4, AC-F6-1..3,
#               AC-F7-1..5, AC-F8-1..3, AC-F9-1..6, AC-NFR2-1, AC-NFR8-1,
#               AC-NFR9-1, AC-NFR12-1, AC-NFR14-1; edge cases E-1..E-20; §18
#               rollout order binds the phase order below; Appendix B
#               constraints C-1..C-10; Appendix C documentation deltas;
#               Appendix D single-source tier mapping; Appendix E testability
#               notes; DEC-1..DEC-19 — DEC-19 pins obligation satisfaction by
#               run identity, not by recorded trigger kind; RSK-1..RSK-12;
#               OQ-1..OQ-3).
#   - Tests:    ./chg-GH-296-test-plan.md (v1.2, 65 TCs TC-CEREMONY-001..065;
#               §4 layer table; §4.3 exit/outcome oracle; §4.4 catch-up matrix
#               CU-01..CU-10; §4.5 tier verdict matrix T-01..T-11; §4.6 defect
#               corpus D-01..D-18; §4.7 resume matrix R-01..R-08; §4.8 gate
#               mapping; binding fixture contract §4.1 and non-vacuity contract
#               §4.2; §7 automation map; §7.1 phase ownership of all 65 ids;
#               GAP-1..GAP-8; OQ-T1..OQ-T9, OQ-T5/OQ-T8/OQ-T9 resolved).
#               GAP-1, GAP-7, and GAP-8 (this plan's TC mapping, including
#               the v1.1 ids TC-CEREMONY-061..064 and the v1.2 id
#               TC-CEREMONY-065) are satisfied by the TC -> PHASE MAP below
#               WITHOUT reshaping any TC's oracle, identity, exit, bound, or
#               AC/NFR mapping; no TC id changes.
#   - PM record: ./chg-GH-296-pm-notes.yaml (milestone M2, story M2-S3,
#               variant full; the two recorded scope decisions carried into the
#               spec as DEC-1 and DEC-2).
#   - Schema:   doc/spec/features/feature-plan-schema.md and
#               packages/core/src/contracts/plan.ts (scope keys
#               files/packages/folders with boundary-aware matching, typed
#               doneArtifacts, leases, weightClass, interactions whose target
#               must sit inside the phase's own scope; no tasks key, no
#               progress log).
#   - Repo rules: .ai/rules/typescript.md (purity, ports, `#` aliases, the
#               error contract), .ai/rules/testing-strategy.md (layers, module
#               -> test mapping, invariant-test authoring), AGENTS.md,
#               .dependency-cruiser.cjs (package matrix and subpath tiers).
#
# TIER DECLARATION: `{name: full}` only — no `phases`, no
#   `escalationTriggers`. This change's own contract (spec DEC-2, Appendix D)
#   consumes exactly two delivered phase-set sources and forbids a third
#   vocabulary; a plan-level hardcoded phase-set list would be exactly the
#   default-set data the ceremony tier engine must never consult, and
#   AC-NFR9-1/TC-CEREMONY-051 fail a hardcoded default phase set. The recorded
#   pm-notes variant (`full`) supplies the effective phase set.
#
# PHASE ORDER (spec §18, binding): contracts and vocabularies -> record
#   boundary -> engine (intake, agenda, verification, compaction, resume) ->
#   catch-up -> built-in declarations -> project declarations -> tier engine ->
#   measurement record -> mount and documentation. Every phase below is one
#   `commit`-able delivery slice whose declared narrow gate is green at the
#   boundary; every phase is `delivery` kind and takes the `repo:main-tools`
#   lease (mirrored per phase; identical to `defaultLeases`). The family is
#   composed only in Phase 9, once its engine, declarations, tier engine, and
#   measurement record exist, so an uncomposed surface can never answer
#   partially (§18).
#
# SHARED CONTRACT FILES (run-in-sequence pairs, named per the overlap
#   convention; phases sharing one of these files execute in id order, and
#   independent pairs answer `parallel`):
#   - packages/core/src/contracts/ceremony.ts        produced 1; consumed 2, 7
#   - packages/core/src/state/ceremony.ts            produced 2; consumed 3, 4, 8
#   - packages/core/src/domain/ceremony-run.ts       produced 3; consumed 4
#   - packages/core/src/contracts/ceremony-builtins.ts produced 5; consumed 6, 9
#   A consuming phase declares the contract file in its own scope only to make
#   the consumer edge valid; an untouched declared file is a `plan diff`
#   observation, never a gate failure.
#
# OQ RESOLUTIONS (test plan §8.3 OQ-T1; the spec's proposed resolutions for
#   OQ-1..OQ-3 are ADOPTED by plan authoring as the spec authorises):
#   1. OQ-1 — no ceremony run-history read verb ships. `ceremony list`'s
#      last-run summary plus the durable run/step records carry history; M2-S6
#      may add the read if it needs one. The mounted grammar stays exactly
#      `list`, `run`, `resume`, `catch-up` (AC-F1-1).
#   2. OQ-2 — the comparison record's `nativeBasis` carries per-ceremony
#      counts, means, and p90 over the observed runs beside the per-run
#      durations, with the non-interchangeability statement and no
#      cross-metric aggregation. GAP-6 applies: TC-CEREMONY-041's
#      `nativeBasis` assertions extend to those aggregates; the mandatory
#      DM-8 members are unchanged.
#   3. OQ-3 — the `pre-dispatch` mirror obligation is advisory in this change:
#      drift is reported as a finding naming the target; blocking dispatch
#      admission stays deferred (§7.3).
#   4. OQ-T2 — the after sample is the set of changes whose ceremony phases
#      were recorded after this change's delivery boundary (its merge into
#      `main-tools`). At delivery time n = 0 < 5, so the delivered record's
#      verdict is `insufficient-sample` with the observed n and per-change
#      values recorded and no trend claim anywhere in the change artifacts
#      (AC-F8-3, DEC-14, RSK-4). The record is recomputed per delivery; M2-S6
#      makes the first meaningful trend read.
#
# DOCUMENTATION SCOPE (Appendix C): the plan carries ONLY the rows Appendix C
#   marks "delivering" — #2 result-contract error rows (Phase 1), #7/#8
#   measurement-baseline spec + log comparison entry (Phase 8), #11-#14 command
#   registry row, M2 command page, M2 pack README, entrypoint delta (Phase 9),
