  # ---------------------------------------------------------------------------
  # Phase 3 — The runner engine: intake, artifact-verified agenda execution,
  # compaction, resume (F-4; DM-2 intake; C-1, C-3, C-5).
  #
  # Goal: execute a validated declaration deterministically over injected
  # ports. Intake resolves the declaration; resolves its scope key by the
  # F-2 derivation precedence (the note's `scopeKey` where the declaration
  # derives from `note`, else the `literal` token or the `repository`
  # identity, a disagreement refused — DEC-16); resolves the window by the
  # F-1 order (the note's window, else `--window`, else the single declared
  # cadence's window derived from the injected clock at its UTC unit — a
  # note-less event-triggered declaration declares none, so an invocation
  # without `--window` is refused as `input.value.rejected` naming
  # `--window` after the declaration read and before any declared-input
  # read, state read, or write — DEC-18, E-18); validates the note
  # when one is required (absent note -> `input.value.rejected`; missing
  # member, wrong ceremony, invalid window -> `ceremony.note-invalid` naming
  # the field; a `--window` disagreement names both; a note without
  # `scopeKey` or naming a trigger the declaration does not declare refuses
  # before any output — SC-M2-S3-02, DEC-17); records an explicit run's
  # trigger as `kind: "explicit"` with resolution `note`, `declaration`, or
  # `unspecified` naming the declared set — provenance only, never
  # impersonating a `schedule`, `event`, or `catch-up` firing and never
  # rewriting an obligation's own trigger provenance, while satisfying the
  # window's run identity like any other run so no obligation for it remains
  # (DEC-17, DEC-19, E-20); computes the run identity
  # `(ceremony, scopeKey, window)` — note-less declarations included, keyed
  # by their declared derivation and resolved window; and returns the
  # recorded verdict with `data.reused: true` on an identical identity with
  # zero appends. The
  # agenda executes in declared order; each step writes its declared slot,
  # reads it back, and is `verified` only when the read-back passes the
  # declared mode; a failed verification stops the agenda, makes the run
  # `unverified` at exit 1, and keeps records plus artifact durable; every
  # attempted step appends one durable step record; the verdict is the step
  # fold. Compaction folds each completed phase into a carried summary
  # <= 4 096 bytes / <= 40 lines with an explicit omitted count. Resume
  # starts at the first unverified index, never re-executes a verified step,
  # and refuses a contradicted record sequence as `state.store.torn` at
  # exit 2 with zero writes. A `sync` step without `--apply` computes and
  # precondition-checks the write set and lands nothing (dry-run verdict).
  # Zero model calls, zero ambient reads (C-5).
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/{ceremony-run,ceremony-run-triggers,ceremony-resume,ceremony-notes}.test.ts
  #   bun test tests/behaviour/ceremony-state-boundary.test.ts
  #   bun run scripts/checks/ambient-globals.ts
  # ---------------------------------------------------------------------------
