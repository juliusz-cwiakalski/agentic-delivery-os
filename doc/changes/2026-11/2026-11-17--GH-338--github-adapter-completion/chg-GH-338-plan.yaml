  #   spawns for the API tier and both guard counters zero, the child-process site
  #   set equal to the declared thirteen and the launcher still the single
  #   composition call site):
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck                                   (G6)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/providers               (G2)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/conformance                       (G3)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/boundaries                        (G5)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/structure                         (G1)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/secret-read-boundary.test.ts tests/checks/fixture-sanitization.test.ts tests/checks/fixture-privacy.test.ts  (G4/G8)
  #   TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/secret-read-boundary.ts   (G7)
  #   TMPDIR=$PWD/tmp/tmpdir git diff --check                                 (G9)
  #   TMPDIR=$PWD/tmp/tmpdir pnpm check                                       (G10, binding)
  # ---------------------------------------------------------------------------
