  # ---------------------------------------------------------------------------
  # Phase 1 — The ninth closed operation, the capability posture, and the
  # conformance plumbing, in ONE commit (F-1, F-3; DM-1, DM-2; AC-F1-2,
  # AC-F1-3, AC-F3-1..5; DEC-1..DEC-4 staged; RSK-7, RSK-9).
  #
  # Goal: the closed set grows to nine and GitHub supports the landing, with the
  # registry, the runner dispatch, the mock-tenant route/projection, and the
  # coverage gates moving in the same commit. The one-phase coupling block in
  # this file's header is the reason: `conformance-coverage.test.ts` needs set
  # equality and `runtimeCoverageViolations` needs every supported operation to
  # EXECUTE, so a contract-only commit is structurally impossible and a
  # declared-but-inert operation is forbidden.
  #
  # Contract: `merge-delivery-request` joins ADAPTER_OPERATIONS with canonical
  # arguments { deliveryRequest, strategy: "squash", commitTitle?,
  # commitMessage?, expectedHeadSha? } and an outcome carrying an optional
  # provider-supplied landing commit identity (absent stays absent, never
  # derived); `PipelineJob` gains optional `startedAt`/`completedAt` copied
  # verbatim by the provider normalizer (no `durationMs`, no derived span).
  # Posture: GitHub 7 supported + 2 gaps; GitLab `adapter-not-implemented`;
  # Jira `provider-unsupported`; nothing else moves. The posture contract is SET
  # equality both directions (supported union gaps equals the closed set, the two
  # lists disjoint, no extras, no omissions) — TC-POSTURE-001 v1.1 says so and
  # states that declaration order is NOT part of the contract. The plan therefore
  # KEEPS the delivered declaration order and APPENDS: the GitHub declaration
  # keeps its delivered six members and gains `merge-delivery-request` last, so
  # the exact list in tests/structure/provider-surface.test.ts moves here to
  # seven members (delivered order preserved) and again in phase 3 to nine. No
  # reorder and no ordering assertion exists anywhere; the delivered closed set
  # itself appends (index 7 stays `resolve-delivery-thread`).
  # Landing semantics (GitHub member): one request, squash only, crafted
  # title/message transmitted verbatim, the head guard never overridden, a guard
  # rejection classified, a non-2xx classified with structured status, a
  # transport failure classified with no status, already-merged success ONLY
  # after a read-back that observes provider-asserted merged truth, at most once
  # per invocation and never retried, and no representable force/bypass/
  # auto-merge/queue/rebase/merge-commit strategy. `write-delivery-request`
  # stays a content write and never lands.
  # Decision records: the four TDRs (DEC-1..DEC-4) and the ADR-0005 editorial
  # pointer file land here from the worktree (see COMMIT-BOUNDARY REALITY)
  # together with the decision index.
  #
  # Obligations:
  #   1.1 Declare the ninth operation and the landing argument/outcome types;
  #       add the two optional job timestamps; re-export through contracts.
  #   1.2 Move the three capability declarations; add the new operation's gap
  #       rows for GitLab and Jira only.
  #   1.3 Add the landing step to the registry and the three write members'
  #       dispatch seam (mergeDeliveryRequest; writeComment/createDeliveryRequest
  #       land in phase 3 with their support); make a declared expected
  #       projection optional and exactly compared for write steps (refinement 2).
  #   1.4 Extend the GitHub tenant with the landing route and its expected
  #       projection; keep the existing six routes untouched.
  #   1.5 Author the landing fixture set and the type probes; extend the trap
  #       catalog and its EXPECTED_TRAPS pin with the landing entries.
  #   1.6 Move the operation- and step-count pins in the SAME commit. The closed
  #       set APPENDS and is never reordered (`ADAPTER_OPERATIONS` 8 -> 9 with
  #       index 7 still "resolve-delivery-thread"); the GitHub DECLARATION also
  #       APPENDS one member and keeps its delivered order (see the posture note
  #       above):
  #       tests/structure/closeout-contract.test.ts and
  #       tests/behaviour/providers/github-collection.test.ts carry the 8 -> 9
  #       operation pins; the change-lifecycle step-id list gains
  #       "change-lifecycle.merge-delivery-request" last and the step count
  #       moves 13 -> 14 (tests/structure/closeout-contract.test.ts and
  #       tests/structure/conformance-coverage.test.ts); the capability suite's
  #       WRITE_METHODS map gains "merge-delivery-request": "mergeDeliveryRequest"
  #       so the supported-operation method assertion stays real
  #       (tests/behaviour/providers/provider-capabilities.test.ts).
  #   1.7 Move tests/fixtures/ports/capabilities.ts and
  #       tests/fixtures/ports/v1-contract-inventory.json; keep the nine
  #       catalogue primitives unchanged.
  #   1.8 Stage the four decision records, the ADR-0005 editorial pointer file
  #       (tracked and modified in this branch state), and the decision index.
  #   1.9 Add the ONE stateful scripted transport helper to
  #       tests/behaviour/providers/support.ts (refinement 3) because
