  # ---------------------------------------------------------------------------
  # Phase 2 — CLI-first transport, probe, composition selection, and the
  # cross-transport parity proof (F-2; DM-5, DM-7; AC-F2-1..5, AC-F8-3;
  # DEC-1/TDR-0031; RSK-1, RSK-2, RSK-3, RSK-10; NFR-1, NFR-2, NFR-3, NFR-4,
  # NFR-9).
  #
  # Goal: one second ProviderTransport over `gh api`, selected once at the
  # composition edge by a bounded probe, with a declared API fallback and no
  # per-request failover — proven entirely offline through an injected runner.
  # The transport maps an already-shaped ProviderRequest to one fixed argv
  # (`api <path> --method <METHOD> --hostname <host> --include`, `--input -` for a
  # body; never `--paginate`, never `--jq`, never a shell), removes the
  # Authorization header from the forwarded headers, reconstructs status plus body
  # from the final `--include` status block, and classifies an unparsable or
  # missing status block as a refusal rather than assuming 200.
  # The child environment is built ENTIRELY from injected data (refinement 8): the
  # base record is the composition's injected `environment`, which supplies `PATH`
  # — so the binary is never resolved through an ambient read and no
  # `process.env` access is added under packages/** — the credential value is the
  # resolved material the client already placed on the request's `Authorization`
  # header (resolved through the credential port, never a second source), and the
  # builder adds the isolated `GH_CONFIG_DIR`, `GH_PROMPT_DISABLED`, `NO_COLOR`,
  # and the update-notifier suppressor. No secret enters argv or any diagnostic.
  # WHERE THE PROBE RUNS (refinement 7 — the bound mechanism, because
  # `EntrypointComposer` is synchronous and only the launcher is async):
  #   packages/adapters/src/github/cli-transport.ts exports the Promise-based
  #   `probeGithubCli`, the transport factory, the DM-10 `GithubTransportSelection`
  #   type, and the pure selection resolver;
  #   packages/cli/src/production.ts exports the async composition resolver
  #   `resolveGithubTransportSelection(facts)`;
  #   packages/cli/src/bin-launcher.ts AWAITS that resolver before composing and
  #   passes the value as `ProductionCompositionFacts.githubTransportSelection`,
  #   which is how it reaches the synchronous `createProductionComposer`. The
  #   composer never probes: a present selection picks the transport, an absent
  #   selection is the delivered offline API default (so every delivered
  #   composition test and every embedder stays probe-free with zero spawns).
  # The probe performs one bounded version invocation and returns exactly one of
  # `provider.cli.unavailable`, `provider.cli.version-unsupported`,
  # `provider.cli.capability-unsupported`; it runs at composition only, never at
  # module load, never per request, and never in the mock tier. Under `prefer-cli`
  # a refusal selects the API transport, carries exactly one DM-10 value
  # (`policy`, `selected: "api"`, `degradation.code` = that refusal code) on the
  # composed runtime, and renders exactly one human diagnostic line naming the
  # code through the delivered composition-notice/warnings channel; `api-only`
  # never probes and carries `degradation` absent. Nothing is persisted. Mid-run
  # failure is a classified transport failure with no status and nothing is
  # re-issued on the other transport (a write is never landed twice).
  # The child-process guard joins the throwing-`fetch` guard in the mock tier,
  # covering spawn/spawnSync/exec/execFile/fork, with a firing canary; the
  # runtime-API confinement allowance keeps its exact-path reason-bearing form
  # and its comment records the bounded child invocation (no wildcard, no new
  # entry, secret-read allowlist unchanged).
  #
  # Obligations:
  #   2.1 Author the transport module, the runner seam with its execFile default,
  #       the argv/environment builders, the status parser, the probe
  #       (`probeGithubCli`), the DM-10 type, the PURE selection resolver, and
  #       GITHUB_TRANSPORT_MATRIX; export the native-fetch factory and the
  #       additive subpath names.
  #   2.2 Wire the async composition edge: export `resolveGithubTransportSelection`
  #       from production.ts, await it in bin-launcher.ts before
  #       `createProductionComposer(...)`, and pass the resolved value as the
  #       `githubTransportSelection` fact. The launcher gains exactly one await
  #       and one forwarded fact — no composition logic, and the single
  #       `createProductionComposer(` call site stays the launcher's. An injected
  #       `githubTransport` still bypasses selection entirely (probe-free). The
  #       value the resolver returns IS the composed selection: the composer holds
  #       it for the invocation to pick the transport and to render the one line,
  #       and it is never added to `GithubClient`, `GithubClientOptions`, a
  #       normalized view, a state record, or the conformance artifact.
  #   2.3 Render the DM-10 degradation exactly once: one line pushed into the
  #       composer's existing `compositionNotices` (the delivered warnings
  #       channel), once per composed program, nothing persisted and nothing
  #       added to an error table or a normalized view; `api-only` and a
  #       successful CLI selection render nothing.
  #   2.4 Build the child environment from the injected environment record
  #       (PATH plus the declared variable set) and the request's resolved
  #       credential; assert the exact key set in TC-CLI-003, keep the
  #       secret-read allowlist count unchanged, and prove no ambient read exists
  #       in the transport module.
  #   2.5 Move the confinement allowance comment and the boundary fixtures; add
  #       the child-process fixture case(s) and registry rows.
  #   2.6 Install the child-process guard beside the network guard; assert zero
  #       spawns for the whole mock tier with a firing canary.
  #   2.7 Author the four CLI fixture tables and the two suites (behaviour +
  #       cross-transport parity over one route table); extend the trap catalog
  #       (status recovery, credential absence) and its pins.
  #   2.8 Update the pinned surfaces exactly, INCLUDING the child-process site
  #       set: tests/structure/harness-imports.test.ts declares
  #       `DECLARED_CHILD_PROCESS_SITES` as an exact-equality list over
  #       packages/**, so it moves 12 -> 13 by adding
  #       "packages/adapters/src/github/cli-transport.ts" (the one new site) and
  #       its header comment states the set is a declared site inventory, never a
  #       prefix or wildcard. This test file is part of this phase's own G1 gate.
  #
  # Acceptance: AC-F2-1 (TC-CLI-001), AC-F2-2 (TC-CLI-010/011 — the DM-10 value
  #   `{policy, selected, degradation.code}`, exactly one rendered line, zero
  #   persisted copies, zero probe spawns under `api-only`; the AC-F7-4
  #   documentary half of the same facts completes in phase 6 via TC-REF-005),
  #   AC-F2-3 (TC-CLI-002/003/013), AC-F2-4 (TC-CLI-004/005/009), AC-F2-5
  #   (TC-CLI-006/007/008/012), AC-F8-3 (TC-PARITY-006). TC-FLOOR-004's
