  #   2.5 Move the confinement allowance comment and the boundary fixtures; add
  #       the child-process fixture case(s) and registry rows.
  #   2.6 Install the child-process guard beside the network guard; assert zero
  #       spawns for the whole mock tier with a firing canary. TC-PARITY-006's
