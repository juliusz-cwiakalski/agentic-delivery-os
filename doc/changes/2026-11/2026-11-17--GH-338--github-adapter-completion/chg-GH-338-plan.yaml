  # per-request failover — proven entirely offline through an injected runner.
  # The transport maps an already-shaped ProviderRequest to one fixed argv
  # (`api <path> --method <METHOD> --hostname <host> --include`, `--input -` for a
  # body; never `--paginate`, never `--jq`, never a shell), removes the
  # Authorization header from the forwarded headers, builds the child
  # environment as data (token variable, host variable, isolated GH_CONFIG_DIR,
  # prompt suppression, no-colour and update-notifier suppression), reconstructs
  # status plus body from the final `--include` status block, and classifies an
  # unparsable or missing status block as a refusal rather than assuming 200.
  # The probe performs one bounded version invocation and returns exactly one of
  # `provider.cli.unavailable`, `provider.cli.version-unsupported`,
  # `provider.cli.capability-unsupported`; it runs at composition only, never at
  # module load, never per request, and never in the mock tier. Composition
  # records the declared degradation once when the API transport serves under
  # `prefer-cli`; `api-only` never probes. Mid-run failure is a classified
  # transport failure with no status and nothing is re-issued on the other
