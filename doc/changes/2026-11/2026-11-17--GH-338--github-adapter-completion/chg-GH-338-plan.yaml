  # ---------------------------------------------------------------------------
  # Phase 2 — CLI-first transport, probe, composition selection, and the
  # cross-transport parity proof (F-2; DM-5, DM-7; AC-F2-1..5, AC-F8-3;
  # DEC-1/TDR-0031; RSK-1, RSK-2, RSK-3, RSK-10; NFR-1, NFR-2, NFR-3, NFR-4,
  # NFR-9).
  #
  # Goal: one second ProviderTransport over `gh api`, selected once at the
  # composition edge by a bounded probe, with a declared API fallback and no
  # per-request failover — proven entirely offline through an injected runner.
  # The transport maps an already-shaped ProviderRequest to one fixed argv
  # (`api <path> --method <METHOD> --hostname <host> --include`, `--input -` for a
  # body; never `--paginate`, never `--jq`, never a shell), removes the
  # Authorization header from the forwarded headers, reconstructs status plus body
  # from the final `--include` status block, and classifies an unparsable or
  # missing status block as a refusal rather than assuming 200.
  # The child environment is built ENTIRELY from injected data (refinement 8): the
  # base record is the composition's injected `environment`, which supplies `PATH`
  # — so the binary is never resolved through an ambient read and no
  # `process.env` access is added under packages/** — the credential value is the
  # resolved material the client already placed on the request's `Authorization`
  # header (resolved through the credential port, never a second source), and the
  # builder adds the isolated `GH_CONFIG_DIR`, `GH_PROMPT_DISABLED`, `NO_COLOR`,
  # and the update-notifier suppressor. No secret enters argv or any diagnostic.
  # WHERE THE PROBE RUNS (refinement 7 — the bound mechanism; the composer is
  # synchronous and only the composition path probes):
  #   packages/adapters/src/github/cli-transport.ts exports the Promise-based
  #   `probeGithubCli`, the transport factory, the DM-10 `GithubTransportSelection`
  #   type, and the PURE synchronous resolver `resolveTransportSelection`;
  #   packages/cli/src/production.ts exports the async composition resolver
  #   `resolveCompositionTransportSelection(facts)`;
  #   packages/cli/src/entrypoint.ts accepts and awaits a promised program at its
  #   one composition call site (after every self-description return);
  #   packages/cli/src/bin-launcher.ts passes ONE async wrapper that awaits the
  #   composition resolver and then invokes the synchronous
  #   `createProductionComposer` with the value forwarded as
  #   `ProductionCompositionFacts.githubTransportSelection`.
  # SPAWN BUDGET: PER COMPOSITION, NOT PER LAUNCHER INVOCATION. The delivered
  # entrypoint returns BEFORE `composeProgram` for root `--version`,
  # `--print-install-path`, root `--help`, and command `--help`, so the wrapper —
  # and therefore the probe — never runs on those paths. TC-CLI-010
  # (tests/behaviour/providers/github-cli-transport.test.ts) pins the budget:
  # exactly one probe spawn for a composing invocation, ZERO for each of the four
  # self-description paths, and zero provider requests in every case. Table C's
  # "at composition time only; never at module load" is therefore literal.
  # The probe performs one bounded version invocation and returns exactly one of
  # `provider.cli.unavailable`, `provider.cli.version-unsupported`,
  # `provider.cli.capability-unsupported`; it runs only on the composition path,
  # never at module load, never per request, never on a self-description path, and
  # never in the mock tier. Under `prefer-cli` a refusal selects the API transport
  # and produces exactly one DM-10 value (`policy: "prefer-cli"`,
  # `selected: "api"`, `degradation.code` equal to that refusal code): the value
  # the composition resolver returns and the launcher consumes, with exactly one
  # human diagnostic line naming the code rendered through the delivered
  # composition-notice / warnings channel. Its observable surface is exactly that
  # (spec v1.2 F-2, Table C, AC-F2-2, §10): one resolver value, one rendered line,
  # ZERO persisted copies (no state file, capsule/event record, schema key, error
  # table row, or conformance artifact), and NO new readable surface on the
  # composed program object. `api-only` never probes, selects the API transport,
  # and carries `degradation` ABSENT.
  # THE ABSENT-SELECTION STATE IS DECLARED, NOT INFERRED (spec v1.2 F-2, Table C,
  # DM-10, §8.5): when `ProductionCompositionFacts.githubTransportSelection` is
  # absent there is NO probe, NO policy claim, and NO DM-10 value, and the
  # delivered native-`fetch` transport serves. The production launcher ALWAYS
  # supplies the fact (pinned by the single `createProductionComposer(` call
  # site), so no delivered production composition changes and the absent state
  # exists for composition tests and hypothetical embedders only — which is what
  # keeps every delivered composition test probe-free with zero spawns.
  # Nothing is persisted on any path. Mid-run failure is a classified transport
  # failure with no status and nothing is re-issued on the other transport (a
  # write is never landed twice).
  # The cross-transport parity route table is RESTRICTED to the members that
  # exist after phase 1: the delivered reads (work item, delivery request,
  # pipeline/list page), delivered thread resolution, and the phase-1 landing
  # member. Comment and content-write parity is phase 3, which extends the SAME
  # route table and the SAME suite (both paths are declared in both phases).
  # The child-process guard joins the throwing-`fetch` guard in the mock tier,
