  # ---------------------------------------------------------------------------
  # Phase 3 — Backlog completion: the comment write, the delivery-request
  # content write, and one injected seeded workflow map for read normality and
  # transition writes (F-1 completion, F-6; DM-6; AC-F1-1, AC-F6-1..6, AC-F8-1,
  # AC-F8-2; DEC-2, DEC-4, DEC-6; RSK-5, RSK-11; NFR-11).
  #
  # Goal: GitHub becomes the complete backlog reference. `write-comment` accepts
  # carrier-free human text only (empty carrier arrays, no envelope block) and
  # returns the provider comment identity. `write-delivery-request` is a CONTENT
  # write with one adapter-local input (DM-9) in two declared variants — a
  # `create` carrying `{ sourceRef, targetRef, title, body, draft? }` and an
  # `update` carrying `{ deliveryRequest, title?, body? }`; a create requires both
  # refs and a non-empty title, never lands, and never sets merge state; an update
  # never creates; a write missing its required input is a named typed refusal
  # carried by the existing `provider.payload.invalid` identity with a detail
  # naming the missing field and ZERO provider requests; success returns the
  # normalized delivery-request view whose identity is the returned identity.
  # Transitions resolve through ONE map used by both directions: the four-row
  # precedence-ordered seed (`closed` -> `done` field-update; `review` ->
  # `in-review` label-swap; `in-progress` -> `in-progress` label-swap; `open` ->
  # `ready` field-update), optionally injected, with status tokens being native
  # issue states or lifecycle label names.
  # MAP VALIDATION — AUTHORITY IS TDR-0034 §1, which spec v1.2 DM-6 restates; no
  # test case defines the contract. The confined validator rejects exactly this
  # set, naming the offending row: (1) `systemName` not a non-empty string;
  # (2) `states` not an array, empty, or holding a non-object row; (3) a
  # `nativeStatus` that is not a non-empty string or repeats an already-declared
  # token; (4) a `deliveryState` or `transitionMechanism` outside its closed set;
  # (5) two rows declaring the same delivery alias; (6) no row resolving to
  # `done`; (7) a `done` row that is not the `field-update` row on the native
  # issue state `closed`. TIMING: it runs exactly ONCE per client construction on
  # the RESOLVED map (the injected map when supplied, otherwise the seed), before
  # the first operation — never lazily, never per request, never at module load.
  # A failure is CAPTURED, not thrown: the factory keeps its delivered return
  # type, and the first and every subsequent operation returns the existing
  # `provider.payload.invalid` refusal whose detail names the failed check and the
  # offending row, with ZERO provider requests, no new error-table row, and no new
  # configuration code. The seed is held to exactly the checks an injected map is.
  # THE LABEL RULE IS MECHANISM-SCOPED (never universal): only a `label-swap`
  # transition reads, removes, or adds labels — it removes exactly the declared
  # `label-swap` tokens that are present, adds the row token, never replaces the
  # whole array, preserves unrelated labels, treats a `field-update` row's token
  # as a provider state rather than a label, and refuses on an unavailable label
  # signal with zero provider requests. A `field-update` transition writes ONLY
  # the provider state: no label read, no label write, no label-signal refusal —
  # so the delivered closeout `done` write stays byte-identical (one state-only
  # `PATCH`, body exactly `{"state":"closed"}`, zero label requests, success even
  # when the label signal is unavailable). A transition to a declared NON-TERMINAL
  # `field-update` alias (`ready` via the `open` row) is a named typed refusal
  # with zero provider requests; the writable set is exactly `done` plus each
  # declared `label-swap` alias. An undeclared alias is a named adapter-local
  # typed refusal with zero provider writes.
  # EVERY TRANSITION RESOLVES AGAINST THE ISSUE'S CURRENT READ (TDR-0034 §3.2,
  # spec v1.2 §8.4.1 "Write resolution against the current read", AC-F6-4):
  # a `label-swap` write to an issue whose current read resolves to `done`
  # refuses with a named typed failure and ZERO provider requests REGARDLESS OF
  # THE ISSUE'S LABELS, because terminal precedence would outrank the token the
  # write adds and the write could never be observed; reopening is outside this
  # mechanism. That terminal refusal is distinct from the unavailable-label-signal
  # refusal (terminal precedence decides the first, an unobserved label container
  # the second). A labelless fixture therefore exercises the SIGNAL refusal only
  # when its native state is `open`; `workflow-map-cases.json#labelless-issue` is
  # pinned `open` for exactly that reason, so its pass criterion cannot be
  # satisfied by the terminal refusal.
  # Read resolution is one refusal class with FOUR declared outcomes: a `closed`
  # issue resolves to `done` regardless of labels; otherwise the first
  # declared-precedence row whose token equals a present label name EXACTLY wins;
  # otherwise a label differing from a declared `label-swap` token by case alone
  # is a visible normalization failure carried by the existing
  # `provider.payload.invalid` identity (detail names the label and the colliding
  # token, no new error-table row) — a case difference on a `field-update` token
  # is NOT a collision (`CLOSED` resolves natively); otherwise the issue resolves
  # through its native-state row. An unrecognized label, a labelless issue, and an
  # unavailable label signal never refuse a read; only a missing row for the
  # resolved native state refuses.
  # The mapping and the transport policy are construction data: no settings type,
  # catalog branch, configuration key, or file format is added.
  # This phase closes GitHub's last two gaps (9 supported / 0 gaps), which
  # completes AC-F1-1 and turns the comment-provenance carrier roundtrip into a
  # `capability-absent` skip for GitHub (GitLab and Jira keep their declared-gap
  # skip — the gap-encounter gate stays non-vacuous, GAP-TP-5).
  #
