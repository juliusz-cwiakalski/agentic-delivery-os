# PLAN-LEVEL REFINEMENTS (recorded as this plan's design decisions; the spec
#   pins the contracts and the test plan pins the behaviours):
#   These refinements bind file homes, composition seams, and fixture homes.
#   Refinement 2 is the ONE declared oracle resolution in this plan and it is
#   the resolution test plan v1.2's TC-PARITY-003 itself states, so plan and
#   test plan agree instead of the plan claiming an unchanged oracle. No AC/NFR
#   mapping, case identity, exit code, cap, or bound is changed by any item
#   below.
#   1. MODULE HOMES (GAP-TP-4 makes production module naming delivery-bound;
#      these homes follow the delivered deploy-trace/`./git` precedents and are
#      declared so the commit primitive accepts the files):
#        packages/adapters/src/github/cli-transport.ts  — the second
#          ProviderTransport (`gh api` mapping), the local child-runner seam
#          with an `execFile` default, the argv and child-environment builders,
#          the `--include` status/body parser, the probe with its three closed
#          refusal codes, `GITHUB_TRANSPORT_MATRIX`, the adapter-local DM-10
#          `GithubTransportSelection` type, and the PURE, synchronous selection
#          resolver `resolveTransportSelection({ policy, probe })`;
#        packages/adapters/src/github/workflow-map.ts   — the four-row
#          precedence-ordered seed, the injected-map acceptance, the confined
#          validator (`validateGithubWorkflowMap`, TDR-0034 §1's seven-rule
#          rejection set, run once at construction on the resolved map and
#          captured rather than thrown), the writable-set derivation (`done` plus
#          each `label-swap` alias), and the one resolver used by read
#          normalization AND the mechanism-scoped transition write (label rows
#          only, including the terminal-read refusal);
#        packages/adapters/src/github/log-excerpt.ts    — the bounded excerpt
#          read, its closed shape, and the single fixed cap constant;
#        packages/adapters/src/github/thread-discussion.ts — the bounded
#          per-thread discussion read and its closed shape.
#      The native-fetch transport factory becomes an additive export so
#      composition can choose explicitly (TDR-0031 item 2). Contract evolution
#      here is ADDITIVE (spec v1.2 §8.5): `GithubClientOptions` gains exactly one
#      optional `workflowMap` member, every existing call site and option object
#      keeps compiling, and no member is removed, retyped, or made required.
#   2. WRITE-SIDE EXPECTED PROJECTIONS: the conformance write path gains an
#      OPTIONAL declared-projection comparison — a write step whose tenant
#      declares an `expected` entry returns a normalized value and is compared
#      exactly; a write step with no declared entry behaves exactly as today, so
#      the GitLab and Jira reports stay byte-identical (TC-FLOOR-003). The
#      `write-delivery-request` create/update pair is ONE registry step (the
#      closed set stays nine, the step pin moves 13 -> 14 only for the landing
#      step): the registry step's dispatch member is the create variant, and the
#      update path is proven over the same tenant routes by TC-BACKLOG-002 plus a
#      direct client call in the conformance suite (the TC-CONF-008 pattern).
#      This is the declared oracle change: TC-PARITY-003 v1.2 states it in those
#      words, so neither artifact denies it. No second `write-delivery-request`
#      step is added — a second step would contradict TDR-0032's "append a
#      `merge-delivery-request` step" and buy no coverage.
#   3. STATEFUL REPLAY FOR READ-BACK CASES: the mock-tenant transport is
#      stateless and body-keyed (packages/testkit/src/conformance/mock-tenant.ts,
#      unchanged). Read-after-write cases (TC-LAND-004/005, TC-BACKLOG-004/010)
#      therefore use one stateful scripted transport helper added to
#      tests/behaviour/providers/support.ts in PHASE 1 — the phase that owns the
#      first case needing it — and reused by phase 3; the tenant tier is never
#      asked to become stateful. The same helper supplies the current-read
#      precondition the terminal-read refusal needs (the issue's native state and
#      labels before the write), so the refusal is asserted against a real read
#      result rather than a hand-built view.
#   4. REFERENCE-BEHAVIOR DELIVERY (mission constraint): the normative
#      reference-behavior surface is authored in plan phase 6 together with the
#      doc-to-declaration drift test, because AC-F7-1..5 bind at DoD and the
#      surface is the contract the other adapters are parity-tested against.
#      Spec Appendix A lists it among phase-7 documentation impacts; lifecycle
#      phase 7 (@doc-syncer) then reconciles the four surrounding feature specs
#      and the indexes, which this plan declares in phase 7 for STAGING ONLY.
#   5. POLICY SURFACE: `prefer-cli`/`api-only` and the injected child runner are
#      additive `ProductionCompositionFacts` construction data in
#      packages/cli/src/production.ts. No configuration key, environment
#      variable, flag, settings type, catalog branch, or file format is added
#      (NG-2, AC-F6-6); an injected `githubTransport` keeps bypassing the probe
#      so every delivered composition test stays probe-free (zero spawns).
#   6. EVIDENCE REDACTION HOME: the single rendering chokepoint is
#      `redact()` in packages/cli/src/output/serialize.ts. No excerpt or body is
#      redacted at read time (the excerpt must stay a faithful byte prefix), and
#      no production module changes there; the privacy cases prove the
#      chokepoint transforms the rendered text. No delivered command renders an
#      excerpt or a body, so the obligation is a forward-looking invariant proven
#      at that one chokepoint with its paired positive (N8).
#
#   7. PROBE PLACEMENT AND SELECTION DELIVERY (the one bound mechanism; the
#      composer never probes, and only the composition path probes at all).
#      `EntrypointComposer` is synchronous (packages/cli/src/entrypoint.ts), so
#      the Promise-based probe cannot run inside it; and `runEntrypoint` returns
#      BEFORE it calls `composeProgram` for every self-description invocation
#      (root `--version`, `--print-install-path`, root `--help`, and command
#      `--help`). An await placed in the launcher body would therefore probe once
#      per launcher invocation, including invocations that never compose — a
#      violation of Table C's "at composition time only". The binding is:
#        a. `packages/adapters/src/github/cli-transport.ts` exports
#           `probeGithubCli(...)` (one bounded `gh --version`, DM-7 result), the
#           transport factory, and the PURE, SYNCHRONOUS resolver
#           `resolveTransportSelection({ policy, probe })` returning the DM-10
#           value `{ policy, selected, degradation? }` plus the transport
#           choice. `GithubTransportSelection` is an adapter-local type exported
#           additively from `./github` — never a core contract type (the only
#           core additions stay DM-1 and DM-2).
#        b. `packages/cli/src/production.ts` exports the ASYNC composition
#           resolver `resolveCompositionTransportSelection(facts)`: `api-only`
#           returns `{ policy: "api-only", selected: "api" }` with zero spawns;
#           `prefer-cli` awaits one probe through the injected runner and
#           returns `selected: "gh"` on success or `selected: "api"` with
#           `degradation.code` equal to the refusal code. The two resolvers have
#           DISTINCT names on purpose: `resolveTransportSelection` is the pure
#           adapter function, `resolveCompositionTransportSelection` is the async
#           launcher-edge function, and no import alias is ever needed.
#        c. `packages/cli/src/entrypoint.ts`'s composition call site accepts and
#           awaits a promised program, so a program may be composed
#           asynchronously at the ONE invocation boundary: `EntrypointComposer`'s
#           return widens additively to `CommandProgram | Promise<CommandProgram>`
#           (every delivered synchronous injector keeps compiling) and the call
#           site awaits it after every self-description return. This is the seam
#           that keeps the probe off the informational paths.
#        d. `packages/cli/src/bin-launcher.ts` passes ONE async wrapper as
#           `composeProgram`: it awaits
#           `resolveCompositionTransportSelection(facts)`, then invokes the
#           SYNCHRONOUS `createProductionComposer(...)` with the resolved value
#           forwarded as `ProductionCompositionFacts.githubTransportSelection`.
#           The wrapper runs only when the composition path invokes it, so the
#           four self-description paths record ZERO probe spawns and zero provider
#           requests; the single `createProductionComposer(` call site stays the
#           launcher's, and the launcher gains no ambient read, no export, and no
#           string literal. The assertion that pins this budget is TC-CLI-010 in
#           tests/behaviour/providers/github-cli-transport.test.ts (phase-2
#           scope): one probe spawn for a composing invocation, zero for each
#           self-description path.
#        e. `createProductionComposer` stays synchronous and keeps its delivered
#           signature. A present selection picks the transport (CLI transport
#           built with the injected runner, or the exported native-fetch
#           factory); an ABSENT selection is the third, explicitly named state
#           (spec v1.2 F-2/Table C/DM-10/§8.5): no probe runs, no DM-10 value
#           exists, and the delivered native-`fetch` transport serves. The
#           production launcher ALWAYS supplies the fact (pinned by the single
#           `createProductionComposer(` call site), so the absent state exists for
#           composition tests and hypothetical embedders only, and every delivered
#           composition test stays probe-free with zero spawns.
#        f. DM-10's observable surface is exactly (spec v1.2 F-2, Table C,
#           AC-F2-2, §10): the value the composition resolver returns and the
#           launcher consumes, PLUS exactly one rendered human diagnostic line
#           naming the refusal code, ZERO persisted copies, and NO new readable
#           surface on the composed program object. The value is never a field on
#           `GithubClient`, `GithubClientOptions`, the composed program object, a
#           normalized view, a state/telemetry record, or the conformance
#           artifact; the line is pushed once into the composer's existing
#           `compositionNotices` list (the delivered warnings channel that reaches
#           the serializer), exactly once per composed program.
#   8. CHILD ENVIRONMENT FROM INJECTED DATA (N9). The child environment is
#      constructed entirely from injected records: the base record is the
#      composition's injected `environment` (which supplies `PATH` — the CLI is
#      never resolved through an ambient read, and no `process.env` access is
#      added to `packages/**` outside the delivered allowlist), the credential
#      value is the resolved credential material the client already put on the
#      request's `Authorization` header (resolved through the credential port,
#      never a second source), and the transport adds the isolated
#      `GH_CONFIG_DIR`, `GH_PROMPT_DISABLED`, `NO_COLOR`, and the update-notifier
#      suppressor. No secret enters argv, and no absolute binary path is
#      injected (the `PATH`-based resolution is the bound option; a future
#      absolute-path injection would be its own change).
#   9. WORKFLOW-MAP VALIDATION AND THE TRANSITION REFUSALS (TDR-0034 §1 and
#      §3.2, restated normatively in spec v1.2 DM-6/§8.4.1/AC-F6-3/AC-F6-4). The
#      AUTHORITY is TDR-0034 §1 — never a test case's fixture list; the plan and
#      the cases follow the record. The confined validator runs exactly once per
#      client construction on the RESOLVED map (the injected map when supplied,
#      otherwise the seed), before the first operation, never lazily and never per
#      request; a failure is captured rather than thrown, and every subsequent
#      operation returns the existing `provider.payload.invalid` refusal whose
#      detail names the failed check and the offending row, with zero provider
#      requests, no new error-table row, and no new configuration code. The seed
#      is held to exactly the same checks as an injected map. Transition writes
#      resolve against the issue's CURRENT READ and carry three distinct refusals,
#      each with zero provider requests: (1) an undeclared alias; (2) a declared
#      non-terminal `field-update` alias; (3) a `label-swap` alias on an issue
#      whose current read resolves to `done` — terminal precedence would hide the
#      added token regardless of the issue's labels, so the write is refused
#      instead of attempted. Refusal (3) is distinct from the
#      unavailable-label-signal refusal (an unobserved label container); a
#      labelless fixture therefore exercises the signal refusal only when its
#      native state is `open`, because a labelless `closed` issue resolves to
#      `done` and refuses for the terminal reason.
#
# DoD MAPPING (spec §17 ACs -> this plan's owning phases) is exactly the AC
#   ownership block. The change-level Definition of Done is: all 40 ACs met with
#   the named TC evidence; all seven plan phases complete with per-phase pm-notes
#   `notes:` evidence (phase id, commit hash, gate result);
#   `TMPDIR=$PWD/tmp/tmpdir pnpm check` green at the delivered HEAD;
#   `plan validate GH-338` valid at the delivered HEAD; the four decision
#   records tracked and the ADR-0005 editorial pointer already committed
#   (`f2c2ad27`) and clean; the pinned structural surfaces (including the exact
#   child-process site set) exact and non-vacuous; PR against main-tools left open
#   for human review (lifecycle phase 11).
#
# CONSTRAINTS BINDING ON EVERY PHASE (spec §24.3, §21; do not reshape at
#   delivery):
#   - Additive within v1 (DEC-5): no contract field removed, retyped, or made
#     required; no persisted-state schema, record kind, or migration; no
#     schemaVersion bump.
#   - Non-decisions (Appendix C): the lifecycle merge transaction
#     (packages/core/src/domain/merge-transaction.ts) and the CLI merge
#     composition are NOT rewired; `DeliveryThread`/`DeliveryRequest` keep their
#     field sets; no configuration schema/key/settings type/catalog branch; no
#     thread pagination, log archive, tail-follow, or caller-tunable evidence
#     bound; no force/bypass/auto-merge/queue/rebase/merge-commit strategy is
#     representable; no new telemetry/event/state record and no transport-in-use
#     declaration beyond the one composition-scoped `GithubTransportSelection`
#     value and its single line; the review-feedback flow is not migrated; Jira's
#     workflow map stays a module constant; GitLab/Jira gain ONLY the new
#     operation's gap. A `field-update` transition never touches labels (no label
#     read, no label write, no label-signal refusal), so the delivered closeout
#     `done` write keeps its single state-only `PATCH`; the `write-delivery-request`
#     create never lands and never sets merge state.
#   - Offline determinism (NFR-2): zero live network calls and zero live child
#     processes in the mock tier; every new behavior proven through committed
#     sanitized fixtures ("provenance": "hand-authored-synthetic 2026-11-17"),
#     no `test.skip`, no environment-gated pass (test plan §3.4 no-skip rule).
#   - Secret hygiene (NFR-3): credential material arrives as child-environment
#     data built from injected records (the injected `environment` base record,
#     including `PATH`, plus the resolved credential value the client already
#     placed on the request's `Authorization` header) and never in argv, stdout,
#     stderr, diagnostics, or failure detail; no ambient `process.env` read is
#     added anywhere under packages/**; the isolated configuration directory and
#     prompt suppression are set on every invocation; the secret-read allowlist
#     count stays unchanged with exactly one credential-material entry; stderr
#     prose never becomes a failure detail.
#   - Destructive-action safety (NFR-5): landing is at most once per invocation,
#     never retried, never re-issued on the other transport; already-merged is
#     success only after a read-back that observes provider-asserted merged
#     truth.
#   - Evidence discipline (NFR-6): excerpt <= 8192 bytes, <= 50 comments per
#     thread, <= 4096 bytes per body, zero evidence bytes in persisted state and
#     in the conformance artifact, bodies carry no write authority.
#   - Pinned surfaces are updated exactly and never relaxed: provider subpath
#     export lists, per-file executable allowances, the source inventory, the
#     port-contract inventory, the conformance flow/step pins, the trap-catalog
#     EXPECTED_TRAPS lists, and the exact `node:child_process` site set
#     (tests/structure/harness-imports.test.ts). A wildcard, prefix allowance, or
#     deleted assertion is a blocking review finding (RSK-TP-7/RSK-TP-8).
#   - Layering (.ai/rules/typescript.md, ADR-0003/ADR-0005): contracts and pure
#     domain stay runtime-neutral; adapters own I/O; the new child invocation
#     lives only in packages/adapters/src/github/ under the EXACT existing
#     runtime-API confinement allowance (reason-bearing comment updated, no
#     wildcard, no new allowlist entry); provider-native types never cross a
#     subpath; adapters never import each other.
#
# GATE ENVIRONMENT (binding on every phase boundary and the final battery):
#   - Every command runs from the repository root with
#     TMPDIR=$PWD/tmp/tmpdir (repo-local, git-ignored; never /tmp or $HOME).
#   - G1 TMPDIR=$PWD/tmp/tmpdir bun test tests/structure
#   - G2 TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/providers
#   - G3 TMPDIR=$PWD/tmp/tmpdir bun test tests/conformance
#   - G4 TMPDIR=$PWD/tmp/tmpdir bun test tests/checks
#   - G5 TMPDIR=$PWD/tmp/tmpdir bun test tests/boundaries
#   - G6 TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
#   - G7 TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/secret-read-boundary.ts
#   - G8 TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/fixture-sanitization.test.ts tests/checks/fixture-privacy.test.ts
#   - G9 TMPDIR=$PWD/tmp/tmpdir git diff --check
#   - G10 TMPDIR=$PWD/tmp/tmpdir pnpm check   <-- the BINDING completion gate
#   G1..G9 are the narrow loop; G10 is never substituted by a narrow pass and
#   its result is recorded as a pm-notes `notes:` entry. Lifecycle commands
#   (commit, phase complete) run with PATH="$PWD/node_modules/.bin:$PATH" so the
#   commitlint probe resolves. The branch-range commit gate
#   (./scripts/lint-commit-range.sh --base main-tools) is run by @pm in
#   lifecycle phase 9 and is not re-implemented here.
#
# COMMIT CONVENTION (one commit per plan phase through the commit primitive;
#   conventional subjects <= 72 chars, every body/footer line <= 100 chars):
#   phase 1  feat(GH-338): ninth operation, capability posture and conformance parity
#   phase 2  feat(GH-338): CLI-first GitHub transport with probe and transport parity
#   phase 3  feat(GH-338): backlog writes and the injected GitHub workflow map
#   phase 4  feat(GH-338): check timings and the bounded log-excerpt read
#   phase 5  feat(GH-338): bounded review-thread discussion read
#   phase 6  docs(GH-338): adapter reference behavior and the drift check
#   phase 7  chore(GH-338): release obligations and the regression floor
#
# LIFECYCLE PHASE 7 HANDOFF OBLIGATIONS (system_spec_update, @doc-syncer;
#   declared here so nothing is dropped after DoD — NOT plan authoring beyond
#   phase 6's normative surface). The targets are NAMED, not discovered:
#   - feature-provider-client-seeds.md: the capability table (GitHub 9 supported
#     / 0 gaps), the operation list, the GitHub normalization section (timings,
#     landing, comments, DM-9 content writes, the workflow mapping with the
#     mechanism-scoped label rule and the four read outcomes, thread discussion),
#     the transport section (CLI-first, matrix, probe, no failover, DM-10 value
#     and its single line), the trap-catalog minima and QA table, and the export
#     list correction. THE FALSE SENTENCE TO FIX: line 169
#     "GitHub issue statuses | `open` -> `ready`, `closed` -> `done`" — the
#     mapping is now label-aware and mechanism-scoped; the delivered drift also
#     covers the pre-existing claim that the GitHub subpath exports five names.
#   - feature-adapter-ports.md: the closed set grows to nine, the `PipelineJob`
#     rows gain the two optional timestamps, the additive-extension record gains
#     the landing operation, and the confinement wording records the bounded
#     fixed-argv child invocation in the GitHub subpath (secret-read boundary
#     unchanged).
#   - feature-adapter-conformance.md: five NAMED sentences move —
#     (1) line 9 "one three-flow registry over the **eight** closed adapter
#         operations" and "zero live network calls" -> nine operations with the
#         landing step, and zero network calls AND zero child processes;
#     (2) line 33 "**Merge** and the deploy-trace read sit **outside** the
#         three-flow registry" -> merge now sits INSIDE it; the deploy-trace read
#         still does not;
#     (3) line 53 the executed write-member list (`writeWorkItem`,
#         `transitionWorkItem`, `resolveDeliveryThread`) -> the six-member list
#         (adding `writeComment`, `createDeliveryRequest`/`writeDeliveryRequest`,
#         `mergeDeliveryRequest`);
#     (4) line 57 "all **eight** operations represented" -> nine;
#     (5) lines 61/63 "installs a throwing-`fetch` guard" / "zero live network
#         calls" -> the child-process guard joins it and child processes are
#         zero;
#     plus the flow/step table, operation-set equality wording, mock routes and
#     projections, the carrier skip-kind change, and the coverage-gate wording.
#   - feature-merge-verify-deploy.md: the coexistence statement (a provider-side
#     landing capability now exists; the lifecycle merge path is deliberately
#     unchanged and not rewired).
#   - doc/00-index.md: index the new reference-behavior surface; confirm the
#     prompt-required command help/reference coverage is unaffected.
#   - doc/decisions/00-index.md: confirm the TDR-0031..TDR-0034 rows and the
#     ADR-0005 pointer state (Appendix A).
#
# INCONSISTENCIES: none blocking between spec v1.2, TDR-0034 (as amended) and
#   test plan v1.2. The earlier ambiguities are RESOLVED upstream, and this plan
#   binds the resolved readings rather than a private interpretation:
#   (a) TC-PARITY-003 v1.2 states the one-step resolution itself (one registry
#       step whose dispatch member is the create variant, both tenant routes, the
#       update proven by TC-BACKLOG-002 plus a direct client call) and declares
#       that this IS the oracle change. The plan matches it (refinement 2) and no
#       longer claims an unchanged oracle.
#   (b) TC-POSTURE-001 v1.2 asserts SET equality both directions (supported
#       union gaps equals the closed set, the two lists disjoint, no extras, no
#       omissions) and states that declaration order is NOT part of the contract.
#       The plan therefore keeps the delivered declaration order and APPENDS in
#       phases 1 and 3; no reorder and no order assertion exists anywhere.
#   (c) The probe's "composition time only" bound is literal here (refinement 7,
#       phase 2): the entrypoint returns before `composeProgram` on every
#       self-description path, the selection await sits on the composition path,
#       and TC-CLI-010 pins the launcher's spawn budget (one probe for a composing
#       invocation, zero for `--version`/`--help`/`--print-install-path`/command
#       help). No phase claims "one probe per launcher invocation".
#   (d) The map validator's rejection set and timing are TDR-0034 §1's, restated
#       by spec v1.2 DM-6/AC-F6-3; the plan and TC-BACKLOG-010 follow the record.
#       The `done`-row rule and the `done`-row-shape rule are contract, not
#       fixture taste.
#   (e) The two selection resolvers have distinct names (adapter
#       `resolveTransportSelection`, pure and synchronous; launcher edge
#       `resolveCompositionTransportSelection`, async), and the ADR-0005 pointer
#       is already committed (`f2c2ad27`) and clean, so phase 1 declares four
#       decision-record paths only.

