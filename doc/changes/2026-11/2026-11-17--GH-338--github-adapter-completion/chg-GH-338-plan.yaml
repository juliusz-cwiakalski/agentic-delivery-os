# ONE-PHASE COUPLING (the load-bearing plan decision; do not split at delivery):
#   The ninth closed operation cannot be introduced in a smaller commit than
#   this: `ADAPTER_OPERATIONS` (packages/core/src/contracts/adapter-capabilities.ts)
#   + the landing argument/outcome types and the two optional PipelineJob
#   timestamps (packages/core/src/contracts/ports.ts) + the three adapter
#   capability declarations (GitHub supported; GitLab `adapter-not-implemented`;
#   Jira `provider-unsupported`) + the conformance flow registry
#   (packages/testkit/src/conformance/flows.ts) + the runner's
#   operation-to-client-member dispatch + the mock-tenant route and expected
#   projection + the structural and runtime coverage gates + the port-contract
#   inventory fixture MUST move together. `tests/structure/conformance-coverage.test.ts`
#   requires the registry operation set to equal the closed set exactly, and
#   `runtimeCoverageViolations` (packages/testkit/src/conformance/coverage.ts,
#   exercised by tests/conformance/mock-conformance.test.ts) requires every
#   supported operation of every shipped adapter to EXECUTE in the mock tier.
#   A phase that declared the operation without an executing landing path would
#   ship exactly the failure the test plan forbids: a capability declaration
#   that says supported while the operation is inert.
#
#   Consequence — the capability posture moves in TWO declared steps, not one:
#     after phase 1: GitHub 7 supported + 2 declared gaps
#                    (write-comment, write-delivery-request) = the closed set;
#                    GitLab/Jira gain only the new operation's gap.
#     after phase 3: GitHub 9 supported + 0 gaps (AC-F1-1 completes),
#                    the carrier roundtrip degrades from `declared-gap` to
#                    `capability-absent` (AC-F8-2), and the runtime coverage
#                    gate stays non-vacuous because GitLab and Jira still carry
#                    the declared gaps (GAP-TP-5).
#   tests/fixtures/ports/capabilities.ts (EXPECTED_SEED_POSTURES) therefore
#   moves in both phases, and TC-POSTURE-001 (9 supported / 0 gaps) is owned by
#   phase 3 while TC-POSTURE-002/003 are owned by phase 1.
#
# PHASE ORDER AND TESTABILITY (spec §18 sequencing, made concrete):
#   One commit per plan phase on feat/GH-338/github-adapter-completion through
#   the commit primitive; every phase's declared narrow gate and
#   `TMPDIR=$PWD/tmp/tmpdir pnpm check` are green at its boundary, and each
#   phase's cases are authored failing-first inside that phase. Ordering is
#   forced by: (1) the coupling above; (2) the CLI transport must exist before
#   any golden-argv or cross-transport-parity case can exist, and it must not
#   exist before the child-process guard that proves it never spawns; (3) the
#   backlog writes need the workflow map to be one map for both directions
#   before a read/write symmetry case is meaningful; (4) evidence reads need
#   the normalization their assertions read through; (5) the thread discussion
#   read is the last subpath export, so it completes the pinned-surface
#   obligation (AC-F8-6); (6) the reference-behavior document must follow the
#   declarations it must agree with, and precede the DoD (not lifecycle phase 7
#   discovery); (7) the release phase rolls up the regression floor, determinism
#   and trap-completeness proofs and the aggregate gate.
