      GITHUB_TRANSPORT_MATRIX over all nine operations; the pure
      `resolveTransportSelection`; the async
      `resolveCompositionTransportSelection` at the launcher edge; the
      entrypoint's promised-program await inside the containment try; the
      launcher's one async wrapper; the child-process guard beside the
      throwing-`fetch` guard; the parity route table over the seven members that
      exist now). Commits: 787a2643c4aaca14826219245ce896f1df46a81c (the phase
      itself) plus one remediation commit recorded in the phase-3 note. The
      aggregate gate first failed on a self-inflicted scope violation: a blanket
      `biome check --write packages tests` rewrote 269 delivered files
      (formatting-only, and one rewrite of `new RegExp` to a regex literal that
      the repository's `noControlCharactersInRegex` lint rule rejects), and the
      phase-2 commit therefore contained them. The remediation commit reverts
      exactly those 269 files to their delivered content and leaves the 25
      intended files; the net phase-1+phase-2 diff is 25 files. Two further
      delivered pins moved in the remediation because the change makes them
      false: tests/checks/prior-identity-hermetic.test.ts (production.ts now
      holds zero `fetch` sites and references the adapter's exported
      `createGithubNativeTransport`) and the release guard's publishable-path
      rule (the lockstep five-package minor changeset is added here rather than
      in plan phase 7 — the GH-299 precedent — so phase 7 verifies it instead of
      authoring it). Delivery notes carried: N1 (implemented the plan's names;
      the test plan's `resolveGithubTransportSelection` is a stale reference),
      N2 (the firing-canary assertion lives in
      tests/conformance/github-transport-parity.test.ts and the per-suite
      zero-spawn counter in mock-conformance.test.ts), N4 (the full spawn
      budget: one probe for a composing invocation, zero for the four
      self-description paths, zero provider requests), N10 (the
      one-process-per-request count is driven on an already-selected transport).
      Verification: pnpm typecheck green; bun test tests/structure
      tests/behaviour/providers tests/conformance tests/boundaries plus the
      secret-read, fixture-sanitization and fixture-privacy suites green (2138
      pass, 0 fail); bun run scripts/checks/secret-read-boundary.ts OK with 5
      allowlisted entries (unchanged, exactly one credential-material); git diff
      --check clean; the aggregate gate result is recorded in the phase-3 note.
      Guard note: the child-process guard necessarily substitutes the
      `node:child_process` builtin through bun's module mock; its restore
