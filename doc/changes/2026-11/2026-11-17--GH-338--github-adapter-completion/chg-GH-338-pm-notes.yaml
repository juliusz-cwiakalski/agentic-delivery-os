  - text: "Plan phase 3 complete (GitHub 9 supported / 0 declared gaps; the
      carrier-free comment write and the DM-9 content write; the injected,
      seeded workflow map driving read normalization and mapped transitions).
      The load-bearing design resolution: the current-read precondition is
      adapter-local INPUT data on the widened GithubClient.transitionWorkItem
      input (`current: { deliveryState, labels? }`), so every refusal issues
      zero provider requests while the write still resolves against a real read.
      A label-swap write refuses on a done-resolving current read regardless of
      labels, on an unavailable label signal, and when no current read is
      supplied, each with a distinct detail; a declared non-terminal
      field-update alias, an undeclared alias, and a non-GitHub mechanism are
      named refusals with zero requests. A field-update row writes provider
      state only and admits only the terminal done row, so the delivered
      closeout write stays one PATCH with body exactly {\"state\":\"closed\"}
      and zero label requests. The map validator implements TDR-0035 §1's seven
      rules, runs exactly once at construction on the resolved map (pinned by a
      source scan), captures its failure rather than throwing, and every
      operation then refuses with zero provider requests; the seed is held to
      the same checks. Read resolution is the declared four outcomes plus the
      label-swap case-collision refusal; CLOSED on a closed issue stays native
      terminal truth. The seed is exported additively for the phase-6 document
      drift check. Verification: G1 structure 1611 pass; G2 behaviour/providers
      234 pass; G3 conformance 176 pass; G4 checks 1175 pass; G5 boundaries 152
      pass; G6 typecheck green; G7 secret-read boundary OK (5 allowlisted,
