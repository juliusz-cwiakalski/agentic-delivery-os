notes:
  - text: "DoR gate iteration 1 = NOT_READY (readiness-review/readiness-iter-1.md),
      no pause flag, 7 blocking findings + 10 minors, all author-side. Reopened
      delivery_planning, test_planning and specification. Blockers: F1
      write-delivery-request create has no defined argument shape
      (specification); F2 the probe cannot run where the plan puts it because
      the entrypoint composer is synchronous while the probe is Promise-based,
      and bin-launcher is out of phase-2 scope (delivery_planning); F3
      tests/structure/harness-imports.test.ts pins the exact node:child_process
      site set over packages/** and is not in phase-2 scope, so the new
      transport would fail phase 2's own gate (delivery_planning); F4 the
      closed->done field-update transition's label-removal/refusal rule
      contradicts itself between AC-F6-4 (label-based only) and TDR-0034 section
      3 (every transition), which would silently widen the delivered closeout
      terminal write (specification + TDR-0034); F5 unmapped/case-mismatched
      label tokens fall back to native state in TDR-0034 but Appendix D and
      TC-BACKLOG-008 require a visible refusal (specification + TDR-0034); F6
      AC-F2-2's declared degradation has no name, shape or observable surface
      (specification); F7 phase 1 owns TC-LAND-004/005 read-back while the
      stateful helper lives in a file declared only in phases 2 and 3
      (delivery_planning). Adjudications: deviation 1 accepted in substance but
      the TC wording and the plan's no-oracle-change claim must be corrected;
      deviation 2 - the set reading of AC-F1-1 is preferred over the plan's
      ordered reading; deviation 3 REJECTED as written; deviation 4 approved
      (reference behavior authored in delivery phase 6, indexed in phase 7);
      deviation 5 approved."
    type: info
    date: "2026-11-17"
  - text: "Delivery planning complete: chg-GH-338-plan.yaml validates (tier=full,
      readyForDevelopment=true) with 7 delivery phases; 81/81 TCs and 40/40 ACs
      placed on exactly one owning phase. Plan-reported upstream refinements for
      the DoR gate to adjudicate: (1) TC-PARITY-003 speaks of create+update
      steps while the registry carries one write-delivery-request step and the
      change adds three dispatch members (writeComment, createDeliveryRequest,
      mergeDeliveryRequest) — plan proves update through the behaviour suite and
      a direct client call; (2) the delivered GitHub supportedOperations order
      is not closed-set order, so the plan binds the strong reading and moves
      the provider-surface pin twice (P1, P3); (3) AC-F2-2's 'declared
      degradation recorded' has no declared home in a no-new-record constraint,
      so the plan binds it as composition data on the composed runtime, never
      persisted; (4) the reference-behavior surface is authored in delivery plan
      phase 6 rather than discovered in lifecycle phase 7 (AC-F7-* must bind at
      DoD); (5) the reference-behavior document path is bound to
      doc/spec/features/feature-adapter-reference-behavior.md with a single
      locator fixture."
    type: info
    date: "2026-11-17"
  - text: "Commit-boundary fact discovered at delivery_planning: the phase command
      stages the declared plan-phase scope only when the lifecycle phase id
      matches a plan phase id (it does not for the lifecycle-only phases), so
      the four TDRs remain untracked after delivery_planning. They are declared
      in delivery plan phase 1 scope and therefore land with the first delivery
      phase commit — not with the planning commits."
    type: info
    date: "2026-11-17"
  - text: "Specification complete: chg-GH-338-spec.md authored with 8 functional
      capabilities (F-1..F-8), AC-F1-1..AC-F8-6, no open questions, and the
      reference-behavior surface (F-7) that satisfies the ticket's second AC.
      Four decision records carry the settled choices (DEC-1..DEC-4 =
      TDR-0031..0034). They remain untracked in the worktree by design: the
      commit primitive stages only plan-declared scope, so the four TDRs and
      doc/decisions/00-index.md must be declared in the delivery plan's phase
      scope paths and will land on `phase complete delivery_planning`."
    type: info
    date: "2026-11-17"
  - text: "clarify_scope cross-check complete against
      doc/spec/features/feature-adapter-ports.md,
      feature-provider-client-seeds.md, feature-adapter-conformance.md, and the
      M3 blueprint. Ticket requirements are complete and consistent with the
      current spec; no blocking questions. State at intake: branch
      feat/GH-338/github-adapter-completion sits exactly on origin/main-tools
      (1250d789), zero commits, no PR; issue #338 OPEN with label `change` and
      milestone `M3: Harness and tracker integrations` (#6)."
    type: info
    date: "2026-11-17"
  - text: "Current-state facts the spec must reconcile: (a)
      packages/adapters/src/github is API-only over the injected fetch-shaped
      ProviderTransport — no `gh` CLI seam exists anywhere in packages/ (the
      only production child-process sites are adapters ./host for harness spawn,
      ./git for the local git seam, and ./daemon/supervisor.ts); (b)
      GITHUB_ADAPTER_CONTRACT declares `write-comment` and
      `write-delivery-request` as adapter-not-implemented gaps, so the
      conformance suite records both as declared-gap skips today; (c)
      review-thread reads already exist over GraphQL (root author
      login/kind/association, 100-thread bound, resolution mutation delivered),
      but per-thread comment bodies/replies and pagination are absent; (d)
      PipelineJob carries only jobName + jobState — no timing and no log
      surface, so 'failure job/log/timing access' needs an additive extension or
      an adapter-local bounded read (the createGitHubDeployTraceReader
      precedent); (e) the merge transaction
      (packages/core/src/domain/merge-transaction.ts) lands a squash commit
      through the local git seam, not through a provider API, so provider-side
      squash merge is genuinely new surface."
    type: info
    date: "2026-11-17"
  - text: "Known doc-impact risks for phase 7: feature-provider-client-seeds.md
      (capability table, operation list, trap catalog minima, QA table),
      feature-adapter-ports.md (closed operation set / additive extension /
      confinement + secret-read boundary entries for a CLI seam),
      feature-adapter-conformance.md (registry coverage and mock tenant routes
      once write-comment and write-delivery-request become supported), a new
      reference-behavior document for the adapter contract, plus
      index/help-guide and decision records."
    type: risk
    date: "2026-11-17"
