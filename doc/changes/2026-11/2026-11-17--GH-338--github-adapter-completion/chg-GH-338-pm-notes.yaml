      commit primitive stages only plan-declared scope, so the four TDRs and
      doc/decisions/00-index.md must be declared in the delivery plan's phase
      scope paths and will land on `phase complete delivery_planning`."
    type: info
    date: "2026-11-17"
  - text: "clarify_scope cross-check complete against
      doc/spec/features/feature-adapter-ports.md,
      feature-provider-client-seeds.md, feature-adapter-conformance.md, and the
      M3 blueprint. Ticket requirements are complete and consistent with the
      current spec; no blocking questions. State at intake: branch
      feat/GH-338/github-adapter-completion sits exactly on origin/main-tools
      (1250d789), zero commits, no PR; issue #338 OPEN with label `change` and
      milestone `M3: Harness and tracker integrations` (#6)."
    type: info
    date: "2026-11-17"
  - text: "Current-state facts the spec must reconcile: (a)
      packages/adapters/src/github is API-only over the injected fetch-shaped
      ProviderTransport — no `gh` CLI seam exists anywhere in packages/ (the
      only production child-process sites are adapters ./host for harness spawn,
      ./git for the local git seam, and ./daemon/supervisor.ts); (b)
      GITHUB_ADAPTER_CONTRACT declares `write-comment` and
      `write-delivery-request` as adapter-not-implemented gaps, so the
      conformance suite records both as declared-gap skips today; (c)
      review-thread reads already exist over GraphQL (root author
      login/kind/association, 100-thread bound, resolution mutation delivered),
      but per-thread comment bodies/replies and pagination are absent; (d)
      PipelineJob carries only jobName + jobState — no timing and no log
      surface, so 'failure job/log/timing access' needs an additive extension or
      an adapter-local bounded read (the createGitHubDeployTraceReader
      precedent); (e) the merge transaction
      (packages/core/src/domain/merge-transaction.ts) lands a squash commit
      through the local git seam, not through a provider API, so provider-side
      squash merge is genuinely new surface."
    type: info
    date: "2026-11-17"
  - text: "Known doc-impact risks for phase 7: feature-provider-client-seeds.md
      (capability table, operation list, trap catalog minima, QA table),
      feature-adapter-ports.md (closed operation set / additive extension /
      confinement + secret-read boundary entries for a CLI seam),
      feature-adapter-conformance.md (registry coverage and mock tenant routes
      once write-comment and write-delivery-request become supported), a new
      reference-behavior document for the adapter contract, plus
      index/help-guide and decision records."
    type: risk
    date: "2026-11-17"
  - text: "Delivery conventions from the ticket: full 11-phase lifecycle; plan
      phases declared in plan.yaml; commits through the commit primitive with
      conventional subjects; every gate command recorded in pm-notes uses
      TMPDIR=$PWD/tmp/tmpdir; PR targets main-tools and stays open (merge
      authority is the CEO/human, never this session)."
    type: info
    date: "2026-11-17"
