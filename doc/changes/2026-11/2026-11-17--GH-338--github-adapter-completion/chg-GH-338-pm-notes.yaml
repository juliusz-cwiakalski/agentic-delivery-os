decisions:
  - text: "Scope is taken from the ticket body plus the committed M3 blueprint
      (doc/planning/oss-tooling/milestones/m3/): full primitive coverage for the
      GitHub adapter as the reference implementation for BOTH code hosting and
      backlog management — PRs with threaded discussions and resolution, checks
      with failure job/log/timing access, squash merge with crafted
      title/description and squash commit message, and GitHub Issues backlog
      primitives (read/update, comments, transitions), delivered CLI-first over
      `gh` with direct API fallback (M3 EC-3), with the reference behavior
      documented in the adapter contract."
    date: "2026-11-17"
  - text: "M3 delivery questions ticket #342 carries no answers; the stated defaults
      apply for the phases that reach them. Applied defaults: Q-03 credential
      name `GITHUB_TOKEN`; Q-04 GitHub Issues lifecycle mapping is
      project-configurable and seeded with this repository's label conventions;
      Q-07 pipeline analytics depth is status + failed job/task name + bounded
      log excerpt + durations, with full log archives out of scope."
    date: "2026-11-17"
  - text: "A provider-side squash merge is named by the ticket but has no
      destination in the current closed operation set (ADAPTER_OPERATIONS has
      eight operations; `write-delivery-request` is a declared gap today).
      Whether merge becomes a new closed operation or another shape is a
      contract decision owned by @decision-advisor under the
      additive-v1/decision-record rule; the spec must record the chosen option
      before delivery planning."
    date: "2026-11-17"
  - text: "Resolved by @decision-advisor before specification: TDR-0032 (CLI-first
      transport as one ProviderTransport over `gh api`, probe-gated, no
      per-request failover, isolated child env, declared preferred/fallback
      matrix); TDR-0033 (ninth closed operation `merge-delivery-request`;
      additive optional PipelineJob startedAt/completedAt with durationMs
      deferred; bounded 8192-byte adapter-local log excerpt; merge transaction
      deliberately not rewired); TDR-0034 (thread discussion bodies as a bounded
      adapter-local read: 50 comments per thread, 4096 bytes per body,
      DeliveryThread unchanged); TDR-0035 (GitHub Issues transitions via an
      injected, seeded core WorkflowMap; no new configuration schema). All four
      are status Proposed on the branch and are accepted by the human at PR
      review."
    date: "2026-11-17"
