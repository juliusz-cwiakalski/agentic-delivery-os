notes:
  - text: "Specification complete: chg-GH-338-spec.md authored with 8 functional
      capabilities (F-1..F-8), AC-F1-1..AC-F8-6, no open questions, and the
      reference-behavior surface (F-7) that satisfies the ticket's second AC.
      Four decision records carry the settled choices (DEC-1..DEC-4 =
