  - text: "Review iteration 1 = FAIL (review/review-iter-1.md). One blocker and two
      majors, all real: B-1 the CLI transport passes the REST host to `gh api
      --hostname`, so gh builds https://api.api.github.com and every production
      provider request fails while the suite stays green (the golden argv
      fixture pins the wrong host and GAP-TP-3 has no live-binary smoke) —
      remediation must derive the gh hostname from the instance, repin the argv,
      and add an offline stub-gh shim smoke through the real execFileRunner; M-1
      the child environment drops HOME/XDG_* and GH_CONFIG_DIR falls back to a
      relative path, so gh writes ./.local/state/gh/device-id into the caller's
      CWD (residue present in this repo, untracked and not gitignored),
      contradicting the nothing-is-persisted claim TC-CLI-003 pins; M-2 the
      launcher probes on every composing invocation so the check tier spawns a
      real gh, making the test plan's no-live-gh claim false and the check tier
      host-dependent (unrecorded). Minors: DM-9/F-6 declare a write-side 404
      that nothing implements; AC-F6-4's no-full-array-replace wording versus
      the whole-array PATCH; unattributed commits; two DoR notes only partially
      carried; the changeset authored in phase 2 while declared in phase 7.
      Reviewer confirmed: child-process guard non-vacuous, done transition
      byte-identical to pre-change, all six moved pins forced or disclosed,
      TC-DAEMON-121 a pre-existing environment flake, 10 of 12 DoR notes
      honoured."
    type: info
    date: "2026-11-18"
  - text: "RETRO (review iteration 1): the DoR gate passed a design whose central
      claim — CLI-first transport — had no test that exercised the real binary
      boundary. Every fixture mocked the child runner, so a wrong `--hostname`
      semantic survived three readiness iterations, two delivery phases and a
      green pnpm check. Two process fixes for future M3 stories: any adapter
      that shells out needs one offline shim-level smoke (a stub executable on
      PATH) before the DoR gate, and the review gate's first question on a
      transport change should be what the argv means to the vendor binary rather
      than whether the fixture matches the implementation. Also: the blanket
      biome --write incident in phase 2 cost a 269-file revert; the
      no-repo-wide- format rule needs to be stated at delivery start, not at
      phase 2."
    type: retro
    date: "2026-11-18"
