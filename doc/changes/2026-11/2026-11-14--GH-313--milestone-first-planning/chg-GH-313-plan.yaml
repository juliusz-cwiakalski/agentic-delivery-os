        - scripts/checks/milestone-attachment-runner.ts
        - scripts/checks/milestone-attachment-github.ts
        - .github/workflows/ticket-milestone-check.yml
        - tests/checks/milestone-attachment.test.ts
        - tests/checks/milestone-attachment-integration.test.ts
        - tests/checks/milestone-sweep.test.ts
        - tests/checks/milestone-workflow.test.ts
        - tests/checks/milestone-gate.test.ts
