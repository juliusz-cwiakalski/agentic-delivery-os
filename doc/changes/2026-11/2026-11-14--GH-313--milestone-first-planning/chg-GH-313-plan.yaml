  # ---------------------------------------------------------------------------
  # Phase 4 — Milestone-attachment evaluation core, workflow, and suites.
  # Commit: feat(GH-313): milestone-attachment check with advisory sweep.
  #
  # Obligations:
  #  4.1 scripts/checks/milestone-attachment.ts — pure, offline evaluation
  #      core over contract v1 input {action, issue state, `change` label,
  #      exemption label, milestone, flag label, markerCommentPresent (a
  #      stable marker comment already present)} to exactly one verdict
  #      (compliant | exempt | flagged | restored | out-of-scope) and the closed
  #      write vocabulary addFlag, removeFlag, postMarkerComment,
  #      writeJobSummary. Ordered precedence: exemption > milestone >
  #      flag/event. The flag is reachable only on `opened` or
  #      `demilestoned`-with-marker; repeated edited/labeled evaluations on an
  #      unflagged issue open no tracker write path. Static comment body
  #      constant and run-summary projection; zero issue-authored
  #      interpolation. No network import, no clock, no I/O.
  #  4.2 scripts/checks/milestone-attachment-runner.ts — port-injected
  #      orchestration with the tracker ports (readIssue, listComments,
  #      listMilestones, listIssues, addLabel, removeLabel, createComment)
  #      plus a job-summary sink writeJobSummary; sweep still performs zero
  #      tracker writes and writes only the pinned local artifact
  #      tmp/milestone-attachment-sweep.json (gitignored via the repository's
  #      tmp/ rule), reads paged at 100 with <= ceil(N/100)+3 tracker reads,
  #      exits 0 regardless of findings, and fails loud on API error.
  #  4.3 scripts/checks/milestone-attachment-github.ts — the sole
  #      network-capable GitHub adapter module: issue reads plus label and
  #      comment writes, read-only in sweep mode, used by the workflow and by
  #      the local sweep. It MUST NOT be imported by any module reachable from
  #      `pnpm check`, and it MUST NOT be added to the install set or
  #      ADOS_DELIVERY_SCRIPTS.
  #  4.4 .github/workflows/ticket-milestone-check.yml — issue events opened,
  #      edited, labeled, unlabeled, milestoned, demilestoned, reopened plus
  #      workflow_dispatch sweep; job permissions exactly contents: read and
  #      issues: write; every action pinned to a 40-hex SHA; no
  #      pull_request_target, no secret, no bypass construct; one verdict per
  #      evaluation; no schedule.
  #      Every evaluated run writes one job summary to $GITHUB_STEP_SUMMARY
  #      naming the issue number, the verdict, and the writes performed.
  #  4.5 tests/checks/milestone-attachment.test.ts (TC-CHK-001, TC-CHK-006),
  #      milestone-attachment-integration.test.ts (TC-CHK-002..005),
  #      milestone-sweep.test.ts (TC-SWEEP-001..002),
  #      milestone-workflow.test.ts (TC-WF-001..003, including the mutation
  #      proof), and milestone-gate.test.ts (TC-GATE-001). Fixtures under
  #      tests/fixtures/milestone-attachment/{events,tracker,sweep,adversarial}.
  #  4.6 Do NOT edit package.json's check chain, scripts/install.sh,
  #      ADOS_DELIVERY_SCRIPTS, ci-supply-chain.ts, ci-bindingness.ts, or
  #      ci-topology.ts. The workflow audit is owned by the dedicated static
  #      suite. Follow .ai/rules/typescript.md and the house style of existing
  #      checks and their tests.
  #  4.7 Run the sweep once locally in read-only mode with a read-only
  #      credential; report the tmp/milestone-attachment-sweep.json path and
  #      its summary in the phase report, and make zero tracker writes. Phase 6
  #      (PM lane) writes chg-GH-313-milestone-evidence.md, consuming that
  #      output.
  #
  # Bound: F-3, AC-F3-1..AC-F3-7, AC-NFR1-1, AC-NFR2-1, AC-NFR3-1,
  # AC-NFR6-1, AC-NFR7-1, DoD-8..DoD-11, DoD-18, NFR-1..NFR-3, NFR-6,
  # NFR-7, C-1, C-2, C-4, C-5, C-12, DEC-1, DEC-2, DEC-8, RSK-1, RSK-4,
  # RSK-5.
  # ---------------------------------------------------------------------------
  - id: 4
    title: "Milestone-attachment evaluation core, GitHub adapter, issue-event workflow, and offline suites"
    kind: delivery
    summary: "Deliver the pure milestone-attachment evaluation core, port-injected runner, and sole network-capable GitHub adapter with the offline decision-table, integration, sweep, workflow, and gate suites plus the least-privilege SHA-pinned issue-event workflow with its per-run job summary and non-writing advisory sweep."
    scope:
      files:
