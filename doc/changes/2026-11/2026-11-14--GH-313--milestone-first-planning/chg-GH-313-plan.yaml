# GH-313 delivery plan — machine-readable document (delivery.plan.v1), revision 1.2
# (2026-11-14; DoR iteration 2 remediation; revision 1.2 amendment: phase 1
# scope gains scripts/checks/forbidden-literals.registry.json plus obligation
# 1.7, because a new user-facing doc must be registered for the
# forbidden-literal scan). Authored against the remediated spec and test plan
# revision 1.2 on branch feat/GH-313/milestone-first-planning.
#
# One ticket, one PR against main-tools, six plan phases: five @coder delivery
# phases plus one PM-lane evidence phase. Every phase is an
# independently committable slice that is green at its own boundary and is ONE
# commit through the commit primitive (conventional subject, scope GH-313,
# every body/footer line <= 100 characters). The phase-9 range gate
# ./scripts/lint-commit-range.sh --base main-tools lints every commit.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec: ./chg-GH-313-spec.md — F-1..F-6, EVT-1..4, DM-1..5, NFR-1..7,
#     DEC-1..DEC-12, AC-F1-1..AC-NFR7-1 (30 ACs), DoD-1..DoD-21, Appendix B
#     file-impact rows 1-34, Appendix C decision table and seeds
#     SC-M2-S20-01..05, Appendix E constraints C-1..C-12.
#   - Test plan: ./chg-GH-313-test-plan.md (revision 1.2) — 35 TCs in 12 families,
#     all 30 ACs Covered, §7 suite homes and execution commands, §8.3
#     resolved pins TP-Q1..TP-Q6, §9 reconciliation rule.
#   - PM notes: ./chg-GH-313-pm-notes.yaml — decisions, milestone
#     "M2: Ceremonies, measurement, and memory", story M2-S20,
#     delivery_mode autonomous, PATH quirk.
#   - PDR: doc/decisions/PDR-0005-milestone-first-planning-and-delivery.md
#     (authored and Proposed; landed in phase 1 with its register row).
#
# TEST-PLAN RECONCILIATION PINS (canonical contract: test plan revision 1.2 §8.3 and
# the spec §17 ACs it references; every TP-Q item is resolved — TP-Q1/Q2/Q5 by
# this plan, TP-Q3/Q4 by the remediated spec, and TP-Q6 in the test plan):
#   TP-Q1 — the evaluation core lives at scripts/checks/milestone-attachment.ts
#     with the port-injected orchestration at
#     scripts/checks/milestone-attachment-runner.ts and
#     scripts/checks/milestone-attachment-github.ts. Appendix B row 34
#     "scripts/** UNCHANGED" is read as "no distributable/install-set script
#     changed" (spec Appendix B rows 11 and 34): the new modules are
#     repository-internal check surfaces, not in ADOS_DELIVERY_SCRIPTS and not
#     in the aggregate chain.
#   TP-Q2 — the existing invariant scanners stay unchanged (spec AC-F3-7,
#     NFR-3). The new workflow's permissions, SHA pins, secret absence, and
#     bypass-construct absence are owned by the dedicated static workflow suite
#     tests/checks/milestone-workflow.test.ts plus its mutation proof; the
#     scanner files ci-supply-chain.ts, ci-bindingness.ts, and ci-topology.ts
#     are untouched.
#   TP-Q5 — the evidence record lives in the change folder at
#     chg-GH-313-milestone-evidence.md and is mirrored as a pm-notes
#     notes: entry of type evidence (spec DoD-14, test plan TC-EVID-001/002).
#   TP-Q3/TP-Q4 — resolved by the remediated spec (AC-F1-1, NFR-4 for the
#     header; AC-NFR1-1 for the action-layer idempotency claim): the guide
#     carries only the script-generated header on the single file path, and
#     duplicate-label claims are asserted at the action layer (zero add-label
#     calls on repeat).
#   TP-Q6 — resolved in the test plan as semi-automated (TC-GUIDE-002:
#     heading/keyword anchors plus a recorded content review).
#   Suite homes adopt test plan §7 verbatim. The plan declares those suites in
#     the phases that land the content they assert, so every phase commit
#     carries its own tests.
#
# SCOPE DISCIPLINE: no file outside the declared scopes may change, and the
# branch's only other changes are the change-folder artifacts. No ticket and
# no milestone is created by this change (NG-3). The aggregate gate is not
# edited (C-1, NFR-2): package.json's check chain, scripts/install.sh, and the
# existing invariant scanners stay untouched.
#
# LIFECYCLE PHASE 7 HANDOFF (system_spec_update, @doc-syncer; NOT plan scope):
# Appendix B rows 25-31 — feature-milestone-governance.md (new),
# feature-document-templates.md, feature-agents-and-commands.md,
# feature-bootstrapper.md, feature-delivery-lifecycle.md,
# feature-autonomous-delivery.md + doc/guides/autonomous-batch-delivery.md,
# and doc/guides/change-lifecycle.md. They are reconciled after delivery; no
# delivery phase pre-flips current truth (NG-10).
#
# LIFECYCLE PHASE 11 (pr_creation): PR against main-tools, left open, required
# CI green on the pushed HEAD (DoD-21). PR creation is not a plan phase.
#
schemaVersion: delivery.plan.v1
workItemRef: GH-313
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6]
  escalationTriggers:
    - file-changed-outside-the-declared-phase-scope
    - guide-header-hand-written-or-duplicated
    - template-other-than-change-spec-edited
    - ados-claude-generated-file-hand-edited
    - generated-plugin-stale-after-prompt-edit
    - aggregate-check-chain-or-install-set-changed
    - workflow-action-unpinned-or-permission-widened
    - sweep-performs-any-tracker-write
    - planning-corpus-diverges-from-the-tracker
    - tracker-evidence-performed-by-coder-or-contains-a-write
    - current-truth-doc-pre-flipped-before-phase-7
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Milestone-management guide, index row, and PDR-0005 landing.
  # Commit: docs(GH-313): milestone-management guide and PDR-0005 record.
  #
  # Obligations:
  #  1.1 Author doc/guides/milestone-management.md with the operating rule and
  #      all nine topics exactly once (naming, creation, attachment, entry
  #      review, planned scope, exit review, closure, extension/reopening,
  #      enforcement), the unattended-run precondition, and pointers to
  #      PDR-0005 and the enforcement contract.
  #  1.2 Add the operating-rule pointer to the `## Conventions` section of
  #      doc/planning/oss-tooling/milestones/README.md without restating the
  #      procedure (AC-F1-3, DoD-3); this makes the phase-1 guide suite green
  #      at its own boundary.
  #  1.3 Add the guide row to the doc/00-index.md Guides table.
  #  1.4 Land the already-authored PDR-0005 file beside its committed
  #      doc/decisions/00-index.md row (DoD-4: the record exists
  #      before delivery begins; GH-302 precedent). Status stays Proposed with
  #      decision_date null; owner ratification is external at the PR gate.
  #  1.5 Add the license header ONLY by running
  #      scripts/add-header-location.sh doc/guides/milestone-management.md
  #      (the single new file path, never the doc/guides directory) after the
  #      guide is written; never hand-write it. The unrelated existing
  #      headerless guide doc/guides/provider-conditions-and-parks.md MUST
  #      remain byte-identical (verify with git status/diff); a directory
  #      invocation would rewrite it outside every declared scope. Keep the
  #      new guide's header byte-identical to script output.
  #  1.6 Land tests/checks/milestone-guide.test.ts (TC-GUIDE-001..004) and run
  #      the distribution guard scripts (TC-GUIDE-005)
  #      bash scripts/.tests/test-doc-distribution.sh and
  #      bash scripts/.tests/test-doc-distribution-modes.sh.
  #  1.7 Register the new user-facing guide in
  #      scripts/checks/forbidden-literals.registry.json under `registered`
  #      (alphabetical, after doc/guides/migrating-to-per-repository-state.md).
  #      The forbidden-literal scan fails closed on any non-excluded doc file
  #      that is neither registered nor present at the pinned corpus baseline,
  #      so a new doc/guides/** page is incomplete until it is registered.
  #
  # Bound: F-1, AC-F1-1, AC-F1-2, AC-F1-3, AC-F1-4, AC-NFR4-1, DoD-1..DoD-4,
  # NFR-4, C-9.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Milestone-management guide, pack-conventions pointer, documentation-index row, and PDR-0005 landing"
    kind: delivery
    summary: "Land the redistributable milestone-management guide, its pack-conventions pointer, documentation-index row, the already-authored PDR-0005 record, and the guide's forbidden-literal registry entry, adding only the new guide header via scripts/add-header-location.sh on the single file path."
    scope:
      files:
        - doc/guides/milestone-management.md
        - doc/planning/oss-tooling/milestones/README.md
        - doc/00-index.md
        - doc/decisions/PDR-0005-milestone-first-planning-and-delivery.md
        - scripts/checks/forbidden-literals.registry.json
        - doc/decisions/00-index.md
        - tests/checks/milestone-guide.test.ts
    interactions:
      - kind: contract-file
        target: doc/guides/milestone-management.md
        role: producer
      - kind: contract-file
        target: doc/decisions/PDR-0005-milestone-first-planning-and-delivery.md
