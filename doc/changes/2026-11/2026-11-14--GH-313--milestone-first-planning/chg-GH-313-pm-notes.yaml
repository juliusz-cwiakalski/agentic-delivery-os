decisions:
  - text: "Milestone-first enforcement is event-driven: the check evaluates newly
      created/edited `change` issues without a milestone and flags them; a
      manual sweep reports existing debt without failing, because 94 historical
      `change` issues (53 open) carry no milestone and mass-labelling them would
      be false enforcement."
    date: "2026-11-14"
  - text: "Scope overlap with GH-139 (roadmap MS-<NNNN> IDs + allocation matrix +
      milestone-management guide): GH-313 authors
      doc/guides/milestone-management.md for the milestone-first operating rule
      (naming, creation, attachment, exit review, closure/extension,
      planned-scope definition, enforcement). GH-139 remains the owner of MS-
      numeric IDs and the roadmap allocation matrix and extends the same guide
      later. No new ticket created."
    date: "2026-11-14"
  - text: "'milestone blueprint conventions' is interpreted as the Conventions
      section of doc/planning/oss-tooling/milestones/README.md (the milestone
      pack is the committed blueprint). 'Ticket generator templates' is
      interpreted as the @pm ticket-creation path plus the @bootstrapper
      guidance that generates .ai/agent/pm-instructions.md for new projects; no
      standalone ticket template exists to change."
    date: "2026-11-14"
  - text: "The new check must stay out of pnpm check: the aggregate gate is
      deterministic and offline, while milestone attachment is tracker data.
      Enforcement lives in a GitHub Actions issue-event workflow over a pure,
      unit-testable evaluation function."
    date: "2026-11-14"
  - text: "The operating rule is precedent-setting for every future ticket, so it is
      recorded as a PDR (next free id PDR-0005) in addition to the change spec
      decision log."
    date: "2026-11-14"
