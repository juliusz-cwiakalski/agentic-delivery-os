notes:
  - text: "State detection: issue OPEN with labels change + agent-improvement,
      attached to milestone M2 (#3). No PR, no change folder, branch
      feat/GH-313/milestone-first-planning at origin/main-tools HEAD (404e9bf8),
      0 commits ahead, clean tree. Fresh delivery; main-tools sync was already
      up to date."
    type: info
    date: "2026-11-14"
  - text: "Tracker facts: milestones M0 (#1, 20 tickets), M1 (#2, 24 tickets), M2
      (#3, 23 tickets). 94 `change` issues have no milestone (53 open), which is
      why the escape path for pure backlog capture is required and existing debt
      is handled by an advisory sweep, not a hard fail."
    type: info
    date: "2026-11-14"
  - text: "Backlog consistency debt found: doc/planning/oss-tooling/backlog.md
      records `- Ticket:` lines for only 6 of the M2 stories (S9, S11, S12, S13,
      S15, S18) although milestone M2 carries 23 tickets. The M2-S20 story block
      is missing entirely. Both are in scope for the consistency AC."
    type: risk
    date: "2026-11-14"
  - text: "Prompt-file edits (.opencode/agent/pm.md,
      .opencode/agent/bootstrapper.md) require regenerating .ados-claude/ via
      scripts/build-claude-plugin.sh, and pnpm check:prompt / check:help plus
      the CI plugin-freshness job will fail otherwise."
    type: risk
    date: "2026-11-14"
  - text: "Environment quirk: the commit primitive's commitlint probe resolves
      `commitlint` from PATH; without PATH=\"$PWD/node_modules/.bin:$PATH\"
      every phase commit fails as commit.commitlint-failed. Prefix the PATH on
      all lifecycle CLI invocations."
    type: retro
    date: "2026-11-14"
  - text: "Test planning reopened `specification`: AC-F1-1/NFR-4 said the new guide
      'carries no hand-written license header' although doc/guides headers are
      script-added; AC-NFR1-1's 'zero duplicate label applications' is only
      falsifiable at the action layer; and Appendix B row 29 declared scripts/**
      UNCHANGED while rows 11-12 create the evaluation core in the repository
      check surface. Fixed in the spec and re-completed before test_planning."
    type: retro
    date: "2026-11-14"
  - text: "PDR-0005 authored by @decision-advisor (status Proposed) and its register
      row committed at 302c692. The record file itself is intentionally
      untracked until a plan phase declares doc/decisions/** in scope; DoD-4 is
      satisfied by that phase, mirroring GH-302."
    type: decision
    date: "2026-11-14"
  - text: "DoR iteration 1: NOT_READY. Critical: test plan still carried five open
      TP-Q items after the plan pinned them and the spec clarified them (its own
      revision rule requires 1.1 before the gate); phase 1 asserted the
      pack-conventions edit that phase 5 owned; phase 2 asserted the spec-writer
      prompt edit that phase 3 owned; and `scripts/add-header-location.sh
      doc/guides` also rewrites the existing headerless provider-conditions
      guide, outside every declared scope. Major: no production GitHub adapter
      module was scoped, so the workflow could not perform its live reads; the
      live-sweep evidence was not producible pre-PR; TC-EVID-001 mis-modelled
      attached-but-undeclared tickets (M1 #219, M2 #268/#284/#286/#303);
      TC-GUIDE-001 weakened the header rule to 'where present' and miscounted
      lines; two stale paths in the test plan; and the public label names were
      still TO-CONFIRM. Reopened specification, test_planning, and
      delivery_planning."
    type: retro
    date: "2026-11-14"
  - text: "PM decision (autonomous mode) on the DoR label question: adopt
      `needs-milestone` and `backlog-capture` as the public label names.
      Rationale: descriptive, kebab-case like the existing label vocabulary,
      scoped to this check, and reversible through a guide plus workflow edit.
      Recorded as OQ-2 resolved and carried into PDR-0005; the owner can rename
      at the PR gate."
    type: decision
    date: "2026-11-14"
  - text: "DoR remediation split: specification (OQ-2 resolved, live-sweep evidence
      wording), test_planning (revision 1.1: TP-Q closure, TC-EVID-001
      declared-only model plus attached-but-undeclared report, TC-GUIDE-001
      byte-for-byte header, link/filename fixes, row references, TC-SCOPE-001
      allowed set, TC-TPL-002 moved to the prompts suite), delivery_planning
      (phase 1 gains the pack conventions, phase 5 loses it; phase 4 gains the
      GitHub adapter module, a pinned sweep artifact path, and the local
      read-only sweep obligation; phase 5 pack-contents line; header script on
      the single file; Appendix B row references)."
    type: info
    date: "2026-11-14"
  - text: "DoR iteration 2: NOT_READY. Residual design gaps: the event set let an
      edited/labeled pre-existing unattached issue be flagged; the decision
      table lacked flag-label and marker dimensions plus precedence; 'applied
      once' conflicted with restore-after-detach; plan 4.7 wrote phase 6's
      evidence file; pm-instructions' 'Backlog Source of Truth' contradicted the
      committed planning mirror; and five test-plan assertions were
      under-specified. Verdicts persisted under readiness-review/. Reopened
      specification, test_planning, delivery_planning for iteration 3 with a
      canonical ordered decision table (exemption > milestone >
      marker/flag/event; writes only on opened and on demilestoned with the
      marker)."
    type: retro
    date: "2026-11-14"
