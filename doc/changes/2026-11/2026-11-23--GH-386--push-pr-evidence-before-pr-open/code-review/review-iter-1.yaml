  - id: F-2
    severity: medium
    confidence: high
    category: spec-compliance
    location: doc/changes/2026-11/2026-11-23--GH-386--push-pr-evidence-before-pr-open/chg-GH-386-spec.md (§8.1) vs packages/cli/src/production.ts:3610-3618
    message: >
      Spec §8.1 states "the engine's provider reads are unchanged in count and kind;
      the parity comparison consumes the delivery-request detail read the derivation
      already performs at arm 8." The implementation does neither: readOpenRequestHeadSha
      performs its own fresh bounded listDeliveryRequests read (once pre-act, once in
      the post-act re-read) instead of consuming the derivation's read. The behavior is
      correct, fail-closed (unreadable → state-unverified, never a false pr-open), uses
      the same read class and the same find-first-by-sourceRef resolution as the
      delivered readPullTruth, and satisfies NFR-2's "no new provider read class" and
      "one extra bounded parity read after a performed push" — but §8.1's count and
      consumption claims are factually wrong for the delivered code.
    suggestion: >
      Amend spec §8.1 to declare the parity read pair explicitly (one fresh bounded
      open-request list read at precondition evaluation, one fresh local+remote read
      pair in the post-act re-read; same class and resolution semantics as the
      derivation's read; unreadable degrades to state-unverified). No code change.
