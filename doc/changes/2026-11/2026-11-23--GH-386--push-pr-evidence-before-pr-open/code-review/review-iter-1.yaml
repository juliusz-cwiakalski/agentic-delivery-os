      evidence, no envelope block"), but the spec itself never declares it — no
      clause in F-1, no residual in §7.3, no row in §11 (the word "daemon" appears
      nowhere in the spec).
    suggestion: >
      Documentation-only remediation: add one composition-scoping clause to spec F-1's
      declared behaviors (mirroring the feature page sentence), scope AC-F1-1's Given
      to classifications under the composed capability (or note the daemon-lane
      exemption), and add a §7.3 deferred entry / §11 residual row declaring that the
      defect pattern remains possible on the daemon lane until it composes the port.
