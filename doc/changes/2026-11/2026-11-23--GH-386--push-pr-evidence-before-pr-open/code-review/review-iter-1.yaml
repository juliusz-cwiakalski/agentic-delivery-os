    category: correctness
    location: packages/adapters/src/git/push.ts:152
    message: >
      The fixed argv ("git push --ff-only HEAD:refs/heads/<branch>") names no remote;
      git resolves the destination from the current branch's push configuration. In the
      delivered delivery posture (checkout on the change branch, single configured
      upstream) this is exactly the change branch's configured upstream, and spec §12
      declares the no-upstream-discovery assumption — so this is compliant as
      delivered. A multi-remote checkout where the current branch differs from the
      change branch could resolve a different configured remote than the declared one.
    suggestion: >
      No action for this change (assumption-declared, fail-closed via --ff-only).
