decisions:
  - text: "AC-3 live-proof logistics decided PM-autonomous (non-interactive run —
      question tool cancelled; owner override point is the open-PR review):
      post-merge live observation. AC-1/AC-2 fixtures gate the merge in-PR; the
      first two consecutive natural dispatches after merge must end
      local==remote at pr-open and are recorded as the live verification by the
      CEO/owner lane. Drivers: in-change live dispatches would commit the owner
      to two full unsolicited deliveries (needs owner-designated tickets —
      cost-bearing scope is owner-stated); one-delivery-at-a-time discipline
      preserved; requirement 3 makes a divergent pr-open a typed failure, so the
      post-merge proof cannot pass silently and matches exactly the
      twice-observed failure pattern. The spec must declare this AC-3
      satisfaction contract explicitly so the DoD gate can evaluate it."
    date: 2026-11-23
  - text: "Test-plan OQ-1 accepted (spec interpretation, not a spec change): F-3's
      failure enumeration ('rejected, fails, times out, or parity still unmet')
      treats a spawn-level act failure (git binary missing/failing to start) as
      'fails' under the same row — any non-successful act outcome is the typed
      failure. Consistent with the row's semantics; no vocabulary or row change.
      Carried into the plan and implementation reading; DoR gate may re-check."
    date: 2026-11-23
  - text: "Test-plan OQ-2 accepted (declared assumption, not a spec change): spec
      §12 assumes an open PR implies a configured upstream; the no-upstream path
      is undeclared behavior and is NOT tested. If @coder finds it
      reachable-and-unhandled, record as a deferred finding (like GH-293's
      declared residuals), never a new failure class."
    date: 2026-11-23
