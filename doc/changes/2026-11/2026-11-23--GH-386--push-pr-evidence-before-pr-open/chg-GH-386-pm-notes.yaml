  - text: "Intake 2026-11-23 (manual PM invocation, interactive). Observed state:
      phase ledger empty (verified class, 7733 records), no branch/folder/PR for
      GH-386; main-tools synced to origin at 8f557cfd. Ticket evidence: observed
      twice on consecutive native deliveries (GH-381/PR #383, GH-384/PR #385) —
      the branch's final commit (pr_creation completed + PR URL) existed only
      locally at dispatch exit pr-open; the CEO pushed manually before merging,
      invalidating CI on the PR head and costing a second CI cycle. Required
      behaviour: (1) push final commit(s) before pr-open classification; (2)
      terminal evidence names the pushed head and asserts local==remote parity
      (the parity verify gates already checks); (3) push failure is a typed
      non-pr-open result retaining the PR URL; (4) pr-open with local ahead of
      PR head is a defect pinned by fixture. Milestone M4 attached at intake —
      verified, no owner question needed."
    type: info
    date: 2026-11-23
  - text: "Spec cross-check (doc/spec/features/feature-dispatch-engine.md): the
      eleven-token vocabulary is closed — a failed push must map into an
      existing token (PM indication: a new failure-class row mapping to failed,
      outcome failed, exit 1, in the pinned failure-token mapping, adding no
      token); derivation arm 8 (open PR -> pr-open) gains a parity precondition;
      the pr-open corroboration requirement (currently tracker-only) may need
      the parity evidence reference; machine envelope may gain additive optional
      parity/pushed-head fields (precedent: detail.harness,
      DISPATCH_MAX_ERROR_DETAIL_CHARS bounding). Mechanism choice (engine-side
      push vs lifecycle-prompt push with dispatch-side verification) is the
      spec-writer's to declare from code truth; PM indication: engine-side
      deterministic push reusing the verify-gates parity seam (paved road,
      deterministic, satisfies behaviours 1-4 without prompt reliance). Dispatch
      explicitly has no merge port — push is not merge, so no contradiction, but
      a push is new write I/O for the engine: if spec-writer confirms
      engine-side, route the precedent-setting extension through
      @decision-advisor for a decision record."
    type: info
    date: 2026-11-23
  - text: "Open spec questions for @spec-writer: (1) shell fallback parity — the
