findings:
  - id: F-1
    severity: low
    confidence: high
    category: correctness
    location: packages/cli/src/commands/board.ts:118
    message: >-
      The handler reads the decision history only when the eligibility probe
      (evaluation with empty history) projects at least one default. Reviewer
      probe: a waiver gate defaulted at 73 h, re-evaluated after an 80 h clock
      regression, renders `fresh` instead of `default-applied` because the probe
      yields zero decisions and the ledger (which holds the record) is never
      read; the same skip means a torn decision ledger is not declared on runs
      with no currently eligible gate. The behavior is pinned by the test plan
      (§NFR evidence line and TC-SLA-026 step 6: "read ... when a default is
      eligible", "at most 1") and is unreachable against v0 real data (every
      real gate maps to non-defaultable owner-review), but spec F-4/NFR-7 and
      feature-state-layer.md state the honoring behavior unconditionally
      ("A re-evaluation after application therefore honors the existing record").
    suggestion: >-
      Either (a) make the single verified history read unconditional — still
      within NFR-2's "at most one verified decision-history read"; update the
      TC-SLA-026 read-only fixture expectation from 0 to 1 read — or (b) keep
      the optimization and add one boundary sentence to
      feature-owner-gate-sla.md (§ Default application) and the feature-state-
      layer.md Board-consumer paragraph: honoring a prior record assumes the
      gate is currently expiry-eligible (monotonic clock); under clock
      regression the board re-derives from observed age alone.
    suppressed: false
