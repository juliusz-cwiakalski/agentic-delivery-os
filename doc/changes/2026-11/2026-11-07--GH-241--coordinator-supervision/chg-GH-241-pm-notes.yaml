decisions:
  - text: "Delivery restarts from a clean branch:
      feat/GH-241/coordinator-supervision existed at origin/main-tools tip
      03edcdd7 with zero own commits, no PR ever opened, and no change
      artifacts. Issue label 'review' was premature; corrected to planning at
      delivery start."
    date: "2026-11-07"
  - text: "DoR iteration 1 verdict NOT_READY (12 blocking, 7 advisory). Reopened
      specification + test_planning + delivery_planning. Root causes are
      model-level, not wording: (1) the spec conflated the delivered short-lived
      state write fence with a lifetime single-instance lock, making
      stop/stale-takeover/escalation-under-fence unimplementable; (2) the
      append-only state store has no record update, so killOutcome cannot be
      written onto an existing stuck record; (3) the stuck evidence named 'new
      turn' and 'ready-to-merge count' without declared sources; (4) the
      instance identity, wake askedAt dedupe key, stop-request channel, and
      reserved-question render position had no durable carriers. Remediation
      direction: introduce a durable coordinator instance lease carried by the
      coordinator.fence record (acquired/released/stale-takeover/stop-requested)
      separate from the short-lived state write fence; fold two-phase
      coordinator.stuck records by stuckId (verdict then outcome); add
      coordinator.progress-bound and define 'new turn' as tokenDelta>0 or
      traffic>0 from the delivered harness liveness facts; drop ready-to-merge
      from the digest fingerprint; pin the reserved escalation question first;
      add PID+start-time identity verification before TERM; use
      exhausted-escalated; pin isCoordinatorPickup absent-status = open; update
      TDR-0013/0014 and the test plan accordingly."
    date: "2026-11-07"
  - text: "Specification defines the coordinator supervision surface as its own
      `coordinator` command family (start/stop/status/tick) plus a shared
      supervisor-regime descriptor, with daemon-install wiring as the M1-S18
      seam (no daemon command created). Precedent-setting decisions recorded as
      TDR-0013 (architecture, regime, process port, lifecycle decision, wake
      policy) and TDR-0014 (artifact-evidence stuck detection, owner-brief
      exhaustion escalation); both status Proposed pending owner acceptance at
      PR review. DEC-2 (new family name) ruled registry-only under ODR-0003
      DC-4: no naming record created."
    date: "2026-11-07"
open_questions: []
