      findings (1 critical, 4 major): RF3-01 claim-time state-fence handling is
      doubly specified and can wedge start/tick as coordinator.already-running
      after a dead writer leaves a stale lock while stop reports not-running;
      RF3-02 status is required to report a tickVerdict that is never persisted;
      RF3-03 'alive unavailable' is both the age-fallback takeover input and a
      coordinator.process.capability-gap; RF3-04 TC-COORD-094 demands two
      mutually exclusive interleavings; RF3-05 the foreground supervision loop
      has no declared cycle body, driver, stop-observation, or exit path. Two
      blockers (RF3-04, RF3-05) are new classes introduced by the v1.3
      remediation. Human owner decision required: authorize one scoped repair
      round (specification for RF3-01/02/03/05; test_planning for RF3-04 and
      AF3-08; delivery_planning for AF3-07) or re-scope GH-241."
    date: "2026-11-07"
