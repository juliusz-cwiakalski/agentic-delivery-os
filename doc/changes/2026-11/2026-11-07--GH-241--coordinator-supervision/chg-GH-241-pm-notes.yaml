  - text: "Contradiction found in clarify_scope: the ticket says coordinator supervision runs 'beside the lane daemon' under the 'daemon install scope', but M1-S18 (GH-238) is not delivered — there is no daemon command, supervisor unit, or control socket in the tree. Ranked dependencies deliberately list only M1-S15 and M1-S16, so the story is intended to be deliverable without S18. Planned resolution for the spec: deliver a separate coordinator-supervision process/command family and a shared supervisor-regime contract (state-dir scope, single-instance fence, user-level unit descriptor), with the daemon-install wiring recorded as the S18 seam rather than duplicated here."
    type: "risk"
    date: "2026-11-07"
  - text: "Contradiction found in clarify_scope: no coordinator supervision command surface exists in the locked CLI registry (only the ceo-loop.sh strangler row names M1-S23). The spec must add the naming-surface row and command page; this is a reviewed naming-surface change, not an inferred behavior."
    type: "risk"
    date: "2026-11-07"
  - text: "Contradiction found in clarify_scope: the harness session port exposes spawn/deliver/resume/collect/liveness/list but no kill-with-grace, and no OS process port exists. The spec must add a kill/process seam (injected, testable) rather than calling process APIs from domain code."
    type: "risk"
    date: "2026-11-07"
  - text: "Design decision needed in spec: 'digest consumed' is named as stuck-detection evidence but status is read-only and M1-S22 audit ledger is not delivered, so no digest-read record exists. The spec must define the observable artifact class (candidate readings: state-cursor advance, coordinator iteration record, or supervisor-issued digest snapshot identity) and pin it as a recorded decision."
    type: "risk"
    date: "2026-11-07"
  - text: "Design decision needed in spec: owner-brief escalation mechanism. The brief already renders a real ranked blocker-questions anchor, so publishing an owner-audience typed question on restart exhaustion is the likely mechanism; the spec must pin the exact record, audience, and brief rendering, and ensure 'never silent' is testable."
    type: "risk"
    date: "2026-11-07"
  - text: "Design decision needed in spec: install/autostart scope. M1-S18 owns `daemon install`; this change must not preempt or duplicate it. The spec should define a shared supervisor-regime descriptor and either deliver a coordinator unit install behind that seam or declare an explicit tested gap with the S18 handoff named."
    type: "risk"
    date: "2026-11-07"
  - text: "clarify_scope complete at 2026-11-07T12:04:00Z. Ticket requirements are complete and the pinned decisions are binding; the six findings above are implementation/design choices inside the ticket's stated intent, not product-scope ambiguities, so no human clarification is blocking. They are routed into specification as recorded decisions (DEC entries + a decision record where precedent-setting), each with an explicit tested outcome. Scope boundaries declared: do not preempt M1-S18's daemon command, control socket, lane supervision, or installers; do not implement merge, queue scheduling, or agent-prompt changes (M1-S20); do not change existing command output outside the declared supervision/escalation surfaces."
