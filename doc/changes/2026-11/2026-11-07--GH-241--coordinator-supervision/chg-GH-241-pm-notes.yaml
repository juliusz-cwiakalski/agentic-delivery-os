  - text: "Decision (integration reconciliation with delivered surfaces): (1) TDR ID
      collision — coordinator TDRs renumber TDR-0013/TDR-0014 to
      TDR-0017/TDR-0018 because main-tools now owns 0013..0016. (2) The change
      reuses the delivered `DaemonProcessPort` for OS kill/liveness instead of
      adding a new harness process port: `signal` gains `SIGKILL` additively and
      an optional `startTimeMs` capability carries the PID start-time identity
      check, absence mapping to `coordinator.process.capability-gap`. (3) The
      coordinator keeps its ledger lease (`coordinator.fence`) rather than the
      daemon's file lock (`daemon.lock`): the lease needs durable
      takeover/stop-request evidence and a per-iteration claim, while
      `daemon.lock` is a heartbeat-age single-instance file lock; the divergence
      is recorded in the TDR. (4) Supervisor unit installation stays out of
      scope as the M1-S18 seam, now named precisely against the delivered
      `DaemonSupervisorDescriptor`/`SupervisorPort` and the additive explicit
      `command` vector they would need; no daemon preemption. (5) Restart
      budget, harness liveness, pickup predicate and the question channel are
      consumed as delivered."
    type: "decision"
    date: "2026-11-09"
