  # ---------------------------------------------------------------------------
  # Phase 6 — Coordinator CLI family and edge composition
  #
  # Goal: compose the command family over injected state, config, process,
  # blocker, clock, id, brand, and harness seams; the handler is pure (no
  # stream writes, no exit literals) and the edge is the only writer/projector.
  #
  # Tasks (TC-COORD-003, 004, 010, 011, 012, 013, 014, 015, 016, 017, 018,
  #        024, 025, 035, 041, 043, 044, 045, 052, 054, 055, 060, 061, 062,
  #        065, 070, 071, 072, 073, 074, 075):
  #  6.1 packages/cli/src/commands/coordinator.ts: start [--foreground]
  #      [--fresh-budget], stop, status [--live], tick; closed grammar;
  #      delivery.coordinator.v1 data (including the lease-folded instance);
  #      deterministic bounded text renderer. supervisorMode is foreground when
  #      --foreground is set and detached otherwise; externalUnit is absent.
  #  6.2 packages/cli/src/edge.ts composition: state dir + instance lease +
  #      per-append state write fence, config, fake-able process port, blocker
  #      verified read/append, injected clock, ids, brand, harness session
  #      facts; register exactly one coordinator family; no
  #      daemon/dispatch/supervise command.
  #  6.3 Instance-lease semantics: start appends one coordinator.fence
  #      acquired record (instanceId, holder, pid, processStartTimeMs,
  #      supervisorMode, externalUnit=absent); a second start or a contended
  #      tick -> coordinator.already-running exit 2 with the holder named and
  #      no record; stop appends stop-requested and reports
  #      requested=true/released=false (or not-running at exit 0 when the
  #      latest lease is released/stale), never releases another process's
  #      handle; the live supervisor appends released at the next cycle
  #      boundary; stale takeover when the recorded holder's alive(handle) is
  #      absent or the lease age > 2 x collection-interval, appending
  #      stale-takeover then acquired; no recoverFence and no contracts/state.ts
  #      change; every append takes the state write fence for that append only.
  #      The latest record folds to the instance identity; there is no
  #      separate instance record (TC-COORD-010/011/015/017/018).
  #  6.4 Lifecycle application: join/resume/spawn; killed-mid-iteration
  #      recovery without re-executing closed-out work; --fresh-budget only
  #      when stopped; status reports the instance fold, lease action, decision,
  #      restart count/bound, two-phase stuck verdict/phase/reason/outcome,
  #      wake, and escalation and degrades --live honestly; stuck-unevaluable
  #      and torn/gapped budget return the delivered state identity at exit 2
  #      with no kill or restart (TC-COORD-012/013/014/016/024/025/035/041/043/
  #      044/045/054/055).
  #  6.5 Escalation and wake integration: exactly one owner decision-needed
  #      question, terminal receipt after the question, publish failure exit 2
  #      with exhausted-escalation-failed, idempotent reuse returning
  #      exhausted-escalated (never "escalated"); the delivered blocker append
  #      acquires its own state write fence and composes without a lock
  #      collision (no packages/core/src/state/blockers.ts change); strict
  #      pickup wake with an absent status counting as open and persisted woken
  #      only, already-woken/answered-before-wake/delivery-failed/no-pickup as
  #      tick results (no-pickup only for a non-rank-1 head, a non-coordinator
  #      audience, or an explicitly non-open status), retry without duplicate
  #      records.
  #  6.6 Tests: coordinator-grammar, envelope, start, stop, tick, status,
  #      instance-lease, fence-records, fence-stale, decision-durability,
  #      decision-recovery, fresh-budget, restart-exhausted, restart-torn,
  #      stuck-unevaluable, kill-failed, kill-fence, capability-gap,
  #      kill-identity, escalation-publish/idempotent/failed/reuse,
  #      wake-pickup/answered/dedupe/paths/failed/next; structure coordinator-
  #      regime; exit-code-literals; golden/coordinator; fixture harness.ts
  #      and blockers.ts.
  #
  # Verification:
  #   bun test tests/behaviour/coordinator-grammar.test.ts tests/behaviour/coordinator-envelope.test.ts tests/checks/exit-code-literals.test.ts
  #   bun test tests/behaviour/coordinator-start.test.ts tests/behaviour/coordinator-stop.test.ts tests/behaviour/coordinator-tick.test.ts tests/behaviour/coordinator-status.test.ts tests/behaviour/coordinator-instance-lease.test.ts tests/behaviour/coordinator-fence-records.test.ts tests/behaviour/coordinator-fence-stale.test.ts tests/behaviour/coordinator-fresh-budget.test.ts
  #   bun test tests/behaviour/coordinator-restart-exhausted.test.ts tests/behaviour/coordinator-restart-torn.test.ts tests/behaviour/coordinator-stuck-unevaluable.test.ts tests/behaviour/coordinator-kill-failed.test.ts tests/behaviour/coordinator-kill-fence.test.ts tests/behaviour/coordinator-kill-identity.test.ts tests/behaviour/coordinator-capability-gap.test.ts
  #   bun test tests/structure/coordinator-regime.test.ts tests/golden/coordinator.test.ts tests/behaviour/coordinator-escalation-*.test.ts tests/behaviour/coordinator-wake-*.test.ts
  #
  # Exit: one bounded envelope and one {0,1,2} exit per outcome; the instance
  # lease (four actions, stop as a request, stale takeover, per-append state
