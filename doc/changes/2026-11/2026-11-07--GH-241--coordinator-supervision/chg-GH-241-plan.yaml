  #  8.1 Integration scenario: start/instance-lease/stop/status; liveness-first
  #      refusal, atomic claim, serialized second-claim refusal, stale-fence
  #      claim recovery, single-record takeover, and tick crash recovery;
  #      foreground loop driven to N cycle boundaries with one lifetime lease
  #      pair and declared stop/fatal/signal exits; join/resume/spawn and
  #      killed-mid-iteration artifact preservation; two-phase stuck
  #      permutations and ledger-sequence fold; identity-verified kill outcomes;
  #      budget durability/exhaustion/exhausted-escalated idempotency/
  #      first-index reserved slot; absent-status pickup and wake outcomes/
  #      retry; token-delta/session-traffic progress bound; persisted
  #      data.stuck vs tickVerdict; config/state/error paths; SC-M1-25.
  #  8.2 Tier boundaries, purity, adapter confinement, and brand neutrality
  #      across the now-complete coordinator surface; three mutants (node:fs in
  #      contracts, Date.now in domain, OS-signal in domain) must fail.
  #  8.3 Determinism: two identical roots byte-identical data/text; ambient
  #      scan; fresh instance/reopened store; zero model calls.
  #  8.4 Idempotency: second identical tick appends only its own lease pair and
  #      no decision/restart/stuck/wake/exhaustion record, and performs no
  #      destructive action; liveness controls still fire.
  #  8.5 Privacy: canaries and a synthetic registered secret across every
  #      command/record/evidence/error; bounded key=value <= 512 UTF-8 bytes;
  #      no credential read.
  #  8.6 Performance/read cost: synthetic reference store, injected clock,
  #      tick p95 <= 2000 ms, status p95 <= 1000 ms, start p95 <= 2000 ms
  #      excluding spawn, one verified read per store per tick, <= 64 KiB /
  #      <= 32 lines.
