  # ---------------------------------------------------------------------------
  # Phase 3 — Additive coordinator state records
  #
  # Goal: implement the six record kinds over the delivered artifact boundary
  # with validated appends, verified reads, contiguous-ordinal checks, and
  # crash durability. STATE_SCHEMA_VERSION unchanged; no migration.
  #
  # Tasks (TC-COORD-020, 021, 022, 023, 026, 030, 031, 036, 038, 039, 050,
  #        051, 053, 083):
  #  3.1 packages/core/src/state/coordinator.ts: iteration, restart, two-phase
  #      stuck, exhaustion, wake, fence records with kind/schema/required-field/
  #      vocabulary validation; append through the delivered fenced artifact
  #      boundary with post-append coverage; verified reads; torn/unknown/
  #      gapped classification. Every coordinator fold (lease, stuck, last
  #      decision, last wake) orders by ledger sequence; recordedAt is
  #      descriptive only. stuckId = the active expectation's iterationId, and
  #      a replay appends nothing.
  #  3.2 Restart ordinal fold per budget epoch: contiguous from 1; a torn or
  #      gapped ordinal is unevaluable and never count 0; a replayed ordinal
  #      appends nothing; namespace is coordinator/<coordinatorId>, disjoint
  #      from lane and economics.
  #  3.3 Fence record carriers are the append-only instance lease:
  #      acquired / stop-requested / released / stale-takeover with instanceId,
  #      holder, pid, processStartTimeMs, supervisorMode, externalUnit,
  #      previousHolder, fenceAgeMs; durable and status-readable. The latest
  #      record by ledger sequence folds to the instance identity (instanceId,
  #      pid, holder, startedAt = its acquisition record time, supervisorMode,
  #      externalUnit); there is no separate instance record and no heartbeat
  #      or lease-refresh record. A stale-takeover is itself the new
