  # ---------------------------------------------------------------------------
  # Phase 2 — Pure coordinator supervision domain
  #
  # Goal: implement every deterministic decision as pure functions over
  # injected facts. No I/O, clock, randomness, environment, CPU, process, or
  # model call.
  #
  # Tasks (TC-COORD-032, 033, 034, 037):
  #  2.1 Lifecycle decision: join-live / resume-context / spawn-fresh with the
