  # ---------------------------------------------------------------------------
  # Phase 5 — Delivered DaemonProcessPort reuse and adapter capabilities
  #
  # Goal: reuse the delivered DaemonProcessPort (additively extended in Phase 1
  # with SIGKILL and optional startTimeMs) for alive/kill identity and
  # kill-with-grace, and map the delivered harness liveness report to the
  # domain's new-turn/progress facts. The domain stays pure, the harness
  # session port keeps resume/spawn/progress, and no second process port is
  # created.
  #
  # Tasks (TC-COORD-029, 042, 085; TC-040/041/043/044/045 are proven at the
  # Phase-6 command gate where the exit/status composition exists):
  #  5.1 packages/adapters/src/daemon/process.ts: implement the additive
  #      DaemonProcessPort capabilities — signal accepts "SIGKILL" for the
  #      grace-escalation half and the optional startTimeMs(pid) identity
  #      capability — beside the existing createNodeProcessPort. The
  #      coordinator's kill-with-grace helper uses the recorded
  #      session/process-tree handle and pid, probes alive via isAlive,
  #      verifies pid + processStartTimeMs before TERM (mismatch sends no
  #      signal and returns failed with killFailureReason=identity-mismatch),
  #      then TERM -> wait kill-grace -> conditional KILL with closed
  #      terminated/forced/failed outcomes. An ABSENT startTimeMs capability at
  #      kill time sends no signal and returns
  #      coordinator.process.capability-gap exit 2 BEFORE TERM. The adapter
  #      returns the closed outcome only: it appends no coordinator record,
  #      does not compose the phase=outcome append, and does not run the
  #      budget check (Phase 6, TC-040). No name/pattern kill and no shell
  #      interpolation.
  #  5.2 Map the delivered harness liveness report in
  #      packages/adapters/src/harness/liveness.ts and export it from
  #      packages/adapters/src/harness/index.ts: a positive token-delta OR
  #      positive session-traffic reading is newTurn=true/progressing=true;
  #      zero/negative is false; absent or unsupported is unknown (never
  #      zero). coordinator.progress-bound is the config-driven veto window.
  #      The mapping lives only in the adapter; no new package subpath, no new
  #      dependency, no boundary-rule loosening. Export the daemon-side kill
  #      helper from packages/adapters/src/daemon/index.ts.
  #  5.3 Capability ownership: an UNDECLARED process-port alive, kill, or
  #      start-time identity capability -> coordinator.process.capability-gap
  #      exit 2 with zero kill calls and no lease record (at claim time: no
  #      takeover); a DECLARED alive probe that returns no answer is unknown
  #      and uses the 2 x collection-interval age fallback, never a gap;
  #      absent startTimeMs at kill time is a gap before TERM; resume uses the
  #      delivered harness resume as a decision input (no error); spawn uses
  #      the delivered harness identities; progress absence is the unknown
  #      evidence class (Phase 6 composes the projection).
  #  5.4 Adapter-level tests: coordinator-kill-grace (adapter-only half:
  #      TERM/grace/KILL outcome, absent-startTimeMs gap before TERM, and
  #      identity failure with no record append), coordinator-kill-target,
  #      coordinator-new-turn, structure kill-target scan, tests/boundaries,
  #      fixture process-port.ts (phase log, fake clock, matching/mismatched
  #      pid + processStartTimeMs, declared/missing capabilities,
  #      positive/zero/absent liveness readings). The Phase-6 gate extends the
  #      same kill-grace file with the two-phase append and budget composition
  #      (TC-040).
  #
  # Verification:
  #   bun test tests/behaviour/coordinator-kill-grace.test.ts tests/behaviour/coordinator-kill-target.test.ts tests/behaviour/coordinator-new-turn.test.ts tests/structure/coordinator-kill-target.test.ts
  #   bun test tests/boundaries; pnpm check:boundaries
  #
  # Exit: TERM -> grace -> conditional KILL exact over the delivered
