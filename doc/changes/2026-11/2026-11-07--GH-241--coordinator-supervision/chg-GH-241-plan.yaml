  # ---------------------------------------------------------------------------
  # Phase 6 — Coordinator CLI family, foreground loop, and edge composition
  #
  # Goal: compose the command family over injected state, config, process,
  # blocker, clock, id, brand, and harness seams; the handler is pure (no
  # stream writes, no exit literals) and the edge is the only writer/projector.
  # `start --foreground` runs the declared foreground loop over an injected
  # cycle driver; the loop body reuses the tick evaluation cycle claim-free.
  #
  # Tasks (TC-COORD-003, 004, 010, 011, 012, 013, 014, 015, 016, 017, 018,
  #        024, 025, 035, 040, 041, 043, 044, 045, 052, 054, 055, 060, 061,
  #        062, 065, 070, 071, 072, 073, 074, 075, 093, 094, 095, 096, 097,
  #        098, 099):
  #  6.1 packages/cli/src/commands/coordinator.ts: start --foreground
  #      [--fresh-budget], stop, status [--live], tick; closed grammar. v1 is
  #      foreground-only: a bare start without --foreground returns
  #      fallback.invocation exit 1 naming --foreground and the M1-S18
  #      detached/OS-unit seam; supervisorMode is exactly foreground, detached
  #      is reserved and never produced, externalUnit is absent, and the
  #      supervisor records its own pid/processStartTimeMs. The
  #      delivery.coordinator.v1 data carries the lease-folded instance, the
  #      last persisted data.stuck verdict, and the separate tickVerdict that
  #      only tick populates (null for start/stop/status) and whose
  #      phase/reason/evidence are nullable when verdict=progressing; status
  #      never mutates state or evaluates; the text renderer is deterministic
  #      and bounded.
  #  6.2 packages/cli/src/edge.ts composition: state dir + instance lease +
  #      per-append state write fence (the Phase-3 non-claim helper), config,
  #      fake-able process port, blocker verified read/append, injected clock,
  #      ids, brand, harness session facts, and the injected cycle
  #      driver/clock seam for the foreground loop; register exactly one
  #      coordinator family; no daemon/dispatch/supervise command.
  #  6.3 Instance-lease semantics: start and tick share ONE claim/takeover
  #      critical section — acquireFence -> re-read the lease fold and
  #      alive(handle) under the fence -> append one acquired (released/absent)
  #      or one stale-takeover (dead holder), or refuse -> releaseFence; the
  #      under-fence read is the tick's single verified state read. Decide
  #      liveness BEFORE age: alive=true -> held and refused
  #      coordinator.already-running exit 2 regardless of lease age; alive=false
  #      -> takeover-eligible; a DECLARED probe that returns no answer is
  #      unknown -> takeover only when the lease age exceeds 2 x
  #      collection-interval, otherwise held/refused; an UNDECLARED alive
  #      capability is coordinator.process.capability-gap exit 2 with no lease
  #      record and no takeover (never an age takeover, never
  #      already-running). Lease age is the injected now minus the acquisition
  #      record's recordedAt (acquired/stale-takeover); a stop-requested does
  #      not re-anchor it. CLAIM ACQUIRE on state.lock.busy reads
  #      fenceStatus(); when stale it performs exactly one recoverFence and
  #      exactly one acquire retry; ONLY a still-busy or non-stale result maps
  #      to coordinator.already-running exit 2 with no lease record and no
  #      append, the holder named when the lease is readable, and a
  #      remediation hint that another state writer may hold the shared lock.
  #      NON-CLAIM appends use the Phase-3 helper (same one-shot recovery;
  #      still-busy maps to state.lock.busy). A stale-takeover is itself the
  #      new acquisition (new holder/pid/processStartTimeMs, previousHolder,
  #      fenceAgeMs) and is never followed by a second acquired.
  #      start appends the acquisition; stop appends stop-requested and reports
  #      requested=true/released=false (or not-running at exit 0 when the lease
  #      is released, the holder is dead, or a declared probe is unknown and
  #      age > 2 x interval), never releases another process's handle; the live
  #      supervisor appends released at the next cycle boundary. A successful
  #      (claiming) tick appends exactly one lease pair (acquired+released or
  #      stale-takeover+released) with released attempted in a finally on every
  #      claimed tick including non-zero exits, and no other quiet record; a
  #      refused tick appends nothing; no heartbeat/refresh record exists. The
  #      latest record by ledger sequence folds the instance identity; no
  #      separate instance record (TC-COORD-010/011/012/015/017/018/093/094/
  #      095/096/097/098).
  #  6.4 Lifecycle application and two-phase stuck composition: join/resume/
  #      spawn; killed-mid-iteration recovery without re-executing closed-out
  #      work; --fresh-budget only when stopped; status reports the instance
  #      fold, lease action, decision, restart count/bound, the last persisted
  #      stuck verdict with non-null phase/reason/evidence, tickVerdict=null,
  #      wake, and escalation and degrades --live honestly; stuck-unevaluable
  #      appends exactly one phase=verdict record (no phase=outcome) and, like
  #      a torn/gapped budget, returns the delivered state identity at exit 2
  #      with no kill or restart. The supervisor — not the adapter — composes
  #      the end-to-end kill sequence: after the adapter returns
  #      terminated/forced/failed, append phase=outcome under the same
  #      stuckId = iterationId and only then run the budget check; a
  #      phase=verdict was appended before the kill, and the fold is by ledger
  #      sequence (TC-COORD-040; TC-COORD-012/013/014/016/024/025/035/041/043/
  #      044/045/054/055).
  #  6.5 Escalation and wake integration: exactly one owner decision-needed
  #      question, terminal receipt after the question, publish failure exit 2
  #      with exhausted-escalation-failed, idempotent reuse returning
  #      exhausted-escalated (never "escalated"); before the delivered blocker
  #      append the publish path performs the same one-shot stale-fence
  #      recovery (fenceStatus; stale -> one recoverFence + one retry), and a
  #      still-busy fence after that recovery is
  #      coordinator.escalation.publish-failed exit 2 with consequence unknown;
  #      the delivered blocker append acquires its own state write fence and
  #      composes without a lock collision (no
  #      packages/core/src/state/blockers.ts change); strict pickup wake with an
  #      absent status counting as open and persisted woken only,
  #      already-woken/answered-before-wake/delivery-failed/no-pickup as tick
  #      results (no-pickup only for a non-rank-1 head, a non-coordinator
  #      audience, or an explicitly non-open status), retry without duplicate
  #      records.
  #  6.6 Foreground supervision loop (AC-F1-5):
  #      packages/cli/src/commands/coordinator-loop.ts — a declared loop over
  #      an injected cycle driver/clock seam (bounded, cancellable; no ambient
  #      wall clock, setTimeout, or real timer) whose cycle body is the
  #      claim-free evaluation cycle (the same evaluation cycle as tick minus
  #      claim/release) because the live lifetime lease would refuse a claiming
  #      tick. One acquisition append at loop start (acquired or
  #      stale-takeover) and one released at loop exit for the supervisor's
  #      lifetime, and no per-cycle lease record. Declared exits: a
  #      stop-requested observed at the cycle boundary appends released and
  #      exits 0; a fatal cycle error exits with its typed {0,1,2} identity
  #      after attempting released in a finally; SIGINT/SIGTERM appends
  #      released and exits 0 after a successful release, or exits 2 with the
  #      released append-failure identity. The driver lets tests advance N
  #      cycle boundaries in-process without a second process (TC-COORD-099).
  #  6.7 Tests: coordinator-grammar, envelope, start, stop, tick, status,
  #      instance-lease, fence-records, fence-stale, lease-liveness,
  #      claim-race, claim-serialized, claim-stale-fence,
  #      claim-capability-gap, tick-takeover, foreground-loop, kill-grace
  #      (end-to-end composition), decision-durability, decision-recovery,
  #      fresh-budget, restart-exhausted, restart-torn, stuck-unevaluable,
  #      kill-failed, kill-fence, capability-gap, kill-identity,
  #      escalation-publish/idempotent/failed/reuse,
  #      wake-pickup/answered/dedupe/paths/failed/next; structure coordinator-
  #      regime; exit-code-literals; golden/coordinator; fixture harness.ts,
  #      blockers.ts, claim-race.ts, cycle-driver.ts, and the
  #      liveness/crashed-holder roots.
  #
  # Verification:
  #   bun test tests/behaviour/coordinator-grammar.test.ts tests/behaviour/coordinator-envelope.test.ts tests/checks/exit-code-literals.test.ts
  #   bun test tests/behaviour/coordinator-start.test.ts tests/behaviour/coordinator-stop.test.ts tests/behaviour/coordinator-tick.test.ts tests/behaviour/coordinator-status.test.ts tests/behaviour/coordinator-instance-lease.test.ts tests/behaviour/coordinator-fence-records.test.ts tests/behaviour/coordinator-fence-stale.test.ts tests/behaviour/coordinator-lease-liveness.test.ts
  #   bun test tests/behaviour/coordinator-claim-race.test.ts tests/behaviour/coordinator-claim-serialized.test.ts tests/behaviour/coordinator-claim-stale-fence.test.ts tests/behaviour/coordinator-claim-capability-gap.test.ts tests/behaviour/coordinator-tick-takeover.test.ts
  #   bun test tests/behaviour/coordinator-foreground-loop.test.ts tests/behaviour/coordinator-kill-grace.test.ts tests/behaviour/coordinator-fresh-budget.test.ts
  #   bun test tests/behaviour/coordinator-decision-recovery.test.ts tests/behaviour/coordinator-decision-durability.test.ts
  #   bun test tests/behaviour/coordinator-restart-exhausted.test.ts tests/behaviour/coordinator-restart-torn.test.ts tests/behaviour/coordinator-stuck-unevaluable.test.ts tests/behaviour/coordinator-kill-failed.test.ts tests/behaviour/coordinator-kill-fence.test.ts tests/behaviour/coordinator-kill-identity.test.ts tests/behaviour/coordinator-capability-gap.test.ts
  #   bun test tests/structure/coordinator-regime.test.ts tests/golden/coordinator.test.ts tests/behaviour/coordinator-escalation-*.test.ts tests/behaviour/coordinator-wake-*.test.ts
  #
  # Exit: one bounded envelope and one {0,1,2} exit per outcome; the instance
  # lease (four actions, liveness-first with declared-unknown age fallback and
  # undeclared-alive capability gap, atomic claim with the claim-acquire vs
