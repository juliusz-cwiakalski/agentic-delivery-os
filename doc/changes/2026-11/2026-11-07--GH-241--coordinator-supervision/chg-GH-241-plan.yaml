#   - Schema: doc/spec/features/feature-plan-schema.md and
#             doc/templates/implementation-plan-template.md
#
# REVISION NOTE (v1.4): aligns to spec v1.4 and test plan v1.4 and applies the
# DoR iteration-3 remediation. AF3-07 (delivery_planning-owned): the Phase-6
# gate now executes TC-COORD-024 and TC-COORD-025. RF3-05 / AC-F1-5: Phase 6
# declares and scopes the foreground supervision loop (claim-free cycle body,
# injected cycle-driver/clock seam, one lifetime acquisition/released pair,
# cycle-boundary stop observation, declared stop/fatal/signal exits) and
# executes TC-COORD-099. RF3-01: claim acquire and non-claim appends are two
# named state-fence rules (one recoverFence plus one retry on a stale lock;
# the claim refuses with coordinator.already-running only for a still-busy or
# non-stale fence, a non-claim append maps a still-busy fence to
# state.lock.busy); TC-COORD-098 proves the claim recovery. RF3-03: a
# declared-but-unanswered alive probe is unknown (age fallback), while an
# UNDECLARED alive capability at claim time is
# coordinator.process.capability-gap exit 2 with no lease record and no
# takeover; TC-COORD-097 proves it. The process port is the delivered
# DaemonProcessPort with an additive contract extension (signal accepts
# SIGKILL, optional startTimeMs(pid)) implemented in
# packages/adapters/src/daemon/process.ts; the former new-port file is gone
# from every phase. RF3-02 / AF3-01 / AF3-02 / AF3-04 / AF3-05: tickVerdict is
# null for start/stop/status, released is attempted in a finally on every
# claimed tick, the escalation publish path performs one stale-fence recovery
# before escalation.publish-failed, lease age anchors to the acquisition
# record's recordedAt, and unevaluable is exactly one phase=verdict record
# with no phase=outcome. Adds TC-COORD-096 (serialized second claim) at the
# Phase-6 gate. 76/76 TCs, 50/50 ACs.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - Exactly two two-segment coordinator codes join RESERVED_TWO_SEGMENT_CODES
#     in BOTH scripts/checks/error-table-sync.ts and
#     tests/structure/error-table.test.ts: coordinator.already-running and
#     coordinator.restart-budget-exhausted (set 22 -> 24; table 99 -> 105).
#     The other four coordinator identities are three-segment. No wildcard.
#   - STATE_SCHEMA_VERSION stays delivery.state.v1; six additive record kinds.
#   - Coordinator single-instance ownership is the append-only instance lease
#     carried by coordinator.fence records (acquired, released, stale-takeover,
#     stop-requested). The instance is folded from the latest record by LEDGER
#     SEQUENCE (recordedAt is descriptive only) into instanceId, pid, holder,
#     startedAt (the acquisition record time), supervisorMode, externalUnit.
#     No separate instance record. Liveness is decided before age:
#     alive=true -> held/refused regardless of age; alive=false ->
#     takeover-eligible; a DECLARED probe that returns no answer is unknown
#     and takeover-eligible only when the lease age exceeds 2 x
#     collection-interval; an UNDECLARED alive capability at claim time is
#     coordinator.process.capability-gap exit 2 with no lease record and no
#     takeover (never an age takeover). Lease age (the same quantity as
#     fenceAgeMs) is the injected now minus the acquisition record's
#     recordedAt (acquired or stale-takeover); a later stop-requested does not
#     re-anchor it. The claim is ONE fenced critical section: acquireFence ->
#     re-read lease fold + alive -> append one acquired or one stale-takeover,
#     or refuse -> releaseFence; the claim's under-fence read is the tick's
#     single verified state read. Two state-fence rules are distinct:
#     CLAIM ACQUIRE (start, tick) on state.lock.busy reads fenceStatus(); when
#     stale it performs exactly one recoverFence plus exactly one acquire
#     retry, and ONLY a still-busy or non-stale result maps to
#     coordinator.already-running exit 2 with no lease record and no append
#     (the remediation hint discloses that another state writer may hold the
#     lock); NON-CLAIM APPENDS perform the same one-shot recovery and map a
#     still-busy fence to the delivered state.lock.busy (a failed append is
#     state.write.failed). A stale-takeover is itself the new acquisition and
#     is never followed by a second acquired. start and tick share the
#     claim/takeover path, so a dead holder is recovered by tick. Each
#     successful (claiming) tick appends exactly one lease pair
#     (acquired+released or stale-takeover+released), with released attempted
#     in a finally on every claimed tick including non-zero exits and any
#     release failure disclosed, and no other quiet record; a refused tick
#     appends nothing; no heartbeat or lease-refresh records exist. The delivered state write fence is taken per append only;
#     stop is a request and the live supervisor appends released. No
#     contracts/state.ts change.
#   - In v1 the supervisor is FOREGROUND ONLY: start requires --foreground
#     (a bare start is fallback.invocation exit 1 naming --foreground and the
#     M1-S18 detached/OS-unit seam); supervisorMode is exactly foreground,
#     detached is a reserved closed value never produced, externalUnit is
#     absent, and the supervisor records its own pid/processStartTimeMs.
#   - The foreground loop is declared (AC-F1-5): its cycle body is the
#     claim-free evaluation cycle (the same evaluation cycle as tick minus
#     claim/release) because the live lifetime lease would refuse a claiming
#     tick; it waits through an injected cycle-driver/clock seam (bounded,
#     cancellable, no ambient clock, setTimeout, or real timer) so tests drive
#     N cycle boundaries in-process without a second process. It appends
#     exactly one acquisition record at loop start and exactly one released at
#     loop exit for the supervisor's lifetime, and no per-cycle lease record.
#     Exits are declared: a stop-requested observed at the cycle boundary
#     appends released and exits 0; a fatal cycle error exits with its typed
#     {0,1,2} identity after attempting released in a finally; SIGINT/SIGTERM
#     exits 0 after a successful released, or 2 with the released
#     append-failure identity when it cannot land.
#   - The reserved escalation slot predicate is payload-only:
#     type=decision-needed AND audience=owner AND lane=coordinator AND
#     ref=<coordinatorId>#<budgetEpochId> with exactly one '#' and both sides
#     non-empty. It renders first by index in both typed-questions and
#     blocker-questions, other questions follow in rank order up to seven, and
#     the lowest-ranked is displaced and counted as omitted inside the
#     eight-question bound. No coordinator-state read. The escalation publish
#     path performs the same one-shot stale-fence recovery before calling the
#     delivered blocker append; a still-busy fence after that recovery is
#     coordinator.escalation.publish-failed exit 2 with consequence unknown.
#   - Only a successful wake (outcome=woken) persists and consumes the
#     one-wake-per-question lifetime; already-woken, answered-before-wake,
#     delivery-failed, and no-pickup append no durable wake record. An absent
#     question status counts as open; no-pickup is only for a non-rank-1 head,
#     a non-coordinator audience, or an explicitly non-open status.
#   - coordinator.stuck is two-phase under one stuckId = the active
#     expectation's iterationId: phase=verdict with killOutcome=not-attempted
#     before the kill, phase=outcome after it, folded latest-wins by LEDGER
#     SEQUENCE (recordedAt is descriptive only); a replay appends nothing. An
#     unevaluable verdict appends exactly one phase=verdict record and no
#     phase=outcome (no kill is attempted). The closed reason field is
#     distinct from the restart reason:
#     stuck-artifact-evidence | evidence-unevaluable.
#   - Every coordinator fold — lease, stuck, last decision, and last wake —
#     orders by ledger sequence; recordedAt is descriptive only and never a
#     tie-break.
#   - The digest-input fingerprint is the state event-log cursor plus the open
#     coordinator-audience question count only. A new turn is a positive
#     token-delta OR session-traffic reading mapped by the adapter; absent maps
#     to unknown. coordinator.progress-bound (300000 ms) is the veto window.
#     No ready-to-merge, tracker, CI, or network composition.
#   - The process port is the delivered DaemonProcessPort, extended ADDITIVELY
#     (signal accepts "SIGKILL" for the grace-escalation half; optional
#     startTimeMs(pid) identity capability) and implemented in
#     packages/adapters/src/daemon/process.ts. No second process-lifecycle
#     port, and no harness resume/spawn/progress redeclaration. Before TERM
#     the port verifies the recorded pid plus processStartTimeMs; a mismatch
#     sends no signal and records killOutcome=failed with
#     killFailureReason=identity-mismatch; an ABSENT startTimeMs capability at
#     kill time sends no signal and returns
#     coordinator.process.capability-gap exit 2 BEFORE TERM. The adapter
#     returns the closed outcome only; the supervisor composes the
#     phase=outcome append and the budget check in Phase 6.
#   - Capability ownership is four-way: harness resume undeclared/unavailable
#     -> spawn-fresh reason session-interrupted (one ordinal, exit 0, no error);
#     harness spawn impossible/refused -> harness.capability.gap /
#     harness.spawn.refused exit 1; undeclared process-port alive, kill, or
#     start-time identity -> coordinator.process.capability-gap exit 2 with no
#     destructive action and no lease record (at claim time: no takeover);
#     a DECLARED probe that returns no answer is unknown, never a gap (alive
#     uses the age fallback); progress absent -> unknown evidence class, never
#     a failure or a kill.
#   - The observation payload separates the last persisted data.stuck verdict
#     (non-null phase/reason/evidence) from the per-tick tickVerdict, whose
#     phase/reason/evidence are nullable when verdict=progressing; progressing
#     is never persisted. tickVerdict is populated only by coordinator tick;
#     start, stop, and status report tickVerdict=null, and status never
#     mutates state or performs an evaluation.
#   - No CPU signal, no model call, no ambient clock/randomness/environment in
#     any decision or render path. No daemon command, control socket, lane
#     supervision, OS installer, or dispatch surface (M1-S18 / M1-S9 seams
#     only). No agent-prompt change (M1-S20).
#   - ceo-loop.sh remains byte-unchanged; the only status/brief change is the
#     declared reserved escalation slot.
#
# TC -> PHASE MAP (76/76; no orphan, every TC mapped exactly once; each phase's
# mapped TCs are fully provable at that phase's declared gate; Phase 9 carries
# no TC because its registry/man-page/changeset output is verified by TC-092 at
