#             50/50 AC coverage; SC-M1-25 clause map in section 3.4; section 7
#             is the file/command inventory this plan maps onto phases)
#   - DoR:    ./readiness-review/readiness-iter-3.md (RF3-01..RF3-05 and
#             AF3-01..AF3-08; prior RF2-01..RF2-12 and RF-01..RF-12 with
