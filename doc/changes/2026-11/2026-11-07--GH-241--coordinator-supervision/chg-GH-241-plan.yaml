#   - Spec:   ./chg-GH-241-spec.md (v1.4; F-1..F-10; 50 ACs; DEC-1..DEC-13;
#             DM-1..DM-11; EVT-1..EVT-7; NFR-1..NFR-15; Appendix A..H)
