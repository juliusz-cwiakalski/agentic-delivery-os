  # ---------------------------------------------------------------------------
  # Phase 8 — Integration behaviour and SC-M1-25
  #
  # Goal: prove the integrated surface over an in-process CLI, synthetic state
  # dir, fake process port, fake clock, fake harness capabilities, and fake
  # blocker ledger; pin determinism, privacy, performance, read cost, and the
  # seed scenario end to end.
  #
