# Execution companion: chg-GH-241-plan.md (same phases, tasks, AC/TC links,
# verification commands, exit criteria). When both plan files exist this YAML
# document is authoritative for `plan validate`; `plan diff` reads its scope.
#
# SOURCES (single source of truth; plan revision 1.2, 2026-11-07):
#   - Spec:   ./chg-GH-241-spec.md (v1.2; F-1..F-10; 45 ACs; DEC-1..DEC-13;
#             DM-1..DM-11; EVT-1..EVT-7; NFR-1..NFR-15; Appendix A..H)
#   - Tests:  ./chg-GH-241-test-plan.md (v1.2; 69 TCs TC-COORD-001..092;
#             45/45 AC coverage; SC-M1-25 clause map in section 3.4; section 7
#             is the file/command inventory this plan maps onto phases)
#   - DoR:    ./readiness-review/readiness-iter-1.md (RF-01..RF-12, A1/A2/A3/A6)
#   - Seed:   SC-M1-25 in doc/planning/oss-tooling/milestones/m1/test-scenarios.md
#   - Schema: doc/spec/features/feature-plan-schema.md and
#             doc/templates/implementation-plan-template.md
#
# REVISION NOTE (v1.2): aligns to spec v1.2 and test plan v1.2. Adds TC-018,
# TC-029, and TC-045; moves TC-092 to Phase 10; moves the composition-dependent
# kill/capability TCs (041/043/044/045) to the Phase-6 command gate; creates
# tests/golden/coordinator.test.ts and tests/structure/coordinator-regime.test.ts
# in Phase 6 where they are first needed; adds
# tests/behaviour/coordinator-new-turn.test.ts to Phase 5; and re-states the
# instance-lease, two-phase stuck, progress-bound, PID-identity, render-first
# reserved-slot, exhausted-escalated, absent-status pickup, and supervisor-mode
# contracts. 69/69 TCs, 45/45 ACs.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - Exactly two two-segment coordinator codes join RESERVED_TWO_SEGMENT_CODES
#     in BOTH scripts/checks/error-table-sync.ts and
#     tests/structure/error-table.test.ts: coordinator.already-running and
#     coordinator.restart-budget-exhausted (set 22 -> 24; table 99 -> 105).
#     The other four coordinator identities are three-segment. No wildcard.
#   - STATE_SCHEMA_VERSION stays delivery.state.v1; six additive record kinds.
#   - Coordinator single-instance ownership is the append-only instance lease
#     carried by coordinator.fence records (acquired, released, stale-takeover,
#     stop-requested), folded from the latest record into instanceId, pid,
#     holder, startedAt, supervisorMode (foreground|detached), externalUnit
#     (absent). No separate instance record. The delivered state write fence is
#     taken only for the duration of one append; stop is a request and the live
#     supervisor appends released; stale takeover uses process-port alive(handle)
#     or lease age > 2 x collection-interval, with no recoverFence and no
#     contracts/state.ts change.
#   - The reserved escalation slot predicate is payload-only:
#     type=decision-needed AND audience=owner AND lane=coordinator AND
#     ref=<coordinatorId>#<budgetEpochId> with exactly one '#' and both sides
#     non-empty. It renders first by index in both typed-questions and
#     blocker-questions, other questions follow in rank order up to seven, and
#     the lowest-ranked is displaced and counted as omitted inside the
#     eight-question bound. No coordinator-state read.
#   - Only a successful wake (outcome=woken) persists and consumes the
#     one-wake-per-question lifetime; already-woken, answered-before-wake,
#     delivery-failed, and no-pickup append no durable wake record. An absent
#     question status counts as open; no-pickup is only for a non-rank-1 head,
#     a non-coordinator audience, or an explicitly non-open status.
#   - coordinator.stuck is two-phase under one stuckId: phase=verdict with
#     killOutcome=not-attempted before the kill, phase=outcome after it, folded
#     latest-wins by recordedAt then ledger sequence. The closed reason field is
#     distinct from the restart reason: stuck-artifact-evidence |
#     evidence-unevaluable.
#   - The digest-input fingerprint is the state event-log cursor plus the open
#     coordinator-audience question count only. A new turn is a positive
#     token-delta OR session-traffic reading mapped by the adapter; absent maps
#     to unknown. coordinator.progress-bound (300000 ms) is the veto window.
#     No ready-to-merge, tracker, CI, or network composition.
#   - Before TERM the port verifies the recorded pid plus processStartTimeMs;
#     a mismatch sends no signal and records killOutcome=failed with
#     killFailureReason=identity-mismatch.
#   - Capability ownership is four-way: harness resume undeclared/unavailable
#     -> spawn-fresh reason session-interrupted (one ordinal, exit 0, no error);
#     harness spawn impossible/refused -> harness.capability.gap /
#     harness.spawn.refused exit 1; process-port alive/kill absent ->
#     coordinator.process.capability-gap exit 2, no destructive action;
#     progress absent -> unknown evidence class, never a failure or a kill.
#   - No CPU signal, no model call, no ambient clock/randomness/environment in
#     any decision or render path. No daemon command, control socket, lane
#     supervision, OS installer, or dispatch surface (M1-S18 / M1-S9 seams
#     only). No agent-prompt change (M1-S20).
#   - ceo-loop.sh remains byte-unchanged; the only status/brief change is the
#     declared reserved escalation slot.
#
# TC -> PHASE MAP (69/69; no orphan, every TC mapped exactly once; each phase's
# mapped TCs are fully provable at that phase's declared gate; Phase 9 carries
# no TC because its registry/man-page/changeset output is verified by TC-092 at
# the Phase-10 gate):
#   Phase 1:  TC-COORD-001, TC-COORD-081, TC-COORD-082
#   Phase 2:  TC-COORD-032, TC-COORD-033, TC-COORD-034, TC-COORD-037
#   Phase 3:  TC-COORD-020, TC-COORD-021, TC-COORD-022, TC-COORD-023,
#             TC-COORD-026, TC-COORD-030, TC-COORD-031, TC-COORD-036,
#             TC-COORD-038, TC-COORD-039, TC-COORD-050, TC-COORD-051,
#             TC-COORD-053, TC-COORD-083
#   Phase 4:  TC-COORD-056, TC-COORD-080
#   Phase 5:  TC-COORD-029, TC-COORD-040, TC-COORD-042, TC-COORD-085
#   Phase 6:  TC-COORD-003, TC-COORD-004, TC-COORD-010, TC-COORD-011,
#             TC-COORD-012, TC-COORD-013, TC-COORD-014, TC-COORD-015,
#             TC-COORD-016, TC-COORD-017, TC-COORD-018, TC-COORD-024,
#             TC-COORD-025, TC-COORD-035, TC-COORD-041, TC-COORD-043,
#             TC-COORD-044, TC-COORD-045, TC-COORD-052, TC-COORD-054,
#             TC-COORD-055, TC-COORD-060, TC-COORD-061, TC-COORD-062,
#             TC-COORD-065, TC-COORD-070, TC-COORD-071, TC-COORD-072,
#             TC-COORD-073, TC-COORD-074, TC-COORD-075
#   Phase 7:  TC-COORD-063, TC-COORD-064
#   Phase 8:  TC-COORD-002, TC-COORD-084, TC-COORD-086, TC-COORD-087,
#             TC-COORD-088, TC-COORD-091
#   Phase 9:  (none; TC-092 is verified at the Phase-10 gate)
