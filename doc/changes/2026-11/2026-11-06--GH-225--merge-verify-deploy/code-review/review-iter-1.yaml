  - id: F-1
    severity: medium
    confidence: high
    category: correctness
    location: packages/cli/src/commands/verify-deploy.ts:113
    message: >-
      The deploy refusal summary joins ALL trace artifact names with no count cap, per-name
      clamp, or +N mark (`artifacts=${...join(",")}`; missing-steps names are likewise unclamped),
      while steps are bounded via renderStepEvidence. normalizeDeployTrace
      (packages/adapters/src/github/deploy-trace.ts) does not bound the payload either, and
      diagnosticFor (packages/cli/src/index.ts:287) prints error.summary verbatim — so a large
      provider trace produces an unbounded human failure dump. This violates NFR-4 ("All bounds
      enforced and marked; no unbounded dump path") and the feature doc's Invariants claim;
      TC-DEPLOY-009 asserts bounds only on the verified path.
    suggestion: >-
      In refusalSummary, slice artifact names to DEPLOY_MAX_ARTIFACTS with DEPLOY_MAX_NAME_CHARS
      per-name clamping and an explicit +N omission mark (mirror renderStepEvidence), clamp
      missing-steps names, and extend TC-DEPLOY-009 with an over-cap refusal fixture asserting
      the 24-line/4096-byte human bounds and the +N mark on a negative verdict.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-2
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/merge-transaction.ts:421
    message: >-
      Two appendTransaction results are swallowed — the record-less convergence replay (line 421)
      and the landing-unverified outcome record (line 708). A failed fenced append on these paths
      is neither classified nor surfaced, violating NFR-7 ("a failed append is a classified
      failure"; "0 silent partial records"). The landing-unverified record is exactly what
      GAP-10's "a re-run re-verifies rather than re-lands" depends on: if its append silently
      fails and a later request-detail read does not yet show merged, a re-run can attempt a
      second landing.
    suggestion: >-
      Check both results; keep the verdict (merged / landing-unverified respectively) but never
      silently: surface the append-failure code as declared evidence (a failed post-landing step
      or the refusal detail), and pin the behaviour with a fault-injection test on both paths
      (append fails -> verdict unchanged, failure declared, re-run converges without re-landing).
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
