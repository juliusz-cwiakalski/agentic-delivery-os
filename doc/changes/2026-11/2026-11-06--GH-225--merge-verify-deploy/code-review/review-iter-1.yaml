    location: packages/adapters/src/git/merge.ts:218
    message: >-
      Post-landing branch deletion uses `git branch -D` (force-delete form). This matches the
      existing seam precedent (git/index.ts:223), is the only working form after a squash
      (branch commits are never base ancestors, so `-d` would refuse), is not a force path in
      the F-7/GAP-14 sense (no push, no history rewrite, no conflict bypass; protected refs
      guarded), and GAP-14's scan targets push/reset/force constructs. The seam supports an
      optional expectedHead compare-and-delete that the edge does not pass.
    suggestion: >-
      Optional hardening only: pass expectedHead (the pre-landing branch head) from the edge
      composition so deletion is compare-and-delete; no action required for compliance.
