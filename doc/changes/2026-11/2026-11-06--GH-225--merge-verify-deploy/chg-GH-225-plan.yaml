# GH-225 implementation plan — M1-S4: Merge and verify-deploy engine
#
# Sources (single source of truth):
#   - Spec:  ./chg-GH-225-spec.md (v1.1; F-1..F-8; 18 ACs AC-F1-1..AC-F8-3;
#     NFR-1..9; EVT-1..3; DM-1..5; DEC-1..DEC-13; Appendix C amendment record —
#     the test plan's sixteen gap readings GAP-1..GAP-16 adopted as spec truth)
#   - Test plan: ./chg-GH-225-test-plan.md (49 TCs: TC-MERGE-001..039,
#     TC-DEPLOY-001..010; 35 suite files; binding in-process harness §4.1;
#     non-vacuity contract §4.2; execution order §7)
#
# GAP-1/A-T2 mapping obligation: all 49 TCs are mapped onto Phases 1–7 below
# without reshaping any TC's behaviour, records, reasons, exits, bounds,
# assertions, or AC/NFR/SC mapping. Per-phase `coverage` entries carry the
# mapping; TCs whose structure half and behaviour half land in different phases
# are marked with the completing phase. Spec v1.1 and the test plan were
# cross-checked: zero inconsistencies found (DEC-13 adopted every gap reading;
# nothing here deviates — a real deviation would reopen the test plan, not ship).
#
# Delivery decisions recorded by this plan (the items the spec/test plan leave
# delivery-bound; recorded against the spec per the GAP-7/OQ discipline):
#   - Waiver declaration grammar (GAP-7/OQ-T6): `--waive <gate-id>` plus
#     `--waived-by <principal>` on the merge surface. Behaviour (declaration
#     names gate and authorizer; verification precedes recording), record
#     content, ordering, and refusal identities are pinned, not rebound.
#   - Deploy expectation source (GAP-3/OQ-T2): configuration-declared expected
#     steps and artifact patterns as a third key of the typed `merge` config
#     branch (`merge.deploy-expectations`); the provider-declared fact serves
#     where the delivered provider facts expose it; no declared expectation is
#     fail-closed never-`verified`.
#   - Dry-run envelope reporting (GAP-5/OQ-T4): the pre-existing record's
#     envelope is NOT additionally reported (minimal pinned reading, unasserted).
#   - No-force assertion technique (GAP-14/OQ-T12): the git merge seam's
#     operation union declares no force variant (structure assertion), plus a
#     production-surface scan with a mandatory failing control fixture; a
#     control-less pass is vacuous.
#   - Platform-fault identity reuse (GAP-8/OQ-T7): provider/state faults inside
#     `merge`/`verify deploy` reuse declared existing platform/state rows; no
#     new fault row is added to either new code family.
#   - Observational scope additions (review F-6): `packages/cli/src/classify.ts`
#     (the runtime family recognizer used by the task-1.4 sync check),
#     `packages/cli/src/output/deploy-text.ts` (the phase-5 deploy surface),
#     `biome.json` (formatter exclusion for the new goldens), and the phase-7
#     doc reconciliation breadth beyond `scope.files` (`change-lifecycle.md`,
#     `definition-of-done.md`, ubiquitous-language, architecture-overview,
#     `nonfunctional.md`, and four extra feature specs). All are legitimate and
#     recorded here so plan-diff reconciliation is explicit.
#
# Tier rationale: `full` — 8 capabilities, 18 ACs, 49 automated TCs,
# cross-package delivery (core contracts + config + state + domain, adapters
# github/git, CLI command surface), high security impact (spec front matter).
# All phases are delivery kind; the plan-level defaultLeases/defaultWeightClass
# apply. Per-phase completion artifacts: one Conventional Commit per phase (the
# `summary` key, landed via @committer's atomic land-and-record) plus the
# `testGate` commands passing; typed doneArtifacts slots are declared on the
# final phase where the evidence exists.
#
# Invariants carried by every phase (spec §21, NFR-6, GAP-14): the five
# built-in gate ids stay reserved and mandatory in any declared set; verify
# gates verdict bytes stay golden-identical despite the EVT-1 append; no daemon
# merge path exists; the merge command is the only landing producer; no
# force-capable operation exists anywhere in the mutation vocabulary; branding
# seam (binary name from config, no product literals); secrets/payloads/titles/
# bodies/log lines never in output or records; bounded reads/writes per NFR-2/3/4.

