decisions:
  - text: "Scope interpretation of the backlog task 'memory-publish verification' (defined nowhere else in the planning corpus): it is part of the teardown task ('restore on every exit'), not a new command surface. Teardown verifies that agent-memory publications made under the lane (the .ai/memory tree) are either already published (committed) or preserved and reported with evidence in the teardown restoration report; teardown never silently discards or clobbers them. Rationale: the shipped-contract pack (m1/contracts.md watchdog entry + commands/watchdog.md man page) defines only preflight/teardown/liveness outputs; the AC's 'refused or restored with evidence' clause and the repo memory rules (unpublished memory = stranded work) support the teardown framing. Reversible; confirmed at the open-PR human gate. Recorded in the ticket decision log."
