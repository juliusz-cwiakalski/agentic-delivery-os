  - text: >-
      Plan phase 1 complete (commit eb739f19): the GAP-2 token-bearing capture
      `tests/fixtures/harness/stream/opencode-v2.2.5-tokens.jsonl` (real
      v2.2.5 completion-frame shape, synthetic redacted content, README
      provenance row, no explicit calls field — omission degrades, never
      fabricates) and the telemetry v2 contract declaration
      `packages/core/src/contracts/telemetry.ts` re-exported through
      `contracts/index.ts`: the brand-neutral storage identity
      `delivery.telemetry.storage.v1` with the re-read migration rule
      (GAP-7/DM-5), the `harness.telemetry.step` and `harness.telemetry.baseline`
      record families with pinned schema ids and key prefixes (OQ-T2 §1), the
      frame vocabulary resolved by the capture (OQ-T1), the 0.02 tolerance
      (DEC-2), the within/outside/unavailable verdict set (GAP-5/DEC-5), the
      stream-ingest/closeout-capture/combined reading bases, the additive
      warning additions `unattributable-step` and
      `baseline-session-excluded` spread over the delivered vocabulary (GAP-4),
      the exactly-five breakdown fields, the five v2 data keys beside the
      untouched six (DEC-6), the exclude-and-disclose unattributed-dimension
      rule, the OQ-T4 session-dedup combination constant, and the ingest sink
      port. Scenario module gains the token-bearing/omission/drift builders for
      matrices I-01..I-05. Gate: `pnpm typecheck` green; telemetry-contract +
      telemetry-imports 18 pass / 0 fail; content-inventory + spend-contract
      19 pass / 0 fail; fixture-privacy 3 pass; exports-parity 5/5 publishables
      OK; ambient-globals 182 neutral-set files clean. Inventory and executable
      allowance registered for the new contract module.
    type: "info"
    date: "2026-11-12"
  - text: >-
      Plan phase 2 complete: the capture pipeline end to end. Pure counting and
      attribution landed as `packages/core/src/domain/telemetry-ingest.ts`
      (frame decode over the committed v2.x.y framing, five token classes with
      present-zero distinguished from omitted, cost/calls null-when-missing,
      drift disclosed as version-drift, per-reason ingest tally) and
      `telemetry-attribution.ts` (five dimensions joined from the injected
      economics session identity and claimed audit identity, absent dimensions
      excluded with unattributable-step, never defaulted). Storage landed as
      `packages/core/src/state/telemetry.ts`: fenced step and session-baseline
      families under the declared record kinds and key prefixes, strict payload
      validation that classifies damage as `state.store.torn`, the re-read
      migration reader at the declared next version, session-close baseline
      capture through the injected read-only totals read, and one verified
      multi-family read for the spend side. The adapter attaches ingest beside
      the delivered drain through an injected per-spawn sink (frames observed
      non-gatingly, session close captured best effort; drain, handle
      acquisition, and completion evidence unchanged); the opencode totals
      reader performs one bounded read-only SUM query per session; the edge
      composes the sink and production wires it into the opencode port; the new
      `tests/fixtures/telemetry/` builder seeds steps, baselines, v1 records,
      economics restarts, transitions, and recording substrates. Owning TCs:
      TC-TELEMETRY-001..008, 010, 012, 013. Narrow gate: `pnpm typecheck` green;
      telemetry-ingest/attribution/storage-migration/storage-damage/
      storage-growth 38 pass / 0 fail; harness-opencode-stream and
      harness-stream-hygiene controls green; telemetry-imports and
      content-inventory green (inventory and executable allowances registered);
      ambient-globals 184 files clean; workspace-entrypoints green.
    type: "info"
    date: "2026-11-13"
  - text: "Plan phase 2 commit: 245aed33 (capture pipeline)."
    type: "info"
    date: "2026-11-13"
  - text: >-
      Plan phase 3 complete: the extended read-side fold. `contracts/spend.ts`
      keeps the exactly-six `SPEND_DATA_KEYS` and adds the declared v2 types
      (breakdown rows/set, cost totals, phase timing, `SPEND_V2_TRUNCATION_TARGETS`)
      beside them under the kept `delivery.spend.v1` identity (DEC-6).
      `domain/spend.ts` folds both capture planes: the six v1 keys keep their
      names and semantics on v1-only stores, and the five v2 keys land additively
      — five-dimension breakdowns over the includes-null rows (sums equal the
      totals), cost-bearing totals in harness-reported units with sparsity
      disclosed, per-phase timing summaries derived from `phase.transition` with
      stall/restart intervals joined from the delivered economics records,
      `telemetryState: present`, and the declared-tolerance reconciliation block
      (observed vs summed harness baseline, one verdict, excluded-session count
      with the closed warning, unavailable when no baseline exists — never
      `within`). The OQ-T4 session-dedup arithmetic is the single selection rule;
      absence keys off telemetry records of either plane, so a baseline-only
      store is still `spend.telemetry-absent` (S-06). Bounds extend to the
      breakdown arrays with a binary-search tail drop; totals and the
      reconciliation block are never truncated. `state/spend-reads.ts` composes
      every telemetry family in one verified pass plus transitions and economics
      restarts (three reads, constant with population). Owning TCs:
      TC-TELEMETRY-009, 011, 014, 015, 017, 018, 025, 026. Goldens regenerated
      deliberately with `bun run tmp/tmpdir/regen-spend-goldens.ts` (machine
      payloads gain the five v2 keys; over-cap human golden states the declared
      machine truncation). Narrow gate: `pnpm typecheck` green; telemetry-timing,
      telemetry-storage-coexistence, spend-v2-*, spend-absent, spend-store-damage,
      spend-contract, telemetry-contract, error-table, golden spend 170 pass / 0
      fail; error-table-sync OK (telemetry record-kind literals are reserved
      schema names, not error codes — scanner false positive fixed by declaring
      them); full suite 7754 pass with only the phase-7 bounds assertion and the
      phase-8 changeset assertion open by design.
      Unavoidable shared-file edits (all flagged for plan diff): the four
      delivered suites that pinned the exact six-key payload now pin six-plus-five
      (additive assertions only); the events additivity inventories (state file
      set, contract constant set, contract surface fixture) gained exactly the
      declared telemetry additions; three v1 mutant anchors moved with the fold's
      renamed locals, keeping each mutant's prohibited observable intact.
    type: "info"
    date: "2026-11-13"
