  # Gate:
  #   pnpm typecheck
  #   bun test tests/behaviour/telemetry-{ingest,attribution}.test.ts
  #   bun test tests/behaviour/telemetry-storage-{migration,damage,growth}.test.ts
  #   bun test tests/behaviour/{harness-opencode-stream,harness-stream-hygiene}.test.ts
