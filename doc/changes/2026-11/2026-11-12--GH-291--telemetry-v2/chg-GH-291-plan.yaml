        target: packages/core/src/contracts/telemetry.ts
        role: producer

  # ---------------------------------------------------------------------------
  # Phase 2 — The capture pipeline end to end (F-1, F-2, F-4; OQ-T2 §1).
  #
  # Goal: make telemetry exist per step while a session runs. The opencode
  # adapter attaches ingest beside the delivered drain: each decoded step
  # frame's five token classes, calls, and per-model cost are counted in
  # harness-reported units (never converted, NG-4); an omitted class or field
  # degrades with a closed-vocabulary warning and is excluded from sums
  # (I-01..I-07); drift degrades, never aborts; ingest failures are classified
  # counts (captured/degraded/failed) that never change the delivery's
  # outcome; per-frame work is bounded and constant-memory and the delivered
  # handle-acquisition, drain, and terminal-completion behavior is unchanged
  # (NFR-5, TC-004 re-runs the delivered stream suites as controls).
  # Attribution joins the delivered substrates only — session economics for
  # session/run identity, the audit ledger's claimed agent-role/lane identity
  # — producing the five dimensions on every stored record; an unattributable
  # step is classified degradation, never a guessed dimension (TC-006..008).
  # At stream close with an acquired session handle, ONE bounded read-only
  # per-session totals query through the delivered store-opener seam appends
  # the OQ-T2 baseline record via a fenced append; a failed read lands no
  # record and no fabricated figure. Storage is schema-versioned under its own
  # record families with re-read migration on a version bump (TC-010),
  # delivered `state.*` identities for damage (TC-012), and linear growth
  # (TC-013). The delivered closeout capture path is untouched (§16) — both
  # planes coexist in the store from this phase on.
  #
  # Composition: the dispatch spawn seam injects the ingest sink with the
  # store and substrate readers; the seam may land in either composition file
  # (both are declared). The new `tests/fixtures/telemetry/` builder seeds v2
  # step records, baseline records (present/partial/absent), economics and
  # audit substrate, and transition histories with literal timestamps.
  #
  # AC/TC coverage: AC-F1-1 (TC-001..005), AC-F2-1 (TC-006..008), AC-F4-1
  # (TC-010, TC-012), NFR-8 (TC-013), NFR-5 (TC-004).
