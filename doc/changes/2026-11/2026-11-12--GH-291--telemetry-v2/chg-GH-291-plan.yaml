# GH-291 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for the
# change. `plan validate`, `plan diff`, `plan overlap`, and `lint plan` read it
# directly.
#
# SOURCES (single source of truth):
#   - Spec:     ./chg-GH-291-spec.md (v1.0, 13 ACs — AC-F1-1, AC-F2-1, AC-F3-1,
#               AC-F4-1, AC-F5-1..3, AC-F6-1..2, AC-F7-1, AC-F8-1..2, AC-N1-1;
#               F-1..F-8; DM-1..DM-6; NFR-1..NFR-8; DEC-1..DEC-6; RSK-1..RSK-7;
#               §7.1 in-scope incl. planning-page maintenance; §8.5 v1 additive
#               compatibility; §10 observability discipline; §16 affected
#               components (closeout transaction UNCHANGED); §17 AC table;
#               Appendix B pinned scenarios SC-M2-S14-01/02; Appendix C
#               consumers). Key adjudications this plan consumes as pinned:
#               DEC-2 tolerance 0.02; DEC-3 opencode-scoped ingest; DEC-4
#               closeout-fold-not-absence; DEC-5 summed baseline, one verdict,
#               exclusion with warning, no-baseline = classified unavailability;
#               DEC-6 `delivery.spend.v1` identity kept, additions beside the
#               six keys.
#   - Tests:    ./chg-GH-291-test-plan.md (v1.0, 39 TCs TC-TELEMETRY-001..039;
#               13/13 AC coverage; reconciliation verdict matrix R-01..R-08;
#               telemetry-state/fold-basis matrix S-01..S-09; ingest degradation
#               matrix I-01..I-07; exit/identity oracle §4.6; binding fixture
#               contract §4.1; non-vacuity contract §4.2; §4 layer table; §7
#               automation map; gaps GAP-1..GAP-7; open questions OQ-T1..T4).
#               GAP-1 (this plan's TC mapping) is satisfied below WITHOUT
#               reshaping any TC's behavior, oracle, identity, exit, bound, or
#               AC/NFR mapping; no TC id changes.
#   - PM record: ./chg-GH-291-pm-notes.yaml (DEC-1 scope supersession — spend v2
#               read side owned here, milestone-pack line stale, doc-syncer
#               reconciliation rides phase 7 of the lifecycle; the TO-CONFIRM
#               baseline-source-per-plane handed to plan-writer is resolved in
#               the OQ-T2 RESOLUTION block below).
#   - Schema:   doc/spec/features/feature-plan-schema.md (scope keys
#               files/packages/folders, doneArtifacts slots, leases,
#               weightClass, interactions, tier; no tasks key, no progress log).
#   - Precedent: ./2026-11-11--GH-290--event-taxonomy/chg-GH-290-plan.yaml and
#               ./2026-11-11--GH-286--daemon-command-mounting/chg-GH-286-plan.yaml
#               (phase ceremony, inventory/guard scope, changeset shape).
#
# OQ-T2 RESOLUTION (test plan §8.3 OQ-T2, owner @plan-writer — recorded here as
# the plan's design decision; the reconciliation matrix R-01..R-08 is invariant
# to it and TC-019..024 assert the declared sourcing through contract
# constants):
#   Which records constitute the DEC-5 denominator (the summed harness-reported
#   session totals) per reading plane:
#   1. STREAM-INGEST PLANE (opencode): the baseline is CAPTURED, never
#      read-time re-queried. One new additive baseline record family — record
#      kind `harness.telemetry.baseline` under its own store-scoped key prefix,
#      payload schema `delivery.harness.telemetry.baseline.v1` (exact constant
#      naming is the GAP-7 contract declaration; brand-neutral per §21) — one
#      record per attributed harness session, appended once per session at
#      stream close: when the drained stream resolves with an acquired session
#      handle, the adapter performs ONE bounded read-only per-session totals
#      query through the delivered read-only store opener seam (the same SUM
#      aggregation `packages/adapters/src/harness/telemetry-opencode.ts`
#      performs, scoped to that single session id) and appends the record via
#      the fenced telemetry append path (Phase 2). A failed or unavailable
#      store read lands no record and fabricates no figure: the session then
#      appears in the report as a DEC-5 excluded baseline session with the
#      closed-vocabulary warning and named count. Capture-time work only — the
#      spend read path never re-queries a harness store (NG-2).
#      The stream itself is NOT the baseline source: the committed captures pin
#      step frames as per-step carriers with no guaranteed session-total frame
#      (GAP-2/OQ-T1), so the harness store is the durable per-session reporter.
#      If the real GAP-2 capture reveals a session-total-bearing frame, the
#      stream source may join the contract constants additively in a later
#      change; this plan pins the store-read design as the v1 baseline source.
#   2. CLOSEOUT-CAPTURE PLANE (both harnesses): the delivered
#      `harness.telemetry` session records ARE the harness store's reported
#      per-session (agent, model) group totals — the v1 extractor reads
#      per-session SUMs from the store. The baseline is therefore derived at
#      read time as a pure join over the delivered records: for each attributed
#      session, the sum of that session's delivered session-group records. No
#      new capture exists on this plane (§16: closeout transaction unchanged).
#   3. SESSION UNIVERSE AND EXCLUSION: the baseline session set is every
#      harness session id attributed to the delivery across the evidence
#      records (v2 step records, baseline records, delivered v1 session
#      records), deduplicated by `sessionId`. Each session contributes exactly
#      ONE harness-reported total: the captured baseline record when present,
#      else that session's delivered v1 group sums; a session with neither is
#      excluded from the sum with the closed-vocabulary warning and named count
#      (DEC-5). No baseline contribution at all → the reconciliation block's
#      classified unavailability (matrix R-06), never verdict `within`.
#   4. OQ-T4 COMBINATION ARITHMETIC (declared here; pinned by TC-TELEMETRY-024
#      through the contract constant): deduplicate by `sessionId`. Per
#      session, the observed figure takes the v2 stream step sums when steps
#      exist, else that session's closeout-captured group sums; a session
#      present in both planes contributes its step sums to observed while its
#      closeout sums corroborate as baseline input. Summing both planes for
#      one session inflates observed beyond the summed baseline and must
#      surface as the declared outside verdict (R-07, RSK-2) — the arithmetic
#      is a declared contract constant, not an implementation detail.
#
# GAP-2 FIXTURE CONTRACT (why the token-bearing capture is Phase 1's first
# commit): the three committed v2.2.5 captures pin framing only; their
# `step_finish` parts carry no token/cost payload, so the counting contract's
# positive path has no committed oracle today. The extension is a REAL
# v2.x.y capture with synthetic redacted content, one shape per file,
# provenance recorded in tests/fixtures/harness/stream/README.md, passing the
# fixture-privacy scan. It lands BEFORE the contract's field mapping is pinned
# so the mapping names real harness fields (OQ-T1 resolved by the fixture, not
# by invention). TC-TELEMETRY-001/014/019 declare this capture as their
# fixture prerequisite; until it exists no positive-path assertion runs.
#
# PHASE ORDERING AND TESTABILITY:
#   Each phase is one commit on `feat/GH-291/telemetry-v2` whose declared
#   narrow gate is green at the boundary. Phase 1 lands the authored
#   declaration (every constant later phases assert through) and the GAP-2
#   capture. Phase 2 lands the capture pipeline end to end — ingest over the
#   delivered streaming seam, five-dimension attribution, session-close
#   baseline capture (OQ-T2 §1), schema-versioned storage with re-read
#   migration — because TC-001..008, 010, 012, 013 each observe stored,
#   attributed records and cannot be green on a partial pipeline. Phase 3
#   lands the extended read-side fold (breakdowns, timing summaries, cost
#   totals, telemetry state, reading basis incl. DEC-4, absence and damage
#   boundaries) as machine payload. Phase 4 lands the reconciliation
#   disclosure over the Phase-2 baseline families and the Phase-3 fold.
#   Phase 5 mounts the CLI grammar (`--breakdown`), the pre-read refusal, the
#   human disclosure render, and reconciles both spend reference pages.
#   Phase 6 wires the three consumers (retro evidence source, brief spend
#   surface, digest section 8 parity). Phase 7 is the cross-cutting battery —
#   the mutant meta-suite and the disclosure suite need every production
#   module and all four render paths to exist. Phase 8 reconciles docs and
#   the planning corpus, stages the changeset, and declares the release
#   obligations. The final gate runs `plan validate GH-291` and the full
#   battery.
#
# DEC-6 TYPE DISCIPLINE (binding on Phases 3-5): `SPEND_DATA_KEYS` stays
#   exactly six with its declared order; the v2 additive keys (breakdown
#   arrays, timing summaries, reconciliation block, telemetry-state
#   disclosure, cost-bearing totals) are declared as their OWN additive
#   constant beside it under the same `delivery.spend.v1` identity — no
#   renames, no collisions, `SPEND_FLAGS` grows `--breakdown` only in the
#   Phase-5 commit that mounts the grammar (structure-suite flag assertions
#   follow in the same commit or the Phase-5 gate is red).
#
# EARLY DOC EDIT (Phase 3): `doc/spec/features/feature-result-contract.md`
#   carries the machine-readable error table that
#   `scripts/checks/error-table-sync.ts` compares bidirectionally against
#   `packages/core/src/contracts/error-table.ts`. Any additive spend error-row
#   refinement (spec §16) lands code + documented rows +
#   `tests/structure/error-table.test.ts` counts in ONE commit. If delivery
#   needs no refinement (the refusal reuses the delivered input-refusal row
#   and absence reuses `spend.telemetry-absent`), the three files stay
#   untouched — they are declared so a needed edit is never unstaged.
#
# SCOPE CONVENTION: concrete files are exact paths; folders are declared by
#   every phase that writes a new file inside them (the commit primitive
#   stages only the declared phase scope). A file edited in two phases is
#   declared in both phases; `plan diff` reports the first covering phase.
#   Conditional rows (error table, privacy literals) are declared so the
#   likely edit is always staged; an untouched declared file is only a
#   `plan diff` observation, never a gate failure.
#
# DECLARED CONTROLS, NOT EDITS: the delivered regression suites below are
#   re-run in phase gates as controls and are NOT edited, so none is declared
#   in a phase scope: `tests/behaviour/harness-opencode-stream.test.ts`,
#   `harness-opencode-resume-stream.test.ts`, `harness-stream-hygiene.test.ts`,
#   `harness-host-stream.test.ts`, the delivered `harness-telemetry-*.test.ts`
#   family, `closeout-telemetry-production.test.ts`, the delivered
#   `spend-*` v1 family's unlisted suites, `economics-*.test.ts`, the
#   delivered redaction suite, and `tests/checks/fixture-privacy.test.ts`
#   (extended coverage comes from the new fixture files, not an edit). A
#   semantic assertion change in any delivered suite is the escalation
#   trigger the tier reserves.
#
# TC -> PHASE MAP (39 ids = TC-TELEMETRY-001..039; every id is owned by
#   exactly one phase — the phase which first makes its complete suite set
#   green. Suite halves proven earlier are named in that phase's gate and
#   `Suites left green` line without a second TC row):
#   Phase 1 declaration (0): none (the declaration-level suites prove the
#            constants, the fixture, and the static boundary halves of
#            TC-TELEMETRY-039; its error-table/boundary halves are owned by
#            Phase 7 once every module exists)
#   Phase 2 capture pipeline (11): TC-TELEMETRY-001, 002, 003, 004, 005,
#            006, 007, 008, 010, 012, 013
#   Phase 3 extended fold (8): TC-TELEMETRY-009, 011, 014, 015, 017, 018,
#            025, 026
#   Phase 4 reconciliation (6): TC-TELEMETRY-019, 020, 021, 022, 023, 024
#   Phase 5 CLI mount (1): TC-TELEMETRY-016
#   Phase 6 consumers (4): TC-TELEMETRY-027, 028, 029, 030
#   Phase 7 battery (9): TC-TELEMETRY-031, 032, 033, 034, 035, 036, 037,
#            038, 039
#   Phase 8 docs/release (0): none (docs, planning corpus, changeset; proven
#            by the doc, coverage, distribution, and changeset guards)
#
# RELEASE: one lockstep minor changeset over the five publishables
#   (`@delivery-os/core`, `adapters`, `cli`, `mcp`, `opencode`), matching the
#   GH-286/GH-289/GH-290 precedent. No new package dependency, no data
#   migration (the telemetry storage declares its OWN schema version; the
#   state layer's STATE_SCHEMA_VERSION does not change), no backfill.
#
# COMMIT DISCIPLINE (pm-notes delivery conventions): conventional subjects
#   <= 72 chars; body and footer lines <= 100 chars; commits through the
#   commit primitive against this plan's phase scope.

schemaVersion: delivery.plan.v1
workItemRef: GH-291
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8]
  escalationTriggers:
    - "A new spend schema identity would be required, or a delivered `delivery.spend.v1` key is renamed, removed, or re-semanted; `SPEND_DATA_KEYS` would stop being exactly six in its declared order (DEC-6)"
    - "`spend.telemetry-absent` forks or a second absence identity appears beside it; a delivered `state.*` identity changes category, consequence, or projection class"
    - "Stream ingest needs a new process primitive, spawn/kill capability, or environment-variable handling, or blocking work that changes the delivered drain, handle-acquisition, or output-bound behavior (NFR-5)"
    - "The spend read path would re-query a harness store or session reader (NG-2); baseline records are the only harness-store reads and they are capture-time only (OQ-T2)"
    - "A second authored copy of the token-class, breakdown-field, warning-reason, verdict, reading-basis, or combination-arithmetic vocabulary would exist beside the telemetry/spend contract modules"
    - "The reconciliation baseline would be fabricated (a missing harness total counted as zero), the tolerance silently widened beyond 0.02, or a per-session verdict forked beside the single DEC-5 verdict"
    - "Cost would need conversion, re-pricing, or zero-filling, or any omitted value would be fabricated to zero or an estimate (NG-4 and the honesty rules)"
    - "The brief's closed surface catalog or the retro evidence source set would grow beyond the declared additive spend surface (RSK-6)"
    - "A delivered pre-change suite needs a semantic assertion change outside the update rows this plan declares (spend goldens, absence/damage matrices, status parity suites, digest invariants, brief catalog)"
    - "Telemetry would land in the memory change capsule, or a new retention regime would be introduced beside the state-layer convention (OUT of scope, NFR-8)"
    - "The delivered closeout capture path or the closeout transaction would be reworked rather than extended (spec §16: closeout transaction unchanged)"
    - "The token-bearing fixture cannot be captured from a real v2.x.y session (GAP-2/OQ-T1), so the counting contract would be pinned on invented shapes"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — The GAP-2 token-bearing capture and the authored declaration.
  #
  # Goal: land the real v2.x.y stream capture with token/cost-bearing
  # `step_finish` frames (GAP-2, OQ-T1) and the telemetry v2 contract module
  # every later phase asserts through: the five attribution dimensions
  # (ticket, repository, lane, agentRole, model), the exactly-five
  # breakdown-field set, the reconciliation tolerance constant (0.02, DEC-2),
  # the verdict vocabulary (within / the declared outside verdict / the
  # classified unavailability), the reading-basis vocabulary (stream ingest /
  # closeout capture / declared combination), the closed v2 warning-reason
  # additions (omission, drift, unattributable, baseline-exclusion,
  # truncation — GAP-4), the DM-1 step-record shape, the OQ-T2 baseline-record
  # shape and key prefix, the DM-5 storage schema-version constant (GAP-7),
  # and the OQ-T4 combination-rule constant. No behaviour changes: no ingest
  # runs, no storage exists, no spend key changes.
  #
  # The scenario module gains the shape-preserving builders for token-bearing,
  # omission (I-02..I-04), and drift (I-05) synthetic frames so later matrices
  # never scatter ad-hoc JSON literals through suites.
  #
  # AC/TC coverage: declares the vocabulary for F-1..F-8; proves the static
  # halves of TC-TELEMETRY-039 and the contract half of TC-TELEMETRY-015's
  # constant set (owned later); owns no complete TC.
  #
  # Gate:
  #   pnpm typecheck
  #   bun test tests/structure/telemetry-contract.test.ts tests/structure/telemetry-imports.test.ts
  #   bun test tests/structure/{content-inventory,spend-contract}.test.ts
  #   bun test tests/checks/fixture-privacy.test.ts
  #   bun run scripts/checks/exports-parity.ts
  #   bun run scripts/checks/ambient-globals.ts
  #
  # Suites left green: telemetry-contract (constants half), telemetry-imports
  #   (static half), content-inventory, spend-contract (delivered control),
  #   fixture-privacy (new capture scanned), exports-parity, ambient-globals.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Token-bearing stream fixture extension (GAP-2) and the telemetry v2 contract declaration"
    kind: delivery
    summary: "feat(telemetry): declare telemetry v2 contracts and pin the token-bearing fixture"
    scope:
      files:
