decisions:
  - text: "Adoption route follows the owner's disposition on GH-374 (2026-11-20): do
      NOT extend `provider migrate` to parse shell; author the policy
      declaratively from the legacy files' intent and retire the hook. The two
      deterministic `provider.migrate.refused` outcomes (oversized-source,
      dynamic-value) are recorded as change evidence, and the migrator gaps stay
      with M4-S17."
    date: "2026-11-20"
  - text: "Policy home is the tracked configuration root read by the delivered
      composition: `<repo>/.delivery-os/config.yaml` (today's project-committed
      layer). The `.jaiship` directory is not committed; the namespace migration
      belongs to M4-S2."
    date: "2026-11-20"
  - text: "Peak modelling constraint: the delivered `provider.entries.<name>.peak`
      is ONE window per entry and is evaluated every day on the declared zone's
      clock (no weekday dimension). Legacy z.ai peak is weekdays 06:00-10:00Z;
      the declaration is therefore daily 06:00-10:00Z with the declared 7200 s
      buffer, a documented superset of the legacy weekday window. The engine's
      no-paid-escalation rule (a peak-parked subscription entry blocks paid
      substitution) covers DeepSeek's 06:00-10:00Z price peak structurally; the
      paid entry therefore declares only its 01:00-04:00Z window, which is the
      window where the subscription rail is otherwise eligible."
    date: "2026-11-20"
  - text: "Seat declaration: one seat per agent role the lifecycle spawns, plus the
      artifact/verification roles the plan names. Seat `model` values use the
      `provider/model[#variant]` form (`deepseek/deepseek-flash`,
      `zai-coding-plan/glm-5.3`, `zai-coding-plan/glm-5.3-flash`); no model
      literal is added to an agent prompt. `envName` stays derived from the
      declared branding prefix rather than a committed product-prefixed literal,
      because the harness conveys model selection per spawn and the env-record
      name prefix is branding-derived."
    date: "2026-11-20"
  - text: "Budget ceilings are declared as reviewable policy values (a
      trailing-window cost ceiling and a ticket-scope cost ceiling) whose
      purpose is to park rather than overspend. Exact figures are initial,
      conservative, and config-only to change; they are flagged for owner review
      in the PR because the ticket supplies the requirement but no figures."
    date: "2026-11-20"
  - text: "Decision ledger: no decision record is authored unless a genuine decision
      emerges during delivery; if one is needed it reserves TDR-0074..0075
      (PDR-0006 already records config layering). The max id is re-verified on
      origin/main-tools before any authoring."
    date: "2026-11-20"
  - text: "No self-dispatch: `dispatch GH-374` is NOT run as proof (it would claim
      the repo lease and start a second delivery). Proof is `provider profile
      resolve --agent <role> --for-spawn`, `provider resolve`, `provider
      simulate --fixture`, and the legacy-source grep."
    date: "2026-11-20"
  - text: "Spec revision R1 (PM-decided after reviewing the first draft): the
      profiles are a mixed base `delivery` over `[zai-coding-plan, deepseek]`
      plus a `paid` fallback over `[deepseek]`, not two disjoint rails. Two
      reasons verified in the delivered code: the base rail must keep
      vision-capable seats on the image-capable paid model (legacy `mixed.sh`
      keeps `designer`/`image-reviewer` on deepseek because the z.ai vision
      route is unverified), and the paid profile is the real target of the
      quota-driven all-paid switch. A disjoint subscription base would make
      every vision task refuse on the rail selected almost all the time."
    date: "2026-11-20"
  - text: "Spec revision R2 (PM-decided): the paid entry declares ONE union peak
      window 01:00-10:00 UTC with buffer 0, because `provider.entries.*.peak`
      carries one window per entry and only entry peaks gate admission
      (`createResolvedProviderProbe` reads `descriptor.peak`; profile
      `peakWindows` do not gate admission). The union keeps paid capacity out of
      both DeepSeek 2x windows and out of the subscription's buffered pause; the
      measured cost is the 04:00-06:00 UTC gap the legacy hook left open."
    date: "2026-11-20"
  - text: "Spec revision R3 (PM-decided): profile `peakWindows` must satisfy
      `parseProfilePeakWindows` — a positive `graceSeconds` at or below the
      smallest buffer across ALL windows. The first draft's zero
      `bufferAfterSeconds` made that bound 0 and the branch unloadable; the
      declaration now uses buffers 1800/300 and 7200/600 with `graceSeconds:
      300`."
    date: "2026-11-20"
  - text: "Legacy-behaviour correction (verified in
      `~/.ados/hooks/pre-opencode-iteration`): the hook's z.ai buffer default is
      900 s, z.ai parking is active only when the target uses z.ai, DeepSeek
      parking (01:00-04:00 and 06:00-10:00, buffer 0, Chinese-holiday exempt)
      applies whenever DeepSeek is in the target, and today's persisted target
      is DeepSeek. Therefore the legacy all-rails pause already covered
      01:00-04:00; the union window's only incremental cost is 04:00-06:00. The
      spec's first cost statement claimed a three-hour extension and was
      corrected."
    date: "2026-11-20"
  - text: "PM decision D9 (DoR iteration 1, blocking B1): the ticket's task 'No
      model literal lives in an agent prompt' is true of 23 of the 24 prompts
      but false of `.opencode/agent/toolsmith.md`, which carries provider/model
      ids (`anthropic/claude-opus-4-5`, `openai/gpt-5.2`,
      `deepseek/deepseek-3.2`, `deepseek-3.2`, `gemini-3.0-pro`) in its
      prompt-authoring guidance. Scope is widened: replace those literals with
      neutral placeholders plus a pointer to the typed provider policy,
      regenerate `.ados-claude/agents/toolsmith.md` with
      `scripts/build-claude-plugin.sh`, and prove the prompt scan over the full
      roster. The edit is delegated to `@toolsmith` during delivery (AGENTS.md
      requires it). The documented Claude Code `claude.model` frontmatter is a
      tool-specific assignment contract, not Jaiship provider policy, and the
      scan's 'model literal' definition is scoped to provider/model identifiers
      accordingly (stated in the spec)."
    date: "2026-11-20"
  - text: "PM decision D10 (DoR iteration 1, blocking B2): the initial ceilings are
      re-ordered to `window-cost` ceiling 20 and `ticket-cost` ceiling 30. With
      the window ceiling below the ticket ceiling, spend 20-30 parks on the
      trailing window and spend >=30 fails the ticket scope; the original 30/20
      pair made the window park unreachable because the ticket-scope failure
      always won the MAX combination."
    date: "2026-11-20"
  - text: "PM decision D11 (DoR iteration 1, blocking B1/M12): the legacy-source AC
      is scoped to the delivery surface (scripts/**, tools/**, .opencode/**,
      packages/**, tests/**), because the adopter blueprint
      `doc/templates/blueprints/zai-peak-hours-hook--install.sh` is
      documentation scaffolding for adopters, not this repository's delivery
      path. The scan proves both halves: no delivery-surface script or prompt
      sources the legacy profile directory or installs the hook, and the
      blueprint is the only installer in the tree and is referenced by no
      delivery surface. The ticket traceability states the scoped reading rather
      than claiming the literal repository-wide clause."
    date: "2026-11-20"
  - text: "PM decision D12 (DoR iteration 1, major M7): the current-truth page
      `doc/spec/features/feature-provider-profiles.md` line 38 claims profile
      `peakWindows` drive 'admission gating', which the delivered selection does
      not do (only entry peaks gate admission). Phase 7 (`@doc-syncer`) must
      reconcile that sentence with the delivered behaviour; the spec's
      documentation-obligation table now names it."
    date: "2026-11-20"
  - text: "PM decision D13 (DoR iteration 1, minor m1): the legacy profile set's
      disposition is recorded so 'nothing is dropped' is auditable — `mixed`
      maps to the `delivery` profile, `deepseek` to the `paid` profile,
      `zai-only` to the `subscription-only` chain, `openai` is intentionally not
      declared (no OpenAI credential or policy target in this adoption; the
      persisted target is DeepSeek), `zai-top`/`zai.sh` are historical
      alternates not adopted, and the two shared tier files map to the seat
      matrix."
    date: "2026-11-20"
  - text: "PM decision D14 (DoR iteration 1, minor m5): the PR/owner-review list
      must name three deliberate deviations for confirmation — the initial
      ceilings (20/day, 30/ticket), the derived `envName` instead of a committed
      product-prefixed literal, and the paid-entry union window with its
      04:00-06:00 cost."
    date: "2026-11-20"

