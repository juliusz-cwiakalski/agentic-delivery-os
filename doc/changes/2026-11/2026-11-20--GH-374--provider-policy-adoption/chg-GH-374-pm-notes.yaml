  - text: "IMPLEMENTATION RECONCILIATIONS (plan/test-plan prose vs delivered
      behaviour; each was resolved by asserting the DELIVERED fact, never by
      skipping or weakening an assertion). (1) The plan said `peak-park.json`
      and `quota-park.json` declare no quota facts; with a declared enabled
      quota a missing fact becomes a `provider-outage` park (`engine.ts`
      transport catch), so the conditions would read
      `[\"peak-window\",\"provider-outage\"]`. The fixtures therefore declare a
      clear/exhausted delivered envelope. (2) A chain park reports EVERY entry
      in `data.skipped` (`packages/core/src/provider/chain.ts`
      resolveProviderChain tail), so the spend-25 case asserts both entries
      skipped `budget-exhausted`; the paid-escape claim is asserted as
      `decision.kind === parked` with no selected provider. (3) The
      paid-fallback replay carries the subscription's own quota park in
      `data.parks` (no chain park); the case asserts exactly that. (4) The
      ticket-ceiling refusal summary names the MERGED budget evidence
      (`window-cost (window, cost 30 of 20)`) because
      `combineProviderConditions` merges failed evidence in budget-name order,
      and the simulate surface does not append `[provider.budget.crossed]`; the
      case asserts the refusal envelope plus the announcement identity at the
      `simulateProviderResolution` seam. (5) `formatUtcIso` emits milliseconds,
      so timestamps assert `.000Z`. (6) `config.key.unknown` carries neither
      `layer` nor `key`; the case asserts the code plus a differential oracle.
      (7) The entry `enabled` default is the provider parser's, not a
      configuration-layer default: it has no origin. (8) `provider watch status`
      returns `data.providers` only (no announcements key). (9) The shared
      provider grammar ignores an unknown flag; a flag belonging to another
      provider subcommand is refused `input.value.rejected` naming the three
      accepted migrate flags (never `fallback.invocation`). (10) A missing seat
      surfaces as an `unassigned` binding and a 23-entry env record, not a CLI
      refusal. (11) SEC-003 scans the declared set over the paths that exist at
      run time; phase 6's four pages and the extended suite join the same
      dynamic set automatically. (12) The tree-wide 'only installer' arm counts
      executable shell installers; guides and golden text describe the command
      without being installers. (13) The doc-conformance phrase comparison
      flattens whitespace because prose wraps."
    type: info
    date: "2026-11-21"
