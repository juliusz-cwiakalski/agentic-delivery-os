      (75215-byte hook > 65536-byte cap; profiles use `source`, `${VAR:?}`
      guards and conditionals outside the assignment-only subset). The adopted
      route is declarative authoring, hook retirement, no migrator change."
    type: info
    date: "2026-11-20"
  - text: "Legacy intent to encode is fixed by the owner comment: 100%
      `deepseek/deepseek-flash` today; z.ai coding plan = sunk-cost subscription
      (peak weekdays 06:00-10:00Z, 3x quota units, with buffer); DeepSeek =
      pay-per-token (peak Mon-Fri 01:00-04:00Z and 06:00-10:00Z, 2x price);
      chain behaviour replaces hook auto-switch (subscription first, never retry
      an exhausted provider, park with a next-eligible time, paid fallback only
      per policy); deepseek balance floor is a `deepseek-balance` watch
      condition."
    type: info
    date: "2026-11-20"
