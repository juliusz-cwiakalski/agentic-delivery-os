decisions:
  - text: "Adoption route follows the owner's disposition on GH-374 (2026-11-20): do
      NOT extend `provider migrate` to parse shell; author the policy
      declaratively from the legacy files' intent and retire the hook. The two
      deterministic `provider.migrate.refused` outcomes (oversized-source,
      dynamic-value) are recorded as change evidence, and the migrator gaps stay
      with M4-S17."
    date: "2026-11-20"
  - text: "Policy home is the tracked configuration root read by the delivered
      composition: `<repo>/.delivery-os/config.yaml` (today's project-committed
      layer). The `.jaiship` directory is not committed; the namespace migration
      belongs to M4-S2."
    date: "2026-11-20"
  - text: "Peak modelling constraint: the delivered `provider.entries.<name>.peak`
      is ONE window per entry and is evaluated every day on the declared zone's
      clock (no weekday dimension). Legacy z.ai peak is weekdays 06:00-10:00Z;
      the declaration is therefore daily 06:00-10:00Z with the declared 7200 s
      buffer, a documented superset of the legacy weekday window. The engine's
      no-paid-escalation rule (a peak-parked subscription entry blocks paid
      substitution) covers DeepSeek's 06:00-10:00Z price peak structurally; the
      paid entry therefore declares only its 01:00-04:00Z window, which is the
      window where the subscription rail is otherwise eligible."
    date: "2026-11-20"
  - text: "Seat declaration: one seat per agent role the lifecycle spawns, plus the
      artifact/verification roles the plan names. Seat `model` values use the
      `provider/model[#variant]` form (`deepseek/deepseek-flash`,
      `zai-coding-plan/glm-5.3`, `zai-coding-plan/glm-5.3-flash`); no model
      literal is added to an agent prompt. `envName` stays derived from the
      declared branding prefix rather than a committed product-prefixed literal,
      because the harness conveys model selection per spawn and the env-record
      name prefix is branding-derived."
    date: "2026-11-20"
  - text: "Budget ceilings are declared as reviewable policy values (a
      trailing-window cost ceiling and a ticket-scope cost ceiling) whose
      purpose is to park rather than overspend. Exact figures are initial,
      conservative, and config-only to change; they are flagged for owner review
      in the PR because the ticket supplies the requirement but no figures."
    date: "2026-11-20"
  - text: "Decision ledger: no decision record is authored unless a genuine decision
      emerges during delivery; if one is needed it reserves TDR-0074..0075
      (PDR-0006 already records config layering). The max id is re-verified on
      origin/main-tools before any authoring."
    date: "2026-11-20"
  - text: "No self-dispatch: `dispatch GH-374` is NOT run as proof (it would claim
      the repo lease and start a second delivery). Proof is `provider profile
      resolve --agent <role> --for-spawn`, `provider resolve`, `provider
      simulate --fixture`, and the legacy-source grep."
    date: "2026-11-20"

