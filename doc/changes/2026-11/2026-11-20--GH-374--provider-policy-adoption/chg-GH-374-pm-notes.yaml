  - text: "RETRO (environment): the first `phase complete GH-374 clarify_scope`
      failed with `commit.commitlint-failed`. Root cause: the commit primitive's
      commitlint probe spawns bare `commitlint` from PATH, which is absent on
      this workstation, so even the deterministic template was reported invalid.
      A PATH prepend of `node_modules/.bin` then shadowed the installed
      `jaiship` with the unbuilt dev shim (`Cannot find module
      '@delivery-os/adapters/credentials'`). Working invocation: append
      `node_modules/.bin` to PATH (installed binary wins, commitlint resolves).
      Product follow-up candidate, outside this change's scope: the probe should
      resolve the workspace binary rather than depend on PATH."
    type: retro
    date: "2026-11-20"
