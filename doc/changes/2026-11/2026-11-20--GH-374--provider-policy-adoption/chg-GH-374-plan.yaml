# identifiers from ONE agent prompt and the regeneration of its Claude Code
# counterpart, and (c) the tests and documentation that pin both. No provider key,
# condition kind, park cause, skip reason, announcement code, error row, command,
# flag or state kind is added (NG-1); no migrator behaviour changes (NG-2); no
# other prompt or command is touched (DEC-20, NFR-7).
