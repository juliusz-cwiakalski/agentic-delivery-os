  escalationTriggers:
    - "The committed document does not load through the delivered validators at a phase boundary — the provider branch refuses, a profile window declares a zero buffer, `graceSeconds` exceeds the smallest buffer, or the profile branch answers `provider.profile.invalid`/`provider.profile.absent` (RSK-15, DEC-18, A-10, TC-POL-CFG-001/DRIFT-003): stop, fix the declaration in phase 1's scope, and re-run phase 1's gate."
    - "`window-cost.ceiling` is not strictly below `ticket-cost.ceiling`, or a fixture measures a figure that is both at the window ceiling and at the ticket ceiling (DEC-21, AC-F4-1, TC-POL-CFG-005/DRIFT-004/DRIFT-005/SIM-003/SIM-006): a `failed` condition outranks every `parked` one, so the window park becomes unreachable and the ticket AC half cannot be evidenced."
    - "A credential child is not exactly `{ sourceKey: { style, name } }`, or a value-bearing key exists at any level (B4, DM-1, AC-F6-3, NFR-4): the config layer refuses the branch and the whole change is unloadable — the delivered parser's own detail is `credentials.<name>.sourceKey`."
    - "The declared policy cannot be expressed in the delivered grammar — a needed key, condition kind, park cause, skip reason, announcement code, error row, command, flag, seat field or window shape does not exist (NG-1, DEC-2, §8.3 DM-1..DM-8): STOP and report; this change adopts configuration and may never add capability."
    - "A phase needs to edit a path outside NFR-7's closed set — `packages/**`, any prompt or command OTHER than `.opencode/agent/toolsmith.md` and its generated counterpart, `.ai/**`, `.jaiship/**`, `scripts/**`, any other configuration layer, or `verify.suite-map` (NFR-7, §7.2, DEC-20): stop and escalate instead of widening the phase, because the whole change is a locality claim."
    - "The toolsmith source and its generated `.ados-claude` counterpart drift — the generated file is hand-edited, committed stale, or carries a provenance header the generator does not write (RSK-17, SCAN-006): regenerate with `scripts/build-claude-plugin.sh`; never edit `.ados-claude/**` by hand (AGENTS.md)."
    - "The prompt scan reports a finding on the real roster, or reports a declared carve-out (bare family prose, `claude.model: opus|sonnet|haiku`), or passes because it scanned fewer than 24 files (AC-F2-2, SCAN-004, SCAN-006, SCAN-007, TR-8): a green scan must mean the identifiers are gone, not that the scanner is blind or a false-positive machine."
    - "A test mutates the committed document, writes a fixture into the real tree, reads the operator's `$HOME`/state root, or is green only because a mutant was applied to the committed file instead of a `tmp/tmpdir` copy (test plan §5.2.5, TR-2, TC-POL-DRIFT-005): the case is invalid by construction."
    - "A gate is green only by weakening, skipping, renaming or deleting an oracle, or a guard ships without its failing negative control (test plan §4.3, §4.4): a case that cannot fail is not evidence."
    - "A suite-map edit is proposed, the top-level document gains a third key, or the delivered control suite `tests/structure/verify-gates-suite-map-reference.test.ts` is edited (TC-POL-DRIFT-007, test plan §7.2): the map is a byte-identical control and `tests/**` needs no registration."
    - "A page and the doc-conformance phrase that pins it move in different commits, a phrase row is added for prose a later phase contradicts, or a page outside the closed page set states a claim this change falsifies (spec §16, AC-F7-2, TC-POL-DOC-005/006): the one-edit-set rule is broken."
    - "A real credential-shaped value appears in any committed file — the document, a fixture, a test, the evidence artifact, a guide or this change folder — or a fixture carries a credential value or omits `workItemRef: \"GH-374\"` while the enabled budgets are declared (NFR-4, AC-F6-3, DM-9): a credential leak is a defect, not a review note. Documentation PLACEHOLDERS (`...`, `<...>`, `$VAR`, `sk-ant-…`) are the declared carve-out and are proven by control, never by assumption (SEC-003)."
    - "The proof starts reaching for the real thing — a `dispatch`, a lease claim, a single-flight predicate, a child spawn, a live network call, a live credential resolution, a real `sleep`, or an installed-binary subprocess (DEC-13, NFR-6, TC-POL-NOM-003, SEAM-TP-1): every proof is in-process, and a dispatch would start a second delivery."
    - "`provider migrate legacy`, its caps (`65536`/`2000`/`64`), its eight closed reasons, its three flags, its fixtures, its goldens or its output would have to change, or a suite re-runs the migration against an operator home (NG-2, AC-F6-2, TC-POL-MIG-002/003): the refusals are recorded evidence; the migrator gaps stay with M4-S17."
    - "The union window or the declared-costs honesty is dropped or softened — the paid entry peak narrowed to 06:00-10:00, the 01:00-10:00 union weakened, the exact 04:00-06:00 time-of-day interval removed, the daily-versus-weekday superset restated as weekday-only, or the ticket ceiling described as a park (DEC-9, DEC-10, DEC-17, OQ-2, OQ-3, RSK-4, RSK-6): a false claim about the deployed policy is worse than the cost it hides."
    - "A phase's gate fails and its fix lies in ANOTHER phase's scope — for example a phase-4 replay exposing a declaration value phase 1 owns, or a phase-6 phrase exposing prose a phase-3 pin contradicts: stop and re-plan (or reopen the owning phase with a new commit) rather than editing an undeclared file."
