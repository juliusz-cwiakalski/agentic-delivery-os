#   exactly once above and no id above is absent from it: no orphan case. The
#   suite arithmetic reconciles with §7.3: 17 (reference) + 22 (behaviour) +
#   3 (prompt scan) + 4 (delivery-surface scan) + 3 (canary) + 6 (doc-conformance)
#   = 55, over the SIX test files §7.1 declares.
#
# PHASE ORDER AND WHY IT IS FIXED (spec §18; PM-decided sequence; "the plan owns
#   the phase boundaries, this specification owns the contract"):
#   0. G0 (build) once per worktree, before the first bun-test gate.
#   1. The DECLARATION comes first: nothing can be proven, and no case can be
#      green, before the document exists (every case reads the resolved policy).
#   2. The PROMPT CLEANUP comes second, and its position is deliberate. The claim
#      AC-F2-2 makes is a claim about the TREE, so the tree must be true before the
#      suite that asserts it exists: phase 2 edits the one prompt, regenerates its
#      Claude Code counterpart from it, and lands the scanner in the same commit,
#      so no boundary ever has a green scan over a false tree or a true tree with
#      no assertion. The phase is INDEPENDENT of the declaration (it reads no
#      configuration), so landing it early costs nothing and keeps the pair
#      consistent from the first boundary on. Spec §18 lists the cleanup with the
#      scans; the plan moves it earlier for this reason and declares the move.
#   3. The REFERENCE PINS come third: they parse the real document through the
#      delivered validators, so an arithmetic slip in the declaration (a zero
#      buffer, a grace bound above the smallest buffer — RSK-15/DEC-18) or an
#      inverted ceiling pair fails HERE, before two more phases are built on an
#      unloadable or self-defeating branch. They also carry the migration-bridge
#      tree invariants (MIG-001..-003), because those are HEAD invariants over
#      change artifacts and pinned files, not a runtime behaviour — so they need no
#      sixth suite.
#   4. The REPLAY PROOF comes fourth: the only phase that authors fixtures, and the
#      one that turns the pinned policy into behaviour (resolve, seats, replays,
#      nomination).
#   5. The RETIREMENT PROOF comes fifth: the delivery-surface scan and the canary
#      are independent of phases 3-4 and assert the NEGATIVE claims (nothing
#      sources the legacy profiles, nothing installs the hook, no credential value
#      anywhere) plus the declared exception and the blueprint second half.
#   6. DOCUMENTATION comes last: the guides and the one spec-page sentence state
#      what phases 1-5 made true, and their doc-conformance phrases land in the
#      same commit as the prose, so no page is ever ahead of or behind the tree
#      (the one-edit-set rule). It also carries the release hand-off.
#
# OPEN QUESTIONS (plan level): NONE BLOCKING, and none is carried into delivery.
#   Every module name, constant, exit code, grammar flag, closed reason set, park
#   shape, credential shape and validator argument shape the cases assert was read
#   from the delivered tree at plan time (see VERIFIED AT PLAN TIME), and the three
#   environment facts a plan could otherwise get wrong — the G0 build, the
#   prior-identity notice and the commitlint PATH — are stated as preconditions,
#   not discovered at a boundary. The three SPEC questions (OQ-1 profile windows
#   do not gate admission; OQ-2 the pauses are daily; OQ-3 the union closes
#   04:00-06:00) are non-blocking citations the owning cases already encode
#   (CFG-009, DOC-001, DOC-006) and change no assertion. Two observational notes,
#   neither a question: (i) `doc/00-index.md` carries one generic row for the
#   conditions guide and no retired-dependency claim, so DOC-005's closed page set
#   needs NO index edit — if it ever did, that edit is a declared-scope decision,
#   never a silent widening of phase 6; (ii) `feature-provider-profiles.md`'s
#   line-38 sentence IS edited (DOC-006, DEC-23) and is declared in phase 6, while
#   the other three provider/config specification pages remain phase-7
#   (`system_spec_update`) verification obligations (spec §16).

