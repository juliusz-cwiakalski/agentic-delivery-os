  - text: "Retro: base drift was not checked before the quality-gates phase; the gate caught it (by design — privacy-release compares changesets against origin/main-tools). Lesson: before quality_gates, refresh the base ref (git fetch origin main-tools) and rebase/merge if the base advanced; running the battery on a stale base wastes a full gate cycle (~4 min) plus a fixer loop. The resume-sync directive covered mid-delivery sync only at session start."
