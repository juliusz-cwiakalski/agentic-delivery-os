    category: correctness
    location: packages/core/src/domain/plan-overlap.ts:63
    message: >-
      packagePairOverlap declares overlap for any two package patterns that
      share a static prefix, even when their dynamic segments are provably
      disjoint (packages/core/a* vs packages/core/b*), and the emitted
      descriptor may not literally match both scopes — in tension with
      AC-F10-1's letter ("every overlapping path ... appears in both declared
      scopes"). The error direction is safe (false sequence, never false
      parallel) and deterministic, and the precision corpus does not include a
      same-prefix disjoint pair, so TC-DPLAN-015 passes as shipped. Downstream
      scheduling (M1-S17) should know sequence verdicts can be conservative.
    suggestion: >-
      Cheapest adequate fix: one sentence in feature-plan-schema.md's overlap
      section documenting the conservative same-static-prefix approximation
      (optionally plus a precision fixture pinning it). Exact pattern-pair
      intersection can wait for the scheduler story.
