    location: doc/spec/features/feature-plan-schema.md:30
    message: >-
      The feature spec says the family "consumes ... the read-only
      repository-diff capability", but no such capability exists in-tree: the
      repo adapter reads .git metadata only (never spawns git), and the
      composed default readDiff (packages/cli/src/edge.ts) always returns
