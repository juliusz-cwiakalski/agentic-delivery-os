  - id: F-7
    severity: info
    confidence: medium
    category: correctness
    location: packages/core/src/domain/plan-paths.ts:59
    message: >-
      staticPrefix treats "?" as a wildcard marker (/[*?]/) while globToRegExp
      neither documents nor translates "?" (it survives as a regex quantifier),
      so a declared path containing a literal "?" behaves inconsistently
      between the two helpers (a first-segment "?" yields an empty static
      prefix and thus a conservative overlap). Relatedly, normalizeRepoPath
      does not canonicalize ".." segments, so a/../b vs b would not match.
      Both require pathological authoring that write-time lint and review would
      catch; no action required for this change.
    suggestion: >-
      Follow-up polish (M1-S17 intake or a small chore): either support "?" as
      a single-character wildcard in both helpers consistently or remove it
      from staticPrefix's wildcard class, and decide whether ".." segments
      should be rejected at validation time.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-8
    severity: info
    confidence: high
    category: performance
    location: packages/core/src/domain/plan-validate.ts:593
    message: >-
      The document bound compares Array.from(read.text).length (Unicode code
      points) against PLAN_MAX_DOCUMENT_BYTES (1 MiB) — a chars-vs-bytes naming
      mismatch (astral-heavy documents are measured smaller than their byte
      size) — and materializes a code-point array per validation on a
      latency-sensitive path. Defense in depth still holds: the adapter
      enforces its own 1 MiB UTF-16 bound plus node/depth/alias caps, and the
      measured p95 (4.59–11.25 ms across runs) is far inside NFR-2.
    suggestion: >-
      Optional follow-up: compare read.text.length (UTF-16 units) instead —
      cheaper and stricter — or rename the constant to reflect characters.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
