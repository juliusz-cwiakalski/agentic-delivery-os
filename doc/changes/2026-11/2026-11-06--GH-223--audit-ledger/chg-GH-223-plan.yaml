  # ---------------------------------------------------------------------
  # Phase 3 — CLI audit capture and agent identity
  #
  # Goal: every runCli invocation — success, void, classified user/platform
  # failure, unknown/containment failure, broken invocation — produces exactly
  # one audit.invocation record (plus its reservation) through injected
  # dependencies, with claimed identity captured when present and arguments
  # redacted through the single chokepoint. Audit-write failure NEVER changes
  # the command outcome (DEC-8). The scripted trim lands separately in Phase 4
  # so no suite is ever red mid-delivery.
  #
  # Tasks:
  # - 3.1 Audit capture at the TOP-LEVEL runCli outcome assembly (not
  #       per-handler) so the exactly-one guarantee covers every outcome class
  #       including broken invocations (raw argv tokens preserved; no invented
  #       command name) and containment paths. Order of operations: command
  #       outcome computed FIRST, audit append best-effort afterwards; an audit
  #       write failure is a classified, loud degradation on the diagnostics
  #       stream reusing existing state identities — the outcome and exit code
  #       are unchanged. (F-1, DEC-8; AC-F1-1, AC-F1-2; TC-001..004, 006, 009,
  #       010; NFR-1)
  # - 3.2 startedAt = the invocation's integer epoch-millisecond UTC start from
  #       the injected clock (the same clock measuring timing; never ambient),
  #       recorded exactly once; resultSchemaVersion = the rendered envelope's
  #       `schemaVersion` value at invocation time (`delivery.result.v1`),
  #       supplied by the capture path so the 13-field v1.4 payload is complete
  #       (distinct from the record's own payload schema id); auditSeq pairing
  #       through the Phase-2 consumer. (AC-F1-4; TC-035, TC-036)
  # - 3.3 Agent identity at the runtime-aware edge (packages/cli/src/edge.ts):
  #       variable named BrandIdentity.environmentPrefix + the declared suffix
  #       (Phase 1 constant), read as INJECTED environment data — no ambient
  #       process.env/Bun.env read inside the surface or state tier; presence
  #       decided on the trimmed value (absent, empty, whitespace-only all
  #       absent); a present value recorded verbatim plus the `claimed` marker;
  #       nothing ever inferred from user/host/session. (F-2, DEC-3; AC-F2-1,
  #       AC-F2-2; TC-011, TC-012, TC-013 seam half)
  # - 3.4 Record hygiene: arguments and raw tokens reach the ledger only
  #       through the single serialization/redaction chokepoint
  #       (packages/cli/src/output/serialize.ts) — no secondary serialization
  #       path for audit writes; edge-registered secrets never appear in any
  #       record field on any outcome class; reservation payloads carry no
  #       invocation metadata. (F-6; AC-F6-1; TC-031, TC-032)
  # - 3.5 Extend CliDependencies (packages/cli/src/index.ts) with the injected
  #       audit dependencies (store/consumer factory, environment record);
  #       keep the deterministic in-process surface (no spawning, no ambient
  #       reads); update tests/structure/cli-edge-seam.test.ts.
  # - 3.6 Behaviour suites: create audit-outcomes, audit-identity,
  #       audit-timestamp, audit-write-failure, audit-ordinal-gap,
  #       audit-reservation-orphan, audit-reservation-failure, audit-redaction;
  #       extend audit-ledger and the Phase-2 suites with their runCli
  #       integration blocks where test-plan 7.1 requires them; install the
  #       no-spawn guard around representative runCli cases.
  #       TCs verified here: TC-001, TC-002, TC-003, TC-004, TC-006, TC-009,
  #       TC-010, TC-011, TC-012, TC-013 (seam half), TC-031, TC-032 (behaviour
  #       half), TC-035, TC-036, TC-039, TC-043, TC-044 — plus the runCli
