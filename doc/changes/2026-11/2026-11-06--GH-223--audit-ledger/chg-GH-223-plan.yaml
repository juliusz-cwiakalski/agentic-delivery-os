  # Phase 2 — State-tier audit consumer: two-phase append, chain, key
  # artifact, and bounded read surface
  #
  # Goal: the audit consumer composing the PUBLIC state port only —
  # reservation-first two-phase append under ONE shared fence, keyed chain over
  # both audit kinds, durable store-managed chaining-key artifact, and the
  # library-only bounded/filtered read surface with the orphan-reservation
  # finding. Additive inside delivery.state.v1; no new error-table rows.
  #
  # Tasks:
  # - 2.1 DESIGN STEP (PM-flagged risk): StateStorePort has no store-managed
  #       artifact method — add the chain-key artifact capability additively
  #       within the state facade tier: port-type extension in
  #       packages/core/src/contracts/state.ts, facade method in
  #       packages/core/src/state/index.ts (the only public factory), runtime
  #       hook in packages/core/src/state/driver/runtime-edge.ts — following
  #       the existing artifact handling precedent for header/fence files.
  #       Artifact `chain-key.<workspace>.json` (named member of the store
  #       layout family, OQ-19): generated cryptographically randomly at the
  #       runtime edge on the store's FIRST audit append, created 0600,
  #       verified on open, read by every later process; open failures reuse
  #       existing identities (absent on non-first open -> state.keys.missing;
  #       corrupt -> state.store.torn family; wrong bits ->
  #       state.permission.denied). NO driver runtime API outside
  #       runtime-edge.ts, NO schema bump, NO new error-table rows.
  #       (DM-5, OQ-5/OQ-16/OQ-19; AC-F4-2; NFR-4, NFR-9)
  # - 2.2 Create packages/core/src/state/audit.ts consumer: reservation-first
  #       two-phase append under ONE shared fence acquisition — acquireFence ->
  #       verified readRecords INSIDE the fence (ordinal = highest existing
  #       reservation ordinal + 1, starting at 1; read the previous
  #       audit-domain record's chainValue in the same acquisition:
  #       read-then-append, closeout precedent) -> append(audit.reservation)
  #       -> append(audit.invocation) -> releaseFence. Link alternation pinned
  #       (v1.3): reservation chains from the preceding audit-domain record of
  #       either kind (store chain anchor when first); invocation chains from
  #       its own reservation. Exactly-one counts invocation records only.
  #       Interleaved non-audit kinds neither break nor participate. The
  #       invocation record assembled here carries the 13-field v1.4 payload
  #       (incl. resultSchemaVersion — supplied by the caller from the rendered
  #       envelope; see task 3.2). (F-1, F-4; DEC-8, OQ-15/OQ-20; AC-F1-1,
  #       AC-F4-1)
  # - 2.3 Chain computation and verification over BOTH kinds: keyed hash chain
  #       under the durable key; alteration (including recomputed unkeyed
  #       checksums, including on ORPHANED reservations) flags as a chain break
  #       naming the record position — never payload/checksum bytes; reported
  #       terminal-tail repair/salvage removals (byte-contiguous, kind-agnostic)
