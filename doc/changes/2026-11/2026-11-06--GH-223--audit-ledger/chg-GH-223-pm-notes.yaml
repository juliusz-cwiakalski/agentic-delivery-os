  - text: "REOPEN loop 3 (specification reopened, iteration 4): test-plan reconciliation iter 3 reported NOT CONVERGED on MR-1 — internal contradiction: F-4/AC-F4-1 require every audit-domain record chain-covered, but DM-6/EVT-2 pin the reservation payload to exactly {auditSeq, runId}, leaving orphan reservations (no following link) nowhere to store a keyed chain value, so alteration of an orphan with a recomputed unkeyed checksum would be undetectable. Test plan stands at 49 TCs with TC-049 (altered orphan) blocked by design. PM decision recorded: reservation payload gains chainValue. Non-blocking note for delivery planning: StateStorePort currently has no store-managed artifact method — coder must add the chain-key artifact capability additively within the state facade tier without a new driver runtime API."
