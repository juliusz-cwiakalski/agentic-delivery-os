decisions:
  - text: "PM-decided (reopened specification, iteration 3): NEW-GAP-1 auditSeq durability resolved via RESERVATION-FIRST two-phase append — an additive audit.reservation record kind (carrying the consumed ordinal + runId) is appended inside the shared audit fence BEFORE the invocation record; a reservation lacking its invocation record in a verified read IS the in-band omission finding; reservations are ledger truth so derived-document rebuilds preserve gaps; hash chain covers both kinds; 'exactly one audit.invocation record per completed invocation' AC unchanged. Also pin: NEW-GAP-2 key-artifact open failures reuse existing state identities (missing on non-first open -> state.keys.missing; corrupt format -> state.store.torn family; wrong permission -> state.permission.denied), no new rows; NEW-GAP-3 startedAt = integer epoch milliseconds UTC, inclusive window bounds; NEW-GAP-4 terminal-tail salvage removes trailing records+reservations wholesale so no orphaned-tail reservation survives (document the invariant); NEW-GAP-5 pin the store-managed key-artifact path/API constant through the public port."
    date: "2026-11-06"
  - text: "PM-decided (reopened specification, iteration 2): OQ-T5 resolved by ADDING a wall-clock start timestamp field to the audit record (injected clock at the CLI edge already measures timing) — an audit ledger without 'when' fails its retro/auditor purpose; dropping the time-window filter rejected. OQ-T6 resolved by narrowing DEC-8: the audit consumer assigns its own audit-sequence ordinal at append (inside the audit fence), so omissions/failures surface as detectable ordinal gaps on verified read — no change to the state port's length-derived sequencing."
    date: "2026-11-06"
  - text: "PM-decided: empty and whitespace-only identity values count as ABSENT (never inferred, never recorded as empty); a provided identity is captured verbatim. Consistent with ticket AC 'captured when provided, never inferred when absent'."
    date: "2026-11-06"
