decisions:
  - text: "PM-decided (phase 7 divergences): (1) createProductionDependencies MUST wire the audit consumer and mode resolution by default — the ticket AC 'every command invocation produces exactly one audit record' applies to real invocations, not only tests; the runtime-aware edge is the composition point for mode/identity facts and edge.ts is already in plan scope. (2) The CLI edge default clock switches to epoch-ms UTC (Date.now-based) so startedAt conforms to spec v1.4 and audit records are meaningful across processes. NOT deferred: shipping the consumer unwired would make the story's core AC unmet in the shipped product. Divergences 3-5 recorded as consistent/no-change: --pretty accepted-but-unconsumed (docs state observable behavior; latent-semantics nit for reviewer), identity passes through redact() (AC6 precedence over verbatim), schemaId boundary marker documented as non-audited field."
    date: "2026-11-06"
  - text: "PM-decided (DoR iteration 1 remediation, finding 1): audit invocation payload gains resultSchemaVersion carrying the rendered envelope's schemaVersion value (currently delivery.result.v1) — ticket AC3 'the audit record retains them [schemaVersion, runId, timing]' is then literally satisfied and future envelope schema bumps stay auditable. Payload becomes 13 fields. Also pinned while in this loop (reviewer non-blocking): command filter matches the recorded command token exactly, so a raw-token broken-invocation record is filterable by its recorded token."
    date: "2026-11-06"
  - text: "PM-decided (reopened specification, iteration 4): MR-1 resolved — reservation payload gains chainValue as a third field ({auditSeq, runId, chainValue}). The iteration-3 'minimal fields' direction meant no invocation metadata (no args/outcome/identity), never exclusion of integrity fields; ticket-pinned tamper evidence (DEC-4) must cover every audit-domain record including orphan reservations, which are exactly the failure evidence. Invocation chainValue chains from the reservation's chainValue (reservation = previous link)."
    date: "2026-11-06"
  - text: "PM-decided (reopened specification, iteration 3): NEW-GAP-1 auditSeq durability resolved via RESERVATION-FIRST two-phase append — an additive audit.reservation record kind (carrying the consumed ordinal + runId) is appended inside the shared audit fence BEFORE the invocation record; a reservation lacking its invocation record in a verified read IS the in-band omission finding; reservations are ledger truth so derived-document rebuilds preserve gaps; hash chain covers both kinds; 'exactly one audit.invocation record per completed invocation' AC unchanged. Also pin: NEW-GAP-2 key-artifact open failures reuse existing state identities (missing on non-first open -> state.keys.missing; corrupt format -> state.store.torn family; wrong permission -> state.permission.denied), no new rows; NEW-GAP-3 startedAt = integer epoch milliseconds UTC, inclusive window bounds; NEW-GAP-4 terminal-tail salvage removes trailing records+reservations wholesale so no orphaned-tail reservation survives (document the invariant); NEW-GAP-5 pin the store-managed key-artifact path/API constant through the public port."
    date: "2026-11-06"
  - text: "PM-decided (reopened specification, iteration 2): OQ-T5 resolved by ADDING a wall-clock start timestamp field to the audit record (injected clock at the CLI edge already measures timing) — an audit ledger without 'when' fails its retro/auditor purpose; dropping the time-window filter rejected. OQ-T6 resolved by narrowing DEC-8: the audit consumer assigns its own audit-sequence ordinal at append (inside the audit fence), so omissions/failures surface as detectable ordinal gaps on verified read — no change to the state port's length-derived sequencing."
    date: "2026-11-06"
  - text: "PM-decided: empty and whitespace-only identity values count as ABSENT (never inferred, never recorded as empty); a provided identity is captured verbatim. Consistent with ticket AC 'captured when provided, never inferred when absent'."
    date: "2026-11-06"
