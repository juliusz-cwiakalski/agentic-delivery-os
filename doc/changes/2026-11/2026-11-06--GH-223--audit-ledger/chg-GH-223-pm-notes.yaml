  - text: "Retro 4: fourth reopen, but the gap class shrank each round (field-set omission -> mechanism durability -> internal consistency), and v1.2's mechanisms all passed the mandated realism certification — MR-1 is a consistency miss between F-4 and DM-6, a different and smaller class. Convergence is real; the residual risk is consistency across sections when a mechanism changes multiple touchpoints. Iteration-4 delegation therefore demands an explicit cross-section consistency sweep (F-x vs DM-x vs EVT-x vs AC-x vs Appendix B) as part of the return."
