  - text: "REOPEN loop (specification reopened, iteration 2): test-plan-writer found 2 blocking spec gaps — OQ-T5 audit record lacks a timestamp field so the AC-F5-1 time-window filter is unimplementable (PM decided: add startedAt from the injected clock); OQ-T6 DEC-8 'sequence discontinuity' detection unachievable as written because the state port derives next sequence from verified ledger length (PM decided: audit-consumer ordinal assigned under the audit fence, gaps detectable on read). 10 non-blocking OQs (T1-T4, T7-T11) delegated to spec-writer for in-spec resolution within ticket pins. Test plan iteration 1 (34 TCs) authored but reconciliation pending after spec fix."
    type: info
