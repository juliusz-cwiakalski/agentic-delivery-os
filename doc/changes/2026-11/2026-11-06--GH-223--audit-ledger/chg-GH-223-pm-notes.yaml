  - text: "Spec v1.1 (specification iteration 2 complete): OQ-T5 fixed via new AC-F1-4 (startedAt from injected clock, exactly-once); OQ-T6 fixed via narrowed DEC-8 (audit consumer assigns monotonic auditSeq under the shared audit fence; skipped ordinals are in-band read findings, state port untouched); OQ-T2 resolved with durable store-managed chaining-key artifact (0600, through the public port) so cross-process chain verification never false-flags; OQ-T1/T3/T4/T7/T8/T9/T10/T11 resolved (record kind audit.invocation, schema delivery.audit.invocation.v1, key audit.invocations). AC set now 15 (14 prior + AC-F1-4)."
    type: info
    date: "2026-11-06"
  - text: "Retro 1: the reopened-specification loop cost one extra spec+test-plan iteration. Root cause: initial spec authoring optimized for ticket ACs and missed derived requirements (timestamp for filters, mechanism realism against the state port). Improvement candidate: artifact authors should run a 'mechanism-realism' self-check against the public ports their design composes before returning (test-plan-writer effectively did this). The reopen-on-gap gate caught it before delivery — no code rework."
    type: retro
    date: "2026-11-06"
  - text: "REOPEN loop 2 (specification reopened again, iteration 3): test-plan reconciliation found NEW-GAP-1 blocking — v1.1's 'auditSeq assigned at append inside the fence' does not make ordinal consumption durable, so a failed append leaves no observable gap (same mechanism-realism class as OQ-T6). PM direction: reservation-first two-phase append (audit.reservation kind before invocation record, both chain-covered). NEW-GAP-2..5 non-blocking pins bundled into the same iteration to force convergence. Test plan v1.1 stands at 42 TCs with TC-039 failing loudly by design until the mechanism is pinned."
    type: info
    date: "2026-11-06"
  - text: "Spec v1.2 (specification iteration 3 authored + PM-validated): NEW-GAP-1 fixed via reservation-first two-phase append (audit.reservation kind, schema delivery.audit.reservation.v1, payload auditSeq+runId only, appended under the same fence acquisition BEFORE the invocation record; ordinal = max reservation ordinal + 1 from verified ledger truth; both failure scenarios specified; two-appends-per-invocation accepted as deliberate cost; exactly-one AC counts invocation records only). NEW-GAP-2..5 pinned (key artifact chain-key.<workspace>.json in the store-layout family with existing-identity open failures; startedAt epoch ms UTC, inclusive [from,to] with omitted side unbounded; wholesale kind-agnostic salvage removal with the surviving last-valid-frame reservation corollary). Spec author returned the required mechanism-realism certification: every mechanism verified against state-layer/result-contract port semantics; no in-place mutation, no non-rebuildable derived doc, no new runtime-API location, no ambient env read, no new error-table rows. PM accepted the flagged interpretive reading on NEW-GAP-4 (a reservation that is itself the last valid frame survives salvage as DEC-8 evidence — mechanically forced by the port's truncate-to-last-valid-frame semantics). AC count stable at 15."
    type: info
    date: "2026-11-06"
  - text: "Retro 3 (PM self-correction): the PM corrupted chg-GH-223-pm-notes.yaml three times while appending notes — each edit used an existing note as oldString and failed to retain it in newString, silently deleting durable history (repaired by re-insertion each time; YAML re-validated once). Lesson: appending to a YAML list requires anchoring on the FOLLOWING element or file end and always including the anchor text in both strings; a post-edit parse check should be routine for every pm-notes edit, not only after suspected corruption."
    type: retro
    date: "2026-11-06"
