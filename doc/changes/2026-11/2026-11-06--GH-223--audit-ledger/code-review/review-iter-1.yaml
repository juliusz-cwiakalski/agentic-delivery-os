  pinned single-user trust model an HMAC would be equally forgeable, so no AC
  is violated), plus minor items on the un-amended AC-F2-1 verbatim wording,
  undeclared plan-scope files from remediation/doc-sync, the containment-path
  exit-code divergence in the audit record, and the PM-accepted silent
