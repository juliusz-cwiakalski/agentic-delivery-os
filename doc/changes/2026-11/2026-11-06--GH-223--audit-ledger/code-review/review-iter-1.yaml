verified_without_findings:
  - >-
    Fence discipline: the state fence is one lock file per workspace
    (fence.<workspace>.lock); acquireFence fails busy regardless of token, so
    the per-runId token is a label and both audit appends serialize under the
    one shared fence; releaseFence runs in a finally block.
  - >-
    Ordinal durability: allocated inside the fence from the highest verified
    reservation ordinal + 1; TC-038 proves continuation across reopened store
    instances (auditSeq 4 after 3 pairs, key reused, 8 records verified).
  - >-
    Chain coverage: link alternation reservation->invocation with anchor first;
    verification content excludes only chainValue and matched the assembly
    content for both kinds (RunTiming is exactly {totalMs}, so no payload/
    content drift); cascading breaks use the stored link, non-string links
    fall back to the recomputed one.
  - >-
    Tamper suite: mutateAuditRecord recomputes the unkeyed checksum
    (independentChecksum), so the pinned recomputed-checksum tamper class —
    including the orphaned reservation (TC-049) — is genuinely exercised, with
    a clean control and both-kind coverage.
  - >-
    Redaction: command, arguments, and identity value are redacted at facts
    assembly through the serialize.ts chokepoint; TC-032 both halves pin no
    secondary serialization path; reservation payloads carry no invocation
    metadata.
  - >-
    Read surface: mandatory positive-integer limit (missing/invalid ->
    input.value.rejected), exact scope/repo/command/outcome matching with
    repo-absent exclusion only under repo constraint, inclusive [from,to]
    startedAt window with omitted sides unbounded, in-band matched/truncated,
    chain verdict over the whole domain, no unbounded dump export (structure
    test includes a detector meta-test), library-only (no CLI command).
  - >-
    Scripted trim: single write site serializeScriptedLine emits exactly
    {"data":...} / {"error":...,"runId":...} minified lines; --verbose forces
    the full envelope; goldens exist per outcome class including broken
    invocations; testkit SCRIPTED_RULES with negative controls; interactive
    goldens byte-identical (mode default interactive preserved them).
  - >-
    Tier boundaries: audit consumer imports only #contracts and
    ./artifact-boundary.js; contracts runtime-neutral; no branding in the
    state tier; randomHex lives only in driver/runtime-edge.ts (node:crypto);
    no driver discriminant; exit-code literals check clean; error-table-sync
    re-run independently: 53/53, zero drift, no new rows.
  - >-
    Production composition remediation verified real: epoch-ms Date.now clock,
    isTTY-omitted-means-scripted mode resolution, home-derived
    <home>/<stateDirectoryName> store, claimed identity capture, DEC-8
    degradation with the state identity on stderr, no process-relative clock
    (production-composition.test.ts, 6 tests).
  - >-
    Traceability: all 50 TC ids cited in test code (verified by grep);
    15/15 ACs delivered; per-phase completion evidence in pm-notes with
    commits and test results for phases 1-6 plus phase-7 doc-sync and the
    remediation reopen; plan validate claim noted as not executable in this
    checkout (execution log records the reason).
  - >-
    Aggregate gate: pnpm check exit 0 claim reproduced modulo two documented
    environment quirks — ci-baseline-parity needs TMPDIR inside the repo
    (execution-log deviation 8; passes with it), and the watchdog subprocess
    suites are load-sensitive (they pass serially; my initial overlapping runs
    contended). No GH-223-related failure found in any run.
