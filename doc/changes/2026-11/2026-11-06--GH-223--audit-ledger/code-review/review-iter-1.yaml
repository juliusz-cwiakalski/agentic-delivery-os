findings:
  - id: F-1
    severity: medium
    confidence: high
    category: security
    location: packages/core/src/state/audit.ts:130-139
    message: >-
      The "keyed" chain link is two passes of FNV-1a-64 with the key hex
      prepended. FNV-1a's step h = (h XOR b) * PRIME mod 2^64 is exactly
      invertible (the odd prime has an inverse mod 2^64), so from one observed
      record (content + chainValue are both readable through the read surface)
      anyone can recover the internal state after the key prefix and forge
      valid chain values for altered or appended records without ever reading
      chain-key.<workspace>.json. The key's exclusion from lanes (NFR-4,
      AC-F4-2) is therefore cryptographically inert: forgery-resistance equals
      the unkeyed case, resting solely on file-permission honesty. Within the
      pinned single-user trust model (RSK-3 concedes same-user processes read
      state artifacts, so an HMAC would also be forgeable in-model) no AC is
      violated and the mutation suite passes by construction — but the
      spec/doc narrative that key secrecy is load-bearing tamper-evidence is
      stronger than what the primitive delivers.
    suggestion: >-
      Either replace the link primitive with a sync MAC (e.g. HMAC over a
      pure-JS SHA-256 in the runtime-neutral tier, keeping auditChainValue
      sync; widen AUDIT_CHAIN_VALUE_HEX_LENGTH and the "32 lowercase hex"
      statement in feature-audit-ledger.md), or add one precise sentence to
      feature-audit-ledger.md stating that within the pinned model the chain
      is an integrity marker and forgery-resistance rests on the state
      directory's least-privilege permissions, not on key secrecy. Recommend
      the PM queue the hardening variant as a follow-up story rather than
      blocking this one.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
