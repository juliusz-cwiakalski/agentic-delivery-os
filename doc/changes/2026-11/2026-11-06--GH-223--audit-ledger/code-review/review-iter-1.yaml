  - id: F-4
    severity: low
    confidence: high
    category: correctness
    location: packages/cli/src/index.ts:346-416
    message: >-
      The audit record is written from the original envelope before output
      rendering (correct per DEC-8 ordering), but if writeOutput throws, the
      containment fallback returns fallback.internal's exit code 1 while the
      already-written audit record keeps the original exitCode/outcomeClass
      (e.g. 0/success). The durable trail then misstates the invocation's
      actual exit on that narrow path (hostile/broken injected streams, EPIPE).
      Exactly-one is unaffected; re-auditing would violate it, so the
      divergence is an accepted consequence of the pinned ordering.
    suggestion: >-
      Either document the containment-path divergence in
      feature-audit-ledger.md (one sentence beside the audit-write failure
      semantics), or, if deemed worth it later, fold the actually-returned exit
      code into the record by computing the fallback before the audit write
      only when serialization is known-broken. Documentation touch preferred;
      no code change required now.
