decisions:
  - text: >-
      Scope authority for this change is the M2 planning pack (ticket M2-S15,
      `doc/planning/oss-tooling/backlog.md` §M2-S15,
      `milestones/m2/contracts.md` §Queue lifecycle mutations,
      `milestones/m2/commands/queue.md`, `milestones/m2/architecture.md` §Queue
      auto-release / §Single-flight / §Persistence and concurrency deltas,
      `milestones/m2/test-scenarios.md` SC-M2-S15-01..04). The change delivers
      five behaviours: reason-bearing `queue remove`; automatic `landed` removal
      from `closeout --apply`; `queue dep add` / `dep remove` with the delivered
      two-positional add preserved; per-ref single-flight across dispatch paths
      with `queue.single-flight` naming the holder; and `queue reconcile`
      against tracker truth with reason `reconciled`. `queue release` keeps its
      delivered lease-release meaning and never removes an entry. No scope is
      added beyond these five behaviours.
    date: "2026-11-12"
  - text: >-
      Error identities are unique rows, so the change adds exactly two
      identities — `queue.reason-missing` (removal without a reason, exit 1) and
      `queue.single-flight` (second dispatch/claim against a ref with an active
      lane, naming the holder, exit 1) — and reuses the delivered
      `queue.entry.unobserved` for an unknown ref instead of adding the M2
      queue(1) page's `queue.entry-unknown` synonym. Delivered `state.*`
      identities cover unreadable state; the page's `queue.state-unavailable` is
      not added. The M2 `commands/queue.md` page is reconciled to the delivered
      identity names during the change rather than carrying a duplicate
      identity.
    date: "2026-11-12"
  - text: >-
      Single-flight is enforced at dispatch admission, not by widening the lease
      scope: the delivered lease stays repository-exclusive (one lane per
      repository, per the scheduling-engine spec) and the refusal is a separate
      per-ref guard that reads active lane/lease truth and names the holder.
      This matches the M2 evidence (a dual-run observed a second concurrent
      session on one ref) without rewriting the delivered lease contract.
    date: "2026-11-12"
  - text: >-
      Entry removal is append-only state truth: a removal record (with the
      reason and `landed`/`abandoned`/`superseded`/`reconciled` vocabulary)
      lands in the queue ledger and the fold drops the entry; no state file is
      edited or deleted by hand, and the derived graph document is replaced
      atomically only when intent truth changes. Automatic removal runs inside
      `closeout --apply` after the closeout writes succeed, because the merge
      itself is outside this tool's write surface.
    date: "2026-11-12"
  - text: >-
      Spec OQ-1 decided (adopts spec DEC-9): `queue remove` refuses while the
      ref's lane lease is live, naming the holder, and removes nothing; the
      operator runs the delivered `queue release` first. Removal never releases
      a lease, so it cannot retire an entry whose session is still writing.
      "Abandoned mid-run" is handled by release-then-remove, two explicit acts.
    date: "2026-11-12"
  - text: >-
      Spec OQ-2 decided (adopts spec DEC-10): removal is allowed while another
      entry still depends on the removed ref; the dependent is held with the
      delivered `dependency-unobserved` blocking reason and `dep remove` is the
      supported remedy. No cascade, no edge rewrite, no new refusal identity.
    date: "2026-11-12"
  - text: >-
      Spec DEC-13 accepted into scope: same-holder lease renewal is narrowed to
      the same (repository, ref, holder); a same-holder claim for another ref
      refuses the delivered `queue.lease-conflict`. The delivered renewal
      rewrites the lease's ref, which breaks repository exclusivity and makes
      the per-ref guard bypassable, so the narrowing is required for AC-F4 and
      is a defect fix, not new scope.
    date: "2026-11-12"
