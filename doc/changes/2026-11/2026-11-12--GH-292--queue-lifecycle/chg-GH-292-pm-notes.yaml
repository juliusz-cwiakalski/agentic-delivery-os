  - text: >-
      Plan phase 6 complete (commit 0bd61db0): CLI surface — `queue reconcile
      [--ref <ref>]` mounted against tracker delivery state. The core sweep
      reads every examined entry (exactly one bounded tracker read each,
      sequential, no retry, none past the 100-entry cap) before the first
      removal, removes only `done`/`canceled` with reason `reconciled` through
      the ordinary F-1 seam (park withdrawal, one append, one
      `queue.graph/remove` per ref), retains every open state with its observed
      alias, retains a not-found item as `unobserved`, converges truthfully on
      a repeat run (`checked` counts only still-existing entries; zero
      appends/events), fails closed on the provider's own identity
      (`provider.outage`/`provider.quota.exceeded` at exit 2,
      `provider.auth.rejected` at exit 1, no `queue.*` synonym, zero appends),
      and the payload is exactly the nine declared keys with bounded,
      identifier-only values. The read rides the existing verified read bridge
      in `edge.ts` (`readTrackerDeliveryState`) wired by `production.ts` over
      the closeout client's per-issue observation (no new adapter operation, no
      ambient credential read, no `status` list read); help gained the family
      synopsis `reconcile` entry, the verb help path with `--ref`, and the
      AC-F7-1 four-spellings proof; TC-QLC-058's golden layer landed
      (`tests/golden/queue-reconcile.test.ts`, three committed goldens,
      committed `regenerate.ts` writer). Gates: typecheck 12/12 Done; the seven
      reconcile behaviour suites 14 pass / 0 fail; the TC-QLC-056 cap proof
      (105 entries, declared 600s budget) 1 pass in ~212s; the read-cost suite
      incl. the TC-QLC-083 cap proof (declared 600s budget) 9 pass / 0 fail in
      ~189s; reconcile goldens 3 pass; help lifecycle + hermetic 17 pass;
      structure cli-edge-seam + content-inventory 34 pass; delivered
      remove/lease controls 47 pass; error-table-sync OK (129 entries);
      forbidden-literals, secret-read-boundary (357 files), ambient-globals
      (181 files) all clean. Disclosed deviations: (1) the core sweep was
      reworked to read-first — the interrupted session's remove-as-you-go loop
      could append removals before a mid-sweep unreadable read, violating F-5's
      no-partial-success rule (AC-F5-4); the mid-sweep unreadable proof now
      asserts zero removals, a byte-identical ledger, and the stale entry
      still present; (2) the reconcile harness `seedLease` checked `.ok` on a
      Promise and always threw; it is now the delivered synchronous claim, and
      the reconcile path gained the missing live-lease refusal proof
      (`queue.precondition.unmet`/`lease-held` with the holder named, zero
      appends, `queue release` clears it); (3) the two production-bridge test
      fixture issue bodies gained the `title` field `normalizeGithubIssue`
      requires (titleless bodies decoded `invalid` and truthfully surfaced
      `provider.outage`); the production mapping itself is unchanged;
      (4) the two minutes-scale cap proofs declare 600_000 ms per-test budgets
      because 100 verified F-1 removals over the real store are inherently
      minutes-scale; (5) `biome.json` sits outside the declared scope (flagged
      scope-drift by the commit primitive): the byte-exact reconcile golden
      fixtures carry the delivered formatter-disabled override pattern (seven
      existing golden dirs) so committed bytes stay runtime-identical; and the
      same scan exposed a pre-existing latent gap, committed in an earlier
      phase: `tests/fixtures/queue/removal/golden/remove-success.json` is not
      biome-stable under `biome format .` — left for the quality_gates phase
      with the same one-line override as the remedy.
    type: "info"
    date: "2026-11-12"
  - text: >-
