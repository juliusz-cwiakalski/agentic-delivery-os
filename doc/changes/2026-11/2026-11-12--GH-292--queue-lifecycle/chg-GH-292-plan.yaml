  # ---------------------------------------------------------------------------
  # Phase 9 — Release: lockstep changeset, the staged decision record, and the
  # full-battery exit.
  #
  # Objective: publish the change as one lockstep minor over the five
  # publishables, stage the untracked TDR-0026 together with its restored
  # `doc/decisions/00-index.md` row, and prove the whole branch green.
  # `version_impact: minor` (from the spec) is the changeset class; the group is
  # fixed by `.changeset/config.json`, so one file names all five packages. The
  # changeset note states the disclosed behaviour narrowing (a same-holder claim
  # for a second ref now refuses `queue.lease-conflict` instead of renewing and
  # rewriting the lease's ref) and the three new semantic additions.
  #
  # Decision-record staging: see the header contract. Both
  # `doc/decisions/TDR-0026-queue-lifecycle-removal-single-flight.md` (untracked)
  # and `doc/decisions/00-index.md` (row removed from the working tree) are
  # declared here, land in ONE phase-mode commit, and are never split: the row
  # must not link an absent record, and the record must not land unindexed. The
  # row text is the one pinned in `chg-GH-292-pm-notes.yaml`.
  #
  # Dependency reasoning: a release commit must be the last commit on the branch,
  # so no later phase can legitimately follow it. The exit battery is the whole
  # repository's gate, which is only meaningful once every earlier phase is
  # complete.
  #
  # Note on the decision-record gate: `tests/checks/decision-record.test.ts` is a
  # DELIVERED convention control (it pins TDR-0013 and the index-row convention);
  # it cannot prove TDR-0026. TDR-0026's landing is proven by the two DoD bullets
  # above — the record is tracked after the commit and the index carries exactly
  # one row for it — so the gate runs the control and the DoD carries the proof.
  # ---------------------------------------------------------------------------
  - id: 9
    title: "Release: one lockstep minor changeset, the staged TDR-0026 with its restored index row, and the full-battery exit"
