# OPEN CONTRACT DECISION — the `error.detail` slot on a FAILURE envelope (blocks
#   the shape half of AC-F4-1/AC-F4-2; decision owner @decision-advisor, wording
#   owner @spec-writer):
#   AC-F4-1 says `dispatch run` refuses with `error.code == "queue.single-flight"`
#   AND `error.detail.holder`. The delivered failure envelope is
#   `CommandResultFailure`, whose `error` is `CommandResultError` — exactly the six
#   table-derived fields, and that six-field shape is pinned by
#   `tests/types/dispatch-envelope-detail.type-test.ts` (a `@ts-expect-error` cell
#   asserts `CommandResultError` carries no `detail`) and restated by the delivered
#   result contract (TDR-0005 and the spec's §2.1, which both keep the error at
#   six fields). The only delivered additive detail slot is
#   `DispatchEnvelopeError.detail`, which rides a SUCCESS-shaped attempt envelope
#   inside `data.error` and is pinned to `kind: "harness" | "config"`. The shared
#   CLI envelope builder (`packages/cli/src/index.ts`, `toErrorObject`) rebuilds
#   the error from the table entry plus `summary` and drops every other handler
#   field, and the delivered precedent for naming a lease holder is
#   `error.summary` (`holder:…; lease:…; …`). The refusal's `detail` therefore
#   cannot be delivered without a recorded decision. Candidate resolutions:
#     (a) RECOMMENDED — widen the failure envelope additively for the two named
#         command families only: a command-scoped failure type carrying an optional
#         `detail` (`{ holder }` for this refusal), leaving `CommandResultError`
#         at six fields. Consequence: `packages/cli/src/index.ts`,
#         `packages/core/src/contracts/result.ts`, the dispatch/queue failure
#         types, one type probe, and the result-contract page move.
#     (b) Add an optional `detail` to `CommandResultError` itself. Consequence:
#         it widens EVERY command's failure envelope and contradicts the delivered
#         six-field pin in the type test — the least additive option, not
#         recommended.
#     (c) Keep the six-field error and carry the holder only in `summary`.
#         Consequence: AC-F4-1 as written is not met and the spec owner must amend
#         it before Phase 2; the refusal identity and purity still ship.
#   Decision needed: consult `@decision-advisor` for a TDR-0005 addendum (the
#   repo's own precedent for a result-contract change is TDR-0010, "TDR-0005
#   Addendum"), filed as `doc/decisions/TDR-0027-command-failure-envelope-detail-slot.md`
#   — the id and file name are PROVISIONAL until the advisor confirms the next
#   free number; a different number re-plans Phase 2's two decision paths. The
#   record and its `doc/decisions/00-index.md` row land in ONE Phase-2 phase-mode
#   commit under the same one-sided-link rule as Phase 9 (a row must never link an
#   absent record), and Phase 9 inserts the TDR-0026 row immediately BEFORE the
#   TDR-0027 row. Phase 2 declares the option-(a) paths so either the decision or
#   its absence is staged, and it MUST NOT choose silently and MUST NOT relax the
#   six-field `CommandResultError` pin to make the AC fit. The refusal identity,
#   the holder value, the zero-mutation purity, and the three-path parity are NOT
#   blocked: they proceed in Phase 2 whatever the decision says.
# =============================================================================

