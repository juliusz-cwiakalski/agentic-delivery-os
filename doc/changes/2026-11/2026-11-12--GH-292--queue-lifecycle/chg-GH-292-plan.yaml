  # byte-identical. `--reason` is a declared flag with a required value: a missing
  # flag is the queue error `queue.reason-missing` (exit 1, nothing appended), an
  # out-of-vocabulary value or a missing value is `input.value.rejected`, and the
  # reason is rendered from the closed four-value vocabulary. `dep remove` adds
  # `removed` to the dependency result vocabulary without widening the delivered
  # `queue add` result set, and reports the recomputed ready set plus the event
  # topic/kind. The removal payload is exactly `ref`, `result`, `reason`,
  # `readySet[]`, `event`, `degraded[]`; the dependency-removal payload is the
  # delivered mutation keys plus `readySet[]` and `event`. Help gains the family
  # entry listing the new verbs, per-verb entries, and the corrected `queue dep`
  # synopsis and example (the delivered two-positional grammar it already
  # implements), and the human renderer is extended for the new payloads within
  # the delivered caps.
