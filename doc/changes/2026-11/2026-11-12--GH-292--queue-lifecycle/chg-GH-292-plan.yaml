      - "A lease at or over its TTL is not refused by the guard on either path and the delivered stale takeover still appends its incident evidence; every requester/state pair has exactly one outcome per the F-4 precedence table (TDR-0026 DC-2/DC-3) and no case asserts a same-holder/same-ref claim refusal."
