  # ---------------------------------------------------------------------------
  # Phase 6 — CLI surface: reconcile against tracker truth.
  #
  # Objective: mount `queue reconcile [--ref <ref>]` over the delivered tracker
  # read, with the staleness fact fixed to the normalised `deliveryState` of
  # `done` or `canceled`, and every other state retained and reported with its
  # observed state. Scope is the invoking checkout's per-repository queue; with
  # `--ref` exactly one entry is examined. The read is one bounded call per
  # examined entry through the injected declared credential port — no ambient
  # environment read, no command-line token, no retry, no pagination, no
  # concurrent read — bounded at 100 entries with `truncated` and an exact
  # `remainder`. An unreadable tracker appends nothing and exits on the provider
  # identity's own projection with no `queue.*` identity; a not-found item is
  # retained and reported `unobserved`; every removal is an ordinary F-1 removal
  # with reason `reconciled`. The payload is exactly `result`, `checked`,
  # `removed[]`, `retained[]`, `unobserved[]`, `readySet[]`, `truncated`,
  # `remainder`, `degraded[]`. The composition injects the tracker-read port and
  # the reconcile help entry plus the family line land in the same commit.
  #
  # Dependency reasoning: reconcile composes the removal seam (Phase 1) and the
  # event producer (Phase 4) and adds only the read and the bounded sweep, so it
  # follows both. Its help entry must land with the command (the family synopsis
  # is one string), which is also when AC-F7-1 becomes true.
  #
  # Risks: a partial or failed read manufacturing a removal (fail-closed is the
  # safety property), a second read per entry, and a payload that echoes tracker
  # content. Deviation policy: a tracker write, an ambient credential, an
  # unbounded sweep, or a `queue.*` identity for a provider failure is a
  # stop-and-escalate.
  # ---------------------------------------------------------------------------
