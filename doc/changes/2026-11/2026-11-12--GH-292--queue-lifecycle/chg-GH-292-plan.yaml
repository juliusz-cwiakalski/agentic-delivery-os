  # ---------------------------------------------------------------------------
  # Phase 2 — Admission and per-ref single-flight.
  #
  # Objective: close the duplicate-session defect with the path-specific
  # precedence of TDR-0026 DC-2/DC-3 (spec v1.2 F-4): the dispatch family —
  # `dispatch run` and a composed daemon supervision cycle — shares ONE
  # admission predicate evaluated before any claim, spawn, resume, attempt, or
  # record, and refuses ANY live lease whose recorded ref equals the requested
  # ref, same or different holder (the dispatch path claims with the fixed
  # holder `dispatch` and never renews mid-flight, so a live same-ref lease can
  # only name a running dispatch), naming the holder in the envelope-root
  # `detail.holder`; `queue claim` keeps its delivered holder-aware outcomes —
  # the caller's own holder's same-ref lease renews, another holder's same-ref
  # lease refuses `queue.single-flight`, any other-ref live lease refuses the
  # delivered `queue.lease-conflict`; a lease at or over its TTL is not active
  # on either path and keeps the delivered stale-takeover. To make the guard
  # enforceable, renewal narrows to one `(repository, ref, holder)`: the direct
  # `claimQueueLease` seam's same-holder/same-ref renewal is unchanged (the two
  # delivered lease controls prove it), and a same-holder claim for a different
  # ref refuses `queue.lease-conflict` so the lease's recorded ref cannot be
  # rewritten to a second ref.
  #
  # Dependency reasoning: the dispatch refusal belongs in the dispatch family's
  # admission seam, NOT inside the claim primitive — a blanket `(ref, holder)`
  # predicate would either make `renewed` unreachable through `queue claim` or
  # leave the second dispatch admitted (AC-F4-1/2/5 hold together only under
  # the path-specific table). The narrowing must land with the guard: while
  # renewal rewrites `ref`, the guard is bypassable by claiming another ref
  # under the holding identity, so a guard-only commit is a false invariant.
  # The envelope-root `detail` slot rides the recorded TDR-0027 ALT-3 decision
  # staged in this phase.
  #
  # Risks: refusal precedence against the delivered owner hold and the delivered
  # precheck; the exact-holder controls (`queue-lease`, `queue-lease-concurrency`)
  # must stay green untouched, and the read cost must stay within one additional
  # whole-store read. The `detail.holder` shape is settled by TDR-0027 ALT-3
  # (envelope root, command-declared, `CommandResultError` at exactly six
  # fields; `error.detail` rejected); the record and its index row land in this
  # phase's one commit under the staging contract. Deviation policy: any change
  # to the delivered refusal precedence, TTL, takeover rule, or lease scope —
  # and any widening of `CommandResultError` — is a stop-and-escalate.
  # ---------------------------------------------------------------------------
  - id: 2
