      one `queue.removal` record kind with `delivery.queue.removal.v1`, key prefix
      `queue.removals:<REF>`, identity `ref`, the declared fields `schema`,
      `ref`, `reason`, `recordedAt` plus the additive caller principal, and the
      closed four-value reason vocabulary `landed | abandoned | superseded |
      reconciled`; the entry-presence rule applied in `foldQueueGraph` so
      `queue list`, `queue plan`, `queue ready`, `lanes`, the derived
      `queue-graph.json`, and the `queue` snapshot topic all lose a removed
      entry and all keep a re-declared one; the removal append itself (park
      withdrawal with the delivered `recoveryState: "released"` record first when
      a park is active, then the removal record, both verified post-append inside
      one fenced transaction, then the derived-document replacement only when the
      folded intent truth changed); the live-lease refusal
      (`queue.precondition.unmet`, blocking reason `lease-held`, holder named,
      zero appends, no lease released); dependency-edge removal over the
      delivered edge set (one append carrying the folded set, no cycle check, an
      absent edge is a `noop` at exit 0 with zero appends and zero events); and
      the reconcile mutation seam (a removal applied under the F-1 invariants
      from an already-decided stale set). Also: two `queue` error rows
