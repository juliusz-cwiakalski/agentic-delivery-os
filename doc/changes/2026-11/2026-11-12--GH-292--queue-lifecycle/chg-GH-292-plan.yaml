  # ---------------------------------------------------------------------------
  # Phase 5 — CLI surface: removal, dependency edges, and self-description.
  #
  # Objective: expose `queue remove <ref> --reason <reason>` and the explicit
  # dependency grammar `queue dep add <ref> <on-ref>` / `queue dep remove <ref>
  # <on-ref>` while keeping the delivered two-positional `queue dep <ref> <on-ref>`
  # byte-identical. `--reason` is a declared flag with a required value: a missing
  # flag is the queue error `queue.reason-missing` (exit 1, nothing appended), an
  # out-of-vocabulary value or a missing value is `input.value.rejected`, and the
  # reason is rendered from the closed four-value vocabulary. `dep remove` adds
  # `removed` to the dependency result vocabulary without widening the delivered
  # `queue add` result set, and reports the recomputed ready set plus the event
  # topic/kind. The removal payload is exactly `ref`, `result`, `reason`,
  # `readySet[]`, `event`, `degraded[]`; the dependency-removal payload is the
  # delivered mutation keys plus `readySet[]` and `event`. Help gains the family
  # entry listing the new verbs, per-verb entries, and the corrected `queue dep`
  # synopsis and example (the delivered two-positional grammar it already
  # implements), and the human renderer is extended for the new payloads within
  # the delivered caps.
  #
  # Dependency reasoning: this phase is the first surface a human or agent touches,
  # so every refusal it can produce must already have its identity (Phase 1) and
  # its event producer (Phase 4). The two-positional add is preserved by routing
  # both spellings to the same operation, which is what AC-F3-1 compares.
  # `reconcile` is deliberately NOT mounted here: the family synopsis is one
  # string, and advertising a verb that is not registered would make the help
  # surface lie.
  #
  # Risks: grammar ambiguity between `dep <ref> <on-ref>` and `dep remove <ref>
  # <on-ref>`; a required flag that turns a queue refusal into a grammar refusal;
  # human output drifting past the delivered byte caps. Deviation policy: a
  # delivered payload key, result value, or exit that would change is a
  # stop-and-escalate; `queue release` is untouchable.
