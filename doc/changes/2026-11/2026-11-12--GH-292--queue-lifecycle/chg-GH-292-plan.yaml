#   - Decision: doc/decisions/TDR-0026-queue-lifecycle-removal-single-flight.md
#               (Proposed; UNTRACKED at plan time — `?? doc/decisions/TDR-0026-…`
#               — with DC-1..DC-6: the `queue.removal` kind and latest-record
