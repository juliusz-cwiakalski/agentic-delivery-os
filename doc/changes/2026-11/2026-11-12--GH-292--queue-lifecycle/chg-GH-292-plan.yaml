    - "The per-ref guard would need a per-ref lease scope, a changed TTL, a changed stale-takeover rule, a second admission stage, or the guard to run after the fence"
    - "A removal path would release a lease, cascade to another entry's edges, or append a record for a ref that was not asked for"
    - "Reconcile would write to the tracker, read an ambient credential, retry, paginate, read concurrently, or read beyond the declared 100-entry cap"
