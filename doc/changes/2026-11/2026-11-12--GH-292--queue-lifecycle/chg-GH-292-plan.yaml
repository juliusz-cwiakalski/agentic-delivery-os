  # ---------------------------------------------------------------------------
  # Phase 1 — Contracts, fold, error rows, record kinds, and the mutation truth.
  #
  # Objective: make removal a declared, append-only state fact and give the
  # delivered modules the two mutation seams the later phases call. The removal
  # record kind (`queue.removal`, `delivery.queue.removal.v1`,
  # `queue.removals:<REF>`) joins the declared record set; the fold gains the
  # single presence predicate (entry present iff its latest entry record is later
  # than its latest removal record) so every read — list, plan, ready, lanes, the
  # derived document, the snapshot topic — follows one rule; removal append,
  # park withdrawal, the live-lease refusal, dependency-edge removal, and the
  # reconcile mutation seam land in the delivered app module; and the queue error
  # kind grows from five rows to seven with the two new identities.
  #
  # Dependency reasoning: every later phase consumes these declarations, the
  # presence rule, or the error identities. The guards here are bidirectional
  # (machine table <-> documented table, declaration <-> fixture), so the rows
  # and their documentation cannot be split across phases. The derived document
  # is written in the same fenced transaction that appends the records, and it is
  # replaced only after the appends verify; a store with no removal records folds
  # and writes byte-identically, which is what makes the delivered goldens
  # controls rather than edits.
  #
  # Risks: the presence rule is the one place a mistake silently resurrects or
  # loses an entry; the append/park/verify order inside one fence is the atomicity
  # contract. Deviation policy: any need to touch a delivered record payload or
  # the state schema is a stop-and-escalate (see the tier trigger), never a local
  # edit; record it in pm-notes and re-open planning.
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Contracts, fold, error rows, record kinds, and the append-only removal, dependency-removal, and reconcile mutation truth"
