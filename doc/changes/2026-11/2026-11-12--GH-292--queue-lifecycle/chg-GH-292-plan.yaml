      - "The refusal carries no credential, session id, provider payload, or repository content, and the detail is single line and bounded (128 characters, identifiers only)."
      - "The refusal's holder value rides the additive optional command-declared envelope-root `detail` object fixed by TDR-0027 ALT-3: `CommandResultError` keeps exactly its six fields, `error.detail` appears in no shipped surface, and the TDR-0027 record plus its `doc/decisions/00-index.md` row land in this phase's ONE phase-mode commit — the row is added to the working tree only in this phase, never while the record is untracked and never in an earlier or out-of-order commit."
