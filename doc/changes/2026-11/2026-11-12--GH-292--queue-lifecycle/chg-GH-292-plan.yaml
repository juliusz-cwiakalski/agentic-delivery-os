      `QUEUE_RECORD_DECLARATIONS` 5 -> 6; and the two guard-read `doc/spec/**`
      pages that state the moved counts — `feature-result-contract.md`'s machine
      table, counts, queue-kind prose, and cross-feature scheduling-row sentence
      (five -> seven rows), and `feature-state-layer.md`'s record-kind inventory
      (five -> six) — reconciled in the same commit. No command surface and no
      event producer in this phase. [F-1, F-3, F-5, DM-1..DM-5, DM-8, DEC-4,
      DEC-5, DEC-6, DEC-7, DEC-9, DEC-15, NFR-1]
    dependsOn: []
