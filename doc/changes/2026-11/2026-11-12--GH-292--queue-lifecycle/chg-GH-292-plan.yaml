# DECISION-RECORD STAGING CONTRACT (both records, each with its index row in
# the one phase-mode commit that stages the record):
#   `doc/decisions/TDR-0026-queue-lifecycle-removal-single-flight.md` and
#   `doc/decisions/TDR-0027-command-failure-envelope-detail-slot.md` are both
#   UNTRACKED at plan time, and `doc/decisions/00-index.md` carries NEITHER row
#   in the working tree. The commit primitive stages tracked-pending work
#   unconditionally (scope drift is disclosed, not blocked), so an index row
#   present in the working tree before its owning phase would ride any earlier
#   commit and link an absent record — the exact one-sided link this contract
#   forbids. The rule for both records: the `doc/decisions/00-index.md` row is
#   withheld from the working tree and added ONLY inside the phase whose commit
#   also stages the record; never while the record is untracked, never in an
#   earlier or out-of-order commit. `doc/decisions/00-index.md` is therefore
#   declared in exactly two scopes — Phase 2 (TDR-0027 plus its row) and Phase 9
#   (TDR-0026 plus its row).
#   TDR-0027 (Phase 2): the record that fixes the failure-envelope `detail`
#   slot lands with the refusal that populates it; its index row is added to
#   the working tree only in Phase 2 and lands in Phase 2's ONE phase-mode
#   commit, so no Phase-1 commit can stage a row naming an absent record.
#   TDR-0026 (Phase 9): the record is declared in Phase 9's `scope.files` and
#   lands in the final phase-mode commit; Phase 9 restores the row (immediately
#   after the TDR-0025 row and before the TDR-0027 row landed in Phase 2,
#   status `Proposed`, date 2026-11-12, owner Juliusz Ćwiąkalski) with the
#   exact text pinned in `chg-GH-292-pm-notes.yaml` (`notes[]`: the row begins
#   "| [TDR-0026](TDR-0026-queue-lifecycle-removal-single-flight.md) | TDR |").
#   For each record, record and row land in ONE commit: a row must never link
#   an absent record, and a record must never land unindexed. Both records'
#   status stays `Proposed`; human acceptance rides the GH-292 pull-request
#   review. Neither the plan nor the coder edits either record's decision
#   text; the decision owner (`@decision-advisor`) owns it.
#
# COMMIT / PHASE CONTRACT (binding on every phase):
#   Each phase is one phase-mode commit produced by the `commit` primitive
#   (`commit --phase <n>`, whose subject comes from this phase's `summary`),
#   followed by `phase complete GH-292 delivery` at the boundary. The plan
#   instructs no raw `git add`/`git commit`/`git stash`: the commit primitive
#   owns staging, the scope declared here bounds it, and `phase` owns phase
#   state. A phase that must touch a path outside its declared scope stops and
#   escalates instead of widening the commit.
#
# PHASE SET AND DEPENDENCY ORDER (nine delivery phases):
#   1. Contracts, fold, error rows, record kinds, and the mutation truth.
#   2. Admission and per-ref single-flight, with the renewal narrowing and the
#      TDR-0027 decision for the failure-envelope `detail` slot.
#   3. Closeout automatic landed removal.
#   4. Events: the emitted `remove` producer and the six remove-pin moves.
#   5. CLI surface: `queue remove`, `queue dep add|remove`, `--reason`, help.
#   6. CLI surface: `queue reconcile`, `--ref`, and the injected tracker port.
#   7. Cross-cutting conformance and NFR battery, and the fixture corpus.
#   8. Documentation reconciliation and the planning corpus.
#   9. Release: lockstep changeset, the staged decision record, and the
#      full-battery exit.
#   The CLI surface is split across Phases 5 and 6 because the help family
#   synopsis is one string: advertising `reconcile` before the verb is registered
#   would make the help surface lie, and AC-F7-1 is only true when all four new
#   spellings exist. Phase 9 runs last because a release commit must be the last
#   commit on the branch.
