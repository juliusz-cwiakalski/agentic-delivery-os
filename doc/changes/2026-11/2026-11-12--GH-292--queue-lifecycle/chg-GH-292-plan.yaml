  # ---------------------------------------------------------------------------
  # Phase 3 — Closeout automatic landed removal.
  #
  # Objective: retire a landed ref without manual action. In `closeout --apply`,
  # after the closeout writes complete and only when the merged delivery request
  # is observed, append the landed removal through the removal seam inside the
  # fence closeout already holds, and disclose the outcome in one additive
  # non-step `queueRemoval` data block (`removed`, `would-remove`, `satisfied`,
  # `skipped` with a closed `skipReason`). Plan mode removes nothing and reports
  # `would-remove`; no merge truth, a live lease, unreadable queue state, or a
  # non-canonical ref report `skipped` with the closed reason; a re-run over an
  # already-removed ref, and a ref that never had an entry, report `satisfied` at
  # exit 0. The hook never changes a step outcome or closeout's exit code, never
  # acquires a second fence, and adds no step to the declared inventory.
  #
  # Dependency reasoning: the block calls the removal semantics Phase 1 landed and
  # must land after them, in the same fenced transaction that already holds the
  # single writer. It lands before the event producer so the `landed` removal is a
  # durable record the projection can already observe when Phase 4 turns `remove`
  # on, and before the CLI surface because the block is not a command.
  #
  # Risks: fail-open is the safety property — a hook that fails closeout is worse
  # than a kept entry. Deviation policy: a hook that would need a new closeout
  # error identity, a second fence, or a change to the step inventory is a
  # stop-and-escalate.
  # ---------------------------------------------------------------------------
  - id: 3
