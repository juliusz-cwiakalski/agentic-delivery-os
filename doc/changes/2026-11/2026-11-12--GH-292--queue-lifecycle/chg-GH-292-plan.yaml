  # ---------------------------------------------------------------------------
  # Phase 2 — Admission and per-ref single-flight.
  #
  # Objective: refuse a second session for a ref that already has an active lane,
  # before any lease, spawn, resume, attempt, lane, or queue record, on every path
  # that claims (dispatch, `queue claim`, and a composed daemon supervision
  # cycle), and name the holder in the refusal detail. The guard reads the live
  # lease whose recorded ref equals the requested ref, including when the holder
  # identity is identical; a lease at or over its TTL is not active and keeps the
  # delivered stale-takeover path. To make the guard enforceable, same-holder
  # renewal narrows to one `(repository, ref, holder)`: an identical holder
  # re-claiming the same ref still renews, and any other combination refuses the
  # delivered `queue.lease-conflict` so the lease's recorded ref cannot be
  # rewritten to a second ref.
  #
  # Dependency reasoning: the guard is an admission predicate over lease truth, so
  # it belongs in the one claim seam every path already crosses — landing it in a
  # path-specific branch would make one of the three paths refuse differently.
  # The narrowing must land with the guard: while renewal rewrites `ref`, the
  # guard is bypassable by claiming another ref under the holding identity, so a
  # guard-only commit is a false invariant.
  #
  # Risks: refusal precedence against the delivered owner hold and the delivered
  # precheck; the exact-holder controls (`queue-lease`, `queue-lease-concurrency`)
  # must stay green untouched, and the read cost must stay within one additional
  # whole-store read. The `detail.holder` SHAPE is blocked on the open contract
  # decision recorded in this file's header (option (a) preferred; the
  # TDR-0005-addendum record and its index row are declared below and land in one
  # Phase-2 commit). Deviation policy: any change to the delivered refusal
  # precedence, TTL, takeover rule, or lease scope — and any silent widening of
  # `CommandResultError` — is a stop-and-escalate.
  # ---------------------------------------------------------------------------
  - id: 2
    title: "Per-ref single-flight at admission, the holder-naming refusal, and the narrowed same-holder renewal"
