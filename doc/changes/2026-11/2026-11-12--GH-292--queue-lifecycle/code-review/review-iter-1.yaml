summary: >-
  The GH-292 delivery is unusually faithful to spec v1.2: the append-only
  `queue.removal` kind, the sequence-based presence rule (DM-2), park
  withdrawal, non-cascading removal, the F-4 path-specific single-flight
  precedence (verified row by row against the spec table, including the
  narrowed renewal and the envelope-root `detail.holder`), the fail-open
  closeout `queueRemoval` block, the read-pass-before-removal fail-closed
  reconcile with the exact 100-entry cap, the emitted `remove` producer with
  exactly its declared payload keys, and the seven-row queue error kind are all
  implemented and pinned by two-sided exact assertions; every declared §7.1 pin
  moved as an equality (none relaxed to inequality/subset/`toContain`), all 9/9
  plan phases carry pm-notes completion evidence (commit + gates), the phase-7
  doc reconciliation matches delivered truth, and repo rules hold (`.ados-claude/`
  and `.opencode/` untouched, no headers added, `plan validate` valid, clean
  tree). One blocker-grade spec deviation survives the green battery: every
  removal path refuses `lease-held` on a STALE lease (heartbeat age over its
  TTL), which spec §5.1 F-1 defines as not live and RSK-2 bounds by the TTL —
  empirically confirmed (TTL 90s, age 200s, refusal `queue.precondition.unmet`
  `lease-held`), untested, and undisclosed. Secondarily, NFR-3's read-budget
  claim ("at most 1 queue fold ... at most 1 read when no entry") is neither
  held nor tested: `readQueueFold` performs three whole-store reads including a
  duplicate removals scan, and the delivered TC-QLC-082 pins appends only.
