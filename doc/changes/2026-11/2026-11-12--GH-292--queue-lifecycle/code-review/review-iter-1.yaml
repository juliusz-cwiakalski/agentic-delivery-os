findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/core/src/app/queue.ts:1306
    message: >-
      [B | owner: plan Phase 1 seam, surfaced on Phases 3/5/6 surfaces] A
      removal refuses `queue.precondition.unmet`/`lease-held` for a STALE lease
      (heartbeat age at or over its TTL), on all three removal paths — the
      explicit verb (`removeQueueEntryWithinFence` line 1306), the closeout hook
      (`queueRemovalForCloseout` line 1423, skip `lease-held`), and reconcile
      (same F-1 seam). Spec §5.1 F-1 defines the blocking lease as "live
      (heartbeat age below the lease TTL)"; RSK-2's residual risk states the
      crash delay is bounded by the TTL; and §5.1 F-4's one-liveness-definition
      principle ("every path reads the same liveness predicate") is contradicted
      by the removal path using the stricter any-unreleased-lease predicate.
      Empirically verified via the delivered harness (TTL 90s, clock advanced
      200s: exit 1, `reason=lease-held; holder:crashed-holder`). No test covers
      a stale-lease removal and no pm-note discloses the deviation. The
      operator workaround (`queue release` first) exists, so impact is bounded,
      but a crashed session's stale lease blocks explicit removal, closeout
      auto-removal, and reconcile removal indefinitely.
    suggestion: >-
      Apply the shared `isLeaseStale(held.heartbeatAgeMs, held.ttlMs)` predicate
      in both lease checks so a stale lease does not refuse (the delivered
      takeover/release remedies keep the ledger honest), and add the missing
      stale-lease removal cells for the explicit verb, closeout apply, and
      reconcile. If the owner prefers the stricter refusal, amend spec F-1/AC
      F-1-5/RSK-2 wording and the reconciled feature pages instead — one of the
      two, never both silent.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    confidence: high
    category: performance
    location: packages/core/src/app/queue.ts:679
    message: >-
      [M | owner: plan Phase 3] NFR-3's read budget ("At most 1 queue fold and 2
      appends per closeout apply, and at most 1 read when no entry exists") is
      not literally held and not tested. `readQueueFold` performs three
      whole-store reads (entries snapshot, dependencies, removals), and the
      removals ledger is classified twice per fold — `readQueueEntries` already
      classifies it from the shared snapshot to apply presence, then line 689
      re-reads it via `readQueueRemovals`. An accepted removal runs the fold
      three times (closeout hook + seam `pre` + `inside`) plus the final fold,
      lease, parks, and verification reads; the no-entry closeout path costs 3
      reads, not 1. The delivered TC-QLC-082 (`closeout-queue-removal-cost`)
      pins appends and outcome identity only; the test plan's step-2
      counting-store observable (fold/read counts) was not delivered. The cost
      is observable: ~2s per verified removal over a ~100-entry store (the
      disclosed minutes-scale cap proofs).
    suggestion: >-
      Thread the snapshot-classified removals through `readQueueFold` (or pass
      the verified snapshot) to remove the duplicate scan, and either meet the
      ≤1-read no-entry observable or reconcile NFR-3/TC-QLC-082 wording to the
      delivered observable and add the counting-store assertion so the budget
      is pinned two-sided.
    suppressed: false
    published_url: null
    published_at: null
