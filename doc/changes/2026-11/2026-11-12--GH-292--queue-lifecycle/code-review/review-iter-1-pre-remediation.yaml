    location: packages/core/src/app/queue.ts:1704
    message: >-
      The reconcile removal pass applies F-1 removals sequentially after the
      read pass; a refusal that arises only mid-sweep (e.g. a lease acquired on
      an examined ref between the read pass and its removal, or a concurrent
      removal) returns the classified error with earlier removals already
      applied. This is not the AC-F5-4 fail-closed case (that covers unreadable
      reads, which are proven to append zero records), each applied removal is
      a legitimate F-1 append, and a re-run converges truthfully per AC-F5-9,
      so the behavior is defensible — noted because the spec's
      "no partial-success envelope" wording could be read more broadly.
    suggestion: >-
      No action required. If operators report confusion, a future change could
      report per-ref skip reasons in the reconcile payload; that is new
      contract surface, not a fix.
