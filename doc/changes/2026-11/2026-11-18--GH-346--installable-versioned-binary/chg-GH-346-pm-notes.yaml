decisions:
  - text: "TDR-0036 — Install lifecycle is one composed `install` command family in
      PROMPT_REQUIRED_COMMANDS (`install`, `install status`, `rollback`,
      `uninstall`, `purge`), because the installed binary is the only reachable
      surface and the only one that can carry a registered typed error. Flags:
      `--add-to-path`, `--migrate`, `--dry-run`, `--stop-daemon`. The shell
      installer keeps only its delivered launcher step. The `delivery-os` alias
      composes the family and refuses it typedly, creating no legacy path."
    date: "2026-11-18"
  - text: "TDR-0037 — One Bun-compiled executable at `dist/<binary-name>`;
      version/commit/built-at/dirty are compile-time constants injected with
      `--define`. `--version` keeps its delivered text shape with the commit in
      the existing build slot (`jaiship <version> (build <shortsha>)`);
      `builtAt` and the full commit live on `install status --json`. A
      non-compiled run reports `0.0.0 (build dev)` and cannot install."
    date: "2026-11-18"
  - text: "TDR-0038 — Install target is the running artifact plus the checkout it
      resolves to; refused typedly when that checkout is a linked worktree
      (`--git-dir` differs from `--git-common-dir`), admitted as `unverified`
      for a primary checkout, plain directory, or no git, and never refused for
      a dirty tree. Dev builds are excluded by requiring an injected identity. A
      legacy launcher is discarded, never promoted into the rollback slot."
    date: "2026-11-18"
  - text: "TDR-0039 — Compatibility compares the artifact's accepted
      STATE_SCHEMA_VERSION with each state root's existing
      header.<workspace>.json: no aggregate version, no record scan, no rewrite.
      Advisory at install/rollback (the fix must remain installable) and a typed
      `install.state.incompatible` verdict at exit 1 in `install status`;
      `state.schema.mismatch` stays the hard gate."
    date: "2026-11-18"
  - text: "TDR-0040 — Seven-step atomic replace with a working install at every
      instant; upgrade is an install of a different compiled artifact (no
      download or build); rollback is an involutive swap of the single
      compiled-artifact slot; `uninstall` removes artifact, slot, record and the
      owned PATH block and always prints the purge residual set; `purge`
      requires `--yes`; all four have zero-write dry-runs; `--migrate` is
      detection plus a typed delegation refusal because M4-S2 owns the move."
    date: "2026-11-18"
  - text: "Advisor-surfaced questions resolved with the recorded defaults, not
      blocked: (a) alias keeps parity and refuses `install` until M4-S2 retires
      it; (b) installs are built and installed from the primary checkout, with
      no per-lane override; (c) a ~107 MB unminified host-only artifact is
      accepted for S1 and reproducibility/minification is deferred; (d) an
      unattended upgrade never stops a live daemon without the explicit
      `--stop-daemon` flag."
    date: "2026-11-18"
