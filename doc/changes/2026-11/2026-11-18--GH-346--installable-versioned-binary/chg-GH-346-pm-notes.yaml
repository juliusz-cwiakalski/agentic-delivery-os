    type: info
    date: "2026-11-18"
  - text: "Retro: the first `phase complete GH-346 clarify_scope` failed with
      `commit.commitlint-failed` and the misleading summary `commitlint rejected
      the message`. Root cause is environmental: the commitlint probe spawns
      bare `commitlint` (packages/adapters/src/file/commitlint.ts), the session
      PATH has no `node_modules/.bin`, and the ENOENT is swallowed into an empty
      error list. This is the PATH-safe-probe defect M4-S3 owns. Workaround:
      prefix lifecycle commands with `PATH=\"$PWD/node_modules/.bin:$PATH\"`.
      Cost: one wasted cycle."
    type: retro
    date: "2026-11-18"
  - text: "Staging fact for planning: with no plan artifact the commit scope is the
      change folder, so the five decision records
      (doc/decisions/TDR-0036..TDR-0040) are staged as strays and stay
      untracked, while the tracked doc/decisions/00-index.md lands as disclosed
      scope drift. The plan must include doc/decisions/ in the scope of a plan
      phase so the five TDR files are committed in this change."
    type: risk
    date: "2026-11-18"
