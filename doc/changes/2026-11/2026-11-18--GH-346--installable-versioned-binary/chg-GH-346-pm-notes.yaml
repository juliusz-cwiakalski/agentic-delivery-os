      error list. This is the PATH-safe-probe defect M4-S3 owns. Workaround:
      prefix lifecycle commands with `PATH=\"$PWD/node_modules/.bin:$PATH\"`.
      Cost: one wasted cycle."
    type: retro
    date: "2026-11-18"
