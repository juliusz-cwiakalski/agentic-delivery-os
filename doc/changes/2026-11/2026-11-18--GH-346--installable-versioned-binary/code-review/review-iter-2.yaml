regression_checks:
  record_block_consistency: >-
    OK. `writeProfileText` is staged-and-renamed (all-or-nothing), both install
    paths write the block before the record that names it, and a failed write
    refuses before the record write, so the record never claims a block that is
    not on disk. On the replacing path the refusal lands after the artifact swap
    (see F-18).
  destination_artifact_precondition_vs_crashed_install: >-
    Not a capability regression. In the destination-absent window a rollback
    already could not proceed (the first rename failed with an internal error);
    it now refuses typedly with the remedy "install the artifact held in the
    rollback slot", which is what actually recovers it. The candidate-artifact
    case still proceeds because the arm keys on the destination's shape, never on
    the running identity — verified by reading runRollback:742-758 and by the
    passing involutive-rollback suite.
  slot_predicate_present: >-
    OK. A legitimate compiled slot (regular, non-empty, 0755, not `#!`) still
    reads `present`; asserted directly in TC-INST-021 and exercised by the seeded
    fixtures of the daemon and dry-run suites, and the crash-matrix/rollback
    suites are green in my run.
  timeouts: >-
    OK, they do not mask a hang. The spawn helper keeps its own 120 s
    `spawnSync` timeout, so a hung child is killed and then fails an assertion;
    beforeAll's 120 s bounds a hung build. The change raises the ceiling the test
    flaked against, it does not swallow failure.
  spec_rules: >-
    `daemon: unchecked` holds on all four dry-runs (DRY_RUN_DAEMON returned at
    install.ts:488, :784, :891, :961 before `daemonGate` at :513, :801, :902,
    :970); AC-F7-3's truncation requirement now holds (F-1); F-8's pair inversion
    now has one undeclared extra refusal (F-13).
findings:
  - id: F-13
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/install-replace.ts:179
    message: >-
      The remediation adds a fifth rollback refusal: a readable record that names
      both legs now still refuses with `install.record.unreadable` when the
      destination holds no compiled artifact (launcher, symlink, foreign file or
      nothing). The code is defensible from F-8's "the artifact at the
      destination" clause, but the declaration is now false: spec v1.8 F-8
      (chg-GH-346-spec.md:185) says "Its causes stay four **missing**-name record
      conditions" and DEC-13 (:550) repeats it, and the shipped current-truth page
      says at :194 "The four causes are missing-name conditions: [four]" while its
      error row (:277) defines `install.record.unreadable` as "The install record
      does not name the pair the rollback swap inverts" — which the delivered code
      now emits when the record does name the pair. No test or gate covers the
      page sentence (tests/checks/install-lifecycle-docs.test.ts:33 asserts only
      that the identity string appears, never the closed cause list), so the drift
      would ship silently.
    suggestion: >-
      Either report the arm under a declared cause (for example a
      destination-shape cause sentence) and add it to the closed list, or amend
      spec to v1.9 (F-8, DEC-13, AC-F8-2, §8.1's rollback and rollback-dry-run
      rows, Appendix C.4/E) plus doc/spec/features/feature-install-lifecycle.md
      :194 and the :277 row so the fifth condition is declared — and add a
      docs-conformance phrase for it so it cannot drift again.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-14
    severity: low
    confidence: high
    category: documentation
    location: packages/adapters/src/file/install-profile.ts:27
    message: >-
      F-3's typed refusal for a failed profile write (`fallback.internal`,
      commands/install.ts:366-373) is a new operator-visible outcome that spec
      F-12 (spec:193) and the page do not declare; F-12 only states that the file
      and marker "are recorded", which is now true only when the write succeeds.
      The identity is also classed `internal` where the remedy is a user action
      (fix permissions or pass another `--shell-profile`), so the exit class does
      not match the other profile refusal (`install.shell-profile.unresolved`,
      category `user`).
    suggestion: >-
      Add one sentence to F-12 and the page declaring the write-failure refusal
      and its remedy, or reuse a `user`-class identity; keep the eleven-row
      install domain unchanged either way.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-15
    severity: medium
    confidence: high
    category: correctness
    location: packages/adapters/src/file/install-profile.ts:32
    message: >-
      New in d6afde09: `const parent = input.path.slice(0,
      input.path.lastIndexOf("/"))` is wrong when the path has no separator —
      `lastIndexOf` returns -1 and `slice(0, -1)` drops the last character, so the
      parent becomes a non-empty bogus name. Reproduced against the real adapters
      with a relative `--shell-profile`: `writeProfileText({path: ".zshrc"})`
      wrote the profile and left a stray `.zshr` directory in the working
      directory. Nothing upstream makes the path absolute (`resolveProfilePath`
      only expands a leading `~/`), and the docs accept `<path>`, so this is
      reachable and permanently litters the operator's cwd on a successful
      install, uninstall or purge (the removal path calls the same writer).
    suggestion: >-
      Compute the parent defensively — `const index = input.path.lastIndexOf("/");
      const parent = index > 0 ? input.path.slice(0, index) : undefined;` — and add
      an arm to TC-INST-070a with a separator-less relative `--shell-profile`
      asserting the profile is written and no sibling directory appears.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-16
    severity: low
    confidence: high
    category: performance
    location: packages/cli/src/commands/install.ts:259
    message: >-
      `slotReportOf` now reads the whole slot file to test the shebang: the
      production `readBytes` is an unbounded `readFileSync(path)`
      (packages/adapters/src/file/install-destination.ts:82-86), and the slot
      holds a compiled artifact of roughly 112 MB. `install status`,
      which was stat-only, now reads that file on every invocation, as does every
      dry-run and every install/rollback completion payload.
    suggestion: >-
      Read a bounded prefix instead (for example `readBytes` plus a 2-byte
      comparison on a bounded read, or a `readPrefix(path, n)` on the port) and
      reuse it in `isCompiledArtifactAtPath`; the verdict needs two bytes, not the
      artifact.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-17
    severity: low
    confidence: medium
    category: correctness
    location: packages/cli/src/commands/install.ts:259
    message: >-
      Residual of F-4 for the unreadable-but-executable slot: `probe` is true, so
      `readBytes` is attempted, but if it returns `undefined` the code sets
      `script: false` and `slotCondition` reports `present`, while
      `isCompiledArtifactAtPath` returns false for the same file and `install
      rollback` refuses it as `install.slot.invalid`. Status then claims a
      rollback-ready slot that rollback rejects — the disagreement F-4 was meant
      to remove, narrowed to a read failure (permissions, I/O error).
    suggestion: >-
      Treat an undefined prefix on the probe path as `script: true` (or add an
      `unreadable` input to `slotCondition`) so the two predicates agree in every
      branch; a unit-level test can inject a port whose `readBytes` returns
      undefined.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-18
    severity: low
    confidence: high
    category: reliability
    location: packages/cli/src/commands/install.ts:638
    message: >-
      On the replacing path the block write moved to step 7, after the slot swap
      and the destination rename, so a profile-write failure now aborts an install
      whose artifact has already been replaced: the destination holds the new
      artifact, the slot the old one, and no record was written. The state is the
      tolerated step-7 shape and an agreement re-run repairs it, but the refusal
      text ("the record was not updated and no block is claimed") does not say the
      artifact was installed, so an operator can read it as "nothing happened".
    suggestion: >-
      Either write the block before staging (the block content does not depend on
      the swap, so the failure becomes zero-write with the same typed refusal), or
      add "the artifact was installed; re-run install to record it" to the
      summary.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-19
    severity: info
    confidence: high
    category: traceability
    location: doc/changes/2026-11/2026-11-18--GH-346--installable-versioned-binary/chg-GH-346-test-plan.md
    message: >-
      The test plan (v1.6) still declares an exhaustive 84-case inventory
