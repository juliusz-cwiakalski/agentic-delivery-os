      pm-notes entry for d6afde09 (`review_fix` is still `started: null`), so the
      remediation work has no per-phase completion evidence.
    suggestion: >-
      Add the five cases to the test plan (or state that review-remediation cases
      live outside the declared inventory), and record the remediation as a
      pm-notes entry plus, if the pipeline requires one, a review-remediation
      phase, once this gate passes.
