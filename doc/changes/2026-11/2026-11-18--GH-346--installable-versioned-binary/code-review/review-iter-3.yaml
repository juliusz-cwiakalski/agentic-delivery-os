summary: >-
  Remediation commit 485e675d closes the two blocking iteration-2 findings and the
  four low ones on inspection and by new, non-vacuous tests, and I re-verified the
  two most error-prone fixes by running them: a bare `--shell-profile .zshrc` now
  writes only `.zshrc` (no stray `.zshr`) and uninstall removes the block from that
  same file, and the slot probe is a 2-byte bounded read of a 50 MB slot in 0.15 ms
  with `readText`/`digest` never touching the slot. The fifth rollback cause is now
  declared end-to-end in spec v1.9 (F-8, DEC-13, §8.1's rollback and rollback-dry-run
  rows, Appendix C.4, Appendix E, AC-F8-2), the shipped page (`:194`, `:277`), the
  guide, the M4 page and two phrase tables, and guarded by TC-INST-021b; the F-14
  profile-write arm is declared in spec F-12 with its class and remedy. My own gate
  run is green — `pnpm check` exit 0, 10,746 pass / 4 skip / 0 fail in 1,194.66 s,
  matching the coder's count — and `plan validate GH-346` is valid/full/ready. Two
  low, operator-facing residuals remain and do not block: the destination-shape arm
  still prints the pair-inverted cause sentence (the spec now names a distinct fifth
  cause), and the shipped page §3.10 still omits the F-14 write-failure arm. Both are
  non-functional wording/completeness nits under correct, tested behaviour.
