prior_findings_closed:
  - id: F-13
    status: CLOSED
    evidence: >-
      The fifth rollback cause is now declared end-to-end and guarded. Spec v1.9:
      F-8 (spec:185) states the precondition requires "a compiled artifact sits at the
      destination" and names five causes (four missing-name record conditions plus the
      destination-shape arm) under the one identity, evaluated after the slot refusals
      and before the daemon gate and any rename; DEC-13 (:550) repeats five causes with
      a code-review-iteration-2 amendment entry; §8.1's rollback row (:377) and
      rollback-dry-run row (:378) split "four missing-name ... plus the fifth
      destination-shape refusal" and state the dry-run answers it at exit 0; Appendix
      C.4 (:841) and Appendix E's `install.record.unreadable` row (:875) carry the
      destination clause; AC-F8-2 (:647) adds the falsifiable arm. The shipped page
      (feature-install-lifecycle.md:194) now says "There are **five causes** ... Four
      are **missing-name** record conditions ... The fifth is a **destination-shape**
      cause" and its error row (:277) reads "or the destination is not a compiled
      artifact"; the guide (local-install.md:59) and the M4 page add the same. Two
      phrase tables guard it: doc-conformance.test.ts GH346_ROWS (stale "The four
      causes are missing-name conditions" + required "a destination that is not a
      compiled artifact") and install-lifecycle-docs.test.ts SPEC_ROLLBACK_REQUIRED/
      SPEC_ROLLBACK_STALE (spec half, non-vacuous both directions). TC-INST-021b
      (tests/behaviour/install-replace.test.ts:284) plants a launcher at the
      destination after two installs and asserts `install.record.unreadable` at exit 1,
      unchanged destination bytes, unchanged slot digest, byte-identical record, and no
      `.rollback-tmp` — the refusal occurs at commands/install.ts:779 before
      `daemonGate` (:825) and before any rename (:831). Residual: the printed cause
      sentence still misdescribes the arm — see F-20 (low, non-blocking).
  - id: F-14
    status: PARTIAL
    evidence: >-
      Spec F-12 (chg-GH-346-spec.md:193) now declares the profile-write failure arm:
      `fallback.internal` (kind `fallback`, projection class `platform-provider`, exit
      `2`), the class rationale (permissions/space, not a validation input), the remedy
      (fix the profile's rights or pass another `--shell-profile`, then re-run install),
      and the state left behind (replacing install: artifact installed, previous in the
      slot when swapped; agreement run: destination untouched; record not updated and
      no block claimed). The code matches: `internalFailure` (commands/install.ts:95)
      returns `fallback.internal` with summary/`fallback`, and `applyPathBlock` (:371)
      emits the declared statement. Keeping `internal` rather than a `user`-class
      identity is within the finding's offered alternatives because the class is now
      declared and justified. PARTIAL because the shipped current-truth page §3.10
      (doc/spec/features/feature-install-lifecycle.md:240-242) still states the block
      "is recorded" without the "only when the write succeeds" qualifier or the
      `fallback.internal` refusal — the page half of F-14's suggestion was not applied.
      See F-21 (low, non-blocking).
  - id: F-15
    status: CLOSED
    evidence: >-
      install-profile.ts:32 uses `dirname(input.path)` and skips mkdirp for `.` and `/`,
      so a separator-less name has no parent to create. I reproduced it against the
      built adapter: `writeProfileText({path:".zshrc"})` in a fresh cwd left exactly
      `[".zshrc"]` with content written and no `.zshr`; a nested `./.config/zsh/.zshrc`
      still created `./.config/zsh`; `dirname` maps `.zshrc`->`.`, `/`->`/`, `a`->`.`,
      `~/x`->`~` (and `~/` is expanded before the writer by `resolveProfilePath`/
      `expandHome`). TC-INST-070a (tests/checks/install-lifecycle-path.test.ts:169)
      asserts the base dir after install is exactly `[.zshrc, home, state]`, no `.zshr`
      exists, and uninstall removes the block from that same file.
  - id: F-16
    status: CLOSED
    evidence: >-
      The port method `readBytes` was replaced by `readPrefix(path, maxBytes)`
      (contracts/install.ts:229) implemented with one bounded `readSync` at offset 0
      (install-destination.ts:91-108). `INSTALL_PROBE_BYTES = 2` (:40) is used by
      `isCompiledArtifactAtPath` (:257) and by `slotReportOf` (commands/install.ts:262).
      I reproduced the bound: `readPrefix` returned exactly 2 bytes `[0x7f,0x45]` from a
      50 MB `0755` file in 0.15 ms; missing and `000`-mode files returned `undefined`;
      a `0755` shebang returned `isCompiledArtifactAtPath === false`. `grep` confirms no
      `readBytes` remains and no `readText`/`digest` is ever called on `slotPath`;
      `runStatus` (install.ts:708-742) reads the slot only via `slotReportOf` and never
      digests the destination. TC-INST-021's third arm
      (install-replace.test.ts:222) plants a 4 MiB+ slot, drives status plus all four
      dry-runs, and asserts every slot `readPrefix` bound <= 4 while `readText`/`digest`
      on the slot is the empty list, and that the adapter honours `readPrefix(_,2)`->2
      and `(_,4)`->4.
  - id: F-17
    status: CLOSED
    evidence: >-
      `slotCondition` (core/domain/install-replace.ts:338) gained `unreadable?: boolean`
      and returns `invalid` when set (:348). `slotReportOf` sets
      `unreadable: probe && prefix === undefined` (install.ts:266), so an
      executable-but-unreadable slot reports `invalid`, matching rollback's
      `isCompiledArtifactAtPath` false -> `install.slot.invalid`. TC-INST-021's second
      test (install-replace.test.ts:195) injects a port whose `readPrefix` returns
      `undefined` for the slot and asserts both status `invalid` and rollback
      `install.slot.invalid` agree — the exact branch-4 disagreement F-4 left.
  - id: F-18
    status: CLOSED
    evidence: >-
      Ordering kept; the refusal message is corrected. `applyPathBlock`
      (install.ts:371) now takes `after: {artifactInstalled, slotSwapped}` and the
      replacing-path call (:656) passes `{artifactInstalled:true, slotSwapped:
      plannedPlan.slotSwap}`, producing "the artifact is now installed at <destination>
      [and the previous artifact is in the rollback slot], but the managed PATH block
      was not written ... re-run install to record the install". The replacing path
      invokes it after the swap (:656), the agreement path passes `false/false` (:543)
      and preserves "the destination is this artifact and is untouched". A test
      (install-lifecycle-path.test.ts:194) drives the post-swap failure and asserts the
      message contains "the artifact is now installed at <destination>", "the previous
      artifact is in the rollback slot", "was not written", and "re-run install", plus
      the tolerated step-7 shape (destination = new artifact, slot = old, no record).
  - id: F-19
    status: CLOSED
    evidence: >-
      Test plan v1.7 reconciles the delivered inventory: 88 cases (I re-counted §5.1's
      rows and the §7.3 map, both 88 unique ids), 34/34 AC coverage, and the five
      remediation cases recorded (TC-INST-021b, TC-INST-044b, TC-INST-045b, TC-INST-070a,
      and TC-INST-091's NUL arm), with §3.4's "case ids in the tree with no row = 0".
      OQ-TP-10 is marked Resolved against spec v1.9. The pending pm-notes entries for
      iteration 1 and 2 are present in the working tree (to be committed by the
      pipeline); the pipeline records review-fix via pm-notes rather than a plan phase,
      so no plan review-remediation phase is required. OQ-TP-11/12 remain open and are
      recorded non-blocking (see F-23).
findings:
  - id: F-20
    severity: low
    confidence: high
    category: documentation
    location: packages/core/src/domain/install-replace.ts:192
    message: >-
      The destination-shape arm still prints the pair-inversion cause sentence. The
      precondition returns `cause: "pair-inverted"` for `destinationIsArtifact === false`
      (install-replace.ts:179) and `rollbackCauseSentence("pair-inverted")` returns "the
      record's current names an artifact other than the one at the destination" (:201).
      So both `install rollback --dry-run` and the refusal (commands/install.ts:797,
      :818) tell the operator the record mismatches the destination, while the spec
      §8.1 rollback and rollback-dry-run rows (spec:377-378) and Appendix C.4 now
      enumerate the fifth cause as "a destination that holds no compiled artifact at
      all". No test pins the sentence — TC-INST-021b asserts only the identity, and the
      dry-run test (install-lifecycle-dryrun.test.ts:168) asserts only that a "cause:"
      line exists — so it can drift silently. It does not block: identity
      `install.record.unreadable`, exit `1`, zero-write, no rename, and the remedy
      ("install the artifact held in the rollback slot") are all correct and covered,
      and no AC pins the sentence string; this is operator-facing wording only.
    suggestion: >-
      Add a distinct destination-shape cause (for example extend `RollbackRecordCause`
      with `"destination-not-artifact"` and a sentence "the destination holds no
      compiled artifact to displace into the slot") and assert it in TC-INST-021b's
      dry-run and refusal text, or state in the spec that the two pair causes share one
      sentence. Non-blocking for this change.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-21
    severity: low
    confidence: high
    category: documentation
    location: doc/spec/features/feature-install-lifecycle.md:242
    message: >-
      The shipped current-truth page omits the F-14 profile-write failure arm. §3.10
      (:242) says the block's file and marker "are recorded in the install record" and
      is silent on the delivered `fallback.internal` refusal and the "recorded only when
      the write succeeds" rule that spec F-12 now declares. The page is not false — it
      describes the success path — but it does not state the delivered behaviour, so a
      doc-truth reader sees an unconditional record claim. No phrase table guards the
      page's §3.10 against this arm. Non-blocking: the normative declaration lives in
      spec F-12, behaviour is correct and tested, and the page carries no contradicting
      claim.
    suggestion: >-
      Add one sentence to §3.10: a failed block write is answered by `fallback.internal`
      at exit `2`, the record is not updated, and the block is recorded only when the
      write succeeds — mirroring spec F-12. Non-blocking for this change.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-22
    severity: info
    confidence: high
    category: traceability
    location: doc/guides/local-install.md:59
    message: >-
      The fifth-cause declaration is phrase-guarded on the spec page
      (install-lifecycle-docs.test.ts SPEC_ROLLBACK_*) and the M4 page
