      destination-shape paragraph (local-install.md:59) is only covered by the generic
      "install.record.unreadable" requirement, and the runtime cause sentence (F-20) has
      no assertion at all. A future edit could drop either silently.
    suggestion: >-
      Add the guide's "the destination is not a compiled artifact at all" sentence to
      GUIDE_REQUIREMENTS and, when F-20's sentence is fixed, assert it in TC-INST-021b.
      Informational.
    suppressed: false
