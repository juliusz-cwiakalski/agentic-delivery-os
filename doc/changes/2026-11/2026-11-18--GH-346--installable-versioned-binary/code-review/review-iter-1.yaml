findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:4007
    message: >-
      The production composition calls `enumerateStateRoots`, which already
      slices its result to `INSTALL_MAX_JUDGED_ROOTS` and returns the real
      `truncated` flag, but then forwards only `enumeration.roots` into
      `InstallRuntime.stateRoots` (production.ts:4013). `stateFormatVerdict`
      re-derives truncation as `stateRoots.length > 128`
      (commands/install.ts:182), so on a machine with more than 128 judged roots
      it always reports `truncated: false` and `judged: 128` even though more
      roots exist. Reproduced with a scratch enumeration of 200 project roots:
      `enumerate.truncated=true`, `verdict.truncated=false`,
      `verdict.judged=128`. This violates AC-F7-3 and NFR-7 ("an exceeded cap is
      reported as truncated together with the judged count") and falsifies
      doc/spec/features/feature-install-lifecycle.md:205, which states the
      verdict reports truncation. The existing test TC-INST-045 passes only
      because it injects 141 roots directly, bypassing the production cap.
    suggestion: >-
      Carry the enumeration's `truncated` fact into `InstallRuntime` (for example
      `stateRootsTruncated`) and use it in `stateFormatVerdict` (or pass the
      uncapped root list and let the command cap and flag it), then add an
      integration test that exercises the real produce-then-judge path over more
      than 128 project directories through `createProductionComposer` or
      `enumerateStateRoots`.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    confidence: high
    category: testing
    location: tests/checks/artifact-grammar.test.ts:83
    message: >-
      At HEAD, TC-BIN-068 (six compiled-artifact spawns plus six `bun` source
      runs of a ~112 MB artifact) uses Bun's default 5 s per-test timeout; the
      spawn helper sets `timeout: 120_000`, but the `test()` itself has none. It
      timed out at 5010.66 ms in the aggregate run (which also overlapped heavy
      host load from concurrent agent checks). The test is fragile and can make
      the repository's documented gate non-deterministically red; it should not
      depend on host speed.
    suggestion: >-
      Pass an explicit generous timeout to the artifact-tier tests (for example
      `test("...", () => {...}, 120_000)`, as TC-BIN-050 already does), and/or
      shrink the matrix or reuse one compiled artifact; then re-run `pnpm check`
      on an idle host to confirm green.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: packages/cli/src/commands/install.ts:492
    message: >-
      On a replacing install with `--add-to-path` the managed PATH block is
      written twice: once before the step-4 agreement branch (line 492) and again
      at step 7 (line 608), contradicting the surrounding "written once per run"
      comment. Both calls ignore `writeProfileText`'s boolean result, and
      `writeProfileText` (adapters/src/file/install-profile.ts) does not
      `mkdirp(dirname(path))` the way the record writer does. If the profile
      cannot be written, the run still reports success and the install record
      records a `pathBlock` that does not exist, contrary to AC-F12-1 ("exactly
      one delimited block ... is appended, its file and marker are recorded").
    suggestion: >-
      Write the block once on each path (agreement vs replacing), check the
      returned boolean and either refuse/report or omit the recorded block on
      failure, and ensure an explicit `--shell-profile` directory is created or
      the failure is reported typed.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: medium
    confidence: high
    category: correctness
    location: packages/cli/src/commands/install.ts:252
    message: >-
      `slotReportOf` (and `slotCondition` in core/domain/install-replace.ts)
      reports a slot `invalid` only when it is not a regular file or is empty.
      A launcher script or a non-executable binary in the slot is reported
      `present` (with a record-supplied identity if any), while `runRollback`
      refuses the same slot with `install.slot.invalid` through
      `isCompiledArtifactAtPath`. `install status` therefore claims a
      rollback-ready slot that rollback will reject. TC-INST-021 plants a
      launcher in the slot and asserts rollback's refusal but never asserts the
      status result.
    suggestion: >-
      Apply the compiled-artifact predicate (regular, non-empty, executable,
      not-a-script) to the slot in `slotReportOf`/`slotCondition` so status and
      rollback agree, and add a status arm to TC-INST-021.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-5
    severity: medium
    confidence: medium
    category: correctness
    location: packages/cli/src/commands/install.ts:773
    message: >-
      `runRollback` validates the slot but not the destination before displacing
      it into the slot. Its swap is `destination -> tmp`, `slot -> destination`,
      `tmp -> slot`; if the destination has been replaced by a launcher, symlink,
      or foreign file, that object becomes the new slot. The spec's glossary and
      security review say the rollback slot holds only a compiled artifact, so
      this is a reachable invariant break (the next rollback then refuses it as
      invalid). It is an operator-induced edge, not a normal-flow bug.
    suggestion: >-
      Require the destination to be a compiled artifact (or refuse/report typedly)
      before moving it into the slot, or declare and document this state as a
      reported unknown rather than silently promoting it.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-6
    severity: low
    confidence: high
    category: spec-compliance
    location: packages/cli/src/commands/install.ts:734
    message: >-
      The rollback dry-run plan prints "rename 1: destination -> slot (the
      displaced artifact)" and "rename 2: slot -> destination (the restored
      artifact)", but the implementation performs a three-rename swap through a
      temp file (`destination -> *.rollback-tmp`, `slot -> destination`,
      `*.rollback-tmp -> slot`). The printed two-rename sequence would overwrite
      the slot's occupant, and the spec/TDR wording "two renames in reverse
      order" does not describe the delivered algorithm.
    suggestion: >-
      Correct the plan text (and, if desired, the spec wording) to describe the
      temp-based swap, or use an atomic exchange; keep the operator-facing plan
      and the executed steps identical.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-7
    severity: low
    confidence: high
    category: reliability
    location: scripts/install.sh:1059
    message: >-
      The new installer guard does `existing="$(cat "${install_path}")"` on
      whatever is at the brand install path. For the delivered ~112 MB compiled
      artifact this reads the whole binary into a shell variable and makes bash
      emit `warning: command substitution: ignored null byte in input` to stderr
      before the classified refusal. The guard test plants a NUL-free text
      fixture, so this real-path behaviour is untested.
    suggestion: >-
      Use a bounded, byte-safe predicate (for example `head -c 4096` plus a
      marker grep, or a shebang/marker check that does not read the whole file)
      and add a NUL-containing binary fixture to TC-INST-091.
    suppressed: false
