  # ---------------------------------------------------------------------------
  # Phase 5 — One owner per artifact class: the shell installer's guarded launcher
  # step and the shell uninstaller's reporting arm (F-14; AC-F14-1, AC-F14-2;
  # DEC-1, DEC-5, DEC-8; RSK-5; NG-12, NFR-10, NFR-13).
  #
  # Goal: the live defect — a checkout pointer silently overwriting a managed
  # binary — becomes impossible by a classified refusal, and the delivered shell
  # uninstaller reports a managed install instead of touching it.
  #
  # Contract: ONE predicate governs the launcher step's guard (TDR-0036 §4,
  # spec v1.1 F-14/AC-F14-1): ANYTHING present at the brand install path that is
  # not the delivered launcher — the installed artifact, the slot, or any other
  # content — is a managed or foreign artifact. Detection is by WHAT IS AT THE
  # PATH, never by the install record: the record-free state is legitimate and
  # reachable (absent, `record-stale`, manually deleted or damaged) and it still
  # refuses the launcher write, so deleting `install.json` can never let the shim
  # overwrite a managed artifact.
  # With nothing but the delivered launcher (or nothing at all) at the install
  # path, the installer's launcher step behaves exactly as delivered: same target,
  # content-idempotent, the two classified failures (no runtime; a resolved source
  # tree with no CLI entry), the plan-only dry-run preview that writes nothing and
  # exits 0, and independence from the tool selection (AC-F14-1 first half). With
  # anything else at that path — asserted under a `current` record, a
  # `record-stale` record, and a record manually deleted or damaged, plus a foreign
  # non-launcher content arm — the step refuses, CLASSIFIED, names the lifecycle
  # command as the update path, writes no launcher and leaves the content at that
  # path byte-untouched. The uninstaller keeps its repository-artifact scope, its
  # own 0/2/3/4/5 taxonomy, its two modes and its dry-run; it removes no binary,
  # slot, record or Jaiship root, reports the managed install and names the owning
  # removal command (AC-F14-2). Neither surface gains a lifecycle verb and neither
  # deletes the other's artifacts (NG-12). The guard is ordered AFTER phase 2
  # because it names the family (header coupling 5), and its bash arm lands with
  # it.
  #
  # Decision to close in this phase: which of the installer's existing classified
  # exits the new refusal arm uses (its own numeric vocabulary — the product's
  # error table is not a shell contract), and the exact content probe that
  # distinguishes the delivered launcher from any other content. Failure mode: a
  # bare or invented exit code makes TC-INST-091's "declared classified failure, not
  # a generic error" assertion fail by name, a record-keyed probe fails the
  # record-free arm by name, and the structural scanner must name a missing arm
  # rather than pass.
  #
  # Acceptance: AC-F14-1 (TC-INST-090, 091, 093, and the bash evidence TC-INST-121),
  # AC-F14-2 (TC-INST-092, 093, and the bash evidence TC-INST-121).
  #
  # Gate (expected signal: exit 0 at every line; the delivered arms are
  # byte-identical, the new arms count as the declared increase, and the aggregate
  # stays green):
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/install-ownership-split.test.ts tests/structure/install-launcher.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/install-launcher-installer.test.ts
