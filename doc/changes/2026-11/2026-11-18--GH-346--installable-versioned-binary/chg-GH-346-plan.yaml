  # `install purge` requiring `--yes` even when both roots are absent (where the
  # answer is "nothing to remove" at exit 0), absent members reported as absent and
  # a second uninstall a reported no-op, a damaged record degrading the block
  # report to `unknown` rather than a guessed path, and a partial failure leaving
  # the recoverable members in place. The residual set, `purge --dry-run`'s removal
  # set and what `purge --yes` removes are equal path for path at one machine state
  # (NFR-11) — compared as three computed sets at one instant, never across two
  # machine states. All four write paths accept `--dry-run` and print the Appendix
