  # ---------------------------------------------------------------------------
  # Phase 3 — Install record, seven-step atomic replace, dispositions, status and
  # the compatibility check, upgrade and involutive rollback (F-5, F-7, F-8, F-9;
  # DM-2, DM-3, DM-4, DM-6; AC-F5-2, AC-F5-3, AC-F7-1..3, AC-F8-1, AC-F8-2,
  # AC-F9-1..3; DEC-3, DEC-4, DEC-9, DEC-10, DEC-13; RSK-1, RSK-3, RSK-7, RSK-8,
  # RSK-9, RSK-10; NFR-3, NFR-4, NFR-6, NFR-7, NFR-9, NFR-12, NFR-16).
  #
  # Goal: an install can be upgraded, reported and undone, and a machine can be
  # asked the one compatibility question it has before a delivery command fails.
  # At every instant of a replace a runnable artifact exists at a known path.
  #
  # Contract: one record at `<config root>/install.json` under
  # `install.record.v1`, written atomically (staged in the record's own directory,
  # then renamed), never secret-bearing, every field of DM-2 present or
  # legitimately absent, and tolerant on read by all four consumers (DEC-13:
  # `install` overwrites damage, `uninstall` removes what it can and reports the
  # block as unknown, `rollback` refuses `install.record.unreadable`). The replace
  # is the seven normative steps of Appendix B with the STEP-4 ARTIFACT-CONTENT
  # AGREEMENT GATE (TDR-0040 §2 step 4, §2.1, §3 as amended): the destination is
  # read, and if it is a REGULAR, non-empty, executable compiled artifact — never a
  # symlink — whose CONTENT equals the running artifact's, then the destination IS
  # this artifact, so the run STOPS with no staged copy, no destination rename, no
  # slot swap and no daemon action. THE GATE IS EVALUATED BEFORE STAGING (Appendix B
  # as amended at DoR iteration 2), so an agreement run CREATES NO STAGING FILE AT
  # ALL — not "stages and then stops", and not a ~107 MB temporary copy that a
  # conforming run would have to clean up. Identity is deliberately not the test and
  # the
  # record is never the gate: a compiled artifact's injected identity is a
  # compile-time constant no process can read back out of a file, and the record is
  # a repair source only. After the stop, THE RECORD IS RECONCILED IN PLACE — at
  # its own path, through the same writer and the same atomic staged-and-renamed
  # write as step 7, never a second format and never a partial write — when it is
  # not `current`, with `previous` = the predecessor a READABLE record names
  # (its `current`), and ABSENT and reported unknown when no readable record names
  # one; the record's own previous `previous` is NEVER carried forward, because
  # step 5 may have overwritten that artifact. A record already `current` means
  # nothing is written at all, and a reconciliation that cannot write leaves the
  # record stale, is reported, and costs nothing else. STEP 5 IS SKIPPED WHEN THE
  # DESTINATION IS ABSENT (the step-5 crash state): the slot already holds the
  # displaced artifact, so the recovery re-run completes step 6 and preserves it.
  # Only the step 5->6 window has no destination, and in it the slot holds a
  # runnable artifact. The replace also carries the one-slot rule that admits only
  # a compiled artifact carrying an injected identity (a launcher is discarded with
  # a report naming its recorded target and is never promoted). THAT ONE-SLOT RULE
  # IS TDR-0040 §2 STEP 5 AS QUALIFIED AT DoR ITERATION 3, and it now MIRRORS
  # TDR-0038 §5 and spec Appendix B/C.2 sentence for sentence — only a DIFFERING
  # REGULAR COMPILED ARTIFACT is promoted into the slot; a delivered launcher is
  # DISCARDED with a report and the EXISTING SLOT IS LEFT UNCHANGED; a SYMLINK is
  # REPLACED (never written through) and is NOT PROMOTED, so the slot is unchanged
  # and the link's recorded target is untouched; and step 5 is skipped when the
  # destination is absent. The record's step-5 sentence, §2.1's disposition row and
  # this phase's contract therefore agree; a coder reading the record is not being
  # pointed at a different slot fate than the spec's, and the phase must not
  # re-derive a slot rule of its own. Upgrade is
  # installing a different compiled artifact and reports BOTH identities, and a
  # rebuild of the same commit is a different artifact (different build instant),
  # so it is an upgrade and not a no-op. Rollback swaps slot and destination with
  # two renames in reverse order and is INVOLUTIVE. ROLLBACK'S REFUSALS ARE ONE
  # ORDERED SET, in THIS order — slot absent, then slot invalid, then the record
  # precondition — and the whole set is evaluated BEFORE ANY WRITE AND BEFORE THE
  # DAEMON STOP (spec v1.6 F-8/F-9/§8.1 and TDR-0040 §4; DoR iteration 3 findings 3
  # and 7). Because the record precondition is decided ahead of the stop, a REFUSED
  # ROLLBACK PERFORMS NO DAEMON ACTION EVEN WITH `--stop-daemon`: a `--stop-daemon`
  # run that refuses leaves the daemon RUNNING and the ordered daemon log EMPTY, not
  # "stopped and then refused". Each arm carries the zero-write claim (destination
  # bytes and
  # `mtimeNs`, the slot's content digest, the record's bytes, the record path's
  # absence, the profile line count and the staged-file count all unchanged, no
  # rename, no daemon action):
  #   1. `install.slot.absent` — rollback found no slot (TC-INST-026);
  #   2. `install.slot.invalid` — the slot is not a compiled artifact carrying an
  #      injected identity, or its bytes are unreadable (TC-INST-026);
  #   3. `install.record.unreadable` — ONE identity with FOUR causes, each a
  #      MISSING-NAME condition (F-8, F-9, §8.1, DEC-13, Appendix E and AC-F8-2 as
  #      amended at DoR iterations 2, 3, 4 and 5): the record is ABSENT; UNREADABLE;
  #      readable and `current` while naming no `previous` (with a slot present); or
  #      the readable POST-CRASH PAIR, whose `current` names an artifact that sits in
  #      the slot and whose `previous` names an artifact the crashed run's step 5
  #      destroyed. A `previous` name that is present and WRONG is NOT a cause: it is
  #      the record's declared limit and the run proceeds (see arm (g)).
  # THE PRECONDITION IS PAIR INVERSION OVER THE RECORD AND THE DISK, AND IT IS NOT
  #   `recordState`. A rollback inverts the two identity roles the record carries:
  #   `install` writes `current` = the artifact it IS (known by construction) and
  #   `previous` = the artifact it displaced (the one name DM-2 lets be absent),
  #   whereas a rollback must write `current` = the SLOT's occupant and `previous` =
  #   the DISPLACED destination. The gate therefore PROCEEDS only when the record is
  #   readable, names the artifact at the DESTINATION in `current`, and carries a
  #   `previous` name — checked for PRESENCE ONLY — and refuses
  #   `install.record.unreadable` otherwise. It is a record-versus-DISK comparison.
  #   `recordState` (F-8, DM-4) is a DIFFERENT comparison — the record against the
  #   RUNNING identity, a comparison of two records that never reads the
  #   destination's bytes — and it is what `install status` reports (TC-INST-041
  #   step 3, TC-INST-041 step 5, TC-INST-026 step 5). Neither scope may be inferred
  #   from the other, and the two disagree by construction on one reachable state:
  #   a candidate-artifact invocation whose record still names the destination and
  #   carries a `previous` is `record-stale` FOR REPORTING and PROCEEDS for rollback,
  #   while the post-crash record is `record-stale` and REFUSES because its `current`
  #   does not name the destination artifact. What each leg can be checked against
  #   follows from what is knowable: the DESTINATION leg is knowable exactly when the
  #   invoked artifact is the one at the destination (the ordinary invocation), while
  #   the SLOT leg is NEVER knowable, because DM-2 stores no slot digest — so that
  #   leg is presence-only by DECLARED LIMIT (TDR-0040 §4; spec v1.6).
  #   THE FOUR CAUSES AND THE PAIR ARMS (test plan v1.6 §5.2.6). The causes are
  #   carried by TC-INST-042 steps 3, (d), (e) and (f), one step per cause and none
  #   shared: step 3 = the present-but-UNREADABLE record; step 4/arm (d) = the ABSENT
  #   record with a valid slot present (no record created); step 5/arm (e) = a readable
  #   `current` record naming no `previous` while a slot is present (record
  #   byte-unchanged); step 6/arms (f1) and (f2) = the two REFUSING pair legs over the
  #   same fixture (the destination holds the running artifact A, the slot
  #   holds predecessor P). ARM (f1) names P in `current` while `previous` is PRESENT
  #   and also names P, so the SLOT leg holds and only the DESTINATION leg refuses.
  #   ARM (f2) names P in `current` while `previous` is PRESENT and names Q, the
  #   artifact step 5 destroyed, so BOTH legs are inverted. Both arms assert the record
  #   is fully populated on both identity fields BEFORE the run, so neither refusal can
  #   be explained by a missing `previous` name — which is what makes each refusal the
  #   DESTINATION leg's, exactly as the presence-only rule requires. (f1) and (f2) are
  #   the refusing pair legs and stay refusals; nothing else in the arm set refuses on
  #   the `previous` leg.
  #   ARM (g) IS THE WRONG-NAME CELL, AND IT IS A DECLARED-LIMIT PROCEED — a settled
