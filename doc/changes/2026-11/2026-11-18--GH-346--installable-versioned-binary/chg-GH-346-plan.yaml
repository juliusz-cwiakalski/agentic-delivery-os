  # ---------------------------------------------------------------------------
  # Phase 4 — Removal matrix, four zero-write dry-runs, the managed PATH block, the
  # migration hook and the daemon guard on every mutating path (F-10, F-11, F-12,
  # F-13, F-9; DM-5; AC-F9-4, AC-F10-1, AC-F10-2, AC-F11-1, AC-F12-1, AC-F13-1;
  # DEC-5, DEC-11; RSK-10, RSK-11, RSK-13; NFR-5, NFR-10, NFR-11).
  #
  # Goal: the only genuinely dangerous operations in the story are bounded,
  # reported, confirmable and previewable, and a live daemon can never be left
  # holding a replaced or removed artifact.
  #
  # Contract: the removal matrix of Appendix C.3 in its declared order (artifact,
  # slot, record, block, then the roots under purge only), `install uninstall`
  # ALWAYS printing the residual set as what `purge` would additionally delete,
  # `install purge` requiring `--yes` even when both roots are absent (where the
  # answer is "nothing to remove" at exit 0), absent members reported as absent and
  # a second uninstall a reported no-op, a damaged record degrading the block
  # report to `unknown` rather than a guessed path, and a partial failure leaving
  # the recoverable members in place. The residual set, `purge --dry-run`'s removal
  # set and what `purge --yes` removes are equal path for path at one machine state
  # (NFR-11) — compared as three computed sets at one instant, never across two
  # machine states. All four write paths accept `--dry-run` and print the Appendix
  # C.4 content with absolute paths, one line per path, and perform no write, no
  # directory creation and no daemon action (a full paths/sizes/mtimeNs/modes
  # snapshot must be unchanged 4/4). `--add-to-path` appends exactly one delimited
  # block holding exactly one export line (markers derived from the declared binary
  # name), records its file and marker, is idempotent for identical content,
  # replaced in place when different and never duplicated; the file is
  # `--shell-profile` when given, otherwise the DECLARED shell mapping of OQ-TP-7
