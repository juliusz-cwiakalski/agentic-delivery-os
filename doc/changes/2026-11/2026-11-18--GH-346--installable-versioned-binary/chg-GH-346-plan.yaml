        # The exact committed package-source inventory moves by the one new file
        # (D4). The FILE SET lives in inventory.json; the EXECUTABLE ALLOWANCE for
        # this phase's new packages/** file lives in content-inventory.test.ts,
        # whose per-file allowlist rejects any executable statement in a file with
        # no entry.
        - tests/structure/inventory.json
        - tests/structure/content-inventory.test.ts
        - tests/checks/artifact-self-containment.test.ts
        - tests/checks/artifact-identity.test.ts
        - tests/checks/artifact-grammar.test.ts
        # The five untracked decision records land on this phase boundary
        # (COMMIT-BOUNDARY REALITY). The index already carries their rows and the
        # `Proposed` status; it is declared so a status/typo touch stages with
        # them, and an unchanged index produces at most an advisory plan-diff
        # finding.
        - doc/decisions/TDR-0036-install-lifecycle-composed-command-family.md
        - doc/decisions/TDR-0037-self-contained-binary-build-identity.md
        - doc/decisions/TDR-0038-install-target-stability-and-dev-build-exclusion.md
        - doc/decisions/TDR-0039-installed-binary-state-format-compatibility-check.md
        - doc/decisions/TDR-0040-upgrade-rollback-uninstall-purge-boundaries.md
        - doc/decisions/00-index.md
      folders:
        - doc/decisions
    interactions:
      - kind: contract-file
        target: packages/cli/src/build-identity.ts
        role: producer
      - kind: contract-file
        target: packages/cli/src/entrypoint.ts
        role: producer

  # ---------------------------------------------------------------------------
  # Phase 2 — The composed `install` family, its admission and dev gates, and the
  # whole declared conformance surface in one commit (F-4, F-5, F-6, F-15;
  # DM-6, DM-7; AC-F4-1..3, AC-F5-1, AC-F6-1, AC-F15-1, AC-F15-2; DEC-1, DEC-7,
  # DEC-9, DEC-12; RSK-4, RSK-6, RSK-14, RSK-16; NFR-8, NFR-9, NFR-10, NFR-14).
  #
  # Goal: `install` is reachable through both composed programs as the
  # twenty-sixth family, advertised with its alias restriction, admitted or
  # refused before it writes anything — and every conformance surface the
  # aggregate gate pins moves in the SAME commit, because a family cannot be
  # reachable without it (header coupling 1 and 2).
  #
  # Contract: five entry points (`install`, `install status`, `install rollback`,
  # `install uninstall`, `install purge`) registered unconditionally in the
  # production composer with their runtime (home, process facts, file-system port,
  # clock, daemon status read, git worktree read) and composed for BOTH bins.
  # OWNERSHIP (D6, TDR-0036 §3 as amended): the primary bin declares the one
  # boolean role fact `ownsInstallation: true` at the process edge; the alias bin
  # declares NOTHING and the composer defaults to NOT owning; the fact threads
