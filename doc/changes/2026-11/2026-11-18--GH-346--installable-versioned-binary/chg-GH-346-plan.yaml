  # Goal: `install` is reachable through both composed programs as the
  # twenty-sixth family, advertised with its alias restriction, admitted or
  # refused before it writes anything — and every conformance surface the
  # aggregate gate pins moves in the SAME commit, because a family cannot be
  # reachable without it (header coupling 1 and 2).
