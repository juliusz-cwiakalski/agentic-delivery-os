# PHASE ORDER AND THE COUPLING THAT FORCES PHASE 2 TO BE ONE COMMIT:
#   Order follows spec §18 (artifact and identity, then the family with its
#   admission rules, then the record and the replace, then removal and the
#   dry-runs, then the guards, then the documentation correction). Three
#   couplings are load-bearing and are NOT split:
#   (1) THE CONFORMANCE SURFACE MOVES IN THE SAME COMMIT AS THE FAMILY. Once
#       `install` joins `PROMPT_REQUIRED_COMMANDS`, `check:prompt`
#       (prompt-conformance), `check:help` (help-guide-coverage) and the pinned
#       count/tail suites (entrypoint-composition, entrypoint-two-bins,
#       supervision-mounting, metrics-mounting and the other PINNING_FILES
#       members) all fail unless the family entry, the five subcommand help
#       entries, the M4 reference page, the page-root branch, the coverage
#       inventory, the error-domain rows and the pinned-count moves land in
#       the same commit. Spec §16 declares that surface as one contract; the gates
#       make it one commit. This is why spec §18's "(e) conformance surface"
#       bullet has no phase of its own: it is delivered inside phase 2, and only
#       the SHELL ownership guards remain as phase 5.
#   (2) THE ERROR-DOMAIN REGISTER MOVES ONCE (phase 2). `pnpm check` runs
#       `tests/checks/error-table-sync.test.ts`, which calls `runSyncCheck` over
#       the live tree and compares the source table, the documented table in
#       doc/spec/features/feature-result-contract.md and the corpora fixtures.
#       Adding the `install` kind therefore cannot be done in two commits: phase 2
#       declares the kind and all ELEVEN rows, documents them, moves the declared
#       table total 149 -> 160, moves the closed two-segment allowlist 65 -> 66
#       (exactly one row, `install.dev-build`, is kind-first two-segment) and adds
#       one corpus row per identity (corpusRows 70 -> 81). THE TOTAL IS PINNED BY
#       NINE DELIVERED COUNT/MEMBERSHIP SUITES — the two mirrors plus the seven
#       spec §16 names — so the page phrase, the mirrors and the seven move as ONE
#       EDIT-SET: a half-move leaves the sync gate RED at this boundary. Each row's
