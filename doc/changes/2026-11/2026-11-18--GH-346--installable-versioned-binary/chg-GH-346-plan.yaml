  # `install uninstall`, `install purge`) registered unconditionally in the
  # production composer with their runtime (home, process facts, file-system port,
  # clock, daemon status read, git worktree read) and composed for BOTH bins.
  # OWNERSHIP (D6, TDR-0036 §3 as amended): the primary bin declares the one
  # boolean role fact `ownsInstallation: true` at the process edge; the alias bin
  # declares NOTHING and the composer defaults to NOT owning; the fact threads
  # bin -> BinLauncherOptions -> the production composer and is independent of the
  # working-name override. Any lifecycle invocation on the alias answers exactly
  # ONE `install.identity.not-owning` line at exit 1 carrying the invoked identity
  # (the alias's own resolved name), the statement that installation is owned by
  # the primary identity, and the documented remedy (run the operation through the
  # installed product binary) — no owner-name derivation, no new literal; it
  # writes nothing and creates no path under its namespace, while its help entry
  # states the restriction. The destination is not an input: a destination flag, a
  # positional path or an environment value is a delivered `fallback.invocation`
  # grammar refusal (AC-F4-3). One admission predicate (install-admission.ts)
  # governs every executed path: S-1 a linked worktree (own git dir differs from
  # the common git dir) refuses with `install.target.worktree` naming the target
  # directory, both git directories, the two admissible origins and the deletion
  # reason; S-2 an unreadable git state is ADMITTED as `unverified`; S-3 a stable
  # checkout is admitted as `verified`; the dirty flag is never an admission
  # question; S-4 cannot fail by operator action. Detection is repository
  # metadata, never a path prefix or a listing order, and it runs over the
  # artifact's own directory (D2: the delivered `readCheckoutIdentity` answers the
  # facts). The dev gate refuses a fallback-identity run with `install.dev-build`
  # naming the build entry and the artifact path convention, and it is scoped to
  # the write paths — a report (`install status`) is never refused by it
