#   declared content is changed by any of them):
#   D1. MODULE HOMES — core contracts and pure domain:
#         packages/core/src/contracts/install.ts          DM-2 (`install.record.v1`),
#           DM-4 (`install.status.v1`), the admission/provenance/disposition/
#           record-state/slot-state/outcome vocabularies, the declared 128-root
#           enumeration cap (DEC-9), the eleven row identities' trigger binding
#           vocabulary, and the optional test-only `InstallFaultPort`.
#         packages/core/src/domain/install-admission.ts   the pure admission
#           predicate (S-1..S-3), the dev-build gate (D-2) and the disposition
#           decision (C.2).
#         packages/core/src/domain/install-record.ts      the record shape, its
#           reader tolerance (`absent`/`unreadable`/`record-stale`) and the
#           no-secret field set (DM-2, DEC-13).
#         packages/core/src/domain/install-compatibility.ts the pure per-root
#           verdict, the five-outcome vocabulary, the cap and the truncation
#           report (DM-4, DEC-9, DEC-10).
#         packages/core/src/domain/install-replace.ts     the seven-step plan
#           (Appendix B), the step-4 artifact-agreement gate on CONTENT (never an
#           identity test on a file, never the record as a gate) with the in-place
#           record reconciliation and the step-5 skip, the involutive rollback
#           swap and the slot-content rule (DM-3).
#         packages/core/src/domain/install-removal.ts     the removal matrix, its
#           order and the residual-set computation (C.3, NFR-11).
#         packages/core/src/domain/install-path-block.ts  the block rendering, the
#           declared shell mapping, `--shell-profile` precedence and block removal
#           (DM-5, OQ-TP-7).
#         packages/core/src/domain/install-migration.ts   prior-namespace
#           detection and the advisory/refusal copy (F-13, NG-1).
#         packages/core/src/domain/install-status.ts      the DM-4 payload
#           assembly and its deterministic order (NFR-16).
#       ADAPTERS (I/O only, injected into the domain):
#         packages/adapters/src/file/install-destination.ts  destination
#           classification, staging in the destination directory, the two
#           renames, slot read and the staged-file verification (steps 2,3,5,6).
#         packages/adapters/src/file/install-record.ts       the atomic staged+
#           renamed record write and its read (step 7, NFR-12).
#         packages/adapters/src/file/install-state-roots.ts  the bounded header-only
#           enumeration of the effective host root and its first-level project
#           directories (DM-4, NFR-7).
#         packages/adapters/src/file/install-profile.ts      the one operator-owned
#           file: block append/replace/remove.
#       CLI:
#         packages/cli/src/commands/install.ts   grammar, the five handlers, the
#           dry-run plans and the typed refusal mapping (no exit digit).
#         packages/cli/src/output/install-text.ts the operator-facing lines.
#         packages/cli/src/build-identity.ts      the DM-1 constant behind its
#           presence guard and the token render. It holds NO working-name
#           literal: the `packages/**` string-literal walk in
#           tests/structure/entrypoint-bin.test.ts collects every "jaiship" /
#           "delivery-os" literal under packages/**, so a name declared here would
#           break the delivered five-site count.
#         scripts/build-binary.ts                 THE ONE DECLARED BUILD-SIDE
#           IDENTITY-LITERAL SITE (DM-7, AC-F15-3): it declares the primary
#           working name once and derives `dist/<binary-name>` from it, under its
#           own declared scan root `scripts/` — outside the `packages/**` walk —
#           so the product-surface inventory stays at its delivered five. It is
#           also the additive build entry registered as `build:binary`
#           (repo-internal; never a member of ADOS_DELIVERY_SCRIPTS or
#           ADOS_DELIVERY_TOOLS, never a second build path for library
#           consumers).
#       No new `@delivery-os/adapters` subpath is added: the install I/O lives in
#       the delivered `./file` subpath, so no exports-parity baseline moves and no
#       workspace-import entry is added.
#   D2. THE ADMISSION SEAM IS THE DELIVERED GIT READ. `resolveCheckoutGitDirectories`
#       / `readCheckoutIdentity` (packages/adapters/src/repo/index.ts) already
#       answer the checkout root, the own git directory and the common git
#       directory, or an absence. Admission therefore reuses them over the
#       ARTIFACT'S OWN DIRECTORY and adds NO adapter export; DM-8's "pinned export
#       surface moves once" is a conditional that does not fire. If the delivery
#       finds a gap (for example an absence the read cannot express at that path),
#       the additive read lands in the same file and moves
#       `tests/checks/exports-parity.test.ts` in PHASE 2 — the phase that
#       consumes it. `tests/structure/inventory.json` and
#       `tests/structure/content-inventory.test.ts` are ALREADY declared by
#       phases 1-4 unconditionally, so the contingency adds only the parity
#       baseline (D4); the failure mode otherwise is AC-F5-2's `unverified` arm
#       failing by name.
#   D3. PHASE-2 WRITE POSTURE (the declared intermediate). Phase 2's real `install`
#       performs step 1 IN FULL — admission, identity gate, the DAEMON GUARD and
#       the read-only compatibility pre-flight; the daemon status read is already
#       in the phase-2 runtime — then steps 2, 3 and 6, the step-4 CONTENT
#       agreement stop (zero destination bytes when the destination's content
#       equals the running artifact's) and the slot-free dispositions. Steps 5 and
#       7, the slot, and the step-4 record RECONCILIATION are phase 3: there is
#       no record writer before then, so a phase-2 agreement run leaves the record
#       absent and reports it as absent rather than reconciling it. Real `install
#       rollback` answers `install.slot.absent` (which is TRUE until phase 3, and
#       the rollback daemon arm is phase 3's); real `install uninstall` removes the
#       members that exist and prints the residual set; real `install purge`
#       requires `--yes`. Phase 2's `install status` reports running identity,
#       target stability, record state (`absent`), slot state (`absent`) and the
#       managed block, and does NOT emit the state-format group; phase 3 adds it.
#       No owned case asserts a complete payload before phase 3 (TC-INST-044/046
#       own it). Because the daemon guard ships WITH the write path in phase 2,
#       no intermediate commit can replace the artifact under a live daemon: the
#       guard is not later hardening.
#   D4. ONE PINNED INVENTORY, MOVED BY EVERY PHASE THAT ADDS PACKAGE SOURCE — AND
#       ITS EXECUTABLE-ALLOWANCE SIBLING MOVES WITH IT.
#       tests/structure/inventory.json is an exact committed file list per package,
#       so it is declared by phases 1, 2, 3 and 4 (the phases that add files under
#       packages/**) and NOT by phases 5 and 6 (scripts, tests and docs only).
#       tests/structure/content-inventory.test.ts carries the OTHER half:
#       `EXECUTABLE_ALLOWANCES` is a per-file allowlist and the checker rejects ANY
#       executable statement in a file with no entry, so every new `packages/**`
#       source file needs its entry in the SAME phase that creates it — phases 1,
#       2, 3 and 4 declare this file too. The division is exact: the FILE SET lives
#       in `tests/structure/inventory.json`; the EXECUTABLE ALLOWANCE lives in
#       `tests/structure/content-inventory.test.ts`.
#       The alternative — pre-declaring files that do not exist — is rejected
#       because the inventory must equal the actual file set at every boundary.
#   D5. NO NEW CONFIGURATION KEY, ENVIRONMENT VARIABLE, STATE RECORD KIND, EVENT
#       TOPIC OR STATE-ROOT WRITE (NG-11, NFR-13): the install record lives in the
#       config root, the status payload is derived and never persisted, and the
#       compatibility verdict is computed per run. A phase that needs an ambient
#       value takes it from the injected environment record instead.
#   D6. THE ALIAS REFUSAL NAMES THE INVOKED IDENTITY, THE OWNING ROLE AND THE
#       DOCUMENTED REMEDY — AND NOTHING ELSE (TDR-0036 §3 as amended). AC-F4-2 no
#       longer requires the owning binary's name; the earlier "the alias imports
#       the primary bin's declared name" mechanism is IMPOSSIBLE and withdrawn
#       (readiness iteration 1, finding 2).
#       Phase 2 therefore adds ONE boolean ROLE FACT declared at the process edge:
#       `ownsInstallation`. packages/cli/bin/jaiship.ts declares `true`;
#       packages/cli/bin/delivery-os.ts declares NOTHING, because the composer
#       defaults to NOT OWNING when the fact is absent — so the alias bin needs NO
#       edit for this and gains no second literal. The fact is threaded
#       bin -> BinLauncherOptions -> the production composer as a composition fact
#       and is DELIBERATELY INDEPENDENT of the working-name override: an owning
#       executable under another name still owns installation, and no override can
#       promote the alias. The refusal is `install.identity.not-owning`, exit 1,
#       ONE line, carrying the three facts the refusing process already has: the
#       INVOKED IDENTITY (that process's own resolved brand binary name), the
#       statement that INSTALLATION IS OWNED BY THE PRIMARY IDENTITY, and the
#       DOCUMENTED REMEDY (run the operation through the installed product binary,
#       as the reference page and doc/guides/local-install.md document it). No
#       owner name is derived and no identity literal is added.
#       TRIPWIRE (the rejected route, stated so the coder cannot stumble into it):
#       the owning name is NOT producible in the alias process — the primary name
#       is a non-exported constant whose module composes a second launcher on
#       import, an export is rejected by the structure guard, and restating it
#       would need a sixth literal or the relocation of two declared sites.
#       Therefore: NO identity-literal inventory move (the product-surface count
#       stays at its delivered five, and packages/cli/src/build-identity.ts holds
#       NO working-name literal), NO change to
#       doc/spec/features/feature-branding-seam.md, NO doc-conformance
#       IDENTITY_ROWS move, and no phase declares any of them. A phase that finds
#       itself editing feature-branding-seam.md or a doc-conformance IDENTITY_ROWS
#       entry has taken the rejected route.
#       Phase 1's bin edits STAND, but only for the identity SUPPLY (the injected
#       build identity and the process-edge re-entry path); the former
#       owning-name obligation on the alias bin is WITHDRAWN.
#
# GATE SEQUENCE (every command runs from the repository root with the repo-local
#   scratch temp directory, in the order the test plan's §6.3 battery declares;
#   narrow-first at every phase, the aggregate gate at EVERY phase boundary
#   because the tier's own escalation trigger requires it, and the full battery at
#   the last phase):
#   G0  TMPDIR=$PWD/tmp/tmpdir bun run build:binary                       (artifact tier, one cached build)
#   G1  TMPDIR=$PWD/tmp/tmpdir pnpm check                                 (aggregate: lint, format, typecheck, all tests, boundaries, memory, prompt-conformance, help-guide-coverage, exports-parity)
#   G2  TMPDIR=$PWD/tmp/tmpdir bun test <the phase's narrow suite set>
#   G3  TMPDIR=$PWD/tmp/tmpdir bash scripts/.tests/test-install.sh
#   G4  TMPDIR=$PWD/tmp/tmpdir bash scripts/.tests/test-uninstall.sh
#   G5  TMPDIR=$PWD/tmp/tmpdir bash scripts/.tests/test-doc-distribution.sh
#   G6  TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/error-table-sync.ts  (CI's own script, run locally; deliberately NOT in pnpm check)
#   G7  TMPDIR=$PWD/tmp/tmpdir ./scripts/lint-commit-range.sh --base main-tools
#   Phase 1 runs G2 (artifact/entrypoint suites), G0, and G1 because it moves the
#   identity/entrypoint surfaces and the pinned source inventory. Phase 2 runs G2
#   (family, admission, conformance), the three named checks, G6 and G1 because it
#   moves the family count, the help/coverage inventory, the error register and
#   the allowlist — the one phase where all of them meet. Phase 3 runs its narrow
#   behaviour suites and G1 (it adds package files, moves the inventory and the
#   status/record contracts). Phase 4 runs its narrow check-tier suites and G1 (it
#   adds package files and the removal/dry-run contracts). Phase 5 runs G2 over the
#   two shell-adjacent suites, G3, G4, G5 AND G1: G1 is RUN, not waived. The
#   aggregate is not optional here even though no package or pinned-count surface
#   moves, because the phase edits two delivered shell scripts and their bash
#   suites, and the narrow bash gates prove only those suites — not the workspace
#   around them (lint, format, typecheck, the delivered test body, boundaries,
#   memory, prompt-conformance, help-guide-coverage, exports-parity). The tier's
#   own escalation trigger requires a green aggregate at every phase boundary, so
#   the deviation is removed rather than declared. Phase 6 runs the whole battery
#   G0..G7, including G5. Every phase records one pm-notes `notes:` evidence entry
#   in the §6.3 shape naming the commit and the exact counts (26 families, 66
#   two-segment identities, eleven `install` rows).
#
# INCONSISTENCIES: none blocking between spec v1.1, the five TDRs (TDR-0036 and
#   TDR-0040 as amended at DoR iteration 1) and test plan v1.1. Three points are
#   resolved rather than papered over:
#   (a) DM-8, as corrected in spec v1.1, states that the admission predicate
#       CONSUMES the delivered worktree-topology read: no adapter export surface
#       moves and no parity baseline moves (D2), and the contingent path is
#       declared in the spec with the phase that would absorb it. Because the
#       change claims no move, no phase declares
#       tests/checks/exports-parity.test.ts; that row fires only if the contingency
#       fires.
#   (b) The ticket's `upgrade` task is realised as an install of a different
#       artifact (spec DEC-6); no phase declares an `upgrade` verb.
#   (c) Spec §18's "(e) conformance surface" bullet is delivered inside phase 2
#       because the gates make it inseparable from the family (coupling 1).

