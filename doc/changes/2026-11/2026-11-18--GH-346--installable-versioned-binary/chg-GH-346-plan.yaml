        - package.json
        - scripts/build-binary.ts
        - packages/cli/src/build-identity.ts
        - packages/cli/src/bin-launcher.ts
        - packages/cli/src/entrypoint.ts
        - packages/cli/bin/jaiship.ts
        - packages/cli/bin/delivery-os.ts
        - tests/structure/build-artifact-entry.test.ts
        # Two halves land in two phases (named at both ends): THIS phase owns the
        # process-edge/identity-supply assertions and the identity-literal
