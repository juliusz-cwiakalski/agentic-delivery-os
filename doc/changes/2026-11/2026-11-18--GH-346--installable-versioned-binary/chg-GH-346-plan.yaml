  # ---------------------------------------------------------------------------
  # Phase 3 — Install record, seven-step atomic replace, dispositions, status and
  # the compatibility check, upgrade and involutive rollback (F-5, F-7, F-8, F-9;
  # DM-2, DM-3, DM-4, DM-6; AC-F5-2, AC-F5-3, AC-F7-1..3, AC-F8-1, AC-F8-2,
  # AC-F9-1..3; DEC-3, DEC-4, DEC-9, DEC-10, DEC-13; RSK-1, RSK-3, RSK-7, RSK-8,
  # RSK-9, RSK-10; NFR-3, NFR-4, NFR-6, NFR-7, NFR-9, NFR-12, NFR-16).
  #
  # Goal: an install can be upgraded, reported and undone, and a machine can be
  # asked the one compatibility question it has before a delivery command fails.
  # At every instant of a replace a runnable artifact exists at a known path.
  #
  # Contract: one record at `<config root>/install.json` under
  # `install.record.v1`, written atomically (staged in the record's own directory,
  # then renamed), never secret-bearing, every field of DM-2 present or
  # legitimately absent, and tolerant on read by all four consumers (DEC-13:
  # `install` overwrites damage, `uninstall` removes what it can and reports the
  # block as unknown, `rollback` refuses `install.record.unreadable`). The replace
  # is the seven normative steps of Appendix B with the STEP-4 ARTIFACT-CONTENT
  # AGREEMENT GATE (TDR-0040 §2 step 4, §2.1, §3 as amended): the destination is
  # read, and if it is a REGULAR, non-empty, executable compiled artifact — never a
  # symlink — whose CONTENT equals the running artifact's, then the destination IS
  # this artifact, so the run STOPS with no staged copy, no destination rename, no
  # slot swap and no daemon action. Identity is deliberately not the test and the
  # record is never the gate: a compiled artifact's injected identity is a
  # compile-time constant no process can read back out of a file, and the record is
  # a repair source only. After the stop, THE RECORD IS RECONCILED IN PLACE — at
  # its own path, through the same writer and the same atomic staged-and-renamed
  # write as step 7, never a second format and never a partial write — when it is
  # not `current`, with `previous` = the predecessor a READABLE record names
  # (its `current`), and ABSENT and reported unknown when no readable record names
  # one; the record's own previous `previous` is NEVER carried forward, because
  # step 5 may have overwritten that artifact. A record already `current` means
  # nothing is written at all, and a reconciliation that cannot write leaves the
  # record stale, is reported, and costs nothing else. STEP 5 IS SKIPPED WHEN THE
  # DESTINATION IS ABSENT (the step-5 crash state): the slot already holds the
  # displaced artifact, so the recovery re-run completes step 6 and preserves it.
  # Only the step 5->6 window has no destination, and in it the slot holds a
  # runnable artifact. The replace also carries the one-slot rule that admits only
  # a compiled artifact carrying an injected identity (a launcher is discarded with
  # a report naming its recorded target and is never promoted). Upgrade is
  # installing a different compiled artifact and reports BOTH identities, and a
  # rebuild of the same commit is a different artifact (different build instant),
  # so it is an upgrade and not a no-op. Rollback swaps slot and destination with
  # two renames in reverse order, is INVOLUTIVE, and refuses `install.slot.absent`
  # / `install.slot.invalid` with zero writes. The compatibility check compares the
  # artifact's accepted store-format identifier with each enumerated root's header
  # identifier only — header files only, one project level, capped at the declared
  # 128 judged roots (DEC-9), `unchecked` for an absent root and never collapsed
  # into `accepted` (DEC-10), nothing persisted, `state.schema.mismatch` untouched
  # — is advisory on `install`/`install rollback` (one line per not-accepted root,
  # exit code unchanged) and is the typed verdict behind `install status`
  # (`install.state.incompatible` at exit 1 with root, observed, accepted and the
  # judged count). `install status` completes its DM-4 payload here: running
  # identity, the record's identity and condition (`current`/`record-stale`/
  # `unreadable`/`absent`), the slot's identity and condition
  # (`present`/`absent`/`invalid`), target stability as DATA, and the state-format
  # group — deterministic field and line order for a given machine state, and a
  # crash between the renames and the record write is visible as `record-stale`
  # rather than an exception. `install status` stays READ-ONLY: it never repairs,
  # and the next `install` is what establishes agreement and corrects the record.
  # The daemon guard's INSTALL arm shipped in phase 2 (step 1's fourth gate); THIS
  # phase adds the ROLLBACK arm on the same guard — `install.daemon.running` unless
  # `--stop-daemon`, whose stop runs through the delivered stop path BEFORE the
  # reverse swap, and the ordered log proves the stop precedes the first rename.
  # The removal-path extension is phase 4 (AC-F9-4).
  # The crash matrix uses the phase-1-declared seam decision (OQ-TP-1): the
  # optional test-only fault port for steps 2..7 plus constructed post-failure
  # states for steps 5, 6 and 7, and step 1 through its four gates (one of them the
  # live-daemon gate). EVERY crash arm asserts SLOT-DIGEST INVARIANCE where the
  # step does not legitimately replace the slot: the destination's content digest
  # and `mtimeNs`, the slot's content digest, and a zero destination-rename count
  # are asserted for the step-4 agreement arms (TC-INST-033, TC-INST-037) and for
  # the step-7 recovery re-run (TC-INST-036), and the step-5 recovery asserts the
  # slot digest is unchanged from the displaced artifact (TC-INST-034).
  #
  # Decision to close in this phase: the fault port's step vocabulary and the exact
  # placement of the port's consultation inside the replace transaction, and the
  # reconciliation's reporting line (which condition it repaired and the previous
  # identity it recorded, or that none was available) — both delivery-bound.
  # Failure mode: a step that cannot be induced fails TC-INST-030..037 by name; the
  # matrix must never degrade to "exit != 0", a pass without the recovery re-run is
  # not a pass, and an agreement arm that asserts the record without the slot
  # digest is not a pass (test plan §4.3, §4.4).
  #
  # Acceptance (spec v1.1 wording): AC-F5-2 (TC-INST-011, 012), AC-F5-3
  # (TC-INST-020, 021), AC-F7-1 (TC-INST-043), AC-F7-2 (TC-INST-044, 046), AC-F7-3
  # (TC-INST-045), AC-F8-1 (TC-INST-040), AC-F8-2 (TC-INST-041, 042, 036, 037),
