#   The commit primitive stages only plan-declared scope plus the change folder,
#   so a phase that declares nothing for them would leave them untracked and the
#   change would ship without its binding design. Phase 1 therefore declares the
#   five exact paths plus doc/decisions/00-index.md and the doc/decisions/
#   folder, and they land on the PHASE-1 DELIVERY COMMIT — the `commit` invocation
#   carrying the phase-1 message, run at the phase-1 boundary, whose declared
#   scope covers them (the delivery boundary additionally unions all six phases'
#   scopes).
#   They do NOT land on `phase complete delivery_planning`: that lifecycle
#   boundary stages the change folder only, because
#   `LIFECYCLE_PLAN_KINDS.delivery_planning = ["planning"]` matches no plan phase
#   (every phase below is `kind: delivery`). That claim was wrong and is
#   withdrawn; the staging authority is phase 1's own declared scope.
#   Their index rows and the `Proposed` status are already committed in
#   doc/decisions/00-index.md, so the index is declared for staging authority (a
#   status/typo touch stages with them); if it needs no edit this phase produces
#   one advisory `plan diff` `undeclared-missing` finding, which is observational
#   and not a failure.
#
# SCOPE DECLARATION RULE (binding on every phase; GH-338 precedent):
#   A phase declares every path whose content it AUTHORS or EDITS — that is what
#   gives the commit primitive staging authority. A file that is only RE-RUN as a
#   delivered regression control is NOT declared: tests/checks/
#   prompt-conformance.test.ts, tests/checks/help-guide-coverage.test.ts
#   (non-mutant arms), tests/behaviour/entrypoint-help-isolation.test.ts,
