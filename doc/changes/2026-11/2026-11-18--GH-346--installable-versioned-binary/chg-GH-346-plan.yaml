phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Self-contained artifact, build identity, process edge, and the
  # five untracked decision records (F-1, F-2, F-3; DM-1, DM-7; AC-F1-1,
  # AC-F1-2, AC-F2-1..3, AC-F3-1, AC-F3-2, AC-F15-3; DEC-2; RSK-2, RSK-15;
  # NFR-1, NFR-2, NFR-15).
  #
  # Goal: the product becomes one executable a machine can carry, whose identity
  # is captured at build time and whose process edge is correct for the compiled
  # shape — and the change ships with its binding design instead of five
  # untracked files.
  #
  # Contract: `build:binary` is one additive root build entry
  # (scripts/build-binary.ts) that captures version (root manifest), full commit,
  # ISO-8601 UTC build instant and a tracked-files-only dirty flag, invokes the
  # pinned compiler ONCE and fails loudly when the output is missing or not
  # executable. It writes `dist/<binary-name>` by default and `--out <dir>`
  # redirects the artifact tier to the scratch cache (OQ-TP-8), so there is one
  # build path and two declared destinations. It never joins the package build
  # chain, never appears in ADOS_DELIVERY_SCRIPTS or ADOS_DELIVERY_TOOLS, needs no
  # clean tree and mutates no tracked file. The identity is one compile-time
  # constant behind a presence guard (packages/cli/src/build-identity.ts); the
  # seam is the DELIVERED optional `version`/`build` entrypoint input widened to
  # one optional DM-1 object (OQ-TP-3), so a non-injected run keeps `0.0.0` and
  # `dev` verbatim and no ambient read exists. `--version` keeps exactly
  # `<binary-name> <version> (build <token>)`, one line, exit 0, `--json`
  # byte-identical, build instant absent; the token is the short commit,
  # `<short>-dirty`, `unknown` or `dev` (Appendix A). The bins supply the process
  # facts and the injected identity; a compiled run supplies `process.execPath` as
  # the re-entry entry path and a non-compiled run keeps the delivered script path
  # (Appendix: the one behavioural change the artifact forces). Argv handling is
  # unchanged in effect: the user slice still yields exactly the user arguments.
  # The artifact name is derived at exactly one declared build-side site
  # (scripts/build-binary.ts, scanned under its own build-side root) and adds no
  # working-name literal, so the product-surface inventory stays at the delivered
  # five.
  #
  # Layout note (declared, not discovered): scripts/build-binary.ts is a
  # repo-internal Bun script beside the delivered scripts/checks/*.ts convention,
  # not a `.sh` orchestration script, because it constructs typed build facts and
  # the one compile argv; it is not a delivered installer script and appears in
  # neither ADOS_DELIVERY_SCRIPTS nor ADOS_DELIVERY_TOOLS (asserted by
  # TC-BIN-060). It is linted and formatted by the aggregate gate like every other
  # TypeScript file.
  #
  # Decision to close in this phase: the `--define` identifier and the exact
  # presence-guard shape are delivery-bound. Failure mode if not closed: the
  # `unknown` token case (TC-BIN-064) and the four-token matrix fail by name; an
  # environment-variable fallback is forbidden (NG-11) and must not be introduced
  # as a shortcut.
  #
  # Decision records (COMMIT-BOUNDARY REALITY in the header): the five untracked
  # TDRs, doc/decisions/00-index.md and the doc/decisions/ folder are declared
  # here and land on `phase complete delivery_planning`.
  #
  # Acceptance: AC-F1-1 (TC-BIN-060, 061, 062, 071), AC-F1-2 (TC-BIN-063),
  # AC-F2-1 (TC-BIN-064), AC-F2-2 (TC-BIN-065), AC-F2-3 (TC-BIN-066, 067),
  # AC-F3-1 (TC-BIN-068), AC-F3-2 (TC-BIN-069, 070), AC-F15-3 (TC-INST-107).
  #
  # Gate (expected signal: exit 0 at every line; one artifact at the default path,
  # the four tokens exact, zero git invocations from a self-description read):
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
  #   TMPDIR=$PWD/tmp/tmpdir bun run build:binary                            (G0)
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/build-artifact-entry.test.ts tests/structure/entrypoint-bin.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/artifact-self-containment.test.ts tests/checks/artifact-identity.test.ts tests/checks/artifact-grammar.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/entrypoint-version.test.ts tests/behaviour/identity-override.test.ts tests/behaviour/entrypoint-help-isolation.test.ts   (controls: no edit)
  #   TMPDIR=$PWD/tmp/tmpdir pnpm check                                     (G1, binding: the identity/entrypoint surfaces and the pinned source inventory move here)
  #
  # Commit: feat(GH-346): self-contained artifact, build identity and process edge
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Self-contained artifact build entry, compile-time build identity, version token and compiled process edge, plus the five decision records"
    kind: delivery
    summary: "feat(GH-346): self-contained artifact, build identity and process edge"
