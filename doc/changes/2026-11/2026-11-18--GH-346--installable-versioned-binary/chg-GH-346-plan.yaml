# RESOLVED OPEN QUESTIONS (test plan §8.3 — recorded as decisions here, not as
#   tasks; no AC, case identity, exit code, cap or declared content is changed by
#   any of them):
#   OQ-TP-1 / FAULT-TP-1 (blocking for AC-F9-1) — HOW THE SEVEN-STEP CRASH MATRIX
#     INDUCES ITS FAILURES. Decided: BOTH mechanisms, in this order.
#     (a) A DECLARED TEST-ONLY INJECTION PORT on the replace runtime: an optional
#     `installFault` construction input (`InstallFaultPort` in
#     packages/core/src/contracts/install.ts) that names one of the six steps
#     2..7 (`stage`, `verify`, `identity-compare`, `destination-to-slot`,
#     `staged-to-destination`, `record-write`) and answers a typed failure. The
#     production composition NEVER supplies it (asserted structurally in
#     tests/structure/install-composition-absence.test.ts), and the family's
#     declared runtime inputs are unchanged. The environment-value arm that
#     FAULT-TP-1 offers as an alternative is DECLINED: NG-11 and spec §7.2 forbid
#     a new environment variable, and an env-driven fault switch is exactly the
#     ambient surface the change forbids. Fault implementations live in
#     tests/fixtures/install/faults.ts.
#     (b) CONSTRUCTED POST-FAILURE STATES on disk for steps 5, 6 and 7 (the two
#     rename windows and the record write), because they are the states the
#     invariant is about and they are assertable without any seam: destination
#     absent with a runnable slot; slot valid with a staged file and no
#     destination; destination and slot valid with a stale record. Step 1 is
#     induced by its four gates (worktree, dev build, live daemon, pre-flight read
#     error), which are refusal paths asserted independently.
#     A step that can be induced by neither mechanism fails its case by name; it
#     never reports a pass (test plan §3.5 FAULT-TP-1).
#   OQ-TP-3 / SEAM-TP-1 (blocking for suite runtime) — IS THE BUILD IDENTITY
#     INJECTABLE IN-PROCESS? Decided: YES, additively, and it is the primary
#     mechanism. The delivered `EntrypointOptions` already carry optional
#     `version`/`build` (`packages/cli/src/entrypoint.ts`), which production never
#     supplies; phase 1 widens that existing seam to one optional DM-1 identity
#     object (`buildIdentity`) behind the same presence guard, so a
#     non-injected run keeps `0.0.0`/`dev` verbatim. Behaviour-tier lifecycle
#     cases drive the composed program in-process with an injected identity and a
#     scratch home/config/state/profile root, so no lifecycle case builds a
#     107 MB artifact. The artifact tier (TC-BIN-*) and the single end-to-end arm
#     (TC-INST-020, TC-INST-050) consume ONE cached compiled artifact. If the seam
#     is not exposed, thirteen cases escalate to the artifact tier and the cost is
#     recorded in test plan §10 — never a skip.
#   OQ-TP-8 — WHERE THE ONE CACHED ARTIFACT LIVES. Decided: a SCRATCH output
#     directory under `tmp/tmpdir/artifact/`, never `dist/`, so no case depends on
#     a developer's prior build and `dist/` stays a product output only. The build
#     entry takes `--out <dir>` with `dist` as its default, so AC-F1-1 asserts the
#     default path and the artifact tier asserts the scratch path through the same
#     entry (one build path, two declared output destinations).
#   OQ-TP-7 — HOW THE OPERATOR'S SHELL IS IDENTIFIED FOR `--add-to-path`. Decided:
#     the BASENAME OF THE INJECTED `SHELL` VALUE (never a login-shell probe, never
#     a spawn), mapped exactly `zsh` -> `~/.zshrc`, `bash` -> `~/.bashrc`,
#     `sh` -> `~/.profile`, with the leading home marker expanded against the
#     injected home. The mapping is a pure function in
#     packages/core/src/domain/install-path-block.ts and is the contract
#     TC-INST-071 asserts. No resolver value and no configuration key is added
#     (NG-11), and an unidentifiable shell without `--shell-profile` is the typed
#     refusal `install.shell-profile.unresolved` (TC-INST-072). Explicit
#     `--shell-profile <path>` always wins.
#   OQ-TP-4 — OWNERSHIP OF THE DOC-CONFORMANCE PAGE-CLAIM TABLE. Decided: the
#     phase-6 commit owns it, inside `tests/checks/doc-conformance.test.ts`, as a
#     SELF-CONTAINED per-change requirement table over an exact declared page set
#     (the GH-320 precedent), never an edit to a historical pinned set. `@pm` and
#     `@doc-syncer` consume it at lifecycle phase 7/10; `@doc-syncer` does not
#     author it. The table carries both directions (required phrases present,
#     stale phrases absent) with one failing mutant per direction (TC-INST-112).
#   OQ-TP-2 (owner @coder, phase 1) — observing the re-entry entry path without a
#     detached spawn. Decided: the case asserts the VALUE the composition hands to
#     the delivered daemon process port plus a static scan for a persisted bundle
#     path; no new production surface is added for the test. A recording seam that
#     is never reached fails TC-BIN-069 by name.
#   OQ-TP-5 (owner @pm, lifecycle phase 9 quality_gates) — pre-CI evidence for
#     AC-F15-2. Decided (CI-TP-1): the local run of
#     `bun run scripts/checks/error-table-sync.ts` (allowlist reported as exactly
#     66, eleven `install` rows) plus `tests/checks/ci-checks.test.ts` asserting
#     the CI job still invokes the script and `pnpm check` still excludes it IS the
#     evidence; CI remains the authority and a later CI failure is a review
#     finding, never a silent pass.
#   OQ-TP-6 (owner @pm / @readiness-reviewer, lifecycle phase 5 dor_check) —
#     `TC-BIN-060+` colliding with three delivered GH-320 describe labels.
#     Decided: every NEW describe title in a shared suite is prefixed `GH-346`
#     (the delivered convention is already `GH-320 <id>`), no delivered label is
