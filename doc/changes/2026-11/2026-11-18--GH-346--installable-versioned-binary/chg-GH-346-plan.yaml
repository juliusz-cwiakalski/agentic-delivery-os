#       directory, or an absence. Admission therefore reuses them over the
#       ARTIFACT'S OWN DIRECTORY and adds NO adapter export; DM-8's "pinned export
#       surface moves once" is a conditional that does not fire. If the delivery
#       finds a gap (for example an absence the read cannot express at that path),
#       the additive read lands in the same file and moves
#       `tests/checks/exports-parity.test.ts`, `tests/structure/inventory.json`
#       and `tests/structure/content-inventory.test.ts` in PHASE 2 — the phase that
#       consumes it; the failure mode otherwise is AC-F5-2's `unverified` arm
#       failing by name.
#   D3. PHASE-2 WRITE POSTURE (the declared intermediate). Phase 2's real `install`
#       performs steps 1, 2, 3 and 6 (gates, stage, verify, staged->destination)
#       and the slot-free dispositions; steps 4, 5 and 7 and the slot are phase 3;
#       real `install rollback` answers `install.slot.absent` (which is TRUE until
#       phase 3); real `install uninstall` removes the members that exist and
#       prints the residual set; real `install purge` requires `--yes`. Phase 2's
#       `install status` reports running identity, target stability, record state
#       (`absent`), slot state (`absent`) and the managed block, and does NOT emit
#       the state-format group; phase 3 adds it. No owned case asserts a complete
#       payload before phase 3 (TC-INST-044/046 own it).
#   D4. ONE PINNED INVENTORY, MOVED BY EVERY PHASE THAT ADDS PACKAGE SOURCE.
#       tests/structure/inventory.json is an exact committed file list per package,
#       so it is declared by phases 1, 2, 3 and 4 (the phases that add files under
#       packages/**) and NOT by phases 5 and 6 (scripts, tests and docs only). The
#       alternative — pre-declaring files that do not exist — is rejected because
#       the inventory must equal the actual file set at every boundary.
#   D5. NO NEW CONFIGURATION KEY, ENVIRONMENT VARIABLE, STATE RECORD KIND, EVENT
#       TOPIC OR STATE-ROOT WRITE (NG-11, NFR-13): the install record lives in the
#       config root, the status payload is derived and never persisted, and the
#       compatibility verdict is computed per run. A phase that needs an ambient
#       value takes it from the injected environment record instead.
#   D6. THE ALIAS NAMES THE OWNING BINARY WITHOUT ADDING A LITERAL. The
#       non-owning refusal must name the owning binary and may not hard-code it
#       (spec F-4: "derived from the brand's binary name, no identity literal",
#       and DM-7 keeps the product-surface literal inventory at five). Phase 2
#       therefore has packages/cli/bin/delivery-os.ts import the primary bin's
#       declared name from ./jaiship.ts as its OWNING name and pass it through
#       `BinLauncherOptions`; the owning-role fact itself is declared by each bin
#       (primary: owning; alias: absent, which defaults to not owning) and is
#       threaded through packages/cli/src/bin-launcher.ts into the composition
#       facts. No bin gains a second literal, the inventory stays at five
#       product-surface sites, and the alias's own brand paths are untouched. If a
#       literal is nevertheless introduced, TC-INST-107 fails by name.
#
# GATE SEQUENCE (every command runs from the repository root with the repo-local
#   scratch temp directory, in the order the test plan's §6.3 battery declares;
#   narrow-first at every phase, the aggregate gate where a pinned contract moves,
#   and the full battery at the last phase):
#   G0  TMPDIR=$PWD/tmp/tmpdir bun run build:binary                       (artifact tier, one cached build)
#   G1  TMPDIR=$PWD/tmp/tmpdir pnpm check                                 (aggregate: lint, format, typecheck, all tests, boundaries, memory, prompt-conformance, help-guide-coverage, exports-parity)
#   G2  TMPDIR=$PWD/tmp/tmpdir bun test <the phase's narrow suite set>
#   G3  TMPDIR=$PWD/tmp/tmpdir bash scripts/.tests/test-install.sh
#   G4  TMPDIR=$PWD/tmp/tmpdir bash scripts/.tests/test-uninstall.sh
#   G5  TMPDIR=$PWD/tmp/tmpdir bash scripts/.tests/test-doc-distribution.sh
#   G6  TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/error-table-sync.ts  (CI's own script, run locally; deliberately NOT in pnpm check)
#   G7  TMPDIR=$PWD/tmp/tmpdir ./scripts/lint-commit-range.sh --base main-tools
#   Phase 1 runs G2 (artifact/entrypoint suites), G0, and G1 because it moves the
#   identity/entrypoint surfaces and the pinned source inventory. Phase 2 runs G2
#   (family, admission, conformance), the three named checks, G6 and G1 because it
#   moves the family count, the help/coverage inventory, the error register and
#   the allowlist — the one phase where all of them meet. Phase 3 runs its narrow
#   behaviour suites and G1 (it adds package files, moves the inventory and the
#   status/record contracts). Phase 4 runs its narrow check-tier suites and G1 (it
#   adds package files and the removal/dry-run contracts). Phase 5 runs G3, G4 and
#   G2 over the two shell-adjacent suites (no G1 re-run: no package or pinned
#   surface moves). Phase 6 runs the whole battery G0..G7, including G5. Every
#   phase records one pm-notes `notes:` evidence entry in the §6.3 shape naming
#   the commit and the exact counts (26 families, 66 two-segment identities,
#   eleven `install` rows).
#
# INCONSISTENCIES: none blocking between spec v1.0, the five TDRs and test plan
#   v1.0. One divergence is resolved rather than papered over and one is a
#   conditional the plan declines to fire:
#   (a) SPEC DM-8 says the worktree-topology read "changes a pinned adapter export
#       surface and its parity baseline once"; test plan §3.2 says the delivered
#       `readCheckoutIdentity` already returns both values and makes the inventory
#       move conditional. The plan follows test plan §3.2 and the delivered code
#       (D2): no new export, no exports-parity move. If a gap is found, D2 names
#       the phase that absorbs it.
#   (b) The ticket's `upgrade` task is realised as an install of a different
#       artifact (spec DEC-6); no phase declares an `upgrade` verb.
#   (c) Spec §18's "(e) conformance surface" bullet is delivered inside phase 2
#       because the gates make it inseparable from the family (coupling 1).

