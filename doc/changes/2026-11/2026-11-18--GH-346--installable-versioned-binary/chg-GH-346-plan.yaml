  # ---------------------------------------------------------------------------
  # Phase 3 — Install record, seven-step atomic replace, dispositions, status and
  # the compatibility check, upgrade and involutive rollback (F-5, F-7, F-8, F-9;
  # DM-2, DM-3, DM-4, DM-6; AC-F5-2, AC-F5-3, AC-F7-1..3, AC-F8-1, AC-F8-2,
  # AC-F9-1..3; DEC-3, DEC-4, DEC-9, DEC-10, DEC-13; RSK-1, RSK-3, RSK-7, RSK-8,
  # RSK-9, RSK-10; NFR-3, NFR-4, NFR-6, NFR-7, NFR-9, NFR-12, NFR-16).
  #
  # Goal: an install can be upgraded, reported and undone, and a machine can be
  # asked the one compatibility question it has before a delivery command fails.
  # At every instant of a replace a runnable artifact exists at a known path.
  #
  # Contract: one record at `<config root>/install.json` under
  # `install.record.v1`, written atomically (staged in the record's own directory,
  # then renamed), never secret-bearing, every field of DM-2 present or
  # legitimately absent, and tolerant on read by all four consumers (DEC-13:
  # `install` overwrites damage, `uninstall` removes what it can and reports the
  # block as unknown, `rollback` refuses `install.record.unreadable`). The replace
  # is the seven normative steps of Appendix B with the step-4 identity-equal
  # stop (zero bytes rewritten, slot not swapped, daemon undisturbed) and the
  # one-slot rule that admits only a compiled artifact carrying an injected
  # identity (a launcher is discarded with a report naming its recorded target and
  # is never promoted). Upgrade is installing a different compiled artifact and
  # reports BOTH identities; rollback swaps slot and destination with two renames
  # in reverse order, is INVOLUTIVE, and refuses `install.slot.absent` /
  # `install.slot.invalid` with zero writes. The compatibility check compares the
  # artifact's accepted store-format identifier with each enumerated root's header
  # identifier only — header files only, one project level, capped at the declared
  # 128 judged roots (DEC-9), `unchecked` for an absent root and never collapsed
  # into `accepted` (DEC-10), nothing persisted, `state.schema.mismatch` untouched
  # — is advisory on `install`/`install rollback` (one line per not-accepted root,
  # exit code unchanged) and is the typed verdict behind `install status`
  # (`install.state.incompatible` at exit 1 with root, observed, accepted and the
  # judged count). `install status` completes its DM-4 payload here: running
  # identity, the record's identity and condition (`current`/`record-stale`/
  # `unreadable`/`absent`), the slot's identity and condition
  # (`present`/`absent`/`invalid`), target stability as DATA, and the state-format
  # group — deterministic field and line order for a given machine state, and a
  # crash between the renames and the record write is visible as `record-stale`
  # rather than an exception. The daemon guard lands here for the two
  # artifact-replacing paths (step 1's fourth gate: `install.daemon.running` unless
  # `--stop-daemon`, whose stop runs through the delivered stop path BEFORE the
  # swap); the removal-path extension is phase 4 (AC-F9-4).
  # The crash matrix uses the phase-1-declared seam decision (OQ-TP-1): the
  # optional test-only fault port for steps 2..7 plus constructed post-failure
  # states for steps 5, 6 and 7, and step 1 through its four gates.
  #
  # Decision to close in this phase: the fault port's step vocabulary and the exact
  # placement of the port's consultation inside the replace transaction
  # (delivery-bound). Failure mode: a step that cannot be induced fails
  # TC-INST-031..036 by name; the matrix must never degrade to "exit != 0" and a
  # pass without the recovery re-run is not a pass (test plan §4.3).
  #
  # Acceptance: AC-F5-2 (TC-INST-011, 012), AC-F5-3 (TC-INST-020, 021),
  # AC-F7-1 (TC-INST-043), AC-F7-2 (TC-INST-044, 046), AC-F7-3 (TC-INST-045),
  # AC-F8-1 (TC-INST-040), AC-F8-2 (TC-INST-041, 042), AC-F9-1
  # (TC-INST-030..036), AC-F9-2 (TC-INST-022, 033), AC-F9-3 (TC-INST-023, 024,
  # 025, 026).
  #
  # Gate (expected signal: exit 0 at every line; 7/7 crash points leave a runnable
  # artifact and recover, the identical install rewrites zero bytes, two rollbacks
  # restore the original):
  #   TMPDIR=$PWD/tmp/tmpdir pnpm typecheck
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/install-replace.test.ts tests/behaviour/install-crash-matrix.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/install-record.test.ts tests/behaviour/install-compatibility.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/install-lifecycle-e2e.test.ts
  #   TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/error-table.test.ts tests/structure/install-composition-absence.test.ts   (the new rows' triggers; the structural mirror must stay exact)
  #   TMPDIR=$PWD/tmp/tmpdir pnpm check                                     (G1, binding: new package files move the inventory and the record/status contracts are new surfaces)
