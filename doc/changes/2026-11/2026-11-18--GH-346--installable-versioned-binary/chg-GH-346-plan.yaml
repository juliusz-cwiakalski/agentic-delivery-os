  # known path, no truncated destination and no staged file, and the recovery
  # re-run restores a complete install; on the step-7 record-write failure the
  # recovery performs NO destination rename — destination bytes AND the slot's
  # content digest unchanged — and reconciles the record in place to `current` with
  # `previous` equal to the predecessor the readable stale record names), AC-F9-2
  # (TC-INST-022, 033, 037: destination bytes and modification time unchanged, the
  # slot not swapped and its content digest unchanged, a live daemon undisturbed,
  # the run reporting the identity and that nothing changed; the record unchanged
