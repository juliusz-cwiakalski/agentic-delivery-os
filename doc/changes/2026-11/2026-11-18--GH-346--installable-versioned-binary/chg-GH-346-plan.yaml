# PHASE ORDER AND THE COUPLING THAT FORCES PHASE 2 TO BE ONE COMMIT:
#   Order follows spec §18 (artifact and identity, then the family with its
#   admission rules, then the record and the replace, then removal and the
#   dry-runs, then the guards, then the documentation correction). Three
#   couplings are load-bearing and are NOT split:
#   (1) THE CONFORMANCE SURFACE MOVES IN THE SAME COMMIT AS THE FAMILY. Once
#       `install` joins `PROMPT_REQUIRED_COMMANDS`, `check:prompt`
#       (prompt-conformance), `check:help` (help-guide-coverage) and the pinned
#       count/tail suites (entrypoint-composition, entrypoint-two-bins,
#       supervision-mounting, metrics-mounting and the other PINNING_FILES
#       members) all fail unless the family entry, the five subcommand help
#       entries, the M4 reference page, the page-root branch, the coverage
#       inventory, the error-domain rows and the twelve pinned-count moves land in
#       the same commit. Spec §16 declares that surface as one contract; the gates
#       make it one commit. This is why spec §18's "(e) conformance surface"
#       bullet has no phase of its own: it is delivered inside phase 2, and only
#       the SHELL ownership guards remain as phase 5.
#   (2) THE ERROR-DOMAIN REGISTER MOVES ONCE (phase 2). `pnpm check` runs
#       `tests/checks/error-table-sync.test.ts`, which calls `runSyncCheck` over
#       the live tree and compares the source table, the documented table in
#       doc/spec/features/feature-result-contract.md and the corpora fixtures.
#       Adding the `install` kind therefore cannot be done in two commits: phase 2
#       declares the kind and all ELEVEN rows, documents them, moves the closed
#       two-segment allowlist 65 -> 66 (exactly one row, `install.dev-build`, is
#       kind-first two-segment) and adds one corpus row per identity. Each row's
#       TRIGGER is then bound by the phase that owns the behaviour (see the
#       trigger binding note in phase 2); a row with a declared identity is a
#       register entry, never a wildcard, and RSK-14 binds every row to an AC.
#   (3) DOCUMENTED-TABLE AND REFERENCE-PAGE OBLIGATIONS RIDE WITH THEIR GATE.
#       Because of (2), doc/spec/features/feature-result-contract.md moves in
#       phase 2 (documented rows plus the allowlist sentence), and because of (1)
#       the M4 reference page doc/planning/oss-tooling/milestones/m4/commands/
#       install.md moves in phase 2. These are the only two documentation edits
#       outside phase 6; the rest of the documentation set (F-16) is phase 6.
#   Two further orderings are declared rather than discovered:
#   (4) THE PROCESS-EDGE RE-ENTRY FIX LANDS FIRST (phase 1). Nothing in phases
#       2-6 installs a service unit — the lifecycle only stops a daemon through
#       the delivered stop path — but the delivered daemon composition consumes
#       `daemonEntry` for detached re-entry AND for the unit's executable, so an
#       uncorrected compiled artifact would hand `/$bunfs/root/<name>` to a spawn
#       or a unit. Phase 1 corrects the bins to supply `process.execPath` for a
#       compiled run and the delivered script path otherwise, before any lifecycle
#       commit exists (AC-F3-2, TC-BIN-069).
#   (5) THE SHELL-INSTALLER GUARD LANDS AFTER THE FAMILY (phase 5). The
#       installer's new refusal arm NAMES the lifecycle command and the
#       uninstaller's reporting arm names the owning removal command, so both
#       require the family to exist and be documented (phase 2). Their bash arms
#       land with them (scripts/.tests/test-install.sh, test-uninstall.sh).
#   The documentation phase is LAST (phase 6) and carries the release evidence:
#   the guide, the four specification pages, the install-model correction, the
#   documentation-truth gates, and the full G0..G7 battery including
#   `bash scripts/.tests/test-doc-distribution.sh`. Two statements this change
#   falsifies — the entrypoint page's "twenty-five families" count and the
#   doc-distribution page's "no uninstall path exists" — are corrected in phase 6
#   by design: no gate reads either sentence before then (verified: no assertion
#   in tests/ reads them; doc-conformance pins the per-change delta tables phase 6
#   extends), and the branch is unreleased for the whole window so no operator
#   meets a false statement.
