  #   TMPDIR=$PWD/tmp/tmpdir pnpm check                                     (G1, RUN: the tier's escalation trigger requires a green aggregate at every phase boundary; the narrow bash gates prove only the touched suites, not the workspace around them)
  #
  # Commit: feat(GH-346): shell installer guard and uninstaller ownership split
