  # ---------------------------------------------------------------------------
  # Phase 2 — The composed `install` family, its admission and dev gates, and the
  # whole declared conformance surface in one commit (F-4, F-5, F-6, F-15;
  # DM-6, DM-7; AC-F4-1..3, AC-F5-1, AC-F6-1, AC-F15-1, AC-F15-2; DEC-1, DEC-7,
  # DEC-9, DEC-12; RSK-4, RSK-6, RSK-14, RSK-16; NFR-8, NFR-9, NFR-10, NFR-14).
  #
  # Goal: `install` is reachable through both composed programs as the
  # twenty-sixth family, advertised with its alias restriction, admitted or
  # refused before it writes anything — and every conformance surface the
  # aggregate gate pins moves in the SAME commit, because a family cannot be
  # reachable without it (header coupling 1 and 2).
  #
  # Contract: five entry points (`install`, `install status`, `install rollback`,
  # `install uninstall`, `install purge`) registered unconditionally in the
  # production composer with their runtime (home, process facts, file-system port,
  # clock, daemon status read, git worktree read) and composed for BOTH bins; the
  # bin's owning-role fact defaults to NOT owning, so the alias answers exactly one
  # `install.identity.not-owning` refusal at exit 1, writes nothing and creates no
  # path under its namespace, while its help entry states the restriction. The
  # destination is not an input: a destination flag, a positional path or an
  # environment value is a delivered `fallback.invocation` grammar refusal
  # (AC-F4-3). One admission predicate (install-admission.ts) governs every
  # executed path: S-1 a linked worktree (own git dir differs from the common git
  # dir) refuses with `install.target.worktree` naming the target directory, both
  # git directories, the two admissible origins and the deletion reason; S-2 an
  # unreadable git state is ADMITTED as `unverified`; S-3 a stable checkout is
  # admitted as `verified`; the dirty flag is never an admission question; S-4
  # cannot fail by operator action. Detection is repository metadata, never a path
  # prefix or a listing order, and it runs over the artifact's own directory
  # (D2: the delivered `readCheckoutIdentity` answers the facts). The dev gate
  # refuses a fallback-identity run with `install.dev-build` naming the build entry
  # and the artifact path convention, and it is scoped to the write paths — a
  # report (`install status`) is never refused by it (TC-INST-013 step 5). The
  # composition constructs no HTTP client and spawns no build or package manager,
  # asserted structurally with a planted control (NFR-8). Phase-2 write posture is
  # D3: real `install` runs steps 1, 2, 3 and 6 and the slot-free dispositions,
  # real `rollback` answers the TRUE `install.slot.absent`, real `uninstall`
  # removes the artifact and prints the residual set, real `purge` requires
  # `--yes`, and status omits the state-format group until phase 3.
  #
  # Conformance surface (the declared cost, all in this commit): the prompt-required
  # set becomes exactly 26 with `install` LAST and `supervise` immediately before
  # it; every pinned count and tail position in the PINNING_FILES set moves
  # 25 -> 26; root help carries the family row (with the alias restriction) and
  # each of the five entry points carries its own static-inventory help (usage,
  # options, examples, exit codes, see-also, examples that parse); the new
  # reference page doc/planning/oss-tooling/milestones/m4/commands/install.md
  # exists with `--help` and `--version`; `help-guide-coverage.ts` gains the M4
  # page root and the `install` branch (the default M1 root must not serve it) and
  # `tests/checks/reference-page-parity.test.ts` moves with it so the two copies
  # of the mapping cannot drift; the coverage inventory moves in both directions;
  # the error register gains the `install` domain kind and all ELEVEN rows
  # (`install.target.worktree`, `install.dev-build`, `install.state.incompatible`,
  # `install.identity.not-owning`, `install.shell-profile.unresolved`,
  # `install.migration.unavailable`, `install.daemon.running`,
  # `install.record.unreadable`, `install.slot.absent`, `install.slot.invalid`,
  # `install.purge.unconfirmed` — all category `user`, non-retryable,
  # consequence `not_landed`, projection `user-validation`, exit 1), documented on
  # the result-contract page, with the closed two-segment allowlist moved 65 -> 66
  # by exactly `install.dev-build` and one corpus row per identity; and the
  # identity-literal inventory gains no literal (phase 1 declared the build-side
  # derivation site), with both directions plus a failing control asserted.
  # TRIGGER BINDING (this phase's declared debt): every row's trigger is bound by
  # the phase that owns the behaviour — phases 2 (`target.worktree`, `dev-build`,
  # `identity.not-owning`), 3 (`state.incompatible`, `record.unreadable`,
  # `slot.absent`, `slot.invalid`), 4 (`daemon.running`, `shell-profile.unresolved`,
  # `migration.unavailable`, `purge.unconfirmed`). A row is a register entry, not a
  # wildcard; no phase may add a twelfth row or a family code.
  #
  # Decision to close in this phase: the exact wording of the alias restriction in
  # the family help entry and the exact shape of the refusal's owning-binary name
  # (derived from the brand, never an identity literal). Failure mode: TC-INST-002's
  # restriction assertion and TC-INST-004's single-line assertion fail by name; a
  # second line or a hard-coded `jaiship` literal fails the literal inventory.
  #
  # Acceptance: AC-F4-1 (TC-INST-001, 002, 003), AC-F4-2 (TC-INST-004),
  # AC-F4-3 (TC-INST-005, 006), AC-F5-1 (TC-INST-010), AC-F6-1 (TC-INST-013,
  # 014), AC-F15-1 (TC-INST-100, 101, 102, 103, 104), AC-F15-2 (TC-INST-105, 106).
