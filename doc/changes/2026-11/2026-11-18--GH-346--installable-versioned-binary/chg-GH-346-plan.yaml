  # reconciled in place to `current` — `previous` from the readable record, absent
  # and reported unknown otherwise — leaving destination and slot untouched), AC-F9-3
  # (TC-INST-023, 024, 025, 026).
  #
  # Gate (expected signal: exit 0 at every line; 7/7 crash points leave a runnable
  # artifact and recover, the identical install performs zero destination renames
  # and zero slot swaps with both content digests unchanged, every reconciliation
  # arm ends `current` with the destination and slot untouched, and two rollbacks
