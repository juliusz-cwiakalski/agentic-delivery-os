#     tests/checks/reference-page-parity.test.ts), and (d) `git diff --check`
#     before the phase commit.
#   - Aggregate gate at EVERY phase boundary and the delivered HEAD:
#     TMPDIR=$PWD/tmp/tmpdir pnpm check (with tmp/tmpdir present,
#     git-ignored, repo-local — the repo-local TMPDIR lesson; never /tmp or
#     /tmp/opencode as fixture bases). A phase is not complete until the
#     aggregate is green at its commit.
#   - Lifecycle commands (phase complete, commit) run with
#     PATH="$PWD/node_modules/.bin:$PATH" so the commitlint probe resolves.
#     The phase-9 range gate ./scripts/lint-commit-range.sh --base main-tools
#     is run by @pm and recorded in pm-notes; it is not re-implemented here.
