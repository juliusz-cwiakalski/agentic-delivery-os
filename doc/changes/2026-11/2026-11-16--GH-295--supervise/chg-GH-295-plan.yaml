# PLAN-LEVEL DESIGN DECISIONS (the three phase-4 items the test plan deferred
# here — OQ-TP-1/TP-2/TP-3 — plus the two error-code spellings; recorded so
# the delivery never invents them silently; all are contract data asserted by
# the phase-1 structure suites, invisible to any AC/NFR mapping):
#   OQ-TP-1 (report bounds beyond the lane cap): supervisors[] and actions[]
#     carry NO separate numeric cap in v1. Both derive from the same single
#     scoped whole-store fold as lanes[], so their populations are bounded by
#     the scope's durable records, and counts disclose the population
#     truthfully (never silently rounded). The one declared numeric report
#     bound is the 200-lane cap, resolved by import to the delivered lanes
#     constant home QUEUE_MAX_LANES — never a literal, never a second bound.
#     A supervisors/actions cap would be a future additive contract key
#     through the declared configuration-key path if evidence demands.
#   OQ-TP-2 (coordinator-claim supervision artifacts): per the test plan's
#     adopted interpretation, a coordinator ledger-lease claim's supervision
#     artifacts are its reconciliation records plus its ledger-position
#     movement — exactly the two classes TC-SUP-021 seeds. A later
#     coordinator-specific artifact class extends the case, never contradicts.
#   OQ-TP-3 (truncation-reason vocabulary): a closed set declared once in the
#     supervise contract with exactly one member for v1 — "lane-cap", joining
#     the delivered lanes truncation precedent's shape. TC-SUP-082 asserts a
#     named reason drawn from this declared set, never a free string, never
#     null; a second reason joins additively with its bound in the same
#     contract home.
#   Error-code spellings (AMB-2 discipline; semantics are spec-bound, only
#     the spelling is declared here): the two supervise identities are
#     supervise.duplicate-supervision (user, exit 1, retryable, not_landed)
#     and supervise.evidence-absent (platform, exit 2, retryable,
#     not_landed) — two-segment exact identities joining the closed
#     allowlist by exact declaration (62 -> 64), no supervise.* family
#     pattern, no prefix widening.
#   RE-ENTRY HORIZON (DoR iteration-1 finding 3, folded here per PM — a
#     DEC-2 contract declaration recorded against the spec, not a spec
#     edit): the supervised-stall park's `until` is the declared stall
#     recheck horizon derived from the MAPPED CONDITION TYPE'S recheck
#     default — until = runInstant + QUEUE_PARK_RECHECK_DEFAULTS[
#     conditionTypeForCause("liveness-stall")] (the provider-window
#     default, 60_000 ms) — imported from the delivered constants, never a
#     literal. The 300,000 ms WATCHDOG_STALL_HEARTBEAT_MS is the
#     CORROBORATION BOUND (the stall-classification input, NFR-1) and is
#     NOT the re-entry horizon; `recheckMs` rides the same mapped default
#     per DM-2, so phase 4 implements exactly one unambiguous constant
#     source and TC-SUP-040's golden (until later than the run instant,
#     equal to the horizon) agrees by construction.
