# CONSTRAINTS BINDING ON EVERY PHASE (spec sections 5-9; do not reshape at
# delivery):
#   - Envelope continuity: every outcome projects the exclusive data/error
#     envelope with the {0,1,2} exit taxonomy (DEC-6): exit 0 report (a
#     detected-and-parked stall rides data and counts), exit 1 classified
#     refusals (grammar, delivered refusal identities, the per-action
#     duplicate-supervision identity on the run carrying the refused
#     action), exit 2 evidence-absent or unreadable state; claim
#     classification and holder reporting ALWAYS ride report data and are
#     never a refusal (DEC-8b).
#   - Layering and purity (ADR-0003; NFR-2, NFR-7): contracts and pure
#     domain in packages/core (no I/O, no clock, no adapter import in the
#     domain; the classification input shape declares no process-derived
#     member); the app tier owns the fold and the appends; the CLI tier
#     owns rendering and grammar; the binary/product name in human output
#     comes from the brand seam only (zero literals outside it).
#   - Consumption, never duplication (DEC-1, DEC-3, F-4): the corroboration
#     bound resolves by import to WATCHDOG_STALL_HEARTBEAT_MS (no 300_000
#     literal anywhere in the supervise tier); probes are a subset of
#     WATCHDOG_PROBES; no second advancing/stale predicate beside the
#     delivered liveness classification; SUPERVISION_STATES is declared
#     once in the supervise contract and its agreement with the delivered
#     vocabularies (WATCHDOG_VERDICTS, DAEMON_LANE_LIVENESS_
#     CLASSIFICATIONS) is a declared mapping, never a rename; the daemon
#     lock, coordinator ledger lease, and per-ref single-flight are
#     consumed read-only.
#   - Additivity (DM-4, EVT-1, §8.5): no new state-ledger record kind, no
#     delivered payload schema bump, no new event topic or kind; appends
#     ride ONLY the delivered park, restart, and terminal-exhaustion
#     fenced paths; pre-change records replay unchanged and a missing new
#     cause reads as a classified absence; the only new schema identity is
#     delivery.supervision.v1.
#   - Park vocabulary exactness (DM-2, DEC-2, RSK-6): QUEUE_PARK_CAUSES is
#     the delivered five in position plus exactly liveness-stall sixth;
#     QUEUE_PARK_CONDITION_TYPES unchanged; the pair table gains exactly
#     one row mapping liveness-stall onto provider-window (the
#     expiry-carrying type, the peak-window precedent);
#     QUEUE_PARK_RECHECK_DEFAULTS gains no key (provider-window's declared
#     default governs); the parked:<cause> template renders
#     parked:liveness-stall with every delivered render unchanged; mapping
#     asserted through conditionTypeForCause, never a literal.
#   - Evidence discipline (NFR-3, NFR-6): every entry, action, and refusal
#     carries non-empty evidence naming refs, record kinds, instants, and
#     codes bounded to the scope; lock tokens, session ids, and process
#     identifiers never appear in payloads; evidence respects the delivered
#     evidence-cap constants.
#   - Never signal (DEC-7, NG-3): zero kill/spawn/signal markers and zero
#     process-seam calls across every action path; held sessions are
#     touched only through the delivered safe-boundary preemption intent.
#   - Scope purity (G-1, NG-5): the fold emits exactly the invoking
#     checkout's single managed repository key; no second-repository read
#     path exists in the supervise modules; foreign keys appear nowhere in
#     either projection.
