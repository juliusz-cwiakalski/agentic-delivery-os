    location: packages/cli/src/production.ts:3372-3400
    message: >-
      The action path breaks the declared read contract. NFR-4 requires one whole-store read fold per
      run and feature-supervise section 3.8 states "exactly one whole-store read per battery run",
      but the production closures re-read the entire ledger per action: `admitRestart` calls
      `readEconomicsRecords(store, ref)` (a full `store.readRecords()`) once per already-parked
      stalled lane (`packages/cli/src/production.ts:3375`, `packages/core/src/state/economics.ts:205`),
      `claimRefusal` calls `claimSingleFlightRefusal` which takes a verified whole-store snapshot per
      lane (`production.ts:3391`), the park write port calls `readQueueParks` twice per park
      (`packages/core/src/app/supervise.ts:693,723`), and each exhausted lane calls
      `readBlockerLedger` (`production.ts:3345`). With the 200-lane cap and many stale lanes this is
      O(lanes x ledger) reads. The read-cost case (`tests/behaviour/supervision-read-cost.test.ts`)
      counts only the injected fold port, and the latency case
      (`tests/behaviour/supervision-performance.test.ts`) runs a read-only fold with no write or
      admission seams, so the 5,000 ms bound is not proven for a run that acts. Related dead data:
      the read port already builds a per-ref restart map (`app/supervise.ts:141,483-505,672`) that the
      battery never consumes.
    suggestion: >-
      Consume the snapshot the fold already carries: derive the restart-budget admission and the
      per-ref live-lease/single-flight answers from `SupervisionScopeSnapshot` (restarts + leases) so
      budget admission needs no extra store read, and dedupe the blocker-ledger read (once per run,
      not once per lane), or declare these as explicit extra reads and drop the "exactly one read"
      claim from the feature page. Add a read-count cell and a latency cell over an acting run at the
      cap (park + restart paths composed), and either use or remove `SupervisionScopeSnapshot.restarts`.
    suppressed: false
    published_url: null
    published_at: null
