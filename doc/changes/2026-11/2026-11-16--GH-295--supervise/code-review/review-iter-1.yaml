summary: >-
  The supervision battery itself is well built: the contract is data-only with one home per
  vocabulary, the fold is a pure artifact-only function with an injected clock, parks and restarts
  append only through delivered paths, the tri-state (including the ticket AC's lying-liveness cell)
  is exercised across structure, behaviour, golden and checks levels, and the full test battery,
  typecheck, boundaries, lint, format, help-coverage, exports-parity, doc-distribution and memory
  gates are green on a clean worktree. One blocker defeats the change as delivered: adding
  `liveness-stall` to the closed park-cause set made the delivered operator command
  `queue release <ref> --park liveness-stall` legal without `--until`, and that path writes a
  `provider-window` park whose `condition.expiresAt` is the empty string, which the park record's own
  validator rejects - so every later park read fails closed with `state.store.torn` and `queue`,
  `lanes` and the battery's park path stop working permanently (append-only ledger; reproduced
  end-to-end). Three majors follow: the action path performs per-lane whole-store re-reads (the
  declared one-read NFR and the 200-lane latency cell only cover a read-only fold), the eight
  phase commits ignore the plan's declared conventional subjects (all are generic path-derived
  `chore(GH-295): update <path>...` with empty bodies), and the safe-boundary "park lands at the next
  boundary" mechanism declared by F-5/DEC-7 and TC-SUP-043 is not what was built (park record lands
  immediately as the intent) and the spec/test plan were not amended. Spec and plan compliance are
  therefore FAIL even though all eight ACs are functionally met.
