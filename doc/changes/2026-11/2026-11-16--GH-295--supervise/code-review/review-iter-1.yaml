  - id: F-1
    severity: critical
    severity_label: blocker
    confidence: high
    category: correctness
    location: packages/core/src/contracts/queue.ts:133
    message: >-
      Adding `liveness-stall` to `QUEUE_PARK_CAUSES` makes the delivered operator path
      `queue release <ref> --park liveness-stall` legal, but no guard requires `--until` for this
      cause (`packages/cli/src/commands/queue.ts:715-736` lists only provider-window/peak-window, and
      `packages/cli/src/edge.ts:6372-6402` mirrors that), so `parkConditionForCause` supplies
      `expiresAt: ""` (`packages/core/src/domain/queue-park.ts:42`) and `releaseQueueLease` appends a
      `provider-window` park without `until`
      (`packages/core/src/app/queue.ts:2290-2330`). That record fails the ecosystem's own park
      validator (`isParkRecord`, `packages/core/src/app/queue.ts:374` requires a non-empty
      `condition.expiresAt` for `provider-window`), so from that moment every park read returns
      `state.store.torn`. Reproduced twice: (a) direct core call
      `releaseQueueLease(... park: { cause: "liveness-stall", condition: parkConditionForCause("liveness-stall") })`
      returns `ok: true` and the next `readQueueParks` returns `{ok:false, reason:"torn"}`; (b) through
      the delivered queue edge harness, `queue release GH-320 --holder holder-a --park liveness-stall
      --json` exits 0 with `result: "parked"`, then `readQueueParks` fails and `queue --json` /
      `lanes --json` exit 1. The ledger is append-only, so the damage needs manual record surgery,
      and it disables the battery's own park path (its write port starts with `readQueueParks`).
      No case covers the new cause through the operator path; TC-SUP-045 only asserts the vocabulary
      and the resolver mapping.
    suggestion: >-
      Make the new cause non-operator-writable - refuse `--park liveness-stall` at the queue command
      and edge runtime with a delivered identity (the park is battery-written only, mirroring the
      owner-hold "one writer" rule) - or, alternatively, treat it as an expiry-carrying cause
      (require `--until` and stamp both `condition.expiresAt` and the top-level `until`). Harden
      `releaseQueueLease`/`createParkRecord` so a `provider-window` condition can never be built from
      an empty expiry. Add a closed-set regression case asserting that every member of
      `QUEUE_PARK_CAUSES` either round-trips a record its own guard accepts or is refused with a
      named identity, and update the scheduling-engine park text accordingly.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
