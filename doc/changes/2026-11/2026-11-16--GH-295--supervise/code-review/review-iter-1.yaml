    location: packages/core/src/app/supervise.ts:908-1025
    message: >-
      The supervised-stall park's declared re-entry instant (`until` = run instant + the mapped 60,000
      ms recheck default, described in the feature page as "the re-entry instant") is never consulted
      before acting. On the next battery run over the same still-stalled lane the battery skips the
      park (already parked) and immediately consults restart admission; nothing compares the run
      instant with the park's `until`/`recheckMs`. So an operator who runs the battery twice in a row
      restarts (and burns budget on) a lane the park declared as not re-entrant for another minute.
      AC-F7-1 does not forbid this and the feature page documents the branch, but the operational
      meaning of "re-entry instant" is not honoured.
    suggestion: >-
      Skip the restart branch while `now < park.until` (or the recheck interval has not elapsed),
      reporting no action, and add a cell asserting a second run inside the horizon appends nothing;
      or state explicitly that the horizon governs only the park pass, not battery actions, and rename
      it so the projection does not promise re-entry.
