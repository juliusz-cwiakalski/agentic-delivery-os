findings:
  - id: F-1
    severity: critical
    severity_label: blocker
    confidence: high
    category: correctness
    location: packages/core/src/app/supervise.ts:964-965
    message: >-
      The battery treats a lane as "already parked" only when the existing active park's cause is
      `liveness-stall` (`fact.activePark.cause === "liveness-stall"`, app/supervise.ts:964-965), and
      the park write port now performs no read of its own (createStateSupervisionWritePort,
      app/supervise.ts:745-786). So a stalled lane whose latest park is an ACTIVE park of any other
      cause (owner-hold, peak-window, provider-quota, preempted-for-close-item — or a stuck
      `clear-observed` park, which the fold reports as no active park because the latest record is
      not `parked`) falls through to `input.write.appendPark` (app/supervise.ts:1114) and appends a
      second active `parked` record for the same ref. `readQueueParks` fails closed on exactly that
      shape (`hasDuplicateActiveParks`, packages/core/src/app/queue.ts:721-727), so from that moment
      every `queue` and `lanes` read returns `state.store.torn` and the ledger is append-only.
      Reproduced (temp repository, delivered seams only): declare GH-295, write an aged own
      daemon-lane observation (-300_005 ms), park it under `owner-hold` through `releaseQueueLease`
      (the exact writer `queue release --park owner-hold` uses), then `supervise --json` -> exit 0
      with action `supervised-stall-park`, after which `readQueueParks` returns
      `{ok:false, reason:"torn", code:"state.store.torn"}` and `queue list --json` /
      `lanes list --json` both exit 1. The delivered peak machinery reaches the same cell
      (`cause: "peak-window"` records, packages/core/src/domain/daemon-peak-pause.ts:208): a lane
      stopped by a peak pause leaves an aged lane record, so a battery run inside the window stacks
      a liveness-stall park on the peak-window park. This is the same defect class as iteration-1 F-1
      (a battery append the ecosystem's own read validator rejects) and it silently defeats the
      change's own rule that "every cause-writer pair either round-trips a park its own validator
      accepts or is refused by name" (DEC-9(a)): the battery kept working, the operator's queue and
      lanes surfaces stopped.
    suggestion: >-
      Gate the park append on "no active park at all" (`fact.activePark === undefined`) and keep
      restart admission limited to the `liveness-stall` cause, so an owner-hold, peak-window, quota
      or stuck park is respected instead of stacked; and make the guard explicit at the seam (the
      fold already knows the active park, so the caller can pass it). Add three behaviour cells — an
      owner-hold-parked stalled lane, a peak-window-parked stalled lane, and a `clear-observed`
      stuck park — each asserting zero appends, exit 0, and a healthy `readQueueParks`; add a
      post-action `readQueueParks`/`lanes`-healthy assertion to every existing action cell so a
      future writer cannot corrupt the ledger silently.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
    severity_label: major
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:3362
    message: >-
      The F-8 fix put the invocation's run id into the typed question's identity
      (`const id = \`exhaustion-${ref}-${recordRunId}\``, production.ts:3362; mirrored in
      tests/fixtures/supervise/harness.ts:89), and `superviseRunId` is a fresh per-invocation uuid
      (production.ts:3127; entrypoint.ts:408), so the idempotence check
      (`questions.some(q => q.id === id)`) can never fire across two real runs. The battery also
      raises the question unconditionally even when `ensureExhaustion` returned `appended:false`
      (app/supervise.ts:1050-1080). Reproduced: two `supervise` runs over the same exhausted lane
      with distinct injected run ids leave one `economics.budget-exhaustion` record but TWO
      decision-needed questions in the blocker ledger (`exhaustion-GH-295-run-invocation-1`,
      `exhaustion-GH-295-run-invocation-2`), and the second run still reports an `exhaustion-record`
      action although nothing landed. Every repeated run (the natural operator retry, and the case
      the feature page calls inert) appends another owner-facing question — including after the
      previous question was answered, because the check compares ids only and never ref+type. TC-SUP-061's cell "a
      repeat adds no second question" passes only because both runs reuse the same injected run id,
      and the test plan states both halves of the contradiction in adjacent sentences ("the question
      id stays unique per run and per ref" and "a repeated run does not duplicate the question",
      chg-GH-295-test-plan.md:1231-1232); the plan's phase-5 obligation names it explicitly ("the
      typed question exactly once, no second question on repeat", chg-GH-295-plan.yaml:914-916).
    suggestion: >-
      Make the question id ref-stable (e.g. `exhaustion-<ref>`) or, better, gate the raise on the
      terminal record actually landing (`ensureExhaustion(...).appended === true`) and only report an
      `exhaustion-record` action when something landed; keep the run id as record/evidence metadata,
      not as the identity key. Replace TC-SUP-061's repeat cell with two runs carrying different
      injected run ids and assert exactly one question and one terminal record.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    severity_label: minor
    confidence: high
    category: performance
    location: doc/spec/features/feature-supervise.md:186
    message: >-
      The decision path really is one-fold now (the park write port performs no `readRecords`, the
      restart admission consumes `snapshot.restarts`, and the per-ref refusal is the delivered pure
      `singleFlightRefusalFromLeases` over the snapshot leases) — iteration-1 F-2's O(lanes) decision
      reads are gone. But the absolute claims are still false for a composed acting run: measured
      `store.readRecords()` calls for one 50-lane run with two parks, one restart and one exhaustion
      = 8 (1 fold; 2 inside `appendEconomicsRestartEvent`; 2 inside
      `ensureEconomicsExhaustionRecord`; 2 `readBlockerLedger` calls; 1 blockers boundary coverage
      read), all from the delivered append helpers the battery rides
      (packages/core/src/state/economics.ts:280-340, packages/core/src/state/blockers.ts:342-460).
      Production additionally re-reads the ledger inside `appendBlockerQuestion` because `current`
      is not passed (production.ts:3366-3380), so "the blocker ledger is read at most once per run"
      (feature page:186 and :250) is false. NFR-4 as amended in spec v1.2 ("One whole-store read fold
      per battery run ... covering the action path"), the test-plan NFR-4 row
      (chg-GH-295-test-plan.md:128, "Recorded read count == 1 ... for an acting run") and the
      phase-9 pm-notes claim all assert the absolute bound. TC-SUP-103 asserts `count === 1` only
      because it injects a store-free fake economics port
      (tests/behaviour/supervision-read-cost.test.ts:24-40), so its "acting run" proof does not cover
      the composed path; the harness's own real-store economics copy would report 8.
    suggestion: >-
      Pass `current: ledger.value` to `appendBlockerQuestion` (one fewer ledger read, and it makes
      the "at most once per run" sentence true), then state the read discipline exactly in NFR-4,
      the feature page, the test-plan row and the pm-notes: one fold read for the decision path, plus
      each delivered append's own bounded read-back — or give the action path read-free appends. Add
      one read-count cell over the composed production economics closures so the claim is proven
      where it matters.
    suppressed: false
    published_url: null
    published_at: null
