summary: >-
  The iteration-1 blocker is genuinely closed: `liveness-stall` is battery-written only, the
  operator path refuses it by name through delivered identities at both the command and the edge
  runtime with zero appends and healthy reads, and both append seams refuse a provider-window park
  with an empty or missing expiry before any write; TC-SUP-100 proves the closed-set rule by
  iterating `QUEUE_PARK_CAUSES` (one accounting row per member, read-back validated) so a new cause
  cannot ship uncovered. F-6, F-7, F-8, F-9, F-11, F-12, F-13 and F-14 are real fixes whose asserted
  expectations match the delivered code (own `daemon.lane` heartbeat with the declared fallback,
  per-claim `recordKind`, injected run identity in restart/exhaustion/question records, a genuinely
  live presence cell, the oversized-entry clamp, the removed dead `heartbeatOrdinal`, the restored
  exact-set mounting guard, and the re-entry horizon that makes a second run inert), and DEC-9(a)-(d)
  is honestly reflected in code, spec v1.2, test plan v1.4 and the feature page. Two defects remain,
  one of them a blocker of the same class the change set out to close: the battery still appends a
  second active park when the lane is already parked under ANOTHER cause (owner-hold, peak-window,
  or a stuck `clear-observed` park), and that record trips the delivered duplicate-active-park
  validator, so every later `queue`/`lanes` read returns `state.store.torn` permanently (reproduced
  end to end). Second, the run-scoped typed-question identity introduced by the F-8 fix makes every
  repeated `supervise` invocation append another owner-facing decision question for the same
  exhausted lane, while TC-SUP-061's "no second question" cell passes only because it reuses one
  injected run id. Both are functional, both reproduce outside the fixtures, and neither is
  disclosed. The declared one-read discipline is also still overstated for a composed acting run.
