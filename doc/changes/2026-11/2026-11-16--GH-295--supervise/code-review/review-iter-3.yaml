summary: >-
  Iteration-2's blocker and major are genuinely closed, and the two minors are closed at the
  level the reviewer asked for. The park append is gated on the ONE occupancy home
  (`activeParkRecords`), whose sequence semantics match the delivered duplicate-active-park
  validator; I re-ran the reproducers from iteration 2 plus four adversarial variants the suite
  does not carry (owner-hold, peak-window, an owner-hold park followed by a stuck
  `clear-observed` marker, a peak-window park followed by the same marker): zero appends, byte-
  identical prior records, honest `stalled` classification, no restart, and healthy
  `readQueueParks` / `queue list` / `lanes list` in every cell; a lane parked and then genuinely
  `recovered` still re-parks once, so the gate is not over-broad, and the delivered recovery pass
  appends `clear-observed` then `recovered`, which the new occupancy fold clears exactly as the
  validator does. The exhaustion question is ref-stable (`exhaustion-<ref>`) and the action/question
  are raised only when the terminal record actually appends: two runs with different injected run
  ids leave one terminal record and one question, the second run reports no action, and a single
  run with two exhausted lanes raises two distinct questions. The read discipline is honest over
  the composed wiring: I measured 7 whole-store reads for both 50- and 200-lane acting runs (one
  decision fold, the four delivered economics append read-backs, one blocker-ledger read, one
  blocker coverage read), matching spec v1.3 DEC-9(d)/NFR-4 and the feature page, which now
  explicitly disclaims a total of one. The one-factory structure guard plus the composed
  production acting run close the re-implementation hole. No blocking or major finding remains;
  the surviving findings are accuracy nits: a pre-existing "a landed park refuses a second
  identical park" claim in spec F-6/DEC-8(c)/RSK-2 and the write-seam comment is not what the
  seam does (the run's occupancy gate is; RSK-2 already declares the concurrent-writer window),
  and test plan v1.5 still describes the pre-fix fold/validator disagreement and prescribes a
  mutant that can no longer fail.
