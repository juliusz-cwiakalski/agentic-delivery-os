      write serialization (a landed park refuses a second identical park)". The seam does no such
      thing — `createStateSupervisionWritePort.appendPark` performs no read and no duplicate check.
      Reproduced on a temp store with the delivered port only: two `appendPark` calls for one ref
      both return `{ok:true, appended:true}` and `readQueueParks` then returns
      `{ok:false, reason:"torn", code:"state.store.torn"}`. The protection that actually exists is
      the caller's occupancy gate over the run's fold snapshot, which is exactly RSK-2's declared
      window ("the fence serializes appends but not decisions"), so the residual is disclosed; only
      the mechanism attribution is wrong, and it is repeated in three artifacts plus one comment.
    suggestion: >-
      Reword the four places to name the mechanism that exists (the run's occupancy gate over the
      one fold; a second append races only inside the RSK-2 window that OQ-1 defers) instead of a
      landed-park refusal. If the seam-level guarantee is wanted, make `appendPark` read the parks
      under its own fence and refuse on any active park; otherwise declare the seam as
      intentionally read-free and point at RSK-2.
