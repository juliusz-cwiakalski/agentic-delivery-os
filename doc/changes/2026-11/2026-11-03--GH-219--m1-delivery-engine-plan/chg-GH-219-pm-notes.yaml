decisions:
  - { text: "Use all four binding owner decisions in GH-219; no new story tickets, tooling implementation, decision acceptance, or merge in this change.", date: "2026-11-03" }
  - { text: "Owner redirected delivery mode mid-change: GH-219 is planned and delivered as an interactive CEO-driven session in the CEO conversation (deliver-ticket dispatch aborted before phase 2; branch and pm-notes reclaimed), with small parts delegated as needed. Same 11-phase ledger discipline; phases recorded here as they complete. PR stays open for owner review; merge only after owner accepts the milestone plan. Story tickets are created in a follow-up change after merge.", date: "2026-11-03" }
  - { text: "Spec and test plan authored by the interrupted dispatch run were reviewed by the CEO session and retained: they match the four binding owner decisions and the implemented deliverables; the plan artifact and all planning-document edits come from the interactive session.", date: "2026-11-03" }
  - { text: "Owner-requested scope addition at the owner gate (PR open, pre-merge): per-milestone outcome packs added (milestones/ README + M0 architecture backfill + M1 architecture, journeys, man page, contracts) so the owner can review planned outcomes and refine contracts before delivery starts. Packs are review surfaces; the backlog stays canonical. New docs use a binary-name placeholder because registered user-facing docs cannot carry the working-name literal (guard discipline; no allowlist change).", date: "2026-11-03" }
  - { text: "Second owner-gate addition: exact interaction examples (m1/interactions.md) and the command-to-daemon communication contract, previously implied but unspecified. Design recorded: state-mediated truth with a local control socket as wake-now/stream optimization only; commands write intent, daemon writes execution records, lifecycle agents write the ledger (fence tokens); every interaction has a state-only fallback; daemon reconciles on start. Carried into M1-S18 tasks and AC and the daemon contracts row.", date: "2026-11-03" }
  - { text: "Third owner-gate refinement: the wire-level control protocol v1 pinned (NDJSON frames over the unix socket, version negotiation, poke/query/subscribe/control classes, no business truth on the wire, filesystem authorization, secrets never transit, overflow degrades the subscriber not the dispatcher). Recorded in the architecture pack, daemon contracts, and M1-S18 tasks.", date: "2026-11-04" }
  - { text: "Fourth owner-gate refinement: transport layering and concurrency model pinned. Codec, session, and transport are separate layers; transport is config-selected behind an interface with stdio as the conformance transport (independence proof); remote/container transports reuse the protocol plus one additive intent frame class and a handshake identity claim, off by default until M4-S6. Concurrency: connection per invocation with connection-scoped response routing (ids correlate within a connection), multi-connection single event loop, state-layer serialization under fence tokens with idempotency keys, one daemon per state-dir scope for multi-agent and multi-project isolation, bounded waits that degrade. Recorded in architecture, contracts, and M1-S18 tasks/AC.", date: "2026-11-04" }
  - { text: "Fifth owner-gate refinement: persistence and recovery pinned. Daemon stateful through the state layer only; daemon install registers a user-level auto-start unit (linger) scoped to the state dir; startup reconciliation rebuilds the world and classifies in-flight lanes alive, interrupted, or crashed from artifact evidence, resumes interrupted deliveries from the ledger without redoing completed phases; restart budgets durable across daemon restarts; exhaustion marks the queue entry failed (terminal, classified) and raises a typed question to the coordinator, never a silent requeue. Recorded in architecture, contracts, interactions Session D, M1-S18 tasks/AC, and M1-S15 AC.", date: "2026-11-04" }
  - { text: "Sixth owner-gate addition: m1/test-scenarios.md as the API prototype (20 Given/When/Then scenarios with exact invocations, observable outputs, machine assertions, shared refusal-semantics pin, coverage map); journeys J1-J7 gained compact command sequences; contracts cross-link the scenarios. Status rule: scenarios are the seed each owning story test plan inherits and reconciles; divergence after delivery is a defect.", date: "2026-11-05" }
  - { text: "Seventh owner-gate addition: 26 per-command reference pages under m1/commands/ (one per command family; queue ready folded into queue) with invocation examples and JSON envelope outputs in both pretty and minified forms. Output formatting pinned: --pretty[=auto|always|never], default auto (TTY -> indented, piped/scripted -> one minified line, matching the NDJSON discipline); watch streams stay line-delimited always. Registered all pages in the literal corpus.", date: "2026-11-05" }
  - { text: "Eighth owner-gate round (tmp feedback file m1-feedback1): three owner decisions confirmed interactively. (1) Agent-mode trim: scripted --json emits one minified {data}|{error} line; schemaVersion, runId, timing recorded in the new audit ledger, not agent context; --verbose restores the full envelope; TTY keeps full pretty (amends the M0-S3 envelope contract's rendering, not its schema). (2) Commit-on-phase-transition default on with --no-commit and config disable. (3) Two new stories: M1-S21 model profiles and provider watching (reverse-engineered from the private user-config resolver: tier structure, per-agent overrides, consequence x reasoning / volume heuristics, hard capability gates, eligibility chain with lazy memoized probes, first-iteration providers = coding-plan subscription quota endpoints + DeepSeek balance + OpenAI subscription windows, switch-not-park with revert-on-recovery, weekly pacing rungs as config moving only non-judgment seats, data-only env records for the spawn wrapper) and M1-S22 command audit ledger with agent identity (agent-name env convention from the owner's opencode plugin PoC, commit f82ed4ec). M1 = 22 stories; ranking re-sequenced (S22 rank 23, S21 rank 34); provider family gains profile resolve and watch status; scenarios SC-M1-21..23 added.", date: "2026-11-05" }
  - { text: "Ninth round: CritiqueGrid six-seat assessment (verdict BLOCK) triaged by the CEO against the branch; all four CRITICAL anchors verified and accepted, W1-W18 and N1-N7 accepted with three adaptations, none rejected. Principals pass: audience field + cross-audience answer refusal + waiver authorizers verified against gate-class policy (CG-AUTH-001); explicit same-user trust model + reserved caller-principal seam (CG-SEC-001). External-effect protocol (receipt, unknown-first-class, check-before-reapply) lands in M1-S18 with honestly scoped convergence ACs; spec 7.3 deferral reconciled (CG-SRE-001). New M1-S23 coordinator supervision replaces ceo-loop.sh's actual function; ceo-loop strangler row corrected; S16 gains the pickup/wake contract (CG-PRD-002/CG-DEC-002). Exit-evidence table, timing-defaults table, one-shot lease mutual exclusion, tamper-evidence wording, env allowlist, S9 restructure with clean defined, registry sync, and coverage rule landed across backlog (23 stories), ranking (contiguous 1..67), roadmap, registry, pack, and command pages. Scenarios SC-M1-17b and SC-M1-24..30 added.", date: "2026-11-05" }
