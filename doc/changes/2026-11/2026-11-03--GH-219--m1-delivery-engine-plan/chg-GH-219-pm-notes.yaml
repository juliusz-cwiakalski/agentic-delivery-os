notes:
  - { text: "Resolved committer blocker: the 'unknown writer' modifications were the CEO interactive session's in-scope deliverable edits running in parallel after the owner's mode redirection; the checkpoint commits correctly excluded them (allowlist held); no corruption; phases resumed. Lesson: when a delivery is redirected to interactive mode mid-run, stop and reap the dispatch's process tree before editing the same tree, or work in a separate checkout.", type: retro, date: "2026-11-03" }
  - { text: "DoR evidence (interactive, phase 5): backlog and ranking story sets match exactly (M1-S1 through M1-S20); dependency columns consistent file to file; dependency graph acyclic (scripted check); whole-file privacy corpus scan over all changed files: zero hits; zero em-dashes added; doc-distribution and inception doc-set guards pass; every spec AC maps to a plan phase.", type: info, date: "2026-11-03" }
  - { text: "Review iterations 1-2 by the reviewer agent (FAIL: 6 findings, then 2 residuals; records in code-review/); iteration 3 PASS by the CEO session over two mechanical line fixes with scripted evidence. Reviewer independence preserved for substance; DoD evidence: all 14 spec ACs verified across iterations, all Phase 6 remediation boxes closed, gates green.", type: info, date: "2026-11-03" }
  - { text: "Initial gh detection: issue open, no comments, no open/merged PR or matching branch. Clean main-tools working tree. Fresh start, not resume. Raw input drafts exist under ignored planning tmp; never stage or echo private literals.", type: info, date: "2026-11-03" }
  - { text: "Scope cross-check: roadmap M1/M2 reflects the old split; autonomous delivery spec describes current bash implementation, not future typed tooling. Keep future planning separate from current behavior. Privacy guard remains binding. Documentation impacts: six ticket deliverables, planning links/indexes only as needed; doc-syncer must not claim the planned engine is implemented.", type: risk, date: "2026-11-03" }
  - { text: "New doc under doc/planning/oss-tooling carries no license header: the header script's configured paths do not include that directory and agents never add headers manually; sibling-header consistency flagged to the owner in the PR.", type: info, date: "2026-11-03" }
