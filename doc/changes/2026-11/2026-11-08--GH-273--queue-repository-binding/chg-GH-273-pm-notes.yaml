decisions:
  - text: "D1 — The recorded key is the normalized host/owner/name contention key,
      not the bare owner/name target; PM ratifies spec DEC-3. This is in-scope,
      not a scope expansion: GH-273's Expected section already requires 'both
      the normalized repository key and its recorded root'. Fixing only the root
      would satisfy the invariant but leave dispatch source and
      deploy-expectation comparison mismatched."
    date: "2026-11-08"
  - text: "D2 — No state migration for synthetic host-less keys (spec DEC-8): no
      shipped composition could ever record an entry, so no production state
      exists to repair. The pilot fixture's binding is corrected to a pair; its
      synthetic key domain stays."
    date: "2026-11-08"
  - text: "D3 — PM authorizes a fourth DoR gate iteration (beyond the 3-iteration
      guideline) because iteration 3's findings are mechanical and fully
      specified (one plan red/green contradiction plus four wording/sequencing
      fixes), findings are shrinking, and escalation would block delivery on a
      one-line inconsistency with no open design question. All findings are
      applied before re-gating; no scope or architecture change is introduced by
      the fixes."
    date: "2026-11-08"
  - text: "D4 — Release version impact is minor, not patch. TC-RELEASE-001 (pinned)
      requires every added changeset to declare exactly the five fixed-group
      packages at minor; a patch entry fails the release gate. Spec
      version_impact corrected patch -> minor (spec v1.5), the changeset renamed
      to .changeset/gh-273-queue-repository-binding-minor.md, and plan phase 5
      wording aligned. No AC or behaviour change."
    date: "2026-11-08"
