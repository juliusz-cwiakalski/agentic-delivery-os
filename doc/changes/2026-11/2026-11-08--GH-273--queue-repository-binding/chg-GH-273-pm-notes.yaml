decisions:
  - text: "D1 — The recorded key is the normalized host/owner/name contention key,
      not the bare owner/name target; PM ratifies spec DEC-3. This is in-scope,
      not a scope expansion: GH-273's Expected section already requires 'both
      the normalized repository key and its recorded root'. Fixing only the root
      would satisfy the invariant but leave dispatch source and
      deploy-expectation comparison mismatched."
    date: "2026-11-08"
  - text: "D2 — No state migration for synthetic host-less keys (spec DEC-8): no
      shipped composition could ever record an entry, so no production state
      exists to repair. The pilot fixture's binding is corrected to a pair; its
      synthetic key domain stays."
    date: "2026-11-08"
open_questions: []
blockers: []
notes:
  - text: "Spec authored. Verified in source: readRepositoryFacts(root) already
      available; production injects only originUrl so the composition seam must
      keep resolving root from cwd (spec DEC-5) or tests would go false-green.
      Second defect found: key form is host-less in production while all
      consumers/fixtures use host/owner/name."
    type: info
    date: "2026-11-08"
