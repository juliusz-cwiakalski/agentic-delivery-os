decisions:
  - text: "D1 — The recorded key is the normalized host/owner/name contention key,
      not the bare owner/name target; PM ratifies spec DEC-3. This is in-scope,
      not a scope expansion: GH-273's Expected section already requires 'both
      the normalized repository key and its recorded root'. Fixing only the root
      would satisfy the invariant but leave dispatch source and
      deploy-expectation comparison mismatched."
    date: "2026-11-08"
  - text: "D2 — No state migration for synthetic host-less keys (spec DEC-8): no
      shipped composition could ever record an entry, so no production state
      exists to repair. The pilot fixture's binding is corrected to a pair; its
      synthetic key domain stays."
    date: "2026-11-08"
  - text: "D3 — PM authorizes a fourth DoR gate iteration (beyond the 3-iteration
      guideline) because iteration 3's findings are mechanical and fully
      specified (one plan red/green contradiction plus four wording/sequencing
      fixes), findings are shrinking, and escalation would block delivery on a
      one-line inconsistency with no open design question. All findings are
      applied before re-gating; no scope or architecture change is introduced by
      the fixes."
    date: "2026-11-08"
open_questions: []
blockers: []
notes:
  - text: "Spec authored. Verified in source: readRepositoryFacts(root) already
      available; production injects only originUrl so the composition seam must
      keep resolving root from cwd (spec DEC-5) or tests would go false-green.
      Second defect found: key form is host-less in production while all
      consumers/fixtures use host/owner/name."
    type: info
    date: "2026-11-08"
  - text: "Retro: spec v1.0 asserted AC-F6-1 that the key-unresolved guard fails on
      revert, which is impossible (pre-fix already emits no binding), and
      asserted a permanent-suite diff check. Test planning caught it before DoR;
      specification reopened (iteration 1) and revised to name per-AC evidence
      classes (suite / mutation-verified / review-verified). Cost: one reopen
      cycle. Lesson: assign an evidence class when authoring an AC whose pre-fix
      behaviour already satisfies one branch."
    type: retro
    date: "2026-11-08"
  - text: "Specification re-completed at iteration 1 (commit e5e51e43); test plan
      realigned and completed (commit f6db33ea). Plan declares 5 phases:
      producer fix, composition regression suite, invariant + structural
      anti-recurrence, fixture honesty, docs + changeset + aggregate gate."
    type: info
    date: "2026-11-08"
  - text: "DoR iteration 1 = NOT_READY (readiness-review/readiness-iter-1.md).
      Blocking B1: spec names the dispatch remote normalizer as the key
      authority, but normalizeRepositoryRemote preserves case while AC-F3-1
      requires the lowercase normalizeRepositoryKey form — a coder following
      §8.4 fails the AC. Blocking B2: the 'key unresolved' matrix cell uses a
      gitlab remote that does normalize, so the cell is mislabelled unless the
      target gate is declared. Reopened specification (owner), plus
      test_planning and delivery_planning for consequential edits; no delivery
      phase entered."
    type: blocker
    date: "2026-11-08"
  - text: "Retro: both blocking findings are normalizer/gate naming defects that a
      source probe at spec time would have caught (normalizeRepositoryRemote vs
      normalizeRepositoryKey), and the matrix cell was written from intuition
      rather than from an executed normalizer/parse probe. Lesson: when a spec
      names a normalization authority, probe it; when a test matrix encodes
      'unresolved', execute the negative input through the real predicate before
      labelling the cell."
    type: retro
    date: "2026-11-08"
  - text: "DoR iteration 2 = NOT_READY (readiness-iter-2.md). Iteration-1
      remediation verified genuinely fixed (B1/B2 closed with executed evidence;
      A1-A11 closed). New blockers: B3 plan phase 1 implements only a
      two-condition guard while spec F-1 declares three (missing the
      parseGitHubRemote target gate), so a coder could emit a binding for a
      non-GitHub remote; B4 NFR-4's fixture-shape revert is unexecutable and
      misattributed — reverting production.ts cannot fail a suite that only
      parses tests/fixtures/**. Advisories: A12 (TC-BIND-015 AST rule rejects
      the nullish-coalescing fallback form), A13 (spec prose calls a local path
      key-unresolved though three-segment paths normalize), A14 (mutation reds
      via the domain refusal message, not a root-only emission signal), A15
      (spec pages named by role only). Reopened specification, test_planning,
      delivery_planning for iteration 3."
    type: blocker
    date: "2026-11-08"
  - text: "Retro: B3 is a propagation miss — the B2 fix landed in the spec but not
      in the plan phase that implements it, because spec and plan were edited in
      separate delegations without a cross-artifact consistency pass. B4 is an
      evidence-model error: a revert obligation was attached to a layer whose
      inputs the revert does not touch. Lesson: after any gate-driven edit,
      re-read the implementing phase summary against the changed AC text in the
      same iteration; when an AC names a revert/mutation evidence class, name
      the exact artifact that must be reverted."
    type: retro
    date: "2026-11-08"
  - text: "DoR iteration 3 = NOT_READY (readiness-iter-3.md). B3/B4/A12-A15 verified
      fixed with executed probes. New blocker B5: the plan says the matrix
      'present' cell stays green under the P1 producer revert while the test
      plan and code say it is refused (a key-only binding is emitted exactly
      when the target resolves). Advisories: A16 (nullish-coalescing operand
      wording names the wrong side), A17 (the P3 mutated root-only branch must
      be evaluated before the target gate to be observable), A18 (plan cites
      test plan v3), A19 (spec ordering prose). Reopened specification,
      test_planning, delivery_planning."
    type: blocker
    date: "2026-11-08"
  - text: "Retro: B5 is the third instance of one class — an evidence-set claim in
      the plan contradicting the test plan. Root cause: the plan paraphrases the
      test plan's evidence sets instead of citing its procedures. Lesson: plan
      evidence obligations should cite the test-plan procedure ids (P1..P4) and
      let red/green sets live once, in the test plan."
    type: retro
    date: "2026-11-08"
