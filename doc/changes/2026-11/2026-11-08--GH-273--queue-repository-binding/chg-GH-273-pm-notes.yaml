    type: blocker
    date: "2026-11-08"
  - text: "Retro: B3 is a propagation miss — the B2 fix landed in the spec but not
      in the plan phase that implements it, because spec and plan were edited in
      separate delegations without a cross-artifact consistency pass. B4 is an
      evidence-model error: a revert obligation was attached to a layer whose
      inputs the revert does not touch. Lesson: after any gate-driven edit,
      re-read the implementing phase summary against the changed AC text in the
      same iteration; when an AC names a revert/mutation evidence class, name
      the exact artifact that must be reverted."
