  - text: "DoR iteration 1 = NOT_READY (readiness-review/readiness-iter-1.md).
      Blocking B1: spec names the dispatch remote normalizer as the key
      authority, but normalizeRepositoryRemote preserves case while AC-F3-1
      requires the lowercase normalizeRepositoryKey form — a coder following
      §8.4 fails the AC. Blocking B2: the 'key unresolved' matrix cell uses a
      gitlab remote that does normalize, so the cell is mislabelled unless the
      target gate is declared. Reopened specification (owner), plus
      test_planning and delivery_planning for consequential edits; no delivery
      phase entered."
    type: blocker
    date: "2026-11-08"
  - text: "Retro: both blocking findings are normalizer/gate naming defects that a
      source probe at spec time would have caught (normalizeRepositoryRemote vs
      normalizeRepositoryKey), and the matrix cell was written from intuition
      rather than from an executed normalizer/parse probe. Lesson: when a spec
      names a normalization authority, probe it; when a test matrix encodes
      'unresolved', execute the negative input through the real predicate before
      labelling the cell."
    type: retro
    date: "2026-11-08"
  - text: "DoR iteration 2 = NOT_READY (readiness-iter-2.md). Iteration-1
