      two-condition guard while spec F-1 declares three (missing the
      parseGitHubRemote target gate), so a coder could emit a binding for a
      non-GitHub remote; B4 NFR-4's fixture-shape revert is unexecutable and
      misattributed — reverting production.ts cannot fail a suite that only
      parses tests/fixtures/**. Advisories: A12 (TC-BIND-015 AST rule rejects
