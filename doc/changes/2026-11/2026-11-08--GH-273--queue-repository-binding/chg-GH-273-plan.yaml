    summary: "Correct the second one-sided producer and pin the whole fixture class. `tests/fixtures/pilot/harness.ts` composes the queue repository binding as the pair its ledger seeds already use — repository PILOT_REPOSITORY with repositoryRoot `/pilot/${PILOT_REPOSITORY}` (DEC-7) — so the pilot models a shape production can still produce; the pilot's synthetic host-less key domain is not normalized here (deferred by DEC-7) and no golden is regenerated, because the pilot never calls queue add (RSK-7). `tests/structure/queue-binding-fixture-shape.test.ts` then asserts AC-F6-3 over every tests/fixtures/**/*.ts file: each repositoryBinding is an object literal with both keys, or an identifier reference to a same-file declaration that is such a literal, or an override-defaulted form `override ?? pairLiteral` whose default side is such a literal and whose override, when supplied, is itself a complete pair or empty — the last form is the pre-existing, deliberately unchanged `tests/fixtures/queue/cli/harness.ts` default pair, which the rule must not reject (readiness A12); the pilot binding key is the same identifier (PILOT_REPOSITORY) the seeds use; and the queue CLI harness default pair stays a pair. Failure messages name the offending file. The runtime seeded-entry half of TC-BIND-015 lives in `tests/conformance/pilot/pilot-records.test.ts`, the existing conformance suite that already builds the pilot fixture: it asserts every seeded entry carries both `repository` and `repositoryRoot` with the seed key, adds assertions only, and introduces no second fixture build and no new git spawn. The structural AST half is the revert-detecting half of AC-F6-3 and TC-BIND-015 — the pre-fix pilot binding is one field, so it fails against the pre-fix fixture — while the runtime half proves the corrected fixture actually seeds the pair. Its evidence is the in-place revert of the pilot fixture binding to `{ repository: PILOT_REPOSITORY }` (TC-BIND-018 fixture revert, P2): the shape suite then reds naming `tests/fixtures/pilot/harness.ts`, and is restored. A producer revert leaves this suite green because it parses `tests/fixtures/**` only, so the producer revert is not AC-F6-3 evidence and must not be recorded as it (spec F-6, §9 NFR-4, AC-F6-3)."
