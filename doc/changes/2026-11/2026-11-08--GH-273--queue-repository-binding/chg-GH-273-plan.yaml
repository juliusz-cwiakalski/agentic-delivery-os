    weightClass: standard
    summary: "Close the coverage gap that let a one-sided producer survive a green suite, without changing the domain. `tests/behaviour/queue-binding-invariant.test.ts` adds the first explicit negative coverage for the unchanged rule: AC-F5-1 a key-only and a root-only add request are both refused with input.value.rejected and the exact 'repository key and recorded root must be present together' summary, with zero ledger appends and a both-fields control that succeeds (TC-BIND-011); AC-F5-2 a stored record carrying exactly one field fails the read closed as reason torn / state.store.torn, the raw record stays readable, no entry is fabricated, and the same shape projects to queue list --json exit 2 with no data (TC-BIND-012). `tests/structure/queue-binding-derivation.test.ts` adds the AST anti-recurrence assertions: AC-F1-4 exactly one queue repository-binding construction site in packages/cli/src, no repositoryBinding initializer that is an object literal holding only one of the two keys, and the queue composition constructed once; and TC-BIND-016 exactly one readRepositoryFacts call with the pre-existing single findGitRoot call unchanged (the config-resolution call at the composition's config seam is not a second resolution and must not be counted as one), plus the AC-F4-1 source-allowlist half (TC-BIND-008) that pins repositoryRoot references to packages/cli/src/edge.ts, packages/cli/src/production.ts, packages/core/src/app/queue.ts, and packages/core/src/contracts/queue.ts so a new disclosure site fails by name. AC-F5-3 stays review-verified: re-run the pinned queue error-set, error-table sync, and queue golden suites unchanged and inspect the diff for an untouched error table and untouched invariants (TC-BIND-013). Phase exit evidence obligation for AC-F6-2: the write-side and read-side predicate mutations (one at a time, each restored) must turn TC-BIND-011 and TC-BIND-012 red respectively (TC-BIND-018 steps 14-15, P4), and the second-readRepositoryFacts mutation must turn TC-BIND-016 red. Phase exit evidence obligation for the AC-F6-1 key-unresolved symmetry guard (TC-BIND-018 steps 10-13, P3): with the fix in place, bypass only the `normalizeRepositoryKey` guard — forward the resolved root when the key is undefined — while leaving the GitHub target gate intact, with the test-only mutated branch evaluated **before** the target gate because key-unresolved with a root resolved is otherwise unreachable (every key-unresolved fixture also fails the GitHub target parse, so key undefined implies target unresolved under the production ordering); only the mutation's branch order moves, the gate condition is unchanged, and the mutation is then restored so production keeps its target-gate-first ordering. The derivation therefore emits a root-only binding; the queue edge forwards it field-wise and the queue domain refuses it with `input.value.rejected` and the key-and-root-together summary, so exactly the `key-unresolved` cell reds at the add-outcome assertion (it expected a successful unbound add with neither field) while `present`, `target-unresolved`, and `root-unresolved` stay green; after the restore the suite is re-run green."
    tests:
      - "bun test tests/behaviour/queue-binding-invariant.test.ts"
      - "bun test tests/structure/queue-binding-derivation.test.ts"
      - "bun test tests/structure/queue-scheduling-contract.test.ts tests/structure/error-table.test.ts tests/checks/error-table-sync.test.ts"
      - "bun test tests/golden"
      - "bun run scripts/checks/error-table-sync.ts"
      - "pnpm exec biome check tests/behaviour/queue-binding-invariant.test.ts tests/structure/queue-binding-derivation.test.ts"
  - id: 4
    title: "Fixture honesty: pilot composition binding becomes a pair and every fixture binding is shape-asserted"
    kind: delivery
    scope:
      files:
