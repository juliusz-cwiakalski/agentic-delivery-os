# GH-273 delivery plan — fix the production queue repository binding so the key
# and the declaring checkout's root always travel together.
#
# Sources (single source of truth):
#   - Spec:      ./chg-GH-273-spec.md (v1.4; F-1..F-6 with the three-condition
#                presence gate in F-1, AC-F1-1..AC-F6-4, DM-1..DM-3,
#                NFR-1..NFR-8 with the per-layer evidence rule in NFR-4,
#                DEC-1..DEC-8; RSK-1..RSK-8; §17 evidence classes; §18 order;
#                Appendix A cause-labelled matrix and key-unresolved evidence)
#   - Test plan: ./chg-GH-273-test-plan.md (v5; TC-BIND-001..TC-BIND-018;
#                §3 coverage, §4 layers, §5 scenarios, §6 environments,
#                §7 automation mapping, §8.3 resolved OQ-A..OQ-G)
#   - Ticket:    GH-273.
#
# `tests` is delivery evidence for plan review; it is not a `delivery.plan.v1`
# schema field. The schema-validated keys are schemaVersion, workItemRef, tier,
# defaultLeases, defaultWeightClass, and phases (id, title, kind, summary, scope,
# interactions, doneArtifacts, leases, weightClass, leaseClass). Phase progress
# never lives here; it belongs in pm-notes `notes:` entries.
#
# Ceremony: one ticket, one PR targeting main-tools, five delivery phases. Phase 1
# restores the producer; phases 2-4 add the regression coverage layer by layer;
# phase 5 declares the lifecycle-phase-7 spec-reconciliation obligation, records
# the evidence, and closes the release. Each phase is independently green on its
# own slice: no phase needs a later phase to compile or to assert. The suite is
# green after every phase — phase 1 changes behaviour that no existing test
# exercises through the production composition (the queue CLI fixture already
# supplies a pair), and each coverage phase adds only the suite it names.
# AC-F4-1 is the one AC discharged in two additive halves across phases (its
# behaviour half in phase 2, its source-allowlist half in phase 3) and is named
# as such below; every other AC has a single owning phase.
#
# AC ownership (every AC has exactly one owning phase; cross-phase confirmation
# is additive and never transfers ownership):
#   phase 1  restores behaviour for AC-F1-1, AC-F1-3, AC-F2-1, AC-F2-2,
#            AC-F2-3, AC-F3-1 and creates the single derivation site AC-F1-4
#            asserts; it adds no assertion.
#   phase 2  AC-F1-1, AC-F1-2, AC-F1-3, AC-F2-1, AC-F2-2, AC-F2-3, AC-F3-1,
#            AC-F3-2, AC-F4-2, AC-F6-1, AC-F6-4 plus the behaviour half of
#            AC-F4-1 (TC-BIND-001..TC-BIND-007, TC-BIND-009, TC-BIND-010,
#            TC-BIND-017, TC-BIND-008 behaviour half).
#   phase 3  AC-F1-4, AC-F5-1, AC-F5-2, AC-F5-3, AC-F6-2 (TC-BIND-011..014,
#            TC-BIND-016) plus the source-allowlist half of AC-F4-1
#            (TC-BIND-008 source half).
#   phase 4  AC-F6-3 (TC-BIND-015 AST half plus its runtime seeded-entry half);
#            the AST half's evidence is the fixture revert, not the producer
#            revert (see P2 below).
#   phase 5  release obligations and the all-AC confirmation; TC-BIND-018's
#            revert/mutation evidence is recorded here (procedure executed in
#            review).
# All 18 ACs are mapped; no AC is unmapped and no AC id is invented.
#
# TC ownership: TC-BIND-001..010 and 017 (phase 2, with TC-BIND-008's behaviour
# half), TC-BIND-011..014 and 016 plus the TC-BIND-008 source-allowlist half
# (phase 3), TC-BIND-015 (phase 4: AST half in
# tests/structure/queue-binding-fixture-shape.test.ts, runtime seeded-entry half
# in tests/conformance/pilot/pilot-records.test.ts), TC-BIND-018 (phase 5
# evidence recording). TC-BIND-013's automated half is the existing pinned
# error-set and golden suites, re-run unchanged in phase 3.
#
# Conformance / registration check performed at planning time (no new
# registration is required by this change, and each finding is why):
#   - `tests/structure/inventory.json` and `tests/structure/content-inventory.test.ts`
#     enumerate `packages/**` only; this change creates files under `tests/**`
#     and touches one existing `packages/cli` file, so no inventory row or
#     executable allowance is added.
#   - `tests/checks/fixture-privacy.test.ts` scans a fixed fixture allowed-list
#     that does not include `tests/fixtures/queue/**` or `tests/fixtures/pilot`;
#     no fixture contains a secret shape, so no registration and no new scan row.
#   - `tests/boundaries/fixture-coverage.test.ts` covers `.dependency-cruiser.cjs`
#     forbidden rules over `packages/**`; tests are not cruised, so a new fixture
#     directory needs no case.
#   - `scripts/checks/*` scans (`ambient-globals`, `workspace-entrypoints`,
#     `secret-read-boundary`, `exports-parity`, `prompt-conformance`,
#     `help-guide-coverage`, `forbidden-literals`) are scoped to packages,
#     `.opencode/**`, and registered docs; no new test or fixture path needs an
#     entry. `biome` lint/format applies to the new files and runs in every
#     phase gate.
#   - `tests/types/tsconfig.json` compiles `*.type-test.ts` only, so the new
#     suites need no type-probe entry; `pnpm typecheck` still runs in the
#     phase-1 gate because the producer changes.
#
# Evidence obligations carried, not silently dropped — four distinct evidence
# paths, each keyed to the artifact its own layer actually exercises and never
# substituted for another (spec v1.4 §9 NFR-4, §17 AC-F6-1/AC-F6-2/AC-F6-3,
# §5.1 F-6, Appendix A):
#   - P1 — producer revert (phase 2; TC-BIND-018, TC-BIND-015 untouched): revert
#     only the derivation in `packages/cli/src/production.ts`, leaving every new
#     test and fixture in place. Pre-fix, the single construction site emits a
#     key-only binding exactly when the GitHub target resolves, so the `present`
#     cell is refused by the domain just like the composition add path. RED: the
#     composition add path — TC-BIND-001 and its repro chain TC-BIND-010, with
#     the other composition-add scenarios TC-BIND-003..009 and TC-BIND-017 red
#     for the same refusal — the `present` and `root-unresolved` cells of
#     TC-BIND-002, and TC-BIND-014's partial-literal assertion. GREEN: the
#     `target-unresolved` and `key-unresolved` cells, the whole TC-BIND-015
#     fixture-shape suite, and the domain negatives (TC-BIND-011/012/013/016).
#     `present` is never a P1 green cell; it is green only under P3. Restore,
#     then re-run green.
#   - P2 — fixture revert (phase 4; TC-BIND-018/TC-BIND-015): revert only the
#     pilot fixture binding in `tests/fixtures/pilot/harness.ts` to its pre-fix
#     one-field form `{ repository: PILOT_REPOSITORY }`. RED:
#     `tests/structure/queue-binding-fixture-shape.test.ts`, with the failure
#     naming that file. GREEN: everything else. This suite parses
#     `tests/fixtures/**` only, so a producer revert leaves it green: AC-F6-3's
#     evidence is this fixture revert, and the P1 producer revert must not be
#     recorded as its evidence.
#   - P3 — key-unresolved asymmetry mutation (phase 3; TC-BIND-018 steps 10-13):
#     with the fix in place, bypass only the `normalizeRepositoryKey` guard —
#     emit `{ repositoryRoot }` when the key is undefined — while leaving the
#     GitHub target gate intact. The test-only mutated branch is evaluated
#     **before** the target gate, because key-unresolved with a resolved root is
#     otherwise unreachable: every key-unresolved fixture (`not-a-url`, `./repo`,
#     absent origin) also fails the GitHub target parse, so key undefined
#     implies target unresolved under the production ordering. Only the
#     mutation's branch order moves; the gate condition itself is unchanged and
#     production keeps its target-gate-first ordering after the mutation is
#     restored. The mutated derivation emits a root-only
#     binding, the queue edge forwards it field-wise, and the queue domain
#     refuses it with `input.value.rejected` and the summary naming the
#     key-and-root-together invariant; the `key-unresolved` cell reds at the
#     add-outcome assertion because it expected a successful unbound add with
#     neither field. Exactly that cell reds; `present`, `target-unresolved`, and
#     `root-unresolved` stay green; restore, then re-run green.
#   - P4 — domain predicate mutations (phase 3; TC-BIND-018 steps 14-15): the
#     write-side mutual-presence branch (`desiredEntry`) reds TC-BIND-011; the
#     read-side predicate (`isEntryRecord`) reds TC-BIND-012; each applied and
#     restored alone. These negatives cannot fail on a producer revert.
#   - TC-BIND-016's structural assertion is mutation-verified separately by
#     inserting a second `readRepositoryFacts` call.
#   - Every revert or mutation, its red set, and the post-restore green run are
#     recorded in pm-notes `notes:` at the delivery boundary and in test-plan
#     §10.
#
# Rollback: reverting the phase-1 derivation restores the previous (broken)
# behaviour. The domain, schema, envelopes, exits, error table, and recorded
# state are unchanged, so no state or data rollback and no feature flag apply.
schemaVersion: delivery.plan.v1
workItemRef: GH-273
tier:
  name: full
  phases: [1, 2, 3, 4, 5]
  escalationTriggers:
    - domain-invariant-or-read-predicate-changed
    - recorded-root-disclosed-in-output
    - second-binding-derivation-or-second-facts-resolution
    - queue-grammar-envelope-exit-or-error-identity-changed
    - composition-test-supplies-a-synthetic-root
    - new-export-from-production-composition-module
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
  - id: 1
    title: "Producer fix: one total queue repository-binding derivation in the production composition"
    kind: delivery
    scope:
      files:
        - packages/cli/src/production.ts
    interactions:
      - kind: contract-file
        target: packages/cli/src/production.ts
        role: producer
    doneArtifacts:
      trackerTransition: "GH-273 in progress; phase 1 evidence recorded in pm-notes notes"
    weightClass: standard
    summary: "Replace the one-sided queue binding with a single total derivation at the composition's one construction site: resolve repository facts once for the invocation with an injected originUrl replacing only the remote (DEC-5) while the checkout root is always resolved from cwd (DEC-2, so composition tests execute the real root path and cannot go false-green), take root from the resolved facts root rather than the raw working directory, and normalize the key from the same origin resolution with `normalizeRepositoryKey` — the single authority for the recorded `repository` value, which lowercases protocol, userinfo, `.git`, host, owner, and name into `host/owner/name` (no new parsing rule). `normalizeRepositoryRemote` is the dispatch-identity normalizer, lowercases only the host, and preserves owner/name case (`github.com/Owner/Repo`); it is not used for the record (spec F-3, DEC-3, Appendix B). The derivation is one total outcome, never a two-conjunct shortcut: the binding is present if and only if all three conditions hold — (a) the composition's existing GitHub target resolution from the origin succeeds (`parseGitHubRemote` via `repositoryTargetOf`, the resolution the production composition already performs and that must neither be removed nor duplicated); (b) `normalizeRepositoryKey(origin)` is defined; and (c) the resolved checkout root is defined. If any condition fails the binding is absent entirely, with no `repositoryBinding` key at all; no third state and no partial pair exist (DEC-4, spec F-1, Appendix A). The target gate is substantive, not a formality: a parseable non-GitHub remote such as `https://gitlab.com/owner/repo.git` normalizes to `gitlab.com/owner/repo` yet must produce no binding, because the GitHub target gate refuses it — that is the NG-5 boundary and the `target-unresolved` matrix cell, and its absence must not be attributed to key normalization. The key guard is redundant behind the target gate for parseable remotes, so `key-unresolved` (`not-a-url`, `./repo`) exists to specify the derivation's total outcome and to be exercised by the targeted asymmetry mutation; a multi-segment local path such as `../local/repo` normalizes and is excluded by the target gate, so it belongs to `target-unresolved`, not to `key-unresolved`. No new export is added to `packages/cli/src/production.ts`: `tests/structure/content-inventory.test.ts` pins the module's export list to `[\"createProductionComposer\"]`, so the derivation stays module-private. The queue edge, the queue application layer's write-side and read-side invariant predicates, readiness, dispatch identity, the error table, the envelopes, the exits, and the CLI grammar stay untouched (DEC-1, NG-1..NG-6); no error code, field, flag, configuration key, or schema version is added, and repositoryRoot is neither projected nor logged (NFR-2). This phase restores producer conformance for AC-F1-1, AC-F1-3, AC-F2-1, AC-F2-2, AC-F2-3, AC-F3-1 and creates the single derivation site AC-F1-4 asserts; it deliberately adds no test file, and the suite stays green because no existing test exercises queue add through the production composition. NFR-5/NFR-8 hold: the fix reuses the facts already read and adds no spawn, no network call, and no second resolution."
    tests:
      - "pnpm typecheck"
      - "pnpm check:boundaries"
      - "bun test tests/behaviour/production-composition.test.ts tests/behaviour/entrypoint-composition.test.ts"
      - "bun test tests/behaviour/queue-*.test.ts tests/structure/dispatch-composition.test.ts"
      - "bun test tests/structure/content-inventory.test.ts tests/structure/subpaths.test.ts"
      - "pnpm exec biome check packages/cli/src/production.ts"
  - id: 2
    title: "Production-composition regression suite: real derivation, four-cell matrix, root sourcing, key form, and the repro chain"
    kind: delivery
    scope:
      files:
        - tests/fixtures/queue/production/harness.ts
        - tests/behaviour/queue-production-binding.test.ts
    interactions:
      - kind: contract-file
        target: tests/fixtures/queue/production/harness.ts
        role: producer
    doneArtifacts:
      trackerTransition: "GH-273 in progress; phase 2 evidence recorded in pm-notes notes, including the TC-BIND-018 producer-revert red set for the composition add path and the `present` and `root-unresolved` matrix cells"
    weightClass: heavy
    summary: "Add the harness and behaviour suite that compose the real production program over a real temporary checkout whose .git metadata is fabricated on disk, injecting only the origin remote — the harness exposes no way to pass a repositoryRoot, so every assertion reads the pair the production derivation actually wrote (spec DEC-5, test plan TR-1/TR-2). Covers: AC-F1-1 atomic pair recorded with added/noop on replay (TC-BIND-001); AC-F1-2/AC-F1-3 and NFR-1 totality across the four cause-labelled matrix cells — `present`, `target-unresolved` (a parseable non-GitHub remote, so the GitHub target gate does not resolve), `key-unresolved` (origin fixtures `not-a-url` and `./repo`, where `normalizeRepositoryKey(origin)` is undefined; a multi-segment local path such as `../local/repo` normalizes and is therefore target-unresolved, not key-unresolved, and must not be used for this cell), and `root-unresolved` (target and key resolve while the root does not) — each assertion labelled with its cause; every absence cell is a first add into a fresh ledger, so no earlier bound entry can lend its inherited pair, and the unbound entry projects as state `not-ready` with readiness evidence reason `addressing-unresolved` and blocking detail `repository-binding-unresolved`, with a one-sided count of zero across the matrix (TC-BIND-002); AC-F2-1 nested working directory records the checkout root, not the nested path (TC-BIND-003); AC-F2-2 linked-worktree root plus top-level/nested equality (TC-BIND-004); AC-F2-3 absolute root with zero spawns, zero transport calls, and zero git child calls (TC-BIND-005); AC-F3-1 the normalized lowercase host/owner/name with `normalizeRepositoryKey` as its single authority and the wrong-normalizer discrimination asserted (`normalizeRepositoryRemote` preserves owner/name case), for HTTPS with and without .git, ssh URL, scp-style, and mixed case, each mutually consistent with the normalized remote of the recorded root (TC-BIND-006); AC-F3-2 dispatch identity resolving from the recorded scheduler key with source scheduler, asserted directly at the resolver level against a disagreeing remote (TC-BIND-007); AC-F4-1 behaviour half — the entry observed on queue list with the normalized key and the exact root string absent from list/plan/lanes/claim/release/status/brief JSON and text output and from the derived graph document, with no exit-code assertion on the credential-degraded status/brief surfaces (TC-BIND-008 behaviour half, whose source-allowlist half is phase 3); AC-F4-2 plan observes the ref and dispatch appends an attempt instead of refusing with queue.entry.unobserved (TC-BIND-009); AC-F6-4 the ticket repro chain add -> list -> dispatch with the pre-fix failure triple encoded as a PRE_FIX_FAILURE_TRIPLE constant and asserted element-by-element as passed, not by running reverted code (TC-BIND-010); and NFR-6 binding determinism across two independent harnesses over the same checkout and across replay, with no envelope-byte comparison (TC-BIND-017). Also carries the phase exit evidence obligation for AC-F6-1: this suite's composition add path and the `present` and `root-unresolved` cells of the matrix must be shown red under an in-place revert of the phase-1 derivation (TC-BIND-018 producer revert, P1) — the pre-fix derivation emits a key-only binding exactly when the GitHub target resolves, so the `present` cell is refused by the domain — while the `target-unresolved` and `key-unresolved` cells stay green, the whole fixture-shape suite stays green, and the domain negatives stay green; the two surviving absence cells already hold pre-fix, and `present` is never recorded as a P1 green cell. The key-unresolved cell's detection is not the producer revert but the phase-3 asymmetry mutation (P3): the mutated derivation emits a root-only binding, and the cell reds at the add-outcome assertion because it expected a successful unbound add with neither field and instead observes the domain's `input.value.rejected` refusal carrying the key-and-root-together summary."
    tests:
      - "bun test tests/behaviour/queue-production-binding.test.ts"
      - "bun test tests/behaviour/queue-production-binding.test.ts -t \"TC-BIND-002\""
      - "bun test tests/behaviour/queue-production-binding.test.ts -t \"TC-BIND-006\""
      - "bun test tests/behaviour/queue-cli.test.ts tests/behaviour/queue-edge-wiring.test.ts"
      - "pnpm exec biome check tests/fixtures/queue/production/harness.ts tests/behaviour/queue-production-binding.test.ts"
  - id: 3
    title: "Invariant preservation and structural anti-recurrence: domain negatives, one derivation site, one facts resolution, source allowlist"
    kind: delivery
    scope:
      files:
        - tests/behaviour/queue-binding-invariant.test.ts
        - tests/structure/queue-binding-derivation.test.ts
    interactions:
