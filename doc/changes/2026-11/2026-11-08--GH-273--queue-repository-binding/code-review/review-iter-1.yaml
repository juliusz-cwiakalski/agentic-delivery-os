summary: >-
  The producer fix is exactly the change the ticket and the spec describe: the
  production composer now resolves repository facts once, lets an injected
  origin replace only the remote, and derives the queue repository binding as
  one total three-condition outcome (GitHub target AND normalizeRepositoryKey
  AND resolved checkout root; otherwise absent), so a one-sided pair is
  unreachable from the CLI composition. The key is the normalized lowercase
  host/owner/name and the root is the declaring checkout root; the queue edge's
  field-wise pass-through is untouched and the domain invariant, grammar,
  envelopes, exits, and error table are byte-unchanged (only
  packages/cli/src/production.ts changed under packages/). The regression
  coverage is honest rather than fixture-supplied: the composition harness
  exposes no root seam, all add/list/dispatch scenarios read the real ledger of
  a real temp checkout, and the fixture-shape and domain-negative layers carry
  their own artifact-specific evidence. I re-ran the four new suites (29/29),
  the pilot conformance suite (4/4), the affected composition/queue suites
  (70/70), the error-table/queue-contract suites (193/193), privacy-release +
  doc-conformance + content-inventory (24/24), and fixture/privacy scans (7/7);
  pnpm typecheck, biome on every changed source/test file, plan validate, and
  git diff --check are clean. No blocking finding; seven advisory findings are
  recorded (two artifact-hygiene, five informational).
