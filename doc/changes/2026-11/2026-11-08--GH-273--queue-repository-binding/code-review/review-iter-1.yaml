    location: tests/fixtures/queue/production/harness.ts:98
    message: >-
      The root-unresolved fixture first tries os.tmpdir(); when TMPDIR points
      inside the checkout (the repo-local aggregate-gate setting) it creates the
      throwaway directory in dirname(process.cwd()), outside the repository. That
      fallback keeps the cell honest and is documented for gate parity, but it
      makes the suite dependent on the checkout's parent directory being
      writable; in a tightly sandboxed runner where neither the configured temp
      dir nor the parent is usable the cell throws instead of skipping with a
      reason.
    suggestion: >-
      Keep the current candidates but extend the failure message to name every
      probed parent and the TMPDIR value (it already fails loudly), or add a
      third candidate under an explicitly supplied temp root; no production
      impact.
    suppressed: false
    published_url: null
  - id: F-6
    severity: info
    confidence: medium
    category: design
    location: packages/cli/src/production.ts:257
    message: >-
      An injected `repositoryFacts` object with no `originUrl` (e.g. `{}`)
      supersedes the checkout's real origin rather than overlaying nothing, so an
      injected empty record produces no binding even when the checkout has an
      origin. This matches the existing test usage (`dispatch-composition.test.ts`
      treats `{}` as "no origin") and production never injects facts, but DEC-5's
      "an injected origin replaces only the remote" does not state the
      absence case, and the field's doc comment still describes injection only as
      "a fixed remote".
    suggestion: >-
      Document the absence semantics on `ProductionCompositionFacts.repositoryFacts`
      ("present = authoritative, including no origin") or fall back to the
      resolved origin when the injected record omits `originUrl`; either is fine
      today because the seam is test-facing only.
    suppressed: false
    published_url: null
