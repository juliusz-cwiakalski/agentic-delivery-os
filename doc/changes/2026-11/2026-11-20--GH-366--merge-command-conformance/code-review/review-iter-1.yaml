findings:
  - id: F-1
    severity: high
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/merge-transaction.ts:994
    message: >
      The duplicate-open abort groups only the ACCEPTED set (byRef is built
      from `accepted` at lines 994-998; the step-5 comment at 990-993 even
      states "its population is the accepted set"), but spec §5.1 F-1 step 5
      declares "its population is the candidate set" and refuses
      merge.transaction-aborted when "more than one open entry whose
      provider-asserted source ref equals the resolved branch exactly". In the
      mixed sub-case — two open candidates sharing the source ref where
      exactly one is accepted (the other record-missing, record-invalid or
      declaration-disagrees) — the delivered code resolves to the single
      accepted candidate and lands, silently selecting between two duplicate
      open requests, while the AC-F1-6 given-clause ("more than one open
      request whose provider-asserted source ref equals the resolved branch")
      demands the abort. The pinned cell (TC-MRG-006/007/042 duplicate-open,
      tests/behaviour/merge-production-composition.test.ts:668-697) exercises
      only the both-accepted population (duplicateHeadSha is fixture-documented
      as "a second local head whose record declares the same branch"), so no
      test observes the divergence. Reachable provider state: two open
      requests with one head branch, one carrying a broken/missing
      declaration. Consequence: the exact silent-selection failure mode
      (spec P-8) the abort row was added to remove. The zero-accepted mixed
      case behaves consistently (branch-unresolved); the both-accepted case
      conforms (aborts, names each identity, wins over ambiguity).
    suggestion: >
      Repoint the duplicate grouping to the candidate set: once the resolved
      branch is known (after acceptance), refuse
      merge.transaction-aborted (requestReason duplicate-open-request) when
      candidates.filter(c => c.sourceRef === resolvedBranch).length > 1,
      naming every such candidate's identity — this subsumes the current
      accepted-set check (both-accepted stays aborting; the abort still wins
      over distinct-refs ambiguity; the budget is unchanged at 1 provider
      request since the decision remains page-decided after bounded local
      reads). Add the mixed composition cell (one accepted + one
      declaration-disagrees, same source ref) asserting the abort naming both
      identities, and a control asserting a distinct-ref disagreement still
      resolves/branch-unresolved. Alternative (less faithful): amend the spec
      — rejected because the mixed case is precisely a silent choose between
      duplicates.
