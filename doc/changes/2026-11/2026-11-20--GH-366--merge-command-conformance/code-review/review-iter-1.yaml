      and lines 1799-1804 (TC-MRG-038 allocation "identities move 170 -> 173
      … 173 / 173 / 172 / 71 / + 139"). A reader executing the plan text
      alone would treat the delivered 172-state as a defect; the correction
      currently lives only in pm-notes, not in the artifact it corrects.
      Disclosed by the PM (phase-2 DECLARED DEVIATION note and the
      numeric-anchor decision note), so this is artifact hygiene, not a
      phase or scope gap — phases 1-7 otherwise conform with commits and
      gate evidence.
    suggestion: >
      Amend the four plan sites to the reconciled anchors (or prepend a dated
      supersession line at the arithmetic declaration pointing at the
      pm-notes reconciliation and spec v2.6 §18/DOD-5), in the same
      remediation commit as F-1. No product surface is affected.
  - id: F-3
    severity: low
    confidence: medium
    category: correctness
    location: packages/core/src/domain/merge-transaction.ts:941
    message: >
      The replay path's defensive arm (lines 941-947) refuses
      merge.request-unresolved via a bare readFailure with NO evidence when a
      single matched identity arrives on a non-observed outcome. With the
      delivered adapter this is unreachable (unavailable + member-present
      occurs only with zero matches; single-match attempts are always
      observed), but if a future adapter ever produced that shape the refusal
      would render without operation/openCount/matched identities — a
      degraded diagnostics shape on a path AC-F3-1 covers.
    suggestion: >
      Either delete the arm (the type system plus the adapter contract make
      it unreachable) or populate the failure evidence (operation
      github-delivery-request-list, the observed identity) so the rendered
      refusal stays within the declared diagnostics contract. Optional — may
      ride the F-1 remediation commit or a later cleanup.
  - id: F-4
    severity: info
    confidence: high
    category: test-honesty
    location: tests/behaviour/providers/github-closeout.test.ts:207
    message: >
      The closeout-unchanged consumption proof (TC-MRG-054's final cell) is a
      source-text scan (not.toContain("matchedIdentities") over
      domain/closeout.ts and edge.ts). Unlike AC-F4-1's totality proof — where
      source-text matching is banned and the delivered proof is correctly
      value-based — a structural absence scan is a reasonable instrument
      here, and it is backed by exact-shape assertions (toEqual on the
      unavailable arm, Object.hasOwn absence proofs) and the unchanged
      delivered-ranking cell. No action required; a type-level absence
      assertion would be marginally stronger.
    suggestion: >
      None required. If touched later, prefer a compile-time consume-check
      (e.g. an exhaustive-destructuring type test) over the textual scan.
