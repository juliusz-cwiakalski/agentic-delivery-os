    severity: medium
    confidence: high
    category: plan-compliance
    location: doc/changes/2026-11/2026-11-20--GH-366--merge-command-conformance/chg-GH-366-plan.yaml:339
    message: >
      The numeric-anchor reconciliation corrected spec (v2.6) and test plan
