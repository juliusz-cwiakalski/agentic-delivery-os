decisions:
  - text: "PM-decided (scope, authoritative source): the owner's issue comment of
      2026-11-20T10:42:14Z defines the delivery scope as the merge slice — three
      named deterministic defects D1 (change branch read from the ambient
      checkout), D2 (required checks never consulted; the merge surface
      evaluates one gate), D3 (refusals do not name the breached contract or the
      credential reference) — with four acceptance criteria and three named
      regressions, plus the diagnostics requirements recorded in the three
      earlier owner comments (a credential condition is never reported as
      `merge.transaction-aborted`; required checks are read on the resolved head
      and failing/pending checks each fail closed and are named; the waiver path
      stays explicit). That comment post-dates the ticket body and scopes itself
      'for this story's merge slice', and the change branch
      `fix/GH-366/merge-command-conformance` names the same slice."
    date: "2026-11-20"
  - text: "PM-decided (residual explicitly not claimed): the ticket body's wider ask
      — one battery over the whole command family (`dispatch`, `loop`, `merge`,
      `closeout`, `queue`, `phase`, `verify`, `blockers`, `board`, `brief`,
      `metrics`, `spend`, `provider`) on the installed binary — is not claimed
      green by this change. This change ships the merge-family slice of that
      battery plus the diagnostics contract it proves. Declared here and in the
      PR body so the owner can rule on the remainder at review; no follow-up
      ticket is created (PM never creates tickets autonomously)."
    date: "2026-11-20"
  - text: "PM-decided (decision-id reservation, owner-specified): this change
      reserves TDR-0071..TDR-0073. Re-verify the max on `origin/main-tools`
      before authoring and never renumber downward. At intake the observed max
      is TDR-0058 (GH-354); GH-350 (open PR #372) reserves 0059..0064, GH-351
      0065..0067, GH-336 0068..0070."
    date: "2026-11-20"
  - text: "Branch/PR conventions: branch `fix/GH-366/merge-command-conformance` from
      `main-tools`; PR targets `main-tools` (never the default `main`); the PR
      stays open — merge authority is the CEO (Mode A) or the human (Mode B).
