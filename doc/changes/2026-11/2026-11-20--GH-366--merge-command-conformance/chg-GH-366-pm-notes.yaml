  - text: "Escalation question for the owner (DoR iteration 4): what may the shared
      merged-request read expose? (A) Authorize the minimal additive extension
      so the merge path observes 0/1/many match IDENTITIES — carried on every
      outcome, with a read fault distinguishable from zero — and count the
      read's own bounded review-thread query in the budget, closeout's behaviour
      and output unchanged; or (B) keep the count-only signal and relax
      AC-F1-6/AC-F3-6/F-3/Flow 6/ Appendix B to 'a count plus the selected
      identity', which still needs the zero-path carrier. The PM does not
      choose: option A changes the shared read's contract beyond CEO-D-111's 'no
      change to closeout', and option B weakens an owner-stated acceptance
      clause."
    type: question
    date: "2026-11-21"
  - text: "Owner ruling CEO-D-111 (GH-366, posted on the ticket; resumed
      2026-11-21): option (a) — declare the delivered read. Primary read is the
      bounded open-list read (`TRUTH_PROVIDER_LIMIT`, `includeGateFacts: true`)
      filtered to the change's resolved branch; convergence uses the delivered
      `findMergedDeliveryRequest(workItemRef, TRUTH_PROVIDER_LIMIT)` verbatim;
      more than one match in either read refuses `merge.transaction-aborted`
      naming the duplicate identities and never silently chooses; no new
      provider operation, no change to closeout's behaviour, no unbounded read.
      This supersedes the PM's iteration-3 read-budget design (the fourth reason
      `ambiguous-merged-request`, the convention filter on merged candidates and
      the `selectMerged` rework). PM assumption, stated for owner review:
      because the delivered merged read exposes no count and rule 4 forbids
      reworking it, the change adds ONE additive, optional
      `signals.mergedMatches` count computed before its delivered selection;
      closeout ignores it. The abort row therefore reaches three act-requiring
      causes (waiver-append failure, declared landing gap, duplicate matching
      requests) and stays `retryable: false`. Being aligned to v2.3: spec,
      TDR-0072, TDR-0073, the test plan (v1.5) and the plan (14)."
    type: decision
    date: "2026-11-21"
  - text: "PM-decided (read-budget ruling, DoR iteration 3 finding 1): the change's
      own 'exactly one provider read' claim is withdrawn as too strong for the
      convergence path. The delivered truth is that merged requests are not in
      the open list: `listDeliveryRequests` reads `?state=open`, and merged
      truth comes from a separate bounded `?state=closed` read
      (`findMergedDeliveryRequest`), which today also ranks multiple matches
      through `selectMerged`. The owner's acceptance never required a one-read
      budget; this change imposed it. The ruling: **one bounded open-list read
      on the resolution path, plus at most one bounded closed-list read on the
      convergence path** (no pagination, no retry, no fetch), and the merge path
      must observe `0 | 1 | 2+` merged matches and refuse on 2+ rather than rank
      — the shared closeout ranking stays as it is for closeout, and the merge
      composition stops using it. This keeps the owner's fail-closed requirement
      and drops a self-imposed constraint that the delivered adapter cannot
      satisfy without reworking a shared read."
    type: decision
    date: "2026-11-20"
