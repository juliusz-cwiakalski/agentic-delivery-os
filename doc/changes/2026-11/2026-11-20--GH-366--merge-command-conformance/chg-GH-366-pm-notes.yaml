  - text: "Owner ruling CEO-D-116 (issue #366 comment 2026-11-22T15:13:00Z), outcome
      (A): authorize the minimal additive extension of the shared merged-request
      read. The merge path observes 0/1/many matches and names every matched
      identity — empty identities decide zero, one replays, many aborts
      `merge.transaction-aborted` naming EACH identity and presenting NONE as
      *the* request; the count is derived from the identities, no second
      competing field. A read fault is a distinct outcome refusing
      `provider.outage` (or the delivered `provider.payload.invalid` mapping)
      with `operation=github-delivery-request-list`; never
      `no-open-request`/`merge.request-unresolved`, never folded into zero. The
      additive optional member may land on the `unavailable` arm of the shared
      closeout contract type; closeout reads neither count nor identities and
      its behaviour and output stay unchanged. Budget truth: the read's own
      review-thread query is counted (2 provider requests when nothing matches,
      3 on a match-bearing convergence attempt, no extra request on
      open-page-only paths); no suppression option may be added. DEC-13's
      'minimum additive change is one optional count signal' claim is withdrawn
      and the amended shape is recorded in DEC-13 and the two owned TDR
      amendments. The shape is the ceiling; anything beyond is a new decision."
    date: "2026-11-22"
  - text: "PM-decided (verification-precondition remediation; the ruling offered two
      options): `merge` does NOT compose the gate verification itself —
      `merge.state-unverified`'s remediation names the exact prior command and
      target: produce the verification with `verify gates <ref>` for the same
      work item, then re-run the merge. Rationale: the ruling bounds this ticket
      to no scope expansion of merge (no new endpoint, credential, or
      capability), and a verification write inside an already-mutating command
      would add a write path and provider cost to `merge`, while naming the
      exact command removes the guesswork the ruling objects to. Change-scoped;
      recorded in the spec and the refusal golden."
    date: "2026-11-22"
