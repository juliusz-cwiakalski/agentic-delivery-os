  - text: "Specification reopened and re-completed (v1.2): the DoR was not the
      discovery point — the PM verified the F-4 premise against the tree while
      validating the test plan. `packages/cli/src/classify.ts:76-97`
      (`mergeGateFamilyEntry`) already resolves any emitted
      `merge.gate.<gate-id>.failed` code of kind `merge` to the declared family
      row, and `tests/structure/defect-f1-merge-refusal-containment.test.ts`
      already asserts a live gate-family refusal is that row at exit 1, never
      the containment identity. The spec's §2.1 claimed a gate refusal 'can
      reach the containment identity'; that was an over-inference from the
      type-only family expression. The real residual — the composition's runtime
      emittable declaration enumerates exact members only, so the totality proof
      matches source text instead of ranging over a runtime declaration — is
      still delivery work and is now stated accurately (F-4, G-5, §7.1, §16,
      RSK-6, DEC-7). No AC text, scope, or identity changed, so the completed
      test plan (22/22 AC coverage) remains valid."
