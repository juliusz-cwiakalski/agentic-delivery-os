  - text: "Ruling folds two live findings into this ticket (both observed on real
      merges 2026-11-22; acceptance-relevant — the owner's exit criterion is a
      real PR landed by the merge command end to end, not a platform-side
      fallback): (i) the merge detail read cannot carry mergeability — the list
      read never returns `mergeable`/`mergeable_state` — so the merge port
      locates the request on the list page and then reads the single request
      (the delivered single-request detail read `verify gates` already uses) for
      mergeability; pinned oracle: a list payload with NO mergeability fields
      plus a detail payload with `mergeable: true, mergeable_state: clean` must
      LAND, never refusing `merge.mergeability-unknown`; a kept unknown-recovery
      re-read re-reads the detail, not the list. Consequence:
      `github-delivery-request-detail` becomes reachable again in the operation
      vocabulary (v2.2 dropped it as unreachable) and the pinned identity
      arithmetic must be recounted. (ii) merge requires a preceding verification
      record; the refusal's remediation names the exact command and target
      (pinned above). Evidence trace: issue #366. The PR-commit push defect
      ticket #386 is referenced only, never absorbed."
