  phases: [1, 2, 3, 4, 5, 6, 7]
  escalationTriggers:
    - "An error identity, an exit digit, a row category/consequence/projection, or an identity total moves without the machine table, the documented table, every identity pin site and every pinned-count page moving in the same commit (NFR-8, TC-MRG-038)"
    - "A `retryable` value is assigned anywhere but by the emitted code's declared row or family projection, or a row advertises `retryable: true` while any cause it reaches needs an operator act before a re-run can converge (AC-F3-5, AC-F3-6, TC-MRG-025, TC-MRG-026)"
    - "The merge path reads the invocation checkout's branch, resolves a branch from a second source, or keeps a fallback for an absent declaration (G-1, NFR-6, AC-F1-3, TC-MRG-037)"
    - "The verified head, the freshness comparison, the landing's expected head or the reported head is anything but the matched delivery request's asserted head (DEC-2, AC-F1-1, AC-F5-1)"
    - "A second required-check evaluator appears, the required-check set is derived anywhere but once per invocation, or the gate-id slot pattern is widened (NFR-7, F-2, RSK-6, tests/checks/merge-check-path-scan.test.ts)"
    - "The runtime family declaration duplicates the classifier's resolution, enumerates gate ids, or the containment identity becomes reachable by a declared code (F-4, AC-F4-1, TC-MRG-029)"
    - "A new network call, child process, provider operation, credential reference or secret-bearing field appears, or the existing no-live-call guards are relaxed (NFR-4, NFR-9, NG-1, TC-MRG-036)"
    - "The battery's gate evaluations, `verify gates` output or the battery goldens move (NG-2, TC-MRG-032)"
    - "A waiver class, a per-invocation override, a bypass or a force path is added for the check gate (NG-6, F-2, DEC-4)"
    - "A golden file is regenerated without its per-file entry in phase 6's declared movement table, or the pinned `EXPECTED` set changes in a phase other than the rendering phase (test plan OQ-TP-2, TC-MRG-035)"
    - "A pinned meta-suite (the closed merge-suite population, the new-suite list, an export inventory, the pinned default gate set) is relaxed, exempted or deleted instead of updated exactly in the phase that changes its input (test plan §7.3, the \"fix the check by deleting the check\" risk)"
    - "A phase boundary is not gate-green, or a gate is reported green while a check was skipped, disabled, made vacuous, or narrowed to hide a failure"
