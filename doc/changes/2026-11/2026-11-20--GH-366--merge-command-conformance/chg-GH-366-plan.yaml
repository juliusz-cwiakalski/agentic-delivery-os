  escalationTriggers:
    - "An error identity, an exit digit, a row category/consequence/projection, or an identity total moves without the machine table, the documented table, every identity pin site, every pinned-count page and the phrase-table rotation moving in the same commit (NFR-8, TC-MRG-038)"
    - "A `retryable` value is assigned anywhere but by the emitted code's declared row or family projection; `merge.transaction-aborted` reaches any cause other than its two pre-mutation causes (a waiver-append failure and a declared landing gap), advertises `true`, or promises convergence; a refused landing is reported as `merge.transaction-aborted` instead of one of the four closed declared identities — `config.credential.missing` (no credential to attempt), `provider.auth.rejected` (rejected credential), `provider.outage` (transient, transport or unclassified fault), `merge.landing-unverified` (landing fired, merged truth not observed); or a landing-port failure reaches an envelope as a raw port code (for example `protection-rule` or `head-mismatch`) because the landing-fault mapping lacks its declared `provider.outage` default (AC-F3-3, AC-F3-5, AC-F3-6, TC-MRG-023, TC-MRG-025, TC-MRG-026, TC-MRG-047)"
    - "A refusal renders an `operation` token outside the closed vocabulary, or the field is satisfied by an operation name occurring anywhere in the summary instead of by the dedicated `operation=<token>` field — the same rule that governs the dedicated `command=merge` and `ref=<ref>` fields (AC-F3-1, API-3, NFR-5, TC-MRG-023, TC-MRG-024)"
    - "The merge path reads the invocation checkout's branch, reads the invocation checkout's head, reads a change record from the working tree, resolves the branch from a second source, keeps a fallback for an absent declaration, or fetches/pulls to make a head object readable (G-1, NFR-6, NG-7, AC-F1-3, TC-MRG-037)"
    - "The resolution path performs more than two provider reads, performs the closed merged-request list read more than once, performs it without the declared convention filter, performs it while a convention-matching open request already is the delivery request, or paginates/retries/fetches it; or performs more than three bounded local record reads, or a record read issues more than two fixed-argv git invocations or reads more than 262 144 bytes (NFR-2, NFR-10, TC-MRG-034, TC-MRG-040, TC-MRG-049)"
    - "A branch refusal renders a reason outside the six-member closed set, or resolves precedence outside `declaration-disagrees` > `record-invalid` > `record-unreadable` > `record-missing` > `declaration-missing` > `declaration-unusable`, or a request refusal renders a reason outside its four (`no-open-request`, `ambiguous-open-request`, `head-unresolved`, `ambiguous-merged-request`), or a saturated bounded page is answered by the candidate count instead of `ambiguous-open-request`, or two or more merged matches are ranked, scored or otherwise reduced to one instead of refusing `ambiguous-merged-request` (AC-F1-3, AC-F1-4, AC-F1-6, TC-MRG-006, TC-MRG-042, TC-MRG-043)"
    - "Convergence is decided after any change-record read, a converged re-run performs one record read or one record-read git invocation, is made to require a readable record or a declared branch, lands anything, or is decided without the one closed merged-request read; or closeout's delivered merged-request ranking is changed, forked or re-decided on the merge path (AC-F1-6, TC-MRG-043, TC-MRG-049)"
    - "The verified head, the freshness comparison, the landing's expected head or the reported head is anything but the matched delivery request's asserted head (DEC-2, AC-F1-1, AC-F5-1)"
    - "A second required-check evaluator appears, the required-check set is derived anywhere but once per invocation, the expected-set validity rule is restated on the merge path instead of importing the exported `expectedSetValid`, or the gate-id slot pattern is widened (NFR-7, F-2, RSK-6, TDR-0072 DR-1, tests/checks/merge-check-path-scan.test.ts)"
    - "The runtime family declaration duplicates the classifier's resolution, enumerates gate ids, the containment identity becomes reachable by a declared code, or the removal mutation fails the totality proof by name instead of by a source-text or generic-coverage failure (F-4, AC-F4-1, AC-F4-2, TC-MRG-029, TC-MRG-045)"
    - "The merged report echoes the verification record's battery gate list instead of the two-entry merge-applicable projection the run evaluated, or `gates=2/2` is satisfied by any `gates=` line rather than by the projection (AC-F2-8, DEC-12, TC-MRG-044)"
    - "A new network call, child process, provider operation, credential reference or secret-bearing field appears, or the existing no-live-call guards are relaxed (NFR-4, NFR-9, NG-1, TC-MRG-036)"
    - "The battery's gate evaluations, `verify gates` output or the battery goldens move (NG-2, TC-MRG-032)"
    - "A waiver class, a per-invocation override, a bypass or a force path is added for the check gate (NG-6, F-2, DEC-4)"
    - "A golden file is regenerated in a phase whose declared subset does not name it, a phase's golden subset is declared as a folder instead of exact file paths, a file outside the thirteen moved plus six added is added, removed or moved, a phase that changes a rendered byte does not run `tests/golden/merge.test.ts` in its own gate, or the pinned `EXPECTED` set moves anywhere but 13 -> 15 in phase 2 and 15 -> 19 in phase 3 (test plan §7.3, TC-MRG-046)"
    - "A pinned meta-suite (the closed merge-suite population, the new-suite list, either export inventory, the pinned default gate set, the three resolution constants, the `expectedSetValid` export list) is relaxed, exempted or deleted instead of updated exactly in the phase that changes its input (test plan §7.3, the \"fix the check by deleting the check\" risk)"
    - "A phase boundary is not gate-green, or a gate is reported green while a check was skipped, disabled, made vacuous, or narrowed to hide a failure"
