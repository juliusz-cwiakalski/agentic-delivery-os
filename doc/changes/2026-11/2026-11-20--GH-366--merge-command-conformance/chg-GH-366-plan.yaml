# GH-366 implementation plan — machine-readable projection (delivery.plan.v1).
# Canonical plan artifact: this YAML document is the only plan file for this
# change. `plan validate`, `plan diff`, `plan overlap` and `lint plan` read it
# directly. Extra phase data (goal, TC ownership, code areas, obligations, gate
# commands, declared golden movement) rides in YAML comments so the parsed
# document stays schema-strict: the plan declares phases and scope only — no
# `tasks` key and no progress log. Progress is a pm-notes `notes:` entry naming
# the plan phase id, the commit hash and the gate result.
#
# SOURCES (single source of truth; this plan invents no requirement):
#   - Spec:   ./chg-GH-366-spec.md (v2.2 — the two-read ruling: one bounded open
#             list read plus at most one bounded closed merged-request list read,
#             the `ambiguous-merged-request` reason, no ranking on the merge path,
#             and every landing fault always a declared identity; F-1..F-5,
#             API-1..API-3, EVT-1..EVT-2, DM-1..DM-3, NFR-1..NFR-10,
#             DEC-1..DEC-14, RSK-1..RSK-13, §4.2 the seven non-goals, §5.1
#             capability details, §6 the five flows, §7.1 in scope, §17 the 25
#             ACs and §17.7 the change's Definition of Done, §18 the delivery
#             order, §19 the no-migration statement, Appendix A the normative
#             resolution order, Appendix B the refusal matrix and its
#             act-required column, Appendix C the reserved decision records.)
#   - Tests:  ./chg-GH-366-test-plan.md (49 cases in one stable TC-MRG family,
#             49/49 cases allocated, 25/25 ACs covered, 10/10 NFRs, 8/8
#             interface elements; §5.1 states the plan-phase allocation this plan
#             adopts verbatim and every §5.2 detail restates it on a `Plan
#             Phase(s)` line; §6 the five fixture families and the "no fixture
#             writes a change record into a base checkout" rule; §7.1 the
#             scenario-to-file map; §7.3 the meta-suite registration obligations;
#             §7.4 the documentation surfaces; §8.3 OQ-TP-3 closed by §5.1. The
#             DoR iteration-3 revision restates the convergence case's read
#             assertion on the two-read ruling — see TEST-PLAN NOTE 2 below.)
#   - Decisions: doc/decisions/TDR-0071 (branch resolution and resolved-head
#             authority; the 2026-11-20 amendment selects ALT-6, the declaration
#             read at the request head), TDR-0072 (required-check authority and
#             gate membership; premise corrected to "the recorded battery verdict
#             is consulted but the fresh page is never consulted", plus the
#             identity arithmetic), TDR-0073 (refusal diagnostics and
#             emitted-identity totality; arithmetic and the 25-AC count). All
#             three are `Proposed`, authored AND amended on this branch; no
#             challenge verdict and no acceptance is claimed.
#   - PM:     ./chg-GH-366-pm-notes.yaml (delivery_mode autonomous; the scope
#             ruling — the `merge` slice plus the diagnostics contract, the
#             family-wide battery explicitly not claimed; the reserved decision
#             ids; the top-level `branch` declaration this change introduces and
#             already carries; the operational prerequisite that every primitive
#             call carries BOTH PATH=$PWD/node_modules/.bin:$PATH and
#             TMPDIR=$PWD/tmp/tmpdir, and that `pnpm build` precedes any
#             `jaiship` invocation).
#   - Rules:  .ai/rules/typescript.md and .ai/rules/testing-strategy.md.
#   - Schema: doc/spec/features/feature-plan-schema.md (scope keys
#             files/folders/packages, per-phase one-line summary, typed
#             done-artifacts, leases, weightClass, interactions, tier; no tasks
#             key; `id` a positive integer).
#   - Precedent: ../2026-11/2026-11-19--GH-354--dispatch-operator-surface/
#             chg-GH-354-plan.yaml (comment-carried phase data; a planning phase
#             satisfied at plan time; an explicit scope for a no-edit boundary).
#
# READ BUDGET — the TWO-READ ruling (spec v2.2; TDR-0072's fact row as amended;
# discharges readiness iteration 3 finding 1 on the plan side). The resolution
# path spends ONE bounded open-request list read plus AT MOST ONE bounded
# closed-request list read — the delivered merged-request read
# (`GET …/pulls?state=closed`), now filterable by the declared branch convention
# and exposing the match count/ambiguity (`0 | 1 | 2+`) — and nothing else: no
# pagination, no retry, no fetch, no second closed read and no second open read.
# The closed read is performed only after the open read leaves no open request
# able to be the delivery request (an empty, unsaturated candidate set); therefore
# a converged re-run, an `ambiguous-merged-request` refusal and a `no-open-request`
# refusal each spend exactly two provider reads, while every other
# resolution-path refusal — every `merge.branch-unresolved` cause,
# `ambiguous-open-request`, `head-unresolved` — spends exactly the one open read
# and no closed read. Record reads stay at most
# three bounded local reads (<= 2 fixed-argv git invocations and <= 262 144 bytes
# each), with no shell, no retry and no fetch.
#
# NO RANKING ON THE MERGE PATH. Two or more merged matches refuse
# `merge.request-unresolved` with `ambiguous-merged-request`; no merged request is
# selected, scored or ordered on the merge path. Closeout keeps the delivered
# ranking UNCHANGED (`selectMerged` remains its selection rule and its default
# call keeps the delivered work-item filter); its regression is named in phase 3
# and is not re-decided here.
#
# LANDING FAULTS ARE ALWAYS A DECLARED IDENTITY (phase 2). Every landing-port
# failure maps through one closed, total mapping — `config.credential.missing` (no
# credential to attempt), `provider.auth.rejected` for a rejected credential,
# `merge.landing-unverified` when the landing fired without observed merged truth,
# and `provider.outage` as the declared default for a transient, transport or
# unclassified fault — so no raw port code (for example `protection-rule` or
# `head-mismatch`) can reach an envelope.
#
# TITLE/SUMMARY TRACKER-TOKEN RULE (commit-primitive constraint): the commit
# primitive rejects any tracker-like token in the subject or body that is not the
# resolved ref, and the plan summary IS the phase-commit subject description. Its
# matcher is `\b[A-Z][A-Z0-9]*-\d+\b`, which also matches the tail of a
# hyphenated test-case id (the id in a test-case reference yields the bare token
# the matcher rejects). Therefore NO title or summary in this plan carries a
# decision-record id or a test-case id: both appear only inside `scope.files`
# paths and in the per-phase comments, which are not part of the commit message.
# Per-phase test-case allocation is therefore declared in the comment block above
# each phase, keyed by plan phase id.
#
# TC ALLOCATION INDEX — 49 of 49 cases, each with exactly one owning phase; the
# per-phase allocation is restated in each phase's comment block and matches
# test plan §5.1 verbatim:
#   phase 1 — none (planning; satisfied once the records are authored)
#   phase 2 — 8 cases:  020, 021, 022, 026, 027, 039, 047, 048
#   phase 3 — 16 cases: 001, 002, 003, 004, 005, 006, 007, 008, 009, 030, 031,
#                       036, 037, 042, 043, 049
#   phase 4 — 16 cases: 010, 011, 012, 013, 014, 015, 016, 017, 018, 019, 023,
#                       024, 025, 032, 034, 040
#   phase 5 — 3 cases:  028, 029, 045
#   phase 6 — 5 cases:  033, 035, 041, 044, 046
#   phase 7 — 1 case:   038
# 8 + 16 + 16 + 3 + 5 + 1 = 49. Disjoint, no orphan, no case owned twice. Every
# id above is a case in the change's single test-case family; the numeric
# suffixes are the case numbers.
#
# GOLDEN MOVEMENT BY PHASE — discharges readiness iteration 2 finding 1 and test
# plan OQ-TP-2. `tests/golden/merge.test.ts` byte-compares every committed
# golden, so a phase that changes a rendered byte regenerates the affected file
# IN THAT PHASE and runs that suite in ITS OWN gate. No phase boundary may be
# red while its gate reports green: a phase whose declared subset is non-empty
# and whose gate omits the suite is a plan defect, and the suite fails by name
# for any file regenerated outside the declared subset.
#
#   file                              | phase(s) | why it moves
#   ----------------------------------|----------|-----------------------------
#   refusal-gate-human.txt            | 2        | the dedicated fields only; the
#                                     |          | gate refusal names the gate and
#                                     |          | job, never a head
#   refusal-gate-scripted.json        | 2        | same
#   refusal-stale-human.txt           | 2, 3     | 2: fields; 3: recorded-sha
#                                     |          | (base-tip record head) and
#                                     |          | current-sha (resolved request
#                                     |          | head) become different objects
#   refusal-stale-scripted.json       | 2, 3     | same
#   refusal-tracker-human.txt         | 2        | fields only; cause unchanged
#   refusal-tracker-scripted.json     | 2        | same
#   refusal-override-human.txt        | 2        | fields only; class/authorizer
#                                     |          | unchanged
#   refusal-override-scripted.json    | 2        | same
#   refusal-waiver-human.txt          | 2        | fields only; class/authorizer
#                                     |          | unchanged
#   refusal-waiver-scripted.json      | 2        | same
#   refusal-work-item-human.txt       | ADDED 2  | the work-item refusal's
#                                     |          | emitter lands in phase 2
#   refusal-work-item-scripted.json   | ADDED 2  | same
#   refusal-branch-human.txt          | ADDED 3  | the branch resolution emitter
#                                     |          | lands in phase 3
#   refusal-branch-scripted.json      | ADDED 3  | same
#   refusal-request-human.txt         | ADDED 3  | the candidate-set/request
#                                     |          | emitter lands in phase 3
#   refusal-request-scripted.json     | ADDED 3  | same
#   success-human.txt                 | 3, 6     | 3: the resolution lines;
#                                     |          | 6: `gates=2/2 passed` over the
#                                     |          | evaluated projection
#   success-data.json                 | 3, 6     | 3: the resolved object; 6: the
#                                     |          | evaluated projection instead of
#                                     |          | the record's battery list
#   success-scripted.json             | 3, 6     | same
#
# ARITHMETIC. Thirteen committed files, every one moving at least once (ten in
# phase 2, five in phase 3, three in phase 6; the stale pair and the success trio
# move twice). Six files are added: two in phase 2, four in phase 3.
# The pinned `EXPECTED` set therefore moves 13 -> 15 in phase 2, 15 -> 19 in
# phase 3, and stays 19 in phases 4-7, where a change to it fails by name. The
# byte-for-byte comparison count moves 11 -> 13 (phase 2) -> 17 (phase 3):
# eight refusal human files, eight refusal scripted files and the success human
# rendering, with `success-data.json` the single structural comparison and
# `success-scripted.json` pinned by the directory listing. Phase 4 changes which
# gates are freshly evaluated, not what the merged report renders — the report's
# projection rendering is phase 6's change (TC-MRG-044) — so phase 4 moves no
# golden and re-runs the suite as a regression. Phase 5 changes the totality
# proof's input, not a rendered byte, and moves none either.
#
# TEST-PLAN NOTE (declared, not hidden; DISCHARGED by test plan v1.3). An earlier
# test-plan revision phrased TC-MRG-046's movement as a single phase ("`EXPECTED`
# moves 13 -> 19 in the same commit as the rendering change"). The case's substance was
# never in doubt — the three parsed fields, the five refusal pairs moving, all
# thirteen committed files moving, six files added, `EXPECTED` 13 -> 19, the
# comparison count 11 -> 17, and the mutation control — and the plan splits the
# movement across phases 2, 3 and 6 exactly as the table above declares, because a
# phase that changes a rendered byte must regenerate it in that phase or leave its
# own boundary red. Test plan v1.3 states that per-phase split on the case's
# `Plan Phase(s)` line and in its §5.2 text, so the note records the resolution
# rather than an owed edit; no acceptance criterion, case id or coverage mapping
# changed.
#
# TEST-PLAN NOTE 2 (DoR iteration-3 alignment; declared, not hidden). The
# iteration-3 revision of the test plan moves NO case between phases: the
# allocation in the index above is unchanged at 8 / 16 / 16 / 3 / 5 / 1 = 49.
# It restates the convergence case's read assertion on the two-read ruling (one
# open list read plus at most one closed list read, and zero change-record reads)
# and re-points `tests/behaviour/merge-production-composition.test.ts`'s
# unresolved-request cell to `merge.request-unresolved`. This plan implements
# that ownership: phase 2 owns the placeholder routing and the cell, and phase 3
# owns the candidate-set and convergence resolution that supersedes the
# placeholder. A test plan that still asserts exactly one provider read on the
# replay path, or that leaves the abort cell owned by phase 3, is the mismatch to
# report; case ids, phase ownership and the totals do not change.
#
# DECLARED CROSS-PHASE READS (a case is owned by one phase; a fact it depends on
# is authored by the phase that lands its last dependency, and the owning phase
# re-runs rather than re-authors):
#   - 047 is authored in phase 2 (the abort row's value and the convergence
#     assertion move together there) and is re-run by every later phase's gate.
#   - 046 is owned by phase 6, where it asserts the complete rendering contract
#     over the whole golden set, the mutation control and the 19-file arithmetic.
#     The `command`/`ref`/`operation` fields it asserts are authored in phase 2
#     and the resolution-fact bytes it also covers are authored in phase 3, so
#     phases 2 and 3 each regenerate their own declared subset and run the suite
#     in their own gate; neither phase pretends to own the whole assertion, and
#     phase 6 owns the contract closure.
#   - 044 is owned by phase 6, where the merged and dry-run reports render the
#     evaluated two-entry projection; the projection itself (two merge-applicable
#     entries) is authored in phase 4, which therefore moves no golden.
#   - 049 is owned by phase 3 with 043: 049 proves the zero-record-read replay
#     and its two-match refusal, 043 proves the ordering claim and the paired
#     control that zero merged matches continue to the candidate path.
#   - 038 is owned by phase 7 and ONLY by phase 7. Its machine-table, pin-site
#     and phrase-table values are authored in phase 2, so phase 2 is the
#     authoring phase and phase 7 is the reconciling phase that re-runs 038 over
#     the reconciled documentation surfaces. Phase 7 edits no machine table and
#     phase 2 edits no contract prose; the split is declared, not hidden.
#   - 048 is owned by phase 2 and executes unchanged in the delivered waiver
#     suite (test plan §7.1 row 048: no change), so it is a gate entry, not a
#     scope edit.
#   - 009's value-faithful half is owned by phase 3 and proven after a real
#     `phase complete` write in `tests/behaviour/phase-completion-convergence.test.ts`
#     plus its support fixtures.
#
# IDENTITIES AND COUNTS (NFR-8, spec v2.1). The base is `origin/main-tools` at
# `e1ebc76c` (GH-350 merged): **170** machine entries / **170** documented rows /
# **169** delivered rows / **68** two-segment allowlist members / arithmetic
# `BASELINE_ROWS.length + 136`, with the `merge` kind at **9** concrete rows. This
# change's end state is **173 / 173 / 172 / 71 / `+ 139`**, with the `merge` kind
# at **12**. The acceptance inventory the target phases are verified against is
# **25** ids (22 carried forward, AC-F2-8 and AC-F4-2 added in spec v2.0, AC-F1-6
# added in v2.1); the identity arithmetic is unaffected by that count. `167` is a
# BANNED stale total (a legacy form), and the phrase table rotates: the outgoing
# base `+ 136` joins the legacy forms and `+ 139` is published as the live
# arithmetic. Every one of those numbers moves in one commit at the phase
# boundary described below — a page that restates either pre-change total (167 or
# 170) as a live one would assert a superseded value and must fail the scan. The
# effective gate-set identity is UNCHANGED:
#   delivery.merge.gates.v1:[lifecycle-finalization,ci-green,push-parity,owner-gate,squash-preflight,tracker-freshness]
# The `ci-green` entry's surface moves; the entry-id sequence does not.
#
# OUT OF SCOPE (spec §7.2, NG-1..NG-7): the family-wide command battery for the
# other command families, and any installed-binary end-to-end conformance claim;
# any branch-protection required-status-contexts read or any new provider
# operation; any change to the battery's five built-in gate evaluations, to
# `verify gates` output, or to their goldens; a change-record branch writer; any
# fetch, pull or remote read to make a missing head object readable;
# waiver-policy, owner-gate-classification or `--waive` change; any new landing,
# refresh, force, bypass, queue, retry or head-mutation capability; any new
# configuration key, schema version, record kind or gate id.
#
# The two-read ruling is NOT a new provider operation: it reuses the delivered
# `state=closed` merged-request read and the delivered open list read. The one
# shared-surface edit it forces (additive optional members on the merged-request
# read's input and observation, and the adapter's filter plus count) is declared
# in phase 3 and changes no closeout behaviour: closeout's default call keeps the
# delivered work-item filter and `selectMerged` ranking, and `edge.ts` is a
# no-edit boundary. A closeout behaviour change remains out of scope (NG-5).

