phases:
  # ---------------------------------------------------------------------------
  # PHASE 1 — Planning: the three reserved decision records, their amendments and
  # their index rows.
  #
  # Goal: the governed design decisions this change executes are recorded before
  #   delivery code lands (spec Appendix C reserves the ids; the PM's intake
  #   decision reserves them in writing). The records are authored by
  #   `@decision-advisor`, never by delivery code: this phase declares their
  #   paths so the staging authority is explicit instead of assumed.
  #
  # Status semantics: SATISFIED ONCE AUTHORED AND AMENDED. All three records and
  #   their three index rows are already on this branch AND already carry the
  #   DoR-gate amendments: TDR-0071 selects ALT-6 (the declaration is read at the
  #   delivery request's asserted head through one bounded local tree/blob read;
  #   ALT-5, the working-tree read, is recorded as superseded and ineligible
  #   against C-9) and restates its binding surface over the 25-AC inventory;
  #   TDR-0072 corrects its premise (the recorded battery verdict is consulted,
  #   the fresh check-run page is never consulted on the merge path) and its
  #   arithmetic; TDR-0073 carries the arithmetic move and the 25-AC count. No
  #   further record authoring, re-authoring or re-committing is owed by
  #   delivery: the coder verifies the paths are tracked, records plan phase 1 as
  #   SATISFIED in a pm-notes `notes:` entry, and proceeds to phase 2 without
  #   editing a record. No production code and no test change is committed here.
  #   The record ids stay `Proposed` — the human owner accepts or amends them at
  #   the PR review, and no challenge verdict is claimed (spec §17.7 DOD-4).
  #
  # Record content binds later phases:
  #   - the branch resolution and head binding record binds phase 3 (ALT-6: one
  #     declared source read at the candidate head, no ambient fallback, no
  #     working-tree record read, the request head is the resolved head, the six
  #     closed reasons and their precedence, the three pinned constants);
  #   - the required-check authority record binds phase 4 (the reserved CI
  #     built-in becomes merge-applicable; the required set is the declared
  #     entries plus the repository-declared expected job set; one evaluator;
  #     fail-closed with the authored surface opt-out as the only remedy);
  #   - the refusal diagnostics record binds phase 2 and phase 5 (named causes,
  #     the dedicated `command`/`ref`/`operation` rendering fields with the closed
  #     operation vocabulary, row-level retryability honesty with the abort row at
  #     `false` over its two pre-mutation causes, the landing-fault attribution,
  #     the runtime family declaration and the totality proof over it).
  #
  # Gate (expected signal: exit 0, three records tracked, `doc/decisions` clean,
  #   no commit authored because the phase is a satisfied no-op):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git ls-files --error-unmatch <each record path>
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git status --porcelain -- doc/decisions
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun run scripts/checks/memory-lint.ts
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Land the three reserved decision records, their amendments and their index rows (planning; satisfied once authored, no production code)"
