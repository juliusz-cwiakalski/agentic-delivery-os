  # PHASE 2 — Refusal identities, the diagnostics contract and the identity move.
  #
  # Goal (spec F-3, F-4's vocabulary half, DEC-5/DEC-6/DEC-11; §18 "diagnostics
  #   first — they are the vocabulary the other capabilities report in"):
  #   1. Three additive rows: `merge.branch-unresolved` (six closed reasons,
  #      §5.1 F-1 step 7), `merge.request-unresolved` (closed reasons
  #      `no-open-request`, `ambiguous-open-request`, `head-unresolved`),
  #      `merge.work-item-unresolved` (AC-F3-4). Each row: category `user`,
  #      non-retryable, consequence `not_landed`, projection `user-validation` at
  #      exit 1, a remediation naming the object to repair.
  #   2. `merge.transaction-aborted` is narrowed in cause AND PINNED: its residual
  #      causes are a waiver-append failure, a refused landing and a declared
  #      landing gap, each of which needs an operator act, so the row declares
  #      `retryable: false` with a remediation naming the aborted pre-mutation
  #      condition and promising no convergence (AC-F3-6, §8.5, Appendix B). This
  #      is not a decision to be taken during delivery — it is the v2.0
  #      contract. The delivered convergence suite's
  #      `expect(errorOf(result)?.retryable).toBe(true)` moves to `false` in this
  #      phase, and the documented row moves with it (declared row change below).
  #   3. The refusal rendering contract (DEC-11): every refusal renders a
  #      dedicated `command=merge` field and a dedicated `ref=<ref>` field
  #      (`ref=-` when no usable ref was supplied) beside its code, the breached
  #      contract and the offending object. Both fields are authored here, in the
  #      command's refusal cause data and the human/scripted rendering, because
  #      they are the vocabulary every later refusal reports in. Consequence
  #      recorded now, performed in phase 6: the uniform field moves ALL TEN
  #      delivered refusal goldens (five human, five scripted). No refusal code,
  #      category, consequence, exit digit or envelope property moves with them.
  #   4. Credential refusals name the credential reference AND the environment
  #      variable AND the operation that required them (`github-read`,
  #      `GITHUB_TOKEN`), exactly as the tracker family already does; a credential
  #      condition is never `merge.transaction-aborted` (AC-F3-2, AC-F3-3). A
  #      provider read fault names the failed operation (AC-F2-5's vocabulary
  #      half). A tracker object that does not resolve names its own ref and read
  #      operation (AC-F3-4).
  #   5. `retryable` is always the emitted code's declared row value and never a
  #      per-instance value; every remediation is actionable or absent and never
  #      instructs clearing an unnamed condition (AC-F3-1, AC-F3-5).
  #   6. The composition's declared emittable set gains exactly the three new
  #      codes (the exact-member list stays exact; the runtime family declaration
  #      is phase 5), so the containment proof does not regress at this boundary.
  #   7. The identity arithmetic move, ONE atomic commit: machine table and
  #      documented table together on the synced base — 170 -> 173 machine
  #      entries, 170 -> 173 documented rows, 169 -> 172 delivered rows, 68 -> 71
  #      two-segment allowlist members, `BASELINE_ROWS.length + 136` -> `+ 139`,
  #      the `merge` kind 9 -> 12 — with the seven identity pin sites, the
  #      pinned-count pages and the phrase-table rotation (`+ 136` joins the
  #      legacy forms, `+ 139` is published as live; `167` stays a banned stale
  #      total). The two-table sync check and the phrase-table check cannot be
  #      green with a split.
  #
  # TC allocation (8 of 48): TC-MRG-020 (absent token names reference, variable
  #   and operation), TC-MRG-021 (a credential condition is never the generic
  #   abort), TC-MRG-022 (an unresolvable work item names its own identity, ref
  #   and read operation), TC-MRG-026 (no row claims retryable over an
  #   act-requiring cause; derived from the delivered enumeration with a
  #   substituted pre-change row that must fail by name), TC-MRG-027 (a pending
  #   cause converges without an act and its remediation says so),
  #   TC-MRG-039 (canary secrets never reach output or records), TC-MRG-047 (the
  #   abort row declares `false` and the delivered convergence assertion moves,
  #   with the pre-change row as the mutation control), TC-MRG-048 (an explicit
  #   `--waive` still authorizes where a class binding exists; executed
  #   UNCHANGED in the delivered waiver suite — a gate entry, not a scope edit).
  #   ALLOCATED TO PHASE 4, NOT THIS PHASE (their last emitter lands there):
  #   TC-MRG-023 (the 22-cell matrix), TC-MRG-024 (its control), TC-MRG-025
  #   (`retryable` compared across all 22 cells). Every later phase re-runs the
  #   phase-2 suites and must not regress them.
  #   TC-MRG-038 is OWNED BY PHASE 7 and stays there. This phase authors 038's
  #   values (the tables, the seven pin sites, the count pages, the rotated
  #   phrase forms); phase 7 re-runs 038 over the reconciled documentation
