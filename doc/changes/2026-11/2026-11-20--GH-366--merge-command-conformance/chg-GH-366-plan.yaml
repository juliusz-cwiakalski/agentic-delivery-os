  # PHASE 6 — The merged report's evaluated gate projection, the output bounds,
  # the determinism sweep, and the golden-set contract closure.
  #
  # Goal (spec §10 telemetry, API-1..API-3, DM-2, AC-F2-8, AC-F5-1,
