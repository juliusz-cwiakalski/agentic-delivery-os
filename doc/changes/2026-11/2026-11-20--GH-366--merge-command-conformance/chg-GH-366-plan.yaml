  # ---------------------------------------------------------------------------
  # PHASE 3 — Change-branch resolution and the resolved-head binding.
  #
  # Goal (spec F-1, F-5's resolution half; Appendix A steps 1-6):
  #   1. The composition reads the change record (the delivered pm-notes text
  #      read the closeout composition already uses) and takes the `branch`
  #      declaration as the single source of the change branch (DM-1). No
  #      ambient read of the invocation checkout's branch; the branch-name
  #      parsing recovery is deleted with its failure mode.
  #   2. Absent, empty, whitespace/control-character or over-cap declaration ->
  #      `merge.branch-unresolved` at exit 1 naming the change-record path, the
  #      missing key and the command, with zero provider reads and zero landing
  #      calls (AC-F1-3, flow 2).
  #   3. The bounded open-request list resolves the request by EXACT
  #      provider-asserted source ref; zero matches, more than one match, or a
  #      match with no asserted head -> `merge.request-unresolved` with the
  #      matching closed reason, naming the resolved branch, its resolution
  #      source and the observed open-request count (AC-F1-4).
  #   4. The matched request's asserted head is the resolved head: the
  #      freshness envelope compares the record head against it, the landing's
  #      expected head is it, the check-run page is read on it, and the reported
  #      head is it. A record whose head is the integration base refuses
  #      `merge.gates-stale` at exit 1 with both SHAs and zero landing calls
  #      (AC-F1-5).
  #   5. The dry run shares exactly this resolution and appends exactly one
  #      verification record whose head is the resolved head, with zero waiver,
  #      transaction or git mutation (AC-F5-2, AC-F5-1's resolution half).
  #   6. The already-merged convergence case is matched by the invocation's
  #      change ref against merged requests, never by parsing a branch name.
  #
  # TC allocation (13): TC-MRG-001 (base-checkout invocation reports and verifies
  #   the request head), TC-MRG-002 (control: the pre-fix branch source
  #   reproduces the base-tip verdict), TC-MRG-003 (change-branch checkout at the
  #   request head lands once there), TC-MRG-004 (no usable declaration),
  #   TC-MRG-005 (zero matching open requests), TC-MRG-006 (two matching),
  #   TC-MRG-007 (matched request with no asserted head), TC-MRG-008 (record for
  #   the base tip -> both SHAs), TC-MRG-009 (the declaration is lint-opaque and
  #   value-faithfully preserved), TC-MRG-030 (dry run and real merge report the
  #   same resolved branch, request identity and head), TC-MRG-031 (a
  #   base-checkout dry run records the resolved head with zero mutation),
  #   TC-MRG-036 (the new suites are offline: no network, no child process, the
  #   existing no-live-call guards stay green), TC-MRG-037 (the merge path reads
  #   no ambient branch, proven by a production-source scan with a mandatory
  #   failing control).
  #
  # Mandatory controls in this phase: TC-MRG-002 proves the head assertion is
  #   sensitive (it fails against the pre-fix branch source); TC-MRG-037 plants
  #   the pre-fix read and requires the matcher to find it by file and line; the
  #   resolve-refusal fixtures must show zero provider reads for the
  #   branch-unresolved cell, which is the difference between a fail-closed
  #   refusal and a late one.
  #
  # Code areas: the composition's change-record read, request resolution and the
  #   deletion of the ambient read plus the branch-name parse; the transaction's
  #   resolved-branch/resolved-head inputs and its freshness/landing bindings;
  #   the command's resolved-object machine data; the human rendering of the
  #   resolution facts; the change-record `branch` declaration itself (this
  #   change's own record already carries it — DM-1, §19 seeding).
  #
  # Meta-suite obligations in this phase (test plan §7.3):
  #   - `tests/structure/merge-suite-obligations.test.ts`: `merge-production-
  #     composition` moves from GREEN to CHANGED with a declared obligation
  #     marker set; CHANGED/GREEN lengths move 9/7 -> 10/6; the population stays
  #     closed at sixteen; the bidirectional controls (a planted count, producer
  #     claim or scenario name failing by name, and no green suite asserting the
  #     new path) stay intact.
  #   - `tests/checks/merge-suite-discovery.test.ts`: the new suite
  #     `tests/checks/merge-branch-read-scan.test.ts` is registered and the
  #     pinned new-suite list moves 5 -> 6; the offline static scan and the CI
  #     topology pin are unchanged.
  #   - both export inventories register any new exported type/member this phase
  #     adds (resolved-branch/head inputs, any added port member), in this phase.
  #
  # Fixture obligation: the production-composition harness gains the
  #   base-checkout option (HEAD left on the integration base) without adding a
  #   provider read and without mutating the checkout (TC-MRG-031 asserts HEAD
  #   and its SHA are unchanged).
  #
  # Gate (targeted; expected exit 0):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm build
  #   bun test tests/behaviour/merge-production-composition.test.ts tests/behaviour/merge-dry-run.test.ts tests/behaviour/merge-landing.test.ts tests/behaviour/merge-verification-record.test.ts tests/behaviour/merge-freshness.test.ts tests/behaviour/pm-notes-lint.test.ts tests/behaviour/phase-write-path-lint.test.ts
  #   bun test tests/checks/merge-branch-read-scan.test.ts tests/checks/merge-suite-discovery.test.ts tests/checks/merge-deploy-no-live-calls.test.ts tests/structure/merge-suite-obligations.test.ts tests/structure/content-inventory.test.ts
  # ---------------------------------------------------------------------------
