phases:
  # ---------------------------------------------------------------------------
  # PHASE 1 — Planning: the three reserved decision records and their index rows.
  #
  # Goal: the governed design decisions this change executes are recorded before
  #   delivery code lands (spec Appendix C reserves the ids; the PM's intake
  #   decision reserves them in writing). The records are authored by
  #   `@decision-advisor`, never by delivery code: this phase declares their
  #   paths so the staging authority is explicit instead of assumed.
  #
  # Status semantics: SATISFIED ONCE AUTHORED. TDR-0071 and its index row are
  #   already on this branch. When all three records and their index rows are
  #   committed, this phase is a satisfied no-op — the coder verifies the paths
  #   are tracked, records plan phase 1 as SATISFIED in a pm-notes `notes:` entry,
  #   and proceeds to phase 2 without authoring, editing or recommitting a
  #   record. Until then, `@decision-advisor` authors the remainder (through the
  #   PM delegation) and this phase closes on their commit. Either way this phase
  #   writes no production code and commits no test change.
  #
  # The id prefixes are the contract and are reserved; the slug suffix is set by
  #   the record author. TDR-0071 is already authored on this branch as
  #   `TDR-0071-merge-change-branch-and-resolved-head-authority.md` with its
  #   index row; the two remaining records may take a different suffix, so the
  #   phase declares the `doc/decisions` folder as well as the known paths. Once
  #   each remaining record lands, its exact filename is added to `files` and the
  #   folder entry is dropped — a record filed under a different suffix is still
  #   this phase's work and is never silently skipped.
  #
  # Record content binds later phases:
  #   - the branch resolution and head binding record binds phase 3 (one declared
  #     source, no ambient fallback, request head is the resolved head);
  #   - the required-check authority record binds phase 4 (the reserved CI
  #     built-in becomes merge-applicable; the required set is the declared
  #     entries plus the repository-declared expected job set; one evaluator;
  #     fail-closed with the authored surface opt-out as the only remedy);
  #   - the refusal diagnostics record binds phase 2 and phase 5 (named causes,
  #     row-level retryability honesty, the narrowed abort row, the runtime
  #     family declaration and the totality proof).
  #
  # Gate (expected signal: exit 0, three records tracked, `doc/decisions` clean,
  #   no commit authored when the phase is a satisfied no-op):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git ls-files --error-unmatch <each record path>
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH git status --porcelain -- doc/decisions
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH bun run scripts/checks/memory-lint.ts
  # ---------------------------------------------------------------------------
  - id: 1
    title: "Land the three reserved decision records and their index rows (planning; satisfied once authored, no production code)"
    kind: planning
    summary: "docs(GH-366): reserved decision records for branch resolution, required-check authority and refusal diagnostics"
    scope:
      files:
        # The three reserved records (spec Appendix C). Authored by the decision
        # advisor on the PM's delegation; delivery code never re-authors them.
        # TDR-0071 is authored on this branch; its exact filename is pinned here.
        - doc/decisions/TDR-0071-merge-change-branch-and-resolved-head-authority.md
        # The two remaining records keep the reserved id prefix; their slugs are
        # set by the record author, so this phase also declares the folder prefix
        # until each filename exists (then the exact path replaces it).
        - doc/decisions/TDR-0072-required-check-authority-and-gate-membership.md
        - doc/decisions/TDR-0073-refusal-diagnostics-and-emitted-identity-totality.md
        # The one index row per record, in the same commit as the record.
        - doc/decisions/00-index.md
      folders:
        - doc/decisions

  # ---------------------------------------------------------------------------
  # PHASE 2 — Refusal identities and the diagnostics contract.
  #
  # Goal (spec F-3, F-4's vocabulary half; §18 "diagnostics first — they are the
  #   vocabulary the other capabilities report in"):
  #   1. Three additive rows: `merge.branch-unresolved`,
  #      `merge.request-unresolved` (closed reasons `no-open-request`,
  #      `ambiguous-open-request`, `head-unresolved`), `merge.work-item-unresolved`
  #      (AC-F3-4). Each row: category `user`, non-retryable, consequence
  #      `not_landed`, projection `user-validation` at exit 1, a remediation that
  #      names the object to repair.
  #   2. `merge.transaction-aborted` narrowed in cause, `retryable` and
  #      remediation: no credential condition, no unresolvable request, no
  #      unresolvable work item reach it, and its declared `retryable` plus
  #      remediation are true of every cause it still reaches
  #      (AC-F3-6, §8.5). Whether the narrowed row keeps `true` with an all-act-free
  #      cause set or moves to `false` is decided here and recorded in the row
  #      text and the documented table in this phase, and stated by the reference
  #      page in phase 7; the value and the remediation never disagree across the
  #      two phases' end state.
  #   3. Credential refusals name the credential reference AND the environment
  #      variable AND the operation that required them
  #      (`github-read`, `GITHUB_TOKEN`), exactly as the tracker family already
  #      does; a credential condition is never `merge.transaction-aborted`
  #      (AC-F3-2, AC-F3-3). A provider read fault names the failed operation
  #      (AC-F2-5's vocabulary half).
  #   4. `retryable` is always the emitted code's declared row value and never a
  #      per-instance value; every remediation is actionable or absent and never
  #      instructs clearing an unnamed condition (AC-F3-1, AC-F3-5).
  #   5. The composition's declared emittable set gains exactly the three new
  #      codes (the exact-member list stays exact; the runtime family declaration
  #      is phase 5), so the containment proof does not regress at this boundary.
  #   6. The identity arithmetic move 167 -> 170: machine table and documented
  #      table together, the seven identity pin sites and the phrase-table
  #      authority, and every pinned-count page. This is one atomic commit
  #      because the two-table sync check and the phrase-table check cannot be
  #      green with a split.
  #
  # TC allocation (6): TC-MRG-020 (absent token names reference, variable and
  #   operation), TC-MRG-021 (a credential condition is never the generic abort),
  #   TC-MRG-022 (an unresolvable work item names its own identity, ref and read
  #   operation), TC-MRG-026 (no row claims retryable over an act-requiring
  #   cause; derived from the delivered enumeration with a substituted pre-change
  #   row that must fail by name), TC-MRG-027 (a pending cause converges without
  #   an act and its remediation says so), TC-MRG-039 (canary secrets never reach
  #   output or records; the credential name is present, the value never).
  #   ALLOCATED TO PHASE 4, NOT THIS PHASE (their last emitter lands there):
  #   TC-MRG-023 (the 22-cell matrix), TC-MRG-024 (its control), TC-MRG-025
  #   (`retryable` compared across all 22 cells). Every later phase re-runs the
  #   phase-2 suites and must not regress them.
  #
  # Code areas: the machine error table (rows + the abort narrowing), the merge
  #   transaction's refusal mapping and evidence members, the composition's
  #   credential/read-fault naming and its exact emittable member list, the
  #   command's refusal-cause machine data, and the human refusal rendering.
  #
  # Meta-suite obligations in this phase: `merge-production-composition` stays in
  #   the closed population's GREEN set (it still carries its delivered
  #   inventory ids and asserts none of the banned tokens); the population stays
  #   at sixteen and no new suite is added here, so `merge-suite-obligations`
  #   and `merge-suite-discovery` are untouched until phase 3.
  #
  # No new identity, kind, exit or gate id is introduced in this phase: the three
  #   codes are values in an existing declared list. If the phase adds an exported
  #   type (a closed reason vocabulary, a cause-evidence member), both export
  #   inventories are registered in this phase — the rule every export-adding
  #   phase follows.
  #
  # Gate (targeted suites; expected exit 0):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm build
  #   bun test tests/behaviour/merge-refusal-surface.test.ts tests/behaviour/merge-refusal-taxonomy.test.ts tests/behaviour/merge-production-composition.test.ts tests/behaviour/merge-required-job-probe.test.ts tests/behaviour/merge-privacy.test.ts
  #   bun test tests/structure/merge-refusal-rows.test.ts tests/structure/error-table.test.ts tests/checks/error-table-sync.test.ts tests/checks/supervision-error-socialization.test.ts tests/checks/doc-conformance.test.ts tests/structure/ceremony-contract.test.ts tests/structure/dispatch-attempts-taxonomy.test.ts tests/behaviour/ceremony-nonregression.test.ts tests/structure/verify-gates-suite-map-contract.test.ts
  #   bun run scripts/checks/error-table-sync.ts
  # ---------------------------------------------------------------------------
  - id: 2
