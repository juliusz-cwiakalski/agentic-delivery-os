  # ---------------------------------------------------------------------------
  # PHASE 4 — Required-check enforcement on the resolved head.
  #
  # Goal (spec F-2, DM-3; §5.1 tables):
  #   1. `ci-green` becomes merge-applicable in the shipped default set, so the
  #      effective merge projection is two entries (`ci-green` and
  #      `tracker-freshness`). The entry-id sequence — and therefore the
  #      effective gate-set identity — does not change, so no in-flight record is
  #      invalidated (§8.5).
  #   2. The merge-applicable required-check set is derived once per invocation:
  #      every merge-applicable `required-ci-job` entry contributes
  #      `job ?? id`, and the merge-applicable `ci-green` entry contributes the
  #      repository-declared expected job set read through the SAME delivered
  #      expected-job read the battery uses. The page wins on state; the gate set
  #      wins on membership.
  #   3. Each required name is evaluated against the resolved head's check-run
  #      page through the single delivered `evaluateRequiredJobGate`. Failing /
  #      canceled / skipped / pending / missing / page-not-head / invalid
  #      expected set / CI read fault / credential condition each refuse by name
  #      and never pass (AC-F2-1..AC-F2-6). `recorded` and `probe` attributions
  #      stay the whole vocabulary.
  #   4. Admitted-surface contract data: the five built-in ids stay reserved and
  #      mandatory, a built-in's recipe and class are immutable, an omitted class
  #      adopts the shipped class, `ci-green` is admitted on `battery` or `both`,
  #      and the other four on `battery` alone (AC-F2-7). A declared
  #      `battery`-surface `ci-green` is the reviewed, documented check-gate
  #      opt-out; the check gate gains no waivability.
  #   5. The dry run discloses the evaluated required-check count and set size so
  #      an authored check posture is visible rather than silent.
  #   6. The full Appendix B refusal matrix closes here (phase 2 authored the
  #      vocabulary; this phase supplies the last emitters), and the per-invocation
  #      read budget closes with the last added read.
  #
  # TC allocation (16): TC-MRG-010 (one failing required check names check, gate
  #   and reason), TC-MRG-011 (all-green dry run verifies and the merge lands
  #   once, distinct from red), TC-MRG-012 (queued/running refuses with the
  #   pending reason), TC-MRG-013 (a page for another SHA is never head
  #   evidence), TC-MRG-014 (a CI read fault names the failed operation),
  #   TC-MRG-015 (a declared required job is enforced; an undeclared job is not
  #   evidence), TC-MRG-016 (built-ins reserved, mandatory, recipe/class
  #   immutable), TC-MRG-017 (admitted surface sets), TC-MRG-018 (invalid
  #   repository expected-job set refuses and never passes), TC-MRG-019 (the dry
  #   run discloses the evaluated required-check posture), TC-MRG-023 (all 22
  #   Appendix B cells name command, code and a cause), TC-MRG-024 (control: an
  #   unnamed cause or unnamed-remediation hint is flagged by name), TC-MRG-025
  #   (`retryable` is the emitted row's declared value across the matrix),
