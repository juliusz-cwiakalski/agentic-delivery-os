  #   and their goldens unchanged), TC-MRG-034 (the per-invocation read budget
  #   holds exactly), TC-MRG-040 (the two added reads are filesystem reads and
  #   there is no added polling or waiting).
  #
  # Mandatory controls in this phase: TC-MRG-013 runs the same bytes under two
  #   SHAs so "other head" is genuinely tested; TC-MRG-024's three-dimension
  #   control makes TC-MRG-023 non-vacuous; TC-MRG-025's source read for a
  #   per-instance `retryable` assignment carries a planted control; TC-MRG-034's
  #   read assertion is an exact multiset, not an upper bound.
  #
  # `evaluateRequiredJobGate` in `packages/core/src/domain/merge-probe.ts` is
  #   declared in scope as a NO-EDIT boundary: this change feeds it a wider
  #   required set and adds no second evaluator. `tests/checks/merge-check-path-
