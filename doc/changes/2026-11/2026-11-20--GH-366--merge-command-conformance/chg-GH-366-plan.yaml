  # ---------------------------------------------------------------------------
  # PHASE 3 — Change-branch resolution read at the request head, and the
  # resolved-head binding.
  #
  # Goal (spec F-1, F-5's resolution half, DEC-1/DEC-2; Appendix A steps 1-7;
  #   TDR-0071 ALT-6):
  #   1. TWO provider reads AT MOST, in a fixed order (spec v2.2's two-read
  #      ruling; discharges readiness iteration 3 finding 1 on the plan side).
  #      FIRST the one bounded open-request list read (the delivered read, with
  #      gate facts, which is also the request-detail read); it yields the open
  #      entries, the observed open count and whether the page saturated. The
  #      candidate set (point 2) is built from that page, and a NON-EMPTY candidate
  #      set is resolved without any convergence read. THEN, only when that
  #      candidate set is EMPTY ON AN UNSATURATED page — i.e. only where the open
  #      page offers nothing to resolve — AT MOST ONE bounded closed-request list
  #      read: the delivered merged-request read (`GET …/pulls?state=closed`), now
  #      filterable by the declared branch convention (supplied by the merge call
  #      in place of the delivered work-item-ref predicate, which stays closeout's
  #      filter) and exposing the match count/ambiguity (`0 | 1 | 2+`). No
  #      pagination, no retry, no fetch, no second closed read, never a closed read
  #      while a convention-matching open entry is the delivery request, and never
  #      a closed read before the open read.
  #      Convergence is decided on that attempt, BEFORE any change-record read: on
  #      an unsaturated closed page exactly one merged match whose source ref
  #      follows the declared convention replays from provider truth at exit 0 and
  #      reports `replayed=true` with the matched request's identity, performs zero
  #      change-record reads and zero record-read git invocations, reports neither
  #      `declared-at-head` nor `merge.branch-unresolved`, and lands nothing. A
  #      SATURATED closed page refuses `ambiguous-merged-request` on the same
  #      saturation rule as the open page (a truncated page cannot establish that
  #      the merged set is unique); on an unsaturated page two or more merged
  #      matches refuse `merge.request-unresolved` with `ambiguous-merged-request`
  #      — the merge path NEVER ranks, selects or scores among merged matches —
  #      and zero merged matches refuse `no-open-request` (AC-F1-6, TC-MRG-043,
  #      TC-MRG-049). This phase SUPERSEDES phase 2's placeholder routing of the
  #      two request-resolution returns; it does not re-add an abort cause.
  #      DECLARED SHARED-CONTRACT EDIT, NOT A CLOSEOUT CHANGE. The merged-request
  #      read is shared with closeout, so this phase edits the adapter
  #      (`packages/adapters/src/github/client.ts`) to add the convention filter
  #      and the count/ambiguity fact, and the additive optional members of the
  #      observation and input types in
  #      `packages/core/src/contracts/closeout.ts`. The convention itself is
  #      supplied from the one exported predicate (point 5) — the adapter compiles
  #      no third grammar of its own. The MERGE composition stops relying on
  #      `selectMerged`'s ranking and consumes the count instead. CLOSEOUT'S USE OF
  #      THE RANKING IS UNCHANGED: its default call keeps the delivered work-item
  #      filter and `selectMerged` selection byte-for-byte, and its regression is
  #      named in the gate below. `packages/cli/src/edge.ts` is a declared NO-EDIT
  #      BOUNDARY: its closeout wiring forwards the input and reads `.value`, so
  #      additive optional members require no change there, and an edit that
  #      re-decides closeout's merged-request behaviour is out-of-plan (NG-5).
  #   2. Candidate set = the open entries whose provider-asserted source ref
  #      matches the repository's declared branch convention for the ref, capped
  #      at `MERGE_BRANCH_CANDIDATE_MAX = 3`. SATURATION PRECEDENCE (stated here,
  #      where the candidate set is resolved): a bounded page that saturated
  #      refuses `ambiguous-open-request` BEFORE the candidate count is taken,
  #      even when zero convention-matching entries are on the page, because a
  #      truncated page cannot establish any uniqueness claim; on an unsaturated
  #      page zero candidates refuse `no-open-request` and more than three refuse
  #      `ambiguous-open-request`. A candidate whose asserted head is absent or is
  #      not a full hex SHA refuses `head-unresolved` and is never read
  #      (AC-F1-4). `merge.request-unresolved` carries four closed reasons after
  #      this phase: `no-open-request`, `ambiguous-open-request`, `head-unresolved`
  #      and `ambiguous-merged-request`. They partition by the page they are read
  #      from: `ambiguous-open-request` and `head-unresolved` from the open page,
  #      `no-open-request` and `ambiguous-merged-request` from the convergence
  #      attempt (point 1).
  #   3. Each candidate's change record is read AT THAT CANDIDATE'S OWN ASSERTED
  #      HEAD through the merge git seam: the bounded, fixed-argv local read
  #      (`ls-tree -r --name-only <sha> -- <pathspec>` to locate, then one
  #      bounded blob read), honouring `MERGE_CHANGE_RECORD_MAX_BYTES = 262_144`,
  #      with no shell, no network, no credential, no retry and NO FETCH. The
  #      seam's delivered `treeOf` is the precedent; the read runs through the
  #      injectable child runner so every suite stays offline. A head object the
  #      checkout does not hold is `record-unreadable`, not a fetch (NG-7,
  #      RSK-9).
  #   4. The delivered parse is REUSED UNCHANGED: `parsePmNotesText` from
  #      `packages/adapters/src/file/pm-notes-parser.ts` is applied to the text
  #      obtained from the head. No new parser, no second document acquisition,
  #      no working-tree record read. That file is a declared NO-EDIT reuse
  #      boundary: an edit that adds a parser or a second acquisition is
  #      out-of-plan.
  #   5. The branch-convention predicate is REUSED, NOT COPIED: the predicate the
  #      closeout resolution uses is module-private today (`branchConvention` at
  #      `packages/core/src/domain/closeout.ts:313-314`), so this phase EXPORTS it
  #      as a named predicate and imports it in the merge composition, which also
  #      SUPPLIES it to the merged-request read as the filter value. The second
  #      delivered copy in `packages/adapters/src/git/index.ts` is not forked, and
  #      neither the adapter nor the composition writes a third grammar; the
  #      convention narrows WHERE to look and never supplies the value.
  #   6. Acceptance is exact string equality between the record's `branch`
  #      declaration and that candidate's own provider-asserted source ref.
  #      Exactly one accepted candidate is the delivery request and the
  #      resolution source is `declared-at-head`; two or more accepted candidates
  #      refuse `ambiguous-open-request`. When no candidate is accepted the run
  #      refuses `merge.branch-unresolved` at exit 1 with exactly one reason from
