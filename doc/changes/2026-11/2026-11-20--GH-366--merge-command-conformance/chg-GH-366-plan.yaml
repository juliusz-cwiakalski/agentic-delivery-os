  #   the run evaluated (`gates=2/2` over `ci-green` and `tracker-freshness`, one
  #   line per entry with its verdict and reason) and does NOT echo the
  #   verification record's battery list; the record keeps its own five-entry
  #   list. The dry-run report states the same projection, and both reports also
  #   expose the resolved object phase 3 added — resolved branch, resolution
  #   source (`declared-at-head`) or `replayed=true`, matched request identity,
  #   observed candidate count, resolved head, evaluated required-check count and
  #   set size. Bounds hold (machine data <= 65 536 bytes, human <= 24 lines /
  #   <= 4 096 bytes, every dropped item marked `+N`), the determinism sweep is
  #   byte-identical across twenty runs for one success and six refusals with a
  #   changed-fact control that differs, and no record kind, key or event schema
  #   is added (EVT-2).
  #
  # The REPORT SHAPES live in `packages/core/src/contracts/merge.ts`
  #   (`MergeReport`, `MergeDryRunReport`). The resolved object is added there in
  #   phase 3 with the emitters that produce it; THIS phase changes what the
  #   report's gate list contains (the evaluated projection, not the record's
  #   battery list) and renders it. Any new exported member is registered in BOTH
  #   export inventories here (`tests/structure/content-inventory.test.ts` and
  #   `tests/fixtures/ports/v1-contract-inventory.json`), and
  #   `packages/core/src/contracts/index.ts` is scoped for the barrel re-export.
