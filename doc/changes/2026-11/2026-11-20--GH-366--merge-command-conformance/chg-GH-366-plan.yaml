  # ---------------------------------------------------------------------------
  # PHASE 5 — Runtime declaration of the gate family and the totality proof.
  #
  # Goal (spec F-4, G-5, AC-F4-1, AC-F4-2, NFR-7, DEC-7): give the composition a
  #   RUNTIME family declaration beside its exact-member list — the contract's own
  #   declared prefix, suffix and template plus the slot rule — so the
  #   composition's vocabulary states that a family emission is admissible. The
  #   totality proof then ranges over the runtime declaration (it fails by name
  #   when the declaration is removed) instead of matching source text.
  #   Constraints that bind this phase:
  #   - the classifier's delivered family resolution is untouched (no second
  #     resolver, no second vocabulary);
  #   - the gate-id slot stays validated against the EFFECTIVE declared gate set
  #     at emission; the pattern is never widened (RSK-6);
  #   - `merge.gate.ci-green.failed` — already in the derived population — stays
  #     the live proof case now that `ci-green` is merge-applicable from
  #     phase 4;
  #   - the proof performs no `readFileSync` of the composition and no
  #     prefix/suffix/type-name match; a behaviour-preserving refactor control
  #     still passes, so the proof follows the value and not a file;
  #   - the REMOVAL CONTROL is mandatory and is a VALUE substitution, never an
  #     in-place edit of committed source: (i) declaration deleted, (ii) replaced
  #     by the bare exact-member list. Both must fail BY NAME, naming the missing
  #     family declaration (and, for (ii), the missing slot rule);
  #   - a mismatch control still drives an undeclared code to the containment
  #     identity, so the assertion cannot pass vacuously (AC-F4-1, AC-F4-2).
  #
  # TC allocation (3 of 49): TC-MRG-028 (a gate refusal resolves to the declared
  #   family row with the gate id preserved), TC-MRG-029 (a live mismatch control
  #   still reaches containment; no slot widening), TC-MRG-045 (deleting or
  #   flattening the runtime declaration fails the totality proof by name, with no
  #   source-text assertion left to pass).
  #
  # This phase adds no row, no kind, no exit and no gate id (spec DEC-9): a
  #   declaration is not an identity. The declaration is a registered export, so
  #   both export inventories move in this phase. If the phase cannot express the
  #   family at runtime without touching the contract's family expression, that
  #   file is added here before editing; it is never edited out of scope.
  #
  # GOLDEN MOVEMENT IN THIS PHASE: NONE. The gate family's code template does not
  #   change, so a `merge.gate.<gate-id>.failed` refusal renders the same bytes;
  #   the suite still runs in the gate below as a regression, so an accidental
  #   change to a rendered refusal fails here by name instead of surfacing at the
  #   next phase boundary.
  #
  # Gate (targeted; expected exit 0):
  #   TMPDIR=$PWD/tmp/tmpdir PATH=$PWD/node_modules/.bin:$PATH pnpm build
  #   bun test tests/structure/defect-f1-merge-refusal-containment.test.ts tests/structure/merge-classification-conformance.test.ts tests/behaviour/merge-classification.test.ts tests/behaviour/merge-production-composition.test.ts tests/structure/content-inventory.test.ts
  #   bun test tests/golden/merge.test.ts
  # ---------------------------------------------------------------------------
