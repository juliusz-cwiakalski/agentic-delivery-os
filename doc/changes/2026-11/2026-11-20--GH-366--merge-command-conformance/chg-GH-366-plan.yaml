  # TC allocation (5 of 49): TC-MRG-033 (twenty runs byte-identical across one
  #   success and six refusals, changed-fact control differs), TC-MRG-035
  #   (machine and human output stay inside the declared bounds, omission marks
  #   asserted), TC-MRG-041 (no new record kind, key or event schema; shapes
  #   unchanged), TC-MRG-044 (the merged report renders the evaluated
  #   merge-applicable projection and never `gates=5/5`, with the substituted
  #   record list as the failing control), TC-MRG-046 (the complete rendering
  #   contract over the whole golden set: the three dedicated fields, the set's
