  # PHASE 3 — Change-branch resolution read at the request head, and the
  # resolved-head binding.
  #
  # Goal (spec F-1, F-5's resolution half, DEC-1/DEC-2; Appendix A steps 1-7;
  #   TDR-0071 ALT-6):
  #   1. ONE bounded open-request list read (the delivered read, with gate facts,
  #      which is also the request-detail read). Convergence is decided FIRST,
  #      from that same read: a uniquely matched merged request for the ref
  #      replays from provider truth and performs zero change-record reads and
  #      zero record-read git invocations (TC-MRG-043).
  #   2. Candidate set = the open entries whose provider-asserted source ref
  #      matches the repository's declared branch convention for the ref, capped
  #      at `MERGE_BRANCH_CANDIDATE_MAX = 3`; zero refuses
  #      `merge.request-unresolved` (`no-open-request`), more than three or a
  #      saturated page refuses `ambiguous-open-request`, and a candidate whose
  #      asserted head is absent or not a full hex SHA refuses
  #      `head-unresolved` and is never read.
  #   3. Each candidate's change record is read AT THAT CANDIDATE'S OWN ASSERTED
  #      HEAD through the merge git seam: the bounded, fixed-argv local read
  #      (`ls-tree -r --name-only <sha> -- <pathspec>` to locate, then one
  #      bounded blob read), honouring `MERGE_CHANGE_RECORD_MAX_BYTES = 262_144`,
  #      with no shell, no network, no credential, no retry and NO FETCH. The
  #      seam's delivered `treeOf` is the precedent; the read runs through the
  #      injectable child runner so every suite stays offline. A head object the
  #      checkout does not hold is `record-unreadable`, not a fetch (NG-7,
  #      RSK-9).
  #   4. The delivered parse is REUSED UNCHANGED: `parsePmNotesText` from
  #      `packages/adapters/src/file/pm-notes-parser.ts` is applied to the text
  #      obtained from the head. No new parser, no second document acquisition,
  #      no working-tree record read. That file is a declared NO-EDIT reuse
  #      boundary: an edit that adds a parser or a second acquisition is
  #      out-of-plan.
  #   5. The branch-convention predicate is REUSED, NOT COPIED: the predicate the
  #      closeout resolution uses is module-private today (`branchConvention` at
  #      `packages/core/src/domain/closeout.ts:313-314`), so this phase EXPORTS it
  #      as a named predicate and imports it in the merge composition. The second
  #      delivered copy in `packages/adapters/src/git/index.ts` is not forked and
  #      no third grammar is written; the convention narrows WHERE to look and
  #      never supplies the value.
  #   6. Acceptance is exact string equality between the record's `branch`
  #      declaration and that candidate's own provider-asserted source ref.
  #      Exactly one accepted candidate is the delivery request and the
  #      resolution source is `declared-at-head`; two or more accepted candidates
  #      refuse `ambiguous-open-request`. When no candidate is accepted the run
  #      refuses `merge.branch-unresolved` at exit 1 with exactly one reason from
  #      the closed six (`declaration-missing`, `declaration-unusable`,
  #      `declaration-disagrees`, `record-missing`, `record-invalid`,
  #      `record-unreadable`) chosen by the declared precedence, naming every
  #      read candidate's own cause and attempted tree path (≤ 3 entries)
  #      (AC-F1-3).
  #   7. The declaration cap is the pinned contract constant
  #      `MERGE_BRANCH_DECLARATION_MAX_CHARS = 256` characters (a longer value is
  #      `declaration-unusable`, never truncated); a 256-character value is
  #      accepted and a 257-character one is refused (TC-MRG-004).
  #   8. The matched request's asserted full-SHA head IS the resolved head: the
  #      freshness envelope compares the record head against it, the landing's
