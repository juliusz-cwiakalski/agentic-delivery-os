      blocker map named contracts/dispatch.ts as the type's home, but
      DispatchStatusData lives in contracts/dispatch-operator.ts — the map's
      error, the PM's binding design unchanged, the type edited in its real home
      (disclosed as scopeDrift). (2) lanes: QueueLane gains worktreePath;
      foldLanes accepts dispatchWorktreePaths (ref -> path) and CONTRIBUTES to
      existing rows only; edge readLanes injects the join source from the
      bounded retained-window read via the new app/dispatch-lane-view.ts helper
