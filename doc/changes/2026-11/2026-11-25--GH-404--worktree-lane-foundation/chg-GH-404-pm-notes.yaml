      plan declares a FOLDER scope for new test fixtures, place the fixtures
      inside that folder — a fixture beside its suite in an undeclared directory
      is a stray the commit primitive will silently exclude, and the boundary
      commit completes with a broken clean-checkout suite. The exclusion
