      verbatim). Join-only: rows are never minted; absence renders exactly as
      today on every surface (the DEC-8 byte-for-byte basis). Golden discipline:
      NO existing golden changed — existing fixtures seed no worktree context,
      so rendered output is byte-identical; the worktree lines are pinned by
