decisions:
  - text: "Scope split per CEO comment on GH-404 (2026-11-25): this ticket delivers
      the worktree foundation only — one lane at a time, the repository lease
      and the dispatch result pr-open are unchanged; parallel lanes (lease per
      lane, per-repository cap, second-lane admission, sync before the pull
      request, behind indicator, owner-number measurement) move to GH-412."
    date: "2026-11-25"
  - text: "Vocabulary per ODR-0006 / GH-406 (landed, main-tools tip e5ff0512): read
      every 'project', 'project repository' and 'project key' in the ticket as
      'product', 'repository' and 'product key'; command names, schema ids and
      field names keep their identifiers until GH-408; new code says cloneKey
      and declaredProductKey, never the bare projectKey; the naming check with
      its committed baseline runs in pnpm check."
    date: "2026-11-25"
  - text: "OQ-2 (spec) resolved as a PM decision, change-scoped and reversible,
      owner-visible at PR review: a pre-change lane whose lane record carries no
      worktree context resumes exactly as today in the main checkout (the
      disable-worktrees shape, spec F-8), never provisions a worktree, and
      completes/closes out under today's behaviour. Rationale: in-flight lanes
      must survive the upgrade; worktree context is additive (spec DM-1) so
      absence is detectable; the context-less population is transitional.
      Retroactive provisioning would swap a live lane's environment
      mid-delivery; refusing resume would hard-break in-flight deliveries. No
      separate decision record — the TDR-0077 reservation stays tied to OQ-1
      only."
    date: "2026-11-25"
open_questions:
  - text: "SETTLED IN PLAN (delivery_planning, DoR iter-1 cycle): the gates need the
      worktree's dependencies installed (pnpm install --frozen-lockfile) and the
      gate build done in the worktree before the first phase — declared as plan
      phase 4's provisioning contract. Remaining: record the timing MEASUREMENT
      as delivery evidence during phase 6 (NFR-9, TC-ENV-004 — no timing
      assertion). The GH-412 sync-commit choice is explicitly out of scope
      here."
    date: "2026-11-25"
