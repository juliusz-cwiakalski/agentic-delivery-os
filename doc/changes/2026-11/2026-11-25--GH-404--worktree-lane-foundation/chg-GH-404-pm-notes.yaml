  - text: "Retro (call-site class, fourth instance — now at the DATA-FLOW level):
      phase 7 declared the surfaces' thin command files + one renderer, but
      surface data is BUILT in domain folds and CONTRACT types — the render
      pipeline (contract type -> domain fold -> edge runtime -> command
      delegator -> renderer) is the real unit of declaration for any
      surface-facing phase. Combined with the three earlier instances, the full
      plan-authoring convention for this repo is now: declare (a) write sites,
      (b) binding chains (literal -> type -> assembly -> engine), (c) data-flow
      pipelines (contract -> fold -> runtime -> renderer) — three traces per
      surface-facing phase, one pass each, BEFORE declaring file lists. The
      coder's recon-to-line-precision pipeline keeps catching the gaps cheaply,
      but rev 7 should have been foreseeable at planning time from the spec's
      own DM-1 row (it named the surfaces)."
