      Evidence: TMPDIR=$PWD/tmp/tmpdir pnpm check green at the boundary —
      13/13 stages, bun test 12864 pass / 4 skip / 0 fail; gate log
      tmp/run-logs-runner/2026-11-25/053700-pnpm-check-gh404-lane-config.log
