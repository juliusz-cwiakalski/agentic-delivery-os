      tmp/run-logs-runner/2026-11-25/112857-phase7-gate.log — stages 1-3 and
      5-13 green; bun test 12863 pass / 4 skip / 1 known-deferred fail
      (TC-RELEASE-001 only). Hermetic surface probe verified: status renders the
