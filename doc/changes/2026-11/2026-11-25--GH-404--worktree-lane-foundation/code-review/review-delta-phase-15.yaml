  F-47:
    verdict: VERIFIED FIXED on the product runtime (Bun 1.4.4)
    evidence: >-
      mergeTree's body is cpSync(from, to, { recursive: true }); the statSync
      recursion is gone. Through the production closure: a date entry that
      sweep 1 preserved as a symlink refuses sweep 2 with the typed detail and
      leaves the linked directory intact; a child directory symlink with a real
      directory in the re-sweep refuses, target intact; a child file or
      directory symlink with a regular file in the re-sweep has the link
      replaced, target intact; a loose-file entry onto a symlink is replaced,
      target intact; a staged directory link lands as a link on both paths and
      its target's contents never materialize; a dangling link at a
      destination date entry is a typed refusal. Plain layouts still merge and
      verify (distinct, nested, same-named, empty directory). Scenarios 14a and
      14b green.
    residual: F-56 (runtime dependence, two unpinned shapes), F-58, F-59.
  F-48:
    verdict: ADDRESSED; remaining shapes carried
    evidence: >-
      Scenarios 15a, 15b, 15c, 15d green. Reproduced through the closure: file
      to directory, directory to file, a regular file at a destination date
      entry and a read-only date directory all give the typed refusal (entry,
      destination, reason, next action), sources intact, staging removed, the
      destination unchanged. New with the primitive and also safe: a same-named
      link in the re-sweep over an existing name of any kind refuses (link onto
      file: EEXIST; link onto link; directory link onto directory), and a
      dangling link at a date entry refuses with ENOTDIR from rename.
    residual: Those refusal shapes, reachable only with symlinks in the
      runner-log tree; F-57 on the reason text.
  15d:
    verdict: ACCEPTABLE deviation
    evidence: >-
      A same-named regular file at the destination is unlinked before the newer
      bytes are written (hard-link witness: new inode, the witness keeps the
      old bytes), so a read-only file is replaced and takes the source's mode.
      In isolation a copy that fails after the unlink leaves that name absent
      at the destination. In the closure an unreadable staged child cannot
      occur (the stage step has already read it); realistic causes are a full
      disk, an I/O error or a kill.
    judgment: >-
      Consistent with F-38's contract (a same-named file takes the newer
      bytes). The phase-14 EACCES refusal was an accident of open() on a
      read-only destination, not a protection any spec clause promises; the
      destination is product-owned state. The closeout now completes instead of
      wedging behind F-37's opaque error. The cost is the unlink window, which
      the sweep's refusal covers (sources intact, a retry restores it); it
      belongs to F-50's wording. No distinct log is lost unless an operator
      bypasses the refusal and deletes the worktree by hand.
  F-52:
    verdict: RESOLVED by the primitive
    evidence: >-
      Through the closure: a new 0o700 sub-directory on the merge path keeps
      its mode (and its 0o600 file keeps its mode).
  F-55:
    verdict: VERIFIED FIXED
    evidence: >-
      The changeset matches spec v1.1 and the code on every statement checked:
      provisioning after the lease and detached at the base tip (git worktree
      add --detach), no lane branch, the lane's own intake creates the delivery
      branch, install and gate build before any phase, PATH precedence for the
      provisioning children and the lane session, resume verification anchored
      on the work item ref, rollback on a failed provisioning, the context-less
      lane (DEC-8), the host-index pin, shared clone identity, provider landing
      with the deletion deferred to closeout, the bounded sweep with disclosed
      truncation and the gate scratch discarded, lane.worktree-root and
      lane.disable-worktrees in the catalog, the (repository, ref) join, the
      addWorktree seam, position-independent enumeration. None of the
      pre-review phrases remains (lane/<ref> branch, merge resolved from the
      worktree, gate-evidence sweep, ref-keyed join). Frontmatter identical to
      a34bbda4; the branch's only changed changeset; public examples are
      neutral and no legacy product name remains. TC-RELEASE-001 4 pass; the
      release file 7 pass.
    residual: >-
      Optional wording: "today's in-checkout behaviour" is time-relative for a
      changelog; "a delivery-convention branch" could add "matching the work
      item ref".
  F-50:
    verdict: CARRIED, wording extended
    evidence: >-
      Reproduced: a re-sweep carrying a same-named regular file and a
      same-named link updated the regular file at the destination and then
      refused on the link; sources intact; the retry refuses the same way until
      the link is removed.
    residual: >-
      Now also: the earlier same-named file is unlinked before the newer bytes
      land, so a failure in that window leaves the name absent until the retry.
