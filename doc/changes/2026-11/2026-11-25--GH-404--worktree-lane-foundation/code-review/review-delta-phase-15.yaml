findings:
  - id: F-56
    severity: low
    confidence: high
    category: security
    location: packages/cli/src/production.ts:2001
    owner: coder, two scenarios; optional ten-line hardening; otherwise a declared residual with owner visibility
    message: >-
      NEW in this delta, and a consequence of the fix this reviewer recommended
      in the phase-14 pass (verified there under Bun only). The merge's safety
      is a property of Bun's cpSync, not of the code. Under Bun 1.4.4, cpSync
      unlinks a destination symlink child before copying and refuses a
      directory onto a linked destination. Under Node 24.11.1 the SAME call
      writes through: a regular file staged over a file-symlink child
      overwrote the link's target outside the destination (target.log became
      NEWER), and a directory staged over a directory-symlink child created a
      file inside the linked directory. Node is not a supported runtime here
      (engines.bun 1.4.4, the bin shebang is bun, the installer requires bun),
      so this does not block. Coverage gap: the committed scenarios pin the
      entry-level link (14a) and link onto link (14b); neither pins the two
      child-level shapes on which the runtimes diverge, which are exactly the
      write-through shapes under the other runtime. The read-only-file
      behaviour pinned by 15d is also Bun-specific (Node refuses EACCES and
      keeps the old file).
    suggestion: >-
      Add two scenarios: an earlier file-symlink child with a regular file in
      the re-sweep (the link is replaced, the target untouched), and an earlier
      directory-symlink child with a real directory in the re-sweep (typed
      refusal, target untouched). Optionally make the merge runtime-independent
      with an lstat pre-flight that refuses a destination entry holding a
      symlink under any name the staged tree also carries. Note in the sweep's
      doc comment that the behaviour is Bun's.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-57
    severity: info
    confidence: high
    category: error-contract
    location: packages/cli/src/production.ts:2120
    owner: with F-37's classified projection; wording
    message: >-
      NEW in this delta. The refusal's reason is the last 400 characters of the
      error message. Bun puts the error class at the start and repeats the
      paths after it, so with realistic paths the class is cut: with a
      123-character entry path the reason starts mid-path and names neither
      EISDIR nor ERR_FS_CP (reproduced). The error object carries a stable code
      (ERR_FS_CP_DIR_TO_NON_DIR, ERR_FS_CP_NON_DIR_TO_DIR) and a path. Also the
      fixed next-action clause (remove or fix the named destination entry) is
      appended to rename failures where no destination entry exists, for
      example a read-only reference directory (reproduced: EACCES, rename); the
      reason still says what failed. The transaction-level projection drops the
      whole detail today (F-37), so this matters only once F-37 is fixed.
    suggestion: >-
      Lead the reason with the error code when present, or keep the head of
      the message; say "or its parent directory's permissions" for rename
      failures.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-58
    severity: info
    confidence: high
    location: packages/cli/src/production.ts:2094
    owner: note for the next touch; declared residual
    message: >-
      PRE-EXISTING since phase 13 and not changed by this delta; recorded now
      because the suite and the lstat verifier pin it as the contract. The
      stage step and the new-entry path preserve a symlink as a link, and Bun
      turns a relative target into an absolute one. A link whose target is
      inside the worktree dangles once the worktree is removed; a link to
      anywhere else keeps pointing at a live file outside the state root. The
      sweep reports swept true. Reproduced: a date entry that is a symlink is
      preserved as that link; a relative link to a worktree file lands as an
      absolute link into the worktree. No log inside the runner-log tree is
      lost (a real file is copied in its own right); the preserved tree is
      just not self-contained. No product path writes a link there.
    suggestion: >-
      Next touch: refuse a symlink in the runner-log tree at the stage step
      with the typed refusal, or copy the target when it lies inside the tree.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-59
    severity: info
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:2033
    owner: wording or one token, next touch
    message: >-
      NEW in this delta. The verifier is strict for links (a link with the
      identical target string) and for directories (a directory, recursed). For
      a staged regular file it requires only a non-directory of equal lstat
      size, so a symlink standing where a regular file was staged passes when
      the target string's length equals the file size. Unreachable under Bun
      with the primitive (the link is replaced first); it is the check that
      would have caught the Node behaviour in F-56.
    suggestion: >-
      Add !placed.isSymbolicLink() to the file arm.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-60
    severity: info
    confidence: high
    category: plan-compliance
    location: doc/changes/2026-11/2026-11-25--GH-404--worktree-lane-foundation/chg-GH-404-plan.yaml:1121
