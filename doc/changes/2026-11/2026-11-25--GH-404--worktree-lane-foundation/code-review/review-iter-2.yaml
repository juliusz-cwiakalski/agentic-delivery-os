  owner: plan phase 13 (Code Review Remediation, iteration 2)
  message: 'BLOCKING. The lane-log sweep writes to `<state root>/closeout-lane-logs/<ref>` and then verifies the
    WHOLE destination against this sweep''s copy (entry count and recursive bytes, production.ts:2010-2020). The
    destination is never cleared, so any later sweep of the same ref with new entries fails with `closeout.lane-log-sweep-failed`
    on every retry and closeout refuses the worktree removal for good. Reproduced with the production closure over
    dispatch-provisioned worktrees: the ref''s second lane after `git worktree remove` and a fresh dispatch (the
    suite''s own scenario-6 shape) fails with ''copied 1 entries / 16 bytes, verified 2 / 32'' (later date) and
    ''copied 1 / 25 bytes, verified 2 / 57'' (same date); one lane swept twice with new logs in between fails with
    ''copied 1 entries / 44 bytes, verified 1 / 64''; the detail says the logs are ''not retrievable'' while they
    are. Introduced by the remediation (the previous sweep compared nothing); the new suite stops before a second
    closeout.'
  suggestion: 'Give each sweep a clean destination per entry: copy to a staging sibling and replace `destination/<entry>`
    atomically, then verify only the entries this sweep placed (placed bytes equal to the measured source bytes);
    older differently named entries may stay. Add production-composition scenarios for a second lane of the same
    ref and for one lane swept twice.'
