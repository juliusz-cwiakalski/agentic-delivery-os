summary: 'Iteration-1''s two blocking and four major findings are fixed in the tree and I reproduced each fix through
  the production composition: resume after the delivery branch exists, the session''s PATH and TMPDIR on spawn and
  on resume, the rollback, the detached worktree, the byte-for-byte squashLand revert, and the whole lane end to
  end (dispatch; verify gates and merge in the worktree with the deletion deferred; closeout --apply removing the
  worktree, sweeping the runner logs and deleting the branch) when `tmp/` is ignored, as in this repository. FAIL
  rests on three new production defects in the remediated code, none visible to the committed suites: the sweep''s
  destination is keyed by ref and verified as a whole, so a second sweep of the same ref (the re-dispatch the remediation
  itself supports, or one lane swept twice) fails forever and wedges closeout; the F-8 fix sits behind a plan-time
  safety predicate that still refuses a lane worktree as dirty before the sweep when the repository does not ignore
  `tmp/`; and the F-7 key change left the board without any worktree path, because the board names a repository
  by its derived key while the lane record carries the origin identity. The declared residuals F-9 (error-row prose)
  and F-17 (out of scope) are acceptable to carry into the pull request with owner visibility; the minimal remediation
  is one small phase that needs no new decision.'
