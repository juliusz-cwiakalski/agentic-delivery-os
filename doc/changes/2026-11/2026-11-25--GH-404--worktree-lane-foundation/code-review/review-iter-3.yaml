  - id: F-38
    severity: medium
    confidence: high
    category: spec-compliance
    location: packages/cli/src/production.ts:2057
    owner: coder, recommended in the same remediation; otherwise a declared residual with owner visibility
    message: >-
      (NFR-5 "0 silent log loss".) The per-entry replace deletes an earlier sweep's preserved logs
      whenever one ref is swept twice for the same date, silently. A runner-log entry is a date
      directory; the second sweep's same-named entry holds only what was written after the first
      sweep removed its sources, and `rmSync(destination/<entry>)` discards everything the first
      sweep preserved while the step reports `swept: true, truncated: false, omittedBytes: 0`.
      Reproduced through the production composition in both shapes iteration-2 F-18 named: one lane
      swept, refused, then re-swept (090001-phase-gates.log and 090002-commit-range-lint.log gone,
      only 100003-after-cleanup.log left) and two lanes of one ref closed out on one date (lane 1's
      two files gone). The single-sweep path is unaffected. Reachability is narrow: a retried
      closeout after a refused removal with new same-date logs, or a second landing of one ref
      outside `merge`, which refuses a second landing by design. The replace step is what my
      iteration-2 suggestion for F-18 asked for; it was under-specified for date-named entries.
    suggestion: >-
      Merge the staged entry into the destination entry (a recursive copy keeps the existing files)
      and verify per placed file (each staged file exists at the destination with equal bytes),
      keeping the staging sibling and the atomic rename for new entries; or place each sweep under
      a unique name. Add a same-date scenario with distinct file names; scenario 9 pins the
      replacement using one same-named file.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
