summary: >-
  Iteration-2's three blocking highs are fixed on the production path and I reproduced each fix:
  a second sweep of one ref and a worktree swept twice both succeed (scenarios 8 and 9, and end to
  end through the real CLI), a repository that does not ignore `tmp/` plans and applies the cleanup
  while real dirt outside the swept paths is still refused before anything moves (scenario 7 plus a
  control), and the board renders each lane's worktree path from that repository's own store
  (scenario 12 plus a two-repository board over real stores). FAIL rests on the tree itself. The
  phase-13 commit leaves `pnpm test` red: its two `deliver-ticket` literals trip the committed
  no-shell invariant (three tests) and the new contract export is missing from the v1 contract
  inventory (one test); a phase-12 assertion that Decision 1 retired is red as well (one test).
  None of these suites was in the phase's targeted set, and the inventory and structure suites were
  not in mine for iteration 2. Two further mediums are new or newly load-bearing: every refused
  sweep reaches the operator as a transient, retryable "provider write did not land" with its
  detail dropped, and the per-entry replace silently deletes an earlier sweep's same-date logs.
  Iteration 3 is exhausted; the change requires human adjudication of one narrow question (how
  `tmp/deliver-ticket` is treated against the no-shell invariant) before a small remediation commit.
