findings:
  - id: F-47
    severity: low
    confidence: high
    category: security
    location: packages/cli/src/production.ts:1995
    owner: coder, recommended before quality gates; otherwise a declared residual with owner visibility
    message: >-
      NEW in this delta. mergeTree classifies with statSync, which follows symlinks, so the
      merge arm of the sweep reads and writes through them. Reproduced with the production
      closure, same inputs against HEAD~1 and HEAD: (1) a directory symlink placed by an
      earlier sweep and re-targeted before the re-sweep: the earlier target's same-named file
      is overwritten (victim.log VICTIM-ORIGINAL before, ATTACKER-BYTES after); (2) the date
      entry itself a symlink from the first sweep: the second sweep creates a file inside the
      linked directory, outside the state root; (3) a directory symlink new in the re-sweep:
      the link target's contents are copied into the destination as a real directory. Before
      the delta the replace step removed the link itself and wrote nothing through it. The
      verification passes in every case because placedFilesMatch also follows links.
      Reachability: requires a symlink under the lane's tmp/run-logs-runner; no code in
      packages/*/src creates one, and the tree is written by the runner agent as plain log
      files. No privilege is gained by a same-user actor, so this is hardening, not a
      vulnerability.
    suggestion: >-
      Recurse on lstat and copy a link as a link, or let the primitive do it: replace the
      mergeTree body with cpSync(from, to, { recursive: true }). Verified in isolation under
      Bun 1.4.4: it merges nested trees and keeps the earlier files, it refuses (EISDIR)
      instead of writing through a symlinked destination directory, and it copies a staged
      directory symlink as a link. Add the three shapes as scenarios. Fixing it now avoids a
      second full gate run after quality_gates.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-48
    severity: low
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:2090
    owner: coder with F-47, or a declared residual
    message: >-
      NEW in this delta. Four shapes succeed at HEAD~1 and are refused at HEAD, each on every
      retry: a same-named child that was a file in the earlier sweep and is a directory in
      the re-sweep (EEXIST from mkdirSync), the reverse (ENOTDIR from cpSync), a
      non-directory at destination/<date> where a new date entry lands (EEXIST), and a
      read-only file from the earlier sweep with a same-named file in the re-sweep (EACCES).
      Every refusal is safe: sources intact in the worktree, staging removed, code
      closeout.lane-log-sweep-failed. The operator sees only F-37's transient retryable
      closeout.write.failed, so a deterministic refusal invites retries. Runner logs are
      date directories of flat log files, so no product path writes any of the four shapes.
    suggestion: >-
      With F-47: on a type mismatch unlink the destination child before copying, and
      classify the remaining refusals with the path and the next action (F-37's fix).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-49
    severity: low
    confidence: high
    category: correctness
    location: packages/cli/src/edge.ts:2422
    owner: declared residual; closes with F-40 or F-37
    message: >-
      Consequence of F-34's removal, end to end through the CLI. tmp/deliver-ticket is
      neither excluded nor removed now. In a repository that ignores tmp/ the directory goes
      with the worktree and closeout succeeds. In a repository that does not ignore tmp/, an
      untracked tmp/deliver-ticket/<ref>.log still plans would-apply, because git's
      tmp/*.log pathspec matches at any depth, and closeout --apply then refuses AFTER the
      sweep (exit 2, closeout.write.failed, retryable): the runner logs are preserved at
      the destination and the worktree is retained on every retry. At HEAD~1 that shape
      completed (read from the HEAD~1 source: the directory was excluded at plan time and
      removed by removeEphemeral; not re-run end to end). The typed lane never writes the
      directory (it is the shell fallback's output), so this is F-37's masked-dirt family,
      now one member wider: the plan-time exclusion is deeper than the sweep's non-recursive
      removal.
    suggestion: >-
      Make the removal match the exclusion (recursive *.log removal, F-40's fix) or the
      exclusion match the removal; until then name the plan-versus-apply disagreement in
      F-37's residual text.
    suppressed: false
    published_url: null
    published_at: null
