    location: packages/cli/src/production.ts:2073
    owner: doc-sync re-run (F-45); no code change
    message: >-
      The cap bounds what ONE sweep places, not the merged entry. Reproduced: three same-date
      sweeps of 31 MiB each place 65,011,712 and then 97,517,568 bytes under the
      33,554,432-byte cap, each reporting truncated false and omittedBytes 0. The control
      holds (two 20 MiB dates in one sweep: the second omitted, 20,971,520 bytes). A ref's
      destination was already unbounded across sweeps for distinct dates; the merge extends
      that to one date entry. Growth equals real distinct log bytes, so nothing is
      duplicated. DEC-11's byte-capped is true per sweep and should say so.
    suggestion: >-
      State in DEC-11 and the feature spec that the cap applies per sweep, not to the
      destination's total.
