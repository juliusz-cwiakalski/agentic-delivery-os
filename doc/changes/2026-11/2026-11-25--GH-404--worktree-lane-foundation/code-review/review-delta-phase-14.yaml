summary: >-
  Delta pass over the phase-14 commit a34bbda4 (the iteration-3 delta remediation), not a
  new full iteration. VERDICT: APPROVE to proceed to quality gates. The four addressed
  findings hold on the tree and by reproduction: the two shell-fallback literals are gone
  from every source file while the no-shell invariant, its empty allowlist and its three
  suites are untouched on the whole branch; the contract export is in both inventory lists;
  the retired branch assertion is replaced by an absence assertion; a same-date re-sweep now
  preserves the earlier sweep's files, at closure level and end to end through the CLI. The
  five previously red tests are green on HEAD. The merge step that F-38 introduced is sound
  for the layouts the product writes and adds four narrow behaviours that need an on-disk
  shape nothing in the product creates: it follows symlinks (a write through a symlinked
  directory kept from an earlier sweep, reproduced before and after), it refuses where the
  replaced step succeeded (type conflict, a non-directory at a date entry, a read-only
  earlier file), and it is no longer atomic per entry. None blocks the gate run. One
  out-of-delta observation: the GH-404 changeset still describes the pre-review design and
  should be corrected before the pull request.
