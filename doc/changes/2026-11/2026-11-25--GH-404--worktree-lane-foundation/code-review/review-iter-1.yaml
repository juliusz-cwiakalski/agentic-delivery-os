  location: packages/cli/src/production.ts:3313
  message: 'BLOCKING (NFR-5 ''0 log loss'', AC-F6-1 / ticket AC5 ''the lane''s logs are swept first''). The closeout sweep moves the wrong tree: its source is exactly <worktree>/tmp/tmpdir, which the product''s own runner contract defines as ad-hoc SCRATCH (.opencode/agent/runner.md:21,26: logs go to ./tmp/run-logs-runner/<date>/). A lane''s gate logs, tmp/*.log build logs and tmp/deliver-ticket are siblings of tmp/tmpdir and are destroyed by worktree removal (proven: git worktree remove deletes ignored files without --force). Meanwhile the scratch is copied synchronously and permanently into <state root>/closeout-lane-logs/<ref> with no bound and no pruning; this checkout''s tmp/tmpdir measures 2.9 GB across 74,022 entries after this change''s own delivery, against 20 MB of real logs. The ''verify at the destination'' check (production.ts:3326) only tests that the directory the same function just created exists. The production closure is exercised by no suite (TC-CLOSEOUT-002 injects a
    fake sweep). Owner: plan phase 6; plan rev 6 conflated ''lane logs'' with the gate temporary directory.'
  suggestion: Sweep the declared log set (tmp/run-logs-runner, tmp/*.log, tmp/deliver-ticket) with a size/entry bound and a real verification (compare file count/bytes); let tmp/tmpdir and node_modules be deleted with the worktree. Pin the production closure with a real-file test and correct F-6 / NFR-5 wording and feature-closeout.md:188 ('bounded directory artifact').
