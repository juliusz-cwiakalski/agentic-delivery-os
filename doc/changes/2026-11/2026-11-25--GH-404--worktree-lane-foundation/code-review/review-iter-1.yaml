  location: packages/cli/src/production.ts:4323
  message: 'BLOCKING (ticket AC2, AC-F4-1, G-4, F-4). Operator resume of a worktree lane is refused once the lane has created its delivery branch. The reuse arm verifies the recorded worktree is on the provisioning branch lane/<REF> (packages/core/src/domain/lane-worktree-plan.ts:79), but the lane''s own lifecycle necessarily moves the worktree to <type>/<REF>/<slug> (this repository''s AGENTS.md convention and the only branch form the merge transaction resolves). Proven in the real production composition (dispatch -> worktree provisioned on lane/GH-901 -> lane creates feat/GH-901/some-slug -> operator resume): dispatch.session.spawn-failed ''lane-worktree-branch-mismatch ... is on feat/GH-901/some-slug, not the lane branch lane/GH-901'', exit 1, zero session calls; the control with the worktree still on lane/<REF> resumes. Nothing tells the lane which branch to stay on (lifecycle prompt and AGENTS.md are silent). TC-RESUME-001/002/003 test planLaneWorktreeResume, which has zero production
    consumers (the port re-implements the check inline). Owner: plan phases 4-5, after a PM decision on the lane branch model.'
  suggestion: 'Decide and record the branch model: either provision detached (no lane/<REF>) or record the lane''s actual delivery branch on the lane record, and verify resume against the convention branch <type>/<REF>/... (never base, never detached); tell the lane in the lifecycle prompt / AGENTS.md. Add a production-composition suite that drives dispatch -> branch creation -> resume.'
