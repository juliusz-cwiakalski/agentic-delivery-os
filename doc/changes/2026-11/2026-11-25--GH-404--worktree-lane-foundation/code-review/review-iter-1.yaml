  message: 'MAJOR. The worktree, its lane/<REF> branch and the lane record have no failure or terminal ownership. (a) When addWorktree succeeds and a later step fails (gate temp dir, install, build) nothing is rolled back and no record carries the path: proven in the production composition, a failed install leaves the worktree registered on lane/GH-902 and both later dispatches of that ref are refused with worktree-add-refused even after the environment recovered. (b) After closeout removes the worktree the newest lane record still carries worktreePath, so the next dispatch of the ref is refused with lane-worktree-missing (''restore it or close the lane out'') - proven. (c) lane/<REF> matches neither closeout''s branch convention (packages/core/src/domain/closeout.ts:336 needs three segments) nor any other cleanup, so one branch leaks per work item. Owner: plan phases 4-6.'
