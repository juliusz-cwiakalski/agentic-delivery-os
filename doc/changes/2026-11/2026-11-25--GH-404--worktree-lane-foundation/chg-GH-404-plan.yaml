schemaVersion: delivery.plan.v1
workItemRef: GH-404
tier:
  name: full
  escalationTriggers:
    - "a non-zero output delta on any exception-mode pin (TC-REG-001, F-8, NFR-4, DM-4) is a change DEFECT: the exception-mode goldens capture PRESERVED data — today's pre-change behaviour — and are never regenerated to match drift; stop, fix the conditional rendering or provisioning branch that leaked worktree state into the exception path, re-run; a golden update is never the remedy"
    - "a host-index entry whose root is observed as a worktree path, or a live clone's entry pruned after a worktree removal plus a maintenance pass (TC-HOSTIDX-001/002, F-5, NFR-6, DM-2) is a change DEFECT: stop — the registration pin to the main checkout is the contract; a fixture relaxation is never the remedy"
    - "a worktree removal observed before the merge is confirmed, or a lane log lost by the closeout sweep (TC-CLOSEOUT-002/003/005, F-6, NFR-5) is a change DEFECT: stop — the ordering is the contract; both closeout mutants must stay red, and weakening a mutant or its assertion is never the remedy"
    - "a force flag, a shell invocation, a retry, a fallback, or an override path observed anywhere in the addWorktree create path (TC-WT-002, F-1, NFR-1) is a change DEFECT: stop — a git refusal is surfaced as a refusal; the source-scan canary must stay green and its planted canaries must stay contained"
    - "a pre-existing suite that cannot be greened without renaming a base-delivered identifier, changing clone-identity or state-root derivation, or weakening an assertion is evidence of a forbidden change (NG-2..NG-5, DEC-4): stop and report to PM via a pm-notes notes entry; never weaken or delete the assertion to go green — identifiers stay until GH-408 and the derivation is pinned, not altered"
    - "a lane whose record carries no worktree context being provisioned a worktree at resume (TC-RESUME-003, DEC-8) is a change DEFECT: stop — context-less lanes resume exactly as today in the invoking checkout, including this change's own lane; retroactive provisioning is never the remedy"
# ---------------------------------------------------------------------------
# Title (tracker title, adopted verbatim): M4-S36: A work item's whole
# lifecycle runs in its own worktree (default on) (M4)
#
# Plan-level decision record (spec §15 DEC-1..DEC-8): the governing scope is
# the CEO comment on GH-404 dated 2026-11-25, comment 5 of 5 (DEC-1); the
# scope split reserves parallel lanes and their satellites for GH-412
# (DEC-2); worktree lanes are default-on with the disable-worktrees exception
# as the escape hatch (DEC-3); the GH-406 vocabulary governs the prose and
# identifiers stay until GH-408 (DEC-4); worktree means a LINKED worktree
# only (DEC-5); the gate temporary directory lives inside the lane's worktree
# and the pm-notes evidence keeps the literal $PWD/tmp/tmpdir (DEC-6); a
# decision record from this change, if ever written, is TDR-0077 as Proposed
# with decision_date null (DEC-7); a pre-change context-less lane resumes
# exactly as today (DEC-8).
#
# OQ-1 SETTLED IN THIS PLAN (rev 1) — the ticket's settle-during-planning
# item. What the gates need in a fresh worktree, declared as the provisioning
# contract of phase 4 and executed strictly before the first phase
# (clarify_scope):
#   1. dependencies installed in the worktree from the committed lockfile
#      (pnpm install --frozen-lockfile, the workspace's pinned package
#      manager);
#   2. whatever the gates need built, built in the worktree (the build the
#      aggregate gate consumes);
#   3. the gate temporary directory created inside the worktree — the
#      evidence keeps the literal $PWD/tmp/tmpdir because the lane's working
#      directory IS the worktree (DEC-6).
# The TIMING MEASUREMENT (what it cost, how long) is delivery evidence
# recorded in the change pm-notes during delivery (NFR-9, TC-ENV-004) — no
# suite asserts any duration and no threshold is imposed. No decision record
# is authored for this settlement: it is this plan's declared phase 4,
# owner-visible at PR review; the TDR-0077 reservation stays unused unless
# delivery reveals a decision-worthy provisioning choice.
#
# F-10 FORM CHOSEN IN THIS PLAN (DEC-5 directs the plan to choose): the
# linked-worktree enumeration and the branch-checked-out-elsewhere check are
# made POSITION-INDEPENDENT in phase 3 — linked-only membership is decided
# structurally (a porcelain block is the main checkout exactly when its git
# directory is the repository's common directory), never by list position —
# and the guard test proves order-insensitivity by shuffling fixture block
# order. Rationale: it removes the git-version brittleness (RSK-5, RSK-T2)
# instead of pinning it. The positional-pin alternative stays the documented
# fallback (spec §7.3) should implementation reveal a git-version constraint;
# both forms satisfy AC-F10-1 / NFR-8.
#
# Constants fixed by this plan (spec F-2/F-3, DM-1..DM-5, NFR-6/NFR-7;
# delivery conventions per pm-notes):
#   - worktree path scheme:  <worktree-root>/<checkout-basename>-<ref>; the
#                            default worktree-root places the worktree as a
#                            SIBLING of the main checkout; created on a NEW
#                            branch at the tip of the base branch; all paths
#                            resolved from the clone's PHYSICAL location
#                            (real path), never through a symlinked alias
#   - provisioning steps:    install (pinned lockfile) -> gate build -> gate
#                            temp dir inside the worktree -> lane environment
#                            derived (the worktree's node_modules/.bin leads
#                            PATH) — all before the first phase
#   - lane record context:   the dispatch.lane record gains its worktree
#                            context ADDITIVELY (DM-1); absence of the
#                            context is the detectable pre-change /
#                            disable-worktrees shape (DEC-8); nothing
#                            migrates (spec §19)
#   - evidence literal:      $PWD/tmp/tmpdir — the convention string is
#                            unchanged; its physical resolution anchors to
#                            the lane's worktree (DEC-6)
#   - suite file names:      pinned VERBATIM from test plan §7 with ONE
#                            settlement — §7 left the enumeration-guard file
#                            open between tests/structure/ and
#                            tests/behaviour/; this plan pins
#                            tests/behaviour/git-adapter-worktree-enumeration.test.ts
#                            (the adapter suites exercising temp git
#                            repositories live in tests/behaviour per the
#                            test plan's own layer mapping, §4): the new
#                            suites are
#                            tests/behaviour/git-adapter-worktree-seam.test.ts,
#                            tests/checks/worktree-seam-house-style.test.ts,
#                            tests/behaviour/git-adapter-worktree-enumeration.test.ts,
#                            tests/behaviour/dispatch-worktree-lifecycle.test.ts,
#                            tests/behaviour/host-index-worktree-pin.test.ts;
#                            the updated suites are exactly §7's Existing -
#                            Update rows
#   - exception-mode pins:   golden cases or fixture files under
#                            tests/golden/ pinning today's preserved output
#                            for the disable-worktrees mode (TC-REG-001)
#   - changeset:             .changeset/gh-404-worktree-lane-foundation-minor.md
#                            declaring the five fixed-group packages
#                            (@delivery-os/core, @delivery-os/adapters,
#                            @delivery-os/cli, @delivery-os/mcp,
#                            @delivery-os/opencode) at minor (spec front
#                            matter version_impact: minor; lockstep config)
#
# Plan-wide delivery fences (binding), in force on every phase below:
#   - Zero-rename fence (NG-4, DEC-4): no base-delivered command name,
#     subcommand, payload field, configuration key, or schema id is renamed,
#     removed, or re-keyed anywhere in this change; the two new worker
#     settings are ADDITIVE keys; new code names the clone identity
#     cloneKey and the declared product key declaredProductKey, never the
#     bare legacy token — the GH-406 naming check with its committed
#     baseline runs in pnpm check and governs every new file from birth.
#   - Non-goal fence (NG-1..NG-7): no parallel lanes, no per-lane leases, no
#     per-repository cap, no second-lane admission (GH-412); the repository
#     lease is unchanged — claimed before any provisioning, one lane at a
#     time (NG-2); the dispatch result pr-open semantics unchanged (NG-3);
#     no sync-before-PR and no behind indicator (NG-6); clone-identity and
#     state-root derivation unchanged — pinned by fixture (TC-IDENT-001),
#     altered nothing (NG-5); no per-lane spend (GH-378/GH-412) and no
#     planning-horizon change (NG-7 / GH-407).
#   - DEC-8 fence: a lane whose record carries no worktree context never
#     provisions a worktree at resume and completes and closes out under
#     today's behaviour, in the invoking/main checkout. THIS CHANGE'S OWN
#     LANE is such a lane: GH-404 is delivered in the main checkout, and its
#     lane record predates DM-1 — if it is resumed mid-delivery after phase 4
#     lands, DEC-8 keeps it in the main checkout. The first worktree lane is
#     the next lane dispatched after this change's PR lands.
#   - Byte-for-byte fence (F-8, NFR-4): with the disable-worktrees setting
#     set, dispatch, resume, dispatch status, lanes, board, merge and
#     closeout behave byte-for-byte as today; the exception path is a
#     first-class tested mode (TC-REG-001/002), never a dead branch.
#   - Lease-order fence: the repository lease is claimed before any worktree
#     provisioning, exactly as today (TC-WT-003 asserts the order).
#   - Physical-path fence (NFR-7): worktree creation, sibling placement and
#     host-index registration resolve from the clone's physical location —
#     zero resolutions through a symlinked alias (TC-WT-005 proves it with a
#     symlink strictly inside the harness's own temp workspace).
#   - Green-boundary / conditional-sweep fence: every phase below is ONE
#     commit through the commit primitive on branch
#     feat/GH-404/worktree-lane-foundation, and each phase boundary is green
#     under TMPDIR=$PWD/tmp/tmpdir pnpm check (narrow suites during
#     iteration; the full gate at the boundary). Phase 4 turns worktree
#     lanes on by default, so pre-existing suites whose pins assert today's
#     in-checkout behaviour (resume economics, gate evidence, goldens) may
#     trip THERE: any such tripped pin is re-pinned in the SAME phase commit
#     as the behaviour change that tripped it, with the trip and its
#     deliberate default-mode re-pin verdict recorded as a pm-notes notes
#     entry — never deferred to a later phase (that would strand a red
#     boundary), never a silent weakening, and never applied to the
#     exception-mode pins (escalation trigger 1). Files legitimately touched
#     by more than one phase are declared in each phase that touches them
#     (plan diff echoes the first covering phase — an accepted, bounded
#     observation, the GH-406 shared-file precedent).
#   - Golden discipline fence (RSK-T1, testing strategy): goldens that pin
#     preserved data are updated deliberately in review, never
#     blanket-rewritten; default-mode goldens gain the worktree line only in
#     the phase that changes the surface; exception-mode goldens equal
#     today's output byte-for-byte forever.
#   - Hermeticity fence (test plan §6): every new suite runs hermetic —
#     temporary git repositories, temporary state stores, seeded bins and
#     logs created and cleaned up by the harness; no live network, no live
#     credentials, no live tracker or PR calls (merge fakes per the
#     merge-deploy-no-live-calls pattern); suites stay order-independent and
#     parallel-safe per the existing isolation checks; zero assertions
#     against a moving base (no origin/main-tools...HEAD diffs anywhere —
#     RSK-T6); ZERO timing assertions — TC-ENV-004 is delivery evidence in
#     the pm-notes, and no bun test fixture may assert an install/build
#     duration.
#   - Phase-gate fence: the PR targeting main-tools, merge authority, tracker
#     transitions, and the lifecycle review/quality-gates phases belong to
#     the lifecycle, not this plan; gate evidence during delivery uses
#     TMPDIR=$PWD/tmp/tmpdir; no doc edit outside a declared phase scope may
#     leak into any commit.
# ---------------------------------------------------------------------------
phases:
  - id: 1
    title: Lane and config contracts — additive worktree context (DM-1) and worker settings worktree-root / disable-worktrees (DM-3, DM-4)
    kind: delivery
    summary: "declare the additive contract surface every later phase consumes: the dispatch.lane record payload in packages/core/src/contracts/dispatch.ts gains an optional worktree context — the worktree path the lane runs in, ABSENT exactly for pre-change lanes and disable-worktrees lanes so DEC-8 stays detectable and nothing migrates (spec §19) — and the worker settings gain the two additive keys with catalog entries in packages/core/src/config/catalog.ts: worktree-root (DM-3; default places each lane worktree as a sibling of the main checkout, named <checkout-basename>-<ref>) and the disable-worktrees exception setting (DM-4; opt-in; with it set behaviour is byte-for-byte today's); no existing key is renamed and no key changes meaning (NG-4); the config fixtures that enumerate catalog keys (tests/fixtures/config/catalog.ts, tests/fixtures/config/lane.ts) and the schema suite tests/behaviour/config-schema.test.ts are re-pinned and extended for the two new keys in the SAME commit so the boundary is proven, not merely compiled — this commit carries TC-WT-004's config half (AC-F2-1, DM-3, DM-4); the two keys are pinned to the config catalog's section-prefixed lane section as literal key constants co-located with the delivered lane keys in contracts/dispatch.ts — the exact literal key paths are lane.worktree-root (DM-3; a path string, unset means the sibling-of-main-checkout default) and lane.disable-worktrees (DM-4; a boolean flag, unset or false means worktree lanes on) — following the delivered pattern of lane.liveness-interval and lane.restart-budget."
    # TC ownership: TC-WT-004 config half (F-2, AC-F2-1, DM-3, DM-4). DM-1 and
    # DM-4 are declared here and consumed from phase 4; their scenario
    # coverage rides phases 8/9 (TC-RESUME-003, TC-REG-001/002).
    # Ordering: first delivery phase by design — contracts before every
    # consumer; purely additive at the base (existing configuration keeps
    # loading, spec §8.5).
    # Fences in force: zero-rename (additive keys only, NG-4); naming check
    # governs nothing new yet (no new source file — extensions only).
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/config-schema.test.ts; TMPDIR=$PWD/tmp/tmpdir pnpm check green at the boundary; git status confirms only the declared paths changed.
    scope:
      files:
        - packages/core/src/contracts/dispatch.ts
        - packages/core/src/config/catalog.ts
        - tests/behaviour/config-schema.test.ts
        - tests/fixtures/config/catalog.ts
        - tests/fixtures/config/lane.ts
    interactions:
      - kind: contract-file
        target: packages/core/src/contracts/dispatch.ts
        role: producer
      - kind: contract-file
        target: packages/core/src/config/catalog.ts
        role: producer
  - id: 2
    title: "Pure domain — lane worktree plan: sibling path scheme, environment derivation, resume verification, closeout ordering rules"
    kind: delivery
    summary: "author the pure domain layer as packages/core/src/domain/lane-worktree-plan.ts (new file): the deterministic worktree path scheme <worktree-root>/<checkout-basename>-<ref> with the sibling-of-main-checkout default derived from worktree-root, all paths resolved from the clone's PHYSICAL location (real path, never a symlinked alias — NFR-7); the lane-environment derivation contract — the worktree's node_modules/.bin leads PATH, the gate temporary directory anchored inside the worktree (the evidence literal stays $PWD/tmp/tmpdir because the lane's working directory IS the worktree, DEC-6), and the ordered provisioning steps (install from the pinned lockfile, then the gate build) as data consumed before the first phase; the resume verification rules — find the recorded worktree, verify it is on the lane's branch, never plan a second worktree, a missing or mismatched worktree is a lane error never a silent re-provision, and a record without worktree context plans today's in-checkout shape (DEC-8) — extending packages/core/src/domain/dispatch-resume.ts; and the closeout ordering rules — sweep the lane's logs before removal, removal strictly after merge confirmation, stalled lanes keep their worktrees — extending the delivered safety predicate in packages/core/src/domain/closeout-worktree.ts (predicate reused, not redefined) with the spawn-plan consumption point in packages/core/src/domain/lane-launch-plan.ts; pure functions over injected inputs: no I/O, no spawn, no clock, no configuration reads."
    # TC ownership: the domain rules are PROVEN by the phase-8/9 suites —
    # TC-ENV-002/003 (F-3, AC-F3-1), TC-RESUME-001/002/003 (F-4, AC-F4-1,
    # DEC-8), TC-CLOSEOUT-002/003/004/005 (F-6, NFR-5), TC-WT-003/005 (F-2,
    # NFR-7). No new suite lands in this phase: pure domain is additive and
    # nothing consumes it yet, so the boundary stays green trivially.
    # Ordering: domain before adapters and app services (delegation: contract
    # types first, pure domain second); the closeout predicate extension
    # precedes the closeout command wiring in phase 6.
    # Fences in force: purity per .ai/rules/typescript.md (domain reads no
    # configuration, performs no I/O); the safety predicate is REUSED — the
    # ordering is added around it, never a predicate redefinition (spec §12).
    # Verify: pnpm typecheck; TMPDIR=$PWD/tmp/tmpdir pnpm check green at the boundary (existing suites untouched and green); git status confirms only the declared paths changed.
    scope:
      files:
        - packages/core/src/domain/lane-worktree-plan.ts
        - packages/core/src/domain/dispatch-resume.ts
        - packages/core/src/domain/closeout-worktree.ts
        - packages/core/src/domain/lane-launch-plan.ts
    interactions:
      - kind: contract-file
        target: packages/core/src/domain/lane-worktree-plan.ts
        role: producer
  - id: 3
    title: Git adapter — addWorktree seam in the house style; linked-only enumeration made position-independent (F-10)
    kind: delivery
    summary: "add the missing create operation to the git adapter worktree family in packages/adapters/src/git/index.ts: addWorktree creates a LINKED worktree on a new branch at the tip of the given base branch, in the exact house style of listWorktrees / currentWorktreePath / isWorktreeClean / removeWorktree — fixed argv, no shell, local only, NO force flag — and every git refusal (branch exists, path exists, unsafe parent, anything else) surfaces as a typed refusal: zero retries, zero fallbacks, zero overrides (F-1, NFR-1); in the SAME commit the linked-worktree enumeration and the branch-checked-out-elsewhere check are made POSITION-INDEPENDENT (F-10, DEC-5 — this plan's chosen form): a porcelain block is the main checkout exactly when its git directory is the repository's common directory, never because it is first, so the main checkout is excluded from the linked inventory and linked worktrees are included regardless of block order; for every listing shape delivered today (main checkout first) the enumeration output is unchanged, so existing adapter suites stay green at this boundary; the positional-pin alternative remains the documented fallback (spec §7.3) if implementation reveals a git-version constraint."
    # TC ownership: TC-WT-001/002 unit halves and TC-IDENT-002 are PROVEN by
    # the phase-8 suites (tests/behaviour/git-adapter-worktree-seam.test.ts,
    # tests/checks/worktree-seam-house-style.test.ts,
    # tests/behaviour/git-adapter-worktree-enumeration.test.ts) — the seam
    # and its guard land before any consumer, so the boundary is green with
    # the proof landing in phase 8 (the GH-406 pattern: the standing rule
    # exists from birth, its suite rides the proof phase).
    # Ordering: adapters after pure domain and before app services; the
    # create capability must exist before phase 4 consumes it.
    # Fences in force: house-style seam contract (fixed argv, no shell, no
    # network, no force — NFR-1); the enumeration change is
    # behaviour-preserving for every delivered listing shape; no other seam
    # is touched.
    # Verify: TMPDIR=$PWD/tmp/tmpdir pnpm check green at the boundary (existing git-adapter and closeout suites stay green); git status confirms only the declared path changed.
    scope:
      files:
        - packages/adapters/src/git/index.ts
    interactions:
      - kind: contract-file
        target: packages/adapters/src/git/index.ts
        role: producer
  - id: 4
    title: Provisioning before the first phase — worktree creation, dependency install, gate build, gate temp dir; default-on with the exception honoured (OQ-1 settled)
    kind: delivery
    summary: "settle OQ-1 by declaring the provisioning contract and wiring it into the dispatch engine — packages/core/src/app/dispatch.ts, whose runDispatch is the sole production writer of dispatch.lane records (active and terminal appends) and hosts the lease claim and pre-spawn sequence, with the lane resolver packages/core/src/app/dispatch-lane.ts (resume-side read) and the packages/core/src/app/dispatch-gate.ts use-cases (summary/divergence/handover) kept for their read-side extensions, and the lease-claim composition edge in packages/cli/src/production.ts that wires the provision step into the engine invocation — with the clone's physical-path resolution landed in packages/core/src/app/state-scope.ts (DoR iter-1 settlement, option a): state-scope gains the realpath resolution of the clone's location — the main checkout's location, the worktree-root and the derived sibling worktree path resolve from the clone's PHYSICAL location, never through a symlinked alias (NFR-7) — while its other resolutions (clone identity, state root) are unchanged and stay pinned by TC-IDENT-001, and the pure domain plan (phase 2) expresses the rule over injected already-resolved paths and stays free of I/O; after the repository lease is claimed (unchanged order, NG-2) and BEFORE the first phase (clarify_scope), dispatch of a work item whose lane has no worktree creates the worktree through addWorktree at the derived sibling path on a new branch at the base tip (F-2), then provisions the lane environment IN the worktree — dependencies installed with the pinned lockfile (pnpm install --frozen-lockfile), whatever the gates need built built there, the gate temporary directory created inside the worktree with the evidence literal $PWD/tmp/tmpdir anchored to the lane's working directory (DEC-6) — and records the worktree context on the lane record (DM-1) so resume and the surfaces can find it; the lane's spawn environment is the phase-2 derived plan (the worktree's node_modules/.bin leads PATH); worktree lanes are DEFAULT-ON from this phase; the disable-worktrees exception setting is honoured at this same seam — with it set no worktree is created or referenced and the lane runs in the invoking checkout exactly as today (F-8); the provisioning MEASUREMENT (what the gates needed, how long) is recorded during delivery as pm-notes evidence (NFR-9, TC-ENV-004) — no suite asserts any duration; pre-existing suite pins that trip on the default flip are re-pinned in THIS commit per the green-boundary fence."
    # TC ownership: TC-WT-003 (F-2, AC-F2-1 — creation ordering, lease before
    # provisioning), TC-ENV-001/002/003 (F-3, AC-F3-1, NFR-2, DEC-6),
    # TC-ENV-004 (F-3, AC-F3-2, NFR-9 — EVIDENCE ONLY, recorded in the change
    # pm-notes during delivery, no test file), TC-REG-002 (F-8, AC-F8-1 —
    # exception-mode variant). The proving suites land in phase 8; the
    # conditional-sweep fence moves any tripped pre-existing pin into this
    # commit. The enlarged fence (engine write site + lease-claim edge)
    # keeps every mapped TC deliverable in this phase: TC-WT-003's
    # creation-before-the-first-phase and lease-first order assert the
    # runDispatch sequence itself; TC-ENV-001/002 assert the provisioned
    # environment the engine binds; TC-REG-002 asserts the exception branch
    # wired at the same seam.
    # Settlement (DoR iter-1, finding 2, option a declared): packages/core/
    # src/app/state-scope.ts is THIS phase's scope — the physical-path
    # resolution lands here, in the phase that first consumes the physical
    # location (the worktree creation above); phase 5's registration write
    # site consumes the resolved physical main-checkout path from it
    # unchanged in shape; TC-WT-005 proves zero alias resolutions.
    # Write site (delivery blocker q-de70dae6-1ad2-45e9-bc78-d8ddd937e9d7):
    # verified against the tree — packages/core/src/app/dispatch.ts is the
    # ENGINE: runDispatch (:725) is the sole production writer of
    # dispatch.lane records (terminal append :842-850, active append
    # :1069-1084) and hosts the lease claim and pre-spawn sequence, so the
    # provision-after-lease port and the DM-1 worktree context recording
    # bind HERE (the phase-2 domain plan expresses the rules; this is where
    # they bind). packages/cli/src/production.ts joins THIS phase as the
    # lease-claim composition edge (:4272) wiring the provision step into
    # the engine invocation; phase 5 keeps its own production.ts declaration
    # for the host-index write-site fix — both phases may name the same
    # file, each declaring the part it owns. dispatch-lane.ts (lane
    # resolver, resume-side read) and dispatch-gate.ts (summary/divergence/
    # handover) stay declared for their read-side extensions.
    # Binding chain (delivery blocker q-5f1d0808-de2e-417b-b209-b3f8f850a2cf):
    # the port still cannot bind through the composition edge — TWO
    # additions in packages/cli/src/edge.ts, THIS phase's scope:
    # (1) the closed composition type DispatchComposition
    # (edge.ts:7736-7863) gains the optional provisionWorktree member in
    # the claimLease (ref) style — without the type member the production
    # literal in production.ts:4222 (typed DispatchComposition) is an
    # excess-property compile error;
    # (2) the tree's SOLE runDispatch assembly (edge.ts:8202-8283) gains
    # one conditional forwarding line mirroring the claimLease pattern
    # (:8255) — the assembly forwards fields explicitly, so without the
    # forwarding line the capability is dead in production and the default
    # flip would be false.
    # Chain verified complete (rev 5): production.ts (composition literal:
    # dispatchComposition :4222, lease-claim :4272) -> edge.ts (type :7736
    # + sole assembly :8202) -> dispatch.ts (engine :725) — every link
    # declared in THIS phase; no other closed type, assembly, or forwarding
    # site stands between them (verified: runDispatch has no other call
    # site, domain/dispatch-tracker.ts assembles no dispatch ports, the
    # daemon lane path does not run runDispatch).
    # Ordering: after phase 3 (the seam exists); before resume (phase 5) and
    # the surfaces (phase 7). This is the change's central boundary: the
    # default flip happens here and nowhere else.
    # Fences in force: lease-order fence; physical-path fence; DEC-8 fence
    # (this change's own lane stays in the main checkout); byte-for-byte
    # fence (the exception branch is wired in the same commit as the default
    # flip — the escape hatch can never lag the default); hermeticity fence
    # (suites stub install/build — RSK-T5).
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-harness-lease.test.ts tests/behaviour/dispatch-resume.test.ts tests/behaviour/dispatch-gate-evidence.test.ts (tripped pins re-pinned here per the fence); TMPDIR=$PWD/tmp/tmpdir pnpm check green at the boundary; git status confirms only the declared paths changed plus fence-authorized re-pins.
    scope:
      files:
        - packages/core/src/app/dispatch-lane.ts
        - packages/core/src/app/dispatch-gate.ts
        - packages/core/src/app/state-scope.ts
        - packages/core/src/domain/lane-launch-plan.ts
        - packages/core/src/app/dispatch.ts
        - packages/cli/src/production.ts
        - packages/cli/src/edge.ts
    interactions:
      - kind: contract-file
        target: packages/core/src/app/dispatch-lane.ts
        role: consumer
      - kind: contract-file
        target: packages/core/src/app/dispatch-gate.ts
        role: consumer
  - id: 5
