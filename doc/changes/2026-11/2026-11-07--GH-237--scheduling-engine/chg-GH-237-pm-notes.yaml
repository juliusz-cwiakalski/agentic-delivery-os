decisions:
  - text: "One-shot scope boundary: this story delivers the daemon-free scheduling engine (dependency graph, readiness, per-repo single-flight leases via the fence-token state path, weight classes, close-first ranking, parks with condition-exact resume, and `queue plan` next-action computation). Session execution/spawn of a delivery remains the `dispatch` story (M1-S9), which this story unblocks. Lease acquisition/release is delivered as a scheduling capability exercised by the queue surface so two daemon-down one-shots are mutually exclusive (SC-M1-17b) without shipping the dispatch command."
    date: "2026-11-07"
  - text: "`lanes --watch` streaming depends on the resident daemon (M1-S18) and control protocol v1. This story delivers `lanes list|show` from state; `--watch` is out of scope for live streaming and must degrade truthfully (declared unavailable/degraded, never a silent empty stream) when no daemon exists."
    date: "2026-11-07"
  - text: "Park recheck is evaluated on demand by any queue one-shot invocation (and by the future daemon on start), using per-condition-type intervals from configuration. Auto-recovery produces a recorded incident; a park outliving its cleared condition surfaces the `queue.park-condition-stuck` finding."
    date: "2026-11-07"
  - text: "`queue ready` (M0-S7, GH-176) stays the read-only ready-set surface and its contract is preserved; the scheduling engine consumes/reuses its condition model rather than redefining it."
    date: "2026-11-07"
  - text: "Spec OQ-3 (weight vocabulary) resolved as PM-decided: accept DEC-10 — classes are `standard` and `heavy`, absent resolves to `standard`, a declared-but-unrecognized value resolves to `heavy` (conservative, never overloads a runner, plan schema already deferred vocabulary ownership to the scheduler). Revisit only if a real typo-silently-heavy incident appears; not a blocker."
    date: "2026-11-07"
  - text: "Spec OQ-2 (preemption authority) deferred by PM decision to M1-S18 planning: this story computes the preemption action and requires an explicit `queue release --park`, because nothing in this scope may abandon a live session. Automatic preemption by the daemon is a daemon-story decision with cost consequences; record it in `doc/decisions/**` at M1-S18 if automatic preemption is adopted."
    date: "2026-11-07"
  - text: "Spec OQ-1 (explicit queue membership via `queue add`) and OQ-4 (`queue claim`/`queue release` surface revisited at M1-S9) accepted as recorded assumptions; neither blocks this delivery."
    date: "2026-11-07"
