      it is "NOT accepted in the grammar"; but both command definitions now declare it
      (`packages/cli/src/commands/lanes.ts:89` flags ["--watch"], `packages/cli/src/commands/queue.ts:339`)
      and refuse it in the handler (lanes.ts:93; queue.ts:345). Observable behavior still satisfies
      AC-F11-2 (exit 1, `fallback.invocation`, daemon-naming hint, no stream), and F-3's own
      suggestion explicitly allowed "register it as a refused flag", so this is a documentation
      truthfulness gap, not a functional defect.
    suggestion: >-
      Reconcile the wording to "declared as a refused flag" in NG-3/F-10/DEC-7 and plan task 6.2 (or
      detect `--watch` before generic parsing if strict grammar omission must be preserved).
