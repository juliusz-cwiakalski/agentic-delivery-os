summary: >-
  Iteration-2 re-review after Phase 9 remediation (commits 89a18f47, 25c33b27, 67f55985). All 22
  iteration-1 findings are resolved in code and tests, and none of the high/medium blockers remain:
  the per-type park recheck interval is now a real due-gate with a two-pass 60 000-vs-5 000 ms
  fixture (no early resume, latched resume); producer deploy-expectations resolve through the real
  edge seam from entry-recorded roots with exact normalized-key matching, collision and
  missing/invalid degradation, and the producer's own not-declared config provably overrides an
  injected pre-resolved expectation; release+park appends the park first and withdraws it with a
  compensating `released` record so a refused second append leaves the lease held and no active
  park; the `--watch` refusal carries the resident-daemon hint on both surfaces; `queue ready`
  preserves 1-8 refs byte-for-byte through the full family; NFR-9's 65 536-byte machine cap and the
  40-line/8192-byte human bounds are enforced with explicit truncation markers; and the vacuous
  tests were replaced with real assertions. Targeted verification is green (typecheck; boundaries +
  ambient-globals + workspace-entrypoints + secret-read-boundary; error-table-sync 105/105; 124
  queue/lanes behaviour+checks tests; 126 golden+structure tests; 1330 checks+structure tests; 212
  queue-ready/related tests). No daemon, watch streaming, or dispatch implementation was added; the
  known `privacy-ci-wiring` TC-WIRE-002 5 s-default timeout and the `ci-baseline-parity` EXDEV
  failure were reproduced in isolation and are environmental (the former passes with a raised test
  timeout; the latter is a cross-device `git clone --local` hardlink and passes with a repo-local
  TMPDIR). Only low/info documentation and defensive-follow-up items remain, so the verdict is PASS.
