  - id: F-3
    severity: low
    confidence: high
    category: contract-clarity
    location: packages/core/src/domain/queue-precedence.ts:648
    message: >-
      `boundQueueData` drops trailing entries/actions/findings/parks/leases/weights to meet
      NFR-9's 65 536-byte cap and sets `truncated` + `truncationReason`, but it does not recompute
      `counts`. `toQueueReadData` computes `counts` from the pre-bound schedule
      (`packages/cli/src/commands/queue.ts:255-274`), so after a byte-cap cut `counts.entries`
      (and ready/held/parked/leases/parks) can exceed the actual array lengths. The 500-entry bound
      test only asserts `data.entries.length < 500` (tests/checks/queue-bounds.test.ts:77-88), so
      the mismatch is unobserved. `lanes` counts do match their payload, making the two surfaces
      inconsistent.
    suggestion: >-
      Recompute `counts` after the byte-cap drop (or document `counts` as the pre-truncation total
      beside `truncated`/`truncationReason`) and assert count/array consistency in the bound test.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: low
    confidence: medium
    category: test-efficacy
    location: packages/core/src/app/queue.ts:1367
    message: >-
      The F-5 remedy is correct for a single refused second append: park-first, then lease release,
      with a compensating `released` park. But the compensation is best-effort — if both the
      lease-release append and the compensating `released` append fail, the return value of the
      second `appendLeaseRecords` is ignored (`packages/core/src/app/queue.ts:1367-1374`) and the
      ledger is left with an active `parked` record while the lease remains held. The new test arms
      exactly one failure (tests/behaviour/queue-lease.test.ts:659-696), so the double-failure path
      is unproven. This cannot be fully atomic without a multi-record store operation; the accepted
      F-5 remedy already permits this residual.
    suggestion: >-
      Add a double-failure test that asserts a defined observable state (or document the residual and
      have the recovery pass treat a park with a held lease as the stuck/incident class), so the
      limitation is explicit rather than silent.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-5
    severity: info
    confidence: high
    category: spec-compliance
    location: packages/cli/src/edge.ts:3094
    message: >-
      Residual of F-2: producer deploy-expectation resolution is now implemented at the composition
      seam through `QueueDeployExpectationPort` (`packages/cli/src/edge.ts:3094-3100`,
      `resolveDeployExpectations` at 3147-3210), including entry-recorded-root discovery, exact
      normalized-key comparison, collision detection, and missing/invalid degradation; the actual
      root's git-remote/config read is supplied by the port. No production adapter wires
      `normalizedRemote`/`deployExpectations`, so AC-F6-2 holds at the injected-fixture tier only —
      the same deferred production composition already recorded for F-20.
    suggestion: >-
      When the production queue composition is wired, implement the port's filesystem/git adapter and
      extend the hermetic fixture to exercise it; no action required for this change's tier.
    suppressed: false
    published_url: null
    published_at: null
