summary: >-
  The scheduling engine is delivered with a strong, largely well-tested core: a fenced, replay-idempotent
  queue graph (cycle refusal before append, superseding projection, derived graph that folds no root);
  the six-condition readiness model with scheduler sources and failed-source-unknown discipline; a
  two-stage, in-fence lease claim with post-append verification, renewal, release, and evidenced stale
  takeover (50 distinct holders -> exactly 1 acquisition, 49 conflicts, verified in this review); weight
  as a per-runner resource class; close-first ranking with a computed preemption proposal; bounded park
  passes with the durable clear-observed marker, recovered record, incident, and the stuck-park hard
  exclusion; the lanes fold with truthful nulls; and additive, bidirectionally synchronized record kinds,
  error rows, collector id, and typed config branch (structure/error-sync/boundary/hermetic/golden
  suites all green here with a repo-local TMPDIR; the ci-baseline-parity EXDEV failure reproduces as
  environmental). Two high findings block: (1) AC-F8-2 is not delivered — the resolved
  `queue.park-recheck.<type>` interval is stored and echoed but never consulted, so a cleared park is
  resumed on the first mutating pass regardless of the configured cadence (the TC-PARK-006 "config-only
  tuning" test is a tautological constructor check that cannot observe this); (2) AC-F6-2's core
  mechanism is absent — nothing resolves a producer repository's `merge.deploy-expectations` from its
  entry-recorded root and normalized key (root matching, collision detection, and config load are
  unimplemented; `repositoryRoot` is recorded but never consumed, and `root-collision`/`root-unresolved`
  are produced only by fixtures). Medium findings: `--watch` refusal on both surfaces carries the generic
  fallback hint, not the AC-F11-2 resident-daemon remediation; `queue ready` is not preserved under the
  full-family composition (3+ candidate refs are refused although ready-only accepts 8); release+park is
  not atomic when the second append fails (lease released, no park); the NFR-9 machine byte cap is
  unenforced and exceeded ~2x (129,808 bytes for 500 entries); the "second active park is a state.*
  failure" invariant is unenforced and its named test is vacuous; the execution log claims command-level
  zero-write checks that do not exist; one purity test compares a value to itself; and AC-F9-1's generated
  corpus omits both weight classes and two of three park types. The known deviations and DoR residuals
  are adjudicated individually below. Verdict is FAIL; remediation is required before the DoD gate.
severity_breakdown:
