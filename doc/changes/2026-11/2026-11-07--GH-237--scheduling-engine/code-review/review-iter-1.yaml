    suggestion: >-
      Enforce the machine byte cap in the queue payload/render path (drop entries/actions with an explicit
      "+more" truncation marker), wire the human constants into the renderers, and either enforce or remove
      the reasons bound; add a bound test at 500 entries that asserts the byte cap.
