    location: packages/core/src/domain/queue-park.ts:104
    message: >-
      AC-F8-2 is not delivered: the per-condition-type recheck interval is inert. `evaluateParkRecord`
      decides resumability only from the typed condition (window expiry, provider availability, or lease
      freedom) and never compares elapsed time to `recheckMs`; `evaluateParkPass`/`recoverQueueParks`
      therefore re-evaluate and can recover every park on every mutating pass regardless of the configured
      cadence. F-8/plan task 5.1 explicitly require "a park that is not yet due is reported as active with
      its interval and last evaluation", and AC-F8-2 requires changing only `queue.park-recheck.<type>` to
      change resume timing with no code change. A probe with a 60 000 ms provider-window interval shows the
      park resumable at T+5 001 ms (TC-PARK-006 step 1 explicitly requires it to be active there). The
      edge does resolve and thread operator settings (edge.ts:2675), but they have no behavioural effect.
    suggestion: >-
      Add a due check (elapsed since `evaluatedAt` >= `recheckMs`) before re-evaluation, report a not-yet-due
      park as active with its interval/last evaluation, and replace the tautological TC-PARK-006 with the
      two-pass 60 000-vs-5 000 ms fixture the test plan specifies (assert no resume at T+5 001 and resume by
      T+60 001 for each condition type).
    suppressed: false
  - id: F-2
    severity: high
