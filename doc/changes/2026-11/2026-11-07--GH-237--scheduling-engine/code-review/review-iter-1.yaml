    location: packages/cli/src/edge.ts:3073
    message: >-
      AC-F6-2 / C-6 / DM-12 producer-bound deploy-expectation resolution is absent. The edge builds the
      deploy facts directly from `composition.facts.deploy` (edge.ts:3073), and the gate only reads
      `facts.expectations[producerRef]` (queue-deploy-gate.ts:68). No code discovers the producer's recorded
      `repositoryRoot`, compares its normalized remote to the recorded key by exact equality, detects a
      two-root collision, or loads `merge.deploy-expectations` from that root's configuration. The
      `QueueDeployExpectation` `root-unresolved`/`root-collision` reasons (queue-readiness.ts:98-105) are
      constructed only by tests, so the recorded root is written but never consumed. Plan task 7.3 assigns
      this resolution to the edge; it was not delivered, and TC-DEPEND-003/004 inject pre-resolved
      expectations so they cannot observe the gap. The feature spec (feature-scheduling-engine.md:88-89)
      claims root matching and collision behaviour that does not exist.
    suggestion: >-
      Implement producer-root discovery and config resolution in the composition seam (entry-recorded roots
      only, exact normalized-key match, collision -> unknown, unreadable/invalid config -> unknown), feed
      the result into `facts.deploy.expectations`, and add a TC-DEPEND-003/004 case that resolves expectations
      from a real producer root + config across a multi-repository state directory.
