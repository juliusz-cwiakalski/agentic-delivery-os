    location: packages/core/src/app/queue.ts:1336
    message: >-
      The release+park "both land or neither" guarantee (F-7, AC-F7-2, plan task 5.5) holds only when the
      first append fails. `releaseQueueLease` appends the lease-release record and the park record
      sequentially under one fence with no rollback (app/queue.ts:1336-1351); if the *second* append fails,
      the lease release is already durable and no park exists. Reproduced: arming the second append yields
      two lease records (last `released`) and zero park records while the call reports a state failure. The
      delivered atomicity test arms only the first append (queue-lease.test.ts:615-639), so the partial-write
      path is unproven.
    suggestion: >-
      Make the two appends atomic (a single multi-record store operation or a compensating release/park
      marker) or append the park first with a compensating record, and add a second-append-failure test that
      asserts the exact expected observable state.
