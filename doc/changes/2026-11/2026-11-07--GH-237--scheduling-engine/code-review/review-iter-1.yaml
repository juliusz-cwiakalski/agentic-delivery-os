remediation_tasks:
  - "Phase 9: Code Review Remediation (Iteration 1)"
  - "9.1 (F-1) Implement a due check for park re-evaluation: skip a park whose elapsed time since `evaluatedAt` is below `recheckMs`, report it active with its interval/last evaluation, and only recover an elapsed park. Replace TC-PARK-006 with the two-pass 60 000-vs-5 000 ms fixtures for provider-window, provider-quota, and preemption, asserting no early resume and an earlier resume after the 5 000 ms config."
  - "9.2 (F-2) Implement producer-root deploy-expectation resolution: from entry-recorded roots only, match the producer's normalized key by exact equality, detect two-root collision, load `merge.deploy-expectations` from the matched root config, and degrade to `unknown` (`deploy-unverified`) on no-match/collision/unreadable/invalid. Feed `facts.deploy.expectations` from the resolution and add multi-repository TC-DEPEND-003/004 cases."
  - "9.3 (F-3) Emit a `fallback.invocation` `--watch` refusal whose remediationHint names the resident daemon story on both `queue` and `lanes`; update goldens and assert the hint in TC-LANES-004 and TC-SCHED-016."
  - "9.4 (F-4) Preserve `queue ready` under the full-family composition: parse `ready` with the delivered grammar before the shared positional cap (or raise the cap), and add a 3-8-candidate preservation test through the full definition."
  - "9.5 (F-5) Make release+park atomic against a second-append failure (single multi-record append, park-first with compensation, or rollback) and add a second-append-failure test asserting the exact expected observable state."
  - "9.6 (F-6) Enforce NFR-9's machine byte cap with an explicit truncation marker (and wire the human line/byte constants and reasons bound), plus a 500-entry byte-cap test."
  - "9.7 (F-7) Fail closed when two active `parked` records exist for one ref, and rewrite TC-PARK-004 to seed two active records and assert the classified state refusal."
  - "9.8 (F-8, F-9, F-10, F-11) Close the test-efficacy gaps: add command-level zero-write assertions for `queue list|plan` and `lanes list|show`; make the lanes purity test compare the real injected facts; expand the TC-SCHED-006 corpus to both weights/all three park types/both dependency roles; add a config-resolved `queue.lease-ttl` tuning case; fix the execution-log claims."
  - "9.9 (F-12, F-13, F-14) Use the code-point comparator in `weightLoads`; give non-close/non-producer actions and ready lanes truthful reason tokens; stop fabricating `entry.state: ready` on mutation envelopes."
  - "9.10 (F-15, F-16) Resolve the `released` recovery-state dead path and the release-instant provider-window expiry (produce the state or remove it; add `--until` or reject provider-window on release)."
  - "9.11 (F-17, F-18) Reconcile the plan: correct the `state/queue.ts` scope to `app/queue.ts`, record the status-digest doc-only edit as an accepted declared exception, and close DoR N2/N3/N4."
  - "9.12 (F-19, F-20, F-21, F-22) Rename/reword the machine-golden titles, document the deferred production composition, refresh the stale `queue.ts` header, and add the CLI park exit-2/stuck-exit-0 cases."
