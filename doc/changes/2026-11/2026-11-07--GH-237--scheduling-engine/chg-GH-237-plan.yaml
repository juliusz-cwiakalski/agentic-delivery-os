    tasks:
      - "7.1 packages/cli/src/commands/queue.ts — extend the delivered file from ready-only to the full family WITHOUT touching ready behaviour (F-10, NG-4): keep createQueueReadyCommandDefinition and every existing `ready` grammar check byte-for-byte; add createQueueCommandDefinition(runtime) with `queue list`, `queue plan [--next <n>]`, `queue add <ref> [--priority <n>] [--dep <ref>]...`, `queue prioritize <ref> <n>`, `queue dep <ref> <on-ref>`, `queue claim [<ref>] [--holder <id>]`, and `queue release <ref> [--holder <id>] [--park <cause>]`. `--watch` is not accepted on any queue subcommand and is refused through fallback.invocation. Grammar and bounded untrusted input (canonical ref pattern and length, integer priority, closed park cause) are validated before any read; an oversized or malformed input is an invocation rejection. Handlers own no stream writes and choose no exit code. [F-10; AC-F10-1, AC-F10-2; Appendix C; TC: TC-SCHED-002 CLI rows, TC-SCHED-008 grammar rows, TC-SCHED-016 grammar rows]"
      - "7.2 Envelope data and exit projection (Appendix C, C-1, C-4): `list` returns entries[], leases[], weights, parks[], findings[], degraded[], truncated; `plan --next n` adds nextActions[] with ref, repository, rankClass, reason, priority, weightClass, weightClassSource, lease status, blocking[], deploy evidence, and preemption block; mutations return ref, entry, edges[], result (added/updated/noop); claim returns result (claimed/renewed/taken-over), selectedRef, lease, action, degraded[]; release returns result (released/parked/noop), lease, park?, degraded[]. A no-ref claim names the deterministically selected ref or refuses queue.precondition.unmet with reason no-eligible-action at exit 1 and zero appends; a stuck-park claim refuses queue.park-condition-stuck at exit 1 with zero appends. A successful mutation with no daemon reachable exits 0 with degraded [daemon-unreachable]; a refused mutation projects its own exit-1 identity and never claims degradation as success. `queue list|plan` exit 2 with the classified state.* identity and bounded evidence when lease or park history is unreadable, torn, or of unknown kind, presenting no success verdict and no data sibling, partial view, or empty view as a schedule; a readable stuck park stays a report-only finding at exit 0. Text mode prints result=, ref=, lease=, next=, degraded= before human detail and result=refused before a classified refusal. [F-10, F-11; AC-F10-1, AC-F10-2, AC-F10-3; C-1, C-4, C-7; NFR-2, NFR-13; TC: TC-SCHED-008 full, TC-SCHED-009 full, TC-SCHED-016 full, TC-LEASE-006 read-surface rows, TC-PARK-007 read-surface rows]"
      - "7.3 packages/cli/src/edge.ts — the production composition seam: keep `options.queueReady` and the ready-only fallback exactly as shipped; add `options.queue` (state store, clock, tracker/PR/CI/provider/deploy read ports, repository binding, economics fold, config resolver) and `options.lanes`, and select createQueueCommandDefinition/lanes only when supplied. The edge supplies the queue ttl and park-recheck settings from the resolved configuration, resolves deploy expectations from the producer repository config bound to the recorded key, and never reads the invocation config for another repository's expectations. Dedicated edge-level wiring tests in tests/behaviour/queue-edge-wiring.test.ts drive the REAL edge path with injected fakes (not a stub runtime): every new queue subcommand and flag, plus lanes list/show and the --watch refusal, is exercised at edge level, and queue ready output through the edge is byte-identical. [F-10; AC-F10-1, AC-F10-2, AC-F6-2; DEC-13; TC: TC-SCHED-010 edge rows, TC-DEPEND-003 edge rows, TC-COMPAT-001 edge rows]"
      - "7.4 tests/behaviour/queue-cli.test.ts and tests/behaviour/queue-edge-wiring.test.ts + tests/golden/queue-{plan,list,envelope,lease-conflict,rank}.test.ts over tests/fixtures/queue/golden/** (shared queue-graph, queue-schedule, and queue-precedence suites are extended from Phases 2-3) — every grammar, envelope, and exit row; empty queue is explicit observed-empty at exit 0 with counts; degraded daemon-unreachable on the daemon-down paths; refusal shapes for cycle, conflict, precondition, unobserved entry, and stuck park; `--json` versus text; goldens normalized with no absolute paths, wall-clock timestamps, or unstable ordering and regenerated only by an explicit command. [F-10; AC-F10-1, AC-F10-2, AC-F10-3; NFR-1, NFR-9; TC: TC-SCHED-008 full, TC-SCHED-009 full, TC-SCHED-016 full, TC-SCHED-002 CLI half completes, TC-LEASE-005 golden half, TC-RANK-001 golden half]"
      - "7.5 `queue ready` preservation (AC-F12-1, NG-4, GAP-T1): extend tests/behaviour/queue-ready-output.test.ts, tests/golden/queue-ready.test.ts, and tests/structure/queue-ready-contract.test.ts to assert byte-identical machine and human output over the existing tests/fixtures/queue-ready/** corpus, unchanged grammar and caps, the six condition ids/order/tri-state/evidence vocabulary unchanged, read-only posture, and no new queue row attributable to ready. The assertion is fixture equivalence plus structural vocabulary stability, not 'the file never changed'. [F-12, F-2; AC-F12-1; NG-4; NFR-11; TC: TC-COMPAT-001 full, TC-VOCAB-005 ready-invariance rows]"
      - "7.6 tests/checks/queue-hermetic.test.ts — NFR-7: zero live network (globalThis.fetch throws if reached), zero live credential reads, zero real sleeps, zero sockets; clock, state/fence transport, tracker/PR/CI/provider reads, deploy verdicts, economics input, and repository binding injected everywhere; forbidden-literal and ambient-globals scans green over the new modules with non-zero file floors; 100-run determinism rows for precedence, plan, and lane folds; a missing fixture fails naming the missing fixture. [NFR-1, NFR-7; TC: TC-SCHED-014 full, TC-SCHED-013 completes]"
      - "7.7 Secret and payload safety (NFR-12): tests/checks/queue-hermetic.test.ts + tests/checks/secret-read-boundary.test.ts (extend) + tests/fixtures/queue/secret/** — synthetic non-secret canaries placed as credential material, tracker bodies, provider payloads, and free-form messages appear nowhere in envelopes, records, findings, incidents, reasons, or evidence across list/plan/claim/release/lanes; the delivered redaction chokepoint covers the new payloads; the secret-read allowlist gains ZERO entries; the no-shell/no-child-process posture holds (no eval/exec/spawn-arg surface touches a value). [F-10, F-12; NFR-12; TC: TC-VOCAB-006 full]"
