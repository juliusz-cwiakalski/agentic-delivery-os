    tasks:
      - "5.1 packages/core/src/domain/queue-park.ts — park evaluation policy (F-8, C-3, DEC-3): the closed condition types provider-window (clears at the provider window absolute expiry), provider-quota (clears when the provider condition is observed available), and preemption (clears when the preempting lease on the repository is released and the entry is ready again); a park carries entry, repository key, closed cause, typed evaluable condition, absolute expiry when supplied, the resolved recheck interval, last evaluation time, clearObservedAt, and recoveryState. Each active park whose interval has elapsed is re-evaluated; a park that is not yet due is reported as active with its interval and last evaluation. Owner gates and external waits are readiness blockers, never parks. At most one active park per entry. [F-8; AC-F8-1; DM-5, DM-14; TC: TC-PARK-001 due rows, TC-PARK-004 full]"
      - "5.2 Recovery and the durable marker (C-3, NFR-5): a mutating pass that observes a condition clear first appends a queue.park record with recoveryState clear-observed, clearObservedAt, the evaluation time, and the observation gap since the previous evaluation, then attempts recovery; if recovery lands in the same pass the recovered record supersedes the marker and a queue.incident of type park-auto-recovery records the condition, clear time, evaluation time, and observation gap; if the recovery append is refused the marker persists and the pass returns queue.park-condition-stuck. A park observed clear but still active on a later pass, or whose recovery append was refused, is the stuck class: reads report queue.park-condition-stuck as a report-only finding at exit 0, and a claim on that entry refuses at exit 1 with the same identity, consequence not_landed, and zero appends, never falling through to a lease conflict. A park skipped only because no engine ran recovers with a gap-naming incident and is never reported stuck. Reads never append. [F-8; AC-F8-1; C-3, C-7; NFR-2, NFR-5, NFR-13; TC: TC-PARK-001 recovery rows, TC-PARK-002 full, TC-PARK-003 full, TC-PARK-005 full]"
