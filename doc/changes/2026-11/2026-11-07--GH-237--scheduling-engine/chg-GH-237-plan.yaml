      - "5.7 TC-VOCAB-001 completion rows in tests/structure/queue-scheduling-contract.test.ts: lease, park, and incident records round-trip through the real ledgers with their Appendix D schema ids and store keys; the park record carries the additive clearObservedAt and recoveryState fields without a schema-version bump; an older park record without those fields reads as a park with no clear observation. [F-12; EVT-3..EVT-5; NFR-8; TC: TC-VOCAB-001 completes]"
    coverage:
