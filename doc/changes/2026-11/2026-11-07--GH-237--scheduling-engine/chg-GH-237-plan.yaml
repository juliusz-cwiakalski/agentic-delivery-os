      - "5.4 tests/behaviour/queue-park.test.ts over tests/fixtures/queue/parks/** — a provider-window park ending at T resumes on the first mutating pass after T within one recheck interval with the incident naming condition, clear time, evaluation time, and observation gap; the clear-observed marker precedes recovery and survives a refused recovery; a clear-but-active park yields the report-only finding at exit 0 and a claim refusal at exit 1 with zero appends; an observation gap yields a gap-naming incident and never a stuck finding; boundary instants at T-1, T, T+1; recheck-interval configuration-only tuning (fixtures differ only in queue.park-recheck.<type>; provenance reports the changed value; no source diff); an unknown condition-type key is config.key.unknown and an invalid interval is config.value.invalid naming the key; unreadable park history is never not-parked. [F-8; AC-F8-1, AC-F8-2; NFR-5, NFR-10, NFR-13; TC: TC-PARK-001 full, TC-PARK-002 full, TC-PARK-003 full, TC-PARK-005 full, TC-PARK-006 completes, TC-PARK-007 full]"
