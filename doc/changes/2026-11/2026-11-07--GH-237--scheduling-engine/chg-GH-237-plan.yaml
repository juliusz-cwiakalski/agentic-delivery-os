        target: packages/core/src/contracts/owner-gate-sla.ts
        role: producer
    summary: "feat(GH-237): scheduling vocabulary, typed queue configuration branch, record kinds, and queue error rows"
    tasks:
      - "1.1 packages/core/src/contracts/queue.ts — NEW data-only contract module (types and `as const` data only; imports only `./queue-ready.js`, `./plan.js`, `./state.js`, and other `./` contract modules; no clock, env, fs, network, or call expression): the closed scheduling vocabulary of DM-1..DM-14 — lease scope set exactly {repo-exclusive, worktree} with repo-exclusive the only implemented value, lease lifecycle operations {acquired, renewed, released, taken-over}, lease fields and TTL semantics (DM-4), weight classes exactly {standard, heavy} with weightClassSource {declared, absent, plan-unreadable, plan-absent} (DM-7), rank classes exactly {merge-ready, in-review, resume-parked, new-start} in that order (DM-8), park causes and condition types {provider-window, provider-quota, preemption}, recovery states {parked, clear-observed, recovered, released} (DM-5), incident types {park-auto-recovery, lease-stale-takeover} (DM-6), lane states {delivering, idle-with-reason, parked, merge-ready, in-review, failed} and the closed idle-reason set pinned in this plan's header (DM-11), precedence step ids 0..14 (Appendix B), and the bounded caps of NFR-9. Record kinds, payload schema identifiers, and store-scoped key prefixes are the Appendix D spellings verbatim, including the derived document delivery.queue.graph.v1 at queue-graph.json (DM-13). Envelope data shapes for queue list, plan, add, prioritize, dep, claim, release, and lanes list/show follow Appendix C exactly (DM-9, DM-10; lease, action, park, finding, degradation, truncation fields). [F-1, F-3, F-4, F-5, F-7, F-8, F-10, F-11, F-12; DM-1..DM-14; EVT-1..EVT-6; NFR-9, NFR-14; TC: TC-VOCAB-004, TC-VOCAB-005, TC-VOCAB-001 structure rows]"
      - "1.2 packages/core/src/contracts/queue.ts — the record-kind boundary declarations the state ledgers consume (kind, identity field, field shapes, closed vocabularies, payload schema): one declaration per new kind plus the derived-document declaration, mirroring the phase.transition and merge.* boundary precedent. Declarations are additive inside delivery.state.v1; STATE_SCHEMA_VERSION is untouched. A wrong kind, a malformed payload, a duplicate acquisition for one holder, or a second active park for one entry is classified state.* and never a fabricated value (Appendix D). [F-12; EVT-1..EVT-5; NFR-8, NFR-11; TC: TC-VOCAB-001 structure half]"
      - "1.3 Typed `queue` configuration branch (Appendix E, NFR-10): packages/core/src/config/catalog.ts gains the `queue` branch — `lease-ttl` as an integer millisecond scalar defaulting to 90000, and `park-recheck` as a `record` field kind with integer millisecond values whose valid child names are the three condition types and whose defaults are 60000 (provider-window), 300000 (provider-quota), 60000 (preemption). packages/core/src/config/defaults.ts ships those defaults so an absent branch is valid with `defaults` origins. packages/core/src/config/schema.ts needs no bespoke generator change (the record kind is already supported); the typed projection `resolveQueueSettings` lands beside `resolveLaneSettings` in catalog.ts and enforces: a `park-recheck.<type>` name outside the closed condition set is `config.key.unknown` naming the key; a non-integer, zero, or negative value is `config.value.invalid` naming the key; no invalid input silently falls back. No capacity, bandwidth, concurrency, or CI-slot key is added or reserved. [F-8, F-12; DEC-1; AC-F8-2; NFR-10, NFR-14; TC: TC-VOCAB-004 full, TC-LEASE-007 config half, TC-PARK-006 config half, TC-VOCAB-005 no-capacity-key rows]"
      - "1.4 Error identities (Appendix F, NFR-11): packages/core/src/contracts/error-table.ts adds `queue` to DOMAIN_KINDS and exactly five rows — queue.dependency-cycle (user, not retryable, not_landed, user-validation), queue.lease-conflict (transient, retryable, not_landed, user-validation), queue.park-condition-stuck (platform, not retryable, not_landed, user-validation), queue.entry.unobserved (user, not retryable, not_landed, user-validation), queue.precondition.unmet (user, not retryable, not_landed, user-validation) — with remediation hints and summaries that name the real reachable behaviour. The closed collector-id set extends from {tracker} to {tracker, lanes} in packages/core/src/contracts/owner-gate-sla.ts (additive constant growth; the constant remains the single home of the closed set, its doc comment updated); the family shape, resolved row, and platform-provider exit-2 projection are unchanged and a family code naming an undeclared id stays fallback.internal. doc/spec/features/feature-result-contract.md gains the five queue rows and the status.collector.lanes.unavailable row in the SAME commit (bidirectional sync discipline); queue ready gains no row. [F-12; AC-F11-2, AC-F12-1; NFR-11, NFR-14; TC: TC-VOCAB-002 full, TC-VOCAB-003 structure half]"
      - "1.5 tests/structure/queue-scheduling-contract.test.ts + tests/fixtures/queue/vocabulary/** + tests/fixtures/queue/state/kinds/** — the closed-set inventory: lease scopes exactly two with one implemented; rank classes ordered and exactly four; weight classes exactly two with the four source evidence values; park condition types exactly three; recovery states exactly four; incident types exactly two; lane states exactly six; idle reasons drawn only from the declared closed set with no free-form string; record kinds exactly five plus one derived document, each with its own payload schema id and store-scoped key prefix distinct from state/command/engine schema ids; envelope field shapes per Appendix C in both directions; error rows present in the machine table, the documented table, the source references, and the fixtures; duplicate, wildcard, or extra entries fail by name; the new contract module is data-only (no call expressions, no runtime imports) and imports queue-ready rather than redefining a condition id, order, or tri-state. [F-12; NFR-11, NFR-14; TC: TC-VOCAB-001 structure rows, TC-VOCAB-002 sync rows, TC-VOCAB-003 structure rows, TC-VOCAB-005 full]"
