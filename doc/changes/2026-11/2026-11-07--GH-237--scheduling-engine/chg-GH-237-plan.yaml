      - "TC-PARK-008 (domain/state half: a stuck park is never resume-parked, never in nextActions, never selected by a no-ref claim, and a claim on it refuses at exit 1 with zero appends; reads/claim envelope rows complete in Phase 7)"
      - "TC-PARK-006 (completes: resume-timing and per-type recheck tuning)"
