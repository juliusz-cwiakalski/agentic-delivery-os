      - "7.2 Envelope data and exit projection (Appendix C, C-1, C-4): `list` returns entries[], leases[], weights, parks[], findings[], degraded[], truncated — `entries[]` carries the normalized repository key and never the recorded root (Appendix C declares no root field; DM-1/DM-12 keep the root internal-only), and no envelope, human text, or golden contains an absolute path; `plan --next n` adds nextActions[] with ref, repository, rankClass, reason, priority, weightClass, weightClassSource, lease status, blocking[], deploy evidence, and preemption block; mutations return ref, entry, edges[], result (added/updated/noop); claim returns result (claimed/renewed/taken-over), selectedRef, lease, action, degraded[]; release returns result (released/parked/noop), lease, park?, degraded[]. A no-ref claim names the deterministically selected ref or refuses queue.precondition.unmet with reason no-eligible-action at exit 1 and zero appends; a stuck-park claim refuses queue.park-condition-stuck at exit 1 with zero appends. A successful mutation with no daemon reachable exits 0 with degraded [daemon-unreachable]; a refused mutation projects its own exit-1 identity and never claims degradation as success. `queue list|plan` exit 2 with the classified state.* identity and bounded evidence when lease or park history is unreadable, torn, or of unknown kind, presenting no success verdict and no data sibling, partial view, or empty view as a schedule; a readable stuck park stays a report-only finding at exit 0. Text mode prints result=, ref=, lease=, next=, degraded= before human detail and result=refused before a classified refusal. [F-10, F-11; AC-F10-1, AC-F10-2, AC-F10-3; C-1, C-4, C-7; NFR-2, NFR-13; TC: TC-SCHED-008 full, TC-SCHED-009 full, TC-SCHED-016 full, TC-LEASE-006 read-surface rows, TC-PARK-007 read-surface rows]"
