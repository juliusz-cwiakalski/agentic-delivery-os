# GH-237 implementation plan — M1-S17: Scheduling engine: queue, lanes, dependency batching
#
# Sources (single source of truth):
#   - Spec:  ./chg-GH-237-spec.md (v1.1; F-1..F-12; 22 ACs AC-F1-1, AC-F2-1,
#     AC-F3-1(a)/(b), AC-F3-2, AC-F4-1, AC-F4-2, AC-F4-3, AC-F5-1, AC-F5-2,
#     AC-F6-1, AC-F6-2, AC-F7-1, AC-F7-2, AC-F8-1, AC-F8-2, AC-F9-1,
#     AC-F10-1, AC-F10-2, AC-F10-3, AC-F11-1, AC-F11-2, AC-F12-1;
#     DM-1..DM-14; EVT-1..EVT-6; NFR-1..NFR-14; DEC-1..DEC-13;
#     RSK-1..RSK-10; OQ-1..OQ-12 (OQ-12 delivery-bound naming);
#     §5.2 clarifications C-1..C-7; §18 delivery order; §24 Appendix A
#     seeded scenarios, Appendix B precedence order, Appendix C envelope
#     shapes, Appendix D record kinds, Appendix E configuration keys,
#     Appendix F error identities, Appendix G ticket AC map)
#   - Test plan: ./chg-GH-237-test-plan.md (v1.1; 65 TCs
#     TC-SCHED-001..016, TC-LEASE-001..013, TC-WEIGHT-001..004,
#     TC-DEPEND-001..006, TC-RANK-001..006, TC-PARK-001..007,
#     TC-LANES-001..006, TC-VOCAB-001..006, TC-COMPAT-001; §3 coverage;
#     §4 layer table; §5.1 index; §5.2 scenario details; §6 fixture corpus;
#     §7 automation mapping and implementation-order steps 1-7;
#     §8.3 OQ-T1..OQ-T8, OQ-T8 remains delivery-bound)
#   - Design baseline: doc/planning/oss-tooling/milestones/m1/contracts.md,
#     commands/queue.md, commands/lanes.md, architecture.md,
#     test-scenarios.md (SC-M1-08/09/10/11/17/17b),
#     doc/planning/concepts/parallel-delivery.md,
#     doc/planning/oss-tooling/cli-command-registry.md
#   - Delivered substrate reused, never re-implemented:
#     contracts/queue-ready.ts + domain/queue-ready.ts + commands/queue.ts
#     (ready only), contracts/state.ts + state/**, contracts/plan.ts +
#     domain/plan-validate.ts and plan-overlap.ts, contracts/verify-deploy.ts
#     + domain/verify-deploy.ts, contracts/economics.ts +
#     domain/economics-view.ts, config/{catalog,defaults,schema,resolver}.ts,
#     contracts/{result,error-table,envelope}.ts + cli/classify.ts,
#     contracts/owner-gate-sla.ts (collector family), provider parks.
#
# TC-mapping obligation: all 65 TCs are mapped onto Phases 1-8 below. TCs whose
# halves land in different phases are marked in `coverage` with their completing
# phase (GH-225/GH-234 discipline). Reconciliation notes against test-plan §7
# implementation-order mapping (no oracle is reshaped, only placement):
#   - TC-DEPEND-003..005 are grouped with parks in §7 step 5. They land in
#     Phase 3 (gates) here: the deploy-verified gate is Appendix B step 2, a
#     hard exclusion evaluated inside the readiness/precedence pass. It needs no
#     park record and is independently testable and revertible in Phase 3.
#   - TC-RANK-003 (the preemption action is emitted) lands in Phase 3 with the
#     rank/precedence pass, driven by injected lease facts; TC-RANK-004
#     (release + park in one fenced transaction) lands in Phase 5 with the park
#     record it writes.
#   - TC-LEASE-007 and TC-PARK-006 have a configuration-acceptance half in
#     Phase 1 (key shape, defaults, invalid-value refusal) and a behaviour half
#     that completes in Phases 4 and 5 respectively; `config.value.invalid` and
#     `config.key.unknown` are asserted where the key is parsed.
#   - TC-VOCAB-001 splits three ways: contract declarations in Phase 1,
#     entry/dependency round-trip in Phase 2, lease/park/incident round-trip
#     completion in Phase 5. TC-VOCAB-003 splits into the structure/sync half
#     (Phase 1) and the lanes exit-2 half (Phase 6).
#   - TC-SCHED-002 (state/graph half Phase 2, CLI `result=noop` rows Phase 7),
#     TC-SCHED-012 (queue read purity Phase 3, lanes read purity Phase 6), and
#     TC-SCHED-013 (determinism rows Phase 3, hermetic-suite rows Phase 7) are
#     split along the surface boundary.
#   - Phases 3-5 consume lease and park truth as injected facts. The
#     store-backed folds land in Phase 4 (leases) and Phase 5 (parks), so each
#     phase stays independently testable without a half-written store.
#
# Delivery decisions recorded by this plan (spec/test-plan leave them
# delivery-bound; each is a placement, spelling, or composition pin, never a
# behaviour change):
#   - Placement: the NEW scheduling contract module is
#     packages/core/src/contracts/queue.ts (the delivered contracts/queue-ready.ts
#     stays byte-unchanged; the scheduler imports its condition ids, tri-state,
#     evidence vocabulary, and reason vocabulary as types/data). Additive edits
#     only in contracts/index.ts (exports), contracts/error-table.ts (the
#     `queue` domain kind and five rows), and contracts/owner-gate-sla.ts (the
#     closed collector-id set extends to {tracker, lanes}).
#   - Placement: pure policy lives in NEW flat modules under
#     packages/core/src/domain/ — queue-graph.ts, queue-readiness.ts,
#     queue-weight.ts, queue-deploy-gate.ts, queue-precedence.ts, queue-rank.ts,
#     queue-lease.ts, queue-park.ts, queue-lanes.ts (the provider/parks.ts and
#     domain/economics-*.ts flat-module precedent). State-ledger composition
#     lives in NEW packages/core/src/state/queue.ts (the state/merge.ts
#     three-ledger precedent). CLI surfaces: extend
#     packages/cli/src/commands/queue.ts, add packages/cli/src/commands/lanes.ts,
#     compose in packages/cli/src/edge.ts.
#   - Composition seam: createQueueReadyCommandDefinition and the `options.queueReady`
#     edge seam are preserved unchanged so `queue ready` behaviour and output stay
#     byte-identical. The full family is a NEW createQueueCommandDefinition(runtime)
#     selected by the edge only when the scheduling runtime (`options.queue`) is
#     supplied; the ready-only definition remains the fallback. lanes composes
#     through a NEW options.lanes seam. No existing caller is rewired.
#   - Record kinds, payload schemas, and store keys are the Appendix D spellings
#     verbatim: queue.entry / delivery.queue.entry.v1 / queue.entries:<REF>;
#     queue.dependency / delivery.queue.dependency.v1 / queue.deps:<REF>;
#     queue.lease / delivery.queue.lease.v1 / queue.leases:<repoKey>;
#     queue.park / delivery.queue.park.v1 / queue.parks:<REF>;
#     queue.incident / delivery.queue.incident.v1 / queue.incidents:<REF or repoKey>;
#     derived document delivery.queue.graph.v1 at queue-graph.json. No schema
#     version bump, no migration, no backfill.
#   - Lane idle-reason spellings (OQ-T8 / GAP-T5): the closed set is the
#     delivered queue-ready condition-reason vocabulary (the Appendix B tokens
#     dependency-open, producer-not-landed, deploy-unverified, owner-gate,
#     tier-unknown, ci-<reason>, provider-<reason>, not-ready) plus the declared
#     scheduler-hold tokens lease-held, weight-class, outranked,
#     no-eligible-action, parked:<cause> (cause drawn from the closed park-cause
#     set), and restart-budget-exhausted for the failed state. Reasons are
#     resolved from that closed set and never free-form; a rename is a contract
#     change, not a test change.
#   - Concurrency proof: the fence harness under
#     tests/fixtures/queue/leases/fence-harness.ts schedules a pre-fence barrier
#     and drains the single-writer fence in a declared order over the injected
#     StateStorePort fake. No real OS race, worker thread, sleep, or multi-process
#     memory assumption. NFR-3 is asserted at the algorithmic contract (GAP-T3).
#   - Doc placement: the default is a NEW
#     doc/spec/features/feature-scheduling-engine.md per the first-spec rule
#     (the engine is a distinct capability surface); feature-queue-ready.md is
#     reconciled as the unaffected neighbour. Final placement is confirmed at
#     doc-sync (lifecycle phase 7); the docs-touch list is declared as Phase 8
#     scope.
#
# Open questions carried, not invented: OQ-2 (preemption authority) and OQ-4
# (the public claim/release surface once M1-S9 lands) are deferred by PM decision
# to M1-S18 and M1-S9 planning; this plan computes the preemption action and
# requires an explicit release. OQ-12 (delivery-bound lane idle-reason spellings)
# is closed for delivery by the closed-set pin above; there is no plan-level
# blocking question. OQ-1 is the explicit-membership assumption (Section 12);
# OQ-3 and OQ-5..OQ-11 are resolved by spec v1.1 and carried as stated.
#
# Tier rationale: `full` — 12 capabilities, 22 ACs, 65 automated TCs across the
# core contract/domain/state tiers and the CLI surface, cross-cutting vocabulary
# growth (five record kinds, five error rows, one collector id, one configuration
# branch), security_impact medium (structural mutual exclusion, fail-closed
# reads), risk_level high (RSK-1 lease races, RSK-6 deploy gating). All phases
# are delivery kind; plan-level defaultLeases/defaultWeightClass apply. Per-phase
# completion: one Conventional Commit (the `summary`, landed via @committer) plus
# the `testGate` commands passing; typed doneArtifacts are declared on the final
# phase where the evidence exists.
#
# Honest boundaries (excluded from this plan; reviewers should see them here):
#   - M1-S18 (GH-238) owns the resident daemon, control socket, NDJSON wire
#     protocol, install/uninstall, startup reconciliation, automatic preemption
#     execution, and live `--watch` streaming. This plan delivers one-shot
#     scheduling only; `--watch` is refused through fallback.invocation (NG-2,
#     NG-3, DEC-7).
#   - M1-S9 (GH-239) owns dispatch, session spawn, delivery execution, harness
#     selection, resume, and handover. This plan delivers claim/release and the
#     scheduling step they compose (NG-1, DEC-6).
#   - Also out: tracker writes, merge execution and gate evaluation, worktree
#     leases, capacity/bandwidth/CI-slot policy, fleet/multi-host coordination,
#     status-digest behaviour (NG-4..NG-10).
#
# Invariants carried by every phase (spec §9, §21; DEC-1..DEC-13):
# scheduling policy is pure and runtime-neutral (imports only core contracts and
# domain peers; NFR-1, NFR-3, NFR-14); an identical state + injected clock
# produces byte-identical payloads, findings, reasons, and human text (NFR-1);
# read surfaces perform 0 writes, 0 fences, 0 appends, 0 derived replacements
# (NFR-2); the claim re-reads inside the fence and verifies exactly one new lease
# post-append (NFR-3); a live lease is never taken over and every takeover is
# evidenced (NFR-4); a failed, unavailable, unread or unresolved source is
# evidence and `unknown`, never `satisfied`, never free, never not-parked
# (NFR-13); `queue ready` stays byte-identical (NG-4, AC-F12-1); the state schema
# keeps its version and existing stores read verified-empty (NFR-8); no secret,
# credential, raw provider payload, or free-form message body enters any record,
# envelope, finding, or incident (NFR-12); the test battery is hermetic — zero
# live network, zero live credential reads, zero real sleeps, zero sockets
# (NFR-7); no capacity, bandwidth, concurrency, or CI-slot key or code path
# exists (DEC-1, NFR-14).
#
# Validation: `plan validate` must return valid for this file; phases are
# ordered, scopes are concrete, and every interaction target is covered by its
# phase scope. Shared files across phases are named in the task text
# (domain/index.ts, state/queue.ts, commands/index.ts, the shared behaviour and
# structure test files) so sequencing is honest rather than implied.

schemaVersion: delivery.plan.v1
workItemRef: GH-237
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8]
  escalationTriggers:
    - "a lease can be acquired twice for one repository, or a live lease is taken over"
    - "a read surface writes, or serves an empty/partial schedule on unreadable lease or park state"
    - "queue ready output or an existing error row changes"
    - "a capacity, bandwidth, concurrency-budget, or CI-slot key or code path is introduced"
    - "a park resumes without a recovery incident, or a cleared park stays active without the stuck finding"
    - "deploy expectations are read from anywhere other than the producer repository's own configuration bound to its recorded key"
defaultLeases:
  - repo:main-tools
defaultWeightClass: standard
phases:
