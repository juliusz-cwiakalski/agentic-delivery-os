ht cap, or no eligible action for a no-ref claim (reason no-eligible-action). A claim without a ref selects the top-ranked eligible action from the same precedence and readiness computation deterministically (ties resolved by Appendix B steps 10-13) and never an arbitrary entry; the envelope names the selected ref. Release of another holder's live lease refuses; release with no lease is an idempotent noop. [F-3, F-4; AC-F3-1(b), AC-F4-1, AC-F4-3; DEC-2; NFR-3, NFR-4; TC: TC-LEASE-003 full, TC-LEASE-005/012/013 domain/state policy rows (command/envelope/exit rows complete in Phase 7), TC-LEASE-009 full]"
      - "4.2 packages/core/src/app/queue.ts — the queue.lease ledger (shared file, extended from Phase 2): the two-stage claim in order — the pre-fence five-condition and park evaluation happens before any fence is taken and excludes repo-free, then acquire the state fence, re-read verified lease history for the repository key INSIDE the fence, append only when the read shows no live lease, a stale lease eligible for takeover, or the caller's own lease (renewal heartbeat refresh), then verify the post-append read shows exactly one new record of the expected kind under the repository key, and release the fence. The in-fence read owns the exclusivity outcome: a live lease held by another holder is queue.lease-conflict, never queue.precondition.unmet. One record per operation with writer attribution, scope, repository key, holder, ref, runner, weight class, acquiredAt, heartbeatAt, ttlMs, lifecycle operation, and takeover evidence. An unreadable or torn lease history is never read as free: the claim refuses state.* at exit 2 with zero appends. A duplicate acquisition for one (repository, holder, acquisition) is refused state.*. Release plus park is one fenced transaction (park half completes in Phase 5; the release-only path lands here). [F-4, F-12; AC-F4-1, AC-F4-2; EVT-3; DEC-2; NFR-3, NFR-13; TC: TC-LEASE-001/002/004/006/010/011 domain/state rows (command/envelope/exit rows complete in Phase 7)]"
      - "4.3 tests/behaviour/queue-lease-concurrency.test.ts + tests/fixtures/queue/leases/fence-harness.ts — the deterministic fence harness: both claims observe no-lease at a pre-fence barrier, the single-writer fence is then drained in a declared order, and the operation log asserts the in-fence re-read precedes every append. 50 scheduled claims against one repository from 50 DISTINCT holders (holder-01..holder-50, no holder repeats, so no attempt is a same-holder renewal) yield exactly 1 acquisition, exactly 0 renewals, and 49 queue.lease-conflict refusals; zero duplicate lease records; zero claims land without post-append verification. A paired same-holder control asserts the repeat claim is result=renewed and is never counted as a conflict, proving why the distinct-holder fixture is required (NFR-3's scoping to distinct holders). This is an algorithmic proof (GAP-T3), not an OS-scheduler claim. [F-4; AC-F3-1(b), AC-F4-1; NFR-3; TC: TC-LEASE-002/004 domain/state rows (result= and exit-projection rows complete in Phase 7)]"
      - "4.4 tests/behaviour/queue-lease.test.ts over tests/fixtures/queue/leases/** — single-flight both as the read projection (at most one eligible action per repository: before any lease exists the other ready entry is held repo-claimed-in-pass, a per-pass projection reason distinct from lease-held; once a lease exists the other entry is named lease-held with holder and lease evidence, without claiming) and as the mutating enforcement (one repo-exclusive holder, the rest refused); conflict refusal names holder, lease identity, acquisition time, heartbeat age, and earliest takeover-eligible time; staleness at bound-1, bound, and bound+1; an at-or-beyond-TTL lease is taken over with full evidence and appends a lease-stale-takeover incident, while a live lease is never taken over; renewal of one's own lease refreshes the heartbeat without changing the holder; release of another holder refuses; release with no lease is a noop; an unreadable/torn history refuses state.* at exit 2 with zero writes and never reports free; repository-key normalization rows (protocol, credentials, userinfo, .git); scope rows; and the lease-ttl configuration-only tuning pair (fixtures differ only in queue.lease-ttl; provenance reports the changed value; no source diff). [F-3, F-4; AC-F3-1, AC-F3-2, AC-F4-1, AC-F4-2; NFR-3, NFR-4, NFR-10; TC: TC-LEASE-001/005/006/010/012/013 domain/state rows (command/envelope/exit rows complete in Phase 7), TC-LEASE-003 full, TC-LEASE-007 completes, TC-LEASE-008 full, TC-LEASE-009 full]"
