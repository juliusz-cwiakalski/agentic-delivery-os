      - "3.3 packages/core/src/domain/queue-deploy-gate.ts — dependency and deploy gating (F-6, C-6, DEC-13) over injected ports: a consumer is not eligible while its producer is unresolved (held dependency-open); producer landing is observed through the delivered landing evidence (producer-not-landed otherwise); when the producer repository declares merge.deploy-expectations, the delivered verify deploy verdict must be verified with evidence; unknown, failed, or an unreadable trace holds the dependent at deploy-unverified, never green; a missing, unreadable, or invalid producer configuration yields unknown (never not-declared, never verified); no declared expectation passes on landing with evidence deploy: not-declared; deploy verdict reads are bounded per pass (3) and memoized per producer, with overflow held deploy-unverified and reason read-budget-exhausted. Expectations are resolved from the producer repository's own configuration bound to the producer entry's recorded repository key, never the invocation's configuration (C-6, DM-12). Producer roots are discovered ONLY from entry records: a candidate root is used only when its own normalized remote equals the recorded key by exact string equality; when no recorded root matches the key, or two distinct recorded roots both claim the key (a collision, never resolved by picking one), or the matched config is missing, unreadable, or invalid, the expectation is `unknown` (never not-declared and never verified) and the dependent holds deploy-unverified. [F-6; AC-F6-1, AC-F6-2; NFR-6, NFR-13; TC: TC-DEPEND-001..006 full]"
      - "3.4 packages/core/src/domain/queue-rank.ts — rank classes and preemption (F-7, DM-8, DM-10): merge-ready and in-review reuse the delivered close-association classification (merge-ready requires an observed approval on a non-draft open pull request; in-review is the review-pending population); resume-parked applies only to a parked entry whose condition evaluated clear in this pass (an uncleared park is not a candidate); a park classified queue.park-condition-stuck is excluded BEFORE rank assignment (Appendix B step 7b): it is never resume-parked, never appears in nextActions, and is never selected by a no-ref claim; the closed order merge-ready < in-review < resume-parked < new-start; a close item eligible for a repository whose lease is held by a new start emits a preemption action naming park cause preempted-for-close-item (paired with condition type preemption), the holder, and the motivating close item, and the close item is still not scheduled that pass (single-flight holds). Preemption execution is out of scope (M1-S18); the action is computed and the release is explicit. [F-7; AC-F7-1, AC-F7-2 emission half, AC-F8-1 stuck-park exclusion; DEC-4; NFR-1; TC: TC-RANK-001 behaviour/ordering half (queue plan --next and golden rows complete in Phase 7), TC-RANK-002 full, TC-RANK-003 full, TC-RANK-005 selection rows, TC-RANK-006 full; TC-PARK-008 exercises the stuck-park exclusion from Phase 5]"
      - "3.5 packages/core/src/domain/queue-precedence.ts — the single total order of Appendix B: steps 1-9 (including step 7b, the stuck-park hard exclusion) are hard exclusions that remove a candidate with a named reason and never reorder; steps 10-13 order by rank class, then producer-before-consumer within one repository, then explicit priority ascending (declared default when undeclared), then numeric ref suffix, then canonical ref text; step 13b is the per-pass single-flight projection — after ordering, at most one action per repository is projected and the remaining ready entries in that repository are held with reason repo-claimed-in-pass, a per-pass projection reason distinct from lease-held (which requires an actual lease), and a later pass re-evaluates them; step 14 emits a preemption action only. No input iteration order, locale, or object-key order enters the comparison. The schedule result carries nextActions[] with ref, repository, rankClass, reason, priority, weightClass, weightClassSource, lease status, blocking[], deploy evidence, and the preemption block when present. Candidate ordering uses cheap graph facts over the whole entry set; the expensive readiness reads are performed for at most the first 32 ordered candidates, with the remainder marked truncated and a named reason; 500 entries and 1000 edges complete within the recorded baseline excluding provider reads (NFR-6). [F-3, F-9; AC-F3-1(a), AC-F9-1, AC-F7-1; DEC-9; NFR-1, NFR-6; TC: TC-SCHED-006 full, TC-SCHED-007 full, TC-SCHED-011 full, TC-RANK-006 full]"
      - "3.6 tests/behaviour/queue-readiness.test.ts, queue-weight.test.ts, queue-depend.test.ts, queue-rank.test.ts, queue-precedence.test.ts, queue-schedule.test.ts over the Phase-3 fixture corpora — the six-condition matrix and failed-source rows; weight resolution across validated/absent/unreadable/invalid plans; the full dependency/deploy matrix including producer-bound expectations across a multi-repository state directory; rank and preemption rows; a generated precedence corpus mixing every gate, both weights, all three park condition types, both dependency roles, close and new-start classes, and explicit priorities in multiple input orders (the result is invariant); the per-pass projection rows (exactly one action per repository; the remainder held repo-claimed-in-pass before any lease exists; once a lease exists the other entry is named lease-held with holder and lease evidence, without claiming); 100 identical passes byte-identical; bounds and truncation markers; the ≤ 250 ms structural/perf baseline with warm-up and a recorded measurement; and zero state writes on the queue read path (the queue command-level zero-write rows complete in Phase 7; the LANES half completes in Phase 6). [F-2, F-3, F-5, F-6, F-7, F-9; AC-F2-1, AC-F3-1(a), AC-F5-2, AC-F6-1, AC-F6-2, AC-F7-1, AC-F9-1; NFR-1, NFR-2, NFR-6, NFR-9; TC: TC-SCHED-003, TC-SCHED-004 readiness/read-projection half, TC-SCHED-005, TC-SCHED-006, TC-SCHED-007, TC-SCHED-011, TC-SCHED-012 queue read half, TC-SCHED-013 determinism rows, TC-WEIGHT-002, TC-DEPEND-001..006, TC-RANK-001 behaviour rows, TC-RANK-002, TC-RANK-003, TC-RANK-005 selection rows, TC-RANK-006 (splits per the coverage list)]"
