      - "TC-VOCAB-001 (completes: lease/park/incident round-trip rows; `queue.park` is a new kind whose first-write schema carries `clearObservedAt`/`recoveryState`, and the clear-observed marker is another record of that same kind, not a sixth kind)"
    testGate:
