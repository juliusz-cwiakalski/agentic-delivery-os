        target: packages/core/src/app/queue.ts
        role: producer
    summary: "feat(GH-237): parks with per-type recheck, durable clear-observed marker, recovery incidents, and the stuck finding"
    tasks:
      - "5.1 packages/core/src/domain/queue-park.ts — park evaluation policy (F-8, C-3, DEC-3): TWO distinct closed sets that are never conflated — the condition-type set that a pass re-evaluates (provider-window, clears at the provider window absolute expiry; provider-quota, clears when the provider condition is observed available; preemption, clears when the preempting lease on the repository is released and the entry is ready again) and the cause set that explains why the lease was released (provider-window, provider-quota, preempted-for-close-item). The valid pairing is one-to-one: cause provider-window <-> condition type provider-window; cause provider-quota <-> condition type provider-quota; cause preempted-for-close-item <-> condition type preemption. The preemption condition supplies no absolute expiry and is re-evaluated each pass at the preemption recheck interval. A park carries entry, repository key, closed cause, closed condition type, the typed evaluable condition, absolute expiry when supplied, the resolved recheck interval, last evaluation time, clearObservedAt, and recoveryState. Each active park whose interval has elapsed is re-evaluated; a park that is not yet due is reported as active with its interval and last evaluation. Owner gates and external waits are readiness blockers, never parks. At most one active park per entry. [F-8; AC-F8-1, AC-F8-2; DM-5, DM-14; TC: TC-PARK-001/004 domain/state rows, TC-PARK-006 per-type recheck rows]"
      - "5.2 Recovery and the durable marker (C-3, NFR-5): a mutating pass that observes a condition clear first appends a queue.park record with recoveryState clear-observed, clearObservedAt, the evaluation time, and the observation gap since the previous evaluation, then attempts recovery; if recovery lands in the same pass the recovered record supersedes the marker and a queue.incident of type park-auto-recovery records the condition, clear time, evaluation time, and observation gap; if the recovery append is refused the marker persists and the pass returns queue.park-condition-stuck. A park observed clear but still active on a later pass, or whose recovery append was refused, is the stuck class: reads report queue.park-condition-stuck as a report-only finding at exit 0, the entry is NEVER a resume-parked candidate, NEVER appears in nextActions, and is NEVER selected by a no-ref claim, and a claim on that entry refuses at exit 1 with the same identity, consequence not_landed, and zero appends, never falling through to a lease conflict. A park skipped only because no engine ran recovers with a gap-naming incident and is never reported stuck solely because the gap exceeded the interval. Reads never append. [F-8; AC-F8-1; C-3, C-7; NFR-2, NFR-5, NFR-13; TC: TC-PARK-001 domain/state rows, TC-PARK-002/003/005 full, TC-PARK-008 hard-exclusion and claim-refusal policy rows]"
      - "5.3 packages/core/src/app/queue.ts — the queue.park and queue.incident ledgers (shared file, extended from Phase 4): fenced appends, verified post-append reads, latest-record-wins for one entry, the clear-observed marker and its supersession by recovered, and the incidents ledger keyed by ref for recovery and by repository key for takeover. A second active park for one entry, a wrong kind, or a malformed payload is classified state.* and never a fabricated park. An unreadable or torn park history is never read as not-parked: reads that cannot verify it fail closed with the classified state.* identity, and a claim on it refuses at exit 2 with zero writes. [F-8, F-12; EVT-4, EVT-5; NFR-8, NFR-13; TC: TC-PARK-004 domain/state half (its `queue release --park` CLI/`fallback.invocation` row completes in Phase 7), TC-PARK-007 state half]"
      - "5.4 tests/behaviour/queue-park.test.ts over tests/fixtures/queue/parks/** — a provider-window park ending at T resumes on the first mutating pass after T within one recheck interval with the incident naming condition, clear time, evaluation time, and observation gap; the clear-observed marker precedes recovery and survives a refused recovery; a clear-but-active park yields the report-only finding at exit 0 and a claim refusal at exit 1 with zero appends; a stuck park is never a resume-parked candidate, never appears in nextActions, and is never selected by a no-ref claim (tests/fixtures/queue/parks/stuck-not-next-action/**); an observation gap yields a gap-naming incident and never a stuck finding; boundary instants at T-1, T, T+1; recheck-interval configuration-only tuning (fixtures differ only in queue.park-recheck.<type>; provenance reports the changed value; no source diff); an unknown condition-type key is config.key.unknown and an invalid interval is config.value.invalid naming the key; unreadable park history is never not-parked. [F-8; AC-F8-1, AC-F8-2; NFR-5, NFR-10, NFR-13; TC: TC-PARK-001 domain/state rows (queue claim mutating-pass CLI rows complete in Phase 7), TC-PARK-002/003/005 full, TC-PARK-006 completes, TC-PARK-007 domain/state rows (exit-2 rows complete in Phase 7), TC-PARK-008 domain/state half (reads/claim envelope rows complete in Phase 7)]"
      - "5.5 Release plus park atomicity (F-7, AC-F7-2, F-8): at the contract/state layer, `queue release <ref> --park <cause>` accepts EXACTLY the closed cause set {provider-window, provider-quota, preempted-for-close-item}; any other token — including a condition-type token — is rejected with zero appends; omitting --park releases without a park; an accepted cause is recorded together with its paired condition type (cause preempted-for-close-item <-> condition type preemption). The release and the park record append in the SAME fenced transaction — both land or neither, a refused append lands nothing. A release of another holder's live lease still refuses. The CLI grammar projection of the same cause set (exit 1 through `fallback.invocation` for a condition-type or unknown token) completes in Phase 7 with the command family (TC-PARK-004 step 8, TC-LEASE-011, TC-RANK-004). [F-7, F-8, F-4; AC-F7-2, AC-F8-1; DM-5, DM-10; TC: TC-RANK-004 domain/state half (release--park envelope/exit rows complete in Phase 7), TC-LEASE-011 release+park half (command rows complete in Phase 7), TC-PARK-004 domain/state half (step 8's CLI grammar row completes in Phase 7)]"
      - "5.6 Preemption rows re-asserted with real park state (shared queue-rank.test.ts): the preemption action names the holder and the motivating close item and the park cause preempted-for-close-item paired with condition type preemption; after the explicit release-park the close item schedules on the next pass and the preempted entry becomes resume-parked and ranks above new starts once its condition clears. [F-7; AC-F7-2, AC-F7-1; TC: TC-RANK-003 re-asserted, TC-RANK-004 domain/state half]"
      - "5.7 TC-VOCAB-001 completion rows in tests/structure/queue-scheduling-contract.test.ts: lease, park, and incident records round-trip through the real ledgers with their Appendix D schema ids and store keys; `queue.park` (payload delivery.queue.park.v1, key queue.parks:<REF>) is one of this change's five NEW record kinds, and its first-write schema already carries `clearObservedAt` and `recoveryState` — the durable clear-observed marker is another record of that SAME new `queue.park` kind (a field set on the same kind), not a sixth record kind and not a mutation of a pre-existing kind; the kind inventory stays five new kinds plus one derived document, with no schema-version bump, no migration, and no compatibility path. [F-12; EVT-3..EVT-5; NFR-8; TC: TC-VOCAB-001 completes]"
      - "5.8 Register the source file this phase creates — packages/core/src/domain/queue-park.ts — in tests/structure/inventory.json, add its per-file executable allowance in tests/structure/content-inventory.test.ts, and run the inventory test in the phase gate. Shared inventory files (Phases 1-6 by design). (R-14) [NFR-11; TC: TC-VOCAB-002 tooling half]"
    coverage:
