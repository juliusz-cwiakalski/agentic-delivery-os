# GH-235 implementation plan — M1-S15: Session lifecycle economics
#
# Sources (single source of truth):
#   - Spec: ./chg-GH-235-spec.md (v1.1; F-1..F-7; 13 ACs AC-F1-1..AC-F7-1;
#     DM-1..DM-6; NFR-1..NFR-9; RSK-1..RSK-6; DEC-1..DEC-9 binding, not
#     reopened; §6 flows 1-4; §8.1 outcome/identity/exit matrix; §8.2 record
#     kinds + DEC-9 evidence carriage; §18 delivery order)
#   - Test plan: ./chg-GH-235-test-plan.md (v1.1; 37 scenarios TC-ECON-001..084;
#     GAP-T3..T6; OQ-T3..T8 delivery-bound; §7 gate battery; §8 risks TR-1..TR-12)
#   - Delivered base: GH-221 watchdog/lane contracts (packages/core/src/
#     contracts/watchdog.ts, domain/watchdog.ts, cli/src/commands/watchdog.ts)
#     and GH-233 harness adapters (contracts/harness.ts, domain/
#     harness-liveness.ts, adapters/src/harness/{opencode,claude}.ts,
#     testkit conformance) — branch base a69b555e per pm-notes.
#
# TC-mapping obligation (test plan GAP-T6): all 37 TCs are mapped onto Phases
# 1-7 below without reshaping any pinned identity, exit, corroboration rule,
# precedence, vocabulary, or AC/NFR/DEC traceability. TCs whose halves land in
# different phases are marked in `coverage` with their completing phase
# (GH-225 GAP-1 discipline). TC-ECON-083 is the lifecycle-phase-7 manual
# documentation check; it rides the Phase-7 spec-reconciliation handoff and is
# not a delivery-phase TC.
#
# Delivery decisions recorded by this plan (GAP-T5/OQ-T3..T8 — spellings and
# placement choices fixed here so delivery is deterministic; each is contract
# data or a placement rule, never a behaviour change — a real deviation would
# reopen the test plan, not ship):
#
#   D-1 Seam map (GAP-T5). The one data-only contract home is
#     packages/core/src/contracts/economics.ts. Domain (pure, injected ports
#     only): packages/core/src/domain/economics-budget.ts (the single
#     admission gate), economics-resume.ts (classification + the two resume
#     compositions), economics-view.ts (the rebuildable fold/amplification),
#     economics-evidence.ts (the one key=value corpus formatter). State
#     runtime: packages/core/src/state/economics.ts (commit-telemetry.ts
#     pattern). Adapter sourcing: packages/adapters/src/harness/{opencode,
#     claude}.ts declarations + packages/core/src/domain/harness-liveness.ts
#     assembly/bridge. Command edge: packages/cli/src/commands/watchdog.ts
#     (the stalled-to-failure flip) + packages/cli/src/edge.ts
#     (createWatchdogCommandRuntime — the zero-source wiring point, line
#     ~1901 — gains the sourced composition). Field-name spellings inside
#     these modules beyond those pinned below stay implementation-bound; the
#     closed key sets and semantics are pinned by the test plan.
#   D-2 Error-table rows (DEC-1, DEC-2). All four rows mirror the delivered
#     watchdog family field pattern: category "user", retryable false,
#     consequence "not_landed", projectionClass "user-validation" (pinned by
#     TC-ECON-003 step 4 — exit 1, no platform-provider row). Distinct
#     non-empty remediation hints keep DEC-7's remediation pair exact:
#     watchdog.liveness-stalled → corroborated stall, budget-governed restart
#     response; dispatch.restart-budget-exceeded → fresh-budget requeue path
#     (coordinator/operator action); dispatch.resume-uneconomical →
#     capability/harness change or accept-the-cost re-evaluation. DOMAIN_KINDS
#     gains "dispatch" appended after "retro"; the two dispatch rows land in
#     the declared order restart-budget-exceeded then resume-uneconomical;
#     watchdog.liveness-stalled is the fourth watchdog row in append order.
#   D-3 Sourced-signal vocabulary (DEC-8). ECONOMICS_SOURCED_SIGNAL_KINDS =
#     ["heartbeat-age", "token-delta"] as const — kebab-case matching the
#     delivered kinds; one home in contracts/economics.ts; disjoint from
#     HARNESS_LIVENESS_KINDS, which stays exactly ["session-traffic",
#     "worktree-activity", "process"] and is never touched. The neutral
#     HarnessLivenessReport gains ONE additive optional member `sourcedSignals`
#     (contracts/harness.ts); readings (the exact-three shape) are unchanged.
#     The bridge projects heartbeat-age → heartbeatAgeMs (ms), token-delta →
#     tokenDelta, session-traffic → traffic (existing); absent stays absent.
#   D-4 Record kinds, schemas, and keys (GAP-T5/OQ-T6).
#     ECONOMICS_RESTART_RECORD_KIND = "economics.restart" with payload schema
#     id "delivery.economics.restart.v1"; ECONOMICS_EXHAUSTION_RECORD_KIND =
#     "economics.budget-exhaustion" with schema id
#     "delivery.economics.exhaustion.v1" (commit.telemetry /
#     delivery.commit.telemetry.v1 precedent). OQ-T6 decision: per-delivery
#     store-scoped keys — the delivery's economics records live under one
#     work-item-scoped key, folded per delivery — because the budget is per
#     delivery (spec §12) and per-delivery keys give TC-ECON-050/060's
#     isolation for free. Record payload floor per DM-2: work item, run,
#     session identity, ordinal, classified reason, repayTokens (token
#     classes), timestamps — plus the additive optional observed
#     uniqueProgressTokens datum D-6 needs (null when unobserved).
#   D-5 Restart reason vocabulary. ECONOMICS_RESTART_REASONS =
#     ["watchdog.liveness-stalled", "session-interrupted"] as const — the two
#     reasons traceable to the spec's flows (Flow 1→3 stalled-verified
#     restart; Flow 2 re-entry after interruption). Additive growth is a
#     reviewed change.
#   D-6 Amplification formula, baseline, flag, and null rule (OQ-T3).
#     View fields: restarts, resumeAmplification, restartHistory (ordered by
#     ordinal: ordinal, reason, repayTokens, sessionId, recordedAt),
#     amplificationFlag, warnings — restarts/resumeAmplification pinned by the
#     milestone dispatch envelope (TC-ECON-001 step 4). Formula:
#     resumeAmplification = (Σ repayTokens across restart events) /
#     uniqueProgressTokens, where uniqueProgressTokens is the latest non-null
#     observed unique-progress figure on the delivery's restart records (the
#     D-4 additive datum; recorded at restart time from the same read-only
#     session facts the re-pay delta comes from — no harness re-query, NFR-5).
#     RESUME_AMPLIFICATION_BASELINE = 1 (healthy: no re-pay, ratio undefined).
#     Zero restart records → NO ratio and NO flag (TC-ECON-061 step 6). Ratio
#     strictly above the baseline → amplificationFlag = "restart-loop"
#     (RESUME_AMPLIFICATION_LOOP_FLAG). Either figure missing → ratio null +
#     closed-vocabulary warning naming field and ordinal — never 0, never an
#     estimate (TC-ECON-062, §10). Properties asserted, constants not frozen
#     beyond the declared names: ordering, monotonicity, baseline, flag name,
#     null rule (TR-6).
#   D-7 Refusal-evidence corpus (DEC-9). One formatter (domain/
#     economics-evidence.ts): deterministic key=value pairs, joined "; ",
#     keys in the declared fixed order per refusal class, total corpus
#     bounded (≤ 512 bytes), no free-form prose. Stall corpus keys: reason,
#     heartbeatAgeMs, tokenDelta, traffic, stallBoundMs. Budget corpus keys:
#     reason, restarts, historyRef. Uneconomical corpus keys: reason,
#     repayTokens, economicsRef. historyRef/economicsRef spelling:
#     "economics/" + the work-item ref (e.g. economics/GH-235) — resolves to
#     the delivery's durable
#     economics records (the §8.2 resolvable full-history carrier). The error
#     object key set is unchanged; the corpus rides the existing failure
#     fields.
#   D-8 Terminal-record consumer-field contract (OQ-T8), declared as a
#     contract type in contracts/economics.ts: workItemRef, runId, reason,
#     restarts, historyRef, terminal (true), options, recordedAt. options is
#     the closed ECONOMICS_EXHAUSTION_OPTIONS = ["requeue-fresh-budget",
#     "park-owner-review"] as const — the seed SC-M1-15's declared question
#     options ("requeue with fresh budget, park for owner review",
#     doc/planning/oss-tooling/milestones/m1/test-scenarios.md SC-M1-15)
#     mapped one-to-one in kebab-case, so the terminal record carries exactly
#     what M1-S16 needs to render the seed's declared options; carried as
#     data only — nothing here publishes a question. (DEC-7's fresh-budget
#     vs. capability/harness-change pair stays what it always was: the
#     DISTINCT-remediation rule for the two refusal identities in D-2 — it
#     is not the options vocabulary.)
#   D-9 Unevaluable budget classification (OQ-T4): reuse existing rows —
#     torn/gapped/duplicated ordinal sequences → state.store.torn; unknown
#     record kind among the delivery's records → state.store.unknown;
#     unreadable store → the delivered state-store unreadable classification
#     (exact delivered spelling confirmed against contracts/error-table.ts at
#     delivery; no new row, never fallback.internal). Fail-closed: an
#     unevaluable budget refuses; count 0 is never fabricated.
#   D-10 Terminal append discipline (OQ-T5): ONE exhaustion record per
#     delivery, appended at the first refusal that observes exhaustion;
#     idempotent thereafter — later refusals re-read the single terminal
#     truth and never overwrite or fork it (TC-ECON-053 step 5).
#   D-11 Config read time (OQ-T7): the gate reads the resolved
#     lane.restart-budget at evaluation time (a changed resolved bound is
#     observed at the next evaluation — TC-ECON-072 step 6); no
#     construction-time capture, no bound literal in the gate module (the
#     default 3 lives only in the config defaults layer).
#   D-12 Lane branch validation domains (reconciling TC-ECON-071's invalid
#     matrix with TC-ECON-072's fixtures): lane.restart-budget accepts
#     integers ≥ 0 — 0 is a VALID policy meaning "admit no restarts; refuse
#     the first attempt" (TC-ECON-072 step 1 pins its resolvability and gate
#     behaviour), so the budget's invalid set is negative / non-integer /
#     wrong type; lane.liveness-interval accepts integers > 0 ms (0 and
#     negative are invalid). TC-ECON-071's parenthetical `0` therefore binds
#     the interval; the budget-0 fixture in TC-ECON-072 is the positive
#     control for a resolvable zero bound. Unknown key → config.key.unknown;
#     wrong type/invalid value → config.value.invalid; no new configuration
#     identity.
#   D-13 No execution, no new boundaries: the economics surface adds no
#     spawn/kill/steer/restart-execution port and no new node:child_process
#     site — sourcing reads through the injected store/process seams the
#     adapters already reach (the GH-233 runtime-API allowance for
#     packages/adapters/src/harness/ already covers them; no
#     .dependency-cruiser.cjs rule changes, no negative-fixture obligation,
#     no new workspace edge, no new dependency). The bash-era stack is
#     untouched (§7.2 [OUT]).
#
# Four-deliberate-update placement (test plan §3.4 / TC-ECON-082 step 6):
# the spec §18 same-phase rule (each new row and its documented row land in
# the same phase) forces updates (i) WATCHDOG_ERROR_CODES exactly-three →
# exactly-four and (ii) the error-table exact total into Phase 1, and a green
# phase boundary forces updates (iii) GH-221's zero-source reachability rows →
# reachability assertions and (iv) now-sourced-lane fixtures that expected
# signals-absent into Phase 4 (the flip phase). Two further updates are
# deliberate and declared, not silent drift: (v) the exact PRODUCTION_CATALOG
# key list in tests/behaviour/config-schema.test.ts and (vi) the exact key list
# in tests/structure/config-contract.test.ts each gain the new `lane` branch —
# exact-list extensions for a genuinely new config branch, never a floor or a
# deletion — and biome.json gains narrow formatter overrides for the golden
# fixture folders so committed goldens stay byte-stable. Phase 6 runs the
# regression battery and pins that the four test-expectation updates (i)-(iv)
# plus the declared config/golden updates (v)+(vi) are the complete set — no
# undeclared fifth existing-suite change, no floor, no deletion.
#
# Tier rationale: `full` — 7 capabilities, 13 ACs, 37 automated TCs,
# cross-package delivery (core contracts + domain + state + config, adapters
# harness subpath, cli command edge + wiring, testkit conformance), with the
# NFR-9 tier/brand battery and a delivered-contract flip. All phases are
# delivery kind; plan-level defaultLeases/defaultWeightClass apply. Per-phase
# completion artifacts: one Conventional Commit per phase (the `summary` key,
# landed via @committer) plus the `testGate` commands passing; typed
# doneArtifacts slots are declared on the final phase where the evidence
# exists.
#
# Invariants carried by every phase (spec §21, NFR-1..NFR-9): DEC-4 full
# corroboration over sourced values — heartbeat age ≥ bound AND tokenDelta 0
# AND traffic 0, anything less progresses, absent never coerced to 0, unknown
# never acted on as stall; no CPU field anywhere (DEC-6); DEC-8 exact-three
# liveness kinds + additive sourced-signal kinds; DEC-7 precedence (past-budget
# refusal before economics; attach-continue consumes no ordinal); one budget
# gate, every resume path, fail-closed (DEC-3, §21); DEC-9 corpus + resolvable
# record reference, frozen error shape; exits only {0, 1, 2} with exit 2
# reserved for source-unavailable; additive state records, no schema bump;
# figures degrade null-with-warning, never fabricate (§10); no product/binary
# literal, injected brand; data-only contracts, pure domain, per-harness logic
# only in the adapter seam; determinism under identical injected facts.

