    location: packages/core/src/domain/economics-resume.ts:155
    message: >-
      DEC-7 precedence violated on a reachable corner: the evidence-completeness refusals
      (tokensReadable/costReadable/repayTokens checks, lines 155-164) run BEFORE the budget
      gate (line 183). A past-budget delivery with unreadable or missing token facts is
      refused with harness.telemetry.extraction-failed instead of
      dispatch.restart-budget-exceeded, and because the gate never evaluates, the terminal
      exhaustion record is never ensured (D-10's "first refusal that observes exhaustion"
      never observes it). Plan task 2.2 pins "PAST BUDGET → dispatch.restart-budget-exceeded
      always, evaluated BEFORE economics — the budget reason wins, one identity per attempt";
      DEC-7's rationale is that precedence keeps the terminal budget state unambiguous. No
      test covers incomplete-evidence × past-budget (the precedence suite always supplies
      complete evidence). Zero spawns still hold — the defect is identity choice plus the
      missing terminal escalation record, not a silent loop.
    suggestion: >-
      Reorder evaluateResumeEconomics: keep the capability checks first (attach-continue
      consumes no ordinal), then read records and evaluate the budget gate, handle
      refuse-budget (ensure terminal record + refuse), and only on gate-admit run the
      evidence-completeness and economics checks. Add a precedence cell for
      past-budget × missing-evidence (tokensReadable false, and repayTokens-undefined
      variants) asserting dispatch.restart-budget-exceeded, the budget corpus, the terminal
      record landing, and zero spawns; keep the within-budget incomplete-evidence refusals
      (harness.telemetry.extraction-failed) unchanged.
