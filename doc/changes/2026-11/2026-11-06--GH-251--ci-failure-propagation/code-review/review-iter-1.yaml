findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: scripts/run-bash-suites.sh:94
    message: >-
      discover_suites() feeds mapfile from a process substitution
      (`mapfile -t suites < <("${FIND_EXPRESSION[@]}" -print)`), whose exit
      status bash discards: when find itself fails (empirically reproduced with
      a chmod-000 directory) the runner logs the ERR trap line, continues with a
      partial suite set, and exits 0. This violates F-1/AC-F1-1/NFR-1's
      fail-closed contract ("a suite that errors before producing a verdict is a
      failure, never a skip") and regresses the replaced direct `find ... -exec`
      invocation, which under set -e did fail the job when find exited non-zero.
    suggestion: >-
      Capture discovery status fail-closed, e.g. run find via command
      substitution (`out="$(find ... -print)" || { log_err "suite discovery
      failed"; exit 1; }`, guard the empty-output case before mapfile), and add
      a contract-suite case (TC-CIPROP-006 neighbor: tree with an unreadable
      subdirectory containing a suite; runner must exit non-zero; skip when
      running as root).
    suppressed: false
