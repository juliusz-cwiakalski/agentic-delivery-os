phases:
  - id: 1
    title: "Suite-aggregation runner, runner contract suite, and committed negative control"
    kind: delivery
    scope:
      files:
        - scripts/run-bash-suites.sh
        - scripts/.tests/test-bash-suite-aggregation.sh
        - scripts/.tests/test-bash-suite-aggregation-modes.sh
    interactions:
      - kind: contract-file
        target: scripts/run-bash-suites.sh
        role: producer
    summary: "fix(GH-251): suite-aggregation runner, contract suite, and committed negative control"
    tasks:
      - "1.1 scripts/run-bash-suites.sh (new, executable, #!/usr/bin/env bash): the DM-2 suite-aggregation runner the workflow will invoke — zero arguments, discovers and executes from the current working directory so the CI invocation from the repository root and a synthetic-tree invocation are literally the same contract (OQ-2/GAP-3 resolution, recorded here as the delivery decision: copied-tree seam per the test-delivery-mutation-sandbox precedent, no runtime surface added to the runner). Discovery is byte-identical to today's CI expression — find . -path '*/.tests/test-*.sh' -not -path './tmp/*' -not -name '*e2e-providers*' -not -name '*e2e-suite*' -not -name '*performance*' — preserving find's natural traversal order (no added sort, no -type f, no new exclusion: scope parity is the contract, TC-CIPROP-005). Executes every discovered suite exactly once with bash under per-child status capture (no set -e short-circuit across suites), counts a child that cannot run (exit 126/127, e.g. a dangling symlink) as a failure, never a skip, logs each suite by path with a pass/fail marker plus an aggregate summary naming every failing suite (NFR-10), and exits non-zero if and only if at least one discovered suite failed or could not run; zero discovered suites exits 0 with an explicit zero-suite summary (TC-CIPROP-007, A-9 — no minimum-count guard). Hermetic: writes nothing, mutates no tracked file (suites own their temp trees). Follows .ai/rules/bash.md in full (set -Eeuo pipefail, errtrace, inherit_errexit, IFS, trap sections, usage(), small functions) and stays shellcheck -S error clean. Header documents the DM-2 contract, dependencies (bash>=4, find), and that jq-dependent suites still get jq from the job step. [F-1, F-2; DM-2; AC-F2-1; NFR-1, NFR-5, NFR-10; TC: TC-CIPROP-001..007 enabler]"
      - "1.2 scripts/.tests/test-bash-suite-aggregation.sh (new): the runner contract suite, set -Eeuo pipefail, mktemp -d trees with trap cleanup, no network/sleeps/clock. Covers TC-CIPROP-001 (all-passing synthetic tree exits 0, names every suite, summary count matches), TC-CIPROP-002 (one failing suite between two passing ones; invoked from a non-set -e parent; non-zero exit is intrinsic; failing suite named, not 'skipped'), TC-CIPROP-003 (two distinct failing suites plus one passing: every failure named, passing suite reported passing), TC-CIPROP-004 (per-suite marker counter files show exactly one line per suite with the failure first and last — no short-circuit, no duplicate), TC-CIPROP-005 (fixture tree a/.tests, scripts/.tests, tools/.tests, tmp/.tests, *e2e-providers*, *e2e-suite*, *performance*, non-matching helper.sh and test-other.sh.bak; independent find oracle — today's exact expression including the top-level-tmp quirk — set-equality with the runner's logged set; deterministic order across two consecutive runs; excluded paths appear zero times in the log), TC-CIPROP-006 (dangling symlink test-unrunnable.sh plus an interpreter-failing suite: both reported failed/unrunnable, runner non-zero, passing suite still passing), TC-CIPROP-007 (empty root exits 0 stating zero suites). Invokes the runner by copying it into each temp tree root (GAP-3 seam) so the tests exercise the same CWD-rooted contract CI uses. The TC-CIPROP-012 static workflow section is deliberately NOT in this phase — it lands in phase 2 with the workflow edit so every interim commit stays green. [F-1, F-2; AC-F1-1, AC-F2-1; NFR-1, NFR-5, NFR-10; TC: TC-CIPROP-001..007]"
      - "1.3 scripts/.tests/test-bash-suite-aggregation-modes.sh (new, the committed negative control and the AC-F3-1 evidence vehicle): self-verifying per the test-doc-distribution-modes / delivery-mutation-sandbox precedent. Green path (TC-CIPROP-008): builds a synthetic temp root containing exactly one planted, deliberately failing suite outside any real .tests/ directory, invokes the same runner artifact (copied into the temp tree) the workflow will invoke, observes a non-zero exit, converts it to [PASS], and prints self-describing output — planted suite path, observed runner exit, verdict. Counterfactuals (TC-CIPROP-009): via a documented runner-path override seam in the control's header, an always-zero stub runner makes the control exit non-zero reporting that the failure did not propagate, and a stub that exits 0 only on the planted failing suite also fails the control; restoring the real runner must pass (an always-failing control cannot pass vacuously). Hermeticity (TC-CIPROP-010): git status --porcelain plus runner/control checksums identical before and after, temp tree gone on every path via trap, no committed or worktree path matching test-* contains the planted marker, wall time under 60 s. Nesting (TC-CIPROP-011): the synthetic root's discovered set is exactly the one planted suite, the control runs under a bounded timeout and terminates 0, the nested log shows exactly one executed suite, and no real repository suite name appears in it. The control is wired into CI purely by discovery (TC-CIPROP-008 precondition; running twice — once via discovery, once in any explicit step — follows the accepted A-10 precedent and no separate workflow step is added). [F-3; AC-F3-1; NFR-2, NFR-9; DEC-2, DEC-6; TC: TC-CIPROP-008..011]"
      - "1.4 Phase-boundary hygiene: bash -n and shellcheck -S error clean on the runner and both suites; both new suites and the runner are executable; the runner is repo-internal automation — scripts/install.sh ADOS_DELIVERY_SCRIPTS/ADOS_DELIVERY_TOOLS arrays gain NO entry (A-8, asserted later by TC-SCOPE-001 step 6); scripts/test-all.sh stays untouched (its discovery semantics — executable bit, tests/ folders, no CI exclusions — are deliberately different and out of scope). Record GAP-1 artifact names as delivered: runner scripts/run-bash-suites.sh, contract suite scripts/.tests/test-bash-suite-aggregation.sh, control scripts/.tests/test-bash-suite-aggregation-modes.sh. [NG-6; A-8; TC: TC-QUAL-001 steps 3-4 local half]"
    testGate:
      - "bash scripts/.tests/test-bash-suite-aggregation.sh"
      - "bash scripts/.tests/test-bash-suite-aggregation-modes.sh"
      - "bash -n scripts/run-bash-suites.sh && shellcheck -S error scripts/run-bash-suites.sh scripts/.tests/test-bash-suite-aggregation.sh scripts/.tests/test-bash-suite-aggregation-modes.sh"
      - "bash scripts/run-bash-suites.sh"
      - "git status --porcelain"
  - id: 2
    title: "bash-tests job rewiring, corrected comment, and the DEC-7 scoped ci-topology allowance with non-vacuity fixtures"
    kind: delivery
    scope:
      files:
        - .github/workflows/ci.yml
        - scripts/checks/ci-topology.ts
        - tests/checks/ci-checks.test.ts
        - scripts/.tests/test-bash-suite-aggregation.sh
    interactions:
      - kind: contract-file
        target: scripts/checks/ci-topology.ts
        role: producer
    summary: "fix(GH-251): wire bash-tests to the runner and scope the ci-topology allowance"
    tasks:
      - "2.1 .github/workflows/ci.yml, bash-tests job ONLY (lines ~118-149 today; every other job byte-identical): the 'Run all bash test suites' step's run block replaces the find -print -exec pipeline with 'set -e' plus 'bash scripts/run-bash-suites.sh'; the Checkout and Install jq steps stay exactly as they are (jq remains required by several suites); the job id, name, and runs-on stay. The GH-124 comment block is corrected to state the real contract: the runner discovers every CI-safe test-*.sh suite (same scope and same exclusions as before — tmp/, *e2e-providers*, *e2e-suite*, *performance*, now applied inside the runner), executes each suite, aggregates child exit statuses, names every failing suite, and fails the job if and only if any suite fails or cannot run — with NO claim that set -e alone fails the job on the first failing suite. Exclusion semantics must remain set-identical to today (TC-CIPROP-005 already pins this behaviourally); the exclusion list in the comment stays as documentation. [F-1, F-7; AC-F1-1 wiring half, AC-F7-1 comment half; TC: TC-CIPROP-012 steps 1-2 and 4-5]"
      - "2.2 scripts/checks/ci-topology.ts: implement DEC-7 with a testable pure seam, following the ci-bindingness.ts pattern (exported pure scan over text + validate(root) + import.meta.main CLI, already partially present via validate/BASH_JOBS/TS_JOBS/scanJobFailures). Extract the removed-line rule into a pure exported classification function (e.g. removedLineViolations over the base workflow text plus the unified=0 diff text — exact name is coder latitude, the export is the contract) so fixtures need neither a moving origin/main-tools nor a git-backed temp tree (TC-CIPROP-015 precondition, first branch). The allowance: a removed ci.yml line is ignored ONLY when it belongs to the bash-tests job's execution block (its run: step content) or that job's comment lines — classified against the base workflow text's parsed bash-tests job region; every other removal stays fatal with today's 'ci.yml removes a base line (additions only)' message; the BASH_JOBS/TS_JOBS presence loops (lines ~128-133) stay fatal, so deleting or renaming any bash or ts job id still fails; scanJobFailures, trigger rules, and the scripts/checks wiring rule are untouched; no bypass flag or skip-diff switch is added (TC-CIPROP-015 step 7). validate() keeps running git diff --unified=0 origin/main-tools...HEAD and delegates to the pure function. Note the check still runs green in ts-invariants only because this allowance admits exactly this change's removals. [F-8; AC-F8-1; DEC-7; NFR-6; RSK-7; TC: TC-CIPROP-015 enabler, TC-CIPROP-014]"
      - "2.3 tests/checks/ci-checks.test.ts: the TC-CIPROP-015 negative-fixture set over the new pure seam with committed base/head workflow texts (never a diff against the moving base inside the permanent suite — testing-strategy invariant rule). Fixture A (allowance fires): base versus head with the bash-tests execution-block lines and that job's comment lines replaced by the runner invocation — no removal violation for those lines while the job remains present and invokes the runner. Fixture B (does not generalize): one removed line in another job's step (ts-invariants or a sibling bash job) — fails naming that line. Fixture C (job-presence fatal): the whole bash-tests job deleted — fails naming the missing bash job. Fixture D (job-id fatal): a ts-* job id removed or renamed, and separately a bash job id other than bash-tests — fails naming the missing job both times. Fixture E (boundary precision): a line immediately adjacent to but outside the allowed block/comments removed — still fails. Non-vacuity: Fixture A must fail when the allowance is disabled (fixture-level toggle or mutated copy of the check, mirroring the file's existing mutated-temp-copy style). [F-8; AC-F8-1; NFR-6; TR-1, TR-11; TC: TC-CIPROP-015 steps 1-6]"
      - "2.4 scripts/.tests/test-bash-suite-aggregation.sh gains the TC-CIPROP-012 static section (tree assertion, added now so it lands with the workflow edit): parse .github/workflows/ci.yml, locate the bash-tests suite-execution step, assert it invokes scripts/run-bash-suites.sh by path and that the repository contains that script as an executable file; assert the workflow text contains no '-exec bash' suite execution; assert the job comment states the aggregation contract and makes no set -e failure claim; assert the three CI-safe exclusions still apply at the aggregation layer (behavioural parity already pinned by TC-CIPROP-005). Static tree assertion only — never a diff against a base branch. [F-1, F-2, F-7; AC-F1-1, AC-F2-1, AC-F7-1; DM-2; TC: TC-CIPROP-012]"
      - "2.5 Standing gates against the modified workflow (TC-CIPROP-014): bun run scripts/checks/ci-topology.ts (green under the new allowance), ci-bindingness.ts, ci-supply-chain.ts, script-surface.ts all exit 0; bun test tests/checks/ci-checks.test.ts green including the new fixtures; confirm no workflow job other than bash-tests changed and no advisory/bypass construct appeared (ci-bindingness's ts- scan stays untouched). Single commit for this phase so no interim state pairs the workflow edit with a missing allowance (or vice versa) in CI. [AC-G6-1; NFR-6; RSK-2; TC: TC-CIPROP-014]"
    testGate:
      - "bun test tests/checks/ci-checks.test.ts"
      - "bun run scripts/checks/ci-topology.ts && bun run scripts/checks/ci-bindingness.ts && bun run scripts/checks/ci-supply-chain.ts && bun run scripts/checks/script-surface.ts"
      - "bash scripts/.tests/test-bash-suite-aggregation.sh"
      - "bash scripts/run-bash-suites.sh"
      - "git diff --check"
  - id: 3
    title: "Byte-accurate UTF-8 source-size enforcement in both file adapters with boundary matrices"
    kind: delivery
    scope:
      files:
        - packages/adapters/src/file/yaml-parser.ts
        - packages/adapters/src/file/pm-notes-parser.ts
        - tests/behaviour/config-parser.test.ts
        - tests/behaviour/pm-notes-source-limits.test.ts
        - tests/fixtures/source-limits/harness.ts
        - tests/structure/source-limit-purity.test.ts
    summary: "fix(GH-251): enforce the source-size limit as UTF-8 bytes at all three parser sites"
    tasks:
      - "3.1 Delivery decision for OQ-3/GAP-4, recorded here as pinned: replicate the pure code-point to UTF-8 byte-length pattern (packages/core/src/domain/queue-ready.ts utf8ByteLength — module-private there, and the spec's affected-components table keeps core Unchanged) as a module-private helper in EACH of the two parser files, with the same doc comment contract (surrogate pair = one 4-byte code point; lone surrogate = 3 bytes, the replacement encoding). Rejected alternatives: exporting from core (touches an unchanged package, new cross-package surface) and a new shared adapter file (a third production path outside the confinement list) — per-file replication keeps the diff exactly the two parser files (AC-G6-1). TC-UTF8LIMIT-007's stable anchors are therefore packages/adapters/src/file/yaml-parser.ts and packages/adapters/src/file/pm-notes-parser.ts. No TextEncoder, no Buffer, no node:/bun: specifiers in either file (the io tier's TextEncoder precedent does not reach the neutral file tier). [F-4, F-5; NFR-7; A-2; TC: TC-UTF8LIMIT-007 anchors]"
      - "3.2 packages/adapters/src/file/yaml-parser.ts line ~79: replace 'text.length > MAX_SOURCE_BYTES' with 'utf8ByteLength(text) > MAX_SOURCE_BYTES'. Constant name and 1_048_576 value unchanged; at-or-under proceeds to parse exactly as today; over-limit returns malformed(layer, file) — the identical config.file.malformed identity with no line field (DEC-4). packages/adapters/src/file/pm-notes-parser.ts lines ~167 and ~228: the same substitution at both sites — parsePmNotesText keeps { ok: false, reason: 'malformed', file, parseFailure: { class: 'syntax', location: file } } (via malformed(file, file)) and stagePmNotesPhaseEntry keeps { ok: false, parseFailure: { class: 'syntax', location: 'document' } }. No grammar, node/depth/alias guard, tag rule, or staging behavior changes. [F-4, F-5; DM-1; AC-F4-1, AC-F5-1; DEC-1, DEC-4; NFR-3, NFR-4; TC: TC-UTF8LIMIT-001..003 production half, TC-UTF8LIMIT-005]"
      - "3.3 tests/fixtures/source-limits/harness.ts (new): the shared deterministic boundary builder for TC-UTF8LIMIT-004 — minimal valid YAML config document ('x-test: ok' plus comment padding) and minimal valid pm-notes document (change_id, title, phases: with the target phase entry plus comment padding) composed as prefix + multibyte/ASCII padding + suffix to hit an exact requested UTF-8 byte target using known widths (a=1, e-acute=2, euro sign=3, emoji=4); throws loudly (never a silent near-miss) when a target is unreachable with the chosen padding; no committed multi-megabyte blobs (generation keeps fixtures reviewable, TR-5); every fixture self-verifies Buffer.byteLength(text, 'utf8') (the independent oracle, allowed in tests only) and text.length before use. Keep generation efficient — repeated-fill plus a bounded ASCII tail, not per-character loops over 1 MiB — and rejected cases short-circuit before the YAML parse so suites stay fast (A-6). [F-6; NFR-3; TR-7; TC: TC-UTF8LIMIT-004 steps 1-3]"
      - "3.4 tests/behaviour/config-parser.test.ts (update, parseConfigYaml from @delivery-os/adapters/file): the TC-UTF8LIMIT-001 five-class matrix — exactly 1048576 bytes with multibyte content accepted and parsed to the unpadded document's facts; 1048577 rejected with error.code 'config.file.malformed'; 1048575 accepted; text.length <= 1048576 while bytes > 1048576 rejected (assert the discriminating precondition) ; all-ASCII at exactly 1048576 accepted. tests/behaviour/pm-notes-source-limits.test.ts (new): TC-UTF8LIMIT-002 (parsePmNotesText — the same five classes; over-limit deep-equals { ok: false, reason: 'malformed', file, parseFailure: { class: 'syntax', location: file } }) and TC-UTF8LIMIT-003 (stagePmNotesPhaseEntry with a valid started/completed edit — five classes; over-limit deep-equals { ok: false, parseFailure: { class: 'syntax', location: 'document' } }; at-limit staged text differs from input only in the edited phase entry, padding preserved verbatim). Assert decision AND identity explicitly in every case; the three matrices together assert the 15-case completeness count (3 sites x 5 classes) that cannot silently shrink. [F-4, F-5, F-6; AC-F4-1, AC-F5-1, AC-F6-1; NFR-3; TC: TC-UTF8LIMIT-001..003, TC-UTF8LIMIT-004 step 4]"
      - "3.5 Identity stability and parse equivalence: TC-UTF8LIMIT-005 — deep equality (not code-only assertions, TR-6) on every over-limit failure object at all three sites, absence of a line field at the YAML site, and no size/limit-specific error code anywhere; bun run scripts/checks/error-table-sync.ts green. TC-UTF8LIMIT-006 — each accepted class's parsed facts/value deep-equals its unpadded twin's, the stage site's staged text differs only in the edited entry, and no warning/diagnostic surface changed for accepted documents. [AC-F4-1, AC-F5-1, AC-F6-1; NFR-4; DEC-4; TC: TC-UTF8LIMIT-005, TC-UTF8LIMIT-006]"
      - "3.6 tests/structure/source-limit-purity.test.ts (new): TC-UTF8LIMIT-007 source assertions over both helper anchors — no node: or bun: import specifiers in either parser file; the helper bodies contain none of TextEncoder, Buffer, encodeURIComponent, process, Bun, Math.random; each computes from code points (codePointAt with 1/2/3/4-byte branches). Then the existing battery: bun test tests/boundaries and bun run scripts/checks/ambient-globals.ts green, pnpm check:boundaries reports no new dependency edge (there is none — the helpers are local). TC-UTF8LIMIT-008 regression: the existing suites (config-parser, pm-notes-corpus, phase-transitions, phase-idempotency, phase-envelope, phase-rejections) pass with no assertion rewrites, deletions, or weakenings; non-limit guards (node/depth/alias bounds, unique keys, unsupported tags, multi-document rejection, host-switch guard, key preservation) unchanged. [AC-G6-1; NFR-5, NFR-7, NFR-8; TR-8; TC: TC-UTF8LIMIT-007, TC-UTF8LIMIT-008]"
    testGate:
      - "pnpm typecheck"
      - "bun test tests/behaviour/config-parser.test.ts tests/behaviour/pm-notes-source-limits.test.ts"
      - "bun test tests/behaviour/pm-notes-corpus.test.ts tests/behaviour/phase-transitions.test.ts tests/behaviour/phase-idempotency.test.ts tests/behaviour/phase-envelope.test.ts tests/behaviour/phase-rejections.test.ts"
      - "bun test tests/structure/source-limit-purity.test.ts"
      - "bun run scripts/checks/error-table-sync.ts && pnpm check:boundaries"
  - id: 4
    title: "Documentation truth, evidence, and finalize: gates, scope confinement, release and spec-reconciliation obligations"
    kind: delivery
    scope:
      files:
        - doc/inception/analysis/phase-4-quality-baseline.md
        - doc/inception/analysis/fse-audit.md
        - .changeset/gh-251-ci-failure-propagation-patch.md
        - doc/changes/2026-11/2026-11-06--GH-251--ci-failure-propagation/chg-GH-251-test-plan.md
        - doc/changes/2026-11/2026-11-06--GH-251--ci-failure-propagation/chg-GH-251-plan.yaml
    summary: "docs(GH-251): record the repair in the baseline, FSE-05, and delivery evidence"
    tasks:
      - "4.1 Documentation truth (TC-DOC-001): doc/inception/analysis/phase-4-quality-baseline.md — the 'CI baseline and concrete failure-propagation finding' section's 'Concrete new gap' paragraph and the FSE-05-linked row in the tier table now record the finding as REPAIRED by GH-251: the suite-aggregation runner with explicit child-status aggregation, the committed self-verifying negative control proving propagation inside every green run, and the DEC-7 scoped topology allowance; no statement says the gap is open. doc/inception/analysis/fse-audit.md — the FSE-05 section no longer asserts shell CI uses non-aggregating find -exec without correction; it states the runner-based aggregation and the standing negative control. Cross-check that no other statement in those two documents contradicts the landed behavior, and confirm the still-stale phase-7 reconciliation points stay registered (Appendix C) rather than being expanded here. [F-7; AC-F7-1; TC: TC-DOC-001 steps 1-5]"
      - "4.2 TC-SCOPE-001 confinement review of the full diff (git diff --name-only origin/main-tools...HEAD plus git diff --stat plus per-file review): classify every changed file as runner, control, runner tests, workflow bash-tests job, the DEC-7 ci-topology allowance and its fixtures, one of the two parser files, their test files, the two documentation records, the changeset, or change-artifact docs — nothing unclassified. Assert packages/core/src/domain/verify-gates.ts is untouched and VERIFY_GATES_MAX_SUMMARY_BYTES behavior is unchanged (DEC-5); no error-table entry changed and no error code added or renamed; MAX_SOURCE_BYTES still names 1_048_576 with no rename to characters; ci-topology's DEC-7 allowance plus fixtures are the only invariant-check change (ci-bindingness, ci-supply-chain, error-table-sync, ambient-globals, script-surface untouched); no other parser, engine, package, or workflow job changed (ts-* jobs, guard jobs, commitlint definitions byte-identical); scripts/install.sh delivery arrays unchanged; no privacy/support-environment/OPEN-Q15-human work slipped in. [AC-G6-1; NFR-4, NFR-8; DEC-4, DEC-5; TC: TC-SCOPE-001 steps 1-7]"
      - "4.3 TC-QUAL-001 local gate battery and shell hygiene: pnpm check green (lint, format:check, typecheck, test, check:boundaries, exports parity); bash scripts/run-bash-suites.sh exits 0 and reports the complete discovered set (all scripts/.tests and tools/.tests suites minus the documented CI exclusions); git diff --check clean; shellcheck -S error and bash -n on the runner and control with both executable; record runner and control wall times (NFR-9 evidence — the <= 60 s control bound is asserted, the <= 5 % job-overhead share is the observational before/after CI comparison per OQ-4) and a one-line command/exit/summary record per step into the test-plan execution log. [NFR-5, NFR-6, NFR-8, NFR-9; TC: TC-QUAL-001 steps 1-6]"
      - "4.4 TC-CIPROP-013 evidence steps (AC-F3-1 / DEC-6, completed at lifecycle phase 11 pr_creation): once the GH-251 PR against main-tools exists, open the green run's bash-tests job log, confirm every discovered suite is named and no real suite is reported failed or skipped, confirm the control ran and printed its planted-suite / observed-exit / [PASS] lines, and record the run URL, job name, commit SHA, and the control's verdict lines in test-plan section 10. OPTIONAL red demonstration run (DEC-6, explicit optional step — skip without re-review by recording the skip): on the branch only, temporarily plant a failing suite in the repo root (e.g. a top-level test-red-demo.sh NOT under .tests/ plus a temporary .tests wrapper), push, capture the red bash-tests run URL as supplementary evidence, then revert in a follow-up commit — never merge the red state; the green-run control remains the required evidence either way. [F-3; AC-F3-1; DEC-6; TC: TC-CIPROP-013 steps 1-5]"
      - "4.5 Release obligation: add .changeset/gh-251-ci-failure-propagation-patch.md — patch bump for @delivery-os/adapters (lockstep; the byte-accurate tightening is the only package behavior change; spec front matter version_impact: patch; classified under TC-SCOPE-001's 'the changeset (if any)' allowance — if the owner's lockstep flow rules a changeset out for this patch, delete this task's file from scope and record the decision in the execution log). Populate test-plan section 10 execution log rows for every executed TC and run plan diff GH-251 for the declared-versus-actual scope reconciliation of this plan. [Testing-strategy evidence obligation; test plan section 10]"
      - "4.6 Spec-reconciliation obligations declared for the system_spec_update phase (@doc-syncer, lifecycle phase 7 — NOT delivery work here, doc/spec/** stays untouched by this branch per AC-G6-1): (1) doc/spec/nonfunctional.md NFR-TOOL-005 gap line ('byte enforcement needs reconciliation') — resolved by byte enforcement with boundary tests; (2) doc/spec/features/feature-monorepo-scaffold-toolchain.md 'The existing bash jobs remain byte-unchanged and authoritative' sentence — made stale by design, reconcile with the runner-based aggregation and the DEC-7 allowance; (3) doc/spec/features/feature-config-layer.md parser-limit wording if it describes code-unit semantics; (4) open-question-reconciliation Q15/Q19 rows — pointers only if the doc-syncer deems it required; (5) the ci-topology allowance itself (DEC-7, RSK-7) must be visible to the system-spec update so the invariant-relaxation precedent stays on record and flagged at the open-PR human review gate. [F-7; Appendix C rows 3-6; RSK-5, RSK-7]"
      - "4.7 Commit discipline for every phase commit through @committer: conventional subjects (fix/docs/test(GH-251): ...), body and footer lines at most 100 characters (ts-commitlint enforces the width), and a clean tree with no stray files at each phase boundary (git status plus the phase testGate). [PM constraint; repo commitlint configuration]"
    testGate:
      - "pnpm check"
      - "bash scripts/run-bash-suites.sh"
      - "git diff --check"
      - "git diff --name-only origin/main-tools...HEAD"
