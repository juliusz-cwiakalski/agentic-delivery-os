#
# Revision 2 (2026-11-08): reopened `delivery_planning` after DoR iteration 1
# (`readiness/readiness-iter-1.md`, verdict NOT_READY) and realigned to spec v1.2
# and test plan v1.2. This revision resolves the three plan-owned findings and
# carries the plan-side consequences of the artifact revision:
#   - A-3 (phase scope ownership): exactly one owning phase per path. The
#     opencode conformance registration `packages/testkit/src/conformance/harness.ts`
#     is P2-only (P2 already constructs the port there and must give it a
#     starter), and P4 only asserts it. The delivered legacy classification
#     fixture `tests/fixtures/harness/scenarios/classification.ts` is named
#     explicitly and owned by P4 as a read-only oracle: P4 asserts the six
#     delivered envelopes and edits nothing, and the JSONL counterparts are
#     derived inline in the conformance test (no fixture edit, floor stays six).
#   - A-7 (optional-with-default composer fact): `ProductionCompositionFacts.
#     harnessSpawnStarter` is optional and defaults to `createHostSpawnStarter()`
#     inside the production composition, mirroring `harnessSpawnRunner`; the
#     adapter's own `OpencodeHarnessOptions.starter` stays required and every one
#     of its eight construction sites is inside P2's scope. The default and the
#     migration rule are stated in P2.
#   - A-8 (E2E state-root isolation): P6 records the appended attempt id/token and
#     the GH-275 lease, proves the completed run released the lease, releases it
#     when it did not, and states that the attempt record in the real state root
#     is deliberate production evidence rather than cleanup noise.
#   - Artifact alignment: F-4/DEC-5 legacy single-document evidence precedence
#     with the retained six-case conformance floor and `TC-HARN-010` (B-1); the
#     `tool_use`-with-`state.status === "error"` and `error`-event encodings (B-2);
#     the corrected M-3 red set and new M-17..M-19 (B-3); three pinned JSONL
#     capture files; the 46-TC map; and the E2E `lane.liveness-interval` mechanism
#     with its required `liveness:` attempt ref.
#
# Sources (single source of truth):
#   - Spec:      ./chg-GH-275-spec.md (v1.2; F-1..F-8, AC-F1-1..AC-F8-2 = 30 ACs,
#                NFR-1..NFR-9, DEC-1..DEC-8, RSK-1..RSK-9, §6 flows 1–4,
#                §8.4 external contract, §8.5 backward compatibility, Appendix
#                B contract-type sketch, Appendix C failure mapping)
#   - Test plan: ./chg-GH-275-test-plan.md (v1.2; 46 TC-OCS-* scenarios in §5.1
#                and §5.2, §6.1 fixture set of three pinned captures, §6.3
#                operator-run end-to-end procedure with steps 0a/1b/1c, §7.1
#                files the delivery must add or edit, §7.2 TC → file/command
#                mapping, §7.3 executable revert/mutation evidence M-1..M-19,
#                §8.1 testing risks, §10 execution log)
#   - Ticket:    GH-275.
#
# `tests` is delivery evidence for plan review; it is not a `delivery.plan.v1`
# schema field. The schema-validated keys used here are schemaVersion,
# workItemRef, tier, defaultLeases, defaultWeightClass, and phases (id, title,
# kind, summary, scope, interactions, doneArtifacts, leases, weightClass,
# leaseClass). Phase progress never lives here; it belongs in pm-notes `notes:`
