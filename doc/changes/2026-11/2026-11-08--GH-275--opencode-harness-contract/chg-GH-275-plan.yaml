      `HarnessSpawnRunnerResult`, `HarnessSessionHandle`, `HarnessSessionPort`,
      `HarnessEvidence`, `HARNESS_OUTCOMES` and `HARNESS_FAILURE_CODES` stay
      byte-identical. Implement `createHostSpawnStarter` in
      `packages/adapters/src/host/index.ts` beside the unchanged
      `createHostSpawnRunner`: it streams stdout as lines, exposes `acquired()`,
