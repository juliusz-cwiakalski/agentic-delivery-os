  - id: 2
    title: "Adapter spawn on the streaming seam: JSONL decoding, top-level sessionID, non-blocking handle, completion-scoped collect, and the required starter"
    kind: delivery
    summary: >-
      Replace the whole-buffer `JSON.parse(result.stdout)` in
      `packages/adapters/src/harness/opencode.ts` with a line-independent scan:
      split on LF, strip a trailing CR, skip blank and whitespace-only lines,
      parse each line independently, continue past non-JSON and non-object lines,
      and accept the first line carrying an identifier with precedence
      `sessionID` then `session.id`, `sessionId`, `id`; an empty-string identifier
      is not an identifier and a single-line JSON document remains a valid
      degenerate stream (DEC-4). On the first identified line build the handle
      (`harnessKind: "opencode"`, `sessionId`, `treeRoot` equal to the session id,
      `workItemRef` from the input), call `acquired()`, store a per-session
      completion promise, and return immediately without awaiting process exit
      (F-2). `collect` awaits that completion and derives evidence only at close:
      `completionMarker` true only when exit status is 0, the session did not time
      out, and the last decoded `step_finish` carries `part.reason === "stop"`;
      `exitStatus` from the close status; `timedOut` from the host kill flag;
      `spawnRefused` never set once an identifier existed; `failureReported` and
      `toolFailure` set only from explicit facts present in the pinned stream
      (DEC-5). Acquisition gets a `60_000` ms default handle bound, an optional
      `sessionTimeoutMs` passed through as data, no default whole-session bound,
      no `300_000` on the spawn path, and an idempotent `kill` on every failed
      acquisition (F-5). Make `starter` a required member of
      `OpencodeHarnessOptions` and migrate every opencode construction site in
      this commit: `packages/cli/src/production.ts` gains a
      `harnessSpawnStarter` fact bound to `createHostSpawnStarter()` and keeps the
      one-shot runner for listing; `packages/testkit/src/conformance/harness.ts`
      derives the starter from the scenario `spawnStdout`; and the delivered
      suites that build the port (`harness-spawn-env`, `harness-spawn-credential`,
      `harness-liveness`, `harness-neutrality`, the Claude parity helper, the
      opencode session helper, the dispatch composition helper and fixture)
      inject the fixture starter so their existing assertions still hold.
      Resume/deliver keep their delivered one-shot implementation in this phase
      and are migrated in P3, which keeps this phase green. Add
      `tests/behaviour/harness-opencode-stream.test.ts` (TC-OCS-010, TC-OCS-011,
      TC-OCS-012, TC-OCS-013, TC-OCS-014, TC-OCS-015, TC-OCS-016, TC-OCS-017,
      TC-OCS-020, TC-OCS-021, TC-OCS-022, TC-OCS-040, TC-OCS-041, TC-OCS-042,
      TC-OCS-043, TC-OCS-044, TC-OCS-045) and move the spawn describes out of
      `tests/behaviour/harness-opencode-session.test.ts` in the same commit (test
      plan §7.2 note 6); `tests/structure/dispatch-composition.test.ts` receives
      only the recording-starter injection needed to stay green, with the
      per-harness seam assertions deferred to P4. Gates: `bun test` on the stream
      suite, the migrated delivered suites and the composition suite,
      `pnpm typecheck`, `pnpm check:boundaries`, `pnpm exec biome check`.
      Mutation evidence recorded here: M-1, M-2, M-3, M-4, M-6.
    scope:
      files:
        - packages/adapters/src/harness/opencode.ts
        - packages/cli/src/production.ts
        - packages/testkit/src/conformance/harness.ts
        - tests/behaviour/harness-claude-session.test.ts
