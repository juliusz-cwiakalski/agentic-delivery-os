  - id: 6
    title: "Bounded real-CLI end-to-end proof, release changeset, aggregate gate, and the phase-7 spec handoff"
    kind: delivery
    summary: >-
      Execute the operator-run procedure in test plan §6.3 exactly, outside this
      worktree, and record its evidence; add the release changeset; run the
      aggregate gate; and declare the lifecycle-phase-7 reconciliation handoff.
      The §6.3 procedure starts from this worktree being clean
      (`git -C "$REPO" status --porcelain` empty) with a recorded `HEAD_before`,
      `opencode --version` reporting 2.2.5, and `( cd "$REPO" && pnpm build )` so
      the probe runs the delivered build; it then enforces the hard credential
      precondition — the production GitHub instance reads the literal
      `GITHUB_TOKEN` environment variable, so export it, require
      `gh auth status` to succeed and `gh issue view 275 -R
      juliusz-cwiakalski/agentic-delivery-os --json number` to exit 0. It creates
      a disposable clone at `/tmp/opencode/gh275-e2e` with
      `git clone --no-hardlinks --single-branch --branch
      fix/GH-275/opencode-harness-contract`, symlinks this worktree's
      `node_modules`, sets the clone origin to
      `https://github.com/juliusz-cwiakalski/agentic-delivery-os.git`, releases any
      stale lease with `queue release GH-275 --holder dispatch` and declares
      `queue add GH-275 --json`. Step 1b pins the liveness cadence inside the
      disposable clone: `lane.liveness-interval` is read only from the layered
      YAML config (no environment variable and no CLI flag exist for it, and
      `dispatch` rejects `--config`), so the phase writes
      `<clone>/.delivery-os/config.yaml` with `lane.liveness-interval: 3000` and
      proves it with `config get lane.liveness-interval --json` returning
      `3000`; the edit lives only in the clone and is removed with it. Step 1c
      records a bounded first-event latency probe (a 70 s `timeout` around one
      real `opencode run --format json` in the clone, asserting a top-level
      `sessionID`). Step 4 runs
      `exec bun packages/cli/bin/delivery-os.ts dispatch GH-275 --json` in the
      background, step 5 polls
      `pgrep -P <dispatch-pid> -f "opencode run --format json"` for up to 60 s to
      observe the handle window and waits 15 s for the first identified line and
      the 3 s liveness poll, and step 6 kills only that child with `kill -TERM`
      and reads `.data.result`, `.data.lastMessage` and `.data.error.code` from the
      captured log. The phase records: the result token (any of the eleven
      delivered tokens passes), `lastMessage` (must not be
      `spawn failed before a session existed`), `error.code` (must not be
      `dispatch.session.spawn-failed` or `dispatch.state-unverified`), the exit
      code, elapsed seconds from dispatch start to the kill (pass bound 180 s),
      the step 1c first-event latency, at least one `liveness:` evidence ref in
      the attempt record (positive evidence that the progress watch polled while
      the session was live, which a completion-gated spawn cannot produce), and
      the before/after `git status --porcelain` and `git rev-parse HEAD` of this
      worktree, which must be unchanged (AC-F8-1, AC-F8-2). State-root accounting
      is part of the evidence, not cleanup: the probe appends a real
      `dispatch.attempt` to `$HOME/.delivery-os-state/ledger.default.jsonl`
      outside the clone, so the phase reads back that record's `attemptId`, token
      and `evidenceRefs`, records the GH-275 lease id observed in
      `queue list --json` after the handle window, and then proves the completed
      run released it (no active lease for `GH-275` with holder `dispatch` on
      `github.com/juliusz-cwiakalski/agentic-delivery-os`); if the lease is still
      held it runs `queue release GH-275 --holder dispatch --json` and records the
      release result. The appended attempt record is deliberate production
      evidence retained on purpose (spec §18) and is never deleted as cleanup
      noise; only the clone, its `node_modules` symlink and its clone-local
      `.delivery-os/config.yaml` are removed. A failed step 0a, a step 1b value
      other than 3000, or a step 1c first event later than the 60 s acquisition
      bound is a blocked precondition (environment or CLI/provider latency), not a
      product failure: record the exact blocked evidence, restore the
      environment and re-run, and write no TC-OCS-100/TC-OCS-101 result. Only a
      healthy step 1c followed by an acquisition-timeout refusal is a product
      FAIL. AC-F8-1 may be marked satisfied only with real executed evidence,
      never by inference. In the same phase add exactly one changeset,
      `.changeset/gh-275-opencode-harness-contract-minor.md`, declaring
      `@delivery-os/core`, `@delivery-os/adapters`, `@delivery-os/cli`,
      `@delivery-os/mcp` and `@delivery-os/opencode` at `minor` with a non-empty
      body, modify or delete no pre-existing changeset, and satisfy
      `TC-RELEASE-001` (`tests/checks/privacy-release.test.ts`, spec DEC-8 and
      §18); a `patch` entry fails the gate. Populate test plan §10 with the
      execution result per TC, the §7.3 mutation records (M-1..M-19) and the §6.3
      envelope output. Run the aggregate gate: `pnpm check` plus `pnpm typecheck`,
      `pnpm check:boundaries` and `bun packages/cli/bin/delivery-os.ts plan
      validate GH-275 --json`. Doc-spec reconciliation belongs to lifecycle phase
      7 (`system_spec_update`, `@doc-syncer`), so this phase edits nothing under
      `doc/spec/**` and only declares what phase 7 must verify:
      `doc/spec/features/feature-harness-adapters.md` (the opencode adapter
      paragraph and the host-runner narrative gain the streaming starter, JSONL
      framing, top-level `sessionID`, handle-before-completion, the DEC-5 evidence
      source precedence including the legacy envelope, completion-scoped
      `collect`, the 60 s handle bound and the absent default session bound) and
      `doc/spec/features/feature-dispatch-engine.md` (the spawn/timeout narrative
      states that a healthy spawn returns before completion and that the
      progress-based liveness watch is observable during the session), plus any
      contract table that lists the harness spawn seam. The pull request is opened
      at lifecycle phase 11 by `@pr-manager`.
    scope:
      files:
        - .changeset/gh-275-opencode-harness-contract-minor.md
        - doc/changes/2026-11/2026-11-08--GH-275--opencode-harness-contract/chg-GH-275-test-plan.md
    doneArtifacts:
      mergeRequestUrl: "PR for fix/GH-275/opencode-harness-contract targeting main-tools, opened at lifecycle phase 11 by @pr-manager and recorded as a pm-notes notes entry; it is not a deliverable of this phase"
      pipelineId: "pnpm check aggregate gate green: lint, format:check, typecheck, test, check:boundaries, prompt-conformance, help-guide-coverage, exports-parity"
      trackerTransition: >-
        GH-275 in review; phase 6 owns AC-F8-1, AC-F8-2 and TC-OCS-100, TC-OCS-101,
        records the §6.3 evidence (result token, lastMessage, error.code, exit
        code, elapsed seconds, step 1c first-event latency, at least one liveness:
        ref, the appended attempt id/token and the GH-275 lease id with its
        released-or-released-by-this-phase proof, unchanged HEAD and status in
        this worktree) and the §10 execution log, and declares the phase-7
        doc-syncer handoff for doc/spec/features/feature-harness-adapters.md and
        doc/spec/features/feature-dispatch-engine.md without editing them here.
    weightClass: standard
