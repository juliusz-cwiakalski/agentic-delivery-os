  - id: 2
    title: "Adapter spawn on the streaming seam: JSONL decoding, evidence source precedence, non-blocking handle, and the required adapter seam"
    kind: delivery
    summary: >-
      Replace the whole-buffer `JSON.parse(result.stdout)` in
      `packages/adapters/src/harness/opencode.ts` with a line-independent scan:
      split on LF, strip a trailing CR, skip blank and whitespace-only lines,
      parse each line independently, continue past non-JSON and non-object lines,
      and accept the first line carrying an identifier with precedence
      `sessionID` then `session.id`, `sessionId`, `id`; an empty-string identifier
      is not an identifier and a single-line JSON document remains a valid
      degenerate stream (DEC-4). On the first identified line build the handle
      (`harnessKind: "opencode"`, `sessionId`, `treeRoot` equal to the session id,
      `workItemRef` from the input), call `acquired()`, store a per-session
      completion promise, and return immediately without awaiting process exit
      (F-2). `collect` awaits that completion and derives evidence only at close,
      under the spec DEC-5 source precedence: a parsed legacy single-document
      envelope (a document carrying a `result` object and/or one of the accepted
      identifier-only shapes) is authoritative — `completionMarker` from
      `result.completion === "complete" || result.completed === true`,
      `spawnRefused` from `result.refused === true`, `failureReported` from
      `result.failure === true || result.status === "failed"`, `toolFailure` from
      `result.toolFailure === true`; otherwise the JSONL rules apply —
      `completionMarker` true only when the final decoded `step_finish` carries
      `part.reason === "stop"` with exit 0 and no host timeout, `toolFailure`
      true iff a `tool_use` part carries `part.state.status === "error"`,
      `failureReported` true iff an `error` event is present or the exit is
      non-zero; in both cases the host `exitStatus` (close status) and `timedOut`
      (host kill flag) merge on top, so a legacy completion fact under a host
      timeout still classifies `timed-out`. `spawnRefused` is therefore reachable
      on an identified session only through the legacy envelope form; the
      pre-session refusal path stays the no-identifier path of DEC-4. Acquisition
      gets a `60_000` ms default handle bound, an optional `sessionTimeoutMs`
      passed through as data, no default whole-session bound, no `300_000` on the
      spawn path, and an idempotent `kill` on every failed acquisition (F-5).
      Make `starter` a required member of `OpencodeHarnessOptions` and migrate
      every opencode construction site in this commit.
      `packages/cli/src/production.ts` gains an OPTIONAL
      `harnessSpawnStarter` composition fact that resolves as
      `facts.harnessSpawnStarter ?? createHostSpawnStarter()` (mirroring the
      delivered `harnessSpawnRunner ?? createHostSpawnRunner()`) and keeps the
      one-shot runner for listing;
      `packages/testkit/src/conformance/harness.ts` derives the starter from the
      scenario `spawnStdout`, which keeps the delivered six-scenario conformance
      suite green unchanged; and the delivered suites that build the port
      (`harness-spawn-env`, `harness-spawn-credential`, `harness-liveness`,
      `harness-neutrality`, the Claude parity helper, the opencode session
      helper, the dispatch composition helper and fixture) inject the fixture
      starter so their existing assertions still hold. Migration rule for the
      optional fact: a fixture that can reach a harness spawn injects a recording
      starter even though omission compiles — this phase injects one in the three
      `tests/structure/dispatch-composition.test.ts` composer constructions and
      in `tests/fixtures/queue/production/harness.ts`, whose queue-binding suite
      dispatches, so no suite gains a real child process; fixtures that never
      dispatch (queue add/binding reads) need no injection. Resume/deliver keep
      their delivered one-shot implementation in this phase and are migrated in
      P3, which keeps this phase green. Add
      `tests/behaviour/harness-opencode-stream.test.ts` (TC-OCS-010, 011, 012,
      013, 014, 015, 016, 017, 020, 021, 022, 040, 041, 042, 043, 044, 045, 046,
      047, 048) — including the legacy-envelope precedence table of AC-F1-7 and
      TC-OCS-046 and the falsifiability controls of TC-OCS-047/048 (remove the
      `tool_use` error line, flip `part.state.status`, remove the `error` line) —
      and move the spawn describes out of
      `tests/behaviour/harness-opencode-session.test.ts` in the same commit (test
      plan §7.2 note 6). Gates: `bun test` on the stream suite, the migrated
      delivered suites, the conformance suite and the composition suite,
      `pnpm typecheck`, `pnpm check:boundaries`, `pnpm exec biome check`.
      Mutation evidence recorded here: M-1, M-2, M-3, M-4, M-6, M-17, M-18, M-19.
