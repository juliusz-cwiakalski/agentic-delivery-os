  - id: 3
    title: "Resume and deliver on the same acquisition, preserving the caller's handle identity"
    kind: delivery
    summary: >-
      Move `resume` and `deliver` in `packages/adapters/src/harness/opencode.ts`
      onto the already-injected streaming starter: start with the configured
      resume args plus the caller's `sessionId`, deliver the steering prompt on
      stdin as data, and return on the first identified line without waiting for
      completion (F-3, DEC-2). The resumed stream identifier must equal
      `input.handle.sessionId`; a mismatch and a no-identifier outcome both map to
      the existing `harness.session.unknown` with the observed status, a summary
      naming the acquisition timeout where the bound expired, and an idempotent
      kill, creating no session record, so a resumed stream can never switch
      lanes. The identity guard is defence-in-depth: `opencode run --session <id>`
      continues or creates that id and stamps it onto every event, so a mismatch
      is only reachable if the CLI contract changes (spec F-3, AC-F3-3), and the
      measured assertion lives in the fake-starter suite, not in a production
      claim. The returned handle keeps the caller's identity and the delivered
      tree root. A session that acquires and later exits non-zero is post-handle
      evidence: `collect` carries the exit and the shared classifier decides
      `failed`, never an acquisition refusal. Resume no longer applies the
      one-shot `DEFAULT_TIMEOUT_MS`; it passes the handle bound and the optional
      session bound as data like spawn. Move the resume describes out of
      `tests/behaviour/harness-opencode-session.test.ts` into the new
      `tests/behaviour/harness-opencode-resume-stream.test.ts` in the same commit
      (TC-OCS-030, TC-OCS-031, TC-OCS-032, TC-OCS-033, TC-OCS-034), using the
      bounded `flushUntil` gate rather than awaiting an adapter-driven signal, and
      update the resume scenario in
      `tests/structure/dispatch-composition.test.ts` so the recorded invocation is
      the starter's `run --format json --session <id>` with the prompt on stdin
      rather than a one-shot runner call. The listing path is untouched and still
      uses the one-shot runner. Gates: `bun test` on the resume suite, the
      opencode session suite and the composition suite, `pnpm typecheck`,
      `pnpm check:boundaries`, `pnpm exec biome check`. Mutation evidence recorded
      here: M-7 (TC-OCS-032).
    scope:
      files:
        - packages/adapters/src/harness/opencode.ts
        - tests/behaviour/harness-opencode-resume-stream.test.ts
        - tests/behaviour/harness-opencode-session.test.ts
        - tests/structure/dispatch-composition.test.ts
    interactions:
      - kind: contract-file
        target: packages/adapters/src/harness/opencode.ts
        role: consumer
    doneArtifacts:
      trackerTransition: >-
        GH-275 in progress; phase 3 owns AC-F3-1, AC-F3-2, AC-F3-3, AC-F3-4 and
        TC-OCS-030, TC-OCS-031, TC-OCS-032, TC-OCS-033, TC-OCS-034; it also owns
        the M-7 mutation record.
    weightClass: standard
