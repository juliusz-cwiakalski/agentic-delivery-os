phases:
  - id: 1
    title: "Additive streaming seam, pinned v2.2.5 JSONL fixture, host starter, and structure/type pinning"
    kind: delivery
    summary: >-
      Add the additive `HarnessSpawnStarter` / `HarnessSpawnStream` /
      `HarnessSpawnStreamOptions` types to the runtime-neutral contract tier
      exactly as sketched in spec Appendix B (DEC-1), and re-export them from
