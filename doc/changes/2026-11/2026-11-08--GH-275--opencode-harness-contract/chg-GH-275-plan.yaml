      `git status --porcelain` and `git rev-parse HEAD` of this worktree, which
      must be unchanged (AC-F8-1, AC-F8-2). A failed step 0a is a blocked
      precondition, not a product failure: record the exact blocked evidence and
      re-run after restoring the credential — AC-F8-1 may be marked satisfied only
      with real executed evidence, never by inference. In the same phase add
