  - id: 5
    title: "Bounds, kill hygiene, hermeticity and fixture non-vacuity"
    kind: delivery
    summary: >-
      Add `tests/behaviour/harness-stream-hygiene.test.ts`, which pins the
      remaining anti-recurrence claims against the adapter P2/P3 delivered; this
      phase writes no product code, and a red assertion reopens P2 or P3 instead
      of being edited away. Cases: a session advanced 11 h in virtual time with no
      `sessionTimeoutMs` is never killed and `collect` eventually returns its
      evidence, while an explicitly injected `sessionTimeoutMs` appears verbatim
      in the recorded options and the adapter never passes the listing timeout to
      the starter (TC-OCS-023); handle-bound expiry kills the child, sets
      `timedOut`, refuses pre-session on spawn and `harness.session.unknown` on
      resume, and leaves no session record (TC-OCS-050); every failed acquisition
      and abandonment path kills exactly once, `kill` is safe to repeat and
      resolves completion once, a successful acquisition is not killed before
      completion, and the fake registry reports zero live streams at case end
      (TC-OCS-051); the recorded spawn options carry `handleTimeoutMs: 60_000`, no
