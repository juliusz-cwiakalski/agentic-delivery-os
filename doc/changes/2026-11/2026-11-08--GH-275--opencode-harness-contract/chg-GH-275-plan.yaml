      `handleTimeoutMs` (kill on expiry, `timedOut: true`), accepts an optional
      `sessionTimeoutMs` where absent or 0 means unbounded, and exposes an
      idempotent `kill` that sends SIGTERM and escalates to SIGKILL after a short
      grace period (DEC-6). The host subpath stays the single child-process site
