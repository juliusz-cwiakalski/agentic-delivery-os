# GH-275 delivery plan — make the opencode harness adapter read the real JSONL
# stream, return the session handle on the first identified line, and resolve
# `collect` only when the (multi-hour) session completes.
#
# Sources (single source of truth):
#   - Spec:      ./chg-GH-275-spec.md (v1.1; F-1..F-8, AC-F1-1..AC-F8-2 = 30 ACs,
#                NFR-1..NFR-9, DEC-1..DEC-8, RSK-1..RSK-9, §6 flows 1–4,
#                §8.4 external contract, Appendix B contract-type sketch,
#                Appendix C failure mapping)
#   - Test plan: ./chg-GH-275-test-plan.md (v1.1; 42 TC-OCS-* scenarios in §5.1
#                and §5.2, §6.3 operator-run end-to-end procedure, §7.1 files the
#                delivery must add or edit, §7.2 TC → file/command mapping,
#                §7.3 executable revert/mutation evidence M-1..M-16, §8.1
#                testing risks, §10 execution log)
#   - Ticket:    GH-275.
#
# `tests` is delivery evidence for plan review; it is not a `delivery.plan.v1`
# schema field. The schema-validated keys used here are schemaVersion,
# workItemRef, tier, defaultLeases, defaultWeightClass, and phases (id, title,
# kind, summary, scope, interactions, doneArtifacts, leases, weightClass,
# leaseClass). Phase progress never lives here; it belongs in pm-notes `notes:`
# entries.
#
# Ceremony: one ticket, one PR targeting main-tools, six delivery phases. P1
# adds the additive seam, the pinned stream fixture and the host implementation;
# P2 moves the spawn path (decode → acquire → collect) onto the seam and makes
# the seam a required constructor dependency; P3 moves resume/deliver; P4 pins
# composition, conformance and the preserved-adapters/dispatch regressions; P5
# pins bounds, kill hygiene, hermeticity and fixture non-vacuity; P6 runs the
# bounded real-CLI proof, adds the release changeset, runs the aggregate gate and
# declares the phase-7 spec handoff. Each phase is independently green on its own
# slice: no phase needs a later phase to compile or to assert. The suite is green
# after every phase because every delivered suite whose construction site or
# assertion the phase invalidates is migrated in that same phase (test plan §7.2
# sequencing note 6: a moved spawn/resume case lands its replacement in the same
# commit).
#
# AC ownership (every one of the 30 ACs has exactly one owning phase; cross-phase
# confirmation is additive and never transfers ownership):
#   P1  AC-F2-3, AC-F6-2, AC-F7-1, AC-F7-4
#   P2  AC-F1-1, AC-F1-2, AC-F1-3, AC-F1-4, AC-F1-5, AC-F1-6, AC-F1-7,
#       AC-F2-1, AC-F2-2, AC-F4-1, AC-F4-2, AC-F4-3, AC-F4-4, AC-F4-5,
#       AC-F7-2, AC-F7-3
#   P3  AC-F3-1, AC-F3-2, AC-F3-3, AC-F3-4
#   P4  AC-F6-1
#   P5  AC-F5-1, AC-F5-2, AC-F5-3
#   P6  AC-F8-1, AC-F8-2
# Cross-phase confirmations that do not transfer ownership: P2 confirms AC-F5-1
# with TC-OCS-014 (refusal identity) while P5 owns the kill half; P1 confirms
# AC-F5-2 with TC-OCS-052 (real host kill/escalation/orphan) while P5 owns the
# fake-starter kill matrix; P2 confirms AC-F7-1 with TC-OCS-017 and P4 with
# TC-OCS-061 while P1 owns the fixture; P3 confirms AC-F7-3 with TC-OCS-031/032
# while P2 owns the mapping battery; P4 confirms AC-F8-1 with TC-OCS-082 while P6
# owns the real proof. No AC unmapped, no AC id invented.
#
# TC ownership (each of the 42 TC-OCS-* cases names exactly one owning phase):
#   P1  TC-OCS-001, 002, 003, 004, 005, 052, 070
#   P2  TC-OCS-010, 011, 012, 013, 014, 015, 016, 017, 020, 021, 022,
#       040, 041, 042, 043, 044, 045
#   P3  TC-OCS-030, 031, 032, 033, 034
#   P4  TC-OCS-060, 061, 080, 081, 082
#   P5  TC-OCS-023, 050, 051, 053, 071, 072
#   P6  TC-OCS-100, 101
# 7 + 17 + 5 + 5 + 6 + 2 = 42; no TC unmapped, no TC id invented.
#
# Declared shared paths (sequential, never parallel — the `shared-paths`
# run-in-sequence case, not a parallelizable split):
#   - `packages/adapters/src/harness/opencode.ts` is one module implementing one
#     port, so P2 (spawn/collect) and P3 (resume/deliver) edit it in sequence.
#   - `tests/behaviour/harness-opencode-session.test.ts` loses its spawn
#     describes in P2 and its resume describes in P3, each replaced in the same
#     commit; P4 keeps and asserts the listing describes.
#   - `tests/structure/dispatch-composition.test.ts` gains the starter injection
#     in P2 (so the composed program keeps a recording seam), records the resume
#     invocation through the starter in P3, and gains the per-harness seam
#     assertions in P4.
#   - `tests/behaviour/harness-claude-session.test.ts` and
#     `tests/fixtures/dispatch/golden/harness.ts` are touched in P2 only for the
#     constructor/option migration and in P4 for the assertions.
# Every phase's slice is green on its own; the shared files are gates in a fixed
# order, so no phase is ever executed concurrently with another.
#
# Resolved tension (why P2 is the single runtime-switch phase): the streaming
# starter is a required constructor option of the opencode port (spec F-6: the
# adapter receives the starter for spawn/resume/deliver and the one-shot runner
# for listing only). Making it required forces every opencode construction site —
# `packages/cli/src/production.ts`, `packages/testkit/src/conformance/harness.ts`
# and the delivered suites that build the port — to supply it in the same commit,
# or the tree cannot be composed and the suites go red. A temporary
# "fall back to the one-shot runner when no starter is injected" branch would
# keep the completion-gated defect reachable and is rejected. Therefore P2 owns
# the whole switch for the spawn path plus the mechanical migration of every
# construction site; P3 then migrates only the resume/deliver operations on the
# already-wired seam. Splitting P2 further would either retain the defect branch
# or leave `packages/cli` uncompilable between phases.
#
# Revert / mutation evidence (test plan §7.3 owns the procedure text, the red
# assertion, and the red/green sets; this plan names the obligation and the TC):
#   - whole-document `JSON.parse` of stdout  → M-1 → TC-OCS-010 red (P2)
#   - missing top-level `sessionID`          → M-2 → TC-OCS-010, TC-OCS-017 red (P2)
#   - completion-gated spawn                 → M-3 → TC-OCS-020, TC-OCS-021 red (P2)
#   - in-flight evidence from `collect`      → M-4 → TC-OCS-021 red (P2)
#   - completion marker from exit 0 alone    → M-6 → TC-OCS-041, TC-OCS-045 red (P2)
#   - resume accepts any identifier          → M-7 → TC-OCS-032 red (P3)
#   - whole-session 300 s default cap        → M-5 → TC-OCS-023, TC-OCS-053 red (P5)
#   - kill removed from failure paths        → M-8 → TC-OCS-050, TC-OCS-051 red (P5)
#   - second `node:child_process` site       → M-9 → TC-OCS-003 red (P1)
#   - adapter-owned handle timer             → M-10 → TC-OCS-003 red (P1)
#   - session port gains a member            → M-11 → TC-OCS-002, TC-OCS-070 red (P1)
#   - one-shot runner result reshaped        → M-12 → TC-OCS-002, TC-OCS-080 red (P1/P4)
#   - Claude adapter adopts the seam         → M-13 → TC-OCS-080 red (P4)
#   - dispatch engine branches on the seam   → M-14 → TC-OCS-004, TC-OCS-082 red (P4)
#   - conformance registration over runner   → M-15 → TC-OCS-061 red (P4)
#   - Claude given the starter               → M-16 → TC-OCS-060 red (P4)
# Each mutation is applied to a scratch copy or in place and restored with
# `git checkout -- <file>`; no mutant is committed. The red run, the restored
# green run, and the named TC are recorded in pm-notes `notes:` at each phase
# boundary and in test plan §10.
#
# Release obligation (TC-RELEASE-001, `tests/checks/privacy-release.test.ts`):
# the branch touches `packages/**`, so exactly one changeset must be added —
# `.changeset/gh-275-opencode-harness-contract-minor.md` — declaring exactly
# `@delivery-os/core`, `@delivery-os/adapters`, `@delivery-os/cli`,
# `@delivery-os/mcp` and `@delivery-os/opencode` at `minor` with a non-empty body
# (`@delivery-os/testkit` is excluded). A `patch` entry fails the gate, and no
# pre-existing changeset may be modified or deleted. P6 owns the file.
#
# Environment facts: `bun test` is the test runner; `pnpm build` must be re-run
# after source changes because `dist/` is git-ignored; the CLI is
# `bun packages/cli/bin/delivery-os.ts ...`; `opencode v2.2.5` is installed; the
# aggregate gate is `pnpm check`, and `pnpm typecheck`, `pnpm check:boundaries`,
# `pnpm lint` and `pnpm format:check` are separate gates. Core stays
# runtime-neutral (no `node:*`), `packages/adapters/src/host/index.ts` stays the
# only harness child-process site (the 12-entry allowlist in
# `tests/structure/harness-imports.test.ts` keeps exactly one harness entry), new
# files carry no license headers, and change artifacts and tests need no
# `ados_distribution` marker.
#
# Rollback: reverting the P2/P3 adapter and composition edits restores the
# previous (broken) behaviour. No persisted state, schema version, configuration
# key, error code, result token, or CLI grammar changes, so no data rollback and
# no feature flag apply.
