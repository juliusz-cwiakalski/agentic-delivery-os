notes:
  - text: "Clarify scope: ticket is prescriptive and consistent with delivered
      behaviour. Confirmed in source: (a)
      packages/adapters/src/harness/opencode.ts spawn does a single JSON.parse
      over the whole stdout and sessionIdOf reads only session.id / sessionId /
      id — never the top-level sessionID the real CLI emits; (b) the spawn
      handler awaits HarnessSpawnRunner to process close, so the handle cannot
      exist before the session ends; (c) the host runner enforces
      options.timeout with SIGTERM (DEFAULT_TIMEOUT_MS = 300_000), so a real
      lifecycle is killed at five minutes; (d) every spawn failure collapses to
      dispatch.session.spawn-failed with lastMessage 'spawn failed before a
      session existed' (packages/core/src/app/dispatch.ts). No blocking
      question: the required behaviour, error identity, and acceptance are
      stated."
    type: info
    date: "2026-11-08"
  - text: "Doc impact to reconcile in phase 7: feature-harness-adapters.md §6
      'host-runner semantics stay as delivered ... adds no invented runner API'
      and §3 opencode adapter paragraph; feature-dispatch-engine.md §3.3 (spawn
      through the port) and its timeout narrative. ADR-0008 DC-2 (session
      lifecycle) is unaffected: the fix stays behind the adapter and the port. A
      TDR may be warranted for the streaming handle-acquisition seam if the
      spec/plan change the HarnessSpawnRunner contract shape."
    type: info
    date: "2026-11-08"
  - text: "Risk recorded at intake: AC 'one real dispatch reaches classification'
      spawns a nested lifecycle session. Plan must bound the proof (probe-scale
      prompt or a dispatch run whose session is ended after the handle is
      observed) and must not let a nested session mutate this change's
      worktree."
    type: risk
    date: "2026-11-08"
  - text: "Spec v1.0 authored: 8 functional capabilities, 30 ACs, 9 NFRs, 8 DECs, 9
      risks, no open questions. Design: additive streaming starter seam
      (HarnessSpawnStarter/HarnessSpawnStream) beside the unchanged one-shot
      HarnessSpawnRunner; 60 s handle-acquisition bound; no default
      whole-session bound; completion requires exit 0 plus a terminal
      step_finish with part.reason 'stop'; dispatch engine untouched. PM
      decision: no separate TDR — the delivered session-port and one-shot-runner
      contracts are unchanged, ADR-0008 DC-2 is satisfied, and the additive
      internal seam is recorded in the change decision log. Revisit if a
      reviewer finds the seam changes an engine-visible contract."
    type: decision
    date: "2026-11-08"
  - text: "Specification reopened at v1.0: version_impact declared patch, but the
      permanent TC-RELEASE-001 invariant (tests/checks/privacy-release.test.ts)
      requires exactly one added changeset declaring the five fixed-group
      packages at minor whenever a branch touches packages/**. Corrected to
      minor in spec v1.1 (DEC-8, §18 changeset obligation, §16, §25) plus a
      named changeset file. Test plan unaffected (no AC/TC change); its phase
      stays complete."
    type: blocker
    date: "2026-11-08"
  - text: "Retro: the patch/minor mismatch was already documented in GH-273's own
      retro note in a sibling change capsule, and the spec still repeated it.
      Cost: one reopen cycle. Lesson: when a change touches packages/, start the
      version-impact decision from the TC-RELEASE-001 invariant (five packages
      at minor) rather than from semver judgment, and check the immediately
      preceding fix change's capsule for the same class of defect."
    type: retro
    date: "2026-11-08"
  - text: "DoR iteration 1 = NOT_READY (readiness/readiness-iter-1.md), 3 blocking +
      8 advisory. B-1: DEC-5's completion rule contradicts the retained
      conformance floor and TC-HARN-010 (single-document legacy envelopes still
      carry completion/refusal/timeout facts and must keep classifying the
      same). B-2: §8.4 declares only step_start/text/step_finish, so
      AC-F4-3/AC-F4-4 tool-failure and failure facts are unproducible (real CLI
      emits tool_use part.state.status=error and error events). B-3: TC-OCS-020
      awaits the fake's acquired signal, so the completion-gated mutant hangs
      instead of failing. Reopened specification, test_planning and
      delivery_planning; no delivery phase entered."
    type: blocker
    date: "2026-11-08"
  - text: "Retro: B-1 and B-2 are the same failure mode the GH-273 retro named — a
      new contract asserted from the ticket text without probing the delivered
      consumers and the real stream. The spec's 'evidence' table cited the
      classifier but not the retained scenario fixtures, and the stream
      vocabulary was taken from the ticket's three sample lines rather than a
      real capture. Lesson: when a spec declares a decoding contract, enumerate
      both (a) every existing fixture/assertion that must keep passing and (b)
      the real event vocabulary including failure encodings, and pin both in the
      fixture before the DoR gate."
    type: retro
    date: "2026-11-08"
