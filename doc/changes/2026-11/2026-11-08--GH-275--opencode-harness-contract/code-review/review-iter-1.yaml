summary: >-
  Independent first local review. The change implements the spec faithfully and
  the delivered gates hold. The opencode adapter now decodes the real JSONL
  stream line-independently, takes the top-level sessionID first (with the
  retained session.id / sessionId / id fallbacks and empty-string rejection),
  returns a handle on the first identified line without awaiting completion,
  derives completion-scoped evidence under the DEC-5 legacy-envelope precedence
  (host exit/timedOut merged on top), moves resume/deliver onto the same
  non-blocking acquisition with caller-identity preservation, and replaces the
  300 s whole-session cap with a 60 s handle-acquisition bound and no default
  session bound. The additive HarnessSpawnStarter seam is host-owned through the
  single node:child_process module; the one-shot runner, HarnessSessionPort,
  dispatch engine, classifier, error vocabulary, result tokens and the Claude
  adapter are untouched (verified from the diff, not the claims). I re-ran the
  named suites plus the aggregate suite: 159 focused harness/dispatch/conformance
  tests, pnpm typecheck, pnpm check:boundaries, biome format and biome lint on
  the touched files all pass, and plan validate reports valid /
  readyForDevelopment. The full `bun test` run shows 6554 pass / 4 skip / 4 fail;
  none of the four is introduced by GH-275 source. One is environmental (a
  cross-device `git clone --local` in a test outside the change, green under the
  repository's `TMPDIR=$PWD/tmp/tmpdir` convention). Three are a privacy-literal
  gate trip whose root cause is the tracked review companion artifact
  `review-iter-1.md` carrying absolute workstation paths (a review-metadata
  hygiene issue under concurrent phase-9 remediation, not product code); this
  YAML deliberately names no absolute path and passes the privacy scanner. The
  AC-F8-1/AC-F8-2 operator E2E evidence is real: the recorded attempt IDs, tokens
  (failed, noop-lane-nothing-to-do, outcome failed) and evidenceRefs
  (attempt:<id>, liveness:unknown) are present in the on-disk ledger. Findings
  are advisory only (3 low, 3 info); no critical, high, or medium findings.
