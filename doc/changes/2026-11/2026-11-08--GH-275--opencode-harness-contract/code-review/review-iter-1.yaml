  - id: F-2
    severity: low
    confidence: high
    category: maintainability
    location: packages/core/src/contracts/index.ts:1
    message: >-
      P1 (commit 5f05d350) reorders the entire export surface of
      contracts/index.ts (+239/-240) while the only semantic change is the three
      additive HarnessSpawnStarter / HarnessSpawnStream / HarnessSpawnStreamOptions
      re-exports. A set comparison of exported specifiers confirms exactly those
      three names are new and nothing was removed; the remaining 236 line
      changes are pure alphabetical reordering. The reorder is not required by
      the gate battery (`format:check` uses `biome format`, which does not
      reorder imports/exports, and `lint` has no sorted-export rule), so it
      inflates the PR diff and merge-conflict surface for no behavioural gain.
    suggestion: >-
      Harmless if kept, but future changes should keep incidental whole-file
      reorders in a separate formatting-only commit so the semantic addendum
      stays reviewable; alternatively narrow this commit to the three added
      names.
    suppressed: false
  - id: F-3
    severity: low
    confidence: medium
    category: reliability
    location: packages/adapters/src/host/index.ts:165
    message: >-
      The streaming starter appends every stdout chunk to `lineBuffer`
      (splitLines) before the 16 MiB stdout bound check and keeps splitting on
      later chunks even after `truncated` is set, and the createLineChannel queue
      is likewise drained only at consumer speed. A newline-free (or very long
      single-line) stream, or a producer outrunning the JSON-parsing pump, can
      therefore grow host-side memory past the documented 16 MiB stdout bound —
      a latent departure from NFR-6 / spec §21 "cannot grow adapter memory
      without limit". Real opencode JSONL is newline-delimited and small, and the
      adapter's own fact accumulation is bounded, so the practical risk is low.
    suggestion: >-
      Bound `lineBuffer` (stop splitting/accumulating once MAX_OUTPUT_BYTES is
      exceeded, or cap the partial-line length and mark truncation) so a
      pathological single-line stream cannot grow host memory past the documented
      bound.
    suppressed: false
  - id: F-4
    severity: info
    confidence: high
    category: maintainability
    location: packages/core/src/contracts/harness.ts:199
    message: >-
      `type ResultToken = DeliveryResultToken` was introduced in P1 (disclosed in
      pm-notes) solely to avoid a commit-time secret-scanner false positive, and
      the delivered HarnessClassification.token annotation now points at it. It
      is semantically identical (a type alias) and the exports-parity/typecheck
      gates pass, but it is an unrequested edit to a delivered contract
      annotation unrelated to the streaming seam.
    suggestion: >-
      Acceptable as disclosed; if the scanner false positive recurs, prefer
      fixing the scanner allowlist rather than aliasing public contract
      annotations.
    suppressed: false
  - id: F-5
    severity: info
    confidence: medium
    category: robustness
    location: packages/adapters/src/harness/opencode.ts:241
    message: >-
      `pump` (acquisition/drain) has a try/finally but no catch, so if a future
      starter's `lines` iterator rejected, the rejection would flow into the
      eagerly-created completion promise: on the acquired path `collect` would
      reject (throwing across the port boundary) and on the absent path the
      discarded completion promise would become an unhandled rejection. The
      shipped host starter's `next()` never rejects, so this is latent and not
      reachable today.
    suggestion: >-
      Add a defensive catch in `pump` that records the failure as evidence (or
      resolves completion on error) so a throwing line iterator can never turn a
      `collect` into a thrown exception; low priority while the host is the only
      starter.
    suppressed: false
  - id: F-6
    severity: info
    confidence: high
    category: consistency
    location: packages/adapters/src/host/index.ts:243
    message: >-
      The streaming starter's close handler reads only `code` and does not set
      `timedOut` from `signal === "SIGTERM"`, whereas the sibling one-shot
      `createHostSpawnRunner` sets `timedOut = timedOut || signal === "SIGTERM"`.
      An externally SIGTERM-ed opencode child therefore reports status 1 /
      timedOut false and classifies `failed` (as the recorded P6 E2E run does),
      while the same signal on the Claude one-shot path would classify
      `timed-out`. Host-initiated kills (handle/session bound) still set timedOut
      explicitly, so this only affects truly external signals.
    suggestion: >-
      Either document the intentional divergence beside the starter, or mirror
      the one-shot rule (mark timedOut on an external SIGTERM) if cross-seam
      classification parity for external signals is desired.
    suppressed: false
