    suppressed: false
  - id: F-2
    severity: low
    confidence: high
    category: maintainability
    location: packages/core/src/contracts/index.ts:1
    message: >-
      The P1 commit (5f05d350) reorders the entire export surface of
      contracts/index.ts (+239/-240) while the only semantic change is the three
      additive HarnessSpawnStarter/HarnessSpawnStream/HarnessSpawnStreamOptions
      re-exports. A sorted diff confirms exactly those three lines are new; the
      remaining 236 line changes are pure reordering with no behavioural effect.
      This inflates the PR diff and the merge-conflict surface for a file that
      the plan only adds three names to.
    suggestion: >-
      Accept the reorder as harmless if it came from the coder's formatter, but
      in future keep incidental whole-file reorders in a separate
      formatting-only change so the semantic addendum stays reviewable.
    suppressed: false
  - id: F-3
    severity: low
    confidence: medium
    category: reliability
    location: packages/adapters/src/host/index.ts:195
    message: >-
      The streaming starter appends every stdout chunk to `lineBuffer` (splitLines
      at :165) before the 16 MiB stdout bound check (:197) and keeps appending on
      later chunks even after `truncated` is set. A newline-free (or very long
      single-line) stream therefore grows `lineBuffer` without the 16 MiB cap that
      stdout itself honours, a latent departure from NFR-6's "no unbounded buffer"
      intent. Real opencode JSONL is newline-delimited, so the practical risk is
      low.
    suggestion: >-
      Bound lineBuffer (e.g. stop splitting/accumulating once
      MAX_OUTPUT_BYTES is exceeded, or cap the partial-line length and mark
      truncation), so a pathological single-line stream cannot grow host memory
      past the documented bound.
    suppressed: false
  - id: F-4
    severity: info
    confidence: high
    category: maintainability
    location: packages/core/src/contracts/harness.ts:199
    message: >-
      `type ResultToken = DeliveryResultToken` was introduced (P1 deviation, per
      pm-notes) solely to avoid a commit-time secret-scanner false positive, and
      the exported HarnessClassification.token annotation now points at it. It is
      semantically identical and the exports-parity/typecheck gates pass, but it
      is an unrequested change to a delivered contract type unrelated to the
      streaming seam.
    suggestion: >-
      Acceptable as disclosed; if the scanner issue recurs, prefer fixing the
      scanner allowlist rather than aliasing public contract annotations.
    suppressed: false
  - id: F-5
    severity: info
    confidence: medium
    category: robustness
    location: packages/adapters/src/harness/opencode.ts:241
    message: >-
      `pump` (acquisition/drain) has a try/finally but no catch, so if a future
      starter's `lines` iterator rejected, the rejection would flow into the
      eagerly-created `completion` promise: on the acquired path `collect` would
      reject (throwing across the port boundary) and on the absent path the
      discarded completion promise would become an unhandled rejection. The host
      starter's `next()` never rejects, so this is latent and not reachable with
      the shipped starter.
    suggestion: >-
      Add a defensive catch in `pump` that records the failure as evidence (or
      resolves completion on error) so a throwing line iterator can never turn a
      `collect` into a thrown exception; low priority while the host is the only
      starter.
    suppressed: false
