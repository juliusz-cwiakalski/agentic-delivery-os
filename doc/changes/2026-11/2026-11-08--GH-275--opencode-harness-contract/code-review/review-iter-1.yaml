summary: >-
  The change implements the spec faithfully and the gate evidence holds. The
  opencode adapter now decodes the real JSONL stream line-independently, takes
  the top-level sessionID (with the retained fallbacks), returns a handle on the
  first identified line without awaiting completion, derives completion-scoped
  evidence under the DEC-5 legacy-envelope precedence, moves resume/deliver onto
  the same non-blocking acquisition with identity preservation, and replaces the
  300 s whole-session cap with a 60 s handle bound and no default session bound.
  The additive HarnessSpawnStarter seam is host-owned and the one-shot runner,
  session port, dispatch engine, classifier, error vocabulary and Claude adapter
  are untouched. I re-ran the automated probes named in the brief plus the
  broader harness/release battery: git diff --check, plan validate, pnpm
  typecheck, pnpm check:boundaries, and 177 focused tests all pass. Findings are
  advisory only (3 low, 2 info): one dropped opencode resume capability-gap
  test, an unrelated mass-reorder in contracts/index.ts, a latent unbounded
  line buffer in the host starter, the ResultToken alias deviation, and a latent
  collect-rejection path. No critical, high, or medium findings. AC-F8-1/AC-F8-2
  rest on P6's recorded operator E2E evidence, which cannot be re-executed in
  this environment (no live opencode/GITHUB_TOKEN).
