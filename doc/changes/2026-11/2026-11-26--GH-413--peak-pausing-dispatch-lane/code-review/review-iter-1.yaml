    owner: coder, remediation commit R4
    message: >-
      The renewal `await` placed at the top of the watcher loop (1399) moves the
      first liveness read behind an async boundary. A session whose collection
      resolves in the spawn tick is stopped before its first observation is
      applied: the read is made and answers ok, `stopped` is already true when
      it resolves (1444), and `observeLiveness` never runs, so the attempt
      carries no `liveness:*` evidence where the delivered engine recorded the
      honest `liveness:unknown` beside a harness-reported timeout.
      `tests/conformance/dispatch/dispatch-parity-stall-loop.test.ts` TC-TERM-007
      is red on HEAD (line 531, expected `liveness:unknown`, received `[]`;
      reproduced in isolation, and a counting port shows one liveness call
      answering ok with no verdict recorded). The suite is a read-only control
      of phase 5, and NFR-9 promises every delivered no-park field unchanged.
    suggestion: >-
      Take the first liveness observation before any `await` can let the
      post-collection stop intervene (observe first and renew after, or apply
      the verdict when the read answers ok even if `stopped` turned true), and
      add a regression arm asserting that a session ending in the spawn tick
      still carries its `liveness:unknown` evidence.
  - id: F-3
    severity: high
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch.ts:2128
    owner: coder, remediation commit R2
    message: >-
      The engine's `finally` releases the lease unconditionally
      (`ports.releaseLease(releaseCause)`, dispatch.ts:2128-2130). The production
      release matches on holder only (production.ts:5101-5110 into
      `releaseQueueLease`, queue.ts:2534) and both invocations share the
      `dispatch` holder, so an invocation whose renewal answered `not-owned`
      (`leaseLost`, dispatch.ts:977) releases the successor's live lease when it
      returns, from the parked return (1678-1699, whose comment says "releases
      the lease; the successor's lease is untouched"), the stall return
      (1746-1763) or any other. This contradicts spec F-5, DEC-13, sections 12
      and 14, the last arm of AC-F5-2 and TDR-0078 C-5 ("It does not release,
      renew, or extend the successor's lease"). Reproduced: at the engine level a
      lost-lease run records `releases: ["completed"]`; at the store level, after
      the earlier invocation's renewal answers `not-owned`, the production-shaped
      release answers `released` and the successor's lease is gone.
    suggestion: >-
      Make the release ownership-fenced like the renewal: release only when the
      live lease's latest heartbeat is this invocation's own last write (carry
      `expectedHeartbeatAt` into a fenced release, and skip the release when
      `leaseLost`). Add an engine-over-real-store test for the re-dispatch arm:
      successor claim through the delivered `renewed` arm, earlier renewal
      `lease:not-owned`, earlier return, successor's lease still live with its
      own heartbeat.
