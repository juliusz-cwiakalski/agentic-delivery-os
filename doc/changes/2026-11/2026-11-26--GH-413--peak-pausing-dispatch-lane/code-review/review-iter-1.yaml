  - id: F-16
    severity: low
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:4809
    owner: coder, remediation commit R3
    message: >-
      `peakRulesFor` caches the parsed rule map for the composer's lifetime
      (4809-4838). One composer serves the whole invocation, so the resume
      admission re-evaluation that RSK-6 relies on ("never resumes into an
      observed open window; a rule change during an episode can only defer a
      resume") reads the rules as they were before the park. A window extended
      during the episode is not seen and the lane resumes into it. The fixture
      passes a lookup that changes between calls, which production cannot do.
    suggestion: >-
      Re-read the configuration at each resume-admission evaluation (the
      acquisition is already lazy and cheap relative to a cadence), or bound the
      cache to one observation. Test it through the production composer with the
      configuration rewritten between the park and the recorded end.
