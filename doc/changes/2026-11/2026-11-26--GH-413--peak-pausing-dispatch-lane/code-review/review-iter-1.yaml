  - id: F-12
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/app/dispatch.ts:1378
    owner: coder, remediation commit R4
    message: >-
      With a renewal port composed the watcher wakes at the renewal cadence and
      observes only when a full liveness interval has elapsed (1378-1393, 1447),
      so the effective observation interval is `ceil(L / c) * c` and no longer
      the configured `lane.liveness-interval` whenever `queue.lease-ttl / 2` is
      below it. Measured at liveness 60 s and TTL 90 s: liveness polls at 0, 90,
      180, 270 s with the renewal port against 0, 60, 120, 180 s without it.
      Stall detection and the window-open observation slow by up to one renewal
      cadence, and the verdict trail records `cadenceMs` as the configured value
      (1354-1356) although the spacing is larger. DEC-11 quantizes the park wait
      on purpose; the running session is not covered by that decision.
    suggestion: >-
      Wake at the earlier of the next observation due and the next renewal due,
      so observations keep the configured interval and renewals still land at
      most once per renewal cadence. Record the effective cadence in the verdict
      trail, and assert the poll spacing at liveness 60 s with TTL 90 s.
