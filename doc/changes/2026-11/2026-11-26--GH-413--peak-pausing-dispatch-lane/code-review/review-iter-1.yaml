summary: >-
  FAIL on 23 findings (7 high, 7 medium, 8 low, 1 info). At the fixture level the
  delivered surface matches the spec: the watch composes the delivered decision
  layer, the park frame and the pre-session `dispatch.resume-parked` refusal are
  as specified, the error row and the pins the plan named agree with the
  documented table (173 entries, 173 documented, 72 reserved two-segment codes),
  and the status park fact, the mode carve-out and the operator grammar hold
  (92 targeted tests and 507 pin, structure and conformance tests pass, and
  `pnpm typecheck` exits 0). The FAIL rests on what the fixtures cannot see.
  First, `bun test` is red on HEAD outside the phase verify sets (34 failures
  in the 6746 tests I ran): two pins the change did not move, 31 timeouts in
  the production-composition suites because the post-collection withhold waits
  60 s of real time there, and one delivered conformance test that loses its
  first liveness observation to the renewal's new `await`. Second, the
  lost-lease rules are not met: a lost-lease invocation still releases the
  lease on return (the successor's, since the release matches on holder) and
  only the stall branch answers with `lease:not-owned`. Third, the production
  peak binding stubs the resume half, so in production every not-preserved
  recovery refuses `dispatch.state-unverified`, exhaustion appends no record and
  raises no question, and a stop that is unavailable or unconfirmed still writes
  a park while the watcher exits. Fourth, two test-only runaway guards are
  production limits: a legal wait longer than 2000 turns (16.7 h at the
  defaults, reachable through an owner hold or `dispatch stop --until`) ends the
  invocation with `fallback.internal`, an `active` lane record and no attempt.
  The parked-interval lease proof and the mid-iteration window opening are not
  exercised end to end.
