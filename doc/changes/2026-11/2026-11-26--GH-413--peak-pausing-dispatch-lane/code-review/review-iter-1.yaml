  - id: F-8
    severity: medium
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:4981
    owner: coder, remediation commit R3
    message: >-
      The preservation classification ignores the escalation fact. The watch's
      production `stop` port classifies `terminated` as `"preserved"`
