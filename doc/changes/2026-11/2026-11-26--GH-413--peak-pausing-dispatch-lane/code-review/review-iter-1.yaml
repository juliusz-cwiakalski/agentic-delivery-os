    location: packages/adapters/src/harness/opencode.ts:806
    owner: coder, remediation commit R3; note the precondition in the guide if unchanged
    message: >-
      The cross-process terminate matches the host process table by exact argv
      identity: the session id or the title `ticket-<REF>` (opencode.ts:209-218,
      806-809). A fresh spawn carries only the title in its argv, and the title
      is not repository-scoped, so `dispatch stop <ref>` issued for a ref that
      runs in two repositories on one host signals both sessions while it parks
      one. The spec's security review says the command "signals only the session
      it identifies". The ambiguity is delivered for the owning process; this
      change makes it reachable by any `dispatch stop` caller.
    suggestion: >-
      Scope the cross-process match to the resolved repository (the process's
      working tree under the recorded worktree path or the main checkout, or
      match by session id only when the handle resolves to a resumed session),
      or state the one-lane-per-ref-per-host precondition in the operations
      guide. Add an adapter test with two same-titled processes under different
      roots.
