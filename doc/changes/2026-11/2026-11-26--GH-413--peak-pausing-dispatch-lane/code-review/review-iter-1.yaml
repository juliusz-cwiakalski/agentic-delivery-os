  - id: F-6
    severity: high
    confidence: high
    category: correctness
    location: packages/cli/src/production.ts:4974
    owner: coder, remediation commit R3
    message: >-
      The watch writes a park for a stop that was never issued or not confirmed.
      The production `stop` port returns `"session-state-not-preserved"` when the
      selected harness declares no `terminate` operation (4977-4979) and when the
      terminate is unconfirmed (`terminated` false, 4981-4983); `runPeakWatch`
      then appends the park and the watcher returns (dispatch.ts:1422-1428). The
      Claude Code adapter declares the terminate gap (claude.ts:30,39-41), and the
      spec's assumption that the terminate path "is capable on every harness this
      path spawns" (section 12) is false for it. On such a lane the session keeps
      running through the window with no liveness watch, no renewal and no peak
      observation, while `lanes` and `board` show it parked; the lease goes stale
      after the TTL and the next dispatch can start a second session once the park
      has expired. The delivered stall path respects the gap (dispatch.ts:1770,
      1870-1871); the watch does not.
    suggestion: >-
      Never append a park without a confirmed terminate. Compose `watchEnabled`
      false when the selected harness declares no terminate (declared like the
      pausing key and documented), make the production `stop` port refuse an
      unconfirmed terminate instead of returning a classification, and keep the
      watcher observing and renewing after an unconfirmed stop so the next
      observation retries it under the occupancy rule. Add a
      production-composition test with a terminate-less harness port and one
      with an unconfirmed terminate.
  - id: F-7
