    suggestion: >-
      Derive the classification from the terminate result in both writers:
      terminated without escalation is `preserved`, an escalated stop is
      `session-state-not-preserved`. Add the escalated arm to
      `tests/behaviour/dispatch-stop-safety.test.ts` and to the watch's
