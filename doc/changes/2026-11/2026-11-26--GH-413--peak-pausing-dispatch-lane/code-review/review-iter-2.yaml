residual_decisions:
  - prior: [iteration 1 F-14]
    decision: ACCEPT (not blocking)
    reason: >-
      The three missing arms are covered structurally. The watcher is created
      per iteration and observes before its first wait, so a window that opened
      between iterations parks at the next acquisition; I ran that transition
      and it parks at 06:00:00 and resumes at 10:00. The separate-process
      hand-off is the durable park record, which the owning invocation re-reads
      after the withhold; the fixture-array tests and the withhold re-read prove
      that read. Between park and resume the engine only appends records and
      calls the resume with the same handle and descriptor, and the worktree is
      provisioned once before the loop, so there is no act for AC-F5-1's
      comparison to catch.
    condition: >-
      Record it in pm-notes as an accepted residual, so `dod_check` does not
      read AC-F5-1 and AC-F1-2's second arm as test-verified, and trim or
      complete the two test-spec sentences named in F-13.
  - prior: [iteration 1 F-17]
    decision: ACCEPT (not blocking)
    reason: >-
      The ordering is a property of one function's statement order: the
      recovery pass at dispatch.ts:1241-1263 returns before the session loop at
      1267. I ran the refusal with a call-recording harness: no spawn, no
      resume, no collect, one lease claim, no new park, no lane record.
    condition: >-
      Either add the two-line `spawn` and `resume` assertion to the
      unrecoverable-park test, or drop "calls neither spawn nor resume" from
      the test-spec page.
  - prior: [iteration 1 F-21g]
    decision: ACCEPT (not blocking)
    reason: >-
      The duplicated record builder is a drift risk only. The record the
      dispatch builder produces is accepted by the store's park validator and
      read back by the engine and the status surface in every production probe,
      and the delivered builder lives in a file the plan fences.
    condition: >-
      None for merge. The parity-fixture comparison phase 9 named as the
      substitute was not delivered; carry it as a follow-up.
