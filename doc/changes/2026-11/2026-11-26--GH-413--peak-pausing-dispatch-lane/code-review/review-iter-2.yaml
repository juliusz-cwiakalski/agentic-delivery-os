    prior: [iteration 1 F-5]
    message: >-
      NEW, introduced by the F-5a fix. The budget-only branch calls
      `admitDispatchRestart({ count, bound })`, which treats a bound of 0 or
      less as "no policy composed" and admits without limit (dispatch-resume.ts:
      97-100). The stall restart it is specified to reuse refuses in that case
      (`budget > 0 ? admitDispatchRestart : refuse`, dispatch.ts:1961-1971), and
      the catalog documents 0 as "the valid admit-no-restarts policy"
      (catalog.ts:472-473, feature-config-layer.md:382). Reproduced twice: over
      a real store with `restartBudget` 0 and with no budget composed, and
      through the real production composer with `lane.restart-budget: 0`; in
      each a killed session's window-end recovery re-entered (exit 0, a second
      spawn, one `economics.restart` with reason `session-interrupted`). This
      contradicts the pm-notes decision "the same rule the stall restart uses"
      and spec F-4 "under the delivered restart budget".
    suggestion: >-
      Mirror the stall rule at the call site: when the engine's budget is not
      positive, refuse as terminal exactly as dispatch.ts:1961-1971 does, or
      give `admitDispatchRestart` an explicit scope for it. Add a bound-0 arm to
      the recovery suite and to the production-composition test.
