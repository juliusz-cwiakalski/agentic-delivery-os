    message: >-
      PARTLY CLOSED. The withhold renews, so at the defaults and at 45 s and
      60 s the heartbeat age on return is the liveness interval (30, 45, 60 s;
      it was 90, 135, 165 s). It renews once per step and a step is the whole
      `lane.liveness-interval`, not the renewal cadence, so the interval-at-or-
      above-TTL configuration NFR-10 names is still broken: measured age on
      return is 90 s at a 90 s interval (the TTL, stale at or beyond it), 120 s
      at 120 s and 180 s at 180 s. In that window a second dispatch's claim
      succeeds: my 120 s run records a claim taken during the post-resume
      withhold. NFR-10's exemption list names terminate grace, worktree
      provisioning and handle acquisition, not the withhold. The test the
      remediation added asserts only that at least one renewal happened.
    suggestion: >-
      Step the withhold by `min(livenessIntervalMs, leaseTtlMs / 2)` (the
      engine already has `renewalCadenceMs`) and keep the total at grace plus
      one liveness interval, or renew at each cadence step inside each liveness
      step. Add the arm NFR-10 names: liveness interval at or above the TTL,
      heartbeat age below the TTL across a session end, second dispatch refused.
  - id: F-4
