    prior: [iteration 1 F-4]
    message: >-
      PARTLY CLOSED. The lost-lease branch now precedes the withhold and the
      derivation, so no push-parity act is reachable and all three returns name
      the lost lease. But each return goes through `record()`, which appends a
      terminal lane record whenever the invocation held a session, so the
      comment at 1501-1504 ("no terminal lane record over the successor's
      active record") is false. Reproduced: a lost-lease clean exit leaves
      `active | terminal/state-unverified` for the same attempt. After a
      re-dispatch the successor's `active` record is no longer the newest, and
      the delivered readers act on that: `dispatch stop <ref>` then refuses
      `queue.precondition.unmet ... state=terminal; a stop request needs a
      running lane` for a lane that is alive, and the resume resolver, which
      reads the newest record carrying a session identity, would name the dead
      attempt's session. The same record makes `dispatch status` report the
      dead attempt's token and its dead owner.
    suggestion: >-
      Skip the terminal lane append in `record()` when `leaseLost` is set; the
      attempt record is the invocation's own and stays. Correct the comment,
      and add an arm asserting the lane records after a lost-lease return.
