summary: >-
  FAIL on 16 findings (2 high, 7 medium, 6 low, 1 info), judged on HEAD
  24f731212 after `pnpm build`. Of iteration 1's 23 findings, 12 are closed
  (F-2, F-3, F-7, F-8, F-10, F-11, F-12, F-15, F-16, F-17, F-19, F-22; F-17
  and F-19 are spec corrections whose code was already right, F-22 is closed
  by documentation), 9 are partly closed (F-4, F-5, F-6, F-9, F-13, F-14,
  F-18, F-20, F-21), F-1 is still open (the seven files it named are green and
  five more are red), and F-23 stays an accepted observation. The remediation
  itself works where I could drive it. Over a real store the fenced release
  and the lost-lease returns leave the successor's lease intact, a park of
  3.5 h renews at every cadence and refuses 141 second-dispatch claims, the
  observation interval is the configured one, and the turn caps are gone.
  Through the real production composer a confirmed stop parks, the lane
  waits and resumes inside the same invocation, a killed session recovers on
  the budget alone, a spent budget refuses terminally with the exhaustion
  record, an unconfirmed stop writes no park, and a rule change made during
  the episode is honoured. It still fails on four things. First, the whole
  `bun test` battery is red: 6 failures in 5 files (one GH-413 suite broken by
  the F-5a fixture default, one delivered control broken by the withhold's
  renewal, three delivered production-composition suites timing out on the
  withhold's real wait), none of them in phase 9's verify sets and no
  full-battery run recorded. Second, the new budget-only admission restarts a
  lane whose `lane.restart-budget` is 0 or absent, the documented
  admit-no-restarts policy, where the stall restart it claims to reuse
  refuses. Third, the lease-liveness and lost-lease rules hold only in the
  default shape: the withhold renews once per liveness interval, so at an
  interval at or above the TTL the lease goes stale at every session end
  (measured 90, 120 and 180 s against a 90 s TTL) and a second dispatch's
  claim succeeds there; a lease lost inside the withhold is not honoured; and
  every lost-lease return still appends a terminal lane record, which its own
  comment says it does not, so after a re-dispatch the live successor lane
  reads terminal and `dispatch stop` refuses it. Fourth, `dispatch stop
  --until` now accepts only the exact millisecond UTC form and refuses the
  reference page's own example. No production-composition test exists for any
  arm the remediation changed; my probes under tmp/tmpdir/review-gh413/iter2
  are the only production-shape evidence and can seed the missing suites.
