  - id: F-12
    severity: low
    confidence: high
    category: performance
    location: packages/core/src/app/queue.ts:2310
    suppressed: false
    prior: []
    message: >-
      NEW, a consequence of the lease liveness design rather than a defect in
      its code. Every renewal appends a `queue.lease` record, nothing compacts
      the history, and the production store is the scan kind: each read loads
      and verifies the whole ledger (`driver/strategy.ts`, `readFileSync` in
      `driver/runtime-edge.ts`). A renewal therefore costs time proportional to
      the ledger's total size. Measured with the real `renewDispatchLease` over
      a real store: the average step cost 24 ms over the first 500 renewals,
      then 68, 112, 157, 203 and 249 ms over each following 500 (407 s of store
      time for 3000 steps), which is about 0.09 ms per record already in the
      ledger. At the default cadence a lane appends two records a minute while
      it runs and while it parks, so a reference-host lane that parks through
      both declared daily windows adds roughly 900 records a day before its
      buffers are counted; by extrapolation a
      renewal reads for about 1 s at 10 000 records, 9 s at 100 000 and 30 s
      at 330 000, where it would consume the whole cadence. Before this change
      the one-shot path wrote two lease records per run. The resident daemon's
      renewal helper uses the same record family. I did not measure beyond
      3000 records; the larger figures are a linear extrapolation.
    suggestion: >-
      Not blocking this change: the fix is a state-store decision outside its
      fences (no new record kind, no schema change). Record a follow-up work
      item to compact or segment the lease history, and note the growth in the
      operations guide.
