    # TC ownership: TC-PEAK-016, TC-PEAK-018, TC-PEAK-019, TC-PEAK-020.
    # Never kills: the command issues one stop request and sends no signal of
    # its own; the delivered terminate path stays the only signalling route
    # (TERM before KILL, KILL only after the declared grace and only over a
    # target still listed, an unknown session is success).
    # Its record is the complete watcher-shaped episode frame (DEC-7). The
    # release grammar's minimal frame and its park-edge-only projection are
    # untouched.
    # A lane that is not running is refused before any write (DEC-8): no park,
    # episode, attempt, lane, or queue record is appended and no error-table
    # row is added.
    # `stop` is an operator command of the family, not a fifth read query: it
    # does not join DISPATCH_OPERATOR_QUERIES or the four-query pins. The
    # setting governs automatic policy only, so the command is identical
    # whether or not pausing is enabled (DEC-10).
