  - id: 6
    title: "Cross-cutting proof: determinism, hermeticity, and vocabulary economy"
    kind: delivery
    summary: "prove the assembled surface: paired identical runs are byte-identical over the injected clock, delay, transport, and lease clock apart from the one intended mode value, with no real sleep, network call, or credential read; the delivering suites are hermetic under armed canaries and a source scan, with the wait's wake count bounded by `elapsed / min(lane.liveness-interval, queue.lease-ttl / 2) + 1`; and the closed vocabularies hold with zero added kinds or identities while every episode frame stays inside the delivered bounds, consecutive episodes for overlapping windows included, with no union frame and no frame of its own for a recovered standing park."
    # Scope: spec AC-F1-3, NFR-5, NFR-7, NFR-8, DEC-11, DEC-20; test plan
    # RSK-TP-1, RSK-TP-2 and section 4 (the Check and Structure layers).
    # TC ownership: TC-PEAK-003, TC-PEAK-026, TC-PEAK-027.
    # This phase proves the assembled surface, so it lands after the last code
    # phase: the determinism suite spans the full park, wait, resume, and
    # result and asserts the mode carve-out as exactly one named field; the
    # hermetic watched-file set covers the new modules, the lease renewal, and
    # the new suites; the vocabulary suites project the episode frames and
    # assert the closed sets unchanged. Overlapping windows project consecutive
    # episodes, each with one `stop`, one `parked`, and one `park-edge`, with
    # no union frame and no shared episode id (DEC-20). A standing park closed
    # before a new episode is the delivered recovery record with its
    # `park-auto-recovery` incident, so it adds no event or record kind. No
    # pre-session frame exists (NG-10).
    # Wake bound (NFR-7, DEC-11): the wait's wake count is asserted over the
    # injected clock as at most
    # `elapsed / min(lane.liveness-interval, queue.lease-ttl / 2) + 1`, and a
    # renewal wake on the derived renewal cadence is counted as a renewal, not
    # as an extra observation.
    # Conditional files, declared so they can be staged if created:
    #   - tests/checks/dispatch-peak-hermetic.test.ts, only if the watched-file
    #     set outgrows tests/checks/peak-pause-hermetic.test.ts.
    #   - tests/structure/dispatch-peak-contract.test.ts, only if the additive
    #     contract needs its own closed-set assertion.
    # The two release suites of phase 1 are re-run here as read-only controls.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-peak-determinism.test.ts tests/checks/peak-pause-hermetic.test.ts tests/structure/event-taxonomy-integrity.test.ts tests/checks/event-taxonomy-conformance.test.ts
    # Verify, read-only controls (never edited): tests/checks/privacy-release.test.ts
    # and tests/structure/changeset-additivity.test.ts.
    scope:
      files:
        - tests/behaviour/dispatch-peak-determinism.test.ts
        - tests/checks/dispatch-peak-hermetic.test.ts
        - tests/checks/event-taxonomy-conformance.test.ts
        - tests/checks/peak-pause-hermetic.test.ts
        - tests/structure/dispatch-peak-contract.test.ts
        - tests/structure/event-taxonomy-integrity.test.ts

  - id: 7
    title: "Decision records TDR-0077 and TDR-0078: the dispatch-owned window watch and the lease heartbeat"
    kind: delivery
    summary: "stage the two technical decision records as Proposed with their index rows: TDR-0077 (the dispatch-owned window watch contract) and TDR-0078 (the lease-heartbeat amendment to the delivered no-renewal rule, DEC-13); both are authored by the decision advisor, and the owner accepts or rejects them at pull-request review."
    # Scope: spec section 15 and section 18.1 item 5; the next two free
    # technical decision ids on `main-tools`.
    # Both records are authored by the decision advisor as Proposed with a
    # null decision date. Their content is the decision advisor's: this plan
    # declares only the files and their index rows, so the delivery commit
    # stages them. Each index row is written with its record.
    # The index is a tracked file and the commit primitive stages every tracked
    # edit, so phase 1 declares the index with both records: no commit carries
    # an index row that points at an untracked record. Phase 2 declares
    # TDR-0078 because that phase changes the rule it amends. This phase is
    # the plan's decision-records phase the spec names for the authoring: it
    # stages whatever remains and owns no test case.
    # Owner acceptance happens at the pull-request review, outside Done: a
    # record still Proposed at Done does not fail it, a missing record does.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/checks/decision-record.test.ts tests/checks/doc-conformance.test.ts
    scope:
