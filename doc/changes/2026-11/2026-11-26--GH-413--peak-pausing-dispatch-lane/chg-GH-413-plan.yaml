  - id: 3
    title: "Dispatch-owned window watch, exactly-once park episode, in-invocation wait, and classification-routed resume"
    kind: delivery
    summary: "give the one-shot dispatch run path its own life-long profile-window watch: the nominated profile's declared `peakWindows` rules, read from the nomination stored on every `active` lane record the invocation appends, decide through the delivered decision functions and the injected clock at every observation; an open window issues one terminate call whose `graceMs` is the smallest of the profile grace, the delivered kill grace, and the time to the first open window's effective end, parks the lane exactly once with the complete episode frame, and the same invocation waits on the delivered liveness cadence and resumes at that end by the preservation classification; a non-terminal recovery refusal returns one classified result naming the refusal and the park end and releases the lease instead of waiting; the watch is bound in the production composition unless the setting disables pausing."
