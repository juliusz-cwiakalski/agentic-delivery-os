  - id: 4
    title: "Operator surfaces and the one result: the `dispatch status` park fact and the paused-and-resumed summary"
    kind: delivery
    summary: "carry the episode to the operator and to the answer: `dispatch status` gains the additive optional park fact (cause, park end, recorded stop instant, and preservation classification) from at most one additional bounded park-record read, plus the terminal exhaustion from the terminal lane record that the bounded lane read already carries, while the delivered `stale` and `delivering` derivation stays unchanged for a parked lane; `lanes` and `board` render the dispatch-owned park and the live `leaseHolder` through the delivered projections; the `lanes` machine read derives `peakEnforcement.mode` from the production composition's own effective configuration and the harness's terminate capability, `window-watch` only when a watch is composed, the one intended change to a no-park payload; and one invocation returns exactly one result whose summary states the pause and the resume for a resumed episode, names the exhaustion and the park end when the recovery exhausted its budget, or names the lost lease and the park end when the invocation lost the lease, with the additive bounded episode fact in its machine envelope."
    # Scope: spec F-6, F-7, F-12, DEC-6, DEC-9, DEC-13, DM-3, DM-4,
    # DM-5, DM-7, NFR-3, NFR-9, RSK-11; section 10; DoR iteration-1 findings
    # 3 and 6, iteration-2 finding 4, and the PM's review iteration-2
    # decisions (DEC-18 is withdrawn).
    # TC ownership: TC-PEAK-011, TC-PEAK-012, TC-PEAK-013, TC-PEAK-014,
    # TC-PEAK-023, TC-PEAK-024, TC-PEAK-033.
    # The delivered verdict is unchanged (DEC-9): `stale` is true exactly when
    # the owner probe is `dead` and `delivering` is its negation. A parked lane
    # answers that pair by probe (live and unknown: `stale: false` and
    # `delivering: true`; dead: `stale: true` and `delivering: false`), and the
    # additive park fact explains the pause or the orphaned park (TC-PEAK-011,
    # AC-F6-5). No derivation is redefined and no signal is suppressed.
    # One intended change (DEC-6, NFR-9): with no park open every delivered
    # field and line is byte-identical except `peakEnforcement.mode`, which
    # reads `window-watch` on a production composition with pausing enabled
    # and keeps `iteration-start-gating` when disabled or when no watch is
    # composed: a harness that declares no terminate operation composes no
    # watch and reads `iteration-start-gating` even with pausing enabled
    # (F-6, F-8, DEC-6; delivered by phase 10). The mode input is the
    # reading composition's own effective configuration
    # (`lane.disable-peak-pausing`) together with the selected harness's
    # terminate capability, set in packages/cli/src/production.ts and
    # read in packages/cli/src/edge.ts; it is never another process's state and
    # never the test-only `peakWatchComposed` override (TC-PEAK-033, with a
    # proven-firing control). The park and episode members are absent when no
    # park stands, never null.
    # The status chain: packages/core/src/contracts/dispatch-operator.ts (the
    # additive park fact on DispatchStatusData), packages/core/src/app/dispatch-lane-view.ts
    # (at most one additional bounded park-record read),
    # packages/core/src/domain/dispatch-operator-view.ts (the fact carried
    # verbatim), packages/cli/src/edge.ts (the operator runtime) and
    # packages/cli/src/output/dispatch-text.ts (the human line, absent when no
    # park stands).
    # The result chain: packages/core/src/contracts/dispatch.ts (the additive
    # bounded episode fact on DispatchEnvelopeData, including the terminal
    # exhaustion where the recovery exhausted its budget, DM-4),
    # packages/core/src/app/dispatch.ts and
    # packages/core/src/app/dispatch-peak-pause.ts (the summary statement rides
    # `last_message`; the four text keys are unchanged and no episode invents
    # a token). A resumed episode's summary states the pause and the resume; a
    # recovery that exhausted its budget has a summary naming the exhaustion
    # and the park end instead of claiming a pause and a resume (DM-5); an
    # invocation that lost the lease names the lost lease and the park end
    # (F-7). The terminal exhaustion is also what `dispatch status` reads,
    # from the terminal lane record the bounded lane read already carries and
    # never from the park record (DM-2, DM-3, TC-PEAK-011, TC-PEAK-014;
    # DEC-18 is withdrawn, so no non-terminal refusal fact exists).
    # The index files are declared for the exports these additions name. The
    # enabled and disabled arms run through the real production composer, so
    # its configuration documents extend
    # tests/fixtures/queue/production/harness.ts.
    # Composed unchanged and outside every scope: the `lanes`, `board`,
    # `brief`, and spend read sides (domain/queue-lanes.ts,
    # domain/owner-gate-sla.ts, domain/brief.ts, domain/status.ts,
    # domain/spend.ts). `parked:peak-window` with the recorded `until` and the
    # delivered `leaseHolder` from the live lease render as delivered
    # (TC-PEAK-012).
    # Goldens: the pre-change no-park goldens under tests/golden and the
    # surface fixture folders are read as read-only pins and none is
    # regenerated (RSK-TP-6). The three mode goldens (under
    # tests/fixtures/queue/golden and tests/fixtures/supervise/golden) are
    # rendered from a fixture composition and keep their value. tests/golden
    # is deliberately outside every scope, so any golden edit is staged with
    # its drift disclosed rather than silently; TC-PEAK-013 asserts the
    # carve-out as one named field through the production composition and
    # regenerates nothing.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-status-park.test.ts tests/behaviour/dispatch-peak-surfaces.test.ts tests/behaviour/dispatch-peak-byte-identical.test.ts tests/behaviour/dispatch-peak-result.test.ts tests/behaviour/dispatch-peak-spend.test.ts tests/behaviour/dispatch-peak-mode.test.ts
    # Verify, read-only controls (never edited): tests/behaviour/dispatch-additive-stability.test.ts,
    # tests/behaviour/status-brief-park-fields.test.ts,
    # tests/behaviour/lanes-parked-stall.test.ts, tests/behaviour/board-parked.test.ts,
    # tests/behaviour/spend-zero-window.test.ts,
    # tests/behaviour/daemon-absent-degradation.test.ts, and the tests/golden
    # suites.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/port-contract-inventory.test.ts tests/structure/content-inventory.test.ts
    scope:
