  - id: 2
    title: "Lease liveness: the lane keeps its repository lease live through the run and the park"
    kind: delivery
    summary: "keep the lane's repository lease live for the whole run and the whole park: the holding invocation renews it at most once per renewal cadence of `min(lane.liveness-interval, queue.lease-ttl / 2)` through the delivered renewal path and the existing lease record, as a no-op unless the lease is the lease identity this lane acquired at admission (its lease id, not merely the same holder and reference) and without passing the owner-hold gate, so per-ref single-flight holds before, at, and after each lease TTL boundary even when the liveness interval is at or above the TTL, a second dispatch of the work item is refused `queue.single-flight` with the live holder, and a parked lane under an owner hold keeps renewing; a renewal failure is retried at the next cadence and surfaced as lease evidence, and the amendment to the delivered no-renewal rule is TDR-0078."
    # Scope: spec F-5, DEC-11, DEC-13, DM-9, NFR-7, NFR-10, Appendix D; flows 1
    # and 5; DoR iteration-1 finding 2 and iteration-2 finding 3; pm-notes
    # DoR iteration-2 decision 15.
    # TC ownership: TC-PEAK-010 (the running-lane lease arms: AC-F5-2, NFR-10,
    # DM-9). A running lane, no park yet, crosses several TTL boundaries on
    # the injected lease clock, and at each boundary a second dispatch is
    # refused `queue.single-flight` with the live holder just before, exactly
    # at, and just after it, with no takeover. Four arms ride the same suite:
    #   - interval-above-TTL: `lane.liveness-interval` at or above the TTL, so
    #     the renewal cadence is `queue.lease-ttl / 2` and no heartbeat gap
    #     reaches the TTL;
    #   - lease-identity no-op (the test plan's same-ref no-op arm, keyed by
    #     lease id): the renewal never acquires an absent lease, takes over a
    #     stale one, or displaces another holder, and never renews a lease
    #     whose id is not the one this lane acquired at admission, so a
    #     re-dispatch cannot renew a previous invocation's stale lease under
    #     the same holder and reference;
    #   - owner hold: with an active hold the lane keeps renewing and the hold
    #     still parks nothing, because the renewal does not pass the
    #     owner-hold gate;
    #   - renewal failure: one renewal fails, the next cadence succeeds, and
    #     the failure is surfaced as bounded lease evidence.
    # The parked-interval half of the lease proof is phase 3's (TC-PEAK-037 and
    # TC-PEAK-021 observe the lease across the park).
    # Renewal cadence (DEC-13): `min(lane.liveness-interval, queue.lease-ttl / 2)`.
    # Both keys are resolved at the composition edge, so two independent
    # operator settings cannot produce a heartbeat gap at or above the TTL. The
    # delivered daemon renewal helper (one third of the TTL, in
    # packages/core/src/domain/queue-lease.ts) is a different cadence and is
    # not this one.
    # The delivered claim path, every link declared:
    # packages/core/src/app/queue.ts (the dispatch caller's renewal entry,
    # keyed by the lease id the admission claim returned, over the delivered
    # same-holder `renewed` arm; the admission claim keeps its no-renewal
    # refusal), packages/core/src/contracts/queue.ts (the lease contract the
    # renewal reads), packages/core/src/app/dispatch.ts (the run renews at the
    # renewal cadence and surfaces a failure as bounded lease evidence),
    # packages/cli/src/edge.ts (the closed DispatchComposition type and the
    # single runDispatch assembly forwarding), and packages/cli/src/production.ts
    # (the binding over the store, the fence token, the clock, and the two
    # resolved keys).
    # Reuse, never parallel (DEC-13): the renewal is the delivered `queue.lease`
    # record with operation `renewed`. No record kind, lease operation, claim
    # result, or second exclusion mechanism is added.
    # Pins: tests/structure/content-inventory.test.ts carries the export
