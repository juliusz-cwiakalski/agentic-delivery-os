  - id: 2
    title: "Lease liveness: the lane keeps its repository lease live through the run and the park"
    kind: delivery
    summary: "keep the lane's repository lease live for the whole run and the whole park: the holding invocation renews it at most once per renewal cadence of `min(lane.liveness-interval, queue.lease-ttl / 2)` through the delivered renewal path and the existing lease record, as a no-op unless the live lease's latest heartbeat is this invocation's own last write and without passing the owner-hold gate, so a second dispatch of the work item is refused `queue.single-flight` with the live holder before, at, and after each lease TTL boundary even when the liveness interval is at or above the TTL and a parked lane under an owner hold keeps renewing; a re-dispatch's newer heartbeat makes the earlier invocation's renewal `lease:not-owned`, an invocation that has lost the lease performs no owner act on the lane while its own session is live, observes until that session ends and then returns with `lease:not-owned` without abandoning it, and a parked lane's invocation returns one classified result with the park standing instead of resuming as owner, and a renewal failure is retried at the next cadence and surfaced as lease evidence; the amendment to the delivered no-renewal rule is TDR-0078."
    # Scope: spec F-5, DEC-11, DEC-13, DM-9, NFR-7, NFR-10, Appendix D; flows 1
