    # TC ownership: TC-PEAK-001, TC-PEAK-002, TC-PEAK-004, TC-PEAK-005,
    # TC-PEAK-006, TC-PEAK-007, TC-PEAK-008, TC-PEAK-009, TC-PEAK-015,
    # TC-PEAK-021, TC-PEAK-022, TC-PEAK-025, TC-PEAK-031, TC-PEAK-032,
    # TC-PEAK-037.
    # Binding chain, every link declared: packages/core/src/app/dispatch.ts (the
    # run path: the optional watch ports and the per-observation watch, from
    # the first session's acquisition to the terminal classification), the new
    # packages/core/src/app/dispatch-peak-pause.ts (the dispatch-owned watch,
    # composed-grace stop, exactly-once park, wait, and resume over the
    # delivered runPeakWatch and runPeakResume), packages/cli/src/edge.ts (the
    # closed DispatchComposition type and the single runDispatch assembly
    # forwarding), and packages/cli/src/production.ts (the binding: the
    # nominated profile's rule lookup, the zone facts, the stop seam over the
    # delivered terminate path, the park append; the resolved
    # `lane.disable-peak-pausing` of true composes no watch).
    # Already open at start (NG-10, RSK-12): the pre-session park is out of
    # scope. A dispatch admitted while its nominated profile's window is
    # already open spawns and is parked at its first observation, so at most
    # one observation cadence of billing precedes the park and no billable
    # call follows it. No pre-session representation, fixture, or test case
    # exists; TC-PEAK-015 asserts none.
    # Stored nomination (DEC-16, TC-PEAK-031): packages/core/src/contracts/dispatch.ts
    # gains the additive optional `providerProfile` on the durable lane
    # record, written on every `active` record the invocation appends (the
    # first acquisition and every restart or resume iteration), so a
    # latest-wins read always finds it. It is never fabricated; a pre-change
    # record reads absent and is not window-pausable. The lane-key pins move
    # with it, by exactly that one member: the field set and its optional
    # predicate in tests/structure/dispatch-contract.test.ts, and LANE_KEYS in
    # tests/fixtures/dispatch/operator/contract-baseline.ts. The attempt
    # record's key set does not move.
    # First open window (DEC-20, TC-PEAK-006): the park's `until` is the
    # delivered first open window's effective end. Where the nominated
    # profile's windows overlap in effect, the lane resumes at the first
    # window's end and is parked again at the next observation as a separate,
    # exactly-once episode. No union is computed; the decision layer stays
    # outside every scope.
    # Composed grace (DEC-5, TC-PEAK-032): one terminate call carries `graceMs`
    # equal to the smallest of the remaining profile grace deadline, the
    # delivered kill grace, and the time to the effective window end. The
    # harness terminate input is composed, not changed.
    # Observation-to-park bound (DEC-17, TC-PEAK-007): the record proves that
    # the park instant is no later than the window-open observation plus the
    # applied grace, with the observation taken as `graceDeadline` minus the
    # profile grace; the stop-request instant is measured at the stop seam by
    # the tests, because the record's stop instant is stamped when the stop
    # resolves. No lag field is added.
    # Non-terminal recovery refusal (DEC-18, TC-PEAK-009): when the
    # not-preserved recovery refuses without being terminal, the invocation
    # returns one classified result (the delivered derivation over the same
    # truth, its summary naming the refusal and the park end), the lane stays
    # parked, no ordinal is consumed, and the lease is released on return so
    # the delivered operator resume path can take the ref. No waiting
    # invocation remains and no frame is added.
    # Owner hold (F-11, TC-PEAK-021): an active hold changes nothing about the
    # watch; the lane still parks `peak-window` with `until` and its lease
    # keeps renewing at the derived cadence while the hold is active.
    # Nothing lost (TC-PEAK-037, AC-F5-1): a complete park and resume leaves
    # the branch, the change folder, the recorded phases, and the queue state
    # unchanged, reuses the recorded worktree and the same session, and keeps
    # the same lease record live at the derived cadence. The TTL-crossing
    # lease arms are phase 2's TC-PEAK-010.
    # Timing seams (DEC-11): the wait rides the delivered liveness cadence over
    # the cancellable DispatchCadenceWait seam, renews the lease at most once
    # per renewal cadence (`min(lane.liveness-interval, queue.lease-ttl / 2)`)
    # and never more than once per wake, and re-derives the end from the
    # injected clock at each wake. A DISPATCH_DELAY_REASONS member in
    # packages/core/src/contracts/dispatch.ts and its closed-set pin in
    # tests/structure/dispatch-contract.test.ts move ONLY IF the wait needs an
    # additive reason. No second timing mechanism is introduced.
    # New-module surfaces, moved in this same commit: the new module joins
