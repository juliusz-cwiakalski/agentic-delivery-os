  - id: 2
    title: "Lease liveness: the lane keeps its repository lease live through the run and the park"
    kind: delivery
    summary: "keep the lane's repository lease live for the whole run and the whole park: the holding invocation renews it at most once per renewal cadence of `min(lane.liveness-interval, queue.lease-ttl / 2)` through the delivered renewal path and the existing lease record, as a no-op unless the live lease's latest heartbeat is this invocation's own last write and without passing the owner-hold gate, so a second dispatch of the work item is refused `queue.single-flight` with the live holder before, at, and after each lease TTL boundary even when the liveness interval is at or above the TTL and a parked lane under an owner hold keeps renewing; a re-dispatch's newer heartbeat makes the earlier invocation's renewal `lease:not-owned`, an invocation that has lost the lease returns one classified result instead of resuming as owner, and a renewal failure is retried at the next cadence and surfaced as lease evidence; the amendment to the delivered no-renewal rule is TDR-0078."
    # Scope: spec F-5, DEC-11, DEC-13, DM-9, NFR-7, NFR-10, Appendix D; flows 1
    # and 5; DoR iteration-1 finding 2, iteration-2 finding 3, and iteration-3
    # findings 2 and 4.
    # TC ownership: TC-PEAK-010 (the running-lane lease arms: AC-F5-2, NFR-10,
    # DM-9). A running lane, no park yet, crosses several TTL boundaries on
    # the injected lease clock, and at each boundary a second dispatch is
    # refused `queue.single-flight` with the live holder just before, exactly
    # at, and just after it, with no takeover while the owner renews. Five
    # arms ride the same suite:
    #   - interval-above-TTL: `lane.liveness-interval` at or above the TTL, so
    #     the renewal cadence is `queue.lease-ttl / 2` and no heartbeat gap
    #     reaches the TTL;
    #   - heartbeat-ownership no-op: the live lease's latest heartbeat is not
    #     the invocation's own last write (another writer, an absent lease,
    #     another holder, or a stale lease), so the renewal appends nothing,
    #     extends nothing, surfaces `lease:not-owned`, and never acquires,
    #     takes over, or displaces;
    #   - re-dispatch and lost lease: a second invocation takes over a stale
    #     lease through the delivered `renewed` arm, which preserves the lease
    #     id and the acquisition instant while appending a newer heartbeat;
    #     the first invocation's next renewal is therefore `lease:not-owned`,
    #     appends and extends nothing, leaves the successor's lease untouched
    #     (neither released nor renewed), and that invocation returns one
    #     classified result with the park standing instead of resuming as
    #     owner;
    #   - owner hold: with an active hold the lane keeps renewing and the hold
    #     still parks nothing, because the renewal does not pass the
    #     owner-hold gate;
    #   - renewal failure: one renewal fails, the next cadence succeeds, and
    #     the failure is surfaced as bounded lease evidence.
    # The parked-interval half of the lease proof is phase 3's (TC-PEAK-037 and
    # TC-PEAK-021 observe the lease across the park).
    # Renewal cadence (DEC-13): `min(lane.liveness-interval, queue.lease-ttl / 2)`.
    # Both keys are resolved at the composition edge, so two independent
    # operator settings cannot produce a heartbeat gap at or above the TTL. The
    # delivered daemon renewal helper (one third of the TTL, in
    # packages/core/src/domain/queue-lease.ts) is a different cadence and is
    # not this one. The wait's wake bound is stated on this cadence (phase 3):
    # a renewal wake may fall between observations.
    # Heartbeat ownership key (DEC-13): the holder, the reference, and the
    # lease identity do not identify an invocation, because the delivered
    # `renewed` arm preserves the lease id across a re-dispatch. The invocation
    # remembers the heartbeat instant it last wrote and compares it with the
    # live lease's latest heartbeat; the delivered `renewed` arm is unchanged.
    # An invocation that no longer holds the lease must not resume or continue
    # as owner: it returns one classified result with the park standing, and
    # it neither renews nor releases the successor's lease (the delivered
    # release matches on holder, and both invocations share the dispatch
    # holder).
    # Renewals ride bounded waits (DEC-11, NFR-7): the lane renews at each
    # wake, at most once per renewal cadence, and a bounded tracker or claim
    # wait is not renewed.
    # The delivered claim path, every link declared:
    # packages/core/src/app/queue.ts (the dispatch caller's renewal entry over
    # the delivered same-holder `renewed` arm; the admission claim keeps its
    # no-renewal refusal), packages/core/src/contracts/queue.ts (the lease
    # contract the renewal reads and writes), packages/core/src/app/dispatch.ts
    # (the run remembers its last heartbeat write, renews at the renewal
    # cadence, surfaces `lease:not-owned` and a renewal failure as bounded
    # lease evidence, and returns instead of continuing once the lease is
    # lost), packages/cli/src/edge.ts (the closed DispatchComposition type and
    # the single runDispatch assembly forwarding), and
    # packages/cli/src/production.ts (the binding over the store, the fence
    # token, the clock, and the two resolved keys).
    # Reuse, never parallel (DEC-13): the renewal is the delivered `queue.lease`
    # record with operation `renewed`. No record kind, lease operation, claim
    # result, or second exclusion mechanism is added.
    # Pins: tests/structure/content-inventory.test.ts carries the export
    # allowance of the renewal entry; the two index files carry its exports.
    # Conditional, ONLY IF the named change happens:
    # tests/fixtures/ports/v1-contract-inventory.json when contracts/queue.ts
    # names a new export; tests/conformance/dispatch/dispatch-parity-admission.test.ts
    # and tests/fixtures/dispatch/parity/harness.ts when the parity battery's
    # lease-record counts move.
    # Fixtures: the lease fixtures (a live lease with renewal records, a lease
    # near its TTL, an interval-above-TTL configuration, the
    # heartbeat-ownership no-op, re-dispatch, lost-lease, and owner-hold arms,
    # and the second-dispatch admission probe) extend
    # tests/fixtures/queue/single-flight/harness.ts; the lease clock is the
    # store harness's injected clock.
    # Decision record: spec section 18 records the amendment as TDR-0078,
    # authored in the plan's decision-records phase (phase 7). The record and
    # its index row are declared here because this phase changes the rule the
    # record amends, so a record already written when this phase commits is
    # never an unstageable stray. Phase 1 declares the index with both records
    # so no commit carries an index row that points at an untracked record;
    # phase 7 stages whatever remains.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-lease-liveness.test.ts
    # Verify arms: the suite carries the TTL-crossing, interval-above-TTL,
    # heartbeat-ownership no-op, re-dispatch and lost-lease, owner-hold, and
    # renewal-failure arms.
    # Verify, read-only controls (never edited): the admission claim still
    # never renews or takes over a live lease
    # (tests/behaviour/dispatch-single-flight.test.ts); the delivered lease
    # suites tests/behaviour/queue-claim-single-flight.test.ts,
    # tests/behaviour/queue-lease.test.ts,
    # tests/behaviour/queue-lease-renewal-narrowing.test.ts,
    # tests/behaviour/queue-lease-takeover.test.ts,
    # tests/behaviour/queue-single-flight-purity.test.ts,
    # tests/behaviour/queue-single-flight-read-cost.test.ts, and
    # tests/behaviour/dispatch-harness-lease.test.ts; no new record kind
    # (tests/structure/queue-additivity.test.ts,
    # tests/structure/queue-surface.test.ts,
    # tests/structure/queue-scheduling-contract.test.ts,
    # tests/structure/event-additivity-inventory.test.ts).
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/content-inventory.test.ts tests/structure/port-contract-inventory.test.ts tests/checks/decision-record.test.ts
    scope:
      files:
        - doc/decisions/00-index.md
