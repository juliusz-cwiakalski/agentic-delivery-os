# ---------------------------------------------------------------------------
# GH-413: M4-S42: Peak pausing for a lane started by dispatch: it stops at the
# window's start and resumes at the window's end
#
# Plan revision v1.3.
#
# Sources, read in full before this plan was authored (the single source of
# truth for every phase, test case, and path below):
#   chg-GH-413-spec.md (v1.3) and chg-GH-413-test-plan.md (v1.4), this folder;
#   chg-GH-413-pm-notes.yaml, whose DoR remediation decisions bind the plan;
#   readiness-review/readiness-iter-1.md, readiness-iter-2.md,
#   readiness-iter-3.md and readiness-iter-4.md, whose plan-routed findings
#   are addressed below (iteration 4 is the parked hand-back record).
#
# Phase order follows the spec's delivery order (section 18) with one plan-level
# placement: the lease-liveness phase (2) precedes the watch phase (3), so the
# watch inherits a live lease. The remaining order is the spec's: the watch
# with the standing-park recovery and the episode, the surfaces and the mode
# rule, the operator command; then the cross-cutting proof, the decision
# records, and the release and spec-reconciliation declaration.
#
# Test plan alignment: the plan is the authority for phase numbering. The test
# plan's scenario index and mapping table follow these eight phases, and every
# one of the 37 test cases is owned by exactly one phase below.
#
# Declaration discipline
#   - The commit primitive stages an untracked (new) file only inside the
#     declared scope, so every new file is declared by exact path in the phase
#     that creates it. A tracked file edited outside the declared scope is
#     still staged, with its drift disclosed. Read-only pins (the no-park
#     goldens, the delivered daemon suites) are therefore deliberately left
#     outside every scope: an edit to one is disclosed, never silent.
#   - A pinned surface moves in the same commit as the code it pins: the
#     source file inventory, the per-file export allowances, the two-way
#     contracts inventory, the no-shell dispatch surface, and the help-entry
#     counts. Each is declared beside that code with its authorising clause.
#   - A file whose edit is conditional says so in the comment beside it.
#
# Fences binding every phase (spec sections 4.2, 7.2, 8.5, 12, 15, 18)
#   - Owner delivery note 4: delivery never searches the file system outside
#     the checkout and the change folder. Every fact, fixture, and command is
#     reachable from those two roots.
#   - NG-1: the resident daemon's supervision cycle, watch, park, and resume
#     are not edited. packages/core/src/app/daemon-supervision.ts,
#     packages/core/src/app/supervise.ts, and packages/cli/src/daemon-compose.ts
#     are outside every scope.
#   - The delivered decision layer is composed, never re-derived or edited.
#     packages/core/src/domain/daemon-peak-pause.ts, queue-park.ts, spend.ts,
#     event-projection.ts, and packages/core/src/provider/peak.ts, peak-rules.ts
#     are outside every scope. The park end is the delivered first open
#     window's effective end; overlapping windows produce consecutive episodes
#     and no union is computed (DEC-20).
#   - One park per reference (F-3, NFR-2, AC-F3-4, RSK-14): the already-parked
#     rule is occupancy, so any standing `peak-window` park for the reference,
#     whatever its `until`, suppresses a new stop. The run path closes a
#     standing park through the delivered mutating park pass
#     (`recoverQueueParks`: the clear-observed marker, the recovered record,
#     and the `park-auto-recovery` incident) before its first stop decision
#     and at the first observation of a resuming invocation, and an
#     unrecoverable standing park refuses the run with no new episode. A
#     second active park for one reference, or a standing park not recovered
#     before a new stop decision, is a change defect: two active parks
#     permanently fail every park-reading surface, and the append-only history
#     cannot repair it.
#   - Lease liveness (DEC-11, DEC-13, NFR-7, NFR-10, DM-9, TDR-0078): the lane
#     keeps its lease live through the run and the park by the delivered
#     renewal path and the existing lease record, at the renewal cadence
#     `min(lane.liveness-interval, queue.lease-ttl / 2)`. The renewal is a
#     no-op unless the live lease's latest heartbeat is this invocation's own
#     last write, so a re-dispatch's newer heartbeat makes the earlier
#     invocation's renewal `lease:not-owned`. It never acquires, takes over,
#     or displaces a lease, it does not pass the owner-hold gate (a parked
#     lane under an owner hold keeps renewing), and it rides bounded waits (a
#     bounded tracker or claim wait is not renewed). An invocation that has
#     lost the lease returns one classified result instead of resuming or
#     continuing as owner, and neither renews nor releases the successor's
#     lease. A park longer than the TTL with no renewal is a change defect,
#     never a documented exposure. The admission claim keeps its delivered
#     refusal of a live same-ref lease, and no queue record kind, lease
#     operation, or claim result is added. The wait's wake bound is
#     `elapsed / min(lane.liveness-interval, queue.lease-ttl / 2) + 1`: a
#     renewal wake between observations is a renewal, not an extra observation.
#   - The mode is the only intended no-park change (DEC-6, NFR-9): with no park
#     open, `peakEnforcement.mode` on a production composition with pausing
#     enabled reads `window-watch`; every other delivered field and line is
#     byte-identical.
#   - `dispatch stop` (DEC-15, DEC-21): admits `peak-window` only and requires
#     `--until`; another cause or a missing end is the grammar refusal
#     `input.value.rejected` before any read, the missing end carrying the
#     delivered `until-required` reason (the reason is reused, not the
#     comparison). It never signals itself. A lane is running only when its
#     newest record is `active`, carries a session identity, and has no open
#     park of any cause, so an already-parked lane is the not-running refusal
#     and is never parked twice. The park is written only after a confirmed
#     terminate; an unconfirmed terminate is the same refusal and writes
#     nothing. The tree root is the recorded worktree path when the record
#     carries one and otherwise the repository's main checkout. The owning
#     invocation withholds terminal classification for at least the applied
#     grace plus one observation cadence after its collection resolves and
#     re-reads the park record.
#   - The lane record's nomination (DEC-16) is written on every `active` record
#     the invocation appends, only from the admission nomination, and is never
#     fabricated, defaulted, or inferred; a pre-change record is not
#     window-pausable.
#   - NG-6 and NFR-8: no new park cause, event kind, record kind, schema
#     identity, error identity, error-table row, result token, composition-fact
#     mode value, or second kill path. The refusals reuse the delivered
#     `queue.precondition.unmet`, `config.value.invalid`, and
#     `input.value.rejected` identities.
#   - NG-2 to NG-5, NG-7 to NG-9: no parallel lanes, no calendar-shaped window
#     policy, no resident mode, no shell-orchestrator change, no window read
#     surface, no change to provider-entry admission gating or the nomination
#     rule, and no provider-entry `peak` window in the lane watch.
#   - NG-10: no pre-session park. A dispatch admitted while its nominated
#     profile's window is already open spawns and is parked at the first
#     observation, so one observation cadence plus the applied grace of
#     billing precedes the park and no billable call follows the park instant
#     (spec section 7.2, RSK-12). The case is out of scope with that declared
#     residual; no pre-session representation, fixture, or test case exists.
#   - The aggregate gate (`pnpm check`, run once with TMPDIR=$PWD/tmp/tmpdir)
#     belongs to the lifecycle quality_gates phase, not to a plan phase. A plan
#     phase runs only its affected suites.
# ---------------------------------------------------------------------------
