  - id: 5
    title: "`dispatch stop`: family grammar, runtime, never-kill stop, and the classified not-running refusal"
    kind: delivery
    summary: "add `dispatch stop` to the dispatch command family for the `peak-window` cause only, with a required end: the command resolves the run from the durable lane record, issues one terminate call through the delivered terminate path with the composed `graceMs` and no signal of its own, writes the complete watcher-shaped episode frame, and answers one human line and machine data at exit 0; the owning invocation re-reads the records at each observation, recognises the open park it did not create, keeps renewing the lease, and waits and resumes; another cause, a missing end, and a lane that is not running are refused by name before any write, and a request racing a session end resolves exactly one classified outcome; help, the reference page, and the pinned entry counts move in the same commit."
    # Scope: spec F-9, F-10, DEC-7, DEC-8, DEC-10, DEC-15, DM-8, NFR-1, NFR-2,
    # NFR-8, RSK-7; flow 3; DoR iteration-1 finding 4.
    # TC ownership: TC-PEAK-016, TC-PEAK-018, TC-PEAK-019, TC-PEAK-020,
    # TC-PEAK-034, TC-PEAK-035, TC-PEAK-036.
    # One cause, one end: `dispatch stop` admits `peak-window` only and
    # requires `--until`, as the delivered expiry-carrying cause does. Another
    # cause, or a missing end, is refused by name before any lane read
    # (TC-PEAK-034): the delivered projection and resume path frame only the
    # `peak-window` cause, so no other cause is promised.
    # Never kills: the command sends no signal of its own and issues exactly
    # one terminate call through the delivered terminate path, with the
    # composed `graceMs` of phase 3 (TC-PEAK-019). TERM before KILL, KILL only
    # over a still-listed target, and an unknown session as success all hold.
    # The hand-off is the record, not a control channel (DEC-15): the command
    # resolves the run from the durable lane record (session identity,
    # recorded worktree path, stored nomination), writes the complete
    # watcher-shaped episode frame, and answers one human line and machine
    # data at exit 0 (DM-8, TC-PEAK-035). The owning invocation re-reads the
    # lane and park records at each observation, recognises the open park it
    # did not create, keeps renewing the lease, and waits and resumes instead
    # of classifying and returning (packages/core/src/app/dispatch.ts and
    # packages/core/src/app/dispatch-peak-pause.ts). A request racing a
    # session end resolves exactly one classified outcome (TC-PEAK-036). The
    # release grammar's minimal frame and its park-edge-only projection are
    # untouched (DEC-7).
    # Not running (F-10): a terminal record, an absent record, or an active
    # record with no session identity refuses before any write with the
    # delivered `queue.precondition.unmet` identity (DEC-8); no park,
    # episode, attempt, lane, or queue record is appended and no error-table
    # row is added.
    # The delivered terminate path must reach a session of another process
    # (finding 4): packages/adapters/src/harness/opencode.ts resolves a
    # terminate target only from its own in-memory session registry and
    # answers a session it does not hold with success and no signal, so a
    # separately invoked command could not stop the owning invocation's
    # session. The adapter gains the delivered exact-identity match (the
    # session id or its deterministic work item title over the host process
    # table) for a handle resolved from the durable lane record; a session
    # matching no live exact identity stays success with no signal (TDR-0051).
    # The real-adapter arm lands in
    # tests/behaviour/harness-opencode-resume-stream.test.ts.
    # packages/core/src/contracts/harness.ts is in scope ONLY IF the terminate
    # input needs an additive optional member to mark such a handle; then its
    # inventory pin moves in this same commit.
    # `stop` is an operator command of the family, not a fifth read query: it
    # does not join DISPATCH_OPERATOR_QUERIES or the four-query pins. The
    # setting governs automatic policy only, so the command is identical
    # whether or not pausing is enabled (DEC-10, TC-PEAK-016).
    # Doc obligations `pnpm check` depends on land here, not in the
    # documentation phase: the help entry in packages/cli/src/help.ts and the
    # reference page, whose pinned phrases are preserved
    # (tests/checks/dispatch-doc-conformance.test.ts is re-run, never edited).
    # The dispatch help-entry count moves from nine to ten in the three pinned
    # suites: tests/structure/dispatch-help-inventory.test.ts,
    # tests/structure/dispatch-attempts-composition.test.ts, and
    # tests/checks/reference-page-parity.test.ts.
    # Fixtures: the stop hand-off and race fixture (a separately invoked stop
    # command and the owning invocation over one durable store, with a
    # deterministic clock) extends tests/fixtures/dispatch/golden/harness.ts,
    # and the terminate-path model and doubles extend
    # tests/fixtures/dispatch/parity/terminate.ts; no other fixture location
    # is in scope.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-stop.test.ts tests/behaviour/dispatch-stop-cause.test.ts tests/behaviour/dispatch-stop-handoff.test.ts tests/behaviour/dispatch-stop-race.test.ts tests/behaviour/dispatch-stop-refusal.test.ts tests/behaviour/dispatch-stop-safety.test.ts tests/behaviour/dispatch-peak-setting.test.ts tests/behaviour/harness-opencode-resume-stream.test.ts
    # Verify, read-only controls (never edited): tests/structure/dispatch-composition.test.ts
    # and tests/conformance/dispatch/dispatch-parity-stall-loop.test.ts.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/dispatch-help-inventory.test.ts tests/structure/dispatch-attempts-composition.test.ts tests/checks/reference-page-parity.test.ts tests/checks/dispatch-doc-conformance.test.ts tests/checks/help-guide-coverage.test.ts tests/checks/operator-contract-invariance.test.ts tests/structure/port-contract-inventory.test.ts tests/structure/content-inventory.test.ts tests/checks/no-shell-dispatch.test.ts
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/no-shell-dispatch.ts
    scope:
      files:
        - doc/planning/oss-tooling/milestones/m1/commands/dispatch.md
        - packages/adapters/src/harness/opencode.ts
        - packages/cli/src/commands/dispatch.ts
        - packages/cli/src/edge.ts
        - packages/cli/src/help.ts
        - packages/cli/src/output/dispatch-text.ts
        - packages/cli/src/production.ts
        - packages/core/src/app/dispatch-peak-pause.ts
        - packages/core/src/app/dispatch-stop.ts
        - packages/core/src/app/dispatch.ts
        - packages/core/src/app/index.ts
        - packages/core/src/contracts/dispatch-operator.ts
        - packages/core/src/contracts/harness.ts
        - packages/core/src/contracts/index.ts
        - packages/core/src/index.ts
        - scripts/checks/no-shell-dispatch.ts
        - tests/behaviour/dispatch-stop-cause.test.ts
        - tests/behaviour/dispatch-stop-handoff.test.ts
        - tests/behaviour/dispatch-stop-race.test.ts
        - tests/behaviour/dispatch-stop-refusal.test.ts
        - tests/behaviour/dispatch-stop-safety.test.ts
        - tests/behaviour/dispatch-stop.test.ts
        - tests/behaviour/harness-opencode-resume-stream.test.ts
        - tests/checks/reference-page-parity.test.ts
        - tests/fixtures/dispatch/golden/harness.ts
        - tests/fixtures/dispatch/parity/terminate.ts
        - tests/fixtures/ports/v1-contract-inventory.json
        - tests/structure/content-inventory.test.ts
        - tests/structure/dispatch-attempts-composition.test.ts
        - tests/structure/dispatch-help-inventory.test.ts
