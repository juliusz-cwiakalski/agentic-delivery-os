tier:
  name: full
  escalationTriggers:
    - "A second signal, kill, or termination route appears beside the delivered terminate path, or a stop is issued with more or fewer than one terminate request (NG-6, NFR-1, AC-F3-3, AC-F9-2, TC-PEAK-019): stop and report; never add a signal to the command path or to the engine."
    - "A new park cause, event kind, record kind, lease operation, claim result, schema identity, error identity, error-table row beyond the one owner-authorised `dispatch.resume-parked` (DEC-22), result token, reason token, or a third composition-fact mode value appears (NG-6, DEC-3, DEC-6, DEC-8, DEC-22, DEC-21, NFR-8, TC-PEAK-027): stop and report; vocabulary economy is a delivered discipline and the authorised row is exactly one."
    - "The dispatch composition is observed computing a window rule of its own, including a union of overlapping windows, instead of calling the delivered decision functions, or the parity fixture disagrees between the dispatch-owned watch and the daemon watch on the same profile and instant (AC-F1-1, DEC-20, RSK-8, RSK-TP-1, TC-PEAK-001): stop and report."
    - "A file on the resident daemon's supervision path or in the delivered decision layer needs an edit to go green (NG-1, F-1): stop and report; the watch composes the delivered decision functions and never changes them."
    - "The wait gains a timing mechanism of its own: a second cadence or configuration key, a wall-clock read, a real timer in the engine, or a pinned duration instead of the end re-derived from the injected clock at each wake (DEC-11, NFR-5, NFR-7, TC-PEAK-026): stop and report. The derived renewal cadence `min(lane.liveness-interval, queue.lease-ttl / 2)` is exempt from this trigger: a heartbeat between observations is a renewal, not an extra observation, and it adds no timing key."
    - "A no-park golden, a delivered daemon park or resume suite assertion, or the dispatch-additive-stability pins are modified beyond the one named `peakEnforcement.mode` value (AC-F6-3, NFR-9, RSK-TP-6): stop and report; the no-park pins are read-only and the carve-out is exactly one field."
    - "The full battery is started before the change's changeset exists, or any gate is reported green while a check was skipped, disabled, or made vacuous (TC-PEAK-028, owner delivery note 1, RSK-TP-5): stop; run the two release suites first and record what actually ran."
    - "The post-upgrade hand-off (TC-PEAK-029) is treated as a substitute for the automated fixtures, as a Done criterion, or as an episode this delivering lane must produce, or a red fixture is excused by a manual result (RSK-TP-4, RSK-TP-8, spec section 18.1 item 7): stop and report; the fixtures are the merge gate and the hand-off is a recorded obligation."
    - "The lane's lease heartbeat age reaches the lease TTL during a run or a park while the owner renews, the renewal cadence departs from `min(lane.liveness-interval, queue.lease-ttl / 2)`, a renewal appends to or extends a lease whose latest heartbeat is not the invocation's own last write, a re-dispatch's newer heartbeat fails to make the earlier invocation's renewal `lease:not-owned`, a renewal acquires, takes over, or displaces a lease, a renewal passes the owner-hold gate so a parked lane under a hold stops renewing, a renewal runs during a bounded tracker or claim wait, or an invocation that has lost the lease resumes, continues as owner, releases or renews the successor's lease, or appends a terminal lane record over the successor's active record, or the post-collection withhold renews once per liveness step instead of at the renewal cadence (NFR-7, NFR-10, AC-F5-2, DEC-13, RSK-10): stop and report; a park longer than the TTL with no renewal is a change defect."
    - "The admission claim is observed renewing or taking over a live same-ref lease, or a new queue record kind appears (TDR-0050, TDR-0078, DM-9, spec section 8.5): stop and report; only who renews and how often is added."
    - "A no-park field or line other than the one named `peakEnforcement.mode` value moves, or the mode is derived from a test-only watch override or from another process, or it reads `window-watch` for a composition that composes no watch (pausing disabled, or a harness that declares no terminate) (DEC-6, AC-F6-3, AC-F6-4, NFR-9, RSK-TP-10): stop and report."
    - "`dispatch stop` admits a cause other than `peak-window`, runs without `--until`, refuses the canonical ISO instant form or accepts a past or non-canonical end, answers its grammar refusals with an identity or reason other than `input.value.rejected` and the delivered `until-required`, or sends a signal of its own outside the delivered terminate path (DEC-15, DEC-21, AC-F9-2, AC-F9-3, NFR-1, NFR-8): stop and report."
    - "`dispatch stop` appends a park for a ref that already has an open park of any cause, writes a park before a confirmed terminate, answers success on an unconfirmed terminate, or the owning invocation classifies terminal at session end without its grace-plus-cadence park re-read (DEC-15, AC-F9-2, AC-F9-4, AC-F10-1, AC-F10-2, RSK-7, RSK-TP-13): stop and report."
    - "A dispatch admitted inside an already-open window of its nominated profile is not parked at its first observation, the billing before that park exceeds one observation cadence plus the applied grace, or any billable call follows the park instant (NG-10, RSK-12, spec section 7.2): stop and report; the pre-session park stays out of scope and its residual is bounded, never widened."
    - "A pre-session park, a pre-session representation, or a session-less park frame is reintroduced, or a lane record without a stored nomination is paused, re-nominated, or given a fabricated profile, or an `active` record the invocation appends lacks the nomination (NG-10, DEC-16, AC-F2-3, RSK-TP-12): stop and report."
    - "A budget-only recovery refuses for null economics or as `dispatch.state-unverified`, a budget exhaustion fails to append the delivered terminal exhaustion record or to raise the delivered typed question, a non-terminal recovery refusal, a parked-result arm, an episode refusal fact, or a lane-record refusal member is reintroduced, or an exhausted recovery leaves the invocation waiting or holding the lease instead of returning one classified result (NFR-4, AC-F4-2, AC-F4-3, DEC-18 withdrawn, TC-PEAK-009, TC-PEAK-014): stop and report."
    - "Delivery searches the file system outside the checkout and the change folder (owner delivery note 4, spec section 12): stop and report; every fact, fixture, and command is reachable from those two roots."
    - "A second active park is appended for one reference, an expired standing `peak-window` park is not recovered before a new stop decision or at the first observation of a resuming invocation, a resume or re-dispatch of a lane whose standing park has not expired starts a session, recovers or overrides that park, or is answered with any identity other than `dispatch.resume-parked` at exit 2 before any session, the already-parked rule is read as expiry rather than occupancy, or an expired park the pass cannot recover starts a new episode instead of refusing the run, the recovery pass runs after the first session has started instead of before it, so that its refusal spawns or resumes a session or appends a park, a terminate-after-session arm is reintroduced, or the refusal's bounded summary names no stuck reference (F-3, NFR-2, AC-F3-4, DEC-22, DEC-23, RSK-14, TC-PEAK-038): stop and report; two active parks permanently fail every park-reading surface and the append-only history cannot repair it."
    - "A `preserved` standing park closed by the pass stops projecting its `resumed` frame with an empty `sessionRef` and `branch` under the original episode id, the pass is narrowed, widened, or replaced instead of staying the delivered repository-wide one, or a stuck `clear-observed` marker is hidden, cleared by hand, or retried by the pass instead of being reported (F-3, AC-F3-4, RSK-14, TC-PEAK-038): stop and report; each is a declared consequence of reusing the delivered pass, and its absence or suppression is the same defect as a second active park."
