  - id: 5
    title: "`dispatch stop`: family grammar, runtime, never-kill stop, and the classified not-running refusal"
    kind: delivery
    summary: "add `dispatch stop` to the dispatch command family for the `peak-window` cause only, with a required end: another cause or a missing end is the grammar refusal `input.value.rejected` before any read, the missing end reusing the delivered `until-required` reason; the command resolves the newest lane record and refuses unless the lane is running (an `active` record with a session identity and no open `peak-window` park), issues one terminate call through the delivered terminate path with the composed `graceMs` and no signal of its own over the recorded worktree path or, for a path-less record, the main checkout, writes the complete watcher-shaped episode frame only after a confirmed terminate, and answers one human line and machine data at exit 0; an already-parked lane or an unconfirmed terminate is the not-running refusal and writes nothing; the owning invocation withholds terminal classification for at least the applied grace plus one observation cadence after its collection resolves, re-reads the park record, keeps renewing the lease, and waits and resumes; help, the reference page, and the pinned entry counts move in the same commit."
    # Scope: spec F-9, F-10, DEC-7, DEC-8, DEC-10, DEC-15, DEC-21, DM-8, NFR-1,
    # NFR-2, NFR-8, RSK-7; flow 3; DoR iteration-1 finding 4 and iteration-2
    # findings 1 and 9; pm-notes DoR iteration-2 decision 15.
    # TC ownership: TC-PEAK-016, TC-PEAK-018, TC-PEAK-019, TC-PEAK-020,
    # TC-PEAK-034, TC-PEAK-035, TC-PEAK-036.
    # Grammar (DEC-21, TC-PEAK-034): `dispatch stop` admits `peak-window` only
    # and requires `--until`, as the delivered expiry-carrying cause does.
    # Another cause, or a missing end, is refused `input.value.rejected` at
    # the grammar boundary before any lane read or write; the missing end
    # reuses the delivered `until-required` reason, so no identity, row, or
    # reason token is added. The delivered reason belongs to the release
    # grammar (packages/cli/src/commands/queue.ts, a module-local helper in a
    # module whose export surface is pinned exactly); the dispatch grammar
    # reproduces the reason under its own value refusal and does not widen
    # that surface.
    # Running predicate (F-10, TC-PEAK-020): a lane is running only when its
    # newest lane record is `active`, carries a session identity, and has no
    # open `peak-window` park standing for the ref. A terminal record, an
    # absent record, an active record with no session identity, and an
    # already-parked active record are the delivered unmet-precondition refusal
    # (`queue.precondition.unmet`, DEC-8), the summary naming the observed
    # state. The already-parked arm appends no second park: the delivered park
    # fold fails closed on two active parks for one ref.
    # Confirmed terminate (DEC-15, TC-PEAK-019): the command sends no signal
    # of its own and issues exactly one terminate call through the delivered
    # terminate path, with the composed `graceMs` of phase 3. TERM before KILL,
    # KILL only over a still-listed target. The park is written, and the
    # command answers, only after a confirmed terminate; a terminate that
    # matches no live exact identity is the not-running refusal and writes no
    # `stop`, `parked`, or `park-edge`. The terminate operation's own
    # idempotence on an unknown session stays its contract (TDR-0051), not
    # this command's licence to record an episode for a stop that never
    # happened.
    # Tree root: the recorded worktree path when the lane record carries one,
    # otherwise the resolved repository's main checkout, so the path-less
    # in-checkout shape of a `lane.disable-worktrees` lane is accepted.
    # The hand-off is the record, not a control channel (DEC-15): the command
    # resolves the session identity, the tree root, and the stored nomination
    # from the durable lane record and writes the complete watcher-shaped
    # episode frame (DM-8, TC-PEAK-035). The owning invocation withholds
    # terminal classification for at least the applied grace plus one
    # observation cadence after its collection resolves and re-reads the park
    # record. The withhold spans the grace because the command's terminate
    # call awaits the whole grace before it appends the park, so a one-cadence
    # re-read could miss it. When its ref's open `peak-window` park is there
    # the invocation keeps renewing the lease, waits, and resumes at the end
    # instead of classifying and returning (packages/core/src/app/dispatch.ts
    # and packages/core/src/app/dispatch-peak-pause.ts). A request racing a
    # session end resolves exactly one classified outcome across three
    # orderings, including the park-after-collection one (TC-PEAK-036). The
    # release grammar's minimal frame and its park-edge-only projection are
    # untouched (DEC-7).
    # The delivered terminate path must reach a session of another process
    # (finding 4 of iteration 1): packages/adapters/src/harness/opencode.ts
    # resolves a terminate target only from its own in-memory session registry
    # and answers a session it does not hold with success and no signal, so a
    # separately invoked command could not stop the owning invocation's
    # session. The adapter gains the delivered exact-identity match (the
    # session id or its deterministic work item title over the host process
    # table) for a handle resolved from the durable lane record, and reports
    # whether a live exact identity matched; a session matching none is
    # success with no signal (TDR-0051). The real-adapter arm lands in
    # tests/behaviour/harness-opencode-resume-stream.test.ts.
    # packages/core/src/contracts/harness.ts is in scope ONLY IF the terminate
    # input or its result needs an additive optional member to carry that
    # resolution or confirmation; then its inventory pin moves in this same
    # commit.
    # `stop` is an operator command of the family, not a fifth read query: it
    # does not join DISPATCH_OPERATOR_QUERIES or the four-query pins. The
    # setting governs automatic policy only, so the command is identical
    # whether or not pausing is enabled (DEC-10, TC-PEAK-016).
    # Doc obligations `pnpm check` depends on land here, not in the
    # documentation phase: the help entry in packages/cli/src/help.ts and the
    # reference page, whose pinned phrases are preserved
    # (tests/checks/dispatch-doc-conformance.test.ts is re-run, never edited).
    # The dispatch help-entry count moves from nine to ten in the three pinned
    # suites: tests/structure/dispatch-help-inventory.test.ts,
    # tests/structure/dispatch-attempts-composition.test.ts, and
    # tests/checks/reference-page-parity.test.ts.
    # Fixtures: the stop hand-off and race fixture (a separately invoked stop
    # command and the owning invocation over one durable store, with a
    # deterministic clock, an episode factory, and a stop seam that records
    # the stop-request instant) extends tests/fixtures/dispatch/golden/harness.ts,
    # and the terminate-path model and doubles extend
    # tests/fixtures/dispatch/parity/terminate.ts; no other fixture location
    # is in scope.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/behaviour/dispatch-stop.test.ts tests/behaviour/dispatch-stop-cause.test.ts tests/behaviour/dispatch-stop-handoff.test.ts tests/behaviour/dispatch-stop-race.test.ts tests/behaviour/dispatch-stop-refusal.test.ts tests/behaviour/dispatch-stop-safety.test.ts tests/behaviour/dispatch-peak-setting.test.ts tests/behaviour/harness-opencode-resume-stream.test.ts
    # Verify arms (iteration 2): the already-parked arm
    # (tests/behaviour/dispatch-stop-refusal.test.ts, no second park); the
    # unconfirmed-terminate arm (tests/behaviour/dispatch-stop-safety.test.ts
    # and tests/behaviour/dispatch-stop-refusal.test.ts, nothing written); the
    # park-after-collection arm (tests/behaviour/dispatch-stop-handoff.test.ts
    # and tests/behaviour/dispatch-stop-race.test.ts, the grace-plus-cadence
    # re-read takes the wait and resume path); the grammar refusals
    # (tests/behaviour/dispatch-stop-cause.test.ts, `input.value.rejected`
    # with the `until-required` reason for a missing end).
    # Verify, read-only controls (never edited): tests/structure/dispatch-composition.test.ts
    # and tests/conformance/dispatch/dispatch-parity-stall-loop.test.ts.
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun test tests/structure/dispatch-help-inventory.test.ts tests/structure/dispatch-attempts-composition.test.ts tests/checks/reference-page-parity.test.ts tests/checks/dispatch-doc-conformance.test.ts tests/checks/help-guide-coverage.test.ts tests/checks/operator-contract-invariance.test.ts tests/structure/port-contract-inventory.test.ts tests/structure/content-inventory.test.ts tests/checks/no-shell-dispatch.test.ts
    # Verify: TMPDIR=$PWD/tmp/tmpdir bun run scripts/checks/no-shell-dispatch.ts
    scope:
      files:
