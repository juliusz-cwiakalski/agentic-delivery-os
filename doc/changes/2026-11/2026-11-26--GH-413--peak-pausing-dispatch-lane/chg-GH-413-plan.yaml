  - id: 3
    title: "Dispatch-owned window watch, exactly-once park episode, in-invocation wait, and classification-routed resume"
    kind: delivery
    summary: "give the one-shot dispatch run path its own life-long profile-window watch: after an expired standing `peak-window` park for the reference has been closed through the delivered mutating park pass, a lane whose standing park has not expired being refused before any session starts and any remaining standing park treated as occupancy, the nominated profile's declared `peakWindows` rules, read from the nomination stored on every `active` lane record the invocation appends, decide through the delivered decision functions and the injected clock at every observation; an open window issues one terminate call whose `graceMs` is the smallest of the profile grace, the delivered kill grace, and the time to the first open window's effective end, parks the lane exactly once with the complete episode frame, and the same invocation waits on the delivered liveness cadence and resumes at that end by the preservation classification; budget exhaustion under the delivered budget-only admission appends the delivered terminal exhaustion record and raises the delivered typed question, and a lost lease returns one classified result instead of waiting or resuming as owner; the watch is bound in the production composition unless the setting disables pausing or the harness declares no terminate."
    # Scope: spec F-1 to F-5, F-8, F-11, DEC-2 to DEC-5, DEC-10, DEC-11,
    # DEC-13, DEC-16, DEC-17, DEC-20, DEC-22, DEC-23, DM-1, DM-2, NFR-1,
    # NFR-2, NFR-4, NFR-6, NFR-7, NFR-8; flows 1, 2, and 5; DoR iteration-1
    # findings 5, 7, and 8, iteration-2 findings 4, 5, 7, and 8,
    # iteration-3 findings 1 and 4, iteration-4 findings 1 and 4, and the
    # PM's review iteration-2 decisions (DEC-18 is withdrawn).
    # TC ownership: TC-PEAK-001, TC-PEAK-002, TC-PEAK-004, TC-PEAK-005,
    # TC-PEAK-006, TC-PEAK-007, TC-PEAK-008, TC-PEAK-009, TC-PEAK-015,
    # TC-PEAK-021, TC-PEAK-022, TC-PEAK-025, TC-PEAK-031, TC-PEAK-032,
    # TC-PEAK-037, TC-PEAK-038.
    # Binding chain, every link declared: packages/core/src/app/dispatch.ts (the
    # run path: the optional watch ports and the per-observation watch, from
    # the first session's acquisition to the terminal classification), the new
    # packages/core/src/app/dispatch-peak-pause.ts (the dispatch-owned watch,
    # composed-grace stop, exactly-once park, wait, and resume over the
    # delivered runPeakWatch and runPeakResume), packages/cli/src/edge.ts (the
    # closed DispatchComposition type, the composition's park-recovery call,
    # and the single runDispatch assembly forwarding), and
    # packages/cli/src/production.ts (the binding: the nominated profile's
