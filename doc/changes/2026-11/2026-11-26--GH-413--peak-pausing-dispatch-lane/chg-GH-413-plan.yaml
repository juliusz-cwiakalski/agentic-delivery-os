# ---------------------------------------------------------------------------
# GH-413: M4-S42: Peak pausing for a lane started by dispatch: it stops at the
# window's start and resumes at the window's end
#
# Sources, read in full before this plan was authored (the single source of
# truth for every phase, test case, and path below):
#   chg-GH-413-spec.md (v1.2) and chg-GH-413-test-plan.md (v1.2), this folder;
#   chg-GH-413-pm-notes.yaml, whose DoR remediation decisions bind the plan
#   (decision 15: the renewal is keyed by the lease identity acquired at
#   admission, and the post-collection withhold is at least the applied grace
#   plus one observation cadence);
#   readiness-review/readiness-iter-1.md and readiness-iter-2.md, whose
#   plan-routed findings are addressed below.
#
# Phase order follows the spec's delivery order (section 18) with one plan-level
# placement: the lease-liveness phase (2) precedes the watch phase (3), so the
# watch inherits a live lease. The remaining order is the spec's: the watch and
# the episode, the surfaces and the mode rule, the operator command; then the
# cross-cutting proof, the decision records, and the release and
# spec-reconciliation declaration.
#
# Test plan alignment: the plan is the authority for phase numbering. The test
# plan's scenario index and mapping table follow these eight phases, and every
# one of the 36 test cases is owned by exactly one phase below.
#
# Declaration discipline
#   - The commit primitive stages an untracked (new) file only inside the
#     declared scope, so every new file is declared by exact path in the phase
#     that creates it. A tracked file edited outside the declared scope is
#     still staged, with its drift disclosed. Read-only pins (the no-park
#     goldens, the delivered daemon suites) are therefore deliberately left
#     outside every scope: an edit to one is disclosed, never silent.
#   - A pinned surface moves in the same commit as the code it pins: the
#     source file inventory, the per-file export allowances, the two-way
#     contracts inventory, the no-shell dispatch surface, and the help-entry
#     counts. Each is declared beside that code with its authorising clause.
#   - A file whose edit is conditional says so in the comment beside it.
#
# Fences binding every phase (spec sections 4.2, 7.2, 8.5, 12, 15, 18)
#   - Owner delivery note 4: delivery never searches the file system outside
#     the checkout and the change folder. Every fact, fixture, and command is
#     reachable from those two roots.
#   - NG-1: the resident daemon's supervision cycle, watch, park, and resume
#     are not edited. packages/core/src/app/daemon-supervision.ts,
#     packages/core/src/app/supervise.ts, and packages/cli/src/daemon-compose.ts
#     are outside every scope.
#   - The delivered decision layer is composed, never re-derived or edited.
#     packages/core/src/domain/daemon-peak-pause.ts, queue-park.ts, spend.ts,
#     event-projection.ts, and packages/core/src/provider/peak.ts, peak-rules.ts
#     are outside every scope. The park end is the delivered first open
#     window's effective end; overlapping windows produce consecutive episodes
#     and no union is computed (DEC-20).
#   - Lease liveness (DEC-13, NFR-10, DM-9, TDR-0078): the lane keeps its lease
#     live through the run and the park by the delivered renewal path and the
#     existing lease record, at the renewal cadence
#     `min(lane.liveness-interval, queue.lease-ttl / 2)`. The renewal is a
#     no-op unless the lease is the lease identity this lane acquired at
#     admission (its lease id, not merely the same holder and reference) and
#     does not pass the owner-hold gate, so a parked lane under an owner hold
#     keeps renewing. A park longer than the TTL with no renewal is a change defect,
#     never a documented exposure. The admission claim keeps its delivered
#     refusal of a live same-ref lease, and no queue record kind, lease
#     operation, or claim result is added.
#   - The mode is the only intended no-park change (DEC-6, NFR-9): with no park
#     open, `peakEnforcement.mode` on a production composition with pausing
#     enabled reads `window-watch`; every other delivered field and line is
#     byte-identical.
#   - `dispatch stop` (DEC-15, DEC-21): admits `peak-window` only and requires
#     `--until`; another cause or a missing end is the grammar refusal
#     `input.value.rejected` before any read, the missing end reusing the
#     delivered `until-required` reason. It never signals itself. A lane is
#     running only when its newest record is `active`, carries a session
#     identity, and has no open `peak-window` park, so an already-parked lane
#     is the not-running refusal and is never parked twice. The park is written
#     only after a confirmed terminate; an unconfirmed terminate is the same
#     refusal and writes nothing. The tree root is the recorded worktree path
#     when the record carries one and otherwise the repository's main checkout.
#     The owning invocation withholds terminal classification for at least the
#     applied grace plus one observation cadence after its collection resolves,
#     because the command's terminate call awaits the whole grace before the
#     park is appended, and re-reads the park record.
#   - The lane record's nomination (DEC-16) is written on every `active` record
#     the invocation appends, only from the admission nomination, and is never
#     fabricated, defaulted, or inferred; a pre-change record is not
#     window-pausable.
#   - NG-6 and NFR-8: no new park cause, event kind, record kind, schema
#     identity, error identity, error-table row, result token, composition-fact
#     mode value, or second kill path. The refusals reuse the delivered
#     `queue.precondition.unmet`, `config.value.invalid`, and
#     `input.value.rejected` identities.
#   - NG-2 to NG-5, NG-7 to NG-9: no parallel lanes, no calendar-shaped window
#     policy, no resident mode, no shell-orchestrator change, no window read
#     surface, no change to provider-entry admission gating or the nomination
#     rule, and no provider-entry `peak` window in the lane watch.
#   - NG-10: no pre-session park. A dispatch admitted while its nominated
#     profile's window is already open spawns and is parked at the first
#     observation, so at most one observation cadence of billing precedes the
#     park (spec section 7.2, RSK-12). The case is out of scope with that
#     declared residual; no pre-session representation, fixture, or test case
#     exists.
#   - The aggregate gate (`pnpm check`, run once with TMPDIR=$PWD/tmp/tmpdir)
#     belongs to the lifecycle quality_gates phase, not to a plan phase. A plan
#     phase runs only its affected suites.
# ---------------------------------------------------------------------------
schemaVersion: delivery.plan.v1
workItemRef: GH-413
tier:
  name: full
  escalationTriggers:
    - "A second signal, kill, or termination route appears beside the delivered terminate path, or a stop is issued with more or fewer than one terminate request (NG-6, NFR-1, AC-F3-3, AC-F9-2, TC-PEAK-019): stop and report; never add a signal to the command path or to the engine."
    - "A new park cause, event kind, record kind, lease operation, claim result, schema identity, error identity, error-table row, result token, reason token, or a third composition-fact mode value appears (NG-6, DEC-3, DEC-6, DEC-8, DEC-21, NFR-8, TC-PEAK-027): stop and report; vocabulary economy is a delivered discipline."
    - "The dispatch composition is observed computing a window rule of its own, including a union of overlapping windows, instead of calling the delivered decision functions, or the parity fixture disagrees between the dispatch-owned watch and the daemon watch on the same profile and instant (AC-F1-1, DEC-20, RSK-8, RSK-TP-1, TC-PEAK-001): stop and report."
    - "A file on the resident daemon's supervision path or in the delivered decision layer needs an edit to go green (NG-1, F-1): stop and report; the watch composes the delivered decision functions and never changes them."
    - "The wait gains a timing mechanism of its own: a second cadence or configuration key, a wall-clock read, a real timer in the engine, or a pinned duration instead of the end re-derived from the injected clock at each wake (DEC-11, NFR-5, NFR-7, TC-PEAK-026): stop and report."
    - "A no-park golden, a delivered daemon park or resume suite assertion, or the dispatch-additive-stability pins are modified beyond the one named `peakEnforcement.mode` value (AC-F6-3, NFR-9, RSK-TP-6): stop and report; the no-park pins are read-only and the carve-out is exactly one field."
    - "The full battery is started before the change's changeset exists, or any gate is reported green while a check was skipped, disabled, or made vacuous (TC-PEAK-028, owner delivery note 1, RSK-TP-5): stop; run the two release suites first and record what actually ran."
    - "The post-upgrade hand-off (TC-PEAK-029) is treated as a substitute for the automated fixtures, as a Done criterion, or as an episode this delivering lane must produce, or a red fixture is excused by a manual result (RSK-TP-4, RSK-TP-8, spec section 18.1 item 7): stop and report; the fixtures are the merge gate and the hand-off is a recorded obligation."
    - "The lane's lease heartbeat age reaches the lease TTL during a run or a park, a second dispatch of the work item is admitted or takes over a live lease, the renewal cadence departs from `min(lane.liveness-interval, queue.lease-ttl / 2)`, a renewal acquires, takes over, or displaces a lease, a renewal renews a lease whose id is not the one this lane acquired at admission (including a previous invocation's stale lease under the same holder and reference), or the renewal passes the owner-hold gate so a parked lane under a hold stops renewing (NFR-10, AC-F5-2, DEC-13, RSK-10): stop and report; a park longer than the TTL with no renewal is a change defect."
    - "The admission claim is observed renewing or taking over a live same-ref lease, or a new queue record kind appears (TDR-0050, TDR-0078, DM-9, spec section 8.5): stop and report; only who renews and how often is added."
    - "A no-park field or line other than the one named `peakEnforcement.mode` value moves, or the mode is derived from a test-only watch override or from another process (DEC-6, AC-F6-3, AC-F6-4, NFR-9, RSK-TP-10): stop and report."
    - "`dispatch stop` admits a cause other than `peak-window`, runs without `--until`, answers its grammar refusals with an identity or reason other than `input.value.rejected` and the delivered `until-required`, or sends a signal of its own outside the delivered terminate path (DEC-15, DEC-21, AC-F9-2, AC-F9-3, NFR-1, NFR-8): stop and report."
    - "`dispatch stop` appends a park for a ref that already has an open `peak-window` park, writes a park before a confirmed terminate, answers success on an unconfirmed terminate, or the owning invocation classifies terminal at session end without its grace-plus-cadence park re-read (DEC-15, AC-F9-2, AC-F9-4, AC-F10-1, AC-F10-2, RSK-7, RSK-TP-13): stop and report."
    - "A dispatch admitted inside an already-open window of its nominated profile is not parked at its first observation, or the billing before that park exceeds one observation cadence (NG-10, RSK-12, spec section 7.2): stop and report; the pre-session park stays out of scope and its residual is bounded, never widened."
    - "A pre-session park, a pre-session representation, or a session-less park frame is reintroduced, or a lane record without a stored nomination is paused, re-nominated, or given a fabricated profile, or an `active` record the invocation appends lacks the nomination (NG-10, DEC-16, AC-F2-3, RSK-TP-12): stop and report."
    - "A non-terminal recovery refusal leaves the invocation waiting or holding the lease instead of returning one classified result and releasing the lease (DEC-18, NFR-4, AC-F4-3): stop and report."
    - "Delivery searches the file system outside the checkout and the change folder (owner delivery note 4, spec section 12): stop and report; every fact, fixture, and command is reachable from those two roots."
