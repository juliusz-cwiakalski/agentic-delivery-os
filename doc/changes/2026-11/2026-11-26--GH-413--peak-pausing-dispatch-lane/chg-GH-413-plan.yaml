    # composition's park context; the resolved `lane.disable-peak-pausing` of
    # true, or a harness that declares no terminate operation, composes no
    # watch (F-6, F-8)).
    # Standing-park recovery (F-3, AC-F3-4, DEC-22, DEC-23, RSK-14,
    # TC-PEAK-038): before its first stop decision for a reference, and at
    # the first observation of an invocation that resumes a lane carrying a
    # standing park, the run path closes that park through the delivered
    # mutating park pass (`packages/core/src/app/queue.ts`,
    # `recoverQueueParks`: the clear-observed marker, the recovered record,
    # and the `park-auto-recovery` incident), so an expired, orphaned,
    # refused, or budget-exhausted park is closed before a new episode. The
    # pass is composed unchanged and is in scope ONLY IF the run path needs a
    # result classification; it keeps its delivered owner-hold behaviour
    # (under an active hold it mutates nothing) and its delivered
    # repository-wide reach. The already-parked rule is occupancy: any
    # remaining standing `peak-window` park for the reference, whatever its
    # `until`, suppresses a new stop, so no second `stop` or `parked` is
    # appended and the reference never carries two active parks.
    # An un-expired standing park is a pre-session refusal, not an operator
    # override (DEC-22): a resume or a re-dispatch of a lane whose standing
    # park has not expired is refused at resume admission, beside the other
    # admission refusals and before any session starts, as the new row
    # `dispatch.resume-parked` at exit 2, with a bounded summary naming the
    # park's cause and `until`. It writes nothing (no session, no park, no
    # event), and `lanes` and `board` keep showing the lane parked. An expired
    # park is recovered through the delivered pass at the first observation
    # and the resume proceeds.
    # The pass therefore only ever meets an expired park or none. An expired
    # park the pass cannot recover (the delivered pass refuses, for example
    # `queue.park-condition-stuck`, or the park fold fails closed) refuses the
    # run as a classified failure through the delivered identity, writes no
    # park, and starts no new episode; its bounded summary names the stuck
    # references the pass reports, this reference's or another lane's
    # (DEC-23, TC-PEAK-038; that naming is phase 10's work). The recovery
    # pass runs before the first session of the invocation (the ordering
    # invariant, AC-F3-4, TDR-0077 D8): an unrecoverable expired park is a
    # refusal that starts no session, so it appends no park and calls neither
    # spawn nor resume, and there is no terminate-after-session arm. No
    # recovery is attempted for a killed waiting process while it stays dead:
    # the standing park is recovered when the lane next runs (spec section
    # 7.2).
    # Declared consequences of reusing the delivered pass (RSK-14; asserted in
