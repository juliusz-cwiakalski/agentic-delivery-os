workItemRef: GH-413
tier:
  name: full
  escalationTriggers:
    - "A second signal, kill, or termination route appears beside the delivered terminate path, or a stop is issued with more or fewer than one terminate request (NG-6, NFR-1, AC-F9-2, TC-PEAK-019): stop and report; never add a signal to the command path or to the engine."
    - "A new park cause, event kind, record kind, schema identity, error identity, error-table row, result token, or a third composition-fact mode value appears (NG-6, DEC-3, DEC-6, DEC-8, NFR-8, TC-PEAK-027): stop and report; vocabulary economy is a delivered discipline."
    - "The dispatch composition is observed computing a window rule of its own instead of calling the delivered decision functions, or the parity fixture disagrees between the dispatch-owned watch and the daemon watch on the same profile and instant (AC-F1-1, RSK-8, RSK-TP-1, TC-PEAK-001): stop and report."
    - "A file on the resident daemon's supervision path or in the delivered decision layer needs an edit to go green (NG-1, F-1): stop and report; the watch composes the delivered decision functions and never changes them."
    - "The wait gains a timing mechanism of its own: a second cadence or configuration key, a wall-clock read, a real timer in the engine, or a pinned duration instead of the end re-derived from the injected clock at each wake (DEC-11, NFR-5, NFR-7, TC-PEAK-026): stop and report."
    - "A no-park golden, a delivered daemon park or resume suite assertion, or the dispatch-additive-stability pins are modified to accommodate this change (AC-F6-3, RSK-TP-6, test plan section 7 notes): stop and report; the no-park pins are read-only and absence is asserted, never null presence."
    - "The full battery is started before the change's changeset exists, or any gate is reported green while a check was skipped, disabled, or made vacuous (TC-PEAK-028, owner delivery note 1, RSK-TP-5): stop; run the two release suites first and record what actually ran."
    - "The manual reference-host episode is treated as a substitute for the automated fixtures, or a red fixture is excused by a manual result (RSK-TP-8, TC-PEAK-029): stop and report; the fixtures are the merge gate and the manual episode is owner behavioural evidence."
