  - id: 4
    title: "`dispatch stop`: family grammar, runtime, never-kill stop, and the classified not-running refusal"
    kind: delivery
    summary: "add `dispatch stop` to the dispatch command family: the canonical work item reference, a cause from the delivered closed park-cause set, and an optional end; a running lane receives the same bounded-grace stop request a window stop sends and lands the same complete-episode-frame park with one `stop` and one `parked`, the command sends no signal of its own, and a lane that is not running is refused before any write with the delivered `queue.precondition.unmet` identity; help, the reference page, and the pinned entry counts move in the same commit."
