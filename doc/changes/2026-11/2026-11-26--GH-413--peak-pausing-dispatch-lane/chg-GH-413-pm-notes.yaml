decisions:
  - text: "Milestone confirmed at intake: the ticket is attached to M4:
      Jaiship-native delivery (milestone 5). No milestone change proposed."
    date: "2026-11-26"
  - text: "Requirements are complete and consistent with the system spec. The one
      intentional supersession: feature-peak-pausing.md section 9 states that
      without a resident daemon there is no window watcher and no mid-flight
      park. This change is the owner direction that a dispatch-started lane is
      watched for its whole life, so phase 7 must reconcile section 9 and the
      composition-fact peakEnforcement wording with the delivered dispatch-owned
      watch. That is a documentation reconciliation, not an open requirement."
    date: "2026-11-26"
  - text: "The change rides the delivered machinery rather than inventing a parallel
      one: decidePeakStops/decidePeakResumes (core domain), the dispatch
      engine's in-flight cadence watcher and terminate-with-grace seam, the
      durable park record family, and the taxonomy v2
      stop/parked/resumed/park-edge events. The one-shot dispatch session loop
      is extended to park and wait until the window's end and then resume the
      preserved session, so one dispatch invocation spans the episode."
    date: "2026-11-26"
  - text: "Scope addition from owner comment 1 on GH-413 (2026-11-25T10:24Z), taken
      as part of the brief: the same bounded-grace stop is exposed as the
      operator command `dispatch stop <ref>`. It never kills; it parks with the
      given reason and `until`, records exactly one stop and one parked event,
      and a stop request to a lane that is not running is a classified refusal
      that names the work item and writes nothing. Included in this change, not
      split."
    date: "2026-11-26"
  - text: "Owner delivery notes for this lane (comments 2 and 3): add the change's
      changeset before the first gate run because TC-RELEASE-001 fails a
      packages change with no changeset; run only the affected tests while
      working and the full battery once at the gate; behavioural proof is
      fixtures with an injected clock and transport plus one real episode
      recorded on the pull request; never search the file system outside the
      checkout and the change folder."
    date: "2026-11-26"
  - text: "DoR iter-1 NOT_READY remediation, decision 1 (rule source and deployment
      precondition): the owner pause question is answered from tracked
      repository truth. `.jaiship/config.yaml` is tracked and profile `delivery`
      declares `peakWindows` (01:00-04:00 and 06:00-10:00 UTC, the incident's
      window). The rule source stays the nominated profile's `peakWindows` (same
      rules as the daemon). The spec gains a numbered decision, a deployment
      precondition (only a profile declaring `peakWindows` is pausable; shipped
      defaults declare none), a re-based KPI that cannot pass on an empty rule
      set, and a residual risk."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 2 (single-flight through the park): the
      delivered lease expires after `queue.lease-ttl` (90 s default) and the
      claim never renews, so a hours-long park lets a second dispatch take the
      ref. The change adds a lease heartbeat/renewal during the run and the
      wait, amending TDR-0050 through TDR-0078, and scopes the claim path in the
      plan. The alternative (declare the takeover exposure) would violate ticket
      requirement 5 and AC3, so it is rejected."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 3 (composition-fact mode): the mode is
      derived from the effective configuration of the reading composition, not
      from another process. Production reports `window-watch` when automatic
      pausing is enabled and `iteration-start-gating` when disabled; the mode is
      carved out of the byte-identical no-park promise as the one intended value
      change, and a production-composition test pins it."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 4 (`dispatch stop`): this change admits
      the `peak-window` cause only (the same stop the watcher sends), requires
      `--until`, resolves the session from the durable lane record's session id,
      stops through the delivered harness terminate path, writes the complete
      watcher-shaped episode frame, and the owning invocation observes the open
      park and waits/resumes instead of returning. Other causes are refused by
      name because the delivered projection frames only `peak-window`. The run
      path and the lane-record nomination are scoped."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 5 (record and view facts): an additive
      `providerProfile` is added to `dispatch.lane` so the park/stop payloads
      and a cross-process stop have a stored source. The delivered `stale` and
      `delivering` table is unchanged: a live parked lane is not stale, an
      orphaned park stays stale, and the additive park fact explains it. The
      spec drops the `delivering: false` claim."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 6 (already-open window): the watch
      evaluates before the first spawn or resume, so a dispatch whose nominated
      profile's window is already open parks before any session exists, waits,
      and proceeds at the end. This closes the pre-change admission gap for
      profile `peakWindows` without changing provider-entry admission gating."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 7 (stop sequence and bounds): one
      terminate call is issued with a grace of the smallest of the profile's
      bounded grace, `coordinator.kill-grace`, and the time to the effective
      window end, so KILL cannot outlast the buffer. The park bound is re-based
      to \"stop request within one observation cadence, park no later than the
      stop request plus the applied grace\"; lag evidence is derived from the
      recorded instants, with no new field."
    date: "2026-11-26"
  - text: "DoR iter-1 remediation, decision 8 (real episode): TC-PEAK-029 is the
      reference host's episode on the next lane after the upgrade, not an
      episode this delivering lane must produce. The PR records the hand-off and
      its preconditions (profile `peakWindows` declared, outer stall detection
      relaxed for a parked lane); the episode is removed from plan phase 7
      doneArtifacts."
    date: "2026-11-26"
  - text: "DoR iter-2 NOT_READY remediation, decision 9 (pre-session already-open
      window): move the already-open-at-start case to OUT OF SCOPE with a
      declared bounded exposure. A dispatch admitted while its nominated
      profile's window is already open spawns and is parked at the first
      observation, so at most one observation cadence of billing precedes the
      park. The KPI is re-based to 'no billable call after the first
      observation; the residual is bounded by one cadence'. This removes the
      unrepresentable pre-session park (no session, no lane record, no honest
      `resumed` frame) without inventing a closed value or a new record. The
      ticket's AC1 (a running lane when the window opens) is unaffected."
    date: "2026-11-26"
  - text: "DoR iter-2 remediation, decision 10 (`dispatch stop` hand-off): the
      running predicate adds 'no open peak-window park stands for the ref'; an
      already-parked lane is refused `queue.precondition.unmet` naming the
      state. The command resolves the session from the lane record (tree root =
      recorded worktree path when present, otherwise the repository's main
      checkout), terminates, and writes the complete park record only after a
      confirmed terminate; an unconfirmed terminate is a classified not-running
      refusal and writes nothing. The owning invocation, when collect resolves,
      re-reads the park record for up to one observation cadence; an open
      peak-window park for its ref sends it into the wait/resume path instead of
      classifying terminal. This closes the race without a request record."
    date: "2026-11-26"
  - text: "DoR iter-2 remediation, decision 11 (lease cadence relation): the renewal
      cadence is `min(lane.liveness-interval, queue.lease-ttl / 2)`, so the
      lease cannot go stale between renewals even when the liveness interval is
      at or above the TTL. No new key; the relation is stated and tested."
    date: "2026-11-26"
  - text: "DoR iter-2 remediation, decision 12 (non-terminal recovery refusal): the
      invocation returns one classified result with the park standing and the
      refusal in its episode fact; it does not keep waiting or renewing after
      returning. The lease is released on return, so the operator resume path
      can take the ref. AC-F4-3 is reworded to the returned result."
    date: "2026-11-26"
  - text: "DoR iter-2 remediation, decision 13 (overlapping windows): the park end
      is the effective end of the first open window, which is what the delivered
      `peakWindowOpenAt` returns. Overlapping windows produce consecutive
      episodes, each exactly-once; the spec's 'single contiguous union' promise
      is removed. This composes the delivered decision layer unchanged."
    date: "2026-11-26"
  - text: "DoR iter-2 remediation, decision 14 (minor findings): the lag is derived
      from the recorded instants with the injected clock as the measurement
      basis; the nomination is on every active lane record (first acquisition
      and every restart); a disallowed cause or a missing `--until` is
      `input.value.rejected` at the grammar boundary; the test plan's phase
      column is renumbered to the plan's 1-8 phases and names the lease-liveness
      file."
    date: "2026-11-26"
  - text: "DoR iter-2 remediation, decision 15 (lease identity and stop re-read
      bound): the renewal must be keyed by the lease identity the lane acquired
      at admission (its lease id), not merely the same holder and reference,
      because a re-dispatch can renew a previous invocation's stale lease under
      the same holder. The owning invocation's post-collection withhold is at
      least the applied grace plus one observation cadence, because the
      terminate call awaits the whole grace and a one-cadence re-read could miss
      the park. Both are recorded in the spec and must appear in the plan and
      test arms."
    date: "2026-11-26"
  - text: "RESUMED under the owner's delegated authority. Source: the newest comment
      on https://github.com/juliusz-cwiakalski/agentic-delivery-os/issues/413
      (2026-11-26, CEO authorization), Decision 1: the outcome of an un-expired
      standing park is a PRE-SESSION REFUSAL. A resume or re-dispatch of a lane
      whose standing park has not expired is refused before any session starts,
      at the admission of the resume beside the other admission refusals, using
      the window refusal's exit code (2): the delivered
      `provider.profile.unavailable` contract does not fit (it says no profile
      is eligible and carries an eligibility list), so the owner authorises one
      new dispatch-family code, `dispatch.resume-parked` (platform-provider,
      exit 2, transient/retryable, remediation: resume after the park's
      `until`), with the park's cause and `until` in the bounded summary; it
      writes nothing, no event claims a resume, and lanes and board keep showing
      the lane parked. The operator-override outcome is not chosen. Consequence:
      the recovery pass only ever meets an expired park or none. This decision
      supersedes the operator-resume-during-open-window reading in F-3/F-4/Flow
      3/AC-F3-4/RSK-14 and the plan/test plan passages."
    date: "2026-11-26"
  - text: "RESUMED under the owner's delegated authority. Source: the newest comment
      on #413 (2026-11-26, CEO authorization), Decision 2: up to two more
      readiness passes are authorized (iterations 5 and 6) for the iteration-4
      findings; if iteration 5 is NOT_READY only on wording the reviewer's
      suggested fix covers, apply it literally and run iteration 6; after
      iteration 6, if still NOT_READY, park and hand back again. When READY,
      continue through delivery, system_spec_update, review_fix, quality_gates,
      dod_check and pr_creation on this branch and stop at pr_creation. The
      decision records stay Proposed; the three delivery notes and scope are
      unchanged."
    date: "2026-11-26"
  - text: "Decision 15 is superseded on its lease-key rationale: the ownership key
      is the live lease's latest heartbeat being the invocation's own last
      write, not the lease id, because the delivered `renewed` arm preserves the
      lease id across a same-holder re-dispatch. The claim stays untouched. This
      correction was already in spec v1.3 and TDR-0078; it is recorded here so
      the pm-notes no longer carry the earlier lease-id rationale."
    date: "2026-11-26"
  - text: "RESUMED after the provider limit reset, under the owner's live
