    type: blocker
    date: "2026-11-26"
  - text: "Retro: the cap was reached because each remediation pass fixed the
      previous findings but introduced one new seam-level contradiction. The two
      durable lessons: (a) recover the standing park on the dispatch path before
      the watch, or the episode's abnormal exits poison every later park read;
      (b) a lease-id key alone is not an ownership key because the delivered
      renewed arm preserves the lease id; the heartbeat-write key is the one
      that survives the arm, and the claim stays untouched. Both are design
      fixes, not wording fixes."
    type: retro
