decisions:
  - text: "Milestone confirmed at intake: the ticket is attached to M4:
      Jaiship-native delivery (milestone 5). No milestone change proposed."
    date: "2026-11-26"
  - text: "Requirements are complete and consistent with the system spec. The one
      intentional supersession: feature-peak-pausing.md section 9 states that
      without a resident daemon there is no window watcher and no mid-flight
      park. This change is the owner direction that a dispatch-started lane is
      watched for its whole life, so phase 7 must reconcile section 9 and the
      composition-fact peakEnforcement wording with the delivered dispatch-owned
      watch. That is a documentation reconciliation, not an open requirement."
    date: "2026-11-26"
  - text: "The change rides the delivered machinery rather than inventing a parallel
      one: decidePeakStops/decidePeakResumes (core domain), the dispatch
      engine's in-flight cadence watcher and terminate-with-grace seam, the
      durable park record family, and the taxonomy v2
      stop/parked/resumed/park-edge events. The one-shot dispatch session loop
      is extended to park and wait until the window's end and then resume the
      preserved session, so one dispatch invocation spans the episode."
    date: "2026-11-26"
