notes:
  - text: "State detection at session start: lane worktree detached at main-tools
      tip febf3906 (equal to origin/main-tools), clean; no GH-413 branch, no
      change folder, no open pull request, no prior lane session. This is a
      fresh lifecycle start, not a resume."
    type: info
    date: "2026-11-26"
  - text: "Retro: the first spec draft read ticket requirement 2 ('any provider that
      its seats resolve to has a window') as provider-entry peak windows and
      invented a seat-resolved outside the profile's declared provider list.
      Current truth (feature-provider-profiles.md) separates the two: profile
      peakWindows drive the lane watch, provider-entry peak windows gate
      admission only. Caught at PM validation before the specification phase
      completed; one correction cycle, no downstream rework."
    type: retro
    date: "2026-11-26"
  - text: "Retro: the plan's phase summaries started with a capital letter; the
      commit path uses each phase summary as its commit subject, so `phase
      complete delivery_planning` failed commitlint `subject-case` once. Fixed
      all seven summaries to lowercase-start (the delivered GH-404 plan
      convention) and re-ran; the phase landed as 123175ef. No artifact rework
      beyond the casing; downstream plan-phase commits now start compliant."
    type: retro
    date: "2026-11-26"
  - text: "DoR gate iteration 1: NOT_READY (readiness-review/readiness-iter-1.md),
      15 findings (4 critical, 7 major, 4 minor). The pause-required owner
      question (does the reference host's nominated profile declare
      peakWindows?) is resolved from tracked truth: yes, `.jaiship/config.yaml`
      profile `delivery` declares two UTC windows including 06:00-10:00.
      Reopened `specification`, `test_planning`, and `delivery_planning`;
      remediation decisions are recorded above. Re-run the gate after the three
      artifacts are revised."
    type: blocker
    date: "2026-11-26"
  - text: "Retro: DoR iter-1 caught four critical gaps the artifact chain missed:
      the shipped-default empty rule set, the 90 s lease versus an hours-long
      park, the always-iteration-start-gating composition fact, and the
      cross-process `dispatch stop` mechanism. All four were real against code.
      The gate cost one remediation cycle and prevented a delivery that would
      have passed its own fixtures while failing the ticket's incident. Keep the
      gate adversarial."
    type: retro
    date: "2026-11-26"
  - text: "DoR gate iteration 2: NOT_READY (readiness-review/readiness-iter-2.md),
      10 findings (1 critical, 5 major, 3 minor, 1 nit). Twelve of the fifteen
      iteration-1 findings are resolved. The new blocking set is code-level: the
      `dispatch stop` hand-off race and already-parked double-park, the
      pre-session park that the delivered layer cannot represent, the
      liveness-interval/lease-ttl relation, the non-terminal recovery refusal
      contradiction, the overlap union versus the delivered first-window end,
      and the test-plan phase numbering. Reopened the three artifact phases for
      iteration 3 with the decisions above."
    type: blocker
    date: "2026-11-26"
  - text: "Retro: iteration 2's findings were all traceable to iteration 1's
      remediation inventing behavior the delivered layer does not have (a
      pre-session park, a contiguous union, a session-less resume). The lesson
      for the next gate cycle: when a remediation adds a case, first prove the
      delivered seam can represent it; otherwise declare it out of scope with a
      bounded residual. The pre-session case is now out of scope with a
      one-cadence exposure."
    type: retro
    date: "2026-11-26"
  - text: "DoR gate iteration 3: NOT_READY (readiness-review/readiness-iter-3.md) at
      the three-iteration cap. Three blocking findings, all code-level and
      fixable: (1) the watch has no rule for a standing park after an abnormal
      episode end (an orphaned/refused/exhausted park is not recovered on the
      dispatch path, so the next window can double-park and make every park read
      fail closed permanently); (2) the lease-id key does not distinguish
      invocations because the delivered stale same-holder arm renews and
      preserves the lease id, so the spec/plan/test arm cannot pass; (3) the
      post-collection withhold bound is stated as 'at least grace plus one
      cadence' in DEC-15 and 'up to one cadence' in F-9 and TDR-0077. The
      reviewer recommends one more gate pass and advises against accepting the
      risks. Escalated to the owner for authorization to exceed the cap."
    type: blocker
    date: "2026-11-26"
  - text: "Retro: the cap was reached because each remediation pass fixed the
      previous findings but introduced one new seam-level contradiction. The two
      durable lessons: (a) recover the standing park on the dispatch path before
      the watch, or the episode's abnormal exits poison every later park read;
      (b) a lease-id key alone is not an ownership key because the delivered
      renewed arm preserves the lease id; the heartbeat-write key is the one
      that survives the arm, and the claim stays untouched. Both are design
      fixes, not wording fixes."
    type: retro
    date: "2026-11-26"
  - text: "Owner decision at the cap: this is a non-interactive run, so the
      authorization question could not be answered. PM assumes the reviewer's
      recommended option: one more gate pass (DoR iteration 4) for exactly the
      three blocking findings. If iteration 4 is NOT_READY, the change is parked
      and handed back; no further pass is attempted. This assumption is recorded
      for the owner's PR review."
    type: decision
    date: "2026-11-26"
  - text: "DoR gate iteration 4 (the authorized final pass): NOT_READY
      (readiness-review/readiness-iter-4.md), one blocking finding. The
      standing-park rule closes the permanent double-park for an expired park,
      but an un-expired standing park on an operator resume inside its own
      window is specified three ways and one is unimplementable: the delivered
      pass recovers only an expired park; occupancy would let the lane bill
      inside the window while `lanes` shows it parked; the refusal reading
      returns from a live session with no named identity or decision point.
      The reviewer's fix is small: choose operator-override or pre-session
      refusal, align seven passages, name the refusal identity and its point in
      the run. The change is PARKED per the recorded assumption; no code
      delivery, no pull request. Owner action required: authorize one more gate
      pass for this fix, or leave GH-413 parked."
    type: blocker
    date: "2026-11-26"
  - text: "Retro: the four gate passes produced a strong, code-grounded spec and a
      precise readiness record, but they also show the cost of remediating inside
      a 3-iteration cap: each pass fixed the previous seam and exposed one more.
      The durable lesson is to validate every abnormal-exit rule against the
      delivered state machine (expired vs active park, live vs lost lease) before
      writing it, and to choose the operator-override branch for an un-expired
      park, which is the only branch the delivered pass can express."
    type: retro
    date: "2026-11-26"
