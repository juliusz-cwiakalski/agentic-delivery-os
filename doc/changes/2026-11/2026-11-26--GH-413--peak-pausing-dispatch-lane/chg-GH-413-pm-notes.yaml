    date: "2026-11-26"
  - text: "RESUMED under the owner's live go (newest #413 comment,
      issuecomment-7197852375, 2026-11-26T16:40Z): iterations 7 and 8 are
      authorized. Run iteration 7 now; if NOT_READY only on wording the
