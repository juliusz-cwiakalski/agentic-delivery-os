  - text: "Current-truth cross-check (doc/spec/**) — three additive deltas, no
      contradictions to resolve with the user: (1) feature-plan-schema.md
      defines delivery.plan.v1 as phases+scope only, so member declarations must
      be an additive, schema-versioned extension that `plan validate` parses and
      echoes; (2) feature-verify-gates.md and feature-closeout.md declare
      single-request, single-repository resolution and closeout explicitly lists
      'cross-repository closeout, global state, or multi-repo fan-out' as a
      non-goal — this change supersedes that non-goal for the member-reporting
      slice; (3) the group surface (feature-project-groups.md) supplies the
      member identity (groupKey / repoKey) this change consumes and does not
      modify."
    type: info
    date: "2026-11-14"
  - text: "Documentation impacts for phase 7 (@doc-syncer): reconcile
      doc/spec/features/feature-plan-schema.md (member declarations + validate
      echo), feature-verify-gates.md (definitionOfDone / blockingMembers /
      per-member CI), feature-closeout.md (members[] report and the retired
      non-goal), feature-scheduling-engine.md (one entry per member, per-member
      dependency edges, per-member removal), feature-delivery-lifecycle.md (one
      lifecycle, per-member delivery, one review flow), plus
      doc/planning/oss-tooling/** bookkeeping (backlog M2-S19 progress marker,
      status snapshot, m2/contracts.md ownership line, cli-command-registry rows
      only if a command surface changes) and doc/00-index.md for any new feature
      page."
    type: risk
    date: "2026-11-14"
  - text: "Gate environment (measured, binding on every phase boundary): run gates
      with TMPDIR=/home/juliusz/tmp (same ext4 device as the checkout, outside
      every git work tree — the repo's parent /home/juliusz/git/jaiship is
      itself an umbrella git work tree) and with GIT_CONFIG_COUNT=1
      GIT_CONFIG_KEY_0=commit.gpgsign GIT_CONFIG_VALUE_0=false because the host
      sets commit.gpgsign=true globally and gate-spawned commits would block on
      pinentry. Do not use /tmp or /tmp/opencode (tmpfs, different device) and
      do not use the repo-local tmp/tmpdir (inside a work tree)."
    type: risk
    date: "2026-11-14"
  - text: "RETRO (tooling, phase 1): `phase complete` failed closed twice with
      commit.commitlint-failed although the generated template message passes
      commitlint. Root cause: the commitlint probe execs the bare name
      `commitlint` and a PATH without node_modules/.bin yields ENOENT, which the
      adapter misclassifies as a lint rejection. Workaround for every lifecycle
      command in this change: prefix PATH with $PWD/node_modules/.bin (or invoke
      through `pnpm exec delivery-os`). No state was written by the failed
      runs."
    type: retro
    date: "2026-11-14"
  - text: "REOPEN 1 (specification, test_planning): the test-plan author found seven
      spec gaps (missing-field defects, per-member lease release, unresolvable
      gate id, absent NFR ACs, unnamed review-observation seam, unpinned
      evidence[] shape, absent-vs-missing-CI contradiction). Closed additively
      as spec v1.1: 8 new ACs (37 total), DEC-15/16/17, OQ-3
      resolved-with-deferral, no renumbering. Test plan extended 43 -> 51 TCs,
      37/37 ACs covered."
    type: info
    date: "2026-11-14"
  - text: "REOPEN 2 (specification, test_planning): the plan author found four
      unpinned literals (verify-gates `overall` projection for a data-bearing
      negative report, landing-position read budget, cross-member closeout
      observation carrier, `queue add` multi-member payload). Closed additively
      as spec v1.2: DEC-18..DEC-21, DM-8, OQ-6; the AC set stayed at 37 and the
      nine affected TCs were amended in place (51 TCs unchanged). Plan revised
      to 1.1 and validates."
    type: info
    date: "2026-11-14"
  - text: "RETRO: both reopens were caught by the sequential-authoring rule before
      the DoR gate — the spec pinned member shapes but left four
      projection/carrier literals implicit, and the downstream authors correctly
      refused to invent them. Cost: two spec/test-plan revision cycles (~25
      min). Improvement: when a spec pins a new data-bearing report, pin the
      exit/projection field and the observation carrier in the same pass; what
      the consumer reads is part of the shape, not a later detail."
    type: retro
    date: "2026-11-14"
  - text: "DoR gate ITERATION 1 verdict: NOT_READY (6 blocking findings; 8 facets
      FAIL: spec_completeness, test_traceability, cross_artifact_consistency,
      system_spec_consistency, plan_code_area_coverage, scope discipline,
      testability, decision pinning). Blocking: (B1) cross-repo report summary
      and gates[] contents undefined with no member identity on
      VerifyGateRecord; (B2) DEC-18's premise false — delivered overall is the
      literal 'pass', failures emit no data, unknown exits 2, so the mapping
      contradicted delivered behaviour and the additive-only claim; (B3) plan
      scopes missed suite homes named by the test plan; (B4) no pre-change
      member-less queue add golden path; (B5) MemberLandingObservation carrier
      unnamed; (B6) review runId digest omitted PR-less members. Reviewer
      record: readiness-review/readiness-iter-1.md."
    type: risk
    date: "2026-11-14"
  - text: "RETRO: the DoR gate caught a false premise about delivered behaviour that
      three artifact authors had accepted — the spec claimed to keep the
      delivered overall field while remapping it, without anyone reading the
      delivered report type and CLI projection. Improvement: any spec statement
      of the form 'keeps the delivered X' must cite the type/line and the exact
      current values, not the intended shape."
    type: retro
    date: "2026-11-14"
  - text: "DoR iteration-1 remediation: reopens recorded for specification,
      test_planning, delivery_planning. Spec v1.3 pins the cross-repo
      gate-record projection (DM-9, additive `member` discriminator, summary
      counts), replaces DEC-18 with an explicitly scoped supersession (overall
      widened pass|fail for cross-repo reports only; data-bearing
      blocked/incomplete at exit 1; unknown never emitted; single-repo
      unchanged), names MemberLandingObservation (DM-10), and fixes the runId
      digest to the declared member set including PR-less members. Test plan
