      golden at tests/fixtures/queue/golden/queue-add-memberless.json captured
      from 404e9bf8. Plan revision 1.2 declares every §7 suite home (41/41), the
      golden capture as phase-1 obligation 1.0, and validates green."
    type: info
    date: "2026-11-14"
  - text: "DoR gate ITERATION 2 verdict: NOT_READY (5 blocking residuals). N1 member
      verdict ignored gates.ci (an unavailable CI member could read pass); N3
      the synthetic unresolvable-gate record's citation was undefined; N4
      widening the shared VerifyGatesReport.overall broke the member-less
      literal type; N5 the closeout per-member mapping was not mechanical
      (detail parsing, unmode-scoped values); plus minor N6-N10. Remediation:
      spec v1.4 (mechanical verdict/status rule incl. gates.ci, exact synthetic
      citation, distinct CrossRepositoryVerifyGatesReport/DM-11 leaving the
      delivered type untouched, mode-scoped closeout mapping tables, overall
