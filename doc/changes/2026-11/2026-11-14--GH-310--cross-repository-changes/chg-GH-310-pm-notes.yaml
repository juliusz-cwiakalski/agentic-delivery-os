    type: risk
    date: "2026-11-14"
  - text: "RETRO: iteration 2 caught two real defects that iteration 1's remediation
      introduced — a widened shared type and an aggregation rule that dropped
      gates.ci. Pattern: a remediation that adds a new shape must re-run the
      aggregation rules end-to-end, not only the section named in the finding.
      Improvement: when remediating a type/shape finding, list every consumer
      rule that reads the changed shape and re-verify each in the same pass."
    type: retro
    date: "2026-11-14"
