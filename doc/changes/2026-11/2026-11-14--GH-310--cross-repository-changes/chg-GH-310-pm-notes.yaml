decisions:
  - text: "Scope is the M2 blueprint contract, not an open-ended multi-repo engine:
      `plan.data.members[]` (repoKey, slice, branch, pullRequest, dependsOn[],
      gates), `verify gates` `data.definitionOfDone` {status, members[] with
      repoKey/gates.ci/verdict, evidence[] in landing order} plus
      `data.blockingMembers[]`, `closeout.data.members[]` (repoKey, branch,
      cleanup, pullRequest, issueClosure, landed), one queue entry per member
      with per-member dependency edges, and one executable review flow over the
      declared member pull-request set. Source: backlog M2-S19 and
      doc/planning/oss-tooling/milestones/m2/contracts.md ('Cross-repository
      change plan shape', 'Queue and lane representation')."
    date: "2026-11-14"
  - text: "Tests are fixture-driven over two local temporary repositories. AC-1's
      'two branches, two PRs, one closeout that lands both' is proven with the
      existing temp-repo fixture seam and injected provider observations; no
      live network, no real second remote, no merge by this change."
    date: "2026-11-14"
