  - text: "Gate environment (measured, binding on every phase boundary): run gates
      with TMPDIR=$GATE_TMPDIR, where `$GATE_TMPDIR` denotes the operator's
      measured gate temp root (same ext4 device as the checkout, outside every
      git work tree — the repo's parent <workspace-parent> is itself an umbrella
      git work tree); the literal machine path is not committed, per the
      privacy-literal rule, and the gate command reads the placeholder. Run with
      GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=commit.gpgsign
      GIT_CONFIG_VALUE_0=false because the host sets commit.gpgsign=true
      globally and gate-spawned commits would block on pinentry. Do not use /tmp
      or /tmp/opencode (tmpfs, different device) and do not use the repo-local
      tmp/tmpdir (inside a work tree)."
    type: risk
    date: "2026-11-14"
  - text: "RETRO (tooling, phase 1): `phase complete` failed closed twice with
      commit.commitlint-failed although the generated template message passes
      commitlint. Root cause: the commitlint probe execs the bare name
      `commitlint` and a PATH without node_modules/.bin yields ENOENT, which the
      adapter misclassifies as a lint rejection. Workaround for every lifecycle
      command in this change: prefix PATH with $PWD/node_modules/.bin (or invoke
      through `pnpm exec delivery-os`). No state was written by the failed
      runs."
    type: retro
    date: "2026-11-14"
