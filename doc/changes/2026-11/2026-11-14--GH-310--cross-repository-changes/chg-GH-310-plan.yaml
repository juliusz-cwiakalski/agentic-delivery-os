#     NO new domain kind. Reuse plan.schema.invalid, queue.precondition.unmet,
#     queue.dependency-cycle, verify.gates.failed, and the delivered closeout
#     outcome/skip vocabularies. If an identity ever proves necessary, STOP and
#     declare it explicitly with its feature-result-contract row in the same
#     commit (the error-table sync gate is bidirectional); NFR-7 forbids it, so
#     the expected change is zero rows and zero documentation edits.
#   - Member-less parity is absolute (C-1/NFR-8/AC-F1-3/AC-F5-4/AC-F7-1): a
#     plan/change without `members[]` is byte-identical to pre-change behaviour
#     on plan, gates, closeout and queue, with identical exits. Parity goldens
#     are READ UNCHANGED, never regenerated post-change. The named pre-change
#     references already exist on main-tools at 404e9bf8:
#     tests/golden/plan/validate-baseline.json,
#     tests/golden/plan/{diff-outside,overlap-parallel,overlap-sequence}.json,
#     tests/golden/plan-text.test.ts,
#     tests/fixtures/verify-gates/golden/{success-data.json,human-success.txt,
#     failure-summary.txt}, tests/fixtures/closeout/golden/{envelope-data.json,
#     human.txt}, tests/fixtures/queue/golden/{queue-list,queue-plan,
#     lanes-list,...}.json. If any named member-less golden is nevertheless
#     absent, capture it at the branch base BEFORE the first production edit,
#     commit it in the owning phase, and record the command in pm-notes; a
#     post-change regeneration is allowed only with a review-visible diff and a
#     recorded reason. Envelope `runId` and `timing` are the only normalized
#     keys; `reviewFlow.runId` is pinned and never normalized.
#   - Member refs (C-4/DEC-2/AC-F2-4): the member form is
#     `<canonicalChangeRef>@<repoKey>`, bounded by QUEUE_MAX_REF_CHARS = 64.
#     Canonicalization is EXTENDED, never narrowed: the delivered
#     `<PREFIX>-<digits>` form canonicalizes exactly as before and
#     `ref-not-canonical` never applies to a declared member ref. Reconcile
#     resolves the change-ref part before the `@`.
#   - Bounds (C-5/DEC-10): PLAN_MAX_MEMBERS = 8, PLAN_MAX_MEMBER_DEPENDS_ON = 8,
#     PLAN_MAX_MEMBER_GATES = 16, VERIFY_GATES_MAX_MEMBERS = 8,
#     CLOSEOUT_MAX_MEMBERS = 8; member ref <= 64 chars. A declaration must never
#     be valid where it cannot be reported. `blockingMembers[]` is never
#     truncated; report-level truncation may never remove a blocking member.
#   - Fail-closed CI (C-2/DEC-4/NFR-5): `gates.ci` is closed
#     pass|fail|unavailable|absent; member verdict is closed pass|fail|unknown;
#     `unavailable` and `absent` are never green and `unknown` is never a pass.
#   - Review seam (C-6/DEC-17/AC-F6-4): inputs are injected
#     `ReviewObservation` values { repoKey, pullRequest, verdicts[] } supplied
#     through the existing verification composition; no store, no command, no
#     live model call. The durable production carrier beyond the injection is
#     deferred and non-blocking (OQ-3).
#   - Report `overall` — SCOPED SUPERSESSION (DEC-18/DM-2/AC-F3-2/AC-F3-4/
#     RSK-10): this is NOT an additive change to the delivered report. For a
#     report of a plan that declares `members[]` ONLY, three delivered
#     behaviours change: (1) `overall` is widened from the delivered literal
#     `"pass"` to `"pass" | "fail"`; (2) the delivered "a failure emits no
#     `data`" rule is superseded — a negative cross-repository report is
#     data-bearing on every status and carries the delivered
#     `verify.gates.failed` classification on its data instead of an error
#     envelope; (3) the mapping is green -> overall: pass / exit 0,
#     blocked -> overall: fail / exit 1, incomplete -> overall: fail / exit 1.
#     `overall: "unknown"` is NEVER emitted by a cross-repository report, so
#     the delivered classified-unknown / verify.gates.unavailable exit-2 path is
#     untouched and still governs every other report. `gates[]`, `summary`, and
#     `overall` are present on all three statuses; a member-level `unknown`
#     never lifts the report to `pass`, and `blocked` wins over `incomplete`.
#     A plan declaring no `members[]` keeps the delivered literal
#     `overall: "pass"` type, the delivered failure envelope, the delivered
#     exits 1/2, no `member` field, and no new keys. RSK-10 mitigation: a
#     contract test in phase 5 proves the member-less literal `overall: "pass"`
#     and the unchanged failure envelope, so the scoped widening cannot be
#     mistaken for delivered behaviour.
#   - Gate-record projection (DM-9/AC-F3-1/AC-F3-2/AC-F3-7): the
#     cross-repository `gates[]` carries one record per declared (member, gate)
#     evaluation — members in declared order, then each member's declared gate
#     order — where each record is the delivered `VerifyGateRecord` shape
#     (`id`, `verdict`, `reason`, `citation`) plus one additive optional
#     `member` field holding the member `repoKey`; no record exists without a
#     member. `summary.gates` equals the record count and
#     `passed`/`failed`/`unknown` count records by verdict, so a fully resolved
#     set yields `summary.gates` equal to the total declared (member, gate)
#     pairs. An unresolvable declared identifier contributes exactly one
#     `unknown` record (`id` = the declared identifier, `member` = the
#     declaring repoKey, delivered `read-failed` reason) and never a `pass`. A
#     member's `verdict` aggregates its own records; the single-repository
#     report keeps the delivered `gates[]` shape byte-identically with no
#     `member` field.
#   - Injected landing/merge truth (DEC-19/DM-10/DM-4/NFR-6/AC-F3-6/
#     AC-NFR6-1): `landed`, `landingPosition`, and per-member merge truth arrive
#     as injected `MemberLandingObservation` entries, one per declared member
#     `{ repoKey, merged, headSha?, landingPosition? }`, supplied through the
#     verification composition (DM-10); `landingPosition` is a 1-based integer
#     present only when `merged` is true. They are never obtained by an
#     additional provider read, and no repo-diff or merge reader is added. The
#     per-member read budget is unchanged: one open-PR page, one detail read,
#     one check-run page per declared member, zero retries, zero pagination.
#   - Closeout carrier (DEC-20/DM-8/AC-F5-1/AC-F5-2): per-member merge truth,
#     branch, and issue-closure facts arrive as
#     `CrossRepositoryCloseoutObservation` entries, one per declared member
#     `{ repoKey, pullRequest, merged, headSha?, branch, issueClosure? }`,
#     supplied through the closeout composition. No new port, no new provider
#     operation, and no durable store are added; the durable production carrier
#     beyond the injection is deferred and non-blocking (OQ-6). Per-member
#     `cleanup`/`issueClosure` follow the DEC-12 precedence (refuse value, then
#     declared gap value, then satisfied/applied, otherwise the step's own
#     outcome) and never rewrite the aggregate step outcome.
#   - `queue add` member payload (DEC-21/DM-6/AC-F2-1): on a plan declaring
#     members, `queue add` returns the delivered `queue add` payload unchanged
#     plus an additive ordered `data.members[]` array of
#     `{ ref, repoKey, lane }` in declared order; auto-declared `dependsOn[]`
#     edges are reported through the delivered `edges[]` field. A change whose
#     plan declares no members returns the delivered payload byte-identically
#     (no `members` array, no extra edge), which TC-XPAR-003 proves.
#   - Hermetic tests (C-7/NFR-3/AC-NFR3-1): default suites use two real local
#     temporary repositories from tests/fixtures/projects/temp-repos.ts plus
#     injected provider/review observations; zero live network, zero real second
#     remote, zero credentials, no ambient $HOME, no daemon, no composition from
