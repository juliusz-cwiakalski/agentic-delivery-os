#  5.4 tests/checks/cross-repository-hermetic.test.ts + the extension
#      tests/checks/fixture-sanitization.test.ts — every case builds two real
#      local temporary repositories through tests/fixtures/projects/temp-repos.ts
#      and mints repoKeys through tests/fixtures/projects/groups.ts; all
