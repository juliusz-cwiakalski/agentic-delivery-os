#   - Read/write posture (NFR-4/AC-NFR4-1): plan validation writes nothing; a
#     full battery evaluation appends exactly ONE gate-verification record
#     regardless of member count; closeout plan mode writes nothing.
#   - Current-truth boundary (C-8/NG-9): doc/spec/** flips only in lifecycle
#     phase 7 (@doc-syncer), never in a delivery phase. The bidirectional
