#     dropped, `id`/`verdict`/`reason`/`citation` preserved in record order and
#     count — so the delivered closed-key validation, the post-append equality
#     check, and read tolerance accept it and the change's verification history
#     never reads `torn`. `MergeGateVerificationRecord`, `GATE_VERDICT_KEYS`,
#     `packages/core/src/state/merge.ts`, and every ledger consumer are NOT
#     widened.
