#  5.7 Release artifact — .changeset/gh-310-cross-repository-changes-minor.md
#      declares the five-package minor changeset for the publishable sources.
#      JUSTIFICATION: this is the repository's lockstep release convention for a
#      version_impact: minor change (the fixed group of five publishables in
#      .changeset/config.json; GH-309 precedent) — it is NOT a spec or test-plan
#      requirement and it changes no contract or acceptance surface. It is
