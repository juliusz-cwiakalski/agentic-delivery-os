# Phase 2 — Per-member queue representation
# Commit: feat(GH-310): per-member queue entries, dependency edges, and release
#
# Goal: the declared member set becomes one queue entry and one lane per member
# ref, with per-member edges, readiness, release and removal, and no
# cross-repository lane (F-2, F-4, DM-6, AC-F2-1..AC-F2-5, AC-F4-1, AC-F4-2).
#
# Obligations:
#  2.1 packages/core/src/contracts/queue.ts — the single member-ref separator
#      literal `QUEUE_MEMBER_REF_SEPARATOR = "@"`; no new record kind, no new
#      payload schema, no new error row (NFR-7). QUEUE_MAX_REF_CHARS stays the
#      one length bound.
#  2.2 packages/core/src/domain/queue-graph.ts — extend `canonicalQueueRef` to
#      recognize `<canonicalChangeRef>@<repoKey>`: canonicalize the change-ref
#      part exactly as delivered, preserve the declared repoKey, reject a
#      malformed/over-length member ref with `undefined`, and leave the
#      delivered `<PREFIX>-<digits>` form byte-identical (`GH-010` -> `GH-10`,
#      `pdev-7` -> `PDEV-7`). Fold keys, edge identity, lease lookup keys and
#      removal keys follow the same canonical member ref. The member form is
#      accepted wherever the delivered form is accepted, so
#      `ref-not-canonical` never applies to a declared member ref.
#  2.3 packages/core/src/app/queue.ts — reconcile resolves the change-ref part
#      before the `@` for the tracker read (DEC-2); removal/release keep their
#      delivered semantics keyed by the entry's own canonical ref and bound
#      repository (one member's lease never blocks another member's release).
#      No new record kind and no state migration.
#  2.4 packages/cli/src/edge.ts + packages/cli/src/production.ts — the queue
#      composition gains one bounded plan-member read (local plan read, no
#      configuration, no network). The read is an additive OPTIONAL composition
#      seam: when absent, the delivered single-ref queue path runs unchanged, so
#      existing runtime literals and member-less bytes stay green. A `queue add`
#      on a change whose plan declares
#      members appends exactly one entry per declared member ref, each bound to
#      that member's repository identity and carrying its own lease/lane; the
#      declared `dependsOn[]` materializes as per-member dependency edges onto
#      the prerequisite member refs; no entry is keyed by the bare change ref
#      and no lane spans both members. An unmet declared edge makes the member
#      entry `not-ready` with the delivered `dependency-open` reason; a start on
#      it is refused with `queue.precondition.unmet` naming the member and its
#      unlanded prerequisite; a member-ref edge cycle is refused with
#      `queue.dependency-cycle`; a plan cycle never reaches a queue write (it is
#      phase 1's `plan.schema.invalid`). commands/queue.ts carries the additive
#      multi-member add result under `data`; `queue list`/`lanes list` remain the
#      asserted surfaces and the delivered bare-ref output is unchanged.
#  2.5 Tests — tests/behaviour/queue-members.test.ts (TC-XQUEUE-001, 002, 005,
#      006), tests/behaviour/queue-members-removal.test.ts (TC-XQUEUE-003),
#      tests/behaviour/queue-member-ref.test.ts (TC-XQUEUE-004),
#      tests/behaviour/queue-members-dependency.test.ts (TC-XDEP-001, 002), and
#      the extensions tests/behaviour/queue-readiness.test.ts,
#      queue-lease.test.ts, queue-dep-cycle.test.ts. Queue-member fixture state
#      lives under tests/fixtures/queue/members/.
#      tests/behaviour/cross-repository-determinism.test.ts starts here with
#      the queue/lanes repeated-run case (TC-XBOUND-003).
#
# Bound: AC-F2-1, AC-F2-2, AC-F2-3, AC-F2-4, AC-F2-5, AC-F4-1, AC-F4-2;
# DoD-3, DoD-7, DoD-10 (queue surface), DoD-11 (queue half), F-2, F-4, DM-6,
# DEC-2, DEC-7.
# Test obligations: TC-XQUEUE-001..006, TC-XDEP-001..002, TC-XBOUND-003.
