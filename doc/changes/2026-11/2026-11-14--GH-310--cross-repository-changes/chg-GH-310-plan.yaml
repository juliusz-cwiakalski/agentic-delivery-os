# Phase 3 — Cross-repository definition of done and one review flow
# Commit: feat(GH-310): cross-repository definition of done and review flow
#
# Goal: one shared verdict decides the change while every member's evidence is
# visible, unavailable/absent CI never reads green, a failing or unresolved
# member is named, and exactly one review run covers the declared pull-request
# set (F-3, F-6, DM-2..DM-4, DM-7, AC-F3-1..AC-F3-8, AC-F6-1..AC-F6-4,
# AC-NFR6-1).
#
# Obligations:
#  3.1 packages/core/src/contracts/verify-gates.ts — additive `data` blocks:
#      `definitionOfDone` { status: green|blocked|incomplete; members[]:
#      { repoKey, gates.ci, verdict }; evidence[]: { repoKey, pullRequest,
#      landed, landingPosition? } }, sibling `blockingMembers[]`, and
#      `reviewFlow` { runId, complete, verdicts[]: { repoKey, pullRequest,
#      verdict: pass|fail|unreviewed } }; closed vocabularies
#      gates.ci = pass|fail|unavailable|absent, member verdict =
#      pass|fail|unknown (DEC-3, DEC-4, DEC-6, DEC-16, DEC-8); ReviewObservation
#      { repoKey, pullRequest, verdicts[] } (DEC-17); VERIFY_GATES_MAX_MEMBERS =
#      8; the delivered VERIFY_GATES_MAX_MACHINE_BYTES = 65 536 is reused. No
#      schema identifier bump, no new top-level envelope key.
#  3.2 packages/core/src/domain/verify-gates-members.ts (NEW) — pure shared
#      verdict derivation: exactly one member entry per declared member in
#      declared order; per-member `gates.ci` classification on that member's own
#      pushed head (unavailable = classified reading failure; absent = no pushed
#      head, no declared pullRequest, or no run for the head per DEC-4); member
#      verdict fail on a failed gate, unknown for unavailable/absent or an
