# CONSTRAINTS BINDING ON EVERY PHASE (spec Appendix C; do not reshape at
# delivery):
#   - Envelope continuity (C-1/NFR-1/AC-NFR1-1): every new key is additive and
#     optional and lives under `data`; the envelope stays the five-field
