#     the member-mode `branch-cleanup` and `ticket-to-done` step outcomes are a
#     deterministic worst-case fold over the declared members' mode-scoped
#     values in declared order with precedence `failed|refused` > `skipped-gap`
#     > `applied|would-apply` > `satisfied` > `skipped-noop`, plan values folded
#     only in plan mode (`would-refuse` in the refusal tier) and apply values
