# CONSTRAINTS BINDING ON EVERY PHASE (spec Appendix C; do not reshape at
# delivery):
#   - Envelope continuity (C-1/NFR-1/AC-NFR1-1): every new key is additive and
#     optional and lives under `data`; the envelope stays the five-field
#     `delivery.result.v1` shape; zero `ok` or `command` top-level fields.
#   - Identity reuse (C-3/NFR-7/AC-NFR7-1/DEC-13): NO new error-table row and
#     NO new domain kind. Reuse plan.schema.invalid, queue.precondition.unmet,
#     queue.dependency-cycle, verify.gates.failed, and the delivered closeout
#     outcome/skip vocabularies. If an identity ever proves necessary, STOP and
#     declare it explicitly with its feature-result-contract row in the same
#     commit (the error-table sync gate is bidirectional); NFR-7 forbids it, so
#     the expected change is zero rows and zero documentation edits.
#   - Member-less parity is absolute (C-1/NFR-8/AC-F1-3/AC-F5-4/AC-F7-1): a
#     plan/change without `members[]` is byte-identical to pre-change behaviour
#     on plan, gates, closeout and queue, with identical exits. Parity goldens
#     are READ UNCHANGED, never regenerated post-change. The named pre-change
#     references already exist on main-tools at 404e9bf8:
#     tests/golden/plan/validate-baseline.json,
#     tests/golden/plan/{diff-outside,overlap-parallel,overlap-sequence}.json,
#     tests/golden/plan-text.test.ts,
#     tests/fixtures/verify-gates/golden/{success-data.json,human-success.txt,
#     failure-summary.txt}, tests/fixtures/closeout/golden/{envelope-data.json,
#     human.txt}, tests/fixtures/queue/golden/{queue-list,queue-plan,
#     lanes-list,...}.json. If any named member-less golden is nevertheless
#     absent, capture it at the branch base BEFORE the first production edit,
#     commit it in the owning phase, and record the command in pm-notes; a
#     post-change regeneration is allowed only with a review-visible diff and a
#     recorded reason. Envelope `runId` and `timing` are the only normalized
#     keys; `reviewFlow.runId` is pinned and never normalized.
#   - Member refs (C-4/DEC-2/AC-F2-4): the member form is
#     `<canonicalChangeRef>@<repoKey>`, bounded by QUEUE_MAX_REF_CHARS = 64.
#     Canonicalization is EXTENDED, never narrowed: the delivered
#     `<PREFIX>-<digits>` form canonicalizes exactly as before and
#     `ref-not-canonical` never applies to a declared member ref. Reconcile
#     resolves the change-ref part before the `@`.
#   - Bounds (C-5/DEC-10): PLAN_MAX_MEMBERS = 8, PLAN_MAX_MEMBER_DEPENDS_ON = 8,
#     PLAN_MAX_MEMBER_GATES = 16, VERIFY_GATES_MAX_MEMBERS = 8,
#     CLOSEOUT_MAX_MEMBERS = 8; member ref <= 64 chars. A declaration must never
#     be valid where it cannot be reported. `blockingMembers[]` is never
#     truncated; report-level truncation may never remove a blocking member.
#   - Fail-closed CI (C-2/DEC-4/NFR-5): `gates.ci` is closed
#     pass|fail|unavailable|absent; member verdict is closed pass|fail|unknown;
#     `unavailable` and `absent` are never green and `unknown` is never a pass.
#   - Review seam (C-6/DEC-17/AC-F6-4): inputs are injected
#     `ReviewObservation` values { repoKey, pullRequest, verdicts[] } supplied
#     through the existing verification composition; no store, no command, no
#     live model call. The durable production carrier beyond the injection is
#     deferred and non-blocking (OQ-3).
#   - Report types and `overall` (DEC-18/DM-11/DM-2/AC-F3-2/AC-F3-4/RSK-10):
#     the delivered `VerifyGatesReport` is NOT widened or re-typed. It keeps the
#     literal `overall: "pass"`, `gates[]: VerifyGateRecord[]` with no `member`,
#     its failure envelope, and its exits for every report without
#     `definitionOfDone`. A distinct additive `CrossRepositoryVerifyGatesReport`
#     carries the same required delivered fields (`schemaVersion`, `changeRef`,
#     `target`, `summary`, `gates[]`) plus `overall: "pass" | "fail"`,
#     `definitionOfDone`, `blockingMembers[]`, and `reviewFlow`, with
#     `gates[]: CrossRepositoryVerifyGateRecord[]` (required `member`). The
#     command emits the union discriminated by the PRESENCE of
#     `definitionOfDone`. For the cross-repository type only, exactly three
#     delivered behaviours differ: (1) `overall` may be `"fail"`; (2) a negative
#     report is data-bearing — the delivered "a failure emits no `data`" rule
#     does not apply — and the delivered `verify.gates.failed` classification is
#     carried by `overall: "fail"` itself, with NO separate classification field
#     and no error envelope; (3) `gates[]` records are the cross-repository type
#     with a REQUIRED `member`. Mapping: green -> overall: pass / exit 0,
#     blocked -> overall: fail / exit 1, incomplete -> overall: fail / exit 1.
#     `overall: "unknown"` is NEVER emitted by this type, so the delivered
#     classified-unknown / verify.gates.unavailable exit-2 path is untouched.
#     RSK-10 mitigation: the phase-5 contract suite and the
#     `tests/types/cross-repository-report.type-test.ts` static probe prove the
#     member-less literal type/value and unchanged failure envelope.
#   - Member verdict and status rule (DM-2/DM-3/DEC-3/DEC-4/AC-F3-1..AC-F3-5):
#     a member's `verdict` is mechanical over BOTH its gate records and its CI
#     reading — `pass` iff every declared record for that member is `pass` AND
#     `gates.ci` is `pass`; `fail` iff any record is `fail` OR `gates.ci` is
#     `fail`; `unknown` otherwise (any record `unknown`, or `gates.ci`
#     `unavailable`/`absent`), so all-pass records with unavailable/absent CI are
#     never `pass`. `definitionOfDone.status` aggregates: `blocked` iff any
#     member is `fail`, any member's `gates.ci` is `unavailable`, or any member
#     carries a synthetic unresolvable-identifier record; `incomplete` iff none
#     of those hold and at least one member is `unknown` (with `absent` CI and an
#     unestablished resolvable-gate reading named as its instances); `green` iff
#     every member is `pass`. `blocked` wins over `incomplete`, and
#     `blockingMembers[]` names every member that is not `pass`, in declared
#     order.
#   - Gate-record projection (DM-9/DM-11/AC-F3-1/AC-F3-2/AC-F3-7): the
#     cross-repository `gates[]` carries one `CrossRepositoryVerifyGateRecord`
#     per declared (member, gate) evaluation — members in declared order, then
#     each member's declared gate order — being the delivered `VerifyGateRecord`
#     fields (`id`, `verdict`, `reason`, `citation`) plus a REQUIRED `member`
#     holding the member `repoKey`; no cross-repository record exists without a
#     member. `summary.gates` equals the record count and
#     `passed`/`failed`/`unknown` count records by verdict. An unresolvable
#     declared identifier contributes exactly one `unknown` record shaped
#     exactly as: `id` = the declared identifier, `member` = the declaring
#     `repoKey`, `verdict: unknown`, `reason: read-failed` (delivered
#     vocabulary), `citation` = the delivered citation shape carrying
#     `identity: { changeRef }` only, `sources: []`, `counts: []`, `names: []`,
#     and `reasons: ["read-failed"]` — no provider source, count, name list,
#     branch, or SHA is invented or attributed to a real read (N3). The
#     single-repository report keeps the delivered `VerifyGateRecord[]` with no
#     `member` field.
#   - Injected landing/merge truth (DEC-19/DM-10/DM-4/NFR-6/AC-F3-6/
#     AC-NFR6-1): `landed`, `landingPosition`, and per-member merge truth arrive
#     as injected `MemberLandingObservation` entries, one per declared member
#     `{ repoKey, merged, headSha?, landingPosition? }`, supplied through the
#     verification composition (DM-10); `landingPosition` is a 1-based integer
#     present only when `merged` is true. They are never obtained by an
#     additional provider read, and no repo-diff or merge reader is added. The
#     per-member read budget is unchanged: one open-PR page, one detail read,
#     one check-run page per declared member, zero retries, zero pagination.
#   - Closeout carrier and mapping (DEC-20/DEC-12/DM-8/DM-5/AC-F5-1/AC-F5-3):
#     per-member merge truth, branch, and issue-closure facts arrive as
#     `CrossRepositoryCloseoutObservation` entries, one per declared member
#     `{ repoKey, pullRequest, merged, headSha?, branch, issue?, issueClosure? }`,
#     supplied through the closeout composition. `issue?` is the member's
#     tracker work-item identity and the ONLY permitted target of a member
#     `ticket-to-done` transition; a member without it reports
#     `issueClosure: skipped-noop` and plans no transition, and no entity
#     identity is ever synthesized from `repoKey`, the member ref, or the change
#     ref (DEC-12/DEC-23). No new port, no new provider operation, and no
#     durable store are added; the durable production carrier
#     beyond the injection is deferred and non-blocking (OQ-6). Per-member
#     `cleanup`/`issueClosure` are computed from that member's observation plus
#     its own closeout operations, NEVER by parsing free-form step `detail`,
#     under the mode-scoped mapping — cleanup plan: would-apply | satisfied |
#     would-refuse | skipped-gap; cleanup apply: applied | satisfied | refused |
#     skipped-gap; issueClosure plan: would-apply | satisfied | skipped-noop |
#     skipped-gap; issueClosure apply: applied | satisfied | skipped-noop |
#     skipped-gap. Exactly one value per field per member; the aggregate step
#     outcome is never rewritten by a single member value.
