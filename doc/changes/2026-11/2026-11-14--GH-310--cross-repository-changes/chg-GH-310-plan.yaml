#      has no `members` array and no extra `edges[]` entry (DEC-21); the
#      member-less verify-gates report keeps the delivered literal
#      `overall: "pass"`, the delivered failure envelope and the delivered exits
#      1/2, with no `member` field in `gates[]` (DEC-18/RSK-10); the normalizer
#      replaces only envelope `runId`/`timing`. TC-XPAR-003 owns the
#      gates/queue/add half; the plan/closeout halves are owned by phases 1/4
#      and are re-read here unchanged.
#  5.2 tests/behaviour/cross-repository-readonly.test.ts — plan validation over
#      valid and invalid member plans writes nothing; a full member battery
#      appends exactly one gate-verification record regardless of member count;
#      closeout plan mode writes nothing; guarded stores record reads only
#      (NFR-4, AC-NFR4-1).
#  5.3 tests/structure/cross-repository-contract.test.ts + the extensions
#      tests/structure/envelope-contract.test.ts,
#      tests/structure/error-table.test.ts,
#      tests/structure/event-state-additivity.test.ts,
#      tests/checks/error-table-sync.test.ts — five-field
#      `delivery.result.v1` on every touched surface with all new keys under
#      `data` and zero `ok`/`command`; the closed vocabularies and the five
#      member bounds exported exactly once; zero new error-table rows, zero new
#      domain kinds, zero new identity strings; every exercised refusal resolves
#      to a delivered identity; consumer tolerance of additive fields (repoKey
