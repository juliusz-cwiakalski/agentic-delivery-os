# GH-310 delivery plan — machine-readable document (delivery.plan.v1), revision 1.0
# (2026-11-14). Authored against spec v1.1 (37 ACs, DEC-1..DEC-17, DM-1..DM-7,
# NFR-1..NFR-9, DoD-1..DoD-15, OQ-3 resolved-with-deferral) and test plan v1.1
# (51 TCs = 50 automated + 1 gate-only) on branch
# feat/GH-310/cross-repository-changes from main-tools tip 404e9bf8.
#
# One ticket, one PR against main-tools, five delivery phases. Every phase is
# an independently committable slice that is green at its own boundary, and
# every phase is ONE delivery commit through the commit primitive (conventional
# subject, scope GH-310 per repo convention, every body/footer line <= 100
# characters; lifecycle phase 9 lints the branch range with
# ./scripts/lint-commit-range.sh --base main-tools). Extra phase data (content
# obligations, AC/TC ownership, done-when, gate commands) is carried in YAML
# comments so the parsed document stays schema-strict: the only parsed keys are
# schemaVersion, workItemRef, tier, defaultLeases, defaultWeightClass and
# phases (id, title, kind, summary, scope, interactions, doneArtifacts,
# leases, weightClass, leaseClass). The plan declares phases and scope only;
# progress is a pm-notes `notes:` entry naming the plan phase id, commit hash,
# and test result; there is no `tasks` key and no progress log.
#
