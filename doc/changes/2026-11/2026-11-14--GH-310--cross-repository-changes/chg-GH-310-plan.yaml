#     human.txt}, tests/fixtures/queue/golden/{queue-list,queue-plan,
#     lanes-list,...}.json. If any named member-less golden is nevertheless
#     absent, capture it at the branch base BEFORE the first production edit,
#     commit it in the owning phase, and record the command in pm-notes; a
#     post-change regeneration is allowed only with a review-visible diff and a
#     recorded reason. Envelope `runId` and `timing` are the only normalized
#     keys; `reviewFlow.runId` is pinned and never normalized.
#   - Member refs (C-4/DEC-2/AC-F2-4): the member form is
#     `<canonicalChangeRef>@<repoKey>`, bounded by QUEUE_MAX_REF_CHARS = 64.
#     Canonicalization is EXTENDED, never narrowed: the delivered
#     `<PREFIX>-<digits>` form canonicalizes exactly as before and
#     `ref-not-canonical` never applies to a declared member ref. Reconcile
#     resolves the change-ref part before the `@`.
#   - Bounds (C-5/DEC-10): PLAN_MAX_MEMBERS = 8, PLAN_MAX_MEMBER_DEPENDS_ON = 8,
#     PLAN_MAX_MEMBER_GATES = 16, VERIFY_GATES_MAX_MEMBERS = 8,
#     CLOSEOUT_MAX_MEMBERS = 8; member ref <= 64 chars. A declaration must never
#     be valid where it cannot be reported. `blockingMembers[]` is never
#     truncated; report-level truncation may never remove a blocking member.
#   - Fail-closed CI (C-2/DEC-4/NFR-5): `gates.ci` is closed
#     pass|fail|unavailable|absent; member verdict is closed pass|fail|unknown;
#     `unavailable` and `absent` are never green and `unknown` is never a pass.
#   - Review seam (C-6/DEC-17/AC-F6-4): inputs are injected
#     `ReviewObservation` values { repoKey, pullRequest, verdicts[] } supplied
#     through the existing verification composition; no store, no command, no
