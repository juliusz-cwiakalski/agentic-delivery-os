# AC-NFR7-1, DoD-10..DoD-15).
#
# Obligations:
#  5.1 tests/behaviour/cross-repository-parity.test.ts — the committed parity
#      fixture set: member-less plan validate/lint/diff/overlap, verify gates
#      (pass and fail variants), closeout (plan and apply), `queue add`, and
