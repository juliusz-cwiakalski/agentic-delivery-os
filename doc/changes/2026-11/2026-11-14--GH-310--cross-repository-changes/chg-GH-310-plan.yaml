# PHASE ORDER AND WHY:
#   1 Plan declaration first — every other surface consumes the declared member
#     set, and the schema must be strengthened (validated, echoed, closed) before
#     anything depends on it. Plan-surface member-less parity is proven here.
#   2 Queue representation next — member ref identity, one entry/lane per member,
#     per-member edges, readiness, release and removal are the substrate for
#     dependency ordering and for the member refs used by gates and closeout.
#     The plan-cycle half of AC-F4-2 is already produced by phase 1; the queue
#     cycle/refusal halves land here.
#   3 Shared definition of done — consumes the declared set and decides green;
#     per-member CI corroboration, blockers, evidence order, and the single
#     review flow ride the same verification composition.
#   4 Closeout member report — per-member merge truth, cleanup, issue closure and
#     landing removal; consumes the member refs and per-member removal from
#     phase 2.
#   5 Parity, contract continuity, read-only/determinism/hermetic proofs, M2
#     bookkeeping, and the final full gate — the consolidated release boundary.
