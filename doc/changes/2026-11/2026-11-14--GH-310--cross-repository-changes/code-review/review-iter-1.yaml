  - id: F-6
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/verify-gates-members.ts:71
    message: >-
      [M | owner: plan Phase 3] `memberCiReading` derives `gates.ci` only from the
      check-run page: `detail` resolved + hex head + non-empty page + every
      `run.jobs[0].jobState` not in {failed, canceled, pending, missing} + at
      least one `succeeded` ⇒ `pass`. It never consults the workflow's expected
      job set, which is what makes the delivered `ci-green` gate fail with
      `ci-missing-jobs`. Empirically: a page holding a single `succeeded` job for
      a member whose effective set expects several returns `gates.ci: "pass"`, so
      a member declaring only e.g. `push-parity` can reach `verdict: pass` and
      `status: green` on one run out of many — a fail-open reading in a change
      whose stated invariant is fail-closed (NFR-5, AC-F3-3/AC-F3-5). Two smaller
      classification issues in the same function: a check run with an empty
      `jobs` array maps to `fail` (should be `unavailable`/`absent`), and
      `jobs[0]` alone stands in for the run's jobs (the delivered gate folds the
      whole run). The member-level record gate (`ci-green` via
      `evaluateDeclaredBattery`) partly compensates, but only when the member
      declares `ci-green`, which the plan schema does not require.
    suggestion: >-
      Compute the member reading over the same expected-job set the delivered
      `ci-green` gate uses (or reuse `ciGate` itself and project its verdict into
      the four-value vocabulary), map a run with no job evidence to `absent`/
      `unavailable` rather than `fail`, and add a cell asserting that a partial
      check-run page for a member whose declared gates exclude `ci-green` is never
      `pass`.
    suppressed: false
    published_url: null
    published_at: null
