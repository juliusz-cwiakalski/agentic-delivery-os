    category: correctness
    location: packages/cli/src/commands/verify-gates.ts:351
    message: >-
      [B | owner: plan Phase 3 — cross-repository report/append seam] The
      handler builds `MergeGateVerificationRecord` with `gates: report.gates`,
      i.e. `CrossRepositoryVerifyGateRecord[]` where every record carries the
      required `member` field beyond the delivered `id`/`verdict`/`reason`/
      `citation`. The delivered state contract refuses that shape: `isGateVerdict`
      in `packages/core/src/state/merge.ts:136` requires
      `hasOnlyKeys(value, GATE_VERDICT_KEYS)` (`id`,`verdict`,`reason`,`citation`),
      and `appendMergeGateVerification` uses the same `isVerification` predicate as
      its post-append equality check, while `readMergeGateVerifications` returns
      `torn` for it. Empirically confirmed with the real state module: appending
      one member record returns
      `{"kind":"state","code":"state.store.torn","consequence":"not_landed"}` and
      reading it back returns `{ok:false, reason:"torn"}`. Consequences when the
      injected `appendVerification` port is wired to the only delivered
      implementation (the private `appendMergeGateVerification` used by the merge
      composition): a member `verify gates` run appends a record, fails post-append
      verification, and returns the failure envelope instead of the
      data-bearing cross-repository report (exit 2, `state.store.torn`), and that
      change's whole gate-verification history then reads as torn for every
      consumer (merge freshness/probe). The defect is invisible today only because
      `createVerifyGatesCommandRuntime` defaults `appendVerification` to a no-op
      and every member test stubs it (`cross-repository-readonly.test.ts:143`,
      `verify-gates-read-budget.test.ts:176`), and the doc states the opposite
      ("exactly one gate-verification record per full battery evaluation, carrying
      the member records", `doc/spec/features/feature-verify-gates.md`).
      Secondary: the same record sets `trackerPosture.labels` to `[]` and takes
      `ownerLabels` from whichever member happens to hold the first `owner-gate`
      record, so even a successful append degrades the delivered posture data.
      Note AC-NFR4-1/NFR-4 ("exactly one appended gate-verification record") is
      therefore satisfied only in the stubbed sense.
    suggestion: >-
      Persist a projection to the delivered shape — map each cross-repository
      record to `{id, verdict, reason, citation}` for the ledger (member
      attribution stays in the report and in a per-member key inside the citation
      or an additive, state-contract-approved field), and compute
      `trackerPosture` from the change-level owner-gate read as the member-less
      path does. If member attribution in the ledger is genuinely wanted, amend
      the `MergeGateVerificationRecord`/`GATE_VERDICT_KEYS` contract deliberately
      (spec + `state/merge.ts` validation + read tolerance) and add a test that
      appends and reads the real `appendMergeGateVerification` for a member run.
      Replace the stubbed `appendVerification` in at least one member test with
      the real state module so this class of defect cannot ship again.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
