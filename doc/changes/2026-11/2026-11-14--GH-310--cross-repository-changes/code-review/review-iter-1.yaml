summary: >-
  GH-310 is a large, disciplined delivery: the additive `plan.data.members[]`
  declaration with closed validation, the member-ref identity
  (`<canonicalChangeRef>@<repoKey>`) with per-member queue entries, lanes, edges,
  release and landing removal, the distinct `CrossRepositoryVerifyGatesReport`
  with per-(member, gate) records, the mechanical verdict over records AND
  `gates.ci`, landing-ordered evidence, untruncated blockers and one review flow,
  and the additive per-member closeout report all land as specified; 37/37 ACs
  are covered by 50 automated TCs plus the verification-only gate TC, member-less
  parity is compared against genuine pre-change goldens (`validate-baseline`,
  `success-data`, `queue-add-memberless` from 404e9bf8, `closeout/envelope-data`)
  rather than a regenerated one, no delivered test was weakened or skipped, the
  error table and domain-kind set are provably unchanged, the four documented
  deviations are honest, and the five plan phases carry pm-notes commit/test
  evidence. Two blockers survive the green battery. First, the cross-repository
  gate records carry a required `member`, and they are handed to the delivered
  `MergeGateVerificationRecord.gates`; the state layer validates that ledger with
  `hasOnlyKeys(GATE_VERDICT_KEYS)` both on read and as the post-append equality
  check, so the only natural implementation of the injected `appendVerification`
  port (`appendMergeGateVerification`) refuses with `state.store.torn` and every
  later read of that change's verification history returns torn — empirically
  confirmed (see F-1), and invisible today only because the member runtime is
  unwired and every test stubs the appender. Second, the per-member
  `ticket-to-done` transition targets the fabricated entity
  `<changeRef>@<repoKey>` because DM-8 carries no member tracked-issue identity,
  so AC-F5-1's "one transition per member's tracked item" cannot be satisfied and
  `issueClosure: applied` is asserted against a fake that accepts any id — a
  genuine spec defect that must be closed by reopening the specification, not by
  patching code (F-2). Five medium findings follow from the same two seams plus
  three member-mode reporting/exit inconsistencies (F-3..F-7).
