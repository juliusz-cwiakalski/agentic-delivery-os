    location: packages/core/src/domain/closeout.ts:548
    message: >-
      [B | owner: SPEC — DM-8 / AC-F5-1 — spec defect, then plan Phase 4] The
      member-mode `ticket-to-done` step creates a `transition-work-item`
      operation whose target is
      `{systemName, entityId: closeoutMemberRef(facts.workItemRef, member.repoKey)}`
      — i.e. `GH-310@api-…`, a derived queue identity that is not a tracker work
      item. AC-F5-1 requires `issueClosure` to be "derived from that member's
      observation entry plus that member's own closeout operations" and F-5 says
      `ticket-to-done` "expands to one transition per member's tracked item", but
      DM-8's carrier is `{repoKey, pullRequest, merged, headSha?, branch,
      issueClosure?}`: it carries no tracked-issue identity, so no
      implementation can name "that member's tracked item". The coder resolved
      the gap by inventing an entity id (disclosed in the phase-4 pm-note, "no AC
      asserts the entity id"), and the fixture provider accepts any id
      (`tests/fixtures/closeout/harness.ts:186`), so
      `TC-XCLOSE-001` asserts `issueClosure: applied` for a transition that no
      real adapter could perform. Against a real GitHub/Jira adapter the same
      call would fail and be reported as `skipped-gap`, so the delivered column
      value is only reachable in a fake world, and the durable ledger records a
      transition against a non-existent entity. This is a specification defect
      (an unpinned input required by a pinned output), not only a code defect.
    suggestion: >-
      Reopen the specification: either add the member tracked-issue identity to
      DM-8 (e.g. `issue?: string`, supplied by the composition exactly like
      `headSha`) so the transition names a real item, or pin the behaviour for a
      member with no issue identity (`issueClosure: skipped-gap` with a named
      reason, and no operation). Then align the code, the fake provider (reject
      ids it does not know so the test proves the mapping rather than the fake's
      tolerance), the `ticket-to-done` evidence, and the closeout feature page,
      which currently repeats "one transition per member's tracked item".
    suppressed: false
    published_url: null
