  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: packages/core/src/domain/closeout.ts:632
    message: >-
      [M | owner: plan Phase 4] The member-mode `branch-cleanup` aggregate is
      `operations.length > 0 ? memberOutcomeFor(...) : "satisfied"`. When every
      declared member branch is absent, protected, or refused by the squash-safety
      predicate, no operation is planned and the step reports `satisfied` while
      each member reports `would-refuse` (plan) or `refused` (apply). Two
      consequences: a plan/apply run can print `branch-cleanup satisfied` with no
      branch deleted, and the delivered exit contract is bypassed —
      `runCloseout` fails with `closeout.branch.unsafe` when any step outcome is
      `refused` (closeout.ts:2616), and member mode never produces a `refused`
      step, so `closeout --apply` returns success data at exit 0 for the exact
      condition the delivered single-repository path treats as a failure. The
      analogous `ticket-to-done` aggregate does distinguish the case
      (`anyOpen || anyGap → skipped-gap`), so the two member steps disagree.
      AC-F5-3 only pins the member values and "the aggregate step outcome is not
      rewritten by either member value"; it does not pin how the member-mode
      aggregate is computed, so the current reading is defensible against the AC
      text but not against the delivered operator expectation.
    suggestion: >-
      Derive the member-mode branch aggregate from its members (e.g. `refused`
      when any member refused and none applied, `would-refuse` in plan mode,
      otherwise the current operation-derived value) so the aggregate never
      claims `satisfied` while a declared member is refused, and let the delivered
      `closeout.branch.unsafe` refusal stand for member mode. Pin the member-mode
      aggregate rule in DM-5/DEC-12 and in `feature-closeout.md`, and add a
      cell for "all members unsafe".
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: medium
    confidence: high
    category: error-handling
    location: packages/core/src/domain/closeout.ts:2544
    message: >-
      [M | owner: plan Phase 4] In apply mode the member step outcome is
      `applied > 0 ? "applied" : (_satisfied > 0 || failed === 0) ? "satisfied" :
      "skipped-gap"`. A member operation that fails is recorded per member and
      appended as `failed` to the ledger, but `earlierFailure` is not set and the
      step never becomes `failed`, so `steps.some(outcome === "failed")` is false
      and `runCloseout` returns success data. A member-mode `closeout --apply`
      whose branch deletion and tracker write both failed therefore exits 0 with
      `branch-cleanup`/`ticket-to-done` reported `skipped-gap`, where the
      delivered single-repository path returns `closeout.write.failed` with no
      data. Partial failure is honest per member but the command-level outcome
      under-reports it, and a partially applied closeout is indistinguishable
      from a successful one by exit code — the one signal automation reads.
      No AC covers an apply-mode member operation failure, so the current
      behaviour is un-pinned rather than contradicted.
    suggestion: >-
      Set the step (and command) failure when any member operation failed —
      keeping the per-member `skipped-gap` disclosure — or add the member failure
      to the existing `attention` projection so the exit class at least differs
      from a clean apply. Pin whichever choice in DM-5/DEC-12 and add an
      apply-mode test that asserts the exit code, not only the member value.
    suppressed: false
    published_url: null
    published_at: null
