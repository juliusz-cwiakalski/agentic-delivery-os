    location: packages/core/src/domain/verify-gates-members.ts:71
    message: >-
      [accepted-residual | origin: review-iter-1 F-6] `memberCiReading` still
      derives `gates.ci` only from the check-run page: detail resolved + hex head +
      non-empty page + every `run.jobs[0].jobState` in {succeeded, skipped} + at
      least one `succeeded` => `pass`; it ignores `pageItemCount`/truncation and
      the workflow's expected job set that the delivered `ci-green` gate uses
      (`ci-truncated`, `ci-missing-jobs`). A member that does not declare
      `ci-green` can therefore reach `gates.ci: pass` and `verdict: pass` on a
      partial/truncated page. This does not contradict the pinned DEC-4 `gates.ci`
      definition (a read on the member's pushed head), so it is not an AC
      violation, but it is a fail-open reading in a fail-closed change.
    suggestion: >-
      Fold the member reading over the same expected-job set and truncation rule
      as the delivered `ci-green` gate (or project that gate's verdict into the
      four-value vocabulary), map a truncated page to `unavailable`/`absent`, and
      add the partial-page cell. Until then, disclose it in the PR and track it as
      a follow-up.
    disposition: accepted-residual
    origin: F-6
    suppressed: false
    published_url: null
    published_at: null
