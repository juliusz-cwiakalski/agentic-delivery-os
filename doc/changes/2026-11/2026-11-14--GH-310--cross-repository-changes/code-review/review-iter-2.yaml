summary: >-
  Phase 6 closes the two iteration-1 blockers against the real contracts, not
  against the narrative. The cross-repository gate append now projects every
  member record to the delivered `{id, verdict, reason, citation}` ledger shape
  before the one `appendVerification` (DEC-22), and a real
  `appendMergeGateVerification` -> `readMergeGateVerifications` round trip over an
  audit store proves exactly one record, not `torn`, no `member` key, count =
  members x declared gates, and matching `verdict`/`reason`/`citation`; an
  unprojected record is refused with `state.store.torn`/`not_landed` and the
  history then reads `torn`. The member `ticket-to-done` transition now targets
  only `observation.issue` (DM-8), an absent `issue` schedules zero operations and
  reports `skipped-noop`, no `<changeRef>@<repoKey>` identity reaches any
  transition target, the change-level transition is always planned and folded with
  the members (DEC-23), and both member aggregates are the pinned mode-scoped
  worst-case fold so an all-unsafe set folds to `would-refuse`/`refused` and
  `closeout.branch.unsafe` is reachable. F-15/F-16 are consistent across code,
  spec and docs. No critical/high finding remains. Four medium and nine low/info
  residuals survive; none violates a delivered contract or produces a false
  success, and each is listed for PR disclosure (the AC-F5-2/AC-F5-3
  observability wording, the F-6 member CI reading, F-7 no read-bundle identity
  check, and the phase-6 commit subject are the ones a PR body must name).
