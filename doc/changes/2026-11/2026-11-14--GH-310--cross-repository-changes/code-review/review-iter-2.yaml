residuals:
  - >-
    AC-F5-3 apply observability: a refused member makes the DEC-23 aggregate
    `refused`, so `closeout --apply` returns `closeout.branch.unsafe` with no
    `data`; the member's apply value is not observable through the command
    response (plan-mode values, the refusal code, and the delete calls are
    asserted).
  - >-
    AC-F5-2 reachability: the data-bearing partial-landing apply holds only when
    the unmerged member's branch is already absent; a present unmerged branch is
    refused by the delivered squash-safety predicate and the aggregate folds to
    `refused`.
  - >-
    DEC-23 `failed` tier: a member operation failure fails the step and the
    command (`closeout.write.failed`, exit 2) with no `data`; the member's own
    value is a domain-only `skipped-gap`, and already-applied member operations
    persist.
  - >-
    F-6 fail-open member CI reading: `gates.ci` can be `pass` on a
    truncated/partial check-run page for a member that does not declare
    `ci-green`; not a DEC-4 violation, but a known limitation to disclose.
  - >-
    F-7 no member read-bundle identity check: a composition that returns a
    sibling member's bundle is not detected by the evaluator.
  - >-
    Commit hygiene: phase-6 source ships under a generic `docs(GH-310): update
    doc/changes/...` subject (empty body), not the plan-declared `fix(GH-310): ...`;
    most of the branch's commits share that placeholder pattern.
