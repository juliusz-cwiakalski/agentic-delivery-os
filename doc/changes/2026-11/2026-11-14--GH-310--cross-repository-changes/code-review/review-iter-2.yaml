  (1) The 6.1b posture derivation has no positive distinguishing cell: the real
  round trip asserts `{labels: [], ownerLabels: []}` and the shared work item
  carries no owner-attention label, so the change-level derivation is not
  distinguished from the old first-member citation. (2) No apply-mode cell
  asserts the per-member apply values in a refused aggregate (unobservable
  through the command; N-1) or the safe member's `cleanup: applied` value (only
  the delete call is asserted). (3) No cell covers a truncated/partial member
  check-run page (F-6) or a mismatched member read bundle (F-7). (4) The
  `projectCloseoutMemberCleanup("would-refuse","applied") -> refused` path is
  exercised only indirectly through the aggregate. Environment note: the only
  failing test in this review's run is `tests/checks/ci-baseline-parity.test.ts`,
  which fails because `git clone --local` cannot hardlink across the sandbox's
  `/tmp` filesystem (`Invalid cross-device link`); it is unrelated to GH-310.
