        Recorded under the owner directive CEO-D-073. The M1-S9 per-repository
        handover gate is no longer defined by elapsed time. Clean is the conjunction
        of four conditions: (a) zero false-success incidents and zero unresolved divergences
        on the repository's pilot paths; (b) dispatch evidence exercising
        every TDR-0005 result class on real tickets; (c) an exposure floor of at
        least 20 dispatches or at least 7 consecutive days, whichever comes first,
        where that either/or binds only the floor and never substitutes for class
        coverage, incident truth, or corroboration; (d) corroboration, where an
        engine-claimed success is never sufficient and a dispatch counts clean only
        when artifact and tracker truth agree.

