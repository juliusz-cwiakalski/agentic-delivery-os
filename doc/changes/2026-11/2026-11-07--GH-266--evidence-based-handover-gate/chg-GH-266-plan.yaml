# GH-266 implementation plan — Amend the M1-S9 handover gate to an evidence-based clean bar
#
# Plan revision: v1.0 (2026-11-07). Initial delivery plan.
#
# Sources (single source of truth):
#   - Spec:  ./chg-GH-266-spec.md (v1.0; F-1..F-5; 13 ACs
#     AC-F1-1..AC-NFR3-1; NFR-1..NFR-6; DM-1..DM-3; DEC-1..DEC-9;
#     RSK-1..RSK-8; NG-1..NG-5; §7.2 out-of-scope; §17.1 DoD;
#     §24 appendices with the verbatim superseded sentence and the
#     canonical eleven-token set).
#   - Test plan: ./chg-GH-266-test-plan.md (v1.0; 17 TCs
#     TC-GATE-001..017; 15 procedure blocks P0..P14 in §7.1; §7.2
#     TC-to-procedure map; §7.3 failure triage; §8.3 OQ-1..OQ-4;
#     §1.2 declared gaps G-1..G-3).
#   - PM notes: ./chg-GH-266-pm-notes.yaml (binding decisions: composite
#     bar, eleven-token resolution, two-file scope, history handling,
#     residual). Binding wording constraint recorded there: the eleven
#     classes must be backticked inside one paragraph that also contains
#     `noop-lane-nothing-to-do`, so the set comparison is mechanical.
#   - Repository truth inspected: doc/planning/oss-tooling/backlog.md
#     (M1-S9 entry, heading at line 529, definition at line 541),
#     doc/planning/oss-tooling/status.md (history at §"M0 exit amendment
#     and M1 re-planning (2026-11-03)", forward restatements at the
#     paragraph after "Milestone exit: pending" and item 3 of "Proposed
#     next steps", dated delivery section at EOF),
#     packages/core/src/contracts/delivery-result.ts
#     (DELIVERY_RESULT_TOKENS, eleven tokens),
#     scripts/.tests/test-doc-distribution.sh (doc/planning is outside
#     the closed scan set), scripts/checks/forbidden-literals.registry.json
#     (doc/userFacingDocs scans doc/planning; seed literals are
#     ados, ADOS_, ~/.ados), .ai/rules/*.md and
#     doc/documentation-handbook.md (no em-dash prohibition; the two
#     planning files use em dashes as house style).
#
# Change shape: docs-only, two product files, no runtime surface, no
# schema, no changeset, no doc/spec correction owed (spec §12 assumption;
# M1-S9/GH-239 is undelivered and feature-scheduling-engine.md excludes
# dispatch and handover). The plan therefore has three delivery phases:
# P1 backlog entry, P2 status entry plus pointers, P3 verification sweep
# and delivery evidence.
#
# TC-mapping obligation (all 17 TCs, each exactly once):
#   P1: TC-GATE-001, 002, 003, 004, 005, 010        (6)
#   P2: TC-GATE-006, 007, 008, 009, 011             (5)
#   P3: TC-GATE-012, 013, 014, 015, 016, 017        (6)
# (6 + 5 + 6 = 17; set difference against TC-GATE-001..017 is empty.)
# No split-completion markers are required: TC-GATE-009 is the only
# TC whose oracle spans both files, and its completing phase is P2,
# where both amended files first exist. P1 observes the backlog half
# through P3's d-corroboration check but claims no completing marker
# for TC-GATE-009.
#
# AC coverage (13/13, each AC appears once):
#   AC-F1-1  -> TC-GATE-001                    -> P1
#   AC-F1-2  -> TC-GATE-002, TC-GATE-003      -> P1
#   AC-F1-3  -> TC-GATE-004                    -> P1
#   AC-F2-1  -> TC-GATE-006                    -> P2
#   AC-F2-2  -> TC-GATE-007                    -> P2
#   AC-F2-3  -> TC-GATE-008                    -> P2
#   AC-F3-1  -> TC-GATE-009                    -> P2
#   AC-F4-1  -> TC-GATE-010                    -> P1
#   AC-F5-1  -> TC-GATE-005                    -> P1
#   AC-F5-2  -> TC-GATE-011                    -> P2
#   AC-NFR1-1-> TC-GATE-012, TC-GATE-017      -> P3
#   AC-NFR5-1-> TC-GATE-013, 014, 015          -> P3
#   AC-NFR3-1-> TC-GATE-016                    -> P3
#
# Spec/test-plan cross-check (findings recorded, none silently smoothed):
#   1. [NON-BLOCKING, plan constraint D-4] TC-GATE-009 requires the
#      backlog M1-S9 region to contain "pm-notes"; TC-GATE-010/P9 treats
#      every backticked lowercase literal in the enumeration paragraph as
#      a candidate token. If corroboration text with a backticked
#      `pm-notes` shares the paragraph that contains
#      `noop-lane-nothing-to-do`, P9 reports extra=1. Resolution: the
#      eleven-token enumeration is its own blank-line-delimited
#      paragraph, and the corroboration rule is a separate paragraph
#      that names pm-notes without backticks.
#   2. [NON-BLOCKING, plan constraint D-6] TC-GATE-007/P6 accepts the
#      literal `CEO-D-073` as a supersession-pointer marker, while
#      TC-GATE-006/P5 selects the FIRST `##` section whose body contains
#      `CEO-D-073`. A pointer that names the directive id would make P5
#      select the pointer's section and fail with missing markers.
#      Resolution: the two pointers say "superseded ... by the 2026-11-07
#      amendment below" and do NOT contain `CEO-D-073`; only the new
#      amendment section names the directive.
#   3. [RECONCILED, no action] Test plan §9 says "14 uncommitted inspection
#      procedures"; §7.1 has 15 blocks (P0..P14), but P0 is setup and
#      P1..P14 are the 14 inspections, of which P11..P13 are the three
#      guards. The PM notes say 15 blocks. The counts reconcile; this plan
#      uses P0..P14.
#   4. [INTERPRETATION, declared in D-2] Spec NFR-1 says "changed files
#      exactly 2"; test plan P1a measures product files with
#      `:(exclude)doc/changes/**`. The P3 evidence record is a change
#      artifact under doc/changes and is outside the product diff, which
#      is how the test plan already measures AC-NFR1-1.
#   5. [NON-BLOCKING] P9's "one paragraph, backticked tokens" form is a
#      derived testability requirement, not a spec sentence; the test
#      plan declares it (TC-GATE-010 preconditions) and the PM notes
#      record it. The plan pins it as a wording constraint.
#   6. [NON-BLOCKING] P4a's byte-identical AC..Depends block is stronger
#      than spec AC-F1-3's "unchanged"; both are compatible and the
#      plan takes the stronger oracle.
# No reopen-worthy contradiction was found between spec v1.0 and test
# plan v1.0. If the DoR gate disagrees, the only candidate for a test-plan
# note is finding 2 (P5 should say "the unique CEO-D-073 section"); the
# delivery is nonetheless deterministic under D-6.
#
# Delivery-planning decisions (placement, wording, sequencing; no
# behavioural deviation):
#   D-1 Ceremony. tier `lite` with mandatory escalation triggers, the
#       two-tier split required by operator requirement R10. All three
#       phases are delivery (lease-taking) under repo:main-tools and the
#       standard weight class; docs-only work needs no heavy weight and
#       no planning phase.
#   D-2 No test code. Every verification is one of the test plan's
#       uncommitted procedures, materialised under
#       /tmp/gh266-procedures/ by copy, never retyped and never committed.
#       NFR-1 forbids tests/**, scripts/**, and build-config changes; a
#       permanent branch-diff test would also violate the
#       testing-strategy rule that moving-base diff checks belong to
#       review gates. P3's delivery-evidence file lives under
#       doc/changes/** and is excluded by P1a, so AC-NFR1-1 still sees
#       exactly two product files.
#   D-3 Phase split. P1 is independently verifiable by the backlog
#       procedures; P2 by the status procedures; P3 by the containment,
#       guard, cross-file, and re-run sweep. Each phase lands one
#       Conventional Commit.
#   D-4 Paragraph boundaries in the M1-S9 entry. The current entry has no
#       blank lines. The amendment introduces exactly two: one before the
#       eleven-token enumeration paragraph and one after it. The
#       enumeration paragraph contains its lead-in sentence and the
#       eleven backticked tokens, nothing else. Corroboration (with
#       `pm-notes`) and the untouched Handover-flips sentence may share
#       the following paragraph.
#   D-5 No-wrap literals. P3's condition checks, P5, P8, and P14 test the
#       RAW text, not a flattened copy. Every multi-word literal named in
#       the phase tasks must therefore sit on one physical line. P2 and
#       the floor-scope half of P3 flatten whitespace; the rest do not.
#   D-6 Status placement and pointers. Append the new `##` section at
#       EOF, after the dated 2026-11-07 scheduling-engine section. Append
#       each pointer inside the existing paragraph/list item (no blank
#       line between the original sentence and the pointer) so P6 counts
#       the original statement as pointed, and keep every original
#       sentence verbatim. Pointers carry "superseded" but not
#       `CEO-D-073` (finding 2).
#   D-7 Invariants. backlog.md frontmatter byte-identical; status.md
#       gains no frontmatter; neither file gains an `ados_distribution`
#       marker (doc/planning is outside the closed distribution scope;
#       the guard's scan set is doc/guides, doc/templates, blueprints,
#       and the fixed standalone list); the M1-S9 heading is
#       byte-identical; the AC block and dependency line are
#       byte-identical.
#   D-8 Residual and non-goals. Do NOT edit the seven residual planning
#       documents listed in spec §7.2, operator-requirements-2026-11.md,
#       the GH-239 ticket body, the roadmap M0 exit criterion, or
#       doc/spec/**. Report the stale GH-239 body and those residual
#       documents in the PR or ticket comment, and state there that
#       `pr-open-unverified` was added on the authority of the normative
#       clause (DEC-3).
#   D-9 Commit and release. One Conventional Commit per phase through
#       @committer; subject `docs(GH-266): ...`; every body and footer
#       line <= 100 characters (CI commitlint is the authority; the
#       local hook is warn-only). PR targets `main-tools`.
#   D-10 Plan validation. The repository's `plan validate` logic is the
#       pure `validatePlan` over `readPlanArtifact`; no `plan` binary is
#       installed in this checkout. The artifact was validated with that
#       exact read+validate path on the parsed document (see the
#       validation record at the end of this header).
#
# Verification conventions (binding for every phase):
#   - Run from the repository root on branch
#     docs/GH-266/evidence-based-handover-gate.
#   - Materialise each procedure ONCE, verbatim by copy from
#     chg-GH-266-test-plan.md §7.1, as
#     /tmp/gh266-procedures/p00.sh .. p14.sh (P0..P14). Do not retype:
#     the literals in those blocks are the oracle.
#   - Run each gate with BASE=origin/main-tools in the environment
#     (e.g. `BASE=origin/main-tools bash /tmp/gh266-procedures/p03.sh
#     doc/planning/oss-tooling/backlog.md`). The P0 block also writes
#     /tmp/gh266-base-backlog.md and /tmp/gh266-base-status.md.
#   - Gates run at the phase HEAD, after the phase commit. A failing
#     gate blocks the next phase: fix inside the same phase's scope,
#     re-commit, re-run.
#   - Record the observed output line for every gate in the P3 evidence
#     file and in the PR body (test plan §6; spec §17.1 DoD).
#
# Validation record (2026-11-07, plan revision v1.0):
#   verdict=valid, readyForDevelopment=true, totalErrors=0,
#   artifact=chg-GH-266-plan.yaml (kind=yaml),
#   schemaVersion=delivery.plan.v1, tier=lite, phases=1..3.
#   Method: readPlanArtifact(changeRef GH-266, changesDirectory
#   doc/changes) + validatePlan with the repository `yaml` parser, i.e.
#   the exact composition `plan validate GH-266` invokes. 17/17 TCs
#   mapped exactly once; 13/13 ACs covered.
