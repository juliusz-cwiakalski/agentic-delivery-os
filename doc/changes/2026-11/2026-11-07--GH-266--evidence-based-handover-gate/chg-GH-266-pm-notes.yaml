decisions:
  - text: "Owner directive (CEO-D-073) redefines the M1-S9 handover gate 'clean' from a rolling two-week calendar window to an evidence-based bar. Amendment is docs-only and must not change any other story AC or dependency."
    date: "2026-11-07"
  - text: "PM decision (result-class set): the ticket's normative clause is 'every TDR-0005 result class'; its parenthetical list carries ten tokens and omits `pr-open-unverified`, which TDR-0005 and packages/core/src/contracts/delivery-result.ts both declare as one of the eleven classes. Resolution: the normative clause governs, so the amendment enumerates all eleven TDR-0005 classes including `pr-open-unverified`. Reversible (docs-only) and disclosed to the owner in a ticket comment at PR time."
    date: "2026-11-07"
  - text: "PM decision (composite clean bar): 'clean' is the conjunction of four conditions — (a) zero false-success incidents and zero unresolved divergences on the repository's pilot paths; (b) dispatch evidence exercising every TDR-0005 result class on real tickets; (c) the floor of >=20 dispatches OR >=7 consecutive days, whichever comes first; (d) corroboration — engine-claimed success never suffices, a dispatch counts clean only when artifact and tracker truth agree (pm-notes phases complete, tracker state, CI on the pushed head). 'Whichever comes first' governs only the floor, not class coverage or incident/divergence counts."
    date: "2026-11-07"
  - text: "PM decision (file scope): the amendment lands only in doc/planning/oss-tooling/backlog.md (M1-S9 entry) and doc/planning/oss-tooling/status.md, matching the ticket's explicit file scope. Secondary documents that restate the superseded two-week phrasing are left untouched and recorded as a declared residual (see risk note); the M0 exit criterion 'zero false-success incidents on pilot paths over two weeks' in roadmap.md is a different milestone gate and stays as written."
    date: "2026-11-07"
  - text: "PM decision (status.md history handling): the dated 2026-11-03 amendment sections are historical records and are not rewritten. A new dated amendment section records CEO-D-073 with the evidence-based bar and the corroboration rule, and the forward-looking statements that restated the two-clean-weeks rule gain explicit supersession pointers to it."
    date: "2026-11-07"
