    date: "2026-11-07"
  - text: "Test planning phase complete: chg-GH-266-test-plan.md v1.0 authored (17 TCs TC-GATE-001..017, 15 executable procedure blocks P0-P14, 13/13 ACs covered exactly once, no orphan TCs, 3 declared gaps). Every procedure was executed against the pre-change tree, so the plan's expected failures are falsifiable rather than asserted: P2/P3 detect the old definition, P5 finds no amendment, P6 finds two unpointed forward statements, P9's set comparison yields 11/0/0 on a synthetic amended paragraph and 10/missing-1 when `pr-open-unverified` is dropped, P11/P12 pass on base (doc guard exit 0, scope clean)."
    type: "info"
    date: "2026-11-07"
  - text: "Test-plan judgment call surfaced for the DoR gate: TC-GATE-010 requires the eleven classes to be backticked inside one paragraph that also contains `noop-lane-nothing-to-do`, so set comparison against DELIVERY_RESULT_TOKENS is mechanical. That constrains the delivery prose and is therefore recorded in the plan rather than discovered at review."
    type: "info"
    date: "2026-11-07"
  - text: "Scope review against current system spec: no doc/spec/** feature spec describes dispatch or the handover gate yet (M1-S9/GH-239 is undelivered; feature-scheduling-engine.md explicitly excludes dispatch and handover, and feature-verify-change-and-exit-taxonomy.md owns the TDR-0005 token vocabulary). The amendment is therefore planning-truth only and touches no delivered system contract."
    type: "info"
    date: "2026-11-07"
  - text: "Current M1-S9 text to amend: backlog.md states 'Clean is defined: a rolling two-week window with zero false-success incidents and zero unresolved divergences on the repository's pilot paths' (M1-S9 Tasks, phase (b)) with the AC 'handover is refused while the repository's clean window is unmet and offered when met'. The Tasks definition and the AC's 'clean window' wording are what this change redefines; the AC sentence itself stays."
    type: "info"
    date: "2026-11-07"
  - text: "DOC RISK (phase 7 / declared residual, deliberately out of the ticket's file scope): these still describe the superseded two-week phrasing for the M1-S9 gate — backlog-ranking.md (rank 39 dwell-time note), roadmap.md (M1 sequencing constraint 6, line ~121, and the M1 exit-evidence table row for M1-S9 marked 'final two weeks'), cli-command-registry.md (dispatch row and deliver-ticket.sh row), milestones/m1/commands/dispatch.md (DESCRIPTION), milestones/m1/journeys.md (line ~83), user-journeys.md (J4 and J1 lines), milestones/m1/test-scenarios.md (SC-M1-29 'clean window met (two weeks...)' and SC-M1-30), and operator-requirements-2026-11.md (a dated historical operator-input record that must never be rewritten). None is a story AC or dependency of another story. The spec records them as out of scope; the ticket comment at PR time lists them for an owner decision."
    type: "risk"
    date: "2026-11-07"
  - text: "Governance observation: GH-239 (the M1-S9 ticket) quotes the current two-week definition verbatim in its body and pins it in 'Pinned decisions and clarifications'. After this change the ticket body is stale. Editing another ticket's body is outside this change's scope, so the discrepancy is reported to the owner in a comment rather than silently rewritten."
    type: "risk"
    date: "2026-11-07"
  - text: "Owner-facing consequence to state in the docs: the corroboration rule makes an engine result token insufficient evidence by itself — a `merged` claim counts only with the pushed head, CI on that head, tracker state, and completed pm-notes phases; a `pr-open` or `blocked` claim counts only with the tracker fact. This is the 'engine-claimed success is never sufficient' safety rule the ticket requires."
    type: "decision"
    date: "2026-11-07"
  - text: "Specification phase complete: chg-GH-266-spec.md v1.0 authored (5 F, 13 ACs, 6 NFRs, 9 DECs, 8 RSKs, 5 NGs, 0 open questions, §17.1 Definition of Done). Shape decisions: the amended M1-S9 heading stays byte-identical (anchor stability); the AC sentence 'refused while the clean window is unmet and offered when met' stays as written while the definition of `clean` changes; the status amendment names the declared residual rather than hiding it; class coverage is bound to DELIVERY_RESULT_TOKENS as a set comparison so the eleven-token enumeration is mechanically checkable."
    type: "info"
    date: "2026-11-07"
  - text: "RETRO: appending the test-planning notes used a non-unique two-line anchor (`type`/`date`) with replace-all, so the same two notes were inserted four times, and a follow-up repair edit then truncated the specification-phase note mid-sentence. Both defects were caught by reading the file back and by the committer's YAML validation before any commit existed, so no bad state reached history. Improvement: append notes at end of file, and validate the YAML after every notes edit."
    type: "retro"
    date: "2026-11-07"
  - text: "Delivery planning phase complete: chg-GH-266-plan.yaml authored as delivery.plan.v1 (tier lite, 3 phases P1-P3, 17/17 TCs mapped exactly once, 13/13 ACs mapped, per-phase test-gate procedures drawn from the test plan). Repository plan validator verdict: valid, readyForDevelopment true, 0 errors. Prose-level encoding decisions: the M1-S9 amendment is one phase and the status amendment is another so each is independently committable; the P3 verification phase writes verification evidence under the change folder (not a product file) so AC-NFR1-1 still sees exactly two product files."
    type: "info"
    date: "2026-11-07"
  - text: "Plan cross-check findings (non-blocking, encoded in the plan rather than smoothed over): (1) the status pointer wording must not carry the CEO-D-073 id, otherwise P5's first-section selection picks the pointer section instead of the amendment; (2) the eleven-token enumeration must be its own blank-line-delimited paragraph with only the eleven backticked literals, otherwise P9 reports an extra token and TC-GATE-009 needs `pm-notes` in the backlog region; (3) the plan interprets AC-NFR1-1 as 'two product files' and treats the P3 evidence record under doc/changes/** as outside that set. No spec-vs-test-plan contradiction requires reopening an upstream artifact."
    type: "info"
    date: "2026-11-07"
  - text: "DoR iteration 1: NOT_READY — 7/10 facets PASS (ac_quality, decision_capture, system_spec_consistency, plan_doc_update_coverage, plan_code_area_coverage, dod_defined, plus plan_coverage with minor gate omissions); spec_completeness, test_traceability and cross_artifact_consistency FAIL. Record: readiness-review/readiness-iter-1.md. Three blocking findings: (1) critical spec_completeness — the ticket's 'no other story AC or dependency is modified' has no AC, and AC-NFR1-1 checks only file paths, so a one-line edit to another story would pass; (2) critical test_traceability — TC-GATE-004 claims no other story's AC/Depends lines appear in the diff but its steps and P4 inspect only the M1-S9 block; (3) major cross_artifact_consistency — plan task 1.1 and the task 1.5 reference text disagree on whether the envelope sentence 'and the evidence-based clean bar met.' stays, and no gate catches the resulting broken grammar. Non-blocking findings recorded: P7c normalises whitespace while AC-F2-3 claims byte identity; the forbidden-literals guard never scans backlog.md so half of AC-NFR5-1 is vacuous; P2 omits p00 and P1 omits p08 from their phase gates; AC-NFR1-1's literal 'exactly two files' is unsatisfiable given doc/changes/**; the 2026-11-03 'per-engine handover' bullet is left unadjudicated."
    type: "info"
    date: "2026-11-08"
  - text: "DoR iteration 1 remediation routing: reopened specification (blocking finding 1 plus non-blocking findings 4, 8-11), test_planning (blocking finding 2 plus 4, 5), delivery_planning (blocking finding 3 plus 6, 7, 12). Sequence: spec v1.1 -> test plan v1.1 -> plan v1.1 -> dor_check iteration 2. Max 3 iterations. The reviewer confirmed DEC-3 (eleven tokens) and DEC-5 (declared residual) are defensible and properly disclosed, so neither upstream decision reopens."
    type: "decision"
    date: "2026-11-08"
  - text: "RETRO: the DoR gate caught a class the authors kept missing: a requirement stated in the ticket's Unchanged clause ('no other story AC or dependency is modified') was never turned into an AC, because both spec and test plan reasoned about the file list rather than the content invariant. The invariant was only indirectly covered by a TC whose stated oracle was broader than its steps. Improvement: when a ticket has a preservation clause, give it its own mechanically checkable AC (here: a diff-hunk restriction over every other story block in backlog.md) and make the TC's steps as broad as its oracle."
    type: "retro"
    date: "2026-11-08"
