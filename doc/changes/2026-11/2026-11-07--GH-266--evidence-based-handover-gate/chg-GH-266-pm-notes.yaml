notes:
  - text: "Intake state: GH-266 open with label `change` only, zero comments; no PR (open or closed) for docs/GH-266/evidence-based-handover-gate. Branch exists locally, worktree clean, zero commits ahead of origin/main-tools (f87ec185) — a fresh start, so no resume merge and no review threads to process."
