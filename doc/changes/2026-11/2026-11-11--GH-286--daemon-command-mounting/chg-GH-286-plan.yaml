  # ---------------------------------------------------------------------------
  # Phase 2 — Production composition: one state-directory scope with its three
  # outcomes, resolved settings, composed transport, real pid, entry path and
  # re-entry environment, unconditional runtime
  #
  # Goal: turn the delivered-but-unreachable family into a composed one. The
  # production composer classifies the state directory through
  # `resolveStateDirectoryScope` into exactly three outcomes — an absolute
  # override wins; otherwise the home default applies only when a home exists
  # (the previous home-based value is kept when a non-absolute override is
  # invalid); otherwise the directory is unresolvable and the family is mounted
  # over an unavailable runtime — uses that one value for the store, the daemon
  # lock, the daemon settings, the control socket, the supervisor scope, the
  # re-entry binding, and the edge's own
  # reported directory, resolves daemon settings through `resolveDaemonSettings`
  # over that directory with an empty-branch fallback, composes the delivered
  # unix transport at the resolved socket path with an ownership predicate that
  # reports the lock held by this process, resolves the restart bound from
  # `lane.restart-budget` (shipped default on failure), and composes a daemon
  # runtime UNCONDITIONALLY — the full runtime in outcomes (a) and (b), the
  # unavailable refusal runtime in (c) — with the entry path, the composing pid,
  # the injected
  # signal host, the supervisor pass-through, and the merged re-entry
  # environment.
  #
  # Dependency reasoning: registration must precede prompt-required membership,
  # because `selectPromptRequiredProgram` throws when a prompt-required command
  # has no runtime and the entrypoint contains that throw as
  # `fallback.internal`; the program registers the family as soon as the runtime
  # is supplied, so the composition is verifiable now while the help, coverage,
  # and conformance surfaces land in Phase 6. Bare-start re-entry, the readiness
  # poll, and the cross-process signal path are delivered and consume the
  # composed executable entry path (`daemonEntry`, not `runEntrypoint`) this
  # phase supplies, which is why the detached-start,
  # re-entry-environment, state-directory, and status TCs are provable at this
  # handler-level gate rather than in Phase 4. Selection through
  # `selectPromptRequiredProgram` is NOT a Phase-2 claim: TC-DAEMON-015 owns it
  # at the Phase-6 gate (invocation-shape rule). The re-entry environment is
  # derived here (task 2.4) and merged into the spawn request here (task 2.6),
  # because both edits are the
  # one composition contract TC-DAEMON-040 pins and because the delivered spawn
  # otherwise replaces the child environment with a single variable. The hermetic
  # environment cases (TC-DAEMON-040/041) and the unresolvable outcome
  # (TC-DAEMON-054) are pure
  # composition and start-outcome proofs over the recording process port, the
  # recording supervisor fact, and the filesystem; the one
  # real-child case (TC-DAEMON-039) stays in Phase 4 because its
  # `daemon start --foreground` child only stays alive once the signal-owned
  # lifetime exists.
  #
  # Tasks (TC-DAEMON-030, 031, 032, 040, 041, 050, 051, 052, 053, 054, 060, 061,
  #        062, 063, 090, 122):
  #  2.1 Classify and resolve the state directory once, into exactly one of three
  #      outcomes (DM-5, DEC-5, DEC-18, AC-F3-1, AC-F3-4, AC-F3-5, AC-F2-10):
  #      (a) an absolute `<PREFIX>_STATE_DIR` override from the injected
  #      environment record wins outright; (b) otherwise the home-based
  #      `${homeDirectory}/${brand.stateDirectoryName}` applies ONLY when the
  #      composed home is non-empty, and that home-based value is kept when a
  #      non-absolute override fails resolution, so the delivered edge keeps
  #      reporting the invalid value (`config.value.invalid`) exactly as before;
  #      (c) otherwise — no override and no home — the directory is unresolvable
  #      and the composer supplies an **unavailable daemon runtime**: a local,
  #      non-exported branch in `production.ts` whose `start`/`stop`/`status`/
  #      `loop`/`install`/`uninstall` handlers all return the delivered
  #      `config.value.invalid` failure (projected exit `1`, `user-validation`),
