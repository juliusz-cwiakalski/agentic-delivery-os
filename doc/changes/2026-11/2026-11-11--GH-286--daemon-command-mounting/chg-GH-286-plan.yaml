#   stay read-only controls). An ad-hoc
#   fixture file in the flat `tests/fixtures/daemon/` directory or a third
#   subfolder is a plan
#   deviation, because the commit primitive stages only what a phase declares and
#   an undeclared fixture would be stranded.
#   MUTANT INVENTORY (equal to test plan §6; no more and no fewer): exactly
#   twenty-one modules, one per declared name —
#     Phase 2: binding-not-last, spawn-without-forwarded-env, spawn-with-full-env,
#              literal-socket
#     Phase 3: bare-execstart, unit-under-state-dir, xdg-relative-joined,
#              install-empty-executable, uninstall-broad-delete
#     Phase 4: signal-without-pid-check, signal-negative-pid,
#              duplicate-terminal-record, release-skip-cancellation,
#              holder-not-removed
#     Phase 5: hardcoded-degradation, captured-degradation,
#              fabricated-reachability, stale-inclusive, owner-ignored
#     Phase 6: conditional-registration, help-composer-invoked
#   Each module is created and consumed by `tests/checks/daemon-mutants.test.ts`
#   inside the one phase that declares both. A mutation a case applies to its own
#   temp copy (TC-DAEMON-054 step 9's root-level-template mutation) is case-local
#   and adds no module, so the declared inventory stays at twenty-one.
#
# PINNED CONTRACTS BINDING ON EVERY PHASE (do not reshape at delivery):
#   - Additive composition only. `DaemonComposition` gains exactly three optional
#     inputs (`pid?`, `signalHost?`, and one re-entry environment input carrying
#     the additional variables the detached child receives);
#     `ProductionCompositionFacts` gains exactly two optional facts (`daemonEntry?`,
#     `supervisor?`); `QueueComposition.degraded`
#     widens to `readonly QueueDegradationReason[] | (() => readonly QueueDegradationReason[])`.
#     No existing field is renamed, retyped, or made required; no exported
#     signature narrows; the command definition, grammar
#     (`--foreground`, `--live`, `--mode`), and envelope shapes are unchanged.
#   - Zero new modules and zero new exported symbols in `packages/**`. Every edit
#     lands in existing modules (`production.ts`, `bin/delivery-os.ts`,
#     `daemon-compose.ts`, `edge.ts`, `help.ts`, `help/prompt-required-commands.ts`),
#     so `tests/structure/inventory.json`, `EXECUTABLE_ALLOWANCES` in
#     `tests/structure/content-inventory.test.ts`, and
#     `tests/fixtures/ports/v1-contract-inventory.json` stay byte-identical
#     controls. A new module or export is an escalation trigger, not a phase edit.
#   - Byte-identical delivered degradation. An array-valued `degraded` produces
#     the same bytes on `queue list`, `queue plan`, `lanes list`, and every queue
#     mutation; an omitted `degraded` keeps the `["daemon-unreachable"]` fallback;
#     the resolver is consulted per projection (schedule, mutation outcome, lanes
#     read, every watch iteration).
#   - Re-entry environment (TDR-0022 DC-1, amended): the detached child's
#     environment is the resolved `<PREFIX>_STATE_DIR` binding (authoritative,
#     written LAST) plus the composing `PATH`, its `HOME`/`USERPROFILE`, and the
#     brand working-name override only when set and non-empty — merged through the
#     one optional composition input, derived from the facts the composer already
#     holds (no ambient read). Omitting the input keeps the delivered
#     single-variable spawn. Forwarding is not repair: a caller that stripped
#     `PATH` or `HOME` is never given one back, and the child fails closed as
#     `daemon.state-recovery-failed` at exit 2 with nothing acquired and no
#     root-level state path. The installed unit keeps its single
#     `Environment=` binding; the re-entry set is a spawn concern only.
#   - Durable reachability predicate (one rule, one bound): reachable iff an
#     instance record exists AND its latest operation is `acquired` or
#     `taken-over` AND the latest heartbeat's `instanceId` equals that instance's
#     identity AND `now - beatAt < lockStalenessMs` (STRICT; an age equal to the
#     bound is stale, because the delivered fold at
#     `packages/core/src/domain/daemon-heartbeat.ts:63` uses
#     `ageMs >= stalenessMs ? "stale" : "running"`); otherwise exactly
#     `["daemon-unreachable"]`. Declared divergence: an unowned heartbeat — no
#     instance record at all, or one naming another instance — yields
#     `daemon-unreachable` while the delivered fold reports `running` for the same
#     store and instant. That divergence is intentional (queue/lanes need an owner
#     because a heartbeat nobody owns can be neither drained, signalled, nor
#     reconciled) and must never be "harmonised" by dropping the owner rule
#     (AC-F5-6 over owned-or-heartbeat-less stores, AC-F5-8 over the unowned
#     family). No socket connect, process probe, or sleep on this read path — the
#     zero-connect claim is confined to queue/lanes degradation and does NOT
#     describe plain `daemon status`, which probes the composed transport; a
#     torn/unreadable daemon read degrades, never throws and never fabricates
#     reachability; an unreadable queue store keeps its own delivered `state.*`
#     identity.
#   - Real pid and fail-closed stop. The composing pid is forwarded only when it
#     is a positive integer; a durable record whose pid is `0`, negative,
#     fractional, or torn refuses cross-process `stop` with
#     `daemon.state-recovery-failed` exit 2 and makes ZERO process-port `signal`
#     calls. `drain` -> `SIGTERM`, `immediate` -> `SIGINT`, that pid only, never
#     a group or a name/pattern.
#   - Foreground lifetime. With a composed signal host and `--foreground`: start,
#     capture the readiness snapshot, install `SIGINT`/`SIGTERM`, run the
#     resident loop, stop with the mode the first signal selects, remove both
#     listeners in a `finally`, await the loop, return the captured snapshot (or
#     the stop failure). Cancellation precedes the release append. One stop and
#     one terminal instance record per invocation. No signal host -> the
#     delivered in-process readiness return, no resident loop.
#   - One state-directory scope with exactly three outcomes (AC-F3-4, AC-F3-5,
#     AC-F2-10, DM-5, DEC-5, DEC-18). `resolveStateDirectoryScope` is the single
#     resolution and the composer classifies its input once: (a) an absolute
#     `<PREFIX>_STATE_DIR` override wins outright; (b) otherwise the home-based
#     `<home>/<brand.stateDirectoryName>` applies ONLY when a home exists, and
#     that home-based value is kept when a non-absolute override is invalid, with
#     the invalid value still failing where the resolution edge already reports
#     it (`config.value.invalid`); (c) otherwise — no override and no home — the
#     directory is UNRESOLVABLE: the `daemon` family stays registered and
#     selectable over an unavailable runtime whose every subcommand returns the
#     delivered `config.value.invalid` at exit `1` (`user-validation`), opening no
#     store, lock, settings, transport, socket path, supervisor scope, entry path,
#     or pid and never reading, creating, or probing a `/<stateDirectoryName>`
#     path. Non-daemon commands keep the delivered home-based template unchanged.
#     The resolved value feeds the store, lock, settings, socket, supervisor
#     scope, re-entry environment, unit binding, and read side. No `--state-dir`
#     flag and no daemon state-directory configuration key.
#   - Install identity. `ExecStart=<absolute entry path> daemon start --foreground`;
#     unit `${brand.binaryName}-daemon.service`; directory `XDG_CONFIG_HOME` when
#     absolute and non-empty else `<home>/.config`; `Environment=` binds the exact
#     `<PREFIX>_STATE_DIR` name to the resolved directory; scope is the delivered
#     digest of that directory. `binary` is a required composition field with no
#     default, so the refusal guard keys on entry-path absence only: no composed
#     entry path -> refuse (`daemon.state-recovery-failed`, exit 2) before
#     rendering any unit, so no unit is ever written with an empty `ExecStart`.
#   - Unchanged identities and schema. No error-table row added, removed, or
#     reworded; every reached identity is a delivered row; `STATE_SCHEMA_VERSION`
#     stays `delivery.state.v1`; no record kind, payload schema, migration, or
#     backfill; the only record-shape change is the VALUE of `daemon.instance.pid`.
#     Every path exits only `0`, `1`, or `2`.
#   - No new package dependency, listener, network egress, credential read, or
#     ambient environment read outside the injected facts. `--help`/`--version`
#     stay pure (0 composer invocations, 0 reads, 0 writes).
#   - Phase 2 registers the daemon runtime; Phase 6 makes it prompt-required.
#     The order is load-bearing: `selectPromptRequiredProgram` throws when a
#     prompt-required command has no runtime, so prompt-required membership may
#     never precede the composition, and the guard surfaces (help entry,
#     coverage inventory, coverage-suite enumeration, conformance page list) must
#     land in the same commit as the membership that turns them red.
#   - The docs phase must not introduce the literals `state command`,
#     `mcp command`, `dispatch command`, or `daemon command` into any page in
#     `FULL_PHRASE_PAGES`/`GENERIC_PHRASE_PAGES` of
#     `tests/checks/doc-conformance.test.ts`; `feature-cli-entrypoint.md` and
#     `feature-resident-daemon.md` are outside that set, so their reconciliation
#     is safe, and `feature-agents-and-commands.md` is not edited here.
#
# DELIVERY MODEL: one commit per phase on feat/GH-286/daemon-command-mounting;
# each phase boundary leaves the declared narrow gate green, so the repository is
# green at every boundary and the final battery only re-runs what each phase
# already proved. Extra phase data (tasks, verification commands, exit criteria)
# is carried in YAML comments so the parsed document stays schema-strict: the
# plan declares phases and scope only and records no progress.

schemaVersion: delivery.plan.v1
workItemRef: GH-286
tier:
  name: full
  phases: [1, 2, 3, 4, 5, 6, 7, 8]
  escalationTriggers:
    - "The mount requires a new module, a new exported symbol, a new package subpath, or a new dependency (inventory.json, EXECUTABLE_ALLOWANCES, or exports parity would have to change)"
    - "The command grammar, an envelope shape, an error-table row, a record kind, a payload schema, or STATE_SCHEMA_VERSION would have to change to satisfy an AC"
    - "A prompt-required guard (help-guide-coverage, reference-page parity, doc conformance) can only be made green by relaxing an expectation instead of adding the daemon row and the page's help section"
    - "The state-directory resolution would have to move or migrate existing state, or a second state-directory resolution would have to remain"
    - "A delivered suite needs a semantic assertion change beyond the five permitted update sites derived from the tree (AC-F8-4, GAP-T1)"
    - "A resolver read would have to gain a socket connect, a process probe, a sleep, or more than two additional daemon-fact reads per projection"
