  # ---------------------------------------------------------------------------
  # Phase 5 — Degradation resolved per projection from durable daemon state
  #
  # Goal: replace the hardcoded marker with a derived fact in both directions.
  # `QueueComposition.degraded` accepts an array or a resolver; the queue
  # schedule, the mutation outcome, the lanes read, and every watch iteration
  # resolve it; the production composer supplies the durable predicate; the
  # array member and the absent fallback stay byte-identical.
  #
  # Dependency reasoning: the predicate reads the instance and heartbeat records
  # that Phases 2-4 make truthful (a real pid and a real release are what make
  # "reachable" mean anything), and it must use the same configured
  # lock-staleness bound and the same STRICT comparison the status fold uses,
  # which Phase 2 already wires. It
  # is independent of the help/mount work, so it lands before the mount so that
  # the mount commit does not mix a behaviour change into a registration change.
  #
  # Tasks (TC-DAEMON-070, 071, 072, 073, 074, 075, 076, 077, 078, 112, 120):
  #  5.1 packages/cli/src/edge.ts: resolve `degraded` at every projection instead
  #      of capturing it: the schedule read, the mutation outcome, the lanes read,
  #      and each watch iteration call the value when it is a function and use
  #      the array verbatim when it is an array; an absent value keeps the
  #      delivered `["daemon-unreachable"]` fallback (DM-3, AC-F8-3). No socket
  #      connect, process probe, or sleep on this read path.
  #  5.2 Supply the durable reachability predicate from the production
  #      composition (DM-4), as the single rule:
  #        instance exists
  #        AND operation ∈ {acquired, taken-over}
  #        AND heartbeat.instanceId === instance.instanceId
  #        AND (now - beatAt) < lockStalenessMs      <- STRICT
  #      -> `[]`; otherwise exactly `["daemon-unreachable"]`. The comparison is
  #      strict because the delivered fold
  #      (`packages/core/src/domain/daemon-heartbeat.ts:63`) is
  #      `ageMs >= stalenessMs ? "stale" : "running"`, so an age EQUAL to the
  #      bound is stale on both surfaces; an inclusive form would make the two
  #      disagree at exactly that cell. An unowned heartbeat — no instance record,
  #      or a latest heartbeat naming another instance — degrades while the
  #      delivered fold reports `running`; that divergence is DELIBERATE and must
  #      never be harmonised away, because queue/lanes need an owner (a heartbeat
  #      nobody owns can be neither drained, signalled, nor reconciled) while the
  #      fold answers a liveness question only (AC-F5-6 over owned-or-heartbeat-
  #      less stores, AC-F5-8 over the unowned family, DEC-7).
  #      A torn, unknown, malformed, missing-instance, foreign-instance,
  #      orphan-heartbeat, or unreadable read degrades instead
  #      of throwing and never fabricates reachability.
  #  5.3 Tests: tests/behaviour/daemon-degradation-projection.test.ts (the live
  #      and taken-over directions on both reads; released and immediate-stop
  #      with a deliberately fresh
  #      heartbeat; verified-empty and orphan-heartbeat fixtures at exit 0;
  #      stale by 1 ms plus the at-bound control (age exactly equal to the
  #      configured bound lands on the DEGRADED side, matching the fold's
  #      `stale`) and the doubled-staleness flip
  #      proving the bound is configuration-driven; the three-iteration watch
  #      flip in both directions with one resolver call per iteration and no real
  #      sleep; the 17-cell matrix over the domain AC-F5-6 states — four
  #      operations × four heartbeat states where the heartbeat is owned or
  #      absent, plus the no-instance-and-no-heartbeat cell — asserting the
  #      agreement invariant with the status fold and its doubled-staleness
  #      re-run, with a cell-set assertion proving the unowned cells are excluded
  #      rather than omitted; the TC-DAEMON-078 divergence case: an orphan
  #      heartbeat and a foreign-owner heartbeat, each with a beat strictly inside
  #      the bound, yield `["daemon-unreachable"]` from both reads while the
  #      delivered status fold reports `running` for the same store and instant,
  #      asserted in one body so neither side can be "fixed" silently, and
  #      re-asserted under doubled staleness so ownership — not freshness — is
  #      the cause; the
  #      five corrupt fixtures asserting the marker, no throw, zero
  #      socket/probe/sleep, no repair, and a permission-denied queue store still
  #      failing through its own `state.*` identity at exit 2; the additivity
  #      triple comparing array-valued, omitted, and resolver payloads with the
  #      recorded baselines, including the "array is not re-resolved" and "union
  #      dispatches" pair); tests/structure/daemon-degradation-wiring.test.ts
  #      (production composition yields `[]` on a live store and
  #      `["daemon-unreachable"]` on a released one, a source scan finds no
  #      literal array-valued `degraded` in `production.ts` and the value is a
  #      function, the resolver is not memoized across stores, and the
  #      `hardcoded-degradation`/`captured-degradation` mutants trip by file and
  #      name); tests/behaviour/daemon-degradation-read-cost.test.ts (at most two
  #      ADDITIONAL daemon-fact reads per projection beyond what the projection
  #      already reads, zero transport connects, zero
  #      `isAlive`, zero sleeps, a same-run p95 baseline within 10%, and an
