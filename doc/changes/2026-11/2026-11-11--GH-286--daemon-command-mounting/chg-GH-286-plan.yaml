#   Suites that stay one file per family per the test plan:
#     daemon-mount-help.test.ts, daemon-foreground-stop-latency.test.ts,
#     daemon-degradation-read-cost.test.ts, daemon-degradation-wiring.test.ts,
#     daemon-start-env-stripped.test.ts (TC-041: the fail-closed stripped-caller
#     case owns its own directory-listing and restored-environment controls, so it
#     is not folded into the happy-path spawn suite),
#     tests/conformance/daemon-mount/real-reentry.test.ts,
#     tests/types/daemon-mount.type-test.ts, tests/checks/daemon-privacy.test.ts.
#   The delivered suites the test plan marks as controls are executed at the
#   declared gates WITHOUT a scope declaration: a control that needs an edit is
#   a defect against AC-F8-4, not a plan amendment (GAP-T1).
#   Fixture scope is enumerated, not swept: `tests/fixtures/daemon/mount-harness.ts`
#   and `tests/fixtures/daemon/mount-states.ts` are the only flat fixture modules,
#   and exactly two subfolders are declared —
#   `tests/fixtures/daemon/mount-mutants/` (one module per mutant, created in
