#          daemon-stop-signal-target.test.ts (TC-036, 091, 092)
#     tests/behaviour/daemon-degradation-projection.test.ts
#       <- queue-degradation-derived.test.ts, lanes-degradation-derived.test.ts,
#          daemon-degradation-watch.test.ts, daemon-degradation-agreement.test.ts,
#          daemon-degradation-torn.test.ts, daemon-degradation-additivity.test.ts
#          (TC-070..076, 078, 112)
