# INVOCATION-SHAPE RULE (RF3-1; binding on every gate and exit criterion below):
#   `PROMPT_REQUIRED_COMMANDS` holds the delivered 16 commands until the
#   Phase-6 membership commit (task 6.1), and `selectPromptRequiredProgram`
#   (`packages/cli/src/entrypoint.ts:134-149`) returns exactly that set and
#   drops extras, while `runEntrypoint` calls it on every invocation. Any
#   `daemon` invocation routed through `runEntrypoint` therefore answers
#   `fallback.internal` at exit 2 until that commit. The phases are partitioned
#   by invocation shape:
#     - Phases 2-5 prove HANDLER behaviour only: the composed program's
#       `daemon` command handler is invoked directly, or `runCli` is called with
#       that same composed program. No Phase 2-5 gate goes through
#       `runEntrypoint`, and no Phase 2-5 case asserts
#       `selectPromptRequiredProgram`, selection, or `fallback.internal`. A
#       Phase 2-5 case that needs `runEntrypoint` is a PLAN DEFECT: the correct
#       move is to add the missing assertion to TC-DAEMON-015 (or to move it to
#       a later phase), never to weaken the assertion or to commit a red
#       boundary.
#     - Phase 6 proves SELECTION and CONTAINMENT through `runEntrypoint`, in
#       TC-DAEMON-015, which supersedes the selection half Phases 2-5 must not
#       assert. Phase 8 re-runs the same suite inside the full battery.
#   Terminology is load-bearing: "registered" is true from Phase 2
#   (`program.commands.daemon` is defined on every composition), while
#   "selectable"/"selected" is true only from Phase 6. No Phase 2-5 gate or
#   exit criterion may claim selection or use "selectable" as a gate property.
