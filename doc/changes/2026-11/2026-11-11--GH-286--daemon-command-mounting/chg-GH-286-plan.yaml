phases:
  # ---------------------------------------------------------------------------
  # Phase 1 — Additive composition inputs and the binding decision record
  #
  # Goal: land the additive contract surface every later phase consumes, and
  # land the untracked TDR-0022 in the first phase-mode commit. Nothing changes
  # behaviour: no caller supplies the new inputs yet, so the delivered daemon
  # path is byte-identical and `daemon` is still not reachable from the shipped
  # program (production composes no runtime until Phase 2).
  #
  # Dependency reasoning: a contract-first phase keeps every later phase a pure
  # consumer; pid forwarding can be proven inert here (no caller), and the union
  # widening is type-level only until Phase 5 implements per-projection
  # resolution. The TDR is the only untracked artifact in the change and must
  # not be stranded, so it shares this commit.
  #
  # Tasks:
  #  1.1 packages/cli/src/daemon-compose.ts: add `pid?: number`, `signalHost?: {
  #      once(event: "SIGINT" | "SIGTERM", listener: () => void): void;
  #      removeListener(event, listener): void }`, and one optional re-entry
  #      environment input carrying the additional child variables (the composing
  #      `PATH`, its home, and the brand working-name override) to
  #      `DaemonComposition` (DM-1), and forward `pid` into the delivered
  #      `createDaemonRuntime` ports so an instance record carries the composing
  #      pid instead of the engine's `0` fallback (DEC-8). This phase declares the
  #      re-entry environment field and its shape ONLY: no code path in this phase
  #      reads it, so the delivered single-variable spawn at
  #      `packages/cli/src/daemon-compose.ts:671-675` stays byte-identical and
  #      omitting the input changes nothing. The spawn path that consumes the field
  #      is edited in Phase 2, which declares `packages/cli/src/daemon-compose.ts`
  #      in its own `scope.files` (task 2.6); the lifetime path that consumes
  #      `signalHost` is edited in Phase 4. No other field, default, or code
  #      path changes.
  #  1.2 packages/cli/src/production.ts: add `daemonEntry?: string` and
  #      `supervisor?: SupervisorPort` to `ProductionCompositionFacts` (DM-5).
  #      Both optional; every existing fact keeps its name, type, and meaning.
  #  1.3 packages/cli/src/edge.ts: widen `QueueComposition.degraded` to
  #      `readonly QueueDegradationReason[] | (() => readonly QueueDegradationReason[])`
  #      (DM-3) without touching any consumer: the delivered capture points keep
  #      their array semantics until Phase 5 adds per-projection dispatch, so the
  #      array member and the absent fallback stay byte-identical (AC-F8-3).
  #  1.4 Create tests/types/daemon-mount.type-test.ts: a literal without
  #      `pid`/`signalHost`/the re-entry environment and one with all three
  #      satisfies `DaemonComposition`; a literal without
  #      `daemonEntry`/`supervisor` and one with them both satisfy
  #      `ProductionCompositionFacts`; `degraded` accepts an array and a function
  #      and the array member stays assignable; every added property is optional
  #      (`undefined` assignable). Type-level only (TC-DAEMON-111 step 6, run at
  #      the Phase-2/Phase-8 gates through `pnpm typecheck`).
  #  1.5 Land TDR-0022 unchanged in this commit (untracked artifact; see the
  #      staging contract above) and keep doc/decisions/00-index.md as the
  #      already-committed TDR row.
  #
  # Verification:
  #   pnpm typecheck
  #   bun test tests/structure/daemon-contract.test.ts tests/structure/state-contract.test.ts
  #   bun run scripts/checks/ambient-globals.ts
  #   git diff --check
