  # name, environment name, config root, scope) that Phase 2 supplies, and it
  # shares no code path with the lifetime or the degradation work, so it is an
  # independently verifiable boundary. TC-DAEMON-124's start-refusal and
  # stop-noop halves consume only delivered behaviour that Phases 1-2 make
  # reachable.
