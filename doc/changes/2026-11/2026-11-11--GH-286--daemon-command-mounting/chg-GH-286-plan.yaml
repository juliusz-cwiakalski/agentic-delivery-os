  # Dependency reasoning: the lifetime path consumes the composed signal host and
  # pid from Phases 1-2 and the runtime's delivered cancellation-first stop
  # ordering; it shares state with the delivered instance/lane records, so it
  # must land after the composition that writes them and before the degradation
  # resolver that reads them. The stop-safety half is independent of the
  # lifetime work and shares one suite boundary with it (one process-boundary
  # suite, one durable-record suite), which is why both land here.
