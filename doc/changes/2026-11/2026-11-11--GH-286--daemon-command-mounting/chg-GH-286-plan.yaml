  #      non-empty otherwise `${homeDirectory}/.config`, `environmentName` = the
  #      exact `<PREFIX>_STATE_DIR` the state-directory resolution reads, and the
  #      delivered digest of the resolved directory as the scope (DM-6, DEC-9).
