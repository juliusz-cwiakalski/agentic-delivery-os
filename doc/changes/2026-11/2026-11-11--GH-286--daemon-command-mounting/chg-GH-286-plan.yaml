  # Phase 4 — Foreground lifetime, drained detach, and fail-closed stop safety
  #
  # Goal: make a foreground start own its process lifetime (SIGTERM drains,
  # SIGINT stops immediately, listeners removed in a `finally`, the readiness
  # snapshot returned at exit, cancellation before the release append, one stop
  # per invocation), prove the drained detach from a second store handle, and
  # make cross-process `stop` incapable of addressing a process group.
