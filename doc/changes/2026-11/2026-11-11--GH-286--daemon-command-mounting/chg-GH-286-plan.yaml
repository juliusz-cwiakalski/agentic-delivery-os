  # added (inventory.json and EXECUTABLE_ALLOWANCES stay unmodified controls);
  # the delivered daemon behaviour is unchanged because no caller supplies the
  # new inputs; TDR-0022 is tracked and the decision index already points at it.
  # ---------------------------------------------------------------------------
