  # Phase 4 — Foreground lifetime, drained detach, and fail-closed stop safety
  #
  # Goal: make a foreground start own its process lifetime (SIGTERM drains,
  # SIGINT stops immediately, listeners removed in a `finally`, the readiness
  # snapshot returned at exit, cancellation before the release append, one stop
  # per invocation), prove the drained detach from a second store handle, and
  # make cross-process `stop` incapable of addressing a process group.
  #
  # Dependency reasoning: the lifetime path consumes the composed signal host and
  # pid from Phases 1-2 and the runtime's delivered cancellation-first stop
  # ordering; it shares state with the delivered instance/lane records, so it
  # must land after the composition that writes them and before the degradation
  # resolver that reads them. The stop-safety half is independent of the
  # lifetime work and shares one suite boundary with it (one process-boundary
  # suite, one durable-record suite), which is why both land here.
  #
  # Tasks (TC-DAEMON-033, 034, 035, 036, 037, 038, 039, 091, 092, 121):
  #  4.1 Implement the foreground lifetime in packages/cli/src/daemon-compose.ts
  #      (DM-2): when `signalHost` is composed and `foreground` is true, start the
  #      runtime, capture the readiness snapshot, install exactly one `SIGINT`
  #      and one `SIGTERM` listener, run the resident loop, let the first signal
  #      select the stop mode (`SIGTERM` -> `drain`, `SIGINT` -> `immediate`),
  #      remove both listeners in a `finally`, await the loop, and return the
  #      captured snapshot at exit 0 or the stop failure at its delivered exit.
  #      A failed release still terminates the loop (cancellation precedes the
  #      append) and returns the delivered state-write identity at exit 2; a
  #      second signal cannot start a second stop; no handler outlives the
  #      invocation; with no signal host the delivered readiness return is
  #      unchanged and no resident loop starts (AC-F2-4..AC-F2-9).
  #      Disposition of the delivered `packages/cli/src/daemon-main.ts` (DECLARED
  #      ONCE HERE, binding on every later phase): the command runtime is the one
  #      owner of the foreground lifetime — it must return the readiness snapshot
  #      it captured at start and must surface a failed stop — so on PRODUCTION
  #      SURFACES `createDaemonMainEntry` stays UNUSED and UNMODIFIED: it is never
  #      wired into the daemon composition, never called by the production
  #      composer, and never imported by `packages/cli/bin/delivery-os.ts`, and it
  #      gains no production code path in this change. The one permitted consumer
  #      is the TC-DAEMON-039 fixture entry script written inside the temp root by
  #      `tests/conformance/daemon-mount/real-reentry.test.ts`, which imports it
  #      as a library seam because that case requires the real
