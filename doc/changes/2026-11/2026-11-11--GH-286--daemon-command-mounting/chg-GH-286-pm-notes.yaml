      instanceId differs or whose recordedAt is at/after the spawn time is
      accepted, and its operation must be acquired or taken-over, so a crash
      victim's stale acquired record is the classified readiness timeout at exit
      2 and a legitimate takeover is accepted on the first poll; the 20 x 50 ms
      window is unchanged. The three cells run through the real
      createDaemonCommandRuntime with the recording process port. F-2: TC-037
