  - text: "Four design choices are inside the ticket's stated intent and are not
      product-scope ambiguities; they are routed to specification as recorded
      decisions with explicit tested outcomes: (1) how a detached `daemon start`
      re-enters the CLI (`daemonEntry`) and whether the resident foreground loop
      runs; (2) how `queue list`/`lanes` stop reporting `daemon-unreachable`,
      given the composition currently hardcodes that degradation at
      packages/cli/src/production.ts:470; (3) plumbing the composing process id
      so a foreground start records a real pid (DaemonRuntimePorts.pid exists
      but DaemonComposition exposes no pid, so instance records would carry pid
      0); (4) the install unit's binary/scope inputs. No human clarification is
      blocking."
    type: "decision"
    date: "2026-11-11"
  - text: "clarify_scope complete: requirements are complete and testable as
      written. Scope boundaries declared: mount the lifecycle family and its
      help and reference coverage; make queue/lanes degradation reflect durable
      daemon state; do not add a lane executor/dispatch composition to the
      daemon, do not add `projects`/`events`/`attempts`/`board`, do not change
      daemon engine semantics or control-protocol shapes beyond additive
      composition inputs."
    type: "decision"
    date: "2026-11-11"
  - text: "Decision record TDR-0022 (daemon lifecycle mount and degradation
      composition) written and indexed under doc/decisions/. It settles D1
      (detached re-entry via the running entry path plus a signal-owned
      foreground lifetime), D2 (per-read degradation resolver over durable
      daemon state), D3 (composing pid plus a fail-closed stop on a non-positive
      recorded pid — a pid of 0 would signal the operator's own process group),
      D4 (brand-derived install identity under the XDG config root), and
      additionally requires the production state directory to resolve through
      resolveStateDirectoryScope so the parent, the detached child, and the
      installed unit agree."
    type: "decision"
    date: "2026-11-11"
