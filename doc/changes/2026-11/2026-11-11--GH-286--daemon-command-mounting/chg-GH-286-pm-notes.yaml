  - text: "DoR iteration 2 repair decisions (PM): (1) RF2-4 is settled by adding a
      third state-directory outcome — when no absolute override exists and the
      home is empty the directory is unresolvable, the daemon family stays
      mounted but its runtime is composed in an unavailable form whose
      subcommands return the delivered config.value.invalid at exit 2, opening
      no store, lock, or socket; the home-based fallback applies only when a
      home exists, so a non-absolute override still falls back as delivered.
      This keeps the prompt set complete (no containment throw) and removes the
      root-level store root. (2) RF2-6 keeps the disposition's intent but scopes
      it to production surfaces: createDaemonMainEntry is never wired into the
      composition, composer, or bin, and a test fixture may still use it as a
      library seam. (3) RF2-1/DC-2 and the stale entryScriptPath reference are
      corrected in TDR-0022 by @decision-advisor. (4) RF2-2/RF2-3 are plan-scope
      omissions: daemon-compose.ts joins Phases 2 and 3 with the spawn-merge and
      install- refusal tasks assigned to them."
