      resolve its interpreter (empirically `env: bun: No such file or
      directory`); the ticket's primary acceptance is unachievable and the one
      integration proof is vacuous. RF-2 AC-F5-6's universal equivalence is
      unsatisfiable because the delivered fold treats at-bound age as stale and
      reports running for an orphan heartbeat. Major: RF-3 the declared
      permitted edit set omits two hard-coded help suites, one of them outside
      every phase scope; RF-4 plain daemon status probes the socket,
      contradicting the narrative and TC-060; RF-5 the asserted install order
