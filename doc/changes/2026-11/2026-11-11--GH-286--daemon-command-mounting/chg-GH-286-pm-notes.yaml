      already-running and takeover-refused are user-validation, exit 1 not 2;
      RF-7 mutant consumers are declared in a phase that has already committed.
      Reopened specification, test_planning, delivery_planning (never delivery).
      Verdict persisted at readiness-review/readiness-iter-1.md."
