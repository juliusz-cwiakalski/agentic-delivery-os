findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: scripts/deliver-ticket.sh:1232
    message: >
      A present hook is invoked in deliver_loop before run_single_iteration checks
      DRY_RUN. Therefore deliver-ticket.sh --dry-run runs arbitrary hook policy and
      can sleep, create artifacts, or fail, despite AC-F1-3 and TC-HOOK-005 requiring
      dry-run paths never to invoke the hook.
    suggestion: >
      Bypass run_pre_iteration_hook entirely when DRY_RUN=true and add a
      marker-writing hook integration test that proves no invocation or artifact on
      the public dry-run path.
    suppressed: false
    published_url: null
