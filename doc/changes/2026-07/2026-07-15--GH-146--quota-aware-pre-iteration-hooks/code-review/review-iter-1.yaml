    published_thread_id: null
  - id: F-2
    severity: high
    confidence: high
    category: portability
    location: scripts/deliver-ticket.sh:224; scripts/ceo-loop.sh:167
    message: >
      Both V1 parsers use GNU stat -c for mode and owner checks. BSD/macOS stat does
      not support -c, so even a valid header-only hook result is rejected as
      uninspectable and every enabled hook blocks its OpenCode spawn on that platform.
    suggestion: >
      Introduce a tested GNU/BSD metadata adapter while retaining all ownership and
      permission checks, and cover both command variants with injectable seams or
      fixtures.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-3
    severity: high
    confidence: high
    category: testing
    location: scripts/.tests/test-deliver-ticket.sh:1578
    message: >
      The plan marks wrapper-level coverage for all 31 TCs complete, but the focused
      PM suite adds only a help-text test and the CEO suite adds help/retry chunks.
      The required automated absent/success/failure/context/retry/JOIN/control/dry-run
      cases are not implemented; this gap allowed F-1 to ship.
    suggestion: >
      Add the concrete marker and mocked-OpenCode integration tests specified by
      TC-HOOK-001 through TC-HOOK-010 and the remaining mapped protocol/lifecycle
      scenarios to both wrapper suites, then record their results before re-review.
    suppressed: false
    published_url: null
    published_at: null
    published_comment_id: null
    published_thread_id: null
  - id: F-4
    severity: medium
    confidence: high
    category: portability
    location: scripts/hooks/pre-opencode-iteration-zai.sh:34
    message: >
      The installed Z.AI example formats its wake time with GNU date -d @<epoch>,
      which BSD/macOS date does not implement. During the peak window this exits the
      hook under strict mode instead of waiting successfully.
    suggestion: >
      Use a GNU/BSD-compatible UTC formatter (or a small tested formatter adapter)
      and add a regression fixture for the non-GNU date form.
