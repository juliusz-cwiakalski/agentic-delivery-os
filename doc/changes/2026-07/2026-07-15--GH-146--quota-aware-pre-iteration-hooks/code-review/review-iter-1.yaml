summary: >
  The hook design correctly avoids source/eval, stages environment mutations before
  application, preserves the CEO parent-shell boundary, and has symmetric example
  installation and removal. However, PM dry-run currently runs a present hook, the
  newly added platform-specific commands break enabled hooks or the Z.AI example on
  BSD/macOS, and the claimed automated coverage for most hook scenarios is absent.
