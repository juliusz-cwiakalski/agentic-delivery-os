    location: scripts/ceo-loop.sh:191; scripts/deliver-ticket.sh:256
    message: >
      The CR/NUL preflight converts `od -t x1` output into one unseparated hex
      string before matching `0d|00`, so either pattern can match across adjacent
      byte tokens. For example, a valid LF-terminated V1 record whose literal
      value is `0А` (ASCII 0 followed by U+0410, bytes 30 d0 90) is rejected by
      both parsers as containing CR or NUL even though it contains neither.
    suggestion: >
      Detect whole byte tokens without removing their separators (or use a
      byte-safe checker), then add the valid UTF-8 cross-token regression to the
      shared both-wrapper matrix alongside the real CR and NUL rejection cases.
      Preserve the LC_ALL=C bounds and pre-string validation ordering.
