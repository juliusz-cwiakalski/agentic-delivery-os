  - text: "DoR iteration 1 returned NOT_READY (2 critical, 6 major, 2 minor). Reopened specification, test planning, and delivery planning. Critical issues: impossible SIGKILL cleanup wording and ceo-loop command-substitution hiding hook PID from parent traps. Other gaps cover TDR per-retry wording, both-wrapper failure/no-timeout tests, exact existing result domains, interruptible stop wait, consumer regressions, explicit DoD, C-8 attestation, and stale test execution mappings. These were not caught earlier because artifact authors reasoned mainly from helper-level design rather than real wrapper/subshell and consumer boundaries."
    type: retro
    date: "2026-07-16"
  - text: "Human decision: guarantee cleanup only on normal exit and direct SIGTERM/SIGINT/SIGHUP. Explicitly exclude wrapper-only SIGKILL, host failure, and descendants that leave the hook process group; do not add guardian/supervisor complexity. Product need is a simple sleep-until-off-peak gate."
    type: decision
    date: "2026-07-16"
  - text: "Scope expanded during DoR remediation: the hook must be able to return model-selection environment updates to the parent wrapper before OpenCode starts, enabling provider switching during peak windows or after provider quota exhaustion. This requires a safe output protocol; sourcing the hook directly is under decision review."
    type: retro
    date: "2026-07-16"
  - text: "Accepted TDR-0002 env-return decision: do not source/eval hook output. Parent provides a private ADOS_HOOK_ENV_V1 data file; validates the entire bounded update atomically; permits OC_ADOS_AGENT_*_MODEL by default plus explicit allowlist; then applies set/unset before OpenCode. This supports provider switching while preserving parent-shell isolation."
