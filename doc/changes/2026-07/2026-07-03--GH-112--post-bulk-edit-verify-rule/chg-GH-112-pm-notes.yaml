decisions:
  - text: "PM DECISION (DoR iter-1 remediation): The 'mirror README end-to-end' decision (DEC-1) logically covers a THIRD hand-synced distribution list that the initial artifacts missed — scripts/uninstall.sh ADOS_LOCAL_STANDALONE_DOCS (lines 103-109, used at 414-422 to remove redistributable docs). .ai/rules/README.md is in all three lists (install ADOS_UPDATABLE_FILES + guard STANDALONE_DOCS + uninstall ADOS_LOCAL_STANDALONE_DOCS); uninstall.sh's own comment states it MUST stay in sync with install.sh's standalone manifest. The new rule must land in all three, else uninstall.sh leaves it orphaned on adopting projects (contradicts G-5 distribution truthfulness). Confirmed by PM via direct read of uninstall.sh. Canonical remediation naming: new data-model element DM-4 (uninstall list); new AC AC-F6-6 (uninstall entry identical to install+guard); NFR-4 broadened from list-PAIR to list-TRIPLE sync across all three. Specification + test_planning + delivery_planning REOPENED (iter-1 DoR NOT_READY)."
    date: 2026-07-03
    date: 2026-07-03
  - text: "PM DECISION (new standalone file vs fold): Issue allows 'new rule `.ai/rules/bulk-edit-verify.md` OR fold into naming-and-types.md'. No `naming-and-types.md` exists in `.ai/rules/`, so the file MUST be a new standalone `.ai/rules/bulk-edit-verify.md`. No ambiguity."
    date: 2026-07-03
  - text: "PM DECISION (which agents load the rule): Per the issue, load in `@coder` (implementation) and `@pm` (when it implements directly). `@fixer` also applies edits and is exposed to the same substring-overlap hazard — spec may propose adding fixer too, but baseline scope = coder + pm + README index update. `@reviewer` already loads `.ai/rules/` relevant files (line 118/144) so it auto-discovers the new rule via the index."
    date: 2026-07-03

