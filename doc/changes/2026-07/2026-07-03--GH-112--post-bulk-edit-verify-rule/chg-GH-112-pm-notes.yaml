notes:
  - text: "RETRO (DoR iter-2 NOT_READY — false-claim cost): iter-1's readiness record ASSERTED 'test-plan already correct (plural)' for the .ados-claude path, but that was a FALSE claim — the test-plan actually used singular `.ados-claude/agent/` in 6 places, including the EXECUTABLE greps in TC-DISC-004 that target nonexistent paths and would false-fail at delivery/quality-gates. The false assurance let the typo persist into iter-2, costing an extra DoR cycle. Process improvement: a reviewer's 'already correct' assertion about another artifact must be backed by an actual grep/verification, not assumed — especially for executable assertions. The blocking defect (false-failing greps) is worse than a prose typo because it would have surfaced as a quality-gate failure later. Fixing in iter-3."
    type: retro
    date: 2026-07-03
  - text: "RETRO (DoR iter-1 NOT_READY): The uninstall.sh third-list gap (ADOS_LOCAL_STANDALONE_DOCS) was caught by @readiness-reviewer at DoR, NOT during clarify_scope or spec authoring. Why missed earlier: the PM's 'mirror README end-to-end' framing only surfaced install.sh + the drift guard (two lists) because the investigation read those two files but NOT uninstall.sh. Process improvement: when a change's design is 'mirror file X's distribution treatment end-to-end', enumerate EVERY place file X appears (install, uninstall, guard/CI, docs, any other consumer) before locking the AC set — do not assume the two most obvious lists are exhaustive. The independent DoR read of uninstall.sh (and its own 'MUST stay in sync' comment) caught it. Cost: ~1 re-author cycle across spec/test-plan/plan. Also fixed: spec had `.ados-claude/agent/` (singular) in 3 places → corrected to `agents/` (plural); test-plan stale 'implementation plan not yet authored' note cleaned up."
    type: retro
    date: 2026-07-03
