  - text: "DoR iter-1 NOT_READY: 3 blocking findings — (1) spec §16 listed ceo-loop.sh as Updated despite OQ-3 decision excluding it; (2) spec §14 OQ-1/2/3 still marked Decision needed despite PM resolving them; (3) plan Phase 8 missing autonomous-batch-delivery.md from doc targets. Root cause: PM decisions were recorded in pm-notes.yaml but not propagated back into spec/plan. Process improvement: when PM resolves open questions mid-chain, update the spec immediately, not just pm-notes. All 3 fixed in commit 695c6bf."
