  - text: "system_spec_update (phase 7) reconciled by @doc-syncer: feature-autonomous-delivery.md (added F-9 platform-aware verification capability, generalized INV-DM-4 from gh pr merge to platform-aware merge, added ADOS_PLATFORM/ADOS_BLOCKED_LABEL/ADOS_MERGE_STRATEGY to config table, platform-neutral edge-case wording, Core Components updated, last_updated→2026-07-28, GH-148 added to related_changes); delivery-modes.md (new Platform detection section, config variables in deliver-ticket.sh/batch-deliver.sh tables, component-responsibility + AI-vs-script + INV-DM-4 + Mode B rules + edge-case generalized from GitHub-only to platform-aware, mermaid merge node, GH-148 to related_changes); autonomous-batch-delivery.md (new Platform detection section, Mode B merge-strategy table + GitLab merge-status polling/stale-conflict guidance, ADOS_MERGE_STRATEGY/ADOS_PLATFORM/ADOS_BLOCKED_LABEL in config tables, labels reference notes configurability, PM-prompt mermaid node generalized, GH-148 to related_changes). feature-delivery-lifecycle.md and .opencode/README.md verified platform-agnostic — no change needed. ceo-loop.sh confirmed unmodified (OQ-3); ceo.md prompt out-of-scope (NG-3). doc-distribution guard passes."
