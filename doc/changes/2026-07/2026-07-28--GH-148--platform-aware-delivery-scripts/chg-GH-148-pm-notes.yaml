decisions:
  - text: "OQ-1 resolved (PM-decided): GitLab CI green-gate mirrors the existing GitHub _pr_has_no_checks_configured pattern — positively confirm 'no CI configured' via GitLab pipeline API (glab api projects/:id/pipelines or glab ci list). If no pipelines exist, that's legitimate green. If pipelines exist, poll until success/failed. This is safest and most consistent with the existing pattern."
    type: decision
    workItemRef: GH-148
    date: "2026-07-28"
  - text: "OQ-2 resolved (PM-decided): Platform-neutral prompt. The PM already self-corrects to glab via project config files (pm-instructions.md, pr-instructions.md). Making the prompt platform-neutral ('Detect the tracker platform from .ai/agent/pm-instructions.md or git remote. Use the project's configured CLI.') is more robust than duplicating detection logic in the prompt. Defers to already-correct config."
    type: decision
    workItemRef: GH-148
    date: "2026-07-28"
  - text: "OQ-3 resolved (PM-decided): ceo-loop.sh does NOT need independent platform detection. It does not call the tracker today — it delegates to deliver-ticket.sh for delivery and to the CEO agent for merges. The CEO agent reads project config for its merge commands. Adding detection to ceo-loop.sh would be over-engineering with no consumer. Only deliver-ticket.sh and batch-deliver.sh need detect_platform()."
    type: decision
    workItemRef: GH-148
    date: "2026-07-28"
