  - text: "Scope cross-checked against feature-autonomous-delivery.md spec. No contradictions — the change is additive (extends GitHub-only to GitHub+GitLab). Key spec touchpoints: INV-DM-4 references gh pr merge --squash (needs generalization), config table needs ADOS_PLATFORM/ADOS_BLOCKED_LABEL/ADOS_MERGE_STRATEGY, classify_result return values stay the same. Doc impacts: delivery-modes.md, autonomous-batch-delivery.md, feature-autonomous-delivery.md, delivery-modes.md hook section (B3)."
