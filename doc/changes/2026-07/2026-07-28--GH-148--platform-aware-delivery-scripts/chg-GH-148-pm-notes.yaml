  - text: "CritiqueGrid pre-PR review: BLOCK verdict (MEDIUM confidence). Found 2 CRITICAL + 5 HIGH findings: (1) CG-BASH-001 merge_flags passed as single arg under IFS=$'\\n\\t' → Mode B merge fails on BOTH platforms; (2) CG-QA-001 F-12 parser property test never written despite marked complete; (3) CG-API-001 mr_list_closed_merged missing --state closed/merged → dead merged detection; (4) CG-BASH-002 should_skip_ticket passes issue number to branch-scoped function; (5) CG-API-002 gitlab_await_mergeable reads .mergeStatus camelCase (non-existent) and compares to has_conflicts (field name, not value); (6) CG-QA-002 only ~16/51 TCs implemented; (7) CG-SRE-001 NFR-1 regression gate skipped. All 7 addressed by @coder + @fixer: merge_flags→array, property test implemented, state filter added, title-search merged detector, correct GitLab field names, 35 missing TCs added, full suite run. Final: 108/108 + 44/44 + 39/39 + 54/54 + ShellCheck clean."
    type: retro
    workItemRef: GH-148
    date: "2026-07-28"
  - text: "Retro: the initial @coder implementation had serious quality issues — 6 platform-dispatch bugs (unbound PLATFORM, wrong jq projection order, broken test quote idiom) caught by @fixer, then 7 more CRITICAL/HIGH findings caught by CritiqueGrid (merge flag quoting, missing state filter, wrong GitLab field names, missing 35 tests, missing parser property test). Root causes: (1) mock-blindness — existing mocks matched on $1/$2 subcommand and returned canned data regardless of subsequent args, hiding flag-construction bugs; (2) test suite never actually executed end-to-end (Phase 8.1/8.2 self-recorded as skipped); (3) task checkboxes marked complete without implementation evidence. Process improvements: always run test-all.sh before declaring phase complete; CritiqueGrid pre-PR review is high-value for multi-platform changes; mock recorders should assert on full argv, not just subcommand."
    type: retro
    workItemRef: GH-148
    date: "2026-07-28"
