decisions:
  - text: "SCOPE = Option A (scaffolding + docs only). The repo has a documented, dangling dependency: /check (F-1), /check-fix (F-2), feature-quality-gates-and-pr.md (NFR-1 + line 109 dependency), and onboarding-existing-project.md ALL reference ./scripts/quality-gates.sh as the quality-gates runner — but that file does NOT exist. Creating it IS the 'scaffolding' the ticket asks for. The 'AI-tuned' aspect = AI-actionable structured output (exit codes, per-gate pass/fail, log pointers per @runner conventions). The script orchestrates this repo's real gates (test-all, doc-distribution, plugin freshness, git diff --check) and is designed as extensible scaffolding (AGENTS.md discovery) usable by other ADOS-managed projects."
    date: "2026-07-04"
  - text: "DEFERRED (proposed follow-up, human-gated): the two policies from owner comment #2 (hard-NFR enforcement + config-vs-code early gate) are NOT folded into GH-37. Rationale: each is genuinely substantial (hard-NFR touches DoR semantics + NFR modeling; config-vs-code touches lifecycle phase ordering); the owner comment explicitly offered 'fold OR companion ticket'; 'one change at a time' principle favors focused scope. PM will PROPOSE a companion ticket at PR time per governance (PM never auto-creates tickets)."
    date: "2026-07-04"
  - text: "'Extract from my private projects' is NOT a blocker: the owner's own comments reframe the deliverable around THIS repo's existing contracts (the dangling quality-gates.sh), and the 'best practices' are codifiable from ADOS's own conventions (test-all.sh, CI gates, @runner log format, /check resolution contract). No private-project access required."
    date: "2026-07-04"

