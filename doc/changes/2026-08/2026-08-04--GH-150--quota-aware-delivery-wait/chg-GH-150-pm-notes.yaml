notes:
  - text: "Intake: user wants to extend the existing Z.AI peak-hours hook (scripts/hooks/pre-opencode-iteration-zai.sh + doc/guides/zai-peak-hours-hook.md) so that when z.ai coding plan is in use AND quota (5h/weekly) is at 100%, delivery pauses until quota resets. This session = research feasibility via @external-researcher + a standalone POC bash script the user can test. NOT full delivery. Ticket #150 itself is broader (deliver-ticket.sh quota-awareness, status fields, tests, docs) — this session targets the hook-side quota-check sub-problem as a POC; full ticket delivery follows after POC validates."
    type: info
    date: "2026-08-04"
  - text: "Existing hook (scripts/hooks/pre-opencode-iteration-zai.sh) already pauses by TIME-OF-DAY (06:00-10:00 UTC peak + 2h buffer). It does NOT check actual quota usage. The enhancement: add a quota-usage check so we also pause when quota is exhausted regardless of time-of-day. Hook reads OC_ADOS_AGENT_PM_MODEL / OC_ADOS_AGENT_CEO_MODEL and only activates on zai-coding-plan/* models."
    type: info
    date: "2026-08-04"
  - text: "Scope split awareness: GH-150 ticket AC is broad (deliver-ticket.sh foreground sleep, --status fields, deterministic tests, signal handling, doc updates). The user's POC request targets ONE slice: hook-side quota detection. If POC validates, full delivery will need to decide whether quota-handling lives in the hook (current pattern) or in deliver-ticket.sh (ticket's framing). Flag to user at POC report time."
    type: risk
    date: "2026-08-04"
  - text: "RESEARCH COMPLETE. @external-researcher returned a detailed report; owner independently corroborated with Google-AI research — both agree on endpoint (GET https://api.z.ai/api/monitor/usage/quota/limit), Bearer auth, and 5h+weekly credit structure. Sources: official docs.z.ai/devpack/{overview,faq,teamplan,api-code} + community (zai-usage-tracker, openusage, CodexBar). Auth token: same Coding Plan key used for inference; individual = z.ai/manage-apikey/apikey-list, team = z.ai/manage-apikey/coding-plan/team/my-plan."
    type: info
