    type: retro
    date: "2026-08-04"
  - text: "CLARIFICATION on the jq retro note above: the PEAK-HOURS path stays pure-bash (test_portable_wake_formatter asserts no GNU date). The QUOTA path requires jq — but that's acceptable because (a) the quota feature is opt-in + fail-open (no key/missing jq → skip), and (b) jq is already a framework-wide dependency (deliver-ticket.sh:13, ceo-loop.sh:17). So no NEW dependency is introduced for users who don't opt in. The portable-formatter test assertion is preserved for the peak-hours code path only."
    type: info
    date: "2026-08-04"
  - text: "Hook invocation context confirmed (read deliver-ticket.sh + ceo-loop.sh): framework supports ONE hook path only (PRE_ITERATION_HOOK default ~/.ados/hooks/pre-opencode-iteration; deliver-ticket.sh:483 + ceo-loop.sh:192 invoke via _setsid, inheriting parent env). ZAI_API_KEY propagates via normal env inheritance — user exports it before running the wrapper, the hook (child via setsid) sees it. NO framework change needed. setsid starts a new session but preserves env; outbound network from within the hook is fine. ADOS_HOOK_ENV_ALLOWLIST governs env the hook writes BACK to the wrapper (via ADOS_HOOK_ENV_OUTPUT) — not relevant to reading ZAI_API_KEY."
    type: info
    date: "2026-08-04"
  - text: "RETRO: community docs (openusage/zai-usage-tracker) were WRONG about field names — claimed window_length/used/remaining/reset_time; reality is unit/number/percentage/nextResetTime (decoded from CodexBar source code). The live POC against a real key caught this BEFORE spec. Lesson for undocumented endpoints: a live POC against a real credential is mandatory before trusting community docs; treat community docs as hypothesis, not spec. Cost: ~1 extra iteration to rewrite the POC parser. Worth it."
    type: retro
    date: "2026-08-04"
  - text: "REQUIRED TEST MATRIX (owner directive: mock clock/responses/sleep; deterministic; no live API). To be authored by @test-plan-writer and implemented in scripts/.tests/test-hook-zai-example.sh (extend existing) — all via function-seam overrides (_now_utc_epoch, _sleep, _zai_quota_fetch). Groups: (A) PEAK-HOURS regression [non-zai model→noop; zai off-peak→noop; zai in-peak→sleep to peak_end; zai in buffer→sleep to peak_end; custom start/end/buffer vars]. (B) QUOTA FAIL-OPEN [no ZAI_API_KEY→skip; jq missing→skip; curl/network error→skip+WARN; 401/403→skip+WARN; non-200 envelope→skip+WARN; malformed JSON→skip+WARN; empty limits/no active plan→not-exhausted]. (C) QUOTA EXHAUSTION DETECTION [all TOKENS_LIMIT pct<100→no sleep; 5h pct>=100→sleep to its nextResetTime; weekly pct>=100→sleep to its nextResetTime; BOTH exhausted→sleep to SOONEST nextResetTime; TIME_LIMIT exhausted only→NO sleep (ignored); pct==100 boundary→exhausted; pct>100 overage→exhausted; nextResetTime in past→clamp wait to 0]. (D) COMBINED PEAK+QUOTA [in-peak AND quota exhausted→sleep to MAX(peak_end,quota_reset); in-peak quota OK→sleep to peak_end; off-peak quota exhausted→sleep to quota_reset]. (E) CONFIG/TOGGLES [ADOS_ZAI_QUOTA_DISABLED=1→quota skipped even with key; cache hit within ADOS_ZAI_QUOTA_CACHE_SECONDS→no 2nd HTTP call; cache expired→2nd HTTP call]. (F) SAFETY/HYGIENE [hook output never contains full API key (prefix/suffix only); production mode never logs raw response body; quota fail-open never causes non-zero exit when off-peak]. (G) PORTABILITY [format_utc_epoch still correct w/o GNU date — existing assertion preserved for peak path]."
    type: info
    date: "2026-08-04"
