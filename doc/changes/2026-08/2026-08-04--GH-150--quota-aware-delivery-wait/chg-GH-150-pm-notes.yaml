decisions:
  - text: "FEASIBILITY VERDICT: FEASIBLE. Z.AI exposes GET https://api.z.ai/api/monitor/usage/quota/limit (Bearer auth, same key as inference) returning per-window limit/used/remaining/reset_time. Triangulated by @external-researcher + owner's Google-AI research + 3 independent community tools (melon-hub/zai-usage-tracker, guyinwonder168/opencode-glm-quota, robinebers/openusage). Endpoint is undocumented-but-stable (used by Z.AI's own subscription UI)."
    date: "2026-08-04"
  - text: "Quota structure confirmed: TWO TOKENS_LIMIT windows — (a) 5-hour ROLLING window (window_length=18000s), resets continuously 5h after consumption, NO fixed reset time and reset_time often MISSING; (b) weekly 7-day window (window_length=604800s), reset_time usually present. Quota is credit-based (not minutes/tokens), shared across GLM-5.2/GLM-5-Turbo/GLM-4.6 + Visual Understanding MCP. Either window exhausting blocks delivery."
    date: "2026-08-04"
  - text: "KEY DESIGN IMPLICATION for the hook: the 5-hour window's reset_time is frequently absent (rolling). So the hook CANNOT reliably compute a single sleep-until time for the 5h window. Production design must: (1) sleep until soonest known reset_time when present; (2) POLL on a bounded interval when only the rolling window is exhausted (no fixed reset). POC encodes both paths. This is the main risk to surface at full-delivery spec time."
    date: "2026-08-04"
  - text: "SUPERSEDED by ground truth (2026-08-04): the two decisions above were based on INACCURATE community docs (openusage et al. claimed fields window_length/used/remaining/reset_time and said 5h reset_time often missing). The REAL response uses {type, unit, number, percentage, nextResetTime} and BOTH TOKENS_LIMIT windows reliably expose nextResetTime. The 'rolling window lacks reset → must poll' concern is VOID. No poll fallback needed."
    date: "2026-08-04"
  - text: "DECODE CONFIRMED (@external-researcher round 2 + ground truth + community source code): real fields are data.level (plan tier, e.g. 'max') + data.limits[] each {type, unit, number, percentage, nextResetTime} (TIME_LIMIT also has usage/currentValue/remaining/usageDetails). `unit` enum (from CodexBar ZaiUsageStats.swift): 0=unknown,1=days,3=hours,5=months,6=weeks → so unit=3/number=5 = 5-hour, unit=6/number=1 = weekly. EXHAUSTION RULE FOR HOOK: pause iff ANY TOKENS_LIMIT entry has percentage >= 100 (CodexBar clamps 0-100, implying overage possible; >=100 covers ==100 and >100). IGNORE TIME_LIMIT (governs MCP search-prime/web-reader/zread; does NOT block model inference). Do NOT wait for 429 — pre-empt at percentage>=100 (429 codes 1316/1317 fire at the same threshold, no lag). nextResetTime is epoch-ms UTC, stable for both windows → compute exact sleep, no poll fallback."
    date: "2026-08-04"
  - text: "HOOK ARCHITECTURE DECISION: ONE hook file with TWO features (NOT two separate hooks). Decisive rationale: the framework invokes a SINGLE hook path — PRE_ITERATION_HOOK (deliver-ticket.sh:59, ceo-loop.sh:64) checked as one file at run_pre_iteration_hook (ceo-loop.sh:192, deliver-ticket.sh:483). Two files would force either a user-authored chain wrapper or framework changes (out of scope for this change). Quota logic isolated as a clearly-delimited module (functions) inside scripts/hooks/pre-opencode-iteration-zai.sh. Combined wait semantics: sleep until MAX(peak_end, soonest_exhausted_quota_nextResetTime) when both active; sleep until the active one when only one."
    date: "2026-08-04"
  - text: "QUOTA FEATURE = OPT-IN + FAIL-OPEN (preserves today's zero-dep offline behavior for peak-hours-only users). Quota check activates ONLY when ALL hold: (a) model is zai-coding-plan/* [shared gate, existing], (b) ZAI_API_KEY is non-empty, (c) curl AND jq available. Any failure (missing key/deps, network, auth 401/403, non-200 envelope, malformed JSON, percentage not numeric) → emit ONE [WARN] line and SKIP quota check, falling back to peak-hours-only. Users who don't set ZAI_API_KEY get byte-identical behavior to today. Opt-out: ADOS_ZAI_QUOTA_DISABLED=1. Cache: ADOS_ZAI_QUOTA_CACHE_SECONDS (default 60) to avoid hitting the endpoint every iteration. jq is an acceptable dependency because deliver-ticket.sh ALREADY lists jq in its dependencies (line 13) — it is a framework-wide dependency, not new."
    date: "2026-08-04"
  - text: "TESTING + DESIGN-SEAMS REQUIREMENT (owner directive 2026-08-04): production hook MUST expose injectable function seams so tests mock clock/sleep/HTTP/cache with ZERO live API calls and ZERO real sleeping. Existing seams _now_utc_epoch() and _sleep() preserved; ADD a _zai_quota_fetch() seam wrapping the curl call (tests override it with a canned response + http code). All quota + peak tests deterministic. Required coverage enumerated in notes."
    date: "2026-08-04"
  - text: "CORE ARCHITECTURE (owner-confirmed 2026-08-04): generic sleep-driver + pluggable condition functions. Each condition is a howLongToSleepDueTo<Reason>() function that echoes ONE non-negative integer (seconds to sleep; 0/empty/error = no wait from this condition) to stdout, and uses the _now_utc_epoch() / _zai_quota_fetch() seams. main() iterates all condition functions, takes the MAX of returned seconds, and if >0 sleeps that long via _sleep() (logging ISO wake time). This composes multi-condition waits correctly (in-peak AND quota-exhausted => sleep max(peak,quota)). v1 ships TWO Z.AI-specific conditions: howLongToSleepDueToPeakHours (refactored from existing peak logic) + howLongToSleepDueToQuotaExhaustion (new). The condition-function contract IS the documented extension point — other providers build their own hook file reusing the same driver pattern + their own condition functions."
    date: "2026-08-04"
  - text: "SCOPE + TICKET CLOSURE (owner directive 2026-08-04): deliver the Z.AI HOOK slice only (generic driver + peak + quota conditions + guide + blueprint + tests). On merge, CLOSE GH-150 — the owner's restart-storm root cause (quota exhaustion treated as a liveness stall) is solved: out-of-tokens => the hook waits, because a restart cannot help. The ticket's deliver-ticket.sh-side AC (wrapper --status waiting_for_quota fields, foreground sleep inside the wrapper, wrapper-level signal handling) are SUPERSEDED — not deferred — by the per-provider-hook extensibility pattern: generic wrapper-level quota handling is intentionally NOT pursued because provider-specific hooks are cleaner, and others add providers by reimplementing the condition functions in their own hook. The PR/closure comment will document this rationale. (PM did not auto-create any follow-up ticket; the superseded AC are consciously dropped per owner.)"
    date: "2026-08-04"
  - text: "NO FILE CACHE IN v1: each hook invocation fetches quota once. Invocations are minutes apart (one per PM/CEO iteration), so once-per-iteration is well within endpoint tolerance (community tools poll every 1-5 min). A file cache across invocations adds stale-data / concurrent-write complexity for no real benefit now. The fetch is behind the _zai_quota_fetch() seam so a cache layer can be added later without changing callers. (Cache cases dropped from required v1 test matrix; toggles group keeps only ADOS_ZAI_QUOTA_DISABLED.)"
    date: "2026-08-04"
  - text: "SECURITY (hard rule for @committer / @coder): doc/changes/2026-08/2026-08-04--GH-150--quota-aware-delivery-wait/set-evn.sh contains the owner's REAL ZAI_API_KEY. It MUST NEVER be staged or committed. The POC (quota-check-poc.sh) is safe to commit (reads key from env, only prints prefix/suffix). Production hook must NEVER log the full key or raw response body. Every commit delegation must explicitly exclude set-evn.sh."
    date: "2026-08-04"
  - text: "RE-EVALUATION LOOP (owner directive 2026-08-04): after the driver sleeps for max(condition_seconds), it MUST re-evaluate ALL conditions and loop, because conditions can change DURING the sleep — e.g. a multi-hour quota wait can land the wake time INSIDE the peak window, which a single sleep would miss (the agent would then spawn into 3x peak). Loop shape: guard(model is zai-coding-plan/*) -> repeat { max_sleep = max over conditions of condition_i(); if max_sleep == 0 return; _sleep(max_sleep) } until max_sleep == 0. Termination safety: all conditions are monotonic w.r.t. time (each returns seconds-until-a-future-epoch), so every positive sleep advances the clock and shrinks remaining deltas; the quota condition clamps (nextResetTime - now) to >= 0, so a reset time already in the past yields 0 (no infinite loop even if the API still reports percentage>=100 post-reset). Defensive cap ADOS_ZAI_MAX_SLEEP_LOOPS (default 24): if exceeded, return + one WARN (belt-and-suspenders; not expected to trigger). Quota is re-fetched fresh each loop iteration (no cache => always current). This loop is the mechanism that makes the MAX-composition correct across elapsed time."
    date: "2026-08-04"
