  - text: "POC CREATED at doc/changes/2026-08/2026-08-04--GH-150--quota-aware-delivery-wait/quota-check-poc.sh. Standalone bash; reads ZAI_API_KEY from env; queries endpoint; prints status table (window/limit/used/remaining/%used/reset-UTC) + DECISION line (EXHAUSTED/OK). Default = DRY-RUN (prints what hook would do); --sleep = bounded wait loop (sleeps to soonest reset_time, or polls POLL_INTERVAL=600s up to MAX_POLLS=12 for rolling window). Dependencies: curl, jq, awk, date. Awaiting owner validation with a real Coding Plan key before full delivery."
