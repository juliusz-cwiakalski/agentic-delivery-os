  - id: F-2
    severity: medium
    confidence: high
    category: security
    location: scripts/hooks/pre-opencode-iteration-zai.sh:73-76
    message: >
      ZAI_API_KEY is passed as a curl CLI argument
      (`-H "Authorization: Bearer ${ZAI_API_KEY}"`), which exposes the full key
      in the process table (`ps aux` / /proc/<pid>/cmdline) to other local users
      for the duration of the fetch (up to the 15s --max-time window). This is
      beyond the spec's stated log-only security boundary (NFR-7 / F-5 / DEC-10
      constrain stderr/stdout, which is fully honored) and the threat model is
      single-operator autonomous delivery, but passing secrets as CLI args is a
      known anti-pattern on shared/multi-user hosts.
    suggestion: >
      Defense-in-depth: pass the Authorization header via a mode-0600 temp file
      with `curl --config` or `-H @file`, or document the single-operator threat
      model explicitly. Acceptable as-is for a single-user box; flag for
      hardening if multi-user hosts are in scope.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    confidence: medium
    category: correctness
    location: scripts/hooks/pre-opencode-iteration-zai.sh:215
    message: >
      `percentage` is validated with a bash integer regex `^[0-9]+$`. A
      floating-point value (e.g. 99.5 or 150.5) -- plausible because the
      endpoint is undocumented and the spec itself flags shape drift (RSK-1) --
      is rejected as "non-numeric percentage" and triggers fail-open (one WARN +
      return 0). This spuriously treats a healthy sub-100 float as a failure,
      and gives up on an overage float instead of sleeping. The spec says
      percentage is integer (API-1), so this is spec-compliant, but it is brittle
      to the very drift RSK-1 worries about; fail-open is the safe direction, so
      impact is a spurious WARN, not a wrong sleep.
    suggestion: >
      Move the numeric comparison into jq (`(.percentage | tonumber) >= 100`),
      which handles int/float uniformly and removes the second (bash-regex)
      parser. This also simplifies the loop. Optional; only worth it if the
      endpoint is observed to emit floats.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: low
    confidence: high
    category: documentation
    location: doc/guides/zai-peak-hours-hook.md:218
    message: >
      The sample log line shows
      `[INFO] (pre-opencode-iteration-zai) zai-coding-plan peak window; waiting until ...`,
      but the implementation emits `peak-hours` as the reason token (driver maps
      the condition name via a case to `peak-hours` / `quota-exhaustion`). Log
      wording is UNPINNED per OQ-1, so no AC is breached, but the illustrative
      line is stale relative to the actual output.
    suggestion: >
      Update the guide example to the current format, e.g.
      `[INFO] (pre-opencode-iteration-zai) peak-hours; waiting until 2026-07-29T10:00:00Z`.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-5
    severity: low
    confidence: high
    category: portability
    location: scripts/hooks/pre-opencode-iteration-zai.sh:223
    message: >
      Quota arithmetic operates on nextResetTime in epoch-MILLISECONDS
      (~1.78e12) inside bash `(( ))`. On a 32-bit bash this exceeds INT32 max
      (2.1e9) and would wrap, producing wrong sleep math. 64-bit hosts (the
      autonomous-delivery context) are unaffected; the existing format_utc_epoch
      uses epoch-seconds which fit 32-bit until 2038.
    suggestion: >
      No action required for the stated 64-bit delivery context. Optionally note
      the 64-bit-bash assumption in the hook header or guide.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-6
    severity: low
    confidence: high
    category: robustness
    location: scripts/hooks/pre-opencode-iteration-zai.sh:78
    message: >
      In `_zai_quota_fetch`, every line is guarded with `|| true` /
      `2>/dev/null` except `rm -f "${tmp}"`. The function is empirically robust
      (verified across two fetch-infrastructure failure modes: bad TMPDIR and
      read-only TMPDIR both correctly emit the transport-failure WARN), so this
      is not a demonstrable bug. Additionally there is no EXIT trap, so a
      SIGTERM/SIGKILL mid-fetch leaks the temp file in /tmp.
    suggestion: >
      For consistency add `rm -f "${tmp}" 2>/dev/null || true`; optionally a
      local trap to remove the temp file on signal. Low-impact cleanup.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-7
    severity: info
    confidence: high
    category: testing
    location: scripts/.tests/test-hook-zai-example.sh (whole suite)
    message: >
      The production `_zai_quota_fetch` (the real curl integration) is never
      exercised by the suite -- only the canned mock is. This is mandated by
      NFR-1 (0 live network in CI), so it is an intentional consequence of the
      hermetic-seam design, not a defect. The fail-open behavior for real
      curl/network errors is validated by the mock catalog plus the validated
      POC (quota-check-poc.sh) as live-integration evidence; this reviewer also
      manually reproduced two production fetch failure modes.
    suggestion: >
      No action required. If desired, document that the POC is the live-fetch
      regression evidence so the gap is explicit rather than implicit.
    suppressed: false
    published_url: null
    published_at: null
