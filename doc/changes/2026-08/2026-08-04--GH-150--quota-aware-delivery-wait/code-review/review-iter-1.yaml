  (full key + raw body never logged; set-evn.sh is untracked/locally-gitignored).
  I empirically stress-tested the production _zai_quota_fetch failure paths
  (bad/read-only TMPDIR) and confirmed fail-open emits the WARN correctly -- no
  silent-fail defect. The findings below are advisory hardening (security
  defense-in-depth beyond the spec's log-only boundary, float-percentage
