summary: >
  The GH-150 delivery is functionally correct and spec-compliant. All 12 spec
  acceptance criteria (AC-F1-1 .. AC-NFR8-1) are satisfied; the deterministic
  suite (53 passed / 0 failed: TC-ZAI-001..071 + TC-HOOK-015..018) is green,
  the regression backbone (test-all.sh 13/13) is intact, ShellCheck is clean on
  the hook, and the doc-distribution guard passes. Every binding decision
  (DEC-1..11) and data contract (DM-1..DM-6, API-1) is honored: the generic
  sleep-driver + condition-function extension point is implemented as specced,
  the quota condition correctly takes the min over EXHAUSTED TOKENS_LIMIT
