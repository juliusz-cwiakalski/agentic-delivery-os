summary: >-
  The scaffold is structurally faithful to spec v1.1 and plan v1.2: six packages with
  exact DEC-1/DM-3 shapes, strict TS base, one aggregate check, publish double-lock,
  fail-closed license audit, additive SHA-pinned CI, protected files untouched, and an
  independently re-verified green suite (159/159, ~65s; pin/license/entrypoint checks
  re-run green by this review). However, the central deliverable — mechanical DEC-2
  enforcement — has a correctness hole: dependency-cruiser's package-name rules
  (matrix-*, subpath-*, testkit-*) cannot fire in the live tree because production
  exports resolve to dist/ which the config excludes (verified empirically in a
  production-shaped workspace: adapters->core ./state, adapters->core root, cli->mcp,
  core->testkit all cruise clean, pre- and post-build); the negative fixtures prove
  these rules only in a fixture world whose manifests point exports at src/, so 11 of
  20 rule registrations are inert on the production resolution path and the only live
  package-name gate (workspace-entrypoints.ts) sits outside the local aggregate.
  Secondary: CI obligations (TC-023 step 5, TC-025 step 3, TC-026/029 CI halves,
  TC-001/022 CI e2e) are defined-but-unobserved while the DoD marks AC-F13-1 green.
