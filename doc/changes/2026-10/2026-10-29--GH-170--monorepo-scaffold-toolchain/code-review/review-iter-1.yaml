findings:
  - id: F-1
    severity: critical
    confidence: high
    category: correctness
    location: .dependency-cruiser.cjs:17
    message: >-
      BLOCKING. The depcruise package-name rules are inert in the live tree. Production
      manifests point exports at ./dist, and the config's exclude/doNotFollow drop dist
      edges, so matrix-core/adapters/cli/mcp/opencode-importer, subpath-adapters-core-state,
      subpath-adapters-core-branding, both subpath-undeclared entries, and both testkit-*
      rules can never fire for package-name imports (post-build the edge resolves to
      excluded dist/; pre-build it is unresolvable and only the /src|dist/ deep-import
      pattern catches unresolvable specifiers). Verified empirically in a temp workspace
      with production-shaped manifests + dist present AND absent: adapters->@delivery-os/core/state,
      adapters->@delivery-os/core (root .), cli->@delivery-os/mcp, core->@delivery-os/testkit
      all cruise with zero violations, while alias/relative/runtime-specifier forms fire
      correctly. The fixture harness (tests/boundaries/harness.ts manifestFor) deliberately
      points fixture exports at ./src, manufacturing rule firings that cannot occur in
      production — RSK-T1 (fixture resolution drift) is realized, contradicting the
      harness contract's "resolve exactly as in the real workspace" and hollowing the
      TC-016 non-vacuousness proof for 11 of 20 rule registrations. The CI compensating
      control is workspace-entrypoints.ts (ts-invariants), so forbidden edges ARE blocked
      in CI, but not by the named rules, not by check:boundaries, and not by the local
      aggregate — contrary to AC-F1-1/AC-F6-1, NFR-2, and test-plan Flow 2.
    suggestion: >-
      Make fixtures mirror production (exports -> dist with dist files materialized in
      the temp workspace) and extend the affected to-path patterns to both resolution
      forms, e.g. ^packages/core/(src|dist)/state/ and ^packages/(cli|mcp|opencode)/;
      alternatively (or additionally) add a couldNotResolve catch-all for ^@delivery-os/
      specifiers so pre-build undeclared imports fail by name. Keep the clean-cruise
      controls on both forms. Re-run tests/boundaries and record the harness-contract
      correction in the plan revision log.
    suppressed: false
