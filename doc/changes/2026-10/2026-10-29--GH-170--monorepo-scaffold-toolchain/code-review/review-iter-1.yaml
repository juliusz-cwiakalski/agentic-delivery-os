      NIT. identifiersFrom silently skips expressions that fail SPDX parsing when building
      the allow set, so a malformed allow_list entry (e.g. "MIT OR") is ignored rather
      than failed; the per-entry parse check and the allow_list<->approved consistency
      check catch most but not all paths (a garbage allow_list entry that parses to
      nothing contributes no failure of its own).
    suggestion: >-
      Validate every allow_list entry with parseSpdxExpression and fail closed on any
      unparseable entry, mirroring the per-dependency treatment.
