decisions:
  - text: "OWNER DIRECTIVE (CEO resume, 2026-10-29): branch already carries owner-ordered docs commit 22aadb6 (M0 ticket wiring in backlog.md/backlog-ranking.md) — keep as first delivery commit, do NOT modify the M0 Ticket lines. Reuse proven foundation from owner's repo ~/git/cwiakalski-pub-gh/marksync-for-confluence (MIT, same owner): patterns and code may be adapted; do NOT copy branding or Confluence domain logic. ADR-0003 stays binding (pnpm workspace, six packages, changesets, publint/attw); marksync is the reference for in-package structure and toolchain detail."
    date: 2026-10-29
  - text: "Open scaffold choices resolved (chosen-from-marksync where applicable, rationale to be recorded in spec): (1) build/typecheck = tsc (marksync: tsc --noEmit typecheck + tsc emit to dist; no tsdown needed at scaffold); (2) MCP v1 artifact form = published package with .mcpb manifest, Bun-or-Node entry (per DEC-3 wording; no server implementation in M0-S1); (3) non-Bun SQLite driver fallback = node:sqlite where the supported Node version provides it (DEC-3 primary wording; implementation is M0-S5, choice recorded now per C-9 stop condition); (4) Bun pin = most recent stable at delivery time (marksync's engines.bun 1.2.23 is the reference floor, not the ADOS pin); (5) CLI startup budget = provisional placeholder recorded in spec, measured at release. Package scope must NOT hardcode 'ados' — neutral internal scope (ADR service name 'delivery-os' suggested); working name comes from config per owner."
    date: 2026-10-29
  - text: "Structure adaptation (owner-approved): marksync per-package layering (src/domain, src/app, src/infra, src/cli, src/shared) with package.json 'imports' subpath aliases (#domain/* etc.) is the proven mechanic — dependency-cruiser follows Node imports aliases by default, catching violations in alias AND relative form (marksync .dependency-cruiser.cjs verified pattern, enhancedResolveOptions). ADAPT to ADR-0003 binding tier set: core internal tiers remain domain/app/config/branding/state (DEC-2 matrix), NOT marksync's tier names; aliases + dep-cruiser mechanics + strict tsconfig set + script layout (lint/format:check/typecheck/test/check:boundaries/aggregate check) are reused. cliffy (@jsr/cliffy__command) noted in the PLAN as the future CLI framework, NOT in the scaffold."
    date: 2026-10-29
  - text: "OQ-1 RESOLVED (@decision-advisor, 2026-10-29; spec DEC-10): M0-S1 seeds doc/legal/dependency-licenses.yaml with the scaffold dev-toolchain dependency set (explicit entries for direct deps; audit fails closed on any lockfile license outside the registry allow-list, compound expressions included) and wires a minimal license-registry audit into the CI fast loop. Rationale: ADR-0003 scaffold stop condition ('a dependency has no license-registry entry') is binding — deferral would need an owner waiver of an R3 constraint and opens a several-story unaudited window the backlog-ranking note itself warns against; the seed is small/mechanical/dev-only; M0-S18 becomes pure hardening (full policy, deny-list, SBOM/notices, review-date governance). Owner PR review records the license verdicts (C-2 human determination). Flag at PR review for the ADR-0003 post-scaffold retrospective."
    date: 2026-10-29
