  - text: "Delivery risks: (1) pnpm and Bun may not be installed in this environment — quality gates need both; check availability early in delivery; (2) dual bash+TS CI stack must coexist (existing bash jobs stay authoritative per C-5/C-8); (3) husky hooks in a repo whose commits are made by AI agents — commit-msg hook must not break the ADOS commit flow; (4) 'most recent stable Bun' requires network lookup at delivery time."
