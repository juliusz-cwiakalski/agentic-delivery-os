  - text: "Review iteration 1 = FAIL (artifact: code-review/review-iter-1.yaml; 1 critical / 2 high / 2 medium / 3 low / 2 info). F-1 CRITICAL: dep-cruiser package-name rules (matrix-*, subpath-*, testkit-*) INERT in live tree — production exports resolve to excluded dist/, fixtures point exports at ./src so firings are manufactured (RSK-T1 realized); empirically verified: adapters→core ./state, adapters→core root, cli→mcp, core→testkit cruise CLEAN pre+post-build; 11/20 rule registrations inert on production path. F-2 HIGH: workspace-entrypoints.ts (the only live package-name gate, runs in CI ts-invariants) not in local aggregate — pnpm check green with forbidden edges. F-3 HIGH: AC-F13-1/NFR-8 marked met while all CI jobs unobserved — fix = recorded merge-blocking condition (all ts-* + bash jobs green on PR) + plan evidence amended to PR-time path. F-4 MED: TC-015 scope assertion tautological (constants vs constants) — literalize. F-5 MED: runtime-apis-confinement pathNot exempts ALL of adapters (ADR allows only I/O subpaths) — narrow. F-8 NIT: license-audit silently skips unparseable allow_list entries — fail closed. F-6/F-9 deferred (first-content-story / hardening). F-7 LOW: feature spec must name workspace-entrypoints.ts after F-1/F-2 settle. F-10 INFO: naming firewall CONFIRMED justified (productTokens = TC-034-bound scanner signature); pnpm 10.18.3 + attw profile + Bun copy 3 all ACCEPTED deviations; follow-up: re-attempt pnpm 12.x bump (owner ticket at PR time); awareness: core/src/contracts/index.ts Result placeholder anticipates M0-S3 — confirm shape there, don't inherit silently."
