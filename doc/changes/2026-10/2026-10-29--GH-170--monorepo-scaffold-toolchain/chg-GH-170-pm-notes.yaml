  - text: "Test plan complete: 38 TCs (TC-SCAFFOLD-001..038), 17/17 spec ACs covered, all 3 ticket ACs traced. Two runners explicit: bun test (structure/fixtures) vs scripts/checks/*.ts (must-exit-non-zero invariants) vs unchanged bash suites. NFR-7 (startup budget) untestable at scaffold — deferred per spec §7.3/DEC-5. Residual risks recorded in plan (R7 empty-inventory AST mitigation, T7)."
