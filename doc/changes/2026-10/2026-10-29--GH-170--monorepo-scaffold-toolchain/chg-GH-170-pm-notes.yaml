  - text: "RETRO: reviewer's empirical verification (production-shaped temp workspace, cruise pre+post-build) caught what fixture-based proof structurally could not: the fixtures proved the RULES fire, not that they fire IN PRODUCTION — resolution-world mismatch. 'A rule without a failing fixture is unenforced' needs a corollary: 'a fixture that fires in an artificial resolution world proves nothing about production'. Remediation makes fixtures mirror production resolution (dist materialized). This is the third scope/reality-drift class this change caught (DoR x2, review x1) — each layer of verification paid for itself."
