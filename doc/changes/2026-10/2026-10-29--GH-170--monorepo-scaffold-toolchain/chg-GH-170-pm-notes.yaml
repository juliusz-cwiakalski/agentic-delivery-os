  - text: "Scope boundary: M0-S1 is scaffold ONLY — branding module content (M0-S2), result contract (M0-S3), config layer (M0-S4), state implementation (M0-S5) are SEPARATE stories. Scaffold provides the empty-but-enforced structure: subpath exports, tier rules, boundary fixtures, toolchain, CI. No engines, no ports beyond what structure requires."
