  - text: "clarify_scope cross-check: ticket tasks map 1:1 to ADR-0003 DEC-1 (six packages, private:true + publish guard), DEC-2 (dependency matrix, dependency-cruiser, negative fixtures), DEC-3 (pnpm pin, Bun pin + four-copy equality, ESM, strict tsconfig flags, Biome, commitlint+husky, changesets fixed group, dist exports, publint/attw, CI fast loop). AC matches C-7 publish guard and boundary enforcement. No contradictions found."
    type: info
    date: 2026-10-29
  - text: "ADR delegates scaffold-step choices that MUST be recorded in the change spec: (1) build tool tsdown vs tsc; (2) MCP artifact form; (3) non-Bun SQLite driver fallback choice (C-9 makes its absence a scaffold stop condition; DEC-3: 'fallback is chosen at scaffold'); (4) Bun exact version pin = most recent stable at scaffold time. Also placeholder package scope pre-name-freeze (working name 'ados' per backlog M0-S2; packages stay private:true so no publish exposure)."
    type: decision
    date: 2026-10-29
  - text: "Scope boundary: M0-S1 is scaffold ONLY — branding module content (M0-S2), result contract (M0-S3), config layer (M0-S4), state implementation (M0-S5) are SEPARATE stories. Scaffold provides the empty-but-enforced structure: subpath exports, tier rules, boundary fixtures, toolchain, CI. No engines, no ports beyond what structure requires."
    type: info
    date: 2026-10-29
  - text: "Doc impacts for phase 7: new feature spec under doc/spec/features/ (monorepo scaffold area — always-resolve rule applies); doc/overview architecture/glossary may need monorepo mention; AGENTS.md repo-structure section lists top-level dirs (packages/ addition = doc risk); cli-command-registry.md M0-S1 row claims deliverables to verify against."
