  - text: "DoR iteration 3 = READY (10/10 facets PASS; artifact: readiness-review/readiness-iter-3.md). All iter-2 findings verified mechanically closed: byte-checked verbatim ADR L535 quotes in both artifacts; guard self-assertion is a real set-equality gate (under-coverage names missing path, over-coverage caught by state control); allowed-cell controls TC-008:5 / TC-009:15; root-e2e testkit fixture (TC-013 Case E); TC-029 layer row. 3 NON-BLOCKING nits accepted with named handling: (1) ambient ban list is representative enumeration (performance.now would pass) — extend at first content story (surface at PR review); (2) CLI-build/OpenCode-host clean-cruise controls deferred per A-T9, protected by allowlist-shape assertion; (3) harness wording seam covered by TC preconditions. Gate consumed 3/3 iterations — entered delivery exactly at cap."
