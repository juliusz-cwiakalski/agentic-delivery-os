  - text: "RETRO: gate iter-2 caught guard-scope drift on the exact surface iter-1 checked lightly — adversarial re-review with 'pull the new thread' instruction is paying off twice. Pattern: BOTH DoR catches (adapters-importer rule; ambient-guard scope) are scope-set derivation errors — authors derived rule sets from directory intuition instead of transcribing the binding ADR text verbatim. Standing lesson: any rule scope/allowlist in this change must quote the ADR cell/line it implements."
