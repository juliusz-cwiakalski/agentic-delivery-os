findings:
  - id: F-1
    severity: medium
    confidence: high
    category: security
    location: packages/core/src/state/driver/runtime-edge.ts:129
    message: >-
      appendFile creates a missing ledger via openSync(path, "a") without a mode, so the
      file momentarily exists as 0666 & ~umask and is chmod'd to 0600 only after
      write+fsync. Spec F-8 requires 0600 at creation; the window is invisible to tests
      (they stat after completion). Invocation-scale severity: minor.
    suggestion: >-
      Pass the creation mode: openSync(path, "a", 0o600); optionally add an edge note to
      TDR-0004 section 6.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    confidence: high
    category: performance
    location: packages/core/src/state/index.ts:280
    message: >-
      Every append re-reads and re-verifies the entire ledger and the sqlite kind rewrites
      the entire index (afterAppend) - cumulative O(n^2) writes under forever retention.
      Spec RSK-7 claims "append-time checksums avoid full rescans on write" and TDR-0004
      section 1 says sequence comes "from the verified ledger tail"; the shipped
      full-rescan-per-append contradicts both records. No AC threshold breached.
      Invocation-scale severity: minor.
    suggestion: >-
      Record the O(n) append-time verification honestly in a TDR-0004 amendment (and
      optionally the feature doc), or cache verified ledger state while a fence is held,
      re-verifying on acquire.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    confidence: medium
    category: correctness
    location: packages/core/src/state/index.ts:252
    message: >-
      Fence staleness is purely age-based (now - acquiredAtMs > staleFenceMs, default
      30s) with no liveness signal: a live writer holding the fence past the window can
      have it recovered and re-acquired by another process mid-write. requireFence's
      token re-check narrows but does not close the check-then-append race; worst case is
      interleaved appends caught as torn on read (never silent), but NFR-4's
      "0 concurrent double-writes landing" can be violated cross-process. Invocation-scale
      severity: minor.
    suggestion: >-
      Add the residual lease-expiry risk to TDR-0004 section 3 negative outcomes, or
      refresh acquiredAtMs on each landed append so staleness tracks activity.
    suppressed: false
    published_url: null
    published_at: null
