decisions:
  - text: "Scope is the M0-S13 provider engine family: chain resolution, quota and peak-window awareness, named self-expiring parks (cause + expiry), subscription-first ordering, and fail-loud announcements. Model-profiles selection heuristics stay out (M2 candidate); harness spawn stays out (M1-S11)."
    date: "2026-10-31"
  - text: "Provider credentials resolve only through the M0-S12 CredentialPort; the provider engine performs no direct environment reads (secret-read boundary invariant remains binding)."
    date: "2026-10-31"
  - text: "The legacy peak/quota battery (TC-ZAI-001..071 in scripts/.tests/test-hook-zai-example.sh, against scripts/hooks/pre-opencode-iteration-zai.sh) is the parity source for the ported provider test battery, adapted to the fail-loud contract (legacy fail-open warnings become structured announcements, not silent proceeds)."
    date: "2026-10-31"
  - text: "Provider engine splits pure policy (core, runtime-neutral) from I/O edges (clock and quota HTTP transport injectable in the adapters tier); parks persist through the state layer as records carrying cause and expiry."
    date: "2026-10-31"
open_questions:
  - text: "Exact v1 provider command surface under `ados provider` (registry names the family only): spec to define resolve/quota/parks subcommands against the documented purpose."
    date: "2026-10-31"
  - text: "Provider config catalog shape (chain entries, peak windows, quota policy) is unspecified beyond the story; spec to define keys consistent with the layered config schema."
    date: "2026-10-31"
  - text: "Any new provider error codes beyond the existing provider.quota.exceeded must be added to the error table in both directions (machine + documented) per the sync invariant."
    date: "2026-10-31"
blockers: []
notes:
  - text: "Legacy resolver fail-open behavior conflicts with the GH-182 AC 'provider outage is announced, not silent'; the ported battery must assert an explicit announcement record instead of a silent return 0."
    type: risk
    date: "2026-10-31"
  - text: "Doc impact: new feature spec for the provider engine, provider config keys in the config-layer spec, provider error codes in the result-contract spec, park record vocabulary in the state-layer spec, and the provider CLI row in the command registry."
    type: risk
    date: "2026-10-31"
  - text: "No blocking ambiguity found that contradicts the backlog, concepts, ADR-0003, or existing specs: the story, model-profiles concept, CLI registry, and legacy resolver define enough to specify v1. Implementation-detail decisions are delegated to the spec/plan phases and recorded rather than escalated."
    type: info
    date: "2026-10-31"
