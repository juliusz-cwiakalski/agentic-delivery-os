decisions:
  - text: "Interpretation of 'baseline committed to the local measurement log': the log is repository-local (committed under doc/planning/oss-tooling/), not a git-ignored .ai/local/ path. The AC's 'committed' and 'local' would otherwise contradict, since .ai/local/** is ignored by design."
    date: "2026-10-31"
  - text: "Scope: bind already-decided topics to their existing records instead of duplicating immutable decisions. Layout -> ADR-0003 DEC-1/2/7 (Accepted); config precedence -> ADR-0003 DEC-4 + TDR-0003; provider adapter contract -> ADR-0003 DEC-6 + ADR-0005 + ADR-0007; state schema -> ADR-0003 DEC-5 + TDR-0004; release model direction -> ADR-0003 DEC-3. New records are authored only for genuinely undecided topics: harness adapter contract, ID prefix scheme + customization model, command naming convention/man-page v1, and the release-model lock that M4-S2 elaborates."
    date: "2026-10-31"
  - text: "Names lock is prospective: the v0 command registry names are frozen as the v1 surface; no code renames are in scope. Deferred renames already applied by the v0 naming audit stand. New decision records ship Proposed; owner acceptance at PR review is the acceptance gate, matching the established ADR-0005/0007 and TDR-0003/0004/0005/0006 pattern. AI does not self-accept R2/R3 records."
    date: "2026-10-31"
  - text: "Baseline method: define each metric (ceremony share, cycle time, CI failure rate, false-signal incidents) with formula, window, and source; compute only from committed evidence (pm-notes phase timestamps, evidence artifacts, git history). Metrics not reconstructable from committed evidence are recorded as unavailable with the reason and the named source that is missing — no invented denominator or estimate presented as a measurement."
    date: "2026-10-31"
  - text: "Delivery type is docs: decision records, measurement log, and index updates. No source-code or shell changes expected; version_impact none."
    date: "2026-10-31"
open_questions: []
blockers:
  - text: "Spec C-1 forbids all changes under scripts/**, but the forbidden-literals guard requires every new user-facing doc under doc/ to be registered in scripts/checks/forbidden-literals.registry.json when absent at corpusBaseline. The two new docs (measurement-baseline.yaml, feature-measurement-baseline.md) would fail CI while the only fix is a scripts/** data edit. Verified in scripts/checks/forbidden-literals.ts lines 413-433 and the registry (userFacingDocs excludes only doc/changes/ and doc/decisions/)."
    date: "2026-10-31"
    resolved_date: "2026-10-31"
notes:
  - text: "State detection: ticket GH-186 OPEN, no labels, 0 comments, milestone M0; no open PR for GH-186; no GH-186 branch or change folder; detached HEAD at 7155074 == origin/main-tools tip, worktree clean. Fresh delivery. Branch created from origin/main-tools."
    type: "info"
    date: "2026-10-31"
  - text: "Clarify analysis: backlog M0-S17 (doc/planning/oss-tooling/backlog.md lines 335-351); ranking rank 20, gates M0 exit. Five of six named decision topics already have records (mostly Proposed); genuinely missing are harness adapter contract, ID prefix scheme, command naming convention, and measurement baseline. 'man-page v1' is undefined; the story permits 'a decision record or the man-page v1 acceptance', so the decision-record branch is chosen."
    type: "info"
    date: "2026-10-31"
  - text: "Doc risks for phase 7: doc/decisions/00-index.md has pre-existing defects (TDR-0005 row labelled TDR-0006; PDR-0002 title drift). The change updates the index for new records; whether to repair the pre-existing rows is bounded in the spec rather than left implicit. doc/planning/oss-tooling/cli-command-registry.md must be promoted from v0 to a v1-locked surface or cross-linked to the naming decision."
    type: "risk"
    date: "2026-10-31"
  - text: "Spec complete (chg-GH-186-spec.md): 20 ACs, 12 decisions (DEC-1..DEC-12), no open questions. Four new Proposed records: ADR-0008 harness adapter contract, ADR-0009 release model v1 lock, ODR-0002 ID prefix scheme + project catalog, ODR-0003 CLI command naming v1 lock. New binding register doc/decisions/00-register.md and committed baseline log doc/planning/oss-tooling/measurement-baseline.yaml (schema-versioned, MET- ids, fixed window 2026-02-01..2026-10-31, MEASURED/PARTIAL/UNAVAILABLE statuses). Bounded index repair of the two pre-existing defects. Hard constraint: 0 changes under packages/**, scripts/**, tools/**."
    type: "decision"
    date: "2026-10-31"
  - text: "PM decision on the reopened spec: amend C-1 from 'zero changes under scripts/**' to 'no script logic changes; the only permitted non-doc change is the data-only registration of the two new user-facing docs in scripts/checks/forbidden-literals.registry.json'. This is delivery-infrastructure data, not code, and matches the established precedent (GH-177 shipped a registry entry; GH-184 updated a registry). Add a constraint that the new docs must be free of the DEC-8 seed literals (ados, ADOS_, ~/.ados) except allowlisted header lines, and pin the test-plan's non-blocking OQs (p90 method, ratio representation, top-level change field)."
    type: "decision"
    date: "2026-10-31"
  - text: "Retro: the spec's zero-scripts constraint was written before checking the forbidden-literals guard's new-doc registration rule. Test planning caught it, forcing a spec reopen and a test-plan revision. Improvement: spec-writer should check repo-wide doc guards (forbidden-literals registry, doc-distribution, inception consistency) whenever it declares a docs-only change, because a new doc is not free."
    type: "retro"
    date: "2026-10-31"
  - text: "Spec reopened and amended to v1.1: C-1 narrowed to permit the data-only forbidden-literals registry registration (DEC-13, AC-C10-1, NFR-10); p90 nearest-rank, canonical 0-1 ratio, and the measurement-log change shape pinned (test-plan OQ-T2/T3/T4). Test plan revised to v1.1: 37 TCs, all 21 ACs traced, TC-GATE-005 converted from blocker to concrete registration/seed-literal checks; no open questions remain."
    type: "decision"
    date: "2026-10-31"
  - text: "Delivery plan complete (chg-GH-186-plan.md): 13 phases, 76 tasks, per-phase commit table, 21-AC coverage ledger, 37-TC to phase map, PD-1..PD-10 pins, measurement computation procedure, exact gate battery, rollback. Branch name (feat/GH-186/decision-records-and-measurement-baseline) differs slightly from the spec slug (decision-records-measurement-baseline); branch is authoritative and this is cosmetic, not a scope deviation."
    type: "info"
    date: "2026-10-31"
  - text: "DoR iteration 1 verdict NOT_READY (readiness-review/readiness-iter-1.md). Blocking: (B1) measurement corpus not computable as specified - GH-171 pm-notes is invalid YAML and the corpus contains YAML-native date/datetime values that the test-plan helpers reject; the exclusion vocabulary has no honest reason for invalid YAML. (B2) plan phase order runs review (lifecycle 8) before doc-sync (lifecycle 7), and its 21-AC trace claims Phase-12 deliverables. (B3) TC-MEAS-007 omits the included filter and would count the excluded GH-186 row. Should-fix: (S4) spec requires registering feature-measurement-baseline.md before it exists, contradicting the plan's same-commit staging; (S5) Appendix A corpus counts are wrong (41 files, 40 parseable, 30 timestamped starts, 10 date-only, 1 invalid). Notes: branch/slug mismatch; Phase-13 clean-tree assertion vs PM-modified pm-notes; unpinned ados_distribution for the new feature spec; stale implementation_plan in the test plan."
    type: "blocker"
    date: "2026-10-31"
  - text: "DoR remediation plan: reopen specification (B1 exclusion/flat-parse rules, S4 registration sequencing, S5 corpus counts, ados_distribution note), test_planning (B1 date/datetime handling, B3 included filter, stale implementation_plan), and delivery_planning (B2 phase order + AC trace, clean-tree assertion). Re-delegate in spec -> test-plan -> plan order, then re-run DoR iteration 2. Max 3 iterations."
    type: "decision"
    date: "2026-10-31"
  - text: "Retro: DoR iteration 1 found real computability defects (invalid-YAML artifact, native date values) that the spec and test plan asserted away. The spec should have grounded the corpus census by enumerating and parsing the actual files rather than stating counts. Improvement: any measurement-baseline spec must include a dry-run corpus parse (or a cited parse audit) before the DoR gate."
    type: "retro"
    date: "2026-10-31"
  - text: "DoR remediation complete: spec v1.2 (DEC-14 corpus ingestion: parse -> normalize native date/datetime -> classify; closed exclusion vocabulary; GH-171 unparseable_yaml; corrected reproducible census with command + HEAD; same-commit registration sequencing; ados_distribution internal), test plan v1.2 (native-value helpers, TC-MEAS-007 included filter, v1.2 vocabulary, implementation_plan link), plan v1.1 (doc-sync before review, 77 tasks, produced-in/verified-after AC ledger, clean-tree disposition). 21 ACs / 37 TCs preserved. Re-run DoR iteration 2."
    type: "decision"
    date: "2026-10-31"
  - text: "DoR iteration 2 verdict NOT_READY (readiness-review/readiness-iter-2.md). Closed: iter-1 B1/B2/B3/S5 and notes 7-9; census reproduced exactly at HEAD 4d79116. New blocking: (B4) sample-counter semantics contradict - DM-2 forces changes_included=23 for every metric while the cycle metric needs 20 (GH-177/185/188 lack clarify_scope.started) and the CI metric needs its observed denominator; DM-2 lacks a per-metric excluded field. (B5) TC-MEAS-006 step 2 sums unrounded pair hours while spec F-4/plan PD-5 define sums of recorded 1-decimal change-row values (raw 0.406438 vs recorded 0.406648). Should-fix: spec §18 still says 'plan Phase 12' after the reorder (now Phase 10); test-plan preconditions still use the wrong branch name. Iteration 3 of 3."
    type: "blocker"
    date: "2026-10-31"
  - text: "Retro: iteration 1 remediation fixed the corpus rule but introduced/left a per-metric sample-count contradiction and a rounding-method mismatch. Root cause: the sample model was specified globally (one spine) while metrics legitimately have different inclusion sets. Improvement: define per-metric sample counts in the schema from the start and never equate a spine count with a metric denominator."
    type: "retro"
    date: "2026-10-31"
  - text: "DoR iteration 3 remediation plan: spec DM-2 gains per-metric sample counts and per-metric exclusion reasons (spine included != metric included), and §18's Phase 12 reference becomes Phase 10; test plan aligns TC-MEAS-005/006/007/008 to per-metric counts and sums recorded 1-decimal rows, and fixes branch names; plan PD-4/PD-5 and measurement steps align. Then final DoR iteration 3."
    type: "decision"
    date: "2026-10-31"
  - text: "Iteration 3 remediation complete: spec v1.3 (DM-2 per-metric sample model with spine_rows/spine_included/spine_excluded/metric_included/metric_excluded/metric_excluded_changes; conservation rules; cycle 20/23 with GH-177/185/188 missing_metric_input; CI metric_included = denominator; old counters retired; §18 Phase 10), test plan v1.3 (per-metric assertions, GH-171 in spine_excluded, TC-MEAS-006 sums recorded 1-decimal rows, authoritative branch name), plan v1.2 (retired counters removed, cycle censoring missing_metric_input, PD-5 rounding aligned, lifecycle order confirmed). 21 ACs / 37 TCs / 13 phases / 77 tasks preserved. Final DoR iteration 3."
    type: "decision"
    date: "2026-10-31"
  - text: "DoR iteration 3 verdict READY (readiness-review/readiness-iter-3.md); iteration-2 B4/B5 and both should-fix items closed and independently re-verified. Seven non-blocking notes (5 minor, 2 nit) recorded: stale defensive clause in test-plan §2; TC-DEC-015 step 6 greps provider-quota in the wrong file; TC-GATE-005 step 2 assumes both docs registered at Phases 7/9; TC-MEAS-010 step 3 denominator rule vs count metric; PD-3 per-pair-rounding phrasing; vacuous line-wrapped absence grep in TC-DEC-014 step 4; DM-2 leaves ci_outcome domain to plan step 6. No AC/count/order/baseline value affected; delivery may start and @coder should fold them in where natural."
