  - text: "PM decision on the reopened spec: amend C-1 from 'zero changes under scripts/**' to 'no script logic changes; the only permitted non-doc change is the data-only registration of the two new user-facing docs in scripts/checks/forbidden-literals.registry.json'. This is delivery-infrastructure data, not code, and matches the established precedent (GH-177 shipped a registry entry; GH-184 updated a registry). Add a constraint that the new docs must be free of the DEC-8 seed literals (ados, ADOS_, ~/.ados) except allowlisted header lines, and pin the test-plan's non-blocking OQs (p90 method, ratio representation, top-level change field)."
