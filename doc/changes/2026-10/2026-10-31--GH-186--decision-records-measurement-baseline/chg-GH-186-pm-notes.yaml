decisions:
  - text: "Interpretation of 'baseline committed to the local measurement log': the log is repository-local (committed under doc/planning/oss-tooling/), not a git-ignored .ai/local/ path. The AC's 'committed' and 'local' would otherwise contradict, since .ai/local/** is ignored by design."
    date: "2026-10-31"
  - text: "Scope: bind already-decided topics to their existing records instead of duplicating immutable decisions. Layout -> ADR-0003 DEC-1/2/7 (Accepted); config precedence -> ADR-0003 DEC-4 + TDR-0003; provider adapter contract -> ADR-0003 DEC-6 + ADR-0005 + ADR-0007; state schema -> ADR-0003 DEC-5 + TDR-0004; release model direction -> ADR-0003 DEC-3. New records are authored only for genuinely undecided topics: harness adapter contract, ID prefix scheme + customization model, command naming convention/man-page v1, and the release-model lock that M4-S2 elaborates."
    date: "2026-10-31"
  - text: "Names lock is prospective: the v0 command registry names are frozen as the v1 surface; no code renames are in scope. Deferred renames already applied by the v0 naming audit stand. New decision records ship Proposed; owner acceptance at PR review is the acceptance gate, matching the established ADR-0005/0007 and TDR-0003/0004/0005/0006 pattern. AI does not self-accept R2/R3 records."
    date: "2026-10-31"
  - text: "Baseline method: define each metric (ceremony share, cycle time, CI failure rate, false-signal incidents) with formula, window, and source; compute only from committed evidence (pm-notes phase timestamps, evidence artifacts, git history). Metrics not reconstructable from committed evidence are recorded as unavailable with the reason and the named source that is missing — no invented denominator or estimate presented as a measurement."
    date: "2026-10-31"
  - text: "Delivery type is docs: decision records, measurement log, and index updates. No source-code or shell changes expected; version_impact none."
    date: "2026-10-31"
