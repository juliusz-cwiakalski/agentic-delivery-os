  - text: "Spec C-1 forbids all changes under scripts/**, but the forbidden-literals guard requires every new user-facing doc under doc/ to be registered in scripts/checks/forbidden-literals.registry.json when absent at corpusBaseline. The two new docs (measurement-baseline.yaml, feature-measurement-baseline.md) would fail CI while the only fix is a scripts/** data edit. Verified in scripts/checks/forbidden-literals.ts lines 413-433 and the registry (userFacingDocs excludes only doc/changes/ and doc/decisions/)."
    date: "2026-10-31"
    resolved_date: "2026-10-31"
  - text: "PRE-EXISTING, NOT CAUSED BY GH-186: `pnpm check` fails on tests/checks/privacy-release.test.ts TC-RELEASE-001 (and two related cases in a fresh worktree) because the test hardcodes the GH-184 changeset as an added file relative to origin/main-tools; after GH-184 merged, the added set is empty on every descendant. Reproduced on a clean origin/main-tools worktree (c62cdb8). Tracked separately as open issue GH-206 (priority:high, created by the CEO agent). Out of scope for GH-186 (no test/CI changes); the PR must state the exception and cannot be green until GH-206 lands."
    date: "2026-10-31"
