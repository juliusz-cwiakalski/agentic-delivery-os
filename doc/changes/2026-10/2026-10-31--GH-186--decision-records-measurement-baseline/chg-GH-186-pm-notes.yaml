  - text: "DoR iteration 1 verdict NOT_READY (readiness-review/readiness-iter-1.md). Blocking: (B1) measurement corpus not computable as specified - GH-171 pm-notes is invalid YAML and the corpus contains YAML-native date/datetime values that the test-plan helpers reject; the exclusion vocabulary has no honest reason for invalid YAML. (B2) plan phase order runs review (lifecycle 8) before doc-sync (lifecycle 7), and its 21-AC trace claims Phase-12 deliverables. (B3) TC-MEAS-007 omits the included filter and would count the excluded GH-186 row. Should-fix: (S4) spec requires registering feature-measurement-baseline.md before it exists, contradicting the plan's same-commit staging; (S5) Appendix A corpus counts are wrong (41 files, 40 parseable, 30 timestamped starts, 10 date-only, 1 invalid). Notes: branch/slug mismatch; Phase-13 clean-tree assertion vs PM-modified pm-notes; unpinned ados_distribution for the new feature spec; stale implementation_plan in the test plan."
