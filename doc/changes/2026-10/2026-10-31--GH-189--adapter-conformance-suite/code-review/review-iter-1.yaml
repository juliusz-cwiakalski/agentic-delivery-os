findings:
  - id: F-1
    severity: low
    confidence: high
    category: spec-compliance
    location: tests/conformance/live/run-live.ts:201
    message: >-
      For every provider classified `not-configured`, the live entrypoint builds `missingSettings` from the
      full documented name set (`PROVIDER_LIVE_SETTINGS[provider]` plus the token key) instead of the
      actually-missing names carried by `readLiveConfig` (`entry.missingSettings`). A provider missing only
      one non-secret setting therefore reports all 7/5/3 names — including settings that are present and a
      present token key — which contradicts "missing variable names only" (spec §10, DEC-12) and can mislead
      the operator who uses the artifact to provision tenants. The no-tenant / present-but-empty /
      whitespace AC-F7-2 cases are still correct because every name really is missing there.
    suggestion: >-
      Use `missingSettings: [...entry.missingSettings]` for not-configured providers. TC-CONF-021 step 6
      currently blesses "exactly its 7 names" after blanking one setting, so either update that expectation
      to the single missing name (and clarify spec §22) or, if the full required-name set is the intended
      contract, rename/document the field as "required-not-yet-satisfied names" and align spec/DEC-12.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: low
    confidence: high
    category: test-coverage
    location: tests/conformance/mock-conformance.test.ts:724
    message: >-
      The primitive-purity invariant ("no provider-native key appears on a normalized view") is only
      asserted negatively: the GitHub matrix asserts `failure?.assertion === "primitive-purity"` is absent,
      but no control injects a native key (for example `html_url`, `fields`, `web_url`) and proves the
      runner's `nativeKeyPaths` check fires. In mock mode a leaked native key is also caught by the exact
      expected-projection comparison, but in live mode there is no projection comparison, so the purity
      assertion is the only guard and it is never shown to be non-vacuous.
    suggestion: >-
      Add a test-only control that returns a normalized WorkItem/DeliveryRequest carrying a forbidden
      native key and assert the step fails with assertion `primitive-purity` naming the offending path.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: low
    confidence: high
    category: test-quality
    location: tests/conformance/live/live-entrypoint.test.ts:508
    message: >-
      The test "the config reader and token names stay out of packages/*/src" is vacuous: it iterates
      `listSourceFiles("packages")` and only asserts each path starts with "packages/", which is true by
      construction. It provides no evidence for its title; the preceding test ("no production source imports
      the live config reader") is the meaningful check.
    suggestion: Drop the redundant test, or replace it with an assertion that every scanned source file
      lacks the reader import and the CONFORMANCE_LIVE_ token names (without the tautological prefix check).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: low
    confidence: high
    category: test-quality
    location: tests/conformance/live/live-entrypoint.test.ts:250
    message: >-
      TC-CONF-020 step 6 ("skip the writer on failure; assert the test fails naming the missing artifact")
      is not implemented as a control. The test builds an empty local `noArtifacts` array and asserts that
      reading its first element throws "missing artifact"; it never invokes `runLive` with a writer that
      skips on failure. The real write-in-every-status guarantee is covered by the status-matrix tests, but
      this specific control is self-fulfilling.
    suggestion: >-
      Implement the control by calling `runLive` with a failure-triggering transport and a writer that does
      not record, then assert the artifact-presence check fails (or reframe the test plan to rely on the
      status-matrix tests only).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-5
    severity: low
    confidence: medium
    category: test-coverage
    location: tests/conformance/mock-conformance.test.ts:541
    message: >-
      TC-CONF-006 step 6 and TC-CONF-015 step 3 require the failure to name the request URL/method, but the
      unfixtured-request tests only assert the fixture transport recorded the URL; the runner's failure
      reference is `tenant:<provider>:<step>` and the client's transport-error detail is
      "GitHub request failed (Error)", so the diagnostic does not actually carry the URL/method. The spec's
      looser "fixture reference or request descriptor" wording is still satisfied, which is why this is
      low severity, but the stricter test-plan assertion is not verified.
    suggestion: >-
      Include the request descriptor (method + URL) in the failed step's failure reference/detail, or soften
      the test-plan wording to "the fixture transport records the request URL" so the evidence matches the
      claim.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-6
    severity: info
    confidence: high
    category: diagnostics
    location: tests/conformance/live/run-live.ts:229
    message: >-
      The synthetic non-GET guard always attributes the guard step to `providers[0]` and hardcodes
      `operation: "read-work-item"`, so a non-GET recorded for a non-first provider would be misattributed.
      This is unreachable in production (ProviderRequest.method is typed "GET" and live v1 never dispatches
      a non-read step); it only affects the test-only `recordedRequests` seam.
    suggestion: >-
      Optional hardening for a future write tier: record provider association in the recording transport and
      attribute the guard failure to the actual provider/operation.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-7
    severity: info
    confidence: high
    category: scope
    location: doc/spec/features/feature-adapter-ports.md:10
    message: >-
      Plan P8.3 describes the feature-adapter-ports update as "cross-reference only", but the diff also
      removes a duplicate `summary:`/`links:` frontmatter block and adjusts the surviving summary. The
      cleanup is correct (the base frontmatter had duplicate keys) and all doc gates pass; it is recorded
      only as a scope deviation from the plan wording.
    suggestion: Optional — note the frontmatter de-duplication in the plan revision log, or reword P8.3 to
      "cross-reference plus frontmatter cleanup".
    suppressed: false
    published_url: null
    published_at: null
  - id: F-8
    severity: info
    confidence: high
    category: test-quality
    location: tests/conformance/live/live-entrypoint.test.ts:440
    message: >-
      "both mutation counters are present in every status" asserts only `typeof ... === "number"`. Zero is
      asserted for the passed (TC-CONF-023) and failed (TC-CONF-022) paths, but the not-configured path's
      counters are not pinned to 0 even though strict teardown requires zero in every status.
    suggestion: Optional — assert `mutationRequests` and `createdArtifacts` are exactly 0 for all three
      statuses (or fold the not-configured case into the existing 0/0 assertions).
    suppressed: false
    published_url: null
    published_at: null
  - id: F-9
    severity: info
    confidence: high
    category: code-quality
    location: tests/conformance/live/run-live.ts:303
    message: >-
      The process wrapper passes `createRecordingTransport(createNativeFetchTransport())` as the transport
      factory, and `runLive` wraps the factory result in another `createRecordingTransport`. The inner
      recorder is unused (the outer recorder supplies `records`), so every live request is recorded twice.
      Harmless, but redundant.
    suggestion: Optional — pass `createNativeFetchTransport` directly from the process wrapper and let
      `runLive` own the single recording wrapper.
    suppressed: false
    published_url: null
    published_at: null
