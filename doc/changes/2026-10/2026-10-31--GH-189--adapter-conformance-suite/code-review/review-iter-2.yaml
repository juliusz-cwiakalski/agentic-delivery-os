iteration_1_resolution:
  F-1:
    severity_was: low
    status: RESOLVED
    evidence: >-
      tests/conformance/live/run-live.ts:199 now uses `missingSettings: [...entry.missingSettings]`
      for not-configured providers instead of the full documented set. The partial-config test at
      live-entrypoint.test.ts:340 asserts `github?.missingSettings` equals
      `["CONFORMANCE_LIVE_GITHUB_OWNER"]` and gitlab/jira `[]`; the all-absent/empty/whitespace cases
      at :319-322 still assert 7/5/3 and 15 names. Residual prose drift tracked as F-10.
  F-2:
    severity_was: low
    status: RESOLVED
    evidence: >-
      mock-conformance.test.ts:717 adds "a normalized view carrying a native key fails
      primitive-purity naming the path": the control returns `{...WorkItem, html_url}` and asserts
      `failure.assertion === "primitive-purity"`, `received === "html_url"`, reference
      `tenant:github:change-lifecycle.read-work-item`. The companion test at :736 proves the unmodified
      control passes the same flow with no purity failure. This shows the tier-independent
      `nativeKeyPaths` guard fires (it runs before the mock projection comparison), not just that mock
      projection catches it.
  F-3:
    severity_was: low
    status: RESOLVED
    evidence: >-
      live-entrypoint.test.ts:515 replaces the tautological prefix test with "production source is
      non-empty and free of live reader references": it scans `packages` filtered to `/src/`, asserts
      `files.length > 0`, computes offenders containing `tests/conformance/live` or
      `CONFORMANCE_LIVE_`, and asserts `offenders` is empty. Non-vacuous by construction.
  F-4:
    severity_was: low
    status: RESOLVED
    evidence: >-
      live-entrypoint.test.ts:276 "a writer that skips on failure leaves no artifact and the presence
      check fails" invokes `runLive` with the failing transport and a writer that does not record a
      failed artifact, asserts `result.status === "failed"` and `artifacts === []`, then asserts the
      presence check throws "missing artifact". Combined with the status-matrix test at :239 (failed
      run writes exactly one valid artifact via the default writer), the write-in-every-status
      guarantee is proven; the control itself demonstrates the detection mechanism. The control alone
      does not assert the writer was invoked, which the matrix covers.
  F-5:
    severity_was: low
    status: RESOLVED
    evidence: >-
      runner.ts:639-664 records `requestsBefore`, reads the transport log after a failed read, and puts
      `METHOD URL` in both the reference and the detail (`<detail> (request GET <url>)`). Tests now
      assert the actual message: TC-CONF-006 (mock-conformance.test.ts:711-713) asserts reference
      contains "GET " and "/issues/" and detail contains "/issues/"; TC-CONF-015 (:571-574) asserts
      reference and detail contain the missing SHA and "check-runs". Matches the stricter test-plan
      claim.
  F-6:
    severity_was: info
    status: CARRIED
    evidence: >-
      Not in P11 scope (info/optional). run-live.ts:212 still attributes the synthetic non-GET guard to
      `providers[0]` and hardcodes `operation: "read-work-item"`. Unreachable in production (live v1
      dispatches reads only); remains an optional future-write-tier hardening note.
  F-7:
    severity_was: info
    status: RESOLVED
    evidence: >-
      Plan revision log 1.4 (chg-GH-189-plan.md:603) now records P8.3's feature-adapter-ports update as
      "cross-reference plus duplicate-frontmatter cleanup", closing the scope-wording deviation.
  F-8:
    severity_was: info
    status: RESOLVED
    evidence: >-
      live-entrypoint.test.ts:455 "both mutation counters are pinned to zero in every status" asserts
      `mutationRequests === 0` and `createdArtifacts === 0` for passed, failed, and not-configured, and
      additionally pins the three status values.
  F-9:
    severity_was: info
    status: RESOLVED
    evidence: >-
      run-live.ts:298 now passes `createNativeFetchTransport` directly to `runLive`, which owns the
      single `createRecordingTransport` wrapper at :177-180. The double-recording in the process
      wrapper is gone (tests that pass an already-recording transport double-wrap only at test level,
      which is harmless).
