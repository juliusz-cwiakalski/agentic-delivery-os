summary: >-
  Second local review iteration of GH-189 after remediation phase P11 (commit 4f27d5a). All five low
  findings (F-1..F-5) and the two cheap info items (F-8, F-9) are genuinely resolved, verified by
  inspecting the code and tests rather than the coder report: `run-live.ts` now reports
  `entry.missingSettings` (actually-missing names only) and the partial-config test asserts the single
  blanked name; a primitive-purity positive control injects `html_url` and proves the runner's
  `nativeKeyPaths` guard fires (with an unmodified-control pass); the tautological `packages/*/src`
  scan is replaced by a non-empty offending-file scan; the writer-on-failure control now invokes
  `runLive` with a real failing transport and a skip writer; failed reads surface the attempted
  `METHOD URL` descriptor in both reference and detail and the stricter TC-CONF-006/015 assertions are
  added; not-configured mutation counters are pinned to 0 in every status; and the duplicate recording
  wrapper is removed from the process entrypoint. No assertion was weakened and no regression was
  introduced. The reviewer independently re-ran pnpm build, pnpm check (1733 pass / 2 skip / 0 fail
  across 155 files; depcruise 125 modules; secret-read 106 files / 4 allowlisted; exports-parity 5),
  bun test tests/conformance (79), tests/structure (289), tests/checks (338), tests/boundaries (133),
  all nine invariant scripts, doc-distribution (81 docs) and git diff --check, and confirmed the
  protected paths and ci.yml are byte-unchanged. The only residual issue is low severity documentation
  drift: the partial-config "actual missing names" contract was not propagated to test-plan
  TC-CONF-021 step 6, plan P5.8, and the pm-notes delivery note, which still say "exactly its 7
  names"/"full documented name list". All 22 spec ACs and 3 ticket ACs remain satisfied; no blocker or
  major finding.
