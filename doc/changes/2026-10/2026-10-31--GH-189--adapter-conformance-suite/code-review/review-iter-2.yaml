findings:
  - id: F-10
    severity: low
    confidence: high
    category: documentation-truth
    location: doc/changes/2026-10/2026-10-31--GH-189--adapter-conformance-suite/chg-GH-189-test-plan.md:836
    message: >-
      P11.1 changed the partial-configuration contract so a not-configured provider reports only the
      actually-missing names (`entry.missingSettings`), and the delivered test now asserts
      `["CONFORMANCE_LIVE_GITHUB_OWNER"]` after blanking one GitHub setting. But the change was not
      propagated to the controlling prose: test-plan TC-CONF-021 step 6 still says "exactly its 7
      names", plan P5.8 (line 327) still says "exactly its 7 names", and the delivery note in
      chg-GH-189-pm-notes.yaml (line 70) still records "not-configured providers report their full
      documented name list" as an accepted deviation. The spec is already correct (AC-F7-2 and §22 say
      "missing names only"), so this is stale documentation, not a behavior defect — the same
      propagation gap the DoR caught when the occupancy mechanism changed.
    suggestion: >-
      One documentation-only pass: update TC-CONF-021 step 6 to "only the blanked name is listed"
      (the all-absent/empty/whitespace cases keep 15 names 7/5/3), reword plan P5.8's occupancy
      control to match P11.1, and correct the pm-notes delivery deviation to note that P11 superseded
      the full-list behavior. No code or AC change.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-11
    severity: info
    confidence: high
    category: code-quality
    location: packages/testkit/src/conformance/runner.ts:169
    message: >-
      The new failure-descriptor helper reads an optional transport log via duck typing
      (`transport.requests` or `transport.records`) that is not part of the `ConformanceTransport`
      interface. It is guarded with `isRecord`/`Array.isArray` and only activates when a transport
      exposes the log, so it is safe today (the mock tenant exposes `requests`, the live recording
      wrapper exposes `records`), but the coupling is implicit and a future transport that exposes a
      differently shaped or non-request log could be misread.
    suggestion: >-
      Optional hardening: add a narrow optional accessor (for example `requestLog?(): readonly
      { method: string; url: string }[]`) to the transport contract or a typed structural guard, and
      document the seam used to surface the request descriptor. No action required for v1.
    suppressed: false
    published_url: null
    published_at: null
