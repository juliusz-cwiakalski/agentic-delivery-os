decisions:
  - text: "Scope of 'every shipped adapter' = the provider adapters that implement a real AdapterContract behind the primitive ports: github, gitlab, jira (M0-S19 read slices). Placeholder subpaths (azure, ci) and non-provider I/O subpaths (repo, file, host, session, legacy, credentials, provider-quota, registry) have no provider-primitive surface, so they are out of scope for provider flows; a structural coverage gate must fail when a new *_ADAPTER_CONTRACT source appears without conformance registration."
    date: "2026-10-31"
  - text: "Capability-gated execution: each conformance step declares the ADAPTER_OPERATIONS operation it proves. A supported operation executes against a deterministic mock tenant; a step whose operation is unsupported records an explicit skip carrying the declared gap reason. A supported-but-uncovered operation, or a declared gap never encountered, fails the suite. This is the only honest v1 shape because all M0 shipped adapters are read slices."
    date: "2026-10-31"
  - text: "CI gate placement: mock conformance runs inside the existing `pnpm test` path (ts-test and ts-aggregate). No new ci.yml job — that would require weakening the pinned CI topology invariant (tests/checks/ci-checks.test.ts asserts the exact job set). 'An adapter change that breaks a flow fails CI' is satisfied by the existing test jobs."
    date: "2026-10-31"
  - text: "Live tier v1 is read-only evidence, not a merge gate (ADR-0003: 'A live e2e run is additional evidence, not the gate'). Scheduled weekly plus workflow_dispatch; every run records a machine-readable result artifact with status passed | failed | not-configured. A not-configured run exits 0 (no false alarm before tenants exist); a failed run exits 1. Strict teardown is asserted as zero mutation requests and zero created artifacts because v1 flows only read; write-flow create/teardown joins with M1-S4."
    date: "2026-10-31"
  - text: "No automatic tracker ticket on a scheduled live failure in v1: creating one needs write-work-item, which every shipped adapter declares as a gap (full GitHub write adapter is M3-S3), and ADR-0003 makes live runs evidence rather than gate. The failing scheduled run plus its uploaded artifact are the signal; auto-ticketing is deferred with the write path."
    date: "2026-10-31"
  - text: "Comment provenance roundtrip v1 executes according to declared capabilities: the read half runs wherever WorkItem.comments is supplied (Jira), and the carrier roundtrip runs only for adapters that declare writable/readable carriers (all shipped adapters declare none, so it records a declared-gap skip). The flow stays registered so the first carrier-declaring or write-capable adapter executes it without suite rework."
    date: "2026-10-31"
  - text: "GitHub state_reason / canceled distinction stays unmodeled (closed -> done); live-shape revalidation is delivered by the scheduled live tier, which catches provider-shape drift through normalization and primitive assertions. No core-contract change is needed for this story."
    date: "2026-10-31"
  - text: "Live tenant configuration (base URLs, seeded artifact ids, token credential references) is read only by the scheduled entrypoint under tests/ (outside the secret-read scan scope), and token material is resolved exclusively through the adapters ./credentials CredentialPort. No new secret-read allowlist entry and no ambient environment read in packages/*/src."
    date: "2026-10-31"
open_questions:
  - text: "Which concrete scratch repositories / Jira sandbox and secrets the owner will provision for scheduled live runs; the workflow is tenant-agnostic and records not-configured until the documented environment names are supplied."
    date: "2026-10-31"
blockers:
  - text: "DoR iteration 1 = NOT_READY (2 blocking): (B-1) not-configured presence-by-name is wrong for GitHub Actions, which materialises unset vars/secrets as present empty strings, so a no-tenant scheduled run would be classified configured and fail instead of not-configured/exit 0; fix = treat undefined/empty/whitespace as missing and test the present-but-empty shape. (B-2) test plan says Jira has three non-secret settings while spec §22/plan D-6 use two. Reopened specification, test_planning, and delivery_planning for one remediation pass; re-run gate after."
    date: "2026-10-31"
