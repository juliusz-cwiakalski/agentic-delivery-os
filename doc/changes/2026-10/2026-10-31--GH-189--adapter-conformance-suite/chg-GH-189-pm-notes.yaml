  - text: "DoR iteration 1: NOT_READY, 2 blocking / 6 advisory / 4 nit. The blocking find is a genuine mechanism defect the authoring chain missed: GitHub Actions evaluates unset vars/secrets to present empty strings, defeating a presence-only not-configured check. Also caught a test-plan Jira setting-count contradiction the plan had flagged but deliberately left unfixed. Advisory set hardens ticket AC-2 evidence (if-no-files-found: error, --out equals upload path), control write dispatch, declaration-only registration scan, artifact skipKind, privacy/forbidden-literal gates, and repository-wide workflow invariant scope."
    type: "retro"
    date: "2026-10-31"
  - text: "DoR iteration 2: NOT_READY, 1 blocking / 4 advisory / 2 nit. The B-1 mechanism and B-2 count are resolved, but the fix did not propagate to AC-F7-5 and three prose statements that still say token values are never read while occupancy requires inspecting the token source key. Lesson: when a mechanism changes, sweep every acceptance criterion and prose boundary that mentions the old behavior, not just the primary section. Remaining advisories are cheap alignment items (flat steps provider/flowId, TC-CONF-013 handler, TC-CONF-027 static control, AC-F2-3 skip kind)."
    type: "retro"
    date: "2026-10-31"
  - text: "DoR iteration 3: READY, all 10 facets PASS, 0 blocking / 2 advisory / 4 nit. Artifacts frozen at spec v1.2, test plan v1.2, plan v1.3. Accepted non-blocking items: A-1 (unify ticket-AC-3 evidence list to TC-CONF-010/011/016/017/032 in P8.5), A-2 (P8.3 must add .ai/rules/testing-strategy.md), NIT 3-6 (coder directives: use validateWorkflow(text)+validateWorkflowRoot(root); skipReason/skipKind null for executed/failed and skipKind mandatory only when skipped; readLiveConfig returns { settings, credentialReference, occupancy: present|missing, missingSettings }). Delivery starts at P1."
    type: "info"
    date: "2026-10-31"
  - text: "Delivery complete: P1-P8 committed (51c7b70, 3c0b973, 7cf69db, adfa922, 2ab1712, 8083690, b5a72a5, ac7fc71). Verified independently: 20 commits ahead of main-tools; commitlint passes over the full range; ci.yml byte-unchanged; packages/core and packages/adapters production diff empty; secret-read allowlist exactly 4; tests/conformance 77 pass / 0 fail; pnpm check reported 1731 pass / 2 skip / 0 fail. Coder deviations accepted: changeset landed in P4 (privacy-release invariant requires it), GitLab tenant uses a single-segment project path (avoids the sanitization audit misreading %2F as an undeclared placeholder), not-configured providers report their full documented name list, and a test-only recordedRequests seam feeds the synthetic POST control. Known gap: live tenants not provisioned (OQ-1), so scheduled runs are not-configured/exit 0 until owner supplies vars/secrets."
    type: "info"
    date: "2026-10-31"
  - text: "Process deviation: the coder had no subagent tool in its session, so it created the eight phase commits directly instead of delegating each to @committer. Verified after the fact: all eight subjects are Conventional Commits, and `pnpm exec commitlint --from origin/main-tools --to HEAD` passes for all 20 commits. No action required beyond noting the delegation gap."
