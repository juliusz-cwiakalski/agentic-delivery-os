  - text: "DoR took 3 iterations: iteration 1 caught a real GitHub Actions empty-string mechanism defect and a Jira count contradiction; iteration 2 caught incomplete propagation of the fix into AC-F7-5/prose; iteration 3 passed. The adversarial gate did its job, but the authoring chain should have swept acceptance criteria and prose after changing a mechanism. Cost: three documentation-only remediation passes; no code churn."
