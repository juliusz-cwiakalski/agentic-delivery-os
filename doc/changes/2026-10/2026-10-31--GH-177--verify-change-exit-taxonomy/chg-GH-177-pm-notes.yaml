  - text: "PM scope interpretation (pinned by spec v1.0): M0-S8 is ledger-only verification. The result enum equals the bash-era deliver-ticket.sh summary enum (merged|blocked|pr-open|pr-open-unverified|failed|finished|max-restarts|state-unverified|partial|noop-lane-permission|noop-lane-nothing-to-do) so M1-S9 dual-run evidence compares like with like. Tracker/PR evidence collection is M0-S19/M1-S9; M0-S8 derives its verdict from pm-notes (declared variant) plus the verified phase ledger and classifies the ledger-observable outcomes (finished|partial|failed|state-unverified), naming missing required phases."
    date: "2026-10-31"
  - text: "PM decision (precedent-setting, recorded): TDR-0005-delivery-result-enum-and-cli-exit-taxonomy.md adopts the eleven bash tokens verbatim as the single CLI vocabulary with a total taxonomy; CLI exits derive only from the result-contract projection classes. One deliberate divergence: state-unverified -> platform-provider -> exit 2 (bash exits 1). Token parity, not numeric exit parity, is the dual-run comparison unit; broken invocations stay fallback.invocation -> 1. Status Proposed pending owner ratification at PR review."
    date: "2026-10-31"
open_questions:
  - text: "Exit-taxonomy tension to pin in specification: the bash summary maps finished/pr-open/merged/blocked/noop-lane-nothing-to-do to exit 0 and failed/max-restarts/partial/noop-lane-permission/state-unverified to exit 1 (2 = usage), while the CLI result contract projects success->0, user-validation->1, platform-provider->2. Decide and document the exact per-result projection (including whether state-unverified is platform exit 2 or bash-parity exit 1) without breaking envelope exclusivity. Delegate to @decision-advisor only if precedent-setting."
