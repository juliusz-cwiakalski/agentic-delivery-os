open_questions:
  - text: "Where is the bash session-database admin prototype the ticket calls 'surface inlined in the ticket'? The issue body has no prototype. Please provide the prototype source (script or commit) or its exact command surface for size, list, prune, and reboot."
    date: "2026-10-31"
  - text: "DB access path: should `ados db` invoke the opencode CLI (`opencode db \"<SQL>\"`) the way pm-liveness.sh and ceo-loop.sh do, or open the opencode session SQLite file directly read-only? ADR-0003 defines SessionStore as a read-only metadata-only port, while prune/reboot mutate: which layer owns the mutation?"
    date: "2026-10-31"
  - text: "Prune selection rule: what is prunable (age threshold, orphaned sessions, message rows, VACUUM) and what exactly is the 'live session lock'? How is liveness detected (session id, PID, lock file, recent session traffic)?"
    date: "2026-10-31"
  - text: "Reboot helper semantics: what should `ados db reboot` do (restart the opencode server/CLI, clear stale locks, something else), and under what safety guard?"
    date: "2026-10-31"
  - text: "Bounded output contract: which fields and caps should `db size` and `db list` emit (and in which human/JSON shape)?"
    date: "2026-10-31"
  - text: "ADR-0003 C-11 requires an explicit privacy sign-off before the db administration engine that uses SessionStore ships. Is sign-off granted now, or should the PR land with sign-off recorded as an owner merge gate?"
    date: "2026-10-31"
blockers:
  - text: "Missing prototype surface blocks specification: destructive prune/reboot behavior and the live-lock safety guarantee cannot be specified without inventing requirements. Ticket labelled human-input-needed and assigned to the owner; delivery stopped at clarify_scope. A fallback default is proposed in the ticket comment should the owner prefer to unblock without the prototype."
    date: "2026-10-31"
notes:
  - text: "Cross-check vs current system docs: ADR-0003 DEC-6/C-11 defines SessionStore as read-only, metadata-only access to foreign session databases for db administration and requires an explicit privacy sign-off before the db engine ships. The adapters ./session subpath is a types-only stub. The CLI composes command definitions through an injected program (no bin entry), so M0-S11 would add a db command definition plus edge wiring. The opencode session DB is currently read only through `opencode db` / `opencode session list` in scripts/pm-liveness.sh and scripts/ceo-loop.sh; no prune or reboot helper exists in repo history."
    type: "info"
    date: "2026-10-31"
