decisions:
  - text: "State detected before acting: GH-180 open, no labels, no assignee; no branch, no PR (open or closed), no change folder, and no GH-180 commit in history. Fresh delivery, not a resume."
    date: "2026-10-31"
  - text: "Branch plan: feat/GH-180/db-session-admin-port cut from origin/main-tools @ 7155074; merged origin/main-tools @ b31ec47 before delivery (159 files, no conflicts). The merge brought status v1 (GH-175), license/release-shape (GH-187), decisions/measurement (GH-186), memory (GH-204), and the tree-invariant test generalization (d63eb2a)."
    date: "2026-10-31"
  - text: "clarify_scope STOPPED at intake: the ticket states the admin prototype's surface is inlined in the ticket, but the issue body contains only the backlog summary and comments are empty; an all-refs/all-history search found no session-database admin prototype. The ticket was labelled human-input-needed and assigned to the owner."
    date: "2026-10-31"
  - text: "clarify_scope RESUMED under the CEO resume directive (2026-10-31): proceed from clarify_scope onward. The missing prototype is resolved by the fallback already offered on the ticket and now adopted as a PM decision (reversible; owner may amend at PR review): `--dry-run` default; prune only sessions older than a documented threshold and never a live one; `--apply` required to mutate; reboot guarded by the same live-session check."
    date: "2026-10-31"
  - text: "PM-decided (unblock, reversible): the db surface is `size`, `list`, `prune`, `reboot`; DB access is the opencode CLI (`opencode db \"<SQL>\"`, `opencode session delete <id>`, `opencode db path`) as the existing scripts already use it, never a second direct-SQLite path. ADR-0003's `SessionStore` stays read-only/metadata-only; a separate `SessionAdminPort` owns the mutating operations."
    date: "2026-10-31"
  - text: "PM-decided (unblock, reversible): 'live session lock' is defined for this change as (a) a session with activity inside the live window (15 minutes) and (b) the SQLite WAL/SHM sidecars. `prune` never touches DB files or WAL/SHM, only session rows through the official `opencode session delete`; `reboot --apply` performs a bounded WAL checkpoint only when no live session exists and never kills a process or deletes a sidecar file."
    date: "2026-10-31"
  - text: "PM-decided (unblock, reversible): prune deletes leaf sessions only (a session with any child `parent_id` is skipped) because `session.parent_id` has no foreign key and the opencode schema does not cascade descendants; this prevents orphaned child sessions. `session_delete` cascades message/part/session_message/session_share/session_input/session_context_epoch/todo."
    date: "2026-10-31"
  - text: "PM-decided (unblock, reversible): ADR-0003 C-11 privacy sign-off is recorded as an explicit owner merge gate in the PR/spec, not a delivery blocker. The change is delivered with the PR left open; merge authority stays with the CEO/human. No merge is performed by the PM."
    date: "2026-10-31"
  - text: "PM-decided (baseline repair): the full gate exposed a pre-existing test-environment defect — `tests/checks/config-default-positions.test.ts` calls `mkdtempSync(join(ROOT, 'tmp', 'tmpdir', ...))` without creating the parent. The change may add the missing `mkdirSync(..., { recursive: true })` as a tree-invariant test-environment repair so the merge-blocking gate is deterministic. This is a test-only repair, not a behaviour change."
    date: "2026-10-31"
  - text: "PM-decided (invariant-preserving): rename the reboot failure identity from the hyphenated `db.reboot.live-session` to the conforming three-segment `db.reboot.live`, because the error-code format is `^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*){2,}$` (no hyphens). This avoids a gate-adjacent code-format exemption; the spec, test plan, and plan are amended in place. No AC/TC count change."
    date: "2026-10-31"
