  - id: F-1
    severity: critical
    confidence: high
    category: correctness
    location: packages/adapters/src/session/index.ts:519
    message: >-
      BLOCKER. RE_READ_SQL selects only id, time_updated, has_children, but
      readCandidate -> readSessionRow requires time_created (and message/part/
      bytes). Against the real opencode db JSON projection asNumber(undefined)
      throws db.query.failed (field session.time_created) before any delete, so
      prune --apply can never delete on a real store. The throw is outside the
      inner try, so even a post-land parse error would be misclassified as
      db.query.failed instead of db.delete.failed. Reproduced with a minimal-row
      fake: zero delete calls, db.query.failed.
    suggestion: >-
      Select every column readSessionRow reads (or build a minimal re-check
      fact), move readCandidate/classifyPruneCandidate inside the guarded block
      so post-land failures map to db.delete.failed with landed truth, and add
      a real-projection regression test.
