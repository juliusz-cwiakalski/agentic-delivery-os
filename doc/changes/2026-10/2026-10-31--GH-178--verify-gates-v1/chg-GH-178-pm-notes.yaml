decisions:
  - text: "Command surface is `verify gates <changeRef>`: the change ref selects the pm-notes ledger and ticket evidence, while the current checkout identifies the delivery branch. No PR-number argument in v1; a detached HEAD or absent open PR fails the relevant gate rather than passing vacuously."
    date: "2026-10-31"
  - text: "Owner-gate scan reuses the existing owner-attention contract (`hand-back`, `human-input-needed`) on the open work item, matching status-digest semantics. Unanswered-comment detection is out of scope because the GitHub read slice omits comment sets (ADR-0006)."
    date: "2026-10-31"
  - text: "Missing-job detection needs a declared expected job set. The design uses the repository's CI workflow job names read at the runtime edge as the declared CI topology; an unreadable or empty expected set is a gate failure, never a green."
    date: "2026-10-31"
  - text: "Push parity compares the local checkout HEAD SHA with the delivery request head SHA for the same branch. A missing PR, unreadable head, or unresolvable SHA fails the gate."
    date: "2026-10-31"
  - text: "Squash preflight verifies the PR targets `main-tools` (the integration base per AGENTS.md), is open and non-draft, and has a non-vacuous commit/change surface. Unknown mergeability is not treated as mergeable."
    date: "2026-10-31"
open_questions:
  - text: "Whether a later story should accept a PR number or arbitrary ref as the gate target. Deferred; v1 operates on the checked-out delivery branch."
    date: "2026-10-31"
