findings:
  - id: F-1
    severity: major
    confidence: medium
    category: spec-compliance
    location: packages/core/src/domain/queue-ready.ts:784
    message: >-
      `assembleReasons` emits group-5 (condition-source-failure) reasons by
      iterating the fixed `QUEUE_READY_SOURCE_FAILURE_REASONS` array order, not
      by walking `QUEUE_READY_CONDITION_ORDER` and each condition's evidence
      array as spec DM-1, plan §"reasons" (plan lines 143 and 249), test-plan
      TC-QREADY-034 step 6, and doc/spec/features/feature-queue-ready.md line
      145 require. For the `reasons-cap-7` corpus row the walk order is
      `local-context-missing` (repo-free, condition 2) then `signal-unavailable`
      (tier-known, condition 3), but the implementation and the fixture both
      emit `signal-unavailable` then `local-context-missing` (verified by
      direct evaluation). The corpus expectation encodes the array order, so
      the committed test suite masks the deviation rather than asserting the
      documented behaviour.
    suggestion: >-
      Change `assembleReasons` to build group 5 by walking candidates (pin the
      candidate traversal order) -> `QUEUE_READY_CONDITION_ORDER` -> each
      condition's evidence, appending only `QUEUE_READY_SOURCE_FAILURE_REASONS`
      at first occurrence, and update the `reasons-cap-7` corpus expectation
      plus any affected goldens. Alternatively, if the constant-array order is
      intended, amend spec DM-1, the plan, test-plan TC-QREADY-034 step 6, and
      the feature doc together and record the decision; the artifacts must not
      disagree.
    suppressed: false
    published_url: null
  - id: F-2
    severity: major
    confidence: high
    category: correctness
    location: packages/core/src/domain/queue-ready.ts:900
    message: >-
      The machine byte bound uses `JSON.stringify(payload).length` (UTF-16 code
      units) at lines 900 and 907 to decide whether the payload exceeds
      `QUEUE_READY_MAX_MACHINE_BYTES` (65 536 bytes), and the byte-budget
      reduction loop relies on the same `.length` check. `.length` is not a
      UTF-8 byte count, so non-ASCII provider data (labels, relation-target
      entityIds, owner/name, branch, PR refs) can produce a payload whose true
      byte size exceeds 65 536 while `.length` stays under the cap and no
      reduction runs. Reproduced with 8 candidates, 16 CJK labels and 16 CJK
      relation targets each: emitted payload had UTF-16 length 50 351 but
      115 887 bytes, a direct NFR-2 / AC-F12-1 violation. The tests/goldens use
      ASCII only, so the bound is never exercised with multi-byte data; the
      human digest is likewise only guaranteed for ASCII (its 4096-byte cap is
      checked in tests but not enforced in the renderer).
    suggestion: >-
      Measure UTF-8 bytes (`new TextEncoder().encode(serialized).length` or
      `Buffer.byteLength`) for the budget decision and every `fits()` recheck,
      and drive the human digest bound from UTF-8 bytes as well; add a
      non-ASCII cap-sized fixture (e.g. CJK/astral labels and relation targets)
      asserting `Buffer.byteLength(JSON.stringify(data)) <= 65536` and the
      4096-byte human bound.
    suppressed: false
    published_url: null
  - id: F-3
    severity: minor
    confidence: high
    category: correctness
    location: packages/core/src/domain/queue-ready.ts:81
    message: >-
      Ranking tie-break `refNumber` parses the numeric suffix with `Number(...)`
      and `compareCandidates` subtracts the two numbers. The spec says the
      suffix is parsed "as a base-10 integer", but `Number` loses precision above
      2^53, so refs with >=16-digit suffixes compare equal and fall through to
      text order. Verified: candidates `GH-9999999999999999` and
      `GH-10000000000000000` rank as `GH-10000000000000000` first, which is the
      reverse of numeric order. `compareNumericAware` already uses `BigInt` for
      PR `entityId`, so the two numeric comparisons are inconsistent.
    suggestion: >-
      Compare numeric suffixes with `BigInt` (or a length-then-lexicographic
      big-integer comparator) in the candidate ranking path, and add a
      large-suffix ordering case to the ranking fixtures.
    suppressed: false
    published_url: null
