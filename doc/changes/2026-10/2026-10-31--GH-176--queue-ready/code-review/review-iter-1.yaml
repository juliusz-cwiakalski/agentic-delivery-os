summary: >-
  The delivery is broad and high quality: the command grammar/reject-before-read
  ordering, six tri-state conditions, identity bridge, close association,
  deterministic tie-break, read-only posture, and the shared
  collectStatusFacts extraction are all implemented and tested, and the full
  queue-ready/status/invariant suites are green. Two contract-level defects
  remain. First, top-level reason group 5 is emitted in the constant-array
  order, while spec DM-1, the plan, the test plan (TC-QREADY-034 step 6), and
  the current-truth feature doc require a QUEUE_READY_CONDITION_ORDER +
  evidence-order walk; the `reasons-cap-7` corpus fixture encodes the array
  order and masks the deviation. Second, the 65 536-byte machine bound is
  measured with UTF-16 string length rather than UTF-8 bytes, so non-ASCII
  provider data can produce a payload that exceeds the hard byte cap (verified:
  115 887 bytes) without triggering the byte-budget reduction.
