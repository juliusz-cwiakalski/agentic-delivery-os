  - id: F-5
    severity: minor
    confidence: medium
    category: correctness
    location: packages/core/src/domain/queue-ready.ts:948
    message: >-
      String caps/segment shortening slice by UTF-16 code units
      (`clampValue` at 99–103, `shortenSegment` at 948–951). Slicing at the cap
      can split an astral surrogate pair, yielding a lone surrogate (invalid
      text) in a projected provider field or the human digest. Tests measure the
      human segment with `Array.from(segment).length` (code points) while the
      renderer slices code units, so the two disagree for non-BMP input.
    suggestion: >-
      Slice by code point (`Array.from(value).slice(0, cap).join("")`) or use a
      UTF-8-byte-aware truncation that never splits a surrogate pair, and
      exercise an astral-character fixture.
    suppressed: false
    published_url: null
  - id: F-6
    severity: info
    confidence: high
    category: correctness
    location: packages/core/src/domain/queue-ready.ts:393
    message: >-
      `ciCondition` maps any `StatusReadFailure.reason` other than
      `credential-unavailable`/`commit-unresolved` to `read-failed`, including
      the declared `not-configured` reason. This is not reachable through the
      composed command (the target is set when the binding is observed), but a
      `not-configured` read would be mislabeled as an attempted `read-failed`
      rather than a distinct evidence case.
    suggestion: >-
      Consider an explicit branch (or a defensive mapping) for `not-configured`
      so the evidence vocabulary stays accurate if the composition changes.
    suppressed: false
    published_url: null
