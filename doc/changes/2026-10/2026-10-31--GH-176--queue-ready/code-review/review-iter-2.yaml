summary: >-
  Iteration-2 re-review of the GH-176 remediation. F-1, F-3, F-4, F-5, F-6 and
  F-8 are independently verified closed, and F-7 remains an accepted defensive
  branch. The machine UTF-8 bound (F-2) is fixed and exercised by the CJK
  fixture, but the human half of F-2 is not: a legal payload (8 candidates,
  astral head branch at its 256-code-point cap, associated PR refs within their
  128-code-point caps) renders to >4096 UTF-8 bytes, so `renderQueueReadyHuman`
  throws and the command exits 2 with `fallback.internal` instead of producing
  the bounded digest that spec DM-12/F-13/AC-F13-1 and the feature doc
  promise. The spec's 400-byte-line/620-byte-header derivation is ASCII-only.
  Three minor issues and one info issue are also recorded (golden fixture not a
  valid DM-1/DM-2 payload, unasserted reduction order, an unplanned
  `classifyPipelineRuns` public re-export, and stale spec-version references).
  The full default suite (1786 pass / 3 skip / 0 fail) and all invariant checks
  are green; the defects above are reachable only through contract-level
  probes, not the current test corpus.
