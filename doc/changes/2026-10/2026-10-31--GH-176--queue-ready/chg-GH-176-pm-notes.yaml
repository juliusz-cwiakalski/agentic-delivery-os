decisions:
  - text: "Review iter-1 remediation decisions. F-1: the specs/plan/test-plan agree on the condition/evidence walk, so fix the code to the documented walk (not the docs to the array order) and update the corpus/golden. F-2: enforce machine and human bounds in UTF-8 bytes with a runtime-neutral pure helper and a non-ASCII cap fixture; UTF-16 `.length` is not the contract. F-3: use BigInt/length-then-lex ranking. F-5: code-point-aware slicing. F-6: map `not-configured` CI distinctly. F-4: mark Phase 7 complete in plan/evidence. F-8: spec Appendix B now carries `relationKind: \"blocked-by\"`. F-7 (dead defensive branch) is accepted as documented and needs no action."
    date: "2026-11-01"
  - text: "DoR process decision (iter-5): the final authorized re-gate closed all R-37..R-42 and returned 0 critical, 1 major (R-43), 2 minor, 4 nit. R-43 is a factual implementation-plan error (issues/pulls read gated on SHA; must be binding-only, with SHA gating only check-runs) and is fixed. PM authorizes one last scoped correction pass (R-43..R-49) and one re-gate (iteration 6). If iteration 6 returns READY, delivery proceeds. If it returns a substantive critical/major finding, delivery stops for human input. If it returns only cosmetic minor/nit residuals after R-43..R-49 are fixed, PM will record an explicit, disclosed override for those cosmetic residuals and proceed, because the gate's substantive requirements would be satisfied and the residual cannot change behavior."
    date: "2026-11-01"
  - text: "DoR process decision (iter-4): the authorized re-gate closed all seven R-30..R-36 findings and returned 0 critical, 1 major (R-37), 2 minor, 3 nit. R-37 is a test-plan satisfiability contradiction, not a product decision: the negative-control row must assert the targeted condition/source rather than 'no control is ready', because unknown close association does not block readiness. PM authorized exactly one final scoped correction pass (R-37..R-42) and one re-gate (iteration 5); no gate override."
    date: "2026-11-01"
  - text: "DoR process decision (iter-3): the third gate returned NOT_READY with 1 critical + 2 major + 3 minor + 1 nit, all mechanical/cross-artifact corrections with no product decision. PM authorized one scoped correction pass (R-30..R-36) and one re-gate (iteration 4), mirroring the GH-175 precedent; not a gate override. Iteration 4 closed all seven findings and left one new major test-plan satisfiability defect."
    date: "2026-11-01"
  - text: "DoR iter-2 remediation decisions. R-21: forbid `available` only in provider evidence/availability claims and exempt the condition id `provider-available`; scope the scans. R-22: pin a provider-agnostic identity-matching rule (normalized entityId matches the canonical ref case-insensitively, or the candidate numeric suffix equals a bare-numeric entityId), add a GitHub-shaped command-level case, and add an opt-in live assertion that a known candidate is observed. R-24: bound provider-derived payload fields with declared caps, clamp output only without changing verdicts, and mark clamped payloads; add an over-long provider-field command-level case. R-26: keep read-failed/credential-unavailable exclusively in group 5 and pin `pr-association-unknown` last in group 6. R-29: project only `blocked-by` relations into the candidate observation. R-23: map provider config failure by the read's reason (config-invalid vs provider-chain-unresolved) and add a command-level case. R-25: scope the all-clear token scans to the affected evidence/human segment and allow pinned vocabulary. R-27: replace the spec-digest assertion with the status precedent or a contract fixture. R-28: Phase 7 must describe the live smoke generically without the ADOS_ literal."
    date: "2026-11-01"

  - text: "DoR iter-1 remediation decisions. R-04: keep the merged/closed never-open-close-item rule as a pure-evaluator provider-agnostic invariant; test it at the evaluator layer only and remove command-level corpus claims that an open-only read can observe it. R-18: drop `workItem.title` from the machine payload and the title-clamp case (not required by the ticket; smaller privacy/byte surface). R-06: align the plan to the spec's single deps evidence record with state counts; do not invent comma-joined target lists, and repurpose or drop the unreachable evidence-overflow case. R-07: `work-item-unobserved` takes precedence over `relations-unavailable` when the candidate itself is unobserved; pin and test the combined case. R-10: no new help surface in this change; restate the spec's help/registry note as documentation and remove the help-descriptor test step. R-01: the live switch is a test-tree literal only, never a production constant. R-02: add an explicit max work-item ref length and pre-read rejection. R-19: accept the D3/D4 proxy caveat and name the source in human detail."
    date: "2026-10-31"
  - text: "State detection: GH-176 is open, unlabeled, zero comments, assigned to no one; no GH-176 branch, no open or merged PR, and no change folder exist; the worktree is clean on main-tools at b31ec47 in sync with origin/main-tools. Treated as a fresh delivery (not a resume)."
    date: "2026-10-31"
  - text: "Scope source: the owner-authored ticket and backlog story M0-S7 are identical; dependency M0-S6 (GH-175 status v1) is delivered on main-tools. The command name `queue ready` is locked by ODR-0003; the command registry limits this story to a read-only ready-set computation and defers the full queue/lane/dispatch engine to M2-S1. No contradiction with current system spec found."
    date: "2026-10-31"
  - text: "PM decision D1 (command grammar): `ados queue ready <workItemRef>...` accepts one or more work-item refs and the global `--json` only; zero refs rejects before any read with `input.value.rejected`. Rationale: the registry says 'for one ticket' while the journeys say 'across candidates'; one-or-more satisfies both without a fleet enumeration this story does not deliver. It composes as command `queue` with positional `ready`, matching the existing `verify change <ref>` subcommand pattern."
    date: "2026-10-31"
  - text: "PM decision D2 (truthful readiness): six closed conditions are evaluated per candidate with a tri-state result (satisfied / unsatisfied / unknown) plus bounded evidence: deps-satisfied, repo-free, tier-known, no-owner-gate, ci-healthy, provider-available. A candidate is ready only when all six are satisfied. Any unsatisfied or unknown condition makes it not-ready and is named in the output; unknown is never rendered as ready or as a clear zero."
    date: "2026-10-31"
  - text: "PM decision D3 (tier-known source): the candidate must carry exactly one recognized delivery-tier label from the repo's declared triage set (`priority:high`, `priority:medium`, `priority:low` per .ai/agent/pm-instructions.md). Absent labels make the condition unknown; conflicting tier labels make it unsatisfied. Rationale: it is the only tier signal the repo currently declares, and it keeps untriaged tickets out of the ready set instead of fabricating a default tier. This is the weakest-sourced condition in the story; if the spec phase finds a documented per-ticket tier source, it may refine the source while keeping the condition id and the never-fabricate rule, and must record the refinement."
    date: "2026-10-31"
  - text: "PM decision D4 (repo-free): satisfied when the git-ignored local PM context is observed and either records no active change or records the evaluated candidate itself as the active change; unsatisfied when another active change is recorded; unknown when the local context is missing or malformed. Rationale: per-repo single-flight is M2-S1, so the only current truthful read-only signal is the local context; a candidate already in flight does not block itself."
    date: "2026-10-31"
  - text: "PM decision D5 (deps-satisfied): evaluated from the normalized `blocked-by` relations; all targets observed done/canceled means satisfied, an observed non-done target means unsatisfied, and an unobserved target or a source that declares relations unavailable means unknown. This mirrors the status tracker blocked-dependencies family and ADR-0004/ADR-0006 absence discipline."
    date: "2026-10-31"
  - text: "PM decision D6 (no-owner-gate): satisfied when the open work item carries none of the declared owner-attention labels (`hand-back`, `human-input-needed`); otherwise unsatisfied. Labels are available on the GitHub slice, so this condition is observable there."
    date: "2026-10-31"
  - text: "PM decision D7 (ci-healthy): evaluated on the current checkout HEAD's single bounded check-runs page; only `succeeded` satisfies the condition. `none`, `pending`, `canceled`, `failed`, an unresolved commit, or a failed read never satisfies it, matching the status CI classification where no-run is never green."
    date: "2026-10-31"
  - text: "PM decision D8 (provider-available): satisfied when the declared default provider chain resolves to at least one enabled entry with no active provider park; unsatisfied when every enabled entry is parked or no enabled entry exists; unknown when no default chain is declared, the declared chain does not resolve, or the verified park fold fails. The output never claims engine-verified availability; evidence states 'no active park; engine not run', reusing the status provider vocabulary."
    date: "2026-10-31"
  - text: "PM decision D9 (close ranking): a candidate is a close item when an open pull request in the target repository is associated with it by the repo's branch convention (`<type>/<workItemRef>/<slug>`, source-branch ref segment match, case-insensitive). `merge-ready` requires an observed approved review state on a non-draft pull request; `review-pending` covers any other associated open pull request, including an unknown review signal (never fabricate approval). Rank order is merge-ready, then review-pending, then ready new start, then not-ready; ties break on numeric-aware work-item ref ascending."
    date: "2026-10-31"
  - text: "PM decision D10 (output and boundaries): machine output is a new bounded `delivery.queue-ready.v1` payload in the standard CommandResult envelope (candidates with per-condition state and evidence, close class, rank position, summary counts) plus a deterministic human digest; `--json` is the only flag. The change adds no error-table rows, no configuration keys, no state-schema change, and no provider-engine call; source read failures become condition evidence, never command failures. Only `input.value.rejected` (bad grammar) and `fallback.internal` (containment) can fail the command, both existing rows."
    date: "2026-10-31"
