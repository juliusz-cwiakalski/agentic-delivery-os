  - id: F-2
    severity: low
    confidence: medium
    category: maintainability
    location: packages/adapters/src/jira/client.ts:14
    message: >-
      The three provider seeds and their normalizers import the shared transport via the relative
      path ../io/provider-transport.js (6 files) although .ai/rules/typescript.md §2 says
      intra-package imports use the declared # aliases and #io/* exists in the adapters imports
      map. The packed-export-parity rationale is technically sound — #io/* is src-mapped
      (./src/io/*.ts) and would not resolve in the dist-only packed tarball, unlike the
      dist-conditioned #contracts entry, so a relative .js import is the only rule-compatible
      spelling that survives packaging — but the exception is documented nowhere (not in the plan
      constraints, ADR-0005, or the feature spec), and the triplicated nativeFetchTransport is a
      direct consequence of keeping fetch inside the admitted subpaths.
    suggestion: Record the convention (one paragraph in doc/spec/features/feature-provider-client-seeds.md
      or the plan's constraints): shared adapter support modules under src/io are imported
      relatively with .js extensions because src-mapped # aliases cannot cross into packed dist;
      alternatively propose a dist-conditioned #io alias via a reviewed change.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: low
    confidence: medium
    category: correctness
    location: packages/adapters/src/github/review-state.ts:31
    message: GITHUB_WORK_ITEM_STATUS_MAP maps every closed issue to deliveryState "done". Live
      GitHub REST issues carry state_reason ("completed" | "not_planned" | "reopened"), so a
      closed-not-planned issue would normalize as done rather than canceled. The synthetic
      fixtures model open/closed only — which matches spec F-4 scope, so no trap fails today —
      but the flattening risk surfaces exactly when M0-S20 live runs revalidate.
    suggestion: Record the limitation in the GH-ISSUE-TO-WORKITEM trap entry (providerBehavior or
      expectedNormalizedOutcome: closed maps to done; state_reason not modeled until a named
      consumer) and revisit the mapping when M0-S20 records live shapes.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: low
    confidence: medium
    category: consistency
    location: packages/adapters/src/github/review-state.ts:55
    message: resolveGithubReviewState falls back to "open" for an unrecognized reviewDecision
      value, while the GitLab merge-status resolver fails visibly on any native value outside its
      declared table (the OQ-D no-silent-flattening discipline). Not spec-mandated for GitHub
      (the decision set is closed at three values), but the asymmetry is undeclared.
    suggestion: Either declare the fallback in a comment on the declared table (unknown decision
      reads as open because the merged/closed/draft terminal truth precedes it) or make the
      decision table exhaustive-with-visible-failure to mirror the GitLab discipline.
    suppressed: false
    published_url: null
    published_at: null
