decisions:
  - text: "Implementation basis (ticket-mandated, recorded in ticket comment 6536692124): GitHub + GitLab = direct REST API via native fetch (CLIs disqualified: own token caches, subprocess output drift); Jira = custom minimal read-slice client (no official TS client; jira.js MIT viable but unused surface; MCP clients need host+creds outside credential port). Fallback: re-evaluate jira.js at M0-S14 write ops. Zero new dependencies."
    date: "2026-10-31"
  - text: "ADR-0004 (Proposed): additive optional WorkItem.updatedAt (ISO-8601 UTC; absent = activity unknown) resolves the stall-query port-shape gap; contract-inventory test + fixture update ride in this change."
    date: "2026-10-31"
  - text: "ADR-0005 (Proposed): runtime-API confinement gains reason-bearing entries for github/gitlab/jira provider client subpaths; refines ADR-0003 via new record + editorial pointer (no in-place semantic rewrite); secret-read allowlist stays at exactly 4 entries."
    date: "2026-10-31"
  - text: "OQ-2 resolved to spec default: transitions-as-data quirk covered read-only via WorkflowMap + trap entry; Jira write/transition declared gaps; write ops arrive with M0-S14 per ticket-recorded outcome."
    date: "2026-10-31"
  - text: "ADR-0006 (Proposed): Jira custom fields = documented mapping semantics, NO v1 contract change (mapped fields typed at boundary; unmapped visibly unrepresented, no raw key leak); WorkItem.comments = optional (absent = comment set unknown; present incl. empty = provider-asserted set). Unblocked TC-JIRA-002/TC-JIRA-004; spec v1.2 + test plan v1.1 corrected; 12/12 ACs fully assertable."
    date: "2026-10-31"
open_questions:
