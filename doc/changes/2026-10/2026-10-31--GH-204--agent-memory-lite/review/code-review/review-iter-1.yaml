    location: .ai/memory/README.md:99
    message: >-
      The README says ids are never reused after supersession or pruning and that
      validation over id and supersedes makes a pruned superseded id unreusable. That is
      true when a superseded record is later pruned because the superseding record retains
      the old id in supersedes. A record deleted directly by prune or drop with no
      surviving supersedes reference is not tracked by that scan. The skill rule to
      supersede over delete for anything that once held authority mitigates this in
      practice, so no action is required. It is noted so the intent is explicit before
      future memory lint.
    suggestion: >-
      Optional. State that any directly pruned id is recorded in the curator report or a
      tombstone, or narrow the wording to superseded ids.
