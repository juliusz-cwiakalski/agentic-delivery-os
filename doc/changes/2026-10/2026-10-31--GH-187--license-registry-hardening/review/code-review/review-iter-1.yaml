  - id: F-7
    severity: info
    confidence: medium
    category: security
    location: scripts/checks/license-audit.ts:324
    message: >-
      The disjointness check compares deny identifiers against the raw
      allow_list strings, not against the identifiers parsed out of each allow
      entry. Under the enforced contract that every allow_list entry is a single
      identifier (TC-LICREG-001), string and identifier comparison are
      equivalent, and a compound allow entry carrying a denied identifier still
      fails closed through the entry-level deny check and the allow/verdict drift
      check. Noted only so the invariant stays explicit if the allow-list grammar
      is ever widened.
    suggestion: >-
      Optional: compare against the parsed identifier set (deriveAllowedIdentifiers)
      so the overlap message is emitted for identifier-level contradictions
      regardless of future allow-list grammar.
    suppressed: false
