summary: >-
  The deny-list hardening is implemented correctly and fail-closed: the registry
  is schema v3 with the full 20-identifier five-family floor, the audit enforces
  deny-before-allow per branch, rejects absent/empty/malformed/duplicated/
  overlapping/family-stripped deny lists, distinguishes non-asserted values, and
  preserves the live MIT OR Apache-2.0 entry. All 15 ACs are satisfied, every
  plan task 1.1-5.4 is delivered and green (44 license tests plus 8 privacy tests
  pass; live audit and CI-topology/bindingness/supply-chain/surface/pin-equality/
  vulnerability gates exit 0), and the workflow, lockfile, manifests, and
  ADR-0003 are unchanged while TDR-0007 remains Proposed. Two non-blocking
  evidence/consistency gaps remain: TC-LICREG-024 does not implement test-plan
  step 4 (23 declared fixture cases are never executed), and the test-plan
  section 10 execution log is still a placeholder. Three low and three info
  observations add no correctness or security risk.
