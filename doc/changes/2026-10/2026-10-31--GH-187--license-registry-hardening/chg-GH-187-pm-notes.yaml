decisions:
  - text: "This is hardening, not greenfield: GH-170 already seeded doc/legal/dependency-licenses.yaml and scripts/checks/license-audit.ts wired into the binding ts-license-audit CI job. GH-187 adds explicit policy/deny-list enforcement, closes remaining fail-closed gaps, and proves the acceptance criterion with tests; it must not regress the existing allowed-compound behavior unless a documented decision requires it."
    date: "2026-10-31"
  - text: "Deny list is explicit and authoritative: SSPL-1.0, BUSL-1.0/BUSL-1.1, Elastic-2.0, Commons-Clause, and the CC-BY-NC family are denied even if a future edit accidentally adds them to the allow list (deny wins over allow). The registry carries the deny list so policy is machine-readable and human-readable in one committed YAML."
    date: "2026-10-31"
  - text: "Compound SPDX expressions stay parsed (AND/OR/parentheses) with fail-closed per-branch evaluation, matching the current system spec (feature-monorepo-scaffold-toolchain) and GH-170 behavior, including the live @biomejs/biome 'MIT OR Apache-2.0' row. ADR-0003 C-2's 'fails closed on compound expressions' is applied as 'no branch may be unknown, denied, or non-allow-listed'; changing to reject all compounds would contradict the current spec and break a legitimate live dependency, so it is out of scope for GH-187."
    date: "2026-10-31"
  - text: "Out of scope: SBOM generation, checksums, THIRD-PARTY-NOTICES/licences bundle, and per-entry review-date governance (carried as a forward note from GH-170 but absent from the GH-187 ticket body). GH-187 covers the registry policy, deny list, fail-closed gate, and their tests; release-artifact obligations remain with M4-S3 and will be flagged at PR review."
    date: "2026-10-31"
  - text: "No new CI job: ts-license-audit already runs the audit and is binding. The change must keep ci-topology and ci-bindingness green and may not weaken any gate."
    date: "2026-10-31"

