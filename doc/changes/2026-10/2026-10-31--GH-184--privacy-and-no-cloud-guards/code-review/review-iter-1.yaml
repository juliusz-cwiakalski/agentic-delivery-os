summary: >-
  Substantive, honest delivery: fail-closed registry validation (RV-01..30), no-echo
  reporting, hash/window semantics, rule-scoped allowlist with a non-vacuous regression,
  the required injected emitter policy with codec purity, binding ts-invariants wiring,
  and a correct single five-package changeset are all delivered and re-verified green by
  this review. One high-severity defect breaks privacy detection: bare-substring
  suppression markers ("user" inside "/Users") silently disable private.absolute-user-path
  for macOS/Windows home-path forms and suppress other real credential shapes
  (postgres://user:..., "apikey =" assignments, marker-carrying bearer tokens) at both the
  file scan and the emitter policy; the mutation corpus only exercises /home/ forms so
  every suite stays green while the rule is vacuous for its canonical inputs. Three
  medium findings (emitter-side placeholder suppression on machine payloads, quadratic
  line attribution on match-dense files, fail-open distinct-length handling in the policy
  builder) and six low / two info findings complete the set.
