findings:
  - id: F-1
    severity: high
    confidence: high
    category: correctness
    location: packages/adapters/src/io/privacy-rules.ts:190
    message: >-
      Bare-substring suppression markers are matched against the whole rule match span;
      "user" occurs inside the /Users/ and C:\Users\ prefixes, so every macOS/Windows
      personal-home-path match is classified fabricated-sample and silently skipped at
      the file scan (scripts/checks/privacy-literals.ts:547) and the emitter policy
      (envelope-content-policy.ts:36). Runtime-proven: /Users/jsmith/secret-notes.txt is
      suppressed; only /home/<markerless> fires. Also suppresses
      postgres://user:<pw>@host, "apikey = <secret>", and Bearer test-... tokens.
      Contradicts spec F-1 recognizer definition, the substance of AC-F1-1/NFR-4, and
      feature-privacy-guard.md ("a markerless value still fires").
    suggestion: >-
      Scope marker evaluation to the opaque value portion (user segment / password /
      assigned value / token tail) with bare words anchored to token boundaries, or drop
      ambiguous bare words from whole-span matching; add /Users/, C:\Users\,
      postgres://user:..., and "apikey =" regression positives to the corpus and
      TC-POLICY-006 parity; add a marker-broadening mutant control; keep the live-tree
      baseline green with the existing allowlist; disclose the scoping in
      feature-privacy-guard.md.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: medium
    confidence: high
    category: correctness
    location: packages/adapters/src/io/envelope-content-policy.ts:36
    message: >-
      The emitter policy skips placeholder-suppressed generic matches, so a payload value
      carrying a marker substring (Bearer your-..., test-... tokens, /Users/ paths)
      serializes successfully. Spec DM-5/F-6 define the emitter policy as generic rules
      plus hashed entries with no suppression mention; suppression exists for the
      documentation false-positive corpus, and machine-generated envelope JSON has no
      documentation context — an undocumented AC-F6-1 bypass.
    suggestion: >-
      Pin the behavior: recommended that the emitter policy evaluate generic rules
      without placeholder suppression, with a TC-POLICY case asserting a marker-carrying
      guarded payload is denied at every field x carrier; if suppression at the emitter
      is intended, record it as a decided pin (PM/@decision-advisor) and state it in
      spec DM-5 and the feature spec.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: medium
    confidence: high
    category: performance
    location: packages/adapters/src/io/privacy-rules.ts:200
    message: >-
      lineAt is O(index) and is called per generic match, so a match-dense single-line
      file costs O(matches x bytes) — quadratic behavior contrary to NFR-5 linearity and
      the 60s/50MiB budget. The performance suite's corpora are all non-matching, so the
      path is unmeasured.
    suggestion: >-
      Precompute newline offsets once per text and binary-search per match (or track the
      line incrementally — regex exec order is monotonic under /g); add a match-dense
      corpus case to TC-PRIVACY-021 under the N/2N slack.
    suppressed: false
    published_url: null
    published_at: null
  - id: F-4
    severity: medium
    confidence: high
    category: correctness
    location: packages/adapters/src/io/privacy-rules.ts:260
    message: >-
      findWindowMatches silently returns empty when distinct lengths exceed 32, and
      buildEnvelopeContentPolicy does not validate injected entries — a caller injecting
      more than 32 distinct lengths gets a policy that silently allows every hashed
      literal (fail-open, against the change's fail-closed principle). Unreachable via
      the check (RV-29), reachable via the builder's injected inputs.
      privacy-performance.test.ts:96 currently pins the silent-empty behavior.
    suggestion: >-
      Validate inputs at buildEnvelopeContentPolicy construction (reject >32 distinct
      lengths, out-of-range lengths, duplicate ids); keep the in-function guard as an
      unreachable-after-validation assertion.
    suppressed: false
    published_url: null
    published_at: null
