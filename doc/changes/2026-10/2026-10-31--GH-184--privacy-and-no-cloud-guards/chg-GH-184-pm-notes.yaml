notes:
  - text: "Delivery plan v2 resolves the DoR blocking finding: per-entry staging co-location rule (each allowlist entry lands with its target file; exact-set assertion tracks the current set and reaches the end-state enumeration only at the final phase) and rule-scoped allowlist entries. It also enumerates the live-tree baseline suppression batch (placeholder suppression first, rule-scoped exact-path entries for archival real paths, remediate-if-touched) with a named task and a rule-scope regression test."
    type: "info"
    date: "2026-10-31"
  - text: "DoR iteration 1 verdict NOT_READY (8/10 facets PASS; plan_coverage and cross_artifact_consistency FAIL). Blocking: plan PD-2 allowlists files that land in later phases, so the guard's own fail-closed allowlist validation makes the Phase 2 green gate unachievable as written. Reopened delivery_planning. No human escalation needed."
    type: "blocker"
    date: "2026-10-31"
  - text: "DoR advisory (major): the live-tree baseline load is under-enumerated. Verified guaranteed trips: a committed provider-token fixture, a fake secret in a hook test script, placeholder key samples in the text-to-image tool guide, and real owner home paths in roughly seven historical change artifacts. The plan's never-weaken procedure is credible; the expected suppression batch must be written into the revised plan and surfaced in pm-notes for owner visibility at PR."
    type: "risk"
    date: "2026-10-31"
  - text: "Retro: the implementation plan introduced an internal staging contradiction (allowlist entries committed before their target files exist) that the plan's own validation rule rejects. Caught by the DoR gate, one reopen cycle. Lesson: when a plan introduces an artifact whose validation is fail-closed on self-consistency, the plan must state per-entry staging co-location explicitly."
    type: "retro"
    date: "2026-10-31"
  - text: "Test plan v1.1 authored: 34 test cases, 22/22 AC coverage, 30-cell fail-closed registry matrix, mutation triples with detection-disabled mutants, and a no-echo proof that pairs absence with a presence assertion. Re-aligned to spec v1.1 for the corrected changeset criterion."
    type: "info"
    date: "2026-10-31"
  - text: "Delivery plan authored: 11 phases (7 coder phases, 4 PM lifecycle gates), 56 tasks, 34/34 TC traceability. Shared pure rule module placed at packages/adapters/src/io/privacy-rules.ts, imported by the check via relative source path so ts-invariants stays build-free; node:crypto confined to the check edge."
    type: "info"
    date: "2026-10-31"
  - text: "Retro: the spec shipped AC-F8-1 as a total-count claim ('exactly one changeset') that is unsatisfiable because five changesets are already pending. Caught by the test-plan author before delivery. Specification was reopened, corrected to 'exactly one new changeset added by this change; pre-existing untouched', and the test plan was re-aligned. Cost: one reopen cycle. Lesson: changeset/manifest ACs must be written relative to the change diff, not as absolute repository state."
    type: "retro"
    date: "2026-10-31"
  - text: "Spec v1.1 also added a section-17 coverage note mapping capability details that intentionally have no standalone AC (placeholder suppression, codec validation order, binary-skip reporting, performance bound) to their covering ACs."
    type: "info"
    date: "2026-10-31"
  - text: "Intake: ticket body, backlog story M0-S15 (doc/planning/oss-tooling/backlog.md:314-324), policy-as-code concept (:74, :89), embedded-metadata concept (:62-63, :71-72), and ADR-0003 C-1/C-4/C-11 are the requirements basis."
    type: "info"
    date: "2026-10-31"
  - text: "clarify_scope finding: no privacy guard, hashed-literal list, no-cloud check, or metadata content scan exists today. Existing forbidden-literals check is brand-only and not reusable as-is; secret-read-boundary is AST-only."
    type: "risk"
    date: "2026-10-31"
  - text: "clarify_scope finding: no production metadata emitter exists yet (write-comment is adapter-not-implemented); serializeEnvelope in packages/adapters/src/io/envelope-codec.ts is the only serialization point and the correct emitter hook."
    type: "info"
    date: "2026-10-31"
  - text: "clarify_scope finding: the no-cloud denylist cannot commit raw cloud names (ADR-0003 C-4 forbids cloud names in committed files). Resolution: cloud terms are stored as hashes in the same guarded-literal mechanism; raw terms never land in the repo."
    type: "decision"
    date: "2026-10-31"
  - text: "Requirement decision: the hashed-literal list is a committed, schema-versioned registry next to the check (single authority, mirroring forbidden-literals.registry.json), not a new config-layer production key. Rationale: no code change needed to add a literal, zero blast radius on the config layer, and the config key belongs to the policy engine (M3-S5)."
    type: "decision"
    date: "2026-10-31"
  - text: "Security decision: hashes are SHA-256 over a normalized (lowercased, trimmed) literal with a versioned domain prefix and no committed salt; residual dictionary-guessability of low-entropy literals is accepted and must be documented. True secrets are covered by generic pattern rules, never by the hash list."
    type: "decision"
    date: "2026-10-31"
  - text: "Security requirement: violation output must never echo the matched literal or its hash input; report rule/entry id, file, line, and a redacted fingerprint only (CI logs are public)."
    type: "decision"
    date: "2026-10-31"
