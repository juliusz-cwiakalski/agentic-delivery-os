decisions:
  - text: "Guard architecture is one repo invariant check plus a committed schema-versioned registry as the single authority for scope, generic rule ids, hashed entries, allowlist, and exclusions; adding a literal is a data edit. Recorded as TDR-0005 (Proposed; owner accepts at PR)."
    date: "2026-10-31"
  - text: "Hashing is SHA-256 over a versioned domain prefix plus the normalized literal, no salt and no HMAC; residual offline dictionary-guessability is accepted because the threat model is accidental public exposure, not a determined attacker with repo access."
    date: "2026-10-31"
  - text: "Violation output never echoes the matched literal; only rule/entry id, file, line, and a redacted fingerprint are reported."
    date: "2026-10-31"
  - text: "No-cloud terms are stored as hashed cloud-term entries; the class may ship empty (mechanism-only) until the owner supplies digests."
    date: "2026-10-31"
  - text: "Metadata scanning is enforced at serializeEnvelope through a required injected pure content policy with a new fail-closed serialization failure; the codec keeps its no-node-imports purity."
    date: "2026-10-31"
  - text: "Non-choice: the hashed list is not a config-layer production key in M0; policy data placement defers to the policy engine (M3-S5)."
    date: "2026-10-31"

open_questions:
  - text: "Owner-supplied hashed entries (private identifiers and hosted-product terms) are needed for the guard to protect this repository's real content; the mechanism ships with an empty cloud-term class and no private entries. Owner action after landing, not a delivery blocker."
    date: "2026-10-31"

