decisions:
  - text: "CI-layer cross-check resolved PM-side: ticket body says 'CI mode disables the system and user-global layers' but owner-accepted ADR-0003 DEC-4 (debug/explainability section) additionally disables the project-local layer under CI=true, reported as skipped with reason ci-disabled. DEC-4 is authoritative (the ticket's References name ADR-0003; the backlog story cites DEC-4) and its reading is strictly safer. No human question needed."
    date: 2026-10-30
  - text: "Exit-code cross-check resolved PM-side: DEC-4 wording 'a malformed file fails closed with a distinct exit code' predates the delivered {0,1,2} projection contract (GH-172 current truth: exit codes are a projection of table entry classes, fixed at {0,1,2}, call-site literals forbidden). Distinctness lands at the error-code level: dedicated config table entries in the user-validation class (exit 1); no new numeric code. The GH-172 result contract wins; spec-writer formalizes the mapping."
    date: 2026-10-30
  - text: "Branding coupling confirmed non-blocking: the ticket's '.<product>/config.yaml' and 'ADOS_*' are branding-derived values — feature-branding-seam.md 'Consumption by later layers' pre-documents that M0-S4 consumes resolveBrandIdentity unchanged and uses configDirectoryName for the committed config path and environmentPrefix for environment-layer names. Hardcoding either would violate ADR-0003 C-3 and fail the live ts-forbidden-literals scan."
    date: 2026-10-30
