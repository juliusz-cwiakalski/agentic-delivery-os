    location: scripts/checks/forbidden-literals.ts:310
    message: >-
      MINOR (hardening). The header-line exemption applies its four patterns
      (`Copyright`, `source:`, `Apache-2.0`, `ados_distribution:`) as
      substring-anywhere matches, so any scanned line containing one of them is
      skipped wholesale — including future code lines such as an object-property
      `source:` in packages/**, where a seed token on the same line would escape
      the scan (e.g. `{ source: "ados" }`). Current exposure is minimal and
      verified: only 5 lines in the entire scanned scope match the patterns
      today (the two registered docs' frontmatter/license headers), the pattern
      set is registry-pinned, and any pattern change fails the registry-shape
      mutation tests. Deviation 1 (the `ados_distribution:` marker exemption) is
      thereby confirmed narrow: marker lines only, doc bodies fully scanned.
    suggestion: >-
      In a later hardening change, anchor the patterns to header/frontmatter
      shape (e.g. `^\s*#?\s*(Copyright|source:|Apache-2.0)` and
      `^ados_distribution:`) and add corpus fixtures for code-shaped lines
      containing the patterns, so a same-line token cannot ride an exemption.
    suppressed: false
