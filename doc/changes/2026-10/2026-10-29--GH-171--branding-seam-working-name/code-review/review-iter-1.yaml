    location: scripts/checks/forbidden-literals.ts:288
    message: >-
      MINOR (fail-closed consistency). `listRepoFiles` silently returns `[]`
      when `git ls-files` exits non-zero — a fail-open path for the packageTree
      and userFacingDocs listings in isolation (the class would report as
      scanned with 0 files). Practical exposure is small: any git failure that
      breaks listing also breaks `baselineDocs`/`cat-file`, which fail closed
      with named errors, and CI guarantees git. But the scan's own contract
      (never silently skip a class) argues for a named failure instead of an
      empty list.
    suggestion: >-
      Make `listRepoFiles` record a named failure (or throw) when the git
      child process errors or exits non-zero, mirroring the baseline
      reachability treatment, and cover it with a mutation (e.g. PATH without
      git in a temp environment).
