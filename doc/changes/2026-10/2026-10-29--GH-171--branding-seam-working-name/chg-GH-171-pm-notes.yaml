decisions:
  - text: "Delivery mode autonomous: user directive 'Deliver GH-171 end-to-end using ADOS' with STOP at open PR; merge authority stays with CEO/human."
    date: 2026-10-29
  - text: "Owner constraint (issue #171 comment, 2026-10-29, binding): branding SEAM only — the working name is config-driven and read through the branding module; NO hardcoded product token anywhere (GH-170 brand-scan seed mechanism enforces); no public product name may be selected, proposed, or revealed in any artifact; candidate names and the naming decision are private owner-gated work outside this repo; public artifacts stay self-contained with generic rationale. Refines the backlog task's 'single name constant (working name ados)' — the constant is the seam, not a hardcoded literal."
    date: 2026-10-29
  - text: "Legacy literal set (ados, ADOS_, ~/.ados) remains the DEC-8 seed set: owned by the legacy adapter + the scan seed; the pre-existing corpus migrates separately (out of scope here, per DEC-8 scope-of-claim)."
    date: 2026-10-29
  - text: "BrandIdentity type belongs in core ./contracts per ADR-0003 DEC-8; branding imports ./contracts for the type only. Current scaffold has the type defined locally in packages/core/src/branding/index.ts with a narrower shape than DEC-8's derived-value list — this change moves/completes it."
    date: 2026-10-29
