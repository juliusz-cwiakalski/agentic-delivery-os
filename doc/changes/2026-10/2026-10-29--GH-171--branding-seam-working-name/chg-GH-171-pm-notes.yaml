    date: 2026-10-29
  - text: "Legacy literal set (ados, ADOS_, ~/.ados) remains the DEC-8 seed set: owned by the legacy adapter + the scan seed; the pre-existing corpus migrates separately (out of scope here, per DEC-8 scope-of-claim)."
    date: 2026-10-29
  - text: "BrandIdentity type belongs in core ./contracts per ADR-0003 DEC-8; branding imports ./contracts for the type only. Current scaffold has the type defined locally in packages/core/src/branding/index.ts with a narrower shape than DEC-8's derived-value list — this change moves/completes it."
    date: 2026-10-29
