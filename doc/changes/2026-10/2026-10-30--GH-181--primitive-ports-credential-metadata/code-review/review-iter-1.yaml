  - id: F-2
    severity: medium
    confidence: high
    category: performance
    location: packages/adapters/src/io/envelope-codec.ts:33
    message: >-
      The marker regexes (COMMENT_MARKER, COMPACT_MARKER) exhibit quadratic
      runtime on marker-dense adversarial input: a single parseEnvelope call on
      ~193KB of repeated `<!-- delivery.metadata.v1 {` prefixes took 1747ms
      (measured); ~1MB extrapolates to tens of seconds on the event loop.
      Provider comment text becomes external user-controlled content when M0-S13
      adapters land, making this an algorithmic DoS vector on the future hot
      path. No production consumer exists yet (NG-2).
    suggestion: >-
      Cap the scanned input length (documented maximum; over-cap input degrades
      as `missing`) or adopt an equivalent non-quadratic scan; add a
      pathological-input regression test with a time bound. Remediation task R-2
      in plan Phase 6.
