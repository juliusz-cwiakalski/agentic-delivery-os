    location: scripts/checks/secret-read-boundary.ts:138
    message: >-
      The secret-read boundary invariant silently accepts computed-key ambient
      environment reads: `process[key]` (non-literal key), `process[`env`]`
      (template literal), and `globalThis[computed].env` all produce zero
      violations (empirically proven). Rule 3 only flags string-literal element
      access and rule 4 skips ambient-global identifiers used as element-access
      expressions, assuming rule 3 covered them. Spec F-4 / plan task 4.1 require
      every form to be reported or rejected by a documented unsupported-form
      negative control — never silently accepted; the change's central
      "secret centralization is mechanical" claim (ticket AC-2) has a hole.
    suggestion: >-
      Fail closed: flag ElementAccessExpression over an ambient-global
      identifier whenever the argument is not a string literal ("ambient element
      access with non-literal key"), or document these as unsupported forms with
      negative-control fixtures. Add computed-key and template-literal fixtures
      to tests/fixtures/secret-boundary/cases.ts; keep the clean control green.
      Remediation task R-1 in plan Phase 6.
