  - id: F-3
    severity: medium
    confidence: high
    category: correctness
    location: packages/adapters/src/io/envelope-codec.ts:149
    message: >-
      removeMarkers strips overlapping spans sequentially with stale indices:
      when an envelope payload string contains a compact-marker lookalike and
      trailing human content follows the comment marker, stripEnvelope returns
      ""/truncated output (empirically proven) — silently destroying
      human-readable content with no degradation evidence, violating AC-F5-2's
      identity guarantee and DEC-5's visible-degradation philosophy.
    suggestion: >-
      Rebuild the string from non-overlapping spans in a single pass (or one
      combined regex) so indices cannot go stale; add a regression fixture with
      a nested lookalike plus trailing content. Remediation task R-3 in plan
      Phase 6.
