decisions:
  - text: "Spec selects v1 port set = exactly the nine catalogue adapter-interaction rows typed at M0 (ExternalSystemInstance, AdapterContract, WorkItem, WorkflowMap, WorkItemRelation, DeliveryRequest, PipelineRun, RetryPolicy, IdempotencyKey) + ticket-mandated credential port and metadata envelope; fail-closed inventory in both directions. Catalogue rows outside the set stay with owning stories."
    date: "2026-10-30"
  - text: "Env-backed credential implementation placement: adapters package I/O tier as new declared ./credentials subpath admitted to runtime-API confinement allowlist (contracts tier is ambient-neutral; core has no runtime home). Alternative (env-as-data at surface edges) recorded as spec OQ-1 with TDR path."
    date: "2026-10-30"
  - text: "Single new error code config.credential.missing (kind config, user, non-retryable, not_landed, user-validation) — chosen to avoid kind-only classification ripples. Malformed metadata gets no error code (degradation is a view state, not a failure)."
    date: "2026-10-30"
