  - text: "RETRO: pre-existing exports-parity attw pack-mutation test had no per-test timeout and began exceeding Bun's 5s default — silent infra drift surfaced only when the suite grew. Lesson: new long-running pack-mutation tests should declare explicit timeouts at authoring time; consider a follow-up housekeeping pass across other pack-mutation tests (not created — PM ticket-creation rule)."
