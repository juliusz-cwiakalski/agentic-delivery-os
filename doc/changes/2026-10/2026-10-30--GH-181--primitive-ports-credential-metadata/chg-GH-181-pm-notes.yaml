    date: "2026-10-30"
  - text: "RETRO: review iteration 1 caught a real security hole the delivery-phase battery missed — the invariant's own tests covered only literal-key forms, so the computed-key gap was invisible to every green check (tests green, claim false). Lesson: for security invariants, the test matrix must enumerate AST form classes, not just instances; an invariant is only as strong as its form-class coverage. Also: codec quadratic-scan and strip-corruption issues were findable only by adversarial input testing (DoR/plan reviews check artifacts, not runtime hostility) — the reviewer's empirical probing earned its cost."
    type: "retro"
    date: "2026-10-30"
  - text: "RESOLVED: Review iteration 1 blocker cleared — remediation R-1 (da1b00a), R-2 (e45207e), R-3 (a12bbc5) verified closed by reviewer's independent re-execution; iteration 2 PASS (0 critical/high/medium/low; 3 info, all pre-existing or accepted: F-6 require()-based env read unreachable through gate battery, F-7 fail-closed literal-key false-positive class, F-8 stamp drift dup). Plan task 6.3 satisfied by iter-2 PASS; remediation doc delta reconciled by doc-syncer addendum (2 specs patched, no residual gaps)."
