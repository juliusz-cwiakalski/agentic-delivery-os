    date: "2026-10-31"
  - text: "RETRO: test-ceo-loop.sh is not hermetic — it reads the ambient delivery marker and false-fails whenever any delivery is active, including its own. The suite passed in prior deliveries only because those ran outside the harness that writes the marker. Lesson: suites touching ambient state files must isolate them in setup; gates run from inside the harness expose this. Fix is 1-line test isolation, but it cost a gate iteration."
    type: "retro"
    date: "2026-10-31"
  - text: "Quality gates iteration 1: steps 1-4 green (pnpm check 610/610) but bash battery stopped at test-ceo-loop.sh — 2/54 fail, both cases expecting STUCK. Runner diagnosed environmental root cause with isolation proof: the tests read the live .ai/local/delivery/delivering marker (pointing at THIS delivery process, pid 1002659) instead of an isolated DELIVERY_DIR; not a GH-181 code regression. Remediation: fix test isolation (redirect DELIVERY_DIR in the suite's state setup) so the suite is hermetic during active deliveries, then re-run full battery."
    type: "risk"
    date: "2026-10-31"
  - text: "PM-DECIDED: fixer delegation for the ceo-loop isolation fix was declined by the environment — scope discipline respected (GH-181 carries no unrelated bash test changes). The 2 ceo-loop failures are accepted as environmental: suite reads ambient .ai/local/delivery/delivering and can only pass outside an active delivery; GH-181 diff has zero bash lines; isolation proof recorded by runner; CI re-runs the suite without ambient state at PR time and remains the binding bash gate (merge gate precedent from GH-170/171/172/173). Remaining gate steps proceed."
    type: "decision"
