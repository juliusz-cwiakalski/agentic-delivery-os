summary: "The status digest is broadly well built: contracts are data-only, the domain is pure, the six sections/five states, caps, tracker families, changes/CI, lanes, providers, parked work, origin binding, credential guard, bounds, error reuse, and the full gate battery are in place (1576 pass / 2 skipped; the only red is the pre-existing TC-RELEASE-001). The failures are in the human surface and a few pinned rules: a failed PR read renders as `PRs 0 (review state observed)` (a false all-clear), a park-fold failure renders `active parks 0`, non-numeric CI run ties sort descending instead of ascending, and a declared-but-unresolved chain is classified `unavailable` instead of `unknown`. Several assertions (TC-001 zero-read, TC-017 no-parks, corpus counts/order) are vacuous and did not catch these."
