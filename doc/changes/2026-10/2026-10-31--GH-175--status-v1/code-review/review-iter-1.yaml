    location: packages/core/src/domain/status.ts:863
    message: "`providerChainFor` returns `undefined` both for 'no default chain' and for 'declared default chain that does not resolve to a declared chain entry', so the latter is classified `unavailable` / `provider-chain-not-declared` / `chain: absent`. DM-9, the plan, and doc/spec/features/feature-status-digest.md:125/164 pin `unknown` / `provider-chain-unresolved` / `failureCode: config.value.invalid` / `chain: unknown` for the unresolved case. Verified with a config carrying `defaultChain: 'ghost'` and only `primary` declared. Not reachable through `createConfigProgram` (the resolver validates), but `aggregateStatus` is a public, spec-bound surface and the current-truth doc states the other behavior."
    suggestion: "Distinguish 'no default chain' from 'declared chain missing' in `providersSection`, return the pinned unknown identity for the latter, and add a matrix/corpus case; keep the edge validation as defense in depth."
