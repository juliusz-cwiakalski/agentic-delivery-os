  - id: F-1
    severity: critical
    classification: blocker
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/status.ts:1229
    message: "When the PR read fails but the local active change is observed, the human digest prints `changes degraded active <ref> | PRs 0 (review state observed)`. The pinned human grammar (`PRs {n|?}`, `?` when the PR read is not observed) and the non-verdict rule (AC-F1-3/F-9, NFR-3, RSK-1/RSK-5) forbid asserting zero PRs and an observed review state after a failed read. The `prKnown` guard keys off the section state (degraded), not the `changes` source outcome, so the `?` branch is unreachable in this case. Reachable in production: a transient `listDeliveryRequests` failure with a local active change."
    suggestion: "Derive `prKnown`/`review` from the `changes` evidence source outcome (read/observed-empty) rather than the section state; print `?` and `review state unknown` when the PR read did not succeed; add a degraded human-output test asserting that."
    suppressed: false
    published_url: null
    published_at: null
  - id: F-2
    severity: high
    classification: major
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/status.ts:1267
    message: "On a park-fold failure the human digest prints `providers degraded chain <name> | active parks 0 | ...`; on a config-unknown section the fold result is discarded and it also prints `active parks 0`. AC-F7-1 requires `degraded` with 'no no-parks claim', and the plan grammar allows `active parks {n|?}`. `parksKnown = providers.parks !== undefined` is always true because `parks` is always an array, so the `?` path is dead. The test at tests/behaviour/status-providers-parked.test.ts:345-359 only searches for the literal string 'no parks' (which never appears) and is therefore vacuous."
    suggestion: "Print `?` when the `provider-parks` source did not succeed (and when the provider config is untrusted); strengthen the test to assert the human line contains `?` (or omits a zero) and that the machine `parks` is not silently empty-observed."
    suppressed: false
    published_url: null
    published_at: null
  - id: F-3
    severity: high
    classification: major
    confidence: high
    category: spec-compliance
    location: packages/core/src/domain/status.ts:744
    message: "`compareRuns` reverses the whole identity comparison (`compareIdentity(right, left)`), so equal-severity runs with non-numeric identities sort lexicographically descending. Spec 8.3 and the plan pin 'run identity descending (numeric-aware when both identities are numeric, otherwise lexical ascending)' and 'all lexicographic comparisons are ascending'. GitHub check-run identities are `${sha}:${runId}` (non-numeric), so same-severity GitHub runs are rendered in the wrong pinned order (AC-F10-1). Verified: three non-numeric ids render gamma,beta,alpha instead of alpha,beta,gamma."
    suggestion: "Compare identities descending only when both are numeric; otherwise use `compareText(left, right)` ascending, then pipeline name ascending. Add a non-numeric run-tie test."
    suppressed: false
    published_url: null
    published_at: null
