  - text: "Scope-shaping constraints observed at intake: (1) `ados status` is the only command surface named by the command registry; (2) the providers collector must read the declared chain from config and park states from the state layer, never the provider engine; (3) queue/lanes do not exist until M2-S1, so the lanes-or-queue collector must report a declared, evidenced state rather than imply a queue engine; (4) no network call may be treated as a verdict — every section must carry evidence and an explicit unknown/degraded state."
