    location: packages/cli/src/index.ts:257
    message: >
      The serialization-failure fallback re-invokes writeOutput with
      emitEnvelope forced to true even for runs without `--json`, and the retry
      is unguarded: if the injected sink itself is hostile, the fallback write
      throws out of runCli. Near-unreachable in practice (without `--json` the
      only fallible write is the sink itself), and forcing the machine envelope
      is defensible containment-first behavior, but the asymmetry is worth
      recording.
    suggestion: >
      No action required for M0-S3. If M0-S4 formalizes sink-failure semantics,
