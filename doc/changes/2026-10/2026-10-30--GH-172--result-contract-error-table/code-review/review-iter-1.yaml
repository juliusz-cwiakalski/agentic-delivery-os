  - id: F-3
    severity: low
    confidence: high
    category: security
    location: scripts/checks/exit-code-literals.ts:63
    message: >
      The exit-literal invariant detects only `process.exit(...)` via an
      identifier owner named `process`. Runtime-equivalent escapes `Bun.exit(n)`
      and `Deno.exit(n)` (this is a Bun-first repository) evade the scan, as do
      bare numeric `return 2` statements from surface functions whose return
      value is an exit code. Only `exitCode` assignments/declarations and
      projection-table literals are covered today.
    suggestion: >
      Extend the CallExpression predicate to flag any `<Identifier>.exit` call
      whose owner is one of process/Bun/Deno (mutation: `Bun.exit(2)` in a
      command module). Optionally scan numeric literal returns in modules that
      re-export runCli. Keep failures naming file, line, and literal.
    suppressed: false
    published_url: null
