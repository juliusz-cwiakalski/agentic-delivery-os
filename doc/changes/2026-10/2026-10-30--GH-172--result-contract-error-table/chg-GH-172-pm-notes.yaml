  - text: "BINDING constraint carried from M0-S2 (GH-171): forbidden-literal CI scan is live — CommandResult/runCli/CLI surface must take brand values (binaryName, environmentPrefix) as parameters via BrandIdentity at a runtime-aware edge; zero hardcoded product tokens in new code. Spec-writer, plan-writer, and coder must respect this; reviewer checks it."
