  - text: "Cross-check ticket vs system spec: no contradictions. cli-command-registry.md man-page v0 (planning truth) prescribes CommandResult fields (schemaVersion, runId, exitCode, timing, data or error), --json always-valid machine output, and exit codes as table projection (0/1/2) in the standalone CLI only — ticket refines this with self-describing hierarchical codes and structured fields (category user|platform|transient|permanent, retryable, consequence with unknown first-class, remediation hint)."
    type: "info"
    date: 2026-10-30
  - text: "BINDING constraint carried from M0-S2 (GH-171): forbidden-literal CI scan is live — CommandResult/runCli/CLI surface must take brand values (binaryName, environmentPrefix) as parameters via BrandIdentity at a runtime-aware edge; zero hardcoded product tokens in new code. Spec-writer, plan-writer, and coder must respect this; reviewer checks it."
    type: "risk"
    date: 2026-10-30
  - text: "Doc impacts for phase 7 (doc-syncer): NEW feature spec doc/spec/features/feature-result-contract.md (first-spec-only authoring, always-resolve); error table must be documented such that 'error codes resolve to documented table entries' is testably true (machine-readable table as single source; test validates doc/code sync). Possible touch: feature-monorepo-scaffold-toolchain.md if package surfaces change. cli-command-registry.md stays planning-truth (no change)."
    type: "info"
    date: 2026-10-30
  - text: "AC edge cases the spec/test-plan must cover: broken command under --json still emits valid envelope; data/error exclusivity (envelope carries exactly one); secrets never in output (redaction chokepoint on serialization path); unknown/unclassified errors map to a table fallback entry with consequence=unknown; timing present on failure paths; golden tests for both success and failure envelopes."
