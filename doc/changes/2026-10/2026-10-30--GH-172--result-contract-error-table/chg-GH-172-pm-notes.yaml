  - text: "AI-agent-facing error design survey (in-ticket task) is authored as a companion artifact inside the change folder (doc/changes/.../survey-agent-facing-error-design.md), not as a new doc/ area — avoids one-off research notes entering the distributable doc set and their ados_distribution obligations; the validated convention itself lands in current-truth docs via phase 7."
    date: 2026-10-30
  - text: "No blocking questions to the human at clarify_scope: issue body == backlog.md M0-S3 verbatim; man-page v0 already fixes envelope fields and exit-code projection (0 success, 1 user/validation, 2 platform/provider); dependencies M0-S1 (GH-170) and M0-S2 (GH-171) merged. Envelope JSON details (schemaVersion value, runId format, exact shape) are design decisions within the spec-writer's remit under those constraints."
