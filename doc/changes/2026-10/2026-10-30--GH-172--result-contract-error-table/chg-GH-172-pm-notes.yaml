  - text: "AC edge cases the spec/test-plan must cover: broken command under --json still emits valid envelope; data/error exclusivity (envelope carries exactly one); secrets never in output (redaction chokepoint on serialization path); unknown/unclassified errors map to a table fallback entry with consequence=unknown; timing present on failure paths; golden tests for both success and failure envelopes."
