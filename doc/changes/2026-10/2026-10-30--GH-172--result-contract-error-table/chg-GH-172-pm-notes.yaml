  - text: "Specification iteration 1 COMPLETED 2026-10-30T01:58Z and committed (e8cea8f); REOPENED at 02:10Z (iteration 2) on test-plan GAP-1/OQ-T1: AC-F8-1 binds a docs/code sync check in-change but its documented-entry direction had no artifact until phase 7 (feature doc authored then), making the check vacuous at merge. Spec amendment must: name the in-change doc target (doc/spec/features/feature-result-contract.md, authored during delivery, phase 7 reconciles), clarify fallback entry/entries semantics (broken-command vs unknown-failure containment; Appendix C 'for broken commands' phrasing vs Flow 3 routing unknown failures through one fallback entry), fix fallback category/retryable values (test-plan GAP-4/OQ-T2). Test plan stays valid as written (pre-wired: section 4.4 binds the requirement, TC-SYNC-003 fails closed on missing doc); minor OQ-T1 resolution touch-up after amendment."
    type: "risk"
    date: 2026-10-30
  - text: "Retro: the gap originated in spec iteration 1 — F-8 made the sync check binding in-change while deferring the documented table to phase 7; internally inconsistent across the phase boundary. The test-plan-writer caught it exactly as the chain intends (downstream author finds upstream gap); cost was one reopen iteration (~one delegation + one commit). Lesson for future specs: when an AC names a binding check over an artifact, the artifact must ship in the SAME change — phase-boundary deferrals of checked artifacts are a spec smell."
    type: "retro"
    date: 2026-10-30
  - text: "Specification iteration 2 COMPLETED 2026-10-30T02:25Z: spec v1.1 amendment landed. GAP-1/OQ-T1 resolved — documented error table ships in-change at doc/spec/features/feature-result-contract.md (authored during delivery; phase 7 reconciles the full feature doc); AC-F8-1 binds both drift directions against it from merge time. GAP-4/OQ-T2 resolved via new DEC-13: TWO fallback entries — fallback.invocation (category user, retryable false, consequence unknown, class user-validation, exit 1, contains broken invocations) and fallback.internal (category platform, retryable false, consequence unknown, class platform-provider, exit 2, contains unclassifiable failures); rationale: one entry cannot project faithfully across caller-fault vs system-fault populations without eroding the {0,1,2} semantics. All IDs stable, no renumbering; decision log appended per discipline. Test plan remains structurally valid; needs a touch-up pass (resolve OQ-T1 in-plan, sync fallback references to the two-entry reality) before test_planning completion."
    type: "info"
    date: 2026-10-30
  - text: "Commitlint CI discovery (pre-push): ts-commitlint is a real CI job on PRs to main-tools enforcing body-max-line-length=100 as ERROR (not a required context — turns PR red without blocking merge; squash-merge bodies on main-tools are never linted, which is why b3a00a9/32784af history violates but stayed green). Commit ffdd850 violated (body lines up to 350 chars); amended locally while unpushed. Retro: the warn-only local hook masked an error-severity CI rule — committer flow should wrap commit bodies <=100 chars by default on this repo; caught cheaply because the amend happened before push."
    type: "retro"
    date: 2026-10-30
  - text: "Test plan COMPLETED at v1.1 after touch-up: 38 TCs (IDs/counts/tiers unchanged), fully consistent with spec v1.1 — OQ-T1/OQ-T2 resolved in-plan (in-change documented table; DEC-13 two-entry fallback with fallback.invocation/fallback.internal recorded as the declared two-segment exception in the sync-check literal rules + assumption A-T11); OQ-T3 (redaction placeholder policy) and OQ-T4 (ambient-brand enforcement vehicle) remained open as NON-BLOCKING delivery-planning inputs — both since resolved by the plan. Ticket ACs fully covered; no blocking gaps for DoR."
