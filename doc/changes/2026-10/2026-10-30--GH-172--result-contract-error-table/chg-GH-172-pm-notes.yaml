  - text: "Cross-check ticket vs system spec: no contradictions. cli-command-registry.md man-page v0 (planning truth) prescribes CommandResult fields (schemaVersion, runId, exitCode, timing, data or error), --json always-valid machine output, and exit codes as table projection (0/1/2) in the standalone CLI only — ticket refines this with self-describing hierarchical codes and structured fields (category user|platform|transient|permanent, retryable, consequence with unknown first-class, remediation hint)."
