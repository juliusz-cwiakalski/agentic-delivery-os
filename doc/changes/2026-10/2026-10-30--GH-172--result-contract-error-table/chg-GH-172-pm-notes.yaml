decisions:
  - text: "REOPEN resolution for test-plan GAP-1/OQ-T1 (specification reopened, iteration 2): the documented error table SHIPS IN-CHANGE at doc/spec/features/feature-result-contract.md (authored during delivery as part of the change, containing the documented table derived from the machine-readable source; phase 7 reconciles the full feature doc). Keeps ticket AC-4 ('error codes resolve to documented table entries') and spec AC-F8-1 fully testable in both directions at merge time; no AC weakened; no phase reordering. Alternative (defer doc to phase 7) rejected: sync check would be vacuous on the PR, failing the ticket AC. Change-scoped decision, PM-decided to unblock; no decision record needed."
