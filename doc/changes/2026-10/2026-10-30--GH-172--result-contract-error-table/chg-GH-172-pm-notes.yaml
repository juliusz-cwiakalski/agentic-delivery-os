  - text: "DoR gate iteration 2: READY (2026-10-30T03:20Z), all 10 facets PASS; verdict persisted in readiness-iter-2.md. Iteration-1 findings verified substantively resolved; no new inconsistencies introduced by remediation. Non-blocking observations carried to reviewer/coder: plan D10 invariant-count nit (19 today, rides a future revision); S3 corpus-exclusion glob is load-bearing (must match tests/fixtures/result/code-corpora/** exactly); doc-syncer must source fallback semantics from spec DEC-13, not the survey (pre-DEC-13 phrasing retained by design). Delivery (phase 6) unblocked; hard gate satisfied at iteration 2 of ~3 cap. Retro 4: the prefix-anchor edit fault recurred a THIRD time when inserting the delivery-completion note (oldString ended mid-note at 'readiness-iter-2.md.'), consuming the DoR-READY note's opening and gluing its remainder onto a date line; repaired by full-block reconstruction. Rule is now absolute: pm-notes appends anchor on the COMPLETE final entry or rewrite the whole notes list — mid-note anchors are forbidden no matter how convenient."
