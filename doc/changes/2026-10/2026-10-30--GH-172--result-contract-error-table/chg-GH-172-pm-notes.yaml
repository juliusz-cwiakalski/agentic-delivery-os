    date: 2026-10-30
  - text: "DoR gate iteration 1: NOT_READY (2026-10-30T03:05Z). 9/10 facets PASS; cross_artifact_consistency FAIL. Finding 1 [major]: sync-check recognizer contract self-contradicts — test-plan section 4.4 (namespace rule: foreign-namespace code-like literals ignored, S1/S3) vs TC-SYNC-005 steps 4-5 (undeclared-namespace codes flagged, named error); corpus at tests/fixtures/result/code-corpora/ sits inside S3 scan scope so exactly one semantics can hold; mechanical enforcement of ticket AC-4/NFR-6 — coder would have to invent an unstated two-mode recognizer; fix: define recognizer levels explicitly (scan-level namespace rule vs strict validation for table entries + directly-fed corpora; corpus as direct recognizer input or excluded from S3), reword TC-SYNC-005, mirror in plan tasks 5.2/5.4. Finding 2 [minor]: TC-REDACT-003 split-string case unpassable under D1 contiguous-value replacement — bind via fragment registration in injected.json OR extend D1 with marker-prefix matching; plan D1 rides. Finding 3 [minor]: TC-CLASSIFY-002 step 4 asserts dispatch-level routing but lands in Phase 2 before runCli (Phase 3) — one clarifying sentence: Phase 2 asserts classify-level route distinctness, dispatch-level proof is TC-CONTAIN-001. Nits: D10 says twenty scripts/checks files, actual 19; survey verdict 7 singular fallback (pre-DEC-13 history, optional annotation); AC-F8-1 letter includes tests/**/*.test.ts outside S1/S3 scope — one clarifying sentence in section 4.4. Verdict: reopen test_planning (iteration 2); spec NOT reopened; no human input needed; re-run gate after remediation (iteration 2 of ~3 cap)."
    type: "risk"
    date: 2026-10-30
  - text: "Retro: DoR iteration-1 findings were all downstream-consistency residue of the v1.1 amendment velocity — DEC-13's two-entry split and the in-change doc target rippled into sync-check recognition semantics that the test plan had specified against the pre-amendment mental model; the adversarial gate caught what sequential authoring missed. Cost: one gate iteration. Observation: amendment-heavy chains benefit from a dedicated propagation pass over cross-referenced sections (section 4.4 <-> TC steps <-> plan tasks) before the gate."
