  - text: "Doc impacts for phase 7 (doc-syncer): NEW feature spec doc/spec/features/feature-result-contract.md (first-spec-only authoring, always-resolve); error table must be documented such that 'error codes resolve to documented table entries' is testably true (machine-readable table as single source; test validates doc/code sync). Possible touch: feature-monorepo-scaffold-toolchain.md if package surfaces change. cli-command-registry.md stays planning-truth (no change)."
