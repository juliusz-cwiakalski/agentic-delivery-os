[test]
# Repository-root test discovery: `tests/**` and `packages/*/test/**` both live
# under the root. Fixtures are never named `*.test.ts`, so temp workspaces built
# from them are not picked up as suites. Ignored trees are excluded explicitly
# because Bun test discovery does not consult .gitignore.
root = "."
pathIgnorePatterns = ["tmp/**", "node_modules/**", "**/dist/**"]
