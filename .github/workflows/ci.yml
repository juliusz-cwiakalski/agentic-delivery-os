# CI workflow for Agentic Delivery OS
# Verifies that generated files are up-to-date and runs quality checks

name: CI

# Bun pin copy 3 (single CI copy; `.bun-version` is the source of truth).
env:
  BUN_VERSION: "1.4.4"

on:
  push:
    branches: [main, main-tools, feat/**, fix/**]
  pull_request:
    branches: [main, main-tools]

jobs:
  verify-claude-build:
    name: Verify Claude Code plugin is current
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x scripts/build-claude-plugin.sh

      - name: Build Claude Code plugin
        run: ./scripts/build-claude-plugin.sh --verbose

      - name: Check for changes
        run: |
          # Stage the generated dir so untracked/added/removed files are detected
          # (plain `git diff --exit-code` ignores untracked files).
          git add -A .ados-claude/
          if git diff --cached --exit-code .ados-claude/; then
            echo "✓ Generated plugin is current"
          else
            echo "::error::Generated plugin is stale. Run 'scripts/build-claude-plugin.sh' and commit the changes."
            exit 1
          fi

  doc-distribution-guard:
    name: Doc distribution drift guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GH-67: forces the ados_distribution marker + install-set invariants.
      # Fails (non-zero) on missing/invalid markers or install-set drift, blocking merge.
      - name: Run doc-distribution drift guard
        run: bash scripts/.tests/test-doc-distribution.sh

      # GH-67: committed negative-mode self-tests — re-proves each of the guard's
      # 5 failure modes actually fires (missing/invalid marker, redistributable-not-
      # installed, internal-installed, derived-set drift). Keeps a refactor that
      # silently disables a mode from going green.
      - name: Run doc-distribution negative-mode self-tests
        run: bash scripts/.tests/test-doc-distribution-modes.sh

  inception-doc-consistency:
    name: Inception doc-set consistency guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GH-69: catches cross-surface drift the distribution guard cannot —
      # four-risk terminology (Value/Usability/Feasibility/Viability; never
      # "desirability"), conditional-matrix header parity between the guide and
      # the handbook mirror, the 17-template index, self-containment, and the
      # guide's structural integrity (4 diagrams / 8 phases / >=32 sub-parts).
      - name: Run inception doc-set consistency guard
        run: bash scripts/.tests/test-inception-doc-consistency.sh

  result-tuple-guard:
    name: Result-tuple doc guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PDEV-516 F-3: fails when a current-truth documented result enumeration
      # is stale relative to the `result=<…>` help line in deliver-ticket.sh.
      - name: Run result-tuple guard
        run: |
          set -e
          bash scripts/.tests/test-deliver-ticket-result-tuples.sh

      # PDEV-516 F-3: committed negative-mode self-tests — injects each guard
      # failure mode into a synthetic temp tree and asserts it fires.
      - name: Run result-tuple negative-mode self-tests
        run: |
          set -e
          bash scripts/.tests/test-deliver-ticket-result-tuples-modes.sh

  mutation-sandbox:
    name: Delivery mutation sandbox
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # PDEV-516 F-4: proves TC-DT-SF-12 genuinely asserts the delivery result
      # tuple. The sandbox copies deliver-ticket.sh + its harness to a temp tree,
      # breaks the result emission in the COPY only, and requires the mutated
      # harness to exit non-zero with `[FAIL] … TC-DT-SF-12` (stderr captured via
      # 2>&1) while the unmutated copy exits 0 and no tracked file is mutated.
      #
      # OQ-4 / DEC-8: this test-*.sh is ALSO discovered by the `bash-tests` `find`,
      # so it runs twice by design (same accepted precedent as
      # test-doc-distribution-modes.sh). The duplicate is fast, offline and tiny.
      - name: Run delivery mutation sandbox
        run: |
          set -e
          bash scripts/.tests/test-delivery-mutation-sandbox.sh

  bash-tests:
    name: Bash test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GH-124: runs every CI-safe test-*.sh suite under tools/.tests/ and
      # scripts/.tests/. `find -print -exec` lists each suite then executes it;
      # `set -e` fails the job on the first failing suite. jq is required by
      # several suites.
      #
      # Exclusions — tests that require paid/external APIs and are documented as
      # NOT for CI/CD (see their own headers). They are invoked manually or via
      # an opt-in env locally:
      #   - test-text-to-image-e2e-providers.sh (explores real paid APIs; hangs)
      #   - test-text-to-image-e2e-suite.sh     (explicitly "NOT meant for CI/CD")
      #   - test-text-to-image-performance.sh   (fails without real API keys)
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Run all bash test suites
        run: |
          set -e
          echo "=== Running all test suites ==="
          find . -path '*/.tests/test-*.sh' \
            -not -path './tmp/*' \
            -not -name '*e2e-providers*' \
            -not -name '*e2e-suite*' \
            -not -name '*performance*' \
            -print -exec bash {} \;
          echo "=== All test suites passed ==="

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GH-124: gates on `error` severity (syntax errors, undefined commands, etc.).
      # The delivery scripts (batch-deliver, deliver-ticket, opencode-session,
      # install*, uninstall, build-claude-plugin, add-header-location,
      # clean-merged-branches) and their test suites are now warning-clean.
      # Remaining warning debt is confined to tools/text-to-image and tools/zclaude
      # — clear those, then tighten this to `severity: warning`. Until then `error`
      # keeps the gate green while still catching high-signal breakage.
      - name: Run shellcheck on scripts and tools
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: node_modules .git .ados-claude tmp

  # --- Binding TypeScript fast loop (additive; bash jobs above are untouched) ---
  ts-fresh-clone:
    name: TS fresh clone (install from pins)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Bun (pin copy 3)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up pnpm (reads packageManager)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Clone into an empty directory
        run: |
          rm -rf "$RUNNER_TEMP/fresh-clone"
          git clone --local "$GITHUB_WORKSPACE" "$RUNNER_TEMP/fresh-clone"
          git -C "$RUNNER_TEMP/fresh-clone" checkout --detach "$GITHUB_SHA"

      - name: Install from the committed pins only
        working-directory: ${{ runner.temp }}/fresh-clone
        run: |
          pnpm install --frozen-lockfile
          test -z "$(git status --porcelain)"
          echo "pnpm $(pnpm --version), bun $(bun --version)"

  ts-invariants:
    name: TS repository invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Bun (pin copy 3)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up pnpm (reads packageManager)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch base branch for the topology diff
        run: git fetch --no-tags origin main-tools

      - name: Run static invariant checks
        run: |
          bun run scripts/checks/pnpm-foundation.ts
          bun run scripts/checks/ignore-rules.ts
          bun run scripts/checks/manifest-privacy.ts
          bun run scripts/checks/script-surface.ts
          bun run scripts/checks/workspace-entrypoints.ts
          bun run scripts/checks/tsconfig-strictness.ts
          bun run scripts/checks/changesets-group.ts
          bun run scripts/checks/testkit-exclusion.ts
          bun run scripts/checks/ci-topology.ts
          bun run scripts/checks/ci-bindingness.ts
          bun run scripts/checks/ci-supply-chain.ts
          bun run scripts/checks/error-table-sync.ts
          bun run scripts/checks/exit-code-literals.ts
          bun run scripts/checks/secret-read-boundary.ts
          bun run scripts/checks/boundary-ci-parity.ts

  ts-typecheck:
    name: TS typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  ts-lint:
    name: TS lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  ts-format:
    name: TS format check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  ts-test:
    name: TS tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - name: Fetch base branch for the topology check
        run: git fetch --no-tags origin main-tools
      - run: pnpm test

  ts-boundaries:
    name: TS boundary enforcement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      # GH-172: build before cruising. Package-name specifiers resolve through
      # each manifest's `exports` to the built `dist` target, so an unbuilt tree
      # fails `workspace-import-must-resolve` on declared subpaths.
      - run: pnpm build
      - run: pnpm check:boundaries

  ts-build:
    name: TS build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  ts-exports:
    name: TS exports, publint, attw
    needs: ts-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: bun run scripts/checks/exports-discipline.ts
      - run: bun test tests/structure
      - name: publint (five publishables)
        run: |
          for package in core adapters cli mcp opencode; do
            (cd "packages/$package" && pnpm exec publint)
          done
      - name: attw (recorded esm-only allowance profile)
        run: |
          for package in core adapters cli mcp opencode; do
            (cd "packages/$package" && pnpm exec attw --pack . --profile esm-only)
          done

  ts-pins:
    name: TS pin equality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: bun run scripts/checks/pin-equality.ts

  ts-publish-guard:
    name: TS publish guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: bun test tests/checks/publish-guard.test.ts

  ts-license-audit:
    name: TS license audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: bun run scripts/checks/license-audit.ts

  ts-vuln:
    name: TS vulnerability gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - run: bun run scripts/checks/vulnerability-gate.ts

  ts-aggregate:
    name: TS aggregate check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - run: pnpm install --frozen-lockfile
      - name: Fetch base branch for the topology check
        run: git fetch --no-tags origin main-tools
      - name: Run the single aggregate check and record duration
        run: |
          start=$(date +%s)
          pnpm check
          echo "aggregate duration: $(( $(date +%s) - start ))s"

  ts-commitlint:
    name: TS commitlint (CI authority)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - run: pnpm install --frozen-lockfile

      - name: Assert one root commitlint config
        run: bun run scripts/checks/commitlint-authority.ts

      - name: commitlint against the PR base
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from "${{ github.event.pull_request.base.sha }}" --to HEAD

      - name: commitlint against the delivery-branch base
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main-tools
          pnpm exec commitlint --from "origin/main-tools" --to HEAD

      - name: commitlint against the merge-base range (push)
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main-tools
          pnpm exec commitlint --from "$(git merge-base origin/main-tools HEAD)" --to HEAD

  ts-forbidden-literals:
    name: TS forbidden-literal scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Bun (pin copy 3)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up pnpm (reads packageManager)
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch the recorded corpus baseline
        run: git fetch --no-tags origin 32784affbb8a1b82a57b6c4578a331b8bd99b4c4

      - name: Run the forbidden-literal scan
        run: bun run scripts/checks/forbidden-literals.ts
