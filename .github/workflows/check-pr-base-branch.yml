name: Check PR base branch

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  check:
    name: Check PR base branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify the PR targets the repository default branch
        run: |
          echo "PR #${{ github.event.pull_request.number }} targets base '${{ github.base_ref }}' (repo default: '${{ github.event.repository.default_branch }}')"
          if [ "${{ github.base_ref }}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "::error::PR targets '${{ github.base_ref }}' but the default branch is '${{ github.event.repository.default_branch }}'"
            exit 1
          fi
